body:
  lesson_uid: L0124
  version_id: v2
  source: DOCX 第一節（讀全文-做記號）
  paragraphs:
  - 前言：植物是植物，肉是肉，但你聽說過植物肉嗎？在這篇課文裡，你將獲得意想不到的新知，事關人類未來食物市場的變革，我們一起來了解這項新興的食品科技吧！
  - 近年來，一種由植物製成卻能模仿肉類口感和風味的食品悄然興起，引發了一場飲食革命。植物肉的歷史可以追溯到20世紀初，當時中國就有用豆腐製成的素肉，而現今普遍使用的植物肉，則是1967年美國康乃爾大學研發出來的纖維蛋白素肉，這是現代植物肉技術的一個重要里程碑。隨後的幾十年裡，植物肉技術不斷進步。2009年，超越肉類公司（Beyond Meat）開始研發新一代的植物肉；2016年，另一家公司「不可能食品」（Impossible
    Foods）推出了一種「流血素肉漢堡」，口感和牛肉漢堡不分軒輊，轟動市場。
  - 那麼，植物肉是如何製作的呢？現代植物肉主要由植物蛋白（如大豆、豌豆、小麥蛋白）、植物油（如椰子油、葵花油）、調味料、結構劑和天然色素等成分組成；其中，植物蛋白是主要成分，用來提供豐富的胺基酸，植物油則幫助模擬肉類的口感和肉汁。這些原料經過混合、擠壓成型、加熱處理等步驟，最終能製造出質地、口感、顏色及風味與真肉極為相似的植物肉。
  - 你可能會問：植物肉的營養價值如何呢？事實上，植物肉的蛋白質含量與動物肉相媲美，每100克通常含有約20克的蛋白質。而且，植物肉的脂肪含量通常較低，不含膽固醇，還富含膳食纖維。只是植物肉中的某些營養素如維生素B12，需額外添加才能達到與動物肉相當的含量。
  - 植物肉的興起不僅提供人類新的飲食選項，也有助於環境永續發展和動物保護倡議。研究顯示，相較於傳統畜牧業生產的肉品，生產同等重量的植物肉可以大幅減少土地使用、水資源消耗和溫室氣體排放。此外，越來越多人關注動物保護議題，生產植物肉不必屠宰動物，正符合這個趨勢。
  - 隨著環保意識提升和飲食習慣的改變，植物肉市場正蓬勃發展；近年來，這個新興市場的增長速度令人矚目。根據最新的統計，2021年全球植物肉市場規模已達到51億美元；預計到2028年，這數字將成長近三倍，至149億美元，這反映出消費者對植物性蛋白的需求急劇上升。這股潮流也讓零售業和餐飲業出現令人刮目相看的改變，越來越多的連鎖超市設置專門的植物性食品區，眾多知名快餐店和餐廳也紛紛將植物肉的料理納入菜單選項，顯示其市場潛力巨大。
  - 推動植物肉的飲食發展是一場靜默但深刻的飲食革命，它重塑了人類與食物的關係。預計會有越來越多人開始嘗試「彈性素食主義」，在日常飲食中增加植物性蛋白的比例，這將導致傳統肉類消費量的下降。在這個趨勢下，新型態的餐廳和創新食品公司將應󠇡運而生，提供更多樣化的植物肉產品選擇。
  - 總之，植物肉代表了一種創新的飲食選擇，它不僅為我們提供另一種蛋白質來源，對環境保護、動物福利，甚至全球糧食安全等也有正向的影響。隨著技術的不斷進步，未來的植物肉會在口感和營養上更接近傳統肉類，為我們的餐桌帶來更多驚喜。你願意嘗試植物肉嗎？也許下次點餐時，可以考慮來一份植物肉漢堡哦！
