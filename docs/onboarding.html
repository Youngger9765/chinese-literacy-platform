<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoLeap 新手闖關 | Onboarding Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --xp-gold-start: #f59e0b;
            --xp-gold-end: #eab308;
            --level-indigo: #6366f1;
            --level-purple: #8b5cf6;
            --correct-green: #22c55e;
            --wrong-red: #ef4444;
            --locked-gray: #3d444d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 4rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--level-indigo), var(--level-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        /* XP Bar */
        .xp-container {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .xp-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .xp-value {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--xp-gold-start), var(--xp-gold-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .xp-bar-bg {
            height: 24px;
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--xp-gold-start), var(--xp-gold-end));
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .xp-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Level Map */
        .level-map {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding: 0 1rem;
            position: relative;
        }

        .level-map::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 3px;
            background: var(--border-color);
            z-index: 0;
        }

        .level-node {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            border: 3px solid var(--border-color);
            background: var(--bg-secondary);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .level-node.completed {
            background: linear-gradient(135deg, var(--level-indigo), var(--level-purple));
            border-color: var(--level-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .level-node.current {
            border-color: var(--xp-gold-start);
            background: var(--bg-secondary);
            animation: pulse-glow 2s infinite;
        }

        .level-node.locked {
            background: var(--locked-gray);
            border-color: var(--locked-gray);
            opacity: 0.5;
        }

        .level-node-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
                transform: scale(1.05);
            }
        }

        /* Level Card */
        .level-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .level-card.locked {
            opacity: 0.6;
            pointer-events: none;
        }

        .level-card.current {
            border-color: var(--xp-gold-start);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
        }

        .level-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .level-icon {
            font-size: 2.5rem;
        }

        .level-title-group {
            flex: 1;
        }

        .level-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .level-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .level-xp-badge {
            background: linear-gradient(135deg, var(--xp-gold-start), var(--xp-gold-end));
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.875rem;
        }

        /* Challenge */
        .challenge {
            margin-bottom: 1.5rem;
            padding: 1.25rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .challenge.completed {
            border-color: var(--correct-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .challenge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .challenge-question {
            font-size: 1.05rem;
            font-weight: 500;
            flex: 1;
        }

        .challenge-xp {
            color: var(--xp-gold-start);
            font-weight: 700;
            font-size: 0.875rem;
            white-space: nowrap;
            margin-left: 1rem;
        }

        .challenge-hint {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 0.75rem;
        }

        /* Multiple Choice */
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .option {
            padding: 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .option:hover {
            border-color: var(--level-indigo);
            transform: translateX(4px);
        }

        .option.selected {
            border-color: var(--level-indigo);
            background: rgba(99, 102, 241, 0.1);
        }

        .option-label {
            font-weight: 700;
            color: var(--text-secondary);
            width: 24px;
        }

        .option-text {
            flex: 1;
        }

        /* Input */
        .input-group {
            margin-bottom: 1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.875rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--level-indigo);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Ordering */
        .ordering-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .ordering-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ordering-item:hover {
            border-color: var(--level-indigo);
            transform: translateX(4px);
        }

        .ordering-item.selected {
            border-color: var(--xp-gold-start);
            background: rgba(245, 158, 11, 0.1);
        }

        .ordering-number {
            font-weight: 700;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            border-radius: 50%;
            font-size: 0.875rem;
        }

        .ordering-text {
            flex: 1;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9375rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--level-indigo), var(--level-purple));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--level-indigo);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Feedback */
        .feedback {
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid var(--correct-green);
            color: var(--correct-green);
        }

        .feedback.wrong {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid var(--wrong-red);
            color: var(--wrong-red);
            animation: shake 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* XP Gain Animation */
        .xp-gain {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 700;
            color: var(--xp-gold-start);
            pointer-events: none;
            animation: xpFloat 1.5s ease-out forwards;
            z-index: 9999;
        }

        @keyframes xpFloat {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                transform: translate(-50%, -100px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150px) scale(1);
            }
        }

        /* Level Complete */
        .level-complete-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            animation: fadeIn 0.3s ease;
        }

        .level-complete-overlay.show {
            display: flex;
        }

        .level-complete-card {
            background: var(--bg-secondary);
            border: 3px solid var(--level-purple);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.7);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .level-complete-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .level-complete-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--xp-gold-start), var(--xp-gold-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .level-complete-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.125rem;
        }

        /* Achievements */
        .achievements-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            max-width: 300px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .achievements-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem;
            margin-bottom: 0.5rem;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .achievement-item.unlocked {
            border-color: var(--xp-gold-start);
            background: rgba(245, 158, 11, 0.05);
        }

        .achievement-item.locked {
            opacity: 0.4;
        }

        .achievement-badge {
            font-size: 1.5rem;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-name {
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 0.125rem;
        }

        .achievement-desc {
            font-size: 0.6875rem;
            color: var(--text-secondary);
        }

        /* Certificate */
        .certificate {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border: 3px solid var(--xp-gold-start);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            margin: 3rem 0;
            box-shadow: 0 20px 60px rgba(245, 158, 11, 0.3);
        }

        .certificate-icon {
            font-size: 6rem;
            margin-bottom: 1rem;
        }

        .certificate-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--xp-gold-start), var(--xp-gold-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .certificate-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .certificate-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
        }

        .certificate-stat {
            text-align: center;
        }

        .certificate-stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--xp-gold-start);
        }

        .certificate-stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }

        .reset-link {
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: underline;
        }

        .reset-link:hover {
            color: var(--text-primary);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--xp-gold-start);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            z-index: 10000;
            display: none;
            animation: slideInRight 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .toast-icon {
            font-size: 2rem;
        }

        .toast-text {
            flex: 1;
        }

        .toast-title {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .toast-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.875rem;
            }

            .level-map {
                overflow-x: auto;
                padding-bottom: 2rem;
                justify-content: flex-start;
                gap: 2rem;
            }

            .level-node {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }

            .level-card {
                padding: 1.5rem;
            }

            .achievements-panel {
                position: static;
                margin-bottom: 2rem;
                max-width: 100%;
            }

            .certificate-stats {
                flex-direction: column;
                gap: 1.5rem;
            }
        }

        /* Link styling */
        a {
            color: var(--level-indigo);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Copy Button */
        .code-wrapper {
            position: relative;
            display: block;
            margin: 0.5rem 0;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--border-color);
            border: none;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .copy-btn:hover {
            background: var(--level-indigo);
            color: white;
        }

        .copy-btn.copied {
            background: var(--correct-green);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 LingoLeap 新手闖關</h1>
            <p class="subtitle">Onboarding Quest - 完成 7 個關卡成為正式成員！</p>
        </header>

        <!-- XP Bar -->
        <div class="xp-container">
            <div class="xp-header">
                <span class="xp-label">總經驗值 Total XP</span>
                <span class="xp-value" id="xpValue">0 / 770 XP</span>
            </div>
            <div class="xp-bar-bg">
                <div class="xp-bar-fill" id="xpBar"></div>
            </div>
        </div>

        <!-- Achievements Panel -->
        <div class="achievements-panel">
            <div class="achievements-title">🏆 成就 Achievements</div>
            <div id="achievementsList"></div>
        </div>

        <!-- Level Map -->
        <div class="level-map" id="levelMap"></div>

        <!-- Levels Container -->
        <div id="levelsContainer"></div>

        <!-- Certificate (hidden initially) -->
        <div class="certificate" id="certificate" style="display: none;">
            <div class="certificate-icon">🎓</div>
            <div class="certificate-title">恭喜畢業！</div>
            <div class="certificate-subtitle">Congratulations! You've completed all challenges!</div>
            <p style="color: var(--text-secondary); margin-top: 1rem;">
                你已經掌握了 LingoLeap 開發的核心知識<br>
                準備好開始你的第一個任務了！🚀
            </p>
            <div class="certificate-stats">
                <div class="certificate-stat">
                    <div class="certificate-stat-value" id="certTotalXP">0</div>
                    <div class="certificate-stat-label">總 XP</div>
                </div>
                <div class="certificate-stat">
                    <div class="certificate-stat-value">7</div>
                    <div class="certificate-stat-label">關卡完成</div>
                </div>
                <div class="certificate-stat">
                    <div class="certificate-stat-value" id="certAccuracy">0%</div>
                    <div class="certificate-stat-label">正確率</div>
                </div>
            </div>
        </div>

        <footer>
            <span class="reset-link" onclick="resetGame()">重置進度 Reset Progress</span>
        </footer>
    </div>

    <!-- Level Complete Overlay -->
    <div class="level-complete-overlay" id="levelCompleteOverlay">
        <div class="level-complete-card">
            <div class="level-complete-icon" id="levelCompleteIcon"></div>
            <div class="level-complete-title" id="levelCompleteTitle"></div>
            <div class="level-complete-subtitle" id="levelCompleteSubtitle"></div>
            <button class="btn btn-primary" onclick="closeLevelComplete()">繼續 Continue</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-content">
            <div class="toast-icon" id="toastIcon"></div>
            <div class="toast-text">
                <div class="toast-title" id="toastTitle"></div>
                <div class="toast-desc" id="toastDesc"></div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lingoleap-quest-progress';
        const TOTAL_XP = 770;

        let gameState = {
            currentLevel: 1,
            levels: {},
            totalXP: 0,
            achievements: [],
            wrongAnswers: 0
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                gameState = JSON.parse(saved);
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
        }

        function initGame() {
            loadState();
            renderLevelMap();
            renderLevels();
            renderAchievements();
            updateXPBar();
            checkCertificate();
        }

        function renderLevelMap() {
            const map = document.getElementById('levelMap');
            map.innerHTML = levels.map((level, idx) => {
                const levelNum = parseInt(level.id);
                let className = 'level-node';
                if (gameState.levels[level.id]?.completed) {
                    className += ' completed';
                } else if (levelNum === gameState.currentLevel) {
                    className += ' current';
                } else if (levelNum > gameState.currentLevel) {
                    className += ' locked';
                }
                return `
                    <div class="${className}">
                        ${level.icon}
                        <div class="level-node-label">Level ${level.id}</div>
                    </div>
                `;
            }).join('');
        }

        function renderLevels() {
            const container = document.getElementById('levelsContainer');
            container.innerHTML = levels.map(level => {
                const levelNum = parseInt(level.id);
                const isLocked = levelNum > gameState.currentLevel;
                const isCurrent = levelNum === gameState.currentLevel;
                const isCompleted = gameState.levels[level.id]?.completed;

                return `
                    <div class="level-card ${isLocked ? 'locked' : ''} ${isCurrent ? 'current' : ''}" id="level-${level.id}">
                        <div class="level-header">
                            <div class="level-icon">${level.icon}</div>
                            <div class="level-title-group">
                                <div class="level-title">Level ${level.id}: ${level.title}</div>
                                <div class="level-subtitle">${level.subtitle}</div>
                            </div>
                            <div class="level-xp-badge">+${level.xp} XP</div>
                        </div>
                        ${isLocked ? '<p style="color: var(--text-secondary); text-align: center;">🔒 完成前一關卡解鎖 Complete previous level to unlock</p>' : ''}
                        ${!isLocked ? level.challenges.map(ch => renderChallenge(level.id, ch)).join('') : ''}
                    </div>
                `;
            }).join('');
        }

        function renderChallenge(levelId, challenge) {
            const challengeId = `${levelId}-${challenge.id}`;
            const isCompleted = gameState.levels[levelId]?.challenges?.[challenge.id];

            let content = '';
            if (challenge.type === 'multiple') {
                content = `
                    <div class="options">
                        ${challenge.options.map((opt, idx) => `
                            <div class="option" onclick="selectOption('${challengeId}', ${idx})">
                                <span class="option-label">${String.fromCharCode(65 + idx)}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="checkMultiple('${challengeId}', ${challenge.correct})">提交答案 Submit</button>
                `;
            } else if (challenge.type === 'command' || challenge.type === 'fill') {
                const hintHTML = challenge.hint ? `<div class="challenge-hint">💡 ${challenge.hint}</div>` : '';
                content = `
                    ${hintHTML}
                    <div class="input-group">
                        <input type="text" id="input-${challengeId}" placeholder="輸入答案..." />
                    </div>
                    <button class="btn btn-primary" onclick="checkText('${challengeId}', ${JSON.stringify(challenge.acceptable).replace(/"/g, '&quot;')})">提交答案 Submit</button>
                `;
            } else if (challenge.type === 'ordering') {
                content = `
                    <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:0.75rem;">👆 點選兩個項目可以交換位置，排成正確順序後按「確認」</p>
                    <div class="ordering-list" id="ordering-${challengeId}">
                        ${challenge.items.map((item, idx) => `
                            <div class="ordering-item" onclick="selectOrderingItem('${challengeId}', ${idx})">
                                <div class="ordering-number">${idx + 1}</div>
                                <div class="ordering-text">${item}</div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="checkOrdering('${challengeId}', ${JSON.stringify(challenge.correct).replace(/"/g, '&quot;')})">確認順序 Check Order</button>
                `;
            } else if (challenge.type === 'verification') {
                content = `
                    <p style="margin-bottom: 1rem;"><a href="${challenge.link}" target="_blank" rel="noopener noreferrer" style="color: var(--level-indigo); text-decoration: underline;">${challenge.link}</a></p>
                    <button class="btn btn-primary" onclick="checkVerification('${challengeId}')">${challenge.buttonText}</button>
                `;
            }

            return `
                <div class="challenge ${isCompleted ? 'completed' : ''}" id="challenge-${challengeId}">
                    <div class="challenge-header">
                        <div class="challenge-question">${challenge.question}</div>
                        <div class="challenge-xp">+${challenge.xp} XP</div>
                    </div>
                    ${content}
                    <div class="feedback" id="feedback-${challengeId}"></div>
                </div>
            `;
        }

        let selectedOption = null;
        function selectOption(challengeId, idx) {
            const options = document.querySelectorAll(`#challenge-${challengeId} .option`);
            options.forEach((opt, i) => {
                if (i === idx) {
                    opt.classList.add('selected');
                    selectedOption = idx;
                } else {
                    opt.classList.remove('selected');
                }
            });
        }

        function checkMultiple(challengeId, correct) {
            if (selectedOption === null) return;

            const isCorrect = selectedOption === correct;
            showFeedback(challengeId, isCorrect, isCorrect ? '正確！Correct!' : '錯誤！Wrong answer. Try again.');

            if (isCorrect) {
                const [levelId, chId] = challengeId.split('-');
                const level = levels.find(l => l.id === levelId);
                const challenge = level.challenges.find(c => c.id === chId);
                completeChallenge(levelId, chId, challenge.xp);
            } else {
                gameState.wrongAnswers++;
                const [levelId] = challengeId.split('-');
                if (!gameState.levels[levelId]) {
                    gameState.levels[levelId] = { completed: false, xp: 0, challenges: {}, wrongCount: 0 };
                }
                gameState.levels[levelId].wrongCount = (gameState.levels[levelId].wrongCount || 0) + 1;
                saveState();
            }

            selectedOption = null;
        }

        function checkText(challengeId, acceptable) {
            const input = document.getElementById(`input-${challengeId}`);
            const value = input.value.trim().toLowerCase();

            const isCorrect = acceptable.some(acc => {
                acc = acc.toLowerCase();
                if (acc.endsWith('-')) {
                    return value.startsWith(acc);
                }
                return value === acc || value.includes(acc);
            });

            showFeedback(challengeId, isCorrect, isCorrect ? '正確！Correct!' : '錯誤！Wrong answer. Try again.');

            if (isCorrect) {
                const [levelId, chId] = challengeId.split('-');
                const level = levels.find(l => l.id === levelId);
                const challenge = level.challenges.find(c => c.id === chId);
                completeChallenge(levelId, chId, challenge.xp);
                input.disabled = true;
            } else {
                gameState.wrongAnswers++;
                const [levelId] = challengeId.split('-');
                if (!gameState.levels[levelId]) {
                    gameState.levels[levelId] = { completed: false, xp: 0, challenges: {}, wrongCount: 0 };
                }
                gameState.levels[levelId].wrongCount = (gameState.levels[levelId].wrongCount || 0) + 1;
                saveState();
            }
        }

        let selectedOrderingItems = [];
        function selectOrderingItem(challengeId, idx) {
            const items = document.querySelectorAll(`#ordering-${challengeId} .ordering-item`);

            if (selectedOrderingItems.includes(idx)) {
                selectedOrderingItems = selectedOrderingItems.filter(i => i !== idx);
                items[idx].classList.remove('selected');
            } else {
                if (selectedOrderingItems.length < 2) {
                    selectedOrderingItems.push(idx);
                    items[idx].classList.add('selected');
                }

                if (selectedOrderingItems.length === 2) {
                    const [first, second] = selectedOrderingItems;
                    const container = document.getElementById(`ordering-${challengeId}`);
                    const itemsArray = Array.from(container.children);

                    const temp = itemsArray[first].querySelector('.ordering-text').textContent;
                    itemsArray[first].querySelector('.ordering-text').textContent = itemsArray[second].querySelector('.ordering-text').textContent;
                    itemsArray[second].querySelector('.ordering-text').textContent = temp;

                    items.forEach(item => item.classList.remove('selected'));
                    selectedOrderingItems = [];
                }
            }
        }

        function checkOrdering(challengeId, correct) {
            const container = document.getElementById(`ordering-${challengeId}`);
            const items = Array.from(container.querySelectorAll('.ordering-text')).map(el => el.textContent);

            const isCorrect = JSON.stringify(items) === JSON.stringify(correct);

            showFeedback(challengeId, isCorrect, isCorrect ? '正確！Correct!' : '錯誤！Wrong order. Click items to swap.');

            if (isCorrect) {
                const [levelId, chId] = challengeId.split('-');
                const level = levels.find(l => l.id === levelId);
                const challenge = level.challenges.find(c => c.id === chId);
                completeChallenge(levelId, chId, challenge.xp);
            } else {
                gameState.wrongAnswers++;
                const [levelId] = challengeId.split('-');
                if (!gameState.levels[levelId]) {
                    gameState.levels[levelId] = { completed: false, xp: 0, challenges: {}, wrongCount: 0 };
                }
                gameState.levels[levelId].wrongCount = (gameState.levels[levelId].wrongCount || 0) + 1;
                saveState();
            }
        }

        function checkVerification(challengeId) {
            const [levelId, chId] = challengeId.split('-');
            const level = levels.find(l => l.id === levelId);
            const challenge = level.challenges.find(c => c.id === chId);
            completeChallenge(levelId, chId, challenge.xp);
        }

        function showFeedback(challengeId, isCorrect, message) {
            const feedback = document.getElementById(`feedback-${challengeId}`);
            feedback.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
            feedback.textContent = message;

            setTimeout(() => {
                feedback.classList.remove('show');
            }, 3000);
        }

        function completeChallenge(levelId, challengeId, xp) {
            if (!gameState.levels[levelId]) {
                gameState.levels[levelId] = { completed: false, xp: 0, challenges: {}, wrongCount: 0 };
            }

            if (!gameState.levels[levelId].challenges[challengeId]) {
                gameState.levels[levelId].challenges[challengeId] = true;
                gameState.levels[levelId].xp += xp;
                gameState.totalXP += xp;

                showXPGain(xp);
                updateXPBar();

                const level = levels.find(l => l.id === levelId);
                const allChallengesComplete = level.challenges.every(ch =>
                    gameState.levels[levelId].challenges[ch.id]
                );

                if (allChallengesComplete) {
                    gameState.levels[levelId].completed = true;
                    gameState.currentLevel = parseInt(levelId) + 1;
                    showLevelComplete(level);
                }

                checkAchievements();
                saveState();

                const currentEl = document.getElementById(`challenge-${levelId}-${challengeId}`);
                currentEl.classList.add('completed');

                // Scroll to next challenge
                if (!allChallengesComplete) {
                    const nextChId = String(parseInt(challengeId) + 1);
                    const nextEl = document.getElementById(`challenge-${levelId}-${nextChId}`);
                    if (nextEl) {
                        setTimeout(() => {
                            nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 300);
                    }
                }
            }
        }

        function showXPGain(xp) {
            const gain = document.createElement('div');
            gain.className = 'xp-gain';
            gain.textContent = `+${xp} XP`;
            document.body.appendChild(gain);

            setTimeout(() => {
                gain.remove();
            }, 1500);
        }

        function updateXPBar() {
            const percentage = (gameState.totalXP / TOTAL_XP) * 100;
            document.getElementById('xpBar').style.width = percentage + '%';
            document.getElementById('xpValue').textContent = `${gameState.totalXP} / ${TOTAL_XP} XP`;
        }

        function showLevelComplete(level) {
            const overlay = document.getElementById('levelCompleteOverlay');
            document.getElementById('levelCompleteIcon').textContent = level.icon;
            document.getElementById('levelCompleteTitle').textContent = `Level ${level.id} 完成！`;
            document.getElementById('levelCompleteSubtitle').textContent = `${level.title} Complete! +${level.xp} XP`;
            overlay.classList.add('show');
        }

        function closeLevelComplete() {
            document.getElementById('levelCompleteOverlay').classList.remove('show');
            renderLevelMap();
            renderLevels();

            // Scroll to next level
            const nextLevelEl = document.getElementById(`level-${gameState.currentLevel}`);
            if (nextLevelEl) {
                setTimeout(() => {
                    nextLevelEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
            checkCertificate();
        }

        function checkAchievements() {
            achievements.forEach(ach => {
                if (!gameState.achievements.includes(ach.id) && ach.check(gameState)) {
                    gameState.achievements.push(ach.id);
                    showToast(ach.icon, '成就解鎖！', ach.name);
                }
            });
            renderAchievements();
        }

        function renderAchievements() {
            const list = document.getElementById('achievementsList');
            list.innerHTML = achievements.map(ach => {
                const unlocked = gameState.achievements.includes(ach.id);
                return `
                    <div class="achievement-item ${unlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-badge">${ach.icon}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${ach.name}</div>
                            <div class="achievement-desc">${ach.desc}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showToast(icon, title, desc) {
            const toast = document.getElementById('toast');
            document.getElementById('toastIcon').textContent = icon;
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastDesc').textContent = desc;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function checkCertificate() {
            if (gameState.currentLevel > 7) {
                const cert = document.getElementById('certificate');
                cert.style.display = 'block';
                document.getElementById('certTotalXP').textContent = gameState.totalXP;

                const accuracy = Math.round(((gameState.totalXP / TOTAL_XP) / (1 + (gameState.wrongAnswers * 0.01))) * 100);
                document.getElementById('certAccuracy').textContent = Math.max(0, Math.min(100, accuracy)) + '%';
            }
        }

        function resetGame() {
            if (confirm('確定要重置所有進度嗎？所有成就和經驗值都會消失！\n\nAre you sure you want to reset all progress? All achievements and XP will be lost!')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function addCopyButtons() {
            document.querySelectorAll('code[style*="display:block"]').forEach(code => {
                if (code.parentElement.classList.contains('code-wrapper')) return;
                const wrapper = document.createElement('span');
                wrapper.className = 'code-wrapper';
                code.parentNode.insertBefore(wrapper, code);
                wrapper.appendChild(code);

                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(code.textContent).then(() => {
                        btn.textContent = 'Copied!';
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.textContent = 'Copy';
                            btn.classList.remove('copied');
                        }, 1500);
                    });
                };
                wrapper.appendChild(btn);
            });
        }

        const origRenderLevels = renderLevels;
        renderLevels = function() {
            origRenderLevels();
            addCopyButtons();
        };

        initGame();
        addCopyButtons();
    </script>
</body>
</html>
