<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoLeap 教材</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
  .header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .header a { color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
  .header h1 { font-size: 1.1rem; font-weight: 600; }
  .layout { display: flex; min-height: calc(100vh - 49px); }
  .sidebar { width: 260px; background: #fff; border-right: 1px solid #e2e8f0; padding: 16px 0; overflow-y: auto; flex-shrink: 0; }
  .tier-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 16px 4px; }
  .tier-1 .tier-label { color: #22c55e; }
  .tier-2 .tier-label { color: #3b82f6; }
  .tier-3 .tier-label { color: #a855f7; }
  .tier-4 .tier-label { color: #f59e0b; }
  .nav-item { display: block; padding: 8px 16px 8px 20px; font-size: 0.85rem; color: #475569; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: #eff6ff; border-left-color: #3b82f6; color: #1e40af; font-weight: 600; }
  .content { flex: 1; max-width: 800px; margin: 0 auto; padding: 32px 40px 80px; }
  .content h1 { font-size: 1.8rem; font-weight: 700; margin: 0 0 8px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
  .content h2 { font-size: 1.35rem; font-weight: 700; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; }
  .content h3 { font-size: 1.1rem; font-weight: 600; margin: 24px 0 8px; }
  .content h4 { font-size: 1rem; font-weight: 600; margin: 20px 0 6px; }
  .content p { line-height: 1.75; margin: 0 0 12px; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 24px; }
  .content li { line-height: 1.7; margin-bottom: 4px; }
  .content a { color: #3b82f6; }
  .content code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.88em; font-family: 'SF Mono', Menlo, monospace; }
  .content pre { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 16px 20px; margin: 0 0 16px; overflow-x: auto; position: relative; }
  .content pre code { background: none; padding: 0; color: inherit; font-size: 0.85rem; line-height: 1.6; }
  .content pre .lang { position: absolute; top: 6px; right: 10px; font-size: 0.7rem; color: #64748b; }
  .content blockquote { border-left: 3px solid #cbd5e1; background: #f8fafc; padding: 10px 16px; margin: 0 0 12px; color: #475569; border-radius: 0 6px 6px 0; }
  .content hr { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0; }
  .tip { border-left: 4px solid #22c55e; background: #f0fdf4; padding: 12px 16px; margin: 0 0 12px; border-radius: 0 8px 8px 0; }
  .warn { border-left: 4px solid #f59e0b; background: #fffbeb; padding: 12px 16px; margin: 0 0 12px; border-radius: 0 8px 8px 0; }
  .content table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 0.9rem; }
  .content th, .content td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; }
  .content th { background: #f8fafc; font-weight: 600; }
  .nav-bottom { padding: 16px; display: flex; justify-content: space-between; gap: 8px; }
  .nav-btn { padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.85rem; color: #475569; }
  .nav-btn:hover { background: #f1f5f9; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .loading { text-align: center; padding: 80px 20px; color: #94a3b8; }
  .loading code { display: block; margin-top: 12px; background: #1e293b; color: #e2e8f0; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; }
  .hamburger { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #475569; }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -280px; top: 49px; bottom: 0; z-index: 20; transition: left 0.2s; box-shadow: 2px 0 8px rgba(0,0,0,0.1); }
    .sidebar.open { left: 0; }
    .hamburger { display: block; }
    .content { padding: 24px 16px 60px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 15; }
    .overlay.show { display: block; }
  }
  /* syntax highlight */
  .kw { color: #93c5fd; }
  .str { color: #86efac; }
  .cmt { color: #64748b; font-style: italic; }
  .num { color: #fbbf24; }
</style>
</head>
<body>
<div class="header">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <a href="../skill-tree.html">← 技能樹</a>
  <h1>LingoLeap 實習生教材</h1>
</div>
<div class="overlay" onclick="toggleSidebar()"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content">
    <div class="loading">
      選擇左側課程，或用網址 <code>viewer.html#tier2-tailwind</code>
      <br><br>
      <span style="font-size:0.85rem;">如果載入失敗，在此目錄執行：</span>
      <code>python3 -m http.server 8080</code>
      <span style="font-size:0.85rem;">然後開 http://localhost:8080/docs/intern-training/courses/viewer.html</span>
    </div>
  </main>
</div>
<script>
const COURSES = [
  { id:'tier1-git-basics', title:'Git 基礎', tier:1, file:'tier1-git-basics.md' },
  { id:'tier1-html-css', title:'HTML/CSS 基礎', tier:1, file:'tier1-html-css.md' },
  { id:'tier1-javascript', title:'JavaScript 基礎', tier:1, file:'tier1-javascript.md' },
  { id:'tier1-dev-environment', title:'開發環境', tier:1, file:'tier1-dev-environment.md' },
  { id:'tier1-reading-code', title:'讀懂現有程式碼', tier:1, file:'tier1-reading-code.md' },
  { id:'tier2-react-components', title:'React 元件開發', tier:2, file:'tier2-react-components.md' },
  { id:'tier2-typescript', title:'TypeScript', tier:2, file:'tier2-typescript.md' },
  { id:'tier2-tailwind', title:'Tailwind CSS', tier:2, file:'tier2-tailwind.md' },
  { id:'tier2-git-workflow', title:'Git 工作流', tier:2, file:'tier2-git-workflow.md' },
  { id:'tier2-bug-fixing', title:'Bug 修復', tier:2, file:'tier2-bug-fixing.md' },
  { id:'tier3-react-advanced', title:'React 進階', tier:3, file:'tier3-react-advanced.md' },
  { id:'tier3-api-integration', title:'API 串接', tier:3, file:'tier3-api-integration.md' },
  { id:'tier3-component-patterns', title:'元件設計模式', tier:3, file:'tier3-component-patterns.md' },
  { id:'tier3-testing', title:'測試', tier:3, file:'tier3-testing.md' },
  { id:'tier3-code-review', title:'Code Review', tier:3, file:'tier3-code-review.md' },
  { id:'tier4-feature-development', title:'獨立開發功能', tier:4, file:'tier4-feature-development.md' },
  { id:'tier4-performance', title:'效能優化', tier:4, file:'tier4-performance.md' },
  { id:'tier4-architecture', title:'架構理解', tier:4, file:'tier4-architecture.md' },
  { id:'tier4-documentation', title:'技術文件', tier:4, file:'tier4-documentation.md' },
  { id:'tier4-mentoring', title:'指導他人', tier:4, file:'tier4-mentoring.md' },
];
const TIER_NAMES = { 1:'Tier 1 — 基礎入門', 2:'Tier 2 — 實戰技能', 3:'Tier 3 — 進階能力', 4:'Tier 4 — 獨立開發者' };

// Build sidebar
const sidebar = document.getElementById('sidebar');
let curTier = 0;
COURSES.forEach((c, i) => {
  if (c.tier !== curTier) {
    curTier = c.tier;
    const label = document.createElement('div');
    label.className = `tier-label tier-${c.tier}`;
    label.textContent = TIER_NAMES[c.tier];
    sidebar.appendChild(label);
  }
  const a = document.createElement('a');
  a.className = 'nav-item';
  a.textContent = c.title;
  a.href = '#' + c.id;
  a.dataset.index = i;
  a.onclick = (e) => { e.preventDefault(); loadCourse(i); closeSidebar(); };
  sidebar.appendChild(a);
});

let currentIndex = -1;

function loadCourse(index) {
  const c = COURSES[index];
  currentIndex = index;
  window.location.hash = c.id;
  document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));

  fetch(c.file)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => renderMarkdown(md, index))
    .catch(() => {
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <p>無法載入 <code>${c.file}</code></p>
          <p style="margin-top:12px;font-size:0.9rem;">file:// 協議無法 fetch 本地檔案。請用 local server：</p>
          <code>cd ${window.location.pathname.replace(/\/[^/]+$/, '')} && python3 -m http.server 8080</code>
          <p style="margin-top:8px;font-size:0.85rem;">然後開 <a href="http://localhost:8080/viewer.html#${c.id}">http://localhost:8080/viewer.html#${c.id}</a></p>
        </div>`;
    });
}

function renderMarkdown(md, index) {
  const el = document.getElementById('content');
  let html = '';
  const lines = md.split('\n');
  let inCode = false, codeLang = '', codeLines = [];
  let inList = false, listType = '';

  function closeList() { if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; } }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function inlineFormat(s) {
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return s;
  }

  function highlightCode(code, lang) {
    let h = esc(code);
    // comments
    h = h.replace(/(\/\/.*)/g, '<span class="cmt">$1</span>');
    h = h.replace(/(#.*)/g, '<span class="cmt">$1</span>');
    // strings
    h = h.replace(/(&quot;[^&]*?&quot;|'[^']*?'|`[^`]*?`)/g, '<span class="str">$1</span>');
    // keywords
    const kws = 'const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|interface|type|class|extends|implements|new|this|try|catch|throw|typeof|instanceof|switch|case|break|continue|do|in|of|yield|void|null|undefined|true|false';
    h = h.replace(new RegExp('\\b(' + kws + ')\\b', 'g'), '<span class="kw">$1</span>');
    // numbers
    h = h.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    return h;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // code block
    if (line.startsWith('```')) {
      if (!inCode) {
        closeList();
        inCode = true;
        codeLang = line.slice(3).trim();
        codeLines = [];
      } else {
        const code = codeLines.join('\n');
        const langLabel = codeLang ? `<span class="lang">${esc(codeLang)}</span>` : '';
        html += `<pre>${langLabel}<code>${highlightCode(code, codeLang)}</code></pre>`;
        inCode = false;
      }
      continue;
    }
    if (inCode) { codeLines.push(line); continue; }

    // blank line
    if (line.trim() === '') { closeList(); continue; }

    // headings
    const hm = line.match(/^(#{1,4})\s+(.+)/);
    if (hm) { closeList(); const lvl = hm[1].length; html += `<h${lvl}>${inlineFormat(hm[2])}</h${lvl}>`; continue; }

    // hr
    if (/^---+$/.test(line.trim())) { closeList(); html += '<hr>'; continue; }

    // tip/warn boxes
    if (line.startsWith('💡')) { closeList(); html += `<div class="tip">${inlineFormat(line)}</div>`; continue; }
    if (line.startsWith('⚠️')) { closeList(); html += `<div class="warn">${inlineFormat(line)}</div>`; continue; }

    // blockquote
    if (line.startsWith('>')) { closeList(); html += `<blockquote>${inlineFormat(line.slice(1).trim())}</blockquote>`; continue; }

    // table
    if (line.includes('|') && line.trim().startsWith('|')) {
      closeList();
      // collect table lines
      const tableLines = [line];
      while (i + 1 < lines.length && lines[i+1].trim().startsWith('|')) { tableLines.push(lines[++i]); }
      html += renderTable(tableLines);
      continue;
    }

    // unordered list
    const ulm = line.match(/^(\s*)[-*]\s+(.+)/);
    if (ulm) {
      if (!inList || listType !== 'ul') { closeList(); html += '<ul>'; inList = true; listType = 'ul'; }
      html += `<li>${inlineFormat(ulm[2])}</li>`;
      continue;
    }

    // ordered list
    const olm = line.match(/^(\s*)\d+\.\s+(.+)/);
    if (olm) {
      if (!inList || listType !== 'ol') { closeList(); html += '<ol>'; inList = true; listType = 'ol'; }
      html += `<li>${inlineFormat(olm[2])}</li>`;
      continue;
    }

    // paragraph
    closeList();
    html += `<p>${inlineFormat(line)}</p>`;
  }
  closeList();
  if (inCode) { html += `<pre><code>${esc(codeLines.join('\n'))}</code></pre>`; }

  // nav buttons
  const prev = index > 0 ? COURSES[index-1] : null;
  const next = index < COURSES.length - 1 ? COURSES[index+1] : null;
  html += `<div class="nav-bottom">
    <button class="nav-btn" ${prev ? `onclick="loadCourse(${index-1})"` : 'disabled'}>← ${prev ? prev.title : ''}</button>
    <button class="nav-btn" ${next ? `onclick="loadCourse(${index+1})"` : 'disabled'}>${next ? next.title : ''} →</button>
  </div>`;

  el.innerHTML = html;
  el.scrollTop = 0;
  window.scrollTo(0, 0);
}

function renderTable(lines) {
  const rows = lines.filter(l => !l.match(/^\|[\s-:|]+\|$/));
  if (rows.length === 0) return '';
  let html = '<table>';
  rows.forEach((row, ri) => {
    const cells = row.split('|').filter(c => c.trim() !== '');
    const tag = ri === 0 ? 'th' : 'td';
    html += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
  });
  return html + '</table>';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.querySelector('.overlay').classList.remove('show');
}

// Load from hash
function loadFromHash() {
  const hash = window.location.hash.slice(1);
  if (hash) {
    const idx = COURSES.findIndex(c => c.id === hash);
    if (idx >= 0) loadCourse(idx);
  }
}
window.addEventListener('hashchange', loadFromHash);
loadFromHash();

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && currentIndex > 0) loadCourse(currentIndex - 1);
  if (e.key === 'ArrowRight' && currentIndex < COURSES.length - 1) loadCourse(currentIndex + 1);
});
</script>
</body>
</html>
