<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoLeap 實習生技能樹</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fb;
    --bg-card: #ffffff;
    --bg-panel: #ffffff;
    --border: #e2e5eb;
    --text: #1e293b;
    --text-dim: #94a3b8;
    --green: #16a34a;
    --green-glow: #16a34a30;
    --blue: #2563eb;
    --blue-glow: #2563eb30;
    --purple: #7c3aed;
    --purple-glow: #7c3aed30;
    --gold: #d97706;
    --gold-glow: #d9770630;
    --locked: #e5e7eb;
    --locked-text: #9ca3af;
    --line-color: #d1d5db;
    --line-active: #a3aab8;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 28px 20px 12px;
    position: relative;
  }
  .header h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    background: linear-gradient(135deg, var(--green), var(--blue), var(--purple), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.02em;
  }
  .header p {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* Progress Bar */
  .progress-wrap {
    max-width: 480px;
    margin: 16px auto 8px;
    padding: 0 20px;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-labels .xp-val {
    color: var(--gold);
    font-weight: 700;
  }
  .progress-bar {
    height: 10px;
    background: var(--locked);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--green), var(--blue), var(--purple), var(--gold));
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .skill-count {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .skill-count span { color: var(--text); font-weight: 600; }

  /* Tree */
  .tree {
    max-width: 820px;
    margin: 20px auto 100px;
    padding: 0 12px;
    position: relative;
  }

  /* Tier */
  .tier {
    margin-bottom: 12px;
    position: relative;
  }
  .tier-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 0 4px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tier-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .tier-nodes {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding-bottom: 20px;
  }

  /* Connector lines (between tiers) */
  .tier-connector {
    display: flex;
    justify-content: center;
    padding: 0 0 4px;
  }
  .tier-connector .line {
    width: 2px;
    height: 28px;
    background: linear-gradient(to bottom, var(--line-active), var(--line-color));
    border-radius: 1px;
  }

  /* Node */
  .node {
    width: 130px;
    min-height: 80px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 8px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s, box-shadow 0.3s;
    border: 2px solid transparent;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .node:hover { transform: translateY(-3px); }
  .node:active { transform: scale(0.97); }

  .node .icon { font-size: 1.5rem; line-height: 1; }
  .node .name { font-size: 0.78rem; font-weight: 600; line-height: 1.25; }
  .node .xp-badge {
    font-size: 0.6rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    background: rgba(0,0,0,0.08);
    color: inherit;
    opacity: 0.8;
  }

  /* Completed checkmark */
  .node .check {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    display: none;
  }
  .node.completed .check { display: flex; }

  /* Tier color schemes */
  .node.tier-1 {
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
    border-color: var(--green);
    box-shadow: 0 2px 8px var(--green-glow), inset 0 1px 0 rgba(255,255,255,0.8);
    color: #166534;
  }
  .node.tier-1 .check { background: var(--green); }

  .node.tier-2 {
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border-color: var(--blue);
    box-shadow: 0 2px 8px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,0.8);
    color: #1e40af;
  }
  .node.tier-2 .check { background: var(--blue); }

  .node.tier-3 {
    background: linear-gradient(135deg, #faf5ff, #ede9fe);
    border-color: var(--purple);
    box-shadow: 0 2px 8px var(--purple-glow), inset 0 1px 0 rgba(255,255,255,0.8);
    color: #5b21b6;
  }
  .node.tier-3 .check { background: var(--purple); }

  .node.tier-4 {
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
    border-color: var(--gold);
    box-shadow: 0 2px 8px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.8);
    color: #92400e;
  }
  .node.tier-4 .check { background: var(--gold); }

  /* Locked */
  .node.locked {
    background: var(--locked);
    border-color: #d1d5db;
    box-shadow: none;
    color: var(--locked-text);
    cursor: not-allowed;
    opacity: 0.6;
  }
  .node.locked:hover { transform: none; }
  .node.locked .lock-icon {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 0.65rem;
  }

  /* Pulse for available */
  .node.available:not(.completed) {
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 16px var(--glow-color); }
    50% { box-shadow: 0 0 28px var(--glow-color), 0 0 48px var(--glow-color); }
  }
  .node.tier-1.available:not(.completed) { --glow-color: var(--green-glow); }
  .node.tier-2.available:not(.completed) { --glow-color: var(--blue-glow); }
  .node.tier-3.available:not(.completed) { --glow-color: var(--purple-glow); }
  .node.tier-4.available:not(.completed) { --glow-color: var(--gold-glow); }

  /* Panel overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .panel {
    position: fixed;
    top: 0;
    right: 0;
    width: min(420px, 92vw);
    height: 100%;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    z-index: 101;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .panel.open { transform: translateX(0); }

  .panel-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border: none;
    background: rgba(0,0,0,0.05);
    color: var(--text);
    border-radius: 8px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .panel-close:hover { background: rgba(0,0,0,0.1); }

  .panel-content {
    padding: 28px 24px 40px;
  }
  .panel-content h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .panel-content .tier-tag {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 12px;
  }
  .panel-content .desc {
    color: #334155;
    font-size: 0.88rem;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .panel-section {
    margin-bottom: 18px;
  }
  .panel-section h3 {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #475569;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-section ul {
    list-style: none;
    padding: 0;
  }
  .panel-section li {
    font-size: 0.85rem;
    line-height: 1.6;
    padding-left: 16px;
    position: relative;
    color: #1e293b;
  }
  .panel-section li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #64748b;
  }
  .panel-section a {
    color: var(--blue);
    text-decoration: none;
  }
  .panel-section a:hover { text-decoration: underline; }

  .panel-xp {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.1rem;
    font-weight: 800;
    margin-bottom: 20px;
  }

  .complete-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .complete-btn.mark {
    background: linear-gradient(135deg, var(--green), #16a34a);
    color: #fff;
  }
  .complete-btn.mark:hover { box-shadow: 0 0 20px var(--green-glow); }
  .complete-btn.unmark {
    background: rgba(0,0,0,0.04);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .complete-btn.unmark:hover { background: rgba(0,0,0,0.08); }
  .complete-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .prereq-warning {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: #dc2626;
    margin-bottom: 16px;
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    z-index: 200;
    pointer-events: none;
    animation: confetti-fall 1.4s cubic-bezier(0.25, 0, 0.5, 1) forwards;
  }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(60vh) rotate(720deg) scale(0.3); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .node { width: 105px; min-height: 70px; padding: 10px 6px; }
    .node .icon { font-size: 1.3rem; }
    .node .name { font-size: 0.72rem; }
    .tier-nodes { gap: 8px; }
    .panel-content { padding: 24px 16px 32px; }
  }
  @media (max-width: 380px) {
    .node { width: 90px; min-height: 62px; }
    .node .name { font-size: 0.65rem; }
  }
</style>
</head>
<body>

const TIER_META = {
  1: { name: "\u57FA\u790E\u5165\u9580 Foundation", color: "var(--green)" },
  2: { name: "\u5BE6\u6230\u6280\u80FD Practice", color: "var(--blue)" },
  3: { name: "\u9032\u968E\u80FD\u529B Advanced", color: "var(--purple)" },
  4: { name: "\u7368\u7ACB\u958B\u767C\u8005 Independent", color: "var(--gold)" }
};

const TOTAL_XP = SKILLS.reduce((s, sk) => s + sk.xp, 0);

// State
let completed = new Set();
function loadState() {
  try {
    const raw = localStorage.getItem("lingoleap-skill-tree");
    if (raw) completed = new Set(JSON.parse(raw));
  } catch(e) {}
}
function saveState() {
  localStorage.setItem("lingoleap-skill-tree", JSON.stringify([...completed]));
}
loadState();

function isAvailable(skill) {
  return skill.prereqs.every(pid => completed.has(pid));
}

function getEarnedXP() {
  return SKILLS.filter(s => completed.has(s.id)).reduce((sum, s) => sum + s.xp, 0);
}

function updateProgress() {
  const earned = getEarnedXP();
  const pct = (earned / TOTAL_XP) * 100;
  document.getElementById("xp-display").textContent = `${earned} / ${TOTAL_XP} XP`;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("completed-count").textContent = completed.size;
}

// Confetti
function spawnConfetti(x, y) {
  const colors = ["#22c55e", "#3b82f6", "#a855f7", "#f59e0b", "#ef4444", "#06b6d4"];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = (x + (Math.random() - 0.5) * 100) + "px";
    el.style.top = (y + (Math.random() - 0.5) * 40) + "px";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (4 + Math.random() * 6) + "px";
    el.style.height = (4 + Math.random() * 6) + "px";
    el.style.animationDuration = (0.8 + Math.random() * 0.8) + "s";
    el.style.animationDelay = (Math.random() * 0.2) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

// Render tree
function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";

  for (let tier = 1; tier <= 4; tier++) {
    if (tier > 1) {
      const conn = document.createElement("div");
      conn.className = "tier-connector";
      conn.innerHTML = '<div class="line"></div>';
      tree.appendChild(conn);
    }

    const tierDiv = document.createElement("div");
    tierDiv.className = "tier";

    const label = document.createElement("div");
    label.className = "tier-label";
    label.style.color = TIER_META[tier].color;
    label.textContent = `Tier ${tier} \u2014 ${TIER_META[tier].name}`;
    tierDiv.appendChild(label);

    const nodesDiv = document.createElement("div");
    nodesDiv.className = "tier-nodes";

    SKILLS.filter(s => s.tier === tier).forEach(skill => {
      const isComp = completed.has(skill.id);
      const avail = isAvailable(skill);

      const node = document.createElement("div");
      node.className = `node tier-${tier}`;
      if (isComp) node.classList.add("completed");
      else if (avail) node.classList.add("available");
      else node.classList.add("locked");

      node.innerHTML = `
        <div class="check">\u2713</div>
        <div class="icon">${skill.icon}</div>
        <div class="name">${skill.name}</div>
        <div class="xp-badge">${skill.xp} XP</div>
        ${!avail && !isComp ? '<div class="lock-icon">\u{1F512}</div>' : ''}
      `;

      node.addEventListener("click", () => openPanel(skill));
      nodesDiv.appendChild(node);
    });

    tierDiv.appendChild(nodesDiv);
    tree.appendChild(tierDiv);
  }

  updateProgress();
}

// Panel
function openPanel(skill) {
  const panel = document.getElementById("panel");
  const overlay = document.getElementById("overlay");
  const content = document.getElementById("panel-content");
  const isComp = completed.has(skill.id);
  const avail = isAvailable(skill);

  const tierColor = TIER_META[skill.tier].color;
  const tierName = TIER_META[skill.tier].name;

  const prereqNames = skill.prereqs.map(pid => {
    const ps = SKILLS.find(s => s.id === pid);
    const done = completed.has(pid);
    return `<span style="color: ${done ? 'var(--green)' : '#ef4444'}">${done ? '\u2713' : '\u2717'} ${ps.name}</span>`;
  });

  content.innerHTML = `
    <div class="panel-xp" style="color: ${tierColor}">${skill.icon} ${skill.xp} XP</div>
    <h2>${skill.name}</h2>
    <span class="tier-tag" style="background: ${tierColor}22; color: ${tierColor}; border: 1px solid ${tierColor}44;">
      Tier ${skill.tier} \u2014 ${tierName}
    </span>
    <p class="desc">${skill.desc}</p>

    ${!avail && !isComp ? `
      <div class="prereq-warning">
        \u{1F512} \u9700\u8981\u5148\u5B8C\u6210\u4EE5\u4E0B\u6280\u80FD\uFF1A<br>${prereqNames.join('<br>')}
      </div>
    ` : ''}

    ${prereqNames.length > 0 ? `
      <div class="panel-section">
        <h3>\u{1F517} \u524D\u7F6E\u6280\u80FD</h3>
        <div style="font-size: 0.85rem; line-height: 1.8;">${prereqNames.join('<br>')}</div>
      </div>
    ` : ''}

    <div class="panel-section">
      <h3>\u{1F3AF} PBL \u5BE6\u4F5C\u5C08\u6848</h3>
      <p style="font-size: 0.85rem; color: #1e293b; line-height: 1.6;">${skill.project}</p>
    </div>

    <div class="panel-section">
      <h3>\u{1F4DA} \u5B78\u7FD2\u8CC7\u6E90</h3>
      <ul>
        ${skill.resources.map(r => `<li><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a></li>`).join('')}
      </ul>
    </div>

    <div class="panel-section">
      <h3>\u2705 \u5B8C\u6210\u689D\u4EF6</h3>
      <ul style="list-style: none; padding: 0;">
        ${skill.criteria.split('\u3001').map(c => c.trim()).filter(Boolean).map(c =>
          `<li style="font-size: 0.85rem; color: #1e293b; line-height: 1.8; padding-left: 24px; position: relative;">
            <span style="position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border: 2px solid #d1d5db; border-radius: 4px; display: inline-block;"></span>
            ${c}
          </li>`
        ).join('')}
      </ul>
    </div>

    ${isComp ? `
      <button class="complete-btn unmark" onclick="toggleSkill(${skill.id}, false)">\u53D6\u6D88\u5B8C\u6210</button>
    ` : `
      <button class="complete-btn mark" ${!avail ? 'disabled' : ''} onclick="toggleSkill(${skill.id}, true, event)">
        ${avail ? '\u{1F3C6} \u6A19\u8A18\u70BA\u5DF2\u5B8C\u6210' : '\u{1F512} \u5C1A\u672A\u89E3\u9396'}
      </button>
    `}
  `;

  panel.classList.add("open");
  overlay.classList.add("open");
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}

document.getElementById("panel-close").addEventListener("click", closePanel);
document.getElementById("overlay").addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

window.toggleSkill = function(id, markComplete, event) {
  if (markComplete) {
    completed.add(id);
    // Confetti from button position
    if (event) {
      const rect = event.target.getBoundingClientRect();
      spawnConfetti(rect.left + rect.width / 2, rect.top);
    }
  } else {
    completed.delete(id);
    // Also un-complete skills that depended on this
    // (cascade only if they have no other path)
  }
  saveState();
  renderTree();
  // Reopen panel with updated state
  const skill = SKILLS.find(s => s.id === id);
  if (skill) setTimeout(() => openPanel(skill), 50);
};

// Init
renderTree();
</script>
</body>
</html>
