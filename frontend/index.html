<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy: this <meta> tag is the ONLY place script-src /
         style-src / connect-src / frame-src etc. are enforced for the actual
         frontend PAGE response (index.html and every SPA route it serves).
         backend/app/main.py's SecurityHeadersMiddleware does NOT cover this —
         that middleware only ever runs on responses FROM the backend FastAPI
         app itself (/api/*, /assets/* when proxied there, /q/*). It never sees
         this page's response, on EITHER hosting path (Firebase Hosting's
         prod/staging/dev, or this repo's own nginx in the Cloud Run frontend
         image) — confirmed by curl against both coming back with none of its
         headers (#3850). Fixed a stale version of this comment that claimed
         otherwise. -->
    <!-- #2486: frame-src no longer needs storage.googleapis.com — the worksheet
         PDF iframe now loads through our own /assets/* proxy. That proxy is
         same-origin on the Firebase Hosting build, but on the Cloud-Run-direct
         frontend (staging/prod/PR previews) ASSET_BASE resolves to the
         backend's own Cloud Run origin — a different host — so the iframe is
         genuinely cross-origin there. https://*.run.app (same wildcard as
         connect-src) covers that without hardcoding per-environment URLs. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.run.app; connect-src 'self' http://localhost:* ws://localhost:* https://*.run.app https://*.googleapis.com https://*.firebaseapp.com https://*.cloudfunctions.net https://us-central1-aiplatform.googleapis.com https://www.google-analytics.com https://analytics.google.com; frame-src 'self' https://*.run.app https://www.youtube.com https://www.youtube-nocookie.com;" />
    <!-- Note: frame-ancestors is intentionally omitted from this meta tag.
         Per CSP spec, frame-ancestors is a navigation directive and is ignored
         when delivered via <meta> elements (causes browser console warnings).
         See: https://www.w3.org/TR/CSP3/#frame-ancestors-and-frame-options
         Anti-clickjacking for THIS page is instead enforced via real HTTP
         response headers, set directly on the two paths that actually serve
         this page — firebase.json's `headers` config (Firebase Hosting) and
         frontend/docker/render-nginx-conf.sh (the Cloud Run frontend's own
         nginx) — NOT by backend/app/main.py's SecurityHeadersMiddleware (see
         the comment above this one). Those two headers are:
           X-Frame-Options: SAMEORIGIN
           Content-Security-Policy: frame-ancestors 'self'
         SAMEORIGIN / 'self', not DENY / 'none': this app's own admin QA
         tooling (StoryStructureLabPage.tsx, spotlight-qa/app.js,
         keypoints-qa/app.js) embeds this app's own /learn/* pages in a
         same-origin iframe for live preview — DENY/'none' block ALL framing,
         same-origin included, and would break that. Locked by
         frontend/docker/test-security-headers.sh (#3850). -->
    <title>AI 朗讀助教 — 國語文閱讀學習平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=cwTeXYen&family=cwTeXKai&family=Noto+Serif+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
      /* Issue #1351 — zhuyin-active uses BpmfZihiSerif (字嗨宋體, ButTaiwan/bpmfvs)
         instead of the previous BpmfGenYoGothic (源樣黑體). The new font carries
         the same Bopomofo IVS variant selectors (U+E0100–E01EF) so PUA-based
         zhuyin annotations still render, while the base CJK glyphs are now serif
         (宋體) — matching 陳淑麗教授 readability requirement for nearsighted
         students. License: Apache 2.0 (see /fonts/licenses/). */
      @font-face {
        font-family: 'BpmfZihiSerif';
        src: url('/fonts/BpmfZihiSerif-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      body {
        font-family: 'cwTeXKai', 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
        background-color: #FBF6EE;
      }
      .zhuyin-text {
        font-family: 'BpmfZihiSerif', 'Noto Serif TC', serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
