<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy: browser-level fallback.
         The primary CSP is set by SecurityHeadersMiddleware in backend/app/main.py.
         This meta tag covers direct frontend hosting (Firebase Hosting / CDN). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' http://localhost:* ws://localhost:* https://*.run.app https://*.googleapis.com https://*.firebaseapp.com https://*.cloudfunctions.net https://us-central1-aiplatform.googleapis.com https://www.google-analytics.com https://analytics.google.com; frame-src https://storage.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com;" />
    <!-- Note: frame-ancestors is intentionally omitted from this meta tag.
         Per CSP spec, frame-ancestors is a navigation directive and is ignored
         when delivered via <meta> elements (causes browser console warnings).
         Anti-clickjacking is enforced via HTTP headers in SecurityHeadersMiddleware:
           Content-Security-Policy: frame-ancestors 'none'
           X-Frame-Options: DENY
         See: https://www.w3.org/TR/CSP3/#frame-ancestors-and-frame-options -->
    <title>AI 朗讀助教 — 國語文閱讀學習平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=cwTeXYen&family=cwTeXKai&family=Noto+Serif+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
      /* Issue #1351 — zhuyin-active uses BpmfZihiSerif (字嗨宋體, ButTaiwan/bpmfvs)
         instead of the previous BpmfGenYoGothic (源樣黑體). The new font carries
         the same Bopomofo IVS variant selectors (U+E0100–E01EF) so PUA-based
         zhuyin annotations still render, while the base CJK glyphs are now serif
         (宋體) — matching 陳淑麗教授 readability requirement for nearsighted
         students. License: Apache 2.0 (see /fonts/licenses/). */
      @font-face {
        font-family: 'BpmfZihiSerif';
        src: url('/fonts/BpmfZihiSerif-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      body {
        font-family: 'cwTeXKai', 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
        background-color: #FBF6EE;
      }
      .zhuyin-text {
        font-family: 'BpmfZihiSerif', 'Noto Serif TC', serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
