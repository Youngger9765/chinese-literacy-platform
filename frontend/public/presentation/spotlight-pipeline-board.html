 "3.小試身手："}, {"type": "guide", "text": "※推論文章主旨：從課文第一段和最後一段找出本文的文章主旨。（單選）"}, {"type": "guide", "text": "□這位酷老師，如果還活著，年紀和阿里山神木一樣老。"}, {"type": "guide", "text": "□學生們把和孔子在生活中的對話，加上平常的作為記錄下來，集結成《論語》"}, {"type": "guide", "text": "□孔子當時教過的學生約有三千人，後人尊稱他為「至聖先師」。"}, {"type": "guide", "text": "孔子是個博學有智慧，為理想奉獻一生的酷老師。"}], "hist": {"guide": 16, "free_text": 2}, "n_blocks": 18, "n_q": 2, "layout": "standard", "stype": "main_idea_inference", "sname": "推論策略-從標題及首尾段推論主旨", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G6-L5", "title": "卡通人氣王票選政見發表會", "story_id": 16, "grade_code": "G6-L05", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L5.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L05.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手：請依據文章線索選出正確答案"}, {"type": "free_text", "prompt": "1.小妤常打斷台上發言，育勤有條有理的提出不同見解。"}, {"type": "guide", "text": "→以小妤的表現，下列何者可能是她的性格？（多選）"}, {"type": "guide", "text": "莽撞   直率  □熱情  □沉著"}, {"type": "free_text", "prompt": "2.育勤和夏恩兩人雖然意見不同，但都能遵守發言的規則。"}, {"type": "guide", "text": "→以育勤和夏恩兩人的表現，下列何者哪一句最貼切？（單選）"}, {"type": "guide", "text": "□幫助意見相同的人，排斥意見不同的人。"}, {"type": "guide", "text": "互相尊重各方的意見，不任意批評。"}, {"type": "guide", "text": "□思想不同，志趣不合，就無法相互討論或共事。"}, {"type": "free_text", "prompt": "1.寫出本課大意"}, {"type": "free_text", "prompt": "2.作者通常會在文章結尾處，表達感受或說明道理，這就是關鍵語句。這一課的文章內容是政見發表會，以下文章結尾的句子，哪一句最可能成為關鍵語句？請打勾。(單選)"}, {"type": "guide", "text": "□票選活動進入最後階段，主持人為發表會做總結。"}, {"type": "guide", "text": "謝謝大家發表了自己的觀點，謝謝大家專心聆聽彼此的意見。"}, {"type": "guide", "text": "□誰會成為第一名的卡通人氣王？我們就投票來決定囉。"}, {"type": "free_text", "prompt": "3.下列哪一個選項敘述符合本課主旨？請打勾。(單選)"}, {"type": "guide", "text": "□A.少數服從多數，最優秀的人就是你自己。"}, {"type": "guide", "text": "B.每個人都可以有不同的觀點，我們應該彼此尊重。"}, {"type": "guide", "text": "□C.只要我喜歡，有什麼不可以。"}, {"type": "guide", "text": "□D.人可以犯錯，但是不可犯同一個錯。"}, {"type": "free_text", "prompt": "4.透過這一課，我學到了什麼？"}, {"type": "guide", "text": "勇於發表自己的想法／尊重他人／如何找出文章主旨"}], "hist": {"guide": 15, "free_text": 6}, "n_blocks": 21, "n_q": 6, "layout": "standard", "stype": "main_idea_inference", "sname": "推論策略-從摘要及關鍵句推論主旨", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G6-L6", "title": "心理出狀況，是壞事導致的嗎？", "story_id": 17, "grade_code": "G6-L06", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L6.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L06.docx", "blocks": [{"type": "guide", "text": "主旨是作者在寫文章時，想要告訴別人的主要想法或道理。\n    這篇文章屬於議論文，文章主題在討論：心理生病了，是「壞事」導致的嗎？作者用三個故事來說明他的想法，卻未在故事中直接說出他的答案。\n因此這課我們要來練習：推論段落主旨。\n推論文章主旨的方法有兩種：\n1.\t從標題找線索、從文章第一段或最後一段找主題句。\n2.\t摘取文章的大意和關鍵語句。\n（忘記方法可以翻到第4、5課閱讀聚光燈，裡面有詳細說明）"}, {"type": "guide", "text": "一、推論全文主旨"}, {"type": "free_text", "prompt": "1.標題一探究竟：「心理出狀況，是壞事導致的嗎？」"}, {"type": "guide", "text": "→從標題可以看出作者想探討【  心理狀況 】和【  壞事 】的關聯。"}, {"type": "free_text", "prompt": "2.主旨找一找：請從本文最末段勾選出主旨。(單選)"}, {"type": "guide", "text": "□你發現這三個故事的共同主題了嗎？"}, {"type": "guide", "text": "□是的，主角都遇到了自己不能控制的壞事。"}, {"type": "guide", "text": "但即使惡劣的情況已不可能逆轉，一個人只要「改變自己對壞事的看法」，就不至於讓自己的情緒跌入萬丈深淵。"}, {"type": "guide", "text": "□最後再問一次：心理生病了，真的是「壞事」導致的嗎？"}, {"type": "guide", "text": "二、推論段落主旨"}, {"type": "passage", "source": "unknown", "paragraphs": ["接下來我們要找出三個故事的主旨，由於故事中並不能直接找到主旨主題句，因此我們要用第二個方法推論主旨。"]}, {"type": "guide", "text": "本文關鍵問題是：「心理出狀況，是壞事導致的嗎？」"}, {"type": "guide", "text": "從標題與全文主旨可以得知，段落大意和關鍵語句與"}, {"type": "guide", "text": "【  心理狀況 】、【  壞事 】以及對壞事的【  看法 】有關係。"}, {"type": "guide", "text": "接下來要從三個故事中分別找出這些線索，推論出各段落的主旨，準備好了嗎？"}, {"type": "free_text", "prompt": "(1) 基礎題："}, {"type": "free_text", "prompt": "(2) 進階題："}, {"type": "free_text", "prompt": "(3) 挑戰題："}], "hist": {"guide": 12, "free_text": 5, "passage": 1}, "n_blocks": 18, "n_q": 5, "layout": "standard", "stype": "inference", "sname": "推論策略-從大意及關鍵句推論段旨", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G6-L7", "title": "黑猩猩的守護者", "story_id": 7, "grade_code": "G6-L07", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L7.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L07.docx", "blocks": [{"type": "guide", "text": "本課是一篇故事體，主要是描述珍古德長年研究、守護黑猩猩的過程。\n1.使故事體的「結構」一般包含：「故事背景」、「起因」、「經過」、「結果」，讀故事時，若用「故事結構」去讀，讀完後，用故事結構去理解、回想，可以更容易理解、更容易記憶哦！\n故事背景：故事背景通常包含故事發生的時間、地點、人物或相關補充等。如：三隻小豬的故事背景是豬媽媽有三個兒子，他覺得孩子們應該要獨立了。\n起因：引發這個故事的原因。如：三隻小豬故事的起因是媽媽要他們自己蓋房子，故事才會開始。\n經過：故事經歷的過程，通常會有多個歷程，會按照時間、事件發生的先後順序描述。如：豬大哥、豬二哥、豬小弟蓋房子的歷程等\n結果：故事最後的結果。如：偷懶的豬大哥、豬二哥房子被大野狼弄壞，豬小弟認真蓋的房子平安無事。\n2.當文章篇幅很長時，該怎麼找出課文大意呢？\n(1)先區分出這篇文章的「故事體結構」分別是哪些段落。\n(2)找出每一個結構的重點。"}, {"type": "guide", "text": "一、找到文章裡的故事體結構"}, {"type": "guide", "text": "全文共有９個自然段，它們分別屬於「背景」、「起因」、「經過」、「結果」的故事結構。請你試著在底下空格中，填入各段落的阿拉伯數字，例如第一段，就寫1。"}, {"type": "fill_table"}, {"type": "guide", "text": "二、為每個故事結構做摘要（以「背景」和「起因」為例）"}, {"type": "free_text", "prompt": "1.找出背景的摘要：背景包含故事發生的時間、地點、人物或相關補充。"}, {"type": "passage", "source": "unknown", "paragraphs": ["珍古德因為家庭經濟因素，高中畢業後沒有繼續念大學。她小時候最喜愛《杜立德醫生非洲歷險記》這本書，書中描述杜立德醫生到非洲，把一群得了瘟疫的猴子拯救出來的故事。她一次又一次的閱讀，把關於非洲、叢林和各種動物的鏡頭，深深的烙在心靈深處，總是夢想著去非洲探險。成年後，工作之餘，她總是在自然歷史博物館裡，大量閱讀有關動物生態的各種書籍。"]}, {"type": "free_text", "prompt": "(1)本段內容為故事的背景，主要說明珍古德去非洲之前的基本訊息。"}, {"type": "free_text", "prompt": "(2)畫出與背景相關的關鍵訊息："}, {"type": "passage", "source": "unknown", "paragraphs": ["找關鍵訊息的訣竅是「事情事情，重事不重情！」也就是說，「人事時地、如何、為何」才是重要的關鍵訊息。而文章中關於情緒的描述通常是不重要的，可以刪去。例如，烙在心靈深處、血液近乎沸騰，這些情緒的描寫都可刪除。"]}, {"type": "guide", "text": "首先先畫出重要的人物珍古德。"}, {"type": "guide", "text": "本文主題是黑猩猩的守護者，黑猩猩在非洲，因此非洲也是重要的訊息。"}, {"type": "guide", "text": "而杜立德醫生非洲歷險記這本書是讓珍古德想去非洲的一個重要元素，因此也要畫起來。"}, {"type": "free_text", "prompt": "(3)串連關鍵訊息：請將關鍵訊息加上連接詞後串連成完整通順的句子。"}, {"type": "guide", "text": "珍古德 小時候 《杜立德醫生非洲歷險記》 夢想著去非洲探險"}, {"type": "passage", "source": "unknown", "paragraphs": ["【珍古德小時候因為讀了《杜立德醫生非洲歷險記》，所以夢想著去非洲探險。                             】"]}, {"type": "free_text", "prompt": "2.找出起因段的摘要：起因是故事開始的原因。"}, {"type": "passage", "source": "unknown", "paragraphs": ["珍古德二十三歲時，終於有機會帶著簡單的行囊，搭上飛機，從英國投向非洲的懷抱。踏上夢寐以求的土地時，她全身的血液近乎沸騰，覺得像在作夢一般。", "珍古德很快的在當地的博物館找到工作。博物館的館長，當時正想找人到岡貝研究黑猩猩。珍古德雖然沒有大學文憑，也沒有受過專業訓練，但是她對動物的熱情，獲得館長的讚賞，讓她得到了這份工作。珍古德立刻寫信，邀請遠在英國的媽媽陪她一起前往岡貝。"]}, {"type": "free_text", "prompt": "(1)「起因」即故事開始的原因，主要在說明珍古德因為什麼樣的機緣才會去非洲照顧黑猩猩。"}, {"type": "free_text", "prompt": "(2)畫出起因關鍵訊息：請你用螢光筆畫出「珍古德去非洲照顧黑猩猩的原因」有關的關鍵訊息。"}, {"type": "passage", "source": "unknown", "paragraphs": ["她什麼時候去非洲呢？", "是怎麼得到照顧黑猩猩的機會呢？"]}, {"type": "free_text", "prompt": "(3)串連關鍵訊息：請你用自己的話將關鍵訊息串連成完整通順的句子。"}, {"type": "passage", "source": "unknown", "paragraphs": ["【珍古德23歲時去非洲，在博物館找到工作，館長想找她到岡貝研究黑猩猩。                                    】"]}, {"type": "guide", "text": "恭喜你已經寫出這個故事的背景和起因，接下來我們來整理本課的文章重點嘍！"}, {"type": "fill_table"}], "hist": {"guide": 9, "fill_table": 2, "free_text": 8, "passage": 6}, "n_blocks": 25, "n_q": 10, "layout": "standard", "stype": "summary", "sname": "摘要策略-從故事結構找重點", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G6-L8", "title": "動物談情說愛的方式", "story_id": 18, "grade_code": "G6-L08", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L8.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L08.docx", "blocks": [{"type": "guide", "text": "如何找出「小主題」以及小主題下方的「舉例與重要細節」呢？"}, {"type": "guide", "text": "以第二段為例"}, {"type": "free_text", "prompt": "1.找出小主題：本課小主題可以直接從段落前的小標題找到。通常小主題會出現在標題或首句。小標題是該段的核心概念，有助於找到段落內的舉例及重要細節。"}, {"type": "guide", "text": "第一個小標題是：用歌聲求偶。"}, {"type": "free_text", "prompt": "2.找出小主題（用歌聲求偶）下方的舉例與重要細節"}, {"type": "guide", "text": "潮濕溫暖的夏夜，嘓嘓嘓、嘓嘓嘓，雄蛙奮力的在池塘裡展現歌喉，只為求得雌蛙的青睞，以完成繁衍的天職。雄蛙求偶的鳴叫聲響遍池畔，也引來競爭對手的爭強鬥勝。是否能順利成為心儀對象的「青蛙子」？雄蛙們可要各憑本事才行。"}, {"type": "free_text", "prompt": "(1)找出舉例：可以發現整段都在描寫的動物是青蛙，跟動物有關的詞彙有雄蛙、雌蛙和青蛙，這時要選擇哪個最貼近「用歌聲求偶」的小主題呢？是誰用歌聲在求偶呢？【☐雄蛙  ☐雌蛙】（單選）"}, {"type": "free_text", "prompt": "(2)整理細節內容：再來整理與「歌聲求偶」有關的訊息"}, {"type": "guide", "text": "嘓嘓嘓、展現歌喉、鳴叫聲發出嘓嘓嘓的鳴叫聲，展現歌喉。"}, {"type": "free_text", "prompt": "(3)條列整理訊息：最後把舉例與細節整理如下"}, {"type": "guide", "text": "雄蛙  — 發出嘓嘓嘓的鳴叫聲，展現歌喉。"}, {"type": "guide", "text": "換你試試看：第三段"}, {"type": "guide", "text": "春天來臨，住在枯木洞裡的五色鳥，開始粉墨登場，準備在演唱會一展歌喉。牠身穿綠衣裳，頭戴彩色帽，站在茂密枝葉搭起的舞台上，揭開演唱會的序幕。五色鳥發出喀、喀、喀喀喀喀……的求偶叫聲，盡情的歌唱。牠獨特的聲音，吸引愛慕者，為延續下一代而準備。"}, {"type": "free_text", "prompt": "1.先找小主題\n  本段的小標題也是： 用歌聲求偶。"}, {"type": "free_text", "prompt": "2.找出舉例和細節"}, {"type": "free_text", "prompt": "(1)找出舉例：整段都在描寫的動物是【  五色鳥  】"}, {"type": "free_text", "prompt": "(2)整理細節內容：發出【  喀喀喀  】的求偶叫聲"}, {"type": "free_text", "prompt": "(3)條列整理訊息"}, {"type": "guide", "text": "五色鳥  —      發出喀喀喀的求偶叫聲。"}, {"type": "free_text", "prompt": "3.整理小主題內兩段訊息"}, {"type": "guide", "text": "雄  蛙  — 發出嘓嘓嘓的鳴叫聲，展現歌喉。"}, {"type": "guide", "text": "五色鳥   —  發出喀喀喀的求偶叫聲。"}, {"type": "guide", "text": "挑戰題，請找出第六段的「小主題」及小主題下方的「舉例與重要細節」"}, {"type": "free_text", "prompt": "1.先找出小主題：本課小主題可以直接從段落前的小標題找到，小標題是該段的核心概念，有助於找到段落內的舉例及重要細節。"}, {"type": "guide", "text": "小標題是：【 以氣味傳達真情意 】"}, {"type": "free_text", "prompt": "2.找出小主題下方的舉例與重要細節"}, {"type": "guide", "text": "花園裡，田野間，同樣的翩翩飛舞，飛蛾卻沒有蝴蝶那樣的漂亮迷人；牠們生命雖然短暫，總能圓滿完成繁殖後代的重責大任。雌蛾能分泌一種特別的氣味，利用空氣擴散傳布，讓在遠方的雄蛾，感受到她真摯的情意，願意千里迢迢的飛奔前來相會，完成終身大事。"}, {"type": "free_text", "prompt": "(1)找出舉例：整段都在描寫的動物是【  雌蛾  】。\n（若動物有多種詞彙，可思考是誰「用歌氣味求偶」呢？）"}, {"type": "free_text", "prompt": "(2)整理細節內容：【  分泌特別的氣味，吸引雄蛾       】"}, {"type": "free_text", "prompt": "(3)條列整理訊息："}, {"type": "guide", "text": "雌蛾         —     分泌特別的氣味，吸引雄蛾"}, {"type": "free_text", "prompt": "(4)加上小主題，將訊息寫清楚"}, {"type": "guide", "text": "用氣味求偶   —  雌蛾    —    分泌特別的氣味，吸引雄蛾"}, {"type": "guide", "text": "如果不小心卡關了，可以回到前一頁，仔細閱讀步驟說明，然後再試試看，加油！"}], "hist": {"guide": 17, "free_text": 17}, "n_blocks": 34, "n_q": 17, "layout": "standard", "stype": "summary_structure", "sname": "摘要策略-從結構找小主題與細節", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "—", "reasoning": "", "fix": "缺圖strip #2408", "table_gap": null}, {"code": "G6-L9", "title": "祝你好眠", "story_id": 19, "grade_code": "G6-L09", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L9.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L09.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手："}, {"type": "free_text", "prompt": "(1)課內練習"}, {"type": "guide", "text": "第四段：好好睡一覺，好處多多。每天晚上睡眠時，當你以為大腦在休息的時候，其實它正在默默的工作，它要修補勞累了一天的肌肉，調整身體各部分的運作，清除新陳代謝物。"}, {"type": "guide", "text": "請將關鍵句畫起來，本段的小主題是 充足睡眠的【　好處　　】。"}, {"type": "guide", "text": "第五段：雖然睡眠的重要性已廣為人知，但仍有一些似是而非的觀念讓人混淆。有種說法是：「平日熬夜沒關係，可以利用假日補眠。」然而有時早有時晚、有時長有時短的睡眠，會影響我們的生理時鐘。想像身體裡有一個看不見的時鐘，它會提醒身體何時睡眠、醒來、飢餓和分泌賀爾蒙等；如果經常擾亂生理時鐘的規律性，就會影響睡眠的品質。"}, {"type": "guide", "text": "請將關鍵句畫起來，這段的小主題是 大眾對睡眠的【錯誤觀念　】。"}, {"type": "free_text", "prompt": "(2)課外延伸"}, {"type": "guide", "text": "人一生當中約三分之一的時間都在睡眠，良好的睡眠不僅可消除疲勞、恢復體力，還能保護我們的大腦，修復全身器官系統功能、增強記憶、減少各種生理和心理的併發症、減少死亡率等，所以睡眠對人體的重要性不言可喻。"}, {"type": "guide", "text": "請將關鍵句畫起來，這段的小主題是【　　睡眠的重要性　　　　】。"}, {"type": "guide", "text": "如果你有失眠的困擾，不妨試試看下列的做法：每天適量的運動，幫助新陳代謝；晚餐後到睡前不宜飲用酒、咖啡、茶、可樂等刺激物，睡前可飲用一杯牛奶或小點心有益於安眠；養成規律的睡眠時間的時間，固定的時間上床躺平，讓腦袋放空，遠離3C產品，相信你的睡眠品質一定能大幅提升。"}, {"type": "guide", "text": "請將關鍵句畫起來，這段的小主題是【  　　改善失眠的方法　　】。"}, {"type": "guide", "text": "※結語：學會找出小主題，你可以更瞭解作者的寫作用意及文章的脈絡，也可以訓練我們邏輯判斷的能力，將可以更快、更準確的理解文章內容喔。"}], "hist": {"guide": 10, "free_text": 2}, "n_blocks": 12, "n_q": 2, "layout": "standard", "stype": "summary_keysentence", "sname": "摘要策略-從關鍵句找小主題", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G7-L1", "title" ": "所以塑膠不是短期問題，而是長期存在自然中的垃圾。"}, {"type": "guide", "text": "二、小試身手（二）"}, {"type": "passage", "source": "unknown", "paragraphs": ["上面我們用「三步驟」練習了一個觀點，在這篇文章中，作者還提出其他重要觀點。接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。"]}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "guide", "text": "三、推論主旨與寫作目的"}, {"type": "passage", "source": "unknown", "paragraphs": ["本文觀點的鋪陳，作者先說明塑膠污染的持久與無所不在，再指出回收不足與減塑困難的現實挑戰，最後提出個人行動仍有力量。這樣的安排讓我們理解──面對難題不能只等待國際協商，改變可以從自己開始。我們再回到全文，思考透過這樣的鋪陳，本文的主旨和的寫作目的是什麼？", "本文主旨是什麼？", "□①說明塑膠為生活帶來便利，應該繼續使用。\n②強調塑膠污染嚴重又持久，呼籲從生活實踐減塑以改善環境。", "作者寫作目的：", "作者希望我們未來可以怎麼做?", "①從日常小行動開始減塑，成為推動改變的人\n□②等待政府或國際協議解決塑膠問題。"]}, {"type": "guide", "text": "※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！"}, {"type": "self_check", "items": ["我能找到作者的觀點。", "我能找到支持該立場的證據。", "我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。"]}], "hist": {"guide": 10, "passage": 5, "single": 3, "free_text": 2, "figure": 1, "self_check": 1}, "n_blocks": 22, "n_q": 5, "layout": "standard", "stype": "main_idea_inference", "sname": "推論策略-找作者觀點和支持理由", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是「推論策略-找作者觀點和支持理由」的教學步驟，其中包含「小試身手」的練習題。練習題的文本明確標示為《塑膠，好用不好甩》，且題目內容與課文主題「塑膠進入環境後很難消失」及「樂高玩具落海」等細節完全吻合，顯示頁面忠實服務本課。", "fix": null, "table_gap": null}, {"code": "G7-L11", "title": "AI什麼都會，我們還要學什麼？", "story_id": 1090, "grade_code": "G7-L11", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L11.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L11.docx", "blocks": [{"type": "guide", "text": "一、作者在第一段提出了什麼「問題」？"}, {"type": "passage", "source": "unknown", "paragraphs": ["先看第一段：根據開頭「公民課月經討論」的情境，作者想讓讀者思考的問題是什麼？（請打勾，單選）"]}, {"type": "single", "prompt": "□①月經之所以被汙名化的原因是什麼？", "options": ["AI的功能越來越強，讓人懷疑是否還要學習？", "AI能快速整合資訊，讓人質疑AI的資訊都正確嗎？"], "answer": "AI的功能越來越強，讓人懷疑是否還要學習？"}, {"type": "guide", "text": "二、作者的回答：從各段標題找作者觀點、支持理由與隱含意義"}, {"type": "guide", "text": "步驟❶──找作者觀點"}, {"type": "single", "prompt": "請你看四、五段，作者的觀點是什麼？（請打勾，單選）", "options": ["AI懂回答，卻不懂發問，而「發問」才是思考與學習的起點。", "AI能在短時間提供各種資料與觀點，並且提供適當的評論。", "AI可以幫忙人類思考哪個觀點更有意義、更符合使用者需要。"], "answer": "AI懂回答，卻不懂發問，而「發問」才是思考與學習的起點。"}, {"type": "guide", "text": "步驟❷──找支持理由"}, {"type": "guide", "text": "祕訣：支持理由常出現在觀點後，通常是「事實、數據、例子、…」。"}, {"type": "passage", "source": "unknown", "paragraphs": ["找一找，第四、五段作者提出「AI不懂發問」的觀點，底下哪一選項是作者提出的支持理由？（請打勾，單選）"]}, {"type": "multi", "prompt": "請選擇", "options": ["AI能在很短的時間蒐集到大量資料，並列表整理出影響「月經汙名化」的各種歷史與文化的原因。", "AI能協助使用者快速完成「月經汙名化」報告與分析，並提供使用者它最推薦的說法，及進一步的搜尋建議。", "作者舉例，AI雖能列出「月經汙名化」的原因，但無法提出「生活中還有類似偏見嗎？」這類的重要的問題。"], "answer": ["AI能在很短的時間蒐集到大量資料，並列表整理出影響「月經汙名化」的各種歷史與文化的原因。", "AI能協助使用者快速完成「月經汙名化」報告與分析，並提供使用者它最推薦的說法，及進一步的搜尋建議。", "作者舉例，AI雖能列出「月經汙名化」的原因，但無法提出「生活中還有類似偏見嗎？」這類的重要的問題。"]}, {"type": "guide", "text": "步驟❸──推論隱含意義"}, {"type": "passage", "source": "unknown", "paragraphs": ["祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）"]}, {"type": "free_text", "prompt": "❶觀點：「AI時代，人類更要會發問。」"}, {"type": "free_text", "prompt": "❷理由：「只有人類會進一步追問，展現主動的思考與理解。」"}, {"type": "single", "prompt": "❸我讀到的結論是什麼？（請打勾，單選）", "options": ["我們要小心AI的錯誤資訊。", "學習的價值不在記住答案，而在能主動思考、提出問題。", "AI只要再進步一點，就會比人更會提問。"], "answer": "學習的價值不在記住答案，而在能主動思考、提出問題。"}, {"type": "guide", "text": "二、小試身手"}, {"type": "passage", "source": "unknown", "paragraphs": ["上面我們用「三步驟」練習了一個觀點，在這篇文章中，作者還提出其他重要觀點。接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。"]}, {"type": "guide", "text": "三、推論主旨與寫作目的"}, {"type": "passage", "source": "unknown", "paragraphs": ["本文的觀點鋪陳：作者先以「AI回答月經問題」開場，指出AI的能力令人驚嘆，卻也引發「我們還需要學習嗎？」的思考。接著從三個面向說明——發問、體驗、判斷——來強調人類學習的價值。最後呼應開頭，指出「學習」仍是人類探索與成長的起點。", "根據以上鋪陳，請你做適當推論，並在底下選出本文主旨。（單選）", "□①AI越進步，人類的學習的重點仍然不會有所變。\n②AI時代裡，人類的思考、體驗與判斷能力更為重要。", "□③學習的目的就是學會如何使用AI，以節省時間精力。", "推論作者寫作目的：作者希望我們未來可以怎麼做？（單選）", "①善用AI協助學習，並保有自己的思考與創造。\n□②把所有作業交給AI處理，節省時間。", "□③不再使用AI，完全回到傳統學習方式。"]}, {"type": "guide", "text": "※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！"}, {"type": "self_check", "items": ["我能找到作者的觀點。", "我能找到支持該立場的證據。", "我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。"]}], "hist": {"guide": 9, "passage": 5, "single": 3, "multi": 1, "free_text": 2, "self_check": 1}, "n_blocks": 21, "n_q": 6, "layout": "standard", "stype": "main_idea_inference", "sname": "推論策略-找作者觀點和支持理由", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的內容是「閱讀聚光燈」步驟，主題為「推論策略-找作者觀點和支持理由」。頁面上的問題和提示，例如「作者在第一段提出了什麼『問題』？」以及「根據開頭『公民課月經討論』的情境，作者想讓讀者思考的問題是什麼？」，都直接引用了本課課文《AI什麼都會，我們還要學什麼？》第一段的具體內容和情境。右側的選擇題也與課文主題相關，", "fix": null, "table_gap": null}, {"code": "G7-L12", "title": "你以為的浪漫可能是跟騷", "story_id": 1091, "grade_code": "G7-L12", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L12.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L12.docx", "blocks": [{"type": "guide", "text": "閱讀說明文或議論文時，讀出「作者的觀點」和「寫作目的」，才能完全理解文章。我們用底下❶～❹ 4個步驟來讀出「作者的觀點」和「寫作目的」。\n【❶選定焦點】→【❷推論立場】→【❸找支持證據】→【❹推論目的】\n(文章討論哪件事或議題)→(作者主張)→(用什麼說服我)→(想改變我什麼)\n    接下來，我們來學習這個超級重要的閱讀策略，來找出本文的作者觀點與目的。"}, {"type": "guide", "text": "一、推論本文作者觀點與目的"}, {"type": "guide", "text": "步驟❶──先看焦點"}, {"type": "free_text", "prompt": "1.問自己：這篇文章在談「哪件事」？"}, {"type": "free_text", "prompt": "2.祕訣：看標題＋開頭兩段，判斷主題關鍵字。"}, {"type": "guide", "text": "◎小試身手："}, {"type": "guide", "text": "〈你以為的浪漫，可能是跟騷〉，這篇文章在談哪件事？"}, {"type": "guide", "text": "浪漫與跟騷的區別  □浪漫的行為   □《跟蹤騷擾防治法》"}, {"type": "guide", "text": "步驟❷──推論作者立場（可和「步驟❸找支持證據」同時進行）"}, {"type": "free_text", "prompt": "1.問自己：作者對文章事件的看法是什麼？支持、反對？"}, {"type": "free_text", "prompt": "2.祕訣：(1)找出表達情緒語詞（開心/害怕…）或例子方向（好/壞）。"}, {"type": "free_text", "prompt": "(2)勾選立場。"}, {"type": "guide", "text": "◎小試身手"}, {"type": "free_text", "prompt": "(1)閱讀課文後，選出表達被跟騷者情緒的語詞（請打勾，複選）"}, {"type": "guide", "text": "轉身離開 　　壓力大　　輾轉難眠"}, {"type": "single", "prompt": "(2)判斷選出的語詞是正面或負面的    □正面   負面", "options": ["正面", "負面"], "answer": "負面"}, {"type": "single", "prompt": "(3)判斷作者看待跟騷的立場    □作者支持死纏   作者反對死纏", "options": ["作者支持死纏", "作者反對死纏"], "answer": "作者反對死纏"}, {"type": "guide", "text": "步驟❸──找支持證據"}, {"type": "free_text", "prompt": "1.問自己：作者用什麼說服我？"}, {"type": "free_text", "prompt": "2.祕訣：通常作者會用「案例、數據、法律、名言」當支持證據。"}, {"type": "guide", "text": "◎小試身手：找一找，本文用什麼證據說服讀者？（請打勾，複選）"}, {"type": "guide", "text": "真實案例　□名人採訪　法律條文　□影視數據"}, {"type": "guide", "text": "步驟❹──推論寫作目的"}, {"type": "free_text", "prompt": "1.問自己：作者想要影響我什麼？"}, {"type": "free_text", "prompt": "2.祕訣：呼籲句、結論段重點"}, {"type": "guide", "text": "◎小試身手"}, {"type": "free_text", "prompt": "(1)結尾呼籲：「如果真心喜歡，就從尊重開始！」"}, {"type": "free_text", "prompt": "(2)作者想讓我知道："}, {"type": "guide", "text": "□喜歡一個人要不顧一切、以浪漫方式追求"}, {"type": "guide", "text": "追求異性時，要尊重別人意願，避免觸法"}, {"type": "guide", "text": "二、挑戰題："}, {"type": "guide", "text": "再讀一個短文，看看你是否可以讀出作者的主要觀點和寫作目的。"}, {"type": "passage", "source": "unknown", "paragraphs": ["別讓紙吸管成為下一個塑膠袋", "為響應減塑，許多飲料店改用紙吸管。但不少消費者已養成用完即丟的習慣，因此常一次拿幾支吸管，以備不時之需。環保團體調查發現，一些觀光區紙吸管一週的垃圾量竟高於過去使用塑膠吸管時期。此外，多數紙吸管難以有效回收處理，最終仍將送進焚化爐。減塑真正該做的是「少用一次性吸管」，而非僅將材質從塑膠換成紙。下次點飲料前，先問自己──我真的需要吸管嗎？"]}, {"type": "guide", "text": "步驟❶──先看焦點"}, {"type": "free_text", "prompt": "1.問自己：這篇在談「哪件事」？"}, {"type": "free_text", "prompt": "2.這篇文章主要關注哪件事情？（請打勾，單選）"}, {"type": "guide", "text": "□塑膠袋污染  一次性吸管帶來的環境問題"}, {"type": "guide", "text": "步驟❷──推論作者立場"}, {"type": "free_text", "prompt": "1.問自己：作者看法是什麼？支持、反對？"}, {"type": "free_text", "prompt": "2.根據標題，作者態度是？（請打勾，單選）"}, {"type": "passage", "source": "unknown", "paragraphs": ["□紙吸管能解決塑膠污染問題"]}, {"type": "guide", "text": "應該減少使用一次性用品，而非僅更換材質"}, {"type": "guide", "text": "步驟❸──找支持證據"}, {"type": "free_text", "prompt": "1.問自己：作者用什麼說服我？"}, {"type": "free_text", "prompt": "2.文中哪兩項資訊用來支持作者立場？（請打勾，複選）"}, {"type": "guide", "text": "調查發現某些景點的紙吸管垃圾量甚至比塑膠吸管更多"}, {"type": "passage", "source": "unknown", "paragraphs": ["多數紙吸管仍難以有效回收，只能送入焚化爐", "□飲料店為消費者提供紙吸管，增加了消費成本"]}, {"type": "guide", "text": "步驟❹──推論寫作目的"}, {"type": "free_text", "prompt": "1.問自己：作者 "story_id": 1102, "grade_code": "G7-L23", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L23.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L23.docx", "blocks": [{"type": "guide", "text": "說明：\n閱讀的時候，如果文章出現很多不熟的新詞，越讀越卡時，該怎麼辦？這一課要練一個策略──「跳過卡關、先瀏覽全文」。這就好像吃魚的時候，魚刺很多的地方先跳過，先吃多肉無刺的地方。你繼續往下讀，也許就會發現，那些讓人頭疼的新詞或專有名詞，經常不會影響你的閱讀理解哦。\n底下的課文，就有一些艱深的詞彙，請你先讀一次。記得吃魚的比喻，多刺的地方先不要深究哦。"}, {"type": "figure", "referent": "table", "asset": "fig1.png", "bind_paragraph": null}, {"type": "guide", "text": "〈雨林裡的奇蹟藥物〉"}, {"type": "passage", "source": "unknown", "paragraphs": ["（段1）亞馬遜雨林的原住民，會用藤蔓中提煉出的「箭毒」製作毒箭。箭毒屬神經肌肉阻斷劑，拮抗乙醯膽鹼受體，它會阻斷神經肌肉傳導，中毒箭的動物會全身肌肉鬆弛，最後因呼吸衰竭而死。如今，現代醫院的外科醫師在手術中，卻把箭毒當作救命的藥物來使用，許多能治療白血病與其他癌症的強效藥物，也同樣來自雨林的植物。這讓科學家在世界各地的雨林中探索，尋找新的「奇蹟」藥物。"]}, {"type": "guide", "text": "Step 0：30秒快速瀏覽（先抓方向）"}, {"type": "free_text", "prompt": "1.任務：只抓「第一段大概在講什麼？」（約10–15字）"}, {"type": "guide", "text": "→我猜這段在講：  藤蔓中的箭毒可以治病"}, {"type": "guide", "text": "Step 1：標示卡關點（本課的粗體明示＋原因判斷）"}, {"type": "single", "prompt": "1.粗體的地方讀起來不容易，你覺得主要原因是什麼？（單選）", "options": ["醫學專有名詞密集，句子又長", "事件跳太快，我很難把前後接起來"], "answer": "醫學專有名詞密集，句子又長"}, {"type": "guide", "text": "Step 2：忽略卡關點再讀一次（不中斷）"}, {"type": "free_text", "prompt": "1.再讀一次第一段：看到粗體就先快速讀過，不要細究，直接往下讀。"}, {"type": "single", "prompt": "2.自我檢核：我有把第一段讀完（單選）", "options": ["有，我能順順讀完", "沒有，我還是卡在粗體處"], "answer": "有，我能順順讀完"}, {"type": "guide", "text": "Step 3：抓重點（重點句＋段意）"}, {"type": "single", "prompt": "1.重點句：第一段最關鍵的一句話？（單選）", "options": ["箭毒會讓動物全身肌肉鬆弛，最後甚至致死", "外科醫師在手術中，卻把箭毒當作救命的藥物", "科學家在世界各地雨林探索，尋找新的奇蹟藥物"], "answer": "外科醫師在手術中，卻把箭毒當作救命的藥物"}, {"type": "single", "prompt": "2.段意二選一（單選）", "options": ["雨林的致命箭毒，竟能被醫師用來救命，雨林可能藏著新藥。", "雨林裡的箭毒太可怕，所以大家應該遠離雨林，避免中毒。"], "answer": "雨林的致命箭毒，竟能被醫師用來救命，雨林可能藏著新藥。"}, {"type": "guide", "text": "Step 4：驗證：我真的懂了嗎？（不用看粗體字）"}, {"type": "single", "prompt": "1.這段最想強調的「反差」是什麼？（單選）", "options": ["致命的箭毒，竟能在醫療中變成救命藥", "原住民用毒箭狩獵，方法比現代人更厲害", "雨林植物很神祕，所以很多人想去冒險"], "answer": "致命的箭毒，竟能在醫療中變成救命藥"}, {"type": 這裡的水耕蔬菜不是用土種出來的，而是用營養液。輸送營養液的管路都有流量、溫度、酸鹼值、肥料濃度跟電導度的監測；溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。」他說，這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。以萵苣類作物為例，溫度常被控制在約18–25°C、濕度65–75%；營養液的酸鹼值大約維持在5.5–6.5；為了加速光合作用，室內二氧化碳濃度也控制在1000–1500ppm之間。", "（段5）「你的任務之一，」他把平板遞給她，「就是每天巡檢數據：看哪一區的酸鹼值或肥料配方偏離了、哪一層的溫溼度曲線不正常。問題能自己排除就儘快排除，必要時回報，讓值班同事去校正或調整配方。」宇晴盯著平板看，螢幕上跳動的數字像心電圖，她緊張的心情，忽然有了一種奇妙的踏實感：原來讀圖表、看趨勢、抓異常也是在種菜。"]}, {"type": "guide", "text": "Step0：30秒快速瀏覽（先抓方向）"}, {"type": "free_text", "prompt": "1.任務：只抓「第4～5段大概在講什麼？」（約10–15字）"}, {"type": "guide", "text": "→我猜第4～5段在講：  用高科技方式管理種菜"}, {"type": "guide", "text": "Step 1：標示卡點＋先往下讀"}, {"type": "free_text", "prompt": "1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。"}, {"type": "free_text", "prompt": "2.再讀一次第4～5段：看到你圈的地方先略過，直接往下讀，不要停。"}, {"type": "single", "prompt": "3.自我檢核：我有沒有把第4～5段讀完？（單選）", "options": ["有", "沒有"], "answer": "有"}, {"type": "guide", "text": "Step 2：抓第4段重點"}, {"type": "single", "prompt": "1.第4段最關鍵的一句話是？（單選）", "options": ["這裡的水耕蔬菜不是用土種出來的，而是用營養液。", "這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。", "溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。"], "answer": "這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。"}, {"type": "single", "prompt": "2.第4段你跳過的地方，最像哪一類訊息？為什麼可以跳過？（單選）", "options": ["一長串名詞/數字的列舉或舉例，屬於細節，所以先跳過也不影響理解", "一段在交代「要做哪些事」的流程內容，跳過也不影響理解"], "answer": "一長串名詞/數字的列舉或舉例，屬於細節，所以先跳過也不影響理解"}, {"type": "guide", "text": "Step 3：抓第5段重點"}, {"type": "passage", "source": "unknown", "paragraphs": ["小提示：第5段不像第4段是列舉細節；它在交代「她要做什麼工作」，所以要先抓「在做哪些事」，細節先放過。"]}, {"type": "free_text", "prompt": "1.第5段：先抓「宇晴在做什麼」，再抓「作者想告訴你什麼」"}, {"type": "single", "prompt": "（1）宇晴主要在做什麼工作？（單選）", "options": ["每天巡檢數據，找出偏離與不正常的地方。", "螢幕上的數字像心電圖，她感到踏實。"], "answer": "每天巡檢數據，找出偏離與不正常的地方。"}, {"type": "single", "prompt": "（2）作者想告訴你什麼（這段最重要的一句話）？（單選）", "options": ["必要時回報，讓值班同事校正或調整配方。", "原來讀圖表、看趨勢、抓異常也是在種菜。"], "answer": "原來讀圖表、看趨勢、抓異常也是在種菜。"}, {"type": "single", "prompt": "2.第5段你跳過的地方，是哪一類訊息？為什麼可以跳過？（單選）", "options": ["是補充細節；先跳過也不影響理解工作內容。", "是主要流程；先跳過就會看不懂她在做什麼。"], "answer": "是補充細節；先跳過也不影響理解工作內容。"}, {"type": "guide", "text": "Step 4：合併兩段：抓段意"}, {" stic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的閱讀文本內容與提供的課文《未來的農夫》的第四、五段完全一致，包括「大仁哥，是工程師兼『科技農夫』」和「你的任務之一，他把平板遞給她」等關鍵句。頁面上的問題也圍繞著這兩段課文內容，例如詢問「第4~5段大概在講什麼？」和「第4段最關鍵的一句話是什麼？」。整體內容與排版都忠實服務於本課。", "fix": null, "table_gap": null}, {"code": "G7-L25", "title": "當全世界都在笑你，你可以怎麼做？", "story_id": 1105, "grade_code": "G7-L25", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L25.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L25.docx", "blocks": [{"type": "guide", "text": "你以前學過用「問題—解決—結果」抓文章重點。這篇文章也有相同結構，只是換了比較貼近生活的名稱：\n困擾=問題；策略=解決；改變=結果\n閱讀時，只要掌握這個結構，就可以快速抓到文章的重點，並進一步推論出主旨或作者意圖喔。\n請你先試著連連看，把左邊「元素」和右邊「關鍵概念」連起來。"}, {"type": "guide", "text": "一、找重點：困擾→策略→改變"}, {"type": "guide", "text": "表：本課的結構：困擾→策略→改變"}, {"type": "guide", "text": "二、推論主旨與作者意圖"}, {"type": "single", "prompt": "1.根據你找到的重點，這篇文章的主旨是什麼（本文在說什麼）？（單選）", "options": ["安海瑟薇得獎後被討厭，所以名人都很辛苦。", "網路霸凌會擴散放大並傷人，作者教你自保並走向復原。", "遇到霸凌時，只要退出群組就能立刻解決問題。", "網路世界太可怕，所以最好完全不上網。"], "answer": "網路霸凌會擴散放大並傷人，作者教你自保並走向復原。"}, {"type": "single", "prompt": "2.本文作者意圖（作者想影響你什麼？）（4選2）", "options": ["讓你知道「求助不是示弱」，遇到霸凌不要獨自硬撐。", "鼓勵你立刻回嗆到底，才不會被看扁。", "提醒你先停損、冷處理並蒐證，避免衝突升溫。", "要你學會模仿明星受訪的表情管理，避免被剪短片。"], "answer": "讓你知道「求助不是示弱」，遇到霸凌不要獨自硬撐。"}, {"type": "guide", "text": "※區分主旨和作者意圖（很重要）"}, {"type": "passage", "source": "unknown", "paragraphs": ["主旨：這篇「在說什麼重點」。", "意圖：作者「希望你怎麼想、怎麼做」。"]}, {"type": "single", "prompt": "請選擇", "options": ["我能根據文章的結構（困擾、策略、改變）找到文章重點。", "我能根據文章重點推論出文章主旨和作者意圖。"], "answer": "我能根據文章的結構（困擾、策略、改變）找到文章重點。"}], "hist": {"guide": 5, "single": 3, "passage": 1}, "n_blocks": 9, "n_q": 3, "layout": "standard", "stype": "summary_pse", "sname": "摘要策略-問題解決結構找重點", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「摘要策略-問題解決結構找重點」的教學引導，並以本課《當全世界都在笑你，你可以怎麼做？》的內容作為練習文本。頁面上的選擇題選項和作者意圖的描述，都與本課課文內容高度相關，例如提到「安海瑟薇得獎後被討厭」、「網路霸凌會擴散放大並傷人」、「求助不是示弱」等 ade_code": "G7-L30", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L30.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L30.docx", "blocks": [{"type": "guide", "text": "說明：閱讀有圖或有表的文章時，不能只看文字，而要來回比對圖、表與文章內容，理解彼此之間的關係。這樣不但能更快掌握重點，也能更正確地回答問題。這一課，我們將以〈都是八哥，為什麼命運不一樣？〉為例，學習有表格文章的閱讀方法。"}, {"type": "figure", "referent": "image", "asset": "fig1.png", "bind_paragraph": "第30課   都是八哥，為什麼命運不一樣？"}, {"type": "guide", "text": "這篇文章裡，文字、圖片和表格都提供了重要訊息。閱讀時，不能只看文字，也不能只看圖片或表格，而要先注意文字怎麼提醒你看圖表、怎麼告訴你圖表的功能，再把文字、圖片、表格連起來想。\n這一課我們用下面4個步驟，練習圖文表整合閱讀：\n❶先讀文字——抓出這段的重點\n❷找出相關圖表——判斷各自提供什麼訊息\n❸文圖表對照——從圖表中找到和文字對應的資訊\n❹整合多種材料——比較、連結各項資訊之間的關係"}, {"type": "figure", "referent": "image", "asset": "fig1.png", "bind_paragraph": "練習一：第一段 vs 圖一"}, {"type": "guide", "text": "練習一：第一段 vs 圖一"}, {"type": "single", "prompt": "1.圖一最主要提供哪一類訊息？（單選）", "options": ["兩種八哥外形相近的整體印象", "兩種八哥近年的族群變化情形"], "answer": "兩種八哥外形相近的整體印象"}, {"type": "single", "prompt": "2.讀完第一段後，請你找出和圖一最相關的文字。（單選）", "options": ["白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。", "這兩種八哥外形十分相似，不容易單靠外表一眼分辨。"], "answer": "這兩種八哥外形十分相似，不容易單靠外表一眼分辨。"}, {"type": "figure", "referent": "table", "asset": "table1.json", "bind_paragraph": "練習二：第二段 vs 表一"}, {"type": "guide", "text": "練習二：第二段 vs 表一"}, {"type": "guide", "text": "步驟❶：先讀文字——抓出這段的重點"}, {"type": "guide", "text": "小祕訣：含有表格的文章經常會告訴讀者，哪些地方要看表。當你讀到「表一」的提示時，你知道等一下要轉去看表一，並問自己這段要你看表的什麼？"}, {"type": "free_text", "prompt": "1.請把第二段文字中，要你看表的地方畫線或圈起來"}, {"type": "single", "prompt": "2.這段要你看表的什麼？（單選）", "options": ["八哥的外形與習性", "八哥的數量變化"], "answer": "八哥的外形與習性"}, {"type": "guide", "text": "步驟❷：再看表一——讀懂這張表告訴我們什麼訊息"}, {"type": "guide", "text": "小祕訣：看表時，要先讀表格「標題」、再讀「第一列」和「第一欄」的小標題，判斷一下這個表在比較什麼，最後讀表格裡的內容。"}, {"type": "single", "prompt": "1.表一主要提供的是哪一類訊息？（單選）", "options": ["白尾八哥和臺灣冠八哥近年的族群變化", "白尾八哥和臺灣冠八哥的異同"], "answer": "白尾八哥和臺灣冠八哥的異同"}, {"type": "guide", "text": "步驟❸：文圖表對照——從圖表中找到和文字對應的資訊"}, {"type": "passage", "source": "unknown", "paragraphs": ["在表一找到對應文字說明的訊息，必要時回頭看圖一，看看表格怎麼幫助你把文字讀得更清楚。"]}, ]}, {"type": "self_check", "items": ["我會找出文章裡要看圖表的地方。", "我會從圖表中找到和文字對應的訊息。", "我會讀圖、表的註解，也知道註解的功能。", "我會把文圖表合起來想，判斷它們的重點。", "我知道圖片和表格的功能不同：本文圖片先提供整體印象，表格能幫助我把訊息看得更清楚。"]}], "hist": {"guide": 21, "figure": 5, "single": 19, "free_text": 4, "passage": 2, "self_check": 1}, "n_blocks": 52, "n_q": 23, "layout": "graphic-text", "stype": "table_text", "sname": "圖文表整合閱讀策略", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "faithful", "reasoning": "截圖內容明確指出是「閱讀聚光燈」步驟，並以「都是八哥，為什麼命運不一樣？」為例，教授圖文表整合閱讀策略。頁面中的圖片是八哥，文字內容也圍繞著八哥的圖文閱讀策略和相關問題，與本課主題完全一致。排版正常，圖片也成功載入。", "fix": "真圖綁回(GCS) 八哥", "table_gap": "table1/2.json 缺"}, {"code": "G7-L4", "title": "從〈螞蟻與蟋蟀〉看生命的多樣性", "story_id": 1083, "grade_code": "G7-L4", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L4.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L4.docx", "blocks": [{"type": "guide", "text": "本練習將引導你運用「用表格整理訊息」的策略，將課文摘要中的內容進行結構化整理。"}, {"type": "single", "prompt": "根據課文摘要，這篇文章主要在比較哪兩種生物？請選出正確的對象。", "options": ["螞蟻和蜜蜂", "螞蟻和蟋蟀", "蟋蟀和蝴蝶"], "answer": "螞蟻和蟋蟀"}, {"type": "single", "prompt": "在課文摘要中，關於螞蟻的『集體行動』與『力量』，下列哪一項描述是正確的？", "options": ["螞蟻喜歡獨自行動，力量微小。", "螞蟻集體出動，能扛起比自己體重大上數十倍的食物。", "螞蟻集體行動，但力量不大。"], "answer": "螞蟻集體出動，能扛起比自己體重大上數十倍的食物。"}, {"type": "single", "prompt": "根據課文摘要對螞蟻和蟋蟀的描述，最適合用來比較牠們的『主題』是什麼？", "options": ["外觀與體型", "覓食習慣與棲息地", "社會結構與繁衍策略"], "answer": "社會結構與繁衍策略"}, {"type": "free_text", "prompt": "如果我們選擇『生存與繁衍策略』作為比較主題，請簡述螞蟻在這一主題下的主要策略。"}, {"type": "free_text", "prompt": "承上題，請簡述蟋蟀在『生存與繁衍策略』這一主題下的主要策略。"}], "hist": {"guide": 1, "single": 3, "free_text": 2}, "n_blocks": 6, "n_q": 5, "layout": "standard", "stype": "comparison", "sname": "用表格整理訊息", "method": "Gemini guided_steps(LLM #1418)→block 轉換器", "method_src": "scripts/spotlight_convert_guided_steps.py", "verdict": "faithful_fixed", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「用表格整理訊息-比較異同」的閱讀策略教學，並明確指出「現在就讓我們利用本課文章來練習看看吧!」。雖然在步驟說明中提到「L3女性太空人登月」作為範例，但頁面主體是通用策略教學，且最後引導學生應用於本課，因此判斷為 faithful。", "fix": "shadowed→5題 #2406", "table_gap": null}, {"code": "G7-L5", "title": "爺爺奶奶來了以後", "story_id": 1084, "grade_code": "G7-L5", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L5.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L5.docx", "blocks": [{"type": "guide", "text": "本篇文章描述了三代同堂後的種種改變和適應。每一段都有獨立、清楚的主題，並且舉例說明改變後的影響，使文章更具說服力。\n    但是你發現了嗎？本篇文章的細節訊息很多，大腦的容量有限，如果可以將這些訊息用表格整理下來，找出改變前後的差異，將能幫助我們對本課更有印象，也能更清楚本課的重點。\n    我們已在「L2澳洲奧運金牌的Ｘ機密」、「L3女性太空人登月」學過了用表格整理訊息，可以參考下方兩個步驟\n    步驟1：在從段落重點句判斷每段重要主題。\n    步驟2：從段落關鍵句找文章細節。\n現在就讓我們利用這兩個步驟將本課訊息整理成表格吧！"}, {"type": "guide", "text": "◎ 小試身手："}, {"type": "free_text", "prompt": "1.將課文第三、四、五段內容整理成表格。（單選）"}, {"type": "free_text", "prompt": "2.將課文第六段內容整理成表格。"}, {"type": "free_text", "prompt": "3.總結：爺爺奶奶與作者一家生活習慣有著很大的　　差異　，最後作者琢磨的相處之道是　　傾聽　　不同世代的聲音，　設身處地　　為他人著想。"}], "hist": {"guide": 2, "free_text": 3}, "n_blocks": 5, "n_q": 3, "layout": "standard", "stype": "info_organization", "sname": "用表格整理訊息-從細節歸納標題列名稱", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "figure_broken", "reasoning": "頁面中間出現一個明顯的「圖片載入失敗」圖示，顯示圖片未能成功載入。雖然文字內容與本課《爺爺奶奶來了以後》相關，但破圖是視覺上的嚴重缺陷。", "fix": "破圖佔位strip #2408", "table_gap": null}, {"code": "G7-L8", "title": "科學怪人", "story_id": 32, "grade_code": "G7-L08", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L8.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L08.docx", "blocks": [{"type": "guide", "text": "你是否有過想要回答問題，卻總是說不清楚的時刻呢？如何清楚表達自己的看法，其實也有小技巧喔！這次我們要練習用PREP的方法來表達，究竟什麼是PREP呢？\nＰ是Point（主張）：先說出自己對於這個問題的看法，我覺得…\nＲ是Reason（原因）：說明自己這麼認為的原因，因為……\nＥ是Example（舉例）：原因的延伸舉例或想法，可以是自己的生活經驗或閱讀到的書籍內容。（有時可省略）\nＰ是Point（結論）：再說一次自己對於這個問題的看法，所以…"}, {"type": "free_text", "prompt": "1.有兩個人根據問題給出了答案，請你幫忙完成表格內容。"}, {"type": "free_text", "prompt": "2.小試身手：你認為書名的「科學怪人」是指怪物，還是那位瘋狂科學家呢？"}, {"type": "guide", "text": "我覺得書名的科學怪人指的       瘋狂科學家           （P主張），"}, {"type": "guide", "text": "因為小說原本的書名是弗蘭坎斯坦這是瘋狂科學家的名字     （R原因），"}, {"type": "guide", "text": "他是這篇文章的主角，小說中文翻譯又是科學怪人         （E舉例），"}, {"type": "guide", "text": "所以        我覺得科學怪人是指瘋狂科學家               （P結論）。"}], "hist": {"guide": 5, "free_text": 2}, "n_blocks": 7, "n_q": 2, "layout": "standard", "stype": "express_opinion", "sname": "表達看法-PREP架構", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G7-L9", "title": "吐瓦魯：逐漸被淹沒的島國", "story_id": 33, "grade_code": "G7-L09", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L9.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G7-L09.docx", "blocks": [{"type": "guide", "text": "反思的能力很重要，它能幫助我們發現自己的問題，進而思考：我可以怎麼做？\n    作者看到吐瓦魯的報導也進行了反思，他想到臺灣也受到全球暖化的威脅，認為對抗全球暖化是全人類的共同議題。\n    反思很重要，但該怎麼做呢？反思也可以透過步驟來練習喔！接下來我們要介紹「4F反思法」。\n1.事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。\n2.感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？\n3.發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？\n4.未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？"}, {"type": "guide", "text": "◎小試身手："}, {"type": "guide", "text": "1.請你利用課文來練習4F反思法，幫忙填入「未來（Future）」的格子內，能有什麼行動預防全球暖化吧。"}, {"type": "free_text", "prompt": "2.報導反思挑戰：請閱讀以下新聞，並練習4F反思法完成表格。"}, {"type": "guide", "text": "世展會調查　缺糧後，兒童淪為童婚、童工的風險大増"}, {"type": "guide", "text": "陳芝瑄／臺北報導(2024/6/20)"}, {"type": "guide", "text": "世界展望會六月發布的「缺糧」報告指出，在六個亟需協助的國家中，許多家庭每天只能吃一頓飯；每三名受訪者中有兩人因沒東西吃而必須餓肚子入睡；更有46%的家庭一整天沒進食。此外，救援工作者觀察到，兒童淪為童婚、性暴力和兒童販運的風險大幅增加。"}, {"type": "guide", "text": "報告指出，兒童遭受更多暴力、忽視或虐待；烏干達一個地區有75%的難民，家中有懷孕的未成年女兒，因為她們被迫童婚，或從事性交易以換取食物；阿富汗更有97%的父母因糧食不足，只好提前把養不起的女兒嫁掉。在烏干達，有些父母因為孩子沒東西吃，壓力過大而輕生。"}, {"type": "guide", "text": "世界展望會「全球飢餓回應方案」總監指出，氣候變遷、衝突和新冠疫情，讓3800萬人距離餓死僅剩一步之遙，其中1900萬是兒童，被送去工作或結婚，甚至不堪缺糧之苦而想結束生命，人道救援正努力遏止悲劇發生。"}, {"type": "guide", "text": "<本文節選自國語日報網路新聞https://reurl.cc/bVLQzy>"}, {"type": "free_text", "prompt": "3.生活反思挑戰：日常生活中親身體驗或看到的事件，也可以運用4F反思法，寫出一件你最近遇到或看到的事件，並進行反思、完成下列表格。"}], "hist": {"guide": 9, "free_text": 2}, "n_blocks": 11, "n_q": 2, "layout": "standard", "stype": "express_opinion", "sname": "表達看法-4F思考法", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G8-L1", "title": "致台東：一封過客的情書", "story_id": 1111, "grade_code": "G8-L1", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L1.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L1.docx", "blocks": [{"type": "guide", "text": "寫作常見的手法--譬喻、轉化和誇飾修辭，都是運用聯想、想像力的方式，來聯想連結讀者普遍的經驗，以引起讀者共鳴，讓讀者感同身受。\n　　轉化修辭中的擬人是常見的聯想方式。擬人主要將動、植物或無生命之物想像成人，或是對它投射情感，就像我們對小時候的玩具或娃娃一樣，可能會幫它命名、跟它說話，把它當作人一樣對待。\n    而文章使用擬人之處，也是作者投入想像和感情之重點處，像是這篇文章將台東聯想成心愛的對象，進而對其傾訴，因此閱讀時我們可以留意擬人的句子，推論作者主要想傳達的感受或意涵。"}, {"type": "guide", "text": "◎ 小試身手"}, {"type": "guide", "text": "試試看，從這篇文章的擬人句讀出原先的客觀事實，再找出其中的聯想，並推論作者背後想表達的意涵："}, {"type": "single", "prompt": "根據原文說明，下列何者最符合「擬人」修辭的定義？", "options": ["將兩種不同事物進行比較，使描述更生動。", "將動、植物或無生命之物想像成人，或對其投射情感。", "誇大事物的特徵或數量，以加強語氣或效果。"], "answer": "將動、植物或無生命之物想像成人，或對其投射情感。"}, {"type": "single", "prompt": "原文指出，作者使用擬人手法的目的為何？", "options": ["讓文章內容更客觀，避免主觀情感。", "運用聯想、想像力，引起讀者共鳴，讓讀者感同身受。", "使文章結構更嚴謹，增加閱讀難度。"], "answer": "運用聯想、想像力，引起讀者共鳴，讓讀者感同身受。"}, {"type": "free_text", "prompt": "根據課文摘要，請找出一個將「台東」或其相關事物「擬人化」的句子，並說明你判斷的理由。"}], "hist": {"guide": 3, "single": 2, "free_text": 1}, "n_blocks": 6, "n_q": 3, "layout": "standard", "stype": "writing_technique", "sname": "寫作手法：擬人－從擬人推論文章意涵", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容明確指出「寫作手法：擬人一從擬人推論文章意涵」，並在說明中提及「這篇文章將台東聯想成心愛的對象」，這與本課《致台東：一封過客的情書》的主題完全吻合。頁面上的題目也圍繞著擬人修辭的定義和目的，以及從課文中找出擬人化的句子，這些都忠實地服務於本課的教學目標。", "fix": null, "table_gap": null}, {"code": "G8-L11", "title": "科學辦案：破解蝴蝶蘭的花期密碼", "story_id": 1124, "grade_code": "G8-L11", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L14.pdf", "docx": null, "blocks": [{"type": "guide", "text": "上一課《構樹》告訴我們：有些說明文像科學偵探故事。作者先提出「問題」，再提出「假設」，接著用證據「驗證假設」，最後下「結論」；閱讀時要看懂「證據是否能支持（或推翻）假設」。\n這課我們要學一樣的策略，用4個步驟把「解決科學問題的過程」整理清楚。你還記得這些步驟的關鍵概念或提示嗎？請連連看。"}, {"type": "guide", "text": "一、找問題→找假說→找驗證→下結論"}, {"type": "guide", "text": "表：本課的科學解決四步驟：找問題→找假說→找驗證→下結論"}, {"type": "guide", "text": "二、應用（把結論帶回現場：問題→解決→結果）"}, {"type": "passage", "source": "unknown", "paragraphs": ["前面我們用科學步驟找出「低溫能催花」。再來是把結論應用到現場。但農民遇到了新的問題，請根據課文寫出他們如何解決問題。"]}, {"type": "free_text", "prompt": "1.問題：    花房面積大，冷氣電費成本太高"}, {"type": "free_text", "prompt": "2.解決："}, {"type": "guide", "text": "①把平地蘭花送到高海拔蘭園降溫"}, {"type": "guide", "text": "②   在高海拔地方設置蘭園"}, {"type": "guide", "text": "③   用深層海水降溫"}, {"type": "free_text", "prompt": "3.結果：用大自然降溫，降低電費負擔，也能順利催花。"}, {"type": "guide", "text": "□①我能用四步驟整理文章：找問題→找假說→找驗證→下結論"}, {"type": "guide", "text": "□②我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。"}], "hist": {"guide": 9, "passage": 1, "free_text": 3}, "n_blocks": 13, "n_q": 3, "layout": "standard", "stype": "scientific_inquiry", "sname": "解決問題-科學探究法", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "faithful", "reasoning": "截圖內容忠實地呈現了本課的學習策略「解決問題-科學探究法」，並引用了課文中的「低溫能催花」作為應用範例。頁面上的問題、解決、結果等欄位也與課文內容相符，排版正常，沒有破圖或空白骨架。", "fix": "rebind還原科學探究法 #2407", "table_gap": null}, {"code": "G8-L12", "title": "", "story_id": null, "grade_code": "G8-L12", "pdf": null, "docx": null, "blocks": [{"type": "guide", "text": "這篇課文和上一篇虎襲課文一樣，作者沒有一開始就直接告訴你他的想法，反而先安排一連串吸引讀者注意的例子，為同一個觀點鋪路。所以，這一課你要學習的，仍然是下面這個策略，請你默讀一次。\n從作者反覆舉的例子中，推論他真正想表達的觀點。\n   語言的足跡這篇文章，作者仍然是透過反覆的例子，來表達一個特定的想法。我們再練習一次，用❶～❸的步驟「推論（歸納）作者的觀點」。\n   【❶找例子】 【❷找共同點】【❸推論觀點】"}, {"type": "guide", "text": "一、步驟❶──找例子"}, {"type": "passage", "source": "unknown", "paragraphs": ["A.作者在文中舉了不少語詞例子。請勾選這些語詞「出現在哪些地區」，\n為下一步找出它們的共同點做準備。（複選）"]}, {"type": "passage", "source": "unknown", "paragraphs": ["B.第五段用來說明「音變很常見」的兩個生活例子（請打勾，複選）\n   那個→辣個　很熱→很樂　□ 很冷→很勒"]}, {"type": "guide", "text": "➡小祕訣：看到「例如、就像、亦然」常常就是例子要出現了。"}, {"type": "guide", "text": "二、步驟❷──找這些例子的共同點："}, {"type": "guide", "text": "作者想讓我們注意到這些例子什麼共同點？（請勾選，單選）"}, {"type": "passage", "source": "unknown", "paragraphs": ["①南島語族分布在不同地區，卻出現相似發音的詞彙", "□②例子顯示語言會一直改變，無法留下任何線索", "□③例子來自不同語言，所以彼此沒有關聯"]}, {"type": "guide", "text": "三、步驟❸──推論作者觀點"}, {"type": "guide", "text": "□①萬華地名的重點，在於日治時期的改名過程。"}, {"type": "guide", "text": "②南島語族雖分散在各地島嶼，卻擁有部分相似語彙，這些語言線索可推知他們曾經是一家人。"}, {"type": "guide", "text": "□③不同島嶼的語言之所以相似，是因為受到外來力量的共同影響。"}, {"type": "guide", "text": "□④語言會隨時間改變，因此難以用來追查來源與歷史。"}, {"type": "guide", "text": "※ 如果你三項都打勾，恭喜你，"}, {"type": "passage", "source": "unknown", "paragraphs": ["表示你已經學會用 3 步驟「從例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！"]}, {"type": "figure", "referent": "table", "asset": "fig2.png", "bind_paragraph": null}, {"type": "self_check", "items": ["我能找出文章中作者反覆舉出的例子。"]}], "hist": {"guide": 11, "passage": 4, "figure": 1, "self_check": 1}, "n_blocks": 17, "n_q": 0, "layout": null, "stype": "main_idea_inference", "sname": "推論策略-從例子推論作者觀點", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G8-L13", "title": "我能不能選擇告別方式?", "story_id": 1127, "grade_code": "G8-L13", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L17.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L13.docx", "blocks": [{"type": "guide", "text": "一、確定議題"}, {"type": "free_text", "prompt": "1.這篇文章在談「哪個議題／爭議」"}, {"type": "guide", "text": "對安樂死或協助自殺的看法"}, {"type": "guide", "text": "二、找觀點"}, {"type": "passage", "source": "unknown", "paragraphs": ["議題文章是在「說服」讀者：每一方會先表明立場與主張，再用理由說服。接著請你整理這個議題有哪些立場？每個立場的主張和理由是什麼？"] 看，「作者很怕阿嬤」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」，最近的流行語叫做「腦補」哦。\n閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！\n這篇故事，描述了作者和阿嬤之間的互動，故事沒有把他們的關係和想法講白，而是把線索藏在對話、動作和反應裡。\n接下來要做的就是抓住這些線索，推論作者和阿嬤的關係如何改變，並進一步理解作者真正想傳達的意思。"}, {"type": "guide", "text": "二、把三個階段串連起來看歷程。(單選)"}, {"type": "free_text", "prompt": "1.互動方式變化（關係）："}, {"type": "passage", "source": "unknown", "paragraphs": ["請選出最符合本文「作者×阿嬤」互動方式的變化？", "噤聲不敢回→能提出不同想法→能幽默接住刻薄", "□②噤聲不敢回→越來越反感→逐漸疏離對立"]}, {"type": "free_text", "prompt": "2.想法變化路線："}, {"type": "passage", "source": "unknown", "paragraphs": ["本文中「作者對阿嬤的想法」，變化歷程為何？(單選)"]}, {"type": "guide", "text": "□覺得被討厭→覺得溝通無用→決定遠離她"}, {"type": "guide", "text": "②先求不挨罵→不再句句當真、看懂她的愛→理解脈絡並重新詮釋"}, {"type": "guide", "text": "三、從上述作者觀點轉變歷程，本文最想提醒讀者的是什麼?(單選)"}, {"type": "guide", "text": "人不會被早期經驗決定一輩子；我們可以選擇怎麼理解自己的童年"}, {"type": "guide", "text": "□②長輩多半愛挑剔，孩子只能忍耐，關係很難改變"}, {"type": "guide", "text": "□③心理韌性靠打罵養成，受過嚴格管教的人一定更強"}, {"type": "guide", "text": "□④當兵最能鍛鍊意志，因此比讀書更能改變一個人"}, {"type": "self_check", "items": ["我會根據對話、語氣、動作與反應，推論作者和阿嬤的關係。", "我會把文章線索前後連起來，推論角色關係變化歷程。", "我能從關係變化推到作者的觀點轉變，並進一步推論本文的主旨。"]}], "hist": {"guide": 9, "free_text": 2, "passage": 2, "self_check": 1}, "n_blocks": 14, "n_q": 2, "layout": null, "stype": "main_idea_inference", "sname": "推論策略-推論角色關係與觀點", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G8-L17", "title": "", "story_id": null, "grade_code": "G8-L17", "pdf": null, "docx": null, "blocks": [{"type": "guide", "text": "一、確定議題"}, {"type": "free_text", "prompt": "1.這篇文章在談「哪個議題／爭議」"}, {"type": "guide", "text": "對安樂死或協助自殺的看法"}, {"type": "guide", "text": "二、找觀點"}, {"type": "passage", "source": "unknown", "paragraphs": ["議題文章是在「說服」讀者：每一方會先表明立場與主張，再用理由說服。接著請你整理這個議題有哪些立場？每個立場的主張和理由是什麼？"]}, {"type": "guide", "text": "三、比較觀點差異（用「價值／風險」兩個角度）"}, {"type": "passage", "source": "unknown", "paragraphs": ["我們先用「主張＋理由」掌握每一方在說什麼；再追問理由在強調什麼──重視的價值與擔心的風險。用這兩個角度看， A：外在很糟」推向「B：內在仍能…」。用A襯托B，讓B成為重點。", "以下例子，請你圈出或補上轉折詞，再判斷作者透過這些例子要凸顯什麼概念？"]}, {"type": "guide", "text": "（二）概念→主旨：五個概念是否能支持主旨？"}, {"type": "guide", "text": "主旨：外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇"}, {"type": "passage", "source": "unknown", "paragraphs": ["主旨是一句話，但你要看見：前面的概念如何共同支撐它：在壞事不可逆轉時，我仍可決定什麼？（以下均為單選）"]}, {"type": "figure", "referent": "table", "asset": "fig2.png", "bind_paragraph": null}, {"type": "guide", "text": "四、我的發現："}, {"type": "single", "prompt": "1.我學到的「方法流程」最接近哪一項？（單選）", "options": ["先看結尾主旨，再回頭找一兩個例子當佐證。", "先看文章結構與主旨，再用轉折抓重點，推成概念並回扣主旨。", "先找到每段重點，再把看起來相似的句子圈起來整理。"], "answer": "先看文章結構與主旨，再用轉折抓重點，推成概念並回扣主旨。"}, {"type": "single", "prompt": "2.用一句話統整：這些例子共同要支持的主張是什麼？（單選）", "options": ["外在再艱難，只要互相扶持，痛苦就會慢慢減少變淡。", "外在可能被奪走，但仍能在內在做選擇，決定如何回應遭遇。", "外在越痛苦，越要保持樂觀，才能不被情緒拖垮。"], "answer": "外在可能被奪走，但仍能在內在做選擇，決定如何回應遭遇。"}, {"type": "single", "prompt": "3.下次遇到「很多例子、最後才總結」的文章，我會怎麼讀？（複選）", "options": ["我先找導入問題與總結主旨，再看例子如何支持主旨。", "我看到但／卻／仍／就算／原來，就提醒自己：重點多半在轉折後。", "我把每個例子推出概念，再檢查這些概念能不能一起撐住主旨。", "我先記住每個故事情節，主旨通常就會自然看懂。"], "answer": "我先找導入問題與總結主旨，再看例子如何支持主旨。"}], "hist": {"guide": 11, "passage": 3, "fill_table": 1, "single": 5, "figure": 1}, "n_blocks": 21, "n_q": 6, "layout": null, "stype": "writing_technique", "sname": "寫作手法：看見文章結構與主旨支撐鏈", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G8-L3b", "title": "新奇!「植物肉」你聽過嗎?", "story_id": 1114, "grade_code": "G8-L3b", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L4.pdf", "docx": null, "blocks": [{"type": "guide", "text": "這一課是說明文，作者先告訴讀者植物肉引發的風潮，再用具體的例子去支持作者種種的看法（觀點），讓文章更有說服力。所以，閱讀時，如果能找出作者觀點，並從文章中找出支持觀點的理由，你會更容易讀出文章的重點喔。\n    ※什麼是觀點和理由？"}, {"type": "guide", "text": "◎ 小試身手"}, {"type": "guide", "text": "一、下圖中，左邊列出三個課文的觀點，請在右邊找到這些觀點的支持理由，並畫線連起來。"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "guide", "text": "二、由課文觀點找出支持理由"}, {" ", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L1.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L01.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手"}, {"type": "guide", "text": "讀完文章後，我們一起來追查凱蒂案吧。"}, {"type": "free_text", "prompt": "1.你從哪裡可以判斷凱蒂案可能是一則假新聞?"}, {"type": "guide", "text": "誇張聳動的標題  太過真實的目擊者數據  匪夷所思的社會冷漠。"}, {"type": "free_text", "prompt": "2.你認為記者可能為了什麼目的寫出這則假新聞呢？（多選）"}, {"type": "guide", "text": "想搶得獨家頭條　 想提高報紙的購買率　 □指責警方辦事不力"}, {"type": "guide", "text": "懶得查證、直接寫故事比較快　 帶有個人立場（想指責社會的冷漠）。"}], "hist": {"guide": 5, "free_text": 2}, "n_blocks": 7, "n_q": 2, "layout": "standard", "stype": "sel_character", "sname": "媒體素養與識讀-辨識假新聞", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G9-L11", "title": "見前人所未見—達爾文與長喙天蛾的故事", "story_id": 1140, "grade_code": "G9-L11", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L11.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L11.docx", "blocks": [{"type": "guide", "text": "這篇典型的科學探討文章，描述了科學史上一個膾炙人口的故事——達爾文見到一朵從未見過的蘭花，因而推測一種長喙天蛾的存在，這個推測在數十年之後，終於由其他的科學家驗證。\n科學探究文章中經常隱含著「觀察⭢提問⭢推測⭢驗證⭢啟示」等五個探究的成分（或元素）。閱讀時，你若心中有這五個步驟，並在文章裡找到它們，閱讀效率與理解都會大幅提升。\n接著，我們來練習用下列兩個步驟尋找文章的「觀察、提問、推測、驗證、啟示」五部分。\n❶找出成分（元素）在哪個段落\n❷找出各個成分的重點句"}, {"type": "guide", "text": "一、找「觀察」"}, {"type": "guide", "text": "※祕訣：「觀察」描述科學家看到了什麼重要的現象，常出現在文章開頭。"}, {"type": "single", "prompt": "❶找段落：「觀察」出現在文章哪些段落？（提示，有兩段）", "options": ["段1   段2", "段3", "段4"], "answer": "段1   段2"}, {"type": "free_text", "prompt": "❷找重點句："}, {"type": "guide", "text": "本文開頭有多句描述達爾文觀察的句子，請判斷哪一句是觀察的重點句。（單選）"}, {"type": "passage", "source": "unknown", "paragraphs": ["□①達爾文逐一觀察，仔細在筆記本上記錄形態與結構。", "②一株名叫「大彗星風蘭」的蘭花格外引人矚目，它的花距長度竟超過三十公分！", "□③達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」", "小撇步：", "②是重點句，直接點出達爾文觀察到的特殊現象（蘭花的花距長達三十公分）。①只是描述觀察的過程，③則已經是在提出疑問。"]}, {"type": "guide", "text": "二、找「提問」"}, {"type": "guide", "text": "※祕訣：「提問」是科學家根據觀察提出的問題，研究想要解開的謎團，通常緊接在觀察之後出現，常會以問句呈現。"}, {"type": "single", "prompt": "❶找段落：「疑問」出現在文章哪個段落？", "options": ["段1", "段2   □段3   □段4"], "answer": "段2   □段3   □段4"}, {"type": "single", "prompt": "❷找重點句：（單選）", "options": ["達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」", "新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？"], "answer": "新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？"}, {"type": "guide", "text": "小撇步："}, {"type": "passage", "source": "unknown", "paragraphs": ["以上句子中，有兩句以問號結尾，表示主角提出了兩個提問。但②的提問（有沒有如此長口器的昆蟲）更關鍵，是研究要解決的謎題"]}, {"type": "guide", "text": "三、找「推測」"}, {"type": "guide", "text": "※祕訣：「推測」是根據提問提出的大膽假設或可能的答案。「推測」常會有明顯的關鍵詞，例如「推測」、「猜想」、「預測」等。"}, {"type": "single", "prompt": "❶找段落：「推測」出現在文章哪一段？（單選）", "options": ["段1", "□段2   □段3   段4"], "answer": "□段2   □段3   段4"}, {"type": "single", "prompt": "❷找重點句：", "options": ["這實在令人難以置信！", "達爾文寫下推測：在馬達加斯加島上，應該有一種口器長達三十公分的蛾類，能夠幫這朵風蘭授粉。"], "answer": "這實在令人難以置信！"}, {"type": "guide", "text": "四、找「驗證」"}, {"type": "guide", "text": "※祕訣：「驗證」指透過實驗或觀察找到證據來證明先前的推測。通常出現在文章後段，說明科學家找到的證據或得到結果。"}, {"type": "single", "prompt": "❶找段落：「驗證」出現在文章哪一段？（提示，有兩段）", "options": ["段6", "段7   段8", "段9"], "answer": "段6"}, {"type": "multi", "prompt": "❷找重點句：（兩段各有一個重點句）", "options": ["1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，證實了達爾文的預測。", "科學家一直沒有直接證據說明天蛾和風蘭間的關係。", "1992年，研究團隊拍到了長喙天蛾為風蘭授粉的畫面，這個跨世紀的謎題終於得到完整的解答。"], "answer": ["1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，證實了達爾文的預測。", "科學家一直沒有直接證據說明天蛾和風蘭間的關係。", "1992年，研究團隊拍到了長喙天蛾為風蘭授粉的畫面，這個跨世紀的謎題終於得到完整的解答。"]}, {"type": "guide", "text": "五、找「啟示」"}, {"type": "guide", "text": "※祕訣：「啟示」是從這個故事得到的道理或體會，點出作者想傳達的科學精神。"}, {"type": "single", "prompt": "❶找段落：「啟示」出現在文章哪一段？（單選）", "options": ["段6", "□段7   □段8   段9"], "answer": "□段7   □段8   段9"}, {"type": "single", "prompt": "❷找重點句：最後一段直接提到這個故事帶來「許多啟示」，請勾選這個故事帶來的啟示。（複選）", "options": ["科學不只是描述所觀察到的現象，更要推論現象背後隱藏的機制。", "科學不只是「眼見為憑」，未親眼所見之事，也能從理性與經驗中推論其答案", "原來，科學就是從觀察裡提出好問題之後，「大膽假設，小心求證」的歷程。", "這樣的啟示，一代一代傳下來，成了每一位科學工作者的基本信念。"], "answer": "科學不只是描述所觀察到的現象，更要推論現象背後隱藏的機制。"}, {"type": "guide", "text": "一、請你自己檢查以下5項，確定自己是否會抓重點了"}, {"type": "guide", "text": "二、如果以上五項你都打勾了，恭喜你！你已經學會運用「觀察→提問→推測→驗證→啟示」五步驟來摘要科學探究文章。這會讓你更快速掌握文章重點，你真的很棒喔！"}, {"type": "passage", "source": "unknown", "paragraphs": ["這是一篇科學探究結構的文章，閱讀聚光燈你已經學會怎麼用線索來找重點，接著，我們就來整理本課的重點嘍！"]}, {"type": "fill_table"}, {"type": "self_check", "items": ["我學會找出文章中科學家觀察到的現象，知道研究從哪裡開始。（觀察）", "我學會找出科學家提出的問題，了解研究想解決什麼疑團。（提問）", "我學會找出科學家的假設猜想，了解他對答案的推測。（推測）", "我學會找出驗證推測的證據或結果，知道推測是如何被證實的。（驗證）", "我學會找出故事的啟示，了解這篇文章傳達的科學精神。（啟示）"]}], "hist": {"guide": 15, "single": 8, "free_text": 1, "passage": 3, "multi": 1, "fill_table": 1, "self_check": 1}, "n_blocks": 30, "n_q": 11, "layout": "standard", "stype": "summary", "sname": "摘要策略-科學探究文本結構", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容明確指出是《見前人所未見—達爾文與長喙天蛾的故事》的閱讀策略練習。頁面引導學生找出文章中「觀察、提問、推測、驗證、啟示」五個探究成分，並以「觀察」為例進行練習，這與本課課文內容完全吻合。排版正常，無破圖。", "fix": null, "table_gap": null}, {"code": "G9-L12", "title": "臺灣的太空之眼", "story_id": 1141, "grade_code": "G9-L12", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L12.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L12.docx", "blocks": [{"type": "guide", "text": "本課是一篇說明文，文章用小標題分段，分別說明文章主題的不同面向。閱讀這類文章，你只要抓住三件事就能掌握重點：\n一、大主題是什麼？\n二、每個小標題在說明哪個面向？\n三、每個面向最重要關鍵的細節是什麼？\n接下來，我們就來做這三件事：確認大主題與小主題、找重要細節。"}, {"type": "guide", "text": "一、確認大主題"}, {"type": "guide", "text": "說明文的「大主題」通常就是文章標題。大主題要精簡，也要抓到本文最核心的概念。"}, {"type": "single", "prompt": "下列哪一個名稱，也可做為本文的大主題？（單選）", "options": ["①齊柏林號：升空的第一步", "②福衛八號：守望臺灣的衛星星系"], "answer": "②福衛八號：守望臺灣的衛星星系"}, {"type": "guide", "text": "二、小主題定位＋找重要細節（扣住小主題，挑出最關鍵的句子）"}, {"type": "guide", "text": "本文每段資訊都很多，請用小主題抓住這段的重點，並挑出最能支持小主題的「重要細節」句子。"}, {"type": "guide", "text": "（一）第3~4段〈宇宙中的巡邏隊〉"}, {"type": "single", "prompt": "1.小主題-這段重點最接近哪個標題：(單選)", "options": ["星系接力觀測：間隔變短、看得更清楚", "衛星速度驚人：太空中的高速飛行"], "answer": "星系接力觀測：間隔變短、看得更清楚"}, {"type": "single", "prompt": "2.找重要細節：哪些句子最能直接支持你選的小主題？(4選2)", "options": ["福衛八號從2025起逐年發射，到2031全部就位。", "衛星在約561公里的太陽同步軌道運行，輪流拍攝。", "星系完成後，觀測間隔將大幅縮短，能更快取得影像。", "解析度比以往更高，能看清災區地形、道路、建築、農田。"], "answer": "星系完成後，觀測間隔將大幅縮短，能更快取得影像。"}, {"type": "multi", "prompt": "3.精簡成一句話(3選1)", "options": ["星系完成後觀測更頻繁、影像更清楚，能更快掌握災情。", "衛星在太陽同步軌道運行，所以速度很快、很壯觀。", "福衛八號會逐年發射到2031，形成一套完整的觀測系統。"], "answer": ["星系完成後觀測更頻繁、影像更清楚，能更快掌握災情。", "衛星在太陽同步軌道運行，所以速度很快、很壯觀。", "福衛八號會逐年發射到2031，形成一套完整的觀測系統。"]}, {"type": "guide", "text": "（二）第５～６段〈沒有「重來」的按鈕〉"}, {"type": "single", "prompt": "1.小主題-這段重點最接近哪個標題：(單選)", "options": ["太空環境嚴酷：溫差、輻射與隕石", "失誤難挽回：發射前要反覆測試"], "answer": "失誤難挽回：發射前要反覆測試"}, {"type": "single", "prompt": "2.找重要細節：哪些句子最能說明小主題的重點?(4選３)", "options": ["在地球上壞了可以修，但在太空失誤往往覆水難收。", "太空環境嚴酷，有溫度變化、輻射和微小隕石撞擊。", "因此發射前必須在地面經歷無數次的模擬測試。", "衛星只有冰箱大小，但內部塞滿精密相機和推進系統。"], "answer": "在地球上壞了可以修，但在太空失誤往往覆水難收。"}, {"type": "multi", "prompt": "3.精簡成一句話(3選1)", "options": ["太空危險多、失誤很難補救，所以發射前必須反覆模擬測試。", "太空環境很嚴酷，所以衛星要縮小到冰箱大小，較不易故障。", "人造衛星設備太精密了，所以發射成功主要靠運氣。"], "answer": ["太空危險多、失誤很難補救，所以發射前必須反覆模擬測試。", "太空環境很嚴酷，所以衛星要縮小到冰箱大小，較不易故障。", "人造衛星設備太精密了，所以發射成功主要靠運氣。"]}, {"type": "guide", "text": "（三）第7段〈星光背後的二十年〉"}, {"type": "single", "prompt": "1.小主題-這段重點最接近哪個標題：(單選)", "options": ["二十年太空里程：從仰賴他國到自主製造", "二十年太空厲害：解析度更高、看得更清楚"], "answer": "二十年太空里程：從仰賴他國到自主製造"}, {"type": "single", "prompt": "2.找重要細節：哪些句子最能說明小主題的重點？(4選2)", "options": ["臺灣位處地震帶與颱風路徑上，需要更快掌握災情。", "福衛八號有許多關鍵零件，由臺灣本土團隊研發製造。", "自1999年福衛一號起，二十多年累積，從仰賴他國走到自主製造。", "就像運動員磨練成國手，象徵每一步都在挑戰極限。"], "answer": "福衛八號有許多關鍵零件，由臺灣本土團隊研發製造。"}, {"type": "single", "prompt": "3.精簡成一句話(2選1)", "options": ["臺灣累積二十多年太空經驗，逐步從仰賴走向自主製造。", "臺灣關鍵零件自己研發，因此衛星資料一定最準也最完整"], "answer": "臺灣累積二十多年太空經驗，逐步從仰賴走向自主製造。"}, {"type": "guide", "text": "（四）第8段〈「齊柏林」守望臺灣〉"}, {"type": "guide", "text": "找重要細節：請寫出最能支持「「齊柏林」守望臺灣」的句子。"}, {"type": "guide", "text": "透過衛星影像，我們能更快速的掌握災情、守護國土。"}, {"type": "guide", "text": "（五）第9段〈守護家園，也有你一份〉"}, {"type": "guide", "text": "請先找出最能支持「守護家園與，也有你一份」的細節，並精簡為一句話。（答案合理即可）"}, {"type": "guide", "text": "衛星為我們守望家園，你可以成為那個看見臺灣、珍惜臺灣的人。"}, {"type": "guide", "text": "※如果你兩項都打勾，恭喜你，表示你已經學會用「主題—小主題—重要細節」來抓說明文重點，先抓大方向，再抓段落重點與關鍵細節。"}, {"type": "self_check", "items": ["我能確認這篇文章的「大主題」是什麼。", "我能根據小主題，挑出最能支撐小主題的「重要細節」，並精簡成一句重點句。"]}], "hist": {"guide": 15, "single": 8, "multi": 2, "self_check": 1}, "n_blocks": 26, "n_q": 10, "layout": "standard", "stype": "summary", "sname": "摘要策略-小標題的作用：找細節", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「閱讀聚光燈」的「摘要策略-小標題的作用:找細節」步驟。頁面上的所有題目和選項，包括「齊柏林號」、「福衛八號」、「太空環境嚴酷」等關鍵詞，都與提供的課文《臺灣的太空之眼》內容高度相關。排版正常，無破圖或空白骨架。", "fix": null, "table_gap": null}, {"code": "G9-L13", "title": "樂觀者勝：向NBA球員學習「詮釋失敗」的智慧", "story_id": 1142, "grade_code": "G9-L13", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L13.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L13.docx", "blocks": [{"type": "guide", "text": "有時候，我們不是被事情打倒，而是被自己腦袋裡的「小劇場」打敗。朋友沒回訊息、比賽失誤、考試退步，腦中就會冒出：「他一定不想理我」、「我好爛」、「完了，我不行了」的想法，這些想法聽起來像事實，其實只是大腦在「編故事」。\n　　心理學家塞利格曼博士發現，樂觀的人和悲觀的人，差別在於他們怎麼解釋失敗。\n　　悲觀的人：「這件事會一直這樣」、「都是我的錯」、「我哪裡都不行」；\n　　樂觀的人：「這只是暫時的」、「只是某個部分出錯」、「我還能改變」。\n　　而且，樂觀不是天生的，它可以練習。當我們學會用新的角度看失敗，就能讓自己有力量繼續往前。接下來，讓我們一起練習，看怎麼把腦中的負面劇本，改寫成更勇敢、更樂觀的版本。"}, {"type": "guide", "text": "一、自我覺察：你的大腦也在「編劇」嗎？"}, {"type": "guide", "text": "請閱讀下列情境，勾選出你是否也曾出現這樣的想法。（沒有標準答案喔）"}, {"type": "guide", "text": "如果你的答案多是「有」，代表你常被大腦的悲觀小劇場帶著走。"}, {"type": "guide", "text": "但別擔心，樂觀是可以學習的，我們可以練習用不同角度看事情，就能減少誤會，也更容易冷靜下來解決問題。"}, {"type": "guide", "text": "二、樂觀是可以學習的："}, {"type": "guide", "text": "樂觀不是假裝沒事，而是能換個角度看事情。例如：有人覺得「沒考好＝我很笨」，但也有人會想：「只是這次準備不夠，下次還能更好。」"}, {"type": "guide", "text": "你發現了嗎？他們面對同樣的事情，情緒卻完全不同，造成的結果也會不同，這就是「詮釋」的力量。"}, {"type": "free_text", "prompt": "1.判斷下列想法是樂觀還是悲觀？(請打勾，單選)"}, {"type": "guide", "text": "提示：樂觀＝暫時、特定、可改變；悲觀＝永久、全面、無法改變。"}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "free_text", "prompt": "2.換你試試看：現在我們用第一大題的情境來練習「樂觀詮釋」"}, {"type": "figure", "referent": "table", "asset": "fig2.png", "bind_paragraph": null}, {"type": "free_text", "prompt": "3.進階練習：你的同學遇到了壞事，而且有了悲觀的詮釋，請你試著把他們的詮釋改成樂觀的詮釋。"}, {"type": "free_text", "prompt": "❶今天出門後，發現忘記帶早餐。"}, {"type": "guide", "text": "悲觀的詮釋：我真是笨死了，連這種事情也會忘記。"}, {"type": "guide", "text": "樂觀的詮釋：還好，我身上有帶錢，可以去合作社買。"}, {"type": "free_text", "prompt": "❷媽媽又在提醒我寫功課。"}, {"type": "guide", "text": "悲觀的詮釋：她就是不相信我，老是要管我，真是煩死了。"}, {"type": "guide", "text": "樂觀的詮釋：我可以跟她溝通讀書計畫，讓她放心也給我空間。"}, {"type": "free_text", "prompt": "❸我遇到的壞事：　今天上課被老師點名回答問題，我答錯了。"}, {"type": "guide", "text": "悲觀的詮釋：大家一定覺得我很笨，真丟臉。"}, {"type": "guide", "text": "樂觀的詮釋：至少我敢舉手，下次準備更充足就好。"}, {"type": "guide", "text": "結語：面對失敗時，關鍵不在輸贏，而在你怎麼看待它。\n　　當你能把挫折看成暫時、特定、可改變的挑戰，\n　　你就不再被失敗擊倒，而是讓自己一步步變得更堅強。"}, {"type": "guide", "text": "※如果你三項都打勾，恭喜你！你已經學會用「樂觀的思考方式」來面對挫折，你的心理韌性正在慢慢變強！期待你未來的蛻變。"}, {"type": "self_check", "items": ["我能分辨出「樂觀詮釋」與「悲觀詮釋」的差別。", "我能為日常挫折找到不同的詮釋方式。", "我能嘗試把負面想法轉成「暫時、特定、可改變」的想法。"]}], "hist": {"guide": 17, "free_text": 6, "figure": 2, "self_check": 1}, "n_blocks": 26, "n_q": 6, "layout": "standard", "stype": "sel_character", "sname": "正向思考-學習樂觀思考", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容與課文主題「樂觀者勝：向NBA球員學習『詮釋失敗』的智慧」高度相關。頁面詳細解釋了樂觀與悲觀的詮釋方式，並提供練習題，完全符合本課的教學目標。圖片雖然是通用圖示，但已成功載入，不影響內容忠實性。", "fix": null, "table_gap": null}, {"code": "G9-L14", "title": "焚而不毀的倫敦", "story_id": 1143, "grade_code": "G9-L14", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L14.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L14.docx", "blocks": [{"type": "guide", "text": "生活有時候會讓人喘不過氣：壞事突然發生、努力了卻沒結果……但課文中的倫敦人告訴我們一件事：心理韌性不是不會害怕，而是雖然害怕，也能不被打敗，積極面對。\n    在課文中，倫敦的人民遇到了大轟炸這麼恐怖的事情，但仍然能夠挺過這場風暴，故事裡有三個值得學習之處：\n　　一、面對變故有彈性（適應力）→坦然面對倫敦大轟炸過後的家園\n　　二、社會支持帶來的心理力量→第五、六段大家互相幫助的事蹟\n　　三、遇到挫折能保持樂觀的詮釋（復原力）→倖存者的鎮定\n　　強大的心理韌性並非與生俱來，而是可以學習的，現在我們就來練習看看吧！"}, {"type": "guide", "text": "一、面對突發變化保持彈性（適應力）："}, {"type": "guide", "text": "遇到不熟悉的情況時，可能會讓你很不舒服，哪一個想法最符合『面對變動時保持彈性』的能力？"}, {"type": "guide", "text": "當事情突然改變時，願意換個想法，就是在練習讓自己更能適應生活中的意外。"}, {"type": "guide", "text": "二、社會支持帶來的心理力量："}, {"type": "guide", "text": "「社會支持」很重要，當你知道「我不孤單」、「大家可以一起努力」時，就比較不容易被打敗。遇到困難時，向別人求助不是一件壞事，更棒的是能主動去幫助別人，反而會讓你更有力量向前邁進。"}, {"type": "guide", "text": "遇到困難時，你可以怎麼做？"}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "guide", "text": "三、遇到壞事能保持樂觀的詮釋（復原力）："}, {"type": "passage", "source": "unknown", "paragraphs": ["樂觀不是裝開心，而是「換一個角度看事情」。下面的情境，都和課文中「沒打破我的茶壺」一樣，事情真的很糟，但有人選擇用一句話，讓自己不被擊倒。請選出最像課文中那種幽默詮釋的一句話。"]}, {"type": "free_text", "prompt": "❶颱風後，一戶人家的屋頂被掀開一個大洞。鄰居關心的問屋主：「你還好嗎？」"}, {"type": "passage", "source": "unknown", "paragraphs": ["□ A.我真的很慘，家全被毀了。", "B.至少家裡採光變好了。", "□ C.都是颱風害的，氣死人了。"]}, {"type": "free_text", "prompt": "❷林肯當總統時，有人當眾嘲笑他長的很醜。"}, {"type": "passage", "source": "unknown", "paragraphs": ["如果你是他，哪一句回應最像用幽默化解困境？"]}, {"type": "guide", "text": "□ A.我今天真倒楣，看什麼都壞掉了。"}, {"type": "guide", "text": "□ B.如果你一直笑我，你覺得我會開心嗎？"}, {"type": "guide", "text": "C.如果我有另一張臉，你覺得我會戴這張嗎？"}, {"type": "free_text", "prompt": "❸你的手機掉進馬桶。撈起來時，螢幕一黑，完全沒反應，又沒錢換。（請寫句子作答）"}, {"type": "guide", "text": "我的手機去泡湯了，一泡就睡著了/這次要戒手機，一定會成功了。"}, {"type": "guide", "text": "※如果你三項都打勾，恭喜你！你已經能學會培養自己的心理韌性，你的心將會像倫敦人一樣：焚而不毀、越挫越強。"}, {"type": "self_check", "items": ["面對變故時，我彈性思考，適應不熟悉的狀況。", "我知道自己不是一個人，可以適時尋求支持。", "我能把悲觀的想法，改成樂觀的詮釋，讓自己能重新站起來。"]}], "hist": {"guide": 13, "figure": 1, "passage": 3, "free_text": 3, "self_check": 1}, "n_blocks": 21, "n_q": 3, "layout": "standard", "stype": "sel_character", "sname": "正向思考-培養心理韌性", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容明確提及「課文中的倫敦人」、「倫敦大轟炸」等關鍵字，並討論心理韌性、社會支持和樂觀詮釋，這些都與《焚而不毀的倫敦》這課的主題高度相關。圖片雖然是通用圖示，但 文章認為，運動成績進步的兩大因素是什麼？", "options": ["營養和休息", "科技進步和專項選才", "獎金和國家支持"], "answer": "科技進步和專項選才"}, {"type": "free_text", "prompt": "綜合三篇文章，你認為基普喬吉破紀錄主要靠自己的實力，還是靠外在因素（跑鞋、團隊、科技）？請說明你的理由"}], "hist": {"guide": 1, "multi": 1, "single": 2, "free_text": 1}, "n_blocks": 5, "n_q": 4, "layout": "standard", "stype": "comparison", "sname": "比較不同作者觀點", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「馬拉松王者——基普喬吉」的閱讀策略練習，問題圍繞基普喬吉的成功原因、質疑以及運動成績進步的因素，這些都與提供的課文內容高度相關。頁面排版正常，沒有破圖或空白骨架。", "fix": null, "table_gap": null}, {"code": "G9-L2", "title": "帝國家書：一個普通家庭的生與死", "story_id": 1131, "grade_code": "G9-L2", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L2.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G9-L2.docx", "blocks": [{"type": "guide", "text": "本篇文章是作者讀完兩封來自秦朝時期的家書後，做了一些推論，最後一段再加上自己的感想後寫成的。\n　　也就是說，文章中的訊息主要有兩大類，第一類是「兩兄弟的處境（以下稱事實）」，第二類是「作者對兩兄弟處境的推論（以下稱判斷）」。閱讀這樣的文章，如果能分辨哪些是客觀的事實，哪些是作者的判斷，就能幫助自己有比較好的理解。\n    那麼什麼是事實？什麼又是判斷呢？\n事實：可以被驗證真假的訊息。例如，第四段提到黑夫的家書寫著「請母親寄衣物或錢」，這是家書中直接呈現且可以從信中驗證的，因此是「事實」。\n判斷：作者基於文章中的事實，結合自己的知識和經驗後所做的推測。例如，從黑夫「請母親寄衣物或錢」這個事實，作者推論秦國服役沒有兵餉，國家只提供武器和口糧，因此屬於「作者判斷」。\n接下來讓我們來練習分辨「事實」與「判斷」吧。"}, {"type": "free_text", "prompt": "1.基礎題：根據這篇文章，以下的文句是事實的請寫上F，是作者判斷的請寫上J。"}, {"type": "guide", "text": "★事實的英文為Fact，判斷的英文為Judgment。"}, {"type": "free_text", "prompt": "(1)【 F 】(第三段)文中的家庭有兄弟三人。"}, {"type": "free_text", "prompt": "(2)【 F 】(第四段)兄弟倆困在淮陽，缺乏夏衣。"}, {"type": "free_text", "prompt": "(3)【 J 】(第八段)黑夫和驚的母親沒有寄錢給他們。"}, {"type": "free_text", "prompt": "(4)【 J 】(第十三段)黑夫和驚最終都戰死沙場。"}, {"type": "free_text", "prompt": "(5)【 J 】(第十三段)大哥失去兩個弟弟後，深感悲傷和歉疚。"}, {"type": "free_text", "prompt": "2.進階題：連連看，將「文章中的事實」與「作者判斷」配對。"}, {"type": "free_text", "prompt": "3.挑戰題：文中作者認為秦國將戰爭的成本轉嫁給底層民眾。下列哪些文中「事實」能支持這個判斷，請將能支持的句子畫O，不能的畫X。"}, {"type": "free_text", "prompt": "(1)【 O 】士兵的衣物等必需品需要自備。"}, {"type": "free_text", "prompt": "(2)【 O 】許多年輕的男子   const c=VC[d.verdict]||"#777";
  const label=VLABEL[d.verdict]||d.verdict;
  h+=`<div style="margin-top:3px">內容 <span class="v" style="background:${c}">${label}</span></div>`;
  if(d.fix && d.judge_verdict && d.judge_verdict!==d.verdict && d.judge_verdict!=="—")
    h+=`<div class="muted">(修前舊掃:${d.judge_verdict};已修復驗證)</div>`;
  else if(!d.fix && d.reasoning) h+=`<div class="muted">judge(有變異):${esc(d.reasoning)}</div>`;
  const fig=(d.hist.figure||0);
  if(d.table_gap) h+=`<div class="qa-gap">圖 ⏳ table-gap: ${esc(d.table_gap)}</div>`;
  else if(fig) h+=`<div>圖 ${fig} 個 figure block</div>`;
  if(d.fix) h+=`<div style="margin-top:3px;color:#5B4FC4">🔧 ${esc(d.fix)}</div>`;
  return h;
}
function row(d){
  const tr=document.createElement("tr");
  tr.dataset.k=(d.code+" "+d.title).toLowerCase();
  tr.innerHTML=`<td class="code">${d.code}<div class="muted">${esc(d.title)}</div></td>
    <td>${srcCell(d)}</td>
    <td>${esc(d.method)}<div class="muted">${esc(d.method_src)}</div></td>
    <td><details><summary>${d.blocks.length} blocks</summary><pre>${esc(JSON.stringify(d.blocks,null,1))}</pre></details></td>
    <td>${esc(d.layout||"—")}<div class="muted">${esc(d.stype||"")}</div><div class="muted">${Object.entries(d.hist).map(([k,v])=>k+":"+v).join(" ")}</div></td>
    <td><button class="try" onclick="tryit(this,'${d.code}')">▶ 試用</button><div class="render" style="display:none"></div></td>
    <td>${qaCell(d)}</td>`;
  return tr;
}
const byCode={};
function tryit(btn,code){
  const box=btn.nextElementSibling;
  if(box.style.display==="none"){box.style.display="block";box.innerHTML=renderBlocks(byCode[code].blocks,code);btn.textContent="▼ 收起";}
  else{box.style.display="none";btn.textContent="▶ 試用";}
}
const tb=document.querySelector("#t tbody");
for(const d of DATA){byCode[d.code]=d;tb.appendChild(row(d));}
function filt(){const q=document.getElementById("q").value.toLowerCase();for(const tr of tb.children){tr.style.display=tr.dataset.k.includes(q)?"":"none";}}
document.getElementById("gaps").innerHTML="<b>誠實缺口(不假綠):</b> Table figures 需表格JSON資料(另pipeline): "+Object.entries({"G7-L30":"table1/2","G5-L16":"表1","G9-L9":"表2/3"}).map(([k,v])=>k+"("+v+")").join(", ")+" ｜ 文言文無聚光燈素材 ｜ judge 變異課(G5-L13/16/27)render verdict 跨次跳=噪音非退步";
</script>
