const DATA=[{"code": "G4-L10", "title": "美好的一天", "story_id": 1010, "grade_code": "G4-L10", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L10.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L10.docx", "blocks": [{"type": "guide", "text": "請試著讀底下的文字，再回答一個問題：\n　　「晚間新聞正播報明天的天氣預報，爺爺坐在電視前的沙發上，早就進入夢鄉。」\n問題：爺爺有聽到明天的天氣預報嗎？【□有聽到　　□沒有聽到】\n在回答這個簡單的問題時，你已經在做推論了。\n你看，「爺爺睡著了，所以沒有聽到天氣預報」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」的過程，最近的流行語叫做「腦補」哦。\n閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！\n這篇故事，描述了公車上發生的爭執，文中角色的情緒起伏很大，但故事並沒有直接以文字說明角色的情緒或感受。\n我們可以透過「理解現場情境」與「觀察角色言行」的策略來推敲他們內心的情緒與感受，這樣做還能幫助我們進一步體會故事想傳達的深層意義。\n接下來，我們就來練習推論文中重要角色──「大媽」的情緒和感受。"}, {"type": "guide", "text": "一、推論情緒和感受有方法"}, {"type": "guide", "text": "(一)理解現場情境"}, {"type": "guide", "text": "小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。試著站在角色的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？"}, {"type": "single", "prompt": "❶ 找情境：故事一開始，大媽上公車後看到什麼？（請在□打勾）\n□一位年輕的女生坐在博愛座，而車上其他人都站著。\n□女生主動起身讓位，大媽馬上坐到了博愛座。", "options": ["一位年輕的女生坐在博愛座，而車上其他人都站著。", "女生主動起身讓位，大媽馬上坐到了博愛座。"], "answer": "一位年輕的女生坐在博愛座，而車上其他人都站著。"}, {"type": "free_text", "prompt": "❷ 推情緒：面對這種情況，你猜大媽的心情是什麼？為什麼？"}, {"type": "guide", "text": "□生氣，因為她認為年輕人不該坐博愛座。\n□驚喜，因為有人馬上讓座給她。"}, {"type": "guide", "text": "（二）觀察角色言行"}, {"type": "guide", "text": "小祕訣：角色「說的話、動作、表情、語氣」常常偷偷告訴我們他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。\n段5：大媽眉毛一挑：「我都沒得坐，小孩子裝個病，就有博愛座？真了不起！」"}, {"type": "free_text", "prompt": "❶ 情境：生氣"}, {"type": "single", "prompt": "❷ 找動作：她「眉毛一挑」，這個動作通常表示什麼？（請打勾，可複選）", "options": ["驚訝", "不高興", "想笑", "輕視"], "answer": "驚訝"}, {"type": "single", "prompt": "❸ 推想法：你覺得「真了不起」的意思是什麼？", "options": ["她年紀小，生病居然膽敢去坐博愛座，勇氣值得稱讚。", "她在稱讚，司機先生明察秋毫、願意助人，值得稱讚。", "她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。"], "answer": "她年紀小，生病居然膽敢去坐博愛座，勇氣值得稱讚。"}, {"type": "guide", "text": "什麼是「說反話」？"}, {"type": "guide", "text": "當一個人有情緒時，卻說出和當時情緒相反的話語，很可能就是在「說反話」。"}, {"type": "free_text", "prompt": "1.很生氣卻說出「讚美」的話"}, {"type": "guide", "text": "你犯了嚴重錯誤，夥伴說：「你真的很天才ㄟ!」"}, {"type": "free_text", "prompt": "2.或很失望卻說出「感謝」的話"}, {"type": "guide", "text": "導師被你們氣壞了，說：「感謝老天讓我教到你們這班！」"}, {"type": "guide", "text": "在本課中出現好幾次「說反話」的例子："}, {"type": "free_text", "prompt": "1.段5：大媽明明不高興，卻說國中女生「真了不起！」"}, {"type": "free_text", "prompt": "2.段8：明明看大媽不順眼，乘客卻用哪4個字稱讚她?"}, {"type": "passage", "source": "unknown", "paragraphs": ["【　　　真了不起　　　　　　】"]}, {"type": "free_text", "prompt": "3.在段5和段8之間還有一句6個字的反話，請你找到，寫在下面。【　　好有正義感呀　　　　　　】"}, {"type": "guide", "text": "◎你發現了嗎，文章中沒有明白寫出來的內心的情緒與感受，我們可以透過「理解現場情境」（站在人物的角度）與「觀察角色言行」的策略來推敲喔。"}, {"type": "guide", "text": "二、從故事發展，推論「大媽」的情緒或感受變化"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "guide", "text": "三、推論主旨或目的"}, {"type": "passage", "source": "unknown", "paragraphs": ["從大媽的說話、語氣、動作，我們可以看到，大媽從誤會「生氣」，被提醒理解後，態度轉變為「 慚愧」的過程。最後，讓我們來想想，透過大媽的轉變，這個故事想要告訴我們什麼？（請在□打勾，複選）"]}, {"type": "guide", "text": "□人會因為理解而改變態度　　　□發脾氣是解決問題的最好方法。"}, {"type": "guide", "text": "□善意可以化解衝突、消除誤會　□不用了解情況，吃虧時就應該生氣"}, {"type": "guide", "text": "四、換你試試看，推論其他角色的情緒或感受"}, {"type": "free_text", "prompt": "1. 段六：女生都快哭出來了，勉強要站起來。女生當時最可能的情緒是什麼？【　　　害怕、委屈　　　　　　】"}, {"type": "free_text", "prompt": "2. 段八：人群聲音：「幹嘛呀，都幾歲了，還這樣講話？真了不起！」講這句話的人，最可能的情緒是什麼？【　　忿忿不平／不屑　　】"}, {"type": "guide", "text": "一、請你自己檢查以下3項，確定自己是否會推論情緒和感受了"}, {"type": "guide", "text": "二、如果三項都打勾，恭喜你，你已經學會找推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "self_check", "items": ["我會根據人物說的話、語氣、表情、動作，推測情緒或感受。", "我會思考人物說的話是不是真心話，推測他隱藏的真正情緒。", "我能把故事前後線索連起來，推論大媽情緒的變化，並明白故事想傳達的道理。"]}], "hist": {"guide": 20, "single": 3, "free_text": 9, "passage": 2, "figure": 2, "self_check": 1}, "n_blocks": 37, "n_q": 12, "layout": "standard", "stype": "emotion_inference", "sname": "推論策略-推論情緒和感受", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容與提供的【聚光燈完整 block 文字】一致，且該文字明確指出要練習推論文中重要角色「大媽」的情緒和感受，並引用了本課《美好的一天》中的情境和對話進行練習。頁面排版正常，沒有破圖或空白骨架。", "fix": null, "table_gap": null}, {"code": "G4-L11", "title": "誤會", "story_id": 1011, "grade_code": "G4-L11", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L11.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L11.docx", "blocks": [{"type": "guide", "text": "上一課我們已經學過怎麼透過「理解現場情境」與「觀察角色言行」的策略，來推敲人物內心的情緒與感受。這篇故事的情境，延續上一課公車博愛座的議題，各角色也有豐富的情緒變化，接下來，我們繼續來練習推論文章中角色的情緒和感受，並進一步體會故事傳達的意義。"}, {"type": "guide", "text": "一、推論情緒和感受有方法-換位思考"}, {"type": "guide", "text": "(一)理解現場情境"}, {"type": "guide", "text": "小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。可以試著「換位思考」—就是試著站在人物的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？"}, {"type": "single", "prompt": "❶ 找情境：故事一開始，老爺爺上車後發生了什麼情況？（請在□打勾）\n車上沒有空位，卻有一位年輕人坐在博愛座上看書。\n□年輕人主動起身讓座，老爺爺順利坐下休息。", "options": ["車上沒有空位，卻有一位年輕人坐在博愛座上看書。", "年輕人主動起身讓座，老爺爺順利坐下休息。"], "answer": "車上沒有空位，卻有一位年輕人坐在博愛座上看書。"}, {"type": "free_text", "prompt": "❷ 推情緒：看到這種情況，你猜作者（我）的心情是什麼？為什麼？"}, {"type": "guide", "text": "□開心，因為他看到年輕人坐車還在看書，值得讚賞"}, {"type": "guide", "text": "不高興，因為他認為年輕人沒有讓座給老人家。"}, {"type": "free_text", "prompt": "❸ 換位思考：如果是你，看見需要幫助的老人沒有座位，心裡會有什麼感受呢？ 【　　我會覺得生氣，年輕人怎麼可以坐博愛座　】"}, {"type": "guide", "text": "小撇步"}, {"type": "passage", "source": "unknown", "paragraphs": ["推論情緒或感受，也可以用身歷其境的方法換位思考，想一想，「如果是你呢？你會有什麼感受？」這個方法，會讓你更容易體會角色的情緒與感受喔！"]}, {"type": "guide", "text": "（二）觀察角色言行"}, {"type": "guide", "text": "小祕訣：角色「說話內容、語氣、動作、表情」常常透露出他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。"}, {"type": "free_text", "prompt": "❶ 觀察言行：(第三段) 我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。"}, {"type": "free_text", "prompt": "❷ 找情緒：請找出這一段作者明白寫出來的情緒或感受？（複選）"}, {"type": "guide", "text": "【不高興　　糾結、猶豫　　□懷疑　　】"}, {"type": "guide", "text": "◎你發現了嗎，角色的情緒或感受，也有可能明白寫在文中喔！但角色的情緒或感受，如果沒有明白寫出來，你就需要進一步根據線索做推論喔。"}, {"type": "guide", "text": "二、從故事發展，推論「作者」（我）的情緒或感受變化"}, {"type": "guide", "text": "三、推論主旨或目的"}, {"type": "passage", "source": "unknown", "paragraphs": ["從作者的說話、語氣、動作，我們可以看到，老爺爺差點跌倒後，作者開始指責年輕人，表現出「生氣」的情緒；後來當他發現真相後，不但臉紅、快步追上對方，還低聲道歉，顯現出「慚愧、懊悔」的心情。最後，讓我們來想想，透過作者的情緒和行為變化，這個故事想要告訴我們什麼？（請在□打勾，複選）"]}, {"type": "guide", "text": "「對事情的理解程度」會能改變一個人的情緒和態度。"}, {"type": "guide", "text": "□遇到自己被誤會時，要勇敢站出來把真相說清楚。"}, {"type": "guide", "text": "勇敢承認自己的錯誤，也是一種重要的勇氣。"}, {"type": "guide", "text": "◎換你試試看-年輕人視角"}, {"type": "guide", "text": "一、請推論寫下「持拐杖那位年輕人」的情緒或感受（答案合理即可）"}, {"type": "figure", "referent": "table", "asset": "fig2.png", "bind_paragraph": null}, {"type": "guide", "text": "二、請推論寫作意圖"}, {"type": "passage", "source": "unknown", "paragraphs": ["年輕人從頭到尾沒有為自己解釋，最後只說：「我習慣了。」你覺得，作者寫出這樣的角色，想提醒我們什麼？（單選）", "身心障礙者經常被誤解的無奈與委屈。\n□忍讓是最好的處理方式，不需要解釋。\n◎ 自我檢核"]}, {"type": "guide", "text": "一、請你自己檢查以下2項，確定自己是否會推論情緒和感受了。"}, {"type": "guide", "text": "二、如果兩項都打勾，恭喜你，你已經學會找推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！"}, {"type": "figure", "referent": "table", "asset": "fig3.png", "bind_paragraph": null}], "hist": {"guide": 21, "single": 1, "free_text": 4, "passage": 3, "figure": 2}, "n_blocks": 31, "n_q": 5, "layout": "standard", "stype": "emotion_inference", "sname": "推論策略-推論情緒和感受", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容與提供的「聚光燈完整 block 文字」一致，且所有題目和選項都圍繞著《誤會》這篇課文的內容，例如公車博愛座情境、老爺爺上車、年輕人看書等。排版正常，沒有破圖或空白內容。", "fix": null, "table_gap": null}, {"code": "G4-L13", "title": "第一百碗麵", "story_id": 6, "grade_code": "G4-L13", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L13.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L13.docx", "blocks": [{"type": "guide", "text": "「換位思考」是指站在別人的角度看事情，了解對方的感受，進而聽懂別人的言外之意。故事中的阿公、小男孩或是麵攤老闆，他們都能夠換位思考，懂得替別人著想。\n　　我們可以用三個步驟來學習「換位思考」喔：\n(1)觀察言行：聽對方說的話或觀察對方的行為（表情、動作、反應）。\n(2)推論動機：根據(1)的觀察，推論對方言行的動機。\n(3)成功換位思考：綜合(2)的推論，判斷對方的真正想法。\n　　接下來我們要用「換位思考三步驟」，來練習推論出本篇故事中人物說話或行為的動機，以及言外之意喔！"}, {"type": "guide", "text": "◎小試身手："}, {"type": "free_text", "prompt": "1.我們要利用換位思考三步驟來推論課文中阿公的想法，請根據阿公說的話或行為想一想、連連看，做出合理的推論。"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "guide", "text": "步驟三：成功換位思考"}, {"type": "passage", "source": "unknown", "paragraphs": ["→阿公應該【  還沒 / 已經  】吃飽，用這麼誇張的方式說話是因為錢不夠，又想讓孫子【  安心/放心  】吃麵。"]}, {"type": "free_text", "prompt": "2.進階題：我們要再利用換位思考三步驟來推論課文中老闆的想法，請根據老闆說的話或行為想一想、連連看，做出合理的推論。"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "guide", "text": "步驟三：成功換位思考"}, {"type": "passage", "source": "unknown", "paragraphs": ["→老闆想要在不傷害老人及小男孩【   自尊心  /  自信心   】的情況下，【  幫助   】他們。"]}, {"type": "free_text", "prompt": "3.挑戰題：讀完下面故事後，運用換位思考三步驟寫出老闆可能的想法。"}, {"type": "passage", "source": "unknown", "paragraphs": ["老闆這麼做是因為：【   怕大學生一看到老闆幫他加料，會覺得被施捨，傷害他的自尊心，因此才放在白飯下方。        　　　　               】"]}], "hist": {"guide": 4, "free_text": 3, "figure": 2, "passage": 3}, "n_blocks": 12, "n_q": 3, "layout": "standard", "stype": "perspective_taking", "sname": "想法感受的換位思考", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的內容是關於「換位思考」的教學策略，並明確指出要用此策略來推論「本篇故事中人物說話或行為的動機」。截圖中的練習題也直接點名要推論「課文中阿公的想法」，與《第一百碗麵》這課的內容完全吻合。排版正常，沒有圖片載入失敗。", "fix": null, "table_gap": null}, {"code": "G4-L15", "title": "感情小日記1──是友情還是愛情？", "story_id": 1015, "grade_code": "G4-L15", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L15.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L15.docx", "blocks": [{"type": "guide", "text": "◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)"}, {"type": "guide", "text": "◎接著，請再試著思考，以下的互動，對你來說，更偏向友情還是愛情呢？一樣沒有正確答案哦！"}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "guide", "text": "◎根據上面的回答，以及你自己的觀察，關於友情與愛情差異，哪些是你認同的？請打勾，也可以寫上自己的想法。"}, {"type": "passage", "source": "unknown", "paragraphs": ["(自由填寫) 如果_________________________________________，就偏向愛情。", "謝謝你的嘗試與覺察，相信透過回答，你也更了解了自己的感受！\n友情與愛情的界線，有時真的不容易分清楚。但比起急著為關係命名，更重要的是，你有沒有注意到自己的「在意」和「情緒」，你對關係的理解、期待，及如何看待人與人之間的互動。願你記得，關係不必馬上定義，但你的感受值得被看見、被理解。這就是認識自己的開始。❤︎"]}], "hist": {"guide": 3, "figure": 1, "passage": 1}, "n_blocks": 5, "n_q": 0, "layout": "standard", "stype": "sel_character", "sname": "自我覺察-是友情還是愛情", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容與提供的「聚光燈完整 block 文字」一致，且該文字內容忠實於本課「感情小日記1──是友情還是愛情？」的主題，引導學生思考友情與愛情的差異。頁面排版正常，圖片為通用圖示且已成功載入。", "fix": null, "table_gap": null}, {"code": "G4-L16", "title": "感情小日記2──喜歡是什麼？", "story_id": 1016, "grade_code": "G4-L16", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L16.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L16.docx", "blocks": [{"type": "guide", "text": "◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)"}, {"type": "guide", "text": "☆勾完後，再看看沒有勾選的選項，那樣的想法所帶來的情緒有什麼不同呢？"}, {"type": "guide", "text": "◎接著，我們再來看看更多情境事件，並根據題目的情緒，選擇對應的想法。"}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "guide", "text": "◎根據上面的回答，請試著歸納，能帶來平靜、好心情的想法多半具備下列哪些特質呢？"}, {"type": "free_text", "prompt": "1.能換位思考，願意站在他人立場理解行為。\n（如：他放學沒等我，可能是剛好跟家人有約，來不及說。）"}, {"type": "free_text", "prompt": "2.願意接受事情有很多種可能，不針對自己。\n（如：他已讀不回，可能是不小心按到，或是點開後手機沒電了。）"}, {"type": "free_text", "prompt": "4.能從善意的角度解釋他人行為。\n（如：他沒約我打遊戲，也許是怕我作業太多會分心。）"}, {"type": "free_text", "prompt": "5.能保持好奇，不急著下判斷。\n（如：他今天都沒跟我說話，不知道他怎麼了？晚點來關心他。）"}, {"type": "free_text", "prompt": "7.能看見自己的優點，不隨意否定自己。\n（如：雖然我的意見沒有被小組採用，但勇敢分享本身就是很棒的表現。）"}, {"type": "passage", "source": "unknown", "paragraphs": ["回到文章，我們會看見，作者雖然是因為那份「喜歡」，所以十分在乎對方，以至於心情劇烈起伏，但影響情緒的關鍵也包含他的想法。所以當我們學會覺察想法，就能慢慢讓情緒變得穩定、有力量❤︎"]}], "hist": {"guide": 4, "figure": 1, "free_text": 5, "passage": 1}, "n_blocks": 11, "n_q": 5, "layout": "standard", "stype": "sel_character", "sname": "自我覺察─想法與情緒的關係", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容與提供的【聚光燈完整 block 文字】一致，且該內容是關於「自我覺察——想法與情緒的關係」，這與本課《感情小日記2——喜歡是什麼？》的主題「情緒起伏」高度相關。頁面上的範例（如「他放學沒等我」、「他已讀不回」）也與課文情境相符，且排版正常，圖片為通用圖示，無載入失敗。", "fix": null, "table_gap": null}, {"code": "G4-L18", "title": "想讀書，該從哪裡著手？ ──阿耀與健豪學長的通信（二", "story_id": 1018, "grade_code": "G4-L18", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L18.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L18.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手："}, {"type": "guide", "text": "情境一：品妤的寫作困境"}, {"type": "guide", "text": "品妤喜歡寫小說，常在網路上分享自己的故事。"}, {"type": "guide", "text": "可是，最近有幾則留言說她的文筆「太幼稚」，讓她開始懷疑自己是不是沒有天分。"}, {"type": "guide", "text": "情境二：社團與課業的衝突"}, {"type": "guide", "text": "芸涵最喜歡跳舞，每天都期待熱舞社的時間。"}, {"type": "guide", "text": "但這學期功課變多，爸媽說：「社團先停一下，考好再跳。」"}, {"type": "guide", "text": "她很矛盾，一方面想聽父母的話，一方面又捨不得放下練舞。"}, {"type": "guide", "text": "◎換你試試看："}, {"type": "guide", "text": "一、我現在最熱愛的事或興趣是什麼？"}, {"type": "guide", "text": "我最熱愛的事是：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿"}, {"type": "guide", "text": "二、最近進行熱愛的事時，遇到的阻礙是什麼?"}, {"type": "guide", "text": "□時間不夠　   □家人期待不同　□成績壓力　□經費／器材不足"}, {"type": "guide", "text": "□作品被批評 　□身體狀況　　  □ 其他：＿＿＿＿＿＿＿＿＿"}, {"type": "guide", "text": "三、如果有一天，不能靠它成功或無法繼續下去，你可以怎麼做？"}, {"type": "guide", "text": "□縮時練習（每天10–15分鐘基本功）"}, {"type": "guide", "text": "□角色轉換（例：籃球選手變籃球教練、運動選手變體育主播）"}, {"type": "guide", "text": "□延伸學習（例：喜歡唱歌→學錄音或音效；喜歡球類→學習戰術分析）"}, {"type": "guide", "text": "□把學到的精神用在別的地方（例：堅持、專注、團隊合作）"}, {"type": "guide", "text": "□用其他方式將熱愛的事物與夥伴分享（寫文、拍短片、小型展覽）"}], "hist": {"guide": 20}, "n_blocks": 20, "n_q": 0, "layout": "standard", "stype": "sel_character", "sname": "生涯探索-轉個彎，熱愛還在前方", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "figure_broken", "reasoning": "截圖中顯示了一個明顯的圖片載入失敗的圖示，佔據了頁面中間的大部分區域。雖然文字內容與本課主題相關，但圖片載入失敗是視覺上的嚴重問題。", "fix": "破圖佔位strip #2408", "table_gap": null}, {"code": "G4-L19", "title": "救援大隊的好幫手", "story_id": 1019, "grade_code": "G4-L19", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L19.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L19.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手"}, {"type": "guide", "text": "深夜，一場猛烈的火災吞噬了整棟大樓，濃煙不斷從建築物內竄出，現場瀰漫著焦味。驚慌的居民受困其中，消防員立刻趕赴現場，全力(  E  )受困者。"}, {"type": "guide", "text": "要(  G  ) 艱難危險的救援任務，消防員必須具備專業的(  A  )，熟練操作各種滅火與救援設備。在看不清楚方向的火場中，他們的感官變得異常(  B  )，能迅速發現濃煙中的求救信號，及時搶救(  D  )者。"}, {"type": "fill_table"}, {"type": "guide", "text": "當文章的內容讓人看得眼花撩亂時，讀者可以試著用表格整理訊息。這樣做不但可以幫助我們掌握重點，還可以培養訊息整理的能力。在本課提到，救援行動中使用巨鼠好處多多，這時，我們就可以把狗與巨鼠放在一起進行比較，做成表格，就可以讓人一目了然兩者的差異囉。\n整理表格步驟：\nA.請在表格的「第一列」先寫出比較的對象：巨鼠與狗\nB.找出比較的重點，當文章中出現像是「但是」、「不同」、\n「比較」這些語詞時，就表示作者可能正在拿兩件事來比較喔！\n　範例：訓練有素的巨鼠可以跟多位訓練員合作，\n        但狗通常只接受一位訓練員的指導。\n❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）\n  巨鼠可以跟　多位　□一位　訓練員合作，\n　狗只接受　　□多位　一位　訓練員指導。\n❷這句話比較的重點是什麼？\n　可合作訓練員數量　　□嗅覺能力　\nC.將比較重點：「可合作訓練員數量」填入「第一欄」\nD.在空白格子內填入比較的結果\n     巨鼠可合作訓練員數量多位，狗可合作訓練員數量只有一位。\n\t\n　　\n總結：根據這個表格進行分析，提出結論。"}, {"type": "guide", "text": "◎小試身手："}, {"type": "free_text", "prompt": "1.現在讓我們找出每一題比較的重點"}, {"type": "free_text", "prompt": "(1)此外，巨鼠體型小，狗無法通過的瓦礫縫󠇡隙，巨鼠卻可以輕而易舉的鑽過。"}, {"type": "free_text", "prompt": "❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）"}, {"type": "guide", "text": "巨鼠的體型比狗【□大 小】，可以【輕易 □無法】鑽過瓦礫縫。"}, {"type": "single", "prompt": "❷這句話比較的重點是什麼？□訓練員數量　體型  □成本。", "options": ["訓練員數量", "體型", "成本。"], "answer": "體型"}, {"type": "free_text", "prompt": "(2)飼養和訓練巨鼠的成本比較低，不必花很多錢，只要有老鼠飼料和香蕉作為獎勵就可以了。"}, {"type": "free_text", "prompt": "❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）"}, {"type": "guide", "text": "巨鼠訓練時需要的食物獎勵是【□昂貴的專業食品 簡單的飼料和香蕉】，所以巨鼠的訓練成本比狗【□高 低】。"}, {"type": "free_text", "prompt": "❷這句話比較的重點是什麼？　　訓練成本"}, {"type": "free_text", "prompt": "2.請將比較重點與比較的訊息填入表格內(請打勾，單選)"}, {"type": "free_text", "prompt": "3.想一想這些重點可以告訴我們什麼？"}, {"type": "single", "prompt": "❶誰可以跟多位訓練員合作？ 巨鼠   □狗", "options": ["巨鼠", "狗"], "answer": "巨鼠"}, {"type": "single", "prompt": "❷誰可以鑽過瓦礫縫隙？ 巨鼠   □狗", "options": ["巨鼠", "狗"], "answer": "巨鼠"}, {"type": "single", oogleapis.com/lingoleap-assets/worksheets/G4-L20.docx", "blocks": [{"type": "guide", "text": "你發現了嗎？這三篇都是說明文，作者用不同角度的例子說明「物以稀為貴」與物價波動"}, {"type": "guide", "text": "提出待說明概念 → 舉例（不同角度）→ 說明主題概念 → 下結論"}, {"type": "guide", "text": "第一篇（商品市場）：物價由供給與需求決定"}, {"type": "single", "prompt": "什麼因素決定了商品的價格？", "options": ["需求＞供給", "需求＜供給"], "answer": "需求＞供給"}, {"type": "single", "prompt": "颱風來，大量青菜被風雨打壞了，青菜價格變貴", "options": ["需求＞供給", "需求＜供給"], "answer": "需求＜供給"}, {"type": "single", "prompt": "農民搶種高麗菜，市場湧入大量高麗菜，高麗菜價格變便宜", "options": ["需求＞供給", "需求＜供給"], "answer": "需求＜供給"}, {"type": "guide", "text": "第三篇（人力市場）：供需也會影響薪水高低"}, {"type": "single", "prompt": "工作技術門檻高（引水人），市場稀缺性高，薪水高", "options": ["需求＞供給", "需求＜供給"], "answer": "需求＞供給"}, {"type": "single", "prompt": "工作技術門檻低（一般工作），市場稀缺性低，薪水低", "options": ["需求＞供給", "需求＜供給"], "answer": "需求＜供給"}], "hist": {"guide": 4, "single": 5}, "n_blocks": 9, "n_q": 5, "layout": "standard", "stype": "multiple_perspectives", "sname": "以不同角度的例子說明概念", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的內容是「閱讀聚光燈」步驟，其文字內容與提供的【聚光燈完整 block 文字】完全一致。內容圍繞著本課主題「物以稀為貴：從『供給』和『需求』談物價波動」，並透過商品市場和人力市場的例子來解釋供需關係，忠實地服務了本課的教學目標。排版正常，沒有圖片載入失敗或空白骨架的問題。", "fix": null, "table_gap": null}, {"code": "G4-L23", "title": "心，也要一起練", "story_id": 1023, "grade_code": "G4-L23", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L23.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L23.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手："}, {"type": "guide", "text": "練習一：從日常情境練習覺察自己的情緒和想法，能讓我們更懂自己，也更懂得照顧自己。請根據每個情境勾選或填寫你的想法。（可複選）"}, {"type": "guide", "text": "情境一：明天段考要考你最在乎的那一科。"}, {"type": "self_check", "items": ["緊張", "焦慮", "專注", "期待", "有點壓力", "自信", "好奇"]}, {"type": "self_check", "items": ["想知道自己的實力", "怕被嘲笑", "怕被比較", "怕被罵", "想挑戰自己", "對自己沒有信心"]}, {"type": "self_check", "items": ["睡不著", "更專心準備", "覺得煩躁", "想再複習一次", "越想越慌", "告訴自己「盡力就好」"] x": null, "table_gap": null}, {"code": "G4-L4", "title": "運動科學", "story_id": 4, "grade_code": "G4-L04", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L4.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L04.docx", "blocks": [{"type": "single", "prompt": "◎小試身手：因為不同類型的運動方式是相互衝突的。以下哪一種運動組合是最佳的？(單選)", "options": ["週一早上慢跑，下午再重訓。", "週一早上慢跑，週二早上重訓。"], "answer": "週一早上慢跑，週二早上重訓。"}, {"type": "single", "prompt": "1.辨別句子的意思，選出適當的分句，在□打勾。(單選)", "options": ["辨別句子的意思，選出適當的分句，在", "打勾。(單選)"], "answer": "辨別句子的意思，選出適當的分句，在"}, {"type": "free_text", "prompt": "2.連連看，先圈出關聯詞，再將相關的句子連起來。"}, {"type": "figure", "referent": "table", "asset": "fig2.png", "bind_paragraph": null}, {"type": "guide", "text": "3.句型大比拚：我們這幾課學過了許多關聯詞，現在我們將這些關聯詞整理在下方的方框內。請你將適當的關聯詞填入括號內，成為一個通順的句子。"}, {"type": "free_text", "prompt": "(1)小美【 不但    】功課好，【 而且    】熱心助人。"}, {"type": "free_text", "prompt": "(2)【 雖然    】實驗失敗了，【 但是    】愛迪生絲毫不氣餒。"}, {"type": "free_text", "prompt": "(3)【 只要   】晚上早點睡，白天上課【 就   】不會打瞌睡了。"}, {"type": "free_text", "prompt": "(4)每次出門，爸爸會【 先   】把車子擦乾淨，【 然後    】再開車。"}, {"type": "free_text", "prompt": "(5) 【 無論   】謊言聽起來多麼動聽，最終【 都    】會被人拆穿的"}], "hist": {"single": 2, "free_text": 6, "figure": 1, "guide": 1}, "n_blocks": 10, "n_q": 8, "layout": "standard", "stype": "writing_technique", "sname": "認識句型-條件複句", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G4-L5", "title": "穿越極限的跑者", "story_id": 5, "grade_code": "G4-L05", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L5.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L05.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手：請勾選出指稱詞（框框內的語詞）所代表的事物。"}], "hist": {"guide": 1}, "n_blocks": 1, "n_q": 0, "layout": "standard", "stype": "inference", "sname": "推論策略-推論代名詞", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G4-L6", "title": "這是什麼「意思」？", "story_id": 1006, "grade_code": "G4-L6", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L6.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L6.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手："}, {"type": "guide", "text": "閱讀題目，並回到課文段落閱讀，勾選出指稱詞（框框內的語詞）所代表的事物。"}, {"type": "guide", "text": "推論三步驟："}, {"type": "free_text", "prompt": "1.往前文找找：代名詞代替的人物、狀況，一定是文章前面有提到的內容、事物。當不確定代名詞在指什麼時，可以往前文找找，再根據代名詞後面的描述來推論。"}, {"type": "free_text", "prompt": "2.圈詞＋畫線：往前文找找時，你可以先把代名詞(他/她/它/牠、這/那)圈起來，畫條線連到指稱的對象。會更清楚喔。"}, {"type": "free_text", "prompt": "3.代入句子讀讀看：如果你還不太確定，可以把指稱的對象，替換到句子中讀讀看，讀起來合理了，就對了。"}, {"type": "guide", "text": "例如：\n雖然老師連假前派了一堆作業，但這對美美來說是小意思。"}, {"type": "guide", "text": "◎推論小偵探："}, {"type": "guide", "text": "底下文字中的「這」是指不同的事情，請試試看推論「這」是指什麼？"}, {"type": "passage", "source": "unknown", "paragraphs": ["小恩今天到教室後，發現抽屜裡多了一張紙條。這會是誰放的呢？，他心裡有點驚訝。紙條上寫著：「加油！你一定可以的！」看到這，小恩忍不住笑了。他立刻想到，是不是昨天他和朋友說完自己很擔心數學考試後，朋友偷偷放的？", "A：第一個「這」是指(  紙條   )；第二個「這」是指(  紙條的字     )"]}], "hist": {"guide": 6, "free_text": 3, "passage": 1}, "n_blocks": 10, "n_q": 3, "layout": "standard", "stype": "inference", "sname": "推論策略-推論代名詞", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的內容是關於「推論代名詞」的通用閱讀策略教學，包含「往前文找找」、「圈詞+畫線」、「代入句子讀讀看」等步驟。雖然截圖中的範例「美美」與本課無關，但這屬於教學鷹架中的示範例，且完整 block 文字中包含與本課相關的「小恩」範例，因此內容忠實於通用教學策略，並未張冠李戴。", "fix": null, "table_gap": null}, {"code": "G4-L7", "title": "正太與小豬：武僧的養成之路", "story_id": 1007, "grade_code": "G4-L7", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L7.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L7.docx", "blocks": [{"type": "guide", "text": "你喜歡看故事嗎？相信很多人的答案都是肯定的。故事到底有什麼魔力讓人想要一看再看呢？原來，看故事能讓讀者身歷其境，對主角產生認同感，因而更能體驗到作者想傳達的道理，因此更具說服力，也更容易被記住。\n　　然而，要理解作者在故事裡想傳達的核心理念，不能只有讀者個人的主觀看法，還需要從文本中找到足夠的支持證據。舉例來說：\n　　例一：正太與小豬的第十一段\n原來啊，豬本來小小的，很輕，但牠每天都長大一點點，這一點點的變化，抱的時候根本感覺不出來。每天加重一點點，加重一點點，根本感覺不出來有多難。在滴水穿石、循序漸進的努力之後，正太的筋骨肌肉慢慢適應這漸進的挑戰，過了一千多天，男孩變成身材魁梧󠇠、帥氣挺拔的男人，他跑得快、跳得高，能舉起寺裡最重的石臼，一般的匪徒強盜再也不是正太的對手了。\n　　從上面的文字來看，故事強調了循序漸進的努力所帶來的成長與蛻變。因此，我們可以合理推測，作者希望傳達「滴水穿石，只要持續努力，就有可能成功」的理念。\n　　例二：龜兔賽跑\n有一天，烏龜和兔子在聊天，不知不覺說到誰跑得比較快，於是兔子便邀約烏龜比賽跑步。一開始，兔子大幅領先烏龜，但不久後，兔子便開始輕敵，認為即使小睡一下，烏龜仍追趕不上牠，便到路邊睡覺。結果烏龜後來趕上，等到兔子醒了時，烏龜已經到達終點了。\n\n\n\n下面有兩個人的說法，你覺得誰的說法比較合理呢？（請打勾）\n❶小明說：「作者想要表達驕傲會讓人失敗的道理。因為兔子輕敵、驕傲自滿，才導致失敗。」\n□❷大華說：「作者想要表達驕傲會讓人失敗的道理。因為兔子天性懶惰愛睡覺，才導致失敗。」\n　　你答對了，小明的說法比較能被大家接受，因為他是從文章裡面找出支持的理由：「兔子是因為輕敵，認為即使小睡一下，烏龜也追不上牠。」而大華說：「兔子天性懶惰愛睡覺」，文章中根本沒有提到，這是大華自己講的，不是作者想傳達給讀者的道理。所以，要了解作者想用故事想傳達什麼道理，可以從文章中找支持理由。\n　　那麼，找到支持的理由後，如何用簡單的句子表達作者想傳達的道理呢？可以用兩個問題幫助你思考：\n　　❶文章有沒有強調某種品德？（例如：堅持、勇敢、勤奮）\n　　❷主角的經歷讓我們學到什麼道理？（例如：努力就有回報、勇敢挑戰才能成長）\n　　讓我們用例子說明：\n　　村子裡有四個兄弟，經常為小事爭吵，彼此不團結。一天，父親拿來一捆竹筷，讓每個孩子試著折斷它。他們用盡全力，但無法折斷。接著，父親拆開筷子，讓他們一根一根折，結果輕鬆就折斷了。\n　　父親說：「你們就像這捆筷子，團結在一起，就無比強大；若各自為戰，就容易被擊敗。」兄弟們恍然大悟，從此學會合作，村子也因此變得更繁榮。\n❶文章強調了什麼品德（請打Ｖ）？【團結合作  □勤奮努力　】\n❷主角的經歷讓我們學到什麼？（請打Ｖ）\n【團結力量大　　□要聽老人家的話】\n現在就讓我們練習看看吧！"}, {"type": "guide", "text": "◎ 小試身手："}, {"type": "guide", "text": "破掉的水桶"}, {"type": "guide", "text": "一個農夫每天用兩個水桶從河裡取水回家，其中一個水桶有裂縫，每次走回家時，它總是漏掉一半的水，而另一個水桶則能保持完整的水量。"}, {"type": "guide", "text": "破掉的水桶很自卑，對農夫說：「對不起，我讓你浪費了一半的水。」但農夫笑著回答：「你有沒有注意到，沿路的花都只長在你的那一側？因為你的裂縫讓水滴落在地上，澆灌了這條路旁的花朵，讓我們有了一條美麗的小路！」"}, {"type": "guide", "text": "一、先從文章線索判斷角色的想法"}, {"type": "guide", "text": "（一）破掉的水桶"}, {"type": "free_text", "prompt": "1.從文章中找線索，請將「破掉的水桶」說的話用螢光筆畫線。"}, {"type": "free_text", "prompt": "2.想想看，為什麼破掉的水桶會說這句話？(請打勾)"}, {"type": "guide", "text": "它認為自己的裂縫使水流失，覺得自己沒有用，因此感到內疚。"}, {"type": "guide", "text": "□ 它擔心農夫會因為它的缺陷而丟棄它，所以試圖討好農夫。"}, {"type": "guide", "text": "（二）農夫"}, {"type": "free_text", "prompt": "1.從文章中找線索，請將「農夫」說的話用螢光筆畫線。"}, {"type": "free_text", "prompt": "2.想想看，農夫和破水桶的說法有什麼不同？(請打勾)"}, {"type": "guide", "text": "□破水桶認為不應該浪費水，農夫水很多漏掉沒關係。"}, {"type": "guide", "text": "同一件事，破水桶看到負面的缺點，但農夫卻看到正面的優點。"}, {"type": "guide", "text": "二、這篇文章作者想要傳達什麼道理"}, {"type": "guide", "text": "從農夫和破水桶的想法，想一想作者想要傳達什麼道理？(請打勾)"}, {"type": "single", "prompt": "❶文章強調了什麼品德？【正向思考  □勤勞努力　】", "options": ["【正向思考", "勤勞努力", "】"], "answer": "【正向思考"}, {"type": "free_text", "prompt": "❷主角的經歷讓我們學到什麼道理？(多選)"}, {"type": "guide", "text": "□人生應該盡量避免失敗，追求完美才能心靈滿足。"}, {"type": "guide", "text": "每個人都有自己的價值，不必因為不完美而自卑。"}, {"type": "guide", "text": "換個角度，不完美的事物也可能有獨特的貢獻。"}, {"type": "guide", "text": "□只要你努力達成目標，過程中的小瑕疵並不重要。"}], "hist": {"guide": 18, "free_text": 5, "single": 1}, "n_blocks": 24, "n_q": 6, "layout": "standard", "stype": "inference", "sname": "推論策略-找出故事道理", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容包含「正太與小豬的第十一段」的課文內容，並以此為例說明如何從故事中找出作者想傳達的道理。雖然也舉了龜兔賽跑和竹筷的故事作為通用教學鷹架，但主體內容仍圍繞本課，且「破掉的水桶」的練習題也與本課主題「正向思考」相關，排版正常，無破圖。", "fix": null, "table_gap": null}, {"code": "G4-L8", "title": "最美的畫面", "story_id": 1008, "grade_code": "G4-L8", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L8.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L8.docx", "blocks": [{"type": "guide", "text": "「主旨」是作者在寫作時，想要傳達給讀者的主要想法或訊息。我們在閱讀時，如果可以找出文章主旨，就能快速掌握文章要傳達的重點。\n　　我們可以利用底下的三種線索找出主旨。\n線索一：從文章題目找主旨\n文章題目經常會明示或暗示文章的主旨，我們可以想想作者為何訂下這樣的題目，再比對內容，了解作者的想法。\n例如：＜昆蟲的保命妙招＞\n→文章主旨是：　　昆蟲有許多保護自己的方法　　　。\n\n線索二：從文章的開頭或結尾找主旨 \n有些文章在開頭或結尾段提示了文章的主旨。\n例如：＜小孩與糖果＞──本文選自伊索寓言\n　　一個小孩把手伸進裝滿糖果的瓶子中，他想盡可能地抓上一大把。但是當他想要伸出手來時，手卻被瓶口卡住了。他一個糖果也不願意放，因此手緊緊卡住，拔不出來，急得哭了起來。一個路人對他說：「你還是知足點兒吧，只要少拿一半，你的手就不會卡在瓶口了。」人還是要知足，貪多可能危害自己啊。\n→文章主旨是：告訴讀者　人要知足，不可貪心       　。\n\n線索三：從段落大意或關鍵語句找主旨\n有時作者會在文章的某個段落，用關鍵句明示或暗示出想表達的觀點。\n\n\n例如：＜ＯＯ的重要＞ ──本文修改自國立編譯館\n　　小明放學回家，告訴媽媽：「老師說，學校的春季旅行在四月二日上午出發。參加的同學，要準時到校，在操場上集合。」\n　　媽媽問小明說：「老師說幾點要到學校集合？」\n　　小明想了想說：「好像是八點，差不多跟平常一樣時間到校就好了，沒什麼關係吧。」\n　　媽媽說：「不能說『好像是』，也不能『差不多』!守時是很重要的事。不能遲到，讓大家等你一個人。你明天到學校，一定要再問老師。」\n　　小明說：「我知道了，我明天會再問老師。我也一定會守時，請媽媽放心。」\n1.請先將媽媽的話，用螢光筆畫起來。\n2.從媽媽的話推論「本文主旨」是說明：　守時的重要　　 　。"}, {"type": "guide", "text": "◎ 小試身手：以本課＜最美的畫面＞為例"}, {"type": "guide", "text": "線索一：從文章題目找主旨"}, {"type": "free_text", "prompt": "1.請問根據課文的文章題目是最美的畫面，可以找出主旨嗎？"}, {"type": "guide", "text": "□可以　不可以"}, {"type": "guide", "text": "線索二：有些文章在開頭或結尾段提示了文章的主旨。"}, {"type": "guide", "text": "現在，我出門也會在背包裡放一本書，一有空檔就拿出來讀，我猜，現在我也成了別人眼中最美的畫面啦！"}, {"type": "free_text", "prompt": "2.作者覺得自己在別人眼中最美的畫面是：　看書的樣子　    　。"}, {"type": "guide", "text": "線索三：從段落大意或關鍵語句找主旨。(課文第三段)"}, {"type": "guide", "text": "瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。"}, {"type": "free_text", "prompt": "3.作者覺得阿姨閱讀時的樣子如何? 　專注而優雅　            。"}, {"type": "free_text", "prompt": "4.總結上述線索，本文的主旨是："}, {"type": "guide", "text": "作者鼓勵讀者【  多閱讀　】，成為別人眼中【  最美的畫面　　   】。"}], "hist": {"guide": 9, "free_text": 4}, "n_blocks": 13, "n_q": 4, "layout": "standard", "stype": "main_idea_inference", "sname": "推論策略-找出文章主旨", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的內容是關於「找出文章主旨」的閱讀策略，並提供了三個線索。雖然開頭的範例使用了其他課文（如《昆蟲的保命妙招》、《小孩與糖果》和《OO的重要》），但「小試身手」部分明確指出以本課《最美的畫面》為例進行練習，且後續的問題都圍繞著本課內容，例如詢問「作者覺得自己在別人眼中最美的畫面是：看書的樣子」等，與本課課文內容完", "fix": null, "table_gap": null}, {"code": "G4-L9", "title": "大自然的氣象小幫手", "story_id": 1009, "grade_code": "G4-L9", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L9.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G4-L9.docx", "blocks": [{"type": "guide", "text": "這是一篇說明文，主要說明「大自然有許多線索可以幫助人們預測天氣」，作者舉了一些例子，來支持這個觀點。閱讀這樣的文章，你只要抓住這篇文章主要想表達什麼？文章舉了哪些例子來支撐？這些例子有沒有重要的細節？你就抓到文章的重點囉！\n    接下來，我們先來練習找到文章舉了哪些例子？請勾選你覺得比較清楚的答案？\n第三段： □1.蜘蛛      2.蜘蛛結網  \n第五段： □1.蟋蟀      2.蟋蟀叫聲\n第六段： □1.毛小孩    2.毛小孩的行為\n第七段： □1.天空      2.日暈和月暈\n　　你發現了嗎？其實這四段，1和2的答案都可以，但2更具體、清楚喔！\n　　找到例子後，接下來把重要的細節找出來，你就可以抓到文章的重點囉！要怎麼找到重要的細節呢？你要扣住主題，來判斷重要細節。這一課主要是講「推測天氣」，所以我們要把和「推測天氣」有關的重要描述找出來。\n　我們先用「第三段──蜘蛛結網」試試看：\n❶找重要細節：如何從「蜘蛛結網」推測具體天氣？（4選2）\n□1.蜘蛛的絲纖細到幾乎隱形，又怕風、又怕雨。\n□2.如果即將下雨，它們察覺空氣中的濕度，就不會浪費力氣結一張會被雨打壞的大網。\n3.當你看到蜘蛛在結網時，代表空氣是乾的，天氣會穩定，可能還會放晴。\n4.如果你發現蜘蛛網縮得很小，甚至整張網都不見了，也許就是快要下雨的信號。\n❷精簡：請將勾選出的答案，歸納成一句話\n□蜘蛛的網非常脆弱，要小心保護。\n蜘蛛結大網代表天氣晴，縮小或消失則是要下雨。\n□蜘蛛覓食方式會因濕度不同而改變。"}, {"type": "guide", "text": "◎小試身手："}, {"type": "free_text", "prompt": "1.第四段──蟋蟀叫聲"}, {"type": "free_text", "prompt": "❶找重要細節：如何從「蟋蟀叫聲」推測具體天氣？（3選1）"}, {"type": "free_text", "prompt": "3.如果錄下草叢裡蟋蟀的叫聲，看看15秒可以叫幾聲，把這個數字加5，再除以2，大概就是現在的氣溫。"}, {"type": "guide", "text": "小提醒："}, {"type": "guide", "text": "這三個句子看起來都和推測天氣有關，但是如果要推測具體天氣的話，第三句比較合適。"}, {"type": "free_text", "prompt": "❷精簡：請將勾選的答案，再精簡。"}, {"type": "guide", "text": "□記下蟋蟀叫聲就能知道明天會不會下雨。"}, {"type": "guide", "text": "□蟋蟀叫聲快慢只和牠心情好壞有關。"}, {"type": "guide", "text": "數蟋蟀 15 秒內的叫聲，加 5 再除 2，就能估算當前氣溫。"}, {"type": "free_text", "prompt": "2.第七段──天空"}, {"type": "free_text", "prompt": "❶找重要細節：如何從「日暈、月暈」推測具體天氣？（3選1）"}, {"type": "free_text", "prompt": "1.看到日暈表示夜裡會下雨，看到月暈白天就會起風。"}, {"type": "free_text", "prompt": "❷精簡：請將勾選的答案，再精簡。"}, {"type": "guide", "text": "日暈夜雨，月暈日風。"}, {"type": "guide", "text": "□天空出現光環代表天氣長期穩定。"}, {"type": "guide", "text": "□看到月亮有暈就一定會下一整天的大雨。"}, {"type": "passage", "source": "unknown", "paragraphs": ["恭喜你，你已經完成任務了，以後看到長篇文字時，先找出主題，再找出重要的細節，最後用一句話精簡內容，你就能很快抓住文章重點囉。"]}], "hist": {"guide": 10, "free_text": 8, "passage": 1}, "n_blocks": 19, "n_q": 8, "layout": "standard", "stype": "summary", "sname": "摘要策略-列舉結構：找重要細節", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容與提供的【聚光燈完整 block 文字】一致，頁面引導學生練習從課文《大自然的氣象小幫手》中找出重要細節，並以蜘蛛結網、蟋蟀叫聲、日暈月暈等課文內容作為練習素材。排版正常，無破圖或空白內容。", "fix": null, "table_gap": null}, {"code": "G5-L10", "title": "從童工到大學教授之路", "story_id": 10, "grade_code": "G5-L10", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L10.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L10 age": 1}, "n_blocks": 42, "n_q": 17, "layout": "standard", "stype": "summary", "sname": "摘要策略-刪除法找重點（刪除舉例", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "cross_lesson", "reasoning": "截圖中的「小試身手」段落描述了烤肉聚餐的場景，並提到「臺東有名的風景區，如鹿野高台、池上伯朗大道等」，這些內容與本課《垃圾食物的誘惑與代價》的主題完全無關。頁面主體內容明顯是其他課文的範例。", "fix": "judge 誤判:臺東是教刪除法的範例,後面套用本課垃圾食物(餅乾/洋芋片在原文)", "table_gap": null}, {"code": "G5-L16", "title": "臺灣棒球先驅──來自花蓮的能高團", "story_id": 1043, "grade_code": "G5-L16", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L16.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L16.docx", "blocks": [{"type": "guide", "text": "◎小試身手：以「高砂棒球隊／能高團」為中心，提取相關上位概念。"}, {"type": "guide", "text": "一、找出上位概念：請判斷文章中粗楷體文字的上位概念，並從右欄中選出正確答案，填在【    】裡"}, {"type": "fill_table"}, {"type": "guide", "text": "二、練習提取上位概念：請閱讀以下段落，根據內容，填寫對應的上位概念。"}, {"type": "guide", "text": "1925年，能高團赴日比賽，首戰面對豐島師範棒球隊，前四局以28比0大幅領先，獲「若武者」稱號。"}, {"type": "guide", "text": "◎從這段文章可以看出："}, {"type": "guide", "text": "「1925」是比賽的【　　時間 　　 】"}, {"type": "guide", "text": "「日本」是比賽的【　　地點 　　】"}, {"type": "guide", "text": "「豐島師範棒球隊」是比賽的【　　對手　　】"}, {"type": "guide", "text": "「28比0」是比賽的【　　比數／結果　　　】"}, {"type": "guide", "text": "「若武者」是比賽後他們得到的【　　稱號  　】"}, {"type": "guide", "text": "三、延伸練習：請閱讀以下段落，根據內容，提取上位概念。"}, {"type": "guide", "text": "2021年，臺灣羽球選手李洋與王齊麟在東京奧運男子雙打決賽中，以直落二擊敗中國隊，奪下臺灣史上首面奧運羽球金牌。比賽結束後，兩人被媒體譽為「麟 洋配」，成為全國矚目的焦點。這場比賽不僅創造歷史，也帶動臺灣羽球熱潮。"}, {"type": "guide", "text": "◎請閱讀這段文字後，填寫下表1, 2, 3的細節與上位概念，第4個空格，請你自己找一個細節，並寫出它的上位概念（可參考前面兩大題的作法）："}, {"type": "fill_table"}, {"type": "guide", "text": "在閱讀聚光燈時，我們整理了部分的上位概念，接著我們要練習從內容那欄中整理的上位概念尋找對應的文章細節，來完成文章重點表。"}, {"type": "fill_table"}], "hist": {"guide": 14, "fill_table": 3}, "n_blocks": 17, "n_q": 3, "layout": "standard", "stype": "main_idea_inference", "sname": "提取上位概念-從具體描述提取上位概念", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful_fixed", "judge_verdict": "faithful", "reasoning": "截圖內容是「提取上位概念」的教學活動，其中舉例的文本內容，包括「高砂棒球隊/能高團」的比賽描述，以及「1925年，能高團赴日比賽」的細節，都與本課課文《臺灣棒球先驅——來自花蓮的能高團》高度相關。雖然延伸練習中提到了「2021年，臺灣羽球選手李洋與王齊麟」的例子，但這屬於教學示範的通用範例，不影響頁面主體對本課的忠實性", "fix": "figure(table)→fill_table(重點表)", "table_gap": "表1 asset=None"}, {"code": "G5-L17", "title": "掃雷英雄馬嘎瓦", "story_id": 1044, "grade_code": "G5-L17", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L17.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L17.docx", "blocks": [{"type": "guide", "text": "如果一篇文章能善用表格整理訊息，就能讓讀者一目了然，更容易讀到重點。本課運用表格整理了「使用巨鼠掃雷」和「使用金屬探測器」的差異，就是一個好例子。底下以表１為例，說明閱讀表格的步驟：\n\n表1 兩種掃雷方式的比較：「金屬探測器」和「非洲巨鼠」\n\n　　　\n步驟一：閱讀表格標題\n標題會告訴我們表格想表達的主題喔。你會看到，表１的標題是【兩種掃雷方式的比較：「金屬探測器」和「非洲巨鼠」】，你心裡馬上就要浮現一個概念：「啊，我知道了，這個表格是要比較兩樣事物的。」\n\n步驟二：閱讀「第一列」和「第一欄」的小標題：\n小挑戰：請你閱讀表１的「第一列」和「第一欄」的小標題後，判斷一下，它們寫了什麼，並在正確的□打勾。(單選）\n「第一列」寫的是什麼？ 互相比較的對象  □比較的重點\n「第一欄」寫的是什麼？ □互相比較的對象  比較的重點\n\n步驟三：閱讀表格裡的內容\n請仔細閱讀下面(1)的範例說明，並以同樣的方法，回答(2)~(4)題，在正確的□打勾。(單選）\n(1)範例「只對TNT炸藥發出警報」是在表達什麼？\n□金屬探測器的效能 非洲巨鼠的效能 □非洲巨鼠的安全性\n說明：a.先找到「只對TNT炸藥發出警報」的格子；b.往第一列看，就是「非洲巨鼠」;往第一欄看是「效能」，所以題目「 」裡講的是「非洲巨鼠的效能」。\n再來，請你看著表1，回答底下的單選題\n(2)「掃雷人員常被地雷炸傷」是在表達什麼？\n□金屬探測器的效能 □非洲巨鼠的安全性 金屬探測器的安全性\n(3)「飼養和訓練便宜很多」是在表達什麼？\n□金屬探測器的成本  非洲巨鼠的成本  □金屬探測器的方便性\n(4)「在泥濘、雜草叢生處無法工作」是在表達什麼？\n金屬探測器的方便性 □非洲巨鼠的安全性 □非洲巨鼠的方便性\n\n步驟四：問自己，這個表在表達什麼？\n例如：不斷的問自己：「兩種掃雷方式，哪一種成本比較便宜？」你帶著這個疑問，在讀表１時，很容易就看到「3.成本」那列，你就會讀到，使用巨鼠掃雷便宜很多。\n小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(1)哪一種掃雷方式比較安全？   □金屬探測器   非洲巨鼠\n(2)哪一種掃雷方式效能比較好？ □金屬探測器   非洲巨鼠\n(3)哪一種掃雷方式比較不方便？ 金屬探測器   □非洲巨鼠\n\n步驟五：在文章裡找到這個表格的結論\n作者呈現表格之後，通常會在文字段落裡，做一個結論—簡單的寫出這個表格最重要的訊息。你閱讀文章第五段，判斷哪一句是這個表格的結論呢?\n簡單的說，以巨鼠掃雷相對安全、有效能、便宜而且方便。例如，馬嘎瓦可在30分鐘內掃描完一個網球場大小的區域，而人類使用金屬探測器則需要1至4天才能完成相同的任務。\n以巨鼠掃雷相對安全、有效能、便宜而且方便性高\n□巨鼠已經幫助清理2,300萬平方公尺的土地\n□巨鼠得到英國頒發的動物勇氣金牌獎\n\n※自我評估：「利用這五個步驟，我學會怎樣讀表格了嗎？」\n□我學會了    □我還沒學會"}, {"type": "single", "prompt": "小挑戰：請你閱讀表１的「第一列」和「第一欄」的小標題後，判斷一下，它們寫了什麼，並在正確的□打勾。(單選）\n「第一列」寫的是什麼？", "options": ["互相比較的對象", "比較的重點"], "answer": "互相比較的對象"}, {"type": "single", "prompt": "小挑戰：請你閱讀表１的「第一列」和「第一欄」的小標題後，判斷一下，它們寫了什麼，並在正確的□打勾。(單選）\n「第一欄」寫的是什麼？", "options": ["互相比較的對象", "比較的重點"], "answer": "比較的重點"}, {"type": "single", "prompt": "請仔細閱讀下面(1)的範例說明，並以同樣的方法，回答(2)~(4)題，在正確的□打勾。(單選）\n(1)範例「只對TNT炸藥發出警報」是在表達什麼？", "options": ["金屬探測器的效能", "非洲巨鼠的效能", "非洲巨鼠的安全性"], "answer": "非洲巨鼠的效能"}, {"type": "single", "prompt": "再來，請你看著表1，回答底下的單選題\n(2)「掃雷人員常被地雷炸傷」是在表達什麼？", "options": ["金屬探測器的效能", "非洲巨鼠的安全性", "金屬探測器的安全性"], "answer": "金屬探測器的安全性"}, {"type": "single", "prompt": "再來，請你看著表1，回答底下的單選題\n(3)「飼養和訓練便宜很多」是在表達什麼？", "options": ["金屬探測器的成本", "非洲巨鼠的成本", "金屬探測器的方便性"], "answer": "非洲巨鼠的成本"}, {"type": "single", "prompt": "再來，請你看著表1，回答底下的單選題\n(4)「在泥濘、雜草叢生處無法工作」是在表達什麼？", "options": ["金屬探測器的方便性", "非洲巨鼠的安全性", "非洲巨鼠的方便性"], "answer": "金屬探測器的方便性"}, {"type": "single", "prompt": "小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(1)哪一種掃雷方式比較安全？", "options": ["金屬探測器", "非洲巨鼠"], "answer": "非洲巨鼠"}, {"type": "single", "prompt": "小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(2)哪一種掃雷方式效能比較好？", "options": ["金屬探測器", "非洲巨鼠"], "answer": "非洲巨鼠"}, {"type": "single", "prompt": "小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(3)哪一種掃雷方式比較不方便？", "options": ["金屬探測器", "非洲巨鼠"], "answer": "金屬探測器"}, {"type": "single", "prompt": "你閱讀文章第五段，判斷哪一句是這個表格的結論呢?", "options": ["以巨鼠掃雷相對安全、有效能、便宜而且方便性高", "巨鼠已經幫助清理2,300萬平方公尺的土地", "巨鼠得到英國頒發的動物勇氣金牌獎"], "answer": "以巨鼠掃雷相對安全、有效能、便宜而且方便性高"}], "hist": {"guide": 1, "single": 10}, "n_blocks": 11, "n_q": 10, "layout": "standard", "stype": "info_organization", "sname": "用表格整理訊息-表格閱讀策略", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「用表格整理訊息-表格閱讀策略」，並以「掃雷英雄馬嘎瓦」課文中的「金屬探測器」和「非洲巨鼠」的比較表格作為範例進行教學。頁面上的文字內容、舉例和練習題都緊密圍繞著這篇課文的主題和內容，沒有出現與其他課文相關的主體內容。排版正常，沒有圖片載入失敗。", "fix": null, "table_gap": null}, {"code": "G5-L18", "title": "魚來了，叮咚叮咚請開門", "story_id": 1045, "grade_code": "G5-L18", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L18.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L18.docx", "blocks": [{"type": "guide", "text": "這篇故事是一篇說明文，講「魚兒迴游時被閘門擋住」的解決過程。故事從第四段開始有明顯的「問題、解決、結果」結構。但閱讀時，如何找到文章中的問題、解決、結果呢？我們可以用一些線索來做判斷喔！\n我們來練習用兩步驟（❶找元素對應的段落 ❷找重點句）找「問題、解決、結果」。"}, {"type": "guide", "text": "一、找「問題」"}, {"type": "guide", "text": "※祕訣：「問題」描述一個「需要解決的壞事或困難」。"}, {"type": "free_text", "prompt": "❶找段落："}, {"type": "passage", "source": "unknown", "paragraphs": ["「問題」在哪個段落？（請在□打勾，單選）", "【□段1、2、3　　　段4　　　　□段5　　】", "「問題」通常出現文章的前面，但這篇文章花了比較長的篇幅說明故事的背景。第四段才是描述「問題」，是在描述魚兒遭遇的問題。"]}, {"type": "free_text", "prompt": "❷找重點句："}, {"type": "passage", "source": "unknown", "paragraphs": ["本文第四段有三個句子，都在描述「壞事」，請判斷哪一個句子是「重點句」。(請在□打勾，三選一。)", "句1：但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。", "□句2：當萬頭鑽動的魚兒卡在閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖的時機，導致魚寶寶的數量減少，影響整個魚群的生存。", "□句3：為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。"]}, {"type": "guide", "text": "小撇步："}, {"type": "passage", "source": "unknown", "paragraphs": ["這段有3個句子，3句都是描述「壞事」，第一句是重點句，直接說明魚兒的困難。第二句是補充說明，第三句解決這個問題的舊方法。所以我留下第一句，並把第一句畫線。"]}, {"type": "guide", "text": "二、找「解決」"}, {"type": "guide", "text": "※祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。"}, {"type": "free_text", "prompt": "❶找段落："}, {"type": "passage", "source": "unknown", "paragraphs": ["「解決」在哪個段落？（請在□打勾，單選）", "【□段4　　段5　　□段6　　】"]}, {"type": "free_text", "prompt": "❷找重點句：（第5段）"}, {"type": "passage", "source": "unknown", "paragraphs": ["請你先判斷哪些句子是描述「有人想出辦法或行動的句子」的重點句。（請在□打勾，四選一）", "句1：一位名叫馬克·范赫斯的生態學家為了解決這個問題，便和一群工程師、科學家合作，在荷蘭烏特勒支市的運河設計了「魚門鈴」。"]}, {"type": "guide", "text": "□句2：他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。"}, {"type": "guide", "text": "□句3：這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按鈕。"}, {"type": "passage", "source": "unknown", "paragraphs": ["□句4：運河管理員收到訊息後，便會開啟閘門，讓魚兒順利通過。"]}, {"type": "guide", "text": "小撇步："}, {"type": "passage", "source": "unknown", "paragraphs": ["這段4個句子都是描述為了解決魚兒被閘門擋住的問題，做了什麼事。第一句是重點句，第二～四句是補充說明「魚門鈴」怎麼用。"]}, {"type": "guide", "text": "三、找「結果」"}, {"type": "passage", "source": "unknown", "paragraphs": ["祕訣：「結果」通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變。"]}, {"type": "free_text", "prompt": "❶找段落："}, {"type": "guide", "text": "「結果」在哪個段落？（請在□打勾，單選）"}, {"type": "guide", "text": "【□段4　　□段5　　段6　　□段7　　】"}, {"type": "free_text", "prompt": "❷找重點句：（第6段）"}, {"type": "guide", "text": "請你先判斷哪個句子是描述「行動後帶來的改變」的重點句。（請在□打勾，二選一）"}, {"type": "guide", "text": "□句1：「魚門鈴」上線後，效果超乎預期！"}, {"type": "passage", "source": "unknown", "paragraphs": ["句2：從2019年啟動以來，幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康"]}, {"type": "guide", "text": "小撇步："}, {"type": "passage", "source": "unknown", "paragraphs": ["這段2個句子都是描述裝了「魚門鈴」之後，帶來什麼改變。第二句是重點句，因為第二句的概念才完整。成果（改變）包括魚兒順利通過閘門＋運河生態變健康。"]}, {"type": "guide", "text": "一、請你自己檢查以下3項，確定自己是否會抓重點了"}, {"type": "guide", "text": "二、如果三項都打勾，恭喜你，你已經學會找文章「問題、解決、結果」的方法，這對你理解文章、掌握文章重點，都有很大的幫助哦。你超厲害的！"}, {"type": "passage", "source": "unknown", "paragraphs": ["這是一篇問題解決結構的文章，閱讀聚光燈你已經學會怎麼用線索來找重點，接著，我們就來整理本課的重點嘍！"]}, {"type": "fill_table"}, {"type": "self_check", "items": ["我學到怎麼找出「問題」，知道故事一開始面臨什麼困境。", "我學到怎麼找出「解決」，了解主角/相關人物做了什麼來解決問題。", "我學到怎麼找出「結果」，說明解決行動帶來了哪些具體改變或成果。"]}], "hist": {"guide": 17, "free_text": 6, "passage": 11, "fill_table": 1, "self_check": 1}, "n_blocks": 36, "n_q": 7, "layout": "standard", "stype": "summary_pse", "sname": "摘要策略-問題.解決結構找重點", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容明確指出「這篇故事是一篇說明文，講『魚兒迴游時被閘門擋住』的解決過程」，並提及「問題、解決、結果」的結構，這些都與提供的課文《魚來了，叮咚叮咚請開門》主題高度吻合。頁面引導學生練習找尋文章中的問題、解決、結果，是忠實於本課內容的教學策略。", "fix": null, "table_gap": null}, {"code": "G5-L2", "title": "以植物為師的科學", "story_id": 1029, "grade_code": "G5-L2", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L2.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L2.docx", "blocks": [{"type": "guide", "text": "在「L1兵來將擋，水來土掩」中，我們學習到了拆詞釋義的方法，使用這個方法的前提是：1.我不知道這個詞的意思; 2.但我知道組成這個詞的字或詞的意思。這種方法可以幫助我們用字義推論出語詞的意思，現在我們來複習一下「拆詞釋義」的步驟。\n❶將目標語詞拆解成較小的單位（字或詞）。\n❷想想看（拆解後的）字或詞的意思。\n❸把這些字詞的意思合併起來，推論目標語詞的完整詞義。\n❹放回句子唸一唸，判斷是否合理。\n❺檢核句子是否合理；如果不合理，可能這個詞不適合這個策略，請嘗試其它的方法（例如上下文推詞義、查字典）。\n例如：「引領」\n❶拆語詞：「引」和「領」。\n❷找個別詞義：引引導；領帶領。\n❸合併(並推論)完整的詞義：引領引導帶領。\n❹放回句子唸一唸：\n讓我們一起看看這些植物老師如何引領科學家走上創新之路！　　　　　　　　　　　　　　　　　　\n　　　　　　　　　　　　　　引導帶領\n　❺檢核：合理，進行下一個任務　　\n　　　　　  ⃞不合理，嘗試其他方法\n現在就讓我們一起練習看看吧！"}, {"type": "free_text", "prompt": "1.基礎題：請先圈出目標語詞的個別詞義，再把組成的意思寫下來。"}, {"type": "free_text", "prompt": "(1)這種向陽性讓科學家發明了一種能自動調整角度的仿生太陽能板。"}, {"type": "free_text", "prompt": "2.進階題：請先寫出目標語詞的個別詞義，再把組成的意思寫下來。"}, {"type": "free_text", "prompt": "(1)這些從大自然中獲取靈感，並應用在人類科技的學問，叫做仿生學。"}, {"type": "free_text", "prompt": "3.挑戰題：請先寫出組成目標語詞的個別字義或詞義，然後推論出語詞的意思。"}, {"type": "free_text", "prompt": "(1)探測器可以快速探索廣闊無垠的火星地表。（把「廣闊」當一個詞，不要再拆）注意：拆詞釋義也可能拆成比較小的詞彙，不一定是單一個字。"}, {"type": "free_text", "prompt": "❶拆語詞  ❷找個別詞義"}, {"type": "free_text", "prompt": "❸合併(並推論)完整的詞義："}, {"type": "free_text", "prompt": "❹放回句子唸一唸"}, {"type": "guide", "text": "❺檢核： ⃞合理"}, {"type": "guide", "text": "⃞不合理，嘗試其他方法"}, {"type": "free_text", "prompt": "(2)沙馬雷可以探索危機四伏的災難現場。（把「危機」當一個詞，不要再拆）注意：拆詞釋義也可能拆成比較小的詞彙，不一定是單一個字。"}, {"type": "free_text", "prompt": "❶拆語詞  ❷找個別詞義"}, {"type": "free_text", "prompt": "❸合併(並推論)完整的詞義："}, {"type": "free_text", "prompt": "❹放回句子唸一唸"}, {"type": "guide", "text": "❺檢核： ⃞合理"}, {"type": "guide", "text": "⃞不合理，嘗試其他方法"}, {"type": "free_text", "prompt": "(1)   仿生學        ：是模仿生物特殊本領的一門科學。"}, {"type": "free_text", "prompt": "(2)    廣闊無垠     ：形容廣大、寬闊，沒有邊界。"}, {"type": "free_text", "prompt": "(3)    盤旋         ：在空中環繞、旋轉；也可以形容在心裡一直存在的心事。例如，分手的痛苦一直在心中盤旋不去。"}, {"type": "free_text", "prompt": "(4)    危機四伏     ：到處隱藏著危險。"}, {"type": "free_text", "prompt": "(5)    險象環生    ：危險的狀況一直出現。"}, {"type": "free_text", "prompt": "(6)    向陽性      ：植物總是面向太陽轉動的特性。"}, {"type": "free_text", "prompt": "(7)    引領        ：引導帶領。"}, {"type": "free_text", "prompt": "(8)    探測車      ：是一種機器人車輛，用在惡劣或人類難以到達的環境，進行探索和科學研究。"}, {"type": "free_text", "prompt": "(9)    內建        ：機器或系統中安裝某種配件或功能。"}, {"type": "free_text", "prompt": "(10)    追逐       ：從後面追趕。"}, {"type": "free_text", "prompt": "(11)    垂直起降    ：垂直起飛和降落。"}, {"type": "free_text", "prompt": "(1)戰場上雖然(  B/Ｅ  )，但將士們仍然無所畏懼，勇往直前。（多選）"}, {"type": "free_text", "prompt": "(2)小朋友在操場上互相(  C  )著，嘻嘻哈哈真開心。"}, {"type": "free_text", "prompt": "(3)車禍現場的急救行動(  Ｂ/E  )，但最後總算圓滿完成任務。（多選）"}, {"type": "free_text", "prompt": "(4)科技的進步(  Ｄ  )我們進入了一個全新的數位時代。"}, {"type": "free_text", "prompt": "(5)他的新手機(  A  )了最新的相機功能，拍出來的照片非常清晰。"}, {"type": "free_text", "prompt": "(6)站在山頂上，看著(  F  )的綠色草原，心情格外愉快。"}], "hist": {"guide": 5, "free_text": 30}, "n_blocks": 35, "n_q": 30, "layout": "standard", "stype": "inference", "sname": "拆詞釋義-藉由拆解字詞來推測詞義", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「拆詞釋義」的閱讀策略教學，並舉例說明如何應用此策略。頁面中提到的範例「向陽性」、「仿生學」、「廣闊」、「危機」等詞彙，都與本課《以植物為師的科學》的課文內容高度相關，例如課文中有「向陽性」和「仿生學」的解釋，以及「廣闊無垠的火星地表」和「危機四伏的災難現場」的描述。因此，頁面內容忠實服務於本課。", "fix": null, "table_gap": null}, {"code": "G5-L20", "title": "感情小日記4──我被告白了", "story_id": 1047, "grade_code": "G5-L20", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L20.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L20.docx", "blocks": [{"type": "guide", "text": "◎小試身手：根據以上原則，底下回應，哪些是最符合「一致型」，展現善意與尊重的？"}, {"type": "single", "prompt": "1.「真的謝謝你對我的喜歡，但我現在的心情還沒準備好談感情。」\n□2.「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」\n□3.「我沒有那麼好啦，我覺得你不要考慮我，希望你不要生氣。」\n□4.「你為什麼要跟我說這個？不覺得這樣很尷尬嗎？」\n5.「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」\n□6.「哈哈哈，你別鬧了啦，趕快去跟別人聊一聊啦！」", "options": ["「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」", "「我沒有那麼好啦，我覺得你不要考慮我，希望你不要生氣。」", "「你為什麼要跟我說這個？不覺得這樣很尷尬嗎？」", "「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」", "「哈哈哈，你別鬧了啦，趕快去跟別人聊一聊啦！」"], "answer": "「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」"}, {"type": "guide", "text": "◎實戰練習：根據以下情境，練習以真誠、善意的方式回覆。"}, {"type": "passage", "source": "unknown", "paragraphs": ["在面對人際相處上的期待落差時，如何表達立場是很重要的能力。真誠表達自己的想法與界線，既能尊重自己，也能照顧對方的感受。或許拒絕別人從來不容易，但你的坦率和善意，會讓彼此都更自在、更安心❤︎"]}], "hist": {"guide": 2, "single": 1, "passage": 1}, "n_blocks": 4, "n_q": 1, "layout": "standard", "stype": "sel_character", "sname": "人際溝通-拒絕的藝術", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「人際溝通-拒絕的藝術」的小試身手和實戰練習，要求學生根據情境練習真誠、善意的回覆。這與課文《感情小日記4—我被告白了》中主角被告白後，思考如何拒絕並給出真誠回應的主題完全吻合。頁面排版正常，內容完整。", "fix": null, "table_gap": null}, {"code": "G5-L21", "title": "抗拒指尖上的誘惑", "story_id": 1048, "grade_code": "G5-L21", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L21.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L21.docx", "blocks": [{"type": "guide", "text": "◎小試身手："}, {"type": "free_text", "prompt": "1.情境：我在房間裡寫作業時會分心。"}, {"type": "guide", "text": "解決：以下是解決寫作業分心的「策略」與「具體做法」，請連線配對。"}, {"type": "free_text", "prompt": "2.進階挑戰：小芸常常上學遲到，想培養「準時起床」的好習慣。請幫她挑選合適的做法，用來改掉壞習慣。（勾選題，單選）"}, {"type": "free_text", "prompt": "３.自我省思：你是否有想改掉的壞習慣？試著運用本文介紹的三大策略──「改變環境」「設定規範」「自我提醒」。請先寫下你想改變的壞習慣，再從三種策略中勾選一項，並思考具體做法，填入下列表格。"}, {"type": "free_text", "prompt": "4.分享與回饋：和同學交換學習單，分享你的心得，也請同學寫下回饋。"}, {"type": "guide", "text": "同學回饋："}, {"type": "guide", "text": "簽名："}], "hist": {"guide": 4, "free_text": 4}, "n_blocks": 8, "n_q": 4, "layout": "standard", "stype": "sel_character", "sname": "建立好習慣", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「建立好習慣」的小試身手和進階挑戰，其中提到「解決寫作業分心的策略」、「培養準時起床的好習慣」以及「改掉壞習慣的三大策略：改變環境、設定規範、自我提醒」。這些內容與課文《抗拒指尖上的誘惑》中，小睿戒除手機成癮、建立好習慣的主題高度相關，且頁面排版正常，無破圖或空白骨架。", "fix": null, "table_gap": null}, {"code": "G5-L22", "title": "我有一個棒球夢", "story_id": 12, "grade_code": "G5-L22", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L22.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L22.docx", "blocks": [{"type": "guide", "text": "課文中，學生棒球員每天在學業與訓練之間掙扎。當時間不夠時，他們必須學會取捨與調整，才能兼顧球技與課業。其實，我們也常遇到這樣的情況：作業、考試、活動、補習都都擠在同一天，時間根本不夠用！\n    這一課要帶你練習——當時間不夠時，如何抓重點、排優先順序。\n我們來試試一個好用的方法——時間管理四步驟：\n❶制定計畫(覺察)──先看清「有多少事情」或「時間花在哪裡」。\n❷設定優先順序(拆解)──分出哪些事情最重要、最急，該先做。\n❸合理安排時間(行動)──把要做的事排進時間表，照著去做。\n❹保持彈性(反思)──有突發狀況，懂得調整。\n  掌握這四步，生活會更有節奏，也更有效率。"}, {"type": "guide", "text": "情境一：功課太多的夜晚"}, {"type": "guide", "text": "子安今天晚上事情特別多！白天老師指定一堆作業，明天還有小考。"}, {"type": "guide", "text": "偏偏今晚又有補習班的課程，到晚上9點才能回家。"}, {"type": "guide", "text": "他看著書包裡的課本和作業，心想：「那麼晚開始，來得及嗎？」"}, {"type": "guide", "text": "如果你是子安，可以依據以下步驟來安排這個晚上的時間哦。"}, {"type": "guide", "text": "①覺察——列出今晚的任務（可複選）"}, {"type": "guide", "text": "※想一想："}, {"type": "guide", "text": "現在已經晚上9點了，你大約還有多少時間可以完成任務？"}, {"type": "guide", "text": "小時"}, {"type": "single", "prompt": "請選擇", "options": ["拆解——分清輕重緩急，設定優先順序", "行動——合理安排時間，確實執行"], "answer": "拆解——分清輕重緩急，設定優先順序"}, {"type": "guide", "text": "時間有限時，要先判斷什麼該先做。請從上面勾選的任務中，標註優先順序，並排出學習時間："}, {"type": "guide", "text": "※提示："}, {"type": "guide", "text": "明天要考試的科目屬於「重要又緊急」；\n作業也要交，但可先集中火力在最急、影響較大的任務上。"}, {"type": "guide", "text": "④反思──學會靈活調整"}, {"type": "guide", "text": "計畫不一定能完全照著走，但可以保持彈性，學會靈活調整。"}, {"type": "guide", "text": "請勾選你今晚可能會這樣做的選項："}, {"type": "guide", "text": "情境二：比賽與考試撞期的兩難"}, {"type": "guide", "text": "你是校隊成員（或社團成員），這週末有一場重要比賽，"}, {"type": "guide", "text": "但老師也宣布下週一要段考。"}, {"type": "guide", "text": "練球和複習都很重要，但時間根本不夠。"}, {"type": "guide", "text": "你開始煩惱：「我該怎麼安排？」"}, {"type": "guide", "text": "這次我們從步驟②開始做練習"}, {"type": "guide", "text": "②拆解──判斷優先順序"}, {"type": "guide", "text": "當時間不夠時，我們可以先分清楚：哪一件事「短期影響」更大？（可依自己情況選）"}, {"type": "guide", "text": "③行動──時間不夠時，我要怎麼執行？"}, {"type": "guide", "text": "比賽和段考都很重要，但時間不夠時，關鍵是要「改變做法」。請從下面五種時間調整策略中，選出你覺得可行的行動。"}, {"type": "figure", "referent": "table", "asset": "fig2.png", "bind_paragraph": null}, {"type": "guide", "text": "我這次最想實行的三項調整是：\n①＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿\n②＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿③＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿"}, {"type": "guide", "text": "④反思──找到最適合自己的時間管理方式"}, {"type": "guide", "text": "※想一想：我這樣調整的目標是什麼？（可複選）"}, {"type": "guide", "text": "如果再次遇到這種情況，我會："}, {"type": "guide", "text": "→____________________________________________"}, {"type": "guide", "text": "※最後想一想："}, {"type": "guide", "text": "在時間管理上自己最想改進的一件事是＿＿＿＿＿＿＿＿＿＿＿。"}, {"type": "guide", "text": "我學會了時間管理嗎？請在符合的項目打勾，看看自己學到了什麼？"}, {"type": "figure", "referent": "table", "asset": "fig3.png", "bind_paragraph": null}], "hist": {"guide": 34, "single": 1, "figure": 2}, "n_blocks": 37, "n_q": 1, "layout": "standard", "stype": "sel_character", "sname": "自我管理-時間管理四步驟", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「自我管理-時間管理四步驟」的教學策略，並以「我有一個棒球夢」課文中的學生棒球員為例，說明時間管理的重要性。頁面中的情境練習也緊扣課文主題，引導學生應用時間管理策略。排版正常，內容與本課主題高度相關。", "fix": null, "table_gap": null}, {"code": "G5-L23", "title": "我的電競夢：從熬夜打遊戲到拿下全國冠軍", "story_id": 1050, "grade_code": "G5-L23", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L23.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L23.docx", "blocks": [{"type": "guide", "text": "在〈我有一個棒球夢〉裡，我們學會了時間不夠時要先抓重點、靈活應變，我們用「覺察 → 拆解 → 行動 → 反思」四步驟，找到取捨與應變的方法。\n    〈我的電競夢〉的主角既要練電競，又要顧學業，他是怎麼做到「不拖延又自律」的呢？關鍵在於：「規律的作息表」與「自我管理」。\n接下來讓我們來找出自己浪費時間與拖延的原因，學會建立規律作息。"}, {"type": "guide", "text": "①覺察（Step1）──我和時間的關係"}, {"type": "guide", "text": "請先看看你平常一天的時間都怎麼用。在下列項目中，勾選你常做的三個項目。"}, {"type": "guide", "text": "※想一想："}, {"type": "free_text", "prompt": "1.哪一項最容易讓你拖延，就是不想開始？"}, {"type": "guide", "text": "→____________________________"}, {"type": "free_text", "prompt": "2.哪一項最容易讓你浪費時間？"}, {"type": "guide", "text": "→____________________________"}, {"type": "free_text", "prompt": "3.哪一項是你「覺得很重要，應該多花一點時間」的？"}, {"type": "guide", "text": "→____________________________"}, {"type": "guide", "text": "（深呼吸，你意識到自己會在哪些地方拖延了。"}, {"type": "guide", "text": "現在我們要想的是──以後怎麼避免再發生？）"}, {"type": "guide", "text": "②拆解（Step2）──找出拖延的原因+學習主角的時間策略"}, {"type": "guide", "text": "在開始規畫之前，先了解自己「為什麼容易拖延」。（可複選）"}, {"type": "guide", "text": "※想一想："}, {"type": "guide", "text": "在上面的原因中，哪一個是你最常發生的？"}, {"type": "guide", "text": "在旁邊畫個「☆」，這是你接下來要特別注意的習慣。"}, {"type": "guide", "text": "我最常拖延的時段是什麼時間？（例：放學後、晚餐後、假日）"}, {"type": "guide", "text": "→ ___________________________"}, {"type": "guide", "text": "現在，你已知道自己為什麼會拖延，接著我們來看看主角是怎麼克服的。"}, {"type": "guide", "text": "主角在課文中說：「要成為頂尖選手，時間管理是關鍵。」"}, {"type": "guide", "text": "他透過規律作息，把時間分成三類："}, {"type": "guide", "text": "任務：請勾選你覺得主角值得學習的做法。（複選）"}, {"type": "guide", "text": "※想一想：這些習慣中，你覺得哪一個你也能做到？"}, {"type": "guide", "text": "→________________________________"}, {"type": "guide", "text": "③行動（Step3）──設計屬於我的作息時間表"}, {"type": "guide", "text": "現在，請你根據自己的生活節奏，設計「我的自律作息表」"}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "guide", "text": "④反思（Step4）──預防拖延的方法【我的「拖延時間」改進計畫】"}, {"type": "guide", "text": "有計畫還不夠，重點是能不能「準時開始」。想想你最容易拖延的情況，並選出你想嘗試的方法。"}, {"type": "guide", "text": "※我的反拖延策略（可複選）"}, {"type": "guide", "text": "※我的承諾："}, {"type": "guide", "text": "→下次有作業或考試時，我會＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。"}, {"type": "guide", "text": "→為了不再拖延，我打算每天固定在＿＿點開始＿＿＿＿＿＿＿＿（寫功課、讀書會）。"}, {"type": "guide", "text": "→我會用＿＿＿＿＿＿＿＿＿（方法或工具）提醒自己準時開始。"}, {"type": "self_check", "items": ["我能找出自己最容易浪費時間的時段", "我能分析自己拖延的原因", "我能設計出自己的作息時間表", "我能設定可行的反拖延方法"]}], "hist": {"guide": 31, "free_text": 3, "figure": 1, "self_check": 1}, "n_blocks": 36, "n_q": 3, "layout": "standard", "stype": "sel_character", "sname": "時間管理-制定作息時間表", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容明確提及「我的電競夢」這課，並引導學生思考時間管理和拖延的原因，這與課文主題「時間管理」和主角的自律作息表完全吻合。頁面上的問題和引導都圍繞著本課的主題展開，沒有出現其他課文的內容。", "fix": null, "table_gap": null}, {"code": "G5-L24", "title": "牧羊少年的逆轉勝", "story_id": 1051, "grade_code": "G5-L24", "pdf": null, "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L24.docx", "blocks": [{"type": "guide", "text": "◎小試身手："}, {"type": "guide", "text": "一、找出自己的優勢，選對戰場：如果你有下列優勢，請你選出適合你的優勢戰場。（請勾選，單選）"}, {"type": "guide", "text": "二、大衛不但善用自己的優勢（甩石），還把自己的劣勢也變成了優勢（矮小⭢靈活），上面的練習幫助我們覺察優勢能力，接下來，我們來練習怎麼樣換位思考，把「劣勢」轉為「優勢」。"}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "guide", "text": "三、換你試試看：請你想一想自己的特質，原本可能會有的劣勢，但換位思考後，他或許可能變成你的優勢呢！"}, {"type": "free_text", "prompt": "1.你的特質："}, {"type": "free_text", "prompt": "2.可能的劣勢："}, {"type": "free_text", "prompt": "3.換位思考──可能的優勢："}, {"type": "guide", "text": "結語：大衛沒有盲目聽從「穿盔甲」的建議，而是看見自己的長處、挑對戰場，終於擊倒巨人。希望你也能像他一樣：先認識自己，然後勇敢選擇最能讓你發光的舞台。"}, {"type": "guide", "text": "加油，相信你可以做得到！"}], "hist": {"guide": 6, "figure": 1, "free_text": 3}, "n_blocks": 10, "n_q": 3, "layout": "standard", "stype": "sel_character", "sname": "認識自我", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「閱讀聚光燈」步驟，主題是「認識自我」和「換位思考，把劣勢轉為優勢」。頁面中明確提到課文主角「大衛」如何善用優勢並將劣勢轉化為優勢，這與《牧羊少年的逆轉勝》課文內容高度相關。雖然圖片顯示為模糊的佔位圖，但內容文字忠實於本課主題。", "fix": null, "table_gap": null}, {"code": "G5-L26", "title": "數字記憶的奧秘", "story_id": 1053, "grade_code": "G5-L26", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L26.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L26.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手：實驗一"}, {"type": "free_text", "prompt": "1. 用表格整理訊息：請在（ ）裡填寫答案"}, {"type": "guide", "text": "實驗一：老中和老美「數字記憶廣度」與「數字發音長度」的比較"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}, {"type": "free_text", "prompt": "2. 從表格歸納訊息：實驗一告訴我們什麼訊息(單選)"}, {"type": "single", "prompt": "(1)中國大學生的數字記憶得分比美國大學生（ 高  /  □低  ）。", "options": ["高", "低"], "answer": "高"}, {"type": "single", "prompt": "(2)漢語的的數字發音長度比英語（ □長  /  短  ）。", "options": ["長", "短"], "answer": "短"}, {"type": "free_text", "prompt": "(3)大 uide", "text": "她發現程度遠遠落後同學，積極訂定學習計畫來提升自己"}, {"type": "guide", "text": "□她為一個神祕又重要的人物取了個貼切的綽號──長腿叔叔"}, {"type": "guide", "text": "她努力補強數學及拉丁文成績不及格的弱點"}, {"type": "guide", "text": "她基本常識不足，卻不氣餒，每天晚上在房間苦讀"}, {"type": "guide", "text": "□她參加了婦女選舉權的辯論會"}, {"type": "free_text", "prompt": "(2)朱蒂的成功不只是靠運氣，還靠著自己的努力創造出來的"}, {"type": "guide", "text": "她會針對自己的困難制定學習計畫，增進自己知識"}, {"type": "guide", "text": "她持續不間斷的閱讀與學習，使她學業突飛猛進"}, {"type": "guide", "text": "她以自己的能力賺進獎學金，甚至希望能自己負擔學費"}, {"type": "guide", "text": "□她因長腿叔叔的資助，得到進入大學就讀的機會"}], "hist": {"guide": 22, "free_text": 6}, "n_blocks": 28, "n_q": 6, "layout": "standard", "stype": "main_idea_inference", "sname": "推論策略-觀點找支持理由", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「推論策略-觀點找支持理由」的練習，其中包含「小美很細心」、「小名很幽默」等通用範例，以及「朱蒂是一個勤奮不懈，以努力克服不足的人」和「朱蒂的成功不只是靠運氣，還靠著自己的努力創造出來的」等與本課《長腿叔叔》主角朱蒂相關的內容。這些內容忠實地服務了本課的閱讀策略教學，且排版正常，無破圖。", "fix": null, "table_gap": null}, {"code": "G5-L6", "title": "堅持到底的棒球人生──周思齊(前篇)", "story_id": 1033, "grade_code": "G5-L6", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L6.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G5-L6.docx", "blocks": [{"type": "guide", "text": "◎小試身手："}, {"type": "guide", "text": "一、確認觀點：本篇文章的主要觀點是下列何者？（單選）"}, {"type": "guide", "text": "□(1)進入高苑工商是周思齊第一次感覺到委屈與不甘心"}, {"type": "guide", "text": "□(2)周思齊曾經不被教練和學長看好，被直言沒有天賦"}, {"type": "free_text", "prompt": "(3)真正厲害的人是願意承認自己的不足，然後一步一步追上去"}, {"type": "guide", "text": "□(4)周思齊帶著熱愛棒球的心加入了職棒，卻面臨了前所未有的威脅和考驗"}, {"type": "guide", "text": "二、分析觀點：根據上題答案，本文的觀點有兩個重點，為了支持這個觀點，支持理由應該提及哪些事情？（複選）"}, {"type": "guide", "text": "□他受到的肯定       □他的天賦       他一步步努力"}, {"type": "guide", "text": "□他的委屈和不甘心   他承認自己不足"}, {"type": "guide", "text": "□他熱愛棒球的心     □所面臨的威脅考驗"}, {"type": "guide", "text": "三、觀點找支持理由：根據上題分析，下列哪些事件或細節可以支持文章觀點中的兩個重點？（可複選）"}, {"type": "free_text", "prompt": "1.支持觀點重點1：「願意承認自己不足」： _blocks": 4, "n_q": 2, "layout": "standard", "stype": "trait_inference", "sname": "推論策略-從言行推論人物特質", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "—", "judge_verdict": "—", "reasoning": "", "fix": null, "table_gap": null}, {"code": "G6-L10", "title": "末日種子庫", "story_id": 20, "grade_code": "G6-L10", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L10.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L10.docx", "blocks": [{"type": "guide", "text": "◎小試身手"}, {"type": "free_text", "prompt": "1.課文第四段："}, {"type": "guide", "text": "低溫乾燥的環境有利於保存種子，這座種子庫因而建造在斯瓦爾巴群島永久凍土區的山脈內部。這裡是挪威最北邊的國土，位於北極地區，冰天雪地，氣候極為寒冷，像一座大型的自然冷凍庫。種子庫的溫度維持在攝氏零下18度，這溫度可降低種子的代謝活動，並維持發芽的活性，是最適合保存種子的溫度。"}, {"type": "free_text", "prompt": "(1)找出小主題："}, {"type": "guide", "text": "依灰底關鍵句來看，本段的小主題是　種子銀行的【低溫環境 】。"}, {"type": "free_text", "prompt": "(2)找出與小主題最相關的重要細節（多選）"}, {"type": "guide", "text": "種子庫建造在永久凍土區的山脈內部。"}, {"type": "guide", "text": "溫度攝氏零下18度，可確保種子發芽的活性。"}, {"type": "guide", "text": "⃞種子庫位於挪威最北邊的國土。"}, {"type": "free_text", "prompt": "2.課文第六段："}, {"type": "guide", "text": "臺灣在2009年首度參與這項保存計畫，為了維繫臺灣原生小米的基因多樣性，2024年臺灣科學團隊特地前往北極，由三位排灣族原住民代表，將象徵繁榮和幸福的小米種子，存放在斯瓦爾巴全球種子庫。小米類穀物可以在惡劣的氣候條件下生存，抗旱又耐病蟲害，被視為極端氣候下解決糧食危機的重要作物。"}, {"type": "free_text", "prompt": "(1)找出小主題："}, {"type": "guide", "text": "請你先將關鍵句畫起來後，再勾選本段的小主題：（單選）"}, {"type": "guide", "text": "臺灣也參與了種子保存計畫。"}, {"type": "guide", "text": "⃞小米種子象徵繁榮和幸福。"}, {"type": "guide", "text": "⃞小米種子抗旱又耐病蟲害。"}, {"type": "free_text", "prompt": "(2)找出與小主題最相關的重要細節（多選）"}, {"type": "guide", "text": "2009年，臺灣首次參與斯瓦爾巴種子庫計畫。"}, {"type": "guide", "text": "2024年，臺灣科學團隊將小米種子存放於此。"}, {"type": "guide", "text": "⃞由原住民代表，將小米種子存放在全球種子庫。"}, {"type": "guide", "text": "複習完小主題及細節，接下來就請你完成文章重點表吧！"}], "hist": {"guide": 15, "free_text": 6}, "n_blocks": 21, "n_q": 6, "layout": "standard", "stype": "summary_keysentence", "sname": "摘要策略-從關鍵句找小主題與細節", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「閱讀聚光燈」步驟，旨在引導學生從課文段落中找出小主題和細節。截圖中呈現的課文第四段和第六段內容，以及相關的題目和選項，都與《末日種子庫》這篇課文的內容完全一致，沒有出現其他課文的內容。排版正常，無破圖。", "fix": null, "table_gap": null}, {"code": "G6-L11", "title": "古代畫家心中的仙境", "story_id": 1065, "grade_code": "G6-L11", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L11.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L11.docx", "blocks": [{"type": "guide", "text": "◎ 小試身手"}, {"type": "free_text", "prompt": "1.找出大主題（可從標題找，只要找一次即可）：　古代畫家心中的仙境"}, {"type": "free_text", "prompt": "2.找出小主題："}, {"type": "free_text", "prompt": "(1)課文第二段"}, {"type": "free_text", "prompt": "❶先畫出關鍵句"}, {"type": "guide", "text": "在古代中國人的想像裡，神仙不食人間煙火，總是住在遠離凡塵俗世、雲霧飄渺的深山裡。在許多口耳相傳的故事裡，曾有極少數幸運的人「誤入」仙境，看見不可思議的景象。這些傳說中的仙境，通常都藏在深山的洞穴裡。"}, {"type": "free_text", "prompt": "❷本段的小主題是　古代神仙的【　住所／居住地點　　】。"}, {"type": "free_text", "prompt": "❸找出與小主題最相關的重要細節（多選）"}, {"type": "guide", "text": "神仙總是住在遠離凡塵俗世、雲霧飄渺的深山裡。。"}, {"type": "guide", "text": "這些傳說中的仙境，通常都藏在深山的洞穴裡。。"}, {"type": "guide", "text": "⃞千百年來，許多畫家都將其描繪成通往仙境的入口之一。"}, {"type": "free_text", "prompt": "(2)課文第四段"}, {"type": "guide", "text": "畫家們常在畫中安排三種特別的元素：山洞、小橋和小船。山洞意味著通往仙境的神祕門戶，小橋代表跨進另一個世界的通道，小船象徵渡過現實與仙境的交通工具。這些元素彷彿是進入另一個世界的「護照」，標誌著從凡塵俗世到神奇仙境的奇妙轉變。"}, {"type": "free_text", "prompt": "❶畫出關鍵句"}, {"type": "free_text", "prompt": "❷本段的小主題是　【仙境畫的元素　　　】與意義　　。"}, {"type": "free_text", "prompt": "❸找出與小主題最相關的重要細節（填空）"}, {"type": "guide", "text": "畫家們常在畫中安排三種特別的元素，【　山洞　　】、【　小橋　】、【　小船　　】標誌從凡塵俗世到神奇仙境的奇妙轉變。"}, {"type": "free_text", "prompt": "(3)課文第五段"}, {"type": "guide", "text": "這些古代畫作有個引人深思的特點──「畫中的人物都非常渺小，周圍的山水風景卻極其宏大」，這與現代人喜歡在自拍照中凸顯出自己的習慣，形成鮮明的對比。古代畫家如此安排有其深意，主要在表達面對浩瀚無垠的大自然時，人類是微不足道的。"}, {"type": "free_text", "prompt": "❶請你先畫出關鍵句"}, {"type": "free_text", "prompt": "❷本段的小主題是　古代畫作引人深思的特點　　。"}, {"type": "free_text", "prompt": "❸找出與小主題最相關的重要細節（填空）"}, {"type": "guide", "text": "畫中人物都很【　小　　】，山水風景卻很【　 大　　】，畫家想表達人在面對浩瀚無垠大自然時，人類是很【   微不足道　　　】。"}, {"type": "free_text", "prompt": "(4)課文第六段"}, {"type": "guide", "text": "這些畫家在簽名時，還喜歡加上「山人」、「道人」等稱號，雖然他們不一定真的隱居山林、苦修尋道，但這些稱號反映出他們遠離塵囂的渴求、對大自然的嚮往，以及對心靈提升的期待。"}, {"type": "free_text", "prompt": "❶請你先畫出關鍵句"}, {"type": "free_text", "prompt": "❷本段的小主題是　畫家【對仙境的嚮往／心中理想的仙境　】　　。"}, {"type": "free_text", "prompt": "❸找出與小主題最相關的重要細節(寫句子)"}, {"type": "guide", "text": "希望遠離塵囂、嚮往大自然、提升心靈的期待　　          。"}, {"type": "guide", "text": "◎ 小試身手：練習完閱讀聚光燈的題目後，請你完成文章重點表。"}], "hist": {"guide": 12, "free_text": 18}, "n_blocks": 30, "n_q": 18, "layout": "standard", "stype": "summary_keysentence", "sname": "摘要策略-從關鍵句找小主題與細節", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖顯示的內容是「閱讀聚光燈」步驟，標題為《古代畫家心中的仙境》，與提供的課文標題一致。頁面上的練習內容，如「找出大主題」、「本段的小主題是古代神仙的【住所/居住地點】」以及「仙境畫的元素」，都直接引用了課文中的具體段落內容和主題，例如第二段描述神仙的住所，第四段描述畫作中的元素。排版正常，沒有破圖或空白骨架。", "fix": null, "table_gap": null}, {"code": "G6-L13", "title": "森林大軍的守護者", "story_id": 21, "grade_code": "G6-L13", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L13.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L13.docx", "blocks": [{"type": "guide", "text": "閱讀時，如果你能能夠持續的問自己問題，例如「他為什麼會這樣？」「不可思議，這是真的嗎？」「作者為什麼要寫這篇文章？」，你的閱讀就會變得更主動，你會注意到別人看不到的重點或細節，也會學得更好。這種問自己問題的閱讀策略，叫做「自我提問」。\n    要讀得好，閱讀時經常對自己提出問題，是很有效的方法喔！但不是每一個問題，都有助於文章的理解，所以底下我們要來學習怎麼問出好問題。\n1.自我提問，是有方法的，我們將會學自我提問的兩種類型：\n1-1對自己好奇疑惑的地方提出問題。（本課學習目標）\n1-2對文章的重點提出問題。（下一課學習目標）\n2.對自己好奇疑惑的地方提出問題，步驟如下： \n(1)先讀完課文，將自己好奇、疑問的地方用螢光筆畫標記。\n(2)把(1)紀錄的內容轉成問題。\n(3)確認自己提出來的，是不是「完整的問題」。完整的問題可以下面的檢核表幫忙確認。\n以本課第一段為例：\n(1)將自己好奇、疑問的地方用螢光筆畫標記。\n他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。\n(2)把(1)紀錄的內容轉成問題：  賴桑為什麼要種樹？ 　\n(3)檢核："}, {"type": "free_text", "prompt": "3.給學生的資料庫（疑問詞）"}, {"type": "guide", "text": "◎小試身手："}, {"type": "free_text", "prompt": "1.判斷題：請問這些問題是否符合檢核表的3項要素？符合畫，不符合畫"}, {"type": "guide", "text": "（　）(1)作者想要藉由這篇文章告訴我們什麼道理？"}, {"type": "guide", "text": "（　）(2)賴桑的家人從不支持轉變為支持。(沒有問號)"}, {"type": "guide", "text": "（　）(3)最後的結果呢？(語意不完整)"}, {"type": "guide", "text": "（　）(4)賴桑的親友為什麼要嘲笑他？"}, {"type": "guide", "text": "（　）(5)作者為什麼將標題取名為「森林大軍的守護者」？"}, {"type": "free_text", "prompt": "2.請你在下面段落，試著提出一個好奇或有疑問的地方。"}, {"type": "free_text", "prompt": "(1)將自己好奇、疑問的地方用螢光筆畫標記。"}, {"type": "guide", "text": "第三段：二十九歲那年，他花了三千萬買下第一座山。卻發現整座山佈滿了垃圾及廢棄物，蒼蠅嗡嗡嗡的飛來飛去，根本沒什麼價值。原來，這裡曾是果園，因長年廢棄，讓人偷偷倒了大量的垃圾。他被眼前的景象震懾住了，但他隨即轉變念頭，告訴自己：沒關係！最壞的都留給我吧！"}, {"type": "free_text", "prompt": "(2)把(1)紀錄的內容轉成問題：【賴桑為什麼要買一座垃圾山？      】"}, {"type": "free_text", "prompt": "(3)檢核："}], "hist": {"guide": 8, "free_text": 6}, "n_blocks": 14, "n_q": 6, "layout": "standard", "stype": "self_questioning", "sname": "自我提問-問好奇、疑惑的問題", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「自我提問」的閱讀策略，並以本課課文《森林大軍的守護者》的第一段內容作為範例，示範如何將好奇、疑問的地方轉化為問題，例如「賴桑為什麼要種樹？」。內容與本課主題高度相關，且排版正常，無破圖。", "fix": null, "table_gap": null}, {"code": "G6-L14", "title": "植物獵人", "story_id": 22, "grade_code": "G6-L14", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L14.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L14.docx", "blocks": [{"type": "guide", "text": "前一課我們學到了：閱讀時，怎麼把好奇或有疑惑的地方，轉成問題，對自己發問。這一課我們要來學，閱讀時，怎麼問出重要的問題。\n1.什麼是重要的問題？\n(1)文章的重要概念，有助於理解文章的問題。\n(2)重要的問題因文章類型而異，例如本課是記人文章，「主角背景、奮鬥歷程、成就、人物特質」是重要概念。\n2.什麼是不重要的問題：如果問題的答案是太瑣碎、太細節的訊息，刪除也不會影響理解文章，就是不重要的問題。\n3.以下以本課「植物獵人-洪信介」為例，「重要」和「不重要」問題各舉一例\n4.怎麼問出重要的問題？\n(1)直接問出重要問題\n(2)如果無法直接提出重要問題，可以先找出「文章的重點」，再轉換成「問題」喔！例如下表："}, {"type": "guide", "text": "◎小試身手："}, {"type": "guide", "text": "判斷題：辨別重要和不重要的問題，重要的打，不重要的畫。"}, {"type": "guide", "text": "找出重要問題後，請和你的同學分享，為什麼你覺得那是重要的問題。"}, {"type": "guide", "text": "（ ）(1) 洪信介具備哪些成為植物獵人的條件？"}, {"type": "guide", "text": "（ ）(2) 黃喉貂是什麼動物？"}, {"type": "guide", "text": "（ ）(3) 洪信介要到植物保種中心工作，遇到什麼問題？"}, {"type": "guide", "text": "（ ）(4) 洪信介考上哪個學校？"}, {"type": "guide", "text": "（ ）(5) 洪信介最重要的成就是什麼？"}, {"type": "guide", "text": "換你做，請你試試看，提出一個重要的問題"}, {"type": "free_text", "prompt": "(1)我能直接提出重要的問題："}, {"type": "free_text", "prompt": "(2)如果不能直接提出重要的問題—可以先找出「文章重點」，再轉換成「問題」。下表已經先找到文章重點了，請你試著把它轉換為「問題」喔！"}, {"type": "guide", "text": "下表已經先找到文章重點了，請你試著把它轉換為「問題」喔！"}, {"type": "figure", "referent": "table", "asset": null, "bind_paragraph": null}], "hist": {"guide": 11, "free_text": 2, "figure": 1}, "n_blocks": 14, "n_q": 2, "layout": "standard", "stype": "self_questioning", "sname": "自我提問-問重要的問題", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容為「自我提問-問重要的問題」的閱讀策略教學，其中明確以本課「植物獵人-洪信介」為例，並列出多個與洪信介相關的問題作為練習題，例如「洪信介具備哪些成為植物獵人的條件？」、「洪信介最重要成就是什麼？」。頁面內容與本課課文主題高度相關，排版正常，無破圖。", "fix": null, "table_gap": null}, {"code": "G6-L15", "title": "小藍鯨之死", "story_id": 23, "grade_code": "G6-L15", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L15.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L15.docx", "blocks": [{"type": "guide", "text": "◎小試身手:看完課文，請你利用自我提問策略，寫出你的思考歷程。"}, {"type": "free_text", "prompt": "【事實】\n問自己：這篇文章／事件什麼地方令我印象深刻？\n（句型：我看到了．．．）\n請寫下你的答案。"}, {"type": "free_text", "prompt": "【感受】\n問自己：對於這個事情，我感受到了什麼情緒？\n（句型：這個事件，我感到．．．（情緒））\n請寫下你的答案。"}, {"type": "free_text", "prompt": "【反思】\n問自己：我們做了什麼事，才會導致這件事的發生？\n（句型：因為．．．，才會．．．。）\n請寫下你的答案。"}, {"type": "free_text", "prompt": "【行動】\n問自己：我們未來應該怎麼做？才能避免這種情況發生？\n（句型：未來我們可以．．．）\n請寫下你的答案。"}, {"type": "single", "prompt": "根據「本文例子」中關於小藍鯨的事件，哪一個選項最符合「事實」的描述？", "options": ["我看到了人類為了方便，亂丟漁網到海裡，造成小藍鯨的死亡事件。", "對於小藍鯨的死亡，我感到很震驚又難過。", "因為人類貪圖方便，亂丟垃圾，才會汙染海洋。", "未來我們可以宣導環境保護，不亂丟垃圾，多參與淨灘活動。"], "answer": "我看到了人類為了方便，亂丟漁網到海裡，造成小藍鯨的死亡事件。"}, {"type": "single", "prompt": "根據「本文例子」中關於小藍鯨的事件，哪一個選項最符合「感受」的描述？", "options": ["我看到了人類為了方便，亂丟漁網到海裡，造成小藍鯨的死亡事件。 康、人際、課業等我們所關心的各種事物，構成了我們的「關注圈」。而在這些關注的事情裡，真正能夠由我們主動改變或掌控的部分，就是「控制圈」。若你的「關注圈」裡有這幾件事，請判斷哪些事情會落在你的「控制圈」呢？請在你可以掌控、改變的項目打勾："]}, {"type": "guide", "text": "□今天的天氣 早上的起床時間 □公車上人多不多 要不要找同學聊天\n功課有沒有完成 □老師幾點下課 □回家作業多不多 手機要使用多久"}, {"type": "guide", "text": "二、區辨「控制圈」："}, {"type": "guide", "text": "◎從文章中，我們可以看出主角的兩難，現在就一起來看看主角在乎的事情是否落在他的「控制圈」："}, {"type": "passage", "source": "unknown", "paragraphs": ["☆主角的心煩，也來自於他的焦點多在（□控制圈之內　控制圈之外），一起來幫主角想想，哪些是在控制圈內的事情吧！（請打勾）"]}, {"type": "guide", "text": "告白時機　告白方式　□對方的回應　告白內容　□得到回覆的時間"}, {"type": "guide", "text": "◎在生活中，也有許多兩難情境，就讓我們透過情境，來練習區辨「控制圈」："}, {"type": "figure", "referent": "table", "asset": "fig10.png", "bind_paragraph": null}, {"type": "passage", "source": "unknown", "paragraphs": ["☆在控制圈之外的事，仍有努力的價值，但重點是努力過後也需要明白，結果不是我們單方面可以控制。", "在面對兩難抉擇時，我們容易被各種擔憂困住，感到焦慮或茫然。而當我們專注在控制圈裡，會能減少那些無力和不安，也會能逐漸找回自己的主動權和力量。練習把注意力放自己能影響的行動和選擇上，會更能勇敢、自在的面對每一次選擇❤︎"]}], "hist": {"guide": 6, "passage": 3, "figure": 1}, "n_blocks": 10, "n_q": 0, "layout": "standard", "stype": "sel_character", "sname": "負責任的決定-區辨控制圈", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容圍繞「控制圈」的概念，並引導學生思考課文主角的心煩事哪些在控制圈內、哪些在控制圈外。頁面中的閱讀文本和練習題目都與課文《感情小日記5——我該告白嗎？》的主題「告白」和「兩難情境」緊密相關，例如提到「告白時機」、「告白方式」等，並無張冠李戴的內容。圖片部分顯示為一個通用圖示，但並未載入失敗。", "fix": null, "table_gap": null}, {"code": "G6-L22", "title": "小兵立大功：雞鳴狗盜的故事", "story_id": 1076, "grade_code": "G6-L22", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L22.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L22.docx", "blocks": [{"type": "guide", "text": "好故事，大家都愛看。為什麼？因為主角不是一帆風順，而是會遇到困難，然後想辦法解決，最後扭轉局面，迎向結局。這樣的故事最精彩、最吸引人！\n所以，一個經典又精彩的故事，常常有四個重點："}, {"type": "guide", "text": "❶主角是誰？　　　　　   ❷主角遇到了什麼「問題」？"}, {"type": "guide", "text": "❸問題如何「解決」？　　 ❹最後得到什麼「結果」？\n今天，我們就來學一個超實用的閱讀方法，用「問題、解決、結果」的方式來整理故事內容，幫助你輕鬆抓到重點。舉例來說："}, {"type": "guide", "text": "例一：烏鴉喝水"}, {"type": "passage", "source": "supplementary", "paragraphs": ["天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。"]}, {"type": "single", "prompt": "❶主角是誰？", "options": ["烏鴉", "麻雀"], "answer": "烏鴉"}, {"type": "single", "prompt": "❷主角遇到了什麼「問題」？", "options": ["喝不到水", "天氣炎熱"], "answer": "喝不到水"}, {"type": "single", "prompt": "❸問題如何「解決」？", "options": ["丟小石頭進瓶子裡，讓水面升高", "等待下雨，讓瓶子裝滿水"], "answer": "丟小石頭進瓶子裡，讓水面升高"}, {"type": "single", "prompt": "❹最後得到什麼「結果」？", "options": ["主角順利喝到水", "主角沒有喝到水"], "answer": "主角順利喝到水"}, {"type": "guide", "text": "接下來，我們來看課文的故事"}, {"type": "passage", "source": "supplementary", "paragraphs": ["孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。", "這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。", "孟嘗君一行人順利出關，逃出秦國。"]}, {"type": "single", "prompt": "❶主角是誰？", "options": ["孟嘗君", "秦昭王", "雞鳴先生"], "answer": "孟嘗君"}, {"type": "single", "prompt": "❷主角遇到了什麼「問題」？", "options": ["被追兵追到", "天沒亮，城門不能開"], "answer": "天沒亮，城門不能開"}, {"type": "free_text", "prompt": "❸問題如何「解決」？孟嘗君的食客【　　　】，引來附近公雞也一起叫。", "answer": "模仿雞叫"}, {"type": "single", "prompt": "❹最後得到什麼「結果」？", "options": ["主角  成功出關", "沒有出關。"], "answer": "主角  成功出關"}, {"type": "guide", "text": "◎ 小試身手："}, {"type": "guide", "text": "1.讓我們來看課文另一個故事"}, {"type": "passage", "source": "supplementary", "paragraphs": ["孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。", "這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很開心，幫孟嘗君在秦王面前說好話。秦王聽信她的話，便放了孟嘗君。"]}, {"type": "single", "prompt": "❶主角是誰？ □秦昭王　孟嘗君　□幸姬 □狗盜先生", "options": ["秦昭王", "孟嘗君", "幸姬", "狗盜先生"], "answer": "孟嘗君"}, {"type": "single", "prompt": "❷主角遇到了什麼「問題」？", "options": ["沒錢買白狐裘　幸姬要白狐裘但已送給秦王", "找不到人幫忙"], "answer": "沒錢買白狐裘　幸姬要白狐裘但已送給秦王"}, {"type": "single", "prompt": "❸問題如何「解決」？", "options": ["拜託秦王讓給幸姬", "食客潛入寶庫偷回白狐裘"], "answer": "食客潛入寶庫偷回白狐裘"}, {"type": "single", "prompt": "❹最後得到什麼「結果」？", "options": ["幸姬幫忙說話，秦王放了孟嘗君", "幸姬拒絕幫忙，孟嘗君被關"], "answer": "幸姬幫忙說話，秦王放了孟嘗君"}, {"type": "guide", "text": "2.進階挑戰：大象有多重？"}, {"type": "passage", "source": "supplementary", "paragraphs": ["有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。", "這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。", "最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。"]}, {"type": "single", "prompt": "❶主角是誰？", "options": ["曹操", "曹沖"], "answer": "曹沖"}, {"type": "single", "prompt": "❷主角遇到了什麼「問題」？", "options": ["大象太重，沒辦法秤", "大家只是好奇，沒有實際困難"], "answer": "大象太重，沒辦法秤"}, {"type": "single", "prompt": "❸問題如何「解決」？", "options": ["請工人抬大象放到大磅秤上秤重", "讓大家猜一個大概的重量", "用船的下沉水位線比對石頭重量，間接秤量體重"], "answer": "用船的下沉水位線比對石頭重量，間接秤量體重"}, {"type": "single", "prompt": "❹最後得到什麼「結果」？", "options": ["知道大象的重量", "不知道大象的重量"], "answer": "知道大象的重量"}, {"type": "fill_table"}], "hist": {"guide": 8, "passage": 4, "single": 15, "free_text": 1, "fill_table": 1}, "n_blocks": 29, "n_q": 17, "layout": "standard", "stype": "summary_pse", "sname": "摘要策略：問題．解決．結果結構", "method": "build_lesson_schema.py 規則式 DOCX 解析", "method_src": "(deterministic parser, 非 LLM)", "verdict": "faithful", "judge_verdict": "faithful", "reasoning": "截圖內容是關於「問題、解決、結果」的閱讀策略，並以「烏鴉喝水」和「孟嘗君連夜逃到函谷關」的故事作為範例進行練習。雖然「烏鴉喝水」不是本課內容，但作為教學策略的示範案例是合理的通用鷹架。後續的「孟嘗君連夜逃到函谷關」和「孟嘗君被秦昭王軟禁」的內容則直接與本課《小兵立大功：雞鳴狗盜的故事》相關，因此整體內容忠實於本課的教學", "fix": null, "table_gap": null}, {"code": "G6-L23", "title": "老鷹紅豆的故事", "story_id": 1077, "grade_code": "G6-L23", "pdf": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L23.pdf", "docx": "https://storage.googleapis.com/lingoleap-assets/worksheets/G6-L23.docx", "blocks": [{"type": "guide", "text": "這篇故事是一篇報導式說明文，講「毒鳥事件」解決的過程。故事結構裡有明顯的問題、解決、結果。但閱讀時，如何找到文章中的「問題、解決、結果」呢？我們可以用一些線索來做判斷喔！\n我們來練習用兩步驟（❶找重點句；❷精簡重點句）找「問題、解決、結果」。"}, {"type": "guide", "text": "一、找「問題」"}, {"type": "guide", "text": "※祕訣：「問題」通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。"}, {"type": "free_text", "prompt": "❶找重點句："}, {"type": "passage", "source": "unknown", "paragraphs": ["本文第一段有三句，請你先判斷哪一個句子是描述「不好的事」，而且是「最嚴重」的。(請在□打勾，三選一。)", "□句1：2012年10月，屏東科技大學的研究人員收到兩隻死亡的老鷹，檢驗後，確認老鷹體內含有劇毒農藥。", "句2：2013年，他們在屏東縣一塊紅豆田中，發現了超過3000隻野鳥屍體。"]}, {"type": "guide", "text": "□句3：死亡的鳥類包括麻雀、紅鳩、小雲雀、斑文鳥、彩鷸、秧雞等，也包括食物鏈上層的紅隼、老鷹。"}, {"type": "guide", "text": "我們可以這樣思考："}, {"type": "passage", "source": "unknown", "paragraphs": ["第一段有三個句子，第一句和第二句都是描述「不好的事」，我覺得第二句「發現超過3000隻野鳥屍體」更嚴重，所以我留下第二句，並把第二句畫線。"]}, {"type": "free_text", "prompt": "❷精簡重點句："}, {"type": "guide", "text": "想一想這句話的意思，用更簡短的方式表達重點。"}, {"type": "guide", "text": "請判斷第1段的「問題」可以精簡成哪一個句子？（在□打勾，二選一。）"}, {"type": "free_text", "prompt": "1.有大量的野鳥中毒死亡。"}, {"type": "guide", "text": "二、找「解決」"}, {"type": "guide", "text": "※祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡，一個精彩的故事，通常有多個解決方法。"}, {"type": "free_text", "prompt": "❶找重點句：（第4段）"}, {"type": "passage", "source": "unknown", "paragraphs": ["請你先判斷哪些句子是描述「有人想出辦法或行動的句子」。（在□打勾，三選二）", "解決1：屏東科技大學在縣政府的協助下，找上當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這個生態的悲劇。", "解決2：林先生坦承錯誤，自2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。"]}, {"type": "guide", "text": "□解決3：林先生雖然成為無毒農法的先驅，但這樣做成本高，18公頃紅豆田的收入，比過去少了100萬，因此無法大量推廣，只能苦撐待變。"}, {"type": "guide", "text": "我們可以這樣思考："}, {"type": "guide", "text": "解決1和2，都是描述為了野鳥中毒死亡問題，句子都是「誰＋做了什麼事」。"}, {"type": "single", "prompt": "❷精簡重點句：", "options": ["想一想這句話的意思，用更簡短的方式表達重點。（在", "打勾，二選一。）"], "answer": "想一想這句話的意思，用更簡短的方式表達重點。（在"}, {"type": "free_text", "prompt": "(1)請判斷「解決1」可以精簡成底下哪一個句子？"}, {"type": "free_text", "prompt": "1.屏科大找林先生溝通。"}, {"type": "free_text", "prompt": "(2)請判斷「解決2」可以精簡成底下哪一個句子？"}, {"type": "free_text", "prompt": "1.林先生坦承錯誤。"}, {"type": "guide", "text": "◎小試身手"}, {"type": "free_text", "prompt": "1.課文第五段："}, {"type": "guide", "text": "為了支持友善耕作的農民，2015年，全聯福利中心開始與農民簽訂契作協議，以高於市場的價格收購紅豆，並將這些紅豆命名為「老鷹紅豆」。最早和全聯契作的紅豆田雖然只有25公頃，但企業和農民一起保護老鷹的故事，開始在農民間慢慢傳開。全聯販售的紅豆產品，是不毒鳥、不用落葉劑的安全紅豆，經過層層把關，不必擔心農藥殘留的問題，希望高品質的老鷹紅豆可以取得消費者的青睞。"}, {"type": "free_text", "prompt": "(1)請先尋找重點句，並畫線。"}, {"type": "single", "prompt": "(2)請判斷第5段的「解決」可以精簡成底下哪個句子？（在□打勾，二選一。）", "options": ["（在", "打勾，二選一。）"], "answer": "（在"}, {"type": "free_text", "prompt": "1.全聯與農民合作，並高價收購紅豆"}, {"type": "guide", "text": "三、找「結果」"}, {"type": "passage", "source": "unknown", "paragraphs": ["祕訣：「結果」通常出現在文章的
