<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>測試集收集現況 · LingoLeap</title>
<style>
  :root{--bg:#FDF8F0;--ink:#1a1a2e;--purple:#5B4FC4;--muted:#6b6b8a;--card:#fff;--line:#e7e2d8;--green:#16a34a;--amber:#d97706;--red:#dc2626;--chip:#efe9ff}
  *{box-sizing:border-box}
  body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:28px 18px;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto}
  h1{color:var(--purple);font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .auth-banner{background:#fef9c3;border:1px solid var(--amber);border-radius:10px;padding:14px 18px;margin-bottom:18px;color:#92400e;font-size:.9rem}
  .auth-banner a{color:var(--purple);font-weight:600}
  .stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .stat .n{font-size:1.6rem;font-weight:800;color:var(--purple)}
  .stat .l{font-size:.8rem;color:var(--muted)}
  h2{font-size:1.1rem;color:var(--ink);margin:22px 0 10px}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:.9rem}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{background:#f3eee4;font-size:.82rem;white-space:nowrap}
  tr.data-row:hover td{background:#faf7f0}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 8px;border-radius:20px;font-size:.82rem;font-weight:700}
  .pill.zero{background:#f3f0e8;color:var(--muted)}
  .pill.some{background:#dcfce7;color:var(--green)}
  .lesson-title{font-weight:600}
  .lesson-id{font-size:.78rem;color:var(--muted)}
  .ai-badge{background:#f3f0e8;color:var(--muted);font-size:.75rem;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .copy-btn{padding:5px 11px;border:1px solid var(--purple);background:#fff;color:var(--purple);border-radius:8px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .copy-btn:hover{background:var(--chip)}
  .copy-btn.copied{border-color:var(--green);color:var(--green)}
  .open-btn{padding:5px 11px;border:none;background:var(--purple);color:#fff;border-radius:8px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
  .open-btn:hover{opacity:.85}
  .expand-btn{background:none;border:none;color:var(--purple);cursor:pointer;font-size:.78rem;font-weight:600;padding:0;white-space:nowrap;text-decoration:underline}
  .action-cell{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .detail-row{display:none;background:#faf7f0}
  .detail-row>td{padding:10px 14px}
  .detail-inner{max-height:220px;overflow-y:auto}
  .det-table{width:100%;font-size:.82rem;border-collapse:collapse}
  .det-table th,.det-table td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
  .det-table th{background:#ede8de}
  audio{height:28px;vertical-align:middle}
  .muted{color:var(--muted)}
  .ai-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
  .ai-run-btn{background:var(--purple,#5B4FC4);color:#fff;border:none;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
  .ai-run-btn:disabled{opacity:.5;cursor:not-allowed}
  .ai-row-btn{background:#fff;border:1px solid var(--purple,#5B4FC4);color:var(--purple,#5B4FC4);border-radius:6px;padding:3px 10px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;margin-top:4px}
  .ai-row-btn:hover{background:var(--chip,#efe9ff)}
  .ai-score .ok{color:#15803d}
  .ai-score .lo{color:#b45309}
  .ai-score .anom{color:#dc2626}
  .ai-status{font-size:.85rem;font-weight:600}
  .ai-score{display:inline-block;font-size:.78rem;line-height:1.5;white-space:nowrap}
  .ai-score .ok{color:#15803d;font-weight:700}
  .ai-score .lo{color:#b45309;font-weight:700}
  .ai-score .anom{color:var(--red,#dc2626);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>測試集收集現況</h1>
  <p class="sub">每篇課文各需「正確版 + 刻意錯誤版」— 複製各課分享連結傳給貢獻者錄音</p>

  <div id="authBanner" class="auth-banner" style="display:none">
    錄音明細需要教師/管理員登入才能查看。<a href="/login">前往登入 →</a>
    <br><small>各課的「複製連結」功能無需登入，可直接分享給貢獻者。</small>
  </div>

  <div class="stats" id="stats"><div class="loading">載入中…</div></div>

  <h2>所有課文</h2>
  <div id="aiTools" class="ai-tools" style="display:none">
    <button id="aiRunBtn" class="ai-run-btn" onclick="runAiEval()">🤖 跑 AI 評分（已收錄音）</button>
    <span id="aiStatus" class="ai-status"></span>
    <small class="muted">正確版應高分、錯誤版應低分；不符會標 ⚠ 異常。單次上限 30 筆。</small>
  </div>
  <div id="tableWrap"><div class="loading">載入課文清單…</div></div>
</div>

<script>
/* ── API base ── */
function apiBase(){
  var h=location.origin;
  if(h.indexOf('-frontend-')>-1) return h.replace('-frontend-','-backend-');
  if(h.indexOf('localhost')>-1||h.indexOf('127.0.0.1')>-1) return 'http://localhost:8000';
  return 'https://lingoleap-backend-staging-958347263320.asia-east1.run.app';
}
var API=apiBase();
var aiResults={};  // lesson_id → {correct:adj|null, error:adj|null, anomaly:bool}

function pct(v){ return v==null?'—':(Math.round(v*1000)/10)+'%'; }

// 跑分時間戳格式化（#2392）：ISO → MM/DD HH:MM（本地時區）
function fmtTs(iso){
  try{ var d=new Date(iso); if(isNaN(d.getTime())) return '';
    var p=function(n){return (n<10?'0':'')+n;};
    return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){ return ''; }
}

function aiCell(id, hasRec){
  var r=aiResults[id];
  if(r&&r.running) return '<span class="muted">跑分中…（約 30 秒）</span>';
  if(r&&(r.correct!=null||r.error!=null)){
    var parts=[];
    if(r.correct!=null) parts.push('<div class="'+(r.correctFlag?'anom':'ok')+'">正確版 '+pct(r.correct)+(r.correctFlag?' ⚠':' ✓')+'</div>');
    if(r.error!=null)   parts.push('<div class="'+(r.errorFlag?'anom':'lo')+'">錯誤版 '+pct(r.error)+(r.errorFlag?' ⚠':' ✓')+'</div>');
    var both=(r.correct!=null&&!r.correctFlag)&&(r.error!=null&&!r.errorFlag);
    var verdict=(r.correct!=null&&r.error!=null)?('<div style="font-weight:700;margin-top:2px" class="'+(both?'ok':'anom')+'">'+(both?'✅ 兩版都 pass':'⚠ 有異常')+'</div>'):'';
    var ts=r.scoredAt?('<div class="muted" style="font-size:.72rem;margin-top:2px">跑分 '+fmtTs(r.scoredAt)+'</div>'):'';
    return '<div class="ai-score">'+parts.join('')+verdict+ts+'<button class="ai-row-btn" onclick="runAiEvalForLesson(\''+esc(id)+'\')">重跑</button></div>';
  }
  if(r&&r.authErr) return '<span class="anom">登入已過期</span> <a class="ai-row-btn" href="/login" target="_blank" rel="noopener" style="text-decoration:none">重新登入</a>';
  if(r&&r.err) return '<span class="anom">失敗</span> <button class="ai-row-btn" onclick="runAiEvalForLesson(\''+esc(id)+'\')">重試</button>';
  if(hasRec) return '<button class="ai-row-btn" onclick="runAiEvalForLesson(\''+esc(id)+'\')">▶ 跑分</button>';
  return '<span class="ai-badge">待對應</span>';
}

function recordUrl(lessonId){
  return location.origin+'/testset-7f3a91c4/record.html?lesson='+encodeURIComponent(lessonId);
}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ── copy button ── */
function copyLink(btn,url){
  navigator.clipboard.writeText(url).then(function(){
    btn.textContent='已複製';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent='複製連結'; btn.classList.remove('copied'); },2000);
  }).catch(function(){
    var t=document.createElement('textarea'); t.value=url;
    t.style.position='fixed'; t.style.left='-9999px';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
    btn.textContent='已複製'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent='複製連結'; btn.classList.remove('copied'); },2000);
  });
}

/* ── expand detail ── */
function toggleDetail(id){
  var row=document.getElementById('det-'+id);
  if(!row) return;
  var shown=row.style.display==='table-row';
  row.style.display=shown?'none':'table-row';
  var btn=document.querySelector('[data-expand="'+id+'"]');
  if(btn) btn.textContent=shown?'展開 ▼':'收起 ▲';
}

/* ── load ── */
async function load(){
  // 1. story list — public endpoint, no auth needed
  var stories=[];
  try{
    var r=await fetch(API+'/api/stories?page_size=300');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var j=await r.json();
    stories=j.stories||[];
  }catch(e){
    document.getElementById('tableWrap').innerHTML='<div class="loading" style="color:var(--red)">課文清單載入失敗：'+esc(e.message)+'</div>';
    document.getElementById('stats').innerHTML='';
    return;
  }

  // 2. recordings — 公開端點（Young 2026-06-21：不登入也顯示貢獻者暱稱/數量）
  var recs=[];
  var authOk=false;
  try{
    var token=localStorage.getItem('lingoleap_token');
    var headers=token?{'Authorization':'Bearer '+token}:{};
    var r2=await fetch(API+'/api/testset/recordings',{headers:headers});
    if(r2.ok){
      var j2=await r2.json();
      recs=j2.recordings||[];
      authOk=true;
    }
  }catch(e){
    // recordings optional
  }

  // 3. index: lesson_id + version → list of recordings
  var idx={};
  var contribSet={};
  recs.forEach(function(m){
    var k=m.lesson_id+'||'+m.version;
    (idx[k]=idx[k]||[]).push(m);
    if(m.contributor_name) contribSet[m.contributor_name]=true;
    if(m.eval) applyAiResult(m.eval);  // 持久化跑分結果 → reload 直接顯示分數+時間，免重跑（#2392）
  });

  // 4. stats
  var totalRecs=recs.length;
  var coveredCells=0;
  stories.forEach(function(s){
    if((idx[s.id+'||correct']||[]).length) coveredCells++;
    if((idx[s.id+'||error']||[]).length) coveredCells++;
  });
  var totalCells=stories.length*2;

  document.getElementById('stats').innerHTML=
    statCard(stories.length,'課文總數')+
    statCard(authOk?totalRecs:'—','總錄音數')+
    statCard(authOk?(coveredCells+' / '+totalCells):'— / '+totalCells,'已覆蓋格')+
    statCard(authOk?Object.keys(contribSet).length:'—','貢獻者數');

  // 5. build table
  var h='<table><thead><tr>'+
    '<th>#</th>'+
    '<th>課文</th>'+
    '<th>正確版</th>'+
    '<th>錯誤版</th>'+
    '<th>貢獻者</th>'+
    '<th>AI 判斷</th>'+
    '<th>分享與操作</th>'+
    '</tr></thead><tbody>';

  stories.forEach(function(s,i){
    var id=s.id;
    var url=recordUrl(id);
    var correctList=idx[id+'||correct']||[];
    var errorList=idx[id+'||error']||[];
    var allRecs=correctList.concat(errorList);
    var contribs=[];
    allRecs.forEach(function(m){
      if(m.contributor_name&&contribs.indexOf(m.contributor_name)<0) contribs.push(m.contributor_name);
    });
    var hasDetail=authOk&&allRecs.length>0;

    h+='<tr class="data-row">';
    h+='<td class="muted" style="font-size:.8rem">'+(i+1)+'</td>';
    h+='<td><div class="lesson-title">'+esc(s.title)+'</div><div class="lesson-id">'+esc(id)+'</div></td>';
    h+='<td><span class="pill '+(correctList.length?'some':'zero')+'">'+correctList.length+'</span></td>';
    h+='<td><span class="pill '+(errorList.length?'some':'zero')+'">'+errorList.length+'</span></td>';
    h+='<td>'+(contribs.length?('<span title="'+esc(contribs.join('、'))+'">'+esc(contribs.join('、'))+'</span>'):'<span class="muted">—</span>')+'</td>';
    h+='<td id="aicell-'+esc(id)+'">'+aiCell(id, allRecs.length>0)+'</td>';
    h+='<td><div class="action-cell">'+
      '<button class="copy-btn" onclick="copyLink(this,\''+esc(url)+'\')">複製連結</button>'+
      '<a class="open-btn" href="'+esc(url)+'" target="_blank">開啟</a>'+
      (hasDetail?'<button class="expand-btn" data-expand="'+esc(id)+'" onclick="toggleDetail(\''+esc(id)+'\')">展開 ▼</button>':'')+
      '</div></td>';
    h+='</tr>';

    // inline detail row (only when authed + has recs)
    if(hasDetail){
      h+='<tr class="detail-row" id="det-'+esc(id)+'"><td colspan="7"><div class="detail-inner">'+
        '<table class="det-table"><thead><tr>'+
        '<th>版本</th><th>貢獻者</th><th>年級</th><th>時間</th><th>播放</th>'+
        '</tr></thead><tbody>';
      allRecs.forEach(function(m){
        var vn=m.version==='correct'?'正確版':'錯誤版';
        var t=(m.created_at||'').replace('T',' ').slice(0,16);
        h+='<tr>'+
          '<td>'+vn+'</td>'+
          '<td>'+esc(m.contributor_name)+'</td>'+
          '<td>'+esc(m.grade)+'</td>'+
          '<td class="muted">'+esc(t)+'</td>'+
          '<td>'+(m.play_url?'<audio controls preload="none" src="'+esc(m.play_url)+'"></audio>':'<span class="muted">—</span>')+'</td>'+
          '</tr>';
      });
      h+='</tbody></table></div></td></tr>';
    }
  });

  h+='</tbody></table>';
  document.getElementById('tableWrap').innerHTML=h;

  // AI 評分工具列：登入後才可跑（batch-eval 需 auth + 會花 LLM 成本）
  document.getElementById('aiTools').style.display=authOk?'flex':'none';
}

function statCard(n,l){
  return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
}

/* ── 跑分 fetch：150s 逾時保護 + 失敗自動重試一次（冷啟動/Gemini 暫時性失敗自癒，#2379）── */
async function evalFetch(url, headers){
  var lastErr;
  for(var attempt=1; attempt<=2; attempt++){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ ctrl.abort(); }, 150000);
    try{
      var r=await fetch(url,{method:'POST',headers:headers,signal:ctrl.signal});
      clearTimeout(timer);
      // 401 = token 過期/失效（JWT 8h TTL）。重試同一個死 token 永遠還是 401 → 不重試，直接拋給 caller 導重新登入（#2379 只修冷啟動，沒處理這個）
      if(r.status===401){ var ae=new Error('登入已過期'); ae.authExpired=true; throw ae; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      clearTimeout(timer);
      if(e&&e.authExpired) throw e;  // 過期不重試
      lastErr=e;
      if(attempt<2){ await new Promise(function(res){ setTimeout(res,2000); }); }  // 等 2s，冷啟動已暖
    }
  }
  throw lastErr;
}

/* ── 跑 AI 評分：呼叫 batch-eval → 填 aiResults → 重繪 AI判斷欄 ── */
async function runAiEval(){
  var btn=document.getElementById('aiRunBtn'), st=document.getElementById('aiStatus');
  var token=localStorage.getItem('lingoleap_token');
  if(!token){ st.innerHTML='請先<a href="/login" target="_blank" rel="noopener">登入</a>'; return; }
  btn.disabled=true;
  st.textContent='AI 評分中…（真人聲辨識較久，約每筆 20-30 秒，請稍候）';
  try{
    var d=await evalFetch(API+'/api/testset/batch-eval',{'Authorization':'Bearer '+token});
    aiResults={};
    (d.results||[]).forEach(function(x){ applyAiResult(x); });
    var sm=d.summary||{};
    st.textContent='完成：'+(d.n||0)+' 筆 · 異常 '+(sm.anomaly_count||0)+(d.truncated?'（達單次上限 30，僅評前 30）':'');
    await load();
  }catch(e){
    if(e&&e.authExpired){ st.innerHTML='登入已過期，<a href="/login" target="_blank" rel="noopener">請重新登入</a>後重跑'; }
    else { st.textContent='失敗：'+e.message; }
  }finally{
    btn.disabled=false;
  }
}

// 把一筆 batch-eval result 套進 aiResults（correct/error 各自分數 + 是否符合期望 flag）
function applyAiResult(x){
  var e=aiResults[x.lesson]=aiResults[x.lesson]||{correct:null,error:null,correctFlag:false,errorFlag:false};
  if(x.version==='correct'){ e.correct=x.adjusted_match_rate; e.correctFlag=!!x.flag; }
  else if(x.version==='error'){ e.error=x.adjusted_match_rate; e.errorFlag=!!x.flag; }
  if(x.scored_at && (!e.scoredAt || x.scored_at>e.scoredAt)) e.scoredAt=x.scored_at;  // 取最新跑分時間（#2392）
  delete e.running; delete e.err; delete e.authErr;
}

// 單課跑分（Image #8：點某課 → 跑該課正確/錯誤版 → 顯示分數 + 兩版是否都 pass）
async function runAiEvalForLesson(id){
  var token=localStorage.getItem('lingoleap_token');
  aiResults[id]={running:true}; rerenderAiCell(id);
  try{
    var headers=token?{'Authorization':'Bearer '+token}:{};
    var d=await evalFetch(API+'/api/testset/batch-eval?lesson='+encodeURIComponent(id), headers);
    aiResults[id]={correct:null,error:null,correctFlag:false,errorFlag:false};
    (d.results||[]).forEach(function(x){ if(String(x.lesson)===String(id)) applyAiResult(x); });
  }catch(e){ aiResults[id]=(e&&e.authExpired)?{authErr:true}:{err:true}; }
  rerenderAiCell(id);
}

function rerenderAiCell(id){
  var td=document.getElementById('aicell-'+id);
  if(td) td.innerHTML=aiCell(id, true);
}

load();
</script>
</body>
</html>
