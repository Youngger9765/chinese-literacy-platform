# content_known_gaps.yaml — honest registry of content the platform genuinely
# lacks for the聚光燈 (reading-strategy) / 重點表 (story-structure) steps (#2397).
#
# WHY THIS EXISTS (not a fake-pass list):
#   The content evidence gate iterates every live lesson and marks a cell
#   `unknown` when the source content is missing. `unknown` == fail at gate
#   time. But some lessons have NO extractable聚光燈/重點表 in their source
#   DOCX (classical Chinese 文-L*, lessons whose worksheet has no spotlight
#   range, multi-text secondary slots). Those are真實內容缺口, not bugs — they
#   must be surfaced honestly, not faked green and not blocked as un-triaged
#   unknowns. Listing a lesson here flips its cell from `unknown` to
#   `known_gap`: still NOT a pass, but an explicitly-owned, auditable gap.
#
# HOW IT IS USED:
#   content_evidence_gate.py reads this file. For a (lesson_code, step) listed
#   here it sets status=known_gap + failure_code KNOWN_CONTENT_GAP_<reason>.
#   The ship gate counts known_gap cells separately (reported, non-blocking)
#   but REQUIRES every entry to carry a reason — so adding one is a deliberate,
#   reviewable act, never a silent skip.
#
# REASONS (machine-checked enum):
#   no_spotlight_source   — DOCX 學習單沒有可抽取的閱讀聚光燈段落
#                           (extractor: "spotlight range not found" / empty)
#   no_keypoints_source   — DOCX 沒有可抽取的文章重點表
#   multi_text_secondary  — 多文本課的第二/三篇 slot，內容在 primary slot
#   classical_no_step     — 文言文課型本就無此步驟素材
#   built_pending_deploy  — 線上版 schema 已建好(_online-schema)但尚未進 DB
#                           → 真正解法是部署，不是補件；先誠實標記不擋
#   figure_missing        — 源 DOCX/GCS 都沒有可用真圖資產（不可用 placeholder 補綠）
#
# 校驗來源 (2026-06-22, staging full sweep, post dedup+normalization fix):
#   每筆都對照 private/curriculum-source/_online-schema/<code>.spotlight.yml /
#   .keypoints.yml 的抽取結果，error/_missing_source/empty blocks 才列入。
#   修內容後請從本檔移除對應 entry，讓 gate 重新驗 pass。

schema_version: content-known-gaps.v1

