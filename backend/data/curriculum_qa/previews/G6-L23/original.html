<h1>老鷹紅豆的故事</h1>
<table>
<thead><tr><th>項目</th><th>重點內容</th></tr></thead>
<tbody><tr><th>問題</th><td>農民種的紅豆遭到大量野鳥啄食，為了減少農損，農民製作毒餌，導致大量鳥類__死亡。</td></tr>
<tr><th>解決（誰＋做什麼）</th><td>1.團隊實地調查、與農民溝通。
2.農民改用__種植紅豆，播種時將紅豆埋入土中，減少播種期的鳥害，收成時放棄使用農藥。
3.全聯與農民簽訂契作協議，__收購紅豆</td></tr>
<tr><th>結果</th><td>老鷹紅豆的友善耕作方式保護了__，也帶來了__的成功，友善紅豆面積大幅增加，紅豆產品總銷售額大幅成長。</td></tr>
<tr><th>迴響（結語）</th><td>老鷹紅豆的成功，除了大學、農民和企業，還有許多__，支持購買老鷹紅豆，用行動守護臺灣生態。</td></tr>
</tbody>
