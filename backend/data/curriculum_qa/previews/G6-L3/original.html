<tr><th>證據二：黃面蜂</th><td>黃面蜂捕獵捲葉蛾幼蟲時，在葉子前端、後端來回追逐，等幼蟲展現來回奔跑的規律後，黃面蜂突然__，停在一端守株待兔，抓住了捲葉蛾幼蟲。</td></tr>
<tr><th>結論</th><td>從李淳陽得到的證據：
1.捲葉象鼻蟲臨機應變、解決問題。
2.黃面蜂打破規律，抓住獵物。
他得到的結論：昆蟲展現了本能之外的行為，牠們應該是__的動物。</td></tr>
