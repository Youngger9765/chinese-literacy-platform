<tr><th rowspan="1" class="section">科學界的解釋</th><td>(1)人類每晚有四到六次的睡眠週期，每次約90分鐘。

(3)鬼壓床又稱__，是因為身體有自我保護機制，避免作夢時讓身體受傷。</td></tr>
<tr><th>結論</th><td>理性的科學方法，讓我們不再害怕，對現象有更客觀的認識。</td></tr>
