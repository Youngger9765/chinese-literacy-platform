# -----------------------------------------------------------------------------
# Cat 5: 系統性差異（不是個別詞，是整體口音特徵）
# -----------------------------------------------------------------------------
systematic_differences:
  - pattern: 兒化音
    taiwan: 幾乎不用。「一會兒」讀三個字 yī huì ér
    china: 大量使用。「一會兒」讀 yī huìr
    impact: Gemini 可能加兒化，台灣學生不習慣
    fix: TTS prompt 指定不加兒化音

  - pattern: 捲舌音強度
    taiwan: zh/ch/sh 捲舌較輕
    china: zh/ch/sh 捲舌明顯
    impact: 捲舌太重會顯得「很大陸腔」
    fix: 無法用文字前處理解決，需選對 voice

  - pattern: 前後鼻音
    taiwan: -n/-ng 區分較模糊
    china: 嚴格區分
    impact: TTS 嚴格區分對教學反而正面
    fix: 不需處理

