# =============================================================================
# 台灣國語 vs 中國普通話 發音差異對照表
# For: LingoLeap TTS (Gemini 3.1 Flash) 發音校正
# Sources:
#   - Wikipedia: 臺灣海峽兩岸現代標準漢語發音差異列表
#   - ToneOZ (toneoz.com): 兩岸語音差異搜尋引擎（170,000+ 詞分析，差異約 3-4%）
#   - 陳樂融: 兩岸不同讀音一覽表
#   - 教育部《國語一字多音審訂表》
# Version: 1.0 (2026-04-18)
# =============================================================================

# -----------------------------------------------------------------------------
# Cat 1: 聲調不同（同字不同聲調，最容易被學生察覺）
# Priority: P0 — 每個都會讓台灣學生覺得「念錯了」
# -----------------------------------------------------------------------------
tone_differences:
  # --- 高頻（課文大量出現）---
  - word: 垃圾
    taiwan: "ㄌㄜˋ ㄙㄜˋ (lè sè)"
    china: "lā jī"
    frequency: high
    notes: 完全不同音。14 次出現。台灣學生一聽就知道不對

  - word: 研究
    taiwan: "ㄧㄢˊ ㄐㄧㄡˋ (yán jiù)"
    china: "yán jiū"
    frequency: high
    notes: 64 次出現，遍布所有課文。「究」台灣四聲，大陸一聲

  - word: 危險
    taiwan: "ㄨㄟˊ ㄒㄧㄢˇ (wéi xiǎn)"
    china: "wēi xiǎn"
    frequency: high
    notes: 7 次。「危」台灣二聲，大陸一聲

  - word: 企業
    taiwan: "ㄑㄧˋ ㄧㄝˋ (qì yè)"
    china: "qǐ yè"
    frequency: high
    notes: 「企」台灣四聲，大陸三聲

  - word: 成績
    taiwan: "ㄔㄥˊ ㄐㄧ (chéng jī)"
    china: "chéng jì"
    frequency: high
    notes: 「績」台灣一聲，大陸四聲。學校最常用詞

  - word: 星期
    taiwan: "ㄒㄧㄥ ㄑㄧˊ (xīng qí)"
    china: "xīng qī"
    frequency: high
    notes: 「期」台灣二聲，大陸一聲

  - word: 法律
    taiwan: "ㄈㄚˋ ㄌㄩˋ (fà lǜ)"
    china: "fǎ lǜ"
    frequency: high
    notes: 「法」台灣四聲，大陸三聲

  - word: 微笑
    taiwan: "ㄨㄟˊ ㄒㄧㄠˋ (wéi xiào)"
    china: "wēi xiào"
    frequency: high
    notes: 「微」台灣二聲，大陸一聲

  - word: 盡量
    taiwan: "ㄐㄧㄣˋ ㄌㄧㄤˋ (jìn liàng)"
    china: "jǐn liàng"
    frequency: high
    notes: 「盡」台灣四聲，大陸三聲

  - word: 休息
    taiwan: "ㄒㄧㄡ ㄒㄧˊ (xiū xí)"
    china: "xiū xī"
    frequency: high
    notes: 「息」台灣二聲，大陸一聲

  # --- 中頻 ---
  - word: 暫時
    taiwan: "ㄓㄢˋ ㄕˊ (zhàn shí)"
    china: "zàn shí"
    frequency: medium
    notes: 聲母也不同（zh vs z）

  - word: 包括
    taiwan: "ㄅㄠ ㄍㄨㄚ (bāo guā)"
    china: "bāo kuò"
    frequency: medium
    notes: 6 次出現。韻母完全不同

  - word: 綜合
    taiwan: "ㄗㄨㄥˋ (zòng)"
    china: "zōng"
    frequency: medium
    notes: 「綜合活動」課名常用

  - word: 友誼
    taiwan: "ㄧㄡˇ ㄧˊ (yǒu yí)"
    china: "yǒu yì"
    frequency: medium

  - word: 亞洲
    taiwan: "ㄧㄚˇ ㄓㄡ (yǎ zhōu)"
    china: "yà zhōu"
    frequency: medium

  - word: 品質
    taiwan: "ㄆㄧㄣˇ ㄓˊ (pǐn zhí)"
    china: "pǐn zhì"
    frequency: medium

  - word: 褐色
    taiwan: "ㄏㄜˊ ㄙㄜˋ (hé sè)"
    china: "hè sè"
    frequency: medium

  - word: 攻擊
    taiwan: "ㄍㄨㄥ ㄐㄧˊ (gōng jí)"
    china: "gōng jī"
    frequency: medium

  - word: 寂寞
    taiwan: "ㄐㄧˊ ㄇㄛˋ (jí mò)"
    china: "jì mò"
    frequency: medium

  - word: 阿姨
    taiwan: "ㄚˇ ㄧˊ (ǎ yí)"
    china: "ā yí"
    frequency: high

  - word: 炸雞
    taiwan: "ㄓㄚˋ ㄐㄧ (zhà jī)"
    china: "zhá jī"
    frequency: high
    notes: 烹飪「炸」大陸二聲，台灣統一四聲

# -----------------------------------------------------------------------------
# Cat 2: 聲母/韻母不同（發音完全不一樣）
# -----------------------------------------------------------------------------
initial_final_differences:
  - word: 蝸牛
    taiwan: "ㄍㄨㄚ ㄋㄧㄡˊ (guā niú)"
    china: "wō niú"
    frequency: medium
    notes: 完全不同音。自然課常見

  - word: 液體
    taiwan: "ㄧˋ ㄊㄧˇ (yì tǐ)"
    china: "yè tǐ"
    frequency: medium

  - word: 攜帶
    taiwan: "ㄒㄧ ㄉㄞˋ (xī dài)"
    china: "xié dài"
    frequency: medium

  - word: 堤防
    taiwan: "ㄊㄧˊ ㄈㄤˊ (tí fáng)"
    china: "dī fáng"
    frequency: medium
    notes: 聲母不同。台灣送氣 t，大陸不送氣 d

  - word: 角色
    taiwan: "ㄐㄩㄝˊ ㄙㄜˋ (jué sè)"
    china: "jué sè"
    frequency: high
    notes: 3 次出現。此詞兩岸一致，但「角」其他語境台灣偏 jiǎo

  - word: 混淆
    taiwan: "ㄏㄨㄣˋ ㄧㄠˊ (hùn yáo)"
    china: "hùn xiáo"
    frequency: low
    notes: 「淆」聲母完全不同

# -----------------------------------------------------------------------------
# Cat 3: 多音字偏好不同
# -----------------------------------------------------------------------------
polyphonic_preferences:
  - word: 知識
    taiwan: "ㄓ ㄕˋ (zhī shì)"
    china: "zhī shí"
    frequency: high
    notes: 「識」台灣四聲 shì，大陸二聲 shí。高頻詞

  - word: 說服
    taiwan: "ㄕㄨㄛ ㄈㄨˊ (shuō fú)"
    china: "shuì fú (傳統) / shuō fú (新)"
    frequency: medium
    notes: 台灣統一 shuō，大陸傳統 shuì

  - word: 地殼
    taiwan: "ㄉㄧˋ ㄎㄜˊ (dì ké)"
    china: "dì qiào"
    frequency: medium
    notes: 自然課常見。完全不同音

  - word: 血
    taiwan: "ㄒㄧㄝˇ (xiě) 口語常用"
    china: "xuè 標準"
    frequency: medium
    notes: 台灣口語偏 xiě（流血），大陸標準偏 xuè

  - word: 曝光
    taiwan: "ㄆㄨˋ ㄍㄨㄤ (pù guāng)"
    china: "bào guāng"
    frequency: low

  - word: 骰子
    taiwan: "ㄊㄡˊ ㄗˇ (tóu zi)"
    china: "shǎi zi (口語)"
    frequency: medium

# -----------------------------------------------------------------------------
# Cat 4: 輕聲差異（台灣幾乎不用輕聲，大陸大量使用）
# 這是最系統性的差異，影響數百個詞
# -----------------------------------------------------------------------------
neutral_tone_differences:
  # 所有疊字親屬稱呼：台灣保留原調，大陸第二字輕聲
  - word: 爸爸
    taiwan: "ㄅㄚˋ ㄅㄚˋ (bà bà)"
    china: "bà ba"
    frequency: high

  - word: 媽媽
    taiwan: "ㄇㄚ ㄇㄚ (mā mā)"
    china: "mā ma"
    frequency: high

  - word: 哥哥
    taiwan: "ㄍㄜ ㄍㄜ (gē gē)"
    china: "gē ge"
    frequency: high

  - word: 姐姐
    taiwan: "ㄐㄧㄝˇ ㄐㄧㄝˇ (jiě jiě)"
    china: "jiě jie"
    frequency: high

  # 常用雙字詞：台灣保留聲調，大陸第二字輕聲
  - word: 學生
    taiwan: "ㄒㄩㄝˊ ㄕㄥ (xué shēng)"
    china: "xué sheng"
    frequency: high

  - word: 先生
    taiwan: "ㄒㄧㄢ ㄕㄥ (xiān shēng)"
    china: "xiān sheng"
    frequency: high

  - word: 漂亮
    taiwan: "ㄆㄧㄠˋ ㄌㄧㄤˋ (piào liàng)"
    china: "piào liang"
    frequency: high

  - word: 東西
    taiwan: "ㄉㄨㄥ ㄒㄧ (dōng xī)"
    china: "dōng xi"
    frequency: high

  - word: 意思
    taiwan: "ㄧˋ ㄙ (yì sī)"
    china: "yì si"
    frequency: high

  - word: 故事
    taiwan: "ㄍㄨˋ ㄕˋ (gù shì)"
    china: "gù shi"
    frequency: high

  - word: 時候
    taiwan: "ㄕˊ ㄏㄡˋ (shí hòu)"
    china: "shí hou"
    frequency: high

  - word: 喜歡
    taiwan: "ㄒㄧˇ ㄏㄨㄢ (xǐ huān)"
    china: "xǐ huan"
    frequency: high

  - word: 告訴
    taiwan: "ㄍㄠˋ ㄙㄨˋ (gào sù)"
