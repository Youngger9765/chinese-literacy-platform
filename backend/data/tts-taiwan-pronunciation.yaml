    frequency: high

  - word: 認識
    taiwan: "ㄖㄣˋ ㄕˋ (rèn shì)"
    china: "rèn shi"
    frequency: high

  - word: 朋友
    taiwan: "ㄆㄥˊ ㄧㄡˇ (péng yǒu)"
    china: "péng you"
    frequency: high

  - word: 舒服
    taiwan: "ㄕㄨ ㄈㄨˊ (shū fú)"
