strategy_explained: 這篇說明文用四張圖帶你練習「看懂圖和文字的關係」，因為它把地球暖化的趨勢圖、溫室效應的比喻，還有二氧化碳排放量跟氣溫的關聯都跟文字結合在一起，所以讀的時候，你可以試著邊看圖邊想文字說了什麼，然後想想圖和文字的說明是不是讓你更清楚「地球暖化」這件事呢
