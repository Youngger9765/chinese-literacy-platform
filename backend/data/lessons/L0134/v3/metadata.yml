intro: 這篇文章透過四張圖，帶領大家一起探討近年來備受關注的「地球暖化」現象。文章首先呈現了地球平均氣溫長期的變化趨勢，並說明了「溫室效應假說」如何解釋氣溫升高的原因，也就是人類活動排放過多二氧化碳，如同給地球穿上厚外套。接著，文章進一步連結了二氧化碳排放量與全球氣溫上升的關係。然而，文章也提出了另一種觀點，從更長遠的時間尺度來看地球的自然溫度變化，引導讀者思考目前的暖化現象是否全然是人類活動所造成。透過這些圖表和不同的觀點，引導我們一同思考地球暖化的原因。
