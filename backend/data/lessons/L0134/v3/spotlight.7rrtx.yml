lesson_uid: L0134
version_id: v3
section_no: 二
spotlight:
  strategy_name: 圖文整合閱讀策略——先文後圖，再整合
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: '紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）26 個，PDF p5~p9 全部可見；

    填空題（圖二標題、兩大星體、練習三與練習四的步驟❹）是橘色手寫，也在文字層。'
  note: '五個練習（練習一~四各對一段一圖，練習五統整），每個練習底下是步驟❶~❹。

    原稿的練習標題印在一個黑框裡（w:bdr auto），這裡用 guide 呈現，框線不另外記。'
  blocks:
  - type: concept_box
    text: '前一課我們已經知道圖片有助於理解文章重點。讀有插圖的文章時，不能只看文字，也不能只看圖片，而要把文字和圖片對照起來讀。至於先看文字還是先看圖片，其實並沒有固定的順序。這一課，我們要練習先讀文字，再看圖片的閱讀策略。下面4個步驟可幫助我們進行圖文整合閱讀：

      ❶先讀文——抓到重點，想一想：要我從圖中看什麼

      ❷再看圖——讀懂這張圖告訴我們什麼訊息

      ❸文圖對照——從圖中找對應的訊息

      ❹整合文圖——把文和圖合起來想，文圖要表達什麼'
  - type: guide
    text: 練習一：第一段 vs 圖一
  - type: guide
    text: 步驟❶：先讀文——抓到文字重點，想一想：要我從圖中看什麼？
  - type: guide
    text: 小祕訣：文字會告訴我們，哪些地方要看圖。你讀到「如圖一」「如圖二」這些提示詞時，就要看圖，並問自己這段要你看圖的什麼？
  - type: free_text
    prompt: 1.在第一段畫出需要用圖一確認的訊息：整體氣溫趨勢、1975年後的變化，以及近年的高點。
    answer_carrier: 在課文上畫線；教師版把要畫的三處直接印在題目裡並加粗（整體氣溫趨勢／1975年後的變化／近年的高點）
  - type: multi
    prompt: 2.第一段的末尾提到一些事實，並非是圖一呈現的，而是「其他研究顯示」的，請你把它們選出來？（複選）
    options:
      1: 1850年以來地球平均氣溫逐年升高
      2: 1975年以後，地球升溫的情況比之前快了3倍
      3: 1975年以後，地球開始快速升溫
      4: 2024年的平均氣溫比20世紀高1.29°C
    answers:
    - 2
    - 4
  - type: guide
    text: 步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息
  - type: guide
    text: 小祕訣：看圖時，要先看標題、縱軸、橫軸分別表示什麼，再看整體方向。
  - type: single
    prompt: 1.圖一主要在說什麼？（單選）
    options:
      1: 圖一呈現不同地區在同一年的氣溫差異
      2: 圖一是張時間趨勢圖，告訴我們地球氣溫隨年代怎麼變化
    answer: 2
  - type: multi
    prompt: 2.下面哪兩個選項最能從圖一直接看出來？（複選）
    options:
      1: 1850年以來，地球平均氣溫整體呈上升趨勢
      2: 1975年以來，上升的速度加快了3倍
      3: 2024年地球的平均氣溫比19世紀高1.46°C
      4: 1975年以後，地球平均氣溫快速升高
    answers:
    - 1
    - 4
  - type: guide
    text: 步驟❸：文圖對照——從圖中找對應的訊息（單選）
  - type: single
    prompt: 1.「地球平均氣溫整體呈上升趨勢」這句，圖一哪裡看得出來？（單選）
    options:
      1: 線條中間有起伏，表示氣溫沒有持續上升
      2: 雖然線條中間有起伏，但整體從左到右愈來愈高
    answer: 2
  - type: single
    prompt: 2.「1975年以後，地球開始快速升溫」這句，圖一哪裡看得出來？
    options:
      1: 1975年後，線條變得更陡，表示上升速度加快
      2: 1975年後，線條的上下起伏變得愈來愈明顯
    answer: 1
  - type: single
    prompt: 3.「2024年為有記錄以來的最暖年」這句，讀圖時要注意哪裡？（單選）
    options:
      1: 先找到2024的大概位置，看看它的折線圖是不是來到最高點附近
      2: 圖的最左邊是不是落在最低點附近
    answer: 1
  - type: guide
    text: 步驟❹：整合文圖——把文和圖合起來想，文圖要表達什麼？
  - type: single
    prompt: 下面哪一句，最能把第一段和圖一的意思一起說清楚？（單選）
    options:
      1: 地球平均氣溫整體在上升，而且近年來到高點
      2: 地球平均氣溫整體在上升，1975年後升得更快，近年來到高點
    answer: 2
  - type: guide
    text: 練習二：第二段 vs 圖二
  - type: guide
    text: 步驟❶：先讀文——抓到重點，想一想：要我從圖中看什麼？
  - type: guide
    text: 小祕訣：讀到「如圖二」時，就要看圖，想一想：這一段要我從圖中看出的是變化，還是原因？
  - type: free_text
    prompt: 1.請把第二段文字中，要你看圖的地方畫線
    no_correct_answer: true
    answer_carrier: 學生在課文上畫線，原稿無標準答案
  - type: single
    prompt: 2.這段文字要你看圖二的主題是什麼？（單選）
    options:
      1: 地球的熱量從太陽來
      2: 地球氣溫上升的原因
    answer: 2
  - type: guide
    text: 步驟❷：再看圖——先讀懂這圖告訴我們什麼訊息（試著依以下步驟讀圖）
  - type: free_text
    prompt: 1.圖二的標題是：【　】
    answers:
    - 溫室效應示意圖
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: free_text
    prompt: 2.兩大星體分別：太陽和【　】。
    answers:
    - 地球
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: single
    prompt: 3.圖中的太陽能量往哪一個方向傳遞？
    options:
      1: 從太陽射向地球
      2: 從地球射向太陽
    answer: 1
  - type: single
    prompt: 4.圖二主要在說什麼？
    options:
      1: 從太陽來的熱量有一部分被溫室氣體困住，不容易散出去
      2: 從太陽來的熱量源源不斷，讓地球氣溫提升，像溫室一樣
    answer: 1
  - type: guide
    text: 步驟❸：文圖對照
  - type: single
    prompt: 1.圖二用什麼表示溫室氣體形成的「外套」？
    options:
      1: 5條由太陽射出的波浪形曲線
      2: 圍著地球的那條大弧形線
    answer: 2
  - type: single
    prompt: 2.圖二的什麼地方表示「部分被困住的熱能？」
    options:
      1: 大弧形線和地球間的2個山形曲線
      2: 有箭頭的3條曲線
    answer: 1
  - type: single
    prompt: 3.圖二的什麼地方表示「被散到外太空的熱能？」
    options:
      1: 大弧形線和地球間的2個山形曲線
      2: 有箭頭的3條曲線
    answer: 2
  - type: guide
    text: 步驟❹：整合文圖——把文和圖合起來想，文圖要表達什麼？
  - type: single
    prompt: 下面哪一句，最能把第二段和圖二的意思一起說清楚？（單選）
    options:
      1: 二氧化碳像厚外套，讓太陽的熱量都留在地球上，所以地球逐漸升溫
      2: 二氧化碳像厚外套，讓部分熱量不容易散出去，所以地球逐漸升溫
    answer: 2
  - type: guide
    text: 練習三：第三段 vs 圖三
  - type: guide
    text: 步驟❶：先讀文——抓到重點，想一想：要我從圖中看什麼？
  - type: guide
    text: 小祕訣：讀到「圖三進一步說明」時，要想一想：這一段要我看的是一條線，還是兩條線一起怎麼變。
  - type: free_text
    prompt: 1.請把第三段文字中，要你看圖的地方畫線
    no_correct_answer: true
    answer_carrier: 學生在課文上畫線，原稿無標準答案
  - type: single
    prompt: 2.這段要你看圖三的什麼？（單選）
    options:
      1: 地球氣溫逐漸升高的原因
      2: 二氧化碳排放量和全球氣溫的共同成長趨勢
    answer: 2
  - type: guide
    text: 步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息
  - type: guide
    text: 小祕訣：看圖三時，先看有幾條線、各代表什麼，再看它們的整體趨勢。
  - type: single
    prompt: 圖三主要在說什麼？
    options:
      1: 圖三呈現「二氧化碳排放量」和「全球氣溫」都隨年代愈來愈高
      2: 圖三是在說明熱量怎麼進來，又怎麼不容易散出去的情況
    answer: 1
  - type: guide
    text: 步驟❸：文圖對照——從圖中找對應的訊息
  - type: single
    prompt: 1.「二氧化碳的排放量愈來愈高，地球氣溫也隨之上升」這句，讀圖時要注意什麼？（單選）
    options:
      1: 兩條線整體都往上升
      2: 兩條線一高一低，方向相反
    answer: 1
  - type: single
    prompt: 2.「兩條曲線的前半段，還算平穩緩升，但後半段，曲線往上爬的角度變大」這句，圖三哪裡看得出來？（單選）
    options:
      1: 後半段兩條線變成完全平行的兩條線
      2: 前半段曲線比較平，後半段變得比較陡
    answer: 2
  - type: guide
    text: 步驟❹：整合文圖——把文和圖合起來想，文圖要表達什麼？
  - type: free_text
    prompt: 請用一句話，說明第三段和圖三的意思：
    answers:
    - 二氧化碳排放量和全球氣溫都愈來愈高，而且後半段上升更快
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 練習四：第四段 vs 圖四
  - type: guide
    text: 步驟❶：先讀文——抓到重點，想一想：要我從圖中看什麼？
  - type: free_text
    prompt: 1.請把第四段文字中，要你看圖的地方畫線
    no_correct_answer: true
    answer_carrier: 學生在課文上畫線，原稿無標準答案
  - type: single
    prompt: 2.這段要你看圖四的什麼？（單選）
    options:
      1: 長時間地球溫度冷熱變化的情形
      2: 近一、兩百年地球升溫的速度變化
    answer: 1
  - type: guide
    text: 步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息
  - type: single
    prompt: 1.圖四主要在說什麼？（單選）
    options:
      1: 把時間拉長來看，地球溫度會一路持續往上升
      2: 把時間拉長來看，地球溫度會反覆出現高低變化
    answer: 2
  - type: single
    prompt: 2.讀圖四時，最先要注意哪一個特徵？（單選）
    options:
      1: 橫軸時間很長，而且曲線有高有低
      2: 橫軸時間很長，而且曲線一路往上升
    answer: 1
  - type: guide
    text: 步驟❸：文圖對照——從圖中找對應的訊息
  - type: single
    prompt: 1.關於「曲線反覆出現低谷和高峰；較低的低谷代表冰河期，較高的高峰代表較暖時期」這個說明，讀圖時要注意什麼？（單選）
    options:
      1: 曲線每次高峰和低谷，橫軸都有幾萬年
      2: 曲線反覆出現∪形低谷和「倒∪形」高峰
    answer: 2
  - type: single
    prompt: 2.圖四最能直接幫助你讀懂哪一句？（單選）
    options:
      1: 幾萬年來，地球的溫度曲線本來就有高有低
      2: 近年的暖化現象「不一定」和人類使用化石燃料有關
    answer: 1
  - type: free_text
    prompt: 步驟❹：整合文圖——把文和圖合起來想，文圖要表達什麼？
    answers:
    - 把時間拉長來看，地球溫度本來就有高有低，所以推論近年暖化的原因時要特別小心
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    note: 練習四的步驟❹底下沒有另外印題目，直接就是作答線 —— 所以步驟標題本身就是題幹
  - type: guide
    text: 練習五：統整一下：把四張圖串起來讀
  - type: guide
    text: 前面四個練習，是分開讀每一段和每一張圖。現在請你把四段和四張圖連起來想。
  - type: single
    prompt: 下面哪一句，最能把四段和四張圖的關係串起來？（單選；請看完再選）
    options:
      1: 圖一呈現地球升溫現象，圖二說明溫室效應是升溫的原因，圖三提供支持溫室效應的因果證據，圖四證明了近年暖化是因人類大量排放溫室氣體所致。
      2: 圖一呈現升溫現象，圖二說明升溫可能原因—溫室效應，圖三補充溫室效應的支持證據——二氧化碳排放和氣溫的共同趨勢，圖四提醒因果推論時要更小心。
    answer: 2
  - type: self_check
    title: ◎自我檢核
    instruction: 請勾選下面４項，檢查自己是否學會閱讀圖文文章的方法。
    items:
    - 1.我能從文字找出「要從圖中看什麼」。
    - 2.我能依圖的種類，查看圖題、軸、圖例、標示或箭頭。
    - 3.我能分辨圖直接呈現什麼、文字補充什麼。
    - 4.我能把圖文合成一句完整意思，並避免超出證據的推論。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
