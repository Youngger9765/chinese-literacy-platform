    content: '照片式示意圖（黑色太空背景、左上角太陽、右下方地球）。

      標籤：太陽（指向左上角光球）／地球（指向右下方星球）

      對話框：溫室氣體（如二氧化碳）替地球穿上一層外套，把部分來自日光的熱能困住，讓地球升溫了。

      太陽射出多條波浪形（彈簧狀）曲線斜向地球；

      地球上方有一條橫貫畫面的大弧形線（＝溫室氣體形成的「外套」）；

      大弧形線與地球之間有山形（來回彈跳）曲線 ＝ 被困住的熱能；

      另有帶箭頭的曲線穿過弧形線往外太空 ＝ 散出去的熱能。'
    placement_note: 圖排在第 2 段之後、第 3 段之前（PDF p3 中段）
