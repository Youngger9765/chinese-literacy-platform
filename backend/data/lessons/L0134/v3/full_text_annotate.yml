    title: 圖三：二氧化碳排放量和氣溫升高息息相關（1880~2025）
    content: '上排四個圓角方框（推論歷程）：

      ❶燃燒化石燃料｜工廠、汽車、火力發電會排放大量氣體。

      ❷二氧化碳變多｜支持者認為，空氣中的CO2明顯增加，

      ❸熱更難散出去｜向蓋上更厚的被子，地球散熱更慢。   ← 「向」疑為「像」，見 source_errata E1

      ❹近代氣溫上升｜因此，近年的全球均溫就一步一步往上升。

      下方折線圖圖例：CO2（點點線）／全球均溫（長虛線）

      橫軸刻度：1880／1950／2025

      圖內三個直書方框標籤（由左到右）：阿公阿嬤出生／爸媽出生／你出生

      兩條曲線都由左下往右上，後半段坡度變陡，CO2 那條始終在全球均溫那條之上。'
