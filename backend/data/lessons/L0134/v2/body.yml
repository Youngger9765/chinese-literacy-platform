source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 遇到圖文題時，不能只看文字，也不能只看插圖，眼睛必須在文、圖間來回移動，把文圖的關係弄清楚，才能又快又正確地答題。這一課我們用地球升溫這個話題來學習如何閱讀、解答圖文題。前一課從圖開始，本課從文字開始；不論先讀哪一邊，最後都要找出圖文對應與互補的訊息，再合起來判斷。
- 近年來的天氣愈來愈古怪，四、五月已經熱到汗流浹背，冬天了居然還有颱風警報。這些現象，讓人不禁懷疑：地球是不是愈來愈熱了？不過，要回答這個問題，不能只靠生活中的感受，而要看長期的平均氣溫變化。圖一中，縱軸為0.0所對應的橫線，代表20世紀的平均氣溫。從圖一可看出，1850年以來，地球平均氣溫整體愈來愈高，1975年以後，地球開始快速升溫。而且，2024年為有記錄以來的最暖年。其它研究顯示，2024年的平均氣溫比20世紀高1.29°C，比19世紀高1.46°C；1975年以後，平均氣溫上升的速度比1975年之前加快了３倍。
- 為什麼地球氣溫會逐漸升高呢？「溫室效應假說」是目前獲得較多證據支持的解釋——工業革命以來，人類開始大量燃燒煤、石油等化石燃料，因此，大量的二氧化碳（CO2）被釋放到大氣層，過多的二氧化碳，就好像給地球穿上一件厚外套，讓太陽照到地球的熱量，有一部分沒有辦法散到太空去，地球就愈來愈熱了，如圖二。
- 圖三進一步說明了「二氧化碳排放量（點點線）」和「全球氣溫（虛線）」共同上升的趨勢。可以看出，從1880年到2025年，二氧化碳的排放量愈來愈高，地球氣溫也隨之上升。兩條曲線的前半段還算平穩緩升，但後半段曲線往上爬的角度變大，亦即，二氧化碳排放和全球氣溫，兩者的上升速度都加快了。❶~❹的圓框則說明溫室效應的推論歷程。
- 但是，並非所有的科學家都認為這一、兩百年來的升溫是人類燃燒石化燃料所致，有些科學家把時間拉長來看，畫出地球史上平均溫度的變化情形，如圖四。在這個圖裡，橫軸的時間長達42萬年，而地球溫度曲線本來就有高有低——低下去的「∪形」就是「冰河期」，高起來的「倒∪形」就是「發燒期」。你可以點數一下，這42萬年裡，冰河期和升溫期各有出現多少次？此外，人類的祖先大概在10萬年前才從非洲走出，開始向全球各地遷徙，那時人類還不會「大量燃燒化石燃料」，因此，10萬年以前地球幾次的「發燒期」就不可能是人類大量燃燒化石燃料造成的，而是「自然發生」的。亦即，近年的暖化現象「也許」只是地球氣溫長期變化中的一小段，「不一定」和人類使用化石燃料有關。
- 總結來說，雖然近代科學家找到了一個新的、很強的解釋，可以說明地球暖化，但地球本來就會自己變冷或變熱，所以到底今天地球暖化的原因為何？在推論時，還需要特別小心才行。
