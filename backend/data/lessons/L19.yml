fill_in_blank:
- sentence: 當我們學習時，應該學會從眾多資訊中（　　），只吸收真正有用的知識。
  answer: A
- sentence: 博物館的展覽實在太精彩了，我們在裡面欣賞了很久，幾乎（　　）。
  answer: B
- sentence: 為了省一點點錢，卻花費更多時間和精力，這樣的做法真是（　　）。
  answer: C
- sentence: 如果不改掉熬夜的習慣，就會陷入精神不濟、學習效率低落的（　　）中。
  answer: D
- sentence: 爸爸偶爾會和朋友在週末（　　）幾杯，但從不貪杯。
  answer: E
- sentence: 為了考上理想的學校，哥哥每天晚上都努力讀書，那股（　　）的精神令人佩服。
  answer: F
- sentence: 早上被鬧鐘吵醒時，我總是（　　），好一會兒才能清醒過來。
  answer: G
- sentence: 運動可以促進身體的（　　），讓我們的身體保持健康與活力。
  answer: H
- sentence: 每天固定時間吃飯睡覺，有助於調整我們的（　　），讓身體保持規律。
  answer: I
multiple_choice:
- question: 下列語詞何者使用不正確？
  options:
  - 不肖商人將仿冒品「去蕪存菁」，欺騙不知情的顧客。
  - 他貪便宜，買了有問題的機車，結果出了車禍，真是「得不償失」。
  - 她昨天熬夜晚睡，早上起來「睡眼惺忪」，非常疲累。
  - 許多人喜歡在夜晚「小酌」一番，釋放工作壓力。
  answer: A
  explanation: 應為魚目混珠
- question: 根據課文，有關睡眠的敘述，何者不正確？
  options:
  - 大腦在睡眠時會修復疲勞的肌肉。
  - 好的睡眠可降低疾病發生的風險。
  - 睡眠時可重組記憶，有助於學習。
  - 不論老小，每個人每天都需要睡滿八小時。
  answer: D
  explanation: 生長各階段會有不同的睡眠長度
- question: 根據課文，為什麼睡前喝酒不能幫助入眠？
  options:
  - 酒精會使人睡不安穩。
  - 酒精會使人上癮、喝多易作夢。
  - 酒精會讓大腦分泌過多賀爾蒙。
  - 酒精易讓人產生「睡前拖延症」。
  answer: A
  explanation: 第六段：酒精會使人頻繁醒來，無法熟睡。
- question: 造成現代人有「睡前拖延症」最主要的原因為何？
  options:
  - 失眠導致晚上無法入睡。
  - 睡前被3C內容吸引，停不下來。
  - 大腦有其他的睡眠障礙。
  - 大腦高速運轉不想入睡。
  answer: B
  explanation: 課文在「改善失眠的方法」中提到要「遠離3C產品」，間接說明現代人可能因為被3C產品吸引而延後入睡，這與「睡前拖延症」的現象相符。
- question: 根據本課課文，你覺得「懸樑刺股」的讀書效果好嗎？為什麼？
  options:
  - 效果好！這樣才能隨時警惕自己，才不會偷懶。
  - 效果好！這樣才可以增加讀書的時間。
  - 效果不好！它剝奪了睡眠，讓人很難吸收新知。
  - 效果不好！它違反了基本人權，帶來負向情緒。
  answer: C
  explanation: 課文指出「熬夜打電動，導致白天上學時睡眼惺忪，無法吸收新知」，且強調充足的睡眠對於大腦修復、增強記憶的重要性，因此犧牲睡眠的讀書方式效果不好，因為會影響學習吸收。
