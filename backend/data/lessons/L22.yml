knowledge_video_url: https://www.youtube.com/watch?v=kfEw_fv1m_4
story_text: '臺灣有個只有國中學歷的植物獵人，名叫洪信介，大家都稱他為阿介。他是臺灣山林界的傳奇，走入森林25年，總共採集了兩萬種植物，是許多博士、教授倚重的助手，沒有博士學位的他，卻是多篇學術論文作者之一。但你知道嗎？他從小過動，不擅長與人相處，在課堂上總是坐不住，成績更是慘不忍睹，在學習路上挫折不斷，44歲前，只能打零工維生，沒有穩定的工作。所幸，對植物的熱愛促成了他自發性的學習，他在大自然中，找到了屬於自己的祕密花園。在校時課業雖然不好，並沒有因此阻擋他持續汲取植物知識，植物圖鑑是他的精神糧食，不懂就請教專家，最後，連拗󠇡口的植物學名也難不倒他，這樣終身學習的努力，奠定了他成為植物獵人的基礎。

  為什麼需要植物獵人呢？地球因為氣候變遷、人為開發，導致許多物種因棲地破壞，悄然無息的從地球上消失。為了維持生態多樣性，科學家們需要跟時間賽跑，趕在這些物種滅絕之前，將它們保存下來，留給後世的科學家研究、復育。

  但科學家從原始的森林環境採集植物是件困難的事，因為植物是垂直分布的，越高處的植物越難採集，原始林樹冠上的植物尤其難採集，採集者除了需要會爬山、爬樹，還要能在無水無電、杳無人煙的森林裡野外求生，但許多科學家自己沒有辦法做到，他們需要幫手。能爬山、爬樹、野外求生的人其實不少，但要做植物研究，除了要能爬上高山或巨樹，還需要具備辨識物種、判斷重要性的能力，這樣的人少之又少，阿介是其中的佼佼者。植物獵人的工作，不但危險，體力與膽識缺一不可，更需要具備專業的植物知識。阿介全年近1/3的日子待在森林裡，走在樹上就像走在平地般自然，又有專業知識，能和科學家溝通，因此成為許多研究人員合作的對象。

  2008年，辜嚴倬雲植物保種中心成立，需要植物獵人進行野地採集，以保存逐漸在野外消失或滅絕的物種。阿介是許多植物專家心目中的不二人選，卻因為只有國中的學歷，多次被保種中心拒絕。但阿介不服輸，中年重回校園，考上員林農工園藝科後，成為全班最認真的學生。對自己喜歡、擅長的事，他有種「要做就做最好」的執著󠇤，終於成功的以學生身分進入了保種中心。

  為了採集稀有植物，阿介常帶著一把鐮刀，揹著40公斤重量的背包，獨自徒步進入山林十幾天，砍路、辨認植物、採集並進行現場測量，以保存最完整的數據。在茂密的山林中，他必須要用眼睛快速的掃描，認出稀有且瀕危的植物。

  有人說，阿介從事的，是全台灣最危險的工作。為了採集植物，就算是趨近90度的峭壁，他也要冒著生命危險，想盡辦法爬上去完成採集。他曾一腳踩在枯枝上，從20公尺的樹上摔下，也曾在山林迷路，「在山上哭了三天」才僥倖存活。他曾經兩天沒吃飯，只能吃腐木中的蟲；他受傷躺在地上，被黃喉貂以為他死掉了，要吃他，卻被他設陷阱反過來把牠吃了，才能活下來。至於被虎頭蜂追，更是家常便飯。

  有人問阿介說：「植物獵人這份工作，賺錢不多，又辛苦，為什麼還要繼續下去？」

  阿介說：「有些事情還是必須要有人去做啊！」他最大期望就是讓瀕臨絕種植物得到妥善照顧，在保種中心永續留存，甚至有朝󠇡一日可以在野外成功復育。除此，他也從植物獵人的工作得到成就感。他小時候過動、不會讀書，44歲之前都沒有正式的工作，嘗盡人情冷暖，被認為是失敗者。他曾覺得自己這輩子就是一個衰人，人生看不出有什麼意義，但默默累積的山林和植物專業沒有白費，他現在對各種植物、名稱與特性都倒背如流，可以聽得懂學術界的語言，得到研究人員的尊重，這讓他找回了遺失許久的自信心。他曾經說：「在社會中，我是個貧窮失敗的人」，但是，他在森林裡找到了自己的寶藏。

  洪信介奇妙的人生、憑藉著對植物的熱愛，不顧危險的奮勇向前，採集瀕臨絕種的植物，完成連植物學家都無法做到的事，讓他受到全世界的注目，也讓更多人了解保育植物的重要性。英雄不怕出身低，阿介投入熱愛的事業，找到了自己的路。'
