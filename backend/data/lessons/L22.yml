- - 奮鬥歷程
  - '__

    困難'
  - 從小過動、成績差，不擅與人相處。只有國中學歷，44歲前靠打零工維生，被認為是失敗者。【 學習 】
- - 奮鬥歷程
  - 興趣
  - 但他熱愛植物，以【 自學方式 】學習植物知識。
