  - 專長
  - '具備植物獵人的條件：能爬山、爬樹、

    【 野外求生 】能力、具備專業的植物知識。'
- - 奮鬥歷程
  - '__

    困難'
  - '1.問題：因阿介的學歷太低，無法加入植物保種中心。

    2.解決：阿介中年重回校園，很認真學習

    3.結果：阿介克服【 求職 】限制，成功進入保種中心，成為採集稀有植物的專業植物獵人。【 學歷 】'
- - 成就
  - '1.阿介總共採集了兩萬種植物。

    2.為【 瀕臨絕種 】植物的保護做出巨大貢獻，完成連植物學家都做不到的事。'
