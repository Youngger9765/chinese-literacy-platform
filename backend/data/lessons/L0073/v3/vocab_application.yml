  items:
  - index: 1
    stem: 他穿著體育服出現在喜宴上，顯得非常 （　）。
    answer: F
  - index: 2
    stem: 這十年來，科技的進步讓我們的生活發生（　）的變化。
    answer: C
  - index: 3
    stem: 自從他在眾人面前出糗後，犯錯的焦慮就（　），緊緊跟著他。
    answer: A
  - index: 4
    stem: 「盛年不重來，一日難再晨」，美好的（　）要好好把握。
    answer: H
  - index: 5
    stem: 畢業多年，他依然（　）著校園的一草一木。
    answer: G
  - index: 6
    stem: 這場（　）的演講讓台下的人感到不耐煩，紛紛開始聊天。
    answer: E
  - index: 7
    stem: 經過多年的苦練與突破後，進入決賽對他來說已（　）。
    answer: B
  - index: 8
    stem: 媽媽解釋完事情的來龍去脈後，我才（　），知道自己誤會弟弟了。
    answer: D
