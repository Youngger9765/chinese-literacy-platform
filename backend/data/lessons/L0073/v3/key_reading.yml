  instruction: 請用計時器，從指定段落（三☞)開始朗讀，計時1分鐘讀的字數，並記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
  char_count_note: '右緣「字數」欄從第 3 段（☞ 指定的起點）開始累計，到第 4 段結束停在 463，第 5 段沒有標

    ——「字數欄只標到倒數第二段就停了」的形狀，不是漏抽。

