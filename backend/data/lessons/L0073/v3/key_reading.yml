  passage: 慢慢的，我發現自己和每個同學都能相談甚歡，卻不是他們最要好的朋友，這種格格不入的感覺，讓我在走廊遇到小學朋友時總是特別開心；但彼此迎面走來時，卻經常只剩一份陌生的尷尬。又隨著第一次段考逼近，我才驚覺小學的讀書策略不再管用，面對小考卷上密密麻麻的紅字訂正，及格不再唾手可得，反而像斷線的風箏般，遠走高飛。升上國中的新鮮感慢慢退去，孤單和壓力卻如影隨形，無法擺脫也無處可逃。每當望向操場，我看見的是小學下課時大家玩鬼抓人的快樂模樣；而看著新同學和老師，我想到的卻總是：他們好像我小學認識的某個人。那些回憶彷彿一張張散落的照片，在我想念時自動跳到眼前，尤其是畢業典禮的那一幕。而思念是烏雲，日積月累，不斷膨脹，遮住了我的笑容，多希望有時光機帶我回到過去。直到那天，我在走廊上撞見最好的小學朋友，正和國中的新同學有說有笑，那一刻，我才恍然大悟：原來只有我還停留在過去，只有我還緊抓著小學的回憶不放。頓時心中那烏雲密布的天空下了場大雨，雖然失落，但我想，是時候該向小學、向那無憂無慮的時光告別；是時候該專注於新的生活，讓陽光照進日子裡。
