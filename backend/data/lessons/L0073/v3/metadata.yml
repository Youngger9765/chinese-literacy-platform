strategy_explained: '這一課我們要練習從作者使用的「譬喻」，來了解他心裡是什麼樣的感覺，就像你看到「像一陣風」就知道那種快閃而過

  這篇文章裡面，作者用很多譬喻來形容畢業的心情和國中的新生活，像是描述「不安」或「期待」，所以很適合用來練習喔

  讀的時候，可以試著想一想，作者用了什麼比喻，還有那個比喻讓你聯想到什麼樣的感受，然後想想是不是跟作者的感受很像'
