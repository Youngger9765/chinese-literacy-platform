    word: 韶光
    definition: 時間，常指美好的時光。
  - index: 2
    word: 唾手可得
    definition: 往手上吐口水，比喻非常容易得到。同「易如反掌」。
  - index: 3
    word: 枯燥乏味
    definition: 單調、無趣。
  - index: 4
    word: 眷戀
    definition: 懷念、不捨。
  - index: 5
    word: 如影隨形
    definition: 像影子一直跟著人，比喻緊緊跟隨、難以擺脫。
  - index: 6
    word: 格格不入
    definition: 不適合、難以融入。
  - index: 7
    word: 恍然大悟
    definition: 突然醒悟、明白。
  - index: 8
    word: 雀躍
    definition: 像雀鳥一樣跳躍，比喻非常開心、興奮。
  - index: 9
    word: 翻天覆地
    definition: 形容變化非常大。同「天翻地覆」。
  - index: 10
    word: 嶄新
    definition: 全新。
