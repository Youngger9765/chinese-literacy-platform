passage: 慢慢的，我發現自己和每個同學都能相談甚歡，卻不是他們最要好的朋友，這種格格不入的感覺，讓我在走廊遇到小學朋友時總是特別開心；但彼此迎面走來時，卻經常只剩一份陌生的尷尬。又隨著第一次段考逼近，我才驚覺小學的讀書策略不再管用，面對小考卷上密密麻麻的紅字訂正，及格不再唾手可得，反而像斷線的風箏般，遠走高飛。升上國中的新鮮感慢慢退去，孤單和壓力卻如影隨形，無法擺脫也無處可逃。
