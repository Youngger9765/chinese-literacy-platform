spotlight:
  lesson: G6-L6
  strategy_name: 寫作手法：譬喻-從譬喻推論作者感受
  strategy_type: emotion_inference
  blocks:
  - type: guide
    text: "《譬喻：用大家熟悉的事物(A)，說明或凸顯另一件事物(B)的特點 》\n譬喻是一種寫作常見的手法，它和「轉化」與「誇飾」一樣，都是運用聯想、想像力的方式，把一件事物比成另一件大家熟悉的事物，讓原本抽象的特點或感受變得更具體，也讓讀者更容易想像和感受。\n\
      例１：「他的笑容像太陽。」→把「笑容」比成「太陽」，凸顯他的笑容帶給人溫暖、耀眼的感受。\n例2：「他的笑容像盛放的花。」→把「笑容」比成「盛放的花」，凸顯他的笑容帶給人美好、燦爛的感受。\n\
      \    使用譬喻時，句子常會出現「好像」、「像」、「彷彿」、「如（同）」、「一樣」、「A（像）是B」等字詞。文章中使用譬喻的地方，常是作者特別想描寫或表達感受的地方。因此，閱讀時可以留意文章中的譬喻，想一想作者想表達什麼感受或想法。"
  - type: guide
    text: ◎小試身手：
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ◎你發現了嗎？
  - type: single
    prompt: 上面的譬喻有什麼作用？（單選）
    options:
    - 介紹陀螺、風箏、影子等事物的特點。
    - 把抽象的感受寫得具體，讓人更容易理解作者的心情。
    - 依照時間順序，說明事情發生的經過。
    answer: 把抽象的感受寫得具體，讓人更容易理解作者的心情。
  - type: passage
    source: unknown
    paragraphs:
    - →閱讀譬喻時，找出作者「把什麼比成什麼」，再想兩者的共同點，就能推論作者想表達的感受或想法。
