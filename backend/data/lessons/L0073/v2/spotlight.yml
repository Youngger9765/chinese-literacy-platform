spotlight:
  lesson: G6-L6
  strategy_name: 寫作手法：譬喻-從譬喻推論作者感受
  strategy_type: emotion_inference
  blocks:
  - type: guide
    text: 《譬喻：用大家熟悉的事物(A)，說明或凸顯另一件事物(B)的特點 》譬喻是一種寫作常見的手法，它和「轉化」與「誇飾」一樣，都是運用聯想、想像力的方式，把一件事物比成另一件大家熟悉的事物，讓原本抽象的特點或感受變得更具體，也讓讀者更容易想像和感受。例１：「他的笑容像太陽。」→把「笑容」比成「太陽」，凸顯他的笑容帶給人溫暖、耀眼的感受。例2：「他的笑容像盛放的花。」→把「笑容」比成「盛放的花」，凸顯他的笑容帶給人美好、燦爛的感受。    使用譬喻時，句子常會出現「好像」、「像」、「彷彿」、「如（同）」、「一樣」、「A（像）是B」等字詞。文章中使用譬喻的地方，常是作者特別想描寫或表達感受的地方。因此，閱讀時可以留意文章中的譬喻，想一想作者想表達什麼感受或想法。
  - type: guide
    text: ◎小試身手：
  - type: table
    rows:
    - - ''
      - 原文（請圈出譬喻關鍵字詞）
      - 句中聯想
      - 欲凸顯的共同點(多選)
    - - '1'
      - 那時的我像顆陀螺，不僅忙得暈頭轉向，在短暫的下課時間橫衝直撞，也在同學之間不斷打轉，想尋找志同道合的伴。
      - 我像【】
      - □１.需要人啟動□２.橫衝直撞□３.無法停止□４.在某處／人圍繞
    - - '2'
      - 及格不再唾手可得，反而像斷線的風箏般，遠走高飛。
      - 及格像【】
      - □１.遙不可及□２.無法捕捉□３.單薄輕盈
    - - '3'
      - 孤單和壓力卻如影隨形，無法擺脫也無處可逃。
      - 孤單和壓力像【】
      - (單選)□１.無所不在□２.黑且明顯
    - - '4'
      - 那些回憶彷彿一張張散落的照片，在我想念時自動跳到眼前，尤其是畢業典禮的那一幕。
      - 回憶像【】
      - □１.老舊泛黃□２.一個個畫面呈現□３.鮮明清晰
    - - '5'
      - 而思念是烏雲，日積月累，不斷膨脹，遮住了我的笑容
      - 思念像【】
      - □１.能遮擋□２.會變大
    - - '6'
      - 作者寫下的字字句句，無非是希望那像珍珠般飽滿耀眼的回憶，能禁得起時間的沖刷，讓美好多留存一些。
      - 回憶像【】
      - □１.飽滿耀眼□２.不因時間而衰敗□３.美好無暇□４.昂貴稀有
    answers:
    - 陀螺
    - 斷線風箏
    - 影子
    - 照片
    - 烏雲
    - 珍珠
  - type: guide
    text: ◎你發現了嗎？
  - type: single
    prompt: 上面的譬喻有什麼作用？（單選）
    options:
    - 介紹陀螺、風箏、影子等事物的特點。
    - 把抽象的感受寫得具體，讓人更容易理解作者的心情。
    - 依照時間順序，說明事情發生的經過。
    answer: 介紹陀螺、風箏、影子等事物的特點。
  - type: passage
    source: unknown
    paragraphs:
    - →閱讀譬喻時，找出作者「把什麼比成什麼」，再想兩者的共同點，就能推論作者想表達的感受或想法。
