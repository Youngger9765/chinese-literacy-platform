multiple_choice:
- question: 下底下哪一個情況，可以用「如影隨形」這個詞語來形容？
  options:
  - 月光下微風中搖曳的樹影。
  - 比賽時，突發的肌肉痙攣。
  - 小明比賽時失常，衝口而出咒罵起自己來。
  - 國中三年級學生腦中排除不掉的會考壓力。
  answer: null
  explanation: null
- question: 作者為什麼戴著紅領帶去參加喪禮？
  options:
  - 作者的媽媽生前最喜歡紅色。
  - 想學習母親樂觀面對死亡的態度。
  - 不想讓別人知道自己很難過。
  - 不懂人情故意穿著不適合的服裝。
  answer: null
  explanation: null
- question: 文中第七段作者說「我們下決心要跟媽媽看齊」，下列哪一個選項不是作者「跟媽媽看齊」的具體表現？
  options:
  - 臨終前圍著媽媽唱歌說好笑的事。
  - 媽媽過世，感謝上帝讓媽媽息了世界上的勞苦。
  - 追思會和告別式戴上紅領帶。
  - 悲傷不定時發作，哭到喘不過氣來。
  answer: null
  explanation: null
- question: 本文作者的寫作意圖為何？
  options:
  - 選擇好的服飾，可以帶來不一樣的心情。
  - 親情是無可取代的，死亡也不會阻斷親子之情。
  - 人不是被環境決定的，再壞的情況下，仍然可以決定如何面對。
  - 人生本來就是崎嶇不平、蜿蜒凶險，不必大驚小怪。
  answer: null
  explanation: null
- question: 黑色幽默指的是：「以自嘲的方式應付發生的壞事」，請問下列選項何者是所謂的「黑色幽默」？
  options:
  - 這次考了最後一名，哈哈，下一次就不會再退步了。
  - 我沒什麼優點，唯一的優點就是謙虛。
  - 他桌面太乾淨了，一定沒有創意。
  - 好的演講要像女人的裙子，愈短愈好。
  answer: null
  explanation: null
