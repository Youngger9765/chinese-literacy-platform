vocabulary:
- word: 如影隨形
  definition: 像影子一樣跟隨在後，比喻緊緊跟隨，不分離。
- word: 百般試煉
  definition: 各式各樣的考驗和鍛煉。百般，各式各樣的意思。
- word: 崎嶇
  definition: 高低不平，難走的山路。
- word: 追思
  definition: 回想、懷念。
- word: 蜿蜒凶險
  definition: 路途彎曲且危險。本文比喻人生遇到的波折困難。
- word: 逆轉
  definition: 優劣雙方的情勢互換。本文的逆轉指的是改變。
- word: 安寧照護
  definition: 對於無法痊癒的重症病人，提供減輕疼痛的照護。目的是幫助病人在比較不痛苦的情況下，度過人生最後時光。
- word: 黑色幽默
  definition: 用他人或自身的悲劇、疾病等負面素材，作為幽默的笑點。例如，將被槍斃的囚犯回頭問行刑者說：「你確定你的槍法夠準嗎？」
- word: 珍重
  definition: 珍惜。
vocabulary_count: 9
