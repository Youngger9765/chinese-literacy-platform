multiple_choice:
- question: 下底下哪一個情況，可以用「如影隨形」這個詞語來形容？
  options:
  - 月光下微風中搖曳的樹影。
  - 比賽時，突發的肌肉痙攣。
  - 小明比賽時失常，衝口而出咒罵起自己來。
  - 國中三年級學生腦中排除不掉的會考壓力。
  answer: D
  explanation: 「如影隨形」指的是像影子一樣緊緊跟隨在後，不分離。選項D描述的「會考壓力」是學生腦中排除不掉的，如同焦慮和壓力在人身邊無法擺脫一樣，符合課文中對該詞語「比喻緊緊跟隨，不分離」的解釋，也與練習題中「焦慮
- question: 作者為什麼戴著紅領帶去參加喪禮？
  options:
  - 作者的媽媽生前最喜歡紅色。
  - 想學習母親樂觀面對死亡的態度。
  - 不想讓別人知道自己很難過。
  - 不懂人情故意穿著不適合的服裝。
  answer: B
  explanation: 課文雖然沒有直接說明作者戴紅領帶參加喪禮的原因，但其核心思想在於作者的母親面對癌症病痛仍能樂觀積極，並鼓勵「正向思考」。因此，戴紅領帶可能象徵作者學習母親以樂觀、希望的態度面對死亡。
- question: 文中第七段作者說「我們下決心要跟媽媽看齊」，下列哪一個選項不是作者「跟媽媽看齊」的具體表現？
  options:
  - 臨終前圍著媽媽唱歌說好笑的事。
  - 媽媽過世，感謝上帝讓媽媽息了世界上的勞苦。
  - 追思會和告別式戴上紅領帶。
  - 悲傷不定時發作，哭到喘不過氣來。
  answer: D
  explanation: 作者的母親教導「我們可以決定如何面對它」以及「轉換觀點、正向思考」，避免「灰心喪志、逃避困難」。選項D「悲傷不定時發作，哭到喘不過氣來」描述的是被悲傷擊垮，未能積極轉換觀點或正向面對困難，與媽媽所展現
- question: 本文作者的寫作意圖為何？
  options:
  - 選擇好的服飾，可以帶來不一樣的心情。
  - 親情是無可取代的，死亡也不會阻斷親子之情。
  - 人不是被環境決定的，再壞的情況下，仍然可以決定如何面對。
  - 人生本來就是崎嶇不平、蜿蜒凶險，不必大驚小怪。
