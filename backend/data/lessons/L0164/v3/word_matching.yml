word_matching:
  label: 二、文白詞語比對
  instruction: 以下是原文與白話文的對照。請依照文意，寫出原文中灰底的白話文意思。
  items:
  - index: 1
    文言: 金谿民方仲永，世隸耕。
    白話: 金谿地方有一個人名叫方仲永，他們家(　)都以(　)為業。
    blanks:
    - answer: 世代
    - answer: 種田
  - index: 2
    文言: 仲永生五年，未嘗識書具，忽啼求之
    白話: 仲永長到(　)時，(　)見過寫字的紙、筆，有一天，他(　)求要紙、筆。
    blanks:
    - answer: 五歲
    - answer: 不曾
    - answer: 忽然哭著
    文言_note: 這一題的文言句末沒有句號，其餘五題都有。原稿如此。
  - index: 3
    文言: 父異焉，借旁近與之，即書詩四句，並自為其名。
    白話: 他的父親(　)這件事，就跟鄰居借來給他，他(　)寫了一首四句詩，並寫上自己的名字。
    blanks:
    - answer: 很訝異
    - answer: 立刻
  - index: 4
    文言: 自是指物作詩立就，其文理皆有可觀者。
    白話: 自從這件事後，指定任何事物叫他作詩，他都能(　)作出來，而且詩的(　)都很(　)。
    blanks:
    - answer: 立刻
    - answer: 文采和道理
    - answer: 值得欣賞
  - index: 5
    文言: 父利其然也，日扳仲永環謁於邑人，不使學。
    白話: 他的父親為了利益的緣故，天天拉著兒子四處(　)鄉人，沒有讓他(　)。
    blanks:
    - answer: 拜訪
    - answer: 學習
  - index: 6
    文言: 還自揚州，復到舅家，問焉。曰：「泯然眾人矣。」
    白話: 我(　)揚州(　)，又到舅舅家，問起他。舅舅說：「他的才能已經(　)，變得跟普通人一樣了。」
    blanks:
    - answer: 從
    - answer: 回來
    - answer: 消失
  notes:
    answer_carrier: 橘色（字元樣式），PDF p5~p6 可見
