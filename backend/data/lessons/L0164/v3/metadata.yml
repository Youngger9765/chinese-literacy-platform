strategy_note: '採學習單第四大題標題的印法（破折號是單一個「—」）。第一頁目標框印

  「文言聚光燈：一字多義：「聞」」，總表寫「認識文言文──一字多義：聞」（破折號兩個），

  三處三種寫法，各自照原樣。'
