series: 文言文
lesson_seq: 90090
intro: 這篇文章介紹了方仲永的故事。他從小展現出驚人的寫作才能，年僅五歲就能寫出有文采的詩句，並且能隨意指著東西作詩，讓許多人都感到驚奇。他的父親看見了仲永的才能，便常常帶著他去拜訪親友，藉此賺取錢財。然而，父親卻因此不再讓仲永繼續學習。作者在多年後再次見到仲永，發現他已經失去了往日的才華，變得和一般人沒有兩樣。這篇文章透過方仲永的經歷，探討了後天學習的重要性。
notes:
  strategy: '採學習單第四大題標題的印法（破折號是單一個「—」）。第一頁目標框印

    「文言聚光燈：一字多義：「聞」」，總表寫「認識文言文──一字多義：聞」（破折號兩個），

    三處三種寫法，各自照原樣。'
