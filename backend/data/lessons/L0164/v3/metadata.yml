strategy_explained: 這一課我們要練習的是「**理解文言文裡一個字可能有多種意思**」的能力，特別是「聞」這個字，這篇文章裡就用到了它的不同用法，藉由這個生動的神童故事，你可以更清楚看到，就算天賦再高，後天的學習也比什麼都重要，所以讀的時候，試著想想「聞」在這段文字裡，分別代表什麼意思，並且留意故事主角的際遇，還有作者想告訴你的道理是什麼
