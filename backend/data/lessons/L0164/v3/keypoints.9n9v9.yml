keypoints:
  label: 三、文章重點表
  layout: list
  intro: '本課課文寫一位神童，如何從天才跌為凡人的故事。

    這是一個「寫人」的文章，寫人物時，常出現的元素有「主角是誰」、「主角的背景」、「主角的發展（或變化）」、「結語」。

    以下讓我們一起根據「寫人」的文章結構，來整理文章重點吧！'
  instruction: 請依據課文內容，在【 】處填入原文，找不到原文時，再用自己的話寫
  instruction_note: 指示語句末沒有句號，原稿如此。
  columns:
  - 元素
  - 內容摘要
  answer_carrier: 橘色（字元樣式），PDF p6 可見
  rows:
  - label: 主角
    value: 【　】
    blanks:
    - answer: 方仲永
  - label: 背景
    items:
    - label: 居住地
      value: 居住地：【　】
      blanks:
      - answer: 金谿
    - label: 家世
      value: 家　世：【　】
      blanks:
      - answer: 世隸耕／世代種田
  - label: '發展或

      變化'
    items:
    - label: '天

        才

        時

        期'
      value: '【　】歲開始展現天才。

        1.不曾見過【　】，沒有人教，卻會寫詩，還能簽名。

        2.指定任何事物叫他作詩，都能立刻做出來。

        3.寫出來的詩有【　】也有【　】。

        4.他的父親帶他【　】鄉人作詩，沒有讓他學習。'
      blanks:
      - answer: 五
      - answer: 書具／寫字的紙筆
      - answer: 文（采）
      - answer: （道）理
      - answer: 環謁／四處拜訪
    - label: 變成凡人過程
      value: '1.【　】歲時，寫的詩已不如傳聞中的好。

        2.【　】歲，天資消失，變成普通人。'
      blanks:
      - answer: 十二、三
      - answer: 二十
  rows_note: '「發展或變化」是 vmerge 合併儲存格，底下橫跨「天才時期」「變成凡人過程」兩個子列；

    「天才時期」在原稿是一字一行直排。左欄「元素」在版面上跨兩格（span=2）。'
  tail_question:
    stem: 想一想，寫一寫：關於這篇課文的內容，你覺得是否合理？請打勾表示並說明理由。
    prompt: 我覺得□合理    □不合理，因為：（　）。
    answer_free_text: 不合理。他不可能沒看過紙筆，卻突然「要」紙筆；沒人教導，卻能寫詩和自己的名字
    answer_note: '原稿把參考答案印在括號裡：「(參考答案：不合理。他不可能沒看過紙筆，卻突然「要」紙筆；沒人教導，卻能寫詩和自己的名字 )」。

      兩個 □ 都沒有被勾（要學生自己選），只給了參考答案。'
