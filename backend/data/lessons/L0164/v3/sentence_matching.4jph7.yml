lesson_uid: L0164
version_id: v3
section_no: 一
sentence_matching:
  label: ㄧ、文白句子比對
  instruction: '請模仿例句作法：

    ❶閱讀參考句；❷找出參考句對應的原文；❸將對應的原文(  )起來

    ❹在下方的[  ]寫上參考句代號。'
  parts:
  - label: 第一題：
    example:
      文言: 金谿民方仲永
      answer: 3
    example_note: 例句在參考句清單上以「☞」標記（L0153 那課是刪除線＋「≫」）。
    reference_sentences:
      1: 從不曾見過寫字的紙、筆
      2: 仲永長到五歲時
      3: 金谿地方有一個人名叫方仲永
      4: 有一天，他忽然哭著求要紙、筆
      5: 他立刻寫了一首四句詩，並寫上自己的名字
      6: 他的父親很訝異這件事，就跟鄰居借來給他
      7: 他們家世代都以種田為業
    items:
    - 文言: 世隸耕
      answer: 7
    - 文言: 仲永生五年
      answer: 2
    - 文言: 未嘗識書具
      answer: 1
    - 文言: 忽啼求之
      answer: 4
    - 文言: 父異焉，借旁近與之
      answer: 6
    - 文言: 即書詩四句，並自為其名
      answer: 5
  - label: 第二題：
    reference_sentences:
      1: 自從這件事後，指定任何事物叫他作詩，他都能立刻作出來
      2: 還傳給全鄉的秀才觀看
      3: 有的人會用錢來求他作詩
      4: 鄉裡的人驚奇仲永的天才，漸漸地都以賓客之禮對待他父親
      5: 而且詩的文采和道理都很值得欣賞
      6: 這首詩是寫奉養父母、團結親族的意思
      7: 他的父親為了利益的緣故
      8: 天天拉著兒子四處拜訪鄉人，沒有讓他學習
    items:
    - 文言: 其詩以.養父母、收族為意
      answer: 6
    - 文言: 傳一鄉秀才觀之
      answer: 2
    - 文言: 自是指物作詩立就
      answer: 1
    - 文言: 其文理皆有可觀者
      answer: 5
    - 文言: 邑人奇之，稍稍賓客其父
      answer: 4
    - 文言: 或以錢幣乞之
      answer: 3
    - 文言: 父利其然也
      answer: 7
    - 文言: 日扳仲永.環謁於邑人，不使學
      answer: 8
  - label: 第三題：
    reference_sentences:
      1: 叫他作詩，寫的詩卻不如先前傳聞的那麼好
      2: 明道年間，我跟從父親回鄉
      3: 又到舅舅家，問起他
      4: 在舅舅家見過他，當時他大約十二、三歲
      5: 又過七年，我從揚州回來
      6: 舅舅說：「他的才能已經消失，變得跟普通人一樣了。」
      7: 我聽說他的事很久了
    items:
    - 文言: 予聞之也久
      answer: 7
    - 文言: 明道中，從先人還家
      answer: 2
    - 文言: 於舅家見之，十二三矣
      文言_source_text: 於舅家見之，十二三
      answer: 4
      文言_note: '這一句在版面上被答案列切開：段落印到「十二三」就換行，

        「矣）」接在 ［ 7 ］［ 2 ］［ 4 ］ 那一行之後才續印，

        所以整句在文字流裡**沒有連續出現過**。

        `文言` 記語意上的完整子句，`文言_source_text` 記文字流裡連續的那一段（供逐字門比對）。'
    - 文言: 令作詩，不能稱前時之聞
      answer: 1
    - 文言: 又七年，還自揚州
      answer: 5
    - 文言: 復到舅家，問焉
      answer: 3
    - 文言: 曰：「泯然2.眾人矣。」
      answer: 6
  notes:
    instruction: '⚠️ 本課的作法與 L0153 相反：L0153 是「先讀原文→找參考句」，本課是

      「先讀參考句→找原文→把原文括起來」，而且多了❸「將對應的原文(  )起來」這一步。'
    answer_carrier: 橘色代號（字元樣式），PDF p3~p4 可見；［　］印在對應原文子句的正下方
    structure: '⚠️ 本課的文白句子比對分成**三題**，每題各有自己的一份參考句清單（代號各自從 1 重編），

      與 L0153／L0161 的「單一份清單」不同，故用 parts 表達。'
    parts: '三題各自把自己那份參考句代號用滿一次（7／8／7 個），這是本節的內部一致性檢查。

      ⚠️ 本節的 `文言` 照**句子比對表格印的樣子**抄，因此保留該表殘留的斷詞點

      （其詩以**.**養父母、日扳仲永**.**環謁、泯然2**.**眾人矣）——那張表只留了一部分斷詞點，

      不是全部。L0161／L0153 的同欄位沒有斷詞點，是因為那兩課的表格本來就沒印。'
  slug: 4jph7
