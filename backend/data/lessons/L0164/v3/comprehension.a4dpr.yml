lesson_uid: L0164
version_id: v3
section_no: 五
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列選項「」中字，何者字音、字義完全正確？
    options:
      A: 予「聞」之也久——ㄨㄣˊ，聽說
      B: 「泯」然眾人矣——ㄇㄧㄣˊ，消失
      C: 日扳仲永環「謁」於邑人——ㄐㄧㄝˊ，拜訪
      D: 不能「稱」前時之聞——ㄔㄥˋ，稱讚
    teacher_hint: '第1題解析：

      B字音ㄇ一ㄣˇ；

      C字音一ㄝˋ；

      D字義「符合」。'
    teacher_hint_note: '解析裡的注音**混用了漢字「一」與注音符號「ㄧ」**（B 寫「ㄇ一ㄣˇ」、C 寫「一ㄝˋ」，

      用的是漢字一 U+4E00），而選項本身用的是注音ㄧ。照原樣記錄。'
  - index: 2
    answer: C
    stem: 根據本文，哪些地方可以看出方仲永的天才？
    passage: 甲.即書詩四句，並自為其名； 乙.稍稍賓客其父，或以錢幣乞之；丙.指物作詩立就，其文理皆有可觀者； 丁.日扳仲永環謁於邑人，不使學？
    options:
      A: 甲丁
      B: 乙丙
      C: 甲丙
      D: 乙丁
    passage_note: 四個選項（甲乙丙丁）印在題幹下方自成一段，末尾是問號，原稿如此。
  - index: 3
    answer: D
    stem: 下列哪一選項中「聞」字，意思是「聽說、聽到」？
    options:
      A: 默默無聞
      B: 事母以孝聞
      C: 天下奇聞
      D: 聞風喪膽
    teacher_hint: '第3解析：

      A.平凡、沒有名氣；

      B.侍奉母親以孝順著名；

      C.天下稀奇、怪異的事情；

      D聽一點風聲就嚇破膽，形容極度恐懼。'
    teacher_hint_note: 標題寫「第3解析：」（少了「題」字），與第 1 題的「第1題解析：」不一致。原稿如此。
  - index: 4
    answer: C
    stem: 下列何者是本文主旨？
    options:
      A: 勝利不驕傲，失敗也不氣餒
      B: 知足是天然的財富，奢侈是人為的貧窮
      C: 天賦如同自然花木，要用學習來修剪
      D: 一枝草，一點露，天無絕人之路
  - index: 5
    answer: D
    stem: 下列何者是方仲永從天才跌為凡人的主要原因？
    options:
      A: 生五年，未嘗識書具，忽啼求之
      B: 指物作詩立就，其文理皆有可觀者
      C: 邑人奇之，稍稍賓客其父，或以錢幣乞之
      D: 父利其然，日扳仲永環謁於邑人，不使學
    options_note: D 選項寫「父利其然」，原文是「父利其然**也**」（少一個「也」）。屬引文與原文的落差，照原樣未改。
