spotlight:
  lesson: G5-L12
  strategy_name: 推論策略-找出觀點和支持理由
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: single
    prompt: 一、確認觀點：本篇文章的主要觀點是下列何者？（單選）
    options:
    - 進入高苑工商是周思齊第一次感覺到委屈與不甘心
    - 周思齊曾經不被教練和學長看好，被直言沒有天賦
    - 真正厲害的人是願意承認自己的不足，然後一步一步追上去
    - 周思齊帶著熱愛棒球的心加入了職棒，卻面臨了前所未有的威脅和考驗
    answer: 進入高苑工商是周思齊第一次感覺到委屈與不甘心
  - type: single
    prompt: 二、找出觀點中的重點：上面的觀點包含哪兩個重點？（複選）
    options:
    - 他受到的肯定
    - 他的天賦
    - 他一步步努力
    - 他的委屈和不甘心
    - 他承認自己不足
    - ⑥他熱愛棒球的心
    - □⑦所面臨的威脅考驗
    answer: □⑦所面臨的威脅考驗
  - type: guide
    text: 三、觀點找支持理由：根據上題分析，下列哪些事件或細節可以支持文章觀點中的兩個重點？（可複選）
  - type: multi
    prompt: 1.支持觀點重點：「願意承認自己不足」：
    options:
    - 周思齊和光復國小的隊友們打出好成績，拿下全國第二名
    - 周思齊因好友被教練力邀，而一起加入了棒球強隊
    - 周思齊說：「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」
    answer:
    - 周思齊和光復國小的隊友們打出好成績，拿下全國第二名
    - 周思齊因好友被教練力邀，而一起加入了棒球強隊
    - 周思齊說：「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」
  - type: multi
    prompt: 2.支持觀點重點：「一步步追上去」：
    options:
    - 為了彌補體能，周思齊開始不搭校車，改用跑步當體能訓練
    - 為了增進技巧，周思齊回到宿舍後也繼續練習揮棒。
    - 為了增進技巧，宿舍晚上熄燈後周思齊會繼續到頂樓練習。
    answer:
    - 為了彌補體能，周思齊開始不搭校車，改用跑步當體能訓練
    - 為了增進技巧，周思齊回到宿舍後也繼續練習揮棒。
    - 為了增進技巧，宿舍晚上熄燈後周思齊會繼續到頂樓練習。
  - type: guide
    text: 四、延伸練習：根據下列觀點，找出適當的支持理由。
  - type: free_text
    prompt: 1.觀點：逆境使人成長。
  - type: guide
    text: 支持理由：
  - type: multi
    prompt: 請選擇
    options:
    - 只有在大風大浪裡，才能看出船長的航行技術。
    - 他靠著助聽器，彌補天生的聽覺障礙。
    - 因為家裡窮，他比同輩更早開始了解理財知識。
    answer:
    - 只有在大風大浪裡，才能看出船長的航行技術。
    - 他靠著助聽器，彌補天生的聽覺障礙。
    - 因為家裡窮，他比同輩更早開始了解理財知識。
  - type: free_text
    prompt: 2.觀點：失去後才懂得珍惜。
  - type: guide
    text: 支持理由：
  - type: multi
    prompt: 請選擇
    options:
    - 爺爺過世後，小明的家中再也沒有過年圍爐的笑聲。
    - 阿芳珍惜畢業前能和同學相處的時光，規劃了許多活動。
    - 附近的早餐店關門後，大華才發現這間店的口味無可替代。
    answer:
    - 爺爺過世後，小明的家中再也沒有過年圍爐的笑聲。
    - 阿芳珍惜畢業前能和同學相處的時光，規劃了許多活動。
    - 附近的早餐店關門後，大華才發現這間店的口味無可替代。
  - type: guide
    text: (B)「鴻溝」代表差距很大(C)宜用「放鬆」(D)宜用「自私自利」(B)「鴻溝」代表差距很大(C)宜用「放鬆」(D)宜用「自私自利」請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出觀點包含的不同重點。
    - 我能為每個重點找到適合的支持理由。
    - 我能排除不能支持觀點的內容。
