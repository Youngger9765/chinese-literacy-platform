passage: '不過，周思齊被肯定的從來不是他的天賦，而是努力。他在三軍時，曾有教練對他說：「你就不要再打了，回家種田去吧！」更曾經被學長直言：「你不是天才。」看著一軍隊友的表現，周思齊也不得不低頭承認這鴻溝般的實力差距。他說，在不服輸前要先懂得認輸，「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」於是，他開始不搭校車，改用跑步當體能訓練，回到宿舍後也不懈怠，而是繼續練習揮棒。晚上熄燈後，他會和隊友帶著棉被到頂樓繼續練習，累了就直接睡在頂樓。

  日復一日，他以身邊的強者激勵自己，堅持「簡單的事情重複做」，就算傳接球到手破皮，他也纏上繃帶繼續練習。到了高二暑假，周思齊終於如願晉升一軍。他說：「在一流的球隊裡，作為一個三流角色的我，得像一個吸水的海綿，在努力吸飽養分的同時，又要有辦法把不好的情緒給擠掉。唯有這樣，我才能獲得成長的力量。」'
start_text: 不過，周思齊被肯定的從來不是他的天賦，而是努力。
