_總表_對照note: '總表列 13 個語詞，學習單語詞框與第三大題都是 12 個。第 13 個「千安百轟百盜」在學習單上

  不是編號語詞，而是第三大題末尾的星號註解（*千安、百轟、百盜：指打出一千支安打…）。

  差異在總表把註解也當成一個語詞欄位，學習單本身前後一致。'
_總表_標題對照note: 學習單第一頁標「找出觀點**和**支持理由」，第六大題副標與總表都是「找出觀點**與**支持理由」（和／與不一致，兩者皆通，非錯字）。
