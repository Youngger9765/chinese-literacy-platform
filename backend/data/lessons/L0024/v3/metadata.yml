    不是編號語詞，而是第三大題末尾的星號註解（*千安、百轟、百盜：指打出一千支安打…）。

    差異在總表把註解也當成一個語詞欄位，學習單本身前後一致。'
  總表_標題對照: 學習單第一頁標「找出觀點**和**支持理由」，第六大題副標與總表都是「找出觀點**與**支持理由」（和／與不一致，兩者皆通，非錯字）。
strategy_explained: '這一課我們要練習的是「找證據說話」，也就是從文章裡找出讓周思齊堅持下去的「理由」

  為什麼要練這個呢，因為這篇故事裡的周思齊，在遇到困難時，就常常從自己的訓練和對棒球的熱愛中找到力量，我們讀的時候，就可以試著想想，他心裡到底做了什麼，才會那麼努力不放棄呢

  讀的時候，你可以多留意一下，文章裡提到他怎麼訓練、怎麼想的，這些地方就是在告訴你他堅持的秘密喔'
