  passage: 阿澤輕輕點頭，看著腳下紅土的痕跡又深又亂，就像他現在的心情，可是他也知道，如果再繼續一意孤行，這個打者可能就要被保送了。這一次，阿澤接受阿凱的暗號，球投出去，往低角度鑽進好球帶，打者揮棒，打成一顆速度不快的滾地球，二壘手穩穩接起來傳向一壘。「出局！」這一局終於結束。走回休息區，教練在阿澤身旁坐下，阿澤低著頭說：「我只是想自己解決。」教練只說：「可是你剛剛反而丟掉了自己最厲害的武器。」阿澤沉默了。「棒球不是只有投手一個人在打。投手只是站在最前面的人，不是孤軍奮戰的人。但你如果不相信守備，就等於不相信自己的投球方式。他漏接了，的確是他的失誤，但不代表你就要獨自承擔所有責任。」教練起身離開，小宇走了過來說：「剛剛那球，對不起。」他看著自己的手套，「那顆球我等太久，沒有往前接。下次球再往我這邊來，我會主動往前一步。」阿澤看見小宇手套邊還留著撲球時沾上的紅土。原來小宇也一直記得那一球。阿澤本來想說些什麼，最後只是點了點頭。攻守交換後，輪到小宇走進打擊區，三壘有人，一人出局。他等了兩球，第三球揮出去，球往一壘方向滾去。阿澤看著小宇從打擊區衝出來，奮不顧身往一壘跑，一點都沒有減速，像是非得搶到那個壘包不可。可是還是比球慢了一步，「出局！」但此時，三壘跑者已踩回本壘，比分追平了。小宇只是喘著氣，站起來拍掉身上的土，阿澤看著他，心想：小宇只是剛剛失誤了，其實他跟我一樣在乎。下一局，阿澤再度站上投手丘。阿凱比出低球暗號，阿澤點了點頭。球投出去，「鏘！」又是游擊方向的滾地球。阿澤的心揪了一下，可是這一次，他往前跨了一步，準備補位。那一刻，他還不知道小宇會不會接住，可是他選擇相信，並回到了自己的位置。同一時間，小宇果斷趨前迎球，俐落的將球收進手套，傳向一壘。「出局！」阿澤轉回本壘，看見阿凱再次比出暗號。這一次，他沒有抗拒，他想再次相信，相信他身後的隊友。他知道自己該怎麼投。
