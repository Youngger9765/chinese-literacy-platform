  passage: 阿澤輕輕點頭，看著腳下紅土的痕跡又深又亂，就像他現在的心情，可是他也知道，如果再繼續一意孤行，這個打者可能就要被保送了。這一次，阿澤接受阿凱的暗號，球投出去，往低角度鑽進好球帶，打者揮棒，打成一顆速度不快的滾地球，二壘手穩穩接起來傳向一壘。「出局！」這一局終於結束。
