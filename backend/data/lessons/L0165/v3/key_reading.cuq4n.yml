  instruction: 請用計時器，從指定段落（五    ）開始朗讀，在表格中記錄1分鐘朗讀的字數。如果計時3次後，你還不滿意，可以多練幾次。最後一次，找一位同學，請他計時、記錄並簽名！
  instruction_note: 原文括號內只有「五」加空白 —— ☞ 是圖形（PDF p2 可見），不在文字流裡。
