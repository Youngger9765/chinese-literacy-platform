strategy: 品格力──成為值得信任的夥伴
課文作者: 張筱晴
學習單: 張筱晴
lesson_no: 11
series: 體育生
lesson_seq: 91110
intro: 這篇文章探討在團隊合作中，我們常遇到的各種角色與心態。作者以大隊接力為例，說明過度的擔心與不信任，反而容易導致失誤，而真正的向前衝刺，是建立在對隊友的信任之上。文章接著引用
  2024 年世界棒球 12 強賽台灣隊的例子，展現即使外界不看好，隊長陳傑憲仍選擇相信隊友，最終贏得勝利。然而，作者也指出，信任並非盲目，而是需要透過清晰的溝通、承諾的實踐，以及失誤後的負責與修正，逐步累積而成。這篇文章引導我們思考，如何成為值得信任的人，以及如何建立更成熟、更具建設性的信任關係。
