lesson_uid: L0166
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列選項中「  」的語詞，何者使用正確？
    options:
      A: 這項活動由全班共同分工，大家「一手包辦」完成
      B: 我願意貢獻「一己之力」，協助完成這場演出
      C: 牆上的油漆剝落後，牆壁顏色變得更加「出色」
      D: 警方用尺「釐清」嫌疑人的身高是一百七十公分
    teacher_hint: '(A)「一手包辦」是指獨立完成

      (C)宜用「褪色」、「失色」

      (D)宜用「測量」'
    teacher_hint_note: 這則藍框印在第七大題標題旁（PDF p10 右上），不在題目旁邊。
  - index: 2
    answer: D
    stem: 根據第六段，「信任不是只有兩種選擇」，作者否定的是哪兩種極端想法？
    options:
      A: 相信有能力的人，或相信有責任感的人
      B: 相信過去的表現，或相信未來的承諾
      C: 相信隊友的態度，或相信隊友的能力
      D: 完全把事情交出去，或全部拿回來自己做
    teacher_hint: 原文：與其冒險相信別人，不如全部自己來。
  - index: 3
    answer: B
    stem: 作者先以大隊接力說明信任，再舉世界12強棒球賽的例子，這樣安排有什麼作用？
    options:
      A: 比較接力與棒球哪一種運動更需要團隊合作
      B: 先用熟悉經驗解釋概念，再用真實事件加以印證
      C: 先說明信任容易失敗，再證明競賽結果全靠運氣
      D: 比較學生參加比賽與職業球員參賽時的心理差異
  - index: 4
    answer: C
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 團隊要獲得成功，應由最出色的人負責關鍵工作
      B: 團隊成員應彼此鼓勵，不要指出夥伴所犯的錯誤
      C: 成熟的信任來自清楚分工、履行承諾與共同補救
      D: 只要經過充分練習，團隊成員就不會再發生失誤
  - index: 5
    answer: A
    stem: 小安負責準備比賽器材，卻發現自己可能無法在期限前完成。他擔心說出來會被責怪。根據本文，哪一種處理方式最成熟？
    options:
      A: 提早說明目前進度、困難，以及接下來的處理方式
      B: 要求隊友先保證不責怪他，再決定是否告知狀況
      C: 繼續獨自處理，等確定無法完成時再說明原因
      D: 先把工作交給別人，以免自己的失誤影響團隊
    teacher_hint: 修復信任的關鍵：說清楚、主動回報、負責補救。
  notes:
    answer_carrier: 橘色代號，PDF p10 可見
    teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1、2、5 題有
