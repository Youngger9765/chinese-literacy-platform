lesson_uid: L0166
version_id: v3
section_no: 五
keypoints:
  title: 因為相信，所以能向前
  layout: matrix
  intro: 本篇文章先連結團隊合作經驗，再以大隊接力和世界棒球12強賽舉例，最後回應人們對信任的質疑。請根據文章結構整理重點。
  columns:
  - 結構
  - 段落
  - 內容
  answer_carrier: 紅色 ☑（w:sym，本表 3 個＝全課僅有的 3 個）＋橘色填空
  rows:
  - 結構: 經驗連結
    段落: '1'
    內容: '團隊分工中，常出現的三種角色：(可複選)

      ①習慣一個人扛起所有事情

      ②不放心交給夥伴，總是擔心出錯

      ③很希望被相信，卻得不到信任

      □④積極配合組員，努力貢獻能力'
    內容_options:
      1: 習慣一個人扛起所有事情
      2: 不放心交給夥伴，總是擔心出錯
      3: 很希望被相信，卻得不到信任
      4: 積極配合組員，努力貢獻能力
    內容_answers:
    - 1
    - 2
    - 3
    內容_note: '全課僅有的 3 個 ☑ 都在這一格。**未被勾的④保留字面「□」，被勾的①②③沒有字元** ——

      ☑ 是 `w:sym` 沒有 w:t，文字流裡只剩 □。'
  - 結構: 舉例說明
    段落: 2-5
    內容: '舉例一：【　】比賽

      接棒時能相信隊友，不用一直【　】

      舉例二：世界 12 強【　】賽

      隊長陳傑憲相信他的【　】，團隊互相合作，拿下了比賽的【　】'
    內容_blanks:
    - answer: 大隊接力
    - answer: 回頭
    - answer: 棒球
    - answer: 隊友
    - answer: 冠軍
  - 結構: '提出與

      回應質疑'
    段落: 6-7
    內容: '1.大家常見的質疑：有的人不值得【　】；有的人不被相信。

      2.回應質疑：不是只能在「冒險相信」或是「全部自己來」之間二選一，可以練習把任務內容、【　】和【　】說清楚。'
    內容_blanks:
    - answer: 信任
    - answer: 完成標準
    - answer: 下一步行動
  - 結構: 統整結論
    段落: '8'
    內容: '1.成為值得信任的人：答應的事要做到；失誤後願意承擔責任並【　】。

      2.給予夥伴成熟的信任：不要求對方永遠完美，而是看見他願意【　】，並一起補救。'
    內容_blanks:
    - answer: 修正補救
    - answer: 負責的行動
  rows_note: 「段落」欄是印好的段號範圍，不是空格。
