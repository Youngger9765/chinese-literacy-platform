  passage: 後來，台灣隊在冠軍戰以 4 比 0 擊敗日本，陳傑憲也在冠軍戰擊出三分全壘打，並獲選該屆世界 12 強最有價值球員（MVP）。可是，如果只記得最後那支全壘打，就太可惜了。因為一場比賽的勝利，從來不可能只憑一己之力完成。有人要設法上壘，有人要推進跑者，有人要穩固守備，有人要投球，有人要在休息區裡提醒、鼓勵、觀察。奪冠之後，陳傑憲說的第一句話不是自己的表現，而是：「謝謝團隊讓世界看見台灣。」他的表現十分出色，可是他更記得，這不是一個人的勝利。不過，讀到這裡，也許有人會質疑：「相信隊友聽起來很好，但有些人就不值得信任啊！」也可能有人會想：「不是我不想做好，是大家一開始就不相信我。」這樣的想法並不奇怪。因為在真實的合作裡，我們確實可能遇到讓人不放心的隊友。有人答應了卻沒做到，有人常常拖到最後一刻，有人一遇到困難就不見蹤影，也有人不是不想做，而是真的還不會。這些經驗容易使人心生懷疑：與其冒險相信別人，不如全部自己來。可是，信任不是只有兩種選擇。更成熟的信任，是先釐清：我究竟對什麼感到不放心？再把任務內容、完成標準和下一步行動說清楚，進行中主動回報進度，遇到困難提早說明；把答應的事完成，也讓夥伴知道你做到了。信任不只是一種感覺，它是由每一次「我答應的事，我做到了」慢慢累積起來的。所以，成為值得信任的人，不代表永遠不會失誤，而是失誤後願意繼續承擔責任、修正補救。一份成熟的相信，也不是期待對方永遠完美，而是當對方失誤時，仍願意看見他負責的行動，並和他一起把事情做好，完成任務。
