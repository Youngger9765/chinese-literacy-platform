vocabulary:
- word: 血脈賁張
  definition: 形容情緒非常激動、緊張。
- word: 擊垮
  definition: 心志被打敗了。
- word: 事與願違
  definition: 事情的發展和願望相反、相違背。
- word: 孤寂感
  definition: 孤單寂寞的感覺。
- word: 天壤之別
  definition: 比喻差別極大。
- word: 沮喪
  definition: 情緒難過、非常灰心。
- word: 迎刃而解
  definition: 比喻事情很容易處理。
- word: 經年累月
  definition: 形容時間長久。
- word: 轉瞬即逝
  definition: 在很短的時間就消失。
- word: 睽違
  definition: 分離、分開。
