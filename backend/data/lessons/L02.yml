story_text: '十秒鐘你能做什麼？裝一杯水、哼一段小曲、等待手機略過廣告？這十秒可能還不夠呢。這轉瞬即逝的十秒，對於百尺短跑的選手來說足已決定了一場令人血脈賁張、緊張刺激的勝負。

  在眾人期待的目光下，「臺灣最速男」——楊俊瀚，在2017年夏季世界大學運動會田徑男子一百公尺決賽，以10.22秒獲得第一名，替中華臺北拿下睽違二十六年的世大運田徑金牌。

  2018年雅加達亞運上，他以千分之二秒的差距與金牌擦身而過，些微秒數的差距帶來天壤之別的結果，讓好不容易站上的國際舞台的他心有不甘，他告訴自己：「那代表我還不夠努力，今天我輸千分位，那是上天給我的結果。」他更下定決心要超越現在的自己。

  但事與願違，在2019年，楊俊瀚的體育生涯反而走到了谷底。他在拿坡里世大運比賽時受傷，開始了漫長的復健。運動員一旦受傷，不只要花時間復健、無法訓練和出賽，心裡更負擔著損失積分、與自我懷疑的種種壓力。

  然而，壓力並沒有擊垮他，他跟著物理治療師安排的復健課表，一步一腳印的復健，終於熬過了這段恢復期，突破困境，在2021年重新回到賽場。他最終順利拿下東京奧運參賽資格，一圓當時沒能跑進里約奧運的夢想，同時也是二十五年來再度登上奧運一百公尺短跑項目的臺灣選手。

  短跑競賽是一項孤獨的運動，「十秒間的每個擺手、衝刺，都是經年累󠇡月的訓練與堅持。」很多時候必須自己獨自承受訓練受傷帶來的壓力、沮喪󠇡和孤寂感。不過楊俊瀚認為無論如何都要學會擁抱恐懼，深刻了解自己所害怕的事物，堅持到底進而戰勝它。即便是在低潮、逆境時，試著與自己對話從中尋找答案，現在所遇到的挫折都將成為後續起跑能量，人生路上的問題，相信也將可以迎刃而解。'
paragraphs:
- 十秒鐘你能做什麼？裝一杯水、哼一段小曲、等待手機略過廣告？這十秒可能還不夠呢。這轉瞬即逝的十秒，對於百尺短跑的選手來說足已決定了一場令人血脈賁張、緊張刺激的勝負。
- 在眾人期待的目光下，「臺灣最速男」——楊俊瀚，在2017年夏季世界大學運動會田徑男子一百公尺決賽，以10.22秒獲得第一名，替中華臺北拿下睽違二十六年的世大運田徑金牌。
- 2018年雅加達亞運上，他以千分之二秒的差距與金牌擦身而過，些微秒數的差距帶來天壤之別的結果，讓好不容易站上的國際舞台的他心有不甘，他告訴自己：「那代表我還不夠努力，今天我輸千分位，那是上天給我的結果。」他更下定決心要超越現在的自己。
- 但事與願違，在2019年，楊俊瀚的體育生涯反而走到了谷底。他在拿坡里世大運比賽時受傷，開始了漫長的復健。運動員一旦受傷，不只要花時間復健、無法訓練和出賽，心裡更負擔著損失積分、與自我懷疑的種種壓力。
- 然而，壓力並沒有擊垮他，他跟著物理治療師安排的復健課表，一步一腳印的復健，終於熬過了這段恢復期，突破困境，在2021年重新回到賽場。他最終順利拿下東京奧運參賽資格，一圓當時沒能跑進里約奧運的夢想，同時也是二十五年來再度登上奧運一百公尺短跑項目的臺灣選手。
- 短跑競賽是一項孤獨的運動，「十秒間的每個擺手、衝刺，都是經年累󠇡月的訓練與堅持。」很多時候必須自己獨自承受訓練受傷帶來的壓力、沮喪󠇡和孤寂感。不過楊俊瀚認為無論如何都要學會擁抱恐懼，深刻了解自己所害怕的事物，堅持到底進而戰勝它。即便是在低潮、逆境時，試著與自己對話從中尋找答案，現在所遇到的挫折都將成為後續起跑能量，人生路上的問題，相信也將可以迎刃而解。
