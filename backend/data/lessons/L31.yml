multiple_choice:
- question: 請問哪一個句子使用語詞有誤?
  options:
  - 我迫不及待要在這場比賽「大顯身手」，展現平時訓練成果。
  - 即使未來的路充滿「荊棘」，我們也要努力克服，繼續前行。
  - 為了幫助災民，公益協會呼籲各界踴躍捐款，「多多益善」。
  - 為了紀念蔣渭水的貢獻，政府設置了蔣渭水「里程碑」。
  answer: D
  explanation: 選項D中的「里程碑」是指在歷史發展過程中的重大事件或標誌性成就，通常用來比喻抽象的意義。然而，句子中「政府設置了蔣渭水里程碑」表達的是設置一個實體來紀念人物，應使用「紀念碑」或類似的詞語，而非「里程碑
- question: 根據文章，1900年第二屆的巴黎運動會為什麼會開放女性參賽?
  options:
  - 奧運之父古柏坦改變心意。
  - 因為女性的地位提升許多。
  - 因性別、人權意識的抬頭。
  - 為了熱鬧有趣，讓更多人參與。
  answer: C
  explanation: 雖然提供的課文內容並未直接提及1900年巴黎奧運開放女性參賽的具體原因，但從本課標題「奧運性別平等這條路」可推斷，課文主要探討奧運會中性別平等的發展歷程與原因。在歷史進程中，性別及人權意識的抬頭是推動
- question: 根據本文，請問下列選項何者錯誤?
  options:
  - 參與奧運的女性運動員比率逐屆上升。
  - 古代的女性都沒有參加奧運比賽的能力。
  - 運動中的性別文化，仍有待提升。
  - 2024巴黎奧運男女選手參與率為1:1。
  answer: B
  explanation: 選項B指出「古代的女性都沒有參加奧運比賽的能力」，但女性在古代奧運中被禁止參賽，並非因為缺乏能力，而是受到社會、文化和宗教等因素的限制。性別平等的議題強調的是消除障礙，給予平等的參賽機會，而非質疑女性
- question: 雖然本文提到巴黎奧運創下「性別平衡的全新里程碑」，但第九段提到：「性別平等這條路仍是充滿荊棘。」似乎有所衝突。請問為什麼作者會這樣寫？
  options:
  - 作者認為在追求性別平等的路上，仍有努力空間。
  - 作者認為巴黎奧運的男女人數平等只是假平等。
  - 作者希望未來奧運比賽女子運動員人數應超過男子。
  - 作者希望奧運會成為實現與檢視性別平等的最大舞台。
  answer: A
  explanation: 作者肯定了巴黎奧運在性別平等上達成的重大進展（里程碑），但同時也指出，全面實現性別平等仍面臨挑戰與困難（荊棘），因此仍有努力的空間。
- question: 下列措施，何者有助於性別平等的落實？
  options:
  - 作為一個運動員，外表與實力缺一不可。
  - 沙灘排球女性應穿著比基尼，以減少阻力。
  - 國際奧會應該提升決策系統的女性占比。
  - 女性在月經期間應避免運動，以免受傷。
  answer: D
  explanation: 無此說法
