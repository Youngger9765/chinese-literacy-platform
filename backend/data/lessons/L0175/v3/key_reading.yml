  passage: 第一種──固定型思維：覺得聰明是天生的，「我沒有數學細胞」、「不行就是不行」。看到別人強，心裡會酸酸的，覺得自己被打敗了。被打了紅叉叉時，只想趕快把它藏起來，因為那代表「我很笨」。第二種──成長型思維：覺得大腦像肌肉，越練會越強壯。看到別人厲害的表現，會想：「他是怎麼辦到的？我也想學！」失敗時，雖然會懊惱，但也會想：「原來這部分還可以再加強！我想再試一次！」一個人的思維模式究竟是固定型還是成長型？答案經常隨著他所面對的任務而有所不同。固定型思維的目標是遠離挑戰、確保安全，就像是大腦進入了「省電模式」，它會告訴你「你不是這塊料，不行就算了」。成長型思維則像大腦在「重訓」，雖然會痠痛，但它也同時在變強。換句話說，如果我們期待看見成長、突破失敗，就需要「成長型思維」來助攻。棒球是高失敗率的運動，即使是職業球員，十個打數敲出三支安打就會被視為優秀的打者，換句話說，棒球選手打擊時，失敗的機會甚至超過七成。外號「亞洲選球王」、職棒生涯長達二十年的周思齊，面對失敗，儘管也會失落、懊惱，但他有自己的一套人生哲學。他會為自己設定情緒的停損點，並告訴自己：失敗不是終點，而是另一次成功的起點；只要能從失敗中修正、調整，就能更靠近成功。微笑左投陳冠宇堪稱是成長型思維的典範，每當他投球表現失常、比賽失分，他相信每次的失敗都有意義，不會因此否定自己的價值，而是把失敗視為檢視自己投球技術與策略的良機——是配球被抓到？還是投球動作被掌握了？他總是積極的跟教練、隊友討論，把每次的挫折轉化成進步的養分。從他們的故事可以看見，成長型思維的關鍵或許在於：相信努力會帶來改變，並將失敗當作心態上的重量訓練，而非用來否定自己的紅叉叉；當作修正方向的羅盤，而不是邁向成功的阻礙。當然，任何技能的養成，都需要長時間的刻意練習，要改變長久以來的固定型思維、換上新的成長型思維，真的很難一步到位，在那之前，也許可以先學學冬奧花式滑冰金牌的劉美賢，她說：「我愛痛苦難熬的時刻！（I love struggling.）」，而當我們面對失敗，也可以對自己喊一聲：「我愛挑戰！失敗對我有好處！」不只在成功時為自己歡呼，更要慶賀每次的失敗！
