intro: 這篇文章探討了「固定型思維」和「成長型思維」兩種不同的思考模式。作者透過籃球場上同學面對失敗的兩種不同反應，引導讀者思考自己遇到困難時的內在聲音。文章解釋了固定型思維認為能力是天生的，而成長型思維則相信努力可以帶來進步。接著，文章以職棒選手周思齊和陳冠宇為例，說明成長型思維如何幫助人們從失敗中學習並持續進步。最後，文章鼓勵讀者培養成長型思維，將挑戰和失敗視為成長的機會。
notes:
