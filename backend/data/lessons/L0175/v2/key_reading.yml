passage: '第一種──固定型思維：覺得聰明是天生的，「我沒有數學細胞」、「不行就是不行」。看到別人強，心裡會酸酸的，覺得自己被打敗了。被打了紅叉叉時，只想趕快把它藏起來，因為那代表「我很笨」。第二種──成長型思維：覺得大腦像肌肉，越練會越強壯。看到別人厲害的表現，會想：「他是怎麼辦到的？我也想學！」失敗時，雖然會懊惱，但也會想：「原來這部分還可以再加強！我想再試一次！」

  一個人的思維模式究竟是固定型還是成長型？答案經常隨著他所面對的任務而有所不同。固定型思維的目標是遠離挑戰、確保安全，就像是大腦進入了「省電模式」，它會告訴你「你不是這塊料，不行就算了」。成長型思維則像大腦在「重訓」，雖然會痠痛，但它也同時在變強。換句話說，如果我們期待看見成長、突破失敗，就需要「成長型思維」來助攻。'
