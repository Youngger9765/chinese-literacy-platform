spotlight:
  lesson: 體-L9
  strategy_name: 品格力-成長型思維
  strategy_type: sel_character
  blocks:
  - type: table
    rows:
    - - 比較項目
      - 成長型思維
      - 固定型思維
    - - 基本想法
      - 能力可以透過練習進步。
      - 能力是天生的，很難改變。
    - - 面對挑戰
      - 困難代表我有機會練習。
      - 困難代表我做不到、不適合。
    - - 面對失敗
      - 失敗提醒我哪裡需要調整。
      - 失敗讓我丟臉，想藏起來。
    - - 看到別人成功
      - 想知道他用了什麼方法。
      - 覺得自己被比下去了。
    - - 內心對話
      - 「我想再試一次！」
      - 「我就知道我不行。」
  - type: guide
    text: ◎練習一：請閱讀下列情境中的「腦中想法」，完成兩件事：
  - type: guide
    text: 判斷這句話比較像「固定型思維」還是「成長型思維」。
  - type: guide
    text: 想一想：如果我相信這句話，我接下來比較可能會怎麼做？
  - type: table
    rows:
    - - 情境與腦中想法
      - 思維類型
      - "如果我相信這句話， \n我可能會……"
    - - '1'
      - 數學題寫錯，我想：「我數學就不好。」
      - 'A.固定型　

        □B.成長型'
      - 'ㄅ.放棄練習　

        □ㄆ.找出錯在哪一步'
    - - '2'
      - 英文太難，我想：「反正我再努力也不會更好。」
      - A.固定型□B.成長型
      - 'ㄅ.停止思考　

        □ㄆ.換一個方法再試'
    - - '3'
      - 看到同學很快解出題目，我想：「他是怎麼做到的？我可以學他的第一步。」
      - '□A.固定型

        B.成長型'
      - '□ㄅ.覺得自己輸了　

        ㄆ.問他第一步怎麼想'
    - - '4'
      - 比賽失分後，我想：「可能是策略被對方抓到了，我可以和隊友討論。」
      - '□A.固定型　

        B.成長型'
      - 'ㄅ.找人討論策略　

        □ㄆ.覺得自己不適合打球'
    - - '5'
      - 考差之後，我想：「我就知道我不行，以後不要再碰這種題目了。」
      - 'A.固定型　

        □B.成長型'
      - 'ㄅ.避開類似題目　

        □ㄆ.找出自己卡在哪裡'
  - type: guide
    text: →你觀察到了嗎？固定型思維通常讓我們停下來、躲起來；成長型思維通常讓我們調整、求助、再試一次。而怎麼看待思考會影響我們的下一步。
  - type: guide
    text: '◎練習二：加入「Not yet」精神──

      成長型思維中，面對挑戰，會把「我不會」變成「我還不會」；把「我做不到」變成「我還沒找到方法」。每個人都會有固定型的想法，而當這樣的想法出現時，我們可以先看見它、理解它，試著加入「Not
      yet」精神，幫助自己找出下一步。'
  - type: table
    rows:
    - - 問題
      - 我的回答（沒有標準答案，每個人都不一樣哦）
    - - 我最常出現的固定型思維句子
      - "□①「我辦不到」        □②「這太難了」         \n□③「這我不擅長」      □④「我就是不會」\n□⑤「我不可能像他一樣」\n\
        □⑥其他：____________________________________"
    - - 這個句子可能想保護我不要經歷什麼？
      - "□①不要丟臉　          □②不要再次失敗　      \n□③不要被別人笑　      □④不要努力後卻沒成果　\n□⑤不要面對自己不會　\n\
        □⑥其他：____________________________________"
    - - 這個句子提醒我，我現在可能需要什麼？
      - '□①先讓心情穩定一點　  □②把目標變小一點　

        □③知道可以怎麼開始　  □④找到一個方法或示範

        □⑤有人給我一點支持　

        □⑥其他：____________________________________'
    - - 在開始之前，我已經有哪一點可以幫助自己？
      - '□①我知道自己正在害怕或挫折

        □②我知道自己想要變好一點

        □③我曾經有一點點成功經驗

        □④我可以把目標切成更小的任務

        □⑤我身邊有可以請教的人

        □⑥其他：____________________________________'
    - - 我可以運用什麼資源，先往前一小步？
      - '□①運用一點時間，先試最小的一步　

        □②運用之前的例子，看看別人怎麼做　

        □③運用提問，請別人給我提示　

        □④運用過去經驗，想想以前怎麼撐過去　

        □⑤運用休息時間，讓自己穩定後再開始　

        □⑥其他：____________________________________'
    - - 加入 Not yet 精神，選出你可以改寫的句子，並完成它。
      - '□①我現在還不會____________________________，

        但我可以先__________________________________。

        □②我還沒有掌握____________________________，

        下一次我想試____________________________。

        □③這題／這件事我還沒做好，可能是因為我卡在

        ____________________________________________。'
  - type: guide
    text: →當想放棄的念頭出現時，或是固定型思維又出來保護我們時，也許不是要我們停下來，而是提醒我們需要成長、需要試試別的方法！
  - type: guide
    text: 補充小站：
  - type: guide
    text: 以後當固定型思維出現時，可以試著換一句話，幫自己從「我不行」找到下一小步。
  - type: table
    rows:
    - - 換個說法，換個思維：九個改變
    - - 固定型思維可能會說
      - 你可以試著換成這樣說
    - - 1.我就是不懂
      - 我忽略了什麼嗎？
    - - 2.我放棄了
      - 我得試試我學過的（別的）方法。
    - - 3.我犯錯了
      - 犯錯能讓我變得更好。
    - - 4.這太難了
      - 我可能需要更多的時間和精力（才能搞定）。
    - - 5.已經挺好的了
      - 這真的是我的最好成績嗎？
    - - 6.我不可能像她一樣聰明
      - 她是怎麼做的，我也要試試看。
    - - 7.我不能做得更好了
      - 我還能做得更好，我要繼續試試！
    - - 8.我閱讀不太好
      - 我要訓練我的閱讀能力。
    - - 9.我不擅長這個
      - 我正在提升自己。
