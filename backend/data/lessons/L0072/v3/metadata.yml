lesson_no: 5
series: 一般
lesson_seq: 6050
intro: 這篇文章透過柳丁和文旦的比喻，說明大腦「工作記憶」的功能，以及它在閱讀理解中所扮演的角色。文章探討了閱讀速度與工作記憶容量之間的關聯，並提出一個簡單卻有效的方法，來提升閱讀的速度和理解能力。藉由這個方法，可以讓原本需要較多大腦空間的訊息，變得更容易處理和記憶。
strategy_explained: '這一課我們要練習的是，作者怎麼用一個東西來比喻另一個東西，讓你看懂他說的意思，像這裡就是用柳丁和文旦來比喻我們大腦記憶東西的功能

  這篇文章用柳丁和文旦的例子，說明大腦在看東西、記東西的時候，需要多大的空間，也解釋了為什麼有時候讀得比較慢，這就是用我們生活裡熟悉的東西來解釋比較抽象的大腦功用

  讀的時候，你可以想像一下，自己吃柳丁和吃文旦的時候，感覺有什麼不一樣，然後想想作者是怎麼把這種感覺，跟我們讀文章、記住內容的過程連結起來的'
