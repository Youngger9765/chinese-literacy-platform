  passage: 也許會有人想問：「可是我閱讀真的超慢的，那怎麼辦呢？」「現在會考的國文考卷，字數有一萬個字，我要怎樣才可以讀快一點呢？」科學家的答案很簡單──「重複朗讀」。小歐把那兩句歌詞多唸幾次，速度就會愈來愈快，文旦就漸漸縮小，變成更方便記憶、理解的柳丁了。不只是歌詞，閱讀文章時，你拿一個碼表計時朗讀，多讀幾次，讓自己愈讀愈快，也會有提升閱讀理解力的效果。「讀課文有什麼用？會考用的文章，和課文完全不同啊！」一定會有人這樣質疑。科學家進一步的研究指出──如果讓學生重複朗讀第一課到第五課，一段時間後，學生朗讀的速度進步很多，這時再拿第六課給學生讀，雖然第六課是全新的課文，一至五課重複朗讀的效果，已經遷移到第六課了。結論是，重複朗讀可以提升閱讀的速度，讓學習項目的負擔，從文旦變成柳丁，使工作記憶能容納更多的學習項目，最後提升了閱讀理解。
