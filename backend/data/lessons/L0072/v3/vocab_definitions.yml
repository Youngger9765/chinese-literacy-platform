lesson_uid: L0072
version_id: v3
section_no: 三
vocab_definitions:
  vocabulary_bank:
  - 負荷
  - 質疑
  - 遷移
  - 容納
  - 工作記憶
  items:
  - index: 1
    word: 質疑
    definition: 對某件事或說法提出疑問。
  - index: 2
    word: 容納
    definition: 能裝下人或東西。例如：這間教室可以容納30位學生。
  - index: 3
    word: 負荷
    definition: 人或機器能承受的工作、重量或壓力。例如：每天工作18小時，工作負荷太重了。
  - index: 4
    word: 遷移
    definition: 把原來學會的知識或能力，運用到新的情況。例如：騎腳踏車學會的平衡技巧，也能幫助騎機車。它的近義詞是「遷徙」，但遷徙只能用在地理上的移動。
  - index: 5
    word: 工作記憶
    definition: 大腦暫時保存和處理訊息的能力，但能保存的訊息有限。
