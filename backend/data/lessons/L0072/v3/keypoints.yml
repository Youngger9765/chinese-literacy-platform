lesson_uid: L0072
version_id: v3
section_no: 五
keypoints:
  title: 重複朗讀的重要性
  structure: flat
  rows:
  - label: 工作記憶的功能
    value: 工作記憶就像大腦裡的籃子，可以【　】保存訊息，也能初步【　】訊息。
    blanks:
    - answer: 暫時
    - answer: 處理和理解
  - label: 工作記憶與閱讀速度的關係
    note: ※請勾選出正確答案(單選)
    value: "1.東西越大(文旦)，工作記憶能記得的越【①多 / ②少】；\n  東西越小(柳丁)，工作記憶能記得的越【①多 / ②少】。\n2.讀得快的人，工作記憶能記住更多內容。\n3.讀得快的人，閱讀理解能力比讀得慢的人來得【①好 / ②不好】。"
    blanks:
    - answer: ②少
      choice_index: 2
      options:
      - 多
      - 少
    - answer: ①多
      choice_index: 1
      options:
      - 多
      - 少
    - answer: ①好
      choice_index: 1
      options:
      - 好
      - 不好
  - label: 重複朗讀的優點
    value: 1.重複朗讀，朗讀速度會【　】，也有提升閱讀理解力的效果。2.重複朗讀課文的效果，可以【　】到新的課文上。
    blanks:
    - answer: 越來越快
    - answer: 遷移
  - label: 結論
    value: 重複朗讀可以提升閱讀速度，使【　】能容納更多內容，最終提升閱讀理解力。
    blanks:
    - answer: 工作記憶
