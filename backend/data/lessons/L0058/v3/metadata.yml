strategy_explained: '這一課我們要練習找出文章裡的小主題和重要細節，就像在「末日種子庫」裡，我們要找出它為什麼存在、藏了什麼種子，以及它有多重要這些重點，這樣才能了解為什麼我們要保護這些種子，還有臺灣在裡面扮演的角色

  讀的時候，你可以試著在心裡問問自己：「這一小段在講什麼？」「它說的『末日種子庫』最重要的是什麼？」這樣做，你就能抓到文章的重點囉'
