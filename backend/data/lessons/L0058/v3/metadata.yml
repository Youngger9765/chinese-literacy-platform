intro: 你知道嗎？世界上有一種特別的銀行，它不存錢，而是珍藏著來自世界各地的農作物種子。這就是「斯瓦爾巴全球種子庫」，又被稱為「末日種子庫」。為什麼會有這樣的種子銀行呢？原來，面對日益嚴峻的氣候變遷，許多農作物可能面臨滅絕的危機。為了保存珍貴的農作物基因多樣性，這座種子庫被建造在挪威北極圈內的永久凍土區，利用極低的溫度進行長期保存。文章將帶你認識這個獨特的種子庫，了解它的重要性，以及臺灣如何參與其中，共同為人類的糧食安全盡一份心力。
