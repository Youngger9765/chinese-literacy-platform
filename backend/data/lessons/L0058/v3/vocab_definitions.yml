lesson_uid: L0058
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 出資
  - 烽火漫天
  - 多樣性
  - 倖免
  - 未雨綢繆
  - 活性
  - 戒備
  - 森嚴
  - 極端
  - 甦醒
  - 殃及池魚
  items:
  - index: 1
    word: 多樣性
    definition: 事物或生物有許多不同的種類或特色。
  - index: 2
    word: 未雨綢繆
    definition: 事情還沒發生前，先做好準備。
  - index: 3
    word: 森嚴
    definition: 防守或警戒非常嚴密。
  - index: 4
    word: 倖免
    definition: 在災難或危險中，幸運的沒有受傷。
  - index: 5
    word: 戒備
    definition: 保持警覺，並做好防備，以應付可能發生的危險。
  - index: 6
    word: 烽火漫天
    definition: 形容戰爭激烈，到處都有戰火。
  - index: 7
    word: 活性
    definition: 生物或細胞仍能生長或發揮作用的狀態。本文指種子還能發芽。
  - index: 8
    word: 甦醒
    definition: 從昏迷、沉睡的狀態恢復過來。本文把種子恢復發芽比作甦醒。
  - index: 9
    word: 極端
    definition: 程度非常高或非常低，超出一般範圍。
  - index: 10
    word: 殃及池魚
    definition: 比喻原本與事情無關的人或事物受到牽連。
  - index: 11
    word: 出資
    definition: 提供金錢，讓某項計畫或工作可以進行。
  notes:
    answer_carrier: 橘色手寫字（圖形），文字流的空格內已填有答案
