  passage: 由於全球氣候變遷越來越劇烈，對生物多樣性造成威脅，不僅影響動物的生存，連植物也難以倖免。萬一發生區域性或全球性的大災害，某些農作物可能從此滅絕。興建種子庫，就是為了預防這樣的末日景象，保護農作物的多樣性，因此它也被稱為「末日種子庫」。低溫乾燥的環境有利於保存種子，這座種子庫因而建造在斯瓦爾巴群島永久凍土區的山脈內部。這裡是挪威最北邊的國土，位於北極地區，土地長年冰凍，氣候極為寒冷，像一座大型的自然冷凍庫。種子庫的溫度維持在攝氏零下18度，這樣的低溫可讓種子的代謝活動變慢，減少消耗，並維持發芽活性，最適合長期保存種子。即使停電或製冷機故障，永凍土也能讓內部溫度保持在零下8度左右。這個世界最大的種子銀行，最多可存放450萬種作物的種子。珍貴的種子要先經過真空包裝，再用三層鋁箔密封，才能上架。
