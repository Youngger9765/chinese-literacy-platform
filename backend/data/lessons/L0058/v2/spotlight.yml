spotlight:
  lesson: G6-L18
  strategy_name: 摘要策略-找小主題與細節
  strategy_type: summary
  blocks:
  - type: guide
    text: 一、找小主題與重要細節：第三段
  - type: free_text
    prompt: ❶由於全球氣候變遷越來越劇烈，對生物多樣性造成威脅，不僅影響動物的生存，連植物也難以倖免。❷萬一發生區域性或全球性的大災害，某些農作物可能從此滅絕。❸興建種子庫，就是為了預防這樣的末日景象，保護農作物的多樣性，因此它也被稱為「末日種子庫」。
  - type: guide
    text: （一）找主題句、寫出小主題：
  - type: single
    prompt: 1.哪一句最能說出第3段的主要內容？（單選）
    options:
    - 句❶
    - □句❷  句❸
    answer: □句❷  句❸
  - type: free_text
    prompt: 2.本段的小主題是：【 興建種子庫的目的  】（答案合理即可）
  - type: guide
    text: （二）找重要細節
  - type: single
    prompt: 1.除了主題句外，哪一句最能直接說明為什麼要「興建末日種子庫」？
    options:
    - 句❶
    - 句❷
    answer: 句❷
  - type: guide
    text: （三）整理成段落重點
  - type: free_text
    prompt: 1.請把主題句（句❸）和重要細節（句❷）精簡合成一句話。
  - type: guide
    text: 興建末日種子庫，是為了避免【  區域性或全球性的大災害        】造成【  某些農作物滅絕   】，以保護【 農作物的多樣性   】。(答案合理即可）
  - type: guide
    text: 二、找小主題與重要細節：第四段
  - type: free_text
    prompt: ❶低溫乾燥的環境有利於保存種子，這座種子庫因而建造在斯瓦爾巴群島永久凍土區的山脈內部。❷這裡是挪威最北邊的國土，位於北極地區，土地長年冰凍，氣候極為寒冷，像一座大型的自然冷凍庫。❸種子庫的溫度維持在攝氏零下18度，這樣的低溫可讓種子的代謝活動變慢，減少消耗，並維持發芽活性，最適合長期保存種子。❹即使停電或製冷機故障，永凍土也能讓內部溫度保持在零下8度左右。❺這個世界最大的種子銀行，最多可存放450萬種作物的種子。❻珍貴的種子要先經過真空包裝，再用三層鋁箔密封，才能上架。
  - type: guide
    text: （一）找小主題
  - type: free_text
    prompt: 1.第3段有主題句，但是第4段沒有。請讀各組句子，判斷它們主要在說什麼。（單選）
  - type: table
    rows:
    - - 句子
      - 這些句子主要在說明什麼？
    - - 句❶～❹
      - ①種子庫的低溫保存環境　□②種子庫的嚴密安全設計
    - - 句❺
      - □①種子可以保存多少年  　②種子庫可以存放多少種子
    - - 句❻
      - ①種子如何包裝與密封　  □②種子如何恢復發芽
  - type: single
    prompt: 2.哪兩組內容都在說明「種子如何長期保存」？（3選2）
    options:
    - 種子庫的低溫保存環境
    - 種子庫可以存放多少種子
    - 種子如何包裝與密封
    answer: 種子庫的低溫保存環境
  - type: free_text
    prompt: 3.把上面兩組內容合起來，寫出本段的小主題。
  - type: passage
    source: unknown
    paragraphs:
    - 本段的小主題是：【 種子庫的保存環境與方式              】（答案合理即可）
  - type: guide
    text: （二）找重要細節
  - type: guide
    text: 找到小主題後，從兩組內容中，找最重要的細節。
  - type: single
    prompt: 1.在句❶～❹，哪一句最能說明低溫為什麼有利於長期保存種子？
    options:
    - （單選）
    - 句❷　　句❸
    - 句❹
    answer: （單選）
  - type: single
    prompt: 2.哪一句直接說明種子的包裝與密封方法？（單選）□句❺　　句❻
    options:
    - （單選）
    - 句❺
    - 句❻
    answer: （單選）
  - type: guide
    text: →句❺說明種子庫的容量，和「保存環境與方法」關係較遠，可以省略。
  - type: guide
    text: （三）整理成段落重點
  - type: free_text
    prompt: 1.請把小主題和兩個重要細節精簡成一句話。
  - type: guide
    text: 種子庫利用【 攝氏零下18度的低溫   】減慢種子的代謝活動，並將種子【  真空包裝和三層鋁箔密封      】，讓種子能長期保存。(答案合理即可）
  - type: guide
    text: 複習完小主題及細節，接下來就請你完成文章重點表吧！
  - type: table
    rows:
    - - 大主題：末日種子庫
    - - 小主題
      - 重要細節
    - - '種子庫是什麼

        （第1～2段）'
      - 斯瓦爾巴全球種子庫是挪威政府出資興建的【】，用來保存【】。
    - - '種子銀行的

        建置'
      - '目的

        （第3段）'
      - 如聚光燈－（第三段）所寫。
    - - '種子銀行的

        建置'
      - 【】
      - 如聚光燈－（第四段）所寫。
    - - '種子銀行的

        建置'
      - '安全設計

        （第5段）'
      - 種子庫設計具備高度的安全性，可以防範【】帶來的威脅。
    - - '參與種子銀行的

        例子'
      - 【】
      - 為保存臺灣原生小米的【】，臺灣把小米種子存入斯瓦爾巴全球種子庫。
    - - '參與種子銀行的

        例子'
      - 敘利亞取出保存種子
      - 2015年，因阿勒坡種子庫遭到內戰波及，中東研究人員首次【】。
    - - '作者提醒

        （第8段）'
      - 科學家未雨綢繆建設種子庫，我們應該保護【】，希望永遠不會用到種子庫。
    answers:
    - 非營利儲藏庫
    - 全世界的農作物種子
    - 保存環境與方式
    - 地震、核武與海平面上升
    - 臺灣參與種子保存計畫
    - 基因多樣性
    - 取出130箱種子
    - 生態環境
  - type: self_check
    items:
    - 我能找出段落的小主題。
    - 我能依小主題選出重要細節。
    - 我能把小主題和重要細節整理成段落重點。
