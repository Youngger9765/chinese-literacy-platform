passage: 由於全球氣候變遷越來越劇烈，對生物多樣性造成威脅，不僅影響動物的生存，連植物也難以倖免。萬一發生區域性或全球性的大災害，某些農作物可能從此滅絕。興建種子庫，就是為了預防這樣的末日景象，保護農作物的多樣性，因此它也被稱為「末日種子庫」。
