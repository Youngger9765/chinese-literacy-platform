  answer_paths_note: '11 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有錯字。

    ✅ 幾何交叉驗證乾淨：`roundRect` 共 11 個，**全部在紙面上**（無離頁殘留），

    圈也是 11 個，數量相符。

    ⚠️ 「徵兆」與「前兆」**共用第 8 列第 10 欄的「兆」**（一橫一斜落在同一格），

    不是重複圈選；格子裡沒有第二個「兆」可以讓兩條路徑分開走，逐格取字已確認。

    （同型：L0071 的「差異／差距」共用「差」。）

    ⚠️ 格子裡有兩個「焦」（第2列第9欄、第3列第7欄），被圈的是第 3 列那個，

    因為只有它底下接得出「躁不安」。'
