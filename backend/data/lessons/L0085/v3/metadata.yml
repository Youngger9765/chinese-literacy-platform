strategy_explained: '這一課我們要練習的是「觀察細節，整理重點」的能力

  這篇文章裡介紹了好多用來預測天氣的自然現象，像是蜘蛛網、蟋蟀叫聲，還有日暈月暈，因為文章裡有很多這樣的小線索，很適合我們練習找出最重要的地方，並把它們好好記下來

  所以讀的時候，你可以試著想想，哪些動物或現象的變化，跟天氣預測最有關係，然後把它們簡單記下來'
