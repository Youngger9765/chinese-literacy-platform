  blocks:
  - type: concept_box
    text: '自我提問策略：一邊讀、一邊問自己的讀書方法

      你閱讀時，會不會一邊讀，一邊在心裡問自己問題？例如「這段在講什麼？」「哪些句子最重要？」

      這種一邊讀、一邊問自己的方法，叫做自我提問策略。它可以幫助你更容易讀懂文章內容。

      這一課，我們先練習一個最常用的自我提問：「這段主要在說什麼？」讀文章時，若你能停一下，問自己這個問題，再回到文章找出能回答這個問題的關鍵詞句，就能幫助自己抓住這段的主要意思。這一課要學的步驟是：

      停一下→問「這段主要在說什麼？」→找關鍵詞句→說出重點'
  - type: guide
    text: 一、一邊讀，一邊問
  - type: guide
    text: '右欄的提問，是提醒你在關鍵地方停下來想一想。看到問題時，請做兩件事：

      ❶先在心裡回答這個問題。

      ❷在課文中，圈出可以支持你回答的句子或關鍵詞。'
  - type: fill_table
    prompt: 一、一邊讀，一邊問
    columns:
    - 大自然的氣象小幫手
    - 自我提問
    table_note: '課文全文在這張表裡**再印一次**（帶「（段N）」前綴），與後半「讀全文-做記號」的

      同一篇課文並存 —— 原稿如此，不是重複抽取。右欄七個提問依版面對齊到左欄的段落群。'
    rows:
    - 大自然的氣象小幫手: '（段1）明天學校要去露營，你早早就把背包收好了，也查過天氣預報。但你還是忍不住走到陽台，抬頭看看天空，希望明天是個大晴天。就在這時，你發現陽台的角落有一隻蜘蛛正忙著結一個大網。你皺起眉頭，拿起掃把想把牠揮掉。

        （段2）且慢！你也許不知道，蜘蛛雖小，但牠的結網卻是一個天晴或下雨的好指標哦。'
      自我提問: 第1～2段主要在說什麼？
    - 大自然的氣象小幫手: （段3）蜘蛛的絲纖細到幾乎隱形，又怕風、又怕雨。如果即將下雨，牠們察覺到空氣中的濕度，就不會浪費力氣結一張會被雨打壞的大網。所以，當你看到蜘蛛在結網時，代表空氣是乾的，天氣會穩定，可能還會放晴。相反的，如果你發現蜘蛛網縮得很小，甚至整張網都不見了，也許就是快要下雨的信號。
      自我提問: 第３段主要在說什麼？
    - 大自然的氣象小幫手: （段4）很有趣吧，其實，大自然裡到處都是線索，告訴人們接下來的天氣會有什麼變化呢。只要你能明察秋毫，留心身邊的事物，也許就能像氣象署那樣預報天氣呢。
      自我提問: 第４段主要在說什麼？
    - 大自然的氣象小幫手: （段5）有位農夫宣稱，他可以從蟋蟀叫聲的頻率，判斷現在的氣溫大概幾度。經過研究，科學家的確發現，有些蟋蟀的叫聲會受到氣溫影響，氣溫越高，牠們叫得越快。如果錄下草叢裡蟋蟀的叫聲，數一數8秒內大約叫了幾聲，再把這個數字加5，就可以估算現在的攝氏氣溫。例如，蟋蟀8秒鐘內叫了20聲，20加5，現在的氣溫大概是25度。
      自我提問: 第５段主要在說什麼？
    - 大自然的氣象小幫手: （段6）除了蜘蛛、蟋蟀之外，你家的毛小孩也可能透露天氣的祕密。下雨前，空氣中的濕氣提高，氣壓降低。這種變化改變了狗狗和貓咪的毛髮乾爽度，會讓牠們坐立難安，狗狗可能會一直在屋子裡走來走去、發出低鳴；貓咪則可能變得特別愛躲藏，或身體不時抽搐。那就是快下雨的徵兆！
      自我提問: 第６段主要在說什麼？
    - 大自然的氣象小幫手: （段7）除了動物，天空本身也會說話。「日暈三更雨，月暈午時風」，所謂「暈ㄩㄣˋ」就是圍繞著太陽或月亮的光環。這句諺語指出，看到日暈，夜裡可能下雨，看到月暈，隔天白天可能起風。因為高空有一層很薄的冰晶雲，把光折射開來，我們才會看到日暈或月暈，這種雲常常是鋒面來臨的前兆，也就是說，看到日暈或月暈，再過半天，很可能就會起風或下雨。此外，我們偶爾會覺得今天的星星或遠山好像變近了，歷歷在目。有文學細胞的人就會寫下「今夜星辰分明，遠山如洗，彷彿天地間的距離被悄悄拉近」的美麗文句，這通常預示著冷空氣來臨，空氣潔淨，天氣即將轉晴或變涼。
      自我提問: 第７段主要在說什麼？
    - 大自然的氣象小幫手: （段8）當然，這些自然的線索不是百分之百準確，但連中央氣象署的預報也不是絕對正確啊，它們就像是大自然的小提示。所以，當你擔心明天會不會下雨時，除了查手機上的天氣預報，也可以看看蜘蛛有沒有結網、毛小孩是不是焦躁不安，或是月亮是不是戴了光圈。說不定，大自然早就偷偷告訴你答案了！
      自我提問: 第８段主要在說什麼？
  - type: guide
    text: 二、比較看看：自我提問後，有沒有幫助你抓到這段重點？
  - type: guide
    text: 讀完第3段後，先看看你現在比較接近哪一種理解？請打勾。
  - type: fill_table
    prompt: 讀完第3段後，先看看你現在比較接近哪一種理解？請打勾。
    columns:
    - 我讀到第３段的意思
    - 理解情況（或層級）
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三格都沒有勾選
    rows:
    - 我讀到第３段的意思: ①主要在說蜘蛛
      理解情況（或層級）: ①只抓到主題詞
    - 我讀到第３段的意思: ②主要在說蜘蛛的絲很細，又怕風、怕雨
      理解情況（或層級）: ②只抓到相關細節
    - 我讀到第３段的意思: ③主要在說蜘蛛結網大小可以幫助判斷天氣
      理解情況（或層級）: ③讚！抓到段落重點了
    rows_note: 這是自我評估用的分級對照表，三個 □ 原稿都空著（層級由學生自己勾），所以標 no_correct_answer。
  - type: guide
    text: 如果你勾①或②，沒關係，表示你已經抓到一部分內容。接下來，我們要用自我提問，幫自己把理解推到最高級的層級③。
  - type: single
    prompt: 1.第3段，如果我要讀到層級③，最需要問自己哪一個問題？(單選)
    options:
      1: 這段主要在說什麼？
      2: 這段的主角是誰？它做了什麼？
      3: 這段文字有什麼值得記憶的地方？
    answer: 1
  - type: multi
    prompt: 2.找重點時，要回到文章找線索，底下哪兩句最能直接說明「如何從蜘蛛結的網判斷天氣」？（４選２）
    options:
      1: 蜘蛛的絲纖細到幾乎隱形，又怕風、又怕雨。
      2: 如果即將下雨，蜘蛛察覺到空氣中的濕度，就不會浪費力氣結大網。
      3: 看到蜘蛛在結大網，代表空氣是乾的，天氣會穩定，可能還會放晴。
      4: 蜘蛛網縮得很小，甚至整張網都不見了，也許就是快要下雨的信號。
    answers:
    - 3
    - 4
  - type: single
    prompt: 3.「這段主要在說什麼？」這個問題可以幫我什麼忙？(單選)
    options:
      1: 幫我找出作者最後真正想表達的觀點。
      2: 幫我把細節整理成比較完整的段落重點。
    answer: 2
  - type: guide
    text: '4.你發現了嗎？

      問自己「這段主要在說什麼？」可以幫你確認：我是不是只抓到一個詞或一個細節？還是已經抓到這段比較完整的重點？'
  - type: guide
    text: 三、換你試試看：讀完一段，先問自己
  - type: guide
    text: '現在換你試試看。每讀完一段，請照著本課方法完成：

      停一下→ 問「這段主要在說什麼？」→找關鍵詞句→說出重點'
  - type: guide
    text: '下面的練習，請完成兩件事：

      ❶ 找關鍵詞句：找最能回答「這段主要在說什麼？」的詞句

      ❷ 選出完整重點：選出最能說出這段主要意思的答案'
