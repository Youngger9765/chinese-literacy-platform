  passage: 可可樹分布在赤道附近的熱帶地區，其中西非地區的象牙海岸、迦納、奈及利亞、喀麥隆等國，供應了全球70% 左右的可可豆。可可果不像蘋果、橘子那樣長在細細的枝頭上，它像一顆小型橄欖球，直接生長在樹幹和粗壯的枝條上，採收時，工人必須彎腰或仰頭，用彎刀或長柄刀具砍下來，剖開果殼，取出裡面的可可豆。種植與採收可可豆過程繁瑣、費工耗時。從整地、栽種、除草、施肥、除蟲，採收與剖果，到剖果後的發酵、乾燥，每一道工序都必須以人工完成。但可可農民的日薪往往不到2美元（新臺幣60元），實在難以養家活口。更糟的是，為了節省成本，不少農場甚至雇用來自貧困家庭、年齡未滿15歲的童工，這些兒童原本應該在學校讀書，卻背著沉甸甸的可可豆籃，揮動刀具，每天工作十多個小時。
