lesson_uid: L0117
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略──找出一連串因果
  strategy_type: inference
  blocks:
  - type: concept_box
    text: '本課課文提到巧克力產業中農民的困境，文章隱含了許多環環相扣的前因後果。文章說明了「事情的原因是什麼？」、「結果又是什麼？」、「結果又引發了什麼問題？」閱讀這樣的文章，如果我們能找出這些因果關係，就能幫助我們更了解事件的來龍去脈。

      我們用❶～❹四個步驟，幫助你把文章的前因後果看得更清楚。'
  - type: figure
    referent: 找出一連串因果四步驟（流程圖）
    text_carrier: image
    note: 圖檔名 找出一連串因果四步驟.png；圖內所有字串 grep document.xml/footnotes.xml/endnotes.xml 皆 0，確為畫在像素上
    steps:
    - label: ❶找事件
      hint: 識別文章中討論的主要事件／文章討論哪些事
    - label: ❷找線索
      hint: 尋找文章中的因果關係提示詞／圈出因果提示詞
    - label: ❸判斷因果畫箭頭
      hint: 分析並標示原因與結果／標出原因與結果
    - label: ❹一連串因果圖
      hint: 串連形成完整的因果關係鏈／串連完整因果鏈
  - type: guide
    text: 接下來，我們來學習這個非常重要的閱讀策略──「找出一連串因果」。
    note: 以上 concept_box、圖、本句原稿印在同一個外框內
  - type: guide
    text: 一、推論本文的因果關係-以第四段為例
  - type: guide
    text: '步驟❶──找事件

      1.問自己：這段文字提到了哪些重要事件或現象？'
  - type: multi
    label: ◎小試身手：
    prompt: 本課第四段談到哪些事？請在□中打勾（複選，提示：有5個答案）
    options:
      1: 農民收入低、貧困
      2: 利潤分配不公
      3: 童工現象
      4: 代代複製貧窮
      5: 無法靠教育翻身
      6: 可可豆採收繁瑣
    answers:
    - 1
    - 2
    - 3
    - 4
    - 5
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），文字流查得到
  - type: guide
    text: '步驟❷──找因果線索

      1.問自己：文章中哪些地方透露出「原因→結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？

      2.祕訣：

      A.「有關鍵詞」的文句：

      表示「原因」的關鍵詞有「因為、由於、為了」等等。

      表示「結果」的關鍵詞有「因此、所以、導致、造成」等等。

      B.「沒有關鍵詞」的文句：

      判斷策略：自己加上因果關鍵詞，判斷是否為因果句。

      前句開頭加「因為」、後句開頭加「所以」，看看整句是否合理。'
    source_text: '步驟❷──找因果線索

      1.問自己：文章中哪些地方透露出「原因結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？

      2.祕訣：

      A.「有關鍵詞」的文句：

      表示「原因」的關鍵詞有「因為、由於、為了」等等。

      表示「結果」的關鍵詞有「因此、所以、導致、造成」等等。

      B.「沒有關鍵詞」的文句：

      判斷策略：自己加上因果關鍵詞，判斷是否為因果句。

      前句開頭加「因為」、後句開頭加「所以」，看看整句是否合理。'
  - type: fill_table
    label: ◎小試身手
    instruction: 'A.有關鍵詞：先圈關鍵詞，再判斷這個關鍵詞提示的是「因」還是「果」。

      B.沒有關鍵詞：判斷是否為因果句。'
    rows:
    - - 第四段-A有關鍵詞，先圈關鍵詞
      - 這個關鍵詞表達
    - - 1.為了活下去，許多父母不得不把未成年子女送進這個產業鏈當童工
      - ☑①原因　□②結果
    - - 2.未成年子女送去當童工。這些孩子因此不可能靠教育翻身
      - □①原因　☑②結果
    - - 第四段-B沒有關鍵詞
      - 判斷是否為因果句
    - - 1.可可豆乾燥後，交由採購商出口
      - □①是因果句　☑②不是因果句
    - - 2.在這個扭曲的分配制度下，農民永遠無法改善生計
      - ☑①是因果句　□②不是因果句
    - - 3.這些孩子不可能靠教育翻身，只能一代一代複製貧窮
      - ☑①是因果句　□②不是因果句
    circled_keywords:
    - 為了
    - 因此
    answer_carrier: '兩種載體：☑ 是 w:sym Wingdings F0FE；「先圈關鍵詞」的答案是字元框線

      —— 「為了」w:bdr color=auto（黑框）、「因此」w:bdr color=C00000 sz=24（紅框），

      沒有框的關鍵詞就不是答案。第一列表頭原稿印在同一張表內。'
  - type: guide
    text: '步驟❸──判斷因果，畫箭頭

      1.問自己：在找到的因果語句中，「原因」是哪一部分？「結果」是哪一部分？兩者之間如何連接？

      2.祕訣：畫一個箭頭「→」從原因指向結果，就一目了然了！'
  - type: fill_table
    label: ◎小試身手
    instruction: 根據上表，請判斷誰是因？誰是果？並畫正確箭頭方向
    rows:
    - - 事件
      - 因
      - 果
      - 箭頭方向
      - 事件
      - 因
      - 果
    - - 1.利潤分配不公
      - ☑
      - □
      - →
      - 農民生活貧困
      - □
      - ☑
    - - 2.農民生活貧困
      - ☑
      - □
      - →
      - 送孩子當童工
      - □
      - ☑
    - - 3.孩子當童工
      - ☑
      - □
      - →
      - 不能靠教育翻身
      - □
      - ☑
    - - 4.不能靠教育翻身
      - ☑
      - □
      - →
      - 一代代複製貧窮
      - □
      - ☑
    answer_carrier: '☑ 為 w:sym Wingdings F0FE（第 1 列黑色、第 2~4 列紅色，顏色不同不代表意義不同）；

      「箭頭方向」欄的 → 原稿已印，第 2~4 列印成紅色。四列一律左＝因、右＝果。'
  - type: guide
    text: '3.你發現了上表的兩個特色嗎？

      A：1、2、3、4的「因」和「果」，都是「因」在前，「果」在後。

      B：事件1的果，變成了事件2的因；事件２的果，變成了事件３的因，以此類推。'
  - type: figure
    referent: diagram
    note: '因果接力示意圖：因1→果1、因2→果2、因3→果3，前一組的「果」連到下一組的「因」。

      橢圓與連接線是圖形，但標籤在文字層（txbxContent），所以不標 text_carrier: image。'
    labels:
    - 因1
    - 果1
    - 因2
    - 果2
    - 因3
    - 果3
  - type: guide
    text: '步驟❹──連成一連串因果

      1.問自己：文章中是否有一連串環環相扣的因果關係（因果鏈）？能否把多個因果關係串連起來，形成一個完整的脈絡？

      2.祕訣：當一件事的「結果」又成為下一件事的「原因」時，就形成了一連串的因果。

      我們可以把這些環環相扣的關係連接成一個流程圖或概念圖，來幫助理解整體脈絡。'
  - type: figure
    referent: diagram
    note: '一連串因果示意圖：因1→果1→因2→果2→因3→果3→因4→果4，外圈以虛線框起整條因果鏈。

      同上，標籤在文字層，不標 text_carrier: image。'
    labels:
    - 因1
    - 果1
    - 因2
    - 果2
    - 因3
    - 果3
    - 因4
    - 果4
  - type: free_text
    label: ◎小試身手
    prompt: 'A.以本文為例，第四段隱含著一條重要的因果鏈。上表我們已經找到4個因果關係，接下來我們再看看它們之間的關係，請排序畫出一條因果鏈。

      ❶利潤分配不公    ❷農民收入低、貧困  ❸童工現象

      ❹無法靠教育翻身  ❺代代複製貧窮

      B.一連串因果（可以寫編號或寫自己看得懂的關鍵詞）'
    answer_chain:
    - 利潤分配不公
    - 農民收入低、貧困
    - 童工現象
    - 無法靠教育翻身
    - 代代複製貧窮
    answer_carrier: 原稿已填（首尾為黑色印刷，中間三格為橘色手寫體答案）
  - type: guide
    text: C.這條因果鏈告訴我們：不公平的利潤分配引發了一連串社會問題，最終讓農民的貧窮代代相傳。
  - type: free_text
    label: 二、挑戰題：推論因果關係-再以第五段為例
    prompt: 1.本課第五段也有一組因果鏈，請你用4個步驟，畫出第五段的因果鏈。
    answer_chain:
    - 氣候變遷 + 農民貧困
    - 砍伐森林
    - 破壞生態
    - 病蟲害增加
    - 可可產量不穩
    - 農民更貧困
    answer_carrier: 「破壞生態」「可可產量不穩」為橘色手寫體（學生填），其餘原稿已印
  - type: guide
    text: 2.這條因果鏈告訴我們：環境變遷和農民貧困問題交織在一起，最終讓農民更貧困。
  - type: figure
    referent: 實作流程示例（側欄四步驟小圖）
    text_carrier: image
    note: 圖檔名 實作流程示例.png；「步驟1 閱讀文章 找出主要事件」等字串 grep 三個 xml 皆 0
    steps:
    - label: 步驟1
      hint: 閱讀文章 找出主要事件
    - label: 步驟2
      hint: 標記關鍵詞「因為」「所以」……
    - label: 步驟3
      hint: 用箭頭連接 原因 → 結果
    - label: 步驟4
      hint: 完成因果圖 理解來龍去脈
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出文章中的重要事件。
    - 2.我能辨識表示原因和結果的關鍵詞。
    - 3.我能判斷誰是因？誰是果？並用箭頭連接因果關係。
    - 4.我能將相關的因果事件，連出一連串因果。
    - 5.我發現因果鏈分析，可以幫我把零散的訊息連成有意義的脈絡。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: ※如果你5項都打勾，恭喜你，表示你已經學會用 4 步驟「推論一連串因果」！而且你瞭解這個策略對你的幫助。
