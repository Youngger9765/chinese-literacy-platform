  - label: 問題1：農民辛苦與童工問題
    value: '1.種植與採收可可豆__，但農民的收入很低，難以養家活口

      2.為節省成本，不少農場雇用__。'
    blanks:
    - answer: 過程繁瑣、費工耗時
      hint: ''
    - answer: 童工
      hint: ''
  - label: 問題2：利潤分配不均與世代貧窮
    value: '1.全球巧克力產業__，大量利潤被製造商與經銷商取得，底層農民收益不到總額5%。

      2.扭曲的分配制度導致農民無法改善生計，被迫讓子女從事童工，一代代__。'
    blanks:
    - answer: 利潤分配不均
      hint: ''
    - answer: 複製貧窮
      hint: ''
  - label: 問題3：環境惡化
    value: '1.__使病蟲害加劇，農民無力改善問題，只好__開墾新地。

      2.砍伐森林又__，惡化病蟲害與土壤流失，導致__。'
    blanks:
    - answer: 氣候變遷
      hint: ''
    - answer: 砍伐森林
      hint: ''
    - answer: 破壞生態
      hint: ''
    - answer: 可可產量不穩
      hint: ''
  - label: 解決方案：公平交易模式
    value: '1.採__模式，直接與農民合作社簽約，減少中間商__，保證合理的價格，並禁用童工。

      2.「東尼公平巧克力」為典範，無奴工、不規則巧克力造型提醒__，並投資農村建設。'
    blanks:
    - answer: 公平交易
      hint: ''
    - answer: 剝削
      hint: ''
    - answer: 分配不公
      hint: ''
  - label: 結語
    value: 提醒讀者選購有__標章的巧克力，以實際支持農民。
    blanks:
    - answer: 公平交易/永續認證
      hint: ''
  title: 讓你口中的甜蜜，成為遠方農民的希望
