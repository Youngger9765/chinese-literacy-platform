multiple_choice:
- question: 下列語詞何者使用不正確？
  options:
  - 他「喬裝」成水電工人，以躲避警方的追緝。
  - 最近天氣多變，時常讓人感到胸口「納悶」。
  - 她扭傷了腳踝，痛到要人「攙扶」著去保健室。
  - 他工作表現十分「稱職」，很受上級的器重。
  answer: B
  explanation: 應為鬱悶
- question: 從課文中可知，對民間信仰（如找乩童、喝符水）進入醫院，陳志金醫師和其他醫療人員最大不同的地方是什麼？
  options:
  - 陳醫師對病人有跨文化的理解和接納。
  - 陳醫師從不同的醫學院畢業。
  - 陳醫師曾經接受過不同的科學訓練。
  - 陳醫師相信乩童、符水及神明的功效。
  answer: A
  explanation: 課文中明確指出，其他醫師普遍認為民間信仰作法「很迷信、很無知」，但陳志金醫師卻是「從跨文化理解的角度」看待並「展現了『跨文化的理解接納』，包容了一般醫院排斥的民俗信仰作為」。
- question: 第十三段，護理師後來轉述說，她向太太說：「我上有老下有小，是放心不下，但是，也不想回來了。」請問句中的「我」指的是誰?
  options:
  - 醫生
  - 乩童
  - 病人
  - 病人的哥哥。
  answer: B
  explanation: 課文前言指出本課內容探討醫師與乩童在醫院中協助病人的情境，並強調跨文化理解。選項中的引言「我上有老下有小，是放心不下，但是，也不想回來了」描述了一個人因家庭責任而擔憂，同時又對當前任務感到疲憊或不願再
- question: 根據課文，陳醫師在文章裡寫道：「這完全顛覆了我對乩童的刻板印象！」請問下列哪一個選項顛覆了陳醫師對乩童的刻板印象？
  options:
  - 乩童會在加護病房裡作法。
  - 乩童會代替病人擁抱家屬。
  - 乩童很辛苦，退駕時滿身大汗。
  - 乩童是這個站在床邊的年輕女性。
  answer: D
  explanation: 課文定義「刻板印象」為「對人、事、物固定的印象或概念」。傳統上，人們對乩童可能會有特定的形象（例如性別、年齡、外貌），而「年輕女性」這個身分與這些固定的印象不同，直接顛覆了陳醫師對乩童的固有認知。
- question: 陳醫師並沒有在文章裡寫出他對乩童有什麼刻板印象，但讀者好像也猜得到。請問陳醫師心中本來認為乩童應該是什麼樣子？
  options:
  - 年紀更小的孩童。
  - 年紀更小的女人。
  - 年紀稍大的男人。
  - 年輕貌美的女人。
  answer: C
  explanation: 課文指出醫師普遍認為乩童的作法「很迷信、很無知」，這反映了主流科學對民俗信仰的刻板印象。在臺灣文化中，乩童的傳統形象通常是年紀稍長的男性，他們扮演神明與人間溝通的角色，其行為模式容易被受過嚴謹科學訓練
- question: 讀完本課，請問作者想要傳達給讀者什麼道理？
  options:
  - 提倡凡事講求科學證據，不要太迷信。
  - 若疾病治不好，可以去尋求宗教協助。
  - 呼籲乩童未來可以是醫護人員的夥伴。
  - 設身處地為人著想，事情就會有轉機。
  answer: D
  explanation: 課文多次強調陳志金醫師「從跨文化理解的角度」看待問題，並「站在家屬的方式想，也不去批判家屬的文化背景」，最終證明「只要調整自己的想法，就能接納了」，並帶來醫病雙贏的好處，這都說明了設身處地為人著想的重
