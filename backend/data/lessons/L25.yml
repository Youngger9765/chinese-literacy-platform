  sub_rows:
  - label: 結果
    value: 療癒了家屬的心靈。 在這篇課文裡，你可以看到身在尖端醫學領域、受過嚴謹科學訓練的陳醫師 展現了「跨文化的理解接納」 ，包容了一般醫院排斥的民俗信仰作為，並且做到 了醫病雙贏，陳醫生不僅站在家屬的方式想，也不去批判家屬的文化
