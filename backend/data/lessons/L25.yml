reading_strategy: 品格力－跨文化接納理解
knowledge_video_url: https://www.youtube.com/watch?v=jprjsByuZZg
story_text: '「陳醫師，我有個不情之請，我媽媽說，明天想要請乩童來看看，不知道可不可以？」病人的哥哥非常小心翼翼的問，深怕會觸怒我似的，畢竟，誰會跟醫師說，他要找乩童來幫忙啊！搞不好會被轟出去！

  「當然可以！」我不假思索的回答。他顯然被我的回答嚇了一跳！「謝謝醫師！不好意思啊！我有勸媽媽，但是，她就是想要再試試看。」

  「我知道，這是媽媽的心意，我們就順著她的意思！沒問題的。」病人的病況非常的不好，恐怕不能再維持幾天了，對我來說，現在更重要的是「救家屬」。能夠讓家屬安心的，能夠讓他們盡一份心力的，為什麼不行呢？

  從一開始，我們就有主動讓媽媽帶廟裡求來的符和符水來使用。有些醫師會說不行，那有「毒」那很髒！（是有多毒？多髒啊？）

  對我們來說，符水只是「碳灰」，沒什麼大不了的。中秋節烤肉，大家不是吃很多嗎？一般醫師會拒絕，其實，打從心理是覺得這些東西「很迷信、很無知」，而且會覺得自己的專業被挑戰、不被信任。

  而我呢？就平常心看待：這只是家屬的一番心意、他們只是想要盡一份力量而已，並非對我們的不信任。我認為，乩童、符水其實就是「家屬的祝福」。我們和家屬一起努力對抗疾病，有什麼不好呢？

  隔天，來了好幾位家屬，可是，我沒有看到「期待中」的乩童出現。我問：「今天不是要找乩童來嗎？」病人的哥哥用手指了一下床邊的一位年輕女性。

  這完全顛覆了我對乩童的刻板印象！但是，我依然能夠感受到她的「氣場」。我用眼角餘光看了一下她正在施法的手勢，然後趨前向她自我介紹。

  「你好！我是陳醫師，我向您說明病人的現況……」我向她說明了病人目前危急的病情、以及非常不樂觀的預後。她的眼神和我接觸之後，微微的點頭表示瞭解。

  我想她心裡一定很納悶󠇡，以往去加護病房作法都是偷偷摸摸的，還要喬裝成家屬，經常遭受到醫療人員異樣、甚至不屑的眼神。怎麼現在這位醫師，竟然還會主動的來和她說明病情，簡直太不可思議了！

  「那就拜託妳了，謝謝。」什麼？我竟然還拜託她？還跟她說謝謝？有沒有搞錯啊？我當然要謝謝她，對我來說，她也是我們的「伙伴」，就像是前來協助「會診」的醫師一樣。我要向她清楚的交待病情，她才知道要如何「幫忙」，不是嗎？我以前就很常寫「會診單」，讓家屬帶去找神明。

  我從她的眼神確定，她有聽懂我的話。然後，我退後、站在遠處觀看。接下來，我被眼前的景象嚇呆了！她手腳比劃、口中唸唸有詞之後，轉頭向媽媽和太太講了幾句話，就突然給媽媽一個深深的擁抱、也給太太一個擁抱！

  護理師後來轉述說，她向太太說：「我上有老下有小，是放心不下，但是，也不想回來了，回來也是這樣躺著，很辛苦！也會讓你和媽媽辛苦！你要想清楚，我們夫妻同心！」（就是先生對太太的口吻在說話）

  原來，這兩個大大的擁抱，是乩童代替病人執行的。

  接著，她就很虛弱的倒下（應該是退駕了？），需要旁人攙扶她出去。她剛剛應該是消耗了很大的元氣，還滿頭汗水，真的辛苦她了。

  我由衷佩服她的專業和敬業，更感謝她的幫忙！謝謝她展現了對家屬的「關懷、同理」，也療癒了家屬的心靈，她真的是一位非常稱󠇡職的乩童。

  乩童當然也可以是我們的伙伴，你說不是嗎？

  我應該要跟她要一張名片的。'
