spotlight:
  lesson: G6-L2
  strategy_name: 多元觀點
  strategy_type: multiple_perspectives
  blocks:
  - type: free_text
    prompt: (5)決賽即將開始，選手們早已(  A   )，準備上場。
  - type: free_text
    prompt: (6)爸爸想爬山，媽媽想泡湯，最後選擇有步道的溫泉區，作為(  G   ) 方案。
  - type: free_text
    prompt: (7)演講者談到守護海洋時，語氣十分(  D   )，感動了在場聽眾。
  - type: free_text
    prompt: (8)蛋糕才剛端上桌，弟弟就(  B   )地想吃第一口。
  - type: guide
    text: 五閱讀聚光燈比較多元觀點五閱讀聚光燈比較多元觀點
  - type: guide
    text: 一、確定議題
  - type: single
    prompt: 這場班會一開始在討論哪一個問題？（單選）
    options:
    - 班上要不要製作班服。
    - 哪一個班服方案較適合全班。
    - 班服的價格應該訂多少元。
    answer: 班上要不要製作班服。
  - type: guide
    text: 二、找觀點：整理方案的理由與盲點
  - type: free_text
    prompt: 1.兩組分別提出班服方案。請整理各組的主張、理由、主要考量與盲點。
  - type: table
    rows:
    - - 組別
      - 要素
      - 請根據課文內容填答或勾選
    - - 第一組
      - 主張
      - 採用八百元的高質感班服。
    - - 第一組
      - 理由(複選)
      - □①潮牌風加上重磅純棉，外觀與材質較有質感。□②班服能留下共同紀念，也能展現班級凝聚力。□③班服只穿幾次，省下的錢可以作為園遊會基金。
    - - 第一組
      - 主要考量
      - □①美感、品質、紀念價值與班級凝聚力。□②價格、舒適、實用與園遊會經費。
    - - 第一組
      - 盲點
      - 育勤提醒：□①價格過高，可能造成家庭負擔；不購買的同學也可能感到被排擠。□②版型和剪裁不理想，可能讓同學不想穿，最後造成資源浪費。
    - - 第二組
      - 主張
      - 採用兩百元的排汗衫。
    - - 第二組
      - 理由(複選)
      - □①排汗衫價格較低，涼快透氣，適合運動會穿。□②高質感純棉能留下共同紀念，也能展現凝聚力。□③班服只穿幾次，省下的錢可以作為園遊會基金。
    - - 第二組
      - 主要考量
      - □①美感、品質、紀念價值與班級凝聚力。□②價格、舒適、實用與園遊會經費。
    - - 第二組
      - 盲點
      - 宜靜提醒：□①價格過高，可能造成家庭負擔；不購買的同學也可能感到被排擠。□②版型和剪裁不理想，可能讓同學不想穿，最後造成資源浪費。
  - type: single
    prompt: 2.育勤和宜靜的發言，有什麼共同作用？（單選）
    options:
    - 各自支持另一組方案，使兩組的立場更加對立。
    - 指出原來兩個方案都不可行，應該全部重新設計。
    - 補充原方案沒有顧到的需求，讓討論更加完整。
    - 提醒班長立即進行表決，用多數票結束討論。
    answer: 各自支持另一組方案，使兩組的立場更加對立。
  - type: guide
    text: 三、無共識時，怎麼做團體決策？
  - type: passage
    source: unknown
    paragraphs:
    - 兩組方案各有考量，也各有盲點，若各自堅持，就無法做出決定。這個班級後續又怎麼找到共識，形成共同決定呢？
  - type: fill_table
  - type: guide
    text: 你發現了嗎？
  - type: guide
    text: 不同觀點能補足盲點，幫助大家做出共同決定：
  - type: passage
    source: unknown
    paragraphs:
    - 同學指出盲點→班長整理需求→夏恩調整方案→ 折衷方向出現→全班投票決定，也照顧少數同學
  - type: guide
    text: 四、從討論過程讀出作者看法
  - type: single
    prompt: 根據上表，下列哪一項最能表達作者的觀點？（單選）
    options:
    - 團體決策要盡快進行表決，避免不同意見讓衝突繼續擴大。
    - 團體決策要聽懂不同需求、衡量方案得失，也照顧少數同學的困難。
    - 團體決策要把兩個方案各取一半，讓不同立場各退一步。
    - 團體決策只要依照多數意見，少數同學就應該配合。
    answer: 團體決策要盡快進行表決，避免不同意見讓衝突繼續擴大。
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: table
    rows:
    - - 一件班服，一場思辨討論
    - - 討論議題(第1段)
      - 班上要進行【】，兩組代表準備為自己的方案進行【】。
    - - 提案與質疑(第2～5段)
      - 1.第一組提出【】的重磅純棉班服。2.第二組提出兩百元的【】。3.同學分別提出質疑，兩組一直無法達成【】。
    - - 討論轉折(第6～7段)
      - 1.班長提醒，團體討論不是要找出人人滿意的【】，而是尋找較多人能接受的【】。2.夏恩不再死守原來的方案，討論開始出現新的方向。
    - - 形成決定(第8段)
      - 450元方案以【】的同意票【】；班上也約定不強迫購買，有困難可以另外討論。
    - - 作者觀點(第9段)
      - 盲目堅持己見和一味【】，都無助於團體決策。大家要【】、接納差異，才較可能形成共同決定。
    answers:
    - 班服投票
    - 政見發表
    - 八百元
    - 吸濕排汗衫
    - 共識
    - 超完美決策
    - 折衷方案
    - 三分之二以上
    - 通過
    - 妥協退讓
    - 衡量得失
  - type: passage
    source: unknown
    paragraphs:
    - 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出不同方案的主張、理由與盲點。
    - 我能看出不同觀點如何讓方案改變，形成共同決定。
    - 我能從討論和決定的過程，讀出作者的看法。
