lesson_uid: L0069
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p9~p10）；文字層的（　）內已填有同樣的代號
  questions:
  - index: 1
    answer: A
    stem: 根據本文第8段，全班最後作出什麼決定？
    options:
      A: 四百五十元方案通過，班服不強迫購買，有困難可再討論
      B: 五百元方案全數通過，所有同學都必須購買共同班服
      C: 四百五十元由班長決定，第一組負責安排全班購買事宜
      D: 五百元由總務決定，有經濟困難的同學可以不用參與投票
  - index: 2
    answer: B
    stem: 本文第5段，宜靜所說的「另一種資源的浪費」主要是指什麼？
    options:
      A: 班服價格太高，可能讓園遊會缺少足夠的擺攤基金
      B: 衣服雖然便宜，若沒人願意穿，仍可能很快被丟棄
      C: 同學只重視衣服外表，可能忽略排汗與透氣的功能
      D: 低價排汗衫不夠正式，難以成為班級共同的標誌
    explanation: 宜靜認為低價排汗衫的版型與剪裁不理想，可能讓大家不想穿，畢業後很快被當成抹布，因此仍是浪費
    explanation_note: 原稿是一個浮動說明框，印在選項 A～D 右側
  - index: 3
    answer: D
    stem: 本文第6段，班長的發言對整場討論最重要的作用是什麼？
    options:
      A: 立即宣布支持者較多的方案，以免班會衝突繼續擴大
      B: 要求兩組放棄原來方案，重新設計第三種全新的班服
      C: 將討論縮小為價格問題，先決定四百五十元是否合理
      D: 整理各方重視的條件，把方案競爭改成共同尋找答案
    explanation: 3.班長整理大家的意見，並提出「多數人能接受，也不讓少數人為難」的討論方向
    explanation_note: 原稿是一個浮動說明框，印在選項 A～C 左側
  - index: 4
    answer: D
    stem: 本文第9段把不同意見比成「絲線」，把共同決定比成「班服」。這個比喻主要有什麼作用？
    options:
      A: 強調製作一件班服，需要準備許多材料與複雜工序
      B: 說明班上意見過於零散，很難整理成有用的討論結果
      C: 暗示所有人的意見都要相同，班級才可能真正團結
      D: 把抽象的意見整合寫得具體，也呼應全文的班服主題
    explanation: 4.「絲線織成班服」將不同意見經過聆聽、衡量與整合，形成共同決定的過程具體化，也和全文的班服主題前後呼應
    explanation_note: 原稿是一個浮動說明框，印在選項 A～D 右側
  - index: 5
    answer: C
    stem: 下列哪一項最能概括本文主旨？
    options:
      A: 班服能留下共同回憶，因此選擇班服時應優先考量紀念價值
      B: 班服是運動會的重要服裝，因此選擇時應以舒適實用為主要考量
      C: 團體決策要聽見不同需求、衡量得失，也要照顧少數同學的困難
      D: 團體討論難免出現不同意見，最後仍應以多數票決定適合的方案
    explanation: 全文從兩組方案、同學質疑、班長統整到最後表決，強調聆聽需求、衡量得失與照顧少數。
    explanation_note: 原稿是一個浮動說明框，印在選項 D 下方（跨 p9～p10）
