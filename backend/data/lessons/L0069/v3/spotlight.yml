lesson_uid: L0069
version_id: v3
section_no: 五
spotlight:
  strategy_name: 比較多元觀點
  strategy_type: multi_perspective
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  structure_note: '⛔ 兩張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。

    層級關係改用 guide 標題（一～四）表達。'
  blocks:
  - type: concept_box
    text: '有些文章會針對同一件事，呈現不同的看法。讀這類文章，可以依序：

      ❶確定議題：大家在討論什麼？

      ❷找出觀點：各方主張什麼？理由是什麼？

      ❸比較觀點：各方重視什麼？還有哪些地方沒顧到？

      ❹看觀點的影響：不同看法如何改變後面的判斷或決定？

      這一課，我們要看看不同的班服觀點如何影響全班的決定。'
  - type: guide
    text: 一、確定議題
  - type: single
    prompt: 這場班會一開始在討論哪一個問題？（單選）
    options:
      1: 班上要不要製作班服。
      2: 哪一個班服方案較適合全班。
      3: 班服的價格應該訂多少元。
    answer: 2
  - type: guide
    text: 二、找觀點：整理方案的理由與盲點
  - type: fill_table
    prompt: 1.兩組分別提出班服方案。請整理各組的主張、理由、主要考量與盲點。
    columns:
    - 組別
    - 要素
    - 請根據課文內容填答或勾選
    answer_carrier: 紅色 ☑（w:sym），PDF p5~p6 可見；8 個 ☑
    table_note: 原稿的「組別」欄是跨 4 列的合併儲存格，本檔在每一列重複寫值（keyed row 沒有合併概念）。
    rows:
    - 組別: 第一組
      要素: 主張
      請根據課文內容填答或勾選: 採用八百元的高質感班服。
    - 組別: 第一組
      要素: '理由

        (複選)'
      請根據課文內容填答或勾選: '①潮牌風加上重磅純棉，外觀與材質較有質感。

        ②班服能留下共同紀念，也能展現班級凝聚力。

        ③班服只穿幾次，省下的錢可以作為園遊會基金。'
      請根據課文內容填答或勾選_options:
        1: 潮牌風加上重磅純棉，外觀與材質較有質感。
        2: 班服能留下共同紀念，也能展現班級凝聚力。
        3: 班服只穿幾次，省下的錢可以作為園遊會基金。
      請根據課文內容填答或勾選_answers:
      - 1
      - 2
    - 組別: 第一組
      要素: 主要考量
      請根據課文內容填答或勾選: '①美感、品質、紀念價值與班級凝聚力。

        ②價格、舒適、實用與園遊會經費。'
      請根據課文內容填答或勾選_options:
        1: 美感、品質、紀念價值與班級凝聚力。
        2: 價格、舒適、實用與園遊會經費。
      請根據課文內容填答或勾選_answer: 1
    - 組別: 第一組
      要素: 盲點
      請根據課文內容填答或勾選: '育勤提醒：

        ①價格過高，可能造成家庭負擔；不購買的同學也可能感到被排擠。

        ②版型和剪裁不理想，可能讓同學不想穿，最後造成資源浪費。'
      請根據課文內容填答或勾選_options:
        1: 價格過高，可能造成家庭負擔；不購買的同學也可能感到被排擠。
        2: 版型和剪裁不理想，可能讓同學不想穿，最後造成資源浪費。
      請根據課文內容填答或勾選_answer: 1
    - 組別: 第二組
      要素: 主張
      請根據課文內容填答或勾選: 採用兩百元的排汗衫。
    - 組別: 第二組
      要素: '理由

        (複選)'
      請根據課文內容填答或勾選: '①排汗衫價格較低，涼快透氣，適合運動會穿。

        ②高質感純棉能留下共同紀念，也能展現凝聚力。

        ③班服只穿幾次，省下的錢可以作為園遊會基金。'
      請根據課文內容填答或勾選_options:
        1: 排汗衫價格較低，涼快透氣，適合運動會穿。
        2: 高質感純棉能留下共同紀念，也能展現凝聚力。
        3: 班服只穿幾次，省下的錢可以作為園遊會基金。
      請根據課文內容填答或勾選_answers:
      - 1
      - 3
    - 組別: 第二組
      要素: 主要考量
      請根據課文內容填答或勾選: '①美感、品質、紀念價值與班級凝聚力。

        ②價格、舒適、實用與園遊會經費。'
      請根據課文內容填答或勾選_options:
        1: 美感、品質、紀念價值與班級凝聚力。
        2: 價格、舒適、實用與園遊會經費。
      請根據課文內容填答或勾選_answer: 2
    - 組別: 第二組
      要素: 盲點
      請根據課文內容填答或勾選: '宜靜提醒：

        ①價格過高，可能造成家庭負擔；不購買的同學也可能感到被排擠。

        ②版型和剪裁不理想，可能讓同學不想穿，最後造成資源浪費。'
      請根據課文內容填答或勾選_options:
        1: 價格過高，可能造成家庭負擔；不購買的同學也可能感到被排擠。
        2: 版型和剪裁不理想，可能讓同學不想穿，最後造成資源浪費。
      請根據課文內容填答或勾選_answer: 2
  - type: single
    prompt: 2.育勤和宜靜的發言，有什麼共同作用？（單選）
    options:
      1: 各自支持另一組方案，使兩組的立場更加對立。
      2: 指出原來兩個方案都不可行，應該全部重新設計。
      3: 補充原方案沒有顧到的需求，讓討論更加完整。
      4: 提醒班長立即進行表決，用多數票結束討論。
    answer: 3
  - type: guide
    text: 三、無共識時，怎麼做團體決策？
  - type: guide
    text: 兩組方案各有考量，也各有盲點，若各自堅持，就無法做出決定。這個班級後續又怎麼找到共識，形成共同決定呢？
  - type: fill_table
    prompt: 三、無共識時，怎麼做團體決策？
    columns:
    - 討論的發展
    - 課文中的做法
    - 對決定的影響
    answer_carrier: 紅色 ☑（w:sym）與橘色手寫字，PDF p6~p7 可見；4 個 ☑
    rows:
    - 討論的發展: 班長整理意見
      課文中的做法: 班長整理美感、家庭負擔、舒適與紀念價值，並提出要找出多數人能【　】，也不讓少數人【　】的方案。
      課文中的做法_blanks:
      - answer: 接受
      - answer: 為難
      對決定的影響: '①把討論從「哪一組獲勝」轉向「共同方案要兼顧哪些條件」。

        ②把討論從「選哪一組方案」轉向「哪個價格得到最多票數」。'
      對決定的影響_options:
        1: 把討論從「哪一組獲勝」轉向「共同方案要兼顧哪些條件」。
        2: 把討論從「選哪一組方案」轉向「哪個價格得到最多票數」。
      對決定的影響_answer: 1
    - 討論的發展: 夏恩調整想法
      課文中的做法: 夏恩不再死守兩百元；提議先決定大家能接受的【　】，再由第一組【　】。
      課文中的做法_blanks:
      - answer: 價錢
      - answer: 設計、詢價
      對決定的影響: '①保留兩組原來的方案，再交由全班投票選出其中一組。

        ②保留價格考量，也把美感與設計放進新的方案。'
      對決定的影響_options:
        1: 保留兩組原來的方案，再交由全班投票選出其中一組。
        2: 保留價格考量，也把美感與設計放進新的方案。
      對決定的影響_answer: 2
    - 討論的發展: 折衷方案出現
      課文中的做法: 芳綺提出500元的折衷方案，供大家討論。
      對決定的影響: '①拒絶了兩組先前的提案，重新提出新的想法。

        ②討論後，最後留下450元和500元兩個案子，供全班表決。'
      對決定的影響_options:
        1: 拒絶了兩組先前的提案，重新提出新的想法。
        2: 討論後，最後留下450元和500元兩個案子，供全班表決。
      對決定的影響_answer: 2
      option_note: 選項①原稿印「拒絶」（絶＝絕的異體），照原稿保留。
    - 討論的發展: 全班形成決定
      課文中的做法: 450元方案獲得三分之二以上同意；且班服不強迫【　】，有經濟困難可以【　】。
      課文中的做法_blanks:
      - answer: 購買
      - answer: 另外提出來討論
      對決定的影響: '①全班以投票做決定，也照顧少數同學的困難。

        ②全班以多數票決定後，所有同學都要照結果購買。'
      對決定的影響_options:
        1: 全班以投票做決定，也照顧少數同學的困難。
        2: 全班以多數票決定後，所有同學都要照結果購買。
      對決定的影響_answer: 1
  - type: guide
    text: '你發現了嗎？

      不同觀點能補足盲點，幫助大家做出共同決定：

      同學指出盲點→班長整理需求→夏恩調整方案→ 折衷方向出現→全班投票決定，也照顧少數同學'
  - type: guide
    text: 四、從討論過程讀出作者看法
  - type: single
    prompt: 根據上表，下列哪一項最能表達作者的觀點？（單選）
    options:
      1: 團體決策要盡快進行表決，避免不同意見讓衝突繼續擴大。
      2: 團體決策要聽懂不同需求、衡量方案得失，也照顧少數同學的困難。
      3: 團體決策要把兩個方案各取一半，讓不同立場各退一步。
      4: 團體決策只要依照多數意見，少數同學就應該配合。
    answer: 2
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出不同方案的主張、理由與盲點。
    - 2.我能看出不同觀點如何讓方案改變，形成共同決定。
    - 3.我能從討論和決定的過程，讀出作者的看法。
    instruction_note: 本課自我檢核**沒有**印「如果你有做到，請在□中打勾。」那一行（與 L0061 不同），未自行補上。
