  answer_paths_note: "9 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有錯字。\n⚠️ 幾何交叉驗證：document.xml 有 **10 個 roundRect**，讀圖只看到 9 個圈。\n依旋轉角分群後，前 9 個與讀圖逐一對得上：\n・rot=16200000（4 個）＝ 4 條橫向：迫不及待(4格)、凝聚力(3格)、盲點(2格)、共識(2格)\n・rot=10800000（4 個）＝ 4 條直向：衡量得失(4格)、激昂(2格)、妥協(2格)、折衷(2格)\n・rot=7835602（1 個，cy=2049813 最長）＝ 斜向的摩拳擦掌\n多出來的第 10 個**不是漏抽的答案，它被錨在紙張外面**，兩項證據：\n① 錨點 `positionH relativeFrom=\"rightMargin\" posOffset=5264785`（≈5.76in）——\n   右邊界在距頁左 6646545 EMU 處（頁寬 11906 twips＝8.27in，左右邊界各 1440 twips），\n   所以這個框的左緣落在距頁左 ≈13.0in，比紙張右緣還要外面約 4.8in，永遠不會印出來。\n   另外九個都是 `relativeFrom=\"column\"` 且位移在 ±1in 內，就貼在格子上。\n② 框線顏色是寫死的 `E97132`，另外九個都是佈景主題色 `accent2`。\n灰框只有 9 個詞，逐格取字重查整張格子也沒有第 10 個目標語詞可對。\n⛔ 未憑數量硬塞第 10 條路徑（同 L0061 的 11 vs 10、L0053 的 11 vs 10）。"
