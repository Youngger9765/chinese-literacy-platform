key_reading:
  instruction: 請用計時器，從指定段落（六　)開始朗讀，計時1分鐘讀的字數，並記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學來計時、記錄並簽名！
  instruction_note: 括號內的 ☞ 是圖形物件，文字流只有「（六　)」的空白；右括號在原稿是半形。
