  passage: 兩組一直無法對班服方案達成共識，台上的氣氛一度顯得有些緊繃。這時，擔任會議主席的班長說話了：「謝謝兩組代表的精采介紹，也謝謝同學們提供了不同方向的分析。我們討論的目的，不是要爭辯出一個人人滿意的『超完美決策』，而是做出班上『比較多人贊同』的決策，也不能只看哪一邊人比較多，重要的是找出多數人能接受、也不讓少數同學為難的方案。剛才大家在意的不只有美感，還包括家庭負擔、舒適和紀念價值。兩組的方案看起來差很多，我們有可能找出一個兼顧這些需求的折衷方案嗎？」
