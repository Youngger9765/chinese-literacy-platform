vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 摩拳擦掌
  - 凝聚力
  - 激昂
  - 盲點
  - 共識
  - 折衷
  - 妥協
  - 迫不及待
  - 衡量得失
  items:
  - index: 1
    word: 迫不及待
    definition: 心情很急切，等不及要立刻去做。
  - index: 2
    word: 摩拳擦掌
    definition: 形容已做好準備，很想立刻開始。
  - index: 3
    word: 凝聚力
    definition: 讓一群人團結在一起、共同努力的力量。
  - index: 4
    word: 激昂
    definition: 情緒高昂，說話充滿力量與熱情。
  - index: 5
    word: 盲點
    definition: 自己沒有注意到的問題或不足。
  - index: 6
    word: 共識
    definition: 大家經過討論後，共同接受的想法或決定。
  - index: 7
    word: 折衷
    definition: 考量不同意見，找出各方較能接受的做法。
  - index: 8
    word: 衡量得失
    definition: 比較一件事的好處和壞處，再做決定。
  - index: 9
    word: 妥協
    definition: 為了解決爭議，願意放棄部分原來的要求。
