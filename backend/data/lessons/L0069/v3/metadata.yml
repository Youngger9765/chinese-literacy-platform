_總表_對照note: '🔴 總表這一列的 11 個語詞與學習單的 9 個**完全不重疊**，不是漏一兩個而是整組不同：

  ・總表：宛如、政見、呵護、中計、糾正、抗拒、箭步、莽撞、異口同聲、大展身手、脫口而出

  ・學習單：摩拳擦掌、凝聚力、激昂、盲點、共識、折衷、妥協、迫不及待、衡量得失

  學習單自己的四處（語詞框／第三大題 9 題／第四大題代號表 A~I／第八大題找字灰框）

  內容一致，所以是**總表這一列沒跟上改稿**，不是抽取錯。

  佐證：總表那組語詞（呵護／中計／糾正／莽撞）講的是人物互動，與本課「班會思辨討論」對不上；

  唯一沾得上邊的「政見」在課文裡是「政見發表」的一部分，但它不在學習單的語詞清單裡。

  ⛔ 未自行以學習單覆蓋總表 —— 那要改的是 xlsx，不是這份抽取。

  （同型：L0061 也是整組不重疊。）'
