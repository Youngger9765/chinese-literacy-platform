strategy_explained: '這一課要練習的是，學會看看別人是怎麼想的，而且還要想想為什麼他們會那樣想

  你看這篇故事，班上同學為了班服，有人覺得設計比較重要，有人覺得價錢比較實在，每個人都有自己的道理，這篇文章就讓我們看到大家不同的想法是怎麼出現的

  讀的時候，你可以試著想想，如果換成是你，你會怎麼想，然後看看文章裡的人物是怎麼讓大家都能接受的'
