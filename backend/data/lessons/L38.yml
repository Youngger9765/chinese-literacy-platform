multiple_choice:
- question: 依據本文的定義：「灰犀牛指的是正在發生、明明可見的負面事件，但因為沒有急迫性，大家卻視而不見。」請問何者狀況不是灰犀牛？
  options:
  - 少子化。
  - 高齡化。
  - 氣候變遷。
  - 俄烏戰爭。
  answer: D
  explanation: 俄烏戰爭是正在發生的負面事件，且具有高度的急迫性，並非「因為沒有急迫性，大家卻視而不見」的灰犀牛事件。
- question: 有關人口負成長的說明，何者正確?
  options:
  - 人口負成長是出生率大於死亡率。
  - 人口負成長的因素是人口大量外移。
  - 未來臺灣的被扶養人數將會逐步升高。
  - 臺灣的生育率逐年升高，全球第一。
  answer: C
  explanation: A錯：出生率小於死亡率。；B錯：負成長定義是出生率小於死亡率，所以外移不會影響出生率及死亡率，人口負成長的因素是少子化。；D錯：臺灣的少子化較國外嚴重。
- question: 臺灣2020年後開始人口負成長，影響了臺灣社會，請問人口負成長所帶來的影響為何?
  options:
  - 未來人力的短缺。
  - 青壯年經濟負擔減輕。
  - 育齡婦女人數下滑。
  - 醫療更趨進步。
  answer: A
  explanation: B錯：加重，因為扶養的人變多了；C錯：此為人口負成長的原因。；D錯：與人口負成長無關。
- question: 臺灣的少子化已經成為政府的一大危機，有專家學者認為或許可以透過國家邊境開放政策，讓國民人數增加。請問根據上述的內容判斷，下列哪一個對策與專家的意見最相符？（改寫112年社會科會考題）
  options:
  - 提高外籍移工的雇用人數。
  - 鼓勵各國人才的移民臺灣。
  - 推動老人長期照顧政策。
  - 增加公立幼兒托育中心。
  answer: B
  explanation: 由國家邊境開放政策可知，是讓外來的人口移民臺灣，以增加人口數，故答案為Ｂ
