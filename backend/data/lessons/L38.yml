- sentence: 省略符號：省略不需要用到的刻度。
  answer: 斷裂符號
- sentence: 用點來表示橫軸和縱軸上的兩組數字，依序用直線把這些點連起來。
  answer: 折線圖
- sentence: 全天最高溫是（　22　）度，在（　13　）時，最低溫是（　12　）度，在（　17　）時。
  answer: '22'
- sentence: 從（　15　）時開始溫度越來越低。
  answer: '15'
- sentence: 相鄰的兩時刻中，溫度變化最大的是（　15　）時到（　16　）時，相差（　4　）度。
  answer: '15'
- sentence: 2018年的市場占有率是（　12　）%。
  answer: '12'
- sentence: 2020年的市場占有率是2015年的（　10　）倍。
  answer: '10'
- sentence: 2019~2020年的市場占有率成長了（　6　）%。
  answer: 無法得知
- sentence: 圖二告訴我們「Ａ牌奶粉在市場的佔有率」和「年份」有什麼關係？  Ａ牌奶粉在市場的佔有率呈現逐年成長的趨勢
  answer: 死亡人數
- sentence: 根據資料完成折線圖和標題。
  answer: 臺灣出生死亡人數交叉
- sentence: 請問幾歲到幾歲小倫的體重有下降（　7 ）歲～（　8　）歲，下降了幾公斤？ （　2 ）公斤。
  answer: 文章未提供此資訊
