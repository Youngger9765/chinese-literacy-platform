version_id: v3
section_no: 五
comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    stem: 下列選項「」中字，何者字音、字義完全正確？
    options:
      A: 「豈」荀巨伯所行邪——ㄎㄞˇ，難道
      B: 友人有疾，不忍「委」之——ㄊㄨㄛ，委託
      C: 「寧」以我身代友人命——ㄋㄧㄥˊ，寧願
      D: 「遂」班軍而還——ㄓㄨˊ，於是
    answer: C
    explanation: '第1題解析：

      A字音ㄑㄧˇ；

      B字音ㄨㄟˇ，字義「拋下」；

      D字音ㄙㄨㄟˋ。'
  - index: 2
    stem: 關於「重義的荀巨伯」一文的寫作手法，下列敘述何者最恰當？
    options:
      A: 運用對話，凸顯人物個性
      B: 夾敘夾議，事理分析清楚
      C: 全文採第一人稱敘述
      D: 以設問法結尾，激發讀者思考
    answer: A
    explanation: '第2題解析：

      B夾敘夾議，一段敘述，一段議論，常見於議論文的結構。C本文使用第三人稱敘述；敘述者不是荀巨伯，也不是荀巨伯的朋友或胡兵。D結尾沒有提出問題。'
  - index: 3
    stem: 下列哪一個選項，最能看出荀巨伯的人格特質？
    options:
      A: 荀巨伯遠看友人疾，值胡賊攻郡
      B: 我輩無義之人，而入有義之國
      C: 大軍至，一郡盡空，汝何男子，而敢獨止
      D: 友人有疾，不忍委之，寧以我身代友人命
    answer: D
    explanation: '第3題解析:

      D荀巨伯不忍心丟下朋友自己逃命，甚至願意為了朋友犧牲，可見他有多麼重視道義。'
  - index: 4
    stem: 下列哪一個選項中的代詞代表荀巨伯的朋友？
    options:
      A: 「吾今死矣，子可去」的「子」
      B: 「友人有疾，不忍委之」的「之」
      C: 「汝何男子，而敢獨止」的「汝」
      D: 「遠來相視，子令吾去」的「吾」
    answer: B
    explanation: '第4題解析:

      A、C、D都是指荀巨伯。'
  - index: 5
    stem: 「重義的荀巨伯」一文的主旨近似於下列何者？
    options:
      A: 勿以善小而不為，勿以惡小而為之
      B: 改變自己是自救，影響別人是救人
      C: 良藥苦口利於病，忠言逆耳利於行
      D: 為人若真誠有德，自能感召人心
    answer: D
  - index: 6
    stem: 武俠小說中的人物，常以謙遜的口吻自稱。下列哪個人物沒有使用自謙詞？
    options:
      A: 鐵心蘭：「妾身就此告退。」
      B: 花無缺：「承蒙閣下對本人的指點。」
      C: 燕南天：「這劍法確實是在下自創。」
      D: 小魚兒：「敝人這就前往一探究竟。」
    answer: B
    explanation: '第6題解析:

      妾身，女子自稱的謙虛用法；

      閣下，您，敬稱，

      本人，不含謙遜意圖的自稱；

      在下，我，自謙詞；

      敝人，我，自謙詞。'
  notes:
    answer_carrier: 橘色代號（在文字層），PDF p7~p8 可見
