version_id: v3
classical_text:
  label: 原文
  source: 南朝宋・劉義慶(編)
  has_qr: true
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  paragraphs:
  - 荀巨伯.遠看.友人疾，值胡賊.1攻郡。友人語巨伯.曰：「吾今.死矣，子可去！」巨伯曰：「遠來.相視2，子令.吾去；敗義.以求生，豈.荀巨伯所行邪？」
  - 賊既至，謂巨伯曰：「大軍至，一郡.盡空，汝何.男子，而敢獨止？」巨伯曰：「友人有疾，不忍.委之，寧以我身.代友人命。」賊相謂曰：「我輩.無義之人，而入.有義之國！」遂.班軍而還，一郡並獲全。
  annotations:
  - 'no': 1
    term: 胡賊
    text: 胡，古代對外族的通稱，秦、漢時多指北方的匈奴。因外族入侵中國，中國屬於「被侵略者」，所以稱外族的軍隊為「胡賊」，表示鄙視、憤怒的情緒。
  - 'no': 2
    term: 「相」視
    text: 具代詞功能的助詞。這裡的代詞指的是「你」；「相視」的意思是「看你」。
