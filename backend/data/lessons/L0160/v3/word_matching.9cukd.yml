    文言: 賊相謂曰：「我輩無義之人，而入有義之國！」遂班軍而還，一郡並獲全。
    白話: 在場的胡兵聽了這番話(　)議論說：「(　)這些不懂(　)的人，竟然(　)了這樣重道義的國家！」(　)撤軍回去，整座城的人因此全都(　)了保全。
