    - answer: 我
    - answer: 死了
    - answer: 你
  - index: 3
    文言: 巨伯曰：「遠來相視，子令吾去；敗義以求生，豈荀巨伯所行邪？」
    白話: 巨伯說：「我遠道來(　)，現在有危險了，(　)就叫(　)丟下你自己逃命去；這種敗壞(　)而(　)生路的事，(　)我荀巨伯做得出來嗎？」
