strategy_explained: '這一課我們要練習的是，怎麼看懂古時候的中文，特別是辨識裡面用來指人的詞，這樣你就能更清楚誰在跟誰說話

  這篇故事裡，荀巨伯為了救朋友，不惜冒著生命危險，這樣的行為很感人，而我們要練習的，就是透過辨識裡面的代詞，更能體會他為何這麼做

  讀的時候，你可以試著把文言文裡的「彼」「之」等字，先換成你比較熟悉的「他」「她的」或「他的」，看看句子意思是不是更清楚了'
