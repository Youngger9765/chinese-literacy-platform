intro: 這篇文章講述了東漢時期一位名叫荀巨伯的人，在動盪不安的年代，面對友人重病，以及戰亂逼近的危險情況。儘管身處險境，荀巨伯卻選擇堅守情義，不願獨自逃離。面對來襲的盜賊，他更是展現了非凡的勇氣和擔當，以自己的生命來保護生病的友人。故事透過荀巨伯的行為，呈現了在艱難時刻，一個人如何選擇面對困境，以及「義」在人們心中的重要價值。
