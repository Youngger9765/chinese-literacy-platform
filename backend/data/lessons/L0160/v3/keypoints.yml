lesson_uid: L0160
version_id: v3
section_no: 三
keypoints:
  label: 三、文章重點表
  intro: '在<不量田>那一課，我們使用故事體結構 (故事背景、起因、問題、解決、結果) 來掌握文章重點；之前的課文<黑猩猩的守護者>同樣也教我們運用故事體結構(故事背景、起因、經過、結果)來理解文章。

    等等！同樣是故事體結構，怎麼好像有點不一樣？

    其實兩者都對，差別在於一個重視問題如何解決，另一個則偏重故事的時間順序。

    想一想：<重義的荀巨伯>可以用哪一種結構方式來整理呢？'
  instruction: 如果你已經有想法了，請配合課文內容完成下表，注意左欄有一個小空格也要填寫哦！
  layout: list
  column_note: 表格欄名是「故事結構／內容摘要」；內容摘要欄下另印「【 】處填入原文，找不到原文時，再用自己的話寫。」
  answer_carrier: 橘色手寫（在文字層），PDF p5 可見
  rows:
  - label: 起因
    value: 【　】去看望【　】，卻遇上胡兵準備攻打朋友所在的城邑。
    blanks:
    - answer: 荀巨伯
    - answer: 友人疾/生病的朋友
  - label: 【　】
    label_blanks:
    - answer: 經過
    label_note: 這一列的**標籤本身**就是要填的空格（就是 instruction 說的「左欄有一個小空格」）
    items:
    - label: 胡兵攻城前
      value: '1.荀巨伯的朋友因為拖著病體跑不了，就勸荀巨伯趕快逃。

        2.荀巨伯告訴朋友，自己絕不會做【　】的事。'
      blanks:
      - answer: 敗義以求生/敗壞道義而求取生路
    - label: 胡兵入城後
      value: '1.胡兵發現竟然還有人沒逃，驚訝地問荀巨伯為何不逃跑？

        2.荀巨伯回答：因為不忍心【　】，所以才沒逃，甚至表達【　】代替朋友死。'
      blanks:
      - answer: 委之/拋下朋友
      - answer: 寧以我身/寧願用自己的命
  - label: 結果
    value: 胡兵被荀巨伯的捨命護友的情操感動，於是決定【　】，一城的人因此倖免了一場可能的戰爭。
    blanks:
    - answer: 班軍而還/撤兵回去
