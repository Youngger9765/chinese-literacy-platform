lesson_uid: L0160
version_id: v3
section_no: 一
sentence_matching:
  label: 一、文白句子比對
  instruction: '請模仿例句作法：

    ❶閱讀參考句；❷找出參考句對應的原文；❸將對應的原文(  )起來

    ❹在下方的[  ]寫上參考句代號。'
  instruction_note: '本課的作法是「先讀參考句、再去原文圈範圍」，與同批 L0162／L0163 的

    「先讀原文、再找參考句」方向相反 —— 三課的指示語照各自原稿抄，不要互相套用。'
  answer_carrier: 橘色數字（在文字層；顏色 run 層與 rStyle 兩條路徑都有），PDF p2~p3 可見
  example:
    文言: 荀巨伯遠看友人疾
    answer: 9
    marker_note: 例句在參考句清單上是第［９］條，該條被劃掉並在左邊加了一個 ☞ 圖形（w:drawing）
  reference_sentences:
    1: 這種敗壞道義而求取生路的事，難道我荀巨伯做得出來嗎
    2: 寧願用我的命換我朋友的命
    3: 正巧遇上胡兵準備攻打這座城
    4: 你是什麼人？竟敢獨自留在這裏？
    5: 於是撤軍回去，整座城的人因此全都獲得了保全
    6: 朋友告訴荀巨伯說：「我就要死了，你趕快離開吧！」
    7: 我的朋友身患重病，我不忍心拋下他，
    8: 我們這些不懂道義的人，竟然入侵了這樣重道義的國家
    9: 荀巨伯到很遠的地方去看望生病的朋友
    10: 大軍到來，整座城全部都空了
    11: 在場的胡兵聽了這番話相互議論說
    12: 胡兵進城後，一看見荀巨伯就說
    13: 我遠道來看你，現在有危險了，你就叫我丟下你自己逃命去
  reference_sentences_note: ［１］～［９］的號碼印成全形，［10］～［13］印成半形，原稿如此
  items:
  - 文言: 值胡賊攻郡
    answer: 3
  - 文言: 友人語巨伯曰：「吾今死矣，子可去！」
    answer: 6
  - 文言: 遠來相視，子令吾去
    answer: 13
  - 文言: 敗義以求生，豈荀巨伯所行邪
    answer: 1
  - 文言: 賊既至，謂巨伯曰
    answer: 12
  - 文言: 大軍至，一郡盡空
    answer: 10
  - 文言: 汝何男子，而敢獨止
    answer: 4
  - 文言: 友人有疾，不忍委之
    answer: 7
  - 文言: 寧以我身代友人命
    answer: 2
  - 文言: 謂曰
    answer: 11
  - 文言: 我輩無義之人，而入有義之國
    answer: 8
  - 文言: 遂班軍而還，一郡並獲全
    answer: 5
  items_note: '第 11 條的括號在原稿裡只圈到「謂曰」（「賊相謂曰」的「賊相」兩字落在括號外、

    而且「賊」被排到上一行行首），對應的參考句卻是整句「在場的胡兵聽了這番話相互議論說」。

    照原稿的括號範圍抄，不擴大。'
