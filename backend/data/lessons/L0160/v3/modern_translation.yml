version_id: v3
modern_translation:
  label: 古文今譯
  paragraphs:
  - 荀巨伯到很遠的地方去看望生病的朋友，正巧遇上胡兵準備攻打這座城。朋友告訴荀巨伯說：「我就要死了，你趕快離開吧！」荀巨伯說：「我遠道來看你，現在有危險了，你就叫我丟下你自己逃命去，這種敗壞道義而求取生路的事，難道我荀巨伯做得出來嗎？」
  - 胡兵進城後，一看見荀巨伯就說：「大軍到來，整座城全部都空了，你是什麼人？竟敢獨自留在這裏？」荀巨伯說：「我的朋友身患重病，我不忍心拋下他，寧願用我的命換我朋友的命。」
  - 在場的胡兵聽了這番話相互議論說：「我們這些不懂道義的人，竟然入侵了這樣重道義的國家！」於是撤軍回去，整座城的人因此全都獲得了保全。
