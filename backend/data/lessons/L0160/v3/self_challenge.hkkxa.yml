self_challenge:
  label: 六、自我挑戰
  title: 人稱代詞挑戰題
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  passage: 濟陰之賈人，渡河而亡其舟，棲於浮苴1之上，號呼救命。有漁者以舟往救之。未至，賈人曰：「我富者也，能救我，予爾百金！」漁者載而登陸，則予十金。漁者曰：「向2許百金，而今但予十金？」賈人勃然作色3曰：「若漁者也，一日捕魚能獲幾何？而驟4得十金，猶爲不足乎？」漁者黯然而退。他日，賈人舟又覆，而漁者在焉。或曰：「何以不救？」漁者曰：「是許金而不酬者也！」未久，賈人沒。
  annotations:
  - 'no': 1
    term: 浮苴
    text: 浮在水面的水草。苴，音ㄐㄩ。
  - 'no': 2
    term: 向
    text: 剛才。
  - 'no': 3
    term: 勃然作色
    text: 憤怒、生氣，突然翻臉。
  - 'no': 4
    term: 驟
    text: 突然、一下子。驟，音ㄗㄡˋ。
  translation: '濟陰有位商人，渡河時船沉了，他趴在浮在水面的水草上大聲呼救。一位漁夫駕着船去救他。船還沒到，商人就大喊：「我是有錢人，你能救我，就給你一百兩銀子。」漁夫把他載到岸上後，商人卻只給漁夫十兩銀子。漁夫問他：「剛才你許諾給我一百兩銀子，怎麼現在只給十兩？」商人立刻變臉說：「你是個打漁的，一天能有多少收入？現在一下子得了十兩銀子，還不滿足嗎?⎦漁夫很失望地走開了。

    後來，商人的船又沉了，而漁夫剛好也在附近。有人見漁夫不動，便問他：「為何你不去救他？」漁夫回答說：「那個人是答應給我百兩銀子卻說話不算的人。」沒多久，商人就沉沒水中了。'
  items:
  - label: （一）
    instruction: 請依照故事脈絡，寫出畫底線字的人稱代詞及所指對象。
    answer_carrier: 橘色手寫（在文字層），PDF p9 可見
    questions:
    - index: 1
      prompt: 「濟陰之賈人，渡河而亡其舟」
      answer: 他的，賈人
    - index: 2
      prompt: 「有漁者以舟往救之」
      answer: 他，賈人
    - index: 3
      prompt: 「我富者也，能救我，予爾百金！」
      answer: 你，漁者
    - index: 4
      prompt: 「若漁者也，一日捕魚能獲幾何？」
      answer: 你，漁者
  quiz:
    label: （二）閱讀理解測驗
    questions:
    - index: 1
      stem: 關於本文，下列敘述何者正確？
      options:
        A: 「渡河」、「亡其舟」、「號呼救命」的人都是漁夫
        B: 漁夫是因為商人重賞才去救人的
        C: 依據文意，「向許百金」的「許」意思是「許諾」
        D: 商人的情緒變化依序是驚恐、高傲、憤怒、心虛
      answer: Ｃ
      answer_note: 這一題的答案代號印成全形「Ｃ」，第 2 題也是全形「Ｄ」，第 3 題是半形「B」，原稿如此
      explanation: '第1題解析：

        A主語都是賈人；B漁夫救人行動在先，商人才提酬金的事；

        D商人最後沉水，卻無人來救，應該是「後悔」、「絕望」。'
    - index: 2
      stem: 關於本文，下列敘述何者正確？
      options:
        A: 商人因為沒錢，所以跟漁夫討價還價酬謝金額
        B: 商人最後沒錢付酬金，乾脆逃跑，一走了之
        C: 漁夫救了商人兩次，共得酬金二十金
        D: 漁夫厭惡商人輕諾背信，才眼睜睜看商人溺斃
      answer: Ｄ
    - index: 3
      stem: 這個故事的主旨為何？
      options:
        A: 有錢能使鬼推磨
        B: 人須言而有信
        C: 得饒人處且饒人
        D: 多行不義必自斃
      answer: B
  notes:
    teacher: （老師可視同學情況決定是否做此大題）
    strategy_flow: '這三個箭號是文字層真的字元 U+2B62（⭢），不是 w:sym —— 全檔 w:sym 總數 0，

      所以照字面抄無誤。'
    translation_errata_ref: E1
