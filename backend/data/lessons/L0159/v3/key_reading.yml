lesson_uid: L0159
version_id: v3
key_reading:
  unit: 秒
  unit_note: 文言文計時的是「讀完全文要幾秒」，不是白話課的「1 分鐘幾字」；沒有累計字數欄、沒有 ☞ 起讀點
  instructions:
  - 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
  - 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  timing_table:
    columns:
    - 第1次計時
    - 第2次計時
    - 第3次計時
    - 裁判計時
    unit: 秒
    judge_signature: true
  benchmark_instruction: ◎ 我的表現：請確認讀完全文的時間。不要太快也不要太慢，不漏字或加字，斷詞的位置也要正確哦！
  benchmark:
  - threshold: 30秒以下
    feedback: 速度有點快，要讀清楚哦！
  - threshold: 30~40秒
    feedback: 強者就是你啦！
  - threshold: 40秒以上
    feedback: 速度再快一點！
  benchmark_note: 門檻比 L0158（40／50 秒）低，因為本課原文較短
