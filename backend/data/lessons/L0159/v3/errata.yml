  - id: E1
    section: 四 文言文聚光燈／二、換你試試看／練習一 第②句
    locator: 「裨將曰：『簇在膜內者，須亟治。』」的第一個字
    source: 簇
    corrected: 鏃
    kind: 錯字
    why: '本句講的是「箭頭還在肌肉裡」，本課注 5 就寫「鏃，箭鏃，箭頭。鏃，音ㄗㄨˊ」，

      而同一頁上方那張練習一原文圖印的也是「鏃⁵在膜內，須亟治」——

      只有文字層的第②句印成同音的「簇」。'
    confidence: high
    evidence: 'document.xml 全檔「鏃」3 次（注 5 的定義 2 次＋注號 1 次）、「簇」1 次（就是這一處）；

      p7 上方的練習一原文（圖）與第②句（文字層）同一句話用了不同的字。'
    handling_note: text 用「鏃」（線上用這個），source_text 保留原稿的「簇」（逐字門比對這個）。
