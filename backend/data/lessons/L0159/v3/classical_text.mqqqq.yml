classical_text:
  source_label: 明朝・馮夢龍
  paragraphs:
  - 明.有陸盧峰者，於京城.待用。嘗於市.遇一佳硯，議價.未定。既還邸，使門人.往，以一金.易歸。
  - 門人.持硯歸，公.訝其不類，門人.堅稱其是。公曰：「向觀硯.有鴝鵒眼，今何.無之？」答曰：「吾.嫌其微凸，路值.石工，幸有.餘銀，令.磨而平之。」公.大惋惜。
  annotations_label: 注釋
  annotations:
  - index: 1
    term: 鴝鵒眼
    text: 一種硯石。這種硯石上有圓點形狀的花紋，就像是鴝鵒鳥的眼睛，所以叫「鴝鵒眼」。
  notes:
    punctuation: '原文的「.」是學習單印的**斷詞記號**（朗讀說明第 2 條明寫），不是句號。

      「還／一／不」等字在文字層夾了隱藏 variation selector（U+E01Ex），比對前濾掉 Cf/Mn。'
    qr: 「明朝・馮夢龍」那一格右側印了一個 QR code
  slug: mqqqq
