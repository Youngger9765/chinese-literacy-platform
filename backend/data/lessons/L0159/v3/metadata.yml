intro: 這篇文章講述一位名叫陸公的人，在市集中看見一個非常喜愛的硯台，但當時價格還沒談妥。他回家後，派人去買了回來。然而，當硯台送達時，陸公卻覺得它和之前看到的樣子不一樣。門人堅稱是同一個，但陸公發現硯台上的「鴝鵒眼」不見了。原來是門人嫌「鴝鵒眼」有點凸起，在回來的路上找了石匠磨平了。陸公對此感到非常惋惜。這篇文章透過陸公買硯的過程，帶出了什麼樣的道理呢？讓我們一起來讀讀看。
strategy_explained: '這一課我們要練習看懂文言文時，怎麼找出句子真正的主角，以及把文言文的意思一句一句分清楚，就像偵探一樣找出句子裡藏的線索

  這篇「陸公買硯」的故事，因為描述陸公和門人之間的對話，還有陸公的心情變化，很適合我們練習判讀句子的意思和誰是說話者

  讀的時候，你可以試著在心裡或紙上圈出誰在做什麼，還有把一句一句的意思拆開來理解，這樣就能抓到文章裡講的道理了'
