lesson_uid: L0159
version_id: v3
section_no: 一
sentence_matching:
  instruction: '請模仿例句作法：

    ❶閱讀參考句；❷找出參考句對應的原文；❸將對應的原文(  )起來

    ❹在下方的[  ]寫上參考句代號。'
  label: 例句
  label_note: 本課只有一題（標「例句」），與 L0158 分成第一題／第二題不同
  answer_carrier: 橘色代號（**字元樣式 aff**，色 E97132；run 層只有 1 個），文字流有此資訊
  passage_paragraphs:
  - （明有陸盧峰者，於京城待用），（嘗於市遇一佳硯，議價未定）。
  - （既還邸，使門人往，以一金易歸）。
  - 　　（門人持硯歸，公訝其不類），(門人堅稱其是)。公曰：(「向觀硯有
  - 鴝鵒眼，今何無之？」)答曰：「(吾嫌其微凸，路值石工），(幸有餘銀，
  - 令磨而平之)。」(公大惋惜）。
  passage_note: '照原稿的**印刷斷行**分行（行與行之間另有一行放［N］代號）。

    ⚠️ 斷行處會把一個括號段切開（「向觀硯有／鴝鵒眼」「幸有餘銀，／令磨而平之」），

    那是版面換行不是兩段 —— segments 欄位裡是完整的段。括號有全形也有半形，照原樣。'
  reference_label: 參考句：
  reference_sentences:
    1: 剛才我看的硯臺有個八哥眼，現在為何沒有了
    2: 陸公感到十分可惜
    3: 我嫌棄它有點凸，路上正好遇見石工
    4: 僕人拿著硯臺回來，陸公驚訝它不像自己想買的那個
    5: 他曾在市集上見到一塊上好的硯臺，可是議價沒有成功
    6: 明朝有位叫陸盧峰的人，在京城等待朝廷的任用
    7: 幸好有剩餘的銀子，就叫他打磨讓微凸的地方平整了
    8: 回到官邸之後，他還是派僕人前往，用一兩銀子買硯臺回來
    9: 僕人卻堅持說它就是
