lesson_uid: L0159
version_id: v3
section_no: 五
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列選項「」中字，何者字音、字義完全正確？
    options:
      A: 「嘗」於市遇一佳硯——ㄔㄤˊ，曾經
      B: 既「還」邸，使門人往——ㄏㄞˊ，還是
      C: 吾嫌其微「凸」——ㄊㄨ，突出
      D: 公大「惋」惜——ㄨㄢˇ，可惜
    explanation: '第1題解析：

      B字音ㄏㄨㄢˊ，字義「返回」；

      C字音ㄊㄨˊ；

      D字音ㄨㄢˋ。'
  - index: 2
    answer: B
    stem: 根據「陸公買硯」一文，關於陸盧峰這個人的敘述下列何者正確？
    options:
      A: 玩物喪志，優柔寡斷
      B: 寬厚仁愛，度量很大
      C: 管理下屬，恩威並濟
      D: 言出必行，做事果斷
    explanation: '第2題解析：

      B由僕人任意花錢請人磨平主人(陸公)的硯臺，而陸公僅是「大惋惜」可知。'
  - index: 3
    answer: B
    stem: 「淳于恭，北海人。人有盜刈1恭禾者，恭見之，念其愧，因伏草中，至去乃起。」根據這則故事，下列敘述何者最恰當？
    stem_note: 「盜刈」後面的 1 是上標注號，照文字層原樣留在句中
    annotations:
    - 1.刈：音ㄧˋ，割取。
    annotations_note: 這條注釋前面印了一個裝飾符號（w:sym Wingdings F026），不在 w:t 裡，故不寫入
    options:
      A: 當時五穀歉收，盜賊四處搶糧
      B: 淳于恭個性溫厚寬容，能體恤他人
      C: 北海地區盜賊兇悍，人民不敢與之對抗
      D: 淳于恭伏於草中，乃心中有愧，不欲見人
    explanation: 第3題說明：本題是「不量田」一課主語判讀的練習題延伸。詳見該課P.11。
  - index: 4
    answer: C
    stem: 據「陸公買硯」一文，下列關於故事中人物的敘述，何者最恰當？
    options:
      A: 門人買錯硯臺卻不知道
      B: 陸公惋惜是因為石工技藝不佳
      C: 門人請人磨平硯眼是自作聰明
      D: 陸公對門人購硯的價格感到驚訝
  - index: 5
    answer: A
    stem: 下列何者不可能是「陸公買硯」一文的寓意？
    stem_note: 題幹的「不可能」在原稿加了底線強調
    options:
      A: 不聽老人言，吃虧在眼前
      B: 即使是好心也可能辦壞事
      C: 知人善任才不會反受其害
      D: 託人辦事，一定要先清楚溝通
    explanation: '第5題解析:

      A諺語。意思是不聽有經驗者的意見，往往會吃虧後悔。'
  - index: 6
    answer: D
    stem: 下列哪一選項的閩南語俗諺可以形容課文中的僕人？
    options:
      A: 痟貪軁雞籠
      B: 好心予雷唚
      C: 目睭花花，匏仔看做菜瓜
      D: 生雞卵的無，放雞屎的一大堆
    explanation: 'A嘲笑人一時恍神，把形狀相近的物品看成別的東西。

      B形容團體中沒有能帶來利益或好處的人，只有會惹事生非，帶來壞處或麻煩的人。

      C勸人千萬不要貪得無厭。

      D比喻好心沒報'
    explanation_note: '⚠️ 這個解析框的 A 與 B 兩條**跟選項對不起來**：A 條講的是選項 C（目睭花花）、

      B 條講的是選項 D（生雞卵的無）。原稿如此，照原樣抄、不重排

      （重排等於替教材決定哪一條配哪一項）。'
  notes:
    answer_carrier: 橘色手寫代號（字元樣式 aff），文字流有此資訊
    teacher_note_carrier: 藍色（156082）文字方塊，印在題目右側；第 4 題沒有解析
