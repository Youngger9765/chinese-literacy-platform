  passage: 塑膠幾乎無所不在，從飲料杯、外送餐盒、瓶子、鞋子、衣服、家具，到手機與汽車，處處有塑膠的蹤跡。它不怕水，又輕又便宜，因此被大量生產。1950年以來，全球塑膠產量成長了200多倍。麻煩的是，這些塑膠用品相當「長壽」，因為它們很難在自然界裡完全分解。全球每年產生的塑膠垃圾中，超過一半最後流入海洋、河流，或被棄置在環境中，它們不會乖乖消失，甚至可能以另一種形式回到我們身邊。當塑膠垃圾被陽光照射、海浪拍打，就會逐漸碎裂成塑膠微粒。魚、蝦、貝類會把它們當成食物吃下去，最後透過食物鏈，進入人體。科學家已經在人體血液、肺部，甚至母乳中發現塑膠微粒，雖然科學界還在研究這些物質對健康的影響，但已有證據顯示，它們可能增加癌症、糖尿病與心血管疾病的風險。科學家在世界最深的馬里亞納海溝和最高峰聖母峰都發現了塑膠微粒。從深海魚類到高山積雪，塑膠無遠弗屆，不但已遍布地球的極端角落，也可能進入人體。
