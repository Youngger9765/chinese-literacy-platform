  passage: 塑膠幾乎無所不在，從飲料杯、外送餐盒、瓶子、鞋子、衣服、家具，到手機與汽車，處處有塑膠的蹤跡。它不怕水，又輕又便宜，因此被大量生產。1950年以來，全球塑膠產量成長了200多倍。麻煩的是，這些塑膠用品相當「長壽」，因為它們很難在自然界裡完全分解。全球每年產生的塑膠垃圾中，超過一半最後流入海洋、河流，或被棄置在環境中，它們不會乖乖消失，甚至可能以另一種形式回到我們身邊。當塑膠垃圾被陽光照射、海浪拍打，就會逐漸碎裂成塑膠微粒。魚、蝦、貝類會把它們當成食物吃下去，最後透過食物鏈，進入人體。科學家已經在人體血液、肺部，甚至母乳中發現塑膠微粒，雖然科學界還在研究這些物質對健康的影響，但已有證據顯示，它們可能增加癌症、糖尿病與心血管疾病的風險。科學家在世界最深的馬里亞納海溝和最高峰聖母峰都發現了塑膠微粒。從深海魚類到高山積雪，塑膠無遠弗屆，不但已遍布地球的極端角落，也可能進入人體。臺灣的塑膠回收率大約是世界平均值的四倍，許多人會把寶特瓶、牛奶罐沖洗乾淨再丟回收桶，這些努力當然有幫助，但從全球來看，這點努力只能算是杯水車薪。全球每年產生的塑膠垃圾高達四億噸，被回收的不到一成，其餘被丟進掩埋場，或進入河流和海洋，成為環境長期的負擔。回收率這麼低的原因很多，例如民眾環境意識不足、法規及配套措施闕如、執行技術困難等等；就我們生活所見，分類回收桶數量不足、位置不便，加上塑膠種類繁多。還有難以分類的複合材包裝，常讓民眾猶豫是否該回收。餐盒與飲料杯若沾有油污與殘渣，也不容易清洗，常只能當一般垃圾丟棄。此外，分類、收運與再製的成本，甚至比製造新的塑膠成本更高，也影響了廠商回收的意願。雖然許多人都知道塑膠對環境的危害，也都知道源頭減產是解決問題的重要方向，但為什麼全球塑膠產量仍然有增無減呢？塑膠的原料是石油，對產油國和塑膠製品大國來說，塑膠是賺大錢的機會，減產勢必影響這些國家的經濟發展與就業機會。所以，2024年多國嘗試簽署《全球塑膠公約》，但因產油國反對而功敗垂成，各國至今仍然自行其是。這反映了環保、經濟發展與就業的現實兩難。不過，這並不代表我們什麼都做不了。國際需要時間協商，但個人可以立即行動，因為「需求」會影響「供應」。只要越來越多人選擇減塑，就可能促使廠商開始推出更多環保包裝，逐漸改變市場。下次買手搖飲時，能不能自備杯子？網購時，能不能勾選「簡易包裝」，或少用一次性塑膠？外出買東西時，能不能自備環保袋？雖然這些看起來只是小動作，卻能讓「塑膠水龍頭」慢慢關小一點。當你理解這些問題，就能成為一位環保倡議者，你可以跟同學討論、跟家人分享，讓更多人知道，塑膠真的「好用不好甩」，它會長久留在環境中，而我們也甩不掉它帶來的後果，因為將來承受這份麻煩的，就是長大後的我們。
