  instruction: 請用計時器，從指定段落（二☞)開始朗讀，在表格中記錄1分鐘朗讀的字數。如果你計時3次後，對自己還不滿意，可以多練幾次。最後一次，找一位同學請他計時、記錄並簽名！
  char_count_note: "右緣「字數」欄從第 2 段（☞ 指定的起點）開始累計，末筆 385 落在第 3 段結束，\n第 4~8 段沒有標 —— 屬「字數欄提早停」的形狀，385 不是全文長度。\n兩個段界值都對得上（Word 口徑：連續阿拉伯數字算 1 個字）：\n  第 2 段 180 == 印的 180；第 2+3 段 385 == 印的 385。\n⚠️ 本課的分節小標「塑膠帶來的便利與危害」**沒有**被算進字數\n（算進去會變成 190 / 395，兩個都對不上）—— 這條與其他課的小標計法相反，實測為準。"
