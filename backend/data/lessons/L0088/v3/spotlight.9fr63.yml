lesson_uid: L0088
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略—找作者觀點與支持理由
  strategy_type: inference
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，文字層有但非 ☑ 字元）
  blocks:
  - type: concept_box
    text: '閱讀說明文或議論文時，讀出「作者的觀點」和「支持觀點的理由」，並推論出隱含的意義，才能更完整理解文章。觀點和支持理由間的關係，就像插圖中的桌子一樣，觀點像桌面，支持理由像桌腳；理由越充分，觀點越站得住腳，越有說服力。

      我們用底下❶～❸的步驟來讀出「作者的觀點、支持理由和隱含的意義」。

      ❶找觀點：作者對議題提出什麼看法或主張？

      ❷找支持理由：作者用哪些事實、數據、例子或說明支持觀點？

      ❸推論隱含意義：把觀點與理由合起來，還能讀出什麼結論？

      接下來，我們來運用這個策略，分析〈塑膠，好用不好甩〉這篇課文的內容。'
    figure_note: 說明框中間有一張「桌面＝觀點／桌腳＝支持理由」的插圖，PDF 只渲染出殘缺色塊；圖上沒有文字層可抽
  - type: guide
    text: 一、小試身手（I）：找觀點、支持理由與隱含意義
  - type: guide
    text: 步驟❶找觀點
  - type: concept_box
    text: 祕訣：觀點是作者對議題的主要看法或主張，常出現在標題、開頭、結尾或結論句。可以先看標題與開頭段。
  - type: single
    prompt: 根據〈塑膠，好用不好甩〉的標題和第一段內容判斷，作者主要強調塑膠具備怎樣的特性？（請打勾，單選）
    prompt_prefix: ◎小試身手：
    options:
      1: 塑膠進入環境後很難消失
      2: 塑膠玩具可以隨海洋漂流到世界各地
    answer: 1
  - type: guide
    text: 步驟❷找支持理由
  - type: concept_box
    text: 祕訣：支持理由常是事實、數據、例子或說明，可能出現在觀點之前或之後。
  - type: single
    prompt: 找一找，針對「塑膠進入環境後很難消失」觀點，作者提出什麼支持理由？（請打勾，單選）
    prompt_prefix: ◎小試身手：
    options:
      1: 1997年樂高玩具落海，二十多年後仍被海浪沖上岸
      2: 臺灣塑膠回收率約為世界平均值的四倍。
    answer: 1
  - type: guide
    text: 步驟❸推論隱含意義
  - type: concept_box
    text: 祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）
  - type: sub_block
    label: ◎小試身手：
    items:
    - stem: ⑴觀點：「塑膠一旦進入環境，就很難消失。」
    - stem: ⑵理由：「樂高玩具漂流二十多年後仍被海浪沖上岸。」
    - stem: ⑶我讀到的結論
      options:
        1: 漂上海岸的積木可以撿回使用，表示塑膠污染最後會自行消失。
        2: 所以塑膠不是短期問題，而是長期存在環境中的污染物。
      answer: 2
  - type: guide
    text: 二、小試身手（II）
  - type: guide
    text: 接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。
  - type: fill_table
    columns:
    - （段落）觀點
    - 支持理由
    - 推論隱含意義（我讀到的結論）
    column_note: 第一欄表頭印「（段落）觀點」，段落號印在該欄格內上方
    rows:
    - （段落）觀點: （1）塑膠進入環境後很難消失
      支持理由: 1997年樂高玩具落海，20多年後仍被海浪沖上岸
      推論隱含意義（我讀到的結論）: 所以塑膠不是短期問題，而是長期存在自然中的垃圾
      row_note: 示範列，原稿已填答且無勾選框
    - （段落）觀點: '（2、3）

        塑膠微粒已無所不在，並可能危害人類健康'
      支持理由: '①在馬里亞納海溝、聖母峰積雪發現塑膠微粒

        ②在人體血液、母乳中發現塑膠微粒

        ③塑膠微粒影響人體健康'
      支持理由_options:
        1: 在馬里亞納海溝、聖母峰積雪發現塑膠微粒
        2: 在人體血液、母乳中發現塑膠微粒
        3: 塑膠微粒影響人體健康
      支持理由_answers:
      - 1
      - 2
      - 3
      推論隱含意義（我讀到的結論）: '①塑膠只存在於海洋和高山，與我們的生活無關

        ②塑膠已經無所不在，不只汙染環境，也可能危害人類健康'
      推論隱含意義（我讀到的結論）_options:
        1: 塑膠只存在於海洋和高山，與我們的生活無關
        2: 塑膠已經無所不在，不只汙染環境，也可能危害人類健康
      推論隱含意義（我讀到的結論）_answer: 2
    - （段落）觀點: '（4）

        全球回收率太低，難以解決塑膠垃圾問題'
      支持理由: '①每年四億噸垃圾，回收不到一成

        ②分類不便、油污難清

        ③回收技術已十分完善'
      支持理由_options:
        1: 每年四億噸垃圾，回收不到一成
        2: 分類不便、油污難清
        3: 回收技術已十分完善
      支持理由_answers:
      - 1
      - 2
      推論隱含意義（我讀到的結論）: '①只靠個人分類回收不足以解決問題，制度、技術與成本也必須改善。

        ②只要民眾願意清洗垃圾，全球塑膠就能全部被回收。'
      推論隱含意義（我讀到的結論）_options:
        1: 只靠個人分類回收不足以解決問題，制度、技術與成本也必須改善。
        2: 只要民眾願意清洗垃圾，全球塑膠就能全部被回收。
      推論隱含意義（我讀到的結論）_answer: 1
    - （段落）觀點: '（5）

        ①減產推動困難

        ②全球塑膠公約簽署失敗'
      （段落）觀點_options:
        1: 減產推動困難
        2: 全球塑膠公約簽署失敗
      （段落）觀點_answer: 1
      支持理由: '①減產會影響一些國家的經濟與就業機會

        ②全球塑膠公約簽署成功，各國已同意減產

        ③全球塑膠公約談不成'
      支持理由_options:
        1: 減產會影響一些國家的經濟與就業機會
        2: 全球塑膠公約簽署成功，各國已同意減產
        3: 全球塑膠公約談不成
      支持理由_answers:
      - 1
      - 3
      推論隱含意義（我讀到的結論）: '①每人都知道塑膠對大自然的危害

        ②減塑牽涉經濟與國際利益，是現實中的兩難，短期難以實現'
      推論隱含意義（我讀到的結論）_options:
        1: 每人都知道塑膠對大自然的危害
        2: 減塑牽涉經濟與國際利益，是現實中的兩難，短期難以實現
      推論隱含意義（我讀到的結論）_answer: 2
    - （段落）觀點: '（6）

        ①個人行動仍能帶動改變

        ②減塑只能靠國際協商'
      （段落）觀點_options:
        1: 個人行動仍能帶動改變
        2: 減塑只能靠國際協商
      （段落）觀點_answer: 1
      支持理由: '①自備環保杯、環保袋，會改變需求，讓廠商推出更多環保包裝。

        ②減少使用一次性的塑膠，慢慢的將「塑膠水龍頭」關小。'
      支持理由_options:
        1: 自備環保杯、環保袋，會改變需求，讓廠商推出更多環保包裝。
        2: 減少使用一次性的塑膠，慢慢的將「塑膠水龍頭」關小。
      支持理由_answers:
      - 1
      - 2
      推論隱含意義（我讀到的結論）: '①個人力量雖小，但需求會影響供應，可以推動市場改變

        ②個人力量太小，不太可能產生影響。'
      推論隱含意義（我讀到的結論）_options:
        1: 個人力量雖小，但需求會影響供應，可以推動市場改變
        2: 個人力量太小，不太可能產生影響。
      推論隱含意義（我讀到的結論）_answer: 1
  - type: guide
    text: 三、推論主旨與寫作目的
  - type: concept_box
    text: 本文觀點的鋪陳，作者先說明塑膠污染的持久與無所不在，再指出回收不足與減塑困難的現實挑戰，最後提出個人行動仍有力量。這樣的安排讓我們理解──面對難題不能只等待國際協商，改變可以從自己開始。我們再回到全文，思考透過這樣的鋪陳，本文的主旨和寫作目的是什麼？
  - type: single
    prompt: 1.本文主旨是什麼？
    options:
      1: 各主要塑膠生產國已協議推動回收、減產，應在短期內可以解決塑膠垃圾問題。
      2: 塑膠污染嚴重、持久，難以靠回收或國際協議解決，呼籲從個人生活減塑以改善環境。
    answer: 2
  - type: single
    prompt: '2.作者寫作目的：

      作者希望我們未來可以怎麼做?'
    options:
      1: 從日常小行動開始減塑，成為推動改變的人
      2: 靜待國際協議與民間廠商主動解決塑膠問題。
    answer: 1
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找到作者的觀點。
    - 2.我能找到支持作者觀點的理由或證據。
    - 3.我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: ※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！
