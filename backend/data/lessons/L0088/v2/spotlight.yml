spotlight:
  lesson: G7-L1
  strategy_name: 推論策略-找作者觀點和支持理由
  strategy_type: main_idea_inference
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: ※ 如果你有做到下列事項，請在□內打勾。
  - type: guide
    text: 一、小試身手（I）：找觀點、支持理由與隱含意義
  - type: guide
    text: 步驟❶找觀點
  - type: passage
    source: unknown
    paragraphs:
    - 祕訣：觀點是作者對議題的主要看法或主張，常出現在標題、開頭、結尾或結論句。可以先看標題與開頭段。
  - type: guide
    text: ◎小試身手：
  - type: passage
    source: unknown
    paragraphs:
    - 根據〈塑膠，好用不好甩〉的標題和第一段內容判斷，作者主要強調塑膠具備怎樣的特性？（請打勾，單選）
  - type: single
    prompt: 請選擇
    options:
    - 塑膠進入環境後很難消失
    - 塑膠玩具可以隨海洋漂流到世界各地
    answer: 塑膠進入環境後很難消失
  - type: guide
    text: 步驟❷找支持理由
  - type: guide
    text: 祕訣：支持理由常是事實、數據、例子或說明，可能出現在觀點之前或之後。
  - type: guide
    text: ◎小試身手：
  - type: passage
    source: unknown
    paragraphs:
    - 找一找，針對「塑膠進入環境後很難消失」觀點，作者提出什麼支持理由？（請打勾，單選）
  - type: single
    prompt: 請選擇
    options:
    - 1997年樂高玩具落海，二十多年後仍被海浪沖上岸
    - 臺灣塑膠回收率約為世界平均值的四倍。
    answer: 1997年樂高玩具落海，二十多年後仍被海浪沖上岸
  - type: guide
    text: 步驟❸推論隱含意義
  - type: passage
    source: unknown
    paragraphs:
    - 祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: ⑴觀點：「塑膠一旦進入環境，就很難消失。」
  - type: guide
    text: ⑵理由：「樂高玩具漂流二十多年後仍被海浪沖上岸。」
  - type: guide
    text: ⑶我讀到的結論
  - type: single
    prompt: 請選擇
    options:
    - 漂上海岸的積木可以撿回使用，表示塑膠污染最後會自行消失。
    - 所以塑膠不是短期問題，而是長期存在環境中的污染物。
    answer: 漂上海岸的積木可以撿回使用，表示塑膠污染最後會自行消失。
  - type: guide
    text: 二、小試身手（II）
  - type: passage
    source: unknown
    paragraphs:
    - 接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。
  - type: table
    rows:
    - - （段落）觀點
      - 支持理由
      - 推論隱含意義（我讀到的結論）
    - - （1）塑膠進入環境後很難消失
      - 1997年樂高玩具落海，20多年後仍被海浪沖上岸
      - 所以塑膠不是短期問題，而是長期存在自然中的垃圾
    - - （2、3）塑膠微粒已無所不在，並可能危害人類健康
      - □①在馬里亞納海溝、聖母峰積雪發現塑膠微粒□②在人體血液、母乳中發現塑膠微粒□③塑膠微粒影響人體健康
      - □①塑膠只存在於海洋和高山，與我們的生活無關□②塑膠已經無所不在，不只汙染環境，也可能危害人類健康
    - - （4）全球回收率太低，難以解決塑膠垃圾問題
      - □①每年四億噸垃圾，回收不到一成□②分類不便、油污難清□③回收技術已十分完善
      - □①只靠個人分類回收不足以解決問題，制度、技術與成本也必須改善。□②只要民眾願意清洗垃圾，全球塑膠就能全部被回收。
    - - （5）□①減產推動困難□②全球塑膠公約簽署失敗
      - □①減產會影響一些國家的經濟與就業機會□②全球塑膠公約簽署成功，各國已同意減產□③全球塑膠公約談不成
      - □①每人都知道塑膠對大自然的危害□②減塑牽涉經濟與國際利益，是現實中的兩難，短期難以實現
    - - （6）□①個人行動仍能帶動改變□②減塑只能靠國際協商
      - □①自備環保杯、環保袋，會改變需求，讓廠商推出更多環保包裝。□②減少使用一次性的塑膠，慢慢的將「塑膠水龍頭」關小。
      - □①個人力量雖小，但需求會影響供應，可以推動市場改變□②個人力量太小，不太可能產生影響。
  - type: guide
    text: 三、推論主旨與寫作目的
  - type: passage
    source: unknown
    paragraphs:
    - 本文觀點的鋪陳，作者先說明塑膠污染的持久與無所不在，再指出回收不足與減塑困難的現實挑戰，最後提出個人行動仍有力量。這樣的安排讓我們理解──面對難題不能只等待國際協商，改變可以從自己開始。我們再回到全文，思考透過這樣的鋪陳，本文的主旨和寫作目的是什麼？
  - type: free_text
    prompt: 1.本文主旨是什麼？
  - type: passage
    source: unknown
    paragraphs:
    - □①各主要塑膠生產國已協議推動回收、減產，應在短期內可以解決塑膠垃圾問題。
    - □②塑膠污染嚴重、持久，難以靠回收或國際協議解決，呼籲從個人生活減塑以改善環境。
  - type: free_text
    prompt: 2.作者寫作目的：
  - type: guide
    text: 作者希望我們未來可以怎麼做?
  - type: passage
    source: unknown
    paragraphs:
    - □①從日常小行動開始減塑，成為推動改變的人
    - □②靜待國際協議與民間廠商主動解決塑膠問題。
  - type: guide
    text: ※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。六閱讀理解六閱讀理解
  - type: self_check
    items:
    - 我能找到作者的觀點。
    - 我能找到支持作者觀點的理由或證據。
    - 我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。
