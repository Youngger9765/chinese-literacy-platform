intro: 這篇文章要帶我們認識兩種在外形上非常相似的鳥類——白尾八哥和臺灣冠八哥。牠們都屬於八哥，但近年來，白尾八哥的數量卻明顯增加，甚至在某些地方取代了臺灣冠八哥的蹤影。文章透過比較牠們在外形、習性上的差異，並結合臺灣這幾十年來的都市化發展，引導我們思考，為什麼這兩種看似相同的鳥類，會有如此不同的族群命運。
notes:
  title: 'v2 的 title 是「都是八哥為什麼命運不一樣」（無標點）。學習單與總表印的都是

    「都是八哥，為什麼命運不一樣？」，此處以印出來的為準。'
