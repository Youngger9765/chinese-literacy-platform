  總表_對照: '總表兩欄都寫「文圖表整合閱讀策略」，學習單第一頁的目標策略框也寫「文圖表」，

    但第三大題的標題橫幅與聚光燈說明框內文寫的是「**圖**文表整合閱讀策略」。

    同一份文件內兩種寫法並存，照各自印出來的抄，不統一（見 spotlight.title_note）。'
strategy_explained: '這一課我們要練習的是「把文章裡的文字、圖片、表格這些不同形式的資訊，綜合起來看，找到它們之間的關聯」

  為什麼要練這個呢，因為這篇在講八哥，不只告訴我們鳥長怎樣，還會用圖對比牠們的差異，並把這些跟都市發展的資料串在一起，讓我們更能理解牠們命運不同的原因

  讀的時候，可以一邊看文字描述，一邊看圖，想想圖裡的細節跟文字說的有沒有對應，再思考都市化的資訊又怎麼解釋這些差異，這樣就能讀得更透徹喔'
