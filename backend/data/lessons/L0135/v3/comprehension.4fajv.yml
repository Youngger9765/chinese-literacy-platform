comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answers_printed: true
  items:
  - index: 1
    stem: 根據表一，下列哪一項最能正確分辨白尾八哥和臺灣冠八哥？
    options:
      A: 白尾八哥是白色嘴喙、冠羽不顯；臺灣冠八哥是黃色嘴喙、冠羽明顯
      B: 白尾八哥是黃色嘴喙、冠羽不顯；臺灣冠八哥是白色嘴喙、冠羽明顯
      C: 白尾八哥是白色嘴喙、冠羽明顯；臺灣冠八哥是黃色嘴喙、冠羽不顯
      D: 白尾八哥是黃色嘴喙、冠羽明顯；臺灣冠八哥是白色嘴喙、冠羽不顯
    answer: B
    answer_carrier: 橘色手寫體印在題號前的括號內
  - index: 2
    stem: 從表一、表二和最後一段一起看，下列對臺灣冠八哥成為保育類動物的原因，哪一項最合理？
    options:
      A: 牠們在臺灣存在太多年，族群已經老化，需要受到保護
      B: 牠是臺灣原生種，為保護本土動物，本來就應該得到特殊的保障
      C: 牠冠羽明顯，容易成為獵人或猛禽捕獵的目標，族群有生存壓力
      D: 臺灣都市擴張，牠怕人又不易適應都市環境，族群有生存壓力
    answer: D
    answer_carrier: 橘色手寫體印在題號前的括號內
  - index: 3
    stem: 文章末段沒有直接下結論，而是接連提出問題，作者這樣寫最可能的目的是什麼？
    options:
      A: 用連續提問吸引讀者注意，讓文章讀起來更有變化與懸念
      B: 引導讀者回看文字及表格，促成讀者整合訊息、解決問題
      C: 用設問整理前文重點，強調兩種八哥外形其實非常接近
      D: 用提問保留討論空間，表示作者對研究結果仍無法確定
    answer: B
    answer_carrier: 橘色手寫體印在題號前的括號內
  - index: 4
    stem: 如果地方政府想增加臺灣冠八哥的棲息環境，下列哪一項措施最可能有效？
    options:
      A: 保留較安靜的綠地環境，並增加接近自然的築巢空間
      B: 增設更多橋梁與水泥建物，讓牠們改用人工設施繁殖
      C: 在人口密集商圈投放食物，吸引牠們習慣接近人群活動
      D: 讓兩種八哥共享同類巢位，以提高都市區域利用效率
    answer: A
    answer_carrier: 橘色手寫體印在題號前的括號內
  - index: 5
    stem: 下列哪一個結論，最需要同時整合前文敘述、表一和表二，才能完整判斷？
    options:
      A: 兩種八哥外形十分相似，所以只看整體羽色仍不容易正確分辨
      B: 臺灣冠八哥原本就是臺灣原生種，所以現在在各地仍應較常見到
      C: 白尾八哥較能適應人類環境，因此近年數量與分布都明顯擴張
      D: 八哥近年比麻雀更常被看見，主要是因為牠們叫聲特別明顯熱鬧
    answer: C
    answer_carrier: 橘色手寫體印在題號前的括號內（原稿印全形「Ｃ」）
