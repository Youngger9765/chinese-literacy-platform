spotlight:
  lesson: G9-L14
  strategy_name: 文圖表整合閱讀策略
  strategy_type: inference
  blocks:
  - type: guide
    text: 說明：閱讀同時包含圖片和表格的文章時，不能只看其中一種材料，而要在文字、圖片與表格之間來回對照，先弄清楚每一種材料提供什麼訊息，再把相關訊息合起來理解。這樣不但能更快掌握重點，也能更正確地回答問題。這一課，我們將以〈都是八哥，為什麼命運不一樣？〉為例，學習整合文字、圖片與表格的閱讀方法。
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：文圖表整合閱讀策略
  - type: guide
    text: 二知識補給站二知識補給站
  - type: guide
    text: 三閱讀聚光燈圖文表整合閱讀策略三閱讀聚光燈圖文表整合閱讀策略
  - type: guide
    text: 這篇文章裡，文字、圖片和表格都提供了重要訊息。閱讀時，不能只看文字，也不能只看圖片或表格，而要先注意文字怎麼提醒你看圖表、怎麼理解圖表的功能，再整合文字、圖片和表格——把相關訊息連起來想。這一課我們用下面4個步驟，練習圖文表整合閱讀：❶先文字——找出要看哪一張圖或表，並抓出這段文字的重點❷後圖表——判斷各圖表提供了什麼訊息❸文圖表對照——找出文字與圖表相同或互相補充的訊息❹整合推論——比較、連結各項資訊之間的關係
  - type: guide
    text: 熱身練習：第一段 vs 圖一
  - type: single
    prompt: 1.圖一最主要提供哪一類訊息？（單選）
    options:
    - 兩種八哥外形相近的整體印象
    - 兩種八哥近年的族群變化情形
    answer: 兩種八哥外形相近的整體印象
  - type: single
    prompt: 2.讀完第一段後，請你找出和圖一最相關的文字。（單選）
    options:
    - 白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。
    - 這兩種八哥外形十分相似，不容易單靠外表一眼分辨。
    answer: 白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。
  - type: guide
    text: 練習一：第二段 vs 表一
  - type: guide
    text: 步驟❶：先文字——抓出這段文字的重點
  - type: guide
    text: 小祕訣：當讀到「表一比較了……」時，就要轉去看表一，並問自己：「這段要我從表一找什麼？」
  - type: free_text
    prompt: 1.請把第二段文字中，要你看表的地方畫線或圈起來
  - type: single
    prompt: 2.這段要你從表一看什麼？（單選）
    options:
    - 八哥的外形習性等特徵
    - 八哥的數量變化
    answer: 八哥的外形習性等特徵
  - type: guide
    text: 步驟❷：後圖、表——再看表一，讀懂表一提供了什麼訊息
  - type: guide
    text: 小祕訣：看表時，可以依序進行：
  - type: single
    prompt: ①看表題：這張表在談什麼？
    options:
    - 找比較對象：在比較誰和誰？
    - 找比較項目：最左邊每一列在比什麼？
    - 沿同一列橫向比較：兩個對象有什麼相同或不同？
    - 看單位與註解：數字或符號代表什麼？
    answer: 找比較對象：在比較誰和誰？
  - type: free_text
    prompt: 1.表一比較的兩個對象是：  白尾八哥         和  臺灣冠八哥        。
  - type: single
    prompt: 2.表一把資料分成哪兩大類？
    options:
    - 相同處與相異處
    - 原因與結果
    answer: 相同處與相異處
  - type: single
    prompt: 3.表一主要提供的是哪一類訊息？（單選）
    options:
    - 白尾八哥和臺灣冠八哥近年的族群變化的調查結果
    - 白尾八哥和臺灣冠八哥外形、習性等特徵的異同
    answer: 白尾八哥和臺灣冠八哥近年的族群變化的調查結果
  - type: guide
    text: 步驟❸：文圖表對照——從圖表中找到和文字對應的資訊
  - type: passage
    source: unknown
    paragraphs:
    - 在表一找到對應文字說明的訊息，必要時回頭看圖一，看看表格怎麼幫助你更了解文字在說什麼。
  - type: single
    prompt: 1.第二段說兩種八哥「外表相似」，表一中哪些資料可支持這句話？（複選）
    options:
    - 全身大致為黑色
    - 身形大小接近
    - 常在地面走動覓食，吃昆蟲、果實
    - 都屬八哥屬、留鳥
    answer: 全身大致為黑色
  - type: single
    prompt: 2.第二段說「只要觀察嘴喙和尾羽的顏色，就能分辨牠們」，表一中的哪些資料正好對應這句話？（複選）
    options:
    - 嘴喙顏色
    - 尾羽顏色
    - 築巢地點
    - 適應都市環境
    answer: 嘴喙顏色
  - type: single
    prompt: 3.第二段提到臺灣冠八哥又稱「臺灣八哥」，表一中的哪一項資料和這句話最有關？（單選）
    options:
    - 冠羽是否明顯
    - 外來種／原生種
    - 族群數量
    - 保育身分
    answer: 冠羽是否明顯
  - type: single
    prompt: 4.讀表一，對理解第二段有什麼幫助？（單選）
    options:
    - 表一只是把第二段重新整理一次，並沒有幫助我們更清楚理解這段意思。
    - 表一幫助我們更清楚看出，兩種八哥外形相近，但仍可從特徵和習性加以分辨。
    answer: 表一只是把第二段重新整理一次，並沒有幫助我們更清楚理解這段意思。
  - type: guide
    text: 步驟❹：整合推論——比較、連結文圖表各項資訊之間的關係
  - type: single
    prompt: 1.下面哪一句最能把第二段和表一的意思一起說清楚？（單選）
    options:
    - 兩種八哥雖然外形相近，但只要知道牠們同屬八哥屬，就能解釋後來族群數量不同的原因
    - 兩種八哥雖然外形相近，但仍可從嘴喙、尾羽等特徵區分，表一也進一步比較了牠們的習性差異
    answer: 兩種八哥雖然外形相近，但只要知道牠們同屬八哥屬，就能解釋後來族群數量不同的原因
  - type: guide
    text: 練習三：第三段 vs 表二
  - type: guide
    text: 步驟❶：先讀文字——抓出這段的重點
  - type: free_text
    prompt: 1.請把第三段文字中，要你看表的地方畫線
  - type: single
    prompt: 2.第三段要你看表的什麼？（單選）
    options:
    - 兩種八哥的外形與習性
    - 兩種八哥的數量變化
    answer: 兩種八哥的外形與習性
  - type: guide
    text: 步驟❷：再看表——讀懂這張表告訴我們什麼訊息
  - type: single
    prompt: 1.表二主要提供的是哪一類訊息？（單選）
    options:
    - 近年對兩種八哥族群與分布的調查結果
    - 白尾八哥和臺灣冠八哥習性與食物的異同
    answer: 近年對兩種八哥族群與分布的調查結果
  - type: guide
    text: 步驟❸：文表對照——從表中找到和文字對應的資訊
  - type: guide
    text: 在表二找到對應文字說明的訊息，看看表格怎麼把第三段說的內容整理得更清楚。
  - type: single
    prompt: 1.第三段說「白尾八哥都呈現較快的擴張或較高的出現量」，表二中的哪些資料可以支持這句話？（複選）
    options:
    - 近年數量變化（2009-2020）
    - 出現地點數／總調查地點數（2009-2021）
    - 2021年看得到的地點數
    - 2018年花蓮調查結果
    answer: 近年數量變化（2009-2020）
  - type: single
    prompt: 2.讀表二時，看到「84／584」旁邊有「註2」，到表格下方看註解有什麼幫助？（單選）
    options:
    - 註2會說明這個寫法的意思，幫助我們理解表格內容。
    - 註2會補充八哥的外形特徵，幫助我們分辨兩種八哥。
    answer: 註2會說明這個寫法的意思，幫助我們理解表格內容。
  - type: single
    prompt: 3.第三段說「有些地方甚至已經看不到臺灣冠八哥的身影了」，表二中哪一項最直接支持這句話？（單選）
    options:
    - 白尾八哥成長250%
    - 2021年看得到的地點數：23個地點
    - 2018年花蓮調查結果：0隻
    answer: 白尾八哥成長250%
  - type: single
    prompt: 4.作者呈現表格後，通常會在文字中說明這張表的重要訊息。請回到第三段，判斷哪一句最能統整表二最重要的訊息？（單選）
    options:
    - 表二則說明了兩種八哥近年族群數量的變化
    - 從表二可知，不論是整體數量、出現的地點，還是在部分地區的觀察結果，外來種白尾八哥都佔優勢
    - 當初白尾八哥被引進臺灣時，牠們的數量很少，臺灣冠八哥才是隨處可見的常客。
    answer: 表二則說明了兩種八哥近年族群數量的變化
  - type: guide
    text: 步驟❹：整合推論——比較、連結文圖表各項資訊之間的關係
  - type: single
    prompt: １.下面哪一句最能把「表一 ＋ 表二」的意思一起說清楚？（單選）
    options:
    - 表二說明兩種八哥近年的數量差不多，而表一只是補充牠們名稱、習性上的不同。
    - 表二告訴我們兩種八哥近年的族群差距很大，而表一提供了進一步思考原因的重要線索。
    answer: 表二說明兩種八哥近年的數量差不多，而表一只是補充牠們名稱、習性上的不同。
  - type: single
    prompt: ２.你發現了嗎，讀第三段不能只看表二，還要回頭看表一，是因為：
    options:
    - 表二讓我們知道哪一種八哥變多、哪一種變少；表一幫助我們思考為什麼會這樣。
    - 表二幫助我們思考為什麼會這樣；表一讓我們知道哪一種八哥變多、哪一種變少。
    answer: 表二讓我們知道哪一種八哥變多、哪一種變少；表一幫助我們思考為什麼會這樣。
  - type: guide
    text: 練習四：第四段 vs 表一、二
  - type: guide
    text: 步驟❶：先讀文字——抓出這段的重點
  - type: single
    prompt: 1.這段要你「回到表一」回答什麼問題？（單選）
    options:
    - 八哥的外形與習性
    - 根據表一試著推論表二所說的、兩種八哥族群變化的原因
    answer: 八哥的外形與習性
  - type: guide
    text: 步驟❷：整合推論——比較、連結第四段文字及表一、二資訊之間的關係
  - type: free_text
    prompt: 1.表一呈現的哪兩項八哥特徵差異可能和都市化最有關？
  - type: passage
    source: unknown
    paragraphs:
    - □①冠羽是否明顯            □②是否怕人
    - □③是否利用人造設施築巢    □④是否為外來種
  - type: free_text
    prompt: 2.根據上題的兩項特徵，哪一種八哥可能較容易適應都市環境？
  - type: passage
    source: unknown
    paragraphs:
    - □①白尾八哥    □②臺灣冠八哥
  - type: guide
    text: 最後，你怎麼回應第四段結束時提出的問題呢？
  - type: passage
    source: unknown
    paragraphs:
    - 答：白尾八哥  較不怕人      ，又   較會利用人造設施築巢              ，適應都市環境較臺灣冠八哥強、比較容易生存，因此族群逐漸擴張。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。四閱讀理解四閱讀理解
  - type: self_check
    items:
    - 我會找出文章裡要看圖表的地方。
    - 我會從圖表中找到和文字對應的訊息。
    - 我會讀圖、表的註解，也知道註解的功能。
    - 我會把文圖表合起來想，判斷它們的重點。
    - 我知道圖片和表格的功能不同：本文圖片先提供整體印象，表格能幫助我把訊息看得更清楚。
