paragraphs:
- 你最常見到哪一種野鳥？二十年前，臺灣民眾的回答會是嘰嘰喳喳的麻雀。但近年，在公園、校園、農地與河濱綠地裡，這個答案已經被聒噪又醒目的黑鳥——八哥——取代。但你知道嗎？一眼望去，黑忽忽的八哥看起來十分相似。本文要比較其中兩種：「白尾八哥」和「臺灣冠八哥」。從圖一可以看出，這兩種八哥外形十分相似，不容易單靠外表一眼分辨。白尾八哥是外來種，因為很會模仿聲音，四、五十年前被引進臺灣作為寵物鳥。沒想到，近年鳥類族群的調查發現，白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。
- 圖一 白尾八哥（左）與 臺灣冠八哥（右）外形圖
- 表一比較了白尾八哥和臺灣冠八哥在外形、習性與其他特徵上的異同。這兩種八哥外表相似，體型、羽色和動作都很接近，在生物分類上也同屬八哥屬。不過，仔細觀察嘴喙、尾羽和冠羽等特徵，仍可分辨牠們。白尾八哥尾羽末段白色，嘴喙黃色，所以又稱「黃嘴八哥」；臺灣冠八哥嘴喙白色、鼻頭有明顯的冠羽，尾羽只有少許白色，因為是臺灣原生種，也被稱為「臺灣八哥」。
- 表一  白尾八哥與臺灣冠八哥特徵異同比較表
- 表二整理了兩種八哥近年的數量變化、出現地點與部分地區的調查結果。從表二可知，不論是近年的增加情形、出現地點數，還是部分地區的觀察結果，白尾八哥都佔優勢，呈現較快的擴張或較高的出現量，有些地方甚至已經看不到臺灣冠八哥的身影了。可是，當初白尾八哥被引進臺灣時，牠們的數量很少，臺灣冠八哥才是隨處可見的常客，為什麼幾十年過去，臺灣冠八哥在許多地方較少被看見，白尾八哥卻愈來愈常見、分布愈來愈廣呢？
- 表二  近年兩種臺灣常見八哥之族群與分布調查
- 註1.資料來源：我們的島（2022）；環境資訊中心（2023）
- 註2.「84/584」表示：研究人員一共調查了584個地點，其中有84個地點看得到臺灣冠八哥。
- 這個問題的答案可能和兩種八哥的一項習性差異有關，也和臺灣這四、五十年來的都市化有關。請回到表一看一看，哪一種八哥比較不怕人？哪一種八哥比較常利用人造建築築巢？再想一想，當馬路、橋樑、房舍佔地面積愈來愈大時，這些習性會怎麼樣影響牠們族群的發展呢？請根據表一、表二與都市化的背景試著推論兩種八哥族群變化的可能原因。
