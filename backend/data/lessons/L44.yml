multiple_choice:
- question: 下列文句，何者語詞使用最恰當？
  options:
  - 這裡風光明媚，是「杳無人煙」的旅遊勝地。
  - 這部電影有許多令人「驚心動魄」的火爆場面，超級可怕。
  - 這個道士學藝不精，破綻百出，真是「回天乏術」。
  - 做事應用「譁眾取寵」的態度，博取流量及曝光度。
  answer: B
  explanation: A錯：成語誤用；C錯：成語誤用；D錯：成語誤用
- question: 根據作者的說法，為什麼含光可以擊退老虎、救回弟弟？
  options:
  - 因為含光有道士的即時幫忙和提醒。
  - 老虎可能身體狀態不佳，不敵人類。
  - 因為含光是百年難得一見的大力士。
  - 含光不怕死的吮吸弟弟傷口的毒血。
  answer: B
  explanation: 課文中提到作者鼓勵讀者對報導提出「合理的質疑」，並用網路搜尋的資訊來「澄清」這些質疑。含光擊退老虎被視為一件「新奇的紀實報導」，容易讓人覺得「不太可能吧！」或「會不會太誇張了？」。因此，作者會傾向尋找
- question: 根據本課內容，何者敘述為真？
  options:
  - 故事發生的地點是人跡眾多地方。
  - 弟弟受傷過重，從頭到尾未甦醒。
  - 含光為救弟弟，不顧自身的安全。
  - 故事中的老虎敏捷迅速、很強壯。
  answer: D
  explanation: 老虎應是老弱病幼，才可能被人打跑
- question: 請問這篇文章中，作者最想傳達什麼理念給讀者？
  options:
  - 對任何事情都要保持先懷疑，後求證的態度。
  - 批判古人在記載故事都十分潦草、不求謹慎。
  - 宣揚兄弟友愛的理念，互助合作來打退猛虎。
  - 宣傳在野外被動物咬傷時，正確的急救方式。
  answer: A
  explanation: 從課文的標題「這是假新聞嗎？--以『鞭虎救弟記』為例」、前言明確指出「作者示範對報導提出合理的質疑，並且用網路搜尋的資訊去澄清自己提出來的質疑」，以及後續「小提醒」和「我們學到了對文章提出質疑以及上網
- question: 這篇文章示範了一種閱讀態度，請選出底下最接近的描述？
  options:
  - 文字紀錄是可靠的，隔了350年仍然可信。
  - 閱讀時應該全然信任作者。
  - 閱讀時可以提出質疑，並蒐集資料。
  - 閱讀時寧願相信書，而不要相信網路。
  answer: C
  explanation: 課文開宗明義指出，作者示範了對報導提出合理的質疑，並用網路搜尋的資訊去澄清質疑。在後續的「小提醒」和說明中，也一再強調閱讀時應提出質疑，並自行查閱網路資料解決問題。
