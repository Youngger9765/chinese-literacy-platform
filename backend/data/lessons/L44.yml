vocabulary:
- word: 一息尚存
  definition: 還有一點氣息存在，表示生命危急但還活著。
- word: 號󠇡叫
  definition: 大叫。
- word: 杳無人煙
  definition: 比喻荒涼無人居住、很少人的地方。
- word: 手無寸鐵
  definition: 鐵指武器，在此指的是手裡沒有任何武器。
- word: 陰黯
  definition: 天陰，昏暗不明。
- word: 倖存
  definition: 僥倖活下來。
- word: 險峻
  definition: 地勢高聳危險。
- word: 驚心動魄
  definition: 驚險刺激、通常形容難忘的經歷、旅程或冒險。
- word: 山坳
  definition: 兩山間凹下的地方。
- word: 譁眾取寵
  definition: 用大眾喜歡的話或行動來吸引他人的注意。
- word: 回天乏術
  definition: 病情嚴重無法挽救。
- word: 一命嗚呼
  definition: 即「死亡」。
- word: 攫
  definition: 指鳥獸用爪抓取獵物。
vocabulary_count: 13
fill_in_blank: []
multiple_choice:
- question: 下列文句，何者語詞使用最恰當？
  options:
  - 這裡風光明媚，是「杳無人煙」的旅遊勝地。
  - 這部電影有許多令人「驚心動魄」的火爆場面，超級可怕。
  - 這個道士學藝不精，破綻百出，真是「回天乏術」。
  - 做事應用「譁眾取寵」的態度，博取流量及曝光度。
  answer: D
  explanation: 成語誤用
- question: 根據作者的說法，為什麼含光可以擊退老虎、救回弟弟？
  options:
  - 因為含光有道士的即時幫忙和提醒。
  - 老虎可能身體狀態不佳，不敵人類。
  - 因為含光是百年難得一見的大力士。
  - 含光不怕死的吮吸弟弟傷口的毒血。
  answer: null
  explanation: null
- question: 根據本課內容，何者敘述為真？
  options:
  - 故事發生的地點是人跡眾多地方。
  - 弟弟受傷過重，從頭到尾未甦醒。
  - 含光為救弟弟，不顧自身的安全。
  - 故事中的老虎敏捷迅速、很強壯。
  answer: D
  explanation: 老虎應是老弱病幼，才可能被人打跑
- question: 請問這篇文章中，作者最想傳達什麼理念給讀者？
  options:
  - 對任何事情都要保持先懷疑，後求證的態度。
  - 批判古人在記載故事都十分潦草、不求謹慎。
  - 宣揚兄弟友愛的理念，互助合作來打退猛虎。
  - 宣傳在野外被動物咬傷時，正確的急救方式。
  answer: null
  explanation: null
- question: 這篇文章示範了一種閱讀態度，請選出底下最接近的描述？
  options:
  - 文字紀錄是可靠的，隔了350年仍然可信。
  - 閱讀時應該全然信任作者。
  - 閱讀時可以提出質疑，並蒐集資料。
  - 閱讀時寧願相信書，而不要相信網路。
  answer: null
  explanation: null
