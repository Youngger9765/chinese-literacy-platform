  exercise:
    instruction: 3.小試身手(單選)
    summary_line: '※學習重點小結：

      這兩篇課文的重點都是科學家「問題-假設-驗證-結果」的歷程。現在換你當科學家，用「問題-假設-驗證-結果」的方法解決問題！'
    problem: 發現：「放學回家後，看到桌上的魚缸被打破了，裡面金魚不見了。」魚缸是怎麼被打破的？
    row_labels:
    - 發現問題
    - 假設
    - 驗證方式
    - 結果
    - 結論
    columns:
    - hypothesis: (1)魚缸裡的馬達發生爆裂
      verify: 檢查馬達是否破裂、燒焦，附近是否有爆裂痕跡
      result: 馬達完整，沒有燒焦痕跡
      conclusion_options:
      - 支持
      - 不支持
      conclusion_answer: 2
    - hypothesis: (2)被地震震破
      verify_options:
      - 查中央氣象署
      - 打1999服務專線，查詢今天有無地震紀錄。
      verify_answer: 1
      result: 沒有地震紀錄。
      conclusion_options:
      - 支持
      - 不支持
      conclusion_answer: 2
    - hypothesis: (3)鄰居的貓打破魚缸
      verify: 查監視器或地上貓腳印、毛髮
      result: 貓咪偷溜進家中想吃魚，結果打破魚缸。（答案有理即可）
      conclusion_options:
      - 支持
      - 不支持
      conclusion_answer: 1
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）＋ 第 3 欄「結果」是橘色手寫體
    note: 只有第 2 欄的「驗證方式」是選擇題，第 1、3 欄直接印答案
