  paragraphs:
  - idx: 1
    text: 西元1722年4月5日，荷蘭西印度公司的羅格文船長，帶著他的船隊發現南太平洋的這座小島。他很訝異地看到岸邊矗立著一尊一尊巨大的石像，多數石像背向海洋，面向島內。石像非常巨大，看起來很難靠人力移動。目瞪口呆的船長問道：「他們到底是怎麼辦到的？」因為那天正好是復活節，羅格文船長當天就在航海日記上，把這個島命名為復活節島。
  - idx: 2
    text: 復活節島，是全世界人煙稀少的一角。距離這裡最近的陸地是東邊3700多公里的智利海岸，往西，要航行2000公里才會見到另外一座島。島上的石像大約有九百尊，當地原住民稱石像為「摩艾石像」。大多數摩艾是一體成形的，也就是說，一尊石像，是從同一塊大石頭刻出來的，但有部分石像頭上會加一塊帽子，一頂帽子可重達十幾噸。
  - idx: 3
    text: 許多考古的證據顯示，摩艾石像是原住民在西元1250到1500年間，在山上的採石場採集、雕刻、移動十幾公里後，在海邊的平台豎立起來的。島上最高的摩艾石像被稱為帕洛，幾乎10公尺高，重82公噸。其它的摩艾，最輕的有9公噸，採石場中也有尚未完成的巨大石像，重量估計可達兩百多公噸，最重的有250公噸。許多石像都已倒地，1994年智利政府出動能吊起50公噸重物的起重機，費盡千辛萬苦，才把它們重新豎立。利用現代機械，這項修復工程仍然極為艱鉅。羅格文船長三百年前提出的問題：「他們到底是怎麼辦到的？」到現在仍未得到確定的解答。但人們經過考證與實驗，提出了怎麼移動摩艾石像的三個假設：
  - idx: 4
    text: 摩艾石像當初是做什麼的？至今人們仍然不清楚。它們七、八百年前怎麼從山上「走」到海邊的，到今天仍是人們爭論不休的話題。
  hypothesis_blocks:
    after_paragraph: 3
    items:
    - heading: 假設一：有超自然的力量移動了石像。
      text: 島上的原住民一直有「摩艾走路」的古老傳說，傳說中，他們信仰的神靈，在星光滿布的夜裡會啟動大自然的力量，讓在山邊刻好的石像起身，一步一步走向海邊。這個假設最大的問題是，超自然力量無法用科學方法檢驗，也缺乏可觀察、可重複驗證的證據。現代人根本就不相信有什麼超自然的力量。
    - heading: 假設二：用滾輪把石像移到海邊。
      text: 他們砍伐島上的原木，放在地上當滾輪，再把沉重的石像放在長橇上，慢慢地靠滾輪移動到海邊。這個假設也受到質疑──用原木當滾輪，在平地上絕對可行，但是島上採石場到海邊的地形高低起伏、崎嶇不平，連走路都難，要怎麼鋪設滾輪呢？
    - heading: 假設三：把石像立起來，用繩索拉扯移動。
      text: 用長繩綁著摩艾的頭部，兩群人在左右拉扯，中間有一群人負責平衡，摩艾左右的底座就會輪流離地，往前走了。這個假設聽起來合理，科學家用複製石像實驗，發現用繩索讓石像左右搖擺、慢慢前進是可行的，這也和「摩艾走路」的傳說相互呼應。不過，實驗石像比許多真正的摩艾小得多，若遇到斜坡、裂谷或更重的石像，是否仍能成功移動，仍有討論空間。
