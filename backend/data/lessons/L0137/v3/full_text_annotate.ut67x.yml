full_text_annotate:
  part_no: 1/2
  title_line: 第16課  未解之謎──石頭的祕密（一）：巨石陣
  byline: 課文/學習單：張明珠
  paragraph_count: 5
  paragraphs:
  - idx: 1
    text: 西元1130年前後，一位英格蘭史家在文字中記錄了這座位於英國倫敦西南方埃姆斯伯里附近的奇特石陣。石陣裡有一組一組的ㄇ型巨石組，矗立於曠野中，作環狀排列，就像一座圓形的石林。每個ㄇ型巨石組，由兩個直立石柱及一個橫放在上方的巨石組成，光是上方的巨石就重達7噸。這就是世上最著名、最神秘的史前遺跡──英國巨石陣。科學家估計，巨石陣大約在西元前2600年到西元前2400年建立。
  - idx: 2
    text: 至今沒有人可以很肯定說出：巨石陣是如何建造的？建造的目的是什麼？巨石陣的石塊稱為薩爾森石，來自附近的山丘，距離巨石陣約25公里。每一顆薩爾森石重量平均約20噸，有的重達30噸，最高的有9公尺高。令人好奇的是，石頭這麼多、這麼巨大笨重，當時的人們沒有大型機械，如何克服崎嶇的地形，把它們搬運了25公里？其中一種常被提出的推測是：古代人製作了大型的木橇，將石塊移到橇上，在橇下放置原木滾輪，最後再以大量人力將巨石拖行。但是把一個巨石在崎嶇不平的地上搬運25公里，已經相當困難，整個巨石陣的巨石超過50個，這麼浩大的工程，光是想像，就讓人肅然起敬。而當時的人們究竟採用哪條路線、用什麼樣的技術運來石塊，至今仍是一團謎。
  - idx: 3
    text: 關於巨石陣設立的目的也是眾說紛紜，其中有些只是傳說或想像，有些則有考古線索支持。人們提出了三個假設：
  - idx: 4
    text: 到目前為止，假設三是最可能成立的。也許四千多年前，住在這裡的人，建造了可以觀測天象的巨石陣，而這麼宏偉的建築，也同時是宗教的場所，被用來安慰生病及身心障礙的人們。但是，這也只是一個假設而已，而且，新的問題又來了——這麼久以前的人類祖先，是誰教他們預測日食、月食的天文知識呢？你有什麼假設嗎？
  - idx: 5
    text: 巨石陣到底從何而來，為何而設？至今仍未有定論。無獨有偶，在相距幾千公里外的太平洋小島上，有一群巨大的石像，也有這般引人好奇的未解之謎。
  hypothesis_blocks:
    after_paragraph: 3
    note: 三個假設各是「小標＋說明段」，不佔段號，印在第 3 段與第 4 段之間
    items:
    - heading: 假設一：巨石陣是外星人的基地。
      text: 因為有人曾拍攝到從巨石陣上空飛過不明飛行物（又稱幽浮，UFO）。1986年，又有人在附近發現幽浮。十幾年後，一位參觀者甚至拍攝到幽浮列隊飛過的畫面。幽浮研究者認為，史前巨石陣也許是外星人光臨地球時的秘密基地。但問題是這些照片模糊不清，真假難辨，難以作為支持假設一的證據。
    - heading: 假設二：巨石陣是古代的醫院。
      text: 巨石陣周遭挖出了許多人類遺骸，他們的身上都有著嚴重疾病或傷殘，科學家從遺骸牙齒的成分推論，有一半的人是從外地千里迢迢而來；此外，巨石陣的內圈由稀有的青石組成，古代人認為青石是人類的護身符，具有保護或治療的效果。這些線索讓部分研究者推測，巨石陣可能曾被視為具有治療或安慰力量的場所。
    - heading: 假設三：巨石陣為古代人為了觀測天文而建造的。
      text: 考古學家指出，巨石陣在古代可能與天文觀測及曆法計算有關。他們發現，只要透過觀察太陽在巨石陣升起的位置，人們便能夠知曉今日是何月、何週、何日，可以預測及計算太陽和月亮軌道。還有天文學家用電腦計算後發現，巨石陣確實能準確計算月食和日食的週期，這些研究結果，支持設立的目的為觀測天文之用。
