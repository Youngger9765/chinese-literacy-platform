comprehension:
  questions:
  - index: 1
    answer: C
    stem: 讀這兩篇文章時，判斷哪個假設比較有說服力，最重要的是看什麼？
    options:
      B: 哪個假設有最多人贊成
      C: 哪個假設有較多證據支持
      D: 哪個假設聽起來最像傳說故事
    rationale: null
  - index: 2
    answer: C
    stem: 關於「巨石陣」一文中，何者敘述正確？
    options:
      A: 距離復活節島最近的陸地為智利海岸
      B: 巨石陣是由英國船長在航海中發現（神父散步發現）
      C: 從山上到海邊石像的道路，大多崎嶇不平
      D: 現代的起重機要豎立石像仍然極不容易（文中第三段）
    rationale: Ｂ ）3. 關於「摩艾走路」一文中，何者敘述不正確？
  - index: 4
    answer: D
    stem: 請問巨石陣與摩艾走路這兩篇文章，其共同的未解之謎為何？
    options:
      A: 發現由來→令人好奇的問題→三個假設→未解之謎
      C: 三個假設→發現由來→令人好奇的問題→未解之謎
      D: 未解之謎→發現由來→三個假設→令人好奇的問題
      B: 發現由來→未解之謎→三個假設→令人好奇的問題
    rationale: 從兩篇文章的最後一段可知，石像移動仍是未解之謎。
