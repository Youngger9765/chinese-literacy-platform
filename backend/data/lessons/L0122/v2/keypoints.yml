keypoints:
  lesson: G8-L2
  structure: nested
  columns:
  - label
  - sub_label
  - value
  rows:
  - label: 歷史事件與結局
    value: 事件：1532年，西班牙皮薩羅率領168名士兵對戰8萬士兵的印加帝國軍隊。西班牙士兵的心理感受？(請打勾，單選)□①感到畏懼，因為敵軍人數遠遠超過自己□②感到興奮，因為他們深信自己一定會獲勝結局：印加帝國的崩潰1.原本強大的__在西班牙人到來後迅速瓦解。2.印加人放棄原本的__和語言，改信天主教。3.__語成為南美洲的主要語言。
    blanks:
    - answer: 印加帝國
      hint: ''
    - answer: 信仰
      hint: ''
    - answer: 西班牙
      hint: ''
  - label: 提問
    sub_rows:
    - sub_label: 1.勢單力薄的西班牙人短時間征服印加帝國，靠的是什麼？
      template: 2.為什麼歐洲人攜帶這麼多致命的病菌，自己卻不會生病？
      blanks: []
  - label: 說明
    sub_rows:
    - sub_label: 賈德戴蒙的研究指出，是西班牙人從__帶過去的病菌。
      template: 這些疾病在歐洲已經肆虐一千多年；歐洲人逐漸產生__。
      blanks:
      - answer: 歐洲
        hint: ''
      - answer: 抗體
        hint: ''
    - sub_label: 病菌所造成的影響
      template: (配對連線) 帝國有什麼改變?
      blanks: []
  - label: 詳細說明
    sub_rows:
    - sub_label: (1)1524年，歐洲人帶來的天花傳染到美洲，導致大量死亡。
      template: ● ● A.眾人改變信仰，加速印加帝國的崩解。
      blanks: []
    - sub_label: (2)1528年印加皇帝因天花病逝，繼承人爭奪王位，引發長年內戰。
      template: ● ● B.印加帝國長年的內戰，導致帝國政治經濟瓦解。
      blanks: []
    - sub_label: (3)印加人發現信仰天主教的西班牙人沒有生病，認為西班牙人的神才是真神。
      template: ● ● C.大規模疫情，導致8年內印加帝國人口減半。
      blanks: []
  - label: 總結
    value: 1.如果沒有病菌，印加帝國可能不會那麼快被嚴重削弱。2.天花等疾病成為西班牙人征服印加的重要推力，改變了美洲的歷史。
    blanks: []
  title: 隱形的征服者
