vocab_definitions:
  items:
  - index: 1
    word: 勢單力薄
    definition: 人少力量弱，難以與對方抗衡。
  - index: 2
    word: 抗體
    definition: 身體為了對抗病毒或細菌而產生的防禦物質。
  - index: 3
    word: 懸殊
    definition: 兩者差別很大，無法相比。
  - index: 4
    word: 撕心裂肺
    definition: 形容非常痛苦、難以忍受的哭聲或情緒。
  - index: 5
    word: 哀鴻遍野
    definition: 比喻災難過後到處都是痛苦哭喊的人，情況非常慘重。
  - index: 6
    word: 區區
    definition: 表示數量少或力量弱，有輕視的語氣。
  - index: 7
    word: 蔓延
    definition: 像藤蔓一樣向外擴散，常用來形容災情、疫情、火勢等擴大。
  - index: 8
    word: 肆虐
    definition: 災害或疾病到處破壞、傷害，毫不收斂。
  - index: 9
    word: 對峙
    definition: 雙方相對而立，彼此不退讓，形成緊張對抗。
  - index: 10
    word: 不堪一󠇢擊
    definition: 形容力量非常薄弱，經不起一次攻擊就失敗。
