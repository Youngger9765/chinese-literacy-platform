passage: '此外，為了驅除疫病，消災祈福，印加社會舉辦了許多大規模的宗教祭典，但每一個家庭仍然傳出撕心裂肺的嚎哭聲。相反的，印加人發現信仰天主教的西班牙人，居然是不會生病的。在巨大的反差下，印加人開始認為：「他們的神才是真神」。

  回到1532年11月，印加和西班牙兩方軍隊第一次對峙的那天。其實，當時印加帝國在實力上和心理上都早被削弱，這是讓西班牙人能以少數部隊贏得壓倒性勝利的根本原因。

  試想，如果西班牙沒有病菌這個隱形的盟友，歷史會怎樣發展？如果天花大瘟疫從未發生，印加帝國仍是完整且強盛的狀態，皮薩羅和他人數極少的隊伍還能輕易的贏下卡哈馬卡的那場戰役嗎？答案或許是否定的。'
