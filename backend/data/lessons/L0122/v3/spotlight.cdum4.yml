lesson_uid: L0122
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略──找出一連串因果
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）；步驟❸ 表格第 1 列的 2 個 ☑ 是**黑色**，屬原稿印的示範
  blocks:
  - type: concept_box
    text: '你有沒有想過，有些事情不是突然發生的，而是一件事接著一件事，像骨牌一樣推下去？我們讀的這篇「隱形的征服者」，就是這樣。

      西班牙人只有168人，怎麼可能打敗8萬印加軍？課文要我們注意：西班牙能以少數軍隊取勝，不只是軍事力量的問題，更因為印加帝國在交戰前已被一連串事件嚴重削弱。

      這些事情不是同時發生的，而是一件接著一件來，形成「一連串因果關係」。

      在前一課：「讓你口中的甜蜜成為遠方農民的希望」我們學到了如何找出「一連串因果」，可以用❶～❹四個步驟，幫助你把文章裡的前因後果看得更清楚。現在我們再來練習看看吧！'
    layout_note: '這個框在 PDF p6 被 LibreOffice 排成左右兩欄且互相重疊，看起來像亂碼；

      document.xml 的文字流是完整乾淨的，本欄以文字層為準。'
  - type: figure
    id: 找出一連串因果四步驟
    referent: 找出一連串因果四步驟流程圖
    text_carrier: image
    content: '找出一連串因果 四步驟

      ❶找事件：識別文章中討論的主要事件／文章討論哪些事

      ❷找線索：尋找文章中的因果關係提示詞／圈出因果提示詞

      ❸判斷因果畫箭頭：分析並標示原因與結果的關係／標出原因與結果

      ❹一連串因果圖：串連形成完整的因果關係鏈／串連完整因果鏈'
    placement_note: 印在概念說明框下方、「一、推論本文的因果關係」之前（PDF p7 上半）
  - type: guide
    text: 一、推論本文的因果關係
  - type: guide
    text: 步驟❶──找事件
  - type: guide
    text: 1.問自己：這段文字提到提到了哪些重要事件或現象？
  - type: guide
    text: ◎小試身手：
  - type: multi
    prompt: 找出文中可能造成印加帝國被削弱或衰敗的事件。先不管發生順序，全部找出來。 (請在□中打勾，複選，有四個答案）
    options:
      1: 天花病菌傳入印加
      2: 繼承人爭奪王位，引發內戰
      3: 人民改說西班牙語
      4: 多年戰亂，政治經濟崩潰
      5: 印加皇帝染疫過世
      6: 皮薩羅帶著168名士兵準備偷襲
    answers:
    - 1
    - 2
    - 4
    - 5
  - type: guide
    text: 步驟❷──找因果線索
  - type: guide
    text: 1.問自己：文章中哪些地方透露出「原因結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？
  - type: guide
    text: '2.祕訣：

      A.「有關鍵詞」的文句：'
  - type: table
    columns:
    - ''
    - 原因
    - 結果
    rows:
    - - 關鍵詞
      - 因為、由於、為了
      - 因此、所以、導致、造成
  - type: guide
    text: 'B.「沒有關鍵詞」的文句：

      判斷策略：加因果關鍵詞，判斷是否為因果句。

      例如：「皇帝死了，內戰爆發。」

      加入關鍵詞「因為皇帝死了，所以內戰爆發。」'
  - type: exercise
    instruction: ◎小試身手
    option_bank:
      1: 是因果句
      2: 不是因果句
    column_header_note: 表格印兩欄：「句子」與「判斷是否為因果句」
    items:
    - type: single
      index: 1
      prompt: 1. 1528年，印加皇帝也染疫去世，兩位繼承人爆發激烈的內戰。
      answer: 1
    - type: single
      index: 2
      prompt: 2.天花透過歐洲水手和士兵傳入美洲，造成印加人民大量死亡
      answer: 1
    - type: single
      index: 3
      prompt: 3.皮薩羅帶著168人偷偷觀察印加軍隊
      answer: 2
    - type: single
      index: 4
      prompt: 4.皇帝染病死亡，引發繼承人爭奪王位，爆發內戰
      answer: 1
  - type: guide
    text: 步驟❸──判斷因果，畫箭頭
  - type: guide
    text: '1.問自己：在找到的因果語句中，「原因」是哪一部分？「結果」是哪一部分？兩者之間如何連接？

      2.祕訣：畫一個箭頭「→」從原因指向結果，就一目了然了！'
  - type: guide
    text: '◎小試身手

      根據上表，請判斷誰是因？誰是果？並畫正確箭頭方向'
  - type: fill_table
    columns:
    - 事件
    - 因
    - 果
    - 箭頭方向
    - 事件
    - 因
    - 果
    answer_carrier: 紅色 ☑ 與紅色「→」；**第 1 列的 ☑ 與 → 是黑色**，屬原稿印的示範
    rows:
    - 事件: 1.天花病菌傳入印加
      因: 1
      果: 2
      箭頭方向: →
      is_printed_example: true
    - 事件: 2.皇帝染病死亡
      因: 1
      果: 2
      箭頭方向: →
    - 事件: 3.內戰與分裂多年
      因: 1
      果: 2
      箭頭方向: →
    rows_note: '每一列印成七格：左事件／因□／果□／箭頭方向／右事件／因□/果□。

      教師版一律勾「左事件＝因、右事件＝果」，所以上表用 1（左邊那一格打勾）

      與 2（右邊那一格打勾）表示；右事件依序是

      1.「印加人大量死亡，皇帝也染病死亡」2.「繼承人爭奪王位，爆發內戰」3.「帝國政治經濟瓦解」。'
    right_events:
      1: 印加人大量死亡，皇帝也染病死亡
      2: 繼承人爭奪王位，爆發內戰
      3: 帝國政治經濟瓦解
  - type: guide
    text: 步驟❹──連成一連串因果
  - type: figure
    referent: 一連串因果鏈示意圖
    text_carrier: image
    content: '虛線框內四組「因→果」串接的示意圖，標籤依序是

      因（1）果、因2 果、因3 果、因4 果'
    content_note: '八個標籤（因1 果1 因2 果2 因3 果3 因4 果4）其實**在文字層**（各自是一個文字方塊），

      只有虛線框與箭頭是圖形。這裡標 text_carrier: image 是因為整塊的空間關係讀不出來；

      標籤本身照原樣列在 labels。'
    labels:
    - 因1
    - 果1
    - 因2
    - 果2
    - 因3
    - 果3
    - 因4
    - 果4
  - type: ordering
    prompt: A.以本文為例，隱含著一條重要的因果鏈。上表我們已經找到3個因果關係，接下來我們再看看它們之間的關係，請排序畫出一條因果鏈。
    instruction: ◎小試身手
    options:
      1: 天花病菌傳入印加地區
      2: 帝國持續內戰與分裂
      3: 皇帝染病死亡
      4: 帝國政治經濟瓦解
    answer:
    - 1
    - 3
    - 2
    - 4
    answer_line_label: B.一連串因果（可以寫編號或寫自己看得懂的關鍵詞）
    answer_text_removed_note: '原本這裡有一行 answer_text，把 answer 的順序渲染成「①…→③…→②…→④…」。

      那是抽取者組裝的散文、不是教材印的字（原稿在這裡是一張表格，

      沒有這樣一條連續字串），所以逐字門判它對不上是對的。

      它也沒有多帶資訊 —— 順序在 answer: [1,3,2,4]，③格寫關鍵詞這件事在 answer_carrier。

      移除而不是豁免：answers_are_graphical 只表示答案是圈線，不豁免題目文字。'
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊；③那一格寫的是關鍵詞而不只是編號
    shape_note: '🔴 這一塊就是 content_known_gaps.yaml#mcq_options_emitted_as_guides 記在
      L0122 的那一筆。

      它**不是選擇題的選項**，是排序題的教師答案；舊管線把它抽成 guide，

      而偵測器 `OPTION_LINE_IN_GUIDE_RE` 只看「開頭是不是①②③④⑤」，於是報成漏出的選項。

      改抽成 `ordering` 之後那個 guide 不存在了 → 這一課的 leaked 會變 0。'
  - type: guide
    text: C.最後造成的總結果：帝國變得非常虛弱、不堪一擊。
  - type: guide
    text: D.這條因果鏈告訴我們：印加帝國在還沒跟西班牙人真正交戰前，已經因為天花傳入，造成大量人民死亡、皇帝染疫去世，進而引發內戰分裂和政治經濟瓦解，變得非常虛弱、不堪一擊。
