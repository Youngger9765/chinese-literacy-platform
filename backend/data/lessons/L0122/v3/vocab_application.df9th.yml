    tip:
      title: 小提點
      text: '「肆虐」與「蔓延」這兩個詞都與事物的擴散有關，但著重的點不同。

        肆虐：指災害、疾病或負面影響的猛烈擴散，帶有破壞性和嚴重程度。

        →這個詞常用來形容災害、戰爭或病毒快速侵害的狀況。

        蔓延：強調範圍逐漸擴大，但不一定帶有劇烈破壞性。

        →這可以用來描述疾病、思想、影響力等的擴散過程。'
