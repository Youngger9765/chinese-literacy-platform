intro: 這篇文章要帶我們回到五百年前，探討一個令人好奇的歷史事件：西班牙人如何以少數兵力征服了強大的印加帝國。文章會從一場懸殊的軍事對峙開始，引導讀者思考，究竟是什麼樣的力量，讓印加帝國在短時間內走向崩潰。透過科學家的研究，我們將了解一種看不見的「敵人」——病菌，如何提前削弱了印加帝國的力量，並對其社會、文化造成了深遠的影響。同時，文章也會解釋為何歐洲人能抵抗這些病菌，而美洲原住民卻束手無策，以及這場瘟疫如何間接影響了人們的信仰。
