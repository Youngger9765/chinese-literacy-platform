strategy_explained: '這一課我們要練習的是，像偵探一樣找出事情發生背後一個接一個的原因，也就是「因果關係」

  因為這篇文章講述西班牙人如何用少數兵力征服強大的印加帝國，裡面就提到了「病菌」這個看不見的敵人，它如何一步步削弱印加的力量，最後導致帝國崩潰，非常適合用來練習找出這一連串的原因

  讀的時候，你可以問問自己：因為有了什麼，所以發生了什麼事，然後又因為那件事，造成了什麼後續的影響呢'
