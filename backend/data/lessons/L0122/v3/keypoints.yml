lesson_uid: L0122
version_id: v3
section_no: 五
keypoints:
  title: 隱形的征服者
  layout: list
  answer_carrier: 橘色手寫 + 紅色 ☑（w:sym Wingdings F0FE，在文字層）+ **紅色手繪連線**（配對題，只能讀圖）
  rows:
  - label: 歷史事件與結局
    value: 事件：1532年，西班牙 皮薩羅率領168名士兵對戰8萬士兵的印加帝國軍隊。西班牙士兵的心理感受？(請打勾，單選)
    options:
      1: 感到畏懼，因為敵軍人數遠遠超過自己
      2: 感到興奮，因為他們深信自己一定會獲勝
    answer: 1
    tail: '結局：印加帝國的崩潰

      1.原本強大的【　】在西班牙人到來後迅速瓦解。

      2.印加人放棄原本的【　】和語言，改信天主教。

      3.【　】語成為南美洲的主要語言。'
    tail_blanks:
    - answer: 印加帝國
    - answer: 信仰
    - answer: 西班牙
  - label: 提問
    items:
    - label: 左欄
      value: 1.勢單力薄的西班牙人在短時間征服印加帝國，靠的是什麼？
    - label: 右欄
      value: 2.為什麼歐洲人攜帶這麼多致命的病菌，自己卻不會生病？
  - label: 說明
    items:
    - value: 賈德‧戴蒙的研究指出，是西班牙人從【　】帶過去的病菌。
      blanks:
      - answer: 歐洲
    - value: 這些疾病在歐洲已經肆虐一千多年；歐洲人逐漸產生【　】。
      blanks:
      - answer: 抗體
  - label: 詳細說明
    matching:
      left_header: 病菌所造成的影響
      right_header: 帝國有什麼改變?
      instruction: (配對連線)
      left:
        1: (1)1524年，歐洲人帶來的天花傳染到美洲，導致大量死亡。
        2: (2)1528年印加皇帝因天花病逝，繼承人爭奪王位，引發長年內戰。
        3: (3)印加人發現信仰天主教的西班牙人沒有生病，認為西班牙人的神才是真神。
      right:
        A: 眾人改變信仰，加速印加帝國的崩解。
        B: 印加帝國長年的內戰，導致帝國政治經濟瓦解。
        C: 大規模疫情，導致8年內印加帝國人口減半。
      answer:
        1: C
        2: B
        3: A
      answer_carrier: 紅色手繪連線（圖形），文字流無此資訊
      answer_note: '原稿只畫了兩條線：(2)→B 與 (3)→A（兩條在圖上交叉）。

        (1) 與 C 的圓點都沒有連線 —— 但 C 是唯一沒被用掉的選項，且語意相符

        （1524 天花傳染導致大量死亡 → 大規模疫情導致 8 年內人口減半）。

        (1)→C 是**由剩餘推得**，不是圖上讀到的。'
  - label: 總結
    value: '1.如果沒有病菌，印加帝國可能不會那麼快被嚴重削弱。

      2.天花等疾病成為西班牙人征服印加的重要推力，改變了美洲的歷史。'
