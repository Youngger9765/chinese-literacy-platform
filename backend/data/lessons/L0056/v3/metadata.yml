intro: 這篇文章透過作者小時候分餅的經驗，引導出人們常常覺得別人擁有的東西比較好的心理。從童年時對餅乾大小的計較，到生活中對他人任務、物品、生活經驗的羨慕，作者發現自己總是不自覺地陷入比較和抱怨。直到讀到馬克‧吐溫《湯姆歷險記》中，湯姆如何將刷油漆變成一件有趣又令人嚮往的「工作」，作者才恍然大悟，領悟到問題的關鍵不在於擁有的多寡，而在於如何看待和享受自己所擁有的。文章最後分享了作者如何運用這個體悟，以積極的態度面對生活中的各種情況。
