section_no: 六
spotlight:
  strategy_name: 正向思考—換個角度看事情
  strategy_type: character
  section_title_printed: 品格聚光燈
  blocks:
  - type: concept_box
    text: '　　作者在文章前面總覺得自己好慘、別人比較幸運；到了文章最後，遇到不順利的事，他卻總說「太精采了」「太棒了」。

      發生的事情真的都變好了嗎？並沒有。改變的是作者看事情的想法。

      接下來，我們先整理作者舉出的三個生活例子，找出他共同使用的轉念方法，再用這些例子讀懂「把手上的餅吃香一點」的意思。最後，試著把這個方法用在自己的生活中。'
  - type: guide
    text: 一、整理例子：看作者怎麼換一個角度看事情
  - type: fill_table
    columns:
    - 發生的事情
    - 這件事原本帶來什麼不順利？
    - 作者怎麼說？
    - 作者把事情重新說成什麼？
    answer_carrier: 第二欄的答案是**紅色 ☑**（圖形），第四欄的【　】是橘色手寫字；文字流裡被勾中的那一項少了「□」
    rows:
    - 發生的事情: 遇到故意找麻煩的人
      這件事原本帶來什麼不順利？: ''
      這件事原本帶來什麼不順利？_options:
        1: 遇到令人不愉快、需要應付的事情
        2: 得到一個精采又難得的生活經驗
      這件事原本帶來什麼不順利？_answer: 1
      作者怎麼說？: 「太精采了，這種經驗一百萬也買不到。」
      作者把事情重新說成什麼？: '把不愉快的遭遇，說成一種

        【　】'
      作者把事情重新說成什麼？_blanks:
      - answer: 難得的經驗
    - 發生的事情: 回程飛機延誤
      這件事原本帶來什麼不順利？: ''
      這件事原本帶來什麼不順利？_options:
        1: 可以繼續留在國外，多玩一天
        2: 不能按照原定時間回家，行程被打亂
      這件事原本帶來什麼不順利？_answer: 2
      作者怎麼說？: 「太棒了，還可以在國外多玩一天。」
      作者把事情重新說成什麼？: '把行程延誤，說成多得到

        【　】'
      作者把事情重新說成什麼？_blanks:
      - answer: 一天旅遊時間
    - 發生的事情: 感染新冠病毒，不能工作
      這件事原本帶來什麼不順利？: ''
      這件事原本帶來什麼不順利？_options:
        1: 身體生病，不能照常工作和生活
        2: 可以在家看電視，而且仍然領薪水
      這件事原本帶來什麼不順利？_answer: 1
      作者怎麼說？: 「在家裡看電視還能領薪水，我也很『困擾』啊！」
      作者把事情重新說成什麼？: '把不能工作，說成可以在家

        【　】'
      作者把事情重新說成什麼？_blanks:
      - answer: 休息又有薪水
  - type: sub_block
    label: 二、用例子讀懂作者的轉念
    instruction: 二、用例子讀懂作者的轉念
    intro: 前面的表格整理了三個生活例子。接著，把這些例子合起來想一想，讀懂作者怎麼面對不順利的事情，以及這些例子和作者領悟的關係。
    answer_carrier: 紅色 ☑（圖形）與橘色手寫字；文字流裡被勾中的選項少了「□」
    items:
    - type: guide
      text: (一)找出例子的共同做法
    - type: single
      prompt: 1.看完三個例子，可以發現作者怎麼面對這三件不順利的事？（單選）
      options:
        1: 否認事情帶來的不方便，假裝問題沒有發生。
        2: 用幽默換一種方式描述自己的處境，不讓自己只停在抱怨裡。
        3: 證明這些事情原本都是值得期待的好事。
      answer: 2
    - type: guide
      text: '→你發現了嗎？

        發生的事情並沒有消失，作者改變的是看待、描述事情的角度。'
    - type: guide
      text: （二）用例子解釋作者的領悟
    - type: guide
      text: '1.作者說：「問題不在餅的大小，而在怎麼樣把手上的餅吃香一點。」

        請根據前面的三個例子，完成下列句子。'
    - type: free_text
      prompt: (1)「手上的餅」是指：自己目前【　】事物或正在面對的處境。
      blanks:
      - answer: 擁有的
    - type: free_text
      prompt: (2)「把餅吃香一點」是指：換一個【　】看自己的處境，不只停在不滿和抱怨裡。
      blanks:
      - answer: 角度
    - type: guide
      text: （三）看懂生活例子的作用
    - type: single
      prompt: 1.第10段列出三個生活例子，對作者的領悟有什麼作用？（單選）
      options:
        1: 補充作者後來還遇到哪些倒楣的事情。
        2: 證明作者後來的生活比其他人更幸運。
        3: 具體說明作者如何在生活中「把手上的餅吃香一點」。
        4: 說明只要說話幽默，就會讓別人羨慕自己。
      answer: 3
  - type: sub_block
    label: 三、換你把手上的餅吃香一點
    instruction: 三、換你把手上的餅吃香一點
    intro: 前面我們從三個生活例子，看見作者如何換一個角度看自己的處境。現在，換你把這個方法用在生活中。
    items:
    - type: guide
      text: （一）辨一辨
    - type: single
      prompt: 數學考不及格，老師多給我一份練習卷。哪一個想法比較能幫助自己面對事情？（單選）
      options:
        1: 怎麼又是我？為什麼別人都不用寫？
        2: 雖然要多寫一份，但可以幫我找出不會的地方，下次再進步。
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流裡被勾中的那一項少了「□」
    - type: guide
      text: →有幫助的轉念不是假裝事情不困難，而是換個角度，看見能幫助自己的地方。
    - type: guide
      text: （二）換你試試看
    - type: free_text
      prompt: '打掃時，我被分配到掃廁所，心想：「掃廁所又髒又累，真是太倒楣了！」

        請幫自己換一個角度想。（答案合理即可）

        掃廁所雖然【　】，但是【　】。'
      blanks:
      - answer: 比較辛苦
      - answer: 把它打掃乾淨，大家使用時會更舒服
      answer_note: '原稿印著「（答案合理即可）」，橘色手寫字是**參考答案**不是唯一解。

        ⛔ 沒有標 no_correct_answer —— 這題教師版有印答案，只是接受其他合理回答。'
