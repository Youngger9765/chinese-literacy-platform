lesson_uid: L0056
version_id: v3
section_no: 五
keypoints:
  title: 把手上的餅吃香一點！
  layout: list
  answer_carrier: 橘色手寫字（圖形字型），文字流的【　】內已填有答案
  rows:
  - label: 問題
    items:
    - label: '1'
      value: '作者百思不解的問題是：

        小時候大人分餅，為什麼每次總覺得【　】？'
      blanks:
      - answer: 姊姊的餅比較大
    - label: '2'
      value: '類似的狀況在生活中層出不窮：

        (1)分組任務時，覺得別人的任務比較【　】。

        (2)看書時，覺得別人手裡的書比較有趣。

        (3)點餐時，覺得別人的餐點比較好吃。

        (4)看同學的家庭，覺得別人的家庭比較【　】。'
      blanks:
      - answer: 輕鬆
      - answer: 溫暖
      tail: →作者遇到的問題是：無論在任何情況中，為什麼別人都比較【　】？
      tail_blank:
        answer: 好/幸運
  - label: 轉念契機
    items:
    - label: '1'
      value: 作者讀到【　】中刷籬笆的故事，解決了他的問題。
      blanks:
      - answer: 湯姆歷險記
    - label: '2'
      value: 湯姆的姨媽要他去【　】，一開始他刷得【　】。後來他把自己想成正在創作偉大壁畫的藝術家，全神投入。
      blanks:
      - answer: 刷籬笆
      - answer: 不甘願
  - label: 領悟
    value: 原來問題不在於【　】，而在怎麼把手上的餅【　】。
    blanks:
    - answer: 餅的大小
    - answer: 吃香一點
  - label: 後來做法
    label_note: PDF 因分頁把這格切成「後來」（第 5 頁）與「做法」（第 6 頁），文字流是同一格。
    value: 作者遇到不順利的事時，會試著換個角度看，用【　】的方式面對。
    blanks:
    - answer: 幽默
