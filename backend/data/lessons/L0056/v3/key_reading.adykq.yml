  passage: 看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒賴一下，就可以把餅換回來。真的換回來後，我就開始吃了。我狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？
