lesson_uid: L0016
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論代名詞
  strategy_type: inference
  blocks:
  - type: concept_box
    text: '之前我們學過，代名詞也叫做指稱詞，像「你、我、他、牠、它」，可以代替前面出現的人、動物或東西，讓句子不用一直重複同一個詞。

      這一課我們要學「這、那、這些」這類的代名詞。它們常常指前面提到的一件事或一種情況。讀文章時，如果能知道「這、那、這些」指的是什麼，就更容易讀懂文章。'
  - type: guide
    text: '◎ 小試身手：

      閱讀題目，並回到課文段落閱讀，勾選出指稱詞（框框內的語詞）所代表的事物。'
  - type: concept_box
    text: '推論三步驟：

      1.往前文找找：代名詞代替的人物、狀況，多是文章前面有提到的內容、事物。當不確定代名詞在指什麼時，可以往前文找找，再根據代名詞後面的描述來推論。

      2.圈詞＋畫線：往前文找找時，你可以先把代名詞(他/她/它/牠、這/那)圈起來，畫條線連到指稱的對象。會更清楚喔。

      3.代入句子讀讀看：如果你還不太確定，可以把指稱的對象，替換到句子中讀讀看，讀起來合理了，就對了。

      例如：

      雖然老師連假前派了一堆作業，但這對美美來說是小意思。'
    note: 例句上有手繪標註：「一堆作業」被橘圈圈起、「這」被紅圈圈起，一條紅箭頭從「這」指回「一堆作業」，旁邊另有一個藍色虛線框寫著「一堆作業」。
  - type: sub_block
    label: ◎ 小試身手
    left_header: 課文段落---指稱詞（框框內的語詞）
    right_header: 勾選出指稱詞所代表的事物
    items:
    - type: single
      index: 1
      source_paragraph: 1
      prompt: (第一段)我心想這人的確蠻不錯，聽說還常常幫忙同學，講話又幽默，或許是個很有意思的人。
      referent: 這人
      options:
        1: 旁邊的朋友
        2: 隔壁班同學
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: single
      index: 2
      source_paragraph: 1
      prompt: (第一段)但我最愛的笑話類型是諧音冷笑話，不知道他會不會覺得跟這種人相處起來很沒意思呢？
      referent: 這種人
      answer_template: 這種人=（　）諧音冷笑話的人
      options:
        1: 喜歡
        2: 不喜歡
      answer: 1
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: single
      index: 3
      source_paragraph: 3
      prompt: (第三段)在我們的日常對話中，「意思」可不只是「意義」這麼簡單，它還能變化出許多不同的意義。
      referent: 它
      options:
        1: 「意思」這個詞
        2: 「意義」這個詞
      answer: 1
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: single
      index: 4
      source_paragraph: 4
      prompt: (第四段)今天家政課，我們做杯子蛋糕，從準備材料、打蛋、進烤箱，到最後吃到成品，這過程真的很有意思！
      referent: 這過程
      options:
        1: 吃杯子蛋糕的過程
        2: 做杯子蛋糕的過程
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: single
      index: 5
      source_paragraph: 4
      prompt: (第四段)但有小組卻因為誤會彼此的意思而吵架，事後還說：「這根本一點意思都沒有！」
      referent: 這
      options:
        1: 一起做杯子蛋糕
        2: 誤會彼此的意思
      answer: 1
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: single
      index: 6
      source_paragraph: 6
      prompt: (第六段)也正因為這些不同，讓語言變得這麼好玩、有趣。
      referent: 這些不同
      options:
        1: 圖案的不同
        2: 意思的不同
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: sub_block
    label: ◎推論小偵探
    instruction: 底下文字中的「這」是指不同的事情，請試試看推論「這」是指什麼？
    items:
    - type: passage
      paragraphs:
      - 小恩今天到教室後，發現抽屜裡多了一張紙條。這會是誰放的呢？他心裡有點驚訝。紙條上寫著：「加油！你一定可以的！」看到這，小恩忍不住笑了。他立刻想到，是不是昨天他和朋友說完自己很擔心數學考試後，朋友偷偷放的？
    - type: free_text
      prompt: A：第一個「這」是指（　）；第二個「這」是指（　）
      blanks:
      - answer: 紙條
      - answer: 紙條上的字
