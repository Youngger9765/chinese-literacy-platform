lesson_uid: L0016
version_id: v3
section_no: 五
keypoints:
  title: 這是什麼「意思」？
  intro: 本篇文章運用小故事方式舉出了「意思」不同的用法，現在就請你讀一讀例句，選出「意思」在句子中的解釋，並填入代號。
  layout: matrix
  columns:
  - 例句
  - 配對
  column_note: 第二欄表頭印「配對(填代號)」；第三欄「解釋選項」是整欄合併的共用選項，收在 option_bank
  option_bank:
    A: 表達歉意或害羞
    B: 表示對某人有好感
    C: 指人很有趣、有魅力
    D: 表示人無趣、不好相處
    E: 活動、事情的有趣或無趣
    F: 想法
    G: 指這件事很簡單、沒什麼難度
    H: 用一點小東西，表示心意或感謝
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  rows:
  - 例句: 1.這訓練量對先發選手來說只是「小意思」。
    配對: G
  - 例句: 2.他「意思意思」捐了點錢，表達對活動的支持。
    配對: H
  - 例句: 3.相處久了，其實就會知道這個人「沒什麼意思」。
    配對: D
  - 例句: 4.一直到現在我都還搞不清楚他當初是什麼「意思」。
    配對: F
  - 例句: 5.他一直找話題跟我聊天，是不是對我「有意思」？
    配對: B
  - 例句: 6.他對很多事情都能分享想法，真是「有意思」的人。
    配對: C
  - 例句: 7.臨時才拜託他幫忙，還真的是有點「不好意思」。
    配對: A
  - 例句: 8.這個展覽結合了許多AI互動，真的「很有意思」。
    配對: E
