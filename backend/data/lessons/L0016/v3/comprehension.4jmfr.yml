version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項「　」中的語詞，何者使用正確？
    options:
      A: 他在開場時「總結」了今天的重點，讓大家十分期待
      B: 面對即將到來的園遊會，班上已經「連忙」作足準備
      C: 陷入低潮時，「不妨」換個角度看看，也許會有新發現
      D: 國家代表隊舉辦盛大的慶祝活動，對球迷「略表」感謝
    teacher_note: '(A)「總結」放在活動最後，宜用「揭示」

      (B)宜用「趁早」

      (D)場面盛大，不是「略表」，宜用「表達」'
  - index: 2
    answer: B
    stem: 根據第四段「這根本一點意思都沒有！」這句話最可能表達什麼心情？
    options:
      A: 認為活動簡單，缺乏挑戰性
      B: 認為事情讓人很失望與生氣
      C: 覺得組員們講的話太過傷人
      D: 覺得老師安排的課程沒意義
    teacher_note: 從段四和同學吵架可看出。
  - index: 3
    answer: D
    stem: 根據文章最後一段「下次再看到這個詞時，不妨停下來想一想：這是什麼『意思』呢？」，這句話的用意最可能是什麼？
    options:
      A: 建議讀者閱讀時應該放慢速度
      B: 鼓勵讀者多背熟「意思」的定義
      C: 諷刺現代人對語言的使用太過隨便
      D: 引導讀者透過文章內容思考語詞意義
    teacher_note: 從最後一段強調「參考前後文，才看得出它真正的圖案」可知要透過文章內容了解。
  - index: 4
    answer: B
    stem: 這篇文章主要在說明什麼？
    options:
      A: 「意思」是中文裡最難理解的詞語
      B: 同一個詞語在不同情況中會有不同的意義
      C: 語言的使用應該盡量簡單清楚，避免誤會
      D: 多使用諧音字詞和成語能讓語言更有深度
    teacher_note: 文章中舉出了許多「意思」的意義，其他選項皆未提及。
  - index: 5
    answer: A
    stem: 下列哪一句話中的「意思」與「我不是這個意思，你別誤會了」的「意思」用法最接近？
    options:
      A: 我聽不太懂你的「意思」是什麼
      B: 他說這點小「意思」，不用放在心上
      C: 真是沒「意思」的聚會，浪費我時間
      D: 在這麼重要的聚會遲到真是不好「意思」
    teacher_note: '題幹和(A)都是指「想法」(B)心意

      (C)趣味(D)表達抱歉'
