passage: '有一次，我走路不小心撞到隔壁班的同學，連忙說：「不好意思！」他不但沒生氣，還笑著說：「沒關係！」沒想到旁邊的朋友小聲的說：「我覺得他可能對你有意思喔。」我心想這人的確蠻不錯，聽說還常常幫忙同學，講話又幽默，或許是個很有意思的人。但我最愛的笑話類型是諧音冷笑話，不知道他會不會覺得跟這種人相處起來很沒意思呢？

  你發現了嗎？這段短短的對話裡，出現了好多種「意思」！

  在我們的日常對話中，「意思」可不只是「意義」這麼簡單，它還能變化出許多不同的意義。我們可以總結一下剛剛的用法：

  我們再來看看這一段日常場景：

  今天家政課，我們做杯子蛋糕，從準備材料、打蛋、進烤箱，到最後吃到成品，這過程真的很有意思！但有小組卻因為誤會彼此的意思而吵架，事後還說：「這根本一點意思都沒有！」下課後，老師請我們幫忙收拾環境，雖然器具很多，但對常做家事的我來說，實在是小意思。結束後，老師拿出自己做的手工餅乾，說要意思意思請我們吃幾片，感謝我們的幫忙。'
