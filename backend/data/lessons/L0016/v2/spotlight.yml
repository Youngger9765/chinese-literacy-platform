spotlight:
  lesson: G4-L5
  strategy_name: 推論策略-推論代名詞
  strategy_type: inference
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 閱讀題目，並回到課文段落閱讀，勾選出指稱詞（框框內的語詞）所代表的事物。
  - type: guide
    text: 推論三步驟：
  - type: free_text
    prompt: 1.往前文找找：代名詞代替的人物、狀況，多是文章前面有提到的內容、事物。當不確定代名詞在指什麼時，可以往前文找找，再根據代名詞後面的描述來推論。
  - type: free_text
    prompt: 2.圈詞＋畫線：往前文找找時，你可以先把代名詞(他/她/它/牠、這/那)圈起來，畫條線連到指稱的對象。會更清楚喔。
  - type: free_text
    prompt: 3.代入句子讀讀看：如果你還不太確定，可以把指稱的對象，替換到句子中讀讀看，讀起來合理了，就對了。
  - type: guide
    text: 一堆作業一堆作業例如：雖然老師連假前派了一堆作業，但這對美美來說是小意思。
  - type: table
    rows:
    - - ''
      - 課文段落---指稱詞（框框內的語詞）
      - 勾選出指稱詞所代表的事物
    - - '1'
      - (第一段)我心想這人的確蠻不錯，聽說還常常幫忙同學，講話又幽默，或許是個很有意思的人。
      - 這人=□①旁邊的朋友□隔壁班同學
    - - '2'
      - (第一段)但我最愛的笑話類型是諧音冷笑話，不知道他會不會覺得跟這種人相處起來很沒意思呢？
      - 這種人=( □①喜歡  □②不喜歡 )諧音冷笑話的人
    - - '3'
      - (第三段)在我們的日常對話中，「意思」可不只是「意義」這麼簡單，它還能變化出許多不同的意義。
      - 它=□①「意思」這個詞 □②「意義」這個詞
    - - '4'
      - (第四段)今天家政課，我們做杯子蛋糕，從準備材料、打蛋、進烤箱，到最後吃到成品，這過程真的很有意思！
      - 這過程=□①吃杯子蛋糕的過程□②做杯子蛋糕的過程
    - - '5'
      - (第四段)但有小組卻因為誤會彼此的意思而吵架，事後還說：「這根本一點意思都沒有！」
      - 這=□①一起做杯子蛋糕□②誤會彼此的意思
    - - '6'
      - (第六段)也正因為這些不同，讓語言變得這麼好玩、有趣。
      - 這些不同=□①圖案的不同 □②意思的不同
  - type: guide
    text: ◎推論小偵探：
  - type: guide
    text: 底下文字中的「這」是指不同的事情，請試試看推論「這」是指什麼？
  - type: passage
    source: unknown
    paragraphs:
    - 小恩今天到教室後，發現抽屜裡多了一張紙條。這會是誰放的呢？他心裡有點驚訝。紙條上寫著：「加油！你一定可以的！」看到這，小恩忍不住笑了。他立刻想到，是不是昨天他和朋友說完自己很擔心數學考試後，朋友偷偷放的？
    - A：第一個「這」是指(  紙條   )；第二個「這」是指(  紙條上的字   )
    - (A)「總結」放在活動最後，宜用「揭示」(B)宜用「趁早」(D)場面盛大，不是「略表」，宜用「表達」(A)「總結」放在活動最後，宜用「揭示」(B)宜用「趁早」(D)場面盛大，不是「略表」，宜用「表達」請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
