      B: 認為事情讓人很失望與生氣
      C: 覺得組員們講的話太過傷人
      D: 覺得老師安排的課程沒意義
    rationale: 從段四和同學吵架可看出。
  - index: 3
    answer: D
    stem: 根據文章最後一段「下次再看到這個詞時，不妨停下來想一想：這是什麼『意思』呢？」，這句話的用意最可能是什麼？
    options:
      D: 在這麼重要的聚會遲到真是不好「意思」
      A: 我聽不太懂你的「意思」是什麼
      B: 他說這點小「意思」，不用放在心上
      C: 真是沒「意思」的聚會，浪費我時間
    rationale: 從最後一段強調「參考前後文，才看得出它真正的圖案」可知要透過文章內容了解。
