  passage: 在比賽中，啦啦隊的加油聲、場邊觀眾的應援，常能幫助提振士氣，重整旗鼓，心中的啦啦隊也是。這些啦啦隊成員，可以是給予我們支持、肯定的人，也可以是自己。然後，把心中的「擔心」化為給自己的「祝福」和「打氣」。例如，擔心自己表現不好會拖累隊友，就可以在心裡許下祝福，對自己說：「祝福我能夠如常發揮實力」、「祝福我能和隊友並肩作戰」，或是對自己說：「我可以的！我也會是可靠的隊友！」這種對內心喊話的力量，在奧運金牌舉重選手郭婞淳身上也發揮了極大的作用。她說每當面對大賽，她總會在心裡一遍又一遍為自己打氣：「妳準備了那麼久，一定可以做得到」、「要相信自己，一定可以做到」，像是循環播放一樣，不斷重複的說。因此，下次發現焦慮又找上門時，可以像大谷翔平一樣，善用自己「想很多」的能力，將大目標拆解成一個個小目標，先跨出一小步，也為自己的小小成就慶賀。也可以像郭婞淳一樣，召喚內心的啦啦隊出來應援，在內心對自己喊話。比起把「想很多」當成弱點，或許也可以慢慢練習去看見、去欣賞：這份情緒，藏著你的在乎；這份焦慮，也能成為助力。
  start_text: 在比賽中，啦啦隊的加油聲、場邊觀眾的應援，常能幫
