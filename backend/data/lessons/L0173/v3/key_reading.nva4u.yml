  passage: 在比賽中，啦啦隊的加油聲、場邊觀眾的應援，常能幫助提振士氣，重整旗鼓，心中的啦啦隊也是。這些啦啦隊成員，可以是給予我們支持、肯定的人，也可以是自己。然後，把心中的「擔心」化為  給自己的「祝福」和「打氣」。例如，擔心自己表現不好會拖累隊友，就可以在心裡許下祝福，對自己說：「祝福我能夠如常發揮實力」、「祝福我能和隊友並肩作戰  」，或是對自己說：「我可以的！我也會是可靠的隊友！」
