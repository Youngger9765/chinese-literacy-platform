spotlight:
  lesson: 體-L7
  strategy_name: 品格力-把焦慮化為助力
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎當我們感到擔心、焦慮時，可以先判斷：當下還有沒有可以採取的努力或行動？如果有，則把焦慮化為行動；如果沒有，就練習將焦慮化為打氣。我們可以先透過以下情境來練習！
  - type: table
    rows:
    - - 情境
      - 當下有可以採取的行動嗎？
    - - 1.開學剩不到一個禮拜，還有好多暑假作業還沒寫完
      - 'A.有→立刻採取行動

        □B.沒有→穩住自己，幫自己打氣'
    - - 2.鼓起勇氣和喜歡的人告白，但對方還沒給我回覆，要我等等
      - '□A.有→立刻採取行動

        B.沒有→穩住自己，幫自己打氣'
    - - 3.站在大隊接力的跑道上，準備聽槍聲起跑
      - '□A.有→立刻採取行動

        B.沒有→穩住自己，幫自己打氣'
  - type: guide
    text: ◎腦力激盪──把焦慮化為「行動」：有時候我們的焦慮其實來自於缺乏行動的方向。大谷翔平將每個目標拆解成具體努力的方法，這樣就能化解焦慮了。現在換你試試，來為自己設定目標、行動、努力方法，及目標檢核吧！
  - type: guide
    text: "例：目標──我希望我的唱歌技術可以進步。\n  行動──每個禮拜學習一首新歌。"
  - type: table
    rows:
    - - 努力方法
      - 時間
      - 地點
      - 頻率+份量
    - - 1.把歌聽熟
      - 搭公車的時候
      - 公車上
      - 每天一首
    - - 2.記歌詞
      - 搭公車的時候
      - 公車上
      - 每天兩首歌
    - - 3.練習唱歌
      - 洗澡時
      - 浴室
      - 每天一首歌
  - type: guide
    text: 目標檢核──在班級同樂會上唱歌給大家聽。
  - type: guide
    text: "練習：目標──我希望_________________________________ 可以進步。\n  行動──____________________________________________________"
  - type: table
    rows:
    - - 努力方法
      - 時間
      - 地點
      - 頻率+份量
  - type: guide
    text: 目標檢核──__________________________________________________
  - type: guide
    text: ◎處方二：化焦慮為「打氣」：有些時候，已經很努力的準備，腦袋卻還是一直擔心、想著「萬一失敗怎麼辦」。這時可以練習把腦中的焦慮語句，改成比較能幫助自己的話。
  - type: single
    prompt: 1. 回想一個你時常感到緊張焦慮的情境（例如：考試、上台、比賽），那時腦中最常冒出哪一句話？請選一個最像你的想法。
    options:
    - 我一定不能失誤。
    - 如果我失誤，會讓人很失望。
    - 我這麼緊張，等一下會表現失常。
    - 我如果表現不好，就代表我很差。
    - 其他：____________________________________
    answer: 我一定不能失誤。
  - type: single
    prompt: 2. 這些話往往會讓人更焦慮，為什麼呢？請根據你上一題選的話，選一個它可能讓你更焦慮的原因。
    options:
    - 它要求自己一定要完美。
    - 它把別人的眼光想得太可怕。
    - 它把緊張看成一定會失敗。
    - 它把一次表現變成整個人的價值。
    - 其他：____________________________________
    answer: 它要求自己一定要完美。
  - type: free_text
    prompt: 3. 把焦慮的話，改成能幫助自己的話：請在右欄勾選你說得出口的打氣句。
  - type: guide
    text: （沒有標準答案）
  - type: table
    rows:
    - - '焦慮時

        腦中的話'
      - 你可以給自己的打氣句(可複選)
    - - ①我一定不能失誤
      - '□A.我會專注做好下一步，就算失誤了也可以調整回來

        □B.沒有人是完美的機器人，失誤了就馬上修正、繼續拚回來'
    - - ②如果我失誤，大家會怪我
      - '□A.我不能控制別人怎麼想，但我可以控制自己下一步怎麼做

        □B.我們是一個團隊，就算我失誤了，我的隊友也會幫我補位'
    - - ③我這麼緊張，等一下會失常
      - '□A.緊張代表我在乎，我可以帶著緊張完成眼前的任務

        □B.心跳變快是身體在熱身，這代表我正全力以赴、準備爆發'
    - - ④我表現不好，就代表我很差
      - '□A.這只是一次表現，不代表我這個人沒有價值

        □B.這次沒做好不代表以後都輸，學到的經驗是我變強的武器'
  - type: single
    prompt: 4.加入其它啦啦隊：當你感到壓力、焦慮時，以下哪些話會讓你覺得被支持呢？可以把它留在心裡，變成對內心的喊話。
    options:
    - 謝謝你沒有放棄，願意去做，本身就很不容易。
    - 你已經夠好了，也確實盡力了，不完美也沒關係。
    - 儘管害怕但還是願意踏出一步的樣子，很帥哦！
    - 你不需要很厲害才開始，你要開始才會變得很厲害。
    - 你已經盡了最大的努力，剩下的就交給時間。
    - 先別急著否定自己，你其實比想像中更有力量。
    - 這一刻不順，不代表你不夠好；你還是可以慢慢做到。
    - 就算此刻表現不理想，你依然重要且值得被好好對待。
    answer: 謝謝你沒有放棄，願意去做，本身就很不容易。
  - type: guide
    text: 也可以寫下你安慰朋友、鼓勵朋友時，最常說的話，轉換成給自己的鼓勵：
  - type: guide
    text: ________________________________________________________________
  - type: guide
    text: →下次遇到挑戰，你最想大聲對自己說：
  - type: guide
    text: →焦慮不一定要消失。重要的是，我能不能在焦慮中，找回自己的力量。還有一些話，也可以放在心裡，當作加油站！
