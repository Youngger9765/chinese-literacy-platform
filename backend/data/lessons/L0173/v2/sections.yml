comprehension:
  questions:
  - index: 2
    answer: B
    stem: 根據第一段，作者說「他們一定也恨不得為大腦安裝一個暫停鍵」，這句話是指焦慮者會有什麼樣的心聲？
    options:
      B: 鼓勵大家對焦慮的人說「不要想太多」來給予安慰
      C: 成功的關鍵在於天賦，想得再多也無法改變結果
      D: 焦慮是成功的絆腳石，應該透過運動來釋放壓力
      A: 學習如何與焦慮共處，並將其轉化為行動的能量
    rationale: 從前後文可看出焦慮者自己也很希望這些念頭可以停止。
  - index: 5
    answer: D
    stem: 下列描述何者最符合「內心啦啦隊」的概念？
    options:
      B: 模仿啦啦隊的舞蹈口號，幫自己打起精神
      C: 設立具體的目標行動，要求自己必須達成
      D: 練習像家人、朋友一樣對自己說鼓勵的話
    rationale: D)符合將焦慮轉化成打氣的方法。
