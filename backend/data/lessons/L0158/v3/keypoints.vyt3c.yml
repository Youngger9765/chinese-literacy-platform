keypoints:
  title: 不量田
  layout: matrix
  columns:
  - 元素
  - 內容摘要
  intro: '本課課文是蒲松齡所寫的短篇小說故事。

    故事體的結構一般包含：「故事背景」、「起因」、「問題」、「解決」、「結果」等，你在讀故事時，若用「故事結構」去讀，讀完後，用故事結構去理解、回想，你可以更容易理解、更容易記憶哦！

    請利用故事結構，配合課文內容，在【 】處填入原文，找不到原文時，再用自己的話寫。'
  answer_carrier: 橘色手寫（run 層 w:color ＋ 字元樣式兩種），文字流有此資訊
  rows:
  - 元素: 背景
    內容摘要: 某位【　】來到【　】時，為了躲避大【　】，便躲到田間。
    內容摘要_blanks:
    - answer: 賈人/商人
    - answer: 直隸界/河北省界
    - answer: 冰雹
  - 元素: 起因
    內容摘要: '神祕經歷

      空中有聲音說：「這是【　】田，不要傷害他的莊稼。」'
    內容摘要_blanks:
    - answer: 張不量
  - 元素: 問題
    內容摘要: '產生疑惑

      這個叫【　】的人，為何受上天保佑？'
    內容摘要_blanks:
    - answer: 不良
  - 元素: 解決
    內容摘要: '向村民尋求答案

      這個叫【　】的人非常富有，積蓄的【　】很多。

      他借給【　】的穀物，人家償還多少都不計較，不曾拿工具測量，所以大家才叫他【　】。'
    內容摘要_blanks:
    - answer: 張不量
    - answer: 粟/穀物
    - answer: 貧民/窮人
    - answer: 不量
  - 元素: 結果
    內容摘要: '商人恍然大悟

      是自己誤解了人家名字的意思。

      眾人趕到田中，發現只有張不量的田【　】。'
    內容摘要_blanks:
    - answer: 無恙/一點事也沒有
  rows_note: 每一列的第一行小標（神祕經歷／產生疑惑／向村民尋求答案／商人恍然大悟）是灰底，不是空格
