lesson_uid: L0158
version_id: v3
classical_text:
  source_label: 清朝・蒲松齡
  punctuation_note: '原文的「.」是學習單印的**斷詞記號**（朗讀說明第 2 條明寫），不是句號。

    「雨／量」等字在文字層夾了隱藏 variation selector（U+E01Ex），比對前濾掉 Cf/Mn。

    注釋編號在原文裡是上標數字（1~5），本欄照文字層原樣保留在句中。'
  paragraphs:
  - 賈人.某，至.直隸1界，忽.大雨2雹，伏.禾中。聞.空中.云：「此.張不量田，勿傷.其稼。」賈.私意.張氏既云「不良」，何反.佑護？雹止，入村，訪問.其人，且問.取名之義。
  - 蓋.張素豐，積粟.甚富。每春間.貧民就貸，償時.多寡不較，悉納之，未嘗.執概3取盈4，故名.「不量」，非.不良也。眾趨.田中，見稞穗.摧折如麻，獨.張氏諸田.無恙5。
  annotations_label: 注釋
  annotations:
  - index: 1
    term: 直隸
    text: 清代的直隸省，現在中國的河北省。
  - index: 2
    term: 大雨雹
    text: 雨，當動詞，表示落下的意思。「大雨雹」的意思是下了很大的冰雹。
  - index: 3
    term: 概
    text: 用來刮平「米斗」的工具。米斗，交易時用來測量米量的容器。
  - index: 4
    term: 盈
    text: 有「滿」的意思，課文是指足夠的數量。
  - index: 5
    term: 恙
    text: 疾病或異樣。「無恙」的意思是沒有病痛、憂慮，課文是指沒事。
  qr_note: 「清朝・蒲松齡」那一格右側印了一個 QR code
