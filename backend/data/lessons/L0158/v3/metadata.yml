intro: 這篇文章講述一位商人來到直隸時，遇到一場突如其來的冰雹。奇怪的是，冰雹似乎避開了某位張先生的田地。商人對此感到好奇，於是向村民打聽。原來，這位張先生因為心地善良，借糧給貧窮的村民時，從不斤斤計較，也不會刻意多收利息，所以大家稱他為「不量」先生，意思是「不計較、不衡量」。這場冰雹似乎也因為他的仁慈而繞過了他的田地，讓他的收成完好無損。文章透過這個故事，讓我們思考善良的行為所帶來的影響。
