lesson_uid: L0158
version_id: v3
section_no: 四
spotlight:
  strategy_name: 判讀主語
  strategy_type: classical_grammar
  section_title_printed: 文言文聚光燈
  answer_carrier: 橘色手寫代號與填空（run 層 w:color ＋ 字元樣式），文字流有此資訊
  blocks:
  - type: concept_box
    text: '在古代，「寫字」是一件很花錢的事，以致古人寫字時惜字如金，能省則省，但這往往造成我們閱讀文言文時產生困難，所以，如果我們能了解文言文省略了什麼，就比較能理解文章。

      文言文省略的成分很多，其中一種就是省略「主語」。但，主語是什麼？'
  - type: sub_block
    label: 一、什麼是主語
    value: 主語是句子中做動作的人或物，或是句子所形容的對象
    value_note: '這一句印在一個虛線框裡；框內「做動作的」與「所形容的」是**白字黑底**（反白），

      並各有一條藍色指示線分別指向例1的「看書」與例2的「真是美極了」。

      指示線是圖形（`srgbClr 4472C4`），文字全在文字層。'
    items:
    - sub_label: 例1：哥哥在房間裡看書。
      value: '找到動詞，看書。

        「看書」的是「哥哥」，所以「哥哥」就是這個句子的主語。'
    - sub_label: 例2：夏夜的景色真是美極了。
      value: '找到形容詞，真是美極了。

        「真是美極了」的是「夏夜的景色」，所以「夏夜的景色」就是這個句子的主語。'
  - type: exercise
    instruction: 二、換你試試看！請選出下列各句的主語
    items:
    - type: single
      index: 1
      stem: 微風輕輕地吹拂著。
      options:
        A: 微風
        B: 吹拂著
      answer: A
    - type: single
      index: 2
      stem: 人類的本性是善惡摻雜的。
      options:
        A: 人類
        B: 人類的本性
      answer: B
    - type: single
      index: 3
      stem: 月光多麼明亮皎潔。
      options:
        A: 月光
        B: 明亮皎潔
      answer: A
    - type: single
      index: 4
      stem: 他是否缺席要確認一下。
      options:
        A: 他
        B: 他是否缺席
      answer: B
  - type: guide
    text: '三、文言文主語的判讀方式

      　　現在，你已經知道什麼是主語了。回到主題，如何判斷省略主語的文言文句子，被省略的主語是什麼呢？如何「補回」?我們可以從中文的四個基本句型來思考：'
  - type: table
    instruction: 　中文基本句型
    columns:
    - 句型
    - 句型結構
    - 形式
    - 例句
    rows:
    - - 敘事句
      - 主語+動詞
      - 誰做什麼
      - 哥哥在房間看書。
    - - 表態句
      - 主語+形容詞
      - 誰怎麼樣
      - 天氣很熱。
    - - 有無句
      - 主語+有/沒有
      - 誰有沒有
      - 這裡沒有網路。
    - - 判斷句
      - 主語+是/不是
      - 誰是不是
      - 春天是繁花盛開的季節。
    rows_note: 「主語」與例句中的主語部分在原稿是灰底
  - type: guide
    text: 　觀察基本句型的形式，可以歸納出還原省略主語的步驟：
  - type: concept_box
    text: '1.找動詞(包括有/沒有、是/不是)或形容詞。

      2.判斷是「誰做什麼」、「誰怎麼樣」、「誰有/沒有」、「誰是/不是」以確認主語'
    text_note: 印在一個虛線框裡
  - type: sub_block
    label: 　　例1：「蓋張素豐，(張)積粟甚富。」
    value: '1.找到「素豐」跟「積粟甚富」這些形容。

      2.由第一句的「張素豐」判斷，這兩個句子的主語都是張氏，只是第二句省略了主語。'
  - type: sub_block
    label: 例2：「賈人某，至直隸界，(天)忽大雨雹，(賈人某)伏禾中。」
    value: '1.找到「至直隸界」、「大雨雹」、「伏禾中」這些動作。

      2.結合第一句的主語賈人某，判斷是「賈人某至直隸界」、「賈人某伏禾中」；但賈人某無法下冰雹，能下冰雹的是天。'
    value_note: 例1、例2 括號裡補上的主語（張／天／賈人某）是原稿印的黑字示範，不是橘色答案
  - type: guide
    text: 四、換你試試看
  - type: exercise
    instruction: '1.下面的文字取自部分課文，請根據提問判讀主語：

      「雹止，入村，訪問其人，且問取名之義。」'
    option_bank:
      A: 賈人某
      B: 張氏
      C: 貧民
      D: 村民
    items:
    - type: single
      index: 1
      stem: 雹止後，誰「入村」？
      answer: A
    - type: single
      index: 2
      stem: 誰「訪問其人」？
      answer: A
    - type: single
      index: 3
      stem: 誰「且問取名之義」？
      answer: A
  - type: sub_block
    label: 請將主語補上➡
    value: 「（　）入村，（　）訪問其人，（　）且問取名之義。」
    blanks:
    - answer: 賈人某
    - answer: 賈人某
    - answer: 賈人某
    label_note: 「➡」是**字面字元**（U+27A1，在 w:t 裡），照抄保留；本課沒有任何 w:sym 符號箭號
  - type: exercise
    instruction: '2.下面文字依然節錄課文，請根據提問判讀主語：

      「每春間貧民就貸，償時多寡不較，悉納之，未嘗執概取盈。」'
    option_bank:
      A: 賈人某
      B: 張氏
      C: 貧民
      D: 村民
    items:
    - type: single
      index: 1
      stem: 誰「償」?
      answer: C
    - type: single
      index: 2
      stem: 誰「多寡不較」?
      answer: B
    - type: single
      index: 3
      stem: 誰「悉納之」?
      answer: B
    - type: single
      index: 4
      stem: 誰「未嘗執概取盈」?
      answer: B
  - type: sub_block
    label: 請將主語補上➡
    value: 「每春間貧民就貸，（　）償時，（　）多寡不較，（　）悉納之，（　）未嘗執概取盈。」
    blanks:
    - answer: 貧民
    - answer: 張氏
    - answer: 張氏
    - answer: 張氏
  - type: exercise
    instruction: '3.「人有盜刈淳于恭禾者，恭見之，念其愧，因伏草中，至去乃起。」

      (注：盜刈，偷偷割取)根據上文回答下列問題：'
    teacher_note: 翻譯：有人偷偷割取淳于恭的稻禾，淳于恭看到了，顧念那人看到自己會感到羞愧，因此就趴在草叢中，等到對方離去才起來。
    teacher_note_carrier: 紅色文字（run 層 w:color FF0000）的文字方塊，印在題目右側
    items:
    - type: single
      index: 1
      stem: 誰「盜刈」?
      options:
        A: 人
        B: 淳于恭
      answer: A
    - type: single
      index: 2
      stem: 承上，「盜刈」了什麼？
      options:
        A: 淳于恭
        B: 淳于恭的禾
      answer: B
    - type: single
      index: 3
      stem: 誰「念其愧」?
      options:
        A: 人
        B: 淳于恭
      answer: B
    - type: single
      index: 4
      stem: 誰「因伏草中」?
      options:
        A: 人
        B: 淳于恭
      answer: B
    - type: single
      index: 5
      stem: 「至去乃起」一句有兩個動詞。請問：誰「去」、誰「起」，主語依序應是誰?
      options:
        A: 人、淳于恭
        B: 淳于恭、人
      answer: A
