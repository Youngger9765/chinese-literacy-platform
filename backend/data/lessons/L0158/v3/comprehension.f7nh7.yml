comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列選項「」中字，何者字音、字義完全正確？
    options:
      A: 忽大雨「雹」——ㄅㄠˋ，冰雹
      B: 償時多寡不較，「悉」納之——ㄒㄧ，吸收
      C: 「蓋」張素豐——ㄍㄞˋ，大概
      D: 獨張氏諸田無「恙」——ㄧㄤˋ，異樣
    explanation: 第1題解析：A字音ㄅㄠˊ；B字義「全部」；C字義「原來」。
    teacher_note: A字音ㄅㄠˊ；B字義「全部」；C字義「原來」。
  - index: 2
    answer: A
    stem: 課文中的商人把「不量」誤以為是「不良」，從而產生疑惑，這就是諧音雙關。請問下列何者造成誤解的原因與課文商人相同？
    options:
      A: '店員：「請問您是付清嗎?」；

        客人：「不、不，我是叔叔。」'
      B: '客人：「我買了這麼多，可以送我點什麼吧?」

        店員：「好的，我送您出去。」'
      C: '老師：「壽司是Sushi，那『握壽司』跟『散壽司』的英文怎麼說?」

        學生：「握壽司是Wow!Sushi.， 散壽司是s、u、s、h、i。」'
      D: '老師：「寫功課時要多用點心，作業才寫得好。」

        學生：「點心可以吃麥當勞嗎?」'
  - index: 3
    answer: D
    stem: 「物產豐富」中的「物產」是本句的主語。下列各選項「」中的語詞，何者不做主語使用？
    options:
      A: 「四海」昇平
      B: 「群魔」亂舞
      C: 「氣焰」囂張
      D: 「百年」樹人
    explanation: D選項省略了主語「學校或教育單位」。
  - index: 4
    answer: A
    stem: 根據本文，「張田獨無恙」的原因最可能是下列何？
    stem_note: 題幹句末印「下列何？」少一個「者」，原稿如此
    options:
      A: 張氏行善積德，得到護佑
      B: 貧民虔誠祈願，感動上天
      C: 張氏田產甚多無法丈量，看不出損失
      D: 賈人福澤深厚，連帶使張田倖免於難
  - index: 5
    answer: B
    stem: 下列哪一選項與本文的主旨最接近？
    options:
      A: 天助自助者，自助者人恆助之
      B: 好心自有好報
      C: 人在做，天在看
      D: 謀事在人，成事在天
    explanation: '第5題解析:

      A強調「要努力上進、自力自強」；

      B好人自有好報，善良的人自有上天的幫助；

      C人做的壞事，上天都看著。比喻天理昭昭，報應不爽；

      D盡自己的能力去做，但能否成功就看上天的安排。'
