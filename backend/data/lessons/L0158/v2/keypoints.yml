keypoints:
  lesson: 文-L3
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 背景
    value: 某位__來到__時，為了躲避大__，便躲到田間。
    blanks:
    - answer: 賈人/商人
      hint: ''
    - answer: 直隸界/河北省界
      hint: ''
    - answer: 冰雹
      hint: ''
  - label: 起因
    value: 神祕經歷 空中有聲音說：「這是__田，不要傷害他的莊稼。」
    blanks:
    - answer: 張不量
      hint: ''
  - label: 問題
    value: 產生疑惑 這個叫__的人，為何受上天保佑？
    blanks:
    - answer: 不良
      hint: ''
  - label: 解決
    value: 向村民尋求答案這個叫__的人非常富有，積蓄的__很多。他借給__的穀物，人家償還多少都不計較，不曾拿工具測量，所以大家才叫他__。
    blanks:
    - answer: 張不量
      hint: ''
    - answer: 粟/穀物
      hint: ''
    - answer: 貧民/窮人
      hint: ''
    - answer: 不量
      hint: ''
  - label: 結果
    value: 商人恍然大悟 是自己誤解了人家名字的意思。眾人趕到田中，發現只有張不量的田__。
    blanks:
    - answer: 無恙/一點事也沒有
      hint: ''
