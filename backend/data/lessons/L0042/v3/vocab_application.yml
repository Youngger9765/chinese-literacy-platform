    stem: 這份工作他做起來得心應手，（　）。
    answer: A
  - index: 6
    stem: 為了照顧生病的家人，他日夜奔波，忙得（　）。
    answer: H
  - index: 7
    stem: 心情低落時，她向好朋友（　）心中的煩惱，感覺輕鬆了許多。
