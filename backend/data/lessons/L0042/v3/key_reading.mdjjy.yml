  passage: 在陳念琴以為往後的拳擊生涯會如魚得水時，她卻再次遭遇橫逆。準備2020年東京奧運時，她發現脖子上有一個小小的硬塊，醫生告訴她，她罹患淋巴癌。她和教練討論後，決定暫時不公開病情，一邊備戰，一邊接受化學治療。化療的副作用讓她無力、想吐、掉髮；因為病情尚未公開，治療過程中的辛苦也很難向人傾訴。更難受的是，她還要面對媒體的質疑：「你不是奧運選手嗎？怎麼奧運前的比賽表現這麼差？」她有苦難言，心中的委屈也難以被理解。可是，她仍堅持在拳擊擂台上飛舞，因為她的信念是：「為了夢想我願意忍耐，在追求成功的過程中，再苦再累我都要咬牙撐過。」她的抗癌經歷也鼓舞了許多癌症病友。
