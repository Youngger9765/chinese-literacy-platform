  總表_對照: '🔴 **總表這一列的語詞整組是錯的 —— 它填的是下一課（G5-L4／L0043）的語詞。**

    總表 課次3 填「貼補／俐落／彌漫／著落／庇蔭／嗷嗷待哺／目不識丁／按件計酬／餘悸猶存／積勞成疾」，

    但本課學習單的語詞框、第三大題 11 題、第四大題選項、第八大題找字框，四處一致都是

    「獨當一面／雕琢／扳回一城／沉著／防禦／如魚得水／橫逆／監測／傾訴／心力交瘁／質疑」，

    而且「獨當一面」「扳回一城」就出現在本課課文第 1 段。

    反向也對得上：總表 課次4 填的那組（沉著／雕琢／防禦…）才是本課這組，而 L0043 的學習單用的

    正是總表課次3 那組（嗷嗷待哺／目不識丁／貼補…）。兩課的語詞欄**互換了**。

    兩邊我都開過原稿查證，不是單看一課推論的。差異全在總表側，兩課的學習單各自前後一致。'
strategy_explained: '這一次要練習的是，從陳念琴做了什麼、說了什麼，去猜測她是一個什麼樣的人

  因為她面對歧視、離鄉訓練、生病卻還是努力打拳，這些事都在告訴我們她很勇敢、很認真

  所以讀的時候，你可以想想看：

  她為什麼要這麼做

  她做了這些事，代表她心裡怎麼樣

  這樣你就能更了解這個很厲害的拳擊手囉'
