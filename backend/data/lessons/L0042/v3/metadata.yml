intro: 這篇文章介紹了拳擊選手陳念琴的故事。她從小因為身分和膚色受到歧視，但透過接觸技擊運動，找到了自信與力量。文章描述了她離鄉背井到新竹接受嚴格訓練的過程，以及在男性主導的拳擊隊中，如何克服孤單與挫折，一步步精進技巧。即使面臨貧血、罹患淋巴癌等嚴峻挑戰，陳念琴仍舊堅持不懈，以堅強的意志力與毅力，一次次站上擂台，追逐自己的拳擊夢想。
