lesson_uid: L0042
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 文中柯教練認為陳念琴是一塊「尚待雕琢的璞玉」。「璞玉」在這裡最接近什麼意思？
    options:
      A: 能力已經非常強大的人
      B: 有潛力、仍需培養的人
      C: 膽小害怕、不敢做的人
      D: 所有人都知道的名人
    teacher_note: 雕琢表示還需要再加工，所以璞玉代表未開發。
  - index: 2
    answer: C
    stem: 請問文中第一段「陳念琴讓尋找人才的柯教練眼睛為之一亮」，柯教練最可能的情緒是哪個？
    options:
      A: 羨慕
      B: 悲傷
      C: 驚喜
      D: 憤怒
    teacher_note: 選項C由後句「火速邀請她加入拳擊隊」可推論是發現人才，驚喜的感受。
    stem_mismatch_note: '🔴 題幹引的「陳念琴讓尋找人才的柯教練眼睛為之一亮」**整句不在本課課文裡**

      （全文搜「眼睛為之一亮」只命中題幹自己）；課文對應處是「讓愛惜人才的柯文明教練看見她的潛力」。

      教師註解引的「火速邀請她加入拳擊隊」同樣不在課文裡。且該情節在第二段，不是第一段。

      判為命題對著較早版本的課文寫，非錯字，照原樣記錄不改。'
  - index: 3
    answer: A
    stem: 第五段陳念琴說：「我的拳擊生涯就像坐雲霄飛車，忽高忽低，充滿挑戰」，這句話主要在說明什麼？
    options:
      A: 她的拳擊生涯有榮耀，也有低谷
      B: 她訓練時常常感到頭暈
      C: 她喜歡刺激的遊樂設施
      D: 她的比賽速度忽快忽慢
    teacher_note: 後文寫出「攀到高峰的榮耀」和「跌到深谷的恐懼」。
    stem_mismatch_note: 題幹引「就像**坐**雲霄飛車」，課文是「**搭乘**雲霄飛車」；題幹說「第五段」，該句在第六段。照原樣記錄不改。
  - index: 4
    answer: B
    stem: 文中第三段提到「陳念琴「越級打怪」挑戰臺北城市邀請賽」，請問下列何者不是越級打怪的例子？
    options:
      A: 體重50公斤，去參加70公斤級的比賽
      B: 打敗同年齡的對手
      C: 挑戰比自己能力強的選手
      D: 業餘球隊挑戰職業聯賽
    teacher_note: 由第二段可知，她打敗了年紀更大身材更好的亞運選手，代表越級打怪是超越自己的能力做的事。
    teacher_note_mismatch_note: 註解說「由第二段可知」，但「越級打怪／蒙古亞運銅牌選手」在第三段（題幹自己標的第三段才是對的）。
  - index: 5
    answer: C
    stem: 作者為什麼把標題寫成「『拳』力出擊──陳念琴」？
    options:
      A: 表示她遇到問題時，習慣用拳頭和別人爭輸贏。
      B: 表示她比賽時只會主動出拳，不重視防禦和躲閃。
      C: 用「拳」代替「全」，表現她全力投入拳擊、迎向挑戰。
      D: 強調她靠著天生的爆發力，不需苦練就能獲得成功。
    teacher_note: 「拳力出擊」讓人聯想到「全力出擊」，又能扣住陳念琴的拳擊生涯。
