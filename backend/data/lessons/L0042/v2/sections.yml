comprehension:
  questions:
  - index: 1
    answer: B
    stem: 文中柯教練認為陳念琴是一塊「尚待雕琢的璞玉」。「璞玉」在這裡最接近什麼意思？
    options:
      B: 悲傷
      C: 驚喜
      D: 憤怒
      A: 羨慕
    rationale: 雕琢表示還需要再加工，所以璞玉代表未開發。
  - index: 3
    answer: A
    stem: 第五段陳念琴說：「我的拳擊生涯就像坐雲霄飛車，忽高忽低，充滿挑戰」，這句話主要在說明什麼？
    options:
      A: 她的拳擊生涯有榮耀，也有低谷
      C: 她喜歡刺激的遊樂設施
      D: 她的比賽速度忽快忽慢
    rationale: 後文寫出「攀到高峰的榮耀」和「跌到深谷的恐懼」。
  - index: 4
    answer: B
    stem: 文中第三段提到「陳念琴「越級打怪」挑戰臺北城市邀請賽」，請問下列何者不是越級打怪的例子？
    options:
      A: 體重50公斤，去參加70公斤級的比賽
      C: 挑戰比自己能力強的選手
      D: 業餘球隊挑戰職業聯賽
      B: 由第二段可知，她打敗了年紀更大身材更好的亞運選手，代表越級打怪是超越自己的能力做的事。
    rationale: 由第二段可知，她打敗了年紀更大身材更好的亞運選手，代表越級打怪是超越自己的能力做的事。
    is_rationale: true
  - index: 5
    answer: C
    stem: 作者為什麼把標題寫成「『拳』力出擊──陳念琴」？
    options:
      A: 表示她遇到問題時，習慣用拳頭和別人爭輸贏。
      B: 表示她比賽時只會主動出拳，不重視防禦和躲閃。
      C: 用「拳」代替「全」，表現她全力投入拳擊、迎向挑戰。
    rationale: 「拳力出擊」讓人聯想到「全力出擊」，又能扣住陳念琴的拳擊生涯。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 1
    verdict: ok
