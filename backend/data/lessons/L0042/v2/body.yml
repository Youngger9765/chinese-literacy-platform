paragraphs:
- 陳念琴在兩歲時跟著家人到馬祖生活。她不只因為膚色較深受到同學取笑，也因原住民身分遭到排擠。那時的陳念琴很自卑，不管到哪裡都躲在哥哥身後。跟著哥哥加入角力隊後，陳念琴發現技擊運動對她有一股吸引力。選手在比賽場上必須獨當一面，發揮自己的力量，也要在逆境中想辦法扳回一城。幾次嘗試成功後，她感到自己是有力量的。她想：「也許，擂台就是我可以發出耀眼光芒的地方。」
- 國中時，陳念琴隻身從馬祖到新竹，進入成德高中拳擊隊訓練。她天生的爆發力與沉著󠇤冷靜的臨場表現，讓愛惜人才的柯文明教練看見她的潛力，認為她是一塊尚待雕琢的璞玉。可是，男生們對她不太友善，還會對她說：「回你的馬祖啦！」全隊只有陳念琴是女生，練習對打時，她只能和男生對練，卻一次也沒有贏過，讓她又孤單又沒有成就感。所幸，她靠著不服輸的態度撐了下來。她說：「在苦難或強大的壓力下，要讓自己的心平靜下來，才有能力尋找方法解決問題。」陳念琴仍舊每天和男生對練。她先練習防禦和躲閃，想辦法不再輸得那麼難看；接著，她開始尋找機會出拳，一點一滴掌握對打技巧，慢慢讓自己變得更強。她把挫折轉化成正面迎擊的動力，心裡想著：「總有一天，成績會證明一切！」在高強度的訓練下，陳念琴的技巧持續進步。國中時，她就在67公斤級女子拳擊賽中獲得冠軍。
- 正當陳念琴逐漸站穩腳步時，身體卻出了狀況。高一時，她發現自己只要慢跑或爬樓梯，就會氣喘如牛，甚至要休息很久才能繼續訓練。到醫院詳細檢查後，她才知道自己有嚴重的缺鐵性貧血。她只能一邊訓練，一邊監測身體狀況，常常累得心力交瘁。可是，她沒有因此放棄。16歲時，她「越級打怪」，挑戰臺北城市邀請賽，擊敗年紀更大、身材條件更好的蒙古亞運銅牌選手，真正找回了自信。後來，她還成為臺灣第一位取得奧運拳擊資格的女選手。
- 在陳念琴以為往後的拳擊生涯會如魚得水時，她卻再次遭遇橫逆。準備2020年東京奧運時，她發現脖子上有一個小小的硬塊，醫生告訴她，她罹患淋巴癌。她和教練討論後，決定暫時不公開病情，一邊備戰，一邊接受化學治療。化療的副作用讓她無力、想吐、掉髮；因為病情尚未公開，治療過程中的辛苦也很難向人傾訴。
- 更難受的是，她還要面對媒體的質疑：「你不是奧運選手嗎？怎麼奧運前的比賽表現這麼差？」她有苦難言，心中的委屈也難以被理解。可是，她仍堅持在拳擊擂台上飛舞，因為她的信念是：「為了夢想我願意忍耐，在追求成功的過程中，再苦再累我都要咬牙撐過。」她的抗癌經歷也鼓舞了許多癌症病友。
- 陳念琴說：「我的拳擊生涯就像搭乘雲霄飛車，忽高忽低，充滿挑戰。」有攀到高峰的榮耀，也有跌到深谷的恐懼。走過生死關卡後，她心中多了一份感恩。
- 東京奧運時，她進入前八強。比賽結束後，她親吻擂台，感謝一路走來所經歷的苦難與挫折，也感謝一路上幫助她的人。陳念琴把苦難和挫折化為祝福，再次戴起拳擊手套，準備揮出下一拳，迎戰一個又一個新的挑戰。
