passage: 在陳念琴以為往後的拳擊生涯會如魚得水時，她卻再次遭遇橫逆。準備2020年東京奧運時，她發現脖子上有一個小小的硬塊，醫生告訴她，她罹患淋巴癌。她和教練討論後，決定暫時不公開病情，一邊備戰，一邊接受化學治療。化療的副作用讓她無力、想吐、掉髮；因為病情尚未公開，治療過程中的辛苦也很難向人傾訴。
