lesson_uid: L0172
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項中「  」的語詞，何者使用正確？
    options:
      A: 那位高級餐廳的服務生態度親切，詢問也十分「刁鑽」
      B: 上台前五分鐘他還拿著稿子練習，看起來很「荒謬」
      C: 聽到這個假消息後，他「氣急敗壞」的說要找出造謠的人
      D: 他做人不老實，說話常常變來變去，絕對「不可置信」
    teacher_note: 第1題解析：(A)「刁鑽」有刻意為難的意思(B)「荒謬」應換成「慌張」(D)「不可置信」應換成「不可相信」
    teacher_note_note: 這個文字方塊在 PDF 上被右邊界裁掉一部分（「不可相」之後看不到），此處以文字層為準
  - index: 2
    answer: D
    stem: 根據第三段，作者說阿翔是「隊上動作最標準、最像教科書的那一個」，這句話最能推論出下列何者？
    options:
      A: 阿翔只是模仿他人動作，缺乏真正理解
      B: 阿翔球技最好因此比賽時完全不會失誤
      C: 作者特別偏愛阿翔因此常給予額外稱讚
      D: 阿翔的基本功與動作紮實，可做為典範
    teacher_note: 從前後文可看出，阿翔的認真努力，而此處的「教科書」有可以效法和標準答案的意思。
  - index: 3
    answer: B
    stem: 根據第五、六段內容，下列何者為阿翔被選為先發後仍悶悶不樂的原因？
    options:
      A: 他認為隊友比自己更有資格上場，因此心裡感到十分嫉妒
      B: 他把一次守備的失誤放大成對自己的否定，因而陷入懷疑
      C: 他介意作者叫他「翔太多」，所以不想和他一起上場比賽
      D: 他擔心教練是想讓他在比賽中出糗丟臉，才故意安排先發
    teacher_note: 解析：從前後文提到他被教練提醒後「臉色一沉」可推知。
  - index: 4
    answer: D
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 強調球隊紀律的重要性，說明成功來自嚴格訓練
      B: 描寫比賽競爭激烈，提醒球員必須保持絕對專注
      C: 說明自我反省的重要，唯有反省才能不斷提升實力
      D: 藉阿翔的故事，指出特質若運用適宜也能成為助力
    teacher_note: (Ｄ)符合「想很多」是認真、細心，也可以是力量。
    teacher_note_source_text: (Ｄ)符合「想很多」是認真、細心，也可以是力量。」
    errata_ref: E1
  - index: 5
    answer: A
    stem: 根據品格聚光燈，下列關於「特質」的敘述，何者最符合？
    options:
      A: 特質沒有好壞，但是需要找到適合發揮的舞台
      B: 我們不需要刻意隱藏自己的特質，要大方展現
      C: 某個特質如果帶來困擾，就代表那不是好特質
      D: 我們可以改變自己的特質，來符合他人的期待
    teacher_note: '(B)文本沒有提到

      (C)特質沒有好壞

      (D)本文沒有提到'
