  vocabulary_bank_label: 本課語詞
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  items:
  - index: 1
    word: 精神抖擻
    definition: 精神很好、充滿活力與幹勁。
  - index: 2
    word: 刁鑽
    definition: 形容問題或行為難以應付。
  - index: 3
    word: 氣急敗壞
    definition: 因為生氣或著急而失去理智、表現慌亂。
  - index: 4
    word: 臉色一沉
    definition: 臉上的表情突然變得嚴肅或不高興。
  - index: 5
    word: 悠悠
    definition: 形容冷靜、慢慢說話的樣子。
  - index: 6
    word: 鑽牛角尖
    definition: 一直在無法解決的細節或小問題上，反覆思考，無法跳脫。
  - index: 7
    word: 游擊
    definition: 棒球中防守二、三壘間的位置。
  - index: 8
    word: 荒謬
    definition: 非常不合理，讓人覺得無法接受。
  - index: 9
    word: 靦腆
    definition: 害羞、難為情，有些不自在。
  - index: 10
    word: 不可置信
    definition: 無法相信；另一種用法是「難以置信」。
  - index: 11
    word: 五體投地
    definition: 指雙膝、雙肘及頭頂等五處著地，形容非常佩服或崇拜。
  - index: 12
    word: 低潮
    definition: 情緒或狀況不佳的時期。
  notes:
    vocabulary_bank: '語詞框裡的「臉色一沉」在文字層是「臉色一<U+E01E2>沉」（一個隱藏的 variation selector），

      詞語複習那一格的同一個詞則沒有。這裡寫乾淨的字面。

      ⚠️ 與總表「2.體育生的品格教材」語詞1~12 完全一致（SKILL 說這個分頁語詞欄整組空白 —— 這一列不是）。'
    answer_carrier: 橘色手寫（run 層 w:color E97132，不需解 rStyle）
