lesson_uid: L0172
version_id: v3
section_no: 六
spotlight:
  strategy_name: 特質的多元樣貌
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  _總表_第六大題標題: 品格力──特質的多元樣貌
  _總表_note: 總表兩個欄位（教材目標策略／第六大題標題）都填「品格力──特質的多元樣貌」；學習單第六大題旁邊只印後半「特質的多元樣貌」，右上角的目標框才印完整那句。
  blocks:
  - type: concept_box
    text: 每個人都有自己的特質，而每種特質都有適合的舞台。本文主角阿翔比較內向、自省，因此容易焦慮和想很多，這樣的特質可以幫助他更細心、準備更周到；但有時也讓他太擔心、太緊張。所以，理解一個人的特質時，不能只做好、壞的判斷，而是要看見它在什麼情況下能幫一個人發揮潛力，什麼時候又會變成限制、需要調整。現在就讓我們一起來練習看見特質的多元樣貌！
  - type: matching
    instruction: ◎認識特質的多元樣貌：每一種看似令人困擾的特質，可能有著隱藏的「超能力」。請發揮你的觀察力，試著將左邊的「困擾特質」與右邊對應的「隱藏超能力」連起來，找出它們真實的模樣吧！
    left_header: 困擾特質
    right_header: 隱藏超能力
    left:
      1: 想太多
      2: 固執
      3: 衝動
      4: 愛說話
      5: 好勝、愛比較
      6: 沒主見
    right:
      A: 行動力強、反應快
      B: 隨和、配合性高
      C: 充滿鬥志、認真投入
      D: 心思細膩，做事謹慎
      E: 口條流暢、能表達
      F: 有恆心、能堅持
    answer:
      1: D
      2: F
      3: A
      4: E
      5: C
      6: B
    answers_are_graphical: true
    answer_carrier: 連線（圖形）；5 條紅色 srgb C00000 + 1 條黑色虛線（1→D 那條），文字流無此資訊
    answer_note: "三個獨立來源指到同一組配對，才敢寫下來：\n① 幾何（XML）：6 條 line 的端點（off + ext + flipV）換算成左右兩欄的第幾列。\n   容器是 `wgp` 一層（`off=(0,0)`、`chOff.y=-0.0348in`、scale 0.9511×0.9988），\n   群組位移與 chOff 縮放都套了；另一條線直接掛 anchor 不在群組裡。沒有 `a:grpSp`。\n② 像素（render，**不使用 ① 的任何中間結果**）：從 PDF 抓 6 條連線的向量端點，\n   跟文字層 12 個「●」的座標比。● 左欄 x≈206、右欄 x≈359，兩欄列位都是 y=435/478/521/563/606/649\n   （列距 43pt）。六條線的端點各自落在某個 ● 上，最大偏差 7.8pt（＜半個列距），且是雙射：\n     (206.4,435.9)→(363.0,562.9) 黑虛線  左1→右D   Δ 0.9 / 0.4\n     (209.8,485.5)→(358.9,649.6) 紅      左2→右F   Δ 7.8 / 0.7\n     (209.8,520.5)→(355.4,440.0) 紅      左3→右A   Δ 0.0 / 5.1\n     (206.4,566.4)→(355.2,608.5) 紅      左4→右E   Δ 3.1 / 2.4\n     (206.4,608.3)→(355.2,525.4) 紅      左5→右C   Δ 2.1 / 4.9\n     (206.4,649.4)→(358.9,480.5) 紅      左6→右B   Δ 0.5 / 2.8\n   6 條**逐條**都畫得出來（不是拿「這一區有畫」推廣）。1→D 那條是黑色虛線不是紅線。\n③ 語意：下一個練習「特質伸展台」把同樣六組寫成「想太多／謹慎」「固執／堅持」「衝動／反應快」\n   「愛說話／口條好」「好勝／有鬥志」「沒主見／隨和」—— 逐組對上 ①② 的配對。\n⚠️ 不是紙外殘留：兩個 anchor 都是 `positionV relativeFrom=\"paragraph\"` + **正**位移\n   （0.294in／0.237in），不是 L0152 那種 `relativeFrom=\"page\"` + −2.197in。"
  - type: guide
    text: →特質是一體兩面，當看見令人困擾的特質時，也可以換個角度找找它隱藏的超能力唷！
  - type: sub_block
    label: 特質伸展台
    instruction: ◎特質伸展台：不同的特質在適合的情境下才能展現「超能力」，讓特質成為優勢。請依據特質判斷，哪一個情境更適合發揮？請在（ ）打勾。
    columns:
    - ''
    - 特質
    - 情境(適合發揮的打勾)
    answer_carrier: 手寫「Ｖ」字元（在 w:t 文字流裡）；第 1 題黑色，第 2~6 題紅色 EE0000
    items:
    - type: single
      label: '1.'
      intro: 想太多／謹慎
      options:
        A: 籃球比賽剩下 3 秒，必須立刻在三分線外出手
        B: 負責規劃班級出遊，安排交通路線和雨天備案
      answer: B
    - type: single
      label: '2.'
      intro: 固執／堅持
      options:
        A: 討論園遊會的活動，需要各種創意想法互相討論
        B: 練習一項枯燥、需要重複才能熟練的基本動作
      answer: B
    - type: single
      label: '3.'
      intro: 衝動／反應快
      options:
        A: 按照老師指示操作實驗器材，並記錄觀察結果
        B: 體育課同學意外受傷，需要立刻去找護理師協助
      answer: B
    - type: single
      label: '4.'
      intro: 愛說話／口條好
      options:
        A: 擔任園遊會的叫賣人員，吸引路過的同學和家長
        B: 上課時，需要靜下心來自己閱讀和寫學習單
      answer: A
    - type: single
      label: '5.'
      intro: 好勝／有鬥志
      options:
        A: 陪伴心情低落的朋友，傾聽對方的煩惱與壓力
        B: 在班際競賽時，在場邊為班上選手加油
      answer: B
    - type: single
      label: '6.'
      intro: 沒主見／隨和
      options:
        A: 小組分工，剩下無人認領的工作，需要有人完成
        B: 和同學一起出去玩，要負責決定午餐吃什麼
      answer: A
  - type: guide
    text: →能把握適合發揮的舞台，就能讓不同特質成為一份寶藏。
  - type: guide
    text: ◎特質鏡子：現在回來思考看看自己身上也有哪些特質？而這個特質隱藏的超能力又是什麼？適合運用在什麼情境呢？
  - type: free_text
    prompt: '例：我有一個常被當成缺點的特質是想很多。

      在這個特質背後的超能力是心思細膩，做事謹慎，我認為它適合發揮的舞台是在需要避免危險或突發狀況的時候。

      →我有一個常常被當成缺點的特質是________________。

      在這個特質背後的超能力是＿＿＿＿＿＿________________________。

      我認為它適合發揮的舞台是在＿＿＿＿＿＿_____________________________________________________________________________的時候。'
    no_correct_answer: true
    answer_carrier: 學生自填，原稿空白（「例：」那兩行是題目給的示範，不是答案）
