full_text_annotate:
  title_line: 第6課  不是想太多，只是好在乎
  paragraph_count: 7
  paragraphs:
  - idx: 1
    text: 阿翔是我從小一起打球的夥伴。在隊上，他的球技不是最亮眼的，個性也不是活潑、陽光的類型，但只要提到認真和謙虛，大家都會先想到他。
  - idx: 2
    text: 我第一次看到他的訓練日誌時，佩服得五體投地。從訓練項目的記錄，到訓練表現的檢討，密密麻麻寫滿格子，每一字每一句都是紮紮實實的反思。儘管他的字不是工整好看的那種，但卻可以看見他一筆一畫的專心投入。還記得當時我拿著他的日誌說：「這根本神人筆記吧！你太誇張了！」他只靦腆笑著說：「哪有啦！就隨便寫的啊！」
  - idx: 3
    text: 在學校，只要遇到學長、教練，他一定精神抖擻的問好，還會搭配微微鞠躬。在球場，教練若大吼一聲，要求大家注意守備、跑壘、打擊的細節，他就會緊張的問我：「教練是不是在說我？」、「我今天動作是不是哪裡怪怪的？」可是，他明明就是隊上動作最標準、最像教科書的那一個。所以，我總是愛叫他「翔很多」，因為他真的「想很多」，有時候甚至到了鑽牛角尖的地步。
  - idx: 4
    text: 記得那天下午，太陽斜斜照進球場，守備練習已經到了最後一輪。教練在本壘，「喀、喀、喀」把球一個個打出去，滾地球、平飛球、高飛球。輪到阿翔的時候，球朝游擊方向滾過來，速度不算快，路線也不算特別刁鑽。他往前跨步，但腳步沒有踩順，等他把球傳向一壘，已經慢了。「你在幹嘛？傳快一點！」教練喊了一句，沒有特別嚴厲，但我卻看見他臉色一沉。對其他人來說，剛剛那顆球只是守備練習裡的家常便飯，不會特別放在心上，但阿翔不同。
  - idx: 5
    text: 練習結束後，教練要宣布下一場練習賽的先發。我和阿翔都被選中了，當我望向他，本來期待給他一個歡呼的表情，卻看到他還在悶悶不樂。解散了，我朝他走去，他看了我一眼，低下頭說：「我連那種球都傳不好，哪有資格當先發？如果明天又這樣，會不會拖累大家？還是我不要上場？」我不可置信，急忙說：「怎麼可以，這可是你努力來的機會！」「是嗎？教練只是輪流讓大家有機會當先發吧！」
  - idx: 6
    text: 阿翔就是這樣，總是容易懷疑自己，也更容易把一點點問題放在心上。那次，我本來安慰的話都到了嘴邊，聽到他這麼荒謬的發言，不禁氣急敗壞，說：「哪是啊！你幹嘛這麼不相信自己的實力？」也許是我們的爭論聲引來了教練的注意，教練走過來悠悠的說：「你不相信自己的實力就算了，也不相信我的眼光嗎？」「不是不是，教練我不是那個意思！」阿翔連忙鞠躬。教練說：「那就對啦，也別忘了你還有一群可靠的隊友，調整一下，明天看你表現了！」教練拍拍他的背，感覺也拍走了阿翔心中的烏雲。後來，阿翔傳訊息跟我道謝：「感謝你發現我的鑽牛角尖，你的鼓勵我都有放在心上，謝啦！」
  - idx: 7
    text: 身為阿翔的隊友，面對他的低潮或焦慮，有時候真的會覺得無力。但我後來慢慢明白，除了提醒他不要想太多，也可以陪他一起看見他的「想很多」是因為他認真、細心和在乎，看見「想很多」其實也很有力量。然後，和教練一樣，提醒他多相信隊友、相信自己，或許也就能讓「想很多」成為助力，幫助我們為每次比賽做好準備。
