spotlight:
  lesson: 體-L6
  strategy_name: 品格力-特質的多元樣貌
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 每個人都有自己的特質，而每種特質都有適合的舞台。本文主角阿翔比較內向、自省，因此容易焦慮和想很多，這樣的特質可以幫助他更細心、準備更周到；但有時也讓他太擔心、太緊張。所以，理解一個人的特質時，不能只做好、壞的判斷，而是要看見它在什麼情況下能幫一個人發揮潛力，什麼時候又會變成限制、需要調整。現在就讓我們一起來練習看見特質的多元樣貌！
  - type: guide
    text: ◎認識特質的多元樣貌：每一種看似令人困擾的特質，可能有著隱藏的「超能力」。請發揮你的觀察力，試著將左邊的「困擾特質」與右邊對應的「隱藏超能力」連起來，找出它們真實的模樣吧！
  - type: table
    rows:
    - - 困擾特質
      - ''
      - ''
      - 隱藏超能力
    - - 1.想太多
      - ●
      - ●
      - A.行動力強、反應快
    - - 2.固執
      - ●
      - ●
      - B.隨和、配合性高
    - - 3.衝動
      - ●
      - ●
      - C.充滿鬥志、認真投入
    - - 4.愛說話
      - ●
      - ●
      - D.心思細膩，做事謹慎
    - - 5.好勝、愛比較
      - ●
      - ●
      - E.口條流暢、能表達
    - - 6.沒主見
      - ●
      - ●
      - F.有恆心、能堅持
  - type: guide
    text: →特質是一體兩面，當看見令人困擾的特質時，也可以換個角度找找它隱藏的超能力唷！
  - type: guide
    text: ◎特質伸展台：不同的特質在適合的情境下才能展現「超能力」，讓特質成為優勢。請依據特質判斷，哪一個情境更適合發揮？請在（ ）打勾。
  - type: table
    rows:
    - - ''
      - 特質
      - 情境(適合發揮的打勾)
    - - '1.'
      - 想太多／謹慎
      - A.（　）籃球比賽剩下 3 秒，必須立刻在三分線外出手B.（Ｖ）負責規劃班級出遊，安排交通路線和雨天備案
    - - '2.'
      - 固執／堅持
      - A.（　）討論園遊會的活動，需要各種創意想法互相討論B.（Ｖ）練習一項枯燥、需要重複才能熟練的基本動作
    - - '3.'
      - 衝動／反應快
      - A.（　）按照老師指示操作實驗器材，並記錄觀察結果B.（Ｖ）體育課同學意外受傷，需要立刻去找護理師協助
    - - '4.'
      - 愛說話／口條好
      - A.（Ｖ）擔任園遊會的叫賣人員，吸引路過的同學和家長B.（　）上課時，需要靜下心來自己閱讀和寫學習單
    - - '5.'
      - 好勝／有鬥志
      - A.（　）陪伴心情低落的朋友，傾聽對方的煩惱與壓力B.（Ｖ）在班際競賽時，在場邊為班上選手加油
    - - '6.'
      - 沒主見／隨和
      - A.（Ｖ）小組分工，剩下無人認領的工作，需要有人完成B.（　）和同學一起出去玩，要負責決定午餐吃什麼
  - type: guide
    text: →能把握適合發揮的舞台，就能讓不同特質成為一份寶藏。
  - type: guide
    text: ◎特質鏡子：現在回來思考看看自己身上也有哪些特質？而這個特質隱藏的超能力又是什麼？適合運用在什麼情境呢？
  - type: guide
    text: 例：我有一個常被當成缺點的特質是想很多。
  - type: guide
    text: 在這個特質背後的超能力是心思細膩，做事謹慎，我認為它適合發揮的舞台是在需要避免危險或突發狀況的時候。
  - type: guide
    text: →我有一個常常被當成缺點的特質是________________。
  - type: guide
    text: 在這個特質背後的超能力是＿＿＿＿＿＿________________________。
  - type: guide
    text: 我認為它適合發揮的舞台是在＿＿＿＿＿＿_____________________________________________________________________________的時候。
  - type: passage
    source: unknown
    paragraphs:
