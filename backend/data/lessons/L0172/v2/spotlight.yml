spotlight:
  lesson: 體-L6
  strategy_name: 品格力-特質的多元樣貌
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 每個人都有自己的特質，而每種特質都有適合的舞台。本文主角阿翔比較內向、自省，因此容易焦慮和想很多，這樣的特質可以幫助他更細心、準備更周到；但有時也讓他太擔心、太緊張。所以，理解一個人的特質時，不能只做好、壞的判斷，而是要看見它在什麼情況下能幫一個人發揮潛力，什麼時候又會變成限制、需要調整。現在就讓我們一起來練習看見特質的多元樣貌！
  - type: guide
    text: ◎認識特質的多元樣貌：每一種看似令人困擾的特質，可能有著隱藏的「超能力」。請發揮你的觀察力，試著將左邊的「困擾特質」與右邊對應的「隱藏超能力」連起來，找出它們真實的模樣吧！
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: →特質是一體兩面，當看見令人困擾的特質時，也可以換個角度找找它隱藏的超能力唷！
  - type: guide
    text: ◎特質伸展台：不同的特質在適合的情境下才能展現「超能力」，讓特質成為優勢。請依據特質判斷，哪一個情境更適合發揮？請在（ ）打勾。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: →能把握適合發揮的舞台，就能讓不同特質成為一份寶藏。
  - type: guide
    text: ◎特質鏡子：現在回來思考看看自己身上也有哪些特質？而這個特質隱藏的超能力又是什麼？適合運用在什麼情境呢？
  - type: guide
    text: 例：我有一個常被當成缺點的特質是想很多。
  - type: guide
    text: 在這個特質背後的超能力是心思細膩，做事謹慎，我認為它適合發揮的舞台是在需要避免危險或突發狀況的時候。
  - type: guide
    text: →我有一個常常被當成缺點的特質是________________。
  - type: guide
    text: 在這個特質背後的超能力是＿＿＿＿＿＿________________________。
  - type: guide
    text: '我認為它適合發揮的舞台是在＿＿＿＿＿＿_______________________

      ______________________________________________________的時候。'
