lesson_no: 29
series: 一般
lesson_seq: 7290
intro: 這篇文章要帶大家一起認識「微歧視」。什麼是微歧視呢？它藏在我們日常對話中，常常不被注意，但卻可能對特定族群造成傷害。文章透過幾個生活中的例子，像是談論原住民、身心障礙者或體育班學生時，說明了這些看似無心之語，可能包含了刻板印象、偏見或過度的保護。作者提醒我們，即使出發點是善意，也可能無意間傷害到別人。了解微歧視的特徵，並學習如何溫和地表達自己的感受，或是反思自己的言行，都是非常重要的，這能幫助我們建立一個更尊重、包容的溝通環境。
