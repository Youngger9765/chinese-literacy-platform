strategy_explained: '這一課我們一起練習的是，辨識並溫和回應那些藏在日常對話裡，可能傷害到別人的「小小的、不易察覺的歧視」

  為什麼要練這個呢，因為這篇文章用了很多我們生活中可能聽到的例子，像是談論原住民、身障朋友或體育班同學時，那些看似無心的話，其實可能帶著刻板印象或偏見

  讀的時候，你可以試著想想，自己有沒有聽過類似的話，或者自己說話時，會不會不小心這樣說，然後想想，如果聽到這樣的話，你會不會覺得不舒服，並練習用比較溫和的方式表達自己的感受，或是反思一下自己的想法'
