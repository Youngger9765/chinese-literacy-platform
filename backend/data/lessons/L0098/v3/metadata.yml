_總表_對照note: '🔴 **三份語詞清單三種內容**，不是抽錯，是原稿三處本來就不一致：

  ・總表（10）：屢見不鮮 無傷大雅 開場白 刻板印象 隱蔽 憐憫 日積月累 **滴水穿石** 滲透 內化

  ・學習單語詞框（10）：屢見不鮮 憐憫 隱蔽 無傷大雅 **偏見** 刻板印象 內化 滲透 開場白 日積月累

  ・第八大題找字灰框（11）：上面兩組的**聯集** —— 滴水穿石與偏見都在

  也就是總表有「滴水穿石」沒「偏見」，語詞框相反，找字兩個都收。

  第三大題 10 題與第四大題 10 個代號都跟**語詞框**一致（有偏見、無滴水穿石）。

  佐證語詞框漏了一個：它的字串結尾是「…開場白、日積月累、」——**末尾多一個頓號沒有接詞**（見 errata E1）。

  ⛔ 未自行補「滴水穿石」進語詞框 —— 那是猜作者意圖，不是抽取。'
