lesson_uid: L0098
version_id: v3
section_no: 五
keypoints:
  title: 隱藏在日常對話中的「微歧視」
  layout: list
  answer_carrier: 橘色手寫字與紅色 ☑（w:sym Wingdings F0FE，共 4 個），PDF p4 可見
  rows:
  - label: 定義
    value: '微歧視：在互動中出現看似微小、隱蔽、無意的

      【　】或偏見。'
    blanks:
    - answer: 刻板印象
  - label: 例子分析
    instruction: ※請勾選出正確答案(單選)
    items:
    - label: '1'
      value: 對原住民的刻板印象：與原住民互動時，強調酒量與膚色，加深對原住民族群的【 □①憐憫　□②尊重　☑③偏見 】。
      options:
        1: 憐憫
        2: 尊重
        3: 偏見
      answer: 3
    - label: '2'
      value: 對身障者的過度保護：以體諒為出發點，但話語中隱含對身障者的【 ☑①低期望　□②尊重　□③平等 】與過度保護。
      options:
        1: 低期望
        2: 尊重
        3: 平等
      answer: 1
    - label: '3'
      value: 對體育班的單一印象：總是讓體育班學生做勞動性工作，對他們不公平，也忽視了他們在其他領域的潛力。
  - label: 影響與特點
    items:
    - label: '1'
      value: '微歧視似無傷大雅，但長期累積會導致偏見被

        【 □①外化　☑②內化 】，滲透到人們的【　】中。'
      options:
        1: 外化
        2: 內化
      answer: 2
      blanks:
      - answer: 價值觀
    - label: '2'
      value: 微歧視的特點在於它【 □①明顯　☑②隱蔽 】，因此難以被發現和改正。
      options:
        1: 明顯
        2: 隱蔽
      answer: 2
  - label: 破除微歧視
    value: '破除微歧視的關鍵是【　】，並避免用刻板印象來判斷某個群體。( 填入代號 )

      A.經常反思自己的思維模式和語言。

      B.對每個人保持低期望；

      Ｃ.被微歧視時，可溫和表達自己的感受與期望'
    blanks:
    - answer: A、C
    value_note: 原稿的答案印成「　A、Ｃ　」（第二個代號用全形Ｃ，選項清單的 C 也是全形），本檔 blanks 記半形。
