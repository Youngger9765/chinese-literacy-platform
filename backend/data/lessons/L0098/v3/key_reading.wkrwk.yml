  passage: 這些看似平常的小事，就是「微歧視」。微歧視的「微」指的是這些日常言語或行為往往很微小、隱蔽而不易察覺，卻可能隱含對特定群體的刻板印象或偏見。說話的人有時並沒有惡意，仍可能讓人受到傷害。例如，特別強調某些群體的特性，或對弱勢群體表現出過度的憐憫，日積月累後，這些說法可能逐漸滲透到人們的價值觀中，不但說話的人無感，甚至連長期受到微歧視的群體，也可能漸漸內化這些偏見，進而對自己產生負面的觀感。微歧視的「隱蔽」特性，讓它很難被發現。要破除微歧視，最重要的是時常反思自己，避免用簡化的思維模式去了解或形容某個群體。其次，萬一你正是那位「被微歧視」的對象，別人說的話讓你覺得不舒服，建議你溫和的提出自己當下的感受，這不只維護了自己的權益，也在幫助對方學到更合宜的價值觀與溝通方式。最後，我們都要留意自己脫口而出的話語，因為話語反映了我們對世界的看法，也是一面鏡子，照出我們在面對多元文化時，是否真正具備尊重與包容的態度。
