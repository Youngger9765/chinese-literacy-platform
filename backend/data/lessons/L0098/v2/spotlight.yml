spotlight:
  lesson: G7-L29
  strategy_name: 圖文整合閱讀策略（進階）
  strategy_type: image_text
  blocks:
  - type: guide
    text: 小叮嚀：刻板印象或對某族群體的偏見，很可能就是微歧視。
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: 一、辨識微歧視：
  - type: guide
    text: 請判斷下列情況是否為微歧視，是微歧視的打Ｖ。
  - type: table
    rows:
    - - □
      - (1)對女生說：「你這麼漂亮，面試絕對大大加分。」
    - - □
      - (2)對同學說：「你上次接力跑得很快，這次還想參加嗎？」
    - - □
      - (3)你是原住民？那運動會全看你表現了！
    - - □
      - (4)對身障者說：「你這樣還來上學，大家應該跟你看齊。」
    - - □
      - (5)對新朋友說：「你平常喜歡做什麼運動？」
    - - □
      - (6)對同性戀的朋友說：「同性戀的藝術細胞是不是都比較好？」
  - type: guide
    text: 二、處理微歧視：
  - type: guide
    text: 如果是你遭遇微歧視，可以怎麼反應？(可以的打Ｖ；可參考課文末段作答）
  - type: table
    rows:
    - - □
      - (1)溫和的表達自己當下的感受：「你這樣講，我感覺不舒服」。
    - - □
      - (2)也許是我想太多，是我太玻璃心了。
    - - □
      - (3)如果當下不方便回應，可先離開，之後再找可信任的人協助。
    - - □
      - (4)說清楚界線：「我不希望別人因為我是OO，就這樣判斷我。」
  - type: guide
    text: 三、向微歧視說不：停下來想一想、換個說法
  - type: free_text
    prompt: ❶停下來想一想：
  - type: free_text
    prompt: 1.這句話是不是在替一群人貼標籤？
  - type: free_text
    prompt: 2.如果別人只看我的身分就判斷我，我會有什麼感受？
  - type: guide
    text: 被誤解？被小看？被特別對待？
  - type: free_text
    prompt: ❷換個說法：
  - type: guide
    text: 避免群體標籤，改問個人特質
  - type: free_text
    prompt: 1.示例：
  - type: guide
    text: X（微歧視的說法）:「你是體育班，搬重物一定超強的！」
  - type: guide
    text: ↓換個說法
  - type: guide
    text: Ｏ（不是微歧視）:「現在需要人手幫忙搬桌椅，你可以來幫忙嗎？」
  - type: free_text
    prompt: 2.你來換個說法：
  - type: guide
    text: X（微歧視的說法）:「你是原住民，運動會大隊接力全靠你了！」
  - type: guide
    text: ↓換個說法
  - type: guide
    text: Ｏ（不是微歧視）:【 運動會大隊接力缺人吔，你可以跑嗎？     】
  - type: guide
    text: 四、開啟友善對話：問對方自己，不替群體下結論
  - type: guide
    text: 你想拉近與朋友的距離，但又不知道會不會讓對方不舒服嗎？來練習用「安全的話題」以及「請對方分享」的方式開啟友善對話吧！
  - type: free_text
    prompt: ❶用安全的話題開啟對話：有些話題是中性、大家喜歡，又不會踩雷的，例如：食物、天氣、運動、最近的時事。
  - type: guide
    text: 例→麟洋配又得一次奧運羽球雙打金牌，超感動的！你有看轉播嗎？
  - type: guide
    text: （換你）→學校旁邊開了一家賣滷肉飯的店，聽說便宜又好吃，你有吃過嗎？
  - type: free_text
    prompt: ❷請對方分享：真心讚賞對方優點，邀請對方分享專長和興趣。
  - type: guide
    text: 例→你讀好多書喔，最近讀的哪一本好看？有推薦的嗎？
  - type: guide
    text: （換你）→
  - type: guide
    text: 第1題解析：(指某事常見、已經見怪不怪，偶爾犯錯不太合適。)第1題解析：(指某事常見、已經見怪不怪，偶爾犯錯不太合適。)請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
