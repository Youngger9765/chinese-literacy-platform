passage: '至於育仁的例子，朋友本意是體諒他的不便，但這句話卻隱含了對身障者的「低期望」和「過度保護」。預設育仁無法像其他同學一樣參與社區服務，甚至忽略了他可以自行決定是否參加，讓他感覺自己被「特別對待」了。

  而學務處老師每次都請體育班的學生負責搬運桌椅，則流露出對體育班學生的單一印象，認為他們「就比較適合」做體力勞動工作，對他們並不公平，也忽視了體育班學生在其他領域的才能。

  這些看似平常的小事，就是「微歧視」。微歧視的「微」指的是這些日常言語或行為往往很微小、隱蔽而不易察覺，卻可能隱含對特定群體的刻板印象或偏見。說話的人有時並沒有惡意，仍可能讓人受到傷害。例如，特別強調某些群體的特性，或對弱勢群體表現出過度的憐憫，日積月累󠇡後，這些說法可能逐漸滲透到人們的價值觀中，不但說話的人無感，甚至連長期受到微歧視的群體，也可能漸漸內化這些偏見，進而對自己產生負面的觀感。'
