passage: 與原住民朋友互動時，總是用酒量和膚色作為開場白，暗示原住民「應該」會喝酒，或「應該」有較深的膚色，這樣才符合「典型的原住民」形象。這類話語顯示了社會對原住民族群的理解不足，無形中也加深了刻板印象和偏見。
