      hint: ''
    - answer: □①低期望□②尊重□③平等
      hint: ''
  - label: 影響與特點
    value: 1.微歧視似無傷大雅，但長期累積會導致偏見被__，滲透到人們的   價值觀   中。2.微歧視的特點在於它__，因此難以被發現和改正。
    blanks:
    - answer: □①外化□②內化
      hint: ''
    - answer: □①明顯□②隱蔽
