    value: ※請勾選出正確答案(單選)1.對原住民的刻板印象：與原住民互動時，強調酒量與膚色，加深對原住民族群的__。2.對身障者的過度保護：以體諒為出發點，但話語中隱含對身障者的__與過度保護。3.對體育班的單一印象：總是讓體育班學生做勞動性工作，對他們不公平，也忽視了他們在其他領域的潛力。
    blanks:
