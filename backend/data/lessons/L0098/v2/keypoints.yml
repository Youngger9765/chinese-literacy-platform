  - label: 破除微歧視
    value: 破除微歧視的關鍵是　A、 Ｃ  ，並避免用刻板印象來判斷某個群體。         ( 填入代號 )A.經常反思自己的思維模式和語言。B.對每個人保持低期望；Ｃ.被微歧視時，可溫和表達自己的感受與期望
    blanks: []
  title: 隱藏在日常對話中的「微歧視」
