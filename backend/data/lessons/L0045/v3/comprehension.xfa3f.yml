version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 請問哪一個句子使用語詞正確？
    options:
      A: 我每天都整理書包，希望能夠「一勞永逸」
      B: 可愛的韓國啦啦隊員成為許多年輕人的「剋星」
      C: 為了找回走失的小狗，他「想方設法」打聽牠的下落
      D: 吃泡泡糖時，我喜歡讓吹出的泡泡不斷「蔓延」變大
  - index: 2
    answer: B
    stem: 根據本文對防治秋行軍蟲的說明，下列表格的內容何者完全正確？
    options:
      A: 只要噴藥一次，效果可以維持兩、三週，但人工噴灑會對人體造成危害。
      B: 安全又省力，但反覆使用同一種農藥，可能使具有抗藥性的害蟲愈來愈多
      C: 只要121片寄生蜂卵片就可防治蟲害，但農民也容易感染寄生蟲。
      D: 只能靠人工投放，種植面積大時會十分費力。
    option_methods:
      A: 人工噴農藥
      B: 無人機噴農藥
      C: 寄生蜂片
      D: 寄生蜂扭蛋
    option_notes:
      A: (是噴藥需持續兩三週，並非為效果。)
      C: (這種方式對年紀大的農民還是太累，不會感染寄生蟲。)
      D: (扭蛋可以靠無人機丟。)
    options_layout_note: 四個選項在教材上是一張表格 —— 左欄是方法名（記在 option_methods）、右欄是敘述（記在 options）。兩欄在原稿是不同儲存格，不可併成一句
  - index: 3
    answer: D
    stem: 根據本文，專家處理秋行軍蟲的作法，與下列哪一個成語最接近？
    options:
      A: 腳踏實地
      B: 未雨綢繆
      C: 有備無患
      D: 見招拆招
    option_notes:
      B: ( 指問題還沒發生就提前準備，本文是遇到問題才開始想解決辦法。)
      D: (遇到什麼問題用什麼方法應對。)
  - index: 4
    answer: A
    stem: 本文的主旨為何？
    options:
      A: 昆蟲學家針對防治中出現的新問題，不斷改進方法
      B: 秋行軍蟲繁殖力很強，農民必須增加農藥使用次數
      C: 本文比較各種方法，主要要說明生物防治效果最好
      D: 本文介紹無人機的用途，強調機器比人工更有效率
  - index: 5
    answer: D
    stem: 「農民正在進行病蟲害『防治』。」請運用拆詞釋義，推測「防治」的意思。
    options:
      A: 防護和統治
      B: 提防和整治
      C: 防禦和懲治
      D: 預防和治理
