version_id: v3
section_no: 五
keypoints:
  title: 兵來將擋，水來土掩
  layout: list
  answer_carrier: 紅色手寫字（圖形），文字流的【　】內已填有答案
  rows:
  - label: 問題
    value: 【　】入侵臺灣，農民深受其害，昆蟲學家嘗試許多方法解決問題。
    blanks:
    - answer: 秋行軍蟲
  - label: 人工噴農藥
    items:
    - label: 執行方式
      value: 每週噴藥【　】次，持續【　】週。
      blanks:
      - answer: 一
      - answer: 二～三
    - label: 產生問題
      value: 種植面積很大時，人工噴農藥太【　】、【　】、【　】。
      blanks:
      - answer: 耗工
      - answer: 辛苦
      - answer: 危險
  - label: 無人機噴農藥
    items:
    - label: 執行方式
      value: 大型無人機，噴一公頃的農藥只要【　】分鐘，一天可以噴【　】公頃。
      blanks:
      - answer: '20'
      - answer: '5'
    - label: 產生問題
      value: 較能耐受藥劑的害蟲容易存活並繁殖，經過幾代，具有【　】的害蟲可能愈來愈多。
      blanks:
      - answer: 抗藥性
  - label: 寄生蜂片
    items:
    - label: 執行方式
      value: 研究人員把已被寄生的蟲卵黏在小紙卡上，做成蜂片；農民再把蜂片釘在【　】背面，一公頃放【　】片就可以防治蟲害。
      blanks:
      - answer: 玉米葉
      - answer: '121'
    - label: 產生問題
      value: 釘121片蜂片要花【　】個鐘頭，對年紀【　】的農民仍是苦差事。
      blanks:
      - answer: '2'
      - answer: 大
  - label: 寄生蜂扭蛋
    items:
    - label: 執行方式
      value: '1.把原本黏在蜂片上的蟲卵放進紙製扭蛋，【　】長大後會從小孔飛出。

        2.把【　】丟進玉米田裡，就能讓寄生蜂防治秋行軍蟲。

        3.扭蛋可以用【　】施作，一公頃約20到30分鐘就可以灑完了。'
      blanks:
      - answer: 寄生蜂
      - answer: 扭蛋
      - answer: 無人機
    - label: 解決問題
      value: 比人工釘蜂片省時又省力。
  - label: 總結
    value: 昆蟲學家運用科技，針對防治中不斷出現的新問題改進方法，可說是「【　】」。
    blanks:
    - answer: 兵來將擋，水來土掩
