strategy_explained: '這一課我們要練習「猜猜字的意思」的技巧

  因為文章裡有很多新名詞，像是「秋行軍蟲」、「赤眼卵寄生蜂」，透過拆開來看字，像是「行」、「軍」、「蟲」、「寄生」等等，就能幫助你更了解牠們是什麼，還有它們在農業裡扮演的角色

  所以讀的時候，看到不懂的詞，可以試著把它拆開，想想每個字代表的意思，拼起來看看是不是能猜到整體的含義喔'
