  section_headings:
  - 人工噴農藥
  - 無人機噴農藥
  - 寄生蜂片
  - 寄生蜂扭蛋
  paragraphs:
  - idx: 1
    text: 秋行軍蟲是一種原產於美洲的飛蛾，翼展約3.5公分，牠繁殖力驚人，母蛾一生可以產下1500到2000顆卵，幼蟲長得像小號的蠶，對玉米、高粱有嚴重的破壞力。2019
      年，苗栗發現第一起入侵案例，幾年內秋行軍蟲的危害蔓延到許多地方，農民深受其害。面對這種陌生害蟲，臺灣昆蟲學家不斷的改良防治技術，我們來看看他們曾經嘗試過的方法。
    followed_by_heading: 人工噴農藥
  - idx: 2
    text: 噴灑農藥就可殺死秋行軍蟲，然而要有效防治，必須重複噴藥，平均一週要噴藥一次，持續兩、三週，影響糧食安全和農民的健康。現在天氣愈來愈熱，當種植的面積很大時，人工噴農藥實在太耗工、太辛苦、太危險。如一位農民所說：「要我穿防護衣進田裡去噴，我看會死在田裡。不是被毒死，就是被熱死。」
    followed_by_heading: 無人機噴農藥
  - idx: 3
    text: 人工噴藥既然又辛苦又危險，那用無人機噴可以嗎？大型的無人機低空噴灑一公頃農田，只要約20分鐘，一天可以噴五公頃，而且施作者不必直接接觸農藥，又安全，又省力。但這樣農民就可以一勞永逸了嗎？那可不。若長期反覆使用同一種農藥，害蟲族群中較能耐受藥劑的個體比較容易存活並繁殖。經過幾代後，這類害蟲的比例可能增加，使農藥效果變差，形成抗藥性。
    marker: ☞ 印在本段句首（念順順起點）
    followed_by_heading: 寄生蜂片
  - idx: 4
    text: 昆蟲學家發現，一種只有約1公釐大的「赤眼卵寄生蜂」是秋行軍蟲的剋星。母蜂找到秋行軍蟲的卵後，會把自己的卵產在裡面，寄生蜂幼蟲在裡面長大，這樣，秋行軍蟲的卵就不會孵出幼蟲。為了把寄生蜂帶進玉米田，研究人員把已被寄生的蟲卵黏在小紙卡上，做成「蜂片」。農民用釘書機把蜂片釘在玉米葉背面，寄生蜂長大後就會飛出來，幫忙防治秋行軍蟲。一公頃放121片就可以防治蟲害。但是，釘121片蜂片的工作須耗時2個鐘頭，對年紀大的農民仍然是苦差事。
    structure_note: 'DOCX 把這一段切成三個 <w:p>，只有第一個有「　　」首行縮排，後兩個沒有＝續行。

      段號欄只印六個號碼，而累計字數也支持這個切法（見 char_count_note）。

      PDF p2 把「五」「六」印在這一段中間，是轉檔重排的錯位。'
    followed_by_heading: 寄生蜂扭蛋
  - idx: 5
    text: 為了解決一片片釘蜂片太花時間的問題，昆蟲學家從扭蛋得到靈感，他們把原本黏在蜂片上的蟲卵放進紙製扭蛋裡。扭蛋上有小孔，寄生蜂長大後就會飛出來。農民只要把扭蛋丟進玉米田裡，就能讓寄生蜂幫忙防治秋行軍蟲。更棒的是，扭蛋還可以用無人機投放，一公頃約20到30分鐘就能完成投放，比人工釘蜂片省時又省力。
  - idx: 6
    text: 昆蟲學家面對秋行軍蟲的來襲，想方設法，以日新月異的科技幫農民解決問題，從噴農藥到生物防治，從純人工到無人機，遇到新的問題，他們就再想新的辦法，真可說是「兵來將擋，水來土掩」啊。
