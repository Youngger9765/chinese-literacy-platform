passage: '人工噴藥既然又辛苦又危險，那用無人機噴可以嗎？大型的無人機低空噴灑一公頃農田，只要約20分鐘，一天可以噴五公頃，而且施作者不必直接接觸農藥，又安全，又省力。但這樣農民就可以一勞永逸了嗎？那可不。若長期反覆使用同一種農藥，害蟲族群中較能耐受藥劑的個體比較容易存活並繁殖。經過幾代後，這類害蟲的比例可能增加，使農藥效果變差，形成抗藥性。

  昆蟲學家發現，一種只有約1公釐大的「赤眼卵寄生蜂」是秋行軍蟲的剋星。母蜂找到秋行軍蟲的卵後，會把自己的卵產在裡面，

  寄生蜂幼蟲在裡面長大，這樣，秋行軍蟲的卵就不會孵出幼蟲。

  為了把寄生蜂帶進玉米田，研究人員把已被寄生的蟲卵黏在小紙卡上，做成「蜂片」。農民用釘書機把蜂片釘在玉米葉背面，寄生蜂長大後就會飛出來，幫忙防治秋行軍蟲。一公頃放121片就可以防治蟲害。但是，釘121片蜂片的工作須耗時2個鐘頭，對年紀大的農民仍然是苦差󠇡事。'
