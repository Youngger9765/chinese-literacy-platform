    word: 鳥瞰
    definition: 從高處往下看。
  - index: 2
    word: 池魚之殃
    definition: 無緣無故受到災害連累。
  - index: 3
    word: 流離失所
    definition: 失去原本的住所，到處流亡、分散到各地。
  - index: 4
    word: 首當其衝
    definition: 最先遭遇災難或是最先受到衝擊。
  - index: 5
    word: 沒有人是局外人
    definition: 這件事和每個人都有關，沒有人可以置身事外。
  - index: 6
