spotlight:
  lesson: G7-L27
  strategy_name: 反思策略-4F反思法
  strategy_type: unknown
  blocks:
  - type: guide
    text: "「反思」的能力很重要，它能幫助我們發現自己的問題，進而思考：我可以怎麼做？當有新聞或校園事件發生時，你可以問自己：「這是怎麼回事？我覺得……再來可以怎麼做？」這就是「反思」了。\
      \ \n    作者看到吐瓦魯的報導也進行了反思，她想到臺灣也受到全球暖化的威脅，認為對抗全球暖化是全人類的共同議題。\n    反思很重要，但該怎麼做呢？接下來我們要介紹一個易學、步驟清楚的「4F反思法」。\n\
      1.事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。\n2.感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？\n3.發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？\n\
      4.未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？"
  - type: guide
    text: 一、請你利用課文來練習4F反思法，幫忙填入「未來（Future）」的格子內，能有什麼行動預防全球暖化吧。
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 二、請閱讀以下新聞，並練習4F反思法完成表格。
  - type: guide
    text: 〈缺糧讓兒童面臨童工、童婚風險〉　陳芝瑄／臺北報導(2024/6/20)
  - type: guide
    text: 世界展望會發布的「缺糧」報告指出，在一些需要援助的國家，許多家庭因為缺少食物，每天只能吃一頓飯，甚至有人整天沒有東西吃。
  - type: guide
    text: 長期缺糧，影響不只是吃不飽，許多兒童的生活也因此改變。有些兒童不到十歲就被迫工作，幫忙賺錢或換取食物；有些家庭無力照顧孩子，只好讓女兒提早結婚。原本應該上學、成長的孩子，因此失去受教育和安全生活的機會。
  - type: guide
    text: 世界展望會指出，氣候變遷、戰爭衝突等因素，使許多人陷入飢餓危機。人道救援組織正提供食物和其他協助，希望減少家庭的生存壓力，也避免更多兒童因缺糧而被迫工作或提早結婚。  <節選自國語日報網路新聞https://reurl.cc/bVLQzy>
  - type: guide
    text: 最後，國文和社會科老師經常會針對最近的新聞或校園事件，請同學們發表看法，無論是要同學口頭或書面發表，都是運用「4F反思法」的最好時機。
