  總表_對照: '⚠️ 總表這一列有兩個**異體字**：課名寫「淹没」（没）、文體寫「説明文」（説），

    學習單印的是「淹沒」「說明文」。只是字形不同，不是不同的課。

    語詞：總表 12 個 = 學習單兩份清單的**聯集再減掉「冤屈」**（見下方 _語詞三份清單note）。'
  語詞三份清單: "\U0001F534 這一課的語詞在學習單內部就有**兩份不同的 12 個**，不是抽取歧異：\n・**A 組**（第三大題語詞框 ＋ 第三大題\
    \ 12 道解釋題）：\n  臨界點／岌岌可危／首當其衝／雲端／鳥瞰／先例／流離失所／**元宇宙**／池魚之殃／氣候難民／冤屈／沒有人是局外人\n・**B\
    \ 組**（課文的黑框標記 ＋ 第八大題灰框）：\n  臨界點／岌岌可危／首當其衝／雲端／鳥瞰／先例／流離失所／**溫室氣體**／池魚之殃／氣候難民／冤屈／沒有人是局外人\n\
    兩組只差一個字詞：A 有「元宇宙」、B 有「溫室氣體」。\n而**找字格子圈起來的是 A∪B 的 13 個**（見 vocab_review.answer_paths）——\n\
    也就是說格子的答案比灰框多一個，這是本課個數警報成立的原因。\n總表則是 A∪B 再減掉「冤屈」＝ 12 個。"
strategy_explained: '這一課我們要練習的是「換位思考」，因為吐瓦魯面臨國家被淹沒的危機，你需要試著去想像他們的心情和處境

  讀的時候，可以想想如果換成是你，你會怎麼做，也能關心一下全球暖化對台灣可能會有哪些影響

  試著去理解他們提出「元宇宙國家」這個有點不可思議的計畫，背後到底是什麼樣的急迫感和希望'
