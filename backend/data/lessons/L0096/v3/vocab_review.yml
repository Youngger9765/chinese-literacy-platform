  notes:
    instruction: 原稿有兩個重疊的文字方塊，另一句寫「…把灰框內的語詞刪除。」；PDF p8 上層是「劃掉」。
    target_words: '灰框原文分兩行：「臨界點、岌岌可危、首當其衝、雲端、鳥瞰、先例、冤屈／流離失所、溫室氣體、池魚之殃、氣候難民、沒有人是局外人」（12 個，＝「B 組」）。

      ⚠️ **格子裡實際圈起來的有 13 條**，比灰框多一個「元宇宙」（來自第三大題的 A 組語詞框）。

      見 answer_paths 與 answer_paths_note。'
    grid: '🔵 **格子跨頁**：第 1~6 列印在 p8、第 7~10 列印在 p9。

      而且第 8 列的「溫室氣體」與第 10 列的「沒有人是局外人」兩條橫框被排版擠到 **p8 頁尾**

      （懸空在格子下方），在 p9 上那兩排字看起來像沒被圈。

      ⛔ 因此本課不能靠「圈壓在哪一格上」判讀。'
    answer_paths: "**13 條，比灰框的 12 個目標語詞多一條「元宇宙」。** 逐格取字 13 條全部拼得回。\n\n\U0001F534 這一條是**個數警報抓出來的**，過程如下（記下來是因為它是這條規則的第一個真陽性）：\n① 找字那一 block（block 110）有 13 個 roundRect。\n   （naive 紙外過濾回報 0 命中，但**那不算證據** —— 它只認得「錨點被放到紙外」那一種溢出；\n    本課真正的憑據是第 ③ 步的像素計數。）\n② 13 ＞ 12（我原本依灰框列的路徑數）→ 警報成立 → 回頭查。\n③ 把 p8/p9 以 200dpi 重繪、數橘色連通塊：\n   ・p9 恰好 3 塊 —— 氣候難民（橫 4 格）／冤屈（直 2 格）／**元宇宙（直 3 格，最右緣）**\n   ・p8 10 塊 —— 4 條獨立（池魚之殃／臨界點／雲端／先例）＋ 1 個四條相黏的大塊\n     （岌岌可危＋流離失所＋鳥瞰＋首當其衝）＋ 2 個被擠到頁尾的橫框（溫室氣體／沒有人是局外人）\n   合計 3＋10＝13，與 roundRect 數一致，且缺口正好是「元宇宙」。\n④ 「元宇宙」在第三大題的語詞框（A 組）裡，只是第八大題的灰框（B 組）沒列它。\n\n⛔ 未把它從灰框「補進」target_words —— target_words 記的是灰框印了什麼，\nanswer_paths 記的是格子上圈了什麼，兩者不同本身就是這一課的事實（見 meta._語詞三份清單note）。"
