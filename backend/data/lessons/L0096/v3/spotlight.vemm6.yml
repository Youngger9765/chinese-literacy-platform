spotlight:
  strategy_name: 反思策略——4F反思法
  strategy_type: reflection
  section_title_printed: 閱讀聚光燈
  answer_carrier: 橘色手寫字；**本大題沒有任何 ☑**（全課 F0FE ＝ 0），因為 4F 反思是開放書寫不是選擇題。
  blocks:
  - type: concept_box
    text: '「反思」的能力很重要，它能幫助我們發現自己的問題，進而思考：我可以怎麼做？當有新聞或校園事件發生時，你可以問自己：「這是怎麼回事？我覺得……再來可以怎麼做？」這就是「反思」了。

      作者看到吐瓦魯的報導也進行了反思，她想到臺灣也受到全球暖化的威脅，認為對抗全球暖化是全人類的共同議題。

      反思很重要，但該怎麼做呢？接下來我們要介紹一個易學、步驟清楚的「4F反思法」。

      1.事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。

      2.感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？

      3.發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？

      4.未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？'
  - type: guide
    text: 一、請你利用課文來練習4F反思法，幫忙填入「未來（Future）」的格子內，能有什麼行動預防全球暖化吧。
