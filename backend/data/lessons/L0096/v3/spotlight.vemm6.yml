      內容: 我發現全球暖化不只是吐瓦魯的問題，臺灣也可能受到海平面上升影響，所以沒有人是局外人。
    - 4F 步驟: 未來（Future）
      內容: '我們可以做哪些事，減少溫室氣體排放，為減緩全球暖化盡一份力？節能低碳生活。

