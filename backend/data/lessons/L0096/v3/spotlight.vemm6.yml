    rows:
    - 4F 步驟: 事實（Facts）
      內容: 吐瓦魯因為全球暖化即將被淹沒，宣布要建立元宇宙國家。
    - 4F 步驟: 感受（Feeling）
      內容: 我覺得很擔心，也覺得不公平，因為吐瓦魯排放的溫室氣體很少，卻受到很大的影響。
