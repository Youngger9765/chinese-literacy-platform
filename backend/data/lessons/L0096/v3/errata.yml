    section: 三 語詞我最棒
    locator: 語詞框末尾
    source: 池魚之殃、氣候難民、先例冤屈、沒有人是局外人。
    corrected: 池魚之殃、氣候難民、冤屈、沒有人是局外人。
    kind: 贅字（語詞重複）
    why: '「先例」在同一個語詞框裡出現兩次（第 6 個一次，「冤屈」前面又一次），

      而且第二次跟「冤屈」黏成不存在的詞「先例冤屈」。

      第三大題的 12 道解釋題裡「先例」只有一題（第 12 題）、「冤屈」也只有一題（第 9 題），

      可見框裡多打了一個「先例」。'
    confidence: high
    evidence: document.xml 該文字方塊為「…氣候難󠇡民、先例／冤屈、沒有人是局外人。」（跨行），PDF p3 一致
