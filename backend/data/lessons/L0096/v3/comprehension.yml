lesson_uid: L0096
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列選項「  」中的語詞，何者使用正確？
    stem_note: 題幹的引號內是兩個全形空格，原稿如此。
    options:
      A: 烏俄戰爭持續不斷，讓許多人「流離失所」，甚至失去性命
      B: 妹妹從山腳下「鳥瞰」山上的樹林，覺得風景真是美麗極了
      C: 運動鞋特賣會開始了，小翔「首當其衝」，第一個衝進會場
      D: 大雄因作業沒完成而被老師處罰，遭受「池魚之殃」，真倒楣
  - index: 2
    answer: B
    stem: 根據課文第四段，吐瓦魯部長柯飛說：「我們要將它們移到雲端！」這裡的它們指的是什麼呢？
    stem_note: 題幹的「它們」在原稿加了底線；引文寫「移到雲端」，課文原句是「轉移到雲端」。照原樣。
    options:
      A: 吐瓦魯的祖先、人民和家園
      B: 吐瓦魯的土地、海洋和文化
      C: 吐瓦魯的領土、人民和政府
      D: 吐瓦魯的地標、家園和小島
  - index: 3
    answer: A
    stem: 本課課文主要談吐瓦魯面臨全球暖化危機，為什麼後面還要特別提到臺灣？請選出最可能的原因。
    options:
      A: 因為作者想讓臺灣讀者感同身受，理解「沒有人是局外人」
      B: 因為臺灣是作者的國家，他也想要讓讀者認識他的家園
      C: 因為臺灣數位科技發達，要登入元宇宙特別容易
      D: 因為臺灣也想要獲得國際承認，並持續擁有海域邊界與資源
  - index: 4
    answer: C
    stem: 根據本文，下列哪一項最能說明「元宇宙」？整篇文章讀下來，你認為什麼是「元宇宙」呢？
    options:
      A: 它是為了讓吐瓦魯人民安全離開小島，而在大陸設置的空間
      B: 它是一個聯合國嘗試在外太空為吐瓦魯建立的網路新世界
      C: 它是透過數位科技建立、可讓使用者在其中互動的虛擬世界
      D: 它是為了避難，在海水淹不到的地方設置的超大型庇護所
  - index: 5
    answer: D
    stem: 作者寫這篇文章的目的是什麼呢？
    options:
      A: 想支持吐瓦魯建立元宇宙國家
      B: 讓讀者了解吐瓦魯的處境
      C: 想要臺灣提早建立虛擬國家
      D: 希望大家一起正視暖化議題
  notes:
    answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
