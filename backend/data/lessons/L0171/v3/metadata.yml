intro: 這篇文章探討我們腦中經常出現的負面念頭，以及這些念頭如何影響我們的行為和感受。作者首先描繪了日常生活中，我們如何被各種擔憂和批評的聲音所困擾，並介紹了「白熊效應」，說明越想壓抑的念頭，反而越容易浮現。接著，文章提出了「藍海豚」的概念，作為一種轉移注意力、與負面念頭和平共處的方法。透過具體的例子，引導讀者學習如何運用「藍海豚」來應對腦中的「酸民」，將注意力拉回到當下，並認識到這些負面想法可能只是「路過」的念頭，不一定需要全盤接受。
notes:
  課型: 體育生品格教育
  目標議題: 品格力──念頭覺察
  前一課: L0170（體-L4 專注當下：關掉內心的批評噪音）；本課聚光燈開頭直接接續該課
strategy: 品格力──念頭覺察
strategy_explained: '這一課我們要練習的是，當心裡出現一些讓你不開心的、愛批評的壞念頭時，要怎麼讓它們乖乖聽話、不再搗亂

  因為這篇文章用「白熊效應」告訴我們，越想趕走壞念頭，它們反而越跑出來，但又介紹了「藍海豚」的方法，教我們怎麼轉移注意力，讓這些念頭像「路過」一樣，不再一直停在腦袋裡

  所以，讀的時候，試著想想看，腦袋裡出現那些「酸民」念頭時，你能不能像作者說的，拿出你的「藍海豚」來，把注意力拉回到現在正在做的事情上呢'
