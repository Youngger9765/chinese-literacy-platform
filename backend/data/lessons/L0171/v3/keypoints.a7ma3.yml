keypoints:
  title: 從白熊到藍海豚：學習與念頭和平相處
  layout: list
  columns_printed:
  - 架構
  - 內容
  intro: 本篇文章強調如何與負面念頭和平相處，請根據架構整理文章的重點。
  answer_carrier: 橘色手寫（字元樣式 af0）＋ 紅色 ☑（w:sym Wingdings F0FE，色碼 EE0000，4 個在本節）
  layout_note: '原稿是兩欄表，但「問題描述」與「解決方法」兩列的內容欄又切成子表（負面念頭舉例｜影響）；

    依 SKILL 攤平成 items，子欄名寫進 label。'
  rows:
  - label: 引言
    value: '日常生活中，我們腦袋中有眾多念頭，且多半是

      使我們充滿'
    sub_questions:
    - stem: 日常生活中，我們腦袋中有眾多念頭，且多半是
      options:
        1: 正面
        2: 負面
      answer: 2
    - stem: 使我們充滿
      options:
        1: 自信
        2: 懷疑
      answer: 2
  - label: 問題描述
    columns_printed:
    - 負面念頭舉例
    - 影響
    items:
    - label: 1.「我很爛」
      value: 遇到事情容易【　】
      blanks:
      - answer: 退縮
    - label: 2.「我只會添麻煩」
      value: 覺得自己是【　】，不敢向他人【　】
      blanks:
      - answer: 負擔
      - answer: 求助
    - label: 3.「都是我的錯」
      value: 遭遇挫折容易過度【　】
      blanks:
      - answer: 自責
    - label: 小結
      value: 越要自己不去想，念頭反而越清晰，這就是【　】效應。
      blanks:
      - answer: 白熊
      sub_questions:
      - stem: 如果抗拒這些念頭，它們就會
        options:
          1: 消失
          2: 放大
        answer: 2
      note: 原稿印「如果抗拒這些念頭，它們就會（□①消失  ☑②放大）。越要自己不去想…」——選項夾在句中
  - label: 解決方法
    items:
    - label: 1.召喚藍海豚
      value: 運用方法轉移【　】，讓注意力回到【　】正在做的、最重要的事上。
      blanks:
      - answer: 注意力
      - answer: 當下
    - label: 2.念頭只是路過
      value: 提醒自己──「這只是【　】，不是真的」，重新選擇回應念頭的方法。
      blanks:
      - answer: 念頭
  - label: 結語
    value: 下次又浮現負面想法時，記得把【　】拉回當下，只要
    blanks:
    - answer: 注意力
    sub_questions:
    - stem: 只要
      options:
        1: 看見
        2: 相信
      answer: 1
    tail: 那些念頭，不必跟隨它。
    note: 原稿印「…拉回當下，只要（☑①看見  □②相信）那些念頭，不必跟隨它。」——選項夾在句中
