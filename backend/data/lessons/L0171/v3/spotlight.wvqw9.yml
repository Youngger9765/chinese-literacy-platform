lesson_uid: L0171
version_id: v3
section_no: 六
spotlight:
  strategy_name: 調節與因應負面念頭
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，色碼 EE0000，9 個在本節）
  blocks:
  - type: concept_box
    text: '在〈專注當下：關掉內心的批評噪音〉中，我們已經學會看見那些常冒出來的負面念頭，知道它們有不同的說話方式。

      這一單元，我們要再往前一步──不是跟念頭吵架，也不是急著把它趕走，而是學一種比較不累的相處方式。

      當你越叫自己「不要想」，那個念頭反而越大聲，這就是所謂的「白熊效應」。而「藍海豚」則是幫助你轉移注意力，拉回當下。接下來的練習，會一步一步帶你找出適合你自己的藍海豚，讓你在緊張、焦慮或自責出現時，有一個真的用得上的方法。'
  - type: figure
    referent: 白熊效應與藍海豚對照插圖
    text_carrier: image
    content: "兩格插圖：\n1. 白熊效應 (越想刻意不去想某件事，反而會越常想到它)：學生抱頭，腦中全是白熊，\n   旁邊標「結果腦袋裡全都是白熊…」與大字「不要想！」\n\
      2. 藍海豚 (把注意力放到完全不同的另一個地方，讓自己分心，不再聚焦白熊)：\n   學生在籃球場上指著前方，旁邊有海豚、籃球、書本、音符，\n  \
      \ 對白是「去打球！專注在球場上！」與「看！是藍海豚！」"
    content_note: '⚠️ 標 text_carrier: image 前已自檢：這些插圖內對白（「結果腦袋裡全都是白熊…」「不要想！」

      「去打球！專注在球場上！」「看！是藍海豚！」）在文字層 grep 全部 0 命中，確實只畫在像素裡。

      兩格的**標題**（白熊效應／藍海豚 與括號內說明）也一樣不在文字層。'
  - type: guide
    text: ◎認識藍海豚：
  - type: table
    columns:
    - ''
    - 類型
    - 說明
    - 舉例
    rows:
    - - '1'
      - 身體
      - 把注意力聚焦在身體或是感官。
      - 數呼吸10下、留意腳踩在地上的感覺。
    - - '2'
      - 行動
      - 把注意力聚焦在一段可描述的動作流程。
      - 依序留意完成揮棒的熱身動作，並說出來。（如果出聲讓你不自在，也可以改成在心中喃喃自語）
    - - '3'
      - 問題解決
      - 把注意力聚焦在自己可控的事物
      - 問自己「哪些是我能控制的？」、「下一步是什麼？」
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 練習一：辨識藍海豚──判斷文章中，作者提出的「藍海豚」，分別屬於哪個層面。
  - type: sub_block
    label: 練習一
    columns:
    - 事件
    - 藍海豚
    - 類型
    items:
    - type: single
      intro: 準備上場打擊，感到非常緊張
      prompt: 出聲把自己正在做的熱身動作說出來
      options:
        1: 身體
        2: 行動
        3: 問題解決
      answer: 2
    - type: single
      intro: 因失誤而感到自責
      prompt: 問問自己：「下一步我可以怎樣做得更好？」
      options:
        1: 身體
        2: 行動
        3: 問題解決
      answer: 3
    columns_note: '原稿是三欄表；`intro` 放「事件」欄、`prompt` 放「藍海豚」欄，兩段各自照原稿逐字。

      ⛔ 不把兩欄用分隔符接成一句。'
  - type: single
    prompt: ※前一課〈專注當下，關掉內心的批評噪音〉中，主角因為做了棒式訓練，感受到肌肉越來越痠，呼吸越來越急，這是
    options:
      1: 身體
      2: 行動
      3: 問題解決
    answer: 1
    tail: 類型的藍海豚。
    tail_note: 原稿印「…這是（☑①身體 □②行動  □③問題解決 ）類型的藍海豚。」——選項夾在句中
  - type: guide
    text: 練習二：區辨白熊與藍海豚──比較下列相同情境的不同回應，哪個聚焦在白熊（抗拒的念頭），哪個聚焦在藍海豚（新的焦點）？
  - type: sub_block
    label: 練習二
    columns:
    - 情境
    - 想法或作法
    - 聚焦重點
    items:
    - type: single
      intro: 上台報告前，你心跳很快
      prompt: 1.一直告訴自己「拜託不要緊張」
      options:
        1: 白熊
        2: 藍海豚
      answer: 1
    - type: single
      intro: 上台報告前，你心跳很快
      prompt: 2.感受腳趾在鞋子裡曲伸的感覺，默讀資料上的文字
      options:
        1: 白熊
        2: 藍海豚
      answer: 2
    - type: single
      intro: 上台報告前，你心跳很快
      prompt: 3.不斷想像最糟的結果
      options:
        1: 白熊
        2: 藍海豚
      answer: 1
    - type: single
      intro: 小考考砸了，你很懊惱
      prompt: 1.一直回想自己哪一題寫錯、怎麼會寫錯
      options:
        1: 白熊
        2: 藍海豚
      answer: 1
    - type: single
      intro: 小考考砸了，你很懊惱
      prompt: 2.先把錯的題目標出來，看看是否有重複的類型
      options:
        1: 白熊
        2: 藍海豚
      answer: 2
    - type: single
      intro: 小考考砸了，你很懊惱
      prompt: 3.問自己下一次還可以嘗試什麼準備方法
      options:
        1: 白熊
        2: 藍海豚
      answer: 2
    columns_note: 「情境」欄在原稿是跨列合併儲存格（前 3 題共用一個、後 3 題共用一個），這裡每題各自重複一次
  - type: guide
    text: 練習三：找出自己的藍海豚──找到自己日常的「藍海豚」，幫助自己在負面念頭冒出來時，可以派上用場。
  - type: multi
    prompt: 1.使用時機：什麼時候我需要召喚藍海豚？請選出你能察覺的訊號。
    options:
      1: 我開始反覆重播剛剛的失誤
      2: 我一直想「不要緊張」
      3: 我心跳變快／手心冒汗
      4: 我腦中出現「都是我害的」
      5: 我一直在想別人會怎麼看我
      6: 其他：____________________
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 2.選擇策略：勾選你覺得適合你或可能有效的方法。
  - type: table
    columns:
    - 身體藍海豚
    - 行動藍海豚
    - 問題解決藍海豚
    rows:
    - - '□①數呼吸10下

        □②感覺雙腳在鞋子中的觸感、踩地的重量

        □③肩膀用力聳起然後放鬆，重複3次

        □④手握拳繃緊，然後放開，重複5次

        □⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿'
      - '□①找出眼前任務的「第一步」並做完

        □②出聲描述完成任務的步驟，依序執行。

        □③離開當下，做一件1分鐘內可以完成的事（如：上廁所）

        □④完成一個熟悉的小流程（例：拿水→喝一口→放回）

        □⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿'
      - '問自己：

        □①現在有哪些是我能控制的？

        □②我需要什麼資源或協助？

        □③哪一件事我先做到「及格」就好？

        □④現在最重要的是哪一件事？

        □⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿'
    rows_note: '三欄各是一組自我勾選清單，**沒有正確答案**（學生自選）。

      行動欄第 4 項的「拿水→喝一口→放回」用的是**字面箭號「→」（U+2192）**，不是 w:sym，保留原樣。'
    no_correct_answer: true
  - type: multi
    prompt: '３.檢核成效：請選出藍海豚出現的訊號。

      我們不需要把白熊趕走，只要做到：'
    options:
      1: 念頭音量小一點點
      2: 能將注意力回到當下30秒
      3: 能開始採取行動，做到第一步
      4: 其他：___________________
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
    prompt_note: 原稿這一項的序號印的是**全形「３」**，前兩項印半形「1.」「2.」
  - type: free_text
    prompt: '◎總結：給自己一句話帶走召喚藍海豚的魔法──

      （例：當我反覆要自己不要緊張時，我可以數呼吸10秒。）

      →當我________________________時，我可以____________________。'
    no_correct_answer: true
    answer_carrier: 學生自填，原稿空白
