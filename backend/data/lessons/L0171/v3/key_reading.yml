  passage: 有時候，一句「我很爛」，會讓我們明明有能力，卻在起步前就退縮；一句「我只會添麻煩」，讓我們覺得自己是別人的負擔，因此最需要協助時，卻把求助的話默默吞下去；一句「都是我的錯」，更會像一把沉重的鎖，把人關進自責的迷宮裡，不斷反覆回放失敗的畫面。當你越抗拒這些念頭，越要自己不去想，會發現這些「腦內酸民」反而更大聲。就像，如果我要求：「你現在可以胡思亂想，但不准你想白熊！」你看！你的腦海是不是開始反覆出現白熊的畫面了呢？這就是經典的「白熊效應」——你愈想抗拒、壓抑一個念頭，那個念頭就更容易跳出來。
