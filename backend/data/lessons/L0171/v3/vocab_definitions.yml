  vocabulary_bank_label: 本課語詞
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  items:
  - index: 1
    word: 酸言酸語
    definition: 帶有諷刺、批評、不懷好意的言語。
  - index: 2
    word: 唱衰
    definition: 不看好某人或某事的未來發展。
  - index: 3
    word: 邋遢
    definition: 形容人或環境不整潔，給人髒亂的感覺。
  - index: 4
    word: 俯仰
    definition: 低頭與抬頭。
  - index: 5
    word: 大肆
    definition: 毫無節制、大規模；通常用來描述負面情況。
  - index: 6
    word: 退縮
    definition: 不敢前進，選擇後退或放棄。
  - index: 7
    word: 效應
    definition: 由事件引發的效果、影響或反應。
  - index: 8
    word: 起步
    definition: 比喻事情開始進行。
  - index: 9
    word: 預言
    definition: 對未來事情的預測或說法。
  - index: 10
    word: 惱人
    definition: 令人煩躁、不舒服或生氣的。
  - index: 11
    word: 充斥
    definition: 大量充滿；多用於負面事物。
  notes:
    answer_carrier: 橘色手寫（多數走字元樣式 af0，少數走 run 層 w:color，兩種都是 E97132）
