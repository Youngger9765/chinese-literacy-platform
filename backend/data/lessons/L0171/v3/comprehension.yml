lesson_uid: L0171
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（run 層 w:color E97132）；第 1 題印全形「Ａ」，其餘半形
  teacher_note_carrier: 深藍色（C:0F4761）文字方塊，印在題目右側
  questions:
  - index: 1
    answer: A
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 這片山林因為民宿開發而被「大肆」破壞
      B: 他「邋遢」的行事風格，受到許多人喜愛
      C: 這「惱人」的鳥鳴聲，在早晨中使人喜悅
      D: 他「效應」了許多次都沒用，只好發起抗爭
    teacher_note: '第1題解析：(B)「邋遢」形容不乾淨整潔(C)「惱人」形容不舒服的感受

      (D)「效應」應換成「反映」'
  - index: 2
    answer: B
    stem: 根據第二段，作者提到「大腦還會拿起擴音器大肆廣播」，這句話最可能用來形容什麼現象？
    options:
      A: 大腦會幫助我們篩選並記住重要訊息
      B: 負面想法經常被大腦放大與重複播放
      C: 大腦習慣借助工具並處理簡單的任務
      D: 腦中許多想法都有所根據且不容忽視
    teacher_note: 第2題解析：從前後文可看出，此處的「擴音器大肆廣播」有重複和放大的效果
  - index: 3
    answer: C
    stem: 根據文章，作者認為「藍海豚」的功能最接近下列何者？
    options:
      A: 幫助我們逃避負面情緒
      B: 教我們忽略一切不好的事情
      C: 幫助我們將注意力拉回當下
      D: 用更嚴格的標準來要求自己
  - index: 4
    answer: B
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 認清大腦的運作方式，學會以理性取代負面思考
      B: 理解念頭的影響，並學習透過行動轉化注意力
      C: 建立自信心，避免讓別人看出自己的軟弱情緒
      D: 用樂觀取代擔憂，讓情緒盡可能保持正向狀態
  - index: 5
    answer: D
    stem: 根據品格聚光燈，面對上台時刻，下列哪一種因應方式最符合召喚「藍海豚」？
    options:
      A: 告訴自己「不要緊張，不要出錯！」
      B: 強迫自己不要去想最糟的結果會怎樣
      C: 放空不想任何事，或乾脆不去報告了
      D: 專注練習，在心中反覆複習報告重點
    teacher_note: (D)符合「專注當下」「找出可以控制的事」
    teacher_note_note: 這個文字方塊在 PDF 上被右邊界裁掉一部分，此處以文字層為準
