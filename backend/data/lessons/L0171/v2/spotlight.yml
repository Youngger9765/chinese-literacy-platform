spotlight:
  lesson: 體-L5
  strategy_name: 品格力-念頭覺察
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 練習一：辨識藍海豚──判斷文章中，作者提出的「藍海豚」，分別屬於哪個層面。
  - type: table
    rows:
    - - 事件
      - 藍海豚
      - 類型
    - - 準備上場打擊，感到非常緊張
      - 出聲把自己正在做的熱身動作說出來
      - "□①身體 \n②行動 \n□③問題解決"
    - - 因失誤而感到自責
      - 問問自己：「下一步我可以怎樣做得更好？」
      - "□①身體 \n□②行動 \n③問題解決"
  - type: guide
    text: ※前一課〈專注當下，關掉內心的批評噪音〉中，主角因為做了棒式訓練，感受到肌肉越來越痠，呼吸越來越急，這是
  - type: single
    prompt: 請選擇
    options:
    - 行動
    - 問題解決 ）類型的藍海豚。
    answer: 行動
  - type: guide
    text: 練習二：區辨白熊與藍海豚──比較下列相同情境的不同回應，哪個聚焦在白熊（抗拒的念頭），哪個聚焦在藍海豚（新的焦點）？
  - type: table
    rows:
    - - 情境
      - 想法或作法
      - 聚焦重點
    - - 上台報告前，你心跳很快
      - 1.一直告訴自己「拜託不要緊張」
      - "①白熊 \n□②藍海豚"
    - - 上台報告前，你心跳很快
      - 2.感受腳趾在鞋子裡曲伸的感覺，默讀資料上的文字
      - "□①白熊 \n②藍海豚"
    - - 上台報告前，你心跳很快
      - 3.不斷想像最糟的結果
      - "①白熊 \n□②藍海豚"
    - - 小考考砸了，你很懊惱
      - 1.一直回想自己哪一題寫錯、怎麼會寫錯
      - "①白熊 \n□②藍海豚"
    - - 小考考砸了，你很懊惱
      - 2.先把錯的題目標出來，看看是否有重複的類型
      - "□①白熊 \n②藍海豚"
    - - 小考考砸了，你很懊惱
      - 3.問自己下一次還可以嘗試什麼準備方法
      - "□①白熊 \n②藍海豚"
  - type: guide
    text: 練習三：找出自己的藍海豚──找到自己日常的「藍海豚」，幫助自己在負面念頭冒出來時，可以派上用場。
  - type: single
    prompt: 1.使用時機：什麼時候我需要召喚藍海豚？請選出你能察覺的訊號。
    options:
    - 我開始反覆重播剛剛的失誤
    - 我一直想「不要緊張」
    - 我心跳變快／手心冒汗
    - 我腦中出現「都是我害的」
    - 我一直在想別人會怎麼看我
    - 其他：____________________
    answer: 我開始反覆重播剛剛的失誤
  - type: free_text
    prompt: 2.選擇策略：勾選你覺得適合你或可能有效的方法。
  - type: table
    rows:
    - - 身體藍海豚
      - 行動藍海豚
      - 問題解決藍海豚
    - - '□①數呼吸10下

        □②感覺雙腳在鞋子中的觸感、踩地的重量

        □③肩膀用力聳起然後放鬆，重複3次

        □④手握拳繃緊，然後放開，重複5次

        □⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿'
      - '□①找出眼前任務的「第一步」並做完

        □②出聲描述完成任務的步驟，依序執行。

        □③離開當下，做一件1分鐘內可以完成的事（如：上廁所）

        □④完成一個熟悉的小流程（例：拿水→喝一口→放回）

        □⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿'
      - '問自己：

        □①現在有哪些是我能控制的？

        □②我需要什麼資源或協助？

        □③哪一件事我先做到「及格」就好？

        □④現在最重要的是哪一件事？

        □⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿'
  - type: free_text
    prompt: ３.檢核成效：請選出藍海豚出現的訊號。
  - type: guide
    text: 我們不需要把白熊趕走，只要做到：
  - type: multi
    prompt: 請選擇
    options:
    - 念頭音量小一點點
    - 能將注意力回到當下30秒
    - 能開始採取行動，做到第一步
    - 其他：___________________
    answer:
    - 念頭音量小一點點
    - 能將注意力回到當下30秒
    - 能開始採取行動，做到第一步
    - 其他：___________________
  - type: guide
    text: ◎總結：給自己一句話帶走召喚藍海豚的魔法──
  - type: guide
    text: （例：當我反覆要自己不要緊張時，我可以數呼吸10秒。）
  - type: guide
    text: →當我________________________時，我可以____________________。
