      - type: guide
        text: →根據上述的整理和理解，此題答案選：【  B  】
      steps_note: 本題有 ❶~❺ 五個步驟（其餘各題為 ❶~❹ 四步）
    - type: sub_block
      label: (2) 小澤的努力
      quote: (2)「小澤一直覺得，真正的努力就是把所有時間投入進去。段考前，他每天坐在書桌前四個小時，筆記本也抄寫得密密麻麻。看到同學去運動、聊天，他還有點得意，覺得別人都在浪費時間，自己準備得一定更充分。考卷發下來那天，他期待看到大幅進步的分數──竟然不及格。後來他找老師討論後才發現，只是重複抄寫，卻沒有想清楚題目為什麼會錯，效果不大。原來，努力不只是願意花時間，還需要用對方法。」
      stem: 依據本文，下列何者最能概括本文主旨？
      options:
        A: 讀書時投入較多時間，通常就能逐漸改善考試成績
        B: 整理與抄寫筆記很重要，但還應增加更多複習時間
        C: 學習效果不佳時，應先減少運動和聊天等休閒活動
        D: 努力不只是投入時間，還要能找出問題並用對方法
      answer: D
      items:
      - type: single
        prompt: ❷判斷作用：
        options:
          1: 補充說明
          2: 語意轉折
        answer: 2
      - type: single
        prompt: ❸找重點：比較破折號前後內容，下列何者為本句重點？
        options:
          1: 他期待看到大幅進步的分數
          2: 他竟然不及格
        answer: 2
      - type: single
        prompt: ❹順文意：哪一句最完整地說出破折號前後的意思？
        options:
          1: 小澤付出了許多努力，而最終實現了目標
          2: 小澤付出了許多努力，最後卻還是期待落空
        answer: 2
      - type: guide
        text: ❺選選項：依據本文，下列何者最能概括本文主旨？
      - type: guide
