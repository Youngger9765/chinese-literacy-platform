lesson_uid: L0044
version_id: v3
section_no: 一
spotlight:
  strategy_name: 解題策略──看特殊標點找線索
  strategy_type: strategy
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: guide
    text: 一、特殊標點──分號
  - type: table
    label: 分號．標點介紹
    instruction: 1.標點介紹：
    columns:
    - 名稱
    - 符號
    - 出現時機
    - 閱讀時怎麼做
    rows:
    - - 分號
      - ；
      - 分號把內容分成幾組，各組之間在意思或句型上有關聯
      - 看到分號，先分組，再看各組哪裡相同、哪裡不同
    example: 例子：夏天的山林，綠意盎然；冬天的山林，白雪茫茫。
  - type: concept_box
    label: 分號．策略說明
    text: '2.策略說明：

      ❶圈標點：圈出分號，把文句分組。

      ❷讀文意：讀出每一組的主要意思。

      ❸看關係：比較各組間的關係，是強調相同的重點，還是呈現不同的狀況。

      ❹順文意：如果還有其他前後文，就需要統整全文來看。'
  - type: sub_block
    label: 分號．小試身手
    instruction: 3.小試身手：
    answer_carrier: 紅色 ☑、紅色手寫字與紅框圈標點（皆為圖形），文字流無此資訊
    items:
    - type: sub_block
      label: (1) 鯨魚與蝙蝠
      quote: (1)「鯨魚是哺乳類，不是魚類；蝙蝠是哺乳類，不是鳥類。」
      items:
      - type: free_text
        prompt: ❶圈標點：圈出分號，把文句分組，確認分組，共【　】組
        blanks:
        - answer: '2'
      - type: single
        prompt: →第一組強調鯨魚是
        options:
          1: 魚類
          2: 哺乳類
        answer: 2
      - type: single
        prompt: →第二組強調蝙蝠是
        options:
          1: 鳥類
          2: 哺乳類
        answer: 2
      - type: free_text
        prompt: ❸看關係：→兩組有共同點，都在釐清動物的分類，鯨魚和蝙蝠都是【　】
        blanks:
        - answer: 哺乳類
    - type: sub_block
      label: (2) 勤勞
      quote: (2)「勤勞能幫助農人，使他收穫豐富；幫助工人，使他產品精美；幫助商人，使他貨物暢銷；幫助學生，使他成績優良。」
      items:
      - type: free_text
        prompt: ❶圈標點：圈出分號，把文句分組，確認分組，共【　】組。
        blanks:
        - answer: '4'
      - type: single
        prompt: →第一組的人物是【　】，勤勞帶給他
        blanks:
        - answer: 農人
        options:
          1: 好處
          2: 壞處
        answer: 1
      - type: single
        prompt: →第二組的人物是【　】，勤勞帶給他
        blanks:
        - answer: 工人
        options:
          1: 好處
          2: 壞處
        answer: 1
      - type: single
        prompt: →第三組的人物是【　】，勤勞帶給他
        blanks:
        - answer: 商人
        options:
          1: 好處
          2: 壞處
        answer: 1
      - type: single
        prompt: →第四組的人物是【　】，勤勞帶給他
        blanks:
        - answer: 學生
        options:
          1: 好處
          2: 壞處
        answer: 1
      - type: free_text
        prompt: →四組有共同點，都在強調【　】能帶來好處。
        blanks:
        - answer: 勤勞
  - type: sub_block
    label: 分號．實戰演練
    instruction: 4.實戰演練：
    answer_carrier: 紅色 ☑、紅色手寫字與紅框圈標點（皆為圖形），文字流無此資訊
    items:
    - type: sub_block
      label: (1) 112年會考「彎曲的生命旅路」
      quote: (1)「彎曲的生命旅路，常常會被安排與許多人與事錯身而過，有些注定是淡漠的，並淪為遺忘；有些則產生強烈衝擊，終至刻骨銘心。」
      source_label: （文句引自112年會考國文科）
      stem: 依據這段文字，下列何者最符合文意？
      options:
        A: 人生會遇見許多人事，有些淡去，有些留下深刻影響
        B: 人生中越是短暫的相遇，越容易形成深刻而長久的記憶
        C: 人生經歷是否被記住，主要取決於相遇時間的長短
        D: 人生旅途難免錯過，重要的是努力保留每一段回憶
      answer: A
      items:
      - type: free_text
        prompt: ❶圈標點：圈出分號，把文句分組，確認分組，共【　】組。
        blanks:
        - answer: '2'
      - type: single
        prompt: →第一組寫有些事情的印象是【　】的，最後會
        blanks:
        - answer: 淡漠
        options:
          1: 牢記
          2: 遺忘
        answer: 2
      - type: single
        prompt: →第二組寫有些事情帶來強烈【　】，最後會
        blanks:
        - answer: 衝擊
        options:
          1: 牢記
          2: 遺忘
        answer: 1
      - type: single
        prompt: ❸看關係：→兩組呈現
        options:
          1: 相同
          2: 不同
        answer: 2
      - type: single
        prompt: 強調不同事情會留下
        options:
          1: 相同
          2: 不同
        answer: 2
        tail: 印象。
      - type: guide
        text: →根據上述的整理和理解，只有【  A  】選項強調事情帶來的不同影響，因此答案選【  A  】。
    - type: sub_block
      label: (2) 104年會考「每個人都是特別的」
      instruction: (2) 這一題換你試試看：
      quote: 「如果每個人都是特別的，那就沒有一個特別；如果每個人都得到一個獎杯，獎杯就變得毫無意義。生活最甜美的樂趣，在於承認自己並不特別。」 這段文字的涵義，與下列何者最接近？
      source_label: （104會考國文科第21題）
      options:
        A: 不要強調自己與眾不同
        B: 追逐名利其實毫無意義
        C: 認真生活才有甜美的樂趣
        D: 生活樂在發掘他人的特別
      answer: A
      answer_line: →此題答案選：【  A  】。
      teacher_note: '→先圈出分號，確認文句分成【2】組。

        →第一組說明：當每個人特別，「特別」就失去意義。

        →第二組說明：當每個人都得到獎杯時，「獎杯」也失去意義。

        →兩組的共同點：某種肯定如果人人都有，就不能再顯示個別差異。

        →最後一句進一步指出，生活的樂趣在於接受自己並不特別。

        →因此這段文字提醒我們不必一味強調自己與眾不同，答案選【A】。'
      teacher_note_placement_note: 這則藍框解析在 PDF 上印在 (1) 的「❹順文意」右側，但內容講的是 (2)，故依內容歸到本題
  - type: guide
    text: 二、特殊標點──冒號
  - type: table
    label: 冒號．標點介紹
    instruction: 1.標點介紹：
    columns:
    - 名稱
    - 符號
    - 出現時機
    - 閱讀時怎麼做
    rows:
    - - 冒號
      - ：
      - 冒號後面會有說明、列舉或舉例，把前面的概念說得更具體
      - 先找冒號前面的主要概念，再看後面如何具體說明。
    example: 例子：這家餐廳成功的祕訣只有一個：堅持使用最經濟實惠的在地食材。
    footnote: ※冒號另外的常見用法是搭配引號，引出他人的話，在此不討論。
  - type: concept_box
    label: 冒號．策略說明
    text: '2.策略說明：

      ❶圈標點：圈出冒號。

      ❷往前找重點：找出冒號前面要說明的重要概念。

      ❸往後找細節：找出冒號後面的說明、細節或例子。

      ❹順文意：連結冒號前後，統整完整文意。'
  - type: sub_block
    label: 冒號．小試身手
    instruction: 3.小試身手：
    answer_carrier: 紅色 ☑、紅色手寫字與紅框圈標點（皆為圖形），文字流無此資訊
    items:
    - type: sub_block
      label: (1) 讀書四件事
      quote: (1)「我們讀書的時候，應該注意四件事：眼到、口到、手到、心到。」
      items:
      - type: free_text
        prompt: →確認冒號前面提及的主要概念：【　】時要注意的【　】件事
        blanks:
        - answer: 讀書
        - answer: '4'
      - type: guide
        text: →確認冒號後面說明、細節或例子：眼到、口到、手到、心到。
      - type: free_text
        prompt: →統整：【　】要注意【　】到、口到、手到、【　】到。
        blanks:
        - answer: 讀書
        - answer: 眼
        - answer: 心
    - type: sub_block
      label: (2) 成功的企業家
      quote: (2)「一位成功的企業家，必定具備了許多過人之處：堅毅奮發的精神、周密詳備的思慮、超人一等的企業眼光等。」
      items:
      - type: free_text
        prompt: →確認冒號前面提及的主要概念：成功企業家的【　】
        blanks:
        - answer: 過人之處
      - type: free_text
        prompt: →確認冒號後面說明、細節或例子：文句提到有【　】個過人之處。
        blanks:
        - answer: 三
      - type: single
        prompt: ❹順文意：哪一句最完整地統整冒號前後的內容？
        options:
          1: 成功企業家通常具備許多過人之處。
          2: 成功企業家的過人之處包括精神、思慮和眼光。
          3: 成功企業家的過人之處主要是堅毅奮發的精神。
        answer: 2
    - type: guide
      text: →你發現了嗎？看到冒號時，先找出冒號前的主要概念，再讀冒號後的具體說明，連結前後，就能掌握完整文意。
  - type: sub_block
    label: 冒號．挑戰題
    instruction: 4.挑戰題：用策略試試會考題--長篇文章中，遇到冒號時，可以特別留意。
    answer_carrier: 紅色手寫字與紅框圈標點（圖形），文字流無此資訊
    items:
    - type: sub_block
      label: (1) 111年會考「美秀美術館」
      quote: (1)「日本 美秀美術館（Miho Museum）的白色電動車象徵著對於美學近乎潔癖的要求，電動車安靜地運作，不會干擾到青山綠水間的蟲鳴鳥叫，使得這座烏托邦式的美術館區，永遠呈現出一種寧靜的氛圍。……不過我們不得不佩服美秀美術館的周到服務：雨天下電動車時，館方提供踏腳墊，以及擦去雨滴的白抹布。即便是貴婦人，仍然可以輕鬆地在美術館中喝下午茶。然後乾乾淨淨，一塵不染地離去。」
      source_label: （引自111年會考國文科）
      stem: 依據本文，下列何者為美術館周到服務的具體事蹟？
      options:
        A: 近乎潔癖的要求，讓訪客能安心地喝下午茶
        B: 美術館致力打造烏托邦式的寧靜無比的氣氛
        C: 下雨天時即使是貴婦也可以輕鬆地保持乾淨
        D: 蟲鳴鳥叫十分活躍，讓整座美術館充滿生機
      answer: C
      items:
      - type: free_text
        prompt: →確認冒號前面提及的主要概念：美秀美術館的 【　】
        blanks:
        - answer: 周到服務
      - type: guide
        text: →確認冒號後面說明、細節或例子：雨天下電動車時，館方提供踏腳墊，以及擦去雨滴的白抹布。
      - type: guide
        text: ❹順文意：美術館服務周到，讓貴婦人即使在雨天也能一塵不染地離去。
      - type: guide
        text: →根據上述的整理和理解，此題答案選：【  C  】
    - type: sub_block
      label: (2) 104年會考「泰國稻米」
      instruction: (2) 這一題換你試試看：從冒號前後找出重點
      quote: 「當部分亞洲國家為了生產足夠的稻米而焦頭爛額之際，泰國稻米的產量卻多到一年出口九百萬噸，是全世界最大稻米輸出國。泰國成為世界米倉的原因是：民營企業非常有效率，擁有大量平坦肥沃的三角洲和充沛的水源，再加上政府機關支持民間銀行貸款給小農購買種子、肥料。以上種種，使泰國在米糧危機中占盡利益。」
      stem: 這段文字的主旨為下列何者？
      source_label: （104會考第3題）
      options:
        A: 泰國米質提升的技術
        B: 泰國稻米盛產的原因
        C: 泰國稻米行銷的方式
        D: 泰國復興米業的計畫
      answer: B
      answer_line: →此題答案選：【  B  】。
      teacher_note: '→先圈出冒號。

        →冒號前面的主要概念是：泰國成為【世界米倉的原因】。

        →冒號後面列出三項原因：民營企業有效率、自然環境適合，以及政府支持農業貸款。

        →統整：本文主要說明泰國稻米產量豐富的多項原因。

        →因此答案選【B】。'
  - type: guide
    text: 三、特殊標點──破折號
  - type: table
    label: 破折號．標點介紹
    instruction: 1.標點介紹：
    columns:
    - 名稱
    - 符號
    - 出現時機
    - 閱讀時怎麼做
    rows:
    - - 破折號
      - ──
      - '1.補充說明：後面補充或解釋前面提到的內容。

        2.語意轉折：後面的內容和原先的想法、預期或發展不同。'
      - '1.補充說明：找出前面提到什麼，再看後面補充什麼。

        2.語意轉折：比較前後內容，找出後面和原先不同的地方，再留意作者想凸顯的訊息。'
    example: '例子（補充）：她最喜歡的水果──芒果，酸甜多汁又可口。

      例子（轉折）：他今天生日──但沒有任何同學記得。'
    footnote: ※破折號另外的常見用法是表示「聲音延續」，如鐘聲「噹──」，在此不討論
  - type: concept_box
    label: 破折號．策略說明
    text: '2.策略說明：

      ❶圈標點：圈出破折號。

      ❷判斷作用：讀一讀前後內容，判斷破折號是補充說明，還是語意轉折

      1.補充說明：破折號後面的內容會進一步解釋、補充或指出前面提到的人、事、物。

      2.語意轉折：破折號前後會有轉折，後面的內容與前面的預期、判斷或發展不同，作者通常要凸顯轉折後的訊息。

      ❸找重點：

      1.補充說明：前面提到什麼？後面補充什麼？

      2.語意轉折：找出前後有什麼不同，留意轉折後作者想凸顯的訊息

      ❹順文意：把前後內容連起來，統整完整文意。'
  - type: sub_block
    label: 破折號．小試身手
    instruction: 3.小試身手：
    answer_carrier: 紅色 ☑ 與紅框圈標點（圖形），文字流無此資訊
    items:
    - type: sub_block
      label: ⑴ 樂府
      quote: ⑴「漢武帝時，掌管音樂的單位──樂府，負責搜集民間歌謠來配樂唱歌。」
      items:
      - type: single
        prompt: ❷判斷作用：讀前後內容，判斷破折號的作用：
        options:
          1: 補充說明
          2: 語意轉折
        answer: 1
      - type: single
        prompt: ❸找重點：破折號後面的「樂府」，是在補充說明前面的哪一項內容？
        options:
          1: 漢武帝時
          2: 掌管音樂的單位
          3: 搜集民間歌謠
        answer: 2
      - type: single
        prompt: ❹順文意：哪一句最完整地說出破折號前後的意思？
        options:
          1: 樂府負責搜集民間歌謠
          2: 樂府是漢武帝時掌管音樂的單位
          3: 漢武帝時的民間歌謠都由樂府創作
        answer: 2
    - type: sub_block
      label: (2) 這份報告
      quote: (2)「這份報告裡面似乎還有一個小問題──算了，反正凡事很難十全十美。」
      items:
      - type: single
        prompt: ❷判斷作用：讀前後內容，判斷破折號的作用：
        options:
          1: 補充說明
          2: 語意轉折
        answer: 2
      - type: single
        prompt: ❸找重點：比較破折號前後內容，下列何者為本句重點？
        options:
          1: 這份報告裡面有一個小問題
          2: 算了，反正凡事很難十全十美
        answer: 2
      - type: single
        prompt: ❹順文意：哪一句最完整地說出破折號前後的意思？
        options:
          1: 作者決定繼續處理報告的問題
          2: 作者沒有發現報告有問題
          3: 作者決定暫時不處理問題
        answer: 3
  - type: sub_block
    label: 破折號．挑戰題
    instruction: 4.挑戰題：用策略試試會考題
    answer_carrier: 紅色 ☑、紅色手寫字與紅框圈標點（皆為圖形），文字流無此資訊
    items:
    - type: sub_block
      label: (1) 104年會考「權力」
      quote: (1)「細究之下，每一種權力都很可怕，它可以興邦，可以覆邦，影響這一代人的此刻，下一代人的未來。掌權的人對自己手中所握有的權力──權力的性質、權力的界限、權力的責任，是否深思過呢？」
      source_label: （引自104年會考國文科）
      stem: 依據本文，下列何者最能概括本文主旨？
      options:
        A: 權力能使國家興盛或衰敗，掌權者應努力擴大權力範圍
        B: 權力影響重大，掌權者應深思權力的性質、界限與責任
        C: 權力會影響現在與未來，掌權者應優先考慮後代的需要
        D: 權力本身具有危險性，社會應限制所有重要決策的推行
      answer: B
      items:
