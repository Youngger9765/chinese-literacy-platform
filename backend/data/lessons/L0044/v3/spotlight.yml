  - type: passage
    label: 106年會考國文科第35~36題
    source_label: ※106年會考國文科第35~36題
    paragraphs:
    - 有些科學家提出「獵人與農夫」的理論，認為ADHD者(注意力缺失的過動兒)其實沒有毛病，只是生錯了時空。現在所謂注意力缺失者的特徵――容易分心、衝動、冒險性強，其實是遠古打獵採集時生存必要的特徵。當人類進化到農業社會以後，這些特徵才變得格格不入。也就是說，他們是「獵人」，但是要在「農夫」的社會裡討生活，往往會被視為異類。
    - 這個理論認為，一萬二千年前，人類走向農業生活開始定居下來後，環境的改變使得過去的長處變成現在的短處。在遠古時代，如果不眼觀四面，耳聽八方，早就被其他動物吃掉了，不可能成為我們的祖先；如果事情發生不馬上採取行動，而是三思而後行的話，也只能變成別人的晚餐，活不到成為我們的祖先。
    - 而現在學者又把ADHD者叫做有愛迪生基因者，他們的特徵是：思想跳躍、容易分心、精力旺盛、沒有條理、不耐煩、易衝動、很外向、敢冒險、會發明、有創造力，而且通常還有領袖魅力。
    - 他們注意力很短暫，但對感興趣的事物可以專注很久，這不是和獵人要一直不停搜索四周，一旦發現獵物就馬上集中注意力然後追蹤下去相同嗎？他們組織力不強，沒有條理，很衝動，想到什麼做什麼──獵人不就是看到獵物得馬上拔腿就追嗎？他們沒有時間觀念，不知道做一件事需要花多少時間――這其實是表示有彈性，一個人的心意如果隨時可變，那就不需要知道時間。他們容易不耐煩，不能聽從老師的指示──這其實是獵人獨立行事的特性。
    - 上述的理論與觀點尚待可靠證據支持，但如果我們願意換一個角度來看ADHD者，他們可能並沒有毛病，只是現在教育制度的限制，未必符合他們的天性罷了。
    attribution: ――改寫自洪蘭《理應外合•獵人與農夫》
    editor_note: ※本文保留原題用語；ADHD目前較常使用「注意力不足過動症者」
  - type: single
    label: 四之1
    prompt: 1.下列對於ADHD者的敘述，何者最符合作者原意？
    options:
      A: 發明家往往是ADHD者
      B: 不宜以異類眼光看待ADHD者
      C: ADHD者擁有比一般人優秀的基因
      D: 缺乏打獵機會是現代ADHD者的悲哀
    answer: B
    answer_carrier: 紅色手寫字（圖形），文字流已印有答案
    teacher_note: '第1題解析：

      作者先介紹「獵人與農夫」理論，說明ADHD者的某些特徵在不同環境中可能有不同意義；最後提醒讀者，這項理論仍待證據支持，但我們可以換一個角度看待ADHD者。因此，作者主要希望讀者不要只把他們視為有毛病或不合群的異類。

      A將「可能有發明與創造力」擴大為「發明家往往是ADHD者」；

      C把部分特徵誇大成基因優於一般人；

      D則不是全文主要觀點。'
  - type: single
    label: 四之2
    prompt: ２.下列敘述，何者與本文內涵最不相關？
    options:
      A: 強調現代人應培養多元能力，以順應社會趨勢
      B: 推測ADHD者的特徵可上溯自遠古人類的行為
      C: 引述學者意見，說明注意力缺失者的行為特徵
      D: 呼籲教育者應以寬廣的視角引領孩子適性發展
    answer: A
    answer_carrier: 紅色手寫字（圖形），文字流已印有答案
    teacher_note: '第2題解析：

      本文主要介紹一種對ADHD特徵的解釋，推測這些特徵可能與遠古獵人的生存方式有關，並呼籲人們用較寬廣的角度理解ADHD者。B、C、D都與本文內容相關；A談的是一般現代人如何培養多元能力，並不是本文討論的重點，因此最不相關。'
