strategy_explained: '這一課我們要練習的是，像偵探一樣，仔細觀察文章裡那些「特別的符號」們，從它們那裡挖出作者藏起來的線索

  為什麼要練這個呢

  因為這篇介紹的文章，就是用很多像冒號、分號、破折號這些「閱讀號誌」，來告訴我們該怎麼閱讀、怎麼去理解作者的意思，就像紅綠燈告訴我們什麼時候該停、什麼時候該走一樣

  讀的時候

  你可以試著停下來，看看這些符號出現在哪裡，它們後面跟著什麼內容，猜猜看它們想讓你知道什麼，這樣就能幫助你更輕鬆地讀懂喔'
