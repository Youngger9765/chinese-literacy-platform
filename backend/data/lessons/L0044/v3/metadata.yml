strategy: 解題策略──看特殊標點找線索
課文學習單: 張筱晴
lesson_no: 5
series: 一般
lesson_seq: 5050
intro: 這篇文章將帶領我們認識文章中的「閱讀號誌」——標點符號。就像過馬路時需要看紅綠燈一樣，閱讀時也需要留意標點符號，它們能幫助我們調整閱讀速度，理解作者想傳達的意思。文章會介紹句號和逗號這兩個熟悉的號誌，以及冒號、分號、破折號這些比較特別的號誌。透過認識它們各自的功能，例如冒號用來引導說明或舉例，分號用來區分並列的內容，破折號用來補充說明或表示語意轉折，我們就能更清楚地掌握文章的重點和作者的思路，讓閱讀更加順暢。
