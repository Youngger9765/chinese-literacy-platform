    prompt: (2)「小澤一直覺得，真正的努力就是把所有時間投入進去。段考前，他每天坐在書桌前四個小時，筆記本也抄寫得密密麻麻。看到同學去運動、聊天，他還有點得意，覺得別人都在浪費時間，自己準備得一定更充分。考卷發下來那天，他期待看到大幅進步的分數──竟然不及格。後來他找老師討論後才發現，只是重複抄寫，卻沒有想清楚題目為什麼會錯，效果不大。原來，努力不只是願意花時間，還需要用對方法。」
