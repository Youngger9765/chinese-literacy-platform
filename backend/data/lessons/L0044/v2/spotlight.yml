      5・說明文Level 5・說明文
  - type: table
    rows:
    - - 第5課  文字路上的閱讀號誌
      - 課文/學習單：張筱晴
    - - ㄧ二三四五六七八九
      - 每天上學或放學走路過馬路時，要看小綠人和小紅人；公車或汽車行經路口時，也得留意紅綠燈。這些沉默的號誌，用明亮的顏色提醒大家：什麼時候可以走，什麼時候要停，什麼時候要慢下來注意。如果過馬路時完全不看號誌，也許只想快速通過，或是眼裡只有在馬路對面等待的朋友，就很容易發生意外。所以，在過馬路時，我們不只要看前方，也要留意路口出現的號誌提醒。而讀文章時，也是一樣的。文章就像一條文字道路，我們的眼睛一路往前走。可是，如果只顧著一直讀、一直讀，卻不注意標點符號，就像在路上不看號誌，很容易錯過作者留下的重要提醒。有些標點符號，是我們很熟悉的閱讀號誌。句號像紅燈，提醒我們：「這句話說完了，可以停一下，整理一下目前讀到的訊息。」逗號像黃燈，提醒我們：「先減速慢一點，這句話還沒結束。」標點符號不只幫助我們調整閱讀的速度，也能提示句子之間的關係，讓意思不會全部擠在一起。不過，有些標點符號的任務比較特別。像是冒號、分號、破折號，它們是文字路上的特殊號誌，除了提醒我們停頓，也提醒我們要留意關鍵訊息。看到冒號，可以先往後看。冒號常常像「接著說明」的號誌，提醒我們：冒號後接著要進一步交代的內容，可能是說明或舉例。例如：「我帶了三樣東西：水壺、外套、鉛筆盒。」冒號後面列出的，就是「三樣東西」的舉例。看到分號，可以先觀察總共分成幾組，再找出各組相同或不同的地方。例如：「熱鬧的下課時間，有人喜歡找同學聊天，有人則安靜的看書；有人跑去福利社，有人則到操場打球。」分號前後分成兩組，前一組說明下課時間學生在教室內的活動，後一組則呈現教室外的活動。分號就像「文字分流」的號誌，提醒我們先把文句分組，再歸納各組的主題或特色。看到破折號，可以先停一下，判斷它是在補充說明，還是讓語意出現轉折。有時候，破折號是在補充說明，例如：「我最擔心的事，真的發生了——我被大家誤會了。」破折號後面說明了「我最擔心的事」是什麼。有時，破折號也會讓意思突然轉向，例如：「我以為他會拒絕我——他竟然答應了。」這時候，破折號後面的內容，讓事情和前面想的不一樣。所以，標點符號不是文章裡可有可無的小記號。它們像文字路上的閱讀號誌，幫我們看清楚作者安排的路線。下次讀文章時，如果遇到冒號、分號、破折號，可以先停一下，想一想：這個號誌正在提醒我什麼？看懂這些小提醒，就比較不會遺漏重點，也能幫助我們找到解題所需的線索。
