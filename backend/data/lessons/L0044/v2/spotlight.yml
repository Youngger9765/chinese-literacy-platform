    paragraphs:
    - 「如果每個人都是特別的，那就沒有一個特別；如果每個人都得到一個獎杯，獎杯就變得毫無意義。生活最甜美的樂趣，在於承認自己並不特別。」 這段文字的涵義，與下列何者最接近？
  - type: guide
    text: （104會考國文科第21題）
  - type: guide
    text: A.不要強調自己與眾不同     B.追逐名利其實毫無意義
  - type: guide
    text: C.認真生活才有甜美的樂趣   D.生活樂在發掘他人的特別
  - type: guide
    text: →此題答案選：【  A  】。
