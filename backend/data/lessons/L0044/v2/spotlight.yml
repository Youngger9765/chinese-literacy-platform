    - →先圈出分號，確認文句分成【2】組。→第一組說明：當每個人特別，「特別」就失去意義。→第二組說明：當每個人都得到獎杯時，「獎杯」也失去意義。→兩組的共同點：某種肯定如果人人都有，就不能再顯示個別差異。→最後一句進一步指出，生活的樂趣在於接受自己並不特別。→因此這段文字提醒我們不必一味強調自己與眾不同，答案選【A】。→先圈出分號，確認文句分成【2】組。→第一組說明：當每個人特別，「特別」就失去意義。→第二組說明：當每個人都得到獎杯時，「獎杯」也失去意義。→兩組的共同點：某種肯定如果人人都有，就不能再顯示個別差異。→最後一句進一步指出，生活的樂趣在於接受自己並不特別。→因此這段文字提醒我們不必一味強調自己與眾不同，答案選【A】。→根據上述的整理和理解，只有【  A  】選項強調事情帶來的不同影響，因此答案選【  A  】。
