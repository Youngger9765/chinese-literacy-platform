spotlight:
  lesson: 文-L11
  strategy_name: 疑問助詞
  strategy_type: unknown
  blocks:
  - type: guide
    text: 古人沒有「問號 (?)」，沒有「嗎、呢」等「句尾」疑問助詞，也沒有「如何、為什麼、哪裡、怎麼」等「非句尾」的疑問詞，但他們會利用特定的字來表達「疑問」。這就像是句子的「標籤」，看到它們，就知道這是在提問哦！
  - type: guide
    text: 一、重點攻略：問句的兩大「標籤」
  - type: guide
    text: 我們把疑問句分成兩種最常見的標籤，只要記住位置就很好認：
  - type: free_text
    prompt: 1. 不是放在句尾的：問題主角
  - type: guide
    text: 這些字通常指著某個「人」或「事情」在提問。
  - type: guide
    text: 誰、孰（ㄕㄨˊ）：問「是哪個人」。
  - type: guide
    text: 何：問「什麼」或「為什麼」。
  - type: guide
    text: 安、焉：問「哪裡」或「怎麼」。
  - type: free_text
    prompt: 2. 放在句子結尾：語氣標籤(疑問助詞)
  - type: guide
    text: 這些字就像我們現在說「嗎」、「呢」，放在句子的最後面。
  - type: guide
    text: 乎：相當於「嗎」。最常出現的疑問詞，可以用於真的提問，也常用於反問。
  - type: guide
    text: 耶 / 邪（ㄧㄝˊ）：相當於「嗎、呢」。它通常帶有說話者主觀的猜測、為難或悲傷情感。
  - type: guide
    text: 與 / 歟（ㄩˊ）：相當於「吧、呢」。說話者心裡大概有答案，但用一種比較委婉、推測的語氣問。
  - type: guide
    text: 你可能注意到了，「問題主角」的概念，其實就是我們在〈江乙媽媽告御狀〉裡學過的「疑問代詞」。接下來的練習，可以幫助你更熟悉文言文的疑問句，請務必練習看看。
  - type: guide
    text: 二、輕練習
  - type: guide
    text: (一)連連看：請將文言文的「標籤字」與它的白話意思連起來。
  - type: guide
    text: 連連看1：
  - type: free_text
    prompt: 1. 孰     ●　　   　　     ● A.嗎
  - type: free_text
    prompt: 2. 何　　 ●　　　          ● B.誰 / 哪一個
  - type: free_text
    prompt: 3. 乎     ●　　        　　● C.什麼 / 為什麼
  - type: guide
    text: 連連看2：
  - type: free_text
    prompt: 1. 與、歟 ●　　        　　● A.哪裡 / 怎麼
  - type: free_text
    prompt: 2. 安     ●　　        　　● B.嗎 / 呢
  - type: free_text
    prompt: 3. 耶、邪 ●　　        　　● C.吧 / 呢
  - type: guide
    text: (二)標籤圈圈看：圈出句子中的「疑問標籤」，並選出正確的白話意思。
  - type: guide
    text: 例題 (  B  ) 解狐非子之仇邪？ 標籤的意思是：A什麼 B嗎
  - type: free_text
    prompt: 1. (  A  ) 不亦樂乎？  A嗎 / B誰
  - type: free_text
    prompt: 2. (  B  ) 人非聖賢，孰能無過？ A什麼 / B誰
  - type: free_text
    prompt: 3. (  A  ) 何不各言爾志？  A為什麼 / B哪裡
  - type: free_text
    prompt: 4. (  B  ) 安能辨我是雄雌？  A嗎 / B怎麼
  - type: free_text
    prompt: 5. (  A  ) 兵法寧可以小試耶?  A嗎 / B怎麼
  - type: guide
    text: (三)讀讀看：閱讀下列句子，再根據提示填入正確的代號：
  - type: guide
    text: 讀讀看1：提示 (A)呢　(B)誰　(C)嗎
  - type: free_text
    prompt: 1.  C  「汝亦知射乎」 — 你也懂射箭（   ）？
  - type: free_text
    prompt: 2.  B  「我與徐公孰美」 — 我跟徐公（   ）美？
  - type: free_text
    prompt: 3.  A  「是何言歟」—這是什麼話(   )？
  - type: guide
    text: 讀讀看2：提示 (A)哪裡、怎麼　(B)吧　(C)嗎  (D)呢
  - type: free_text
    prompt: 1.   D    敗義以求生，豈荀巨伯所行邪——敗壞道義來求生存，哪裡是我荀巨伯會做的事（   ）？
  - type: free_text
    prompt: 2.   A    覆巢之下，安有完卵——傾覆的鳥巢下，（   ）會有完好的鳥蛋？
  - type: free_text
    prompt: 3.   D    一室之不治，何以天下國家邪——一個房間都管理不好，如何(談)治理國家(    )?
  - type: free_text
    prompt: 4.   C    若棄城而走，必不能遠遁，得不為司馬懿所擒乎——如果棄城跑了，必不能跑遠，能不被司馬懿抓住(    )?
  - type: free_text
    prompt: 5.   C    天下事有難易乎——天下的事有困難或容易的區別（   ）?
  - type: free_text
    prompt: 6.   D    何必名山吾廬邪——我家何必一定要在有名的山中（   ）?
  - type: free_text
    prompt: 7.   C    愛國治民，能無知乎——愛國而治理人民，能無知（   ）?
  - type: free_text
    prompt: 8.   D    既已納其自託，寧可以急相棄邪——既然已經接受他的請託，怎麼可以因為事情緊急了就丟棄他(    )?
  - type: free_text
    prompt: 9.   B    孝悌也者，其為仁之本與——孝順父母，友愛兄弟，這就是實踐仁愛的根本（   ）？
  - type: free_text
    prompt: 10.   A    燕雀安知鴻鵠之志——燕子麻雀（  ）知道大鳥的志向?
