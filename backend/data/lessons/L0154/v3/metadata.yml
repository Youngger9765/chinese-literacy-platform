intro: 這篇文章記錄了晉平公向祁黃羊請教，詢問誰適合擔任「南陽令」和「尉」的官職。祁黃羊推薦了兩個人選，但這兩個人選都與祁黃羊有仇或有親屬關係。晉平公對此感到疑惑，但祁黃羊的回答卻讓大家稱讚。孔子聽聞此事後，也讚揚了祁黃羊的見解，認為他能夠不避親仇，公正地舉薦人才，是位真正公正的人。文章透過這個故事，探討了在選拔人才時，應該如何超越個人恩怨與親情，做出最適合的決定。
