section_no: 五
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（字元樣式 aff6，色 E97132），文字流有此資訊
  stray_marks_note: '標題附近有兩個橘色「✓」字元（字元樣式 af），不在任何題號上、也不對應任何一題，

    照原稿記錄，不當成答案。'
  questions:
  - index: 1
    answer: C
    stem: 根據文章，晉平公兩次詢問祁黃羊的目的是什麼？
    options:
      A: 想要測試祁黃羊對國家是否忠誠
      B: 想要化解祁黃羊與解狐之間的恩怨
      C: 尋求合適的人選來填補官職的空缺
      D: 考驗祁黃羊是否會提拔自己的親信
  - index: 2
    answer: B
    stem: 當晉平公問解狐不是他的仇人嗎，祁黃羊的回答展現了什麼樣的態度？
    options:
      A: 放下恩怨，與仇人和解
      B: 對事不對人，只看才幹
      C: 迫於君威，不敢說真話
      D: 展現自己的寬宏大量
  - index: 3
    answer: B
    stem: 孔子對祁黃羊的評價「外舉不避仇，內舉不避子」的核心意義為何？
    options:
      A: 選拔人才應先考慮親近的人，再考慮仇人
      B: 選拔人才應以國家的利益與能力為唯一準則
      C: 選用人才時必須同時包含仇人和親人，才算公正
      D: 為了表現公正，即使是仇人也要故意提拔
  - index: 4
    answer: A
    stem: 有個養猴子的老人，每天餵猴子橡木果實。一天，他跟猴子們說：「朝三而暮四，足乎？」猴子們聽完都「起而怒」。老人又說：「朝四而暮三，足乎？」猴子們聽完都「伏而喜」。請問：老人這兩種分配果實的說法，有什麼共同點？
    options:
      A: 提供的果實總數都一樣
      B: 都成功讓猴子們接受
      C: 都讓猴子們又愛又怒
      D: 讓猴子晚上吃得比較飽
  - index: 5
    answer: B
    stem: 「阮宣子論鬼神有無者，或以人死有鬼，宣子獨以為無，曰：『今見鬼者，云著生時衣服，若人死有鬼，衣服復有鬼邪？』」關於上文的理解，下列何者正確？
    options:
      A: 阮宣子堅信世界上一定有鬼神的存在
      B: 阮宣子用「衣服也有鬼嗎」的疑問，來反駁有鬼的說法
      C: 阮宣子認為鬼喜歡穿著生前最喜歡、最漂亮的衣服出現
      D: 阮宣子和大家一樣，都親眼看過鬼穿著衣服的樣子
    teacher_note: 第5題翻譯：阮宣子和別人討論世上有沒有鬼神，有人以為人死後會變成鬼，唯獨阮宣子認為沒有，他說：「現在那些說自己見過鬼的人，都說見到鬼穿著活著時候的衣服。如果人死後會變成鬼，難道衣服死後也會變成衣服鬼嗎？」
    teacher_note_carrier: 深藍色（C:156082）文字方塊，印在題目右側
