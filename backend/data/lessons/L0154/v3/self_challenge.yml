self_challenge:
  optional_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_banner: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  strategy_banner_note: '四個步驟各裝在一個帶框的字元樣式（afff6）裡，中間的箭號是**字面字元「⭢」（U+2B62）**，

    不是 `→`（U+2192）也不是 `w:sym` —— 依規則字面箭號保留原樣、不斷行。'
  passage: 安邑里巷口有賣餅者，吾每早過戶，未嘗不聞其歌。一日，召之與語，貧窘可憐。因與萬錢，令多其本1，日取餅以償之。欣然持錢而去。後過其戶，則寂然不聞謳歌之聲。及呼乃至，謂曰：「爾何輟2歌之遽3乎？」曰：「本流既大，所謀益增，不暇唱曲矣。」(114會)
  passage_source_text: 安邑里六自我挑戰六自我挑戰巷口有賣餅者，吾每早過戶，未嘗不聞其歌。一日，召之與語，貧窘可憐。因與萬錢，令多其本1，日取餅以償之。欣然持錢而去。後過其戶，則寂然不聞謳歌之聲。及呼乃至，謂曰：「爾何輟2歌之遽3乎？」曰：「本流既大，所謀益增，不暇唱曲矣。」(114會)
  annotations:
  - index: 1
    term: 本
    text: 本錢，做生意的資金。
  - index: 2
    term: 輟
    text: ㄔㄨㄛˋ，停止。
  - index: 3
    term: 遽
    text: ㄐㄩˋ，突然。
  annotations_marker_note: 注釋清單前印一個 `w:sym Wingdings F026` 的書本圖示，不是文字
  translation: 安邑里巷口有一個賣餅的人。我每天早上經過他家，都能聽到他唱歌。有一天，我叫他來說話，發現他的生活很是貧窮可憐。就給他一萬錢，讓他增加本錢做生意，我再每天跟他拿餅，把餅作為抵債品。他很高興地拿錢走了。後來我經過他家，卻一片安靜，聽不到他唱歌的聲音。就喊他，他才出來，我問他：「你為何突然不唱歌了呢?」他說：「因為做生意的資本變大了，要考慮的事情增加了，沒時間唱歌啊。」
  translation_carrier: 深藍色（C:156082）文字方塊，印在文章右側
  part_one:
    label: （一）請依照故事脈絡，回答下列問題。
    answer_carrier: 橘色手寫（字元樣式 af）；第 3、4 題另有橘色字元框線標出被圈選的答案
    items:
    - index: 1
      stem: 斷句後的第一個分句，主語是誰？
      answer: 賣餅者/賣餅的人
    - index: 2
      stem: 承上題，這個主語怎麼樣或做什麼？
      answer: (早上都在)唱歌
    - index: 3
      stem: 「一日，召之與語，貧窘可憐」一句，誰「貧窘可憐」？
      options:
        1: 吾(作者)
        2: 賣餅人
      answer: 2
      instruction: (圈出適當答案)
      answer_carrier: 橘色字元框線（w:bdr E97132）圈住「賣餅人」
    - index: 4
      stem: 「因與萬錢，令多其本，日取餅以償之」，誰「給萬錢」？
      options:
        1: 吾(作者)
        2: 賣餅人
      answer: 1
      instruction: (圈出適當答案)
      answer_carrier: 橘色字元框線（w:bdr E97132）圈住「(作者)」
  part_two:
    label: （二）閱讀理解測驗
    answer_carrier: 橘色手寫代號（字元樣式 aff6）
    items:
    - index: 1
      answer: B
      stem: 關於文中的「吾」與賣餅者，下列敘述何者最恰當?
      options:
        A: 「吾」喜歡吃賣餅者的餅，日日光顧
        B: 賣餅者生意資本擴增後，工作更繁忙
        C: 「吾」喜歡賣餅者的歌聲，勸他以此招攬生意
        D: 賣餅者經濟狀況改善之後，就不想再繼續賣餅
