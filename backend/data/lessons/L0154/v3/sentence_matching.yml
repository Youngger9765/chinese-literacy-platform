    answer: "\U0001F534 **這 12 個代號怎麼定出來的，如實說明**：\n答案本身**在文字層**（12 個浮動文字方塊，各裝一個橘色代號），我抓到的集合是\n{5,9,11,3,4,1,12,7,2,6,10,8}。但它們是 `<wp:anchor>` 浮動物件，\n**document 順序 ≠ 版面順序**（PDF 上散落在課文中間、有幾個疊在字上），\n所以「哪個代號填哪一格」不能照 XML 出現順序讀。\n我用**文意配對**決定對應（每個文言片段只有一個語意相符的白話參考句），\n再用兩個交叉檢查確認：\n  ① 12 個代號恰好是 1~12 的**完整排列**，沒有重複、沒有缺漏\n  ② 逐句核對，每個參考句都恰好被用到一次\n兩項都通過。⚠️ 這是推得的對應、不是從版面座標讀到的，所以標在這裡；\n若日後要更硬的證據，要解 12 個 anchor 的 posOffset 座標再對回段落位置。"
