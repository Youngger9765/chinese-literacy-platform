  instruction: 請❶閱讀原文；❷找出對應的參考句；❸在下方的[  ]寫上參考句代號。
  passage_paragraphs:
  - 晉平公問於祁黃羊曰：「(南陽無令，其誰可而爲之？)」祁黃羊對曰：「解狐可。」平公曰：「(解狐非子之仇邪)？」對曰：「(君問可，非問臣之仇也)。」)(平公曰：「善。」遂用之)。(國人稱善焉。)
  - (居有間，平公又問祁黃羊曰)：「(國無尉，其誰可而爲之)？」對曰：「午可。」平公曰：「(午非子之子邪)？」對曰：「(君問可，非問臣之子也。)」(平公曰：「善。」又遂用之)。國人稱善焉。
  - 孔子聞之曰：「(善哉，祁黃羊之論也)！(外舉不避仇，內舉不避子)。祁黃羊可謂公矣。」
  reference_label: 參考句：
