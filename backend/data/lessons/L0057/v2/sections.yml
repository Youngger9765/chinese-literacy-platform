    answer: D
    stem: 根據課文，有關睡眠的敘述，何者不正確？
    options:
      A: 大腦在睡眠時會修復疲勞的肌肉
      C: 睡眠時可重組記憶，有助於學習
      D: 不論老小，每個人每天都需要睡滿八小時
    rationale: 生長各階段會有不同的睡眠長度。
  - index: 3
    answer: A
    stem: 根據課文，為什麼睡前喝酒不能幫助入眠？
    options:
