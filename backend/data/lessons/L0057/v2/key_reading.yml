passage: 好好睡一覺，好處多多。當你以為身體在休息時，睡眠其實正幫助身體默默進行修復與調整：修復勞累一天的肌肉、調整各部分的運作，並清除代謝產生的廢物。如果老是睡不夠，身體恢復與修復的時間就會減少。長期下來，可能增加肥胖、糖尿病、心血管疾病及憂鬱等健康風險。
