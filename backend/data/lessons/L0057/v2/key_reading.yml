passage: '睡眠還能讓你學得更好。研究顯示，大腦在睡眠過程中會整理記憶，把白天接收的訊息去蕪存菁，保留重要部分，進一步形成長期記憶。睡眠不足時，大腦會較難吸收新知、回想細節，反應也會變慢，出錯率提高。古人有「懸梁刺股」的故事，其中「懸梁」是讀書時把頭髮用絲線綁在橫樑上，一打瞌睡，頭皮就會被拉扯而痛醒。你覺得這樣會有好的學習效果嗎？

  雖然睡眠的重要性已廣為人知，仍有一些似是而非的觀念讓人混淆。有人說：「平日熬夜沒關係，假日再補眠就好。」但是，假日補眠不能代替平日充足、規律的睡眠；睡覺時間忽早忽晚、睡眠時數忽長忽短，也會打亂生理時鐘。想像身體裡有一個看不見的時鐘，它會調節我們何時想睡、何時醒來，以及何時感到飢餓、分泌荷爾蒙。如果經常打亂生理時鐘，就會影響睡眠品質。也有人認為：「睡前喝酒能幫助入眠。」喝酒後雖然可能較快入睡，卻容易在夜裡醒來，整體睡眠品質反而下降，第二天更加疲倦。因此，酒精不是睡眠的好朋友；睡前小酌，反而可能讓人睡得更不安穩。'
