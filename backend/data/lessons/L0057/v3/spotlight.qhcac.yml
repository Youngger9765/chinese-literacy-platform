lesson_uid: L0057
version_id: v3
section_no: 六
spotlight:
  strategy_name: 摘要策略─從主題句找小主題
  strategy_type: summarize
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  blocks:
  - type: concept_box
    text: '本文是一篇說明文，介紹和睡眠有關的知識。文章在「睡眠」的大主題下，分成幾個小主題，每個小主題下，再用重要的細節說明。

      上一課，我們利用段落前的小標題，快速找到小主題。這一課沒有段落小標題，要從段落內容找出小主題。

      有些段落會用一句話，先說出或最後總結整段的主要內容。這一句叫作主題句。其他句子通常會解釋、舉例或補充主題句。我們可以用三個步驟找出小主題：

      (一)讀整段→(二)找主題句→(三)確認小主題'
  - type: guide
    text: 一、找小主題：第五段
  - type: passage
    paragraphs:
    - ❶睡眠還能讓你學得更好。❷研究顯示，大腦在睡眠過程中會整理記憶，把白天接收的訊息去蕪存菁，保留重要部分，進一步形成長期記憶。❸睡眠不足時，大腦會較難吸收新知、回想細節，反應也會變慢，出錯率提高。❹古人有「懸梁刺股」的故事，其中「懸梁」是讀書時把頭髮用絲線綁在橫樑上，一打瞌睡，頭皮就會被拉扯而痛醒。❺你覺得這樣會有好的學習效果嗎？
  - type: guide
    text: （一）讀整段
  - type: single
    prompt: '想一想：這一段主要在談什麼？

      「整理記憶、吸收新知、回想細節、學習效果」都和什麼有關？'
    options:
      1: 身體健康
      2: 學習
    answer: 2
  - type: guide
    text: →所以，這一段大概是在說明睡眠和學習的關係。
  - type: guide
    text: （二）找主題句
  - type: single
    prompt: 有沒有哪一句能說出整段的主要內容？(單選)
    options:
      1: 句❶
      2: 句❷
      3: 句❸
      4: 句❹
      5: 句❺
    answer: 1
  - type: guide
    text: （三）確認小主題
  - type: single
    prompt: 1.用其他句子檢查句❷到句❺是不是都在說明、舉例或補充句❶？
    options:
      1: 是
      2: 不是
    answer: 1
  - type: guide
    text: '句❷說明睡眠如何幫助學習。 句❸說明睡不夠對學習的影響。句❹、句❺用故事和

      問題補充說明。→因此，句❶是本段的主題句，最能說出整段的主要內容。'
  - type: free_text
    prompt: '2.把主題句改成簡短的小主題：

      主題句：睡眠還能讓你學得更好。

      本段小主題是：【　】（答案合理即可）'
    blanks:
    - answer: 睡眠對學習的影響
  - type: guide
    text: 二、找小主題：第六段
  - type: passage
    paragraphs:
    - ❶雖然睡眠的重要性已廣為人知，仍有一些似是而非的觀念讓人混淆。❷有人說：「平日熬夜沒關係，假日再補眠就好。」❸但是，假日補眠不能代替平日充足、規律的睡眠；睡覺時間忽早忽晚，也會打亂生理時鐘。❹也有人認為：「睡前喝酒能幫助入眠。」❺喝酒後雖然可能較快入睡，卻容易在夜裡醒來，整體睡眠品質反而下降。❻因此，酒精不是睡眠的好朋友；睡前小酌，反而可能讓人睡得更不安穩。
    paragraphs_note: 這是課文第 6 段的**節錄改寫版**（原段有「睡眠時數忽長忽短」「想像身體裡有一個看不見的時鐘…」「第二天更加疲倦」等句，此處刪去），原稿如此，非抽漏。
  - type: guide
    text: （一）讀整段
  - type: multi
    prompt: 想一想：這一段提到哪兩種睡眠觀念？
    options:
      1: 假日補眠
      2: 睡前喝酒
      3: 早睡早起
    answers:
    - 1
    - 2
  - type: guide
    text: →所以，這一段大概是在說明和睡眠有關的觀念。
  - type: guide
    text: （二）找主題句
  - type: single
    prompt: 哪一句能說出整段的主要內容？
    options:
      1: 句❶
      2: 句❷
      3: 句❸
      4: 句❹
      5: 句❺
      6: 句❻
    answer: 1
  - type: guide
    text: →因此，句❶是本段的主題句。
  - type: guide
    text: （三）確認小主題
  - type: single
    prompt: 句❷到句❻主要在做什麼？
    options:
      1: 舉出兩種睡眠迷思，並說明它們為什麼不正確。
      2: 提出兩種幫助睡眠的方法
    answer: 1
  - type: free_text
    prompt: →因此，本段小主題是：【　】（答案合理即可）
    blanks:
    - answer: 常見的睡眠迷思
  - type: guide
    text: 三、找小主題，換你自己寫：第四段
  - type: passage
    paragraphs:
    - 好好睡一覺，好處多多。當你以為身體在休息時，睡眠其實正幫助身體默默進行修復與調整：修復勞累一天的肌肉、調整各部分的運作，並清除代謝產生的廢物。如果老是睡不夠，身體恢復與修復的時間就會減少。長期下來，可能增加肥胖、糖尿病、心血管疾病及憂鬱等健康風險。
    paragraphs_note: 本段沒有 ❶❷❸ 句號標記（前兩段有），原稿如此
  - type: free_text
    prompt: '請運用前面學到的方法，寫出本段簡短的小主題。

      本段小主題是：【　】（答案合理即可）'
    blanks:
    - answer: 睡眠對身體健康的影響
  - type: guide
    text: 四、找小主題：第三段
  - type: passage
    paragraphs:
    - ❶事實上，睡眠和健康關係密切，對成長中的國中生尤其重要。❷美國疾病管制與預防中心建議，青少年每天應睡8到10小時。❸換句話說，如果你預計早上6點半起床，想睡足8小時，最晚晚上10點半前就要準備入睡啦！
  - type: guide
    text: （一）讀整段，找共同內容
  - type: single
    prompt: 想一想：這一段主要在說明什麼？
    options:
      1: 青少年每天需要睡多久
      2: 睡眠和健康的各種關係
    answer: 1
  - type: guide
    text: （二）找主題句
  - type: single
    prompt: 有沒有哪一句能說出整段的主要內容？
    options:
      1: 句❶
      2: 句❷
      3: 句❸
    answer: 2
  - type: guide
    text: （三）看句子關係
  - type: single
    prompt: 句❸用「早上6點半起床」的情況，主要是要做什麼？
    options:
      1: 舉例補充說明句❷的睡眠時間。
      2: 提出另一個睡眠主題
    answer: 1
  - type: guide
    text: （四）確認小主題：把主題句改成簡短的小主題
  - type: free_text
    prompt: 本段小主題是：【　】（答案合理即可）
    blanks:
    - answer: 青少年需要的睡眠時間
  - type: guide
    text: '→你發現了嗎？

      主題句常在段落開頭或結尾，也可能在中間。找主題句時，要看：

      哪一句最能說出整段重點？其他句子是不是都在說明、舉例或補充它？'
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能判斷哪一句是主題句。
    - 2.我能把主題句改成簡短的小主題。
