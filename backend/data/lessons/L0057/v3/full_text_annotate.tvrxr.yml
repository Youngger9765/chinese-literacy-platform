  lesson_heading: 第17課  祝你好眠
  paragraph_count: 9
  paragraphs:
  - idx: 1
    text: 鬧鐘響了，阿勝心不甘情不願的起床，睡眼惺忪，哈欠連連，一整天都覺得沒精神。小琪最近上課頻頻打瞌睡，為了抵抗瞌睡蟲，小琪狂喝含有咖啡因的茶飲，結果晚上睡不著、白天又起不來……
  - idx: 2
    text: 阿勝和小琪都遇到睡眠不足的問題，你也有類似狀況嗎？回想過去一週，你自認睡眠充足嗎？
  - idx: 3
    text: 事實上，睡眠和健康關係密切，對成長中的國中生尤其重要。美國疾病管制與預防中心建議，青少年每天應睡8到10小時。換句話說，如果你預計早上6點半起床，想睡足8小時，最晚晚上10點半前就要準備入睡啦！
  - idx: 4
    text: 好好睡一覺，好處多多。當你以為身體在休息時，睡眠其實正幫助身體默默進行修復與調整：修復勞累一天的肌肉、調整各部分的運作，並清除代謝產生的廢物。如果老是睡不夠，身體恢復與修復的時間就會減少。長期下來，可能增加肥胖、糖尿病、心血管疾病及憂鬱等健康風險。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 5
    text: 睡眠還能讓你學得更好。研究顯示，大腦在睡眠過程中會整理記憶，把白天接收的訊息去蕪存菁，保留重要部分，進一步形成長期記憶。睡眠不足時，大腦會較難吸收新知、回想細節，反應也會變慢，出錯率提高。古人有「懸梁刺股」的故事，其中「懸梁」是讀書時把頭髮用絲線綁在橫樑上，一打瞌睡，頭皮就會被拉扯而痛醒。你覺得這樣會有好的學習效果嗎？
  - idx: 6
    text: 雖然睡眠的重要性已廣為人知，仍有一些似是而非的觀念讓人混淆。有人說：「平日熬夜沒關係，假日再補眠就好。」但是，假日補眠不能代替平日充足、規律的睡眠；睡覺時間忽早忽晚、睡眠時數忽長忽短，也會打亂生理時鐘。想像身體裡有一個看不見的時鐘，它會調節我們何時想睡、何時醒來，以及何時感到飢餓、分泌荷爾蒙。如果經常打亂生理時鐘，就會影響睡眠品質。也有人認為：「睡前喝酒能幫助入眠。」喝酒後雖然可能較快入睡，卻容易在夜裡醒來，整體睡眠品質反而下降，第二天更加疲倦。因此，酒精不是睡眠的好朋友；睡前小酌，反而可能讓人睡得更不安穩。
  - idx: 7
    text: 睡眠不足是現代人常見的問題，原因很多，其中睡前長時間使用3C產品，是常見原因之一。有些人明明可以準時睡覺，卻在臉書、IG、抖音等社群媒體流連忘返，捨不得睡，這就是所謂的「睡前拖延」。現代人白天工作或課業壓力大，夜裡上網或許能暫時放鬆；但若因此越睡越晚，白天更加疲倦，晚上又繼續滑手機，就會形成惡性循環，反而得不償失。
  - idx: 8
    text: 聰明的你，現在應該知道怎麼「睡」對自己最有利了。今晚，睡前請放下手中的3C產品，讓煩擾的思緒慢慢安靜，對自己說一聲「晚安」。明天，當鬧鐘再次響起，你將以更飽滿的精神迎接新的一天。
  - idx: 9
    text: 祝你好眠，每一個夜晚。
