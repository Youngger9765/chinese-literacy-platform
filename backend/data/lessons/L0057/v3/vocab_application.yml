section_no: 四
vocab_application:
  instruction: 在空格填入正確的語詞代號
  option_bank:
    A: 睡眼惺忪
    B: 小酌
    C: 新陳代謝
    D: 得不償失
    E: 惡性循環
    F: 去蕪存菁
    G: 流連忘返
    H: 懸梁刺股
  items:
  - index: 1
    stem: 良好的睡眠有助於身體正常（　），維持健康。
    answer: C
  - index: 2
    stem: 聚餐時，叔叔只（　）一杯，沒有再多喝。
    answer: B
  - index: 3
    stem: 為了準備會考，他每天刻苦讀書，展現出（　）的精神。
    answer: H
  - index: 4
    stem: 為了省一點時間而闖紅燈，不僅危險，還可能受罰，真是（　）。
    answer: D
  - index: 5
    stem: 他熬夜精神不好，上課聽不懂，回家又得熬夜補功課，形成（　）。
    answer: E
  - index: 6
    stem: 他每天熬夜打電動，白天上學時都（　），一直打瞌睡。
    answer: A
  - index: 7
    stem: 這篇文章（　）之後，內容顯得簡潔有力。
    answer: F
  - index: 8
    stem: 日月潭風光秀麗，讓無數遊客（　），讚嘆不已。
    answer: G
  notes:
    option_bank: 8 個代號對應 8 道小題，一題一個、全部用到。C 在此寫「新陳代謝」，語詞框與第三大題寫「代謝」（原稿不一致）
    answer_carrier: 橘色手寫代號（PDF p4）；文字層的（　）內已填有同樣的代號
