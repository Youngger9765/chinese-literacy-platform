strategy_explained: '這一課我們要練習「抓出重點」的功夫，也就是把文章裡藏著的小主題找出來

  這篇說睡眠有多重要，從有經驗的故事講到為什麼要睡飽，還有不能做什麼，這些點都很清楚

  所以讀的時候，你可以試著找找看，哪些句子最重要，可以幫你記住這篇在講什麼的重點喔'
