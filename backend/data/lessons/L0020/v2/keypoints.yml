  rows:
  - label: 連結經驗(段1～3)
    value: '1.聽別人說話時覺得自己有__，可以猜到下一句。

      2.「但是」之後（□一定　不一定）都接壞消息。'
    blanks:
    - answer: 讀心術
      hint: ''
  - label: 提出想法（段4）
    value: 「但是」像是__，提醒我們要特別留意「但是」 （□之前 　之後）的訊息。
    blanks:
    - answer: 路標
      hint: ''
  - label: 舉出實例(段5～7)
    value: '1.起因：作者希望能和小恩__。

      2.經過：作者邀請小恩一起去__，小恩先表達了她的__

      3.結果：小恩最後（答應　□婉拒）了作者的邀約。'
    blanks:
    - answer: 變熟
      hint: ''
    - answer: 圖書館
      hint: ''
    - answer: 顧慮
      hint: ''
  - label: 連結閱讀（段8）
    value: 不只說話，__也是一樣，句子的重點常常會出現在轉折詞的（□前面　後面）。要先留意後面的訊息，再配合前後文理解。
    blanks:
    - answer: 閱讀文章
      hint: ''
  - label: 統整結論（段9～10）
    value: '1.轉折詞後面出現的狀況，常常和一般預期的

      （□相同　不同），也是整句話的重點所在。

      2.閱讀的時候要留意__之後的句子。'
    blanks:
    - answer: 轉折詞
      hint: ''
  title: 跟著「但是」轉個彎
