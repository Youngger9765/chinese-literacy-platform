strategy: 解題策略──轉折詞後有重點
課文學習單: 張筱晴
議題: null
lesson_no: 9
series: 一般
lesson_seq: 4090
intro: 這篇文章要帶大家認識一個很特別的詞：「但是」。作者透過生活中的對話和自己的親身經驗，說明了「但是」這個詞在說話和閱讀時扮演的重要角色。當我們聽到「但是」時，它就像一個路標，提醒我們話語或想法即將轉彎，而轉彎之後的內容，往往才是說話者或作者真正想表達的重點。文章也舉例說明，在閱讀時，留意「但是」、「可是」、「不過」、「然而」等轉折詞後面的句子，能幫助我們更快抓住文章的核心訊息。
strategy_explained: '這一課我們要練習的是，聽或看的時候，要特別注意「但是」後面說了什麼，因為那通常是真正重要的想法

  這篇文章裡，作者就用了很多「但是」來告訴我們，它有多厲害，就像一個提醒我們要注意的新路標

  所以讀的時候，記得看到「但是」、「可是」、「不過」這些詞，就要豎起耳朵、睜大眼睛，看看接下來出現了什麼重點喔'
