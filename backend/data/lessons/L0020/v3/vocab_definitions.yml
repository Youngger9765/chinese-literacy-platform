lesson_uid: L0020
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank:
  - 讀心術
  - 工整
  - 路標
  - 婉拒
  - 吶喊
  - 顧慮
  - 截然不同
  - 常理
  - 預期
  - 出乎意料
  items:
  - index: 1
    word: 婉拒
    definition: 用有禮貌的方式拒絕別人。
  - index: 2
    word: 常理
    definition: 一般人都知道、都認同的道理。
  - index: 3
    word: 吶喊
    definition: 大聲喊叫。
  - index: 4
    word: 預期
    definition: 在事情發生前，先想到或猜測可能的情況。
  - index: 5
    word: 顧慮
    definition: 對某件事情感到擔心。
  - index: 6
    word: 工整
    definition: 整齊、端正。
  - index: 7
    word: 讀心術
    definition: 知道別人在想什麼的能力，也用來形容很了解別人的想法。
  - index: 8
    word: 路標
    definition: 用來告訴大家方向或地點的標誌。
  - index: 9
    word: 出乎意料
    definition: 事情的結果和原本想的不一樣。
  - index: 10
    word: 截然不同
    definition: 完全不一樣，差別很大。
  notes:
    answer_carrier: 橘色手寫字（圖形層），文字流有字但無顏色資訊
