  passage: 後來我發現，讀文章也是一樣。作者常常把重要的話放在「可是、但是、不過、然而」這些「轉折詞」後面。例如：失敗雖然很丟臉，可是失敗也能提醒我們，下次怎麼改進。燕麥奶拿鐵有點貴，一杯75元，但是實在超好喝的。我原本想去打籃球，不過突然下起大雨，只好留在家裡。他每天都很認真複習，然而這次考試還是考砸了。發現了嗎？轉折詞前面的句子，會讓人心裡自然產生一個「照常理，接下來應該……」的預期或猜測，但轉折詞一出現，就像一個急轉彎，讓人有「咦，怎麼跟想的不一樣」的感覺，出現「出乎意料」的結果。而整個句子中，作者特別想說的話，常常會出現在轉折詞之後。所以，不論是聽人說話，還是讀一篇文章，只要出現「可是、但是、不過、然而」這樣的轉折詞，你就知道，轉彎路標來了。跟著這些小路標看下去，先留意後面的話，再配合前後文，常常就能更快掌握重要訊息。
