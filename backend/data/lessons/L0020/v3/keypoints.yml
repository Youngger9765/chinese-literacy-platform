lesson_uid: L0020
version_id: v3
section_no: 五
keypoints:
  title: 跟著「但是」轉個彎
  layout: list
  instruction: 這篇文章運用不同的經驗來說明「轉折詞後有重點」的概念，請透過表格整理文章內容。
  rows:
  - label: 連結經驗
    paragraph_range: （段1～3）
    items:
    - label: '1'
      value: 聽別人說話時覺得自己有【　】，可以猜到下一句。
      blanks:
      - answer: 讀心術
    - label: '2'
      value: 「但是」之後（　）都接壞消息。
      options:
        1: 一定
        2: 不一定
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 提出想法
    paragraph_range: （段4）
    value: 「但是」像是【　】，提醒我們要特別留意「但是」（　）的訊息。
    blanks:
    - answer: 路標
    options:
      1: 之前
      2: 之後
    answer: 2
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 舉出實例
    paragraph_range: （段5～7）
    items:
    - label: '1'
      value: 起因：作者希望能和小恩【　】。
      blanks:
      - answer: 變熟
    - label: '2'
      value: 經過：作者邀請小恩一起去【　】，小恩先表達了她的【　】
      blanks:
      - answer: 圖書館
      - answer: 顧慮
    - label: '3'
      value: 結果：小恩最後（　）了作者的邀約。
      options:
        1: 答應
        2: 婉拒
      answer: 1
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 連結閱讀
    paragraph_range: （段8）
    value: 不只說話，【　】也是一樣，句子的重點常常會出現在轉折詞的（　）。要先留意後面的訊息，再配合前後文理解。
    blanks:
    - answer: 閱讀文章
    options:
      1: 前面
      2: 後面
    answer: 2
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 統整結論
    paragraph_range: （段9～10）
    items:
    - label: '1'
      value: 轉折詞後面出現的狀況，常常和一般預期的（　），也是整句話的重點所在。
      options:
        1: 相同
        2: 不同
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - label: '2'
      value: 閱讀的時候要留意【　】之後的句子。
      blanks:
      - answer: 轉折詞
