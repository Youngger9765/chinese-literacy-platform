spotlight:
  lesson: 體-L4
  strategy_name: 品格力-念頭覺察
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 在這篇文章中，讓主角最困擾的不是失誤本身，而是腦中不斷冒出的自我批評：「我很爛」、「都是我害的」、「等一下又要丟臉了」，而最後主角發現，靠著專注在當下（如，做棒式），內心的噪音就會變小聲。回到我們的生活，當腦中出現各種負面念頭時，我們需要先看見它、認識它，而下一課，我們會再一起練習降低內心噪音的方法。
  - type: guide
    text: ◎ 認識負面念頭：青少年常見的負面思考模式有以下三種──
  - type: table
    rows:
    - - ''
      - 思考模式
      - 特徵
      - 舉例
    - - '1'
      - 非黑即白（極端思考）
      - 把事情只分成兩種：不是很好，就是很爛。
      - 只是一次失誤就覺得「我沒救了、我爛透了。」
    - - '2'
      - 腦補推論（過度推斷）
      - 沒有證據，就先幫事情下結論，或預測未來一定很糟。
      - 「他剛看我一眼，一定在笑我。」
    - - '3'
      - 都怪我（個人化歸因）
      - 忽略事情可能有其他原因，只怪罪自己。
      - 「朋友心情不好，就是因為我講錯話。」
  - type: guide
    text: ◎ 小試身手：
  - type: table
    rows:
    - - 事件
      - 念頭
      - 思考類型
    - - 漏接高飛球
      - 「你真是爛透了！」
      - □1非黑即白    □2腦補推論  □3都怪我
    - - 準備上場打擊
      - 「再打不好，大家會恨死我！」
      - □1非黑即白   □2腦補推論    □3都怪我
    - - 輸了比賽
      - 「都是我害的！」
      - □1非黑即白   □2腦補推論□3都怪我
  - type: guide
    text: 練習一：從文章中，主角對事情的反應、內心冒出的念頭，判斷他陷入了哪一個思考模式。
  - type: guide
    text: 練習二：這是一個心理測驗。以下有三個生活中常見的情境。請在每一題中，選出一個「最像你當下會冒出的想法」。沒有對錯，只是看看你在壓力來時，腦袋比較常用哪一種方式說話。
  - type: single
    prompt: 1.你花了很多時間準備，結果成績或表現卻不理想。你腦中出現的話最接近下列哪一句？
    options:
    - （Ａ）「我就是那種怎麼努力都沒有用的人。」
    - （Ｂ）「同學會笑我，老師一定對我很失望。」
    - （Ｃ）「都是我，全班的平均分數就是被我拉低的。」
    answer: （Ａ）「我就是那種怎麼努力都沒有用的人。」
  - type: single
    prompt: 2.你和朋友們聊天時，你說了一句話後，大家瞬間安靜，但沒有人回應你，而是繼續其他話題。你腦中出現的話最接近下列哪一句？
    options:
    - （Ａ）「我好不會說話，我看我還是別跟別人聊天。」
    - （Ｂ）「他們是不是覺得我很奇怪或是不想理我。」
    - （Ｃ）「看吧，只要有我在的地方就會很尷尬。」
    answer: （Ａ）「我好不會說話，我看我還是別跟別人聊天。」
  - type: single
    prompt: 3.你在報告、比賽或重要時刻前很緊張。你腦中出現的話最接近下列哪一句？
    options:
    - （Ａ）「如果我失誤，一切努力就都白費了。」
    - （Ｂ）「如果我沒有表現好，就會失去大家的信任。」
    - （Ｃ）「怎麼辦，我會不會毀了大家的心血。」
    answer: （Ａ）「如果我失誤，一切努力就都白費了。」
  - type: guide
    text: ◎統計看看，在你的答案中Ａ、Ｂ和C選項，哪一個出現最多次呢？
  - type: guide
    text: 說明：看看你的思考傾向
  - type: guide
    text: A 選最多 → 你在壓力時，容易出現
  - type: guide
    text: 👉非黑即白（極端思考）：把表現直接判成好或壞，對自己很快下結論
  - type: guide
    text: B 選最多 → 你在壓力時，容易出現
  - type: guide
    text: 👉腦補推論（過度推斷）：事情還沒發生，腦袋已經先演完最糟劇情
  - type: guide
    text: C 選最多 → 你在壓力時，容易出現
  - type: guide
    text: 👉都怪我（個人化歸因）：很多因素一起發生，但你會先把責任扛起來
  - type: guide
    text: ◎請根據你的觀察完成下面這句話：
  - type: guide
    text: 我發現，當我遇到壓力或挫折，我最常用的是＿＿＿＿＿＿這一型，
  - type: guide
    text: 我很常說：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
  - type: guide
    text: ◎再想一想：
  - type: guide
    text: 這種想法通常出現在＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿的時候。
  - type: guide
    text: 它常常讓我感覺＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。
  - type: guide
    text: 勾選你的狀況（□我一直都知道我常這樣想　□我以前從來沒注意）
  - type: guide
    text: ◎這些思考習慣不會一下子就消失，但也不一定要立刻被「消滅」。就像檸檬水雖然很酸，只要加一點煉乳，味道就會順口許多；當那些刺耳的念頭冒出來，而被我們發現時，我們也能先用幾個小魔法，暫時降低它的威力。現在，就一起來試試看下面的小魔法吧！
  - type: table
    rows:
    - - 魔法句型
      - 概念
      - 句型應用
    - - 我注意到我正在想…
      - 拉開距離，辨認念頭
      - 啊..我注意到我正在想「我真是爛透了」
    - - 但也可能…
      - 加上句子，看見不同的可能
      - 「大家一定很失望，但也可能是我自己多想了」
    - - 先停一下，不急著下結論
      - 擱置想法，不急著做判斷
      - 「都是我害的──先停一下，不急著下結論」
  - type: guide
    text: ※選一個魔法改寫你常說的句子：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
