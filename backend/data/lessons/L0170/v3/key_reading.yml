  char_marks_note: "兩個段界都對得上，起點是第 5 段、一路數到課文結束：\n  段5 → **241**（文字層裸算 246）\n  段6 → 562－241 ＝ **321**（＝ 裸算 321，**完全吻合，一條口徑都不用套**）\n段6 精準吻合、段5 差 5，而且 start_paragraph 是學習單直接印的（指示語印「（五    )」），\n所以起點與範圍都不靠字數推導。\n\U0001F534 **段5 那 5 個字的口徑我沒有定論，如實記錄**：段5 的非中文只有\n破折號「——」2 個 U+2014、刪節號「……」2 個 U+2026、拉丁字「OUT」3 個、半形空格 1 個。\n湊得出 241 的一組是：空格不計(−1) ＋ 破折號算 0(−2) ＋「OUT」整串算 1 字(−2)，刪節號照算 —— 合計 −5。\n⚠️ 但**刪節號在這裡要照算、在 L0123 卻要省**，兩課不一致；SKILL 第 5 條只涵蓋破折號。\n   所以我只記本課的觀測值，不把「拉丁字串算 1 字」或刪節號的行為寫成通則。\n第 2 條（註腳）不必套：footnotes.xml 是空的。"
