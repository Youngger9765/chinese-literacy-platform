  vocabulary_bank_label: 本課語詞
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  items:
  - index: 1
    word: 震耳欲聾
    definition: 巨大的聲響，聲音大到讓耳朵受不了了。
  - index: 2
    word: 吆喝
    definition: 大聲喊叫。多用來吸引生意、帶動氣氛或指揮他人。
  - index: 3
    word: 瀰漫
    definition: 指氣味、情緒或某種氣氛遍布整個空間。
  - index: 4
    word: 排山倒海
    definition: 形容力量巨大，氣勢壯闊，像山海一起壓過來。
  - index: 5
    word: 扳回一城
    definition: 原本落後，後來成功追回局勢或分數。
  - index: 6
    word: 宏亮
    definition: 聲音大且響亮。與「洪亮」同意思。
  - index: 7
    word: 虎視眈眈
    definition: 形容像老虎盯著獵物一樣，帶著強烈企圖注視，隨時準備行動。
  - index: 8
    word: 懊悔
    definition: 後悔、自責。
  - index: 9
    word: 踉蹌
    definition: 形容走路不穩、跌跌撞撞的樣子。
  - index: 10
    word: 蓄勢待發
    definition: 形容做好準備，隨時可以展現身手。
  - index: 11
    word: 作祟
    definition: 像鬼魂或妖魔一樣地搗亂、破壞。
  - index: 12
    word: 打席
    definition: 棒球比賽中，打擊者站上來準備揮棒進攻的回合或位置。
  notes:
    answer_carrier: 橘色手寫（多數走字元樣式 af0，少數走 run 層 w:color，兩種都是 E97132），文字流有此資訊
