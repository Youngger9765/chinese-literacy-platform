lesson_uid: L0170
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（run 層 w:color E97132），文字流有此資訊
  teacher_note_carrier: 深藍色（C:0F4761）文字方塊，印在題目右側
  questions:
  - index: 1
    answer: A
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 升上國三後，龐大的考試壓力「排山倒海」而來
      B: 已經二連霸的隊伍，今年再度「扳回一城」拿下冠軍
      C: 感謝祖靈的「作祟」，讓我們今年穀物豐收，家畜平安
      D: 一聲尖叫「瀰漫」寧靜的夜晚，附近聽到的人都很不安
    teacher_note: '第1題解析：(B)「扳回一城」用於扭轉局勢(C)「作祟」用於帶來災禍

      (D)「瀰漫」用於氣氛，此處宜用「劃破」'
  - index: 2
    answer: C
    stem: 根據第二段「下一秒，腦內的毒舌球評開始廣播：『你真是爛透了！』、『都是你害的！』」這句話主要是想表達什麼？
    options:
      A: 球場上出現的轉播聲音太吵雜
      B: 大腦扭曲了教練和隊友的建議
      C: 主角內心充滿自我批評的聲音
      D: 主角模仿球評播報比賽的語氣
    teacher_note: 第2題解析：從前後文可看出，此處的「毒舌球評」士主角內在的自我批評
    teacher_note_errata_note: '⚠️ 解析裡的「士主角內在」應為「是主角內在」（「士」是「是」的錯字）。

      這是**教師解析**不是課文，且 PDF 上該文字方塊被右邊界裁掉一部分；

      我照文字層原樣抄，未更正（若要列勘誤請人工確認）。'
  - index: 3
    answer: A
    stem: 根據本文，下列敘述何者正確？
    options:
      A: 主角一次次的失誤，使他內心產生巨大自責
      B: 主角認為朋友的關心只是風涼話，沒有幫助
      C: 主角的內在批評都是事實，只是他不敢面對
      D: 主角在隊友的打氣之後隨即振作，全力以赴
    teacher_note: '第3題解析：

      (B)還是有幫助

      (C)不一定是事實

      (D)沒有馬上振作'
  - index: 4
    answer: D
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 挫折來自能力不足，應加強訓練避免失誤
      B: 面對批評時應學會反擊，證明自己的價值
      C: 球員需要壓抑情緒才能在比賽中有好表現
      D: 專注當下的行動，有助於調整情緒與狀態
  - index: 5
    answer: B
    stem: 根據品格聚光燈，下列哪一種想法最能降低內在批評的影響？
    options:
      A: 「我就是爛，做什麼都會失敗」
      B: 「他們是不是不喜歡我？但也可能我誤會了」
      C: 「不管我有沒有努力，結果都沒差」
      D: 「只要有我參與的比賽，就一定會輸」
    teacher_note: 第5題解析：(B)儘管有負面念頭，仍加入了不同可能的思考。
