  layout_note: '原稿是三欄表（主題｜子項｜內容），情境一~三那三列的「事件／念頭／反應」是**獨立儲存格**、

    不是內容的一部分。⛔ 不能用「：」把欄名和內容接成一句（那是我造的字串，原稿沒有），

    所以改用 layout: list，把子項放進 items 的 label。'
  intro: 本篇文章強調關掉內心批評的方法，請根據架構整理文章的重點。
  answer_carrier: 橘色手寫（字元樣式 af0）＋ 紅色 ☑（w:sym Wingdings F0FE，色碼 **EE0000**，4 個在本節）
  rows:
  - label: 主要問題
    value: 只要關鍵時刻或遭遇【　】，腦中就會出現【　】不斷廣播，內心充滿自我批評的聲音。
    blanks:
    - answer: 挫折
    - answer: 毒舌球評
  - label: 情境一
    items:
    - label: 事件
      value: 對手的高飛球，讓對手得分
      options:
        1: 漏接
        2: 接殺
      answer: 1
      note: 原稿印「（☑①漏接  □②接殺）對手的高飛球，讓對手得分」——選項在句首
    - label: 念頭
      value: 「你真是爛透了！」、「都是你害的！」
    - label: 反應
      value: 內心充滿
      options:
        1: 自責
        2: 鬥志
      answer: 1
  - label: 情境二
    items:
    - label: 事件
      value: 輪到自己的【　】，希望能扳回一城
      blanks:
      - answer: 打席
    - label: 念頭
      value: 「我真的打得到嗎？」、「不要又丟人現眼了啊！」
    - label: 反應
      value: 手心全是汗，無法【　】
      blanks:
      - answer: 全神貫注
  - label: 情境三
    items:
    - label: 事件
      value: 站上打擊區，被三球
      options:
        1: 三振
        2: 保送
      answer: 1
    - label: 念頭
      value: 「又來了……」、「真的很討厭現在的自己」
    - label: 反應
      value: 心裡滿是【　】
      blanks:
      - answer: 失落
  - label: 解決方法
    value: '1.收到隊友、朋友的【　】、打氣：「沒事啦，加油！」、「下一場一定更好！」→效果：心裡有點【　】，但還是感到有些【　】

      2.收到教練的提醒：「懊悔不如【　】」，並起身去做棒式訓練→效果：內在批評'
    blanks:
    - answer: 鼓勵
    - answer: 暖
    - answer: 自責
    - answer: 行動
    tail_question:
      stem: 內在批評
      options:
        1: 變小聲
        2: 變大聲
      answer: 1
  - label: 收穫
    value: 只要專注在【　】，把【　】拉回正在做的事上，心裡好像也就沒有那麼糾結了。
    blanks:
    - answer: 當下
    - answer: 注意力
