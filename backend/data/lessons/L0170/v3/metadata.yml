intro: 這篇文章透過一位棒球選手在比賽中遭遇失誤後，內心不斷出現自我批評的聲音，以及隊友和教練的回應，帶領我們探討如何在壓力與挫折中，學習專注於當下。文章描述了主角在關鍵時刻的表現不如預期，內心的負面評價隨之而來，影響了他的情緒與後續的表現。然而，透過教練一句「懊悔不如行動」，主角開始嘗試將注意力從過去的失誤轉移到當下的練習，進而發現專注於正在做的事情，能幫助自己擺脫內心的糾結。
