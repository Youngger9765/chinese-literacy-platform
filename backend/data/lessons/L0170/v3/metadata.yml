intro: 這篇文章透過一位棒球選手在比賽中遭遇失誤後，內心不斷出現自我批評的聲音，以及隊友和教練的回應，帶領我們探討如何在壓力與挫折中，學習專注於當下。文章描述了主角在關鍵時刻的表現不如預期，內心的負面評價隨之而來，影響了他的情緒與後續的表現。然而，透過教練一句「懊悔不如行動」，主角開始嘗試將注意力從過去的失誤轉移到當下的練習，進而發現專注於正在做的事情，能幫助自己擺脫內心的糾結。
notes:
  課型: 體育生品格教育
  目標議題: 品格力──念頭覺察
strategy: 品格力──念頭覺察
strategy_explained: '這一課我們要練習的是，當腦袋裡跑出好多批評自己的聲音時，練習把注意力拉回到現在正在做的事情上

  這篇文章裡，那位棒球選手打不好時，心裡一直罵自己，但教練告訴他「懊悔不如行動」，他才發現專心練習，就不會一直想著壞事了

  所以讀的時候，試著想像一下如果自己是主角，當你心裡出現不好的聲音，能不能就像教練說的，把注意力放在你正在玩的遊戲或正在寫的功課上'
