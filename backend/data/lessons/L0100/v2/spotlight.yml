spotlight:
  lesson: G7-L3
  strategy_name: 推論策略-推論作者觀點和寫作目的
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 閱讀說明文或議論文時，讀出「作者的觀點」和「寫作目的」，才能完全理解文章。我們用底下❶～❹步驟來讀出「作者的觀點」和「寫作目的」。
  - type: guide
    text: ❶確認議題：文章主要在談什麼？
  - type: guide
    text: ❷推論觀點：作者對這個議題提出什麼看法或主張？
  - type: guide
    text: ❸找支持證據：作者用哪些案例、事實、法律或說明支持觀點？
  - type: guide
    text: '❹推論寫作目的：作者想讓讀者知道、相信或採取什麼行動？

      接下來，我們練習用這個閱讀策略，來找出作者的觀點與目的。'
  - type: guide
    text: 一、推論本文作者觀點與目的
  - type: guide
    text: 步驟❶確認焦點
  - type: free_text
    prompt: 1.問自己：這篇文章在談「哪個主題」？
  - type: free_text
    prompt: 2.祕訣：看標題＋開頭兩段，判斷主題關鍵字。
  - type: guide
    text: ◎小試身手：
  - type: single
    prompt: 〈你以為的浪漫，可能是跟騷〉，這篇文章在談哪個主題？
    options:
    - 浪漫的行為
    - 《跟蹤騷擾防治法》
    answer: 浪漫的行為
  - type: guide
    text: 步驟❷推論作者觀點（可和「步驟❸找支持證據」同時進行）
  - type: free_text
    prompt: 1.問自己：作者對文章事件的看法或主張？支持或反對？
  - type: free_text
    prompt: 2.祕訣：(1)找出表達情緒語詞（開心/害怕…）或例子方向（好/壞）。
  - type: free_text
    prompt: (2)勾選觀點。
  - type: guide
    text: ◎小試身手
  - type: multi
    prompt: (1)閱讀課文後，選出表達被跟騷者情緒的語詞（請打勾，複選）
    options:
    - 感到壓力越來越大    ②聽到腳步聲便緊張回頭
    - 夜裡輾轉難眠
    - 收到禮物後感到溫馨自在
    answer:
    - 感到壓力越來越大    ②聽到腳步聲便緊張回頭
    - 夜裡輾轉難眠
    - 收到禮物後感到溫馨自在
  - type: single
    prompt: (2)判斷選出的語詞是正面或負面的  □①正面   ②負面
    options:
    - 正面
    - 負面
    answer: 負面
  - type: single
    prompt: (3)作者對持續違反意願的追求提出什麼看法？
    options:
    - ①只要真心，就是浪漫
    - ②不受歡迎的追求，可能成為跟騷
    answer: ②不受歡迎的追求，可能成為跟騷
  - type: guide
    text: 步驟❸找支持證據
  - type: free_text
    prompt: 1.問自己：作者用什麼證據說服我？
  - type: free_text
    prompt: 2.祕訣：通常作者會用「案例、數據、法律、名言」當支持證據。
  - type: single
    prompt: ◎小試身手：找一找，本文用什麼證據說服讀者？（請打勾，複選）
    options:
    - 名人採訪 　③法律規定
    - 統計數據
    answer: 名人採訪 　③法律規定
  - type: guide
    text: 步驟❹推論寫作目的
  - type: free_text
    prompt: 1.問自己：作者想要讓我知道、相信或採取什麼行動？
  - type: free_text
    prompt: 2.祕訣：呼籲句、結論段重點
  - type: guide
    text: ◎小試身手
  - type: free_text
    prompt: (1)第五段寫道，如果遭遇跟騷，你有權明確表達拒絕，甚至報警。末段呼籲：「如果真心喜歡，就從尊重開始！」
  - type: multi
    prompt: (2)作者想讓我知道：
    options:
    - 喜歡一個人要不顧一切、以浪漫方式追求
    - 追求異性時，要尊重對方的意願，避免觸法
    - 遭遇騷擾時，可以明確拒絕並尋求協助
    answer:
    - 喜歡一個人要不顧一切、以浪漫方式追求
    - 追求異性時，要尊重對方的意願，避免觸法
    - 遭遇騷擾時，可以明確拒絕並尋求協助
  - type: guide
    text: 二、挑戰題：
  - type: guide
    text: 再讀一個短文，看看你是否可以讀出作者的主要觀點和寫作目的。
  - type: passage
    source: unknown
    paragraphs:
    - 別讓紙吸管成為下一個塑膠袋
    - 為響應減塑，許多飲料店改用紙吸管。但不少消費者已養成用完即丟的習慣，因此常一次拿幾支吸管，以備不時之需。環保團體調查發現，一些觀光區紙吸管一週的垃圾量竟高於過去使用塑膠吸管時期。此外，多數紙吸管難以有效回收處理，最終仍將送進焚化爐。減塑真正該做的是「少用一次性吸管」，而非僅將材質從塑膠換成紙。下次點飲料前，先問自己──我真的需要吸管嗎？
  - type: guide
    text: 步驟❶確認焦點
  - type: free_text
    prompt: 1.問自己：這篇在談「哪個主題」？
  - type: free_text
    prompt: 2.這篇文章主要關注哪個主題？（請打勾，單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①塑膠袋污染  ②一次性吸管帶來的環境問題
  - type: guide
    text: 步驟❷推論作者觀點
  - type: free_text
    prompt: 1.問自己：作者對這個主題有什麼看法？支持、反對？
  - type: free_text
    prompt: 2.根據標題與短文內容，作者主要的看法為何？（請打勾，單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①紙吸管能解決塑膠污染問題
  - type: guide
    text: ②應該減少使用一次性吸管，而非僅更換材質
  - type: guide
    text: 步驟❸找支持證據
  - type: free_text
    prompt: 1.問自己：作者用什麼說服我？
  - type: guide
    text: ①調查發現某些景點的紙吸管垃圾量甚至比塑膠吸管更多
  - type: passage
    source: unknown
    paragraphs:
    - ②多數紙吸管仍難以有效回收，只能送入焚化爐
    - □③飲料店為消費者提供紙吸管，增加了消費成本
  - type: guide
    text: 步驟❹推論寫作目的
  - type: free_text
    prompt: 1.問自己：作者想要影響我什麼？
  - type: free_text
    prompt: 2.作者寫這篇短文想讓我知道：
  - type: passage
    source: unknown
    paragraphs:
    - □①提醒讀者減少飲料的購買頻率
    - ②鼓勵讀者盡量不要使用一次性吸管
    - □③鼓勵讀者多使用紙吸管而非塑膠吸管
  - type: guide
    text: ※如果你四項都打勾，恭喜你，表示你已經學會用 4 步驟「推論作者觀點與寫作目的」，你超厲害的！
  - type: guide
    text: 請根據課文內容，整理浪漫與跟騷的判斷方式，以及遇到跟騷時可以採取的行動。
  - type: table
    rows:
    - - 主題
      - 你以為的浪漫可能是跟騷
    - - 情境案例
      - 阿哲反覆追求小芳，小芳【】很大，甚至失眠。
    - - 迷思來源
      - 愛情電影常把糾纏行為美化為浪漫，容易誤導觀眾產生錯誤認識。
    - - 法律標準
      - 《跟蹤騷擾防治法》：若反覆或持續對特定人做出違反其意願、且與【】有關的行為，造成對方【】，並影響【】，就可能構成「跟蹤騷擾」。
    - - 判斷關鍵
      - 如何區別浪漫和跟騷，關鍵在是否【】對方的意願，及是否取得【】。
    - - 行動建議
      - 遭遇跟騷時，可以明確表達【】，向可信任的【】求助；情況嚴重時，可【】或依法申請【】。
    - - 結語
      - 真正的喜歡要從尊重他人開始。
    answers:
    - 壓力
    - 性或性別
    - 恐懼或焦慮
    - 學習、工作或日常生活
    - 尊重
    - 同意
    - 拒絕
    - 大人
    - 報警
    - 保護令
  - type: self_check
    items:
    - 我能判斷作者對關切主題的觀點。
    - 我能找到支持作者觀點的證據。
    - 我能檢查推論出的寫作目的，是否符合前面的觀點與證據。
    - 我能用這四個步驟閱讀另一篇文章。
