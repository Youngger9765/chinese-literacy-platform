keypoints:
  lesson: G7-L3
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 主題
    value: 你以為的浪漫可能是跟騷
    blanks: []
  - label: 情境案例
    value: 阿哲反覆追求小芳，小芳__很大，甚至失眠。
    blanks:
    - answer: 壓力
      hint: ''
  - label: 迷思來源
    value: 愛情電影常把糾纏行為美化為浪漫，容易誤導觀眾產生錯誤認識。
    blanks: []
  - label: 法律標準
    value: 《跟蹤騷擾防治法》：若反覆或持續對特定人做出違反其意願、且與__有關的行為，造成對方__，並影響__，就可能構成「跟蹤騷擾」。
    blanks:
    - answer: 性或性別
      hint: ''
    - answer: 恐懼或焦慮
      hint: ''
    - answer: 學習、工作或日常生活
      hint: ''
  - label: 判斷關鍵
    value: 如何區別浪漫和跟騷，關鍵在是否__對方的意願，及是否取得__。
    blanks:
    - answer: 尊重
      hint: ''
    - answer: 同意
      hint: ''
  - label: 行動建議
    value: 遭遇跟騷時，可以明確表達__，向可信任的__求助；情況嚴重時，可__或依法申請__。
    blanks:
    - answer: 拒絕
      hint: ''
    - answer: 大人
      hint: ''
    - answer: 報警
      hint: ''
    - answer: 保護令
      hint: ''
  - label: 結語
    value: 真正的喜歡要從尊重他人開始。
    blanks: []
