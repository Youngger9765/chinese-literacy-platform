comprehension:
  questions:
  - index: 1
    answer: D
    stem: 下列選項「  」中的語詞，何者使用錯誤？
    options:
      A: 勸他尊重對方的決定，不要再干擾對方
      B: 鼓勵他更加熱情地表達愛意，對方終會被感動
      C: 要他暫時先放棄，隔一段時間再繼續嘗試
      D: 建議他設計更有創意的驚喜，好讓對方回心轉意
    rationale: 第2題解析：作者描述電影情節讓觀眾「誤以為這就是浪漫的模樣」，暗示大眾易受電影影響而產生錯誤認知。
  - index: 5
    answer: B
    stem: 若有人不斷在網路社群標註你、留言「我愛你」，使你感到困擾，依文章觀點，下列哪一種處理方式較適當？
    options:
      A: 默默刪除留言或退出群組，不要讓人知道
      B: 清楚告知對方停止，若仍持續，可向大人求助
      C: 找好朋友去警告，再不停止會有嚴重後果
      D: 對方畢竟是好意，保持安靜，不理會不處理
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 0.5
    answers_recovered_from_rationale: 0
    verdict: ok
