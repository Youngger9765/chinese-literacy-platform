paragraphs:
- 「小芳，我真的很喜歡你，再給我一個機會吧！」阿哲第五次向小芳告白時，小芳臉色一沉，轉身離開。儘管她多次明確拒絕，阿哲卻仍不放棄。他常在校門口等她，頻繁傳訊息追問她在哪裡、和誰在一起，甚至趁她不注意時，將情書塞進她的書包。最近，他還開始在小芳晚上回家的路上守候。小芳感到壓力越來越大，走過小巷時，只要聽到腳步聲，她便如驚弓之鳥般回頭張望，夜裡甚至輾󠇡轉難眠。
- 在許多愛情電影中，主角為了追求心儀對象，常做出誇張舉動：在對方常去的場所守候、悄悄監視行蹤、送上鮮花禮物，甚至在被拒絕後仍堅持不放棄。這些情節配上動人的音樂與唯美的畫面，營造出滿滿的愛情元素，讓觀眾怦然心動，誤以為這就是浪漫的模樣。現實中，類似行為並不少見。有人相信，只要真心付出、鍥而不捨，就能「精誠所至，金石為開」，對方終有被感動的一天。然而，當這種自以為是的「浪漫」讓對方感到不安或被打擾時，它就不再是愛情的象徵，而可能成為法律上的問題。
- 根據民國111年施行的《跟蹤騷擾防治法》（簡稱《跟騷法》），若反覆或持續針對特定人做出違反其意願、且與性或性別有關的行為，例如監視行蹤、反覆跟隨、不斷傳送訊息或一再告白，使對方感到恐懼、焦慮，影響其學習、工作或日常生活，就構成了「跟蹤騷擾」。阿哲的守候、追問與強塞情書，看似深情，卻可能已符合跟騷的特徵。這些舉動並非浪漫，而是對人際界線的侵犯，也有觸犯法律的風險。
- 或許你會問：「浪漫和跟騷該如何區分？」這個問題不能只看行為的表面，因為同一種舉動，在不同情況，可能給人不同的感受。有人收到禮物，會覺得溫馨；有人同樣收到禮物，卻會感到壓力或不適。判斷的關鍵，在於「尊重」與「同意」。當你想表達心意時，是否考慮過對方的意願？例如，你想送同學回家，是否問過：「我可以陪你走一段嗎？」若對方同意，這是雙方都自在的互動；若被拒絕，真正的喜歡應該包含尊重他的決定，停止進一步的行動。若不尊重對方的意願，無論初衷多麼美好，都可能變成騷擾，甚至帶來法律上的問題。
- 同樣的，當有人不斷靠近、糾纏，使你感到被打擾或害怕時，你也有權明確表達拒絕。若對方仍持續騷擾，可以向可信任的大人求助；情況嚴重時，也可以向警方報案，或依法申請保護令。
- 感情無法勉強，浪漫更不是誇張的付出或死纏爛打。如果真心喜歡一個人，那就從學習尊重對方開始吧！
