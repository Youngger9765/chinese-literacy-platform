lesson_uid: L0100
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 🅐 從本課語詞框中找語詞。
  - 🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 🅒 問同學。
  vocabulary_bank:
  - 驚弓之鳥
  - 初衷
  - 保護令
  - 界線
  - 輾轉難眠
  - 鍥而不捨
  - 怦然心動
  - 精誠所至，金石為開
  - 死纏爛打
  - 觸犯
  items:
  - index: 1
    word: 保護令
    definition: 法院為保護當事人的安全，而發出禁止對方靠近、聯絡的命令。
  - index: 2
    word: 死纏爛打
    definition: 糾纏不休、讓人厭煩，形容不知分寸的強求。
  - index: 3
    word: 鍥而不捨
    definition: 有毅力，不放棄，持續努力到底。
  - index: 4
    word: 精誠所至，金石為開
    definition: 只要真心誠意去做，連最困難的事情也能成功。
  - index: 5
    word: 怦然心動
    definition: 被某人或某事吸引而動心。常用來形容愛情的感覺。
  - index: 6
    word: 輾轉難眠
    definition: 因為煩惱，整晚翻來覆去睡不著。
  - index: 7
    word: 觸犯
    definition: 違反法律或規定，或冒犯他人。
  - index: 8
    word: 驚弓之鳥
    definition: 鳥兒曾經被獵人的弓箭所傷，再看見弓時，就害怕起來。形容一個人曾經受過驚嚇或傷害，變得非常敏感。
  - index: 9
    word: 界線
    definition: 人與人之間應該遵守的分際或範圍，常用來指行為上的分寸。
  - index: 10
    word: 初衷
    definition: 最初的想法或目的。
  notes:
    vocabulary_bank: 依語詞框印出的順序，共 10 個；比總表多一個「初衷」（見 meta._總表_對照note）。
    answer_carrier: 橘色手寫字（PDF p3）；文字層的空格內已填有同樣的答案
  slug: p4yyu
  text_ref: rcmdx
