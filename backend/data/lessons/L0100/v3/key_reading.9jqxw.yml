  passage: 根據民國111年施行的《跟蹤騷擾防治法》（簡稱《跟騷法》），若反覆或持續針對特定人做出違反其意願、且與性或性別有關的行為，例如監視行蹤、反覆跟隨、不斷傳送訊息或一再告白，使對方感到恐懼、焦慮，影響其學習、工作或日常生活，就構成了「跟蹤騷擾」。阿哲的守候、追問與強塞情書，看似深情，卻可能已符合跟騷的特徵。這些舉動並非浪漫，而是對人際界線的侵犯，也有觸犯法律的風險。
