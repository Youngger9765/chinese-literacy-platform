lesson_uid: L0100
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    answer: D
    stem: 下列選項「  」中的語詞，何者使用錯誤？
    options:
      A: 小強每天送早餐、寫紙條給小芳，「死纏爛打」的追求讓人反感
      B: 自從發生意外後，小美像「驚弓之鳥」，聽到車聲就嚇得發抖
      C: 與人互動時，應尊重彼此「界線」，不輕易干涉別人的選擇
      D: 每次聽到警車聲，他就「怦然心動」，又是緊張又是害怕
    explanation_note: 本題**沒有**浮動解析框（第 1 題的解析原稿就沒有印）。
  - index: 2
    answer: B
    stem: 作者描寫愛情電影中的誇張追求和唯美畫面，其主要目的為何？
    options:
      A: 說明電影的追求情節已經構成法律上的跟騷
      B: 提醒許多人易被電影影響，誤以為那就是浪漫
      C: 說明浪漫與跟騷只要依照行為形式就能區分
      D: 強調音樂與唯美畫面能使追求較不易觸法
    explanation: 第2題解析：作者描述電影情節讓觀眾「誤以為這就是浪漫的模樣」，暗示大眾易受電影影響而產生錯誤認知。
    explanation_note: 原稿是一個浮動說明框，印在題目右側；在 document.xml 裡排在第 1 題選項之後。
    teacher_note: 作者描述電影情節讓觀眾「誤以為這就是浪漫的模樣」，暗示大眾易受電影影響而產生錯誤認知。
  - index: 3
    answer: C
    stem: 下列何者最符合本文的主旨？
    options:
      A: 只要真心付出並持續追求，最終就能感動對方
      B: 愛情電影裡的浪漫情節都不切實際，千萬不能當真
      C: 真正的喜歡應尊重對方意願；忽視拒絕的追求可能觸法
      D: 遇到跟蹤騷擾要自保、勇敢反擊，以免自己受害
    explanation: 第3題解析：本文重點在提醒讀者「你以為的浪漫，可能是跟騷」，強調尊重他人意願的重要。
    explanation_note: 說明框裡另有一段殘留的重複片段「意願的重要。」，見 errata E2，未收進本檔。
    teacher_note: 本文重點在提醒讀者「你以為的浪漫，可能是跟騷」，強調尊重他人意願的重要。
  - index: 4
    answer: A
    stem: 如果你發現朋友有像阿哲那樣死纏爛打的行為，你會給他哪一項建議最符合本文的觀點？
    options:
      A: 勸他尊重對方的決定，不要再干擾對方
      B: 鼓勵他更加熱情地表達愛意，對方終會被感動
      C: 要他暫時先放棄，隔一段時間再繼續嘗試
      D: 建議他設計更有創意的驚喜，好讓對方回心轉意
    explanation: 第4題解析：文章強調真正喜歡一個人就應該尊重對方意願，因此遇到朋友糾纏他人時，最符合本文觀點的建議是勸他停止干擾、尊重對方的決定。
    explanation_source_text: 第4題解析：文章強調真正喜歡一個人就應該尊重對方意願，因此遇到朋友纠纏他人時，最符合本文觀點的建議是勸他停止干擾、尊重對方的決定。)
    errata_ref: E1
    explanation_note: 說明框裡另有一段殘留的重複片段「議是勸他停止干擾、尊重對方的決定。」，見 errata E3，未收進本檔。
    teacher_note: 文章強調真正喜歡一個人就應該尊重對方意願，因此遇到朋友纠纏他人時，最符合本文觀點的建議是勸他停止干擾、尊重對方的決定。)
  - index: 5
    answer: B
    stem: 若有人不斷在網路社群標註你、留言「我愛你」，使你感到困擾，依文章觀點，下列哪一種處理方式較適當？
    options:
      A: 默默刪除留言或退出群組，不要讓人知道
      B: 清楚告知對方停止，若仍持續，可向大人求助
      C: 找好朋友去警告，再不停止會有嚴重後果
      D: 對方畢竟是好意，保持安靜，不理會不處理
    explanation_note: 本題**沒有**浮動解析框。
  notes:
    answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
