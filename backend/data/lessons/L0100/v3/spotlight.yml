lesson_uid: L0100
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論作者觀點與寫作目的
  strategy_type: reading_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本節 15 個），PDF p5~p6 可見
  single_vs_multi_note: '有印「（請打勾，單選）／（複選）」的照著標；**沒有印標記**的，依 ☑ 的個數判定

    （1 個 → single、2 個以上 → multi）。⛔ 沒有硬套「小試身手一律複選」那種形狀啟發式。'
  blocks:
  - type: concept_box
    text: '閱讀說明文或議論文時，讀出「作者的觀點」和「寫作目的」，才能完全理解文章。我們用底下❶～❹步驟來讀出「作者的觀點」和「寫作目的」。

      ❶確認議題：文章主要在談什麼？

      ❷推論觀點：作者對這個議題提出什麼看法或主張？

      ❸找支持證據：作者用哪些案例、事實、法律或說明支持觀點？

      ❹推論寫作目的：作者想讓讀者知道、相信或採取什麼行動？

      接下來，我們練習用這個閱讀策略，來找出作者的觀點與目的。'
  - type: guide
    text: 一、推論本文作者觀點與目的
  - type: guide
    text: '步驟❶確認焦點

      1.問自己：這篇文章在談「哪個主題」？

      2.祕訣：看標題＋開頭兩段，判斷主題關鍵字。

      ◎小試身手：'
  - type: single
    prompt: 〈你以為的浪漫，可能是跟騷〉，這篇文章在談哪個主題？
    options:
      1: 浪漫與跟騷的區別
      2: 浪漫的行為
      3: 《跟蹤騷擾防治法》
    answer: 1
  - type: guide
    text: '步驟❷推論作者觀點（可和「步驟❸找支持證據」同時進行）

      1.問自己：作者對文章事件的看法或主張？支持或反對？

      2.祕訣：(1)找出表達情緒語詞（開心/害怕…）或例子方向（好/壞）。

      (2)勾選觀點。

      ◎小試身手'
  - type: multi
    prompt: (1)閱讀課文後，選出表達被跟騷者情緒的語詞（請打勾，複選）
    options:
      1: 感到壓力越來越大
      2: 聽到腳步聲便緊張回頭
      3: 夜裡輾轉難眠
      4: 收到禮物後感到溫馨自在
    answers:
    - 1
    - 2
    - 3
  - type: single
    prompt: (2)判斷選出的語詞是正面或負面的
    options:
      1: 正面
      2: 負面
    answer: 2
  - type: single
    prompt: (3)作者對持續違反意願的追求提出什麼看法？
    options:
      1: 只要真心，就是浪漫
      2: 不受歡迎的追求，可能成為跟騷
    answer: 2
  - type: guide
    text: '步驟❸找支持證據

      1.問自己：作者用什麼證據說服我？

      2.祕訣：通常作者會用「案例、數據、法律、名言」當支持證據。'
  - type: multi
    prompt: ◎小試身手：找一找，本文用什麼證據說服讀者？（請打勾，複選）
    options:
      1: 情境案例
      2: 名人採訪
      3: 法律規定
      4: 統計數據
    answers:
    - 1
    - 3
  - type: guide
    text: '步驟❹推論寫作目的

      1.問自己：作者想要讓我知道、相信或採取什麼行動？

      2.祕訣：呼籲句、結論段重點

      ◎小試身手

      (1)第五段寫道，如果遭遇跟騷，你有權明確表達拒絕，甚至報警。末段呼籲：「如果真心喜歡，就從尊重開始！」'
  - type: multi
    prompt: (2)作者想讓我知道：
    options:
      1: 喜歡一個人要不顧一切、以浪漫方式追求
      2: 追求異性時，要尊重對方的意願，避免觸法
      3: 遭遇騷擾時，可以明確拒絕並尋求協助
    answers:
    - 2
    - 3
  - type: guide
    text: '二、挑戰題：

      再讀一個短文，看看你是否可以讀出作者的主要觀點和寫作目的。'
  - type: passage
    paragraphs:
    - 別讓紙吸管成為下一個塑膠袋
    - 為響應減塑，許多飲料店改用紙吸管。但不少消費者已養成用完即丟的習慣，因此常一次拿幾支吸管，以備不時之需。環保團體調查發現，一些觀光區紙吸管一週的垃圾量竟高於過去使用塑膠吸管時期。此外，多數紙吸管難以有效回收處理，最終仍將送進焚化爐。減塑真正該做的是「少用一次性吸管」，而非僅將材質從塑膠換成紙。下次點飲料前，先問自己──我真的需要吸管嗎？
  - type: guide
    text: '步驟❶確認焦點

      1.問自己：這篇在談「哪個主題」？'
  - type: single
    prompt: 2.這篇文章主要關注哪個主題？（請打勾，單選）
    options:
      1: 塑膠袋污染
      2: 一次性吸管帶來的環境問題
    answer: 2
  - type: guide
    text: '步驟❷推論作者觀點

      1.問自己：作者對這個主題有什麼看法？支持、反對？'
  - type: single
    prompt: 2.根據標題與短文內容，作者主要的看法為何？（請打勾，單選）
    options:
      1: 紙吸管能解決塑膠污染問題
      2: 應該減少使用一次性吸管，而非僅更換材質
    answer: 2
  - type: guide
    text: '步驟❸找支持證據

      1.問自己：作者用什麼說服我？'
  - type: multi
    prompt: 2.文中哪兩項資訊用來支持作者觀點？（請打勾，複選）
    options:
      1: 調查發現某些景點的紙吸管垃圾量甚至比塑膠吸管更多
      2: 多數紙吸管仍難以有效回收，只能送入焚化爐
      3: 飲料店為消費者提供紙吸管，增加了消費成本
    answers:
    - 1
    - 2
  - type: guide
    text: '步驟❹推論寫作目的

      1.問自己：作者想要影響我什麼？'
  - type: single
    prompt: 2.作者寫這篇短文想讓我知道：
    options:
      1: 提醒讀者減少飲料的購買頻率
      2: 鼓勵讀者盡量不要使用一次性吸管
      3: 鼓勵讀者多使用紙吸管而非塑膠吸管
    answer: 2
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能判斷作者對關切主題的觀點。
    - 2.我能找到支持作者觀點的證據。
    - 3.我能檢查推論出的寫作目的，是否符合前面的觀點與證據。
    - 4.我能用這四個步驟閱讀另一篇文章。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿四個 □ 都沒有勾
  - type: guide
    text: ※如果你四項都打勾，恭喜你，表示你已經學會用 4 步驟「推論作者觀點與寫作目的」，你超厲害的！
