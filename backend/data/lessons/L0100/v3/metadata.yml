intro: 這篇文章探討了「浪漫」與「跟蹤騷擾」之間的界線。文章從一個男生不斷追求心儀的女生，卻讓女生感到害怕的例子開始，引導讀者思考，許多在電影中被描繪成浪漫的追求行為，在現實生活中，如果未經對方同意，反而可能構成跟蹤騷擾。文中介紹了《跟蹤騷擾防治法》的定義，並說明了判斷浪漫與跟騷的關鍵在於是否尊重對方的意願。最後，文章也提醒讀者，當遭遇騷擾時，有權利拒絕並尋求協助，真正的喜歡應建立在互相尊重之上。
