strategy_explained: '這一課要練的是「觀察作者的想法和想告訴我們什麼」

  這篇文章用一個男生追求女生卻讓對方害怕的例子，帶我們思考電影裡的浪漫情節，在現實中可能變成侵犯，很適合練習從文字裡找出作者的觀點，理解他為什麼要寫這篇告訴我們這些

  讀的時候，可以想想作者講的例子，跟法律上的跟蹤騷擾有什麼不一樣，還有作者希望大家在追求別人或被追求時，要怎麼做才對'
