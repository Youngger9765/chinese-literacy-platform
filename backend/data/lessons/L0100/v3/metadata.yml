_總表_對照note: '🔴 **四份語詞清單四種內容**，不是抽錯，是原稿四處本來就不一致（差異只在「初衷」與「保護令」兩個）：

  ・總表（9）：驚弓之鳥 輾轉難眠 鍥而不捨 怦然心動 精誠所至，金石為開 界線 觸犯 保護令 死纏爛打

  ・學習單語詞框（10）＝總表那 9 個 ＋ **初衷**

  ・第四大題代號 A~I（9）＝語詞框那 10 個 **扣掉保護令**（所以有初衷、沒保護令）

  ・第八大題找字灰框（9）＝語詞框那 10 個 **扣掉初衷**（＝與總表同一組）

  第三大題「語詞我最棒」10 題，跟**語詞框**完全一致（10 個都出題）。

  ⛔ 未自行把「初衷」補進總表、也未把「保護令」補進第四大題代號 —— 兩邊都是原稿的取捨。

  佐證這不是抽取誤差：找字格子裡其實排得出「初衷」（第 5 列第 3~4 格），

  但灰框沒有列它、圖上也沒有圈它，所以它在第八大題是誘答不是目標。'
