  - label: 法律標準
    value: 《跟蹤騷擾防治法》：若反覆或持續對特定人做出違反其意願、且與【　】有關的行為，造成對方【　】，並影響【　】，就可能構成「跟蹤騷擾」。
    blanks:
    - answer: 性或性別
    - answer: 恐懼或焦慮
    - answer: 學習、工作或日常生活
  - label: 判斷關鍵
    value: 如何區別浪漫和跟騷，關鍵在是否【　】對方的意願，及是否取得【　】。
    blanks:
    - answer: 尊重
    - answer: 同意
  - label: 行動建議
    value: 遭遇跟騷時，可以明確表達【　】，向可信任的【　】求助；情況嚴重時，可【　】或依法申請【　】。
    blanks:
