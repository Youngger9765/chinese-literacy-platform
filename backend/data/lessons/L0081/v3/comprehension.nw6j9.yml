lesson_uid: L0081
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    answer: D
    stem: 下列文句中的語詞，何者使用正確？
    options:
      A: 他故意把一句話拉得很長，顯得十分「意味深長」
      B: 她站在山頂「仰望」山谷中的清幽景致 (由高往低看是「俯視」）
      C: 這個「艱鉅」的任務，必須花五分鐘才能解決(前後句矛盾）
      D: 臺灣文化發展蓬勃，節慶的慶祝方式十分「多元」
    explanation: (邏輯錯誤）
    explanation_note: '橘色小字，印在題幹右側（指的是選項 A）。選項 B、C 後面另有各自的橘色教師註，

      在文字流裡，照原樣保留在選項字串內；三處都是左半形括號配右全形括號。'
  - index: 2
    answer: C
    stem: NASA 2022年的登月計畫命名為「阿提米絲」，請問最可能代表的意義是什麼？
    options:
      A: 阿提米絲是月亮的守護之神
      B: 代表人類再度登往月球，恢復往日榮光
      C: 用女性的名字傳達性別平等的時代來臨
      D: 之前已使用「阿波羅」，現在接著用他姐姐的名稱
    explanation: （第三段提到阿提米絲計畫不但要再度登月，還要讓「女性」送上太空。）
    explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 之前
  - index: 3
    answer: A
    stem: 根據本文的敘述，你認為下列何種情況可能會在2025年美國國家航空暨太空總署（NASA）登月計畫內發生？
    options:
      A: 太空衣及補給用品會考量女性的需要
      B: 計畫會選擇黑人擔任登月太空人
      C: 女性擔任太空人數遠超過男性人數
      D: 至少有一半太空人穿抗輻射的背心
    explanation: （女性越來越受到重視，所以太空包也會有女性專屬的物品）
    explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 之前
  - index: 4
    answer: C
    stem: 一個描述希臘神話人物阿波羅和阿提米絲異同的表格裡，第一列比較性別（男、女）、第二列比較代表的星球（太陽、月亮），第三列的左右欄分別寫著「陽剛威猛」和「溫柔婉約」的細節，請問，下列選項中，哪一個名稱，最適合填入這個對比的「比較項目」？
    options:
      A: 道德優勢
      B: 心理韌性
      C: 性格特質
      D: 星座運勢
    answer_note: 原稿的答案代號用全形「Ｃ」，其餘題用半形；本檔一律記半形。
  - index: 5
    answer: B
    stem: 以下是2022年阿提米絲計畫執行內容的說明，何者有誤？
    options:
      A: 計畫的目的可以獲得更多數女性太空人的數據
      B: 計畫中的太空人不能再選白人男性（文中並未提到）
      C: 內含假人模型，模仿成年女性的骨骼、肌肉器官
      D: 使用兩具假人的目的是為了對比背心的防護效果
    stem_note: 題幹的「有誤」加了底線；選項 B 後面的「（文中並未提到）」是橘色教師註，在文字流裡，照原樣保留。
  notes:
    answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
