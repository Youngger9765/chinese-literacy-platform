lesson_uid: L0081
version_id: v3
section_no: 六
spotlight:
  strategy_name: 用表格整理訊息——從細節歸納比較項目
  strategy_type: information_organization
  section_title_printed: 閱讀聚光燈
  answer_carrier: '🔴 全部是**橘色手寫字**，本課一個 ☑ 都沒有（w:sym F0FE 全文 0 個）。

    橘色答案在文字層裡，所以文字流抽得到；PDF p6 也看得見。'
  structure_note: '⛔ 兩張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 table/fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。'
  layout_note: '⚠️ 「◎小試身手」的比較表在 PDF p6 上印在「七 閱讀理解」標題之後，看起來像閱讀理解的題目；

    `document.xml` 的元素順序是 ◎小試身手 → 指示語 → 表格 → 七閱讀理解，所以它屬於第六大題。

    是浮動標題方塊被推到表格上方造成的假象。'
  blocks:
  - type: concept_box
    text: '之前我們學過，可以將文章內容整理成表格。比較表能把兩個對象的相關訊息放在同一列，幫助我們快速看出相同與相異之處。這一課要再學一步：看到兩邊的細節後，想出它們共同在比較什麼，替這一列取一個清楚的「比較項目」名稱。整理比較表格的步驟如下：

      ❶找比較對象：這張表要比較哪兩個對象？把它們寫在表格對象列。

      ❷找同列細節：找出同一列中不同對象可以互相比較的細節，用筆畫起來。

      ❸問共同項目：把兩個或多個細節放在一起，問：「它們都在說哪一個項目？」

      例如：「阿波羅計畫從1969年~1972年」及「2022年NASA重啟阿提米絲登月計畫」，這二者比較的共同項目，可以命名為「年代」。

      ❹填入並檢查：把項目和細節填進同一列，確認兩格都在回答同一個項目。

      (5)將文章細節填入細格。'
  - type: table
    columns:
    - 項目　　　　對象
    - 對象１
    - 對象２
    rows:
    - - 項目１
      - 文章細節
      - 文章細節
    - - 項目２
      - 文章細節
      - 文章細節
    table_note: '這是概念說明框裡的示意表（不是要填的題目），原稿是巢狀在說明框內的小表格。

      PDF p5 上「項目１」「項目２」兩格加了紅框強調 —— 那是在標示「這一欄就是你要命名的比較項目」，

      不是答案勾選。'
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 請依照上面的步驟，完成以下的表格。
