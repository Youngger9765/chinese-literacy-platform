spotlight:
  lesson: G7-L13
  strategy_name: 用表格整理訊息-從細節歸納比較項目
  strategy_type: comparison
  blocks:
  - type: guide
    text: 之前我們學過，可以將文章內容整理成表格。比較表能把兩個對象的相關訊息放在同一列，幫助我們快速看出相同與相異之處。這一課要再學一步：看到兩邊的細節後，想出它們共同在比較什麼，替這一列取一個清楚的「比較項目」名稱。整理比較表格的步驟如下：❶找比較對象：這張表要比較哪兩個對象？把它們寫在表格對象列。❷找同列細節：找出同一列中不同對象可以互相比較的細節，用筆畫起來。❸問共同項目：把兩個或多個細節放在一起，問：「它們都在說哪一個項目？」例如：「阿波羅計畫從1969年~1972年」及「2022年NASA重啟阿提米絲登月計畫」，這二者比較的共同項目，可以命名為「年代」。❹填入並檢查：把項目和細節填進同一列，確認兩格都在回答同一個項目。(5)將文章細節填入細格。項目           對象                   對象１對象２項目１文章細節文章細節項目２文章細節文章細節
  - type: guide
    text: ◎小試身手
