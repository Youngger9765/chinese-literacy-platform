passage: '這次NASA特別關注女性太空人登月，是有原因的。長期以來女性太空人的比例非常低，傳統觀念認為，高大強壯的男性更適合艱鉅的太空任務，許多太空裝備和任務設定也都依男性需求設計，這種對女性的偏見，使科學家缺乏太空活動對女性健康影響的研究資料。隨著醫學進步，如今科學家認為，女性可能更適合長途的太空任務，因為女性在任務中消耗的飲食和氧氣比男性少，在幽閉的環境中情

  為了獲得更多與女性太空人有關的數據，2022年發射的阿提米絲1號，承載了兩具裝有感應器的假人模型。這些模型模擬成年女性的骨骼、肌肉和內臟器官，可以在真人登月之前提供更多關鍵數據。假人模型還接受太空航行中的輻射考驗，一具穿著特製保護背心，一具則沒有任何保護，以便測試背心的抗輻射效果。'
