comprehension:
  questions:
  - index: 1
    answer: D
    stem: 下列文句中的語詞，何者使用正確？      (邏輯錯誤）
    options:
      A: 他故意把一句話拉得很長，顯得十分「意味深長」
      B: 她站在山頂「仰望」山谷中的清幽景致 (由高往低看是「俯視」）
      C: 這個「艱鉅」的任務，必須花五分鐘才能解決(前後句矛盾）
      D: 臺灣文化發展蓬勃，節慶的慶祝方式十分「多元」
    rationale: null
  - index: 2
    answer: C
    stem: NASA 2022年的登月計畫命名為「阿提米絲」，請問最可能代表的意義是什麼？
    options:
      B: 代表人類再度登往月球，恢復往日榮光
      C: 用女性的名字傳達性別平等的時代來臨
      D: 之前已使用「阿波羅」，現在接著用他姐姐的名稱
    rationale: 第三段提到阿提米絲計畫不但要再度登月，還要讓「女性」送上太空。
  - index: 3
    answer: A
    stem: 根據本文的敘述，你認為下列何種情況可能會在2025年美國國家航空暨太空總署（NASA）登月計畫內發生？
    options:
      B: 心理韌性
      C: 性格特質
      D: 星座運勢
      A: 道德優勢
    rationale: 女性越來越受到重視，所以太空包也會有女性專屬的物品
  - index: 5
    answer: B
    stem: 以下是2022年阿提米絲計畫執行內容的說明，何者有誤？
    options:
      A: 計畫的目的可以獲得更多數女性太空人的數據
      B: 計畫中的太空人不能再選白人男性（文中並未提到）
      C: 內含假人模型，模仿成年女性的骨骼、肌肉器官
      D: 使用兩具假人的目的是為了對比背心的防護效果
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
