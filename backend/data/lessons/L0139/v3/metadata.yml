_大題編號textbox異常_note: '第五大題的編號文字方塊裡，w:t 內容其實是「**五一木六**」四個字（三個 run，

  都是 24pt 黑色）—— 多出「一木六」。PDF 上那個圓標只印得出「五」，其餘被圓形圖案

  裁掉，所以**版面上看不出異常**。另有一個獨立的「六」文字方塊給重點表用。

  這是原稿編輯殘留，不影響印出來的樣子 → 記在這裡，不列 source_errata、不修改。'
