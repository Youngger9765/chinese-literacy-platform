intro: 這篇文章介紹了達爾文對大彗星風蘭和一種未知長喙天蛾之間關係的預測。達爾文觀察到風蘭擁有超乎尋常的長花距，推測需要一種口器同樣長的昆蟲來為其授粉。儘管當時許多人對此感到懷疑，達爾文仍堅信這是長期演化的結果。文章接著描述了科學家們如何歷經漫長歲月，終於找到並證實了這種傳說中的長喙天蛾，以及牠們與風蘭之間精密的授粉關係。這個故事展現了科學家如何透過觀察、推理和求證，揭開自然界的奧秘。
