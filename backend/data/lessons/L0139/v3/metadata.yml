strategy_explained: 這一課，我們要練習把科學故事裡的「觀察、推測、證實」這幾個重要步驟抓出來，因為像達爾文預測長喙天蛾的故事，就是這樣一步步解開自然之謎的，很適合我們練習理清科學探究的脈絡。讀的時候，你可以試著找出達爾文的觀察是什麼，他推測了什麼，以及後來科學家們是怎麼找到證據的，把這些關鍵點記下來，就能更好地理解這個科學故事的精彩之處了
