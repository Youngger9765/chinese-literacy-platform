  items:
  - index: 1
    word: 難以置信
    definition: 讓人很難相信、超出一般想像。
  - index: 2
    word: 懸而未決
    definition: 問題或爭議暫時沒有定論，還沒被解決。
  - index: 3
    word: 引人矚目
    definition: 非常吸引大家注意。
  - index: 4
    word: 膾炙人口
    definition: 形容作品或事物非常受歡迎。
  - index: 5
    word: 洞察
    definition: 看得深入、看出表面之下的關鍵與本質。
  - index: 6
    word: 機制
    definition: 事物「怎麼運作」的方式與規則。例如比賽獎勵機制，指的是比賽提供獎勵的辦法。
  - index: 7
    word: 繁衍
    definition: 生物透過生殖而增加數量、延續族群。
  - index: 8
    word: 白駒過隙
    definition: 形容時間過得很快，像白色的駿馬一閃而過。
