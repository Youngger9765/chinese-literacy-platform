lesson_uid: L0139
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略──科學探究故事結構
  strategy_type: summarization_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層），共 15 個
  blocks:
  - type: concept_box
    text: '　　這篇文章用故事的方式，敘述達爾文因觀察到一朵花距特別長的蘭花而提出推測，後來科學家逐步找到證據加以驗證的過程。

      這類科學探究故事，常可以從「觀察→提問→推測→驗證」看出故事發展的過程，有些文章還會在結尾寫出「啟示」。閱讀時，找出這些部分，再抓住每一部分的重點句，就能依照故事結構整理全文大意，更清楚掌握文章重點。

      接著，我們用下列兩個步驟，找出本文的「觀察、提問、推測、驗證、啟示」。

      ❶找出各部分（元素）在哪個段落

      ❷抓重點：找出每一個部分的重點句'
    text_note: '這裡的「觀察→提問→推測→驗證」是**真的箭號字元**（在 w:t 文字流裡），照抄。

      跟底下五個「小撇步」前面那個 Wingdings F0E0 箭號不同 —— 那個不在文字層，不寫入。'
  - type: sub_block
    label: 一、找「觀察」
    hint: ※祕訣：「觀察」描述科學家看到了什麼重要的現象，常出現在文章開頭。
    items:
    - sub_label: ❶找段落：「觀察」出現在文章哪些段落？（提示，有兩段）
      options:
        1: 段1
        2: 段2
        3: 段3
        4: 段4
      answers:
      - 1
      - 2
    - sub_label: ❷找重點句：
      value: 本文開頭有多句描述達爾文觀察的句子，請判斷哪一句是觀察的重點句。（單選）
      options:
        1: 達爾文逐一觀察，仔細在筆記本上記錄形態與結構。
        2: 一株名叫「大彗星風蘭」的蘭花格外引人矚目，它的花距長度竟超過三十公分！
        3: 達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」
      answer: 2
    tip: 小撇步：②是重點句，直接點出達爾文觀察到的特殊現象（蘭花的花距長達三十公分）。①只是描述觀察的過程，③則已經是在提出疑問。
    tip_note: 「小撇步」前面印了一個箭號，那是 w:sym Wingdings F0E0、不在文字流裡，故不寫入
  - type: sub_block
    label: 二、找「提問」
    hint: ※祕訣：「提問」是科學家根據觀察提出的問題，研究想要解開的謎團，通常緊接在觀察之後出現，常會以問句呈現。
    items:
    - sub_label: ❶找段落：「疑問」出現在文章哪個段落？
      options:
        1: 段1
        2: 段2
        3: 段3
        4: 段4
      answer: 4
    - sub_label: ❷找重點句：（單選）
      options:
        1: 達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」
        2: 新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？
      answer: 2
    tip: 小撇步：以上句子中，有兩句以問號結尾，表示主角提出了兩個提問。第2段的問題是初步提問：長花距是否有繁衍功能？第4段的問題是關鍵提問：是否存在口器足夠長的昆蟲？
    tip_note: 同上，箭號是 Wingdings F0E0，不寫入
  - type: sub_block
    label: 三、找「推測」
    hint: ※祕訣：「推測」是根據提問提出的大膽假設或可能的答案。「推測」常會有明顯的關鍵詞，例如「推測」、「猜想」、「預測」等。
    items:
    - sub_label: ❶找段落：「推測」出現在文章哪一段？（單選）
      options:
        1: 段1
        2: 段2
        3: 段3
        4: 段4
      answer: 4
    - sub_label: ❷找重點句：
      options:
        1: 這實在令人難以置信！
        2: 達爾文寫下推測：在馬達加斯加島上，應該有一種口器長達三十公分的蛾類，能夠幫這朵風蘭授粉。
      answer: 2
  - type: sub_block
    label: 四、找「驗證」
    hint: ※祕訣：「驗證」指透過實驗或觀察找到證據來證明先前的推測。通常出現在文章後段，說明科學家找到的證據或得到結果。
    items:
    - sub_label: ❶找段落：「驗證」出現在文章哪一段？（提示，有兩段）
      options:
        1: 段6
        2: 段7
        3: 段8
        4: 段9
      answers:
      - 1
      - 3
    - sub_label: ❷找重點句：（3選2）
      options:
        1: 初步驗證：1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，支持達爾文「有這樣昆蟲」的推測。
        2: 科學家一直沒有直接證據說明天蛾和風蘭間的關係。
        3: 完整驗證：1992年，研究團隊拍到了長喙天蛾為風蘭授粉的畫面，證實天蛾與風蘭授粉的關係。
      answers:
      - 1
      - 3
  - type: sub_block
    label: 五、找「啟示」
    hint: ※祕訣：「啟示」是從這個故事得到的道理或體會，點出作者想傳達的科學精神。
    items:
    - sub_label: ❶找段落：「啟示」出現在文章哪一段？（單選）
      options:
        1: 段6
        2: 段7
        3: 段8
        4: 段9
      answer: 4
    - sub_label: ❷找重點句：最後一段直接提到這個故事帶來「許多啟示」，請勾選這個故事帶來的「具體啟示」。（4選3）
      options:
        1: 科學不只是描述所觀察到的現象，更要推論現象背後隱藏的機制。
        2: 科學不只是「眼見為憑」，未親眼所見之事，也能從理性與經驗中推論其答案
        3: 原來，科學就是從觀察裡提出好問題之後，「大膽假設，小心求證」的歷程。
        4: 達爾文親眼看見長喙天蛾為風蘭授粉，因此完成研究。
      answers:
      - 1
      - 2
      - 3
  - type: self_check
    label: ◎自我檢核
    instruction: 請你自己檢查以下5項，確定自己是否會抓重點了
    items:
    - 我學會找出文章中科學家觀察到的現象，知道研究從哪裡開始。（觀察）
    - 我學會找出科學家提出的問題，了解研究想解決什麼疑團。（提問）
    - 我學會找出科學家的假設猜想，了解他對答案的推測。（推測）
    - 我學會找出驗證推測的證據或結果，知道推測是如何被證實的。（驗證）
    - 我學會找出故事的啟示，了解這篇文章傳達的科學精神。（啟示）
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
    reflection: ※如果以上五項你都打勾了，恭喜你！你已經學會運用「觀察→提問→推測→驗證→啟示」五步驟來摘要科學探究文章。這會讓你更快速掌握文章重點，你真的很棒喔！
    reflection_note: 這裡的箭號是真的箭號字元（在 w:t 裡），照抄
