keypoints:
  lesson: G9-L19
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 觀察
    value: 一株名叫「大彗星風蘭」的蘭花格外引人矚目，它的花距長度竟__！
    blanks:
    - answer: 超過三十公分
      hint: ''
  - label: 提問
    value: 昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器，__？
    blanks:
    - answer: 世界上真的有口器這麼長的昆蟲嗎
      hint: ''
  - label: 推測
    value: 達爾文推測：在馬達加斯加島上，應該__。
    blanks:
    - answer: 有一種口器長達三十公分的蛾類，能夠幫這朵風蘭授粉
      hint: ''
  - label: 驗證
    value: 1. 1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，證實了達爾文的預測。2. 1992年，研究團隊拍到__的畫面，這個跨世紀的謎題終於得到完整的解答。
    blanks:
    - answer: 長喙天蛾為風蘭授粉
      hint: ''
  - label: 啟示
    value: 1.科學不只是描述所觀察到的現象，更要__現象背後隱藏的機制。2.科學不只是「眼見為憑」，未親眼所見之事，也能從__推論其答案。3.科學就是從觀察裡提出好問題之後，__的歷程。
    blanks:
    - answer: 推論
      hint: ''
    - answer: 理性與經驗
      hint: ''
    - answer: 大膽假設，小心求證
      hint: ''
  title: 見前人所未見——達爾文與長喙天蛾的故事
