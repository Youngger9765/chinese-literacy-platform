passage: '新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有一個長達30公分的口器，才能嚐到花距末端甜美的花蜜。這樣的推論讓他更興奮、也更困惑。這世界上真的有口器這麼長的昆蟲嗎？這實在令人難以置信！但如果沒有這樣的昆蟲，這種蘭花就不可能繁衍、不可能存在啊。因為當時已經發現有口器長達20公分的蛾，達爾文於是寫下他的推測：在馬達加斯加島上，應該有一種口器長達30公

  分的蛾類，能夠幫這朵風蘭授粉。

  「天方夜譚吧？」許多人覺得這個推論太荒唐。畢竟，30公分幾乎等於一張A4白紙的長邊，比一般鉛筆長許多，這樣的昆蟲真的存在嗎？雖然備受質疑，但達爾文仍堅信這是「共同演化」的結果——風蘭與那種尚未被發現的昆蟲，長期互相依存、一起改變。若沒有那種蛾，風蘭就不可能繁衍。很可惜，1882年達爾文帶著他的預言離世，沒有人見過那隻天蛾。人們開始淡忘他的推測，甚至淡忘這種神奇的風蘭。他的推論，成了一個懸而未決的謎。'
