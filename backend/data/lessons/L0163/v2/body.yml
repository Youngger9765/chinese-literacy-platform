version_id: v2
source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 崑山有一位顧寧人先生，生長在世代做官的家族，年少時就擁有超越其他人的資質，他專注於研究古代的學問，儒家的書及各種史書，差不多都能背誦。
- 他的精力超越一般人，沒有其他嗜好，從小到老，從來沒有一天不讀書。出門時，車上一定要帶上幾箱的書隨行，到旅店稍微休息後，就翻找書箱拿書出來讀，從不曾表現出疲倦的樣子來。
- 精力.絕人，無他.嗜好󠇡，自少󠇡.至老，未嘗.一󠇡日.廢書。出.必載書.數簏1.自隨，旅店少休，披尋.搜討，曾無.倦色。
