word_matching:
  label: 二、文白詞語比對
  instruction: 以下是原文與白話文的對照。請依照文意，寫出原文中灰底的白話文意思。
  items:
  - index: 1
    文言: 昆山 顧寧人先生，生長世族，少負絕異之資。
    白話: 崑山有一位顧寧人先生，生長在（　），年少時就擁有（　）的資質。
    blanks:
    - answer: 世代做官的家族
    - answer: 超越其他人
    variant_ref: 這一題的文言欄印「昆山」，其餘各處印「崑山」，見 variant_note
  - index: 2
    文言: 潛心古學，九經諸史，略能背誦。
    白話: 他（　）於研究古代的學問，儒家的書及各種史書，（　）都能背誦。
    blanks:
    - answer: 專注
    - answer: 差不多
  - index: 3
    文言: 精力絕人，無他嗜好，自少至老，未嘗一日廢書。
    白話: 他的精力（　），沒有其他嗜好，從小到老，（　）一天（　）。
    blanks:
    - answer: 超越一般人
    - answer: 從來沒有
    - answer: 不讀書
  notes:
    answer_carrier: 橘色手寫（在文字層，顏色只有解 rStyle 才看得到），PDF p3 可見
