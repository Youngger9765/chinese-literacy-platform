intro: 這篇文章介紹了顧寧人先生。他出身名門，自幼就展現出過人的才華，專心研究古籍，對經典和歷史都有深入的了解，甚至能背誦許多內容。顧寧人先生精力充沛，沒有其他特別的嗜好，從年輕到年老，每天都堅持閱讀。無論走到哪裡，他都會隨身攜帶好幾箱書。即使在旅途中短暫休息，他也會立刻翻開書本仔細研讀，從來不覺得疲倦。這篇文章描寫了顧寧人先生對讀書的熱愛與堅持。
