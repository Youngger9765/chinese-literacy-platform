strategy_explained: '這篇文章要練習的是「讀懂文言文」的能力，因為裡面有些字的意思會跟現代不太一樣，像是「少」就有「不多」的意思

  這篇故事描寫了顧寧人先生對讀書的熱情，就算在旅途中休息也抓緊時間看書，這讓我們能實際看到文言文中「少」的意思，也能感受他對經典的投入

  讀的時候，你可以試著把文中的「少」想成「不多」，並想像顧寧人先生抱著一箱箱書的樣子，感受他對閱讀的堅持'
