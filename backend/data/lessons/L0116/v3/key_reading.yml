  char_marks_note: "三個段界值全部精準吻合，起點是第 3 段、字數欄只數到第 5 段。\n要**同時疊加**兩條口徑（SKILL ⑥.7「可以疊加」那條），只套其中一條會全差：\n  · 第 1 條 —— 一串阿拉伯數字算 1 個字\n  · 第 5 條 —— 破折號 `U+2014`（——）一個字都不算\n逐段驗算：\n  段3 → 裸算 111，扣掉「的智慧——意思是」的兩個 U+2014（第 5 條）＝ **109** ＝ 印的 109\n  段4 → 109＋204 ＝ **313** ＝ 印的 313（本段沒有數字也沒有破折號，兩條都不用套）\n  段5 → 313＋144 ＝ **457** ＝ 印的 457（裸算 147，「2020」四位數算 1 字，第 1 條省 3）\n第 2 條（註腳）本課不必套：footnotes.xml 是空的。\n第 4 條（variation selector）課文段落裡沒有出現。\n字數欄**提早兩段停止**（第 6、7 段沒有數字），所以最後一個數字 457 不是全文長度\n—— 這是 SKILL 已記錄的常見形狀。\n註：本課段3 是第 5 條的**第三個獨立佐證**（前兩個是 L0103、L0110）。"
