  passage: 從傳統文化來看，這個故事表現了「禍福相倚」的智慧——意思是災禍和福氣會相伴而來、彼此轉化。今天看似倒楣的事，明天可能成為祝福；今天看似幸運的事，日後也可能帶來麻煩。古人藉著故事提醒我們：世事無常，得失難料，不必太早下定論。其實，塞翁對壞事的反應，和現代「認知心理學」的說法相符。認知心理學強調「想法會影響情緒與行動」。一件事發生後，不同的詮釋，就會帶來不同的情緒與相應的作為。塞翁失馬後，如果他的詮釋是「老天對我不公平！」那麼，他接下來的日子一定愁雲慘霧；但他的詮釋是：「是福是禍？還不知道呢。」他就不必因失馬而過度悲傷，意外得馬，也不會因而得意忘形。他懂得，沉浸在過多的情緒中於事無補，不如在變化中保持清醒，靜待事情的後續發展。不只是個人，國家層級也有焉知非福的例子。2020年，新冠肺炎使全臺灣開始大規模的遠距上學上班，經濟大受影響，市井間的商店門可羅雀。眾人悲觀之際，全球遠距設備（筆電、攝影機、伺服器等）需求大增，臺灣電子產業迎來爆發性成長，不但連續兩年的產值屢創歷史新高，更奠定了當今臺灣在全球電子產業的重要地位。
