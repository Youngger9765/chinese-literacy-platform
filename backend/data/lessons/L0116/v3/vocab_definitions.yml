  - 無常
  - 詮釋
  - 愁雲慘霧
  - 奠定
  - 得意忘形
  - 於事無補
  - 市井
  - 門可羅雀
  vocabulary_bank_label: 本課語詞
  vocabulary_bank_note: '語詞框裡的順序與總表不同（框裡「奠定」排第 9，總表排第 13），這裡照**學習單印的順序**。

    框裡的「心不在焉」「禍福相倚」中間各夾一個隱藏的 variation selector（U+E01E1），

    比對時要濾掉 Unicode 類別 Cf/Mn 才對得上。'
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  answer_carrier: 橘色手寫（C:E97132，教師版答案），文字流有此資訊
  items:
  - index: 1
    word: 契機
    definition: 讓事情可能出現改變的好機會。
  - index: 2
    word: 轉圜
    definition: 事情還有改變或挽回的機會。
  - index: 3
    word: 無常
    definition: 事情變化不定，難以預料。
  - index: 4
    word: 心不在焉
    definition: 心思不在正在做的事情上，不專心。
  - index: 5
    word: 奠定
    definition: 建立穩固的基礎。
  - index: 6
    word: 禍福相倚
    definition: 壞事和好事常常連在一起，一件事不一定永遠是好或壞。
  - index: 7
    word: 詮釋
    definition: 「詮、釋」都有解釋的意思。指對一件事的理解和解釋。
  - index: 8
    word: 得意忘形
    definition: 「得意」是高興；「忘形」是忘了分寸。因為太高興、太驕傲，言行變得不恰當。
  - index: 9
    word: 愁雲慘霧
    definition: 形容心情低落，或氣氛沉重。
  - index: 10
    word: 於事無補
    definition: 對事情沒有幫助，不能讓情況變好。
  - index: 11
    word: 鄙夷
    definition: 看不起、輕視別人。
  - index: 12
    word: 門可羅雀
    definition: 形容生意非常冷清，來的人非常少，門口可以張網捕麻雀。
  - index: 13
    word: 市井
    definition: 一般老百姓生活、買賣、活動的地方。
