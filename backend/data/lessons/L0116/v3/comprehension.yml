lesson_uid: L0116
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案，印在題號前的括號內），文字流有此資訊
  teacher_notes_note: '每一題右側都有一個深藍色（C:0F4761）的教師解析文字方塊，印在頁面右緣。

    PDF 上第 2、3 題的方塊被右邊界裁掉一部分（看起來像缺字），

    但 document.xml 的內容是完整的，這裡以文字層為準。'
  questions:
  - index: 1
    answer: D
    stem: 本文第4段提到，塞翁失馬後說：「是福是禍？還不知道呢。」從這段可以推論，塞翁遇見事情時，有怎樣的詮釋習慣？
    options:
      A: 相信失馬之後可能會有好事，因此先忽略眼前的損失
      B: 把失馬當成老天安排，不再思考後續可能變化
      C: 暫時壓下所有難過情緒，假裝自己完全不受影響
      D: 不急著判定好壞，讓自己保持清醒，等待後續發展
    teacher_note: 第1題解析：塞翁沒有因失馬而過度悲傷，也沒有因得馬而得意忘形。由此可推論，他的想法使他能暫時保留判斷，保持清醒，等待事情的後續發展。
  - index: 2
    answer: B
    stem: 本文第6段說，羅伯茲的「反向祝福」和「塞翁失馬」有相通之處。兩者相通的地方是什麼？
    options:
      A: 都認為挫折本身值得追求，能使人獲得好的結果
      B: 都提醒人，不要只看當下的不順利，就急著下定論
      C: 都強調經歷多次失敗之後，人自然就會懂得珍惜
      D: 都說明人生主要靠運氣，努力和選擇並不那麼重要
    teacher_note: 羅伯茲的「反向祝福」和「塞翁失馬」都不是說壞事一定會變好，而是提醒人：眼前看似不順利的事，不一定只有負面意義，不要太快下定論。
  - index: 3
    answer: A
    stem: 本文第3段說「不必太早下定論」，第4段又說「想法會影響情緒與行動」。把這兩段合起來看，下列哪一種反應最符合作者的想法？
    options:
      A: 考差時先不要急著否定自己，可以想想哪裡還能調整
      B: 考差可能只是運氣不好，先等下一次成績再判斷
      C: 考差後先不要往壞處想，成績自然會慢慢進步
      D: 考差時先避免談論成績，等心情平靜後再處理
    teacher_note: '這兩段最符合作者想法的是：先不要急著否定自己，再思考可以調整的地方。

      B把文章誤解成「一定會變好」

      C把重點誤解成壓抑情緒

      D則偏向逃避'
  - index: 4
    answer: C
    stem: 本文後半舉出新冠肺炎和羅伯茲「反向祝福」的例子，最主要是為了達成哪一種寫作效果？
    options:
      A: 把例子放到社會與文化，證明壞事最後都會變好
      B: 把內容放到社會與文化，補充疫情與演講資料
      C: 把道理放到社會與文化，說明壞事也可能帶來轉機
      D: 把主題放到社會與文化，改談經濟發展與演講
    teacher_note: 把「塞翁失馬」的道理放到不同情境中，使觀點更清楚、更有說服力。
  - index: 5
    answer: D
    stem: 你上台報告時太緊張，講得斷斷續續，下台後很沮喪。下列哪一種想法最符合本文觀點？
    options:
      A: 都是同學沒有提醒我，這次講不好不能怪自己
      B: 我果然不適合上台報告，以後能避開就避開
      C: 這次只是運氣不好，下次可能自然會講得更順
      D: 我可以想想哪裡講得不順，整理內容後再多練習
    teacher_note: D不是否定自己，也不是等待壞事自然變好，而是從挫敗中看見問題，思考可以調整的方法，最符合本文觀點。
