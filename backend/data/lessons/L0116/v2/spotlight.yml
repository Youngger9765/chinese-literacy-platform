spotlight:
  lesson: G8-L19
  strategy_name: 寫作手法-用故事和例子支持觀點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: '本文透過故事和例子提醒我們：遇到挫敗時，不要太快認定事情只有壞的一面；先穩住心，換個角度看，可能會發現轉機或成長。

      讀這類文章時，不能只看故事或例子，還可學到：作者如何使用故事和例子，讓文章的觀點更清楚、更有說服力？'
  - type: guide
    text: 一、看故事轉折，讀出道理
  - type: free_text
    prompt: 1.從塞翁故事看福禍轉折，請先根據課文完成表格
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 2.看完上表，這個故事讓我們明白什麼？
    options:
    - 眼前看似幸運的事，通常會一直帶來好結果。
    - 遇到不幸時，只要耐心等待，事情自然會好轉。
    - 眼前看似福或禍，都不一定是最後定局。
    answer: 眼前看似福或禍，都不一定是最後定局。
  - type: guide
    text: 二、看人物對照：理解想法（詮釋）怎麼影響情緒和行動
  - type: free_text
    prompt: 1.小宇和塞翁怎麼看待不順利的事
  - type: guide
    text: 一件事發生後，我們會對它產生想法。這個想法，就是「詮釋」。
  - type: guide
    text: 不同的詮釋，可能帶來不同的情緒和行動。請根據課文勾選答案。
  - type: single
    prompt: 2.從小宇和塞翁的比較，可以看出作者想提醒我們什麼？
    options:
    - 遇到不順利的事，情緒主要由事情本身決定。
    - 同樣遇到不順利的事，不同的詮釋，會帶來不同的情緒和行動。
    answer: 同樣遇到不順利的事，不同的詮釋，會帶來不同的情緒和行動。
  - type: guide
    text: 三、看例子：找共同點
  - type: free_text
    prompt: 1.看例子的一開始和後來變化
  - type: guide
    text: 作者把這個道理放到不同情境中說明。
  - type: guide
    text: 請完成表格，看看這些情境前後有什麼共同變化。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 2.共同變化：上表中的例子，共同想說明什麼？
    options:
    - 眼前的不順利不一定是最後結果，換個角度看，可能發現轉機或成長
    - 遇到不順利時，先等待事情自行改變，比採取行動更重要。
    - 只要保持樂觀，就可以忽略挫敗帶來的問題和影響。
    answer: 眼前的不順利不一定是最後結果，換個角度看，可能發現轉機或成長
  - type: guide
    text: 四、連回觀點：判斷故事和例子的作用
  - type: passage
    source: unknown
    paragraphs:
    - 本文透過故事和例子支持的主要觀點是：遇到挫敗時，不必太快認定事情只有壞的一面；先穩住心，換個角度看，可能會發現轉機或成長。
  - type: guide
    text: 作者最後再進一步提出行動建議：看見問題後，還可調整方法。
  - type: free_text
    prompt: 1. 請判斷前面的故事和例子，分別支持主要觀點的哪一個面向。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 2.這些故事和例子合起來，有什麼作用？
    options:
    - 它們分別從「事情未定、想法影響、換角度有轉機」三個面向，支持主要觀點。
    - 它們主要用來增加故事與背景資料，即使刪除，也不影響作者觀點的說服力。
    answer: 它們分別從「事情未定、想法影響、換角度有轉機」三個面向，支持主要觀點。
  - type: self_check
    items:
    - 我能判斷故事和例子，是如何支持作者的觀點。
    - 我能把多個例子合起來看，找出它們共同支持的意思。
    - 下次讀到「用故事或例子說明觀點」的文章時，我會問自己：這些故事和例子怎麼讓作者的觀點更清楚、更有說服力？
