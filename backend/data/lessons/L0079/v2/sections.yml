vocab_definitions:
  items:
  - index: 1
    word: 祈請
    definition: 十分誠懇的請求。
  - index: 2
    word: 拮据
    definition: 指生活貧困、經濟困難。
  - index: 3
    word: 與日俱增
    definition: 隨著時間不斷增加。
  - index: 4
    word: 雪上加霜
    definition: 降雪過多，又降霜，造成農作物雙重傷害。比喻在糟糕的情況下，又發生新的不幸，讓狀況更困難。相反詞是「錦上添花」。
  - index: 5
    word: 聯手
    definition: 共同合作。
  - index: 6
    word: 哄騙
    definition: 用溫和的言語、行動或謊言對兒童或病人進行安撫、欺騙。
  - index: 7
    word: 諮詢
    definition: 向專業人士請教意見或建議。
  - index: 8
    word: 秋祺
    definition: 通常放在書信結尾，祝福收信人秋日安好。季節不同可用春祺、夏祺、冬祺；「時祺」則不分季節都可以用。
  - index: 9
    word: 病識感
    definition: 生病時，對自己病情的認知和接受程度。
