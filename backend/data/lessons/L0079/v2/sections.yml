comprehension:
  questions:
  - index: 1
    answer: B
    stem: 下列語詞，何者使用正確？
    options:
      A: 多虧善心路人真誠的「拐騙」，小女孩才終於停止哭泣
      B: 阿公向營養師「諮詢」飲食建議後，才了解平常都吃太鹹了
      C: 他不僅錄取了柔道隊，還獲得學長的肯定，真是「雪上加霜」D.在美麗的燈光與柔和的音樂中，他們夫妻「聯手」走進會場
    rationale: null
  - index: 2
    answer: A
    stem: 根據文章，為什麼作者要用寫信的方式表達？
    options:
      A: 讓阿嬤不會因為被拐騙而有金錢損失
      B: 讓阿嬤在外面行動時有法院的人員保護
      C: 讓家人可以知道阿嬤生活的一舉一動
      D: 向社區宣告，讓大家知道阿嬤生病了
    rationale: 從前後文可看出有作者和妹妹的「居中協調」會降低衝突次數，因此最能降低衝突的應該是C選項
  - index: 5
    answer: D
    stem: 根據文章判斷，若雷醫師回應了作者的請求，下列何者最可能發生？
    options:
      A: 阿嬤診斷的結果為精神與行為皆正常，返家休養
      B: 阿公被要求一起接受診斷治療，協助兩人相處
      C: 醫院直接報警，指出阿嬤是偷竊腳踏車的兇手
      D: 根據最後作者提出的要求「開立診斷證明，向法院申請監護宣告」，與A矛盾，而「向社工師諮詢」則符合D的情境。
    rationale: 根據最後作者提出的要求「開立診斷證明，向法院申請監護宣告」，與A矛盾，而「向社工師諮詢」則符合D的情境。
    is_rationale: true
