spotlight:
  lesson: G7-L11
  strategy_name: 從事實歸納概念-從具體事實提取上位概念
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: '寫作時，作者常用具體事實或例子來說明一個概念；閱讀時，我們則要反過來，把多個具體事實的細節合起來，提取出這些具體事實共同顯示的上位概念。這樣才能不只看見細節，還能讀懂整體。來看底下這兩個定義：具體事實：文章中看得到的時間、數量、行為或事件。

      上位概念：把多個事實合起來說出的整體意思，例如「負擔沉重」「症狀惡化」。'
  - type: passage
    source: unknown
    paragraphs:
    - 以下讓我們先練習用常見的「具體事實」提取出「上位概念」，注意，上位概念可以是名詞，也可以是形容詞。
  - type: table
    rows:
    - - 具體、可觀察的各種事實
      - 在最右欄選出適當的上位概念填入【】
    - - '示例：

        他早睡早起，每天慢跑，會留意自己一天水分的攝取，而且完全不碰含糖飲料。'
      - '示例：

        他很注意自己的【】'
      - '名詞：

        ①基礎建設

        ②安全

        ③健康

        ④多樣性

        ⑤交通通訊

        ⑥適應力'
    - - 1.剛轉學時，小凱人地不熟，但他主動交朋友、了解新學校的規定，現在已習慣新生活了。
      - 小凱展現很強的【】
      - '名詞：

        ①基礎建設

        ②安全

        ③健康

        ④多樣性

        ⑤交通通訊

        ⑥適應力'
    - - 2.強烈地震後，○○鎮無法對外聯絡，橋樑崩塌、鐵公路不通、機場關閉、4.3萬戶停電。
      - '○○鎮的【】

        已經陷入孤立'
      - '名詞：

        ①基礎建設

        ②安全

        ③健康

        ④多樣性

        ⑤交通通訊

        ⑥適應力'
    - - 3.班上有人擅長運動，有人喜歡畫畫，有人善於計算，有人領導力佳，有人表達能力很好。
      - '班上同學的特質

        具有【】'
      - '名詞：

        ①基礎建設

        ②安全

        ③健康

        ④多樣性

        ⑤交通通訊

        ⑥適應力'
    - - 4.今天的回家作業有國文習作、數學課本、英文造句、自然複習卷，各科難度都很高。
      - '今天的回家作業

        非常【】'
      - '形容詞：

        ①利弊並存

        ②繁重

        ③高科技

        ④謹慎

        ⑤困難

        ⑥聰明'
    - - 5.手機可以溝通、搜尋、看影片、玩遊戲、照相……，但它也使人們付出視力衰退的代價。
      - '手機是一種

        【】的設備'
      - '形容詞：

        ①利弊並存

        ②繁重

        ③高科技

        ④謹慎

        ⑤困難

        ⑥聰明'
    - - 6.小安過馬路會先看左右來車；交卷時會逐題檢查答案；網購前會先比較價格和評價。
      - '小安是一個非常

        【】的人'
      - '形容詞：

        ①利弊並存

        ②繁重

        ③高科技

        ④謹慎

        ⑤困難

        ⑥聰明'
    answers:
    - ３
    - ⑥
    - ⑤
    - ④
    - ②
    - ①
    - ④
  - type: guide
    text: 二、接著回到本課課文，下表整理了第二、三段所描述的具體事實，作者想要表達什麼上位概念？
  - type: table
    rows:
    - - 比較面向
      - 約5年前
      - 一年多前
      - 今年年初起
      - 情況的變化
    - - 1.影響範圍
      - 主要影響家中的阿公
      - 主要影響家中的阿公
      - '到銀行大鬧，

        驚動警方'
      - '①範圍變大

        □②範圍變小'
    - - 2.發生頻率
      - 2～3天一次
      - 1～2天一次
      - 每天2～3次
      - '①頻率變高

        □②頻率變低'
    - - 3.持續時間
      - 約1個鐘頭
      - 2～3個鐘頭
      - 2～4個鐘頭
      - '①時間變長

        □②時間變短'
    - - 4.行為方式
      - 怪罪、責罵
      - 怪罪、責罵
      - 揮菜刀、丟尖銳物
      - '①危險性變高

        □②危險性變低'
  - type: single
    prompt: 5.作者想要描述的上位概念是？答：【 ①精神症狀 □②性格特質　】
    options:
    - 答：【 ①精神症狀
    - 性格特質
    - 】
    answer: 答：【 ①精神症狀
  - type: single
    prompt: 6.阿嬤的情況隨著時間如何變化？答：阿嬤愈來愈【□①痛苦  ②嚴重】
    options:
    - 答：阿嬤愈來愈【
    - 痛苦
    - 嚴重】
    answer: 答：阿嬤愈來愈【
  - type: free_text
    prompt: 7.綜合第5、6題，用一句話整合第二、三段的上位概念，寫在【  】中：
  - type: passage
    source: unknown
    paragraphs:
    - 上位概念：隨著時間，阿嬤的【   精神症狀    】愈來愈【    嚴重  】。
  - type: guide
    text: 三、下表整理了第四段描述的具體事實，作者想要表達什麼上位概念？
  - type: table
    rows:
    - - 第四段的各種事實
      - 想表達的上位概念
    - - 1.我們生活拮据……週末兩天，我每天打工時數超過十二小時……有時甚至到晚上九點才下班……妹妹的負擔也同樣沉重。
      - 我們  經濟及工作     的負擔非常沉重
    - - 2.阿公今年78歲了，沒有固定收入，表達也不清楚。
      - '阿公的狀況不佳，

        也無法解決阿嬤的問題

        □帶來阿嬤之外的新問題'
    - - 3.我們擔心阿嬤是否遭人控制，……，更害怕她被人拐騙簽寫契約或購物，而造成我們無法承擔的交易損失。如果她的病難以改善，後續的安置或照顧該怎麼辦？我們負擔得起嗎？
      - "我們對現況與未來非常\n   擔憂/害怕"
    - - 4.想到這些，我和妹妹常常哭泣，晚上難以入睡。
      - "這一切，都讓我們覺得\n  無助/不知怎麼辦"
  - type: free_text
    prompt: 5.請把第1~4題右欄的上位概念整合在一起，成為第四段的上位概念。
  - type: guide
    text: 答：  我們經濟及工作的負擔非常沉重，阿公的狀況不佳，也無法解決阿嬤的問題。我們對現在及未來非常擔憂，這一切都讓我們覺得無助。
