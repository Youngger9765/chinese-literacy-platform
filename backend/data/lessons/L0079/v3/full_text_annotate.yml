    paragraph_split: "段號欄印 **7 個號碼**（ㄧ二三四五六七），但課文儲存格裡有 **14 個 `w:p`**。對應關係：\n・`w:p[0]` 雷醫師您好：           → salutation（未編號）\n・`w:p[3]+[4]`                    → 第 3 段（「…必須用哄」／「騙的方式…」是同一段被換行拆開，\n                                    「哄騙」一詞跨行斷開）\n・`w:p[7]+[8]+[9]`                → 第 6 段（「…幫忙我們兩件事：」與它引出的「一、」「二、」兩項）\n・`w:p[11][12][13]` 秋祺／署名／日期 → closing（未編號）\n這樣剛好 7 段。⛔ 不要把「一、開立診斷書」「二、協助我們聯繫社工師」當成獨立段落 ——\n那會變成 9 段，跟印出來的 7 個號碼對不上，念順順的 ☞ 索引就會偏。"
    char_count: '🔴 **本課的字數欄是「逐行」不是「逐段」的，段界不會落在數字上** —— 跟 L0076／L0078 相反。

      實測：第 2 段 268 字，但 268 不在印出來的數字裡（最接近的是 258 與 286）。

      第 2 段＋第 3 段前半（`w:p[3]`，147 字）＝ 415；再加後半（`w:p[4]`，12 字）＝ 427。

      印出來的最後一個數字 **417** 落在 415 與 427 之間，也就是第 3 段最後一行的中途。

      ⛔ 所以**不能拿這欄反推段界**（skill §⑥.7 的警告在本課成立）。段界的依據是段號欄印的 7 個號碼。

      朗讀範圍：第 2~3 段，印出的累計字數 417。'
