lesson_uid: L0079
version_id: v3
section_no: 六
spotlight:
  strategy_name: 從具體事實提取上位概念
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）與橘色手寫字，PDF p8~p9 可見
  structure_note: '⛔ 三張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '寫作時，作者常用具體事實或例子來說明一個概念；閱讀時，我們則要反過來，把多個具體事實的細節合起來，提取出這些具體事實共同顯示的上位概念。這樣才能不只看見細節，還能讀懂整體。來看底下這兩個定義：具體事實：文章中看得到的時間、數量、行為或事件。

      上位概念：把多個事實合起來說出的整體意思，例如「負擔沉重」「症狀惡化」。'
  - type: fill_table
    prompt: 一、以下讓我們先練習用常見的「具體事實」提取出「上位概念」，注意，上位概念可以是名詞，也可以是形容詞。
    columns:
    - 具體、可觀察的各種事實
    - 在最右欄選出適當的上位概念填入【　】
    - 上位概念選項
    answer_carrier: 橘色手寫的圈碼（①~⑥），PDF p8 可見
    option_bank_note: '🔴 **兩組選項各自獨立編號**：第 1~3 題用「名詞」那組，第 4~6 題用「形容詞」那組。

      同一個圈碼在兩組是不同答案（④在名詞組是「多樣性」、在形容詞組是「謹慎」）。

      原稿把兩組分別印在第 2 列與第 6 列的最右欄，中間用一條粗線分開。'
    rows:
    - 具體、可觀察的各種事實: '示例：

        他早睡早起，每天慢跑，會留意自己一天水分的攝取，而且完全不碰含糖飲料。'
      在最右欄選出適當的上位概念填入【　】: '示例：

        他很注意自己的【　】'
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ３
      上位概念選項: '名詞：

        ①基礎建設

        ②安全

        ③健康

        ④多樣性

        ⑤交通通訊

        ⑥適應力'
    - 具體、可觀察的各種事實: 1.剛轉學時，小凱人地不熟，但他主動交朋友、了解新學校的規定，現在已習慣新生活了。
      在最右欄選出適當的上位概念填入【　】: 小凱展現很強的【　】
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ⑥
    - 具體、可觀察的各種事實: 2.強烈地震後，○○鎮無法對外聯絡，橋樑崩塌、鐵公路不通、機場關閉、4.3萬戶停電。
      在最右欄選出適當的上位概念填入【　】: '○○鎮的【　】

        已經陷入孤立'
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ⑤
    - 具體、可觀察的各種事實: 3.班上有人擅長運動，有人喜歡畫畫，有人善於計算，有人領導力佳，有人表達能力很好。
      在最右欄選出適當的上位概念填入【　】: '班上同學的特質

        具有【　】'
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ④
    - 具體、可觀察的各種事實: 4.今天的回家作業有國文習作、數學課本、英文造句、自然複習卷，各科難度都很高。
      在最右欄選出適當的上位概念填入【　】: '今天的回家作業

        非常【　】'
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ②
      上位概念選項: '形容詞：

        ①利弊並存

        ②繁重

        ③高科技

        ④謹慎

        ⑤困難

        ⑥聰明'
    - 具體、可觀察的各種事實: 5.手機可以溝通、搜尋、看影片、玩遊戲、照相……，但它也使人們付出視力衰退的代價。
      在最右欄選出適當的上位概念填入【　】: '手機是一種

        【　】的設備'
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ①
    - 具體、可觀察的各種事實: 6.小安過馬路會先看左右來車；交卷時會逐題檢查答案；網購前會先比較價格和評價。
      在最右欄選出適當的上位概念填入【　】: '小安是一個非常

        【　】的人'
      在最右欄選出適當的上位概念填入【　】_blanks:
      - answer: ④
  - type: fill_table
    prompt: 二、接著回到本課課文，下表整理了第二、三段所描述的具體事實，作者想要表達什麼上位概念？
    columns:
    - 比較面向
    - 約5年前
    - 一年多前
    - 今年年初起
    - 情況的變化
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），PDF p8 可見
    rows:
    - 比較面向: 1.影響範圍
      約5年前: 主要影響家中的阿公
      一年多前: 主要影響家中的阿公
      今年年初起: '到銀行大鬧，

        驚動警方'
      情況的變化: '☑①範圍變大

        □②範圍變小'
      情況的變化_options:
        1: 範圍變大
        2: 範圍變小
      情況的變化_answer: 1
    - 比較面向: 2.發生頻率
      約5年前: 2～3天一次
      一年多前: 1～2天一次
      今年年初起: 每天2～3次
      情況的變化: '☑①頻率變高

        □②頻率變低'
      情況的變化_options:
        1: 頻率變高
        2: 頻率變低
      情況的變化_answer: 1
    - 比較面向: 3.持續時間
      約5年前: 約1個鐘頭
      一年多前: 2～3個鐘頭
      今年年初起: 2～4個鐘頭
      情況的變化: '☑①時間變長

        □②時間變短'
      情況的變化_options:
        1: 時間變長
        2: 時間變短
      情況的變化_answer: 1
    - 比較面向: 4.行為方式
      約5年前: 怪罪、責罵
      一年多前: 怪罪、責罵
      今年年初起: 揮菜刀、丟尖銳物
      情況的變化: '☑①危險性變高

        □②危險性變低'
      情況的變化_options:
        1: 危險性變高
        2: 危險性變低
      情況的變化_answer: 1
  - type: single
    prompt: 5.作者想要描述的上位概念是？答：
    options:
      1: 精神症狀
      2: 性格特質
    answer: 1
  - type: single
    prompt: 6.阿嬤的情況隨著時間如何變化？答：阿嬤愈來愈
    options:
      1: 痛苦
      2: 嚴重
    answer: 2
  - type: free_text
    prompt: '7.綜合第5、6題，用一句話整合第二、三段的上位概念，寫在【　】中：

      上位概念：隨著時間，阿嬤的【　】愈來愈【　】。'
    blanks:
    - answer: 精神症狀
    - answer: 嚴重
  - type: fill_table
    prompt: 三、下表整理了第四段描述的具體事實，作者想要表達什麼上位概念？
    columns:
    - 第四段的各種事實
    - 想表達的上位概念
    answer_carrier: 橘色手寫字與紅色 ☑（w:sym），PDF p9 可見
    rows:
    - 第四段的各種事實: 1.我們生活拮据……週末兩天，我每天打工時數超過十二小時……有時甚至到晚上九點才下班……妹妹的負擔也同樣沉重。
      想表達的上位概念: 我們【　】的負擔非常沉重
      想表達的上位概念_blanks:
      - answer: 經濟及工作
    - 第四段的各種事實: 2.阿公今年78歲了，沒有固定收入，表達也不清楚。
      想表達的上位概念: '阿公的狀況不佳，

        ☑也無法解決阿嬤的問題

        □帶來阿嬤之外的新問題'
      想表達的上位概念_options:
        1: 也無法解決阿嬤的問題
        2: 帶來阿嬤之外的新問題
      想表達的上位概念_answer: 1
    - 第四段的各種事實: 3.我們擔心阿嬤是否遭人控制，……，更害怕她被人拐騙簽寫契約或購物，而造成我們無法承擔的交易損失。如果她的病難以改善，後續的安置或照顧該怎麼辦？我們負擔得起嗎？
      想表達的上位概念: '我們對現況與未來非常

        【　】'
      想表達的上位概念_blanks:
      - answer: 擔憂/害怕
    - 第四段的各種事實: 4.想到這些，我和妹妹常常哭泣，晚上難以入睡。
      想表達的上位概念: '這一切，都讓我們覺得

        【　】'
      想表達的上位概念_blanks:
      - answer: 無助/不知怎麼辦
  - type: free_text
    prompt: 5.請把第1~4題右欄的上位概念整合在一起，成為第四段的上位概念。
    answer: 我們經濟及工作的負擔非常沉重，阿公的狀況不佳，也無法解決阿嬤的問題。我們對現在及未來非常擔憂，這一切都讓我們覺得無助。
    answer_carrier: 橘色手寫字（PDF p9）；文字層已填有同樣的答案
  - type: self_check
    label: ◎自我檢核
    no_correct_answer: true
    answer_carrier: 學生自填，原稿四格皆為空 □（無 w:sym F0FE）
    items:
    - 我能讀到同一段裡各種具體的細節
    - 我能提取各個具體細節共同要表達的上位概念
    - 我可以找一個適當的詞彙，為這個上位概念命名
    - 我知道這個上位概念可能是名詞，也可能是形容詞
