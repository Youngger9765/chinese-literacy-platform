intro: 這篇文章是一封孫女寫給醫師的信，她和妹妹共同扶養年邁的阿嬤。阿嬤近期出現了許多令人擔憂的行為，例如頻繁對阿公發脾氣、指控阿公偷錢，甚至到銀行鬧事。此外，阿嬤也常遺失物品，甚至有不明原因的花費。由於阿嬤沒有病識感，家人在帶她就醫時也面臨困難。孫女在信中詳細描述了阿嬤的症狀，以及家中經濟和照顧上的壓力，並向醫師尋求協助，希望能獲得診斷書以聲請監護宣告，同時也希望醫師能協助聯繫社工師，了解後續的照顧與資源。
