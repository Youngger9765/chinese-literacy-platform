strategy_explained: '這一課要練習的是，從別人寫的具體事情裡，找出他真正想要傳達的「重點」

  因為這封信裡，孫女不只告訴醫師阿嬤的種種狀況，還說明了家裡的經濟和照顧壓力，這都讓她很難照顧阿嬤，所以她需要醫師的診斷書來聲請監護宣告，也希望醫師能幫忙找社工，來解決問題

  所以讀的時候，你要試著看看，除了事情本身，寫信的人還想要求什麼、希望怎麼解決，這樣你就能學會怎麼把事情講清楚，並找到解決問題的方法'
