lesson_uid: L0079
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p10~p11）；文字層的（　）內已填有同樣的代號
  items:
  - index: 1
    answer: B
    stem: 下列語詞，何者使用正確？
    options:
      A: 多虧善心路人真誠的「拐騙」，小女孩才終於停止哭泣
      B: 阿公向營養師「諮詢」飲食建議後，才了解平常都吃太鹹了
      C: 他不僅錄取了柔道隊，還獲得學長的肯定，真是「雪上加霜」
      D: 在美麗的燈光與柔和的音樂中，他們夫妻「聯手」走進會場
    explanation: A.與真誠矛盾、C雪上加霜是指負面情境、D應為攜手。
    explanation_note: 原稿是一個浮動說明框，印在題目右上方
  - index: 2
    answer: A
    stem: 根據文章，為什麼作者要用寫信的方式表達？
    options:
      A: 作者在臺東讀大學，無法陪伴阿嬤就醫
      B: 作者口語表達能力不佳，擔心說明不清楚
      C: 阿嬤沒有病識感，所以作者先寫信偷偷告訴醫師
      D: 因為作者諮詢過懂法律的人，那人建議寫信
    explanation: (第一段有提到)
    explanation_note: 原稿印在選項 A 之後，斜體小字
  - index: 3
    answer: C
    stem: 請從信件中第二段推論，作者的「居中協調」，可能是指什麼作為或行動？
    options:
      A: 在阿嬤怪罪阿公時，擋在他們中間
      B: 向阿公、阿嬤抱怨自己和妹妹的困難
      C: 在阿嬤對阿公發脾氣時，努力安撫阿嬤
      D: 在醫院和家庭間協調，讓阿嬤願意就醫
    explanation: （從前後文可看出有作者和妹妹的「居中協調」會降低衝突次數，因此最能降低衝突的應該是C選項)
    explanation_note: 原稿是一個浮動說明框；左括號用全形、右括號用半形，照原樣保留
  - index: 4
    answer: A
    stem: 請從信件中上下文推論，作者在第五、六段提及想獲得法院的「監護宣告」，最可能的目的是下列何者？
    options:
      A: 讓阿嬤不會因為被拐騙而有金錢損失
      B: 讓阿嬤在外面行動時有法院的人員保護
      C: 讓家人可以知道阿嬤生活的一舉一動
      D: 向社區宣告，讓大家知道阿嬤生病了
    explanation: (文中有提及，作者希望申請監護宣告是為了「保護阿嬤也保護家人」，而根據前後文發生的狀況，A選項的保護應該最貼近阿嬤與家人的需求。
    explanation_note: 原稿是一個浮動說明框，左括號沒有對應的右括號，照原樣保留
  - index: 5
    answer: D
    stem: 根據文章判斷，若雷醫師回應了作者的請求，下列何者最可能發生？
    options:
      A: 阿嬤診斷的結果為精神與行為皆正常，返家休養
      B: 阿公被要求一起接受診斷治療，協助兩人相處
      C: 醫院直接報警，指出阿嬤是偷竊腳踏車的兇手
      D: 開立阿嬤的診斷書，並請社工師聯繫作者
    explanation: (根據最後作者提出的要求「開立診斷證明，向法院申請監護宣告」，與A矛盾，而「向社工師諮詢」則符合D的情境。
    explanation_note: 原稿是一個浮動說明框，左括號沒有對應的右括號，照原樣保留
