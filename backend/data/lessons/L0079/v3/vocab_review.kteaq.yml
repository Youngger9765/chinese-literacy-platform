    target_words: 灰框 10 個詞，比本課語詞（9 個）多一個「錦上添花」—— 它是第三大題「雪上加霜」定義裡寫的相反詞。
    answer_paths: '10 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。

      幾何交叉驗證（單向警報）：以找字表格元素當邊界，表格內、扣掉紙外殘留後的 roundRect

      = **10 個**（全文也是 10），路徑 10 條 → 沒有「紙上 > 路徑」的缺條警報。

      ⚠️ **紙外殘留：未驗**（判準只認錨點型溢出，對排版推出型零命中，2026-08-18 更正）；

      扣掉未偵測的殘留只會讓紙上數更少，不會讓警報成立。正確性證據是拼字 10/10。

      ⚠️ **格子跨頁**：第 1~2 列印在 PDF p11、第 3~10 列印在 p12。

      p11 上只看得到「哄騙」一個圈，其餘九個都在 p12 —— 只讀 p12 會漏掉「哄騙」，

      只讀 p11 會判成「這課只圈了一個」。兩頁都要讀。'
