lesson_uid: L0079
version_id: v3
section_no: 五
keypoints:
  title: 一封向醫師求助的信
  layout: list
  columns_printed:
  - 寫作目的
  - 信件內容
  columns_printed_note: '原稿表格第 2 列印的欄名就是 label／value 兩欄，故用 list 佈局。

    中段「說明困難與具體事例」在原稿是一張三欄時間對照的巢狀小表

    （約5年前／一年多前／今年年初），依 skill §⑥.55b「三層以上攤平成 items」處理：

    每個比較面向一個 item，三個時間欄用**換行**分隔寫進 value（不自創分隔符號）。'
  answer_carrier: 橘色手寫字（PDF p5~p7）；文字層的【　】內已填有同樣的答案
  layout_note: '⚠️ 這張表在 PDF 上被 LibreOffice 攤平成一堆散行（p5~p7 看起來像壞掉的清單），

    儲存格邊界完全消失。表格結構以 document.xml 的 `w:tbl` 為準。'
  rows:
  - label: 說明來信目的
    items:
    - label: '1'
      value: 說明阿嬤就醫前的症狀，希望對【　】有所幫助。
      blanks:
      - answer: 診斷治療
    - label: '2'
      value: 說明阿嬤症狀帶來的困難，希望醫師提供幫助。
  - label: 說明困難與具體事例
    sub_columns_printed:
    - 困難
    - 具體事例
    items:
    - label: 亂發脾氣・發生時間
      value: '【　】年前

        一年多前

        今年年初'
      blanks:
      - answer: 五
    - label: 亂發脾氣・對象
      value: '【　】

        阿公

        阿公、【　】'
      blanks:
      - answer: 阿公
      - answer: 銀行
    - label: 亂發脾氣・發生頻次
      value: '2~3天一次

        1~2天一次

        每天2~3次'
    - label: 亂發脾氣・持續時間
      value: '1鐘頭

        2~3個鐘頭

        【　】個鐘頭'
      blanks:
      - answer: 2~4
    - label: 亂發脾氣・方式
      value: '怪罪、責罵

        大鬧、揮菜刀、丟尖銳物'
      value_note: 原稿「怪罪、責罵」跨前兩個時間欄（合併儲存格），所以這一列只有兩格。
    - label: 遺失物品・物品
      value: (1)遺失【　】和鄰居的【　】
      blanks:
      - answer: 機車
      - answer: 腳踏車
    - label: 遺失物品・金錢
      value: 數萬元現金不知去向
    - label: 就醫
      value: 阿嬤沒有【　】，不知道自己生病，不願就醫，
      blanks:
      - answer: 病識感
    - label: 經濟與照顧的負擔
      value: '(1)家境不好，作者與妹妹忙於【　】。

        (2)阿公無固定收入。

        (3)擔心阿嬤的行為造成經濟損失。

        (4)擔心若阿嬤無法改善，未來的照顧問題。'
      blanks:
      - answer: 打工
      value_note: '(3)(4) 兩項在文字流裡各有一段印不出來的隱藏文字（`w:vanish`：`(3(` 與 `(` ），

        本欄採印出來的樣子。詳見檔頭。'
  - label: 說明具體請求
    items:
    - label: '1'
      value: 請求醫師開立【　】，我們要向法院聲請監護宣告。
      blanks:
      - answer: 診斷書
    - label: '2'
      value: 請求醫師協助聯繫【　】，我們要諮詢相關問題。
      blanks:
      - answer: 社工師
  - label: 感謝與祝福
    items:
    - label: '1'
      value: 感謝提供病床，讓阿嬤【　】。
      blanks:
      - answer: 住院
    - label: '2'
      value: 敬祝【　】。
      blanks:
      - answer: 秋祺
