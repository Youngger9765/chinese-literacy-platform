  passage: 我和妹妹是阿公阿嬤養大的，爸媽在我們小時候就離開了，家裡就只有四個人。約莫5年前，阿嬤開始會時常莫名對阿公發脾氣、怪罪阿公年輕時對她有多壞，頻率2~3天一次，每次約1個鐘頭。一年多前，我離家求學，妹妹多數時間在外打工，家裡少了我們居中協調，阿嬤發脾氣的次數與日俱增，增加為1~2天一次，每次2~3個鐘頭。更嚴重的是，從今年年初開始，阿嬤開始指控阿公偷她的錢，甚至認為阿公與銀行聯手騙她，因此跑到數間銀行大鬧，多次因有人報警而被帶離現場。此時，阿嬤發脾氣的頻率已攀升到每天2~3次，每次2~4個鐘頭，近來甚至會揮舞菜刀、朝阿公丟尖銳物品。
