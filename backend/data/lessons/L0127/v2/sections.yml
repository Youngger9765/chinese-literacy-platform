comprehension:
  questions:
  - index: 1
    answer: B
    stem: 第2段寫道：「他們一下火車，在月台上面臨與家人生離死別的『篩選』。」根據這句話的語意，「篩選」最可能強調的是什麼？
    options:
      A: 人數龐大不易辨識，因此用編號管理以便點名與管控
      B: 生活規定十分嚴格，所以每個人都必須維持外表整潔
      C: 以編號取代姓名，把人變成數字並抹去身分與尊嚴
      D: 為了避免疾病傳播，所以要求剃髮並完成身分記錄
    rationale: 第2題解析：作者特別寫「姓名被編號取代」，重點不只是效率或衛生，而是把人變成數字，削弱個體身分與尊嚴。
  - index: 3
    answer: B
    stem: 他把考卷摺了又摺，想把那些腥紅叉叉藏進書包。回家的路好長，連風吹樹葉聲，都像是在嘲笑。即使如此，回家後他仍翻開考卷，把錯的題目重新算了一遍。文中的「即使」最想凸顯的是什麼？
    options:
      B: 例子越特別→ 讀者越感動→ 主旨越顯得正確
      C: 多個例子指向同一概念→ 概念共同支撐主旨→ 主旨更站得住
      D: 先講出主旨→ 再補充故事→ 讀者更容易記住內容
      A: 場景越驚悚→ 情緒越強烈→ 主旨越容易被接受
    rationale: B「即使」引出讓步轉折，強調「條件不利（挫敗、低落）仍做出選擇（重新整理、行動）」
  - index: 5
    answer: B
    stem: 運動會前，你被同學嘲笑「你根本不配參加比賽」。若用文中法蘭柯所說「我可以決定用什麼態度回應」，下列哪個做法最符合？
    options:
      A: 覺得對方說得有道理，決定先退出比賽，避免再被嘲笑
      B: 承認自己會難過，但不把嘲笑當成真相，繼續準備並尋求支持
      C: 當場用更刺的話回嗆對方，讓他閉嘴，維持自己的面子
      D: 裝作完全不在乎這件事，把情緒吞下去，硬撐到結束
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
