  - label: 問題（段1）
    value: 遇上__的壞事，人還可能過著__嗎？
    blanks:
    - answer: 不可逆轉
      hint: ''
    - answer: 有意義的人生
      hint: ''
  - label: 背景（段2-4）
    value: '二戰期間，德國的種族迫害使猶太人被送往__；法蘭柯全家被捕並在月台面臨__。

      2.青壯年被挑選進營區成為__；老人、小孩與病人往往__，被屠殺。

      3.在生不如死的煎熬裡，法蘭柯卻親眼看見人的__。'
    blanks:
    - answer: 集中營
      hint: ''
    - answer: 篩選
      hint: ''
    - answer: 奴工
      hint: ''
    - answer: 在劫難逃
      hint: ''
    - answer: 心理韌性
      hint: ''
  - label: 例子與道理（段5-9)
    value: '1.仍分享最後一口麵包：情況壞到極點，人仍能決定自己__的高度。

      2.獄卒辱罵羞辱：我們不能阻止別人說什麼，但可以選擇不讓__定義自己。

      3.女子將死仍感恩：在死亡前一刻，有人能靠智慧、想像而感受到__。

      4.寒夜長途跋涉：靠著愛與期待，受苦的人仍能得到__，保有__。

      5.仍看見黎明之美：人仍保有對__的感受力，並因此並獲得片刻的__。'
    blanks:
    - answer: 道德與品格
      hint: ''
    - answer: 謊言
      hint: ''
    - answer: 平靜與恩典
      hint: ''
    - answer: 鼓舞
      hint: ''
    - answer: 內在自由
      hint: ''
    - answer: 美
      hint: ''
    - answer: 心靈自由
      hint: ''
  - label: 總結主旨(段10)
    value: '1.外在一切可能被奪走，但仍能決定用什麼__回應遭遇。

      2.提出意義治療法，幫助人找到__，踏出可以前進的下一步。'
    blanks:
    - answer: 態度
      hint: ''
    - answer: 支撐自己的理由
      hint: ''
  title: 當壞事已不可逆轉：集中營裡的一門課
