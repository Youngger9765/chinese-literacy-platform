strategy_explained: '這一課我們要練習的是，怎麼看懂作者用真實的經歷和道理，來一層一層說服我們他想講的重點

  這篇文章講了法蘭柯在集中營的親身遭遇，但不是單純說故事，而是透過這些例子，讓我們明白即使在最黑暗的地方，人也能找到尊嚴和意義

  讀的時候，你可以試著把作者講的故事（例子）和他說明的道理（意義）連結起來，看看它們是怎麼一起把文章的主題（主旨）撐起來的'
