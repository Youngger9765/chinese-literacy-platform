lesson_uid: L0127
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    stem: 第2段寫道：「他們一下火車，在月台上面臨與家人生離死別的『篩選』。」根據這句話的語意，「篩選」最可能強調的是什麼？
    options:
      A: 家人被要求各自排隊，按規定分流到不同車廂等待
      B: 當場被決定生死去向，家人因此被迫立刻生離死別
      C: 工作人員逐一核對資料，確認身分後再安排住宿地點
      D: 醫護人員依健康狀況檢查，協助病弱者優先接受照顧
    answer: B
    explanation: 第1題解析：「生離死別」暗示這不是普通分流或檢查，而是外在權力在月台上「一決定就改變命運」，導致家人被迫立刻分離
  - index: 2
    stem: 第3段提到：「他們的頭髮被剃光、姓名被手臂刺青編號取代。」這樣的描寫最可能想強調什麼？
    options:
      A: 人數龐大不易辨識，因此用編號管理以便點名與管控
      B: 生活規定十分嚴格，所以每個人都必須維持外表整潔
      C: 以編號取代姓名，把人變成數字並抹去身分與尊嚴
      D: 為了避免疾病傳播，所以要求剃髮並完成身分記錄
    answer: C
    answer_note: PDF p9 上這一題的答案括號被解析方塊蓋住，看起來是空的；文字層印的是「（ C ）」
    explanation: 第2題解析：作者特別寫「姓名被編號取代」，重點不只是效率或衛生，而是把人變成數字，削弱個體身分與尊嚴。
  - index: 3
    stem: 他把考卷摺了又摺，想把那些腥紅叉叉藏進書包。回家的路好長，連風吹樹葉聲，都像是在嘲笑。即使如此，回家後他仍翻開考卷，把錯的題目重新算了一遍。文中的「即使」最想凸顯的是什麼？
    options:
      A: 風吹樹葉像在嘲笑，凸顯他回家路上的失落與敏感
      B: 考得再差，心情再壞，他仍選擇面對、解決問題
      C: 只要把錯題重算一次，下次考試就一定能進步
      D: 因為害怕被責備，所以只能假裝努力來掩飾失落
    answer: B
    explanation: B「即使」引出讓步轉折，強調「條件不利（挫敗、低落）仍做出選擇（重新整理、行動）」
  - index: 4
    stem: 根據本文的寫作手法，下列哪一個流程最能說明作者是怎麼用例子把主旨「撐起來」的？
    options:
      A: 場景越驚悚→ 情緒越強烈→ 主旨越容易被接受
      B: 例子越特別→ 讀者越感動→ 主旨越顯得正確
      C: 多個例子指向同一概念→ 概念共同支撐主旨→ 主旨更站得住
      D: 先講出主旨→ 再補充故事→ 讀者更容易記住內容
    answer: C
  - index: 5
    stem: 運動會前，你被同學嘲笑「你根本不配參加比賽」。若用文中法蘭柯所說「我可以決定用什麼態度回應」，下列哪個做法最符合？
    options:
      A: 覺得對方說得有道理，決定先退出比賽，避免再被嘲笑
      B: 承認自己會難過，但不把嘲笑當成真相，繼續準備並尋求支持
      C: 當場用更刺的話回嗆對方，讓他閉嘴，維持自己的面子
      D: 裝作完全不在乎這件事，把情緒吞下去，硬撐到結束
    answer: B
    explanation: 第5題解析：C承認「我會難過」很正常，同時把嘲笑視為「別人的話」而不是「我的定義」，再選擇繼續準備、尋求支持，這就是把主導權拿回來
    explanation_note: 解析文字開頭寫「C」，但題目印的答案是 B，且解析內容描述的正是 B 選項；原稿如此，不擅自改
  notes:
    answer_carrier: 橘色手寫代號（在文字層），PDF p9~p10 可見
