  passage: 難友每天最重要的餐，是一碗內容貧乏的湯。領湯時囚犯必須照規定「脫帽」領湯，用屈從的姿態領取施捨，獄卒還常辱罵：「你們根本不配喝這碗湯。」但法蘭柯發現，有些難友的情緒並不受影響，只說：「他們罵的不是事實，只是想羞辱我們，我為什麼要受假話影響？」原來，我們不能阻止別人說什麼，但可以選擇不讓謊言定義自己。一位年輕女子失去所有親人、即將離世。法蘭柯去看她時，她竟顯得十分平靜，甚至帶著愉快。她說：「感謝命運的重擊。以前我被寵壞了，沒想到周遭有這麼多值得感恩的事。」她指向窗外一段開著兩朵花的樹枝：「這是我唯一的朋友，我常跟它說話。」法蘭柯問：「樹會回你嗎？」她說：「會啊，樹告訴我：『我在，我在，我是生命，永恆的生命。』」原來，在死亡近在眼前，仍然有人能靠著智慧、想像而感受到平靜與恩典。
