multiple_choice:
- question: 根據本文，請問下列關於閱讀的敘述何者正確？
  options:
  - 閱讀是天生的能力，不需學習。
  - 閱讀能力越強，人際關係越好。
  - 讀得慢，會讓閱讀成效變更好。
  - 閱讀可以提升認知與學習能力。
  answer: D
  explanation: 本文作為一篇教導學生如何閱讀並判讀統計圖表的課文，其目的在於提升學生理解複雜資訊的能力，這本身就是認知與學習能力提升的體現。
- question: 臺灣在2022年PISA閱讀成績不減反增，請問可能的原因何者不正確?
  options:
  - 臺灣學校的停課時間相較他國更短。
  - 全國實施遠距教學，讓學習不間斷。
  - 臺灣的國家課綱看重學生自主學習。
  - 其他國家的學生素質較臺灣低落。
  answer: D
  explanation: 文中並未提到。
- question: 根據本文的PISA資料，以下敘述何者正確？
  options:
  - 圖1資料顯示，臺灣歷年閱讀分數的平均都低於參加國。
  - 臺灣城鄉學生的閱讀能力，有明顯的差距。
  - 圖1資料顯示，參加國的閱讀成績越來越高，臺灣卻越來越低。
  - 圖2資料顯示，臺灣學生的閱讀分數排名越來越差。
  answer: A
  explanation: 本文主要內容在於介紹如何判讀統計圖表，並以臺灣新生兒性別比、人口成長變化、家庭可支配所得成長率及婦女累積生育數等數據作為範例。課文中並未提供任何關於PISA（國際學生能力評量計畫）的數據、圖表或相關討
