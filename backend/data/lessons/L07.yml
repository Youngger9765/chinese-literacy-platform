vocabulary:
- word: 迷霧
  definition: 形容霧濃到分不清方向。
- word: 卸下心防
  definition: 不再防備某個人或某件事。
- word: 崎嶇
  definition: 山路或地面高低不平，有時候也比喻人生艱難。
- word: 舉世聞名
  definition: 形容名氣很大，全世界都知道。舉世，全世界。
- word: 行囊
  definition: 出外或旅行帶的行李袋。囊，袋子。
- word: 馬不停蹄
  definition: 馬不停的往前走，形容到處奔走，非常忙碌。
- word: 夢寐以求
  definition: 睡夢中都在尋找、追求，形容願望很強烈。寐，睡著。
- word: 掛慮
  definition: 心裡掛念、不放心。
- word: 深不可測
  definition: 深到無法測量，形容非常深遠，很難預測。
- word: 拒人於千里之外
  definition: 在千里以外就將人擋住，形容堅決拒絕別人。也可以形容人態度傲慢或沒有商量的餘地。
- word: 迅疾如風
  definition: 行動迅速像風一樣快速。
