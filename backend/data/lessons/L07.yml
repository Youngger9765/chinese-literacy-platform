  answer: Ｅ
multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 小雅騎車跌倒，膝蓋在柏油路上摩擦受傷，傷口「深不可測」。
  - 小麗參加運動會的百公尺短跑，「馬不停蹄」的奪得第一名。
  - 小洛因為口渴，便到冰箱隨手拿了一瓶「夢寐以求」的水來喝。
  - 爸媽時常「掛慮」離家住校的小成，擔心他飲食或作息不夠正常。
  answer: D
  explanation: 「掛慮」指的是心裡掛念、不放心，選項D中爸媽擔心離家住校的孩子，符合這個語詞的意義。
- question: 根據本文第六段，為什麼珍古德能確認黑猩猩和她交心了呢？
  options:
  - 黑猩猩撇開臉是因為害羞，代表牠接受了珍古德。
  - 黑猩猩用動作示意，珍古德因此了解牠不喜歡紅堅果。
  - 雖然黑猩猩不要堅果，卻依舊做出握手示好的動作。
  - 雖然黑猩猩一開始不要堅果，最後依然收下了堅果。
  answer: null
  explanation: null
- question: 根據本文，底下選項哪一個最能描述珍古德的一生？
  options:
  - 鍥而不捨地長期投入，終有所成。
  - 做出有智慧的抉擇，讓她有所成就。
  - 身強體壯，終能克服疾病瘟疫。
  - 在母親的陪伴鼓勵下，她走出自己的路。
  answer: A
  explanation: 課文指出珍古德從小就夢想去非洲探險，成年後克服沒有大學文憑和專業訓練的困難，最終前往非洲投身黑猩猩研究，並且課文也明確提及本課描述的是珍古德「長年研究、守護黑猩猩的過程」，這些都體現了她鍥而不捨的長期
