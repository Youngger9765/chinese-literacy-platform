- sentence: 經過長久的努力，他終於得到了(　　)的冠軍獎盃。
  answer: A
- sentence: 儘管大家都很熱情，但轉學生仍然(　　)，不願意和人多交談。
  answer: Ｇ
- sentence: 這條山路十分(　　)，開車要特別小心！
  answer: Ｃ
