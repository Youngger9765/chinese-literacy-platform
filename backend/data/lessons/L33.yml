fill_in_blank:
- sentence: 從飛機上往下看，整座城市顯得如此渺小，彷彿能將一切（　　）。
  answer: A
- sentence: 經過多年的努力，我們的研究終於來到了（　　），只差最後一步就能成功。
  answer: B
- sentence: 地震過後，許多居民的家園被毀，不得不（　　），尋找新的安身之處。
  answer: C
- sentence: 海嘯來襲時，沿海的村莊（　　），遭受了最嚴重的破壞。
  answer: D
- sentence: 保護地球環境是每個人的責任，因為（　　），我們都生活在同一個地球上。
  answer: E
- sentence: 這座老舊的吊橋已經年久失修，看起來（　　），隨時都有可能斷裂。
  answer: F
- sentence: 工業發展排放過多的二氧化碳等（　　），是導致全球氣候變暖的主要原因。
  answer: G
- sentence: 兩個同學吵架，我只是路過卻被老師一起責罵，真是（　　）。
  answer: H
- sentence: 這次的比賽，雖然我們沒有任何（　　）可以參考，但大家還是努力爭取最好的成績。
  answer: I
- sentence: 老師教我們如何將作業儲存在（　　）空間，這樣就算電腦壞了也不怕資料遺失。
  answer: J
- sentence: 全球暖化造成海平面上升，許多低窪地區的居民被迫遷徙，成為（　　）。
  answer: K
multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 烏俄戰爭持續不斷，讓許多人「流離失所」，甚至失去性命。
  - 妹妹從山腳下「鳥瞰」山上的樹林，覺得風景真是美麗極了。
  - 運動鞋特賣會開始了，小翔「首當其衝」，第一個衝進會場。
  - 大雄因作業沒完成而被老師處罰，遭受「池魚之殃」，真倒楣。
  answer: A
  explanation: 「流離失所」意指失去原本的住所，到處流亡、分散到各地。烏俄戰爭導致許多人失去家園，符合此語詞的意義。
- question: 根據課文第四段，吐瓦魯部長柯飛說：「我們要將它們移到雲端！」這裡的它們指的是什麼呢？
  options:
  - 吐瓦魯的祖先、人民和家園。
  - 吐瓦魯的土地、海洋和文化。
  - 吐瓦魯的領土、人民和政府。
  - 吐瓦魯的地標、家園和小島。
  answer: C
  explanation: 根據吐瓦魯部長柯飛的聲明，將國家「移到雲端」的目標是為了應對氣候變遷導致的國土消失危機，以確保吐瓦魯即使失去實體領土，仍能以一個主權國家存在。這包含了將國家的核心要素——其領土的數位表徵、人民的身份資
- question: 文章主題是登入元宇宙的吐瓦魯，為什麼第七段要特別提到臺灣呢？
  options:
  - 因為作者想讓臺灣的讀者感同身受，不要當局外人。
  - 因為臺灣是作者的國家，他也想要讓讀者認識他的家園。
  - 因為臺灣數位科技發達，要登入元宇宙特別容易。
  - 因為臺灣也想要獲得國際承認，並持續擁有海域邊界與資源。
  answer: A
  explanation: 作者在反思吐瓦魯的報導時，聯想到臺灣也受到全球暖化的威脅，旨在強調這不是單一國家的問題，而是全人類的共同議題，藉此讓臺灣讀者產生共鳴，體認到自己不是局外人。
- question: 整篇文章讀下來，你認為什麼是「元宇宙」呢？
  options:
  - 它是人類為了離開小島，而在大陸設置的生活空間。
  - 它是一個人類在外太空建立的網路新世界。
  - 它是人們可以透過網路在裡頭生活的虛擬世界。
  - 它是為了避難，人類創立的超大型庇護所。
  answer: C
  explanation: 雖然課文中未直接提及或定義「元宇宙」，但選項C「它是人們可以透過網路在裡頭生活的虛擬世界」是目前對「元宇宙」最廣泛且正確的解釋。
- question: 作者寫這篇文章的目的是什麼呢？
  options:
  - 想要支持吐瓦魯建立元宇宙國家。
  - 希望讀者能更了解吐瓦魯的處境。
  - 想要臺灣搶先一步建立虛擬國家。
  - 希望大家能正視全球暖化的問題。
  answer: D
  explanation: 課文明確指出作者看到吐瓦魯的報導後，反思到臺灣也受到全球暖化的威脅，並強調對抗全球暖化是全人類的共同議題。因此，作者寫作本文的最終目的是希望大家能正視全球暖化的問題，並透過反思尋找解決之道。
