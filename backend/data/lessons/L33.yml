title: 吐瓦魯：逐漸被淹沒的島國
genre: 説明文
text_type: 單
reading_strategy: 用4F反思法(事實、感受、反思、行動)表達看法
knowledge_video_url: https://www.youtube.com/watch?v=lg3KQcFwdlA
story_text: '吐瓦魯（Tuvalu）是西南太平洋的一個島國，國旗上有9顆星，象徵該國是一個由9座環形珊瑚島組成的國家，人口約一萬，陸地總面積不到26平方公里，大約是臺北市面積的十分之一；境內沒有山丘河流，最高的地方只有海拔4公尺，比一層樓高一點點。

  由於國土狹小，地勢又低，在全球暖化、海平面持續上升的威脅下，吐瓦魯已有兩座島嶼逼近被淹沒󠇡的臨界點，其他島嶼也岌岌可危。這個有「南太平洋天堂」之稱的國家即將面臨滅頂的命運，全國沉入海底只是遲早的問題。如果你是吐瓦魯的人民，你該怎麼辦？

  2021年吐瓦魯部長柯飛（S. Kofe）錄製了一段影片，對聯合國全球氣候高峰會發表演說。影片中，他穿著西裝、打著領帶、褲腳捲起，站在水深及膝的海水中演講，他強調吐瓦魯在氣候變遷下首當其衝，「對我們而言，島嶼是神聖的，它是我們祖先的家，是我們人民的家園。」柯飛說：「（但）我們正在下沉，每個人都在下沉。」

  為了不讓自己的國家最終化為海水中的泡沫，2022年柯飛進一步提出建立「元宇宙國家」的計畫，為國家生存尋找替代方案。他表示，無論現實世界怎麼改變，我們的土地、海洋和文化都應該受到保護，不要讓它們受到傷害，「我們要將它們轉移到雲端！」這個計畫將透過數位科技複製地標、重建家園，打造一個數位世界，在雲端永久存在，可以和使用者互動。如果順利，那麼即使吐瓦魯未來完全被淹沒，人民流散四處，元宇宙中的吐瓦魯依然能夠作為一個國家繼續運作。演講結束，鏡頭逐漸拉遠，這次柯飛站在一個受海平面上升威脅的數位小島上，從空中鳥瞰小島，美麗得令人憂傷。

  然而，創建「數位版國家」的做法沒有先例。根據國際法，「國家」是指一個具有主權的實體，擁有領土、人民、政府，在國際上被承認並能與其他國家進行平等的外交互動。當吐瓦魯由「實體國家」轉為「數位虛擬國家」時，是否能獲得國際承認，並持續擁有海洋邊界以及海域內的資源，則是一項新的挑戰。雖然已有國家表示，同意未來繼續承認吐瓦魯「數位國家」的主權，但仍需要修改國際法才能解決各種數位虛擬國家可能遇見的問題。

  乍聽之下，吐瓦魯選擇「登入元宇宙」的計畫似乎很炫，然而卻是非常不得已的，如果能在自己的國土上安居樂業，誰願意讓國家虛擬化、讓人民流離失所！另一方面，包括吐瓦魯在內的太平洋島國，居民排放的溫室氣體，僅占了全球微乎其微的0.03%，卻因為其他國家共同造成的全球暖化，而受到池魚之殃，國土成為重災區、人民成為氣候難󠇡民。天下還有什麼比這個更冤屈的事呢？

  臺灣四面環海，也可能被海水淹沒󠇡嗎？根據科學研究報告，1993年到2015年期間，臺灣周遭的海平面平均每年上升2.2毫米，這個上升趨勢將持續到本世紀末。在暖化2°C的情境下（指全球平均溫度相較於工業化前上升2°C），海平面上升將使得臺灣沿海鄉鎮排水困難、淹水面積增加。

  在對抗全球暖化這個議題上，沒有人是局外人，元宇宙真的能成為人類的避難󠇡所嗎？'
