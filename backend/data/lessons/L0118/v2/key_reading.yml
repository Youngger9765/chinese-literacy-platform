passage: 「有個樵夫上山砍柴，忽然遇見猛虎。他拚命逃，被逼到懸崖邊。身後有惡虎，眼前是深不可測的懸崖，他無可選擇，只能閉眼一跳。下墜時幸好有一條藤蔓勾住了他，讓他懸在半空。他驚魂未定，但一條小命暫時保住了。他鬆了一口氣，但是……」林奶奶哭
