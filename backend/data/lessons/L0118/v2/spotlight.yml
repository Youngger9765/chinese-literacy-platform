spotlight:
  lesson: G8-L20
  strategy_name: 寫作手法-用故事說道理
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: "上一課〈塞翁失馬，焉知非福〉，我們學到：作者如何用故事和例子支持觀點。這一課再往前一步：課文本身是一則故事，但「故事中有故事」，作者在主要情節中插入另一則故事，讓主角和讀者從中明白道理。\n\
      我們可以依三個步驟讀這類文章， \n一、共同處境：內層故事和主要人物有什麼相同或相似的處境？\n二、理解用意：從對比中抓出內層故事要傳遞的道理\n三、看見改變：這個故事如何改變主要人物看事情的眼光？\n\
      這一課的學習目標是：這個故事和主要情節有什麼關聯？它幫人物或讀者明白了什麼？"
  - type: guide
    text: 一、共同處境：
  - type: passage
    source: supplementary
    paragraphs:
    - 讀這篇課文，不能只被法師講的故事吸引，還要對照一下，看看這個故事和林奶奶的處境有什麼相同或相似之處？它在文中產生了什麼作用？
    - 我們把法師講的故事拆成「樵夫險境」和「鮮美草莓」兩部分。先比較「樵夫險境」和林奶奶的處境。
  - type: table
    rows:
    - - 對照
      - 林奶奶的現實處境
      - 樵夫在故事中的處境
    - - 樵夫險境
      - '受病痛折磨，又拖累家人，生命沒有別的出路。

        靠醫院和家人活著，但對病痛和死亡，完全無法控制。'
      - '1.後有猛虎，前有深崖，生命沒有別的出路。

        2.靠藤蔓活著，但對猛虎、懸崖和黑白老鼠，完全無法控制。'
    - - "相同相似處 \n(複選)"
      - '①處境相似：都面對生命盡頭、無路可退。

        ②對許多痛苦，大家都無能為力，做什麼都沒用。

        □③結果相同：兩人的危險和痛苦都立刻消失。'
    - - 故事作用
      - 讓林奶奶想到自己的處境，眼淚奪眶而出，覺得自己被理解、被同理。
  - type: guide
    text: 二、理解用意：
  - type: guide
    text: 請想一想，（樵夫故事）中「香甜草莓」這一部分想告訴我們什麼道理？
  - type: table
    rows:
    - - '香甜

        草莓'
      - 樵夫身處險境，無能為力，卻能看見身邊的美好，開始品嘗身邊草莓。
    - - '故事

        用意

        (複選)'
      - '①讓林奶奶看見，除了怨恨憂鬱，她還可以有不同的選擇。

        □②對許多痛苦，大家都無能為力，做什麼都沒用。

        ③提醒林奶奶，身心折磨之外，可以看見同時存在的許多美好。'
  - type: guide
    text: 三、看見改變：故事帶給林奶奶怎樣的改變？
  - type: single
    prompt: 1.回到人物轉變：根據上表，林奶奶真正改變的是什麼？（單選）
    options:
    - 故事沒有改變林奶奶的病情，卻改變了林奶奶看事情的眼光。
    - 故事減輕了林奶奶的疼痛，也不再害怕死亡。
    answer: 故事沒有改變林奶奶的病情，卻改變了林奶奶看事情的眼光。
  - type: single
    prompt: 2.回到故事的力量：林爺爺直接勸說，林奶奶更痛苦；法師說了一個不是真的故事，卻讓她看見家人的愛。為什麼故事比較有效？（單選）
    options:
    - 因為故事把沉重的道理藏在驚險情節裡，讓林奶奶暫時不再想自己的病痛。
    - 因為故事沒有直接責備她，而是讓她從樵夫身上看見自己，也看見痛苦旁邊仍有美好。
    answer: 因為故事沒有直接責備她，而是讓她從樵夫身上看見自己，也看見痛苦旁邊仍有美好。
  - type: single
    prompt: 3.回到故事作用：法師說這個故事，最主要的用意是什麼？（單選）
    options:
    - 讓林奶奶忘記病痛、死亡、拖累家人等無法控制的壞事。
    - 讓林奶奶明白，痛苦是真的，但身邊的愛與美好也是真的。
    answer: 讓林奶奶明白，痛苦是真的，但身邊的愛與美好也是真的。
  - type: single
    prompt: 4.故事帶來的改變：林奶奶因為這個故事而有了什麼改變？
    options:
    - 林奶奶身體的疼痛和心裡的害怕都大幅降低。
    - 林奶奶開始看見身邊的愛與美好，開始感恩。
    answer: 林奶奶開始看見身邊的愛與美好，開始感恩。
  - type: self_check
    items:
    - 我能看出樵夫故事和林奶奶處境的關聯。
    - 我能說出法師說這個故事的作用：故事改變的是林奶奶看待生命的眼光，而不是身體的病情。
    - 下次讀到「故事中有故事」的文章，我會問自己：這個故事和主要情節有什麼關聯？它產生了什麼作用？
