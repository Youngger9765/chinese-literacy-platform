  passage: 「有個樵夫上山砍柴，忽然遇見猛虎。他拚命逃，被逼到懸崖邊。身後有惡虎，眼前是深不可測的懸崖，他無可選擇，只能閉眼一跳。下墜時幸好有一條藤蔓勾住了他，讓他懸在半空。他驚魂未定，但一條小命暫時保住了。他鬆了一口氣，但是……」林奶奶哭泣已停，急著問：「但是怎樣？」「但是，這時來了一隻黑老鼠和一隻白老鼠，在樵夫夠不著的上方，開始你一口我一口地啃嚙著那條藤蔓。樵夫知道，再這麼下去，藤蔓遲早會斷，他的生命終將結束。他求助無門，自己也無計可施。」這時，法師用澄澈而安定的眼神看著林奶奶，問道：「你覺得他可以怎麼辦呢？」林奶奶看著法師，想到了自己的處境，百感交集。她搖了搖頭，淚水奪眶而出。「就在這時，他看見崖壁上竟長著一顆晶瑩飽滿的野草莓，鮮豔欲滴，它紅得發亮，像把陽光藏在果肉裡。樵夫伸出手，把它摘下來放入口中。他閉上眼：『嗯，好香好甜的草莓啊！』故事講完了。」
