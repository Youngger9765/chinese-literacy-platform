lesson_uid: L0118
version_id: v3
section_no: 六
spotlight:
  strategy_name: 寫作手法——用故事說道理
  strategy_type: writing_craft
  blocks:
  - type: concept_box
    text: '上一課〈塞翁失馬，焉知非福〉，我們學到：作者如何用故事和例子支持觀點。這一課再往前一步：課文本身是一則故事，但「故事中有故事」，作者在主要情節中插入另一則故事，讓主角和讀者從中明白道理。

      我們可以依三個步驟讀這類文章，

      一、共同處境：內層故事和主要人物有什麼相同或相似的處境？

      二、理解用意：從對比中抓出內層故事要傳遞的道理

      三、看見改變：這個故事如何改變主要人物看事情的眼光？

      這一課的學習目標是：這個故事和主要情節有什麼關聯？它幫人物或讀者明白了什麼？'
  - type: guide
    text: '一、共同處境：

      讀這篇課文，不能只被法師講的故事吸引，還要對照一下，看看這個故事和林奶奶的處境有什麼相同或相似之處？它在文中產生了什麼作用？

      我們把法師講的故事拆成「樵夫險境」和「鮮美草莓」兩部分。先比較「樵夫險境」和林奶奶的處境。'
  - type: fill_table
    label: 一、共同處境
    rows:
    - - 對照
      - 林奶奶的現實處境
      - 樵夫在故事中的處境
    - - 樵夫險境
      - '受病痛折磨，又拖累家人，生命沒有別的出路。

        靠醫院和家人活著，但對病痛和死亡，完全無法控制。'
      - '1.後有猛虎，前有深崖，生命沒有別的出路。

        2.靠藤蔓活著，但對猛虎、懸崖和黑白老鼠，完全無法控制。'
    - - '相同相似處

        (複選)'
      - '☑①處境相似：都面對生命盡頭、無路可退。

        ☑②對許多痛苦，大家都無能為力，做什麼都沒用。

        □③結果相同：兩人的危險和痛苦都立刻消失。'
    - - 故事作用
      - 讓林奶奶想到自己的處境，眼淚奪眶而出，覺得自己被理解、被同理。
    answers:
      相同相似處:
      - 1
      - 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），文字流查得到；③未勾
    note: '原稿是一張表；第 3、4 列的內容欄跨兩欄合併，所以那兩列只有兩格。

      「林奶奶的現實處境」欄的兩點原稿未編號（樵夫欄有 1./2.），照原稿保留差異。'
  - type: guide
    text: '二、理解用意：

      請想一想，（樵夫故事）中「香甜草莓」這一部分想告訴我們什麼道理？'
  - type: fill_table
    label: 二、理解用意
    rows:
    - - '香甜

        草莓'
      - 樵夫身處險境，無能為力，卻能看見身邊的美好，開始品嘗身邊草莓。
    - - '故事

        用意

        (複選)'
      - '☑①讓林奶奶看見，除了怨恨憂鬱，她還可以有不同的選擇。

        □②對許多痛苦，大家都無能為力，做什麼都沒用。

        ☑③提醒林奶奶，身心折磨之外，可以看見同時存在的許多美好。'
    answers:
      故事用意:
      - 1
      - 3
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: guide
    text: 三、看見改變：故事帶給林奶奶怎樣的改變？
  - type: single
    label: 1.回到人物轉變
    prompt: 根據上表，林奶奶真正改變的是什麼？（單選）
    options:
      1: 故事沒有改變林奶奶的病情，卻改變了林奶奶看事情的眼光。
      2: 故事減輕了林奶奶的疼痛，也不再害怕死亡。
    answer: 1
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: single
    label: 2.回到故事的力量
    prompt: 林爺爺直接勸說，林奶奶更痛苦；法師說了一個不是真的故事，卻讓她看見家人的愛。為什麼故事比較有效？（單選）
    options:
      1: 因為故事把沉重的道理藏在驚險情節裡，讓林奶奶暫時不再想自己的病痛。
      2: 因為故事沒有直接責備她，而是讓她從樵夫身上看見自己，也看見痛苦旁邊仍有美好。
    answer: 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: single
    label: 3.回到故事作用
    prompt: 法師說這個故事，最主要的用意是什麼？（單選）
    options:
      1: 讓林奶奶忘記病痛、死亡、拖累家人等無法控制的壞事。
      2: 讓林奶奶明白，痛苦是真的，但身邊的愛與美好也是真的。
    answer: 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: single
    label: 4.故事帶來的改變
    prompt: 林奶奶因為這個故事而有了什麼改變？
    options:
      1: 林奶奶身體的疼痛和心裡的害怕都大幅降低。
      2: 林奶奶開始看見身邊的愛與美好，開始感恩。
    answer: 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    note: 原稿此題未標（單選），但只勾一個答案
  - type: self_check
    label: ◎ 自我檢核
    instruction: 如果你有做到，請在□內打勾。
    items:
    - 1.我能看出樵夫故事和林奶奶處境的關聯。
    - 2.我能說出法師說這個故事的作用：故事改變的是林奶奶看待生命的眼光，而不是身體的病情。
    - 3.下次讀到「故事中有故事」的文章，我會問自己：這個故事和主要情節有什麼關聯？它產生了什麼作用？
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
