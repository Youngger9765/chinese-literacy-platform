  passage: 「為什麼會抽筋啊？真是的。」皓祥問道。詹老師說：「抽筋的原因不只一種。長時間運動或過度用力，容易造成肌肉疲勞，這是常見原因；大量流汗後，如果沒有適當補充水分，也可能增加抽筋的機會。你最後一跳用盡全力，可能就是在那時抽筋了。偏偏又因為碰撞跌倒，扭傷了腳踝，這樣的『好運』，真的很少見啊。」幾位同學圍過來問：「詹老師，怎麼做才比較不容易受傷？如果真的受傷了，又該怎麼處理？」「不管是哪一種運動，開始前都要先暖身。暖身要循序漸進，讓心跳和呼吸慢慢加快，提高肌肉溫度，讓關節活動更靈活，幫助身體進入運動狀態，也有助於降低受傷的風險。暖身時間要看運動內容、強度和個人狀況，不能草草做完。如果不幸還是受傷了──像皓祥這樣的扭傷，最重要的是先停止運動、保護受傷部位，並請老師、教練或運動防護員協助。受傷初期可以參考PEACE原則。」詹老師一邊確認皓祥的傷勢，一邊說明五項處置方法：
