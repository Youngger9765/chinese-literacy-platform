strategy_explained: '這一課要學會怎麼聽出「話中有話」，也就是作者雖然沒直接講，但其實想表達另一件事，像是說「還好」但其實很擔心

  文章講到受傷的過程，但又說到「保護自己」和「怎麼應對」，這樣的對比方式，就是用這種「話中有話」來提醒我們運動時要小心

  所以，讀的時候可以注意看看，作者有沒有哪些地方說話的「意思」跟「說出來的字」不太一樣，特別是提到受傷和保護之間'
