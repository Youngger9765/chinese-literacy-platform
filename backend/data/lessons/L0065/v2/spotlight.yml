spotlight:
  lesson: G6-L26
  strategy_name: 寫作手法-倒反：讀懂反話
  strategy_type: writing_technique
  blocks:
  - type: free_text
    prompt: (5)他 (  Ａ  )的表情和動作，惹得眾人哄堂大笑。
  - type: free_text
    prompt: (6)天氣寒冷，沒有先做暖身就開始運動，容易讓肌肉變得(  D  )。
  - type: free_text
    prompt: (7)上實驗課時，同學們都（H），仔細觀察實驗變化，不敢分心。
  - type: free_text
    prompt: (8)出發登山前，我們先(  E  )天氣和路況，確認安全後才啟程。
  - type: guide
    text: 五文章重點表 五文章重點表
  - type: table
    rows:
    - - 運動傷害，怎麼辦？
    - - 如何預防
      - 1.不管是哪一種運動，都要先做好【】運動。
    - - 如何預防
      - 2.暖身的目的是什麼？（多選）□①讓心跳和呼吸慢慢加快　　□②提高肌肉溫度　□③讓關節活動更靈活
    - - 受傷時的處理
      - 1.受傷初期可以參考 PEACE 原則：【】、【】、【】、【】、【】。
    - - 受傷時的處理
      - 2.若不幸自己或他人意外受傷，可以先怎麼做？停止運動、【】、找大人或【】幫忙。
    answers:
    - 暖身
    - 保護
    - 抬高
    - 避免
    - 壓迫
    - 教育
    - 保護傷處
    - 專業人員
  - type: guide
    text: 六閱讀聚光燈寫作手法—倒反：讀懂反話六閱讀聚光燈寫作手法—倒反：讀懂反話
  - type: guide
    text: 一、找出反話，讀懂真正意思
  - type: guide
    text: 圈出課文句子中使用倒反的語詞，再根據課文前後情境，完成右欄。
  - type: table
    rows:
    - - 課文句子
      - 字面意思和真正意思
    - - (1)
      - 運動防護員詹老師說：「哈哈，少見少見，你右腿『雙喜臨門』，不但腳踝扭傷，小腿也抽筋了。」
      - 字面意思：同時遇到兩件喜事真正意思：同時受了兩種傷，實在很【】
    - - (2)
      - 你最後一跳用盡全力，可能就是在那時抽筋了。偏偏又因為碰撞跌倒，扭傷了腳踝，這樣的『好運』，真的很少見啊。
      - 字面意思：運氣很好真正意思：同時扭傷與抽筋，運氣【】。
    answers:
    - 倒楣
    - 很差
  - type: guide
    text: 二、找證據，讀懂反話的作用
  - type: single
    prompt: 1.哪些前後文線索可以幫助我們判斷，「雙喜臨門」是反話？（3選2）
    options:
    - 皓祥的腳踝扭傷，小腿也抽筋
    - 皓祥疼得直皺眉，聽完後苦笑了一下
    - 隊友因為投進關鍵一球，興奮得擁抱、歡呼
    answer: 皓祥的腳踝扭傷，小腿也抽筋
  - type: single
    prompt: 2.詹老師使用「雙喜臨門」和「好運」這些反話，主要有什麼作用？（單選）
    options:
    - 真心祝賀皓祥同時遇到兩件值得高興的事
    - 點出皓祥同時受了兩種傷，也讓語氣帶有幽默
    - 表示皓祥的傷勢不嚴重，不需要特別處理
    answer: 真心祝賀皓祥同時遇到兩件值得高興的事
  - type: guide
    text: 三、換你試試看
  - type: free_text
    prompt: 1.下列句子都使用了倒反。請勾選句中說反話的語詞。
  - type: table
    rows:
    - - (1)
      - 你騎車的技術真是高明，都騎到去撞電線桿了。
      - □①高明  □②撞電線桿
    - - (2)
      - 你投籃真準，連投三球都沒碰到籃框。
      - □①真準  □②籃外大空心
    - - (3)
      - 這麼簡單的題目居然會寫錯，你真是天才。
      - □①寫錯  □②天才
  - type: free_text
    prompt: 2.小安出門時忘了帶傘，才走出校門，天空就下起大雨。他全身淋得溼答答，抬頭說：「我今天的運氣真好！」
  - type: single
    prompt: (1)「運氣真好」真正想表達什麼？（單選）
    options:
    - 小安很喜歡淋雨，覺得今天特別幸運
    - 小安沒帶傘又遇到大雨，覺得自己很倒楣
    - 小安想提醒同學，下雨天一定要帶雨具
    answer: 小安很喜歡淋雨，覺得今天特別幸運
  - type: single
    prompt: (2)你是根據什麼判斷的？
    options:
    - 只看「運氣真好」的字面意思
    - 把「忘了帶傘、全身淋溼」和這句話合起來看
    answer: 只看「運氣真好」的字面意思
  - type: free_text
    prompt: ３.人際關係延伸題
  - type: single
    prompt: (1)詹老師說反話後，皓祥雖然疼得直皺眉，卻苦笑了一下，沒有因這句話生氣。從這段互動可以推測，兩人的關係可能如何？（複選）
    options:
    - 彼此熟悉
    - 有一定的信任
    - 彼此生疏
    - 互相敵視
    answer: 彼此熟悉
  - type: single
    prompt: (2)幽默也要看對象，下列哪些關係或情況比較適合說反話？（複選）
    options:
    - 相處已久、了解彼此界線的朋友
    - 第一次見面、還不了解彼此的陌生人
    - 關係緊張、正在爭吵的同學
    - 彼此信任、能理解對方玩笑的夥伴
    answer: 相處已久、了解彼此界線的朋友
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
