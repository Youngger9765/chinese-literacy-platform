spotlight:
  lesson: G6-L26
  strategy_name: 寫作手法-倒反：讀懂反話
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: 一、找出反話，讀懂真正意思
  - type: guide
    text: 圈出課文句子中使用倒反的語詞，再根據課文前後情境，完成右欄。
  - type: table
    rows:
    - - 課文句子
      - 字面意思和真正意思
    - - (1)
      - 運動防護員詹老師說：「哈哈，少見少見，你右腿『雙喜臨門』，不但腳踝扭傷，小腿也抽筋了。」
      - '字面意思：同時遇到兩件喜事

        真正意思：同時受了兩種傷，實在很【】'
    - - (2)
      - 你最後一跳用盡全力，可能就是在那時抽筋了。偏偏又因為碰撞跌倒，扭傷了腳踝，這樣的『好運』，真的很少見啊。
      - '字面意思：運氣很好

        真正意思：同時扭傷與抽筋，運氣【】。'
    answers:
    - 倒楣
    - 很差
  - type: guide
    text: 二、找證據，讀懂反話的作用
  - type: single
    prompt: 1.哪些前後文線索可以幫助我們判斷，「雙喜臨門」是反話？（3選2）
    options:
    - 皓祥的腳踝扭傷，小腿也抽筋
    - 皓祥疼得直皺眉，聽完後苦笑了一下
    - 隊友因為投進關鍵一球，興奮得擁抱、歡呼
    answer: 皓祥的腳踝扭傷，小腿也抽筋
  - type: single
    prompt: 2.詹老師使用「雙喜臨門」和「好運」這些反話，主要有什麼作用？（單選）
    options:
    - 真心祝賀皓祥同時遇到兩件值得高興的事
    - 點出皓祥同時受了兩種傷，也讓語氣帶有幽默
    - 表示皓祥的傷勢不嚴重，不需要特別處理
    answer: 點出皓祥同時受了兩種傷，也讓語氣帶有幽默
  - type: guide
    text: 三、換你試試看
  - type: free_text
    prompt: 1.下列句子都使用了倒反。請勾選句中說反話的語詞。
  - type: table
    rows:
    - - (1)
      - 你騎車的技術真是高明，都騎到去撞電線桿了。
      - "①高明  \n□②撞電線桿"
    - - (2)
      - 你投籃真準，連投三球都沒碰到籃框。
      - "①真準  \n□②籃外大空心"
    - - (3)
      - 這麼簡單的題目居然會寫錯，你真是天才。
      - "□①寫錯  \n②天才"
  - type: free_text
    prompt: 2.小安出門時忘了帶傘，才走出校門，天空就下起大雨。他全身淋得溼答答，抬頭說：「我今天的運氣真好！」
  - type: single
    prompt: (1)「運氣真好」真正想表達什麼？（單選）
    options:
    - 小安很喜歡淋雨，覺得今天特別幸運
    - 小安沒帶傘又遇到大雨，覺得自己很倒楣
    - 小安想提醒同學，下雨天一定要帶雨具
    answer: 小安沒帶傘又遇到大雨，覺得自己很倒楣
  - type: single
    prompt: (2)你是根據什麼判斷的？
    options:
    - 只看「運氣真好」的字面意思
    - 把「忘了帶傘、全身淋溼」和這句話合起來看
    answer: 把「忘了帶傘、全身淋溼」和這句話合起來看
  - type: free_text
    prompt: ３.人際關係延伸題
  - type: single
    prompt: (1)詹老師說反話後，皓祥雖然疼得直皺眉，卻苦笑了一下，沒有因這句話生氣。從這段互動可以推測，兩人的關係可能如何？（複選）
    options:
    - 彼此生疏
    - 互相敵視
    answer: 彼此生疏
  - type: single
    prompt: (2)幽默也要看對象，下列哪些關係或情況比較適合說反話？（複選）
    options:
    - 相處已久、了解彼此界線的朋友
    - 第一次見面、還不了解彼此的陌生人
    - 關係緊張、正在爭吵的同學
    - 彼此信任、能理解對方玩笑的夥伴
    answer: 相處已久、了解彼此界線的朋友
