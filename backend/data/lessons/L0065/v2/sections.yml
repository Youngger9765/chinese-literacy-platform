comprehension:
  questions:
  - index: 1
    answer: B
    stem: 請問下列句子內使用的詞語，哪一個使用正確？
    options:
      A: 她眉頭緊皺，冷汗直流，看起來似乎非常「放鬆」(痛苦)
      B: 他「全神貫注」的聆聽音樂，連門鈴響了也不知道
      C: 他品學兼優，表現良好， 令父母親「憂心忡忡」（驕傲）
    rationale: null
  - index: 2
    answer: B
    stem: 詹老師說皓祥的右腿「雙喜臨門」，真正想表達什麼？
    options:
      A: 皓祥投進關鍵一球，球隊也贏得比賽
      C: 隊友立即呼喊，防護員也趕來處理
      D: 皓祥完成背後運球，也成功突破防守
      B: 由第二段可知皓祥小腿抽筋及扭傷。
    rationale: 由第二段可知皓祥小腿抽筋及扭傷。
    is_rationale: true
  - index: 3
    answer: B
    stem: 下列關於 PEACE 原則的說明，何者正確？
    options:
      A: 保護（Protect）：把受傷部位抬高，幫助減少腫脹(抬高)
      B: 壓迫（Compress）：由專業人員適度包紮，幫助抑制腫脹
      C: 避免（Avoid）：為加快復原，應立即恢復原本的運動量(保護)
      D: 抬高（Elevation）：認識恢復的進程、避免過度的壓力(教育)
    rationale: null
  - index: 4
    answer: A
    stem: 下列關於運動前暖身的說明，何者最符合課文？
    options:
      A: 暖身要循序漸進，並依運動內容、強度和個人狀況調整
      B: 運動強度越高，暖身時間越應縮短，以免提前感到疲累
      C: 暖身只需活動身體關節，不必讓心跳與呼吸逐漸加快
      D: 所有運動都應使用相同的暖身時間，才能完成充分準備
    rationale: null
  - index: 5
    answer: C
    stem: 除了原篇名外，你認為下列哪一個也適合當作本文的篇名？
    options:
      A: 暖身活動的重要
      C: 扭傷時的應變
      D: 保養肌肉的方法
    rationale: 文章主旨在說明運動扭傷時可以怎麼做應變。
