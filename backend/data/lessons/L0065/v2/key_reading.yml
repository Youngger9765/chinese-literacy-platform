passage: 「為什麼會抽筋啊？真是的。」皓祥問道。詹老師說：「抽筋的原因不只一種。長時間運動或過度用力，容易造成肌肉疲勞，這是常見原因；大量流汗後，如果沒有適當補充水分，也可能增加抽筋的機會。你最後一跳用盡全力，可能就是在那時抽筋了。偏偏又因為碰撞跌倒，扭傷了腳踝，這樣的『好運』，真的很少見啊。」幾位同學圍過來問：「詹老師，怎麼做才比較不容易受傷？如果真的受傷了，又該怎麼處理？」
