intro: 這篇文章帶我們認識臺灣頂尖羽球選手周天成的一天。文中描寫他如何透過嚴格的日常訓練，包括基本球技、體能鍛鍊和飲食控制，來維持頂尖運動員的狀態。除了場上的努力，文章也呈現了他身為公眾人物的責任，以及如何透過自我反省與調整，不斷追求進步。透過了解周天成的一天，我們可以窺見成功背後所付出的堅持與努力。
strategy_explained: '這一課我們要練習的是「從周天成的說話和做事，猜猜他是一個怎樣的人」

  因為文章裡會告訴我們，他每天怎麼練球、怎麼吃東西，還會寫他怎麼想事情，這些都會幫助我們更了解這位很棒的運動員

  讀的時候，你可以注意看看他說了什麼、做了什麼，然後想想這些代表他是一個什麼樣的運動員，有沒有很認真、很自律'
