  passage: 到了晚上，周天成有時要出席公開活動，或拜會企業與政府機構。身為經常參加國際賽事的選手，除了比賽和訓練，他也有推廣羽球、回饋社會的責任，而這些工作往往也需要企業贊助或政府支持。此外，為了減少受傷的風險，他不騎機車，也不自行開車，盡量搭乘捷運或公車。保護自己，也是運動員對職業生涯負責的表現。在夜深人靜的時候，周天成會自我反省、調整心態，也激勵自己。他說：「雖然我有時候輸掉比賽，但只要參賽，總是可以學到很多東西。最重要的是，你必須為自己奮鬥。我也會時刻提醒自己，在每場比賽中保持謙虛；每當我驕傲起來，就無法在場上打出好表現。」即使已經是臺灣頂尖的羽球選手，周天成仍然不自滿，持續尋找各種進步的方法，哪怕只有百分之一的進步機會，他都會去嘗試。他說：「只有拿出好成績、具有影響力，才能回饋社會，影響更多人；不然，我就只是個路人。」周天成日復一日過著高度自律的生活，從訓練、飲食到外出方式，每個環節都仔細安排，讓自己保持最佳狀態。陪他過一天，也許會覺得新鮮；但要一年三百六十五天，天天這樣過並不容易。你能像他一樣，每天鍛鍊技術、增強體能、控制飲食，也好好保護自己嗎？
