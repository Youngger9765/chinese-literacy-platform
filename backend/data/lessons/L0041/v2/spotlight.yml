spotlight:
  lesson: G5-L2
  strategy_name: 推論策略-從言行推論人物特質
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: 一、先複習：哪些言行能支持「自律」？
  - type: guide
    text: 課文直接寫出周天成過著高度自律的生活。下列哪些言行能支持「自律」？
  - type: single
    prompt: （複選）
    options:
    - 每天按照順序完成羽球基本訓練。
    - 完成羽球訓練後，繼續進行重量訓練。
    - 選擇原型食物，並按照固定順序進食。
    - 晚上出席公開活動，拜會企業與政府機構。
    - 為了降低受傷風險，外出時選擇大眾運輸工具。
    answer: 每天按照順序完成羽球基本訓練。
  - type: guide
    text: →你發現了嗎？楊勇緯和周天成都有「自律」的特質，這是他們成為頂尖選手的重要條件之一喔。
  - type: guide
    text: 二、把線索合起來，推論人物特質
  - type: guide
    text: 除了「自律」這項特質，周天成還有哪些特質，請讀一讀每組課文句子，先判斷是人物「說的話」還是「做的事」，再把兩個線索合起來，選出最適合的人物特質。（單選）
  - type: table
    rows:
    - - 課文線索
      - 人物特質
    - - '1.'
      - '(1)即使已經是臺灣頂尖的羽球選手，周天成仍然不自滿，持續尋找各種進步的方法。

        ( ①做的事  □②說的話 )'
      - ①精益求精□②有使命感□③謹慎小心
    - - '1.'
      - '(2)哪怕只有百分之一的進步機會，他都會去嘗試。

        (①做的事  □②說的話 )'
      - ①精益求精□②有使命感□③謹慎小心
    - - '1.'
      - "兩個線索共同表現出什麼？\n周天成已經有很好的成績，仍然想讓自己【】。\n 提示：維持現狀、繼續進步"
    - - '2.'
      - (1)他舉啞鈴強化左手肌肉，讓左右手的肌力更加平衡，降低脊椎歪斜的風險。(①做的事  □②說的話 )
      - □①追求卓越②做事謹慎□③堅持不懈
    - - '2.'
      - "(2)為了減少受傷的風險，他不騎機車，也不自行開車，盡量搭乘捷運或公車。\n                      (①做的事  □②說的話\
        \ )"
      - □①追求卓越②做事謹慎□③堅持不懈
    - - '2.'
      - "兩個線索共同表現出什麼？\n他會事先想到可能發生的【】，並採取方法【】。\n 提示：危險、提高名氣、降低風險"
    answers:
    - 繼續進步
    - 危險
    - 降低風險
  - type: self_check
    items:
    - 我能分辨人物說的話和做的事。
    - 我能把幾個言行線索合起來，找出共同點。
    - 我能根據共同點，選出最適合的人物特質。
