      - 1.基本訓練：(1)周天成進行基本訓練時，依序做了哪些事？請按照文章順序填入代號。  A.放鬆腳底筋膜      B.旋轉身體拉筋  C.對打比賽       D.網前平推、殺球和發球練習▶首先做【】，接著是【】，再來是【】，最後是【】。(2)為了強健肌肉、開發身體潛能，周天成做了哪些訓練？(多選)□①核心肌群訓練  □②下肢肌群訓練  □③上肢肌群訓練
