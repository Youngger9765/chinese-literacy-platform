  answer: C
- sentence: 因為書寫、記錄和（　　）都太麻煩、花太多時間、太花錢，因此可以大幅精簡文字的文言文因應而生。
  answer: D
- sentence: 文言文可以大幅（　　）文字，因此在古代書寫不便的環境下應運而生。
  answer: E
- sentence: 直到100年前左右，紙、筆、印刷都更普遍之後，才開始有人（　　）白話文。
  answer: F
