vocabulary:
- word: 文言文
  definition: 中國古代的書面語，相對於白話文而言，其用詞精簡，語法結構與口語有所差異。
- word: 白話文
  definition: 與日常口語相近的書面語，相對於文言文而言，其用詞和語法較為淺顯易懂。
- word: 竹簡
  definition: 古代用於書寫文字的竹片，在紙張發明之前是主要的書寫材料之一。
- word: 印刷
  definition: 將文字、圖像等內容複製到紙張或其他材料上的技術，在古代門檻較高。
- word: 精簡
  definition: 使文字、內容等變得簡潔、減少不必要的成分。
- word: 推廣
  definition: 擴大範圍，使某種事物普及或被更多人接受。
- word: 用詞精簡
  definition: 指在表達時，使用最少且最恰當的詞語來傳達意義，避免冗贅。
- word: 省略
  definition: 在語句中，將某些可根據上下文推斷出的成分（如主詞、受詞）不寫出來。
vocabulary_count: 8
