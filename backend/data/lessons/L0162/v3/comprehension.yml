lesson_uid: L0162
version_id: v3
section_no: 五
comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（在文字層，顏色只有解 rStyle 才看得到），PDF p8~p9 可見
  header_note: 標題那一叢文字方塊裡有一個孤立的「✓」(U+2713)，是章節圖示的裝飾，不是答案
  questions:
  - index: 1
    stem: 下列選項「」中的字，何者字義解釋錯誤？
    options:
      A: 請設「饌」以候之——酒菜
      B: 當為「爾」醞酒——你們
      C: 「若」然——如果
      D: 必不「乖違」——遵從
    answer: D
    explanation: '第1題解析：

      D.乖違，違背。'
  - index: 2
    stem: 張劭對他的媽媽說：「巨卿信士，必不乖違」。依據對話的內容，請問：「信士」是什麼意思？
    options:
      A: 誠實守信的人
      B: 信任朋友的人
      C: 相信報應的人
      D: 信仰神靈的人
    answer: A
  - index: 3
    stem: 「相隔千里的約定」一文的主旨與下列何者接近？
    options:
      A: 范式與張劭都是刻苦讀書的典範
      B: 張劭的母親不輕易相信他人的承諾
      C: 范式與張劭信守約定，展現誠信精神
      D: 朋友間不要計較利害，應該互相幫助
    answer: C
  - index: 4
    stem: 下列文句中，哪個選項的「為」字可以用白話文的「是」來解釋？
    options:
      A: 「為」了準時到校，他很早就起床了
      B: 這件衣服的材質「為」純棉
      C: 我們應該「為」自己的行為負責
      D: 他的夢想是成「為」一名醫生
    answer: B
    explanation: '第4題解析：

      為了，表示行動的目的

      是

      替、給

      轉變成的意思。'
    explanation_note: 解析方塊在 PDF p8 上逐項對到 A~D，但文字層沒有印 A./B./C./D. 前綴，照文字層抄
  - index: 5
    stem: 下列句子中的▢▢處都缺少了主語，如果依本文文意要為句子補上主語，請問：哪一選項的主語是指元伯？
    options:
      A: ▢▢遊太學，為諸生
      B: ▢▢後二年當還，將過拜尊親
      C: ▢▢請設饌以候之
      D: 巨卿信士，▢▢必不乖違
    answer: C
    explanation: '第5題解析：

      B、D的主語都是范式。

      是「元伯」請他的母親準備酒菜，所以主語是「元伯」。'
    explanation_note: '這一題的解析方塊在文字層裡尾巴多黏了第 4 題解析的三行（「C.是／替、給／轉變成的意思。」），

      PDF p9 上那三行被排到方塊外看不見。判為文字方塊複製殘留，未收進 explanation。'
