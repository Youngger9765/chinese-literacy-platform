strategy_explained: '這一回要練習的是「判斷句」，也就是看看句子裡哪些詞語表示確定、肯定，哪些表示不確定或疑問，像范式對約定的肯定，以及張劭母親對約定的猶豫，就是很好的練習點

  讀的時候，你可以試著找出句子裡表示「是」或「不是」的詞，或是問「是不是」的句子，去感受語氣的強弱和確定度喔'
