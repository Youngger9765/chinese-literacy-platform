intro: 這篇文章講述了東漢時期一位名叫范式的人，與他的朋友張劭之間一個跨越千里的約定。范式和張劭是好朋友，在分別時，范式答應張劭兩年後會回來拜訪他的父母並見他的孩子。儘管兩人相隔遙遠，張劭的母親對此約定感到懷疑，但張劭卻對范式的信守承諾深信不疑。故事描述了約定之日到來時，范式是否會如期出現，以及這段友情將如何發展。
