section_no: 一
sentence_matching:
  label: 一、文白句子比對
  instruction: '請模仿例句作法：

    ❶ 閱讀原文；❷ 找出對應的參考句；❸ 在下方的[  ]寫上參考句代號。'
  example:
    文言: 范式，字巨卿，山陽 金鄉人也
    answer: 6
    marker_note: '例句在參考句清單上是第［６］條，該條被劃掉，左邊的標記是**文字層的字元「≫」(U+226B)**，

      不是圖形 —— 同批 L0160／L0163 用的是 ☞ 圖形（w:drawing）。三課三種寫法。'
  reference_sentences:
    1: 兩年後我會回來，到時再去拜訪你家，問候你的父母，看看你的孩子
    2: 約定的日子快到了，元伯把事情詳細地告訴他的母親
    3: 你們分別兩年了，相隔千里的約定，你如何確信他一定會來呢
    4: 後來兩人一起告假回鄉，范式對元伯說
    5: 如果是這樣，我就為你們準備酒吧
    6: 范式，字巨卿，山陽　金鄉縣人
    7: 因此跟汝南人張劭結成朋友。張劭，字元伯
    8: 他年少時曾到太學讀書，是一名太學生
    9: 請他母親準備酒菜等范式來
    10: 等到約定的那天，巨卿果然來了
    11: 就一起約定了日期
    12: 巨卿是有信用的人，必定不會違背承諾的
  items:
  - 文言: 少遊太學，為諸生
    answer: 8
  - 文言: 與汝南 張劭為友。劭，字元伯
    answer: 7
  - 文言: 二人並告歸鄉里
    answer: 4
  - 文言: 後二年當還，將過拜尊親，見孺子焉
    answer: 1
  - 文言: 乃共剋期日
    answer: 11
  - 文言: 後期方至，元伯具以白母
    answer: 2
  - 文言: 請設饌以候之
    answer: 9
  - 文言: 二年之別，千里結言，爾何相信之審邪
    answer: 3
  - 文言: 巨卿信士，必不乖違
    answer: 12
  - 文言: 若然，當為爾醞酒
    answer: 5
  - 文言: 至其日，巨卿果到
    answer: 10
  notes:
    answer_carrier: 橘色數字（在文字層，顏色只有解 rStyle 才看得到），PDF p3 可見
    reference_sentences: '［１］～［９］的號碼印成全形，［10］～［12］印成半形，原稿如此。

      ⚠️ 參考句［１］寫「到時**再去**拜訪你家」，古文今譯與第二大題都寫「到時**我將**拜訪你家」——

      兩種寫法都通順、都不是錯字，照原樣保留、不列勘誤（SKILL 記的「兩份不一致」處理）。'
    items: '⚠️ 這一大題的原文欄印「與汝南 張劭為友」（張劭），與課文原文欄印的「張元伯」不同 —— 見 source_errata E1。

      句末的「升堂拜飲，盡歡而別」沒有被括起來，原稿如此。'
