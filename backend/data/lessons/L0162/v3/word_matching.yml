  - index: 2
    文言: 式謂元伯曰：「後二年當還，將過拜尊親，見孺子焉。」乃共剋期日。
    白話: 范式對元伯說：「兩年後我會(　)，到時我將(　)你家，問候你的父母，看看你的(　)。」(　)一起(　)了日期。
