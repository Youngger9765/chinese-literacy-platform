    - answer: 拜訪
    - answer: 孩子
    - answer: 就
    - answer: 約定
  - index: 3
    文言: 後期方至，元伯具以白母，請設饌以候之。
    白話: 約定的日子快到了，元伯把事情詳細地(　)他的母親，請他母親(　)等范式來。
    blanks:
    - answer: 告訴
    - answer: 準備酒菜
  - index: 4
    文言: 母曰：「二年之別，千里結言，爾何相信之審邪？」
    白話: 元伯的母親說：「你們(　)兩年了，相隔千里的(　)，你(　)確信他一定會來(　)？」
    blanks:
    - answer: 分別
    - answer: 約定
    - answer: 如何
    - answer: 呢
  - index: 5
    文言: 對曰：「巨卿信士，必不乖違。」
    白話: 元伯回答：「巨卿是有信用的(　)，必定不會(　)承諾的。」
    blanks:
    - answer: 人
    - answer: 違背
  - index: 6
    文言: 母曰：「若然，當為爾醞酒。」
    白話: 母親說：「(　)是這樣，我就為(　)準備酒吧！」
    blanks:
    - answer: 如果
    - answer: 你們
  - index: 7
    文言: 至其日，巨卿果到，升堂拜飲，盡歡而別。
    白話: 等到約定的(　)，巨卿(　)來了，入屋後，他先(　)了元伯的母親，兩人再一起喝酒，盡情歡樂後才告別。
    blanks:
