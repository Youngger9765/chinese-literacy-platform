lesson_uid: L0162
version_id: v3
section_no: 三
keypoints:
  label: 三、文章重點表
  instruction: 請配合課文內容完成下表。
  layout: list
  column_note: 表格欄名是「故事結構／內容摘要」；內容摘要欄下另印「【 】處填入原文，找不到原文時，再用自己的話寫。」
  answer_carrier: 橘色手寫（在文字層，顏色只有解 rStyle 才看得到），PDF p5 可見
  rows:
  - label: 起因
    value: '范式與張劭都在太學讀書，兩人因此結為好友。學校放假前，

      【　】向【　】約定【　】後將到他家拜訪。'
    blanks:
    - answer: 范式/巨卿
    - answer: 張劭/元伯
    - answer: 兩年
  - label: 經過
    sub_label: 接近約定的日子
    items:
    - label: '1'
      value: 張劭告訴母親，自己在太學結交的朋友要到家裡拜訪了，請母親幫忙【　】招待客人。
      blanks:
      - answer: 設饌/準備酒菜
    - label: '2'
      value: 張劭母親懷疑兒子的朋友可能不會赴約，因為他們分別已【　】了，再加上路途距離【　】，想實踐這個約定並不容易。
      blanks:
      - answer: 二年/兩年
      - answer: 千里/遙遠
    - label: '3'
      value: 張劭表示：朋友是一個【　】，一定會來，張劭母親便為他們準備酒菜。
      blanks:
      - answer: 信士/守信的人
  - label: 結果
    sub_label: 約定的那天
    value: 范式如期赴約，他問候了張劭的父母，又和張劭一起喝酒、聊天，盡興後才離開。
