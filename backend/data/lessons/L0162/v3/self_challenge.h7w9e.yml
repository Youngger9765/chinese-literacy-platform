lesson_uid: L0162
version_id: v3
section_no: 六
self_challenge:
  label: 六、自我挑戰
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  passage: 馬亮善相人，為夔路1監司2日，呂夷簡3父為州職官，一見夷簡，即許以女嫁之。其妻怒曰：「君嘗以此女為國夫人，何為與此人子？」亮曰：「此所以為國夫人也。」(112會)
  annotations:
  - 'no': 1
    term: 路
    text: 宋代地方行政單位，層級由高至低為路、州、縣。
  - 'no': 2
    term: 監司
    text: 監察地方屬吏的職官。
  - 'no': 3
    term: 呂夷簡
    text: 宋仁宗時的宰相。
  translation: 馬亮很會看人，當時他是夔路監司，呂夷簡的父親是州職官(依注釋可知，馬亮是呂父的長官)。馬亮初見呂夷簡，就把女兒許配給他。他的妻子生氣地說：｢您曾說要讓女兒成為國公夫人，為何把女兒嫁給這個人的兒子?｣馬亮說：｢這就是讓女兒成為國公夫人的辦法。｣
  items:
  - label: （一）
    instruction: 請依照故事脈絡，回答下列問題。
    answer_carrier: 橘色手寫（在文字層），PDF p10 可見
    questions:
    - index: 1
      prompt: 根據斷句後的第一個分句，主語是誰？
      answer: 馬亮
    - index: 2
      prompt: 承上題，這個主語怎麼樣或做什麼？
      answer: 他很會相人/他是夔路監司
    - index: 3
      prompt: 這個分句還有另一個人物，他叫什麼名字？
      answer: 呂夷簡
    - index: 4
      prompt: 承上題，這個人怎麼樣或做什麼？
      answer: 他的爸爸是州職官
    - index: 5
      prompt: 根據這個分句出現的人物，誰「一見夷簡，即許以女嫁之」？(補主語)
      answer: 馬亮
  quiz:
    label: （二）閱讀理解測驗
    questions:
    - index: 1
      stem: 根據這段文字，下列敘述何者最恰當？
      options:
        A: 馬亮預見呂夷簡將來必身居朝廷要職
        B: 馬亮與呂父有私交，故結為兒女親家
        C: 馬亮之妻希望女兒嫁入國夫人的家中
        D: 馬亮為了升官，把女兒許配給呂夷簡
      answer: A
      options_note: 這四個選項的代號後面沒有印頓點（A馬亮…），與前面各大題的「A.」不同，原稿如此
  notes:
    teacher: （老師可視同學情況決定是否做此大題）
    strategy_flow: '三個箭號都是文字層真的字元 U+2B62（⭢），不是 w:sym —— 全檔 w:sym 只有 F0FE 與 F026，

      沒有任何箭號符號，所以照字面抄無誤（與同批 L0160 相同）。'
    passage: 句末的「(112會)」是題目來源標記（112 年會考），原稿如此
    annotations: 這三條注釋前面有一個 `w:sym Wingdings F026` 的裝飾圖示（書本符號），不是答案
    translation: '翻譯方塊裡的引號用的是半形的「｢」「｣」(U+FF62/U+FF63)，不是全形的「」；問號也是半形「?」。

      照原稿抄，不改。'
  slug: h7w9e
