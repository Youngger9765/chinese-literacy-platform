notes:
  errata:
  - id: E1
    section: 原文
    locator: 第 1 段「與汝南…為友」
    source: 與汝南.張元伯為友。劭.字元伯。
    corrected: 與汝南.張劭為友。劭.字元伯。
    kind: 人名誤植
    why: '原文先寫「與汝南張元伯為友」，緊接著又寫「劭字元伯」—— 用「字」去介紹一個從未出現的本名「劭」，

      句子自己就不通。同一份學習單的另外兩處都寫「張劭」：

      第一大題文白句子比對的原文欄印「（與汝南 張劭為友。劭，字元伯）」，

      古文今譯印「跟汝南人張劭結成朋友。張劭，字元伯」。

      三處裡兩處作「張劭」，且《後漢書．獨行列傳》原文亦作「與汝南張劭為友」。'
    confidence: high
    evidence: document.xml 與 PDF p2 一致（不是轉檔造成的）；同檔另兩處作「張劭」
