  - label: 起因
    value: 范式與張劭都在太學讀書，兩人因此結為好友。學校放假前，__向__約定__後將到他家拜訪。
    blanks:
    - answer: 范式/巨卿
      hint: ''
    - answer: 張劭/元伯
      hint: ''
    - answer: 兩年
      hint: ''
  - label: 經過
    value: 接近約定的日子張劭告訴母親，自己在太學結交的朋友要到家裡拜訪了，請母親幫忙__招待客人。張劭母親懷疑兒子的朋友可能不會赴約，因為他們分別已__了，再加上路途距離__，想實踐這個約定並不容易。張劭表示：朋友是一個__，一定會來，張劭母親便為他們準備酒菜。
    blanks:
    - answer: 設饌/準備酒菜
      hint: ''
    - answer: 二年/兩年
      hint: ''
    - answer: 千里/遙遠
      hint: ''
    - answer: 信士/守信的人
      hint: ''
  - label: 結果
    value: 約定的那天范式如期赴約，他問候了張劭的父母，又和張劭一起喝酒、聊天，盡興後才離開。
    blanks: []
