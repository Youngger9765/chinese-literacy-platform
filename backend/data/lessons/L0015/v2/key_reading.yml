passage: 手術順利完成，醫生說以他身體虛弱的狀態，可能不能跑步，因為跑極地馬拉松腳磨破、起水泡是家常便飯，炎熱或酷寒的天氣，增加了死亡的風險。身邊親友都勸他不要執著󠇤於賽事，好好過生活也不錯。陳彥博卻不這麼想，他問自己：「如果有一天，陳彥博不再跑步、不再冒險，那會怎樣？」他發現，答案很簡單，跑步是他唯一擅長也享受其中的事，如果上天給了他再活一次的機會，怎麼能夠不痛快淋漓的享受它？所以他克服身體上的不舒服，一次次的努力復健，開始嘗試再次跑步。雖然術後的體力大不如前，肌肉強度也不見了，但頑強的他，靠著漫長的訓練慢慢走出來，恢復從前狀態。
