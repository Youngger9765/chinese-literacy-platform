spotlight:
  lesson: G4-L4
  strategy_name: 推論策略-推論代名詞
  strategy_type: inference
  blocks:
  - type: guide
    text: ◎ 小試身手：請看前後文，勾選框框內代名詞指的是誰或什麼。
  - type: table
    rows:
    - - '1'
      - 陳彥博與超馬好手林義傑、劉柏園組隊，挑戰磁北極六百五十公里極限馬拉松，他是歷屆最年輕完賽的選手。
      - '□林義傑

        □劉柏園

        陳彥博'
    - - '2'
      - 跑步是他唯一擅長也享受其中的事，如果上天給了他再活一次的機會，怎麼能夠不痛快淋漓的享受它？
      - '跑步　

        □上天'
    - - '3'
      - 阿雄很好奇的問外婆：「為什麼您的心地這麼好？」
      - '□阿雄

        外婆'
    - - '4'
      - 意如的爸爸是軍人，畫中的他穿著軍服，看起來真神氣。
      - '□意如

        爸爸'
    - - '5'
      - 蘇利文老師用盡一切方法教導海倫‧凱勒，讓她靠著觸摸了解世界。
      - '□蘇利文老師

        海倫‧凱勒'
    - - '6'
      - 多多遇到忙著撿果實的小松鼠，他問：「我的寶物失蹤了，它摸起來冰涼光滑，你撿到了嗎？」
      - '□多多

        □小松鼠

        寶物'
    - - '7'
      - 彼得在小精靈叮叮的協助下找到影子，溫蒂也好心的用針線幫他把影子縫回身上。
      - '彼得

        □叮叮

        □溫蒂'
    - - '8'
      - 姐姐在教室裡教我染布，讓我先綁緊布料，再把它們放到染桶裡，靜靜等待染料施展魔法。
      - "□姊姊\n布料 \n□我"
    - - '9'
      - "事實上，美不專屬於藝術家，「美」是人人都能感受得到的一種愉悅經驗，它可能就在街頭轉角，也可能在不經意間的一瞥裡。  　　　 \n《美，是一種感動》－李賢文"
      - "美  \n□藝術家\n□人人"
