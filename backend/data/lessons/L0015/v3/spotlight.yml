lesson_uid: L0015
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論代名詞
  strategy_type: inference
  blocks:
  - type: concept_box
    text: '代名詞，也叫做指稱詞。文章中，作者常會用「他、她、牠、它、我、你、您」來代替前面出現的人、動物或東西。我們要知道這些詞指的是誰或什麼，才會讀懂句子的意思。要推論代名詞，可以這樣做：

      ❶找代名詞：他、她、牠、它、我、你、您。

      ❷看看前後文：可能是在說誰或什麼？

      ❸放回句子讀：意思通順嗎？'
  - type: sub_block
    label: ◎ 小試身手
    instruction: ◎ 小試身手：請看前後文，勾選框框內代名詞指的是誰或什麼。
    items:
    - type: single
      index: 1
      prompt: 陳彥博與超馬好手林義傑、劉柏園組隊，挑戰磁北極六百五十公里極限馬拉松，他是歷屆最年輕完賽的選手。
      pronoun: 他
      options:
        1: 林義傑
        2: 劉柏園
        3: 陳彥博
      answer: 3
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
