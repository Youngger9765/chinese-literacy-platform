intro: 這篇文章介紹了臺灣極地超級馬拉松選手陳彥博的故事。他是一位勇於挑戰極限的運動員，曾經跑過沙漠、高山和冰原，並且是第一位獲得四大極地超級馬拉松巡迴賽總冠軍的亞洲人。文章描述了他如何從年輕時就立下遠大夢想，並在追逐夢想的過程中，面臨了意想不到的健康挑戰。即使在得知罹患重病後，他依然展現出堅韌的意志，努力克服身體的不適，重新站上跑道，繼續挑戰自我，完成他對超級馬拉松的熱愛與承諾。
strategy_explained: 這篇文章要練習的是，當作者寫「他」或是「她」的時候，我們要仔細想想，這些字指的是誰，因為陳彥博在追逐夢想的路上，遇到很多困難，有時候會用代名詞來指代他自己或遇到的挑戰，讀的時候，可以一邊讀一邊在心裡想，這些「他」、「她」或是「它們」到底是指文章裡的哪個人、事、物，這樣就能更清楚故事的發展和陳彥博的堅持
