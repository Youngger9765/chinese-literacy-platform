multiple_choice:
- question: 下列語詞何者使用正確？
  options:
  - 臺北一零一大樓在市中心「艱鉅」，格外引人注目。（矗立）
  - 這條山路狹窄，路面「矗立」不平，實在是難以行走。（崎嶇）
  - 開採金礦，這項「崎嶇」的工作並非一人之力可以單獨完成。（艱鉅）
  - 中央氣象署根據氣象「觀測」資料，提供民眾每日天氣預報。
  answer: D
  explanation: 選項A、B、C中的語詞使用皆不正確，只有選項D中的「觀測」用於氣象資料的收集與分析，符合語意。
- question: 關於「巨石陣」一文中，何者敘述正確？
  options:
  - 科學家已經確定巨石陣的建造目的。
  - 巨石陣是由英國船長在航海中發現。
  - 巨石陣為環狀組成，像圓形的石林。
  - 巨石陣的石頭都是一根一根直立柱。
  answer: D
  explanation: 文中第一段，有橫放的巨石
- question: 關於「摩艾走路」一文中，何者敘述不正確？
  options:
  - 一個摩艾石像是由多塊石頭拼湊而成。
  - 從山上到海邊石像的道路，大多崎嶇不平。
  - 現代的起重機要豎立石像仍然極不容易。（文中第三段）。
  answer: A
  explanation: 第二段提到石像大多是一體成形
- question: 請問巨石陣與摩艾走路這兩篇文章，其共同的未解之謎為何?
  options:
  - 兩者名稱的由來眾說紛紜？
  - 建造它們的工具有何不同？
  - 巨石的來源地在哪？
  - 石頭巨大，如何搬運移動？
  answer: D
  explanation: 兩篇文章都花費大量篇幅討論古代人在沒有現代機械的情況下，如何搬運和移動巨大笨重的石頭，這至今仍是未解之謎。
- question: 根據這兩篇文章，作者使用了相同的寫作手法，請問寫作順序為何？
  options:
  - 發現由來→令人好奇的問題→三個假設→未解之謎。
  - 發現由來→未解之謎→三個假設→令人好奇的問題。
  - 三個假設→發現由來→令人好奇的問題→未解之謎。
  - 未解之謎→發現由來→三個假設→令人好奇的問題。
  answer: A
  explanation: 兩篇文章的寫作順序都先介紹巨石陣或摩艾石像的發現經過，接著提出關於它們建造方式或目的的疑問，再針對這些疑問提出三種假設，最後指出這些謎團至今仍未有定論，因此是「發現由來→令人好奇的問題→三個假設→未解
