title: 多文本-未解之謎-巨石陣+摩艾石像
genre: 說明文
text_type: 多*2
reading_strategy: 1.相同主題比較異同2.用科學方法(假設、考驗、結果、結論)解決問題
story_text: '西元1130年，一位神父外出散步時，偶然在英國倫敦西南方埃姆斯伯里發現了一個驚人的石陣，石陣裡有一組一組的ㄇ型巨石組，它們矗立於曠野中，作環狀排列，就像一座圓形的石林。每個ㄇ型巨石組，由兩個直立石柱及一個橫放在上方的巨石組成，光是上方的巨石就重達7噸。這就是世上最著名、最神秘的史前遺跡──英國巨石陣。科學家估計，巨石陣大約是西元前1600年建造完成的。

  至今沒有人可以很肯定說出巨石陣是如何建造的？建造的目的是什麼？巨石陣的石塊稱為薩爾森石，來自附近的山丘，距離巨石陣約25公里。每一顆薩爾森石重量平均約20噸，有的重達30噸，最高的有9公尺高。令人好奇的是，石頭這麼多、這麼巨大笨重，當時的人們沒有大型機械，如何克服崎嶇的地形，把它們搬運了25公里？目前最有可能的說法是：古代人製作了大型的木橇，將石塊移到橇上，在橇下放置原木滾輪，最後再集合許多人將巨石拖行。但是把一個巨石在崎嶇不平的地上搬運25公里，已經相當困難，整個巨石陣的巨石超過50個，這麼浩大的工程，光是想像，就讓人肅然起敬。而當時的人們究竟採用哪條路線、用什麼樣的技術運來石塊，至今仍是一團謎。

  關於巨石陣設立的目的也是眾說紛紜，人們提出了三個假設：

  假設一：巨石陣是外星人的基地。

  假設二：巨石陣是古代的醫院。

  假設三：巨石陣為古代人為了觀測天文而建造的。

  到目前為止，假設三是最可能成立的。也許一千多年前，住在這裡的人，建製了可以觀測天象的巨石陣，而這麼宏偉的建築，也同時是宗教的場所，被用來安慰生病及身心障礙的人們。但，這也只是一個假設而已，而且，新的問題又來了──這麼久以前的人類祖先，是誰教他們預測日食、月食的天文知識呢？你有什麼假設嗎？

  巨石陣到底從何而來，為何而設？至今仍未有定論。無獨有偶，在相距幾千公里外的太平洋小島上，有一群巨大的石像，也有這般引人好奇的未解之謎。

  西元1722年4月5日，荷蘭西印度公司的羅格文船長，帶著他的船隊發現南太平洋的這座小島。他很訝異地看到岸邊矗立著一尊一尊巨大的石像，它們背向海洋，面向島內。石像非常巨大，看來幾百個人也無法移動。目瞪口呆的船長問道：「他們到底是怎麼辦到的？」因為那天正好是復活節，羅格文船長當天就在航海日記上，把這個島命名為復活節島。

  復活節島，是全世界人煙稀少的一角。距離這裡最近的陸地是東邊3700多公里的智利海岸，往西，要航行2000公里才會見到另外一座島。島上的石像大約有九百尊，當地原住民稱石像為「摩艾石像」。大多數摩艾是一體成形的，也就是說，一尊石像，是從同一塊大石頭刻出來的，但有部分石像頭上會加一塊帽子，一頂帽子可重達十幾噸。

  許多考古的證據顯示，摩艾石像是原住民在西元1250到1500年間，在山上的採石場採集、雕刻、移動十幾公里後，在海邊的平台豎立起來的。島上最高的摩艾石像被稱為帕洛，幾乎10公尺高，重82公噸。其它的摩艾，最輕的有9公噸，最重的有250公噸。1994年，許多石像都已倒地，智利政府出動能吊起50公噸重物的起重機，費盡千辛萬苦，才把它們重新豎立。利用現代機械，這項修復工程仍然極為艱鉅。羅格文船長三百年前提的問題：「他們到底是怎麼辦到的？」到現在仍未得到確定的解答。但人們經過考證與實驗，提出了怎麼移動摩艾石像的三個假設：

  假設一：有超自然的力量移動了石像。

  假設二：用滾輪把石像移到海邊。

  假設三：把石像立起來，用繩索拉扯移動。

  摩艾石像當初是做什麼的？至今人們仍然不清楚。它們七、八百年前怎麼從山上「走」到海邊的，到今天仍是人們爭論不休的話題。'
