multiple_choice:
- question: 下列成語，何者最適合用來形容顧寧人先生的讀書態度？
  options:
  - 旁徵博引
  - 溫故知新
  - 孳孳不倦
  - 披星戴月
  answer: C
  explanation: 課文中提到顧寧人先生「從小到老，從來沒有一天不讀書」以及「從不曾表現出疲倦的樣子來」，這些描述都強調了他勤勉不懈、不知疲倦的讀書態度，「孳孳不倦」意指勤奮努力，不知疲倦，最能貼切形容他的精神。
- question: 有關顧寧人先生的描述，下列何者沒有在本文中提及？
  options:
  - 家世背景
  - 興趣嗜好
  - 資質稟賦
  - 學術地位
  answer: D
  explanation: 課文中提及顧寧人的家世背景（生長世族）、興趣嗜好（無他嗜好，即沒有其他嗜好）、資質稟賦（少負絕異之資），但並未提及他的學術地位。
- question: 下列選項，何者無法證明顧寧人是愛讀書的人？
  options:
  - 生長世族，少負絕異之資
  - 潛心古學，九經諸史，略能背誦
  - 自少至老，未嘗一日廢書
  - 旅店少休，披尋搜討，曾無倦色
  answer: A
  explanation: 選項A描述顧寧人的家世背景和天賦異稟的資質，這說明他有學習的潛力，但並未直接證明他「愛讀書」的行為或態度。其他選項皆直接描述了他對讀書的投入、堅持與不懈。
- question: 下列何者是本文主旨？
  options:
  - 敘述顧寧人優秀不凡的資質
  - 讚美顧寧人勝過一般人的精力
  - 推崇顧寧人勤勉好學的精神
  - 介紹顧寧人顯赫尊貴的家世
  answer: C
  explanation: 文章的標題「愛讀書的顧寧人」已點出主題，內容詳細描述顧寧人年少時潛心古學、能背誦經史，以及終其一生堅持不懈、從不廢書的讀書習慣，這些都旨在推崇他勤奮好學的精神。其他選項雖然在文中有所提及，但都是為了襯
- question: 「旅店少休」的「少」，與下列哪一選項的「少」字意思相同？
  options:
  - 老「少」咸宜
  - 「少」安勿躁
  - 「少」管閒事
  - 積「少」成多。
  answer: B
  explanation: 「旅店少休」的「少」意為「稍微」或「短暫地」，表示時間的短暫。選項B「少安勿躁」的「少」意為「稍微」或「一點點」，表示程度上的輕微，兩者都作為副詞修飾動詞或形容詞，表示輕微的程度或短暫的持續，意思最為
