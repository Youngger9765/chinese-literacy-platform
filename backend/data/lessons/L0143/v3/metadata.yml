intro: 這篇文章探討了「高地訓練」是否能有效提升運動表現，特別是長跑運動員。文章以肯亞跑者在馬拉松賽事中的優異表現為引子，引出高地訓練可能是一種提升運動能力的假設。接著，文章透過介紹幾項科學研究，呈現了高地訓練對運動員身體的影響，例如紅血球數量的變化，以及這些變化與運動成績之間的關聯。同時，文章也探討了高地訓練並非對所有人都有效，並說明了其原因。最後，文章提醒我們，運動訓練需要考量個人的生理差異，量身打造訓練計畫，才能達到最佳效果。
