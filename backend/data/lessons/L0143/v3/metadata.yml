strategy_explained: '這篇文章要帶你練習「讀懂一篇文章的重點架構」

  為什麼選它呢因為它用「提出問題、舉例研究、探討原因、提出結論」這樣的順序來分析高地訓練的效果，很清楚地呈現了說明文的邏輯

  讀的時候，你可以試著找出作者是怎麼一步步說明高地訓練這件事的，像是先講肯亞跑者的例子，再講科學研究，最後提醒我們要注意個人差異，這樣就能抓到文章的核心意思囉'
