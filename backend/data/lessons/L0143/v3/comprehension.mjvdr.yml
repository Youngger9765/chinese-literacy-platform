lesson_uid: L0143
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    stem: 依文中所述，下列哪一個圖是「血栓」?
    options_are_images: true
    options:
      A: ''
      B: (血管暢通)
      C: (血液流動方向)
      D: (血球)
    options_note: '四個選項是四張圖（w:drawing）。文字層只有「A.」「B.」「C.」「D.」加上教師版的橘色括號註記；

      A 沒有註記。括號裡的字是註記，不是選項內容本身。'
    answer: A
    explanation: (血栓為血管堵住，所以為A)
  - index: 2
    stem: 根據課文，運動員接受高地訓練可能有什麼好處？
    options:
      A: 高地稀薄的空氣可以讓血液變得濃稠
      B: 高地訓練可以提升每一位運動員的長跑成績
      C: 高地訓練可以刺激每位運動員體內EPO的生成
      D: 高地稀薄的空氣，可能有助於提升運動員的心肺耐力
    answer: D
    explanation: 'A.紅血球太多會使血液變黏稠

      B.因人而異。

      C.不一定。

      D.根據第三段：高地訓練會增進心肺耐力。'
    explanation_note: 這一題的解析是逐選項的，印成兩個文字方塊（A~C 一個、D 一個）
  - index: 3
    stem: 紅血球與紅血球生成素的敘述，下列何者錯誤？
    options:
      A: 紅血球太多，容易讓血液變得濃稠
      B: 紅血球太多，不一定能幫助運動員
      C: 紅血球的多寡可能會影響長跑成績
      D: 每個人高地訓練後，紅血球都會增加
    answer: D
    explanation: （A-第七段，紅血球多會造成血液變濃稠。B-第七段，紅血球太多會造成血液太濃稠。C-紅血球增加者，長跑成績會更進步。D-紅血球生成素的濃度因人而異。）
  - index: 4
    stem: 根據本文，下列選項何者最符合作者想傳達的理念？
    options:
      A: 高海拔地區可以產出更多長跑好手
      B: 到高地訓練，容易發生血栓的危險
      C: 高地訓練需考量運動員的個別差異
      D: 運動員體內都有大量攜氧的紅血球
    answer: C
    explanation: （根據總結，高地訓練的效果因人而異，訓練要考量個別差異才行。)
    explanation_note: 這句的括號一邊全形一邊半形（（…)），原稿如此
  - index: 5
    stem: 文章中用三個研究說明高地訓練對運動員的影響，請問這樣的寫作方式目的是什麼？
    options:
      A: 作者想強調自己的勤奮與博學多聞
      B: 用三個研究增強論點的完整性與說服力
      C: 比較三個不同研究的差異之處
      D: 用三個研究增強文章的豐富度
    answer: B
    explanation: （作者先拋出提問高地訓練對運動員均有幫助嗎?答案是不一定。最後用三個研究證明他的論點，加強文章說服力。)
  notes:
    answer_carrier: 橘色手寫代號（在文字層），PDF p9 可見
  slug: mjvdr
