  items:
  - index: 1
    word: 因人而異
    definition: 每個人的情況或反應都不相同。
  - index: 2
    word: 囊括
    definition: 比喻得到全部的獎項或事物。
  - index: 3
    word: 血栓
    definition: 堵塞血管的血塊。
  - index: 4
    word: 稀薄
    definition: 稀少、淡薄。
  - index: 5
    word: 堵住
    definition: 塞住。
  - index: 6
    word: 功不可沒
    definition: 功勞極大，不可忽略。
  - index: 7
    word: 濃稠
    definition: 濃厚而黏稠。
  - index: 8
    word: 凝血現象
    definition: 血液由液態逐漸凝固，形成血塊的過程。
