source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 一說起馬拉松，所有人腦海中都會浮現「肯亞」這個非洲國家。近年來，肯亞幾乎囊括了世界級馬拉松大賽的大小獎項，馬拉松史上前十傑，肯亞佔了七名，世界紀錄保持人基普喬吉就是其中之一。
- 基普喬吉出生在海拔1980公尺的村落，16歲時搬到海拔2112公尺處接受訓練；37歲時，他的訓練地和居住地都在海拔2500公尺的高地。他和夥伴在馬拉松的佳績，高地訓練似乎功不可沒。
- 長跑是有氧運動，跑步時，肌肉會大量耗氧，怎麼讓運動員的身體可以運送更大量的氧氣，就成了訓練的重要課題。一個假設是，基普喬吉和夥伴們在高地訓練，低氣壓、氧氣稀薄的環境，可能會促使他們血液中運送氧氣的紅血球和血紅素高於常人，心肺功能及耐力也可能有所進步。但高地訓練真的對每個運動員都有幫助嗎？
- 2003年，科學家讓一群運動員在海拔2800公尺待了一天，再觀察他們紅血球生成素（簡稱EPO，刺激人體製造紅血球的激素）的濃度變化，結果每個人的反應有很大的差異，有一位運動員的EPO濃度降低，但另一位運動員升高了400％以上。也就是說，雖然同樣在高地，但EPO的反應因人而異。
- 另一個研究，讓長跑運動員在高地接受訓練一個月，部分運動員的紅血球供應量平均增加約8％，他們回到平地後，5000公尺成績平均快了37秒；而紅血球未增加的人回到平地後，5000公尺成績則比先前差了一點。也就是說，這個研究重複得到研究一的結論──高地訓練對紅血球增生的效果因人而異，但這個研究更進一步指出，紅血球增加者，長跑成績才會進步。
- 科學家研究了住在南美洲安地斯山區的玻利維亞人，那裡的海拔在3900公尺以上，空氣稀薄，氧氣只有平地的60％。為了適應稀薄的空氣，玻利維亞人身上有大量紅血球，以克服空氣中氧氣稀少的問題，但居民血液中紅血球多，血液因此變得濃稠了。從運動的角度來看，這未必是件好事，因為跑步時血液需要快速流動，如果血液太濃稠，血液就比較可能出現凝血現象，增加發生血栓的風險，堵住了重要的血管，讓血液流動困難，輕則影響運動表現，重則引發心臟或大腦的病變。
- 總之，目前研究並不支持「只要高海拔訓練，就一定能造就不易疲乏的跑步健將」這種說法。也不能說，未經高地訓練就不可能成為優秀的長跑好手。這篇文章的重點之一是，高地訓練的成效因個人而異，訓練一定要考量個別差異。亦即，想要有好成績，必須根據每個運動員獨特的生理狀態，量身制定訓練計畫，才可能有最好的成效。
