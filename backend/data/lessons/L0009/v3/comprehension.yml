lesson_uid: L0009
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列語詞何者使用不正確？
    options:
      A: 一陣「凜冽」的寒風吹來，冷得我不由自主地縮起脖子
      B: 他從二樓跳下來，竟然「毫髮無傷」，真讓人驚訝
      C: 一想起跟好朋友吵架的事，我就「輾轉難眠」，一直睡不著
      D: 跑完一百公尺，我只能「奄奄一息」的喘氣
    teacher_note: (「奄奄一息」意思是生命垂危、快要死掉了，多用在重病、重傷或極度虛弱的情境中，語氣非常強烈。)
  - index: 2
    answer: C
    stem: 獵人在山中無法安心入睡，最可能的原因是什麼？
    options:
      A: 他擔心下雪抓不到獵物
      B: 他怕黑夜裡遇到狼群攻擊
      C: 他擔心家裡的小寶和白牙是否平安
      D: 他害怕明天天氣更差，會回不了家
    teacher_note: (第四段描述獵人「輾轉難眠，想著的都是：小寶會不會餓了？白牙會照顧他吧？」所以擔心的是孩子跟白牙。)
  - index: 3
    answer: B
    stem: 獵人為什麼會懷疑白牙吃了小寶？
    options:
      A: 因為白牙肚子餓了
      B: 因為朋友曾經警告他
      C: 因為白牙很喜歡小寶
      D: 因為白牙搖著尾巴迎接他
    teacher_note: (第六段。A－是誤導選項，故事沒寫白牙餓得失控。C－正確事實，但不可能因此懷疑。D－是白牙表現信任的行為，反而是無害的證據。)
  - index: 4
    answer: A
    stem: 第十三段提到：「白牙已經奄奄一息，但牠用盡全力，把尾巴搖了幾下。」為什麼白牙快死了，還在搖尾巴？
    options:
      A: 因為白牙還是很信任主人
      B: 因為每隻狗臨死時都會搖尾巴
      C: 因為白牙覺得主人在跟牠玩
      D: 因為白牙想要主人給牠東西吃
    teacher_note: (第十三段：白牙沒有反抗，還搖尾巴，是牠信任主人的表現。)
  - index: 5
    answer: B
    stem: 讀完本課，請問作者想要傳達什麼道理？
    options:
      A: 狗咬人的本性很難改變，要特別小心
      B: 衝動的決定可能帶來無法挽回的錯誤
      C: 不要單獨留小孩子在家裡，容易有意外發生
      D: 防人之心不可無，即使是信任的朋友，也要有所保留
    teacher_note: (A-是村人偏見的錯誤看法。C-是情節中安排情境，不是作者的主張。D-雖看似合理，但白牙並沒有背叛，是獵人自己誤會了牠。)
