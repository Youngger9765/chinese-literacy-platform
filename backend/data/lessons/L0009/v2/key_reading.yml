passage: 獵人背起獵槍，走向白茫茫的山林。他巡視了之前設下的陷阱，處理了皮毛和獸肉，沒想到暴風雪來襲，氣溫驟降，寒風像刀子般凜冽。他伸手不見五指，只能找了個樹洞躲了一晚。但他心裡忐忑不安，輾轉難眠，想著的都是：「小寶會不會餓了？白牙會照顧他吧？」
