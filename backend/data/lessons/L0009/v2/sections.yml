comprehension:
  questions:
  - index: 1
    answer: D
    stem: 下列語詞何者使用不正確？
    options:
      A: 一陣「凜冽」的寒風吹來，冷得我不由自主地縮起脖子
      B: 他從二樓跳下來，竟然「毫髮無傷」，真讓人驚訝
      C: 一想起跟好朋友吵架的事，我就「輾轉難眠」，一直睡不著
      D: 跑完一百公尺，我只能「奄奄一息」的喘氣
    rationale: null
  - index: 2
    answer: C
    stem: 獵人在山中無法安心入睡，最可能的原因是什麼？
    options:
      B: 因為朋友曾經警告他
      C: 因為白牙很喜歡小寶
      D: 因為白牙搖著尾巴迎接他
      A: 因為白牙肚子餓了
    rationale: 第四段描述獵人「輾轉難眠，想著的都是：小寶會不會餓了？白牙會照顧他吧？」所以擔心的是孩子跟白牙。
  - index: 4
    answer: A
    stem: 第十三段提到：「白牙已經奄奄一息，但牠用盡全力，把尾巴搖了幾下。」為什麼白牙快死了，還在搖尾巴？
    options:
      B: 因為每隻狗臨死時都會搖尾巴
      C: 因為白牙覺得主人在跟牠玩
      D: 因為白牙想要主人給牠東西吃
      A: 第十三段：白牙沒有反抗，還搖尾巴，是牠信任主人的表現。
    rationale: 第十三段：白牙沒有反抗，還搖尾巴，是牠信任主人的表現。
    is_rationale: true
  - index: 5
    answer: B
    stem: 讀完本課，請問作者想要傳達什麼道理？
    options:
      A: 狗咬人的本性很難改變，要特別小心
      B: 衝動的決定可能帶來無法挽回的錯誤
      C: 不要單獨留小孩子在家裡，容易有意外發生
      D: 防人之心不可無，即使是信任的朋友，也要有所保留
    rationale: A-是村人偏見的錯誤看法。C-是情節中安排情境，不是作者的主張。D-雖看似合理，但白牙並沒有背叛，是獵人自己誤會了牠。
