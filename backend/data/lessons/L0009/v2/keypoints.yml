keypoints:
  lesson: G4-L18
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 背景
    value: '1.獵人住在森林邊，有一條忠心的狗白牙。白牙有__的血統，看起來兇猛，鎮上的人都很怕牠，但獵人很信任牠。

      2.獵人結婚後有了孩子──小寶。妻子過世後，獵人擔心外出打獵時，小寶一個人在家會有__，請白牙負責照顧小寶。'
    blanks:
    - answer: 狼
      hint: ''
    - answer: 危險
      hint: ''
  - label: 起因
    value: 冬天獵人上山查看陷阱，遇__無法回家，只能在山上過夜。他很擔心家裡的孩子和白牙。
    blanks:
    - answer: 暴風雪
      hint: ''
  - label: 經過
    value: '獵人回家後發現屋內一片混亂，滿地血跡，小寶不見，白牙滿身是血。

      他懷疑白牙__，一氣之下砍了白牙。這時從床底傳來小寶的哭聲。'
    blanks:
    - answer: 吃了孩子
      hint: ''
  - label: 結果
    value: '小寶毫髮無傷，牆角卻有一頭死去的大灰狼。獵人明白是白牙

      __了孩子。他後悔自己誤會了白牙，抱著小寶向白牙

      __，但白牙已奄奄一息，最後搖幾下尾巴就斷氣了。'
    blanks:
    - answer: 保護
      hint: ''
    - answer: 道歉
      hint: ''
  title: 白牙的最後一戰
