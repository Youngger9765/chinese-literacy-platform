multiple_choice:
- question: 請問怪物的名字是什麼？
  options:
  - 弗蘭肯斯坦。
  - 瑪麗•雪萊。
  - 普羅米修斯。
  - 怪物沒有名字。
  answer: C
  explanation: 第七段提到，怪物其實沒有名字。
- question: 下列哪個句子中的語詞運用錯誤？
  options:
  - 大雄和小孟大吵一架後，他一時氣不過便「奪門而出」。
  - 陽光太強，小美一手提東西，只好「隻手遮天」擋住陽光。
  - 為了讓自己訓練時更專注，他「離群索居」到深山裡受訓。
  - 研究顯示，運動前吃香蕉，有助於預防運動後肌肉「痙攣」。
  answer: B
  explanation: 「隻手遮天」的意思是比喻隱瞞事實的真相，而不是用來描述用手遮擋陽光。
- question: 根據文章，下列敘述何者不正確？
  options:
  - 弗蘭肯斯坦因爲想起曾看見樹被閃電擊中的景象，而得到用電流進行造人實驗的靈感。
  - 雖然弗蘭肯斯坦成功的造出「人」來，但隨後就被自己創造出來的「人」嚇得奪門而出。
  - 怪物透過學習，慢慢擁有知識和判斷力，起初被討厭，最終因他的善良而被人類接納。
  - 小說的中文翻譯是⟪科學怪人⟫，有人認為「科學怪人」是指怪物，也有人認為是科學家。
  answer: C
  explanation: 課文內容主要為閱讀練習說明、語詞解釋與配對，以及針對「科學怪人」書名指稱的討論，並未提及小說的任何情節。選項A和B所描述的情節（弗蘭肯斯坦的靈感來源、造人後被嚇跑）在原著小說中是存在的，但課文未提及。
- question: 小說的副標題是「現代普羅米修斯」，原因可能是什麼？
  options:
  - 弗蘭肯斯坦造人的行為和普羅米修斯一樣，觸犯了神的禁忌。
  - 弗蘭肯斯坦把普羅米修斯當成目標，立志成為普羅米修斯。
  - 科學怪人和普羅米修斯一樣，都被用鐵鍊綁起來並鎖在高處。
  - 作者希望弗蘭肯斯坦能像普羅米修斯一樣，接受神的懲罰。
  answer: A
  explanation: 小說副標題「現代普羅米修斯」比喻弗蘭肯斯坦如同普羅米修斯般，因僭越神權創造生命而觸犯了神的禁忌。
- question: 根據文章，下面哪個選項比較接近本文主旨？
  options:
  - 為了讓科學可以有更好的發展，我們應該要投注所有的心力。
  - 不要隨便觸犯神的禁忌，否則將會招來厄運，最後不得善終。
  - 怪物很可憐，沒有名字，也沒有人愛，才會造成一連串悲劇。
  - 發展科學時不能只關注知識本身，也要留意可能帶來的後果。
  answer: D
  explanation: 課文中特別指出「科學怪人」指的是瘋狂科學家弗蘭肯斯坦，他的故事正是提醒我們在發展科學時，除了追求知識，也必須深思其可能帶來的倫理與社會後果。
