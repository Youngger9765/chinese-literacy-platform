passage: 那年我已升上國中，戲院更加蕭條。導師了解我的處境，每學期都會悄悄送我參考書；理化老師讓我晚上到他空著的宿舍自習，雖然只去幾次，卻讓我倍感溫暖。在紛亂的生活中，我逐漸摸索出讀書的時機與訣竅。顧檳榔攤時最怕遇見同學，我乾脆埋頭寫練習卷避開尷尬，客人見我用功，先是驚訝，接著還會讚賞我一番。電影放映時，我在戲院入口看門或顧車，沒有桌子，我便拿著需要記誦的課本，一邊背一邊來回踱步，即使耳邊傳來銀幕上忽大忽小的對白聲，也絲毫不影響我的專心。需要計算的科目則留到打烊後，奶奶嫌電費貴，不准我開燈，我便等她熟睡後，再打開桌上小檯燈，把家政課做的黑色十字繡罩在燈上，在縫隙滲出的微光下解題。
