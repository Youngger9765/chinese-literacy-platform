    answer: A
    stem: 下列語詞何者使用不正確?Ａ－蜂擁而至指的是大家前來，語意錯誤
    options:
      A: 一聽到警報聲，大家「蜂擁而至」的逃出教室
      B: 這座城市因觀光業「崛起」，變得越來越繁榮
      C: 颱風來襲前，民眾「倉皇」搶購物資
      D: 他講稿沒準備好，上場時顯得非常「狼狽」
    rationale: null
  - index: 2
    answer: B
    stem: 作者提到戲院是她的家，但為什麼她說「這個家讓人不安心」？
    options:
      A: 因為戲院經常斷電停水
      B: 戲院裡常發生混亂與危險事件
      C: 作者和家人關係不好
      D: 作者常需要在戲院旁顧攤而遇到同學
    rationale: null
  - index: 3
    answer: D
    stem: 文章中提到作者用「黑色十字繡罩在燈上，在縫隙滲出的微光下解題」，這段文字作者主要想凸顯什麼？
    options:
      A: 她熱愛刺繡工藝
      B: 奶奶不疼愛她，嫌棄她是女生
      C: 她不喜歡在那麼亮的燈光下學習
      D: 她在艱困中仍舊堅持學習
    rationale: null
  - index: 4
    answer: C
    stem: 這篇文章最主要想要表達的想法是什麼？
    options:
      A: 最大化的展現父親管理戲院的混亂
      B: 豐富文章情節，使文章更具有可看性
      C: 用童年所處的艱難環境，襯托她仍能努力讀書的可貴
      D: 呈現早期鄉鎮戲院的治安隱憂，提醒觀眾自我保護
