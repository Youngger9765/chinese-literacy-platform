lesson_uid: L0126
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略──推論動機、情緒和想法
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）共 17 個 + 橘色手寫填空，PDF p6~p9 全部可見
  blocks:
  - type: concept_box
    text: '上一課，我們讀人物的行為，推想他為什麼這樣做。這一課，我們要學會用三個步驟，找出有根據的推論。

      推論人物內心三步驟

      ❶找言行：找出人物做了什麼、說了什麼，有什麼表情或反應。

      ❷看情境：回到前後文，看看人物當時遇到什麼事情或困難。

      ❸推內心：把言行和情境合起來，推論人物的動機、情緒或想法。'
  - type: table
    rows:
    - - 要推論什麼？
      - 可以怎麼問？
    - - 動機
      - 他為什麼這樣做？
    - - 情緒
      - 他當時有什麼感受？
    - - 想法
      - 他心裡可能怎麼想？
  - type: guide
    text: 一、戲院困境與賭博事件
  - type: single
    label: 1.找父母的動機（單選）
    prompt: 根據本文3、4段，作者一家遇到什麼困難？父母採取哪些方法改善困境？
    options:
      1: 戲院生意蕭條，父母四處借錢、到賭場碰運氣，並在戲院旁賣東西。
      2: 戲院生意蕭條，父母恢復巡迴放映、到鄉間招攬觀眾，停止經營戲院。
    answer: 1
  - type: guide
    text: '2.推論作者的情緒與想法

      請閱讀下面兩段課文，再完成表格。'
  - type: passage
    label: （課文第三段）
    paragraphs:
    - 「有次放學路上，我看見爸爸和一群人在社區活動中心聚賭，他神色木然，我則漲紅了臉快步離開，像逃離一場不願面對的夢。」
  - type: single
    prompt: ❶找言行：當事人（作者）有什麼表情或動作？（2選1）
    options:
      1: 漲紅了臉，快步離開
      2: 神色木然的面對
    answer: 1
  - type: single
    prompt: ❷看情境：當時發生了什麼事？（2選1）作者看見：
    options:
      1: 爸爸紅著臉快步離開
      2: 爸爸在社區活動中心賭博
    answer: 2
  - type: single
    prompt: ❸推內心：把「言行」和「情境」合起來，推論主角的內心。
    options:
      1: 她覺得爸爸公開賭博很丟臉，想趕快避開。
      2: 她擔心爸爸正在生氣，想趕快回家讀書。
    answer: 1
  - type: passage
    label: （課文第四段）
    paragraphs:
    - 「某個深夜，他倆一身泥巴回到家，我在床上瞇著眼偷聽，才知道警察突襲抓賭，爸媽和賭客們倉皇逃進剛灌溉過的香蕉園，才會如此狼狽。從那天起，每晚我總要等到他們平安進門，才能安心睡著。」
  - type: single
    prompt: ❶找言行：後來，當事人（作者）反覆出現了什麼行為？（3選1）
    options:
      1: 每天晚上在床上瞇著眼偷聽
      2: 每晚等父母平安進門才睡
      3: 每天幫父母清洗沾滿泥巴的衣服
    answer: 2
  - type: single
    prompt: ❷看情境：當時發生了什麼事？（2選1）
    options:
      1: 警察抓賭，爸媽經香蕉園逃回家
      2: 戲院生意差，家中收入不穩定
    answer: 1
  - type: sub_block
    label: ❸推內心：
    items:
    - type: single
      prompt: 情緒：作者每晚等父母回家的情緒是什麼？（4選1）
      options:
        1: 安心
        2: 得意
        3: 擔心
        4: 憤怒
      answer: 3
    - type: single
      prompt: 想法：作者心裡可能有什麼想法？（3選1）
      options:
        1: 希望父母賺更多錢回家
        2: 希望每晚父母都可以平安回來
        3: 希望父母晚一點回來，讓她安心睡著
      answer: 2
    - type: free_text
      prompt: 動機：作者等父母回家的動機是什麼？想要確認【　】，她才能放心睡覺。
      blanks:
      - answer: 父母平安回家
  - type: single
    label: 3.把前面的推論合起來
    prompt: 把父母的動機和作者的內心合起來看，可以看出什麼？（2選1）
    options:
      1: 父母為了維持家計想盡辦法，作者也期待他們靠賭博改善生活。
      2: 父母為了維持家計想盡辦法，但其中賭博的做法讓作者感到難堪與擔心。
    answer: 2
  - type: guide
    text: '二、師長支持與作者讀書行動

      請閱讀下面的課文。你可以一邊讀，一邊把角色做的事畫線。'
  - type: passage
    label: （課文第九段）
    paragraphs:
    - 「導師了解我的處境，每學期都會悄悄送我參考書；理化老師讓我晚上到他空著的宿舍自習，雖然只去幾次，卻讓我倍感溫暖。」
  - type: sub_block
    label: 1.推論老師的動機
    items:
    - type: free_text
      prompt: ❶找言行：兩位老師分別做了什麼？導師：【　】；理化老師：【　】
      blanks:
      - answer: 送作者參考書
      - answer: 讓作者用他的宿舍讀書
    - type: single
      prompt: ❷看情境：作者當時處在什麼情境中？（2選1）
      options:
        1: 成績太差，不願意讀書
        2: 家境困難，也缺少安靜的讀書環境
      answer: 2
    - type: single
      prompt: ❸推內心：動機：兩位老師幫助作者的共同動機，最可能是什麼？（2選1）
      options:
        1: 了解作者的困難，想支持她繼續學習
        2: 希望作者進步後，替老師贏得比賽榮譽
      answer: 1
  - type: guide
    text: '2.推論作者的想法和動機

      請閱讀下面的課文。你可以一邊讀，一邊把角色做的事畫線'
  - type: passage
    paragraphs:
    - 「在紛亂的生活中，我逐漸摸索出讀書的時機與訣竅。顧檳榔攤時最怕遇見同學，我乾脆埋頭寫練習卷避開尷尬。電影放映時，我在戲院入口看門或顧車，沒有桌子，我便拿著需要記誦的課本，一邊背一邊來回踱步。需要計算的科目則留到打烊後，奶奶嫌電費貴，不准我開燈，我便等她熟睡後，再打開桌上小檯燈，在縫隙滲出的微光下解題。」
    note: 這一段是課文第 9 段的節錄改寫（教材自己刪去中間數句），不等於課文原段落
  - type: multi
    prompt: ❶找言行：作者做了哪些事？
    options:
      1: 顧檳榔攤時寫練習卷
      2: 看門或顧車時背課本
      3: 打烊後在微光下解題
      4: 等到家中環境改善後，再開始認真讀書
    answers:
    - 1
    - 2
    - 3
  - type: single
    prompt: ❷看情境：當時作者處在什麼情境中？
    options:
      1: 每天都有安靜、明亮的讀書空間。
      2: 要幫家裡工作，也缺少合適的讀書環境
    answer: 2
  - type: sub_block
    label: ❸推內心：
    items:
    - type: single
      prompt: ⑴把作者的行動和情境合起來，她當時最可能有什麼想法？（單選）
      options:
        1: 讀書環境太差，即使努力也無法改變結果。
        2: 環境雖然不好，我仍能找時間和方法學習。
      answer: 2
    - type: single
      prompt: ⑵作者不斷想辦法讀書，她的動機可能是什麼？（單選）
      options:
        1: 想得到客人的稱讚，證明自己是一個用功的學生。
        2: 想藉由持續學習，為自己走出不同的人生。
        3: 想趕快離開戲院，不必再幫家裡做任何工作。
      answer: 2
  - type: single
    label: 3.把前面的推論合起來
    prompt: 把老師的動機和作者的行動合起來看，可以看出什麼？
    options:
      1: 老師想幫助作者繼續學習，作者只要接受老師的安排即可。
      2: 老師想支持作者繼續學習，作者也主動把握時間、想辦法讀書。
    answer: 2
  - type: single
    label: 三、串起前後線索，回到全文想一想
    prompt: 把前面的推論合起來，可以看出作者如何走出困境？（2選1）
    options:
      1: 家庭困境讓作者不安，但老師的支持和自己的努力，幫助她逐漸改變人生。
      2: 家庭困境讓作者不安，後來主要靠離開戲院，走出不同的人生。
    answer: 1
  - type: self_check
    prompt: ※我會推論了嗎？請你檢查自己是否做到：
    items:
    - 1.我會先找人物的動作、說話或表情。
    - 2.我會讀前後內容，了解人物所處的情境。
    - 3.我會先分清楚題目問的是動機、情緒或想法。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
