strategy_explained: '這一課要練習的是，像偵探一樣，從文章裡的小線索去猜測故事裡的人為什麼會這樣做、心裡在想什麼，還有當時的感受是什麼

  這篇文章裡，作者的家開戲院、也做賭場和檳榔攤的生意，生活環境很不尋常，有很多讓你意想不到的事情，所以很適合你練習從這些細節裡，去推敲人物內心的世界

  讀的時候，你可以試著想想，在那個特別的環境裡，作者的家人心裡在想什麼，他自己又是怎麼感受的，然後才能更了解他怎麼在夾縫中長大喔'
