lesson_uid: L0126
version_id: v3
section_no: 五
keypoints:
  title: 戲院、賭場、檳榔攤：在時代夾縫中成長的我
  layout: list
  answer_carrier: 橘色手寫 + 紅色 ☑（w:sym Wingdings F0FE，在文字層），PDF p5~p6 可見
  rows:
  - label: 家庭背景
    items:
    - label: '1'
      value: 作者一家在美濃定居並開設戲院。後來因電視、錄影帶興起與人口外移，戲院生意蕭條，家中經濟陷入困境。
    - label: '2'
      value: 為解決戲院經營困境，家中長輩做了哪些事？（打勾，複選）
      options:
        1: 四處借錢
        2: 到賭場碰運氣
        3: 在戲院旁賣東西
      answers:
      - 1
      - 2
      - 3
    - label: '3'
      value: 作者從小在家幫忙，曾遇過有人強闖戲院、遭鹹豬手騷擾、打掃時發現吸食強力膠後留下的垃圾。作者的家就是戲院，而戲院令人感到【　】。
      options:
        1: 安全
        2: 不安
      answer: 2
  - label: 突破困境
    items:
    - label: '1'
      value: 師長給予支持：導師送她【　】；理化老師讓她到空著的宿舍【　】。
      blanks:
      - answer: 參考書
      - answer: 自習
    - label: '2'
      value: 作者摸索出讀書的時機與訣竅：①顧檳榔攤寫卷；②在戲院入口看門或顧車時背課本；③打烊後在微弱的燈光下【　】。
      blanks:
      - answer: 解題
    - label: '3'
      value: 結果：考上【　】、【　】，鎮上貼賀榜。最後當了老師、校長，還成了一位作家。
      blanks:
      - answer: 臺南女中
      - answer: 臺南師專
  - label: 回顧與體會
    value: 回顧作者的成長經歷，下列哪些敘述正確？（請打勾，複選）
    options:
      1: 她一直以來都很理解父母的辛苦，不曾抱怨過
      2: 她曾經對家庭的動盪感到埋怨與難堪
      3: 隨著年齡增長，她逐漸體會父母的無奈與辛勞
      4: 她難忘老師在困境中給予支援與溫暖
      5: 她因為環境惡劣，選擇放棄努力而聽天由命
      6: 她相信自己擁有改變命運的力量，並付諸行動
    answers:
    - 2
    - 3
    - 4
    - 6
    label_note: 原稿這一列的標籤印成兩行「回顧與／體會」
