lesson_uid: L0126
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，讀完每一個選項後，選出最適合的答案。
  answer_carrier: 橘色手寫代號（在文字層），PDF p9~p10 可見
  items:
  - index: 1
    stem: 下列語詞何者使用不正確?
    options:
      A: 一聽到警報聲，大家「蜂擁而至」的逃出教室
      B: 這座城市因觀光業「崛起」，變得越來越繁榮
      C: 颱風來襲前，民眾「倉皇」搶購物資
      D: 他講稿沒準備好，上場時顯得非常「狼狽」
    answer: A
    explanation: Ａ－蜂擁而至指的是大家前來，語意錯誤
  - index: 2
    stem: 作者提到戲院是她的家，但為什麼她說「這個家讓人不安心」？
    options:
      A: 因為戲院經常斷電停水
      B: 戲院裡常發生混亂與危險事件
      C: 作者和家人關係不好
      D: 作者常需要在戲院旁顧攤而遇到同學
    answer: B
  - index: 3
    stem: 文章中提到作者用「黑色十字繡罩在燈上，在縫隙滲出的微光下解題」，這段文字作者主要想凸顯什麼？
    options:
      A: 她熱愛刺繡工藝
      B: 奶奶不疼愛她，嫌棄她是女生
      C: 她不喜歡在那麼亮的燈光下學習
      D: 她在艱困中仍舊堅持學習
    answer: D
  - index: 4
    stem: 這篇文章最主要想要表達的想法是什麼？
    options:
      A: 社會亂象無處不在，要小心保護自己
      B: 家庭是你永遠避風的港灣
      C: 堅持努力就能在逆境中改變命運
      D: 不要對人性失去信心，社會處處都有好人
    answer: C
  - index: 5
    stem: 作者描寫戲院中發生的各種事件，如賭博、吸膠、性騷擾，這樣的描寫目的為何？
    options:
      A: 最大化的展現父親管理戲院的混亂
      B: 豐富文章情節，使文章更具有可看性
      C: 用童年所處的艱難環境，襯托她仍能努力讀書的可貴
      D: 呈現早期鄉鎮戲院的治安隱憂，提醒觀眾自我保護
    answer: C
    explanation: (這些事件皆為鋪陳童年的社會背景與不安定感，為後段作者奮發讀書做情境對比與情感深化。)
