comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 師父讓正太每天抱小豬，真正的用意最可能是什麼？
    options:
      A: 讓正太學會照顧小豬，培養愛心
      B: 讓正太先做雜事，以後才開始學武功
      C: 用每天增加的重量，慢慢鍛鍊正太的身體
  - index: 2
    answer: B
    stem: 這個故事主要想告訴讀者什麼道理？
    options:
      A: 英雄不怕出身低，成功者要從小地方做起
      B: 成功沒有捷徑，需要日積月累的努力
      C: 只要時間夠長，學習遲早會大功告成
  - index: 3
    answer: B
    stem: 下列選項，都是從課文裡摘出來的，哪一項才是本課的重點句？
    options:
      A: 每天這一點點的變化，抱的時候根本感覺不出來
      B: 滴水穿石、循序漸進的努力後，任何人都會大幅進步
      C: 他跑得快、跳得高，能舉起寺裡最重的石臼
  - index: 4
    answer: A
    stem: 〈正太與小豬〉安排為這套教材的「第0課」，作為閱讀之旅的起點，你猜猜看，課程這樣安排，是想告訴同學們什麼？
    options:
      A: 閱讀能力要像正太抱小豬一樣，每次學一點，慢慢累積進步
      B: 所有的學習都是困難的，要學好，就必須不怕困難
      C: 學習需要好老師的指導，找到好老師，是學習第一步
  notes:
    answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
    options: 本課每題只有 A、B、C 三個選項（其他課多為四個）
