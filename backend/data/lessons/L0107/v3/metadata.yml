intro: 這篇文章講述了男孩正太的故事。他從小就嚮往成為一名武僧，並進入了著名的興福寺學習。然而，他的師父並沒有直接教他武功，而是交給他一項看似簡單的任務：每天餵養一頭小豬。這個任務需要他日復一日地抱著豬上下樓梯和跨越門檻。隨著時間的推移，小豬逐漸長大，這個任務也變得越來越有挑戰性。文章透過正太的經歷，帶出了關於成長與努力的道理。
