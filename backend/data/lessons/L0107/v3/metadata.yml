    任何一節 —— 全課只有兩個大題。那 13 個詞都能在課文裡找到（敢怒不敢言、剃度、

    惡言相向、抱頭鼠竄、囑咐、萬紫千紅、暑氣蒸人、金風送爽、寒氣逼人、滴水穿石、

    循序漸進、身材魁梧、帥氣挺拔），所以是總表替這課登錄了選詞、學習單沒有做成練習，

    不是漏抽。本檔不建 vocabulary_bank（學習單沒有印那個框）。'
strategy_explained: 這一課我們要練習「從故事裡學到重要的道理」，這篇文章透過正太每天抱著小豬爬樓梯、跨門檻，從一開始覺得簡單到後來越來越辛苦，但為了成為武僧他依然堅持，這個過程就讓我們看到，想學到真本事，需要靠時間和努力去累積，就像水滴石穿一樣，所以你看故事的時候，可以想想正太的堅持，和他學到武僧的什麼重要品格**
