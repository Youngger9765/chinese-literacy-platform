story_text: '每日頭條：芬蘭正式廢除中小学課程教育，成為全世界第一個擺脫学科的國家！

  2016年11月14日，是北歐國家芬蘭教育歷史上一個非常特殊的日子，確切地講，也是人類教育史上里程碑式的一天。

  這天，芬蘭首府赫尔辛基市教育局正式下發通知：從現在開始到2020年之前，赫尔辛基正式廢除小学和中学階段的課程式教育，轉而採取實际場景主題教學，芬蘭也因此將成為世界上第一個擺脫学校科目的國家。從現在開始，赫尔辛基的孩子們不用再上單獨的數学、物理、化学等等課程了，他們以後的上課，將是類似「多角度理解第二次世界大战」，或者「如何在咖啡館進行日常工作」這樣貼近現實，更有助於理解這個世界運作規律的主題式教学。

  這場改變預計將在2020年時完成，具體效果如何？全球拭目以待——'
paragraphs:
- 每日頭條：芬蘭正式廢除中小学課程教育，成為全世界第一個擺脫学科的國家！
