passage: '很多時候，競技場上的較勁，不是只靠體能和技巧，還要靠心。兩個實力平分秋色的選手，勝負的關鍵往往就在心理素質，獲勝的經常是那個情緒比較穩定、意志堅定、不易受干擾、比較能專注的人。研究也告訴我們，心理狀態對運動表現的影響不容小看。而就像肌肉、技術可以透過訓練變強，心理素質也可以。優秀的選手會把握每一次訓練和比賽的機會，隨時覺察、調整自己的情緒與想法。隨著經驗、汗水的累積，這些心理力量，都能幫助我們在關鍵時刻展現最好的自己。

  那時候，你會發現，比賽不只是得分和輸贏，而是一場又一場和自己、和別人互相了解的冒險；會發現，原來我們可以不只被心帶著跑，心，也能支撐我們，能陪你在場上發揮全部的實力；也會發現，原來要變厲害，不只是要練身體、練技術，更要練心。現在就讓我們跟著一系列的文章，展開這場練習吧！'
