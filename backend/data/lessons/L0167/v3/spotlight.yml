lesson_uid: L0167
version_id: v3
section_no: 六
spotlight:
  strategy_name: 自我覺察
  blocks:
  - type: concept_box
    text: '「自我覺察」就是懂得觀察自己的心情和想法，知道「我現在在想什麼、為什麼會有這種感受、這些對我的行為有什麼影響」。有了這種能力，在考試或比賽很緊張時，就比較能冷靜，不會被情緒控制；跟同學吵架時，也能更快明白自己為什麼生氣，還能換位思考別人的心情。懂得自我覺察，就像幫自己裝了一個「提醒器」，讓你在做決定前多想一步，避免事後後悔。

      不過，「自我覺察」不是一下子就能學會的，需要在每天的生活裡一點一點累積，日常中我們可以練習問自己「我現在的情緒是什麼？」、「是什麼讓我有這樣的情緒？」接下來，我們可以先用幾個小問題，來練習觀察自己內心的情緒和想法。'
  - type: guide
    text: '◎ 小試身手：

      練習一：從日常情境練習覺察自己的情緒和想法，能讓我們更懂自己，也更懂得照顧自己。請根據每個情境勾選或填寫你的想法。（可複選）'
  - type: guide
    text: 情境一：明天段考要考你最在乎的那一科
  - type: multi
    prompt: ＊你的情緒會是：
    options:
      1: 緊張
      2: 焦慮
      3: 專注
      4: 期待
      5: 有點壓力
      6: 自信
      7: 好奇
      8: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: ＊為什麼會有這種情緒：
    options:
      1: 想知道自己的實力
      2: 怕被嘲笑
      3: 怕被比較
      4: 怕被罵
      5: 想挑戰自己
      6: 對自己沒有信心
      7: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: ＊這種情緒可能讓我：
    options:
      1: 睡不著
      2: 更專心準備
      3: 覺得煩躁
      4: 想再複習一次
      5: 越想越慌
      6: 告訴自己「盡力就好」
      7: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: ＊更好的應對方式：
    options:
      1: 做幾次深呼吸讓自己放鬆
      2: 告訴自己「我已經準備得不錯了」
      3: 把緊張當成專注的提醒
      4: 規劃休息時間，避免過度緊繃
      5: 考前與朋友聊聊、舒緩壓力
      6: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 情境二：小組討論時，有同學沒幫忙，還批評你的意見。
  - type: multi
    prompt: ＊你的情緒會是：
    options:
      1: 生氣
      2: 委屈
      3: 驚訝
      4: 無奈
      5: 失望
      6: 平靜
      7: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: ＊為什麼會有這種情緒：
    options:
      1: 覺得不公平
      2: 覺得被誤會
      3: 沒想到他會這樣說
      4: 想讓討論更好
      5: 想維持小組和諧
      6: 希望大家一起做好
      7: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: ＊這種情緒可能讓我：
    options:
      1: 想反擊或頂嘴
      2: 想冷靜一下再處理
      3: 不想再合作
      4: 想私下問清楚
      5: 想請老師協助
      6: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: ＊更好的應對方式：
    options:
      1: 先讓自己冷靜一下再回應
      2: 試著理解對方的立場
      3: 選擇合適的時間再談
      4: 尋求老師或同學協助溝通
      5: 用「我覺得……因為……」表達想法
      6: 其他：＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: free_text
    prompt: 練習二：請想一件最近發生在你身上的小事，寫下你的覺察。
    sub_prompts:
    - ＊發生的事情是：_________________________________________
    - ＊我當下的情緒是：_______________________________________
    - ＊讓我產生這種情緒的原因是：______________________________
    - ＊這種情緒讓我做了什麼事？結果如何？______________________
    no_correct_answer: true
    answer_carrier: 學生自填，原稿四條橫線都是空的
