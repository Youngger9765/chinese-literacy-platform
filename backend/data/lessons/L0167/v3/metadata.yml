intro: 這篇文章探討運動表現與心理素質之間的關聯。作者透過幾個運動員在練習或比賽中遇到的情境，像是面對隊友的表現、身體的疲累、比賽的壓力，以及自我懷疑等，引導讀者思考這些心理狀態如何影響表現。文章接著說明，除了體能和技巧，穩定的心理狀態、堅定的意志和專注力，往往是決定勝負的關鍵。最後，作者點出心理素質如同身體能力一樣，可以透過持續的練習和覺察來提升，並鼓勵讀者一起展開「練心」的旅程。
