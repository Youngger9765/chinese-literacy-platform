strategy_explained: '這一課要練的是「讓心裡也變強壯」，就像運動一樣，我們的心情和想法也會影響表現喔

  讀這篇文章時，想想看運動員在面對挫折、壓力時，心裡可能會想什麼，以及他們是怎麼讓自己重新振作的

  你可以試著想想，自己遇到困難時，心裡又是怎麼想的，然後想想有沒有什麼方法可以讓自己更勇敢、更專心'
