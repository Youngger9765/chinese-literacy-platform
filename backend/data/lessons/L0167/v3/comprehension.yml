lesson_uid: L0167
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  option_key_note: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af0）
  answers_printed: true
  items:
  - index: 1
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 比賽輸了，大家互相指責，場面「不動聲色」，令人緊張
      B: 她第一次來這座城市，走在街道上卻有「似曾相識」的感覺
      C: 即使在遭受嚴厲的批評時，他也「不是滋味」，繼續保持冷靜
      D: 湖泊和山林交織成一幅美景，「平分秋色」，讓人心情平靜
    answer: B
    teacher_note: '第 1題解析：(A)宜用「一觸即發」

      (C)宜用「不動聲色」(D)宜用「湖光山色」'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 2
    stem: 根據第四段「這些話就像一群吵鬧的麻雀，在腦子裡飛來飛去，吵得她幾乎忘了眼前的投手正準備出手。」這句話表達了佳恩正遇到什麼困難？
    options:
      A: 太過專注於比賽，無法聽到隊友的提醒
      B: 觀眾的加油聲太熱烈，干擾她的注意力
      C: 腦中的負面想法太多，導致她無法專注
      D: 眼前的投手一直發出聲音，思緒被打斷
    answer: C
    teacher_note: 第2題解析：根據文章，「這些話」是佳恩腦袋中想像的批評。
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    note: 題幹說「第四段」，該引文在課文第 5 段（佳恩那段）。原稿如此，照抄不改。
  - index: 3
    stem: 下列何者最能作為這篇文章的主旨？
    options:
      A: 心理素質與運動表現息息相關，也可以透過練習提升
      B: 選手應避免有情緒，情緒失控會讓選手失去比賽機會
      C: 提升運動表現最適當的方法是規律的技術與體能訓練
      D: 透過競爭、壓力能激發自己的潛力，要善用逆境進步
    answer: A
    teacher_note: 第3題解析：根據第六段、第七段可知。
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    note: 四個選項在原稿印成同一個段落，中間以換行分隔
  - index: 4
    stem: 文末提到「原來我們可以不只被心帶著跑，心，也能支撐我們」，下列哪一個說法最能呼應這句話的意思？
    options:
      A: 心臟健康是運動表現的重要指標，應該重視心肺功能訓練
      B: 心情起伏是無法控制的，只能盡量逃避或靠意志力撐過去
      C: 情緒變化難以避免，但選手應該隱藏情緒，不讓他人發現
      D: 即使感到緊張，也可以透過練習學會穩定情緒、發揮實力
    answer: D
    teacher_note: (A)「心」是指「心理素質」(B)可以練習調節(C)不是需要隱藏
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 5
    stem: 面對考試成績不理想的狀況，下列何者的想法最符合「自我覺察」的表現？
    options:
      A: 柏丞：「我現在好沮喪，好像一直懷疑自己，感覺這次的考試對我來說意義重大。」
      B: 怡萱：「考那麼差，一定是因為我沒天分，算了啦，反正再怎麼努力也沒用。」
      C: 品妤：「老師也出太難了吧，這種題目到底有幾個人可以及格啊？」
      D: 祐廷：「只要考卷不用帶回家簽名就好了，反正也就是一次考試，沒什麼大不了的。」
    answer: A
    teacher_note: (B)(C)(D)都沒有針對自己的情緒、想法思考，只是逃避或指責其他人
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    note: 四個選項在原稿排成 2×2 的表格（A/B 一列、C/D 一列），不是直式清單
