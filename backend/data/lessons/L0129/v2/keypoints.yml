keypoints:
  lesson: G8-L9
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 議題-現象
    value: 很多人看到貼文會自然按「讚」，但這個動作背後，隱藏著你未必察覺的__
    blanks:
    - answer: 真相
      hint: ''
  - label: 原因
    value: 按讚之所以讓人容易一直滑，是因為它帶來__，讓人覺得被重視、被看見。
    blanks:
    - answer: 即時回饋感
      hint: ''
  - label: 論點一/論據
    value: '論點：按讚不只是數字，有些人把自己的__建立在按讚數上，心情隨之起伏，甚至影響__。

      論據：

      (1)澳洲網紅為追求按讚數，反覆拍照修圖，最後刪除帳號。

      (2)美國11歲瑟琳娜因按讚數太少而自卑焦慮。'
    blanks:
    - answer: 自我價值
      hint: ''
    - answer: 心理健康
      hint: ''
  - label: 論點二/論據
    value: '1.論點：平台會記下你的偏好，推播更多__給你，久而久之形成__，讓你視野變窄。

      2.論據：

      (1)同學按了遊戲影片的讚，之後手機被遊戲內容佔滿。

      (2)莫莉看了情緒低落貼文後，平台大量推送負面內容，導致悲劇'
    blanks:
    - answer: 類似內容
      hint: ''
    - answer: 過濾泡泡
      hint: ''
  - label: 結論與建議
    value: 按讚本身沒有錯，但不要讓按讚數左右情緒與自我價值；可以使用__功能減壓，也要留意滑動內容，學會__使用社群媒體。
    blanks:
    - answer: 隱藏按讚數
      hint: ''
    - answer: 平衡
      hint: ''
  title: 「按讚」背後的真相！
