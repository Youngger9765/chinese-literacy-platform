spotlight:
  lesson: G8-L9
  strategy_name: 推論策略-整合各段觀點，找主要論點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 議論文章常會先引出議題，再由各段提出觀點、說明、案例或做法，最後形成全文的主要論點。閱讀時，可以先找出各段的核心訊息，再判斷它在全文中扮演的角色，最後沿著論述主線整合出主要論點。
  - type: guide
    text: 一、找出各段的核心訊息（看法／判斷）
  - type: passage
    source: unknown
    paragraphs:
    - 下表列出每個段落的兩個句子。請先選出本段最重要的句子，再判斷另一句在段落中具有什麼功能。
  - type: table
    rows:
    - - 段落
      - ①勾選本段核心訊息
      - ②判斷另一句的功能
    - - '1'
      - □A.「讚」有時代表喜歡支持，有時是關心，也可能只是感興趣。□B.(按讚)這個輕輕一點的動作，背後卻隱藏著你未必察覺的真相。
      - □ ①補充說明□ ②例子（證據）□ ③具體做法
    - - '2'
      - □A.按讚提供即時與簡單回饋，讓人們更常使用社群媒體的互動。□B.朋友按讚你會覺得被重視，你按讚也讓對方收到關注
      - □ ①補充說明□ ②案例證據□ ③具體做法
    - - '3'
      - □A.過度在意讚數，可能左右人的心緒、自我價值，甚至心理健康。□B.網紅艾絲娜為追求讚數反覆拍照修圖，最後刪除帳號。
      - □ ①補充說明□ ②案例證據□ ③具體做法
    - - '4.'
      - □A.同學按了遊戲影片的讚，之後手機幾乎都被遊戲內容佔滿□B.平台可能根據使用紀錄推薦相似內容，久而久之形成過濾泡泡，使視野變窄。
      - □ ①補充說明□ ②案例證據□ ③具體做法
    - - '5.'
      - □A.按讚本身沒有錯，但不要讓讚數左右情緒與自我價值，也要平衡使用。□B.有些人使用「隱藏按讚數」功能，作為減壓的方法。
      - □ ①補充說明□ ②案例證據□ ③具體做法
  - type: guide
    text: 你在任務一已經找出各段的主要觀點，這讓複雜的文字有了清楚的概念。
  - type: guide
    text: 二、本文主要論點的論述架構：
  - type: passage
    source: unknown
    paragraphs:
    - 任務二要做的是：看見作者怎麼把這些觀點，做清楚的論述——讓你一眼就看見文章的論述主線，即「描述現象說明它的影響給你的建議」。
    - 請根據論述的主線，找到對應的段落，填入段落數代號，並選出該段的關鍵詞。下一題要用這條主線和關鍵詞，整合出文章的主要論點。
  - type: table
    rows:
    - - 作者的論述主線
      - 填上段落數
      - 這段的關鍵詞（單選）
    - - ①先說「作者看到的現象」
      - （  1~2 ）
      - □①按讚背後另有真相　□②要多按讚表示關心支持
    - - ②再說「影響一：情緒、心理會受到什麼影響」
      - （　3　 ）
      - □①情緒與心理健康失控□②覺得開心倍受矚目
    - - ③再說「影響二：演算法會怎樣限制你的視野」
      - （　4　 ）
      - □①過度依賴按讚數□②受困過濾泡泡，視野變窄
    - - ④最後說「建議你可以怎麼做」
      - （　5　）
      - □①平衡使用社群　□②追求更多按讚
  - type: guide
    text: 三、整合主要論點：請用一句話說出作者的主要論點。
  - type: passage
    source: unknown
    paragraphs:
    - 提示：參考上表的「論述主線」與「關鍵詞」，合起來，用「心理影響＋資訊影響＋作者建議」三個元素，寫出作者的主要論點。（答案合理就好）
  - type: guide
    text: ①按讚看似小動作，但它背後另有真相，②它會影響你的自我價值和心理健康　，③還會讓你受困於過濾泡泡，視野變窄　，④因此，不要讓讚數左右情緒與自我價值，要懂得平衡使用，讓社群媒體成為幫手　　　　   　。
  - type: guide
    text: （提示詞可選用：自我價值、心理健康、過濾泡泡、視野、平衡使用）
  - type: guide
    text: ※如果你四項都打勾，恭喜你，表示你能統整各段的看法，整合成一個主要看法。
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: table
    rows:
    - - 「按讚」背後的真相！
    - - 議題-現象
      - 很多人看到貼文會自然按「讚」，但這個動作背後，隱藏著你未必察覺的【】
    - - 原因
      - 按讚之所以讓人容易一直滑，是因為它帶來【】，讓人覺得被重視、被看見。
    - - 論點一/論據
      - 論點：按讚不只是數字，有些人把自己的【】建立在按讚數上，心情隨之起伏，甚至影響【】。論據：(1)澳洲網紅為追求按讚數，反覆拍照修圖，最後刪除帳號。(2)美國11歲瑟琳娜因按讚數太少而自卑焦慮
    - - 論點二/論據
      - 1.論點：平台會記下你的偏好，推播更多【】給你，久而久之形成【】，讓你視野變窄。2.論據：(1)同學按了遊戲影片的讚，之後手機被遊戲內容佔滿。(2)莫莉看了情緒低落貼文後，平台大量推送負面內容，導致悲劇
    - - 結論與建議
      - 按讚本身沒有錯，但不要讓按讚數左右情緒與自我價值；可以使用【】功能減壓，也要留意滑動內容，學會【】使用社群媒體。
    answers:
    - 真相
    - 即時回饋感
    - 自我價值
    - 心理健康
    - 類似內容
    - 過濾泡泡
    - 隱藏按讚數
    - 平衡
  - type: guide
    text: 請根據文章內容，讀完每一個選項後，選出最適合的答案。請根據文章內容，讀完每一個選項後，選出最適合的答案。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能判斷出每段作者的主要看法/觀點。□2.我能判斷另一句的功能是「說明／例子／做法」
    - 我能判斷每一段的主要看法的角色
    - 我能寫出本文的主要論點
