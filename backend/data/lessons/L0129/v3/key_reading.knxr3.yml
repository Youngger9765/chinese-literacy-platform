  char_marks_note: '兩個段界值都精準吻合，確認起點是第 3 段：

    第 3 段裸算 298 字，「50」「11」兩串各算 1 個字（SKILL ⑥.7 第 1 條）→ 296 = 第 11 個數字；

    第 4 段裸算 323 字，「IG」「14」兩串各算 1 個字 → 321，296+321 = 617 = 最後一個數字。

    ⚠️ 第 1 條在本課要擴充成「**連續的非中文字串**算 1 個字」才對得上 —— 不只阿拉伯數字，

    拉丁字母（IG）同樣是一串算一個。只算數字的話最後會差 1（618 vs 617），

    看起來像抓錯段落，其實是口徑少算了「IG」。

    第 2、3、4 條都不必套：footnotes.xml 沒有本課註腳、課文沒有分節小標、

    濾掉 variation selector 前後字數相同。

    ⚠️ 數字欄整體上移一行：617 印在「使你看到的世界變得越來」那一行，

    但它其實是第 4 段**整段**結束的累計值（最後一行「越片面狹隘。」沒有配到數字）。

    不要照「號碼旁邊那一行」反推段界。'
