version_id: v3
section_no: 六
keypoints:
  title: 「按讚」背後的真相！
  layout: list
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  rows:
  - label: 議題-現象
    value: 很多人看到貼文會自然按「讚」，但這個動作背後，隱藏著你未必察覺的【　】
    blanks:
    - answer: 真相
  - label: 原因
    value: 按讚之所以讓人容易一直滑，是因為它帶來【　】，讓人覺得被重視、被看見。
    blanks:
    - answer: 即時回饋感
  - label: 論點一/論據
    value: '1.論點：按讚不只是數字，有些人把自己的【　】建立在按讚數上，心情隨之起伏，甚至影響【　】。

      2.論據：

      (1)澳洲網紅為追求按讚數，反覆拍照修圖，最後刪除帳號。

      (2)美國11歲瑟琳娜因按讚數太少而自卑焦慮。'
    blanks:
    - answer: 自我價值
    - answer: 心理健康
    label_note: 表格左欄印成兩行「論點一 / /論據」，這裡合成一個 label
    value_note: '⚠️ 原稿這一格的「論點：」前面**沒有**印「1.」，但「論據：」前面印了「2.」；

      下一列（論點二）兩邊都有印 1./2.。上面照下一列的形狀補齊會改到原稿，

      所以 value 保留原樣 —— 這裡寫的 1. 是 Word 自動編號產生的，w:t 文字流裡沒有。'
  - label: 論點二/論據
    value: '1.論點：平台會記下你的偏好，推播更多【　】給你，久而久之形成【　】，讓你視野變窄。

      2.論據：

      (1)同學按了遊戲影片的讚，之後手機被遊戲內容佔滿。

      (2)莫莉看了情緒低落貼文後，平台大量推送負面內容，導致悲劇'
    blanks:
    - answer: 類似內容
    - answer: 過濾泡泡
  - label: 結論與建議
    value: 按讚本身沒有錯，但不要讓按讚數左右情緒與自我價值；可以使用【　】功能減壓，也要留意滑動內容，學會【　】使用社群媒體。
    blanks:
    - answer: 隱藏按讚數
    - answer: 平衡
    label_note: 表格左欄印成兩行「結論與 / 建議」
