lesson_uid: L0129
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略──整合各段觀點，找主要論點
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）；任務三的填空是橘色手寫，也在文字層
  blocks:
  - type: concept_box
    text: 議論文章常會先引出議題，再由各段提出觀點、說明、案例或做法，最後形成全文的主要論點。閱讀時，可以先找出各段的核心訊息，再判斷它在全文中扮演的角色，最後沿著論述主線整合出主要論點。
  - type: sub_block
    label: 一、找出各段的核心訊息（看法／判斷）
    instruction: 下表列出每個段落的兩個句子。請先選出本段最重要的句子，再判斷另一句在段落中具有什麼功能。
    columns:
    - 段落
    - ❶勾選本段核心訊息
    - ❷判斷另一句的功能
    columns_note: '表格印三欄。每一列是**兩題**：❶ 從 A/B 兩句挑出本段核心訊息，

      ❷ 從 ①②③ 挑出另一句的功能。兩題各有一個紅色 ☑。

      ⚠️ 第 1 列的第三個選項印「②例子（證據）」，第 2~5 列印「②案例證據」——

      原稿就不一致，照抄不統一。'
    items:
    - label: 段落 1
      items:
      - prompt: ❶勾選本段核心訊息
        options:
          A: 「讚」有時代表喜歡支持，有時是關心，也可能只是感興趣。
          B: (按讚)這個輕輕一點的動作，背後卻隱藏著你未必察覺的真相。
        answer: B
      - prompt: ❷判斷另一句的功能
        options:
          1: 補充說明
          2: 例子（證據）
          3: 具體做法
        answer: 1
    - label: 段落 2
      items:
      - prompt: ❶勾選本段核心訊息
        options:
          A: 按讚提供即時與簡單回饋，讓人們更常使用社群媒體的互動。
          B: 朋友按讚你會覺得被重視，你按讚也讓對方收到關注
        answer: A
      - prompt: ❷判斷另一句的功能
        options:
          1: 補充說明
          2: 案例證據
          3: 具體做法
        answer: 1
    - label: 段落 3
      items:
      - prompt: ❶勾選本段核心訊息
        options:
          A: 過度在意讚數，可能左右人的心緒、自我價值，甚至心理健康。
          B: 網紅艾絲娜為追求讚數反覆拍照修圖，最後刪除帳號。
        answer: A
      - prompt: ❷判斷另一句的功能
        options:
          1: 補充說明
          2: 案例證據
          3: 具體做法
        answer: 2
    - label: 段落 4
      items:
      - prompt: ❶勾選本段核心訊息
        options:
          A: 同學按了遊戲影片的讚，之後手機幾乎都被遊戲內容佔滿
          B: 平台可能根據使用紀錄推薦相似內容，久而久之形成過濾泡泡，使視野變窄。
        answer: B
      - prompt: ❷判斷另一句的功能
        options:
          1: 補充說明
          2: 案例證據
          3: 具體做法
        answer: 2
    - label: 段落 5
      items:
      - prompt: ❶勾選本段核心訊息
        options:
          A: 按讚本身沒有錯，但不要讓讚數左右情緒與自我價值，也要平衡使用。
          B: 有些人使用「隱藏按讚數」功能，作為減壓的方法。
        answer: A
      - prompt: ❷判斷另一句的功能
        options:
          1: 補充說明
          2: 案例證據
          3: 具體做法
        answer: 3
  - type: guide
    text: 你在任務一已經找出各段的主要觀點，這讓複雜的文字有了清楚的概念。
  - type: sub_block
    label: 二、本文主要論點的論述架構：
    intro: '任務二要做的是：看見作者怎麼把這些觀點，做清楚的論述——讓你一眼就看見文章的論述主線，即「描述現象

      說明它的影響

      給出建議」。'
    instruction: 請根據論述的主線，找到對應的段落，填入段落數代號，並選出該段的關鍵詞。下一題要用這條主線和關鍵詞，整合出文章的主要論點。
    columns:
    - 作者的論述主線
    - 填上段落數
    - 這段的關鍵詞（單選）
    intro_note: '說明句裡的兩個箭頭是 `w:sym Wingdings F0E0`，**不在 w:t 文字流裡**，

      所以 intro 照文字層記錄、不寫入箭頭字元（同 L0057／L0090 的做法）。

      畫面上那一句是「即『描述現象→說明它的影響→給出建議』」。'
    items:
    - label: 1.先說「作者看到的現象」
      value: 填上段落數（　）
      blanks:
      - answer: 1~2
      items:
      - prompt: 這段的關鍵詞（單選）
        options:
          1: 按讚背後另有真相
          2: 要多按讚表示關心支持
        answer: 1
    - label: 2.再說「影響一：情緒、心理會受到什麼影響」
      value: 填上段落數（　）
      blanks:
      - answer: 3
      items:
      - prompt: 這段的關鍵詞（單選）
        options:
          1: 情緒與心理健康失控
          2: 覺得開心備受矚目
        answer: 1
    - label: 3.再說「影響二：演算法會怎樣限制你的視野」
      value: 填上段落數（　）
      blanks:
      - answer: 4
      items:
      - prompt: 這段的關鍵詞（單選）
        options:
          1: 過度依賴按讚數
          2: 受困過濾泡泡，視野變窄
        answer: 2
    - label: 4.最後說「建議你可以怎麼做」
      value: 填上段落數（　）
      blanks:
      - answer: 5
      items:
      - prompt: 這段的關鍵詞（單選）
        options:
          1: 平衡使用社群
          2: 追求更多按讚
        answer: 1
  - type: free_text
    prompt: 三、整合主要論點：請用一句話說出作者的主要論點。
    hint: 提示：參考上表的「論述主線」與「關鍵詞」，合起來，用「心理影響＋資訊影響＋作者建議」三個元素，寫出作者的主要論點。（答案合理就好）
    word_bank_line: （提示詞可選用：自我價值、心理健康、過濾泡泡、視野、平衡使用）
    answer_text: ①按讚看似小動作，但它背後另有真相，②它會影響你的自我價值和心理健康，③還會讓你受困於過濾泡泡，視野變窄，④因此，不要讓讚數左右情緒與自我價值，要懂得平衡使用，讓社群媒體成為幫手。
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    answer_note: '印出來的句子是「填空式」：黑色印刷的骨架是

      「①按讚看似小動作，但它背後另有真相，②它會影響你的　③還會讓你　④因此，　。」，

      橘色手寫補上的是「自我價值和心理健康」「受困於過濾泡泡，視野變窄」

      「不要讓讚數左右情緒與自我價值，要懂得平衡使用，讓社群媒體成為幫手」三段。

      上面的 answer_text 是把兩者接起來的完整句（原稿的空白與底線已省略）。'
  - type: self_check
    label: ◎自我檢核
    items:
    - 我能判斷出每段作者的主要看法/觀點。
    - 我能判斷另一句的功能是「說明／例子／做法」
    - 我能判斷每一段的主要看法的角色
    - 我能寫出本文的主要論點
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
    reflection: ※如果你四項都打勾，恭喜你，表示你能統整各段的看法，整合成一個主要看法。
