intro: 你是否曾隨手為有趣的貼文或影片按讚？這個簡單的動作，其實藏著許多不為人知的秘密。這篇文章將帶你了解「按讚」符號的起源與普及，以及它如何影響我們的感受，甚至左右我們的自我價值。同時，文章也會探討社群平台如何透過演算法，利用我們的「按讚」紀錄來推薦內容，進而可能影響我們接收到的資訊，甚至加深心理困擾。透過了解這些「按讚」背後的真相，我們可以更聰明、更健康地使用社群媒體。
