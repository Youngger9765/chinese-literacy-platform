strategy_explained: '這篇文章要帶你練習「把零碎的資訊拼湊起來，找出作者最想說的那件事」

  因為這篇探討了「按讚」的起源、影響，還有社群平台的運作，資訊有點多

  所以讀的時候，你可以試著問自己：作者講了這麼多，到底哪一個才是他最想傳達的關鍵想法呢'
