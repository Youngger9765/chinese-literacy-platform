_總表_語詞_note: '總表第 1 個語詞印「倍受矚目」，DOCX 三處（語詞框／語詞我最棒／詞語複習）一致都是

  「備受矚目」。這是**總表**的錯字，不是教材的，所以不進 source_errata（那份只記 DOCX 的錯）。'
_聚光燈大題號_note: '總表欄名叫「第六大題標題」，但本課閱讀聚光燈印的是**第五大題**、文章重點表才是第六。

  欄名是全庫的慣例名稱，不是本課的實際編號 —— 以 sections_present 為準。'
