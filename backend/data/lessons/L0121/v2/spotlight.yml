spotlight:
  lesson: G8-L23
  strategy_name: 性別平等-辨識界線、安全回應、支持他人
  strategy_type: sel_character
  blocks:
  - type: passage
    source: unknown
    paragraphs:
    - 本單元延續課文中身體自主權、尊重界線、不是你的錯等核心概念，以下活動是一般性的界線與安全判斷練習。練習完成請根據後面的答案給自己評分，並思考自己有什麼學習。
  - type: guide
    text: 一、辨識界線
  - type: guide
    text: （一）說明：
  - type: table
    rows:
    - - 判斷問題
      - 想一想……
    - - 有沒有同意？
      - 對方是否清楚、自主地表示願意？沉默、僵住或沒有反抗，不代表同意。同意也可以隨時改變。
    - - 行為是否必要？
      - 例如醫療、救援或運動指導中的碰觸，是否確有必要？是否事先說明、尊重意願並保護隱私？
    - - 對方是否不舒服？
      - 對方是否已說不、退開、沉默、表情僵硬，或表示不受歡迎、被冒犯？有疑慮時應先停止並確認。
  - type: guide
    text: （二）是非題（在判斷中學習；正確的打○，錯誤的打×）：
  - type: guide
    text: （  ）1.對方沉默或沒有把手推開，就可以當成他已經同意。
  - type: guide
    text: （  ）2.對方上次同意擁抱，不代表這一次也同意；同意可以隨時改變。
  - type: guide
    text: （  ）3.即使是好友、家人或交往對象，也要尊重對方的身體界線。
  - type: passage
    source: unknown
    paragraphs:
    - （  ）4.醫療或救援中的碰觸只要具有專業目的，就完全不必說明或尊重對方的感受。
    - （  ）5.感到不舒服是值得重視的警訊；至於是否構成法律上的性騷擾，還要考量完整情境。
  - type: guide
    text: 二、安全回應
  - type: passage
    source: unknown
    paragraphs:
    - （一）說明：如果你遇到讓你不舒服的言語或行為時，底下是幾個讓自己比較安全的回應原則：
  - type: guide
    text: 第一：安全比當場爭辯更重要。
  - type: passage
    source: unknown
    paragraphs:
    - 第二：適度反應：表達你不喜歡、要求停止；也可以離開現場、前往有人可協助的地方、向可信任的人求助、保留相關紀錄。
    - 第三：事後反思：發生性別平等事件時，每人的反應都可能不同。有人會立刻拒絕，有人可能嚇得說不出話。但當下沒有反抗，不代表同意，也不是當事人的錯。
  - type: guide
    text: （二）是非題（在判斷中學習；正確的打○，錯誤的打×）：
  - type: guide
    text: （  ）6.遇到越界行為時，一定要立刻大聲反抗，否則就表示自己同意。
  - type: guide
    text: （  ）7.在安全的情況下，可以清楚說：「我不喜歡，請停止。」並離開現場。
  - type: passage
    source: unknown
    paragraphs:
    - （  ）8.如果對方利用身分、權力或利益威脅你，先離開並尋求協助，通常比單獨和對方爭辯安全。
  - type: guide
    text: （  ）9.收到讓人不舒服的網路訊息時，最好立刻刪除所有內容，不留下任何紀錄。
  - type: guide
    text: （  ）10.遇到事情時因害怕而僵住或說不出話，不代表同意，也不是自己的錯。
  - type: guide
    text: 三、支持他人
  - type: guide
    text: （一）說明：
  - type: passage
    source: unknown
    paragraphs:
    - 如果你的朋友願意跟你說出不舒服的經驗，可能已經鼓起很大的勇氣。支持她或他時，請記住：先傾聽，不責怪；不任意追問，不公開轉傳；詢問對方需要什麼協助，尊重他的選擇。
    - 不必急著問「為什麼不早點說」、「為什麼不反抗」，也不要自行把他的經驗告訴其他同學。如果對方有立即的安全危險，應協助尋找可信任的成人或專業支援，不宜只由學生獨自承擔。
  - type: guide
    text: （二）是非題（在判斷中學習；正確的打○，錯誤的打×）：
  - type: passage
    source: unknown
    paragraphs:
    - （  ）11.對朋友說「你為什麼不早點說」或「你為什麼不反抗」，可能使他感到被責怪。
    - （  ）12.為了確定朋友說的是真是假，應先要求他詳細交代所有經過，再決定是否支持他。
  - type: guide
    text: （  ）13.未經當事人同意，不應把他的姓名、經驗、訊息或截圖轉傳給其他人。
  - type: guide
    text: （  ）14.即使朋友目前有立即危險，也應答應永遠不告訴任何人，才算尊重朋友。
  - type: passage
    source: unknown
    paragraphs:
    - （  ）15.支持朋友時，應尊重他何時、向誰求助的選擇；但若有立即危險，應協助尋找可信任的成人。
  - type: guide
    text: 是非題解答與說明
  - type: guide
    text: 四、綜合練習
  - type: passage
    source: unknown
    paragraphs:
    - 社團幹部阿哲多次私訊小芸，評論她的身材，並傳送帶有性意味的貼圖。小芸回覆：「我不喜歡，請停止。」阿哲仍繼續傳送，還說：「只是開玩笑，你太認真了。」小芸保留了訊息，並把事情告訴同學雅雯。
