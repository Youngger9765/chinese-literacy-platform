  - type: guide
    text: 五文章重點表 五文章重點表
  - type: table
    rows:
    - - '#MeToo運動與我們的權利'
    - - ＃MeToo運動
    - - 起源與發展
      - '1. 2006年，伯克在網路平台使用【】，透過同理心的話語幫助性侵受害者走出陰霾。2. 2017年，米蘭諾在推特使用【】分享自己受害經驗，以回應好萊塢製片人溫斯坦長期性侵多名演員的事件。引發廣大回響，成為全球運動。3.
        #MeToo運動於2018年傳到臺灣。2023年，一連串性騷擾事件被揭露；影集的相關情節與台詞也引發大量關注與討論，許多受害者開始揭露自己遭受的性騷擾或性侵犯。'
    - - 面對性騷擾，我們該怎麼做?
      - 1.不是你的錯，可以安心求助許多受害者，不敢說出他們受害的經歷。其原因有(可複選)□①難以舉證       □②怕自己成為別人的話題   □③怕被別人指責   □④怕被權力高的人報復  2.身體自主權，從尊重界線開始(1)強調每個人都有權利決定自己的【】不受侵犯。(2)學習尊重別人的身體【】，避免越界、冒犯的行為。
    - - 結語
      - '#MeToo運動讓受害者打破沉默，也帶動大眾身體自主權的覺醒，提醒每個人尊重界線，共同創造安全、彼此尊重的環境。'
    answers:
    - Me Too
