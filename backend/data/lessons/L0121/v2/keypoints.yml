  - label: 起源與發展
    value: '1. 2006年，伯克在網路平台使用__，透過同理心的話語幫助性侵受害者走出陰霾。2. 2017年，米蘭諾在推特使用__分享自己受害經驗，以回應好萊塢製片人溫斯坦長期性侵多名演員的事件。引發廣大回響，成為全球運動。3.
      #MeToo運動於2018年傳到臺灣。2023年，一連串性騷擾事件被揭露；影集的相關情節與台詞也引發大量關注與討論，許多受害者開始揭露自己遭受的性騷擾或性侵犯。'
    blanks:
