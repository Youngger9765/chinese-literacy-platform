      hint: ''
    - answer: '#MeToo'
      hint: ''
  - label: 面對性騷擾，我們該怎麼做?
    value: 1.不是你的錯，可以安心求助許多受害者，不敢說出他們受害的經歷。其原因有(可複選)□①難以舉證       □②怕自己成為別人的話題   □③怕被別人指責   □④怕被權力高的人報復  2.身體自主權，從尊重界線開始(1)強調每個人都有權利決定自己的__不受侵犯。(2)學習尊重別人的身體__，避免越界、冒犯的行為。
    blanks:
    - answer: 身體界線
      hint: ''
    - answer: 自主權
      hint: ''
  - label: 結語
    value: '#MeToo運動讓受害者打破沉默，也帶動大眾身體自主權的覺醒，提醒每個人尊重界線，共同創造安全、彼此尊重的環境。'
    blanks: []
  title: '#MeToo運動與我們的權利'
