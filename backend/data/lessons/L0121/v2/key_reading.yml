passage: 再者，不少加害者和被害者處於「權力不對等」的關係，例如導演與演員、上司與部屬、明星與粉絲、老師與學生、長輩與晚輩等。處於權力優勢位置的人，可能以愛護或關心的方式接近對方，使人一開始難以察覺界線已被越過；而處於權力弱勢位置的受害者，可能擔心說出來會被報復，或是不被相信。
