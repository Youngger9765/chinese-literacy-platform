    學習單（陰霾、一片譁然、標識、鏈結、舉證、冒犯、茶餘飯後、有所忌憚、凝視、自主權）為準。'
strategy_explained: '這一課我們要練習的是，如何理解和分析社會議題中的複雜面向，特別是性別平權和身體自主權的相關內容

  這篇文章透過「#MeToo」運動，讓我們看到受害者如何發聲，以及他們可能面臨的挑戰，這很適合用來練習理解不同立場和權力關係

  閱讀時，你可以試著思考「#MeToo」運動背後的原因，並連結到我們在生活中如何尊重自己和別人的身體界線，一同營造友善的環境'
