  passage: 再者，不少加害者和被害者處於「權力不對等」的關係，例如導演與演員、上司與部屬、明星與粉絲、老師與學生、長輩與晚輩等。處於權力優勢位置的人，可能以愛護或關心的方式接近對方，使人一開始難以察覺界線已被越過；而處於權力弱勢位置的受害者，可能擔心說出來會被報復，或是不被相信。#MeToo運動讓飽受身心創傷的受害者有了支持的後盾，更重要的是，開始扭轉社會對性侵犯受害者的偏見，讓受害者知道「這不是你的錯」，進一步打造「安心說出來」的友善社會，讓受害者有機會獲得療癒，也讓有加害意圖的人有所忌憚。另一方面，#MeToo運動喚起社會大眾對「身體自主權」的重視，意思是「我的身體是我自己的」。每個人都有權利決定，別人可以在什麼情況下碰觸或凝視自己的身體，也有權保護自己的界線不受侵犯；這個界線就是「身體界線」。
  start_text: 再者，不少加害者和被害者處於「權力不對等」的關係
