lesson_uid: L0121
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用錯誤?
    options:
      A: 八卦新聞常是大家「茶餘飯後」聊天的話題
      B: 這件賄選案一經媒體披露，輿論「譁然」
      C: 他奉公守法，常幫助別人，絲毫不「忌憚」
      D: 開黃腔容易「冒犯」別人，使人不舒服
    teacher_note: 前後邏輯錯誤
    placement_note: 印在選項 C 後面（橘色括號），不是另外的方框
  - index: 2
    answer: D
    stem: 根據課文，性侵或性騷擾受害者有幾項不敢站出來舉報的理由，以下敘述何者為非？
    options:
      A: 怕自己變成八卦話題的主角
      B: 權力不對等，加害者權力位階較高
      C: 難以舉證，擔心不被別人相信
      D: 受害者在經濟或情感上依賴加害者
  - index: 3
    answer: D
    stem: '#MeToo運動希望帶來一些社會改變，以下敘述何者為非？'
    options:
      A: 讓受害者知道不是他的問題，停止內疚自責
      B: 扭轉大眾偏見、停止對受害者不友善的眼光
      C: 營造「安心說出來的友善社會」，讓加害者有所忌憚
      D: 讓大眾知道性侵害只會在密閉空間內發生
    teacher_note: (D)性犯罪常發生在隱密的空間，但在外面也有可能發生。
  - index: 4
    answer: C
    stem: 從本課第四段所引的電視劇台詞：「我們不要就這樣算了，好不好？」你可以做出什麼推論？
    options:
      A: 他們在討論債務的問題，有人欠了當事人一筆錢
      B: 說話的人地位較高，聽話的人地位較低
      C: 被害人不敢講，但說話的人鼓勵被害人面對問題，追究到底
      D: 說話的人在告訴加害者，這樣下去可不行
  - index: 5
    answer: A
    stem: 下列何者為本文作者的寫作意圖？
    options:
      A: 介紹和討論「＃MeToo」，為性別平等教育努力
      B: 教導讀者如何用「＃MeToo」在社群網站上建立運動標識
      C: 教導讀者遇到壞事，如何以牙還牙，以眼還眼
      D: 作者比較「＃MeToo」在西方和臺灣社會的異同
  notes:
    answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊；第 1、2、3 題的代號印成全形（Ｃ／Ｄ）
