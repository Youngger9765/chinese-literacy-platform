  passage: 珍古德母女搭船進入保護區，映入眼簾的是險峻的山壁，層層交疊的樹冠，深不可測的密林。叢林中偶爾有黑猩猩的黑影快速飛奔閃過，珍古德又是歡喜又是焦慮：歡喜的是，終於可以展開期盼已久的黑猩猩研究；焦慮的是，如何在長年籠罩迷霧的森林中，追蹤迅疾如風的黑猩猩呢？研究初期，珍古德在崎嶇的小路上，在難纏的樹叢中，追著黑猩猩跑，有時還得面臨花豹和毒蛇的威脅，但黑猩猩拒人於千里之外，她只能用望遠鏡觀察，只能蒐集黑猩猩的糞便和吃剩的食物，研究牠們的飲食狀況。三個月過去了，研究工作沒有太大進展，倒是母女同時得了瘧疾，連續兩星期的高燒沒有逼退珍古德，病癒後，珍古德終於發現黑猩猩群開始接受她的存在。先是有三隻黑猩猩看到她，並不像過去那樣驚慌逃開，只是慢慢的走遠。從這三隻黑猩猩開始，她被越來越多的黑猩猩接納了，黑猩猩們卸下心防，一點也沒有驚慌失措的模樣。黑猩猩就在她附近的樹枝上盪來盪去，大吼大叫，吃著無花果，越過小溪時，還停下來喝水呢！珍古德在札記裡這樣記載著一隻公猩猩與她的第一次接觸：「我撿了一個紅堅果，放在手掌心，遞了過去，但他把臉撇開了。我再把手伸得更近一點，他回頭了，目光穿透我的眼睛，伸出手來，拿了堅果。但他根本不要那個果子，把它丟在地上。但就在此時，他很溫和的握了我的手指一下，這是黑猩猩表示安心的方式，他明白我的所作所為是好意的，他要的不是堅果，而是再一次跟我確認：他懂我。我倆就這樣彼此交了心，一句話都不必說。」這一握，黑猩猩和珍古德開始彼此信任、平等相待，也讓珍古德更能深入了解黑猩猩，願意一輩子守護黑猩猩。長期相處之後，珍古德清楚的知道：黑猩猩和人類一樣，有感情、有靈性、會痛苦、會悲傷，而且能與人交流。因此，她為每一隻黑猩猩取名字。有時候擔心「威廉」生病，有時候為「梅莉莎」生下小寶寶而欣喜若狂，還要替那已經半殘廢並常落單的「季兒」掛慮……。珍古德透過在岡貝對黑猩猩的研究成果，獲得進入劍橋大學進修博士的機會，她在劍橋和岡貝之間兩頭跑，五年後取得博士學位。珍古德在非洲的密林裡奉獻了一輩子，除了成為舉世聞名的黑猩猩研究專家，更化身為動物保育和環境教育的推廣者。一九七七年，她成立「國際珍古德協會」，推動全世界的環境教育和野生動物保育。演講、寫書、參與世界各地的保育活動……滿滿的計畫行程，佔據了珍古德的生活。她飛遍全世界，馬不停蹄，一心一意希望能實現的是：讓所有動物能夠在最美麗的大地上，快快樂樂的生活。
