comprehension:
  questions:
  - index: 1
    answer: D
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 小雅騎車跌倒，膝蓋在柏油路上摩擦受傷，傷口「深不可測」
      B: 小麗參加運動會的百公尺短跑，「馬不停蹄」的奪得第一名
      C: 小洛因為口渴，便到冰箱隨手拿了一瓶「夢寐以求」的水來喝
      D: 爸媽時常「掛慮」離家住校的小成，擔心他飲食或作息不夠正常
    rationale: null
  - index: 2
    answer: C
    stem: 根據本文第六段，為什麼珍古德能確認黑猩猩和她交心了呢？
    options:
      A: 黑猩猩撇開臉是因為害羞，代表牠接受了珍古德
      B: 黑猩猩用動作示意，珍古德因此了解牠不喜歡紅堅果
      C: 雖然黑猩猩不要堅果，卻依舊做出握手示好的動作
      D: 雖然黑猩猩一開始不要堅果，最後依然收下了堅果
    rationale: null
  - index: 3
    answer: A
    stem: 根據本文，下列選項哪一個最能描述珍古德的一生？
    options:
      A: 鍥而不捨地長期投入，終有所成
      B: 做出有智慧的抉擇，讓她有所成就
      C: 身強體壯，終能克服疾病瘟疫
      D: 在母親的陪伴鼓勵下，她走出自己的路
    rationale: null
  - index: 4
    answer: B
    stem: 根據本文，下列何者不是珍古德研究黑猩猩所面臨的挑戰？
    options:
      A: 面臨毒蛇猛獸的威脅
      B: 不斷被黑猩猩挑釁攻擊
      C: 初期不易取得黑猩猩的信任
      D: 得到嚴重的疾病
    rationale: null
  - index: 5
    answer: D
    stem: 根據本文，黑猩猩開始與人類接觸後，雙方的關係會如何變化？
    options:
      A: 防備→信任→接納
      B: 接納→防備→信任
      C: 接納→信任→防備
      D: 防備→接納→信任
