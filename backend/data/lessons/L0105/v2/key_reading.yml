passage: 珍古德母女搭船進入保護區，映入眼簾的是險峻的山壁，層層交疊的樹冠，深不可測的密林。叢林中偶爾有黑猩猩的黑影快速飛奔閃過，珍古德又是歡喜又是焦慮：歡喜的是，終於可以展開期盼已久的黑猩猩研究；焦慮的是，如何在長年籠罩迷霧的森林中，追蹤迅疾如風的黑猩猩呢？
