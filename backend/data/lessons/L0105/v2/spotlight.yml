spotlight:
  lesson: G7-L8
  strategy_name: 摘要策略-從人物發展找重點
  strategy_type: summary
  blocks:
  - type: guide
    text: 一、找到文章裡的人物發展
  - type: guide
    text: 記人的文章常常按照人物經歷來寫。請你試著判斷全文9個自然段，各屬於人物發展的哪一部分。
  - type: guide
    text: 二、找重點
  - type: free_text
    prompt: ❶找起點：主角一開始的夢想是什麼？為何有這個夢想？（第1段）
  - type: passage
    source: unknown
    paragraphs:
    - 珍古德小時候因為讀了《杜立德醫生非洲歷險記》，所以夢想著【  去非洲探險   】。
  - type: free_text
    prompt: ❷找「契機」：開始行動的機會（第2.3段）
  - type: guide
    text: （1）珍古德23歲時到非洲，在【 博物館  】工作。
  - type: passage
    source: unknown
    paragraphs:
    - （2）館長想【  找人到岡貝研究黑猩猩   】，她因【  對動物的熱情得到賞識 】，獲得機會。
  - type: free_text
    prompt: ❸找「困難」：研究初期遇到哪些考驗？（第4.5段）
  - type: free_text
    prompt: 1.她遇到什麼阻礙或考驗？
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 2.將珍古德研究初期的困難精簡為一句話。
    options:
    - 研究初期，珍古德面對森林危險、研究不順利和感染瘧疾等多重困難。
    - 研究初期，珍古德最主要的困難是森林危險，其他困難只是補充細節。
    answer: 研究初期，珍古德面對森林危險、研究不順利和感染瘧疾等多重困難。
  - type: free_text
    prompt: ❹找「改變」：黑猩猩和珍古德的關係怎麼變化？（第5～7段）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: →將黑猩猩和珍古德的關係變化精簡為一句話。
  - type: single
    prompt: 請選擇
    options:
    - 黑猩猩從防備、接納，到慢慢信任她，讓她更了解黑猩猩。
    - 珍古德用堅果接近黑猩猩，所以黑猩猩很快信任她。
    answer: 黑猩猩從防備、接納，到慢慢信任她，讓她更了解黑猩猩。
  - type: guide
    text: ❺找「影響」：人物最後有什麼成就？帶來什麼影響？
  - type: guide
    text: 珍古德成為有名的黑猩猩【  研究專家  】，並成立【  國際珍古德協會    】，推動【   動物保育  】和【  環境教育    】。
  - type: guide
    text: 三、統整：本文重點摘要
  - type: guide
    text: 前面已經找出「起點、契機、困難、改變、影響」的重點，請選出最適合當作本文重點摘要的一句話。
  - type: multi
    prompt: 請選擇
    options:
    - 珍古德小時候喜歡《杜立德醫生非洲歷險記》，長大後終於到非洲研究黑猩猩。
    - 珍古德從小嚮往非洲，後來得到研究黑猩猩的機會；雖然研究初期遇到許多困難，她仍慢慢取得黑猩猩的信任，最後成為研究專家並投入保育工作。
    - 珍古德克服森林危險和瘧疾，最後取得博士學位，成為有名的黑猩猩研究專家。
    answer:
    - 珍古德小時候喜歡《杜立德醫生非洲歷險記》，長大後終於到非洲研究黑猩猩。
    - 珍古德從小嚮往非洲，後來得到研究黑猩猩的機會；雖然研究初期遇到許多困難，她仍慢慢取得黑猩猩的信任，最後成為研究專家並投入保育工作。
    - 珍古德克服森林危險和瘧疾，最後取得博士學位，成為有名的黑猩猩研究專家。
  - type: guide
    text: 如果你有做到，請在□中打勾。
  - type: self_check
    items:
    - 我知道記人的文章常按照人物經歷來寫。
    - 我能看出文章安排了哪些重要歷程。
    - 我能用本課的「起點、契機、困難、改變、影響」，找出珍古德人物發展的重點。
