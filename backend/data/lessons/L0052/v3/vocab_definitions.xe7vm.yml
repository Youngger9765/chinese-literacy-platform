  items:
  - index: 1
    word: 解剖
    definition: 為了研究身體構造或死因，切開生物的身體。
  - index: 2
    word: 典藏
    definition: 把有價值的文物或標本收藏並保存起來。
  - index: 3
    word: 擱淺
    definition: 船隻在淺水處卡住，或海洋動物受困在岸邊，無法回到水中。
  - index: 4
    word: 蛻變
    definition: 比喻人或事物經過明顯變化，成為不同的樣子或狀態。
  - index: 5
    word: 削瘦
    definition: 指身體因為疾病、飢餓等原因而變得瘦弱。
  - index: 6
    word: 珍稀
    definition: 珍貴稀少。
  - index: 7
    word: 研判
    definition: 根據資料或證據分析後作出判斷。
  - index: 8
    word: 瀕危物種
    definition: 數量已大幅減少，可能面臨滅絕的生物種類。
  - index: 9
    word: 消耗殆盡
    definition: 因不斷使用而幾乎沒有剩下。
