  passage: 研究團隊檢驗發現，這頭死亡的藍鯨體內仍有許多軟骨，研判牠是一頭不到2歲、還在生長期的幼年藍鯨。牠身形削瘦，專家根據遺體狀況及骨骼判斷，小藍鯨生前被廢棄漁具的繩索纏住頭部，纏繞時間可能長達5至6個月。由於小藍鯨正值快速生長的時期，繩索在牠頭骨兩側竟勒出超過10公分深、5公分寬的溝痕，嘴巴也被勒住，無法張開進食。解剖後發現，小藍鯨的食道和胃裡只有一顆尚未完全消化的魚眼睛，近乎空腹；體內脂肪也幾乎消耗殆盡。可說牠最後是活活餓死的，讓人心疼不已。許多人感嘆，這是小藍鯨「悲傷的故事」。
  start_text: 研究團隊檢驗發現，這頭死亡的藍鯨體內仍有許多軟骨
