  lesson_heading: 第12課  小藍鯨之死
  paragraph_count: 6
  paragraphs:
  - idx: 1
    text: 2020年1月25日，正逢農曆大年初一，臺東長濱鄉的民眾發現一頭長達24公尺、寬2.5公尺的巨大鯨魚在海灘擱淺死亡。經科學家鑑定，證實牠是一頭藍鯨。
  - idx: 2
    text: 藍鯨是世界上體型最大的動物，19世紀初以前，族群數量一直相當穩定，但在商業利益的追逐下，捕鯨者使用大型鯨砲獵殺藍鯨，不到一個世紀便使牠們幾乎滅絕。目前，世界自然保育聯盟（IUCN）已將藍鯨列為瀕危物種。臺灣在日治時期曾捕獲過藍鯨，但尚未有海上目擊紀錄。這次藍鯨難得再現，卻是以擱淺死亡的方式被發現，讓國內鯨豚界既震驚又難過。
  - idx: 3
    text: 研究團隊檢驗發現，這頭死亡的藍鯨體內仍有許多軟骨，研判牠是一頭不到2歲、還在生長期的幼年藍鯨。牠身形削瘦，專家根據遺體狀況及骨骼判斷，小藍鯨生前被廢棄漁具的繩索纏住頭部，纏繞時間可能長達5至6個月。由於小藍鯨正值快速生長的時期，繩索在牠頭骨兩側竟勒出超過10公分深、5公分寬的溝痕，嘴巴也被勒住，無法張開進食。解剖後發現，小藍鯨的食道和胃裡只有一顆尚未完全消化的魚眼睛，近乎空腹；體內脂肪也幾乎消耗殆盡。可說牠最後是活活餓死的，讓人心疼不已。許多人感嘆，這是小藍鯨「悲傷的故事」。
    marker: ☞ 印在本段段號「三」的右側（念順順起點）
  - idx: 4
    text: 為了保留珍稀的藍鯨標本，海洋保育署、成功大學與海洋生物博物館共同合作，隨即展開藍鯨的骨骼重建與研究典藏工作。目前全球完整的藍鯨骨骼標本僅約25件，加上藍鯨骨骼結構複雜、修復不易，更顯得這次的標本製作任務重大。歷經近四年的骨骼修復，屏東海生館終於在2023年底，以「巨鯨之路」為名，完整展示這具標本，開放國人參觀。展廳投射深藍色光影，巨大的骨骼標本高懸於屋頂，模擬小藍鯨優雅潛入海中的姿態，展現藍鯨在海洋中應有的動態美感與生命力。
  - idx: 5
    text: 展廳也同步展示造成小藍鯨死亡的「兇器」——當時纏繞在小藍鯨嘴上的尼龍繩，藉此提醒大家，漁具纏繞對大型鯨類和其他海洋生物是一大威脅。小藍鯨之死也突顯了人類的自私：隨意丟棄不再使用的漁具，竟讓它們變成漂流在海洋中的致命殺手。
  - idx: 6
    text: 如今，小藍鯨已蛻變為博物館永久典藏的標本，以不同的形式延續牠的生命故事，並有了新的意義和價值。然而，唯有人們願意反省並採取行動，共同為保育海洋盡一份心力，還給海洋原本乾淨的面貌，這才是小藍鯨之死教我們最重要的功課。
