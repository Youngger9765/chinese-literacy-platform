lesson_uid: L0052
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略──看證據如何支持判斷
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '這篇課文寫研究團隊如何根據小藍鯨遺體留下的線索，判斷牠為什麼死亡。

      文章中，有些內容是研究團隊實際發現的證據；有些則是根據證據作出的判斷。讀這類文章時，不能只看最後的判斷，還要找出支持判斷的證據：

      ①研究團隊發現了哪些證據？

      ②這些證據能支持什麼判斷？

      ③把多項證據合起來，能不能支持最後的死因判斷？'
  - type: sub_block
    label: 一、找出要回答的問題
    instruction: 一、找出要回答的問題
    answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
    items:
    - type: single
      prompt: 研究團隊檢驗小藍鯨的遺體，主要想回答什麼問題？
      options:
        1: 藍鯨為什麼會成為珍稀的瀕危物種？
        2: 這頭小藍鯨生前遭遇什麼，為什麼死亡？
        3: 這頭小藍鯨的骨骼要用什麼方式修復與展示？
      answer: 2
  - type: sub_block
    label: 二、區分「證據」和「判斷」
    instruction: 二、區分「證據」和「判斷」
    answer_carrier: 紅色 ☑（圖形），被勾中的格子在文字流是空的、未勾的仍留 □
    items:
    - type: fill_table
      instruction: 請根據課文，在正確的□內打勾
      columns:
      - 課文內容
      - 證據
      - 判斷
      rows:
      - 課文內容: 1.小藍鯨體內仍有許多軟骨
        證據: ☑
        判斷: □
      - 課文內容: 2.牠不到兩歲，還在生長期
        證據: □
        判斷: ☑
      - 課文內容: 3.食道和胃裡只有一顆半消化的魚眼睛
        證據: ☑
        判斷: □
      - 課文內容: 4.牠生前吃到的食物很少
        證據: □
        判斷: ☑
    - type: guide
      text: →你發現了嗎？證據是實際觀察到的線索；判斷要有證據支持。
  - type: sub_block
    label: 三、看證據能支持什麼判斷
    instruction: 三、看證據能支持什麼判斷
    sub_instruction: 請先勾選能回答問題的證據，再選出最合理的判斷。證據可能不只一項。
    table_columns_printed:
    - 要回答的小問題
    - 能回答問題的證據
    - 根據證據選出最合理的判斷
    answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
    items:
    - type: sub_block
      label: 1.繩索是否長期纏繞小藍鯨的頭部？
      items:
      - type: multi
        prompt: 能回答問題的證據
        options:
          1: 嘴部留有纏繞的尼龍繩
          2: 頭骨兩側有超過10公分深、5公分寬的溝痕
          3: 牠的身形十分削瘦
        answers:
        - 1
        - 2
      - type: single
        prompt: 根據證據選出最合理的判斷
        options:
          1: 繩索只是短暫纏住牠的頭部
          2: 深而寬的溝痕顯示，繩索長期勒住牠的頭部
        answer: 2
    - type: sub_block
      label: 2.繩索是否妨礙小藍鯨進食？
      items:
      - type: multi
        prompt: 能回答問題的證據
        options:
          1: 嘴巴被繩索勒住，無法張開
          2: 食道和胃近乎空腹，只有一顆半消化的魚眼睛
          3: 牠體內仍有許多軟骨
        answers:
        - 1
        - 2
      - type: single
        prompt: 根據證據選出最合理的判斷
        options:
          1: 繩索妨礙牠張嘴，使牠吃到的食物很少
          2: 牠雖然被繩索纏住，仍能正常進食
        answer: 1
    - type: sub_block
      label: 3.小藍鯨是否長期缺乏食物和能量？
      items:
      - type: multi
        prompt: 能回答問題的證據
        options:
          1: 牠的身形十分削瘦
          2: 體內脂肪幾乎消耗殆盡
          3: 頭骨兩側有深而寬的溝痕
        answers:
        - 1
        - 2
      - type: single
        prompt: 根據證據選出最合理的判斷
        options:
          1: 牠只是天生較瘦，身體仍有足夠能量
          2: 牠長期缺乏食物和能量，身體已十分衰弱
        answer: 2
  - type: guide
    text: '→你發現了嗎？

      不同證據，支持死亡過程中不同的判斷；把判斷連起來，才能看出完整死因。'
  - type: sub_block
    label: 四、合併證據，檢查死因判斷
    instruction: 四、合併證據，檢查死因判斷
    answer_carrier: 橘色手寫字與紅色 ☑（皆為圖形）
    items:
    - type: ordering
      label: '1'
      instruction: 1.前面三項判斷可以連成完整死因。請依事情發生的順序填入【　】中。
      sequence_printed: 【　】→【　】→【　】→最後餓死
      sequence_answer:
      - C
      - B
      - A
      items:
      - index: 1
        option_label: A
        text: 長期缺乏食物和能量，身體嚴重衰弱
        answer: 3
      - index: 2
        option_label: B
        text: 無法正常張嘴，吃到的食物很少
        answer: 2
      - index: 3
        option_label: C
        text: 繩索長期勒住小藍鯨的頭部
        answer: 1
    - type: single
      prompt: 2.把這些證據合起來，哪一項死因判斷最合理？
      options:
        1: 小藍鯨因海中食物不足，長期找不到食物而餓死。
        2: 小藍鯨因廢棄漁具長期纏繞，無法正常進食而餓死。
        3: 小藍鯨擱淺後無法回到海裡，因此飢餓而死亡。
      answer: 2
  - type: self_check
    label: ◎自我檢核
    instruction: 如果你有做到，請在□內打勾。
    items:
    - 1.我能區分證據和判斷。
    - 2.我能找出能支持判斷的證據。
    - 3.我能把多項證據合起來，檢查判斷是否合理。
