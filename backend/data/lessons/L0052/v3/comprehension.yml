lesson_uid: L0052
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列「　」中的語詞，哪一個使用正確？
    options:
      A: 博物館將珍貴標本「研判」多年，供民眾參觀
      B: 救援人員發現一艘船「擱淺」在沙洲旁
      C: 這隻貓恢復健康後，身形變得更加「削瘦」
      D: 校園裡隨處可見的麻雀，是十分「珍稀」的鳥類
    explanation: B的「擱淺」是指船隻在淺水處卡住，使用正確。
  - index: 2
    answer: A
    stem: 根據第二段，藍鯨在不到一個世紀內幾乎滅絕，主要原因是什麼？
    options:
      A: 人類為取得商業利益，大量獵殺藍鯨
      B: 藍鯨經常擱淺，無法回到海中生活
      C: 海水溫度升高，藍鯨失去主要棲息地
      D: 海洋魚群減少，藍鯨長期缺乏食物
    explanation: 第二段指出，捕鯨者在商業利益的追逐下使用大型鯨砲獵殺藍鯨，因此A正確
  - index: 3
    answer: D
    stem: 根據第三段，哪一張圖最符合小藍鯨生前被漁具纏繞的情況？
    options:
      A: 藍鯨骨骼標本
      B: 鯊魚(上端有鰭)
      C: 藍鯨
      D: ''
    options_are_images: true
    option_note: '四個選項是同一列表格裡的四張手繪圖。A~C 在圖上方印有文字標籤（已抄進 options），

      D 那一格**只有圖、沒有標籤**，故 D 的文字是空的——不是漏抄。

      圖的內容只在像素裡：A 是骨骼標本、B 是有背鰭的鯊魚、C 是完整的藍鯨、

      D 是嘴部被深色繩索纏繞的藍鯨（答案）。'
  - index: 4
    answer: B
    stem: 下列哪一組正確區分「證據」和「判斷」？
    options:
      A: 證據：小藍鯨最後餓死；判斷：胃裡只有一顆魚眼睛
      B: 證據：頭骨兩側有深溝痕；判斷：繩索長期勒住頭部
      C: 證據：小藍鯨不到兩歲；判斷：體內仍有許多軟骨
      D: 證據：小藍鯨長期缺乏能量；判斷：脂肪幾乎消耗殆盡
  - index: 5
    answer: C
    stem: 下列哪一項最能說明作者的寫作意圖？
    options:
      A: 介紹藍鯨標本的製作過程，吸引民眾參觀海生館
      B: 說明藍鯨數量減少的歷史，反對所有海洋捕撈活動
      C: 藉小藍鯨的死亡與展示，提醒人們正視廢棄漁具的危害並保育海洋
      D: 讚揚研究團隊的修復技術，證明標本能延續動物生命
  notes:
    answer_carrier: 橘色手寫字（圖形），文字流的（　）內已填有代號
