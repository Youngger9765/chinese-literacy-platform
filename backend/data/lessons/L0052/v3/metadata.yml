intro: 這篇文章記錄了2020年一頭藍鯨在臺灣東部海域擱淺死亡的事件。透過科學家的調查，我們了解到這頭藍鯨的年紀、牠生前所遭遇的困境，以及牠死亡的原因。文章也介紹了科學家如何努力保存這頭珍貴的藍鯨遺體，並將其製成標本供大眾參觀。透過這個故事，我們將一起思考人類活動對海洋生物造成的影響，以及我們應該如何共同守護海洋生態。
