  總表_對照: "總表 10 個語詞與學習單 9 個對不上，差異在兩側都有：\n・總表有、學習單三處（語詞框／第三大題／第八大題灰框）都沒有的：束縛、流竄、燃燒殆盡。\n\
    ・學習單有、總表沒列的：研判、消耗殆盡。\n⚠️ 注意「燃燒殆盡」vs「消耗殆盡」不是同一個詞——課文寫的是「體內脂肪也幾乎消耗殆盡」，\n  學習單三處也一律作「消耗殆盡」，故以學習單為準。\n\
    ・總表那三個多出來的詞**以誘答字的形式散在第八大題格子裡**（流／竄 在 r6c5-c6，\n  燃／燒 在 r1c6-c7、r8c6，束 在 r7c1\
    \ 但格子裡沒有「縛」），可見是同一份舊清單的殘留。\n・學習單自己的三處內容完全一致（9 個語詞，順序略有不同），無內部矛盾。"
strategy_explained: '這一課，我們要練習的是，讀的時候要像小偵探一樣，看看作者提供的「線索」（證據），這些線索是怎麼讓我們相信他講的事情是真的，特別是關於這頭藍鯨的遭遇和死因，要學會從科學家的調查發現中找出支持他們結論的理由

  同時，你也可以在讀的時候，問自己「發生了什麼事？」「為什麼會這樣？」「這對我又有什麼啟示？」「我接下來可以怎麼做？」這樣就能更深入理解這篇文章告訴我們的環境議題，並且思考自己可以如何為海洋盡一份力'
