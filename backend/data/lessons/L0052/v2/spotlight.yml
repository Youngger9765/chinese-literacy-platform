spotlight:
  lesson: G6-L12
  strategy_name: 推論策略-看證據如何支持判斷
  strategy_type: inference
  blocks:
  - type: guide
    text: 一、找出要回答的問題
  - type: single
    prompt: 研究團隊檢驗小藍鯨的遺體，主要想回答什麼問題？
    options:
    - 藍鯨為什麼會成為珍稀的瀕危物種？
    - 這頭小藍鯨生前遭遇什麼，為什麼死亡？
    - 這頭小藍鯨的骨骼要用什麼方式修復與展示？
    answer: 這頭小藍鯨生前遭遇什麼，為什麼死亡？
  - type: guide
    text: 二、區分「證據」和「判斷」
  - type: guide
    text: 請根據課文，在正確的□內打勾
  - type: table
    rows:
    - - 課文內容
      - 證據
      - 判斷
    - - 1.小藍鯨體內仍有許多軟骨
      - ''
      - □
    - - 2.牠不到兩歲，還在生長期
      - □
      - ''
    - - 3.食道和胃裡只有一顆半消化的魚眼睛
      - ''
      - □
    - - 4.牠生前吃到的食物很少
      - □
      - ''
  - type: guide
    text: →你發現了嗎？證據是實際觀察到的線索；判斷要有證據支持。
  - type: guide
    text: 三、看證據能支持什麼判斷
  - type: guide
    text: 請先勾選能回答問題的證據，再選出最合理的判斷。證據可能不只一項。
  - type: table
    rows:
    - - '要回答的

        小問題'
      - 能回答問題的證據
      - 根據證據選出最合理的判斷
    - - 1.繩索是否長期纏繞小藍鯨的頭部？
      - '①嘴部留有纏繞的尼龍繩

        ②頭骨兩側有超過10公分深、5公分寬的溝痕

        □③牠的身形十分削瘦'
      - '□①繩索只是短暫纏住牠的頭部

        ②深而寬的溝痕顯示，繩索長期勒住牠的頭部'
    - - 2.繩索是否妨礙小藍鯨進食？
      - '①嘴巴被繩索勒住，無法張開

        ②食道和胃近乎空腹，只有一顆半消化的魚眼睛

        □③牠體內仍有許多軟骨'
      - '①繩索妨礙牠張嘴，使牠吃到的食物很少

        □②牠雖然被繩索纏住，仍能正常進食'
    - - 3.小藍鯨是否長期缺乏食物和能量？
      - '①牠的身形十分削瘦

        ②體內脂肪幾乎消耗殆盡

        □③頭骨兩側有深而寬的溝痕'
      - '□①牠只是天生較瘦，身體仍有足夠能量

        ②牠長期缺乏食物和能量，身體已十分衰弱'
  - type: guide
    text: →你發現了嗎？
  - type: guide
    text: 不同證據，支持死亡過程中不同的判斷；把判斷連起來，才能看出完整死因。
  - type: guide
    text: 四、合併證據，檢查死因判斷
  - type: free_text
    prompt: 1.前面三項判斷可以連成完整死因。請依事情發生的順序填入【　】中。
  - type: guide
    text: A.長期缺乏食物和能量，身體嚴重衰弱
  - type: guide
    text: B.無法正常張嘴，吃到的食物很少
  - type: guide
    text: C.繩索長期勒住小藍鯨的頭部
  - type: guide
    text: 【　C　】→【　B　】→【　A　】→最後餓死
  - type: single
    prompt: 2.把這些證據合起來，哪一項死因判斷最合理？
    options:
    - 小藍鯨因海中食物不足，長期找不到食物而餓死。
    - 小藍鯨因廢棄漁具長期纏繞，無法正常進食而餓死。
    - 小藍鯨擱淺後無法回到海裡，因此飢餓而死亡。
    answer: 小藍鯨因廢棄漁具長期纏繞，無法正常進食而餓死。
  - type: self_check
    items:
    - 我能區分證據和判斷。
    - 我能找出能支持判斷的證據。
    - 我能把多項證據合起來，檢查判斷是否合理。
