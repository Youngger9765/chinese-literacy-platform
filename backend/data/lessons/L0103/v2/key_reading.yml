passage: '2023年3月，最具聲望的世界柑橘類果醬大賽在英國的一個小城市舉行，來自世界各國的參賽選手雲集。經過重重考驗，一位出身臺南 柳營山村的年輕人林韡勳脫穎而出，虜獲評審的味蕾，最終拿下了一金二銅的成績。

  這位山村來的年輕人是怎麼辦到的呢？

  其實多年前，林韡勳對製作果醬還是門外漢，完全沒有經驗。因為喜歡動物，他大學讀了畜產系，沒想到因為過敏，他只做了短期的動物相關工作就無法繼續了，偏偏在臺南鄉間，工作機會又少，坐困愁城的他不禁懷念起小時候阿嬤做的桑椹醬，那甜蜜、芳香的記憶撫慰他疲憊的心，突然，他靈機一動——「何不來做果醬呢？」

  他想到之前在農場打工時發現，那些漂亮、碩大的水果會被賣出，而那些小小的、酸酸的、醜醜的水果只能丟棄，實在非常可惜，如果自己能像阿嬤那樣將它們熬煮成果醬，豈不是兩全其美嗎？'
