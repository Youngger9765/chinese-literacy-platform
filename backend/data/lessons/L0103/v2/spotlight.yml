spotlight:
  lesson: G7-L6
  strategy_name: 摘要策略-用問題、解決、結果找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: "這課描述林韡勳創業成功的故事。想把一個故事講清楚，最常見的敘事結構就是「問題解決結果」：主角遇見什麼問題？主角怎麼解決？結果如何？ \n但真實世界的故事，總是有許多複雜的內容，會讓讀者不容易看出「問題解決結果」的文章結構，例如，下圖就把本課的「問題」再細分出「認清問題」和「拆解問題」兩個步驟，我們就來學習這個「問題解決流程」吧！"
  - type: guide
    text: 一、從課文裡學「問題解決結果」
  - type: guide
    text: 我們先用（第六段）林韡勳的一個例子來說明他的問題解決步驟吧！
  - type: free_text
    prompt: 1.確認問題：
  - type: single
    prompt: 請確認主角最主要想解決的問題（單選）。
    options:
    - 如何利用那些小小、醜醜、酸酸的水果？
    - 如何製作出優質果醬、並受到市場歡迎？
    - 製作失敗後，不能用的果醬可以去哪裡倒？
    - 如何籌措去英國參加果醬比賽的各種費用？
    answer: 如何製作出優質果醬、並受到市場歡迎？
  - type: free_text
    prompt: 2.拆解問題：每一個待解決的問題，都可以再拆成許多小問題，或找出造成問題的可能原因。
  - type: single
    prompt: 如果林韡勳現在要解決的問題是「如何製作受歡迎的果醬？」，你覺得這問題還可以拆成哪些小問題呢？（複選）
    options:
    - 如何找到國內外可用的食譜？　②水果要多熟才可以用？
    - 如何籌措去英國比賽的經費？
    - 最佳熬煮時間和火候為何？
    - 果醬怎麼做才不會又糊又黑？
    - ⑥在鄉下找不到工作怎麼辦？
    answer: 如何找到國內外可用的食譜？　②水果要多熟才可以用？
  - type: free_text
    prompt: 3.逐項解決：主要問題被拆解成多項細部問題後，就可對每個困難逐項提出解決之道，並執行看看結果怎麼樣，一直試出最好的結果為止。
  - type: guide
    text: 下圖以「失敗的果醬倒哪裡？」為例，說明林韡勳解決問題的歷程。
  - type: free_text
    prompt: 4.確認結果：就是要看解決方案的執行成果。
  - type: single
    prompt: 根據課文及上圖，哪一選項是「失敗的果醬倒哪裡？」這個問題的最好解決方案？（單選）
    options:
    - 倒後院
    - 丟垃圾車　　③餵蜜蜂
    answer: 倒後院
  - type: guide
    text: 二、用「問題解決結果結構」寫摘要
  - type: guide
    text: 許多同學都覺得寫摘要是個讓人頭痛的功課。表１指出，如果能按照故事結構寫出簡要內容，再把每結構下的內容組合起來，摘要就完成了。
  - type: guide
    text: 表1. 怎樣運用故事結構寫摘要：先依結構寫簡要內容，再組合內容
  - type: fill_table
  - type: guide
    text: 三、小試身手：找到故事裡的「問題拆解問題解決結果」
  - type: guide
    text: （請先閱讀底下的真實故事後，回答1, 2, 3的問題）
  - type: guide
    text: 〈泰國石灰岩洞穴救援：怎麼把十三個人救出來？〉
  - type: free_text
    prompt: ❶2018年，泰國一支少年足球隊和教練進入一個很深的石灰岩洞穴探險，突然下起大雨，雨水灌進洞穴，封住回程的道路。十二名少年和教練，共13人受困，只能往洞穴深處躲避，等待救援。
  - type: free_text
    prompt: ❷洞穴又暗又狹窄，積水很深，要如何掌握洞穴的地形及路徑？❸救援團隊要如何了解洞穴路線、確定孩子們在哪裡？有些孩子不會游泳，要如何離開洞穴。❹救援團隊要如何在很短的時間內召募厲害的潛水員、準備氧氣瓶、通訊設備，和整個團隊需要的物資？❺他們也透過網路及媒體向各界募集人力、資源。
  - type: passage
    source: unknown
    paragraphs:
    - ❻專家們用各種科技弄清楚洞穴的路線，畫出地圖。❼幾位專家潛水進入洞穴，了解路徑，其中２位不幸遇險死亡。❽事發9天後才發現受困的足球隊，而且都還活著。❾救援團隊準備氧氣瓶，在危險路段安排潛水員接應，讓孩子們在協助下，一段一段通過積水區。
  - type: guide
    text: ❿救援啟動18天後，13名受難者終於全數安全離開洞穴。
  - type: guide
    text: 確認問題：
  - type: single
    prompt: 請確認這則報導中最主要想解決的問題（單選）。
    options:
    - 13名受難者究竟困在洞穴何處？
    - 如何弄清楚洞穴裡的地形與路徑？
    - 如何救出困在洞穴裡的13人？
    - 如何快速召募到潛水員、募集到需用的物資（如氧氣瓶）
    answer: 如何救出困在洞穴裡的13人？
  - type: free_text
    prompt: ２.拆解問題：
  - type: single
    prompt: 請判斷報導中最主要想解決的問題，可以拆解成哪些小問題？（多選）
    options:
    - 13名受難者究竟困在洞穴何處？
    - 如何弄清楚洞穴裡的地形與路徑？
    - 如何救出困在洞穴裡的13人？
    - 如何快速召募潛水員、募集到必要物資（如氧氣瓶）？
    - 如何幫助不會游泳的少年穿過被水封住的路段？
    answer: 13名受難者究竟困在洞穴何處？
  - type: free_text
    prompt: ３.問題解決過程：
  - type: guide
    text: 底下表格呈現了泰國洞穴救援的故事，請你在四個步驟（確認問題、拆解問題、逐項解決 或 確認結果）中擇一填入，並在右欄填入句子的代號❶、❷……。
  - type: fill_table
  - type: fill_table
