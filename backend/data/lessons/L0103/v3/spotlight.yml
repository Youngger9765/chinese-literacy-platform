lesson_uid: L0103
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略——用問題、解決、結果找重點
  strategy_type: summarize
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），聚光燈內共 11 個
  arrow_note: '原稿的「問題➔解決➔結果」箭頭是 Wingdings F0E0 符號字元，**不在文字流**。

    照 L0031 的既有做法以換行代替，⛔ 沒有補上「→」（補了逐字門必 FAIL，實測過）。'
  structure_note: '三個小節（一、從課文裡學／二、寫摘要／三、小試身手）都攤在同一層 blocks。

    ⛔ 表格沒有塞進 sub_block —— `renderSubBlock` 不依 type 分派，巢狀的表格

    只會畫出 instruction，`columns`/`rows` 會整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '這課描述林韡勳創業成功的故事。想把一個故事講清楚，最常見的敘事結構就是「問題

      解決

      結果」：主角遇見什麼問題？主角怎麼解決？結果如何？

      但真實世界的故事，總是有許多複雜的內容，會讓讀者不容易看出「問題

      解決

      結果」的文章結構，例如，下圖就把本課的「問題」再細分出「認清問題」和「拆解問題」兩個步驟，我們就來學習這個「問題解決流程」吧！'
  - type: guide
    text: '一、從課文裡學「問題

      解決

      結果」'
  - type: guide
    text: 我們先用（第六段）林韡勳的一個例子來說明他的問題解決步驟吧！
  - type: guide
    text: 1.確認問題：
  - type: single
    prompt: 請確認主角最主要想解決的問題（單選）。
    options:
      1: 如何利用那些小小、醜醜、酸酸的水果？
      2: 如何製作出優質果醬、並受到市場歡迎？
      3: 製作失敗後，不能用的果醬可以去哪裡倒？
      4: 如何籌措去英國參加果醬比賽的各種費用？
    answer: 2
  - type: guide
    text: 2.拆解問題：每一個待解決的問題，都可以再拆成許多小問題，或找出造成問題的可能原因。
  - type: multi
    prompt: 如果林韡勳現在要解決的問題是「如何製作受歡迎的果醬？」，你覺得這問題還可以拆成哪些小問題呢？（複選）
    options:
      1: 如何找到國內外可用的食譜？
      2: 水果要多熟才可以用？
      3: 如何籌措去英國比賽的經費？
      4: 最佳熬煮時間和火候為何？
      5: 果醬怎麼做才不會又糊又黑？
      6: 在鄉下找不到工作怎麼辦？
    answer:
    - 1
    - 2
    - 4
    - 5
    options_note: 原稿六個選項排成三行、每行兩個，此處拆成六項。
  - type: guide
    text: 3.逐項解決：主要問題被拆解成多項細部問題後，就可對每個困難逐項提出解決之道，並執行看看結果怎麼樣，一直試出最好的結果為止。
  - type: guide
    text: 下圖以「失敗的果醬倒哪裡？」為例，說明林韡勳解決問題的歷程。
  - type: table
    prompt: 失敗的果醬倒哪裡？
    columns:
    - 問題
    - 解決方案
    - 結果
    rows:
    - - 失敗的果醬倒哪裡？
      - 倒在家裡後院
      - 家裡後院倒不下
    - - ''
      - 倒在垃圾車廚餘桶
      - 造成清潔隊員困擾
    - - ''
      - 拿去餵蜜蜂
      - 成功解決問題
    rows_note: '原稿是一張**流程圖**（左邊一個問題方塊，中間三個解決方案方塊，右邊三個結果方塊，

      以箭頭連接），三個欄名「問題／解決方案／結果」印在圖的最下方。

      圖上的文字全部在文字流的文字方塊裡（不是畫在像素上），所以**沒有**標 `text_carrier: image`。

      ⚠️ 右欄三個結果旁另有圖形標記：前兩個是紅色 ✗、第三個是綠色 ○ ——

      那是圖形層的判定記號，文字流沒有，此處以本註記錄，沒有寫進儲存格文字。'
  - type: guide
    text: 4.確認結果：就是要看解決方案的執行成果。
  - type: single
    prompt: 根據課文及上圖，哪一選項是「失敗的果醬倒哪裡？」這個問題的最好解決方案？（單選）
    options:
      1: 倒後院
      2: 丟垃圾車
      3: 餵蜜蜂
    answer: 3
    options_note: 三個選項原稿印在同一行。
  - type: guide
    text: 二、用「問題解決結果結構」寫摘要
  - type: guide
    text: 許多同學都覺得寫摘要是個讓人頭痛的功課。表１指出，如果能按照故事結構寫出簡要內容，再把每結構下的內容組合起來，摘要就完成了。
  - type: guide
    text: 表1. 怎樣運用故事結構寫摘要：先依結構寫簡要內容，再組合內容
  - type: fill_table
    columns:
    - 結構名稱
    - 簡要內容
    rows:
    - 結構名稱: 1.主要問題
      簡要內容: 林韡勳想要製作出高品質、受歡迎的果醬。
    - 結構名稱: 2.【　】
      結構名稱_blanks:
      - answer: 拆解問題
      簡要內容: 他遇上食譜、熬煮火候、知名度、失敗果醬處理和出國比賽等問題。
    - 結構名稱: 3.【　】
      結構名稱_blanks:
      - answer: 逐一解決
      簡要內容: 他逐一面對所有的問題，一再嘗試，直到問題解決為止。
    - 結構名稱: 4.【　】
      結構名稱_blanks:
      - answer: 確認結果
      簡要內容: 最後，他到英國參賽，得到一金二銅的榮耀。
    - 結構名稱: 摘要：（把簡要內容組合成摘要）
      簡要內容: 林韡勳想要製作出高品質、受歡迎的【　】。他遇上食譜、熬煮火候、知名度、失敗果醬處理和【　】等問題。他逐一面對所有的問題，一再嘗試，直到【　】為止。最後，他到英國參賽，得到【　】的榮耀。
      簡要內容_blanks:
      - answer: 果醬
      - answer: 出國比賽
      - answer: 問題解決
      - answer: 一金二銅
    rows_note: '最後一列「摘要」在原稿是**跨兩欄的合併儲存格**（左欄印「摘要：（把簡要內容組合成摘要）」，

      右邊接一整段填空文字），此處為了維持兩欄形狀拆成左右兩格。

      ⚠️ 第 3 列答案原稿印「逐一解決」，但同一節的步驟標題與「三 小試身手」的表格

      用的是「逐項解決」。照原稿記「逐一解決」，未替教材挑一個。'
    answer_carrier: 橘色手寫字（PDF p5~p6）；文字層的【】內已填有同樣的答案
  - type: guide
    text: '三、小試身手：找到故事裡的「問題

      拆解問題

      解決

      結果」'
  - type: guide
    text: （請先閱讀底下的真實故事後，回答1, 2, 3的問題）
  - type: passage
    label: 〈泰國石灰岩洞穴救援：怎麼把十三個人救出來？〉
    paragraphs:
    - ❶2018年，泰國一支少年足球隊和教練進入一個很深的石灰岩洞穴探險，突然下起大雨，雨水灌進洞穴，封住回程的道路。十二名少年和教練，共13人受困，只能往洞穴深處躲避，等待救援。
    - ❷洞穴又暗又狹窄，積水很深，要如何掌握洞穴的地形及路徑？❸救援團隊要如何了解洞穴路線、確定孩子們在哪裡？有些孩子不會游泳，要如何離開洞穴。❹救援團隊要如何在很短的時間內召募厲害的潛水員、準備氧氣瓶、通訊設備，和整個團隊需要的物資？❺他們也透過網路及媒體向各界募集人力、資源。
    - ❻專家們用各種科技弄清楚洞穴的路線，畫出地圖。❼幾位專家潛水進入洞穴，了解路徑，其中２位不幸遇險死亡。❽事發9天後才發現受困的足球隊，而且都還活著。❾救援團隊準備氧氣瓶，在危險路段安排潛水員接應，讓孩子們在協助下，一段一段通過積水區。
    - ❿救援啟動18天後，13名受難者終於全數安全離開洞穴。
    paragraphs_note: '原稿把 ❶~❿ 十個句子編號印在句首（不是段號），四個自然段的分法照原稿。

      ⚠️ 第 3 段的「其中２位」用的是**全形２**，原稿如此。'
  - type: guide
    text: 1.確認問題：
  - type: single
    prompt: 請確認這則報導中最主要想解決的問題（單選）。
    options:
      1: 13名受難者究竟困在洞穴何處？
      2: 如何弄清楚洞穴裡的地形與路徑？
      3: 如何救出困在洞穴裡的13人？
      4: 如何快速召募到潛水員、募集到需用的物資（如氧氣瓶）
    answer: 3
    options_note: 第 4 個選項原稿句末**沒有**問號，照原樣保留。
  - type: guide
    text: ２.拆解問題：
  - type: multi
    prompt: 請判斷報導中最主要想解決的問題，可以拆解成哪些小問題？（多選）
    options:
      1: 13名受難者究竟困在洞穴何處？
      2: 如何弄清楚洞穴裡的地形與路徑？
      3: 如何救出困在洞穴裡的13人？
      4: 如何快速召募潛水員、募集到必要物資（如氧氣瓶）？
      5: 如何幫助不會游泳的少年穿過被水封住的路段？
    answer:
    - 1
    - 2
    - 4
    - 5
  - type: guide
    text: ３.問題解決過程：
  - type: guide
    text: 底下表格呈現了泰國洞穴救援的故事，請你在四個步驟（確認問題、拆解問題、逐項解決 或 確認結果）中擇一填入，並在右欄填入句子的代號❶、❷……。
  - type: fill_table
    columns:
    - 步驟名稱
    - 句子代號
    column_headers_printed:
    - '在【　】填入

      解決問題步驟名稱'
    - 在【　】中填入句子代號❶、❷……
    rows:
    - 步驟名稱: 確 認 問 題
      步驟名稱_label: 範例
      句子代號: ❶ (要如何救出困在洞穴裡的13人？)
    - 步驟名稱: 拆 解 問 題
      句子代號: 【　】
      句子代號_blanks:
      - answer: ❷ ❸ ❹
    - 步驟名稱: 【　】
      步驟名稱_blanks:
      - answer: 逐 項 解 決
      句子代號: 【　】
      句子代號_blanks:
      - answer: ❺ ❻ ❼
    - 步驟名稱: 【　】
      步驟名稱_blanks:
      - answer: 確 認 結 果
      句子代號: 【　】
      句子代號_blanks:
      - answer: ❽ ❾ ❿
    rows_note: '第一列左格印有一個「範例」小標籤，右格已經填好；第二列左格也是**原稿就印好的**

      （不是空格），只有右格要填。第三、四列兩格都要填。

      原稿的步驟名稱字與字之間有空白（版面對齊用），照原樣保留。'
    answer_carrier: 橘色手寫字（PDF p7）；文字層的【】內已填有同樣的答案
