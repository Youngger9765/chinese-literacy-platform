intro: 這篇文章介紹了一位年輕人林韡勳，他原本對製作果醬一竅不通，卻因為一次偶然的機會，回憶起小時候阿嬤做的果醬，激發了他創業的念頭。文章記錄了他如何從零開始，克服了無數次的失敗，不斷研究、嘗試，甚至面臨資金短缺的困境。過程中，他運用創意，將臺灣在地水果與不同食材結合，並透過不斷的努力與堅持，最終在國際果醬大賽中脫穎而出，贏得佳績。這是一個關於如何將在地食材發揚光大，並實現夢想的故事。
