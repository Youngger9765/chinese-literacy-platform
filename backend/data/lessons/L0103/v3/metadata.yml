strategy_explained: '這一課我們要練習的是，遇到困難時，怎麼像林韡勳一樣，一步一步想辦法把事情做好

  因為這篇文章裡，他從一個什麼都不懂的門外漢，靠著一次次的研究、嘗試，解決了技術和資金上的難題，最後還拿到國際大獎，這過程超級適合我們學怎麼「解決問題」

  讀的時候，你可以想想看，林韡勳是怎麼從「不知道怎麼做」到「成功做出果醬」，中間遇到了哪些「問題」，他又用了什麼「方法」去「解決」，最後的「結果」是什麼，這樣就能學到好多厲害的招數喔'
