lesson_uid: L0103
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p9~p10）；文字層的（　）內已填有同樣的代號
  questions:
  - index: 1
    answer: C
    stem: 「如果自己能像阿嬤那樣將它們熬煮成果醬，豈不是『兩全其美』嗎？」這裡的『兩全其美』指的是哪兩件事呢？
    options:
      A: 能解決次級水果被丟棄的問題，也可以用做果醬來懷念阿嬤
      B: 能解決找工作不易的困境，製作果醬還能夠精進自己的廚藝
      C: 能解決找工作不易的困境，也能解決次級水果被丟棄的問題
      D: 能解決找工作不易的困境，還能出國參加果醬比賽為國爭光
  - index: 2
    answer: A
    stem: 林韡勳在「研發與銷售」自己的果醬時遇到了許多困難，下列哪一項不是這個階段的問題？
    options:
      A: 要如何籌措前往出國參加果醬比賽的旅費
      B: 沒有製作果醬的專業背景，導致製作頻頻失敗
      C: 追求果醬品質導致果醬售價太高，賣不出去
      D: 研發果醬的過程失敗太多次，浪費了許多食材
    stem_note: 題幹的「不是」在原稿加了方框強調。
  - index: 3
    answer: D
    stem: 下面哪個事件直接促使林韡勳開始參加英國果醬比賽？
    options:
      A: 林韡勳不想浪費食物，所以把做失敗的果醬拿去餵蜜蜂
      B: 林韡勳沒有果醬專業背景，仍堅持不斷研究並製作果醬
      C: 林韡勳將自己的果醬分送給親友，並且常常到市集擺攤
      D: 林韡勳接受英國籍客人的建議，去參加英國的果醬比賽
  - index: 4
    answer: B
    stem: 根據課文，下列哪些特質最能說明林韡勳成功的重要原因？
    option_bank_printed:
      甲: 重視細節
      乙: 大學的專業
      丙: 看重創意
      丁: 喜愛動物
      戊: 發展新技術
    option_bank_printed_note: 甲~戊 五個特質印在題幹下方一個圓角方框裡，選項再從中組合。
    options:
      A: 甲乙戊
      B: 甲丙戊
      C: 丙丁戊
      D: 乙丙丁
  - index: 5
    answer: C
    stem: 請回頭看一下聚光燈裡的表１，請問它最主要想傳達什麼訊息？
    options:
      A: 許多國中生都覺得寫摘要是個讓人頭痛的功課
      B: 寫摘要最具挑戰的是必須從瑣碎的細節裡，抽取共同的元素
      C: 寫摘要可根據故事結構簡要寫出內容，再組合這些內容
      D: 寫摘要最重要的是如何有根有據的寫出簡要的內容
