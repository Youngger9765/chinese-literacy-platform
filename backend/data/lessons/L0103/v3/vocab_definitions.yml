lesson_uid: L0103
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框中找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  methods_note: 原稿的三個項目符號是 🅐 🅑 🅒（圓圈字母），不是自動編號。
  vocabulary_bank:
  - 雲集
  - 脫穎而出
  - 虜獲
  - 坐困愁城
  - 桂冠
  - 靈機一動
  - 兩全其美
  - 口碑
  - 籌措
  - 大為嘆服
  - 層出不窮
  answer_carrier: 橘色手寫字（PDF p3）；文字層的空格內已填有同樣的答案
  items:
  - index: 1
    word: 兩全其美
    definition: 一件事同時顧到兩方面，讓兩方面都能獲益。
  - index: 2
    word: 脫穎而出
    definition: 在眾人中顯露出優秀的表現。
  - index: 3
    word: 籌措
    definition: 設法準備或募集需要的錢、物品。
  - index: 4
    word: 坐困愁城
    definition: 形容情況艱難，沒有出路，而且無力擺脫。
  - index: 5
    word: 口碑
    definition: 眾人口耳相傳的評價。
  - index: 6
    word: 靈機一動
    definition: 突然想到了解決問題的方法。
  - index: 7
    word: 虜獲
    definition: 吸引並獲得。本文指獲得評審的喜愛。
  - index: 8
    word: 雲集
    definition: 許多人從各地聚集在一起。
  - index: 9
    word: 桂冠
    definition: 原指月桂葉編成的冠帽，後來比喻比賽中的最高榮譽。
  - index: 10
    word: 大為嘆服
    definition: 很讚嘆、佩服。
  - index: 11
    word: 層出不窮
    definition: 形容接連不斷地出現，好像永遠不會停止。
