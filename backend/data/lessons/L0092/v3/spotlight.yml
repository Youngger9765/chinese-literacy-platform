lesson_uid: L0092
version_id: v3
section_no: 九
spotlight:
  strategy_name: 媒體素養與識讀──檢查誠信，辨識詐騙
  strategy_type: media_literacy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本節 36 個），PDF p9~p13 全部可見
  structure_note: '四大節（一 從課文學方法／二 小試身手／三 再練一次／四 最重要的挑戰）＋自我檢核，

    本檔攤平成線性 blocks，不塞進 sub_block —— `renderSubBlock` 不依 type 分派，

    巢狀的選項會整片消失而且不報錯。

    ⚠️ 「（教育訓練題）」那三題是**四／三個選項全部要勾**的複選，不是單選 —— 原稿明寫

    「4個選項都是警訊，請默讀所有選項一次，並在□中打勾」。'
  blocks:
  - type: concept_box
    text: '本課的結論與應用：

      結論：教主的預言落空後，部分信眾因為已經投入太多，反而替教主找理由、繼續相信、持續付出。

      應用：其實，詐騙者也常利用相似心理，先做出誘人的承諾，或製造可怕的威脅；等你點了連結、交出資料或付了錢，又不斷提出新的理由，要求你配合行動，繼續付出。從本課，可以學到兩件事：

      1.收到訊息時，檢查對方的承諾、證據與要求。

      2.已經投入時，不要因為不甘心而繼續投入。

      底下我們要學習用四個步驟判讀詐騙訊息。'
  - type: concept_box
    text: '詐騙訊息判讀有如下四個步驟：

      ❶看承諾威脅：它要我相信什麼？答應我會得到什麼，或警告我會失去什麼？

      ❷對證據：它的說法有可靠證據嗎？承諾有沒有實現？說法是否前後改變？

      ❸提質疑：它如何解釋未實現的承諾？有進一步的要求嗎？

      ❹先停手：即使已經投入，也先停止下一步。不使用對方提供的聯絡方式，自己找官方管道查證'
  - type: guide
    text: 一、從課文學方法：承諾落空後，為什麼還相信？該怎麼辦？
  - type: single
    prompt: '❶看承諾威脅

      教主原本做出什麼承諾？'
    options:
      1: 信徒只要虔誠，就能得到很多財產。
      2: 世界末日來臨時，信徒會被外星人救走。
      3: 信徒加入團體後，就不會遇到任何困難。
    answer: 2
  - type: single
    prompt: '❷對證據

      1.到了預言中的日期，實際發生了什麼事？'
    options:
      1: 洪水沒有出現，外星飛碟也沒有來。
      2: 外星飛碟出現，但沒有帶走所有信徒
      3: 洪水發生了，信徒卻沒有得到救援。
    answer: 1
  - type: single
    prompt: 2.教主原來的預言、承諾和實際結果：
    options:
      1: 完全一致
      2: 明顯不一致
    answer: 2
  - type: single
    prompt: '❸提質疑

      預言落空後，教主說：「因為信眾虔誠，外星人才取消世界末日。」這個新解釋有什麼問題？'
    options:
      1: 新說法和原來的預言完全相同
      2: 提供了可以重複驗證的科學證據
      3: 無論世界末日有沒有發生，教主都能說自己是對的。
    answer: 3
  - type: single
    prompt: '❹先停手

      教主預言落空，有位信眾想：「我已經付出這麼多，如果承認自己看錯，不就全白費了嗎？」根據本課課文，底下哪一個是他最合理的決定？'
    options:
      1: 繼續付出！我現在不能離開，會辜負了教主對我的信任。
      2: 停止付出！既然預期的結果都未實現，我還是先停下來比較安全。
      3: 繼續付出！只要離開教主，我原來投入的就永遠拿不回來了。
      4: 折半付出！原來要捐10萬，先捐一半就好。這樣風險較低。
    answer: 2
  - type: guide
    text: '二、小試身手：判讀詐欺簡訊

      判讀詐欺訊息的步驟和「一、從課文學方法」的四個步驟非常相似，只有一點點差異。重點都是對類似的訊息都要提高警覺，要看證據才作決定。判讀詐欺訊息也有四個步驟：

      ❶看承諾威脅；❷找詐騙警訊；❸對證據；❹先停手，再查證

      我們練習用這四步驟來判讀以下訊息是不是詐欺訊息。'
  - type: passage
    label: 阿華收到一則簡訊：
    paragraphs:
    - '【銀行安全通知】

      您的網路銀行出現異常，帳戶將於今晚10點凍結。請立即點選下列網址完成身分驗證，並輸入帳號、密碼與簡訊驗證碼：http://bank-safe-check.vip'
  - type: single
    prompt: '❶看承諾與要求

      1.這則簡訊要阿華相信有什麼好處或威脅？'
    options:
      1: 如果不立刻驗證，帳戶就會被停用。
      2: 只要到銀行櫃臺，就能領取獎金。
      3: 銀行準備更換所有客戶的提款卡。
    answer: 1
  - type: single
    prompt: 2.它用什麼方法催促阿華行動？
    options:
      1: 說明可以慢慢處理，不必著急
      2: 請阿華有空時到學校詢問老師
      3: 設定今晚10點的期限，製造緊張感。
    answer: 3
  - type: multi
    prompt: '❷找詐騙警訊：這則簡訊有許多可疑之處喔！

      （教育訓練題；4個選項都是警訊，請默讀所有選項一次，並在□中打勾）'
    options:
      1: 傳送者身分不清楚
      2: 要求輸入帳號、密碼與簡訊驗證碼
      3: 網址和銀行網址不一致
      4: 以帳戶即將停用製造時間壓力
    answers:
    - 1
    - 2
    - 3
    - 4
  - type: single
    prompt: '❸對證據

      簡訊有沒有提供可靠證據，證明阿華的帳戶真的出現異常？'
    options:
      1: 有，因為簡訊寫得很正式
      2: 有，因為訊息中有「銀行安全通知」
      3: 沒有，只有簡訊中的說法，還需要自行查證。
    answer: 3
  - type: guide
    text: '*提醒：訊息看起來正式、使用銀行名稱或標誌，也不保證它真的來自銀行。'
  - type: multi
    prompt: '❸+提質疑

      收到陌生簡訊，要你輸入個資，太奇怪了。可以先質疑一下簡訊的要求有什麼不合理的地方？請判斷底下選項哪些是合理的質疑？（複選）'
    options:
      1: 現在是五點，晚上十點就要處理？發訊息的人幹嘛這麼急？
      2: 咦，他怎麼有我的手機號碼？這還不夠，還要我輸入一堆個資？
      3: 銀行明天早上九點才開，我明天再打電話豈不更安全？
    answers:
    - 1
    - 2
    - 3
  - type: single
    prompt: '❹先停手，再查證

      1.阿華接下來怎麼做最安全？'
    options:
      1: 點開簡訊中的連結，看完再決定。
      2: 回覆簡訊，詢問對方是不是真的。
      3: 不點連結，自己打開銀行官方App，查找銀行官方電話確認。
    answer: 3
  - type: single
    prompt: 2.假如阿華已經點開連結，還沒有輸入資料，他應該怎麼做？
    options:
      1: 既然已經點開，就繼續完成驗證。
      2: 立刻關閉網頁，不再輸入任何資料，再用官方管道確認。
      3: 先輸入帳號，密碼可以之後再決定。
    answer: 2
  - type: single
    prompt: 3.假如他已經輸入帳號、密碼或驗證碼，較適當的做法是：
    options:
      1: 立刻聯絡銀行官方客服、變更密碼。
      2: 再輸入一次資料，確認前一次有沒有成功。
      3: 先等待對方通知，不要讓別人知道。
    answer: 1
  - type: guide
    text: 三、再練一次：判讀超低價網購訊息
  - type: passage
    label: 小偉在社群網站收到陌生人的訊息：
    paragraphs:
    - '【默默平台精品限時特賣】

      ALLGOOD運競館出清存貨，賠錢特賣——新款球鞋，原價四千元，限時特賣五百！數量有限，想買請立刻加私人帳號。請直接匯款，以省下默默網購平台手續費，享受免手續費的商品。

      請慎選型號商品，收到匯款後一定出貨，售出一概不退還。限時優待，最遲今日午夜12:00匯款，逾時不候。'
  - type: multi
    prompt: '❶看承諾與要求

      1.這則簡訊做出什麼承諾？（複選）'
    options:
      1: 五百元就能買到原價四千元的球鞋
      2: 試穿滿意後付款，不滿意可退
      3: 直接向AllGOOD購買，可省默默平台手續費。
    answers:
    - 1
    - 3
    note: 選項 3 印「AllGOOD」，訊息本文印「ALLGOOD」，原稿拼法不一致，兩處都照原樣
  - type: multi
    prompt: 2.訊息要求小偉怎麼做？（複選）
    options:
      1: 離開原來的默默平台，加入私人帳號
      2: 直接匯款給陌生人
      3: 先到實體商店試穿確定尺碼
      4: 在今晚12:00前完成匯款。
    answers:
    - 1
    - 2
    - 4
  - type: multi
    prompt: '❷找詐騙警訊

      下列哪些是較明顯的警訊？（複選）'
    options:
      1: 售價明顯低於一般行情太多
      2: 商品圖片拍得十分漂亮、吸引人
      3: 要求離開原購物平台私下交易
      4: 催促立刻決定，逾時不候
      5: 要求直接匯款，且不提供退換貨保障。
    answers:
    - 1
    - 3
    - 4
    - 5
  - type: multi
    prompt: '❸對證據

      收到這個簡訊，有什麼方法可進一步確認訊息真假？

      （教育訓練題；３個選項都能確認真假，請把3個選項默讀一次，並在□中打勾）'
    options:
      1: 可查詢ALLGOOD運競館官方網站，看看有無特價活動。
      2: 可將簡訊截圖，詢問默默網購平台客服專線。
      3: 可至數位發展部的網路詐騙通報查詢網查詢、確認或通報。
    answers:
    - 1
    - 2
    - 3
  - type: single
    prompt: '❹先停手，再查證

      小偉接下來怎麼做最安全？（單選）'
    options:
      1: 打電話詢問對方價錢、商品及匯款細節。
      2: 不私下匯款，查找正式賣場、賣家資料與市場價格。
    answer: 2
  - type: guide
    text: 四、最重要的挑戰：已經付錢了，還要繼續嗎？
  - type: passage
    label: 小安在網路上購買演唱會門票
    paragraphs:
    - 小安在網路上購買演唱會門票，對方開價三千元，小安匯出之後，對方簡訊說：「抱歉，因不明原因，你的付款被系統凍結了，票買不成，我要退你三千，但系統要求再付二千元保證金，才能解除凍結，三千元和保證金都會一起退還。這是最後一筆，請立刻匯款。」
  - type: single
    prompt: '❶看原來的承諾

      1.對方原本答應：'
    options:
      1: 收到三千元後，會交付演唱會門票
      2: 小安還需再付五千元保證金
      3: 小安只能得到部分門票。
    answer: 1
  - type: single
    prompt: 2.實際結果是：
    options:
      1: 小安沒有拿到門票，對方說會儘快把三千元退還
      2: 小安沒有拿到門票，對方又提出新的付款要求，才能退款。
    answer: 2
  - type: single
    prompt: '❷看新的說法

      這個發展和課文中的教主有什麼相似之處？'
    options:
      1: 原來的承諾沒有實現，又提出新的理由。
      2: 原來的承諾已經實現，對方只是補充說明。
      3: 對方承認自己原來的說法錯誤。
    answer: 1
  - type: single
    prompt: '❸小安心裡想：「已經付了三千元……」

      小安可能會想：「我都已經付三千元了，現在不繼續，前面的錢不就白花了嗎？」這時最適合提醒自己？'
    options:
      1: 正因為已經付了三千元，更應該再付五千元。
      2: 已經投入的錢，不能證明對方可信；繼續付款可能讓損失更大。
      3: 只要對方保證是最後一筆，就可以相信。
    answer: 2
  - type: single
    prompt: '❹先停手，再求助

      小安現在最適合怎麼做？'
    options:
      1: 立刻支付保證金，避免錯過退款
      2: 要求對方再寫一次保證，然後匯款。
      3: 停止付款、保存對話和匯款紀錄，找可信任的大人及相關單位協助。
      4: 刪除全部訊息，假裝事情沒有發生。
    answer: 3
  - type: guide
    text: 記住：已經投入的錢拿不回來，確實會讓人難過；但繼續投入，不一定能拿回損失，反而可能越陷越深。
  - type: self_check
    label: ◎自我檢核
    items:
    - 我能找出對方做出的承諾或威脅。
    - 我會檢查承諾是否有證據支持，說法是否前後一致。
    - 我能辨識催促、陌生連結、索取個資及要求匯款等警訊。
    - 我知道可以使用官方管道查證。
    - 我知道即使已經點擊、提供資料或付款，也可以立刻停止下一步。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿五格都是空的 □
