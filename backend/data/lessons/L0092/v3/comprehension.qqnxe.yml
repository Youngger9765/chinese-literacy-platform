lesson_uid: L0092
version_id: v3
section_no: 六
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 民眾從各地湧入跨年晚會，廣場擠滿了「南轅北轍」的人潮
      B: 父親勤懇工作以累積財富，為家庭「傾家蕩產」的付出
      C: 關於這個密室命案，兇手如何潛入作案，令警方「匪夷所思」
      D: 哨聲一響，大家「衝鋒陷陣」的跳入水中，泳渡日月潭
    explanation: （A、B、D-語意錯誤）
    explanation_note: 原稿是一個浮動說明框，印在題號右側
  - index: 2
    answer: D
    stem: 根據課文第九段，「聽其言、觀其行」的信眾，最容易做出何種舉動？
    options:
      A: 信徒對教主的言論以及行為都深信不疑
      B: 用一個人的外貌，決定他是否可以信任
      C: 如果對方可以說服我，我就決定信任他
      D: 觀察其言行是否一致，再決定是否信任
    explanation: （第13段聽其言而觀其行者，除了聽對方的言論、也要觀察他的行為是否言行一致，才能判斷是否值得信任。）
    stem_note: 題幹寫「第九段」、說明框寫「第13段」，但本課課文只有 11 段，該句實際印在第 9 段。照原稿記錄，未更動
  - index: 3
    answer: B
    stem: 根據你對課文的理解，教主預言失敗後，信眾反應不同，最主要和哪一項因素有關？
    options:
      A: 必須看信眾得到什麼證據而定
      B: 必須看信眾投入此信仰的程度而定
      C: 必須看教主是否真能提供救贖而定
      D: 必須看教主是否能自圓其說而定
    explanation: （第13段提到越狂熱的教徒，越是投入；心存質疑者，離開機率越大。）
    explanation_note: 說明框同樣寫「第13段」，本課只有 11 段。照原稿記錄
  - index: 4
    answer: D
    stem: 根據作者的說法，如果有一位「教主」的預言和承諾，到後來都沒有實現，下列哪一類的信眾，最有可能繼續跟隨著教主？
    options:
      A: 和教主與團體保持距離、投入較少的信眾
      B: 教育程度低、年紀最大、比較迷信的信眾
      C: 平常就抱著「聽其言、觀其行」態度的信眾
      D: 為教主捐最多錢，甚至和親友斷絶關係的信眾
    explanation: （投入最多，除了這個宗教無處可去的人。）
  - index: 5
    answer: B
    stem: 下列哪一選項最符合本文想傳達的觀點？
    options:
      A: 人們在作決策時，總是根據證據作出客觀的判斷
      B: 人們可能因信念和過去投入，忽略與信念不同的證據
      C: 人們愈崇拜教主，愈投入信仰，愈可能得到期待的結果
      D: 人們只要受過教育，就不會受到錯誤訊息的影響
    explanation: （就算證據擺在眼前，教徒們仍視情況而定選擇是否繼續相信。）
    explanation_note: 原稿是一個浮動說明框，壓在選項 C 與 D 之間
  notes:
    answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
