  總表_對照: '總表 9 個語詞與學習單第一個語詞框（9 個）完全一致。

    但學習單同一頁印了**兩個內容不同的語詞框**：右上角那個 9 個（同總表），

    左下角那個 10 個（多一個「救贖」）。第三大題有 10 題、第四大題代號表 10 個、

    第七大題灰框 10 個，三處都含「救贖」—— 所以實際教的是 10 個，總表與右上框各少收「救贖」。'
strategy_explained: '我們要練習的是「看穿假訊息」的本事

  這篇文章用虛構和真實的例子，說明了即使教主說的不準，信徒有時反而更相信，還有詐騙犯怎麼讓你一步步上當，跟我們辨識詐騙訊息的技巧很有關係

  讀的時候，你可以想想看，故事裡的信徒為什麼會這樣想，跟現實生活中你聽過的詐騙手法有什麼不一樣，還有有沒有什麼地方你覺得「不太對勁」'
