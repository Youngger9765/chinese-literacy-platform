intro: 這篇文章探討了人們在面對領袖或團體中的承諾與現實出現落差時，可能產生的反應。文章以一個虛構的教主和信眾的故事開頭，引導讀者思考信眾在教主言行不一、預言落空後，態度會如何轉變。接著，文章介紹了一個真實的心理學研究案例，關於一個宗教團體末日預言失準後，信徒們的反應。透過這些例子，文章說明了人們在付出努力後，有時會因為不願承認過去的錯誤而更加堅定，或是因為習慣質疑而選擇離開。最後，文章連結到詐騙的心理機制，並提醒讀者在判斷一個人是否值得相信時，應重視證據、檢視言行是否一致，並保有修正想法的勇氣。
