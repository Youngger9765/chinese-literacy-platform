  passage: 教主終於決定回她的房間去接收外星人的啟示。出來後，她告訴信眾：「你們的虔誠，外星人接收到了，外星人很感動，決定寬恕世人的罪孽，不再毀滅地球了，你們拯救了世界。」信眾們對這套聽起來難以自圓其說的說辭，展現了相當不同的反應。回到正題：「預言失靈後，信眾對教主的態度會有什麼改變？」正確答案是──「視情況而定」。曾經為教主傾家蕩產、衝鋒陷陣，甚至與親友斷絕關係的人，可能不願面對過去的付出白費，反而替教主尋找理由，變得更加崇拜、擁戴；但原來習慣於心存質疑，始終對人「聽其言、觀其行」者，就恐怕要跟教主說再見了。
  start_text: 教主終於決定回她的房間去接收外星人的啟示。出來後
