  paragraph_count: 11
  paragraphs:
  - idx: 1
    text: '有一位很有領袖魅力的教主，他有一群擁護他、崇拜他、對他的言行毫不質疑的信眾。這位教主經常發表「智慧的言論」，在社會上引發許多爭議與批評。見到教主受到攻擊，許多信眾前仆後繼的集結，只要有膽敢批評教主者，信眾便會在網路群起攻擊、展臂廝殺。日子一天天過去，教主引發的爭議愈來愈多，他的承諾都沒有實現，他的預言一再落空；指出的方向，甚至和現實發展南轅北轍。你猜，接下來的日子，信眾們對教主的態度會有什麼改變？（單選）

      （　　）1.不會改變。

      （　　）2.對教主失望，離開教主而去。

      （　　）3. 反而對教主益發忠誠。

      （　　）4.視情況而定。

      在公布答案之前，我們先來看看底下這個經典的心理學研究。'
  - idx: 2
    text: 1953年，美國 芝加哥出現一個宗教團體，教主是一位自稱通靈的家庭主婦，她聲稱收到來自外星人的神祕預言：1954年12月21日是世界末日，當天會有大洪水淹沒全世界，只有信徒會被外星人用飛碟救走。這個末日預言引發了許多人的恐懼，許多人為了得到救贖而加入這個宗教，有些人以具體的行動表達他們對這個預言的認同──他們辭去工作、和不信教的朋友斷絕關係、甚至傾家蕩產，放棄原有的生活，只為了追隨他們心中的「真理」。
  - idx: 3
    text: 三位美國的社會心理學家認為，這是個做研究的大好機會，便用假身分加入了這個團體，他們在末日前、末日當天和末日之後祕密蒐集資料，並記錄信眾的反應。
    footnote: 三位社會心理學家是Festinger、Riecken和Schachter。
    footnote_note: 原稿的頁尾註腳 1，掛在本段「社會心理學家」之後
  - idx: 4
    text: 12月21日晚上信徒都聚在一起，等著世界毀滅、等著外星人來拯救他們。他們等了又等，過了午夜12點，外星人沒有來，也沒有洪水。他們想，會不會是鐘壞了？會不會是外星人使用的時間和我們不同，有了時差？但一直等到早上，什麼都沒有發生，此時，現場一片安靜，沒有人說話。
  - idx: 5
    text: 教主終於決定回她的房間去接收外星人的啟示。出來後，她告訴信眾：「你們的虔誠，外星人接收到了，外星人很感動，決定寬恕世人的罪孽，不再毀滅地球了，你們拯救了世界。」
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 6
    text: 信眾們對這套聽起來難以自圓其說的說辭，展現了相當不同的反應。
  - idx: 7
    text: 回到正題：「預言失靈後，信眾對教主的態度會有什麼改變？」
  - idx: 8
    text: 正確答案是──「視情況而定」。
  - idx: 9
    text: 曾經為教主傾家蕩產、衝鋒陷陣，甚至與親友斷絕關係的人，可能不願面對過去的付出白費，反而替教主尋找理由，變得更加崇拜、擁戴；但原來習慣於心存質疑，始終對人「聽其言、觀其行」者，就恐怕要跟教主說再見了。
  - idx: 10
    text: 詐騙也常利用類似的心理。對方可能先讓人投入一小筆錢，再以「帳戶需要解鎖」「只差最後一筆費用」等理由，要求投入更多。受騙者有時會想：「我已經付了這麼多，現在停下來，不就全部白費了嗎？」於是反而越陷越深。
  - idx: 11
    text: 這項研究提醒我們：判斷一個人是否值得相信，不能只聽他說得多麼動人，也不能因為自己已經付出很多，就不願重新思考。當承諾一再落空，說法和現實南轅北轍時，更要停下來看看證據，檢查對方的言行是否一致。真正獨立的判斷，不是永遠相信自己沒有看錯，而是在新的證據出現時，仍有勇氣修正原來的想法。
  sidebars:
  - label: （一）
    text: （一）原來就不太投入、較少參與團體的人，比較難以維持原來的信念，有些人乾脆離開了這個宗教。
    after_paragraph: 6
  - label: （二）
    text: （二）為教主付出最多、甚至因此和朋友斷絶關係、傾家蕩產的人，反而更為投入，開始以令人匪夷所思的方式公開「示愛」，展現他們對信仰的狂熱、對教主的熱情與忠誠。教主的預言完全落空，這麼清楚明確的證據擺在眼前，這些信眾卻仍然對教主堅信不移。
    after_paragraph: 6
