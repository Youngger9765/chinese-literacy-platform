comprehension:
  questions:
  - index: 2
    answer: D
    stem: 根據課文第九段，「聽其言、觀其行」的信眾，最容易做出何種舉動？
    options:
      B: 用一個人的外貌，決定他是否可以信任
      C: 如果對方可以說服我，我就決定信任他
      D: 觀察其言行是否一致，再決定是否信任
    rationale: 第13段聽其言而觀其行者，除了聽對方的言論、也要觀察他的行為是否言行一致，才能判斷是否值得信任。
  - index: 3
    answer: B
    stem: 根據你對課文的理解，教主預言失敗後，信眾反應不同，最主要和哪一項因素有關？
    options:
      B: 必須看信眾投入此信仰的程度而定
      C: 必須看教主是否真能提供救贖而定
      D: 必須看教主是否能自圓其說而定
    rationale: 第13段提到越狂熱的教徒，越是投入；心存質疑者，離開機率越大。
  - index: 4
    answer: D
    stem: 根據作者的說法，如果有一位「教主」的預言和承諾，到後來都沒有實現，下列哪一類的信眾，最有可能繼續跟隨著教主？
    options:
      B: 教育程度低、年紀最大、比較迷信的信眾
      C: 平常就抱著「聽其言、觀其行」態度的信眾
      D: 為教主捐最多錢，甚至和親友斷絶關係的信眾
    rationale: 投入最多，除了這個宗教無處可去的人。
  - index: 5
    answer: B
    stem: 下列哪一選項最符合本文想傳達的觀點？
    options:
      A: 人們在作決策時，總是根據證據作出客觀的判斷
      B: 人們可能因信念和過去投入，忽略與信念不同的證據
      C: 人們愈崇拜教主，愈投入信仰，愈可能得到期待的結果
    rationale: 就算證據擺在眼前，教徒們仍視情況而定選擇是否繼續相信。
