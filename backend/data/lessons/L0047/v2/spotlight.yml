spotlight:
  lesson: G5-L8
  strategy_name: 詞彙推測策略-從上下文推測詞義
  strategy_type: inference
  blocks:
  - type: single
    prompt: 請選擇
    options:
    - "閱讀時遇到不懂的詞，該怎麼辦？前兩課，我們學過用「拆詞釋義」推測詞義。這一課，我們要學另一種方法──「從上下文推測詞義」。有些難詞的意思，就藏在前後的文字裡。仔細讀一讀難詞的上下文，找出相關線索，就有機會推測出它的意思。現在，讓我們一起學習這個策略的步驟吧！\n\
      ❶圈難詞：把不懂的語詞圈起來。\n❷讀上下文，找線索：讀一讀難詞前後的文字，把能幫助理解詞義的線索畫線。\n❸推測詞義：根據找到的線索，推測難詞的意思。\n\
      ❹放回句子檢查：把推測的意思放回原句，讀一讀，看看是否合理。\n　　例如：第八段──在工地有人吵起架來，調停的常常是她們。\n❶圈難詞：把「調停」圈起來。\n\
      ❷讀上下文，找線索：把「有人吵起架來」畫線。\n❸推測詞義：\n前面說「有人吵起架來」，表示出現了爭執，需要有人出面勸架。因此可以推測： \n「調停」的意思是：\
      \  出面勸架、調解爭執  。\n❹放回句子檢查：把推測的意思放回原句\n在工地有人吵起架來，出面勸架、調解爭執 的常常是她們。\n①合理"
    - '不合理

      你發現了嗎？難詞前後的文字，常藏著詞義線索。現在，來試試看吧。'
    answer: "閱讀時遇到不懂的詞，該怎麼辦？前兩課，我們學過用「拆詞釋義」推測詞義。這一課，我們要學另一種方法──「從上下文推測詞義」。有些難詞的意思，就藏在前後的文字裡。仔細讀一讀難詞的上下文，找出相關線索，就有機會推測出它的意思。現在，讓我們一起學習這個策略的步驟吧！\n\
      ❶圈難詞：把不懂的語詞圈起來。\n❷讀上下文，找線索：讀一讀難詞前後的文字，把能幫助理解詞義的線索畫線。\n❸推測詞義：根據找到的線索，推測難詞的意思。\n\
      ❹放回句子檢查：把推測的意思放回原句，讀一讀，看看是否合理。\n　　例如：第八段──在工地有人吵起架來，調停的常常是她們。\n❶圈難詞：把「調停」圈起來。\n\
      ❷讀上下文，找線索：把「有人吵起架來」畫線。\n❸推測詞義：\n前面說「有人吵起架來」，表示出現了爭執，需要有人出面勸架。因此可以推測： \n「調停」的意思是：\
      \  出面勸架、調解爭執  。\n❹放回句子檢查：把推測的意思放回原句\n在工地有人吵起架來，出面勸架、調解爭執 的常常是她們。\n①合理"
  - type: guide
    text: ◎小試身手：
  - type: free_text
    prompt: 1.第七段──往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。
  - type: free_text
    prompt: ❶圈難詞：把「拜請」圈起來。
  - type: free_text
    prompt: ❷讀上下文，找線索：把「叫不到的人」、「靠這些嫂子的關係」、「而來」畫線。
  - type: free_text
    prompt: ❸推測詞義：「叫不到的人」表示自己無法把人請來，要靠大嫂的關係，才能把人請來。
  - type: single
    prompt: 因此可以推測，「拜請」的意思是：（單選）
    options:
    - 【①邀請
    - 祭拜　】
    answer: 【①邀請
  - type: free_text
    prompt: ❹放回句子檢查：把推測的意思放回原句。
  - type: guide
    text: 往往我們叫不到的人，都要靠這些嫂子的關係　邀請  　而來。
  - type: single
    prompt: 請選擇
    options:
    - 合理
    - 不合理
    answer: 合理
  - type: free_text
    prompt: 2.第八段──工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在指點迷津。
  - type: free_text
    prompt: ❶圈難詞：把「指點迷津」圈起來。
  - type: free_text
    prompt: ❷讀上下文，找線索：請把能幫助你推測「指點迷津」意思的文字畫線。
  - type: free_text
    prompt: ❸推測詞義：根據你畫出的線索，推測「指點迷津」的意思是：
  - type: passage
    source: unknown
    paragraphs:
    - 【□①批評別人的做法　　　②提供方向和建議　】
  - type: free_text
    prompt: ❹放回句子檢查
  - type: passage
    source: unknown
    paragraphs:
    - 工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在   提供方向和建議 　     　 。
  - type: single
    prompt: 請選擇
    options:
    - 合理
    - 不合理
    answer: 合理
  - type: free_text
    prompt: 3.換你試試看：
  - type: guide
    text: 新聞報導一架小型飛機失事，機身嚴重受損，多名乘客緊急送醫。
  - type: free_text
    prompt: ❶圈難詞：把「失事」圈起來。
  - type: free_text
    prompt: ❷讀上下文，找線索：把能幫助你推測「失事」意思的文字畫線。
  - type: free_text
    prompt: ❸推測詞義：根據你畫出的線索，推測「失事」的意思。
  - type: guide
    text: 「失事」的意思是：    發生事故　    。
  - type: free_text
    prompt: ❹放回句子檢查：
  - type: passage
    source: unknown
    paragraphs:
    - →新聞報導一架小型飛機                     ，機身嚴重受損，多名乘客緊急送醫。
  - type: single
    prompt: 請選擇
    options:
    - 合理
    - 不合理
    answer: 合理
  - type: guide
    text: ＊你學會了嗎？遇到難詞，先讀一讀上下文、找找線索，也許就能推測出詞義。
  - type: passage
    source: unknown
    paragraphs:
    - ＊小提醒：前後文有足夠線索時，才適合使用這個策略；如果線索不足，就改用拆詞釋義或查字典。
  - type: guide
    text: 如果你做得到，請在□內打勾。
  - type: free_text
    prompt: (1)   溫柔婉約       ：溫和柔順，柔美含蓄。
  - type: free_text
    prompt: (2)    心知肚明     ：不用明說，心裡也非常清楚。
  - type: free_text
    prompt: (3)    粗野陽剛     ：粗獷豪放，顯得剛強有力。
  - type: free_text
    prompt: (4)    穿梭     ：快速的來回移動。
  - type: free_text
    prompt: (5)    調度        ：安排、調配人力或工作。
  - type: free_text
    prompt: (6)    調停折衝     ：調解爭端、協調各方。
  - type: free_text
    prompt: (7)   銜接無虞     ：前後接續順利，沒有問題。
  - type: free_text
    prompt: (8)    使臂使指    ：比喻指揮、調度得靈活自如。
  - type: free_text
    prompt: (9)    度量     ：能寬容、體諒別人的氣度。
  - type: free_text
    prompt: (10)    長袖善舞    ：比喻善於交際、協調，辦事靈活。
  - type: free_text
    prompt: (11)    當面戳破    ：當著對方的面揭穿謊言或指出問題。
  - type: free_text
    prompt: (1)她說話總是(  B  )，輕聲細語，讓人感到如沐春風。
  - type: free_text
    prompt: (2)雙方爭執不下，里長出面(  G  )，終於化解衝突。
  - type: free_text
    prompt: (3)她每天(  H  )於各科教室之間，忙碌得像個小蜜蜂。
  - type: free_text
    prompt: (4)他(  I  )了對方的藉口，場面一度尷尬。
  - type: free_text
    prompt: (5)區間車準時到站，接著轉乘高鐵，兩段行程(  D  )，時間充裕。
  - type: free_text
    prompt: (6)領導者應有(  E  )，接納不同的看法，才能服眾。
  - type: free_text
    prompt: (7)他(  C  )，交際手腕高明，一下子就能和各方談成合作。
  - type: free_text
    prompt: (8)他喜歡把大家(  J  )的事直接說出來，常常弄得現場很尷尬。
  - type: table
    rows:
    - - ''
      - 工地大嫂
    - - 定義
      - 作者稱六十歲以下，和丈夫一起來工地工作的女性叫大嫂。
    - - 來工地的原因
      - '1.工地環境【】，女性多半與父親、丈夫或兄弟同行，以確保安全。

        2.大嫂往往早婚，年紀較【】，學歷相對【】。

        3.跟著丈夫進工地，不僅可多出一分勞力，也能

        　【】丈夫、照應工作。'
    - - 大嫂的類型
      - '1.互補型：丈夫技術好，但是好強高傲。

        大嫂們【】，擅長【】調度，使工程銜接無虞。

        2.管束型：丈夫技術不錯，但個性較【】。大嫂們會默默收管丈夫，使其工作穩定順暢。

        3.人脈型：大嫂極有【】、人脈廣闊，可隨時調度各方人手協助趕工。'
    - - 大嫂在工地的功用
      - '1.【】工人爭執。

        2.提供偏方與【】給身體不適的工人。

        3.協助【】工地死亡的貓狗。

        4.工程順利時，帶工人同樂慶祝。

        5.工程不順利時，下一步該怎麼做，大嫂會【】。'
    - - 總結
      - 工地大嫂是臺灣社會中堅強、溫柔又美麗的女性縮影，值得眾人【】。
    answers:
    - 粗野陽剛
    - 輕
    - 不高/低
    - 約束
    - 長袖善舞
    - 接案
    - 不穩定
    - 度量
    - 調停
    - 藥物
    - 埋葬
    - 指點迷津
    - 尊敬
  - type: self_check
    items:
    - 我能讀上下文、找出線索，推測難詞的意思。
    - 我會把推測的意思放回句子，檢查是否合理。
    - 下次遇到難詞，我會先看看上下文有沒有足夠線索，再試著推測詞義。
