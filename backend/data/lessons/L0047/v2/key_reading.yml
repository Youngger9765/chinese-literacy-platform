passage: 也有的大嫂極有度量，帶著娘家、夫家侄兒親戚等一同工作，徒子徒孫遍布整個行業，整個家族全靠她用一支電話聯繫，指揮調度使臂使指，喊水會結凍，喊米變肉粽。真正趕起工來，她們的人脈比我們營造廠還多、還廣。往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。
