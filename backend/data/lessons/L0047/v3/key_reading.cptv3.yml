  passage: 也有的大嫂極有度量，帶著娘家、夫家侄兒親戚等一同工作，徒子徒孫遍布整個行業，整個家族全靠她用一支電話聯繫，指揮調度使臂使指，喊水會結凍，喊米變肉粽。真正趕起工來，她們的人脈比我們營造廠還多、還廣。往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。在工地有人吵起架來，調停的常常是她們；在工地看見有人病痛時，分藥、提供偏方的是她們；工地有貓狗死亡，埋葬的還是她們，工程順利時，帶著下包師傅一同唱歌的也是她們。甚至工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在指點迷津。許多男人誇口技術好，卻連支票也不會開；有些男人炫耀力氣，卻無法說服業主1放款2。這種不為人知的細節，女人不當面戳破。即使她們心知肚明，也不願讓自己的丈夫出糗。我常常看著她們在工地的身影，那無可取代、又無比堅毅地在惡劣環境中工作，穿梭其間，調停折衝。這些女性完全就是台灣社會女性最為堅強、最為溫柔，又最為美麗的縮影。
  start_text: 也有的大嫂極有度量，帶著娘家、夫家侄兒親戚等一同
