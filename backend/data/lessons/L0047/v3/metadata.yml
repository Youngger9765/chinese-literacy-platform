  總表_對照: '總表 11 個語詞與學習單只差一處：總表寫「度量**胸襟**」，學習單三處都寫「度量」

    （本課語詞框、第四大題第 9 題、第五大題代號 E、第八大題找字框）。

    課文原文也是「也有的大嫂極有度量」，沒有「胸襟」二字。

    ⚠️ 找字格子裡確實有「胸」(第5列第3格) 與「襟」(第6列第2格)，但兩格不相鄰、

    也拼不出「度量胸襟」——它們是誘答字，不是答案。故判定總表這一格多寫了「胸襟」，

    照原樣兩邊分別記錄，不合併。'
strategy_explained: '這篇文章讓我們學習怎麼從周圍的句子猜出不太認識的詞是什麼意思

  因為裡面講到工地裡很多特別的詞，像是「調度」「人脈」，如果我們能猜出來，就能更懂這些工地大嫂們怎麼這麼厲害

  讀的時候，看到不懂的詞，就停下來想一想，它前面或後面講了什麼，就能幫助你猜到意思'
