spotlight:
  lesson: G7-L21
  strategy_name: 用表格整理訊息-從數據資料歸納趨勢
  strategy_type: info_organization
  blocks:
  - type: guide
    text: '這篇文章有許多年份、數字和比例。先把同一項資料依時間順序整理，再比較前後數值的變化，就能看出數據的趨勢。「趨勢」是什麼？

      詞語解釋趨勢：一件事在一段時間內，往哪個方向變化的情形。

      例子：這學期參加羽球社的人數，期初36人，期中22人，期末只剩13個人。這趨勢看來可真不妙。

      注意喔，看趨勢一定要注意兩個問題：「哪一段時間？（這學期）」和「事情有什麼變化？（變多、變少、持平）」

      這課的聚光燈要介紹「用表格的數據歸納出趨勢」的方法，建議的步驟是：❶抓主題  ❷排時間  ❸比數值  ❹說趨勢 來試試看吧！'
  - type: guide
    text: 一、以本課為例：請你完成底下4個步驟，每完成一項，就在□裡打勾。
  - type: guide
    text: □❶抓主題：一般而言，主題可以從標題中看出。這篇課文探討的主題是：
  - type: guide
    text: →主題【  歷屆奧運中女性選手參賽比率的變化                        】
  - type: single
    prompt: 請選擇
    options:
    - ❷排時間：請你翻找課文，照時間順序把表格內的【
    - 】填上去。
    answer: ❷排時間：請你翻找課文，照時間順序把表格內的【
  - type: table
    rows:
    - - 年／舉辦奧運城市
      - 女性參賽的重要變化
      - 女性參賽比率
    - - 古希臘
      - 女性完全被【】
      - 【】％
    - - 【】年巴黎
      - 首度開放女性參賽
      - 【】％
    - - 1948年倫敦
      - 女性參賽率不到【】成
      - ＜【】％
    - - 2004年雅典
      - 女性參賽比率突破【】成
      - 【】％
    - - 【】年巴黎
      - 男、女參賽比＝【】
      - 【】％
    answers:
    - 排除
    - ０
    - '1900'
    - ２.2
    - 一
    - '10'
    - 四
    - '40.7'
    - '2024'
    - 1：1
    - '50'
  - type: single
    prompt: □❸比數值：表格填好後請判斷：最右欄的數值是上升、下降，還是不變？
    options:
    - 下降
    - 不變
    - ❹說趨勢：請用一句話說明你從❸的數值看到什麼趨勢？請寫完整句。
    answer: 下降
  - type: guide
    text: 答：【  歷屆奧運中女性選手參賽比率有愈來愈高的趨勢                 】
  - type: guide
    text: 二、小試身手
  - type: guide
    text: 下圖是奧運歷年來女性選手參與比率的統計圖，由１個長條圖及1個圓形圖組成。長條圖代表女性選手參與奧運會的比率，圓形圖則是2024巴黎奧運選手的性別比。
  - type: guide
    text: '資料來源：olympics.com    #GenderEqualOlympics: Celebrating full gender parity
      on the of field play at Paris 2024'
  - type: free_text
    prompt: ❶抓主題：一般而言，主題可以從標題中看出。這篇課文探討的主題是：
  - type: guide
    text: →主題【  歷屆奧運會女性選手參賽比率的變化                        】
  - type: free_text
    prompt: ❷排時間：請問整個統計圖跨了多少年？答：【  124     】年。
  - type: free_text
    prompt: ❸比數值：
  - type: single
    prompt: (1)請判斷：百餘年來，奧運女性運動員的參賽比率有什麼變化？
    options:
    - 比率下降
    - 比率不變
    answer: 比率下降
  - type: single
    prompt: (2)圓形圖裡男女參賽的比例如何？
    options:
    - 男性較多
    - 女性較多  ③男女一樣多
    answer: 男性較多
  - type: single
    prompt: (3)這一百多年被區分(I)、(II)、(III)三個階段，哪個階段女性運動員參與率增加的速度較快？（提示：哪個階段的藍色階梯最陡？）
    options:
    - 階段(I)
    - 階段(II)   ③)階段(III)
    answer: 階段(I)
  - type: single
    prompt: (4)根據(3)這題，從1900年到2024年，女性運動員參與率增加的速度如何？
    options:
    - 越來越快
    - 越來越慢
    answer: 越來越快
  - type: free_text
    prompt: ❹說趨勢：請用一句話說明，經過❸的比數值程序，你看到什麼趨勢？請寫完整句。
  - type: free_text
    prompt: (1)從長條圖可看出：
  - type: guide
    text: 【          歷屆奧運中女性選手參賽比率有愈來愈高的趨勢           】
  - type: free_text
    prompt: (2)從圓形圖可看出：
  - type: guide
    text: 【到了2024年巴黎奧運，        男女選手的比例達到１：１      】
  - type: free_text
    prompt: (3)從階段(I)、階段(II)、階段(III)可看出：
  - type: guide
    text: 【這三個階段，        女性選手參賽比率增加的速度愈來愈快        】
  - type: guide
    text: ※我們來練習整理出本課第七~九段的重要訊息：
  - type: fill_table
  - type: self_check
    items:
    - 我學會要先抓住文章的主題，才能進行圖表解讀。
    - 我知道從統計圖表裡看出趨勢，要注意「哪段時間？」和「事情有什麼變化？」
    - 我學會看數值在一段時間內的變化，並說出文章主題的趨勢。
