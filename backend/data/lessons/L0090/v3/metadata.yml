_總表_對照note: "本課語詞在四個地方各列一份，**四份都不一樣**，全部照各自印的記錄，未互相覆蓋：\n  ・總表 13 個：無「趨勢」，有「開端」「約莫」「多多益善」\n  ・第三大題語詞框 12 個：有「趨勢」「約莫」，無「開端」「多多益善」\n  ・第八大題找字灰框 12 個：有「趨勢」「開端」，無「約莫」「多多益善」\n  ・第八大題格子實際圈了 13 個 = 灰框 12 ＋「多多益善」\n\
  四份的聯集是 14 個詞。其中「多多益善」被圈了卻沒列進灰框（見檔頭）；\n「約莫」則只在語詞框與第三大題出現，格子裡根本沒有這兩個字。\n・策略欄：總表寫「從數據**資料**歸納趨勢」，學習單印「從數據歸納趨勢」（少「資料」二字），\n  meta.strategy 採學習單印的形式。\n・第六大題標題欄：本課聚光燈是**第五**大題（欄名是全庫通例稱呼）。"
