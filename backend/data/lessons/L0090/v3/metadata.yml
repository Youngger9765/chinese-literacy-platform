  總表_對照: "本課語詞在四個地方各列一份，**四份都不一樣**，全部照各自印的記錄，未互相覆蓋：\n  ・總表 13 個：無「趨勢」，有「開端」「約莫」「多多益善」\n\
    \  ・第三大題語詞框 12 個：有「趨勢」「約莫」，無「開端」「多多益善」\n  ・第八大題找字灰框 12 個：有「趨勢」「開端」，無「約莫」「多多益善」\n\
    \  ・第八大題格子實際圈了 13 個 = 灰框 12 ＋「多多益善」\n四份的聯集是 14 個詞。其中「多多益善」被圈了卻沒列進灰框（見檔頭）；\n「約莫」則只在語詞框與第三大題出現，格子裡根本沒有這兩個字。\n\
    ・策略欄：總表寫「從數據**資料**歸納趨勢」，學習單印「從數據歸納趨勢」（少「資料」二字），\n  meta.strategy 採學習單印的形式。\n・第六大題標題欄：本課聚光燈是**第五**大題（欄名是全庫通例稱呼）。"
strategy_explained: '這一課要練的是，從奧運裡看性別平等這件事，怎麼把這些訊息整理成容易懂的表格，並且從數字裡看出男女運動員的變化和趨勢

  這篇故事講了以前女生不能參加奧運，到現在女生越來越能參加各種比賽，正好可以讓我們練習用表格把這些歷程和數字記錄下來，看看性別平等是怎麼一步步做到的

  讀的時候，你可以試著把文章裡提到的時間、女性參賽人數、或是新增的運動項目，像做紀錄一樣填進表格裡，這樣就能清楚看到奧運在性別平等這條路上，到底走了多遠'
