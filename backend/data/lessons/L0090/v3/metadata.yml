intro: 這篇文章帶我們回顧奧林匹克運動會發展過程中，性別平等所經歷的漫長歷程。從早期女性被排除在外，到現代奧運逐漸增加女性參賽機會與項目，文章描繪了女性運動員如何一步步爭取權益，並探討了在追求人數平等之外，運動場域中性別文化仍需努力的方向。透過奧運會的演變，我們可以看到社會對於性別平等的觀念如何改變，以及未來仍有進步空間。
