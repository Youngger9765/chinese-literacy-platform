  items:
  - index: 1
    word: 趨勢
    definition: 一件事在一段時間內，往哪個方向變化的情形。
  - index: 2
    word: 印記
    definition: 在本課文中，指的是在心靈或歷史上留下的痕跡。
  - index: 3
    word: 籌備
    definition: 指為了活動進行準備。
  - index: 4
    word: 里程碑
    definition: 比喻在歷史發展過程中的重大事件或標誌性成就。
  - index: 5
    word: 眾所矚目
    definition: 形容受到大家特別的關注和重視。
  - index: 6
    word: 大顯身手
    definition: 充分展現出自己的才能和技藝。
  - index: 7
    word: 侷限
    definition: 指受到限制或約束，不能充分發展。
  - index: 8
    word: 彰顯
    definition: 指明顯的表現出來。
  - index: 9
    word: 荊棘
    definition: 多刺的灌木，比喻前進道路上的困難和障礙。
  - index: 10
    word: 抹滅
    definition: 指徹底消除，使它不存在。
  - index: 11
    word: 開路先鋒
    definition: 比喻率先開創道路的人。
  - index: 12
    word: 約莫
    definition: 大約、大概。
