  passage: 2024年巴黎奧運，分別有5,250名男性和5,250名女性參與，男女參賽比例達到1：1。巧合的是，1900年巴黎奧運扮演了女性參賽的開路先鋒；124年後，同樣在巴黎舉辦的奧運又創下性別平衡的全新里程碑。巴黎這個城市，將在奧林匹克運動史上留下不可抹滅的印記。除了男女運動員人數相等之外，2024年巴黎奧運還有許多措施朝著性別平等的目標邁進。例如，奧運選手村首度為哺乳期運動員提供哺乳室，讓「母親」也可以同時是「頂尖運動員」。此外，奧運媒體村的街道都以傑出女性命名，以提高女性在公共空間能見度，彰顯女性在社會中的重要性。女性賽事評論員的比例也大幅提高，在92位賽事評論員中，有35位是女性，此人數相較2020年東京奧運成長了80％。這些措施讓運動相關產業不再侷限於男性，女性也能有一展長才的機會。奧運被視為世界最高的運動殿堂，超過百年的發展，見證了人們在性別平等上的變遷與進步。除了追求性別的「人數平等」，改善運動中的性別文化也很重要，例如，女性運動員的外表和身材常常比實力更受關注，使她們的努力與成就被忽略；女子運動的地位也仍有待提升，最受看重的大型職業運動仍以男性運動員為主。這些現象顯示，性別平等這條路仍充滿荊棘；而每四年一次、眾所矚目的奧運盛會，正是實現與檢視全球性別平等的最大舞臺。
