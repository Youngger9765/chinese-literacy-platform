    - 年／舉辦奧運城市: 【　】年巴黎
      年／舉辦奧運城市_blanks:
      - answer: '2024'
      女性參賽的重要變化: 男、女參賽比＝【　】
      女性參賽的重要變化_blanks:
      - answer: 1：1
