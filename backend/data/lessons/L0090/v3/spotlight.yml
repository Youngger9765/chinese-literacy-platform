    answer: '124'
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: sub_block
    label: ❸比數值：
    items:
    - stem: (1)請判斷：百餘年來，奧運女性運動員的參賽比率有什麼變化？
      options:
        1: 比率上升
        2: 比率下降
        3: 比率不變
      answer: 1
    - stem: (2)圓形圖裡男女參賽的比例如何？
      options:
        1: 男性較多
        2: 女性較多
        3: 男女一樣多
      answer: 3
    - stem: (3)這一百多年被區分(I)、(II)、(III)三個階段，哪個階段女性運動員參與率增加的速度較快？（提示：哪個階段的藍色階梯最陡？）
      options:
        1: 階段(I)
        2: 階段(II)
        3: )階段(III)
      options_note: 第 3 個選項原稿印成「③)階段(III)」，序號後多一個右括號，照抄未改
      answer: 3
    - stem: (4)根據(3)這題，從1900年到2024年，女性運動員參與率增加的速度如何？
      options:
        1: 越來越快
        2: 越來越慢
      answer: 1
