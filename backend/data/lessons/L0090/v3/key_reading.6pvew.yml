  instruction: 請用計時器，從指定段落（六☞)開始朗讀，在表格記錄1分鐘朗讀的字數。如果計時3次後，你還不滿意，可以多練幾次。最後一次，找一位同學，請他計時、記錄並簽名！
  start_paragraph: 6
  char_count_note: '右緣「字數」欄從第 6 段（☞ 指定的起點）開始累計，末筆 322 落在第 8 段結束，

    第 9 段沒有標 —— 屬「字數欄只標到倒數第二段就停」的形狀，322 不是全文長度。

    三個段界值全中：第 6 段 113 == 印的 113；＋第 7 段 151 == 印的 151；＋第 8 段 322 == 印的 322。

    ⚠️ Word 口徑要再補一條：**含千分位逗號的整串數字也算 1 個字**。

    本段兩個「5,250」若照「只收斂連續數字」算會各多算 2 字，三個段界就會變成

    117 / 155 / 326，全部差 4 —— 把「5,250」當一個字才對得上。'
