  passage: 2024年巴黎奧運，分別有5,250名男性和5,250名女性參與，男女參賽比例達到1：1。巧合的是，1900年巴黎奧運扮演了女性參賽的開路先鋒；124年後，同樣在巴黎舉辦的奧運又創下性別平衡的全新里程碑。巴黎這個城市，將在奧林匹克運動史上留下不可抹滅的印記。除了男女運動員人數相等之外，2024年巴黎奧運還有許多措施朝著性別平等的目標邁進。例如，奧運選手村首度為哺乳期運動員提供哺乳室，讓「母親」也可以同時是「頂尖運動員」。此外，奧運媒體村的街道都以傑出女性命名，以提高女性在公共空間能見度，彰顯女性在社會中的重要性。女性賽事評論員的比例也大幅提高，在92位賽事評論員中，有35位是女性，此人數相較2020年東京奧運成長了80％。這些措施讓運動相關產業不再侷限於男性，女性也能有一展長才的機會。
