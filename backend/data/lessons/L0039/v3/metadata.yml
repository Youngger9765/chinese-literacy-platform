strategy: 自我管理──時間管理四步驟
課文學習單: 陳淑麗
lesson_no: 27
series: 一般
lesson_seq: 5270
intro: 這篇文章探討了臺灣學生棒球員的「棒球夢」。文章首先描述了許多學生從小就投入棒球訓練，希望能成為職業選手，但這條路充滿挑戰。文中點出，即使努力多年，能進入職棒的機會微乎其微，且職棒生涯短暫，退役後的轉業也面臨困難。許多球員因為長期犧牲學業，導致未來職涯選擇受限。然而，文章也介紹了現在有些學校和教練正努力尋找方法，希望幫助學生棒球員在追求夢想的同時，也能兼顧課業，為未來的人生預留更多可能性。
strategy_explained: '這一課我們來學學怎麼管理自己，尤其是在追逐夢想的時候，也要把時間安排好，才不會影響到別的事情

  這篇文章講到很多小球員為了夢想努力，但也可能犧牲課業，學會時間管理，就像文章說的，在訓練和讀書之間找到平衡，才能讓棒球夢和未來都閃閃發光

  所以讀的時候，可以想想看，自己什麼時候該練球、什麼時候該讀書，也想想看，怎麼樣把時間用得更有效率喔'
