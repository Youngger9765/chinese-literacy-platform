lesson_uid: L0039
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 依據本文，下列哪一個語詞最能形容「想當教練的退役球員很多，但教練職缺很少」的情況？
    options:
      A: 僧多粥少
      B: 汗流浹背
      C: 精湛出色
      D: 合作無間
    teacher_note: （在第三段中提到：「教練是許多退役球員的首選，但教練職缺僧多粥少。
    teacher_note_check: 原稿的解析引號沒有收尾、也沒有右括號，照抄不補
  - index: 2
    answer: D
    stem: 學生棒球運動員如果無法進入職棒，常見的職業選擇是什麼？
    options:
      A: 科技業
      B: 金融業
      C: 醫療業
      D: 服務業
    teacher_note: （在第四段提到：「職業軍人、低技術體力工、服務業成為最常見的生涯選項。」)
  - index: 3
    answer: B
    stem: 根據本文，臺灣學生棒球運動員主要面臨的困難是什麼？
    options:
      A: 訓練設施不夠完善
      B: 學業與棒球訓練難以兼顧
      C: 缺乏家長的支持
      D: 教練資源不足
    teacher_note: （在第二段中提到：「因為投入大量的時間接受訓練、比賽，學生球員經常難以兼顧學校課業。」)
  - index: 4
    answer: C
    stem: 學生球員努力多年後，為什麼仍可能面臨職涯困境？
    options:
      A: 比賽次數太少，球員缺少展現球技的機會
      B: 訓練設備不足，球員難以提升體能與技術
      C: 職棒機會少、職涯短，加上學業基礎弱，轉業不易
      D: 家長缺少支持，球員常在訓練途中離開球隊
  - index: 5
    answer: B
    stem: 課文最後希望學生的棒球夢「能有更多不同的未來」，這句話是什麼意思？
    options:
      A: 學生球員可以提早轉職，去體驗不同的職業活動
      B: 讓學生兼顧球技與學力，未來有更多職涯選擇
      C: 讓學生把全部時間投入棒球，提高進入職棒的機會
      D: 讓學生先放下棒球訓練，專心準備升學與就業
    teacher_note: （根據本文，學校和教練們的努力，希望學生棒球員能在學業和運動間取得平衡，為未來提供更多職涯選擇的機會。)
