  rows:
  - label: 學生棒球運動員的現狀
    value: '1.臺灣國小到高中大約有1萬5千名的學生棒球運動員，大多數在國小【　】加入棒球隊。

      2.為了當上職業棒球選手，學生付出大量時間進行訓練和比賽，甚至離家住校。'
    blanks:
    - answer: 四年級
  - label: 問題1：學業與訓練難以平衡
    value: 因為投入大量時間在【　】上，學生難以兼顧學業，影響學業成績。
    blanks:
    - answer: 訓練和比賽
  - label: 問題2：生涯選擇的困境
    value: '高中畢業時，學生面臨兩條路：

      1.繼續打球：只有少數優秀球員能進入職棒，且職棒生涯【　】，轉業困難。

      2.離開球場：球員因各種原因離開球場，因【　】不足，職業選擇受限。'
    blanks:
    - answer: 短
    - answer: 基礎學力
  - label: 解決方法：學校的策略與努力
    value: '許多學校以各種方式幫助學生在【　】間取得平衡。例如：

      1.改善球員的生活設施，並要求【　】達標才能參加比賽。

      2.提供【　】，確保學生基本學力。'
    blanks:
    - answer: 學業與訓練
    - answer: 學業成績
    - answer: 夜間課輔
  - label: 結論
    value: 愈多的學校開始幫助學生棒球員兼顧【　】與【　】，希望通過共同努力，讓學生的棒球夢有不同的未來。
    blanks:
    - answer: 球技
    - answer: 學力
