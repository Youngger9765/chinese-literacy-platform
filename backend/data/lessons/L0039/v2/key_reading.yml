passage: 許多學生球員仔細思考過夢想和事實之間可能的差距，他們也想兼顧學業和運動訓練，想讓自己未來有更寬廣的職涯選擇，但這不是學生自己就能辦到的。還好，現在全臺灣有許多愛棒球的校長及教練，運用各種方法幫助學生球員在教室和球場間取得平衡。例如，花蓮縣三民國中的林國源校長、張志強教練和老師們合作無間󠇡，改善了球員的學習、訓練及生活。他們增加了宿舍的淋浴間及洗衣機，減少等待洗澡、洗衣服的時間，讓球員在繁重嚴格的訓練中，還能擠出讀書的時間。學校還訂定了出賽辦法，要求學業成績達標才能出去比賽。再例如，新竹縣中山國小郭碧玄校長認為，為了確保孩子未來的人生能走得更寬廣，維持基本學力和發展運動技能同樣重要，他們加入中信基金會支持的「愛接棒計畫」，為棒球選手提供額外的夜間課輔，以確保學生的基本學力。
