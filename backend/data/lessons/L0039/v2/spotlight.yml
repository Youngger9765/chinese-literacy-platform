spotlight:
  lesson: G5-L27
  strategy_name: 自我管理-時間管理策略
  strategy_type: sel_character
  blocks:
  - type: guide
    text: "課文中，學生棒球員每天在學業與訓練之間掙扎。當時間不夠時，他們必須學會取捨與調整，才能兼顧球技與課業。其實，我們也常遇到這樣的情況：作業、考試、活動、補習都擠在同一天，時間根本不夠用！\n\
      \    這一課要帶你練習——當時間不夠時，如何抓重點、排優先順序。\n我們來試試一個好用的方法——時間管理四步驟：\n❶列出任務──列出要做的事，也看清還有多少時間。\n\
      ❷排出先後──先做最重要、最急的事。\n❸安排做法──決定什麼時候做，以及用什麼方法完成。\n❹檢查調整──邊做邊看進度，必要時再改順序或方法。\n掌握這四步，生活會更有節奏，也更有效率。"
  - type: guide
    text: 情境一：功課太多的夜晚
  - type: guide
    text: 子安今天晚上事情特別多！白天老師指定一堆作業，明天還有小考。
  - type: guide
    text: 偏偏今晚又有補習班的課程，到晚上9點才能回家。
  - type: guide
    text: 他看著書包裡的課本和作業，心想：「那麼晚開始，來得及嗎？」
  - type: guide
    text: 如果你是子安，可以依據以下步驟來安排這個晚上的時間哦。
  - type: guide
    text: 步驟❶：列出任務—列出今晚的任務（可複選）
  - type: guide
    text: ※想一想：
  - type: guide
    text: 現在已經晚上9點了，你大約還有【   】小時可以完成任務。
  - type: guide
    text: 步驟❷：排出先後—分清哪些事最重要、最急
  - type: guide
    text: 步驟❸：安排做法─排出完成任務的時間
  - type: guide
    text: 請只填寫你在上面勾選的任務，標上優先順序，再排出完成時間：
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ※提示：
  - type: guide
    text: 明天要考試的科目屬於「重要又緊急」；
  - type: guide
    text: 作業也要交，但可先集中火力在最急、影響較大的任務上。
  - type: guide
    text: 步驟❹：檢查調整─靈活調整
  - type: guide
    text: 計畫不一定能完全照著走，但可以保持彈性，學會靈活調整。
  - type: guide
    text: 請勾選你今晚可能會這樣做的選項：
  - type: guide
    text: 情境二：比賽與考試撞期的兩難
  - type: guide
    text: 你週末要代表團隊參加一場重要比賽，例如球賽或團體舞蹈比賽；學校下週一要段考。兩件事都很重要，但時間有限。你該怎麼安排？
  - type: guide
    text: 這個情境已經列出兩件重要任務，所以這次從步驟❷開始練習。
  - type: guide
    text: 步驟❷：排出先後
  - type: guide
    text: 當時間不夠時，還要想：不做會影響誰？哪一件事「短期影響」更大？（可依自己情況選）
  - type: guide
    text: 我們可以先分清楚：
  - type: guide
    text: 步驟❸：安排做法─把先後順序變成可行計畫
  - type: guide
    text: 比賽和段考都很重要，但時間不夠時，不必平均分配時間，而要改變完成的方法。請勾選你最想使用的做法。（沒有標準答案）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 步驟❹：檢查調整─計畫有變時，再調整做法
  - type: single
    prompt: 你原本已經安排好比賽和複習時間，沒想到比賽延後一小時，回到家時，比預定時間晚了。原來的複習計畫已經做不完了，你會怎麼調整？（單選）
    options:
    - 照原來的範圍全部讀完，晚一點睡沒有關係。
    - 先完成最重要、最不熟的內容，熟悉的部分快速檢查，並保留足夠睡眠。
    - 把剩下的內容全部留到星期一考試前再複習。
    answer: 先完成最重要、最不熟的內容，熟悉的部分快速檢查，並保留足夠睡眠。
  - type: guide
    text: ※你發現了嗎？
  - type: guide
    text: 好的時間安排，不是把所有事情硬塞進有限的時間，而是：
  - type: multi
    prompt: 請選擇
    options:
    - 先比較事情的影響，排出不同時段的先後順序。
    - 用提前準備、抓住重點和分段安排，讓兩件重要的事都能完成。
    - 計畫有變時，保留最重要的部分，重新調整；必要時主動尋求協助。
    answer:
    - 先比較事情的影響，排出不同時段的先後順序。
    - 用提前準備、抓住重點和分段安排，讓兩件重要的事都能完成。
    - 計畫有變時，保留最重要的部分，重新調整；必要時主動尋求協助。
  - type: guide
    text: 我學會了時間管理嗎？請在符合的項目打勾，看看自己學到了什麼？
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
