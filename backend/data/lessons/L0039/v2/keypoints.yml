      hint: ''
  - label: 問題1：學業與訓練難以平衡
    value: 因為投入大量時間在__上，學生難以兼顧學業，影響學業成績。
    blanks:
    - answer: 訓練和比賽
      hint: ''
  - label: 問題2：生涯選擇的困境
    value: '高中畢業時，學生面臨兩條路：

      1.繼續打球：只有少數優秀球員能進入職棒，且職棒生涯__，轉業困難。

      2.離開球場：球員因各種原因離開球場，因__不足，職業選擇受限。'
    blanks:
    - answer: 短
      hint: ''
    - answer: 基礎學力
      hint: ''
  - label: 解決方法：學校的策略與努力
    value: '許多學校以各種方式幫助學生在__間取得平衡。例如：

      1.改善球員的生活設施，並要求__達標才能參加比賽。

      2.提供__，確保學生基本學力。'
