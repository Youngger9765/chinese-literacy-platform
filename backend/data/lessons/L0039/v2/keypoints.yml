  - label: 學生棒球運動員的現狀
    value: '1.臺灣國小到高中大約有1萬5千名的學生棒球運動員，大多數在國小__加入棒球隊。

      2.為了當上職業棒球選手，學生付出大量時間進行訓練和比賽，甚至離家住校。'
