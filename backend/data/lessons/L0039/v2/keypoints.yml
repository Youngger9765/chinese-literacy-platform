    - answer: 學業與訓練
      hint: ''
    - answer: 學業成績
      hint: ''
    - answer: 夜間課輔
      hint: ''
  - label: 結論
    value: 愈多的學校開始幫助學生棒球員兼顧__與__，希望通過共同努力，讓學生的棒球夢有不同的未來。
    blanks:
