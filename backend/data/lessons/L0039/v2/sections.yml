  - index: 4
    answer: C
    stem: 學生球員努力多年後，為什麼仍可能面臨職涯困境？
    options:
      A: 比賽次數太少，球員缺少展現球技的機會
      B: 訓練設備不足，球員難以提升體能與技術
      C: 職棒機會少、職涯短，加上學業基礎弱，轉業不易
