      C: 讓學生把全部時間投入棒球，提高進入職棒的機會
      D: 讓學生先放下棒球訓練，專心準備升學與就業
    rationale: 根據本文，學校和教練們的努力，希望學生棒球員能在學業和運動間取得平衡，為未來提供更多職涯選擇的機會。
