    stem: 學生棒球運動員如果無法進入職棒，常見的職業選擇是什麼？
    options:
      A: 科技業
      C: 醫療業
      D: 服務業
    rationale: 在第四段提到：「職業軍人、低技術體力工、服務業成為最常見的生涯選項。」
  - index: 3
    answer: B
    stem: 根據本文，臺灣學生棒球運動員主要面臨的困難是什麼？
    options:
      B: 學業與棒球訓練難以兼顧
      C: 缺乏家長的支持
      D: 教練資源不足
