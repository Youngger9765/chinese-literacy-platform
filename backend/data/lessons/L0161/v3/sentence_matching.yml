lesson_uid: L0161
version_id: v3
section_no: 一
sentence_matching:
  label: 一、文白句子比對
  instruction: '請模仿例句作法：

    ❶ 閱讀原文；❷ 找出對應的參考句；❸ 在下方的[  ]寫上參考句代號'
  example:
    文言: 楚人江乙為郢大夫
    answer: 6
  reference_sentences:
    1: 路上不會有人撿走失物，家裡的門不用關，而盜賊自動就消失了
    2: 如今他令尹治理，耳朵和眼睛不清楚，盜賊公然橫行
    3: 但如果令尹沒有偷竊卻誣賴他，楚國是有法律的
    4: 上面的官員不賢明，那麼下面的人民就不能治理好
    5: 令尹在朝廷，盜賊在民間，令尹有什麼罪過呢
    6: 楚國人江乙擔任郢都的大夫
    7: 令尹是什麼特別的人，卻不因為這樣算他的錯嗎
    8: 百姓有罪過，原因都在我一人
    9: 所以才使盜賊得以偷走我的布，這跟指使人偷有什麼不同
    10: 有人進入王宮偷盜，令尹因此怪罪江乙，向楚王請求罷黜他
    11: 令尹確實偷布的話，我不會因為他富貴而不依法處置
    12: 有人偷了王宮的東西，我的孩子卻受連坐而被免職
    13: 令尹不是親自偷布的，是指使人偷的
    14: 請王上明察這件事
    15: 我在半夜丟失八匹布，是令尹偷了我的布
  items:
  - 文言: 有入王宮中盜者，令尹以罪乙，請於王而黜之
    answer: 10
  - 文言: 妾夜亡布八匹，令尹盜之
    answer: 15
  - 文言: 令尹信盜之，寡人不為其富貴而不行法焉
    answer: 11
  - 文言: 若不盜而誣之，楚國有常法
    answer: 3
  - 文言: 令尹不身盜之也，乃使人盜之
    answer: 13
  - 文言: 道不拾遺，門不閉關，而盜賊自息
    answer: 1
  - 文言: 今令尹之治也，耳目不明，盜賊公行
    answer: 2
  - 文言: 是故使盜得盜妾之布，是與使人盜何以異也
    answer: 9
  - 文言: 令尹在上，寇盜在下，令尹不知有何罪焉
    answer: 5
  - 文言: 有盜王宮中之物者，妾子坐而黜
    answer: 12
  - 文言: 令尹獨何人，而不以是為過也
    answer: 7
  - 文言: 百姓有過，在予一人
    answer: 8
  - 文言: 上不明則下不治
    answer: 4
  - 文言: 王其察之
    answer: 14
