lesson_uid: L0161
version_id: v3
section_no: 五
comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列選項「」文字中讀音與字義，何者錯誤？
    options:
      A: 若不盜而「誣」之──ㄨ，誣賴
      B: 請於王而「黜」之──ㄔㄨˋ，免職
      C: 「寇」盜在下──ㄎㄡˋ，土匪
      D: 百姓有過，在「予」一人──ㄩˊ，給。
    teacher_note: D字音正確，但字義是「我」。
  - index: 2
    answer: D
    stem: 下列哪一個成語的解釋錯誤？
    options:
      A: 顧此失彼──注意這個卻忽略了那個
      B: 若無其事──好像沒有那麼一回事
      C: 心不在焉──心思不在這裡
      D: 愛莫能助──最無私的愛就是能助人
    teacher_note: A指不能全面兼顧。B形容神態鎮定、自然。C形容不專心。D正確的解釋是「想幫忙卻沒有什麼能幫的」，意思是「無法幫忙」。
  - index: 3
    answer: B
    stem: 下列哪一選項中的「之」，代指的是江乙媽媽被偷的布？
    options:
      A: 令尹以罪乙，請於王而黜「之」
      B: 妾夜亡布八匹，令尹盜「之」
      C: 有盜王宮中「之」物者，妾子坐而黜
      D: 盜賊公行，是故使盜得盜妾「之」布。
    teacher_note: A代指江乙；C、D意思都是「的」。
  - index: 4
    answer: C
    tag: 歷
    stem: 根據本文，下列文句「」中的字義，何者說明最恰當？
    options:
      A: 妾夜「亡」布八匹：損壞
      B: 令尹「信」盜之：隨意
      C: 妾子「坐」而黜：受罰
      D: 王「其」察之：難道
    teacher_note: A「亡」，丟失；B「信」，確實；D「其」，表示期望的祈使語氣。
  - index: 5
    answer: D
    tag: 歷
    stem: 根據本文，下列關於令尹與楚王的敘述何者最恰當？
    options:
      A: 令尹打算偷盜布匹再將罪責嫁禍給他人
      B: 令尹主張楚國盜賊橫行是須正視的問題
      C: 楚王覺得宮中之物被盜應是令尹的責任
      D: 楚王認為不論身分地位都應該遵守法律
    teacher_note: 由「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法」可知。
  - index: 6
    answer: B
    tag: 歷
    stem: 根據本文，江母見楚王的目的最可能是下列何者？
    options:
      A: 想要替兒子江乙頂罪
      B: 想表達江乙被懲處的不公
      C: 向楚王告發郢大夫的罪行
      D: 要求楚王懲處失職的令尹
