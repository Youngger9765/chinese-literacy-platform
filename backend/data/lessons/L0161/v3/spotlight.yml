lesson_uid: L0161
version_id: v3
section_no: 四
spotlight:
  label: 四、文言文聚光燈
  strategy_name: 指示代詞、疑問代詞
  strategy_type: classical_grammar
  blocks:
  - type: concept_box
    text: '還記得代詞的意義嗎？

      代詞：具有代替或指示作用的語詞。

      它包括人稱代詞、指示代詞及疑問代詞。今天我們要繼續來認識文言文中的指示代詞及疑問代詞。'
  - type: guide
    text: 一、文言文指示代詞
  - type: concept_box
    label: （一）作用
    text: '用來「指特定的人、事、物」的詞。

      這些字就像「雷射筆」，你指哪裡，它們就幫你標記哪裡！

      例如：老師指著黑板說：「此題很重要！」──「此」就是標記「這一題」。'
  - type: table
    label: （二）常見用字與現代的意思
    columns:
    - 指示代詞
    - 作用
    - 現代意義
    - 例句
    rows:
    - 指示代詞: 之、此、是、斯
      作用: 指「近的」
      現代意義: 這、這個、這裡、這樣
      例句:
      - 學而時習之
      - 此物最相思
    - 指示代詞: 彼、其
      作用: 指「遠的」
      現代意義: 那、那個；那裏、那樣
      例句:
      - 顧此失彼
      - 不厭其煩
    - 指示代詞: 或、某
      作用: 指「不特定」
      現代意義: 有人、有的、有時
      例句:
      - 或曰
      - 某天
    - 指示代詞: 它、他
      作用: 指「其他的」
      現代意義: 別的、其他的
      例句: 假手他人
  - type: exercise
    instruction: 判斷各題框框中語詞的意思，將適當的語詞代號填入空格中。
    option_bank:
      A: 這/這樣
      B: 那/那裡
      C: 有人
      D: 別的
    example:
      stem: 是與使人盜何以異也？
      answer: A
    items:
    - index: 1
      stem: 或以錢幣乞之。
      answer: C
      teacher_note: 有人就拿錢求他(作詩)。
    - index: 2
      stem: 斯是陋室，惟吾德馨。
      answer: A
      teacher_note: 這是一間簡陋的房子，因為我的品德美好，使陋室的名聲像香氣一樣遠播。
    - index: 3
      stem: 顧左右而言他。
      answer: D
      teacher_note: 看東看西，然後說些別的。比喻閃避主題而談論別的事。
    - index: 4
      stem: 此起彼落。
      answer: B
      teacher_note: 這裡起來，那裡落下。形容連續不斷。
  - type: guide
    text: 二、文言文疑問代詞
  - type: concept_box
    label: （一）作用
    text: '用來「提問」的詞，就像我們現在用的「誰、什麼」。

      這些字就像「問題小幫手」，當你想問事情時，它們會跳出來幫忙！

      例如：你找不到鉛筆時會問：「誰看到我的鉛筆？」──「誰」就是疑問代詞。'
  - type: table
    label: （二）常見的疑問代詞
    columns:
    - 疑問代詞
    - 作用
    - 現代意義
    - 例句
    rows:
    - 疑問代詞: 何=盍、曷
      作用: 問事物、原因
      現代意義: 什麼、為什麼
      例句: 何不讀書？
    - 疑問代詞: 誰
      作用: 問人
      現代意義: 誰（和現在一樣）
      例句: 誰在笑？
    - 疑問代詞: 孰
      作用: 問選擇
      現代意義: 誰、哪一個
      例句: 蘋果與橘，孰甜？
  - type: exercise
    label: 輕練習
    instruction: 判斷各題框框中語詞的意思，將適當的語詞代號填入空格中。
    option_bank:
      A: 什麼
      B: 為什麼
      C: 誰
      D: 哪一個
    example:
      stem: 是與使人盜何以異也？
      answer: A
    items:
    - index: 1
      stem: 本是同根生，相煎何太急？
      answer: B
      teacher_note: 同根而生的豆莖與豆子(比喻兄弟)，逼迫為什麼這樣急切？
    - index: 2
      stem: 不知何故？
      answer: A
      teacher_note: 不知道是什麼原因？
    - index: 3
      stem: 責任與享受，孰輕孰重？
      answer: D
      teacher_note: 兩件事物相比，哪個不重要？哪個重要？
    - index: 4
      stem: 卿面何以汗？
      answer: B
      teacher_note: 你的臉為什麼流汗(不止)？
    - index: 5
      stem: 盍各言爾志？
      answer: B
      teacher_note: 為什麼不各自說說你們的志向？
    - index: 6
      stem: 人非聖賢，孰能無過？
      answer: C
      teacher_note: 人不是聖人、賢人，誰能不犯錯？
    - index: 7
      stem: 天地賦命，有生必終。自古聖賢，誰能獨免？
      answer: C
      teacher_note: 上天給生命，有出生就有死亡。自古以來的聖人、賢人，誰能獨自避免(死亡)？
  - type: passage
    label: 故事導讀的答案
    paragraphs:
    - 「王曰：『善。非徒譏令尹，又譏寡人。』命吏償母之布，因賜金十鎰。」
    - 「王曰：『母智若此，其子必不愚。』乃復召江乙而用之。」
    - 楚王聽完江乙媽媽的辯證後說：「你說得好！這不只批評了令尹，也批評了我。」然後命人補償江母損失的布，又賞她200兩黃金，並說：「媽媽這麼聰明，她的兒子必不笨。」於是就讓江乙重新回來做官了。
    classical: '「王曰：『善。非徒譏令尹，又譏寡人。』命吏償母之布，因賜金十鎰。」

      「王曰：『母智若此，其子必不愚。』乃復召江乙而用之。」'
    modern: 楚王聽完江乙媽媽的辯證後說：「你說得好！這不只批評了令尹，也批評了我。」然後命人補償江母損失的布，又賞她200兩黃金，並說：「媽媽這麼聰明，她的兒子必不笨。」於是就讓江乙重新回來做官了。
