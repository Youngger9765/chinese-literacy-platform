version_id: v3
intro_guide:
  label: 導讀
  text: '這故事發生在二千多年前的楚國。江乙是當時的小官，他管轄的郢都王宮發生竊案，江乙的長官（叫做「令尹」）不高興，就報請楚王把江乙免職了。

    東西又不是江乙偷的，結果他被免職，說起來實在很冤枉。這時，又聰明又勇敢的江乙媽媽挺身而出，就跑到王宮找楚王，為自己的兒子打抱不平了。

    「大王，我家掉了八匹布，是令尹偷的！」她告狀道。

    「講話小心一點，你若誣告，國家是有法律的喔！」楚王警告。

    「就算不是令尹偷的，也是他指使人去偷的！」江乙媽媽答，而且說了一長段的話，意思是令尹沒有把國家治理好，才出現這麼多小偷，我家掉了東西，他當然要負責。

    「但小偷偷東西，令尹並不知道啊，這跟他有什麼關係？」王說。

    「對啊，那王宮掉了東西，又跟我兒子有什麼關係？」江乙媽媽說出了心中的話。

    江乙媽媽說了這麼多，你覺得有道理嗎？最後，她有達到目的嗎？答案就隱藏在本課的某一頁中，祝你順利找到答案哦。'
  hint: 答案在本課「文言文聚光燈」的最後一頁。
