lesson_uid: L0161
version_id: v3
section_no: 六
self_challenge:
  label: 六、自我挑戰
  teacher_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow:
  - ❶斷句
  - ❷找動詞/形容詞
  - ❸找/補主語
  - ❹用自己的話說一說
  passage:
    classical: 子胥出逃，邊候¹得之。子胥曰：「上索我者，以我有美珠也。今我已亡之矣，我將謂子取而吞之。」候因釋之。
    source: (107 會考)
    annotations:
    - 'no': 1
      term: 邊候
      text: 邊吏。
    modern: 伍子胥要逃離國境，駐守邊境的官吏抓到他。伍子胥說：「國君派人抓我，是因為我有國君想要的美珠。但現在我已經丟失了美珠，(如果您把我送到國君那)，我會說是您把它搶走並私吞了。」駐守邊境的官吏因此釋放了伍子胥。
  items:
    label: （一）請依照故事脈絡，回答下列問題。
    questions:
    - index: 1
      stem: 根據斷句後的第一個分句，主語是誰？
      answer: 子胥
    - index: 2
      stem: 承上題，這個主語怎麼樣或做什麼？
      answer: 他逃跑/他逃亡了
    - index: 3
      stem: 這個分句還有另一個人物，他是誰？
      answer: 邊候
    - index: 4
      stem: 承上題，這個人怎麼樣或做什麼？(判斷代詞)
      answer: 他得到/抓到子胥
    - index: 5
      stem: 根據第二個分句，子胥說：「上面的人要抓我」，理由是什麼？
      answer: 因為他(子胥)有美珠
    - index: 6
      stem: 子胥說：「今我已亡之矣」，意思是「我現在已經把美珠搞丟了」。根據子胥的說法，他把美珠搞丟的原因是什麼？
      answer: 子(邊候)取而吞之/被邊候拿走私吞了
  quiz:
    label: （二）閱讀理解測驗
    questions:
    - index: 1
      answer: A
      stem: 根據這段文字，下列敘述何者正確？
      options:
        A: 子胥用言語威脅邊候以求自保
        B: 子胥以美珠賄賂邊候換取自由
        C: 邊候侵吞子胥的美珠又誣陷他
        D: 邊候相信子胥的清白而釋放他
      teacher_note: 子胥說上面的人要抓他是因為他有美珠，但假如美珠不在自己身上而在邊候身上，那上面的人就該改抓邊候了。邊候擔心引火自焚，只好放了子胥。
