section_no: 二
word_matching:
  label: 二、文白詞語比對
  instruction: 以下是原文與白話文的對照。請依照文意，寫出原文中灰底的白話文意
  items:
  - index: 1
    文言: 有入王宮中盜者，令尹以罪乙，請於王而黜之。
    白話: 有人進入王宮偷盜，令尹（　）怪罪江乙，向楚王請求（　）他。
    blanks:
    - answer: 因此
    - answer: 罷黜
  - index: 2
    文言: 其母往言於王曰：「妾夜亡布八匹，令尹盜之。」
    白話: 江乙的母親到王宮拜見楚王說：「（　）在半夜（　）八匹布，是令尹偷了（　）。」
    blanks:
    - answer: 我
    - answer: 丟失
    - answer: 我的布
  - index: 3
    文言: 王謂母曰：「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法。」
    白話: 楚王告訴江乙的母親說：「令尹（　）偷（　）的話，（　）不會因為他富貴而不依法處置。但（　）令尹沒有偷竊卻（　），楚國是有法律的。」
    blanks:
    - answer: 確實
    - answer: 布
    - answer: 我
    - answer: 如果
    - answer: 誣賴他
  - index: 4
    文言: 昔孫叔敖之為令尹也，道不拾遺，門不閉關，而盜賊自息。
    白話: （　）孫叔敖（　）令尹時，路上不會有人（　），家裡的門不用關，而盜賊自動就消失了。
    blanks:
    - answer: 從前
    - answer: 擔任
    - answer: 撿走失物
  - index: 5
    文言: 今令尹之治也，耳目不明，盜賊公行，是故使盜得盜妾之布，是與使人盜何以異也？
    白話: 如今他令尹治理，耳朵和眼睛不清楚，盜賊（　），（　）才使盜賊得以偷走（　），（　）跟指使人偷（　）不同？
    blanks:
    - answer: 公然橫行
    - answer: 所以
    - answer: 我的布
    - answer: 這
    - answer: 有什麼
  - index: 6
    文言: 相不賢則國不寧。王其察之。
    白話: 宰相不（　），那麼國家就不（　）。請王上明察（　）。
    blanks:
    - answer: 賢能
    - answer: 安寧
    - answer: 這件事
