modern_translation:
  label: 古文今譯
  paragraphs:
  - 楚國人江乙擔任郢都的大夫。有人進入王宮偷盜，令尹因此怪罪江乙，向楚王請求罷黜(免職)他。
  - 江乙的母親到王宮拜見楚王說：「我在半夜丟失八匹布，是令尹偷了我的布。」楚王告訴江乙的母親說：「令尹確實偷布的話，我不會因為他富貴而不依法處置。但如果令尹沒有偷竊卻誣賴他，楚國是有法律的。」
  - 江母說：「即使令尹不是親自去偷，也是指使人偷的。」楚王說：「他如何指使人偷盜？」江母回答：「從前孫叔敖擔任令尹時，路上不會有人撿走失物，家裡的門不用關，而盜賊自動就消失了。如今他令尹治理，耳朵和眼睛不清楚(能力差、愚昧糊塗)，盜賊公然橫行，所以才使盜賊得以偷走我的布，這跟指使人偷有什麼不同？」
  - 楚王說：「令尹在朝廷，盜賊在民間，令尹有什麼罪過呢？」江乙的母親說：「從前我的孩子作為郢都的官員，有人偷了王宮的東西，我的孩子卻受到連坐而被免職，我的孩子又哪裡知道(盜賊要到王宮偷東西)呢？但他最終受到連坐而被罰。令尹是什麼特別的人，卻不因為這樣算他的錯嗎？從前周武王說過：『百姓有罪過，原因都在我一人。』上面的官員不賢明，那麼下面的人民就不能治理好，宰相不賢能，那麼國家就不安寧。請王上明察這件事。」
