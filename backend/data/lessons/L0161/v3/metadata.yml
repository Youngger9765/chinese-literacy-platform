intro: 這篇文章講述了江乙的母親為了替兒子洗刷冤屈，勇敢地向楚王上訴的故事。當時江乙因為宮中失竊而被牽連，母親為了證明兒子的清白，巧妙地運用了比喻和歷史典故，向楚王說明了身為上位者應有的責任。她透過對比過去清明的政治，以及現今令尹的失職，來點出問題的癥結所在。這篇文章讓我們看到一位母親的智慧與勇氣，以及她對公平正義的堅持。
strategy_explained: '這篇文章要帶你練習看懂文言文裡面的「指示代詞」和「疑問代詞」是什麼意思，它們就像文言文裡的小指引，幫助我們抓到誰、什麼東西、在哪裡

  你之所以會覺得這篇文章適合練這個，是因為江乙媽媽為了替兒子申冤，講了很多事情，像是「那時候」、「什麼事」，還有「為什麼」，這些都跟我們今天要學的指引詞很有關係，掌握了它們，就能清楚江乙媽媽在說什麼

  讀的時候，你可以試著把這些指引詞找出來，想一想它指的是誰，或是指的什麼狀況，這樣就能更順利地理解故事內容了'
