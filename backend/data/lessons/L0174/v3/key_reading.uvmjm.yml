  passage: 柔道選手楊勇緯曾在雅加達亞運的八強賽落敗，而緊接著的復活賽，卻迎來更加艱困的局面。他的對手──來自蒙古的達許達瓦，是楊勇緯過去曾兩度敗北的勁敵。然而，那些失敗除了帶給他不甘心的眼淚，也讓他發現自己的不足。賽前，他針對比賽情境反覆演練，將過往的挫折化為珍貴的教訓。終於，在交錯的手腳間，在重心的攻防間，看準得分的契機，一舉扳倒對手。比賽場上，輸的人往往學到最多也進步最多。面對失敗，楊勇緯沒有急著否定自己，而是看見成長的機會與變強的可能。舉重選手郭婞淳在仁川亞運抓舉95公斤、挺舉124公斤，比起前一年參賽的總重還少了22公斤，最後只拿下第四名，未拿牌。和她過往的戰績相比，這絕對稱不上亮眼，然而，儘管感到可惜，但她並不沮喪。因為這是她在被140多公斤的槓鈴壓傷後，花了四個月，咬牙忍痛撐過各種復健與訓練，為自己重新贏得的重大勝利。也許外行人會把沒有奪牌看作失敗，但在郭婞淳眼中，更重要的是，她和自己的競賽；她更在乎的，是自己能不能走過受傷與低潮，重新站回場上。
  start_text: 柔道選手楊勇緯曾在雅加達亞運的八強賽落敗，而緊接
