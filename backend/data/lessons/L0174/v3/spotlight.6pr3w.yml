lesson_uid: L0174
version_id: v3
section_no: 六
spotlight:
  strategy_name: 面對失敗，你的想法是……
  strategy_type: sel_character
  blocks:
  - type: concept_box
    text: 每一個人都會經歷挫折和失敗，而面對失敗時的「想法」，往往會決定我們能否找到下一步。面對失敗時，會有情緒很正常，但更重要的是，誘發我們情緒的「想法」是什麼？分辨哪些是已經「發生的事」，哪些是心裡的「想法」，並判斷：哪一種想法會讓自己停在原地，哪一種想法能幫助自己找到下一步。失敗不一定代表結束。當我們學會換一種方式理解失敗，就有機會把失落變成提醒，把挫折變成繼續前進的力量。
  - type: guide
    text: ◎從小齊的故事出發：先從小齊的故事來看看他可能的感受與想法，並進一步幫助他找出適合的下一步。
  - type: sub_block
    label: 1.覺察感受
    stem: 小齊被三振後，球隊輸了，你覺得此時他可能有哪些感受？請勾選。（可複選）
    options:
      1: 難過
      2: 自責
      3: 不甘心
      4: 害怕被責怪
      5: 想逃避
    student_filled: true
    no_correct_answer: true
    reflection: →失敗後有情緒是正常的。真正重要的不是「不能難過」，而是察覺自己難過之後，怎麼理解這件事，而且，想法會影響情緒。
  - type: sub_block
    label: 2.感受背後的事實與想法
    stem: 根據小齊的故事，哪些是事實？哪些是想法？
    items:
    - index: 1
      stem: 小齊在最後一球揮空，被三振
      options:
        1: 事實
        2: 想法
      answer: 1
    - index: 2
      stem: 球隊最後輸掉比賽
      options:
        1: 事實
        2: 想法
      answer: 1
    - index: 3
      stem: 小齊一定不適合打棒球
      options:
        1: 事實
        2: 想法
      answer: 2
    - index: 4
      stem: 小齊這段時間的努力都白費了
      options:
        1: 事實
        2: 想法
      answer: 2
    - index: 5
      stem: 小齊應該要加強判斷球路
      options:
        1: 事實
        2: 想法
      answer: 2
    - index: 6
      stem: 同樣是「被三振」，下面哪一句比較像事實？
      options:
        A: 小齊很沒用，害大家輸球
        B: 小齊在關鍵時刻被三振
        C: 小齊以後都不該再上場
        D: 小齊的努力全部都白費了
      answer: B
    reflection: →事實是已經發生的事；想法是我們對事情的解釋。失敗讓人痛苦，常常是因為我們腦中出現的想法。
  - type: sub_block
    label: 3.看見想法的影響
    items:
    - index: 1
      stem: 請閱讀小齊可能出現的四種想法，選出「最能幫助他繼續前進」的一句。
      options:
        A: 都是我害大家輸球，我真的很沒用。
        B: 我不適合打棒球，以後不要再上場。
        C: 我很難過，但這次提醒我要多練判斷球路。
        D: 反正只是運氣不好，不用再想這件事。
      answer: C
    - index: 2
      stem: 為什麼上題的答案比較有幫助？請勾選兩個原因。
      options:
        1: 它承認小齊會難過。
        2: 它把責任全部推給別人。
        3: 它指出可以練習的方向。
        4: 它假裝失敗完全不重要。
        5: 它沒有否定小齊整個人。
        6: 它認為小齊無法控制成敗。
      answer:
      - 3
      - 5
    reflection: →有些想法會讓我們卡住；有些想法會讓我們看見下一步。成長是從失敗中找出可以調整的地方。
  - type: sub_block
    label: 4.提出行動方案
    instruction: 請練習將下面的想法改寫成比較有行動力的說法。
    example:
      原本想法: 我數學就是不好，再讀也沒有用。
      改寫: 我不是數學不好，而是需要更多有效的練習方法。
    items:
    - index: 1
      stem: 小齊可能的想法──「我不適合打棒球。」
      value: 改寫──「我不是【　】，而是【　】還需要練習。」
      blanks:
      - answer: 不適合打棒球
      - answer: 判斷球路
  - type: free_text
    label: ◎回到你的生活中，找一個你曾經覺得失敗或表現不好的事情，完成練習。
    prompt: 回到你的生活中，找一個你曾經覺得失敗或表現不好的事情，完成練習。
    items:
    - index: 1
      stem: 發生的事：
    - index: 2
      stem: 當時的感受：
      options:
        1: 難過
        2: 生氣
        3: 自責
        4: 丟臉
        5: 其他
      no_correct_answer: true
    - index: 3
      stem: 當時的想法讓我：
      options:
        1: 想逃避
        2: 更否定自己
        3: 想再試一次
        4: 找到可以調整的地方
        5: 其他
      no_correct_answer: true
    - index: 4
      stem: 我可以用比較有力量的解釋：這次失敗提醒我【　】，所以我下一步可以【　】。
    student_filled: true
    no_correct_answer: true
    reflection: →有幫助的想法，是承認自己會難過，並從中找出一個可以前進的方向。
