version_id: v3
section_no: 五
keypoints:
  title: 文章重點表
  intro: 本篇文章透過不同的事件來強調「面對失敗的不同可能」，請根據架構整理文章的重點。
  structure: nested
  columns:
  - 主角
  - 事件
  - 面對失敗的想法
  rows:
  - 主角: 小齊（1～3段）
    事件: '1.九局下，兩出局，落後一分，輪到小齊站上【　】。

      2.小齊（①被投手三振 □②擊出安打），比賽結束。

      3.球隊（□①贏球 ②輸球）'
    事件_blanks:
    - answer: 打擊區
    事件_choices:
    - options:
      - 被投手三振
      - 擊出安打
      answer: 1
    - options:
      - 贏球
      - 輸球
      answer: 2
    面對失敗的想法: '作者認為有的人──(複選)

      ①自責沒好好把握機會

      ②認為努力都白費了

      ③覺得自己不適合打棒球'
    想法_multi_answer:
    - 1
    - 2
    - 3
  - 主角: 楊勇緯（第4段）
    事件: '1.在雅加達亞運的【　】賽落敗，要面對曾經兩度【　】的勁敵。

      2.將過去比賽的【　】化為教訓，反覆演練，最後拿下勝利。'
    事件_blanks:
    - answer: 八強
    - answer: 敗北
    - answer: 挫折
    面對失敗的想法: '1.失敗讓他【　】，也讓他發現自己的【　】

      2.從失敗中看見【　】的機會與【　】的可能。'
    想法_blanks:
    - answer: 不甘心
    - answer: 不足
    - answer: 成長
    - answer: 變強
  - 主角: 郭婞淳（第5段）
    事件: '1.在仁川亞運比賽前被140多公斤的【　】壓傷

      2.仁川亞運時抓舉95公斤、挺舉124公斤，拿下第【　】名，沒有奪牌。'
    事件_blanks:
    - answer: 槓鈴
    - answer: 四
    面對失敗的想法: 雖然成績不亮眼，但對她來說這是她走過【　】和【　】的（①勝利 □②失敗）
    想法_blanks:
    - answer: 受傷
    - answer: 低潮
    想法_choices:
    - options:
      - 勝利
      - 失敗
      answer: 1
  - 主角: 總結
    事件: '1.失敗可以讓人看見該【　】的地方──對應的是（①楊勇緯 □②郭婞淳）的故事

      2.有時候看似是失敗，但其實已經是重要的突破──對應的是（□①楊勇緯 ②郭婞淳）的故事

      3.我們（□①只有一種 ②有不只一種）的角度來面對失敗。'
    事件_blanks:
    - answer: 補強
    事件_choices:
    - options:
      - 楊勇緯
      - 郭婞淳
      answer: 1
    - options:
      - 楊勇緯
      - 郭婞淳
      answer: 2
    - options:
      - 只有一種
      - 有不只一種
      answer: 2
