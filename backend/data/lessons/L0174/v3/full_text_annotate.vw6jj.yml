  - idx: 1
    text: 九局下，三壘有人，兩出局，比分二比三，進攻方落後一分。隨著場邊隊友的加油聲，小齊站上打擊區。儘管努力要自己冷靜，手心還是頻頻出汗。「一支安打就好。」他在心裡對自己說：「只要把學長送回來，這場就還有機會！」他用沾滿紅土的手在褲子上抹了抹，調整了帽簷，握緊球棒，抬頭盯住投手。
  - idx: 2
    text: 第一球，外角偏低，小齊忍住沒揮，一壞球。第二球偏高，他眼睛一亮，大力拉擊，球棒擦出清脆的「鏘」聲，但球飛向了界外，一好一壞。第三球，投手投出刁鑽的內角滑球，小齊來不及反應，球直接滑入捕手手套。兩好一壞。這時，他滿腦子都是「碰到球、至少要碰到啊」、「比賽千萬不能結束在我手上」。第四球出手，看起來像顆普通正中速球，小齊傾盡全力一揮，下一瞬間，只聽見捕手手套傳來沉悶的「砰！」。裁判舉手，宣告比賽結束。小齊站在原地，低下了頭，球棒從手上垂落。
  - idx: 3
    text: 如果，你是小齊，此時此刻，你心中會冒出什麼念頭？也許有人會怪自己沒把握機會，害隊伍輸球；有人會懷疑那些反覆揮棒、日曬雨淋的日子是不是都白費了；也有人會在一瞬間，覺得丟臉，認為自己不適合打棒球。只是，面對失敗真只能這樣理解，只有這一種可能嗎？
  - idx: 4
    text: 柔道選手楊勇緯曾在雅加達亞運的八強賽落敗，而緊接著的復活賽，卻迎來更加艱困的局面。他的對手──來自蒙古的達許達瓦，是楊勇緯過去曾兩度敗北的勁敵。然而，那些失敗除了帶給他不甘心的眼淚，也讓他發現自己的不足。賽前，他針對比賽情境反覆演練，將過往的挫折化為珍貴的教訓。終於，在交錯的手腳間，在重心的攻防間，看準得分的契機，一舉扳倒對手。比賽場上，輸的人往往學到最多也進步最多。面對失敗，楊勇緯沒有急著否定自己，而是看見成長的機會與變強的可能。
  - idx: 5
    text: 舉重選手郭婞淳在仁川亞運抓舉95公斤、挺舉124公斤，比起前一年參賽的總重還少了22公斤，最後只拿下第四名，未拿牌。和她過往的戰績相比，這絕對稱不上亮眼，然而，儘管感到可惜，但她並不沮喪。因為這是她在被140多公斤的槓鈴壓傷後，花了四個月，咬牙忍痛撐過各種復健與訓練，為自己重新贏得的重大勝利。也許外行人會把沒有奪牌看作失敗，但在郭婞淳眼中，更重要的是，她和自己的競賽；她更在乎的，是自己能不能走過受傷與低潮，重新站回場上。
  - idx: 6
    text: 有些失敗，會讓人看見自己該補強的地方；有些失敗，若換個角度來看，其實已經是一種突破。回到小齊的那次三振，他也許失去了帶領全隊獲勝的機會，但不代表他的努力都白費，更不代表他不適合繼續打球。那次揮空，也許會提醒他之後要加強對球路的判斷。也許翻開數據，他會發現，那場比賽，他的單場打擊率破個人紀錄。所以，面對失敗，當我們願意不只從一種角度來看，當我們能學著看見不同的意義，就能跨越失落，帶著新的眼光望向未來，看到新的、光亮的出路。
