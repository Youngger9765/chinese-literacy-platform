spotlight:
  lesson: 體-L8
  strategy_name: 品格力-面對失敗
  strategy_type: sel_character
  blocks:
  - type: free_text
    prompt: (7)她在才藝表演中的表現十分(  C  )，讓大家印象深刻。
  - type: free_text
    prompt: (8)即使面對(  A  )的挑戰，他仍不輕易放棄，告訴自己再試一次。
  - type: guide
    text: 五文章重點表 五文章重點表 本篇文章透過不同的事件來強調「面對失敗的不同可能」，請根據架構整理文章的重點。
  - type: table
    rows:
    - - 主角
      - 事件
      - 面對失敗的想法
    - - 小齊（１～３段）
      - 1.九局下，兩出局，落後一分，輪到小齊站上【】。2.小齊（□①被投手三振　□②擊出安打），比賽結束。3.球隊（□①贏球　□②輸球）
      - 作者認為有的人──(複選)□①自責沒好好把握機會 □②認為努力都白費了□③覺得自己不適合打棒球
    - - 楊勇緯（第４段）
      - 1.在雅加達亞運的【】賽落敗，要面對曾經兩度【】的勁敵。2.將過去比賽的【】化為教訓，反覆演練，最後拿下勝利。
      - 1.失敗讓他【】，也讓他發現自己的【】2.從失敗中看見【】的機會與【】的可能。
    - - 郭婞淳（第５段）
      - 1.在仁川亞運比賽前被140多公斤的【】壓傷2.仁川亞運時抓舉95公斤、挺舉124公斤，拿下第【】名，沒有奪牌。
      - 雖然成績不亮眼，但對她來說這是她走過【】和【】的（□①勝利　□②失敗）
    - - 總結
      - 1.失敗可以讓人看見該【】的地方──對應的是（□①楊勇緯　□②郭婞淳）的故事2.有時候看似是失敗，但其實已經是重要的突破──對應的是（□①楊勇緯　□②郭婞淳）的故事3.我們（□①只有一種　□②有不只一種）的角度來面對失敗。
    answers:
    - 打擊區
    - 八強
    - 敗北
    - 挫折
    - 不甘心
    - 不足
    - 成長
    - 變強
    - 槓鈴
    - 四
    - 受傷
    - 低潮
    - 補強
  - type: guide
    text: 六品格聚光燈面對失敗，你的想法是……六品格聚光燈面對失敗，你的想法是……
  - type: guide
    text: ◎從小齊的故事出發：先從小齊的故事來看看他可能的感受與想法，並進一步幫助他找出適合的下一步。
  - type: single
    prompt: 1.覺察感受：小齊被三振後，球隊輸了，你覺得此時他可能有哪些感受？請勾選。（可複選）
    options:
    - 難過
    - 自責
    - 不甘心
    - 害怕被責怪
    - 想逃避
    answer: 難過
  - type: guide
    text: →失敗後有情緒是正常的。真正重要的不是「不能難過」，而是察覺自己難過之後，怎麼理解這件事，而且，想法會影響情緒。
  - type: free_text
    prompt: 2.感受背後的事實與想法：根據小齊的故事，哪些是事實？哪些是想法？
  - type: single
    prompt: (1)小齊在最後一球揮空，被三振──□①事實　□②想法
    options:
    - 事實
    - 想法
    answer: 事實
  - type: single
    prompt: (2)球隊最後輸掉比賽──□①事實　□②想法
    options:
    - 事實
    - 想法
    answer: 事實
  - type: single
    prompt: (3)小齊一定不適合打棒球──□①事實　□②想法
    options:
    - 事實
    - 想法
    answer: 事實
  - type: single
    prompt: (4)小齊這段時間的努力都白費了──□①事實　□②想法
    options:
    - 事實
    - 想法
    answer: 事實
  - type: single
    prompt: (5)小齊應該要加強判斷球路──□①事實　□②想法
    options:
    - 事實
    - 想法
    answer: 事實
  - type: free_text
    prompt: (6)同樣是「被三振」，下面哪一句比較像事實？ 答：【  B   】
  - type: guide
    text: A.小齊很沒用，害大家輸球  B.小齊在關鍵時刻被三振
  - type: guide
    text: C.小齊以後都不該再上場    D.小齊的努力全部都白費了
  - type: guide
    text: →事實是已經發生的事；想法是我們對事情的解釋。失敗讓人痛苦，常常是因為我們腦中出現的想法。
  - type: free_text
    prompt: 3.看見想法的影響：
  - type: free_text
    prompt: (1)請閱讀小齊可能出現的四種想法，選出「最能幫助他繼續前進」的一句。答：【  C   】
  - type: guide
    text: A.都是我害大家輸球，我真的很沒用。B.我不適合打棒球，以後不要再上場。C.我很難過，但這次提醒我要多練判斷球路。D.反正只是運氣不好，不用再想這件事。
  - type: single
    prompt: (2) 為什麼上題的答案比較有幫助？請勾選兩個原因。
    options:
    - 它承認小齊會難過。
    - 它把責任全部推給別人。
    - 它指出可以練習的方向。
    - 它假裝失敗完全不重要。
    - 它沒有否定小齊整個人。
    - 它認為小齊無法控制成敗。
    answer: 它承認小齊會難過。
  - type: guide
    text: →有些想法會讓我們卡住；有些想法會讓我們看見下一步。成長是從失敗中找出可以調整的地方。
  - type: free_text
    prompt: 4.提出行動方案：請練習將下面的想法改寫成比較有行動力的說法。
  - type: guide
    text: 例如：原本想法──「我數學就是不好，再讀也沒有用。」
  - type: guide
    text: 改寫──「我不是數學不好，而是需要更多有效的練習方法。」
  - type: guide
    text: 題目1：小齊可能的想法──「我不適合打棒球。」
  - type: guide
    text: 改寫──「我不是【  不適合打棒球   】，而是【  判斷球路   】還需要練習。」
  - type: guide
    text: ◎回到你的生活中，找一個你曾經覺得失敗或表現不好的事情，完成練習。
  - type: free_text
    prompt: 1.發生的事：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
  - type: single
    prompt: 2.當時的感受：□①難過 □②生氣 □③自責 □④丟臉 □⑤其他_______
    options:
    - 難過
    - 生氣
    - 自責
    - 丟臉
    - 其他_______
    answer: 難過
  - type: single
    prompt: 3.當時的想法讓我：□①想逃避  □②更否定自己  □③想再試一次
    options:
    - 想逃避
    - 更否定自己
    - 想再試一次
    answer: 想逃避
  - type: single
    prompt: 請選擇
    options:
    - 找到可以調整的地方
    - 其他_____________________
    answer: 找到可以調整的地方
  - type: free_text
    prompt: 4.我可以用比較有力量的解釋：這次失敗提醒我________________，所以我下一步可以________________。
  - type: guide
    text: →有幫助的想法，是承認自己會難過，並從中找出一個可以前進的方向。
  - type: passage
    source: unknown
    paragraphs:
    - 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
