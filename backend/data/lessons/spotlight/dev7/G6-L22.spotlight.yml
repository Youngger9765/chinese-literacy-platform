spotlight:
  lesson: G6-L22
  strategy_name: 摘要策略：問題．解決．結果結構
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: '好故事，大家都愛看。為什麼？因為主角不是一帆風順，而是會遇到困難，然後想辦法解決，最後扭轉局面，迎向結局。這樣的故事最精彩、最吸引人！

      所以，一個經典又精彩的故事，常常有四個重點：'
  - type: guide
    text: ❶主角是誰？　　　　　   ❷主角遇到了什麼「問題」？
  - type: guide
    text: '❸問題如何「解決」？　　 ❹最後得到什麼「結果」？

      今天，我們就來學一個超實用的閱讀方法，用「問題、解決、結果」的方式來整理故事內容，幫助你輕鬆抓到重點。舉例來說：'
  - type: guide
    text: 例一：烏鴉喝水
  - type: passage
    source: supplementary
    paragraphs:
    - 天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。
  - type: single
    prompt: ❶主角是誰？
    options:
    - 烏鴉
    - 麻雀
    answer: 烏鴉
  - type: single
    prompt: ❷主角遇到了什麼「問題」？
    options:
    - 喝不到水
    - 天氣炎熱
    answer: 喝不到水
  - type: single
    prompt: ❸問題如何「解決」？
    options:
    - 丟小石頭進瓶子裡，讓水面升高
    - 等待下雨，讓瓶子裝滿水
    answer: 丟小石頭進瓶子裡，讓水面升高
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 主角順利喝到水
    - 主角沒有喝到水
    answer: 主角順利喝到水
  - type: guide
    text: 接下來，我們來看課文的故事
  - type: passage
    source: supplementary
    paragraphs:
    - 孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。
    - 這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。
    - 孟嘗君一行人順利出關，逃出秦國。
  - type: single
    prompt: ❶主角是誰？
    options:
    - 孟嘗君
    - 秦昭王
    - 雞鳴先生
    answer: 孟嘗君
  - type: single
    prompt: ❷主角遇到了什麼「問題」？
    options:
    - 被追兵追到
    - 天沒亮，城門不能開
    answer: 天沒亮，城門不能開
  - type: free_text
    prompt: ❸問題如何「解決」？孟嘗君的食客【　　　】，引來附近公雞也一起叫。
    answer: 模仿雞叫
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 主角  成功出關
    - 沒有出關。
    answer: 主角  成功出關
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 1.讓我們來看課文另一個故事
  - type: passage
    source: supplementary
    paragraphs:
    - 孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。
    - 這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很開心，幫孟嘗君在秦王面前說好話。秦王聽信她的話，便放了孟嘗君。
  - type: single
    prompt: ❶主角是誰？ □秦昭王　孟嘗君　□幸姬 □狗盜先生
    options:
    - 秦昭王
    - 孟嘗君
    - 幸姬
    - 狗盜先生
    answer: 孟嘗君
  - type: single
    prompt: ❷主角遇到了什麼「問題」？
    options:
    - 沒錢買白狐裘　幸姬要白狐裘但已送給秦王
    - 找不到人幫忙
    answer: 沒錢買白狐裘　幸姬要白狐裘但已送給秦王
  - type: single
    prompt: ❸問題如何「解決」？
    options:
    - 拜託秦王讓給幸姬
    - 食客潛入寶庫偷回白狐裘
    answer: 食客潛入寶庫偷回白狐裘
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 幸姬幫忙說話，秦王放了孟嘗君
    - 幸姬拒絕幫忙，孟嘗君被關
    answer: 幸姬幫忙說話，秦王放了孟嘗君
  - type: guide
    text: 2.進階挑戰：大象有多重？
  - type: passage
    source: supplementary
    paragraphs:
    - 有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。
    - 這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。
    - 最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。
  - type: single
    prompt: ❶主角是誰？
    options:
    - 曹操
    - 曹沖
    answer: 曹沖
  - type: single
    prompt: ❷主角遇到了什麼「問題」？
    options:
    - 大象太重，沒辦法秤
    - 大家只是好奇，沒有實際困難
    answer: 大象太重，沒辦法秤
  - type: single
    prompt: ❸問題如何「解決」？
    options:
    - 請工人抬大象放到大磅秤上秤重
    - 讓大家猜一個大概的重量
    - 用船的下沉水位線比對石頭重量，間接秤量體重
    answer: 用船的下沉水位線比對石頭重量，間接秤量體重
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 知道大象的重量
    - 不知道大象的重量
    answer: 知道大象的重量
  - type: fill_table
