spotlight:
  lesson: G6-L25
  strategy_name: 摘要策略：問題．解決結構找重點（段落定位版）
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: 這篇故事也是一篇說明文，講「全世界第一張股票」是怎麼誕生的。故事結構裡有明顯的問題、解決、結果。前面兩課我們已經學過怎麼用線索，來找到文章中的「問題、解決、結果」，我們再來複習這個祕訣，請你連連看。
  - type: single
    prompt: 請將「問題」與其正確的說明配對：
    options:
    - 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
    - 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
    - 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer: 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
  - type: single
    prompt: 請將「解決」與其正確的說明配對：
    options:
    - 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
    - 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
    - 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer: 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
  - type: single
    prompt: 請將「結果」與其正確的說明配對：
    options:
    - 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
    - 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
    - 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer: 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
  - type: guide
    text: '◎小試身手

      現在要給你一個比較難的任務哦，請你用前兩課學到的方法，找出本課的「問題、解決、結果」。這次多加一個挑戰，請你先找出「問題、解決」在哪個段落，寫在括弧內。'
  - type: fill_table
  - type: self_check
    items:
    - 我學到怎麼找出「問題」，知道故事一開始面臨什麼困境。
    - 我學到怎麼找出「解決」，了解主角/相關人物做了什麼來解決問題。
    - 我學到怎麼找出「結果」，說明解決行動帶來了哪些具體改變或成果。
    - 我發現「問題、解決、結果」結構，可以幫我掌握文章的重點。
