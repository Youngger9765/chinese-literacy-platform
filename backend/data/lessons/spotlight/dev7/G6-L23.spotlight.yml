spotlight:
  lesson: G6-L23
  strategy_name: 摘要策略：問題．解決結構找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: '這篇故事是一篇報導式說明文，講「毒鳥事件」解決的過程。故事結構裡有明顯的問題、解決、結果。但閱讀時，如何找到文章中的「問題、解決、結果」呢？我們可以用一些線索來做判斷喔！

      我們來練習用兩步驟（❶找重點句；❷精簡重點句）找「問題、解決、結果」。'
  - type: guide
    text: 一、找「問題」
  - type: guide
    text: ※祕訣：「問題」通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
  - type: free_text
    prompt: ❶找重點句：
  - type: passage
    source: unknown
    paragraphs:
    - 本文第一段有三句，請你先判斷哪一個句子是描述「不好的事」，而且是「最嚴重」的。(請在□打勾，三選一。)
    - □句1：2012年10月，屏東科技大學的研究人員收到兩隻死亡的老鷹，檢驗後，確認老鷹體內含有劇毒農藥。
    - 句2：2013年，他們在屏東縣一塊紅豆田中，發現了超過3000隻野鳥屍體。
  - type: guide
    text: □句3：死亡的鳥類包括麻雀、紅鳩、小雲雀、斑文鳥、彩鷸、秧雞等，也包括食物鏈上層的紅隼、老鷹。
  - type: guide
    text: 我們可以這樣思考：
  - type: passage
    source: unknown
    paragraphs:
    - 第一段有三個句子，第一句和第二句都是描述「不好的事」，我覺得第二句「發現超過3000隻野鳥屍體」更嚴重，所以我留下第二句，並把第二句畫線。
  - type: free_text
    prompt: ❷精簡重點句：
  - type: guide
    text: 想一想這句話的意思，用更簡短的方式表達重點。
  - type: guide
    text: 請判斷第1段的「問題」可以精簡成哪一個句子？（在□打勾，二選一。）
  - type: free_text
    prompt: 1.有大量的野鳥中毒死亡。
  - type: guide
    text: 二、找「解決」
  - type: guide
    text: ※祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡，一個精彩的故事，通常有多個解決方法。
  - type: free_text
    prompt: ❶找重點句：（第4段）
  - type: passage
    source: unknown
    paragraphs:
    - 請你先判斷哪些句子是描述「有人想出辦法或行動的句子」。（在□打勾，三選二）
    - 解決1：屏東科技大學在縣政府的協助下，找上當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這個生態的悲劇。
    - 解決2：林先生坦承錯誤，自2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。
  - type: guide
    text: □解決3：林先生雖然成為無毒農法的先驅，但這樣做成本高，18公頃紅豆田的收入，比過去少了100萬，因此無法大量推廣，只能苦撐待變。
  - type: guide
    text: 我們可以這樣思考：
  - type: guide
    text: 解決1和2，都是描述為了野鳥中毒死亡問題，句子都是「誰＋做了什麼事」。
