spotlight:
  lesson: G6-L24
  strategy_name: 摘要策略：問題．解決結構找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: 這篇故事是一篇報導式說明文，講「救援白鯨」的過程。故事結構裡有明顯的問題、解決、結果。上一課我們已經學過怎麼用線索，來找到文章中的「問題、解決、結果」，你還記得祕訣嗎？請你連連看。
  - type: single
    prompt: 「問題」的祕訣是什麼？
    options:
    - 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
    - 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
    - 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer: 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
  - type: single
    prompt: 「解決」的祕訣是什麼？
    options:
    - 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
    - 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
    - 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer: 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
  - type: single
    prompt: 「結果」的祕訣是什麼？
    options:
    - 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
    - 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
    - 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer: 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
  - type: guide
    text: '◎小試身手

      現在要給你一個比較難的任務哦，請你用上一課學到的方法，找出「白鯨救援」這一課的「問題、解決、結果」。'
  - type: fill_table
  - type: guide
    text: 一、請你自己檢查以下3項，確定自己是否會抓重點了。
  - type: guide
    text: 二、如果三項都打勾，恭喜你，你已經學會找文章「問題、解決、結果」的方法，這對你理解文章、記憶文章內容，都有很大的幫助哦。你超厲害的！
  - type: guide
    text: 三、不相信你具備這種能力？不然你試著不看課本，把這個故事用「問題、解決、結果」的結構講給好朋友聽聽看。
  - type: self_check
    items:
    - 我學到怎麼找出「問題」，知道故事一開始面臨什麼困境。
    - 我學到怎麼找出「解決」，了解主角/相關人物做了什麼來解決問題。
    - 我學到怎麼找出「結果」，說明解決行動帶來了哪些具體改變或成果。
