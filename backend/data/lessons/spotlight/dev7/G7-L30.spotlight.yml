spotlight:
  lesson: G7-L30
  strategy_name: 圖文表整合閱讀策略
  strategy_type: table_text
  blocks:
  - type: guide
    text: 說明：閱讀有圖或有表的文章時，不能只看文字，而要來回比對圖、表與文章內容，理解彼此之間的關係。這樣不但能更快掌握重點，也能更正確地回答問題。這一課，我們將以〈都是八哥，為什麼命運不一樣？〉為例，學習有表格文章的閱讀方法。
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 第30課   都是八哥，為什麼命運不一樣？
  - type: guide
    text: '這篇文章裡，文字、圖片和表格都提供了重要訊息。閱讀時，不能只看文字，也不能只看圖片或表格，而要先注意文字怎麼提醒你看圖表、怎麼告訴你圖表的功能，再把文字、圖片、表格連起來想。

      這一課我們用下面4個步驟，練習圖文表整合閱讀：

      ❶先讀文字——抓出這段的重點

      ❷找出相關圖表——判斷各自提供什麼訊息

      ❸文圖表對照——從圖表中找到和文字對應的資訊

      ❹整合多種材料——比較、連結各項資訊之間的關係'
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 練習一：第一段 vs 圖一
  - type: guide
    text: 練習一：第一段 vs 圖一
  - type: single
    prompt: 1.圖一最主要提供哪一類訊息？（單選）
    options:
    - 兩種八哥外形相近的整體印象
    - 兩種八哥近年的族群變化情形
    answer: 兩種八哥外形相近的整體印象
  - type: single
    prompt: 2.讀完第一段後，請你找出和圖一最相關的文字。（單選）
    options:
    - 白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。
    - 這兩種八哥外形十分相似，不容易單靠外表一眼分辨。
    answer: 這兩種八哥外形十分相似，不容易單靠外表一眼分辨。
  - type: figure
    referent: table
    asset: table1.json
    bind_paragraph: 練習二：第二段 vs 表一
  - type: guide
    text: 練習二：第二段 vs 表一
  - type: guide
    text: 步驟❶：先讀文字——抓出這段的重點
  - type: guide
    text: 小祕訣：含有表格的文章經常會告訴讀者，哪些地方要看表。當你讀到「表一」的提示時，你知道等一下要轉去看表一，並問自己這段要你看表的什麼？
  - type: free_text
    prompt: 1.請把第二段文字中，要你看表的地方畫線或圈起來
  - type: single
    prompt: 2.這段要你看表的什麼？（單選）
    options:
    - 八哥的外形與習性
    - 八哥的數量變化
    answer: 八哥的外形與習性
  - type: guide
    text: 步驟❷：再看表一——讀懂這張表告訴我們什麼訊息
  - type: guide
    text: 小祕訣：看表時，要先讀表格「標題」、再讀「第一列」和「第一欄」的小標題，判斷一下這個表在比較什麼，最後讀表格裡的內容。
  - type: single
    prompt: 1.表一主要提供的是哪一類訊息？（單選）
    options:
    - 白尾八哥和臺灣冠八哥近年的族群變化
    - 白尾八哥和臺灣冠八哥的異同
    answer: 白尾八哥和臺灣冠八哥的異同
  - type: guide
    text: 步驟❸：文圖表對照——從圖表中找到和文字對應的資訊
  - type: passage
    source: unknown
    paragraphs:
    - 在表一找到對應文字說明的訊息，必要時回頭看圖一，看看表格怎麼幫助你把文字讀得更清楚。
  - type: single
    prompt: 1.第二段說兩種八哥「外表相似」，表一中哪些資料可支持這句話？（複選）
    options:
    - 全身大致為黑色   ②身形大小接近
    - 常在地面走動覓食，吃昆蟲、果實  □
    - 都屬八哥屬、留鳥
    answer: 全身大致為黑色   ②身形大小接近
  - type: single
    prompt: 2.第二段說「只要觀察嘴喙和尾羽的顏色，就能分辨牠們」，表一中的哪些資料正好對應這句話？（複選）
    options:
    - 嘴喙顏色  ②尾羽顏色
    - 築巢地點
    - 適應都市環境
    answer: 嘴喙顏色  ②尾羽顏色
  - type: single
    prompt: 3.第二段提到臺灣冠八哥又稱「臺灣八哥」，表一中的哪一項資料和這句話最有關？（單選）
    options:
    - 冠羽是否明顯
    - 外來種／原生種
    - 族群數量      □
    - 保育身分
    answer: 外來種／原生種
  - type: single
    prompt: 4.讀表一，對理解第二段有什麼幫助？（單選）
    options:
    - 表一只是把第二段重新整理一次，並沒有幫助我們更清楚理解這段意思。
    - 表一幫助我們更清楚看出，兩種八哥雖然外形相近，但仍可從特徵和習性加以分辨。
    answer: 表一幫助我們更清楚看出，兩種八哥雖然外形相近，但仍可從特徵和習性加以分辨。
  - type: guide
    text: 步驟❹：整合多種材料——比較、連結各項資訊之間的關係
  - type: single
    prompt: 1.下面哪一句最能把第二段和表一的意思一起說清楚？（單選）
    options:
    - 兩種八哥雖然外形相近，但只要知道牠們同屬八哥屬，就能解釋後來族群數量不同的原因
    - 兩種八哥雖然外形相近，但仍可從嘴喙、尾羽等特徵區分，表一也進一步比較了牠們的習性差異
    answer: 兩種八哥雖然外形相近，但仍可從嘴喙、尾羽等特徵區分，表一也進一步比較了牠們的習性差異
  - type: single
    prompt: 2.讀完第二段和表一後，你認為哪些差異最值得留意，因為它們可能和課文標題的「命運不一樣」有關？（單選）
    options:
    - 是否怕人、是否利用人造設施築巢、適應都市環境強弱
    - 嘴喙顏色、尾羽顏色、冠羽是否明顯
    answer: 是否怕人、是否利用人造設施築巢、適應都市環境強弱
  - type: figure
    referent: table
    asset: table2.json
    bind_paragraph: 練習三：第三段 vs 表二
  - type: guide
    text: 練習三：第三段 vs 表二
  - type: guide
    text: 步驟❶：先讀文字——抓出這段的重點
  - type: free_text
    prompt: 1.請把第三段文字中，要你看表的地方畫線
  - type: single
    prompt: 2.這段要你看表的什麼？（單選）
    options:
    - 兩種八哥的外形與習性
    - 兩種八哥的數量變化
    answer: 兩種八哥的數量變化
  - type: guide
    text: 步驟❷：再看表——讀懂這張表告訴我們什麼訊息
  - type: single
    prompt: 1.表二主要提供的是哪一類訊息？（單選）
    options:
    - 兩種八哥近年族群數量的變化
    - 白尾八哥和臺灣冠八哥的異同
    answer: 兩種八哥近年族群數量的變化
  - type: guide
    text: 步驟❸：文表對照——從表中找到和文字對應的資訊
  - type: guide
    text: 在表二找到對應文字說明的訊息，看看表格怎麼把第三段說的內容整理得更清楚。
  - type: single
    prompt: 1.第三段說「外來種白尾八哥都明顯多過原生種臺灣冠八哥」，表二中的哪些資料可以支持這句話？（複選）
    options:
    - 近年數量變化（2009-2020）
    - 看得到的地點數／總調查地點數（2009-2021）
    - 2021年看得到的地點數
    - 2018年花蓮調查結果
    answer: 近年數量變化（2009-2020）
  - type: single
    prompt: 2.讀表二時，看到「84／584」旁邊有「註2」，到表格下方看註解有什麼幫助？（單選）
    options:
    - 註2會說明這個寫法的意思，幫助我們理解表格內容。
    - 註2會補充八哥的外形特徵，幫助我們分辨兩種八哥。
    answer: 註2會說明這個寫法的意思，幫助我們理解表格內容。
  - type: single
    prompt: 3.第三段說「有些地方甚至已經看不到臺灣冠八哥的身影了」，表二中哪一項最直接支持這句話？（單選）
    options:
    - 近年數量變化：無明顯變化
    - 2021年看得到的地點數：23個地點
    - 2018年花蓮調查結果：0隻
    - 白尾八哥成長250%
    answer: 2018年花蓮調查結果：0隻
  - type: single
    prompt: 4.作者呈現表格後，通常會在文字中說明這張表的重要訊息。請回到第三段，判斷哪一句最能統整表二最重要的訊息？（單選）
    options:
    - 表二則說明了兩種八哥近年族群數量的變化
    - 從表二可知，不論是整體數量、出現的地點，還是在部分地區的觀察結果，外來種白尾八哥都明顯多過原生種臺灣冠八哥
    - 可是，當初白尾八哥被引進臺灣時，牠們的數量很少，臺灣冠八哥才是隨處可見的常客。
    - 那麼，為什麼幾十年過去，原生種臺灣冠八哥逐漸消聲匿跡，白尾八哥卻愈來愈常見，聲勢愈來愈大呢？
    answer: 從表二可知，不論是整體數量、出現的地點，還是在部分地區的觀察結果，外來種白尾八哥都明顯多過原生種臺灣冠八哥
  - type: guide
    text: 步驟❹：整合多種材料——比較、連結各項資訊之間的關係
  - type: single
    prompt: 1.再回頭看表一，哪幾項差異最可能和第三段的數量變化有關？（複選）
    options:
    - 較不怕人／較怕人
    - 常利用人造設施築巢／較少利用人造設施築巢
    - 適應都市環境較強／較弱
    - 嘴喙顏色不同
    answer: 較不怕人／較怕人
  - type: single
    prompt: 2.下面哪一句最能把第三段和表二的意思一起說清楚？（單選）
    options:
    - 表二說明兩種八哥近年的數量差不多，而表一只是補充牠們名稱上的不同。
    - 表二告訴我們兩種八哥近年的族群差距很大，而表一提供了進一步思考原因的重要線索。
    answer: 表二告訴我們兩種八哥近年的族群差距很大，而表一提供了進一步思考原因的重要線索。
  - type: free_text
    prompt: 3.你發現了嗎，讀第三段不能只看表二，還要回頭看表一，是因為：
  - type: guide
    text: ①表二讓我們知道哪一種八哥變多、哪一種變少；表一幫助我們思考為什麼會這樣。
  - type: guide
    text: □②表二幫助我們思考為什麼會這樣；表一讓我們知道哪一種八哥變多、哪一種變少。
  - type: figure
    referent: table
    asset: table1.json
    bind_paragraph: 練習四：第四段 vs 表一、二
  - type: guide
    text: 練習四：第四段 vs 表一、二
  - type: guide
    text: 步驟❶：先讀文字——抓出這段的重點
  - type: single
    prompt: 1.這段要你「回到表一」回答什麼問題？（單選）
    options:
    - 八哥的外形與習性
    - 根據表一試著推論兩種八哥族群變化的原因
    answer: 根據表一試著推論兩種八哥族群變化的原因
  - type: guide
    text: 步驟❷：整合多種材料——比較、連結各項資訊之間的關係
  - type: free_text
    prompt: 1.請根據表一，並結合第四段提到的都市化背景，試著推論兩種八哥族群變化的原因？
  - type: passage
    source: unknown
    paragraphs:
    - 白尾八哥  較不怕人  ，又   較會利用人造設施築巢  ，適應都市環境較強，所以在都市化的環境中比較容易生存，族群逐漸增加；
    - 臺灣冠八哥  較怕人，又  較少利用人造設施築巢   ，適應都市環境較弱，因此族群逐漸減少。
  - type: self_check
    items:
    - 我會找出文章裡要看圖表的地方。
    - 我會從圖表中找到和文字對應的訊息。
    - 我會讀圖、表的註解，也知道註解的功能。
    - 我會把文圖表合起來想，判斷它們的重點。
    - 我知道圖片和表格的功能不同：本文圖片先提供整體印象，表格能幫助我把訊息看得更清楚。
