spotlight:
  lesson: G7-SL9
  strategy_name: 表達看法-4F思考法
  strategy_type: express_opinion
  blocks:
  - type: guide
    text: "反思的能力很重要，它能幫助我們發現自己的問題，進而思考：我可以怎麼做？\n    作者看到吐瓦魯的報導也進行了反思，他想到臺灣也受到全球暖化的威脅，認為對抗全球暖化是全人類的共同議題。\n\
      \    反思很重要，但該怎麼做呢？反思也可以透過步驟來練習喔！接下來我們要介紹「4F反思法」。\n1.事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。\n\
      2.感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？\n3.發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？\n\
      4.未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？"
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 1.請你利用課文來練習4F反思法，幫忙填入「未來（Future）」的格子內，能有什麼行動預防全球暖化吧。
  - type: free_text
    prompt: 2.報導反思挑戰：請閱讀以下新聞，並練習4F反思法完成表格。
  - type: guide
    text: 世展會調查　缺糧後，兒童淪為童婚、童工的風險大増
  - type: guide
    text: 陳芝瑄／臺北報導(2024/6/20)
  - type: guide
    text: 世界展望會六月發布的「缺糧」報告指出，在六個亟需協助的國家中，許多家庭每天只能吃一頓飯；每三名受訪者中有兩人因沒東西吃而必須餓肚子入睡；更有46%的家庭一整天沒進食。此外，救援工作者觀察到，兒童淪為童婚、性暴力和兒童販運的風險大幅增加。
  - type: guide
    text: 報告指出，兒童遭受更多暴力、忽視或虐待；烏干達一個地區有75%的難民，家中有懷孕的未成年女兒，因為她們被迫童婚，或從事性交易以換取食物；阿富汗更有97%的父母因糧食不足，只好提前把養不起的女兒嫁掉。在烏干達，有些父母因為孩子沒東西吃，壓力過大而輕生。
  - type: guide
    text: 世界展望會「全球飢餓回應方案」總監指出，氣候變遷、衝突和新冠疫情，讓3800萬人距離餓死僅剩一步之遙，其中1900萬是兒童，被送去工作或結婚，甚至不堪缺糧之苦而想結束生命，人道救援正努力遏止悲劇發生。
  - type: guide
    text: <本文節選自國語日報網路新聞https://reurl.cc/bVLQzy>
  - type: free_text
    prompt: 3.生活反思挑戰：日常生活中親身體驗或看到的事件，也可以運用4F反思法，寫出一件你最近遇到或看到的事件，並進行反思、完成下列表格。
