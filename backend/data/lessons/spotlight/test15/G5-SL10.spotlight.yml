spotlight:
  lesson: G5-SL10
  strategy_name: 推論策略-從言行推論人物特質
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: '1.如何推論人物特質：我們可以從一個人說的話、做的事來推論人物特質。

      2.閱讀時讀出角色的特質，可以幫助我們理解與預測故事的情節喔！'
  - type: free_text
    prompt: 1.說的話 文章中，主角小花說了兩句話：
  - type: single
    prompt: (1)從（□第句   □第句），我推論小花是一個   聰明   的人，因為她做事情有方法，介紹同學離鄉補習，會考慮與解決同學的需求。
    options:
    - 第句
    - 第句），我推論小花是一個
    - 聰明
    - 的人，因為她做事情有方法，介紹同學離鄉補習，會考慮與解決同學的需求。
    answer: 聰明
  - type: single
    prompt: (2)從（□第句  □第句），我覺得她是一個    懂得感恩      的人，因為她考上公費生，第一時間打電話給妹妹，感謝妹妹的幫助。
    options:
    - 第句
    - 第句），我覺得她是一個
    - 懂得感恩
    - 的人，因為她考上公費生，第一時間打電話給妹妹，感謝妹妹的幫助。
    answer: 懂得感恩
  - type: free_text
    prompt: 2.做的事 文章中，主角小花的行為或反應
  - type: guide
    text: 從 、、 的行為，我覺得小花是一個  努力  的人，因為她花了很多時間打工賺錢，都不休息。
  - type: guide
    text: 從 、　  的行為，我覺得小花是一個  勇敢  的人，因為
  - type: guide
    text: 她不甘於現狀，願意去爭取自己的益                 。
  - type: single
    prompt: 3.文章最後一段提到：「小花和姊姊都努力過人，但是教育決定了他們人生進路的差異。」請問作者對於「教育」抱持著怎樣的信念或想法？
    options:
    - 教育可以脫離貧窮
    - 努力是教育的開始
    - 教育帶來改變的希望。
    answer: 教育可以脫離貧窮
