spotlight:
  lesson: G6-SL8
  strategy_name: 摘要策略-從結構找小主題與細節
  strategy_type: summary_structure
  blocks:
  - type: guide
    text: 如何找出「小主題」以及小主題下方的「舉例與重要細節」呢？
  - type: guide
    text: 以第二段為例
  - type: free_text
    prompt: 1.找出小主題：本課小主題可以直接從段落前的小標題找到。通常小主題會出現在標題或首句。小標題是該段的核心概念，有助於找到段落內的舉例及重要細節。
  - type: guide
    text: 第一個小標題是：用歌聲求偶。
  - type: free_text
    prompt: 2.找出小主題（用歌聲求偶）下方的舉例與重要細節
  - type: guide
    text: 潮濕溫暖的夏夜，嘓嘓嘓、嘓嘓嘓，雄蛙奮力的在池塘裡展現歌喉，只為求得雌蛙的青睞，以完成繁衍的天職。雄蛙求偶的鳴叫聲響遍池畔，也引來競爭對手的爭強鬥勝。是否能順利成為心儀對象的「青蛙子」？雄蛙們可要各憑本事才行。
  - type: free_text
    prompt: (1)找出舉例：可以發現整段都在描寫的動物是青蛙，跟動物有關的詞彙有雄蛙、雌蛙和青蛙，這時要選擇哪個最貼近「用歌聲求偶」的小主題呢？是誰用歌聲在求偶呢？【☐雄蛙  ☐雌蛙】（單選）
  - type: free_text
    prompt: (2)整理細節內容：再來整理與「歌聲求偶」有關的訊息
  - type: guide
    text: 嘓嘓嘓、展現歌喉、鳴叫聲發出嘓嘓嘓的鳴叫聲，展現歌喉。
  - type: free_text
    prompt: (3)條列整理訊息：最後把舉例與細節整理如下
  - type: guide
    text: 雄蛙  — 發出嘓嘓嘓的鳴叫聲，展現歌喉。
  - type: guide
    text: 換你試試看：第三段
  - type: guide
    text: 春天來臨，住在枯木洞裡的五色鳥，開始粉墨登場，準備在演唱會一展歌喉。牠身穿綠衣裳，頭戴彩色帽，站在茂密枝葉搭起的舞台上，揭開演唱會的序幕。五色鳥發出喀、喀、喀喀喀喀……的求偶叫聲，盡情的歌唱。牠獨特的聲音，吸引愛慕者，為延續下一代而準備。
  - type: free_text
    prompt: "1.先找小主題\n  本段的小標題也是： 用歌聲求偶。"
  - type: free_text
    prompt: 2.找出舉例和細節
  - type: free_text
    prompt: (1)找出舉例：整段都在描寫的動物是【  五色鳥  】
  - type: free_text
    prompt: (2)整理細節內容：發出【  喀喀喀  】的求偶叫聲
  - type: free_text
    prompt: (3)條列整理訊息
  - type: guide
    text: 五色鳥  —      發出喀喀喀的求偶叫聲。
  - type: free_text
    prompt: 3.整理小主題內兩段訊息
  - type: guide
    text: 雄  蛙  — 發出嘓嘓嘓的鳴叫聲，展現歌喉。
  - type: guide
    text: 五色鳥   —  發出喀喀喀的求偶叫聲。
  - type: guide
    text: 挑戰題，請找出第六段的「小主題」及小主題下方的「舉例與重要細節」
  - type: free_text
    prompt: 1.先找出小主題：本課小主題可以直接從段落前的小標題找到，小標題是該段的核心概念，有助於找到段落內的舉例及重要細節。
  - type: guide
    text: 小標題是：【 以氣味傳達真情意 】
  - type: free_text
    prompt: 2.找出小主題下方的舉例與重要細節
  - type: guide
    text: 花園裡，田野間，同樣的翩翩飛舞，飛蛾卻沒有蝴蝶那樣的漂亮迷人；牠們生命雖然短暫，總能圓滿完成繁殖後代的重責大任。雌蛾能分泌一種特別的氣味，利用空氣擴散傳布，讓在遠方的雄蛾，感受到她真摯的情意，願意千里迢迢的飛奔前來相會，完成終身大事。
  - type: free_text
    prompt: '(1)找出舉例：整段都在描寫的動物是【  雌蛾  】。

      （若動物有多種詞彙，可思考是誰「用歌氣味求偶」呢？）'
  - type: free_text
    prompt: (2)整理細節內容：【  分泌特別的氣味，吸引雄蛾       】
  - type: free_text
    prompt: (3)條列整理訊息：
  - type: guide
    text: 雌蛾         —     分泌特別的氣味，吸引雄蛾
  - type: free_text
    prompt: (4)加上小主題，將訊息寫清楚
  - type: guide
    text: 用氣味求偶   —  雌蛾    —    分泌特別的氣味，吸引雄蛾
  - type: guide
    text: 如果不小心卡關了，可以回到前一頁，仔細閱讀步驟說明，然後再試試看，加油！
