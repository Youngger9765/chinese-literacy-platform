spotlight:
  lesson: G7-SL19
  strategy_name: 自我提問-詰問作者的步驟
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: '本課讀書會討論的主題是「作者(朱自清)為什麼選擇寫背影?」文中的老師、同學針對這個問題，不斷的深入討論，像這樣對作者的「寫作目的」、「寫作手法」以及「文章內容」提出問題，這個策略就是「詰問作者」。

      　　詰問作者就是向作者提問。不停的向作者提問能讓我們在閱讀文章時，不再只是被動的接收訊息，而是有意識的主動思考，進而幫助我們更加深入的理解文章。

      　　那麼詰問作者該怎麼做呢？可以參考本課讀書會的作法：

      1.仔細閱讀文章：可特別注意文中的人物、情節、背景和文字運用。

      2.提出問題：比如問作者寫作目的或作者的寫作手法，以本課讀書會為例，作者是林玫伶喔。

      (1)作者寫作目的：詢問作者這段文字或文章「這樣子寫的目的或理由是什麼」，像是：

      ⚫作者寫「讀書會」這篇文章的目的是什麼？

      (2)作者寫作手法：詢問作者如何安排情節、使用修辭或描寫方式等問題，像是：

      ⚫作者詳細寫出學生對話的理由是什麼？

      ⚫作者為什麼要對讀書會討論過程做這麼詳細的描寫呢？(描寫方式)

      3.尋找答案：從文章中尋找答案，也可以查詢相關資料，或與他人討論。'
  - type: guide
    text: ◎小試身手：
  - type: passage
    source: unknown
    paragraphs:
    - (一)問題分辨挑戰：下列問題有的是問寫作目的，有的是問寫作手法；請將問寫作目的󠇢的寫A，問寫作手法的寫B。
