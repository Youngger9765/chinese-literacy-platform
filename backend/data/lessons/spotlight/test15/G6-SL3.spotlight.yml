spotlight:
  lesson: G6-SL3
  strategy_name: 解決問題-以實驗觀察找答案
  strategy_type: scientific_inquiry
  blocks:
  - type: guide
    text: "「昆蟲會思考嗎？」這是一個科學問題。回答科學問題時要根據客觀的事實來做合理的判斷，避免僅憑自己的感覺來回答，科學家常常是蒐集資料後。\n  \
      \   這篇科學文本的課文，是用「提出問題—觀察證據—得出結論」的結構來書寫，閱讀這類型的文章時，你要鎖定研究問題，看到各樣證據時，都要自問「這個能回答問題嗎？」，就更容易瞭解這篇文章了。"
  - type: guide
    text: 任務：請你依據提出的科學問題，根據觀察到的證據，找到結論。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 空氣是否佔有空間？
    options:
    - 空氣佔有空間。
    - 空氣不佔有空間。
    answer: 空氣佔有空間。
  - type: free_text
    prompt: 請舉出其他你知道的例子，證明空氣佔有空間。
  - type: single
    prompt: 動物會不會分工合作呢？
    options:
    - 動物會分工合作。
    - 動物不會分工合作。
    answer: 動物會分工合作。
  - type: free_text
    prompt: 請舉出其他你知道的例子，證明動物會分工合作。
