spotlight:
  lesson: G6-SL14
  strategy_name: 自我提問-問重要的問題
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: '前一課我們學到了：閱讀時，怎麼把好奇或有疑惑的地方，轉成問題，對自己發問。這一課我們要來學，閱讀時，怎麼問出重要的問題。

      1.什麼是重要的問題？

      (1)文章的重要概念，有助於理解文章的問題。

      (2)重要的問題因文章類型而異，例如本課是記人文章，「主角背景、奮鬥歷程、成就、人物特質」是重要概念。

      2.什麼是不重要的問題：如果問題的答案是太瑣碎、太細節的訊息，刪除也不會影響理解文章，就是不重要的問題。

      3.以下以本課「植物獵人-洪信介」為例，「重要」和「不重要」問題各舉一例

      4.怎麼問出重要的問題？

      (1)直接問出重要問題

      (2)如果無法直接提出重要問題，可以先找出「文章的重點」，再轉換成「問題」喔！例如下表：'
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 判斷題：辨別重要和不重要的問題，重要的打，不重要的畫。
  - type: guide
    text: 找出重要問題後，請和你的同學分享，為什麼你覺得那是重要的問題。
  - type: guide
    text: （ ）(1) 洪信介具備哪些成為植物獵人的條件？
  - type: guide
    text: （ ）(2) 黃喉貂是什麼動物？
  - type: guide
    text: （ ）(3) 洪信介要到植物保種中心工作，遇到什麼問題？
  - type: guide
    text: （ ）(4) 洪信介考上哪個學校？
  - type: guide
    text: （ ）(5) 洪信介最重要的成就是什麼？
  - type: guide
    text: 換你做，請你試試看，提出一個重要的問題
  - type: free_text
    prompt: (1)我能直接提出重要的問題：
  - type: free_text
    prompt: (2)如果不能直接提出重要的問題—可以先找出「文章重點」，再轉換成「問題」。下表已經先找到文章重點了，請你試著把它轉換為「問題」喔！
  - type: guide
    text: 下表已經先找到文章重點了，請你試著把它轉換為「問題」喔！
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
