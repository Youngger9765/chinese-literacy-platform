spotlight:
  lesson: G5-SL7
  strategy_name: 推論策略-觀點找支持理由
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: single
    prompt: 一、確認觀點：根據本篇文章，作者（周思齊）的觀點是下列何者？（單選）
    options:
    - (1)大學畢業，周思齊進入職棒，但第三年才當上先發球員
    - (2)每次出外比賽，住進飯店後，周思齊總是膽戰心驚
    - (3)他沒有妥協，也不願違背自己的良心，及辜負他最愛的棒球
    - (4)心中的信念和堅持，能幫助我們不走錯方向
    answer: (1)大學畢業，周思齊進入職棒，但第三年才當上先發球員
  - type: single
    prompt: 二、分析觀點：根據上題答案，本文的觀點有兩個重點，為了支持這個觀點，支持理由應該提及哪些事情？（複選）
    options:
    - 他的膽戰心驚
    - 他的信念和堅持
    - 進入職棒的原因
    - 他的球迷
    - 他沒有走錯方向
    - 他比賽住進的飯店
    - 他當上先發球員的經歷
    answer: 他的膽戰心驚
  - type: guide
    text: 三、從觀點找支持理由：根據上題分析，下列哪些事件或細節可以支持文章觀點中的兩個重點？（可複選）
  - type: free_text
    prompt: 1.支持觀點重點1：「他有信念和堅持」
  - type: guide
    text: '□(1)沒有違背自己的良心和辜負他最愛的棒球、支持他的球迷

      □(2)「每場比賽我都是全力以赴」的自我要求

      □(3)高中時英文畢業考只考 26 個英文字母的大、小寫'
  - type: free_text
    prompt: 2.支持觀點重點2：「他沒有走錯方向」
  - type: guide
    text: □(1)拒絕黑道提出的五、六百萬簽約金與打假球的要求
  - type: guide
    text: □(2)在假球案中成為唯三沒有嫌疑的人之一
  - type: guide
    text: □(3)考上師大臺灣史研究所，並創辦基金會
  - type: guide
    text: 四、組合應用：確認完文章的觀點與支持理由後，可以用以下的結構整理作者想法。閱讀以下選項與結構，並根據文意填入A, B, C, D。
  - type: guide
    text: (A)他拒絕黑道巨額誘惑，在假球案中保持清白
  - type: guide
    text: (B)信念和堅持能幫助我們不走錯方向
  - type: guide
    text: (C)他不違背良心，在每場比賽全力以赴，並獲得肯定
  - type: guide
    text: (D)持續努力並堅守信念，才能走完長久的職業生涯
  - type: guide
    text: ◎作者想法：作者認為(  Ｂ  )。首先，(  Ａ  )，展現了面對誘惑時的正直與勇氣。其次，(  Ｃ  )，證明了長期堅持才能成就穩定的表現。這些事情都顯示，他之所以能成功，是因為(  Ｄ  )。
  - type: single
    prompt: 五、延伸練習：本篇觀點的支持理由，也可以支持下列哪一個觀點？(複選)
    options:
    - (1)拒絕誘惑比追求短期成就更重要
    - (2)學習新知識能拓展人生的可能性
    - (3)良好的學校環境能培養專業運動員
    - (4)堅持原則才能在困境中保持清白
    answer: (1)拒絕誘惑比追求短期成就更重要
