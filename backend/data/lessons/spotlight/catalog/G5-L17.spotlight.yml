    options:
    - 金屬探測器的成本
    - 非洲巨鼠的成本
    - 金屬探測器的方便性
    answer: 非洲巨鼠的成本
  - type: single
    prompt: "再來，請你看著表1，回答底下的單選題\n(4)「在泥濘、雜草叢生處無法工作」是在表達什麼？"
    options:
    - 金屬探測器的方便性
    - 非洲巨鼠的安全性
    - 非洲巨鼠的方便性
    answer: 金屬探測器的方便性
  - type: single
    prompt: "小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(1)哪一種掃雷方式比較安全？"
    options:
    - 金屬探測器
    - 非洲巨鼠
    answer: 非洲巨鼠
  - type: single
    prompt: "小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(2)哪一種掃雷方式效能比較好？"
    options:
    - 金屬探測器
    - 非洲巨鼠
    answer: 非洲巨鼠
  - type: single
    prompt: "小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。\n(3)哪一種掃雷方式比較不方便？"
    options:
    - 金屬探測器
    - 非洲巨鼠
    answer: 金屬探測器
  - type: single
