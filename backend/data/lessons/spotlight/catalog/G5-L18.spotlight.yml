spotlight:
  lesson: G5-L18
  strategy_name: 摘要策略-問題.解決結構找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: '這篇故事是一篇說明文，講「魚兒迴游時被閘門擋住」的解決過程。故事從第四段開始有明顯的「問題、解決、結果」結構。但閱讀時，如何找到文章中的問題、解決、結果呢？我們可以用一些線索來做判斷喔！

      我們來練習用兩步驟（❶找元素對應的段落 ❷找重點句）找「問題、解決、結果」。'
  - type: guide
    text: 一、找「問題」
  - type: guide
    text: ※祕訣：「問題」描述一個「需要解決的壞事或困難」。
  - type: free_text
    prompt: ❶找段落：
  - type: passage
    source: unknown
    paragraphs:
    - 「問題」在哪個段落？（請在□打勾，單選）
    - 【□段1、2、3　　　段4　　　　□段5　　】
    - 「問題」通常出現文章的前面，但這篇文章花了比較長的篇幅說明故事的背景。第四段才是描述「問題」，是在描述魚兒遭遇的問題。
  - type: free_text
    prompt: ❷找重點句：
  - type: passage
    source: unknown
    paragraphs:
    - 本文第四段有三個句子，都在描述「壞事」，請判斷哪一個句子是「重點句」。(請在□打勾，三選一。)
    - 句1：但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。
    - □句2：當萬頭鑽動的魚兒卡在閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖的時機，導致魚寶寶的數量減少，影響整個魚群的生存。
    - □句3：為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 這段有3個句子，3句都是描述「壞事」，第一句是重點句，直接說明魚兒的困難。第二句是補充說明，第三句解決這個問題的舊方法。所以我留下第一句，並把第一句畫線。
  - type: guide
    text: 二、找「解決」
  - type: guide
    text: ※祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
  - type: free_text
    prompt: ❶找段落：
  - type: passage
    source: unknown
    paragraphs:
    - 「解決」在哪個段落？（請在□打勾，單選）
    - 【□段4　　段5　　□段6　　】
  - type: free_text
    prompt: ❷找重點句：（第5段）
  - type: passage
    source: unknown
    paragraphs:
    - 請你先判斷哪些句子是描述「有人想出辦法或行動的句子」的重點句。（請在□打勾，四選一）
    - 句1：一位名叫馬克·范赫斯的生態學家為了解決這個問題，便和一群工程師、科學家合作，在荷蘭烏特勒支市的運河設計了「魚門鈴」。
  - type: guide
    text: □句2：他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。
  - type: guide
    text: □句3：這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按鈕。
  - type: passage
    source: unknown
    paragraphs:
    - □句4：運河管理員收到訊息後，便會開啟閘門，讓魚兒順利通過。
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 這段4個句子都是描述為了解決魚兒被閘門擋住的問題，做了什麼事。第一句是重點句，第二～四句是補充說明「魚門鈴」怎麼用。
  - type: guide
    text: 三、找「結果」
  - type: passage
    source: unknown
    paragraphs:
    - 祕訣：「結果」通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變。
  - type: free_text
    prompt: ❶找段落：
  - type: guide
    text: 「結果」在哪個段落？（請在□打勾，單選）
  - type: guide
    text: 【□段4　　□段5　　段6　　□段7　　】
  - type: free_text
    prompt: ❷找重點句：（第6段）
  - type: guide
    text: 請你先判斷哪個句子是描述「行動後帶來的改變」的重點句。（請在□打勾，二選一）
  - type: guide
    text: □句1：「魚門鈴」上線後，效果超乎預期！
  - type: passage
    source: unknown
    paragraphs:
    - 句2：從2019年啟動以來，幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 這段2個句子都是描述裝了「魚門鈴」之後，帶來什麼改變。第二句是重點句，因為第二句的概念才完整。成果（改變）包括魚兒順利通過閘門＋運河生態變健康。
  - type: guide
    text: 一、請你自己檢查以下3項，確定自己是否會抓重點了
  - type: guide
    text: 二、如果三項都打勾，恭喜你，你已經學會找文章「問題、解決、結果」的方法，這對你理解文章、掌握文章重點，都有很大的幫助哦。你超厲害的！
  - type: passage
    source: unknown
    paragraphs:
    - 這是一篇問題解決結構的文章，閱讀聚光燈你已經學會怎麼用線索來找重點，接著，我們就來整理本課的重點嘍！
  - type: fill_table
  - type: self_check
    items:
    - 我學到怎麼找出「問題」，知道故事一開始面臨什麼困境。
    - 我學到怎麼找出「解決」，了解主角/相關人物做了什麼來解決問題。
    - 我學到怎麼找出「結果」，說明解決行動帶來了哪些具體改變或成果。
