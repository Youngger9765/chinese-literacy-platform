spotlight:
  lesson: G6-L2
  strategy_name: 寫作手法：譬喻-從譬喻推論作者感受
  strategy_type: emotion_inference
  blocks:
  - type: guide
    text: "《譬喻：以大家熟悉的事物(A)去說明或凸顯另一件事物(B)的特質 》\n譬喻是一種寫作常見的手法，它和「轉化」與「誇飾」一樣，都是運用聯想、想像力的方式，來連結讀者普遍的經驗，以引起讀者共鳴，讓讀者感同身受。\n\
      例１：「他的笑容像太陽。」→以大家熟悉的「太陽」去凸顯他的笑容帶給人溫暖、耀眼的感受。\n例2：「他的笑容像盛放的花。」→以大家熟悉的「盛放的花」去凸顯他的笑容帶給人美好、燦爛的感受。\n\
      \    使用譬喻的手法時，句子常會有「好像」、「像」、「彷彿」、「如（同）」、「一樣」、「A（像）是B」等關鍵字詞，而文章使用譬喻之處，也是作者投入想像和著重感情之處，因此閱讀時我們可以留意譬喻的句子，推論作者主要想傳達的心情或意涵。"
  - type: guide
    text: ◎ 小試身手：
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: null
  - type: single
    prompt: 例1「他的笑容像太陽」主要想傳達什麼感受？
    options:
    - 溫暖、耀眼
    - 明亮
    - 熱情
    answer: 溫暖、耀眼
  - type: single
    prompt: 例2「他的笑容像盛放的花」主要想傳達什麼感受？
    options:
    - 美好、燦爛
    - 芬芳
    - 嬌豔
    answer: 美好、燦爛
  - type: single
    prompt: 下列何者不是譬喻句中常見的關鍵字詞？
    options:
    - 好像
    - 像
    - 因為
    - 彷彿
    answer: 因為
  - type: single
    prompt: 作者在文章中使用譬喻手法，主要目的是什麼？
    options:
    - 讓讀者更容易理解複雜的概念
    - 凸顯事物特質並傳達作者的情感或意涵
    - 增加文章的字數
    - 讓句子聽起來更優美
    answer: 凸顯事物特質並傳達作者的情感或意涵
