spotlight:
  lesson: G5-L8
  strategy_name: 推論策略-認識推論人物特質策略
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: 我們可以從一個人說的話、做的事來推論人物特質。閱讀時，讀者若能從文中線索推論人物特質，就能對文章有更好的掌握。
  - type: free_text
    prompt: 1.我們可以從課文中楊勇緯做的事、說的話和他呈現的態度，來推論他的人物特質是    自律       。
  - type: free_text
    prompt: 2.我們也可以把它整理成表格。
  - type: match
    match_type: trait_inference
    col_left: 文中線索
    col_right: 人物特質
    rows:
    - left: "◤勤於訓練，每天都提早三、四十分鐘到校練習。◢ \n(做的事)"
      right: 自律
    - left: ◤老師給他課表，他就按部就班去做。◢          (做的事)
      right: 自律
    - left: ◤飲食克制，身體保持最佳狀態。◢             (做的事)
      right: 自律
    - left: ◤隨時用工整的字記錄所學。◢                    (做的事)
      right: 自律
  - type: free_text
    prompt: 3.小試身手：從下面這兩個線索，你認為楊勇緯是一個怎麼樣的人？並勾選出判斷的方式。
  - type: match
    match_type: trait_inference
    col_left: 文中線索
    col_right: 人物特質
    rows:
    - left: '「賽前，我學會把注意力全部放在比賽上，讓身邊的干擾降到最低，專注在當下。先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼，好讓自己多一點機會。」

        ( □做的事  說的話 )'
      right: 強韌的 心理素質
    - left: "「失敗讓你更成長，讓你知道自己哪裡做不好，在下一個階段更上層樓。」 \n( □做的事 說的話 )"
      right: 強韌的 心理素質
