spotlight:
  lesson: G8-L14
  strategy_name: 解決問題-科學探究法
  strategy_type: scientific_inquiry
  blocks:
  - type: guide
    text: '上一課《構樹》告訴我們：有些說明文像科學偵探故事。作者先提出「問題」，再提出「假設」，接著用證據「驗證假設」，最後下「結論」；閱讀時要看懂「證據是否能支持（或推翻）假設」。

      這課我們要學一樣的策略，用4個步驟把「解決科學問題的過程」整理清楚。你還記得這些步驟的關鍵概念或提示嗎？請連連看。'
  - type: guide
    text: 一、找問題→找假說→找驗證→下結論
  - type: guide
    text: 表：本課的科學解決四步驟：找問題→找假說→找驗證→下結論
  - type: guide
    text: 二、應用（把結論帶回現場：問題→解決→結果）
  - type: passage
    source: unknown
    paragraphs:
    - 前面我們用科學步驟找出「低溫能催花」。再來是把結論應用到現場。但農民遇到了新的問題，請根據課文寫出他們如何解決問題。
  - type: free_text
    prompt: 1.問題：    花房面積大，冷氣電費成本太高
  - type: free_text
    prompt: 2.解決：
  - type: guide
    text: ①把平地蘭花送到高海拔蘭園降溫
  - type: guide
    text: ②   在高海拔地方設置蘭園
  - type: guide
    text: ③   用深層海水降溫
  - type: free_text
    prompt: 3.結果：用大自然降溫，降低電費負擔，也能順利催花。
  - type: guide
    text: □①我能用四步驟整理文章：找問題→找假說→找驗證→下結論
  - type: guide
    text: □②我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
