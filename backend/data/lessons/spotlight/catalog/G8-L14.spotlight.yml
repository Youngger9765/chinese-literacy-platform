spotlight:
  lesson: G8-L14
  strategy_name: 閱讀聚光燈 - 比較多元觀點
  strategy_type: scientific_inquiry
  blocks:
  - type: guide
    text: 本練習將引導你學習如何比較多元觀點，找出議題的核心與主旨。
  - type: free_text
    prompt: 這篇文章在談「哪個議題／爭議」？
  - type: free_text
    prompt: 反對遷移的主張是什麼？
  - type: single
    prompt: 反對遷移的理由是什麼？
    options:
    - 遷移花費高、而且把動物搬走治標不治本，無法改善人與自然的衝突。
    - 遷移到新地區，可能會有新的風險（食物不足、地形植被不合、其他掠食者/競爭者、疾病、人為風險）。
    answer: 遷移到新地區，可能會有新的風險（食物不足、地形植被不合、其他掠食者/競爭者、疾病、人為風險）。
  - type: single
    prompt: 反對遷移的主要作法是什麼？
    options:
    - 讓原地變得安全：建廊道、車輛減速、犬隻管理、補償與雞舍防護等。
    - 加強石虎野放前的訓練與追蹤監測，讓牠更會避開危險、提高存活率。
    answer: 讓原地變得安全：建廊道、車輛減速、犬隻管理、補償與雞舍防護等。
  - type: free_text
    prompt: 支持遷移的主張是什麼？
  - type: single
    prompt: 支持遷移的理由是什麼？
    options:
    - 棲地已被切割成孤島，石虎移動有危險。
    - 危險來自人類活動，人類有責任先把風險降到最低。
    - 遷移後就能一勞永逸，石虎不必再面對任何威脅。
    answer: 棲地已被切割成孤島，石虎移動有危險。
  - type: single
    prompt: 支持遷移的主要作法是什麼？
    options:
    - 先在原棲地加強巡護與宣導，降低人為干擾，讓石虎自然擴散就好。
    - 把石虎移到較安全、人為干擾較少、管制更嚴格的區域。
    answer: 把石虎移到較安全、人為干擾較少、管制更嚴格的區域。
  - type: single
    prompt: 在優先順序上，反對遷移與支持遷移的觀點差異為何？
    options:
    - 反對遷移：先移到安全處；支持遷移：先讓原棲地變安全
    - 反對遷移：先讓原棲地變安全；支持遷移：先移到安全處
    answer: 反對遷移：先讓原棲地變安全；支持遷移：先移到安全處
  - type: single
    prompt: 在介入焦點上，反對遷移與支持遷移的觀點差異為何？
    options:
    - 反對遷移：動物搬家；支持遷移：原地環境改善
    - 反對遷移：原地環境改善；支持遷移：動物搬家
    answer: 反對遷移：原地環境改善；支持遷移：動物搬家
  - type: single
    prompt: 在判斷準則上，反對遷移與支持遷移的觀點差異為何？
    options:
    - 反對遷移：怕做錯更危險；支持遷移：怕不做來不及
    - 反對遷移：怕不做來不及；支持遷移：怕做錯更危險
    answer: 反對遷移：怕做錯更危險；支持遷移：怕不做來不及
  - type: free_text
    prompt: 兩派觀點的共同點是什麼？
  - type: free_text
    prompt: 歸納觀點差異：兩派都看重石虎的安全，但是反對派先做______；支持派先做______。
  - type: single
    prompt: 根據你整理的「共同點＋差異」，下列何者最能概括本文主旨？
    options:
    - 介紹石虎的生活習性與野放過程，證明野放一定會失敗
    - 比較遷移與不遷移兩派觀點，凸顯保育決策的兩難與取捨
    - 呼籲政府立刻把所有石虎移到保護區，避免再發生路殺犬殺
    answer: 比較遷移與不遷移兩派觀點，凸顯保育決策的兩難與取捨
