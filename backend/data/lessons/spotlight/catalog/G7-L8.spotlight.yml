spotlight:
  lesson: G7-L8
  strategy_name: 表達看法-PREP架構
  strategy_type: express_opinion
  blocks:
  - type: guide
    text: '你是否有過想要回答問題，卻總是說不清楚的時刻呢？如何清楚表達自己的看法，其實也有小技巧喔！這次我們要練習用PREP的方法來表達，究竟什麼是PREP呢？

      Ｐ是Point（主張）：先說出自己對於這個問題的看法，我覺得…

      Ｒ是Reason（原因）：說明自己這麼認為的原因，因為……

      Ｅ是Example（舉例）：原因的延伸舉例或想法，可以是自己的生活經驗或閱讀到的書籍內容。（有時可省略）

      Ｐ是Point（結論）：再說一次自己對於這個問題的看法，所以…'
  - type: free_text
    prompt: 1.有兩個人根據問題給出了答案，請你幫忙完成表格內容。
  - type: free_text
    prompt: 2.小試身手：你認為書名的「科學怪人」是指怪物，還是那位瘋狂科學家呢？
  - type: guide
    text: 我覺得書名的科學怪人指的       瘋狂科學家           （P主張），
  - type: guide
    text: 因為小說原本的書名是弗蘭坎斯坦這是瘋狂科學家的名字     （R原因），
  - type: guide
    text: 他是這篇文章的主角，小說中文翻譯又是科學怪人         （E舉例），
  - type: guide
    text: 所以        我覺得科學怪人是指瘋狂科學家               （P結論）。
