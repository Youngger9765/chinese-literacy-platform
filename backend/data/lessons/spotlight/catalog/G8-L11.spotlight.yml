spotlight:
  lesson: G8-L11
  strategy_name: 推論策略-從例子推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: "有些文章，作者不會一開始就直接告訴你他的想法，反而先安排一連串看起來只是例子的內容，讓你在閱讀的過程中慢慢發現：\n「啊！原來這些例子，是在為同一個觀點鋪路。」\n\
      所以，讀這類文章時，不能只看到例子，而要學會：\n從作者反覆舉的例子中，推論他真正想表達的觀點。\n例如：\n文章寫道：「陳老師上課時，會用學生的日常生活例子說明重點，\
      \    常停下來確認學生是否聽懂，也會鼓勵學生提出不同想法。」\n請問，從作者反覆舉的例子，作者最可能想表達的觀點是什麼？\n  □ A.陳老師教學經驗豐富\
      \    B.陳老師看重學生的理解\n虎襲事件的真相這篇文章，作者就是透過反覆的例子，來表達想法。我們來練習用❶～❸的步驟「推論（歸納）作者的觀點」。\n\
      \   【❶找例子】【❷找共同點】【❸推論觀點】"
  - type: guide
    text: 一、步驟❶──找例子
  - type: passage
    source: unknown
    paragraphs:
    - A.課文中舉了不少老虎攻擊人例子，但每個例子提供的資訊不一樣。請你依課文把下表的【】填寫完成，為下一步「找共同點」做準備。
  - type: guide
    text: 表  科貝歷年經歷的孟加拉虎食人事件及其描述
  - type: fill_table
  - type: guide
    text: 二、步驟❷──找這些例子的共同點：
  - type: passage
    source: unknown
    paragraphs:
    - 除了虎襲案例，作者還加了一段「為什麼人虎衝突會變多」的解釋。這段並不是例子，但可以用來幫我們推論作者觀點。
  - type: free_text
    prompt: (1)先找出虎襲案例的共同點，作者想讓我們注意什麼？（請勾選，單選）
  - type: passage
    source: unknown
    paragraphs:
    - ①食人虎多有「老病傷」狀態（斷齒、槍傷），使牠們難以正常獵食。
    - □②虎患畫面一次比一次可怕，表示老虎的習性愈來愈凶殘。
    - □③隨著年代的推演，虎患愈來愈猖獗，食人虎愈來愈多。
  - type: free_text
    prompt: (2)再找作者還補充了什麼訊息？（請勾選，單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①老虎因為被追捕和驚擾，變得更兇猛，才會更常闖入村落攻擊人。
    - ②人口變多、村莊擴大，動物棲地被擠壓，人虎生活重疊，衝突增加。
  - type: guide
    text: "三、步驟❸──推論作者觀點\n   根據你在步驟❷「找到的共同點」與「作者補充的訊息」，推論作者最想表達的主要觀點為何？"
  - type: guide
    text: □①老虎吃人主要是天性凶殘，所以最有效的方法是全面獵殺，才能徹底杜絕虎患與恐懼。
  - type: guide
    text: ②老虎吃人不必然是天性；人類傷害與人口擴張讓牠們無路可退，比起獠牙，人類侵佔自然才是更大的隱患。
  - type: guide
    text: □③文章重點在獵人除害與村民自救，藉由獵虎行動提醒人們要果斷防衛，才能守住安全。
  - type: guide
    text: ※ 如果你三項都打勾，恭喜你，
  - type: passage
    source: unknown
    paragraphs:
    - 表示你已經學會用 3 步驟「從例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！
  - type: fill_table
  - type: self_check
    items:
    - 我能找到這些例子提供的重要資訊。
    - 我能把這些例子合起來看，找出它們的共同點。
    - 我能根據例子與共同點，推論出作者想表達的觀點（隱含意義）
