spotlight:
  lesson: G9-L5
  strategy_name: 性別平等-認識性騷擾
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: （一）請判斷下列情況是否為性騷擾，是性騷擾的打，不是性騷擾的打。
  - type: guide
    text: （  ）1.游泳時，教練要求學生穿著緊身泳衣，減少游泳的阻力。
  - type: guide
    text: （  ）2.看診時，醫生要求病人脫衣服檢查。
  - type: guide
    text: （  ）3.瑪麗穿了新衣，旁人出口頭評論她的「身材」。
  - type: guide
    text: （  ）4.安妮的皮膚太細嫩漂亮了，約翰忍不住觸摸了她的後脖子。
  - type: guide
    text: （  ）5.有人溺水，救生員救援時碰到對方的身體。
  - type: guide
    text: （二）下列哪些方法可以保護自己遠離性騷擾？可以的打Ｖ。
