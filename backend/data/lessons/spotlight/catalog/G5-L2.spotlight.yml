spotlight:
  lesson: G5-L2
  strategy_name: 拆詞釋義-藉由拆解字詞來推測詞義
  strategy_type: inference
  blocks:
  - type: guide
    text: '在「L1兵來將擋，水來土掩」中，我們學習到了拆詞釋義的方法，使用這個方法的前提是：1.我不知道這個詞的意思; 2.但我知道組成這個詞的字或詞的意思。這種方法可以幫助我們用字義推論出語詞的意思，現在我們來複習一下「拆詞釋義」的步驟。

      ❶將目標語詞拆解成較小的單位（字或詞）。

      ❷想想看（拆解後的）字或詞的意思。

      ❸把這些字詞的意思合併起來，推論目標語詞的完整詞義。

      ❹放回句子唸一唸，判斷是否合理。

      ❺檢核句子是否合理；如果不合理，可能這個詞不適合這個策略，請嘗試其它的方法（例如上下文推詞義、查字典）。

      例如：「引領」

      ❶拆語詞：「引」和「領」。

      ❷找個別詞義：引引導；領帶領。

      ❸合併(並推論)完整的詞義：引領引導帶領。

      ❹放回句子唸一唸：

      讓我們一起看看這些植物老師如何引領科學家走上創新之路！　　　　　　　　　　　　　　　　　　

      　　　　　　　　　　　　　　引導帶領

      　❺檢核：合理，進行下一個任務　　

      　　　　　  ⃞不合理，嘗試其他方法

      現在就讓我們一起練習看看吧！'
  - type: free_text
    prompt: 1.基礎題：請先圈出目標語詞的個別詞義，再把組成的意思寫下來。
  - type: free_text
    prompt: (1)這種向陽性讓科學家發明了一種能自動調整角度的仿生太陽能板。
  - type: free_text
    prompt: 2.進階題：請先寫出目標語詞的個別詞義，再把組成的意思寫下來。
  - type: free_text
    prompt: (1)這些從大自然中獲取靈感，並應用在人類科技的學問，叫做仿生學。
  - type: free_text
    prompt: 3.挑戰題：請先寫出組成目標語詞的個別字義或詞義，然後推論出語詞的意思。
  - type: free_text
    prompt: (1)探測器可以快速探索廣闊無垠的火星地表。（把「廣闊」當一個詞，不要再拆）注意：拆詞釋義也可能拆成比較小的詞彙，不一定是單一個字。
  - type: free_text
    prompt: ❶拆語詞  ❷找個別詞義
  - type: free_text
    prompt: ❸合併(並推論)完整的詞義：
  - type: free_text
    prompt: ❹放回句子唸一唸
  - type: guide
    text: ❺檢核： ⃞合理
  - type: guide
    text: ⃞不合理，嘗試其他方法
  - type: free_text
    prompt: (2)沙馬雷可以探索危機四伏的災難現場。（把「危機」當一個詞，不要再拆）注意：拆詞釋義也可能拆成比較小的詞彙，不一定是單一個字。
  - type: free_text
    prompt: ❶拆語詞  ❷找個別詞義
  - type: free_text
    prompt: ❸合併(並推論)完整的詞義：
  - type: free_text
    prompt: ❹放回句子唸一唸
  - type: guide
    text: ❺檢核： ⃞合理
  - type: guide
    text: ⃞不合理，嘗試其他方法
  - type: free_text
    prompt: (1)   仿生學        ：是模仿生物特殊本領的一門科學。
  - type: free_text
    prompt: (2)    廣闊無垠     ：形容廣大、寬闊，沒有邊界。
  - type: free_text
    prompt: (3)    盤旋         ：在空中環繞、旋轉；也可以形容在心裡一直存在的心事。例如，分手的痛苦一直在心中盤旋不去。
  - type: free_text
    prompt: (4)    危機四伏     ：到處隱藏著危險。
  - type: free_text
    prompt: (5)    險象環生    ：危險的狀況一直出現。
  - type: free_text
    prompt: (6)    向陽性      ：植物總是面向太陽轉動的特性。
  - type: free_text
    prompt: (7)    引領        ：引導帶領。
  - type: free_text
    prompt: (8)    探測車      ：是一種機器人車輛，用在惡劣或人類難以到達的環境，進行探索和科學研究。
  - type: free_text
    prompt: (9)    內建        ：機器或系統中安裝某種配件或功能。
  - type: free_text
    prompt: (10)    追逐       ：從後面追趕。
  - type: free_text
    prompt: (11)    垂直起降    ：垂直起飛和降落。
  - type: free_text
    prompt: (1)戰場上雖然(  B/Ｅ  )，但將士們仍然無所畏懼，勇往直前。（多選）
  - type: free_text
    prompt: (2)小朋友在操場上互相(  C  )著，嘻嘻哈哈真開心。
  - type: free_text
    prompt: (3)車禍現場的急救行動(  Ｂ/E  )，但最後總算圓滿完成任務。（多選）
  - type: free_text
    prompt: (4)科技的進步(  Ｄ  )我們進入了一個全新的數位時代。
  - type: free_text
    prompt: (5)他的新手機(  A  )了最新的相機功能，拍出來的照片非常清晰。
  - type: free_text
    prompt: (6)站在山頂上，看著(  F  )的綠色草原，心情格外愉快。