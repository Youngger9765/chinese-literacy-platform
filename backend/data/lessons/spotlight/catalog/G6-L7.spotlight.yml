spotlight:
  lesson: G6-L7
  strategy_name: 摘要策略-從故事結構找重點
  strategy_type: summary
  blocks:
  - type: guide
    text: '本課是一篇故事體，主要是描述珍古德長年研究、守護黑猩猩的過程。

      1.使故事體的「結構」一般包含：「故事背景」、「起因」、「經過」、「結果」，讀故事時，若用「故事結構」去讀，讀完後，用故事結構去理解、回想，可以更容易理解、更容易記憶哦！

      故事背景：故事背景通常包含故事發生的時間、地點、人物或相關補充等。如：三隻小豬的故事背景是豬媽媽有三個兒子，他覺得孩子們應該要獨立了。

      起因：引發這個故事的原因。如：三隻小豬故事的起因是媽媽要他們自己蓋房子，故事才會開始。

      經過：故事經歷的過程，通常會有多個歷程，會按照時間、事件發生的先後順序描述。如：豬大哥、豬二哥、豬小弟蓋房子的歷程等

      結果：故事最後的結果。如：偷懶的豬大哥、豬二哥房子被大野狼弄壞，豬小弟認真蓋的房子平安無事。

      2.當文章篇幅很長時，該怎麼找出課文大意呢？

      (1)先區分出這篇文章的「故事體結構」分別是哪些段落。

      (2)找出每一個結構的重點。'
  - type: guide
    text: 一、找到文章裡的故事體結構
  - type: guide
    text: 全文共有９個自然段，它們分別屬於「背景」、「起因」、「經過」、「結果」的故事結構。請你試著在底下空格中，填入各段落的阿拉伯數字，例如第一段，就寫1。
  - type: fill_table
  - type: guide
    text: 二、為每個故事結構做摘要（以「背景」和「起因」為例）
  - type: free_text
    prompt: 1.找出背景的摘要：背景包含故事發生的時間、地點、人物或相關補充。
  - type: passage
    source: unknown
    paragraphs:
    - 珍古德因為家庭經濟因素，高中畢業後沒有繼續念大學。她小時候最喜愛《杜立德醫生非洲歷險記》這本書，書中描述杜立德醫生到非洲，把一群得了瘟疫的猴子拯救出來的故事。她一次又一次的閱讀，把關於非洲、叢林和各種動物的鏡頭，深深的烙在心靈深處，總是夢想著去非洲探險。成年後，工作之餘，她總是在自然歷史博物館裡，大量閱讀有關動物生態的各種書籍。
  - type: free_text
    prompt: (1)本段內容為故事的背景，主要說明珍古德去非洲之前的基本訊息。
  - type: free_text
    prompt: (2)畫出與背景相關的關鍵訊息：
  - type: passage
    source: unknown
    paragraphs:
    - 找關鍵訊息的訣竅是「事情事情，重事不重情！」也就是說，「人事時地、如何、為何」才是重要的關鍵訊息。而文章中關於情緒的描述通常是不重要的，可以刪去。例如，烙在心靈深處、血液近乎沸騰，這些情緒的描寫都可刪除。
  - type: guide
    text: 首先先畫出重要的人物珍古德。
  - type: guide
    text: 本文主題是黑猩猩的守護者，黑猩猩在非洲，因此非洲也是重要的訊息。
  - type: guide
    text: 而杜立德醫生非洲歷險記這本書是讓珍古德想去非洲的一個重要元素，因此也要畫起來。
  - type: free_text
    prompt: (3)串連關鍵訊息：請將關鍵訊息加上連接詞後串連成完整通順的句子。
  - type: guide
    text: 珍古德 小時候 《杜立德醫生非洲歷險記》 夢想著去非洲探險
  - type: passage
    source: unknown
    paragraphs:
    - 【珍古德小時候因為讀了《杜立德醫生非洲歷險記》，所以夢想著去非洲探險。                             】
  - type: free_text
    prompt: 2.找出起因段的摘要：起因是故事開始的原因。
  - type: passage
    source: unknown
    paragraphs:
    - 珍古德二十三歲時，終於有機會帶著簡單的行囊，搭上飛機，從英國投向非洲的懷抱。踏上夢寐以求的土地時，她全身的血液近乎沸騰，覺得像在作夢一般。
    - 珍古德很快的在當地的博物館找到工作。博物館的館長，當時正想找人到岡貝研究黑猩猩。珍古德雖然沒有大學文憑，也沒有受過專業訓練，但是她對動物的熱情，獲得館長的讚賞，讓她得到了這份工作。珍古德立刻寫信，邀請遠在英國的媽媽陪她一起前往岡貝。
  - type: free_text
    prompt: (1)「起因」即故事開始的原因，主要在說明珍古德因為什麼樣的機緣才會去非洲照顧黑猩猩。
  - type: free_text
    prompt: (2)畫出起因關鍵訊息：請你用螢光筆畫出「珍古德去非洲照顧黑猩猩的原因」有關的關鍵訊息。
  - type: passage
    source: unknown
    paragraphs:
    - 她什麼時候去非洲呢？
    - 是怎麼得到照顧黑猩猩的機會呢？
  - type: free_text
    prompt: (3)串連關鍵訊息：請你用自己的話將關鍵訊息串連成完整通順的句子。
  - type: passage
    source: unknown
    paragraphs:
    - 【珍古德23歲時去非洲，在博物館找到工作，館長想找她到岡貝研究黑猩猩。                                    】
  - type: guide
    text: 恭喜你已經寫出這個故事的背景和起因，接下來我們來整理本課的文章重點嘍！
  - type: fill_table
