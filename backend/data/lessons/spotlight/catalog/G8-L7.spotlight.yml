spotlight:
  lesson: G8-L7
  strategy_name: 推論策略-找出一連串因果
  strategy_type: causal_inference
  blocks:
  - type: guide
    text: 推論本文的因果關係-以第四段為例
  - type: guide
    text: 步驟❶──找事件
  - type: free_text
    prompt: 1.問自己：這段文字提到的重要事件或現象？
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 本課第四段談到哪些事？請在□中打勾（複選，提示：有5個答案）
  - type: passage
    source: unknown
    paragraphs:
    - "農民收入低、貧困    利潤分配不公      童工現象\n 代代複製貧窮        無法靠教育翻身    □可可豆採收繁瑣"
  - type: guide
    text: 步驟❷──找因果線索
  - type: free_text
    prompt: 1.問自己：文章中哪些地方透露出「原因結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？
  - type: free_text
    prompt: 2.祕訣：
  - type: guide
    text: A.「有關鍵詞」的文句：
  - type: guide
    text: 表示「原因」的關鍵詞有「因為、由於、為了」等等。
  - type: guide
    text: 表示「結果」的關鍵詞有「因此、所以、導致、造成」等等。
  - type: guide
    text: B.「沒有關鍵詞」的文句：
  - type: guide
    text: 判斷策略：加因果關鍵詞，判斷是否為因果句。
  - type: guide
    text: 前句開頭加「因為」、後句開頭加「所以」，看看整句是否合理。
  - type: guide
    text: ◎小試身手
  - type: guide
    text: A.有關鍵詞：先圈關鍵詞，
  - type: guide
    text: 再判斷這個關鍵詞是表達「因」還是「果」。
  - type: guide
    text: B.沒有關鍵詞：判斷是否為因果句。
  - type: guide
    text: 步驟❸──判斷因果，畫箭頭
  - type: free_text
    prompt: 1.問自己：在找到的因果語句中，「原因」是哪一部分？「結果」是哪一部分？兩者之間如何連接？
  - type: free_text
    prompt: 2.祕訣：畫一個箭頭「→」從原因指向結果，就一目了然了！
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 根據上表，請判斷誰是因？誰是果？並畫正確箭頭方向
  - type: figure
    referent: table
    asset: fig10.png
    bind_paragraph: null
  - type: free_text
    prompt: 3.你發現了上表的兩個特色嗎？
  - type: guide
    text: A：1.2, 3, 4的「因」和「果」，都是「因」在前，「果」在後。
  - type: guide
    text: B：事件1的果，變成了事件2的因；事件２的果，變成了事件３的因，以此類推。
  - type: guide
    text: 步驟❹──連成一連串因果
  - type: free_text
    prompt: 1.問自己：文章中是否有一連串環環相扣的因果關係（因果鏈）？能否把多個因果關係串連起來，形成一個完整的脈絡？
  - type: free_text
    prompt: 2.祕訣：當一件事的「結果」又成為下一件事的「原因」時，就形成了一連串的因果。
  - type: guide
    text: 我們可以把這些環環相扣的關係連接成一個流程圖或概念圖，來幫助理解整體脈絡。
  - type: guide
    text: ◎小試身手
  - type: passage
    source: unknown
    paragraphs:
    - A.以本文為例，第四段隱含著一條重要的因果鏈。上表我們已經找到4個因果關係，接下來我們再看看它們之間的關係，請排序畫出一條因果鏈。
  - type: free_text
    prompt: "❶利潤分配不公    ❷農民收入低、貧困  ❸童工現象 \n❹無法靠教育翻身  ❺代代複製貧窮"
  - type: guide
    text: B.一連串因果（可以寫編號或寫自己看得懂的關鍵詞）
  - type: guide
    text: 利潤分配不公   農民收入低、貧困         童工現象
  - type: guide
    text: 無法靠教育翻身      複製貧窮
  - type: passage
    source: unknown
    paragraphs:
    - C.這條因果鏈告訴我們：不公平的利潤分配引發了一連串社會問題，最終讓農民的貧窮代代相傳。
  - type: guide
    text: 二、挑戰題：推論因果關係-再以第五段為例
  - type: free_text
    prompt: 1.本課第五段也有一組因果鏈，請你用4步驟，畫出第五段的因果鏈。
  - type: passage
    source: unknown
    paragraphs:
    - 氣候變遷 + 農民貧困  砍伐森林  破壞生態　  病蟲害增加 可可產量不穩     農民更貧困
  - type: free_text
    prompt: 2.這條因果鏈告訴我們：環境變遷和農民貧困問題交織在一起，最終讓農民更貧困
  - type: guide
    text: 並用箭頭連接因果關係。
  - type: guide
    text: 連成有意義的脈絡。
  - type: guide
    text: ※如果你5項都打勾，恭喜你，表示你已經學會用 4 步驟「推論一連串因果」！而且你瞭解這個策略對你的幫助。
  - type: passage
    source: unknown
    paragraphs:
    - 這是一篇說明文，閱讀聚光燈你已經學會用「一連串因果」整理事件的脈絡，接著，我們就來整理本課的重點嘍！
  - type: fill_table
  - type: self_check
    items:
    - 我能找出文章中的重要事件。
    - 我能辨識表示原因和結果的關鍵詞。
    - 我能判斷誰是因？誰是果？
    - 我能將相關的因果事件，連出一連串因果。
    - 我發現因果鏈分析，可以幫我把零散的訊息
