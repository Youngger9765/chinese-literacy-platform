spotlight:
  lesson: G9-L1
  strategy_name: 媒體素養與識讀-辨識假新聞
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: 讀完文章後，我們一起來追查凱蒂案吧。
  - type: free_text
    prompt: 1.你從哪裡可以判斷凱蒂案可能是一則假新聞?
  - type: guide
    text: 誇張聳動的標題  太過真實的目擊者數據  匪夷所思的社會冷漠。
  - type: free_text
    prompt: 2.你認為記者可能為了什麼目的寫出這則假新聞呢？（多選）
  - type: guide
    text: 想搶得獨家頭條　 想提高報紙的購買率　 □指責警方辦事不力
  - type: guide
    text: 懶得查證、直接寫故事比較快　 帶有個人立場（想指責社會的冷漠）。
