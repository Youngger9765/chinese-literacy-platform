spotlight:
  lesson: G8-L13
  strategy_name: 解決問題-科學探究法
  strategy_type: scientific_inquiry
  blocks:
  - type: guide
    text: '有些說明文，就像一則「科學偵探故事」。作者會提出他關切的問題，但不會一開始就給你答案，而是帶你走過一段推理歷程，最後得到結論：

      ❶先提出一個研究問題（這問題太重要或太有趣了，是怎麼回事？）

      ❷再提出一個假設／假說（我推測答案可能是..）

      ❸接著收集證據驗證假說（怎麼查？查到什麼？結果符不符合推測？）

      ❹最後得到結論（證據有沒有支持❷的假設？）

      讀這類文章時，重點是看懂：「證據是否能支持（或推翻）假設。」

      「構樹」這篇文章，正是一段帶領讀者進行科學推理的過程。作者以「南島祖先可能從臺灣出發（出臺灣說）」為假說，透過植物──構樹的 DNA證據，一步步檢驗這個想法是否站得住腳。

      我們要練習用底下的4個步驟，看懂一個科學假說是如何被驗證的。

      【❶找問題】【❷找假說】【❸找驗證】【❹下結論】'
  - type: guide
    text: 表：本課的科學討論四步驟：問題→假說→驗證→結論
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: null
  - type: guide
    text: ①考考你，請你以正確的順序寫出本課所提的科學研究四個步驟
  - type: passage
    source: unknown
    paragraphs:
    - 【❶找 問題    】【❷找 假說   】【❸找 驗證   】【❹下結論   】
  - type: guide
    text: □②我能分辨作者提出的假說，並知道它是「需要被驗證的想法」，不是結論。
  - type: guide
    text: □③我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
