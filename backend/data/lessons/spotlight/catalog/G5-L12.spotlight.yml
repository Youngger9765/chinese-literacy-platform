spotlight:
  lesson: G5-L12
  strategy_name: 摘要策略—主題描述結構
  strategy_type: summary
  blocks:
  - type: guide
    text: 這篇文章是一個說明文，請你根據文章的「主題描述結構」，從課文摘要中找出文章的「大主題」、「小主題」和「細節」。
  - type: single
    prompt: 根據課文摘要，這篇文章的「大主題」是什麼？
    options:
    - 雷神索爾的身材
    - 鍛鍊肌肉的方法
    - 減脂與增肌的秘訣
    - 均衡飲食的重要性
    answer: 鍛鍊肌肉的方法
  - type: single
    prompt: 課文摘要中提到的第一個「小主題」是什麼？
    options:
    - 專業且規律的訓練
    - 保持良好的睡眠
    - 均衡的飲食控制
    - 減脂與增肌
    answer: 均衡的飲食控制
  - type: single
    prompt: 關於「均衡的飲食控制」這個小主題，課文摘要中提供了哪些「細節」說明？
    options:
    - 生長激素在睡覺時會快速上升
    - 減少油炸類、甜食的攝取是非常關鍵的
    - 每次練習都要「離開舒適區」
    - 伏地挺身會練到胸肌、三頭肌
    answer: 減少油炸類、甜食的攝取是非常關鍵的
  - type: single
    prompt: 課文摘要中提到的第二個「小主題」是什麼？
    options:
    - 均衡的飲食控制
    - 專業且規律的訓練
    - 保持良好的睡眠
    - 減脂與增肌的順序
    answer: 保持良好的睡眠
  - type: single
    prompt: 關於「保持良好的睡眠」這個小主題，課文摘要中提供了哪些「細節」說明？
    options:
    - 減少油炸類、甜食的攝取
    - 生長激素在睡覺時，濃度會快速上升
    - 不同的訓練方式會增強不同的肌肉
    - 練習的分量要比自己能承受的最大重量再高一點點
    answer: 生長激素在睡覺時，濃度會快速上升
  - type: single
    prompt: 課文摘要中提到的第三個「小主題」是什麼？
    options:
    - 減脂與增肌的毅力
    - 專業且規律的訓練
    - 雷神索爾的身材
    - 離開舒適區的重要性
    answer: 專業且規律的訓練
  - type: single
    prompt: 關於「專業且規律的訓練」這個小主題，課文摘要中舉了哪些「細節」例子？
    options:
    - 炸雞、薯條、可樂、珍奶
    - 生長激素、身體組織成長
    - 伏地挺身、拉單槓、棒式、深蹲
    - 減脂、增肌、毅力、專業
    answer: 伏地挺身、拉單槓、棒式、深蹲
  - type: single
    prompt: 除了具體訓練方式，關於「專業且規律的訓練」，課文摘要還強調了哪個重要的「細節」原則？
    options:
    - 要先減脂再增肌
    - 要保持良好的睡眠
    - 每次練習都要「離開舒適區」
    - 要均衡飲食控制
    answer: 每次練習都要「離開舒適區」
