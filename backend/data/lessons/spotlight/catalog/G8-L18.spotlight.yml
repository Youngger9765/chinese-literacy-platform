spotlight:
  lesson: G8-L18
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  blocks:
  - type: guide
    text: 上篇文章我們已經學過「比較多元觀點」的閱讀策略。這篇文章，我們要再學一次。讀議題類文章，重點是：「找到個別的觀點，再比較不同觀點的差異或相同在哪裡？」最後再推論文章想要說什麼（主旨）。
  - type: guide
    text: 一、確定議題
  - type: passage
    source: unknown
    paragraphs:
    - 這篇文章在談「哪個議題／爭議」（提示：可能出現「爭議」、「該不該」、「是否」等關鍵詞）
  - type: guide
    text: 是否應把石虎「遷移」到較安全的地方
  - type: guide
    text: 二、找觀點
  - type: passage
    source: unknown
    paragraphs:
    - 議題文章像在辯論：每一方都有自己的立場或觀點，並提出有說服力的理由與作法。底下請你整理對這個議題的不同立場／觀點，每個觀點的核心想法與理由、作法是什麼？
  - type: guide
    text: 三、比較觀點差異（用優先順序／介入焦點／判準原則」三個角度）
  - type: guide
    text: 上表我們已經掌握每一方在說什麼；接著請做兩方觀點的比較。
  - type: figure
    referent: table
    asset: fig10.png
    bind_paragraph: null
  - type: guide
    text: ＊歸納觀點差異：
  - type: passage
    source: unknown
    paragraphs:
    - 兩派都看重石虎的安全，但是反對派先做          原地環境改善     ；支持派先做       移動到安全處     。
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: guide
    text: 根據你整理的「共同點＋差異」，下列何者最能概括本文主旨？（單選）
  - type: guide
    text: □①介紹石虎的生活習性與野放過程，證明野放一定會失敗
  - type: guide
    text: ②比較遷移與不遷移兩派觀點，凸顯保育決策的兩難與取捨
  - type: guide
    text: □③呼籲政府立刻把所有石虎移到保護區，避免再發生路殺犬殺
  - type: fill_table
  - type: self_check
    items:
    - 我能找出本文的多元立場，及各自的主張與理由。
    - 我能用「多元觀點對照」推論主旨。
