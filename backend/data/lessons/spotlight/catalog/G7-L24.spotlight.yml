spotlight:
  lesson: G7-L24
  strategy_name: 閱讀策略-跳過卡關，瀏覽全文
  strategy_type: inference
  blocks:
  - type: guide
    text: '上一課我們已經學過：文章出現很多專有名詞，可以先跳過，先往下讀。

      〈未來農夫〉這一課也有不少專有名詞，請你再用上一課學到學到的策略閱讀。這一課我們用第4段和第5段做練習。'
  - type: guide
    text: 〈未來農夫〉
  - type: passage
    source: unknown
    paragraphs:
    - （段4）帶她的大仁哥，是工程師兼「科技農夫」，一邊走，一邊指著牆邊的控制箱與感測器解說：「這裡的水耕蔬菜不是用土種出來的，而是用營養液。輸送營養液的管路都有流量、溫度、酸鹼值、肥料濃度跟電導度的監測；溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。」他說，這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。以萵苣類作物為例，溫度常被控制在約18–25°C、濕度65–75%；營養液的酸鹼值大約維持在5.5–6.5；為了加速光合作用，室內二氧化碳濃度也控制在1000–1500ppm之間。
    - （段5）「你的任務之一，」他把平板遞給她，「就是每天巡檢數據：看哪一區的酸鹼值或肥料配方偏離了、哪一層的溫溼度曲線不正常。問題能自己排除就儘快排除，必要時回報，讓值班同事去校正或調整配方。」宇晴盯著平板看，螢幕上跳動的數字像心電圖，她緊張的心情，忽然有了一種奇妙的踏實感：原來讀圖表、看趨勢、抓異常也是在種菜。
  - type: guide
    text: Step0：30秒快速瀏覽（先抓方向）
  - type: free_text
    prompt: 1.任務：只抓「第4～5段大概在講什麼？」（約10–15字）
  - type: guide
    text: →我猜第4～5段在講：  用高科技方式管理種菜
  - type: guide
    text: Step 1：標示卡點＋先往下讀
  - type: free_text
    prompt: 1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。
  - type: free_text
    prompt: 2.再讀一次第4～5段：看到你圈的地方先略過，直接往下讀，不要停。
  - type: single
    prompt: 3.自我檢核：我有沒有把第4～5段讀完？（單選）
    options:
    - 有
    - 沒有
    answer: 有
  - type: guide
    text: Step 2：抓第4段重點
  - type: single
    prompt: 1.第4段最關鍵的一句話是？（單選）
    options:
    - 這裡的水耕蔬菜不是用土種出來的，而是用營養液。
    - 這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。
    - 溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。
    answer: 這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。
  - type: single
    prompt: 2.第4段你跳過的地方，最像哪一類訊息？為什麼可以跳過？（單選）
    options:
    - 一長串名詞/數字的列舉或舉例，屬於細節，所以先跳過也不影響理解
    - 一段在交代「要做哪些事」的流程內容，跳過也不影響理解
    answer: 一長串名詞/數字的列舉或舉例，屬於細節，所以先跳過也不影響理解
  - type: guide
    text: Step 3：抓第5段重點
  - type: passage
    source: unknown
    paragraphs:
    - 小提示：第5段不像第4段是列舉細節；它在交代「她要做什麼工作」，所以要先抓「在做哪些事」，細節先放過。
  - type: free_text
    prompt: 1.第5段：先抓「宇晴在做什麼」，再抓「作者想告訴你什麼」
  - type: single
    prompt: （1）宇晴主要在做什麼工作？（單選）
    options:
    - 每天巡檢數據，找出偏離與不正常的地方。
    - 螢幕上的數字像心電圖，她感到踏實。
    answer: 每天巡檢數據，找出偏離與不正常的地方。
  - type: single
    prompt: （2）作者想告訴你什麼（這段最重要的一句話）？（單選）
    options:
    - 必要時回報，讓值班同事校正或調整配方。
    - 原來讀圖表、看趨勢、抓異常也是在種菜。
    answer: 原來讀圖表、看趨勢、抓異常也是在種菜。
  - type: single
    prompt: 2.第5段你跳過的地方，是哪一類訊息？為什麼可以跳過？（單選）
    options:
    - 是補充細節；先跳過也不影響理解工作內容。
    - 是主要流程；先跳過就會看不懂她在做什麼。
    answer: 是補充細節；先跳過也不影響理解工作內容。
  - type: guide
    text: Step 4：合併兩段：抓段意
  - type: single
    prompt: 第4、5段想要表達什麼？請選出意思最接近的選項？（單選）
    options:
    - 用很多數字與專有名詞，要讀者學會現代種菜的技術
    - 這家垂直農場非常先進，用系統、科技的方式種菜
    - 這家垂直農場設備昂貴，所以種菜的成本非常高
    answer: 這家垂直農場非常先進，用系統、科技的方式種菜
  - type: single
    prompt: Step 5：覺察與回顧：我學到的方法是什麼？（單選）
    options:
    - 我只要把數字背起來，就算讀懂第4、5段
    - 我只要把每個名詞查懂，就一定能抓到段意
    - 我知道「清單/數字可以先略過」，但「他的工作重點要先抓」
    answer: 我知道「清單/數字可以先略過」，但「他的工作重點要先抓」
  - type: guide
    text: ◎ 我的表現
  - type: free_text
    prompt: (1)  鬱鬱蔥蔥     ：植物長得很茂盛、很濃密，一片綠油油。
  - type: free_text
    prompt: (2)  始終如一   　：始：開始；終：結束。從開始到最後都一樣，沒有改變。常用來形容人的態度或品質從頭到尾都沒有改變。
  - type: free_text
    prompt: (3)  冷冽      ：形容天氣很冷，也可比喻語氣或氣氛嚴厲、刺骨。
  - type: free_text
    prompt: (4)  生機勃勃  　 充滿生命力，看起來很有活力、很旺盛。
  - type: free_text
    prompt: (5)  校正   　 ：修正錯誤，把不準或有偏差的地方調整回正確的狀態。可用於數據、儀器或觀點等。
  - type: free_text
    prompt: (6)  狐疑    　：像狐狸一樣多疑。比喻心中懷疑、拿不定主意。
  - type: free_text
    prompt: (7)    所費不貲      ：所費：花費的錢；不貲：不可計算。形容花費非常高。
  - type: free_text
    prompt: (8)    雞皮疙瘩     ：因為冷、害怕或噁心，皮膚冒出一粒一粒的小突起。
  - type: free_text
    prompt: (9)   徒手     ：不使用工具，只靠雙手做。
  - type: free_text
    prompt: (10)  模擬     ：模仿現實情境進行演練或實驗，用於教學、訓練或研究。
  - type: free_text
    prompt: (1)儘管環境困難，他追求夢想的態度 (  A   )，令人敬佩。
  - type: free_text
    prompt: (2)在使用儀器前，必須先進行(  E   )，以確保精準。
  - type: free_text
    prompt: (3)古蹟的修復 (  F   ) ，還要投入大量的人力，只為喚回歷史的光彩。
  - type: free_text
    prompt: (4)這公司在創新策略的推動下，展現出(  D   )的成長動能，前景看好。
  - type: free_text
    prompt: (5)他(  I   )攀爬台北101大樓，展現出驚人的體能與技術。
  - type: free_text
    prompt: (6)面對這項提議，他露出(  G   )的神情，心中質疑「這有可能嗎？」
  - type: free_text
    prompt: (7)上台前，我先在家(  H   ) 報告一次，練習說話的速度和抑揚頓挫。
  - type: free_text
    prompt: (8)北風雖然(  B   )，發生山難時，消防勇士們仍冒著嚴寒上山搜救。