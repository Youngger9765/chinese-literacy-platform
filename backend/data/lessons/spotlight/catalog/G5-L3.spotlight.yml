spotlight:
  lesson: G5-L3
  strategy_name: 從上下文推測詞義
  strategy_type: inference
  blocks:
  - type: guide
    text: 看文章的時候，有時候會遇到難詞，這時該怎麼辦？拆詞釋義、查字典、問老師…等。除了這些方法，但有時候難詞的解釋，就在課文裡哦！你可以找找看這個難詞的上文或下文，可能就可以猜出這個詞的意思。現在，就讓我們看看如何用「從上下文推測詞義」的步驟吧！
  - type: guide
    text: ❶圈難詞：把不懂的語詞圈起來。
  - type: guide
    text: ❷畫線找上下文線索：讀一讀上下文，把上文或下文跟推測詞義有關的文字畫線。
  - type: guide
    text: ❸推測詞義：由線索推論詞義。
  - type: guide
    text: '❹檢查：把詞義帶回句子讀讀看，判斷是否合理。若不合理，需再回到第二步或用其他的方式找詞義。

      例如：第八段──在工地有人吵起架來，調停的常常是她們。'
  - type: guide
    text: ❶圈難詞：把「調停」圈起來。
  - type: guide
    text: ❷畫線找上下文線索：將「有人吵起架來」畫線。
  - type: guide
    text: '❸推詞義：

      調停前面講到「有人吵起架」，「吵架」就需要有人出面勸架調解或讓人停止爭吵，所以可以推測：

      「調停」的意思：  勸架調解、讓人停止爭吵  。'
  - type: free_text
    prompt: ❹檢查：把推測的答案代入原句，判斷【　　　】。
    answer: 合理　　□不合理
  - type: guide
    text: '在工地有人吵起架來，勸架調解、讓人停止爭吵 的常常是她們。

      你學會了嗎？遇到難詞，有時根據上下文線索，就可以推測出難詞的意思喔！現在，就讓我們用這四個步驟，來練習推測本課難詞的詞義。'
  - type: guide
    text: ◎小試身手：（請打勾，單選）
  - type: free_text
    prompt: 1.第七段──往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。
  - type: free_text
    prompt: ❶圈難詞：把「拜請」圈起來。
  - type: free_text
    prompt: ❷畫線找上下文線索：「叫不到的人」、「靠這些嫂子的關係」、「而來」
  - type: single
    prompt: ❸推詞義：「叫不到的人」表示自己邀不來，要靠大嫂的關係才能成功把人請到現場。所以可以推測「拜請」表示：（請打勾，單選）
    options:
    - 【拜託、邀請
    - 祭拜、申請　】
    answer: 【拜託、邀請
  - type: single
    prompt: ❹檢查：把推測的答案代入原句，判斷【合理　　□不合理】。
    options:
    - 合理
    - 不合理
    answer: 合理
  - type: guide
    text: 往往我們叫不到的人，都要靠這些嫂子的關係　拜託、邀請  　而來。
  - type: free_text
    prompt: 2.第八段──工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在指點迷津。
  - type: free_text
    prompt: ❶圈難詞：把「指點迷津」圈起來
  - type: free_text
    prompt: ❷畫線找上下文線索：把關鍵訊息畫起來
  - type: free_text
    prompt: ❸推詞義：工程有困難、不順利時，要去哪裡拜拜祈求，都是大嫂他們提出解決問題的建議，可推測「指點迷津」表示：
  - type: passage
    source: unknown
    paragraphs:
    - 【□指指點點造成困擾　　　提出解決問題的建議　】
  - type: single
    prompt: ❹檢查：把推測的答案代入原句，判斷【合理　　□不合理】。
    options:
    - 合理
    - 不合理
    answer: 合理
  - type: guide
    text: 工程不順，要去哪裡拜什麼，下一步該怎麼做，都是她們在
  - type: guide
    text: 提出解決問題的建議                          　　 。
  - type: free_text
    prompt: 3.換你試試看：每年會大約有一百多架飛機失事，死了很多人。
  - type: free_text
    prompt: ❶圈難詞：把「失事」圈起來
  - type: free_text
    prompt: ❷畫線找上下文線索：把關鍵訊息畫起來
  - type: free_text
    prompt: ❸推詞義：失事後面寫了死了很多人，會死很多人表示發生了意外，所以推測「失事」表示：     發生了意外　    的意思。
  - type: free_text
    prompt: ❹檢查：把詞義帶回句子讀讀看，判斷是否合理。若不合理，需再回到第二步或用其他的方式找詞義，例如查字典、拆詞釋義。
  - type: free_text
    prompt: (1)   溫柔婉約       ：溫和柔順，婉轉含蓄。
  - type: free_text
    prompt: (2)    心知肚明     ：不用明說也非常清楚。
  - type: free_text
    prompt: (3)    粗野陽剛     ：粗魯豪放且強健、有朝氣的樣子。
  - type: free_text
    prompt: (4)    穿梭         ：形容頻繁快速的來回移動。
  - type: free_text
    prompt: (5)    調度        ：安排配置。
  - type: free_text
    prompt: (6)    調停折衝     ：調解協調並靈活應對衝突。
  - type: free_text
    prompt: (7)   無虞     ：不用擔心。
  - type: guide
    text: 銜接無虞       ：指的是過程連接順利，沒有問題。
  - type: free_text
    prompt: (8)    使臂使指    ：揮動手臂與手指，比喻發號施令。
  - type: free_text
    prompt: (9)    度量胸襟     ：能包容別人的限度和氣度。
  - type: free_text
    prompt: (10)    長袖善舞    ：比喻處事圓滑，善於交際。
  - type: free_text
    prompt: (11)    當面戳破    ：直接揭穿他人的謊言或真相。
  - type: free_text
    prompt: (1)她說話總是(  B  )，輕聲細語，讓人感到如沐春風。
  - type: free_text
    prompt: (2)老師的一番話，正好為處在人生低潮中的我(  G  )。
  - type: free_text
    prompt: (3)她每天(  H  )於各科教室之間，忙碌得像個小蜜蜂。
  - type: free_text
    prompt: (4)他(  I  )對方的藉口，場面一度尷尬。
  - type: free_text
    prompt: (5)區間車準時到站，我們轉乘高鐵銜接(  D  )，時間很充裕。
  - type: free_text
    prompt: (6)領導者應有開闊的(  E  )，接納不同的看法，才能服眾。
  - type: free_text
    prompt: (7)他(  C  )，交際手腕高明，一下子就能和各方談成合作。
  - type: free_text
    prompt: (8)他喜歡把大家(  J  )的想法直接說出來，常常弄得現場很尷尬。
