spotlight:
  lesson: G9-L9
  strategy_name: 圖表繪製與判讀-圖文表綜合判讀
  strategy_type: image_text
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: passage
    source: unknown
    paragraphs:
    - 男子鞍馬項目計分規則有些複雜，你讀懂了嗎？你可以用階層圖或心智圖，整理出你對「男子鞍馬項目計分規則」的理解（如圖一)。你也可以設計自己的組織圖喔！
  - type: guide
    text: 1.請你完成階層圖下方空格
  - type: free_text
    prompt: 2.魔鬼挑戰題
  - type: guide
    text: ※魔鬼挑戰題解題策略提醒：你必須完全讀懂以上的評分規則，並仔細對照題目提供的數字與規則，才能夠解出答案喔。
  - type: free_text
    prompt: (1)表2是奧運選手彼得在2021年東京奧運鞍馬的項目分數，你能根據以上的文字說明，計算出選手的最後得分嗎？（請寫出算法，可以用計算器）
  - type: guide
    text: 表2 奧運選手彼得在2021年東京奧運鞍馬的項目分數
  - type: guide
    text: D=5.40
  - type: passage
    source: unknown
    paragraphs:
    - E=(10-1.6-1.6-1.6-1.5-1.5)/5=8.44 (7位裁判去高去低後，平均分數)
  - type: guide
    text: E = 8.44分
  - type: guide
    text: D+E=5.40+8.44＝13.84
  - type: free_text
    prompt: (2)假設2021年的東京奧運鞍馬項目中，李智凱執行動作時（E分從10分開始），出現5次小錯、1次中錯、1次大錯，請問李智凱的實施得分（E分）是多少？（請寫出算法，可以用計算器）
  - type: guide
    text: 答：10 —（5*0.1）—（1*0.3）—（1*0.5）=8.7
  - type: free_text
    prompt: (3)臺灣「鞍馬王子」李智凱參加2021年東京奧運鞍馬項目競賽，表3是D分組兩位裁判給各動作難度的平均給分，請問李智凱的D分是多少？在空格內填入答案（可以用計算器）。
  - type: guide
    text: 表3. D組某位裁判給李智凱的分數
  - type: guide
    text: 提示：
  - type: free_text
    prompt: 1.D分（動作難度分數）是由「動作難度」與「動作組群」所組成
  - type: free_text
    prompt: 2.動作組群最高可以加到2分
  - type: free_text
    prompt: 3.動作組群共有I、II、III、IV等4組，I、II、III組動作組群只需出現難度A或更難的動作，就都可以加0.5分；第IV組群是下法動作，A和B級難度不加分，C級難度可加0.3分，D級難度可加0.5分。
  - type: free_text
    prompt: (4)以下是112國中會考國文科題目第27-29題，請你練習看看吧。
  - type: guide
    text: 答：27.(Ａ)、28.(Ｂ)、29.( Ｃ)
