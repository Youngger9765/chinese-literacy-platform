spotlight:
  lesson: G8-L9
  strategy_name: 推論策略-用對比推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: "這篇文章透過珍古德的故事，帶你看見作者的想法，但作者並沒有直接寫出主要觀點，而是安排了許多「前後對照」的對比，讓你在閱讀的過程中慢慢發現：\n\
      \    「啊！原來這些對比，都是在把我帶向同一個觀點。」\n    「啊！原來作者想透過這些對比，改變我原本的想法。」\n讀這樣的文章，你要先讀出對比，然後一邊讀一邊問自己兩個問題：\
      \   \n1.這組對比想讓我看見什麼？（重點）\n    2.作者透過這些重點想影響我什麼？（作者意圖）"
  - type: guide
    text: 一、找對比與歸納重點：
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 二、歸納主要論點/主旨
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: self_check
    items:
    - 我能找到文本裡的對比訊息，並歸納出重點。
    - 我能根據歸納出的重點，進一步推論出本文的重點和作者意圖。
