spotlight:
  lesson: G7-L4
  strategy_name: 用表格整理訊息
  strategy_type: comparison
  blocks:
  - type: guide
    text: 本練習將引導你運用「用表格整理訊息」的策略，將課文摘要中的內容進行結構化整理。
  - type: single
    prompt: 根據課文摘要，這篇文章主要在比較哪兩種生物？請選出正確的對象。
    options:
    - 螞蟻和蜜蜂
    - 螞蟻和蟋蟀
    - 蟋蟀和蝴蝶
    answer: 螞蟻和蟋蟀
  - type: single
    prompt: 在課文摘要中，關於螞蟻的『集體行動』與『力量』，下列哪一項描述是正確的？
    options:
    - 螞蟻喜歡獨自行動，力量微小。
    - 螞蟻集體出動，能扛起比自己體重大上數十倍的食物。
    - 螞蟻集體行動，但力量不大。
    answer: 螞蟻集體出動，能扛起比自己體重大上數十倍的食物。
  - type: single
    prompt: 根據課文摘要對螞蟻和蟋蟀的描述，最適合用來比較牠們的『主題』是什麼？
    options:
    - 外觀與體型
    - 覓食習慣與棲息地
    - 社會結構與繁衍策略
    answer: 社會結構與繁衍策略
  - type: free_text
    prompt: 如果我們選擇『生存與繁衍策略』作為比較主題，請簡述螞蟻在這一主題下的主要策略。
  - type: free_text
    prompt: 承上題，請簡述蟋蟀在『生存與繁衍策略』這一主題下的主要策略。
