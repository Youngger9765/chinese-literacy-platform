spotlight:
  lesson: G5-L23
  strategy_name: 時間管理-制定作息時間表
  strategy_type: sel_character
  blocks:
  - type: guide
    text: "在〈我有一個棒球夢〉裡，我們學會了時間不夠時要先抓重點、靈活應變，我們用「覺察 → 拆解 → 行動 → 反思」四步驟，找到取捨與應變的方法。\n\
      \    〈我的電競夢〉的主角既要練電競，又要顧學業，他是怎麼做到「不拖延又自律」的呢？關鍵在於：「規律的作息表」與「自我管理」。\n接下來讓我們來找出自己浪費時間與拖延的原因，學會建立規律作息。"
  - type: guide
    text: ①覺察（Step1）──我和時間的關係
  - type: guide
    text: 請先看看你平常一天的時間都怎麼用。在下列項目中，勾選你常做的三個項目。
  - type: guide
    text: ※想一想：
  - type: free_text
    prompt: 1.哪一項最容易讓你拖延，就是不想開始？
  - type: guide
    text: →____________________________
  - type: free_text
    prompt: 2.哪一項最容易讓你浪費時間？
  - type: guide
    text: →____________________________
  - type: free_text
    prompt: 3.哪一項是你「覺得很重要，應該多花一點時間」的？
  - type: guide
    text: →____________________________
  - type: guide
    text: （深呼吸，你意識到自己會在哪些地方拖延了。
  - type: guide
    text: 現在我們要想的是──以後怎麼避免再發生？）
  - type: guide
    text: ②拆解（Step2）──找出拖延的原因+學習主角的時間策略
  - type: guide
    text: 在開始規畫之前，先了解自己「為什麼容易拖延」。（可複選）
  - type: guide
    text: ※想一想：
  - type: guide
    text: 在上面的原因中，哪一個是你最常發生的？
  - type: guide
    text: 在旁邊畫個「☆」，這是你接下來要特別注意的習慣。
  - type: guide
    text: 我最常拖延的時段是什麼時間？（例：放學後、晚餐後、假日）
  - type: guide
    text: → ___________________________
  - type: guide
    text: 現在，你已知道自己為什麼會拖延，接著我們來看看主角是怎麼克服的。
  - type: guide
    text: 主角在課文中說：「要成為頂尖選手，時間管理是關鍵。」
  - type: guide
    text: 他透過規律作息，把時間分成三類：
  - type: guide
    text: 任務：請勾選你覺得主角值得學習的做法。（複選）
  - type: guide
    text: ※想一想：這些習慣中，你覺得哪一個你也能做到？
  - type: guide
    text: →________________________________
  - type: guide
    text: ③行動（Step3）──設計屬於我的作息時間表
  - type: guide
    text: 現在，請你根據自己的生活節奏，設計「我的自律作息表」
  - type: figure
    referent: table
    asset: fig10.png
    bind_paragraph: null
  - type: guide
    text: ④反思（Step4）──預防拖延的方法【我的「拖延時間」改進計畫】
  - type: guide
    text: 有計畫還不夠，重點是能不能「準時開始」。想想你最容易拖延的情況，並選出你想嘗試的方法。
  - type: guide
    text: ※我的反拖延策略（可複選）
  - type: guide
    text: ※我的承諾：
  - type: guide
    text: →下次有作業或考試時，我會＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。
  - type: guide
    text: →為了不再拖延，我打算每天固定在＿＿點開始＿＿＿＿＿＿＿＿（寫功課、讀書會）。
  - type: guide
    text: →我會用＿＿＿＿＿＿＿＿＿（方法或工具）提醒自己準時開始。
  - type: self_check
    items:
    - 我能找出自己最容易浪費時間的時段
    - 我能分析自己拖延的原因
    - 我能設計出自己的作息時間表
    - 我能設定可行的反拖延方法
