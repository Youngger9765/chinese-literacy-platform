spotlight:
  lesson: G9-L11
  strategy_name: 摘要策略-科學探究文本結構
  strategy_type: summary
  blocks:
  - type: guide
    text: '這篇典型的科學探討文章，描述了科學史上一個膾炙人口的故事——達爾文見到一朵從未見過的蘭花，因而推測一種長喙天蛾的存在，這個推測在數十年之後，終於由其他的科學家驗證。

      科學探究文章中經常隱含著「觀察⭢提問⭢推測⭢驗證⭢啟示」等五個探究的成分（或元素）。閱讀時，你若心中有這五個步驟，並在文章裡找到它們，閱讀效率與理解都會大幅提升。

      接著，我們來練習用下列兩個步驟尋找文章的「觀察、提問、推測、驗證、啟示」五部分。

      ❶找出成分（元素）在哪個段落

      ❷找出各個成分的重點句'
  - type: guide
    text: 一、找「觀察」
  - type: guide
    text: ※祕訣：「觀察」描述科學家看到了什麼重要的現象，常出現在文章開頭。
  - type: single
    prompt: ❶找段落：「觀察」出現在文章哪些段落？（提示，有兩段）
    options:
    - 段1   段2
    - 段3
    - 段4
    answer: 段1   段2
  - type: free_text
    prompt: ❷找重點句：
  - type: guide
    text: 本文開頭有多句描述達爾文觀察的句子，請判斷哪一句是觀察的重點句。（單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①達爾文逐一觀察，仔細在筆記本上記錄形態與結構。
    - ②一株名叫「大彗星風蘭」的蘭花格外引人矚目，它的花距長度竟超過三十公分！
    - □③達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」
    - 小撇步：
    - ②是重點句，直接點出達爾文觀察到的特殊現象（蘭花的花距長達三十公分）。①只是描述觀察的過程，③則已經是在提出疑問。
  - type: guide
    text: 二、找「提問」
  - type: guide
    text: ※祕訣：「提問」是科學家根據觀察提出的問題，研究想要解開的謎團，通常緊接在觀察之後出現，常會以問句呈現。
  - type: single
    prompt: ❶找段落：「疑問」出現在文章哪個段落？
    options:
    - 段1
    - 段2   □段3   □段4
    answer: 段2   □段3   □段4
  - type: single
    prompt: ❷找重點句：（單選）
    options:
    - 達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」
    - 新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？
    answer: 新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 以上句子中，有兩句以問號結尾，表示主角提出了兩個提問。但②的提問（有沒有如此長口器的昆蟲）更關鍵，是研究要解決的謎題
  - type: guide
    text: 三、找「推測」
  - type: guide
    text: ※祕訣：「推測」是根據提問提出的大膽假設或可能的答案。「推測」常會有明顯的關鍵詞，例如「推測」、「猜想」、「預測」等。
  - type: single
    prompt: ❶找段落：「推測」出現在文章哪一段？（單選）
    options:
    - 段1
    - □段2   □段3   段4
    answer: □段2   □段3   段4
  - type: single
    prompt: ❷找重點句：
    options:
    - 這實在令人難以置信！
    - 達爾文寫下推測：在馬達加斯加島上，應該有一種口器長達三十公分的蛾類，能夠幫這朵風蘭授粉。
    answer: 這實在令人難以置信！
  - type: guide
    text: 四、找「驗證」
  - type: guide
    text: ※祕訣：「驗證」指透過實驗或觀察找到證據來證明先前的推測。通常出現在文章後段，說明科學家找到的證據或得到結果。
  - type: single
    prompt: ❶找段落：「驗證」出現在文章哪一段？（提示，有兩段）
    options:
    - 段6
    - 段7   段8
    - 段9
    answer: 段6
  - type: multi
    prompt: ❷找重點句：（兩段各有一個重點句）
    options: &id001
    - 1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，證實了達爾文的預測。
    - 科學家一直沒有直接證據說明天蛾和風蘭間的關係。
    - 1992年，研究團隊拍到了長喙天蛾為風蘭授粉的畫面，這個跨世紀的謎題終於得到完整的解答。
    answer: *id001
  - type: guide
    text: 五、找「啟示」
  - type: guide
    text: ※祕訣：「啟示」是從這個故事得到的道理或體會，點出作者想傳達的科學精神。
  - type: single
    prompt: ❶找段落：「啟示」出現在文章哪一段？（單選）
    options:
    - 段6
    - □段7   □段8   段9
    answer: □段7   □段8   段9
  - type: single
    prompt: ❷找重點句：最後一段直接提到這個故事帶來「許多啟示」，請勾選這個故事帶來的啟示。（複選）
    options:
    - 科學不只是描述所觀察到的現象，更要推論現象背後隱藏的機制。
    - 科學不只是「眼見為憑」，未親眼所見之事，也能從理性與經驗中推論其答案
    - 原來，科學就是從觀察裡提出好問題之後，「大膽假設，小心求證」的歷程。
    - 這樣的啟示，一代一代傳下來，成了每一位科學工作者的基本信念。
    answer: 科學不只是描述所觀察到的現象，更要推論現象背後隱藏的機制。
  - type: guide
    text: 一、請你自己檢查以下5項，確定自己是否會抓重點了
  - type: guide
    text: 二、如果以上五項你都打勾了，恭喜你！你已經學會運用「觀察→提問→推測→驗證→啟示」五步驟來摘要科學探究文章。這會讓你更快速掌握文章重點，你真的很棒喔！
  - type: passage
    source: unknown
    paragraphs:
    - 這是一篇科學探究結構的文章，閱讀聚光燈你已經學會怎麼用線索來找重點，接著，我們就來整理本課的重點嘍！
  - type: fill_table
  - type: self_check
    items:
    - 我學會找出文章中科學家觀察到的現象，知道研究從哪裡開始。（觀察）
    - 我學會找出科學家提出的問題，了解研究想解決什麼疑團。（提問）
    - 我學會找出科學家的假設猜想，了解他對答案的推測。（推測）
    - 我學會找出驗證推測的證據或結果，知道推測是如何被證實的。（驗證）
    - 我學會找出故事的啟示，了解這篇文章傳達的科學精神。（啟示）
