spotlight:
  lesson: G9-L12
  strategy_name: 摘要策略-小標題的作用：找細節
  strategy_type: summary
  blocks:
  - type: guide
    text: '本課是一篇說明文，文章用小標題分段，分別說明文章主題的不同面向。閱讀這類文章，你只要抓住三件事就能掌握重點：

      一、大主題是什麼？

      二、每個小標題在說明哪個面向？

      三、每個面向最重要關鍵的細節是什麼？

      接下來，我們就來做這三件事：確認大主題與小主題、找重要細節。'
  - type: guide
    text: 一、確認大主題
  - type: guide
    text: 說明文的「大主題」通常就是文章標題。大主題要精簡，也要抓到本文最核心的概念。
  - type: single
    prompt: 下列哪一個名稱，也可做為本文的大主題？（單選）
    options:
    - ①齊柏林號：升空的第一步
    - ②福衛八號：守望臺灣的衛星星系
    answer: ②福衛八號：守望臺灣的衛星星系
  - type: guide
    text: 二、小主題定位＋找重要細節（扣住小主題，挑出最關鍵的句子）
  - type: guide
    text: 本文每段資訊都很多，請用小主題抓住這段的重點，並挑出最能支持小主題的「重要細節」句子。
  - type: guide
    text: （一）第3~4段〈宇宙中的巡邏隊〉
  - type: single
    prompt: 1.小主題-這段重點最接近哪個標題：(單選)
    options:
    - 星系接力觀測：間隔變短、看得更清楚
    - 衛星速度驚人：太空中的高速飛行
    answer: 星系接力觀測：間隔變短、看得更清楚
  - type: single
    prompt: 2.找重要細節：哪些句子最能直接支持你選的小主題？(4選2)
    options:
    - 福衛八號從2025起逐年發射，到2031全部就位。
    - 衛星在約561公里的太陽同步軌道運行，輪流拍攝。
    - 星系完成後，觀測間隔將大幅縮短，能更快取得影像。
    - 解析度比以往更高，能看清災區地形、道路、建築、農田。
    answer: 星系完成後，觀測間隔將大幅縮短，能更快取得影像。
  - type: multi
    prompt: 3.精簡成一句話(3選1)
    options: &id001
    - 星系完成後觀測更頻繁、影像更清楚，能更快掌握災情。
    - 衛星在太陽同步軌道運行，所以速度很快、很壯觀。
    - 福衛八號會逐年發射到2031，形成一套完整的觀測系統。
    answer: *id001
  - type: guide
    text: （二）第５～６段〈沒有「重來」的按鈕〉
  - type: single
    prompt: 1.小主題-這段重點最接近哪個標題：(單選)
    options:
    - 太空環境嚴酷：溫差、輻射與隕石
    - 失誤難挽回：發射前要反覆測試
    answer: 失誤難挽回：發射前要反覆測試
  - type: single
    prompt: 2.找重要細節：哪些句子最能說明小主題的重點?(4選３)
    options:
    - 在地球上壞了可以修，但在太空失誤往往覆水難收。
    - 太空環境嚴酷，有溫度變化、輻射和微小隕石撞擊。
    - 因此發射前必須在地面經歷無數次的模擬測試。
    - 衛星只有冰箱大小，但內部塞滿精密相機和推進系統。
    answer: 在地球上壞了可以修，但在太空失誤往往覆水難收。
  - type: multi
    prompt: 3.精簡成一句話(3選1)
    options: &id002
    - 太空危險多、失誤很難補救，所以發射前必須反覆模擬測試。
    - 太空環境很嚴酷，所以衛星要縮小到冰箱大小，較不易故障。
    - 人造衛星設備太精密了，所以發射成功主要靠運氣。
    answer: *id002
  - type: guide
    text: （三）第7段〈星光背後的二十年〉
  - type: single
    prompt: 1.小主題-這段重點最接近哪個標題：(單選)
    options:
    - 二十年太空里程：從仰賴他國到自主製造
    - 二十年太空厲害：解析度更高、看得更清楚
    answer: 二十年太空里程：從仰賴他國到自主製造
  - type: single
    prompt: 2.找重要細節：哪些句子最能說明小主題的重點？(4選2)
    options:
    - 臺灣位處地震帶與颱風路徑上，需要更快掌握災情。
    - 福衛八號有許多關鍵零件，由臺灣本土團隊研發製造。
    - 自1999年福衛一號起，二十多年累積，從仰賴他國走到自主製造。
    - 就像運動員磨練成國手，象徵每一步都在挑戰極限。
    answer: 福衛八號有許多關鍵零件，由臺灣本土團隊研發製造。
  - type: single
    prompt: 3.精簡成一句話(2選1)
    options:
    - 臺灣累積二十多年太空經驗，逐步從仰賴走向自主製造。
    - 臺灣關鍵零件自己研發，因此衛星資料一定最準也最完整
    answer: 臺灣累積二十多年太空經驗，逐步從仰賴走向自主製造。
  - type: guide
    text: （四）第8段〈「齊柏林」守望臺灣〉
  - type: guide
    text: 找重要細節：請寫出最能支持「「齊柏林」守望臺灣」的句子。
  - type: guide
    text: 透過衛星影像，我們能更快速的掌握災情、守護國土。
  - type: guide
    text: （五）第9段〈守護家園，也有你一份〉
  - type: guide
    text: 請先找出最能支持「守護家園與，也有你一份」的細節，並精簡為一句話。（答案合理即可）
  - type: guide
    text: 衛星為我們守望家園，你可以成為那個看見臺灣、珍惜臺灣的人。
  - type: guide
    text: ※如果你兩項都打勾，恭喜你，表示你已經學會用「主題—小主題—重要細節」來抓說明文重點，先抓大方向，再抓段落重點與關鍵細節。
  - type: self_check
    items:
    - 我能確認這篇文章的「大主題」是什麼。
    - 我能根據小主題，挑出最能支撐小主題的「重要細節」，並精簡成一句重點句。
