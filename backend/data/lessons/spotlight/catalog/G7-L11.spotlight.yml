spotlight:
  lesson: G7-L11
  strategy_name: 推論策略-找作者觀點和支持理由
  strategy_type: main_idea_inference
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：推論策略──
  - type: guide
    text: 一、作者在第一段提出了什麼「問題」？
  - type: passage
    source: unknown
    paragraphs:
    - 先看第一段：根據開頭「公民課月經討論」的情境，作者想讓讀者思考的問題是什麼？（請打勾，單選）
  - type: single
    prompt: □①月經之所以被汙名化的原因是什麼？
    options:
    - AI的功能越來越強，讓人懷疑是否還要學習？
    - AI能快速整合資訊，讓人質疑AI的資訊都正確嗎？
    answer: AI的功能越來越強，讓人懷疑是否還要學習？
  - type: guide
    text: 二、作者的回答：從各段標題找作者觀點、支持理由與隱含意義
  - type: guide
    text: 步驟❶──找作者觀點
  - type: single
    prompt: 請你看四、五段，作者的觀點是什麼？（請打勾，單選）
    options:
    - AI懂回答，卻不懂發問，而「發問」才是思考與學習的起點。
    - AI能在短時間提供各種資料與觀點，並且提供適當的評論。
    - AI可以幫忙人類思考哪個觀點更有意義、更符合使用者需要。
    answer: AI懂回答，卻不懂發問，而「發問」才是思考與學習的起點。
  - type: guide
    text: 步驟❷──找支持理由
  - type: guide
    text: 祕訣：支持理由常出現在觀點後，通常是「事實、數據、例子、…」。
  - type: passage
    source: unknown
    paragraphs:
    - 找一找，第四、五段作者提出「AI不懂發問」的觀點，底下哪一選項是作者提出的支持理由？（請打勾，單選）
  - type: multi
    prompt: 請選擇
    options: &id001
    - AI能在很短的時間蒐集到大量資料，並列表整理出影響「月經汙名化」的各種歷史與文化的原因。
    - AI能協助使用者快速完成「月經汙名化」報告與分析，並提供使用者它最推薦的說法，及進一步的搜尋建議。
    - 作者舉例，AI雖能列出「月經汙名化」的原因，但無法提出「生活中還有類似偏見嗎？」這類的重要的問題。
    answer: *id001
  - type: guide
    text: 步驟❸──推論隱含意義
  - type: passage
    source: unknown
    paragraphs:
    - 祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）
  - type: free_text
    prompt: ❶觀點：「AI時代，人類更要會發問。」
  - type: free_text
    prompt: ❷理由：「只有人類會進一步追問，展現主動的思考與理解。」
  - type: single
    prompt: ❸我讀到的結論是什麼？（請打勾，單選）
    options:
    - 我們要小心AI的錯誤資訊。
    - 學習的價值不在記住答案，而在能主動思考、提出問題。
    - AI只要再進步一點，就會比人更會提問。
    answer: 學習的價值不在記住答案，而在能主動思考、提出問題。
  - type: guide
    text: 二、小試身手
  - type: passage
    source: unknown
    paragraphs:
    - 上面我們用「三步驟」練習了一個觀點，在這篇文章中，作者還提出其他重要觀點。接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、推論主旨與寫作目的
  - type: passage
    source: unknown
    paragraphs:
    - 本文的觀點鋪陳：作者先以「AI回答月經問題」開場，指出AI的能力令人驚嘆，卻也引發「我們還需要學習嗎？」的思考。接著從三個面向說明——發問、體驗、判斷——來強調人類學習的價值。最後呼應開頭，指出「學習」仍是人類探索與成長的起點。
    - 根據以上鋪陳，請你做適當推論，並在底下選出本文主旨。（單選）
    - '□①AI越進步，人類的學習的重點仍然不會有所變。

      ②AI時代裡，人類的思考、體驗與判斷能力更為重要。'
    - □③學習的目的就是學會如何使用AI，以節省時間精力。
    - 推論作者寫作目的：作者希望我們未來可以怎麼做？（單選）
    - '①善用AI協助學習，並保有自己的思考與創造。

      □②把所有作業交給AI處理，節省時間。'
    - □③不再使用AI，完全回到傳統學習方式。
  - type: guide
    text: ※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！
  - type: self_check
    items:
    - 我能找到作者的觀點。
    - 我能找到支持該立場的證據。
    - 我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。
