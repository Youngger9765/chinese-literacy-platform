spotlight:
  lesson: G6-L11
  strategy_name: 摘要策略-從關鍵句找小主題與細節
  strategy_type: summary_keysentence
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: free_text
    prompt: 1.找出大主題（可從標題找，只要找一次即可）：　古代畫家心中的仙境
  - type: free_text
    prompt: 2.找出小主題：
  - type: free_text
    prompt: (1)課文第二段
  - type: free_text
    prompt: ❶先畫出關鍵句
  - type: guide
    text: 在古代中國人的想像裡，神仙不食人間煙火，總是住在遠離凡塵俗世、雲霧飄渺的深山裡。在許多口耳相傳的故事裡，曾有極少數幸運的人「誤入」仙境，看見不可思議的景象。這些傳說中的仙境，通常都藏在深山的洞穴裡。
  - type: free_text
    prompt: ❷本段的小主題是　古代神仙的【　住所／居住地點　　】。
  - type: free_text
    prompt: ❸找出與小主題最相關的重要細節（多選）
  - type: guide
    text: 神仙總是住在遠離凡塵俗世、雲霧飄渺的深山裡。。
  - type: guide
    text: 這些傳說中的仙境，通常都藏在深山的洞穴裡。。
  - type: guide
    text: ⃞千百年來，許多畫家都將其描繪成通往仙境的入口之一。
  - type: free_text
    prompt: (2)課文第四段
  - type: guide
    text: 畫家們常在畫中安排三種特別的元素：山洞、小橋和小船。山洞意味著通往仙境的神祕門戶，小橋代表跨進另一個世界的通道，小船象徵渡過現實與仙境的交通工具。這些元素彷彿是進入另一個世界的「護照」，標誌著從凡塵俗世到神奇仙境的奇妙轉變。
  - type: free_text
    prompt: ❶畫出關鍵句
  - type: free_text
    prompt: ❷本段的小主題是　【仙境畫的元素　　　】與意義　　。
  - type: free_text
    prompt: ❸找出與小主題最相關的重要細節（填空）
  - type: guide
    text: 畫家們常在畫中安排三種特別的元素，【　山洞　　】、【　小橋　】、【　小船　　】標誌從凡塵俗世到神奇仙境的奇妙轉變。
  - type: free_text
    prompt: (3)課文第五段
  - type: guide
    text: 這些古代畫作有個引人深思的特點──「畫中的人物都非常渺小，周圍的山水風景卻極其宏大」，這與現代人喜歡在自拍照中凸顯出自己的習慣，形成鮮明的對比。古代畫家如此安排有其深意，主要在表達面對浩瀚無垠的大自然時，人類是微不足道的。
  - type: free_text
    prompt: ❶請你先畫出關鍵句
  - type: free_text
    prompt: ❷本段的小主題是　古代畫作引人深思的特點　　。
  - type: free_text
    prompt: ❸找出與小主題最相關的重要細節（填空）
  - type: guide
    text: 畫中人物都很【　小　　】，山水風景卻很【　 大　　】，畫家想表達人在面對浩瀚無垠大自然時，人類是很【   微不足道　　　】。
  - type: free_text
    prompt: (4)課文第六段
  - type: guide
    text: 這些畫家在簽名時，還喜歡加上「山人」、「道人」等稱號，雖然他們不一定真的隱居山林、苦修尋道，但這些稱號反映出他們遠離塵囂的渴求、對大自然的嚮往，以及對心靈提升的期待。
  - type: free_text
    prompt: ❶請你先畫出關鍵句
  - type: free_text
    prompt: ❷本段的小主題是　畫家【對仙境的嚮往／心中理想的仙境　】　　。
  - type: free_text
    prompt: ❸找出與小主題最相關的重要細節(寫句子)
  - type: guide
    text: 希望遠離塵囂、嚮往大自然、提升心靈的期待　　          。
  - type: guide
    text: ◎ 小試身手：練習完閱讀聚光燈的題目後，請你完成文章重點表。
