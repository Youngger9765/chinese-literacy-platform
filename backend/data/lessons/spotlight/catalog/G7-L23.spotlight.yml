spotlight:
  lesson: G7-L23
  strategy_name: 閱讀策略-跳過卡關，瀏覽全文
  strategy_type: inference
  blocks:
  - type: guide
    text: '說明：

      閱讀的時候，如果文章出現很多不熟的新詞，越讀越卡時，該怎麼辦？這一課要練一個策略──「跳過卡關、先瀏覽全文」。這就好像吃魚的時候，魚刺很多的地方先跳過，先吃多肉無刺的地方。你繼續往下讀，也許就會發現，那些讓人頭疼的新詞或專有名詞，經常不會影響你的閱讀理解哦。

      底下的課文，就有一些艱深的詞彙，請你先讀一次。記得吃魚的比喻，多刺的地方先不要深究哦。'
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 〈雨林裡的奇蹟藥物〉
  - type: passage
    source: unknown
    paragraphs:
    - （段1）亞馬遜雨林的原住民，會用藤蔓中提煉出的「箭毒」製作毒箭。箭毒屬神經肌肉阻斷劑，拮抗乙醯膽鹼受體，它會阻斷神經肌肉傳導，中毒箭的動物會全身肌肉鬆弛，最後因呼吸衰竭而死。如今，現代醫院的外科醫師在手術中，卻把箭毒當作救命的藥物來使用，許多能治療白血病與其他癌症的強效藥物，也同樣來自雨林的植物。這讓科學家在世界各地的雨林中探索，尋找新的「奇蹟」藥物。
  - type: guide
    text: Step 0：30秒快速瀏覽（先抓方向）
  - type: free_text
    prompt: 1.任務：只抓「第一段大概在講什麼？」（約10–15字）
  - type: guide
    text: →我猜這段在講：  藤蔓中的箭毒可以治病
  - type: guide
    text: Step 1：標示卡關點（本課的粗體明示＋原因判斷）
  - type: single
    prompt: 1.粗體的地方讀起來不容易，你覺得主要原因是什麼？（單選）
    options:
    - 醫學專有名詞密集，句子又長
    - 事件跳太快，我很難把前後接起來
    answer: 醫學專有名詞密集，句子又長
  - type: guide
    text: Step 2：忽略卡關點再讀一次（不中斷）
  - type: free_text
    prompt: 1.再讀一次第一段：看到粗體就先快速讀過，不要細究，直接往下讀。
  - type: single
    prompt: 2.自我檢核：我有把第一段讀完（單選）
    options:
    - 有，我能順順讀完
    - 沒有，我還是卡在粗體處
    answer: 有，我能順順讀完
  - type: guide
    text: Step 3：抓重點（重點句＋段意）
  - type: single
    prompt: 1.重點句：第一段最關鍵的一句話？（單選）
    options:
    - 箭毒會讓動物全身肌肉鬆弛，最後甚至致死
    - 外科醫師在手術中，卻把箭毒當作救命的藥物
    - 科學家在世界各地雨林探索，尋找新的奇蹟藥物
    answer: 外科醫師在手術中，卻把箭毒當作救命的藥物
  - type: single
    prompt: 2.段意二選一（單選）
    options:
    - 雨林的致命箭毒，竟能被醫師用來救命，雨林可能藏著新藥。
    - 雨林裡的箭毒太可怕，所以大家應該遠離雨林，避免中毒。
    answer: 雨林的致命箭毒，竟能被醫師用來救命，雨林可能藏著新藥。
  - type: guide
    text: Step 4：驗證：我真的懂了嗎？（不用看粗體字）
  - type: single
    prompt: 1.這段最想強調的「反差」是什麼？（單選）
    options:
    - 致命的箭毒，竟能在醫療中變成救命藥
    - 原住民用毒箭狩獵，方法比現代人更厲害
    - 雨林植物很神祕，所以很多人想去冒險
    answer: 致命的箭毒，竟能在醫療中變成救命藥
  - type: single
    prompt: 2.作者提到「科學家在雨林探索」主要想表達什麼？（單選）
    options:
    - 雨林可能藏有新藥來源，值得科學家研究
    - 雨林的路線複雜危險，需要專業探險隊帶路
    - 雨林的動物種類很多，最適合做生態觀察
    answer: 雨林可能藏有新藥來源，值得科學家研究
  - type: guide
    text: Step 5：覺察與回顧（把方法說出來，才能遷移）
  - type: single
    prompt: 1.你是否發現：跳過看不懂的粗體，仍能抓到第一段重點？（單選）
    options:
    - 有，我更能抓到重點句與段意
    - 沒有，只要有地方不懂，就覺得沒讀懂
    answer: 有，我更能抓到重點句與段意
  - type: single
    prompt: 2.為什麼粗體字跳過沒關係？（單選）
    options:
    - 它是補充的細節，先抓轉折或結論句（例如「卻」）就能掌握重點
    - 它只是把同樣的概念重複說一次，所以跳過不會影響理解
    answer: 它是補充的細節，先抓轉折或結論句（例如「卻」）就能掌握重點
  - type: free_text
    prompt: 3.完成一句話（方法回顧）：
  - type: passage
    source: unknown
    paragraphs:
    - 下次閱讀，遇到專有名詞很多的段落，我可以先   跳過不懂的地方   ，再判斷  重點句和段落重點         。
    - 我們再用〈最後一隻旅人鴿〉做練習。這一次仍然請你快速閱讀一遍，標出讀不懂或讀不順的地方，再練習一次「跳過卡關、瀏覽全文」策略。
  - type: guide
    text: 〈最後一隻旅人鴿〉
  - type: passage
    source: unknown
    paragraphs:
    - （段1）早期的美國拓荒者曾目睹一幕驚人的景象──成群結隊、鋪天蓋地的旅人鴿。牠們體態修長，羽色灰藍，身長約41公分。旅人鴿屬鳩形目，具群聚性與高度社會性；採集性覓食，有典型長距遷徙行為，並在密集繁殖殖群中同步築巢。牠們遷徙路線從加拿大一路向南，穿越俄亥俄州、肯塔基州，到達阿肯色州與德州。科學家曾估計：牠們的數量不可勝數，單一群旅人鴿就可能超過十億隻，飛過天空往往持續好幾個小時，讓日光失色。
  - type: guide
    text: Step 0：30秒快速瀏覽（先抓方向）
  - type: free_text
    prompt: 1.任務：只抓「這一段大概在講什麼？」（約10–15字）
  - type: guide
    text: →我猜這段在講：  早期旅人鴿的數量很多
  - type: guide
    text: Step 1：標示卡點＋原因判斷
  - type: free_text
    prompt: 1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。
  - type: single
    prompt: 2.你覺得你卡住的主要原因是什麼？（單選）
    options:
    - 專有名詞多，我看不懂「分類、習性、地名」這類詞
    - 句子太長、資訊太多，我抓不到重點
    answer: 專有名詞多，我看不懂「分類、習性、地名」這類詞
  - type: guide
    text: Step 2：忽略卡點再讀一次（不中斷）
  - type: free_text
    prompt: 1.再讀一次卡關那段：先略過你圈起來的地方，直接往下讀，不要停。
  - type: single
    prompt: 2.自我檢核：我有把卡關那一段讀完（單選）
    options:
    - 有，我能順順讀完
    - 沒有，我還是卡在自己圈起來的地方
    answer: 有，我能順順讀完
  - type: guide
    text: Step 3：抓重點（重點句＋段意）
  - type: single
    prompt: 1.重點句：第一段最關鍵的一句話？（單選）
    options:
    - 牠們體態修長，羽色帶藍灰，身長約41公分
    - 單一群旅人鴿可能超過十億隻，飛過天空要好幾個小時
    answer: 單一群旅人鴿可能超過十億隻，飛過天空要好幾個小時
  - type: single
    prompt: 2.段意二選一（單選）
    options:
    - 旅人鴿的分類與遷徙路線很複雜，所以研究非常困難
    - 旅人鴿曾經數量驚人，成群飛過天空的景象非常震撼
    answer: 旅人鴿曾經數量驚人，成群飛過天空的景象非常震撼
  - type: guide
    text: Step 4：驗證：我真的懂了嗎？（不用看你圈起來的地方）
  - type: single
    prompt: 1.作者寫「超過十億隻、飛過天空要好幾個小時、讓日光失色」主要想讓讀者產生什麼感覺？（單選）
    options:
    - 覺得旅人鴿的數量大得難以想像，畫面非常震撼
    - 覺得旅人鴿的外觀很特別，適合做物種辨識
    - 覺得旅人鴿飛行耐力很強，適合研究運動表現
    answer: 覺得旅人鴿的數量大得難以想像，畫面非常震撼
  - type: guide
    text: Step 5：覺察與回顧（把方法說出來，才能遷移）
  - type: single
    prompt: 1.你是否發現：就算你圈起來的地方先跳過，仍能抓到重點？（單選）
    options:
    - 有，我更能抓到重點句與段意
    - 沒有，只要有地方不懂，就覺得沒讀懂
    answer: 有，我更能抓到重點句與段意
  - type: single
    prompt: 2.為什麼圈起來的地方跳過沒關係？（單選）
    options:
    - 它是補充「習性與遷徙路線」的細節，先抓「數量很驚人」的主畫面比較重要
    - 那些名詞只是用來增加篇幅，不讀也完全不會影響任何理解
    answer: 它是補充「習性與遷徙路線」的細節，先抓「數量很驚人」的主畫面比較重要
  - type: single
    prompt: 3.這次練習，你最重要的學習是什麼？（方法回顧）
    options:
    - 我能標出自己卡關的地方，並判斷先跳過會不會影響重點
    - 我知道遇到資訊很多或有不熟詞的段落，也能先抓重點句再理解內容
    answer: 我能標出自己卡關的地方，並判斷先跳過會不會影響重點
  - type: guide
    text: 第一篇 雨林裡的奇蹟藥物
