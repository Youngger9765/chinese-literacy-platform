spotlight:
  lesson: G6-L5
  strategy_name: 推論策略-從摘要及關鍵句推論主旨
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: ◎ 小試身手：請依據文章線索選出正確答案
  - type: free_text
    prompt: 1.小妤常打斷台上發言，育勤有條有理的提出不同見解。
  - type: guide
    text: →以小妤的表現，下列何者可能是她的性格？（多選）
  - type: guide
    text: 莽撞   直率  □熱情  □沉著
  - type: free_text
    prompt: 2.育勤和夏恩兩人雖然意見不同，但都能遵守發言的規則。
  - type: guide
    text: →以育勤和夏恩兩人的表現，下列何者哪一句最貼切？（單選）
  - type: guide
    text: □幫助意見相同的人，排斥意見不同的人。
  - type: guide
    text: 互相尊重各方的意見，不任意批評。
  - type: guide
    text: □思想不同，志趣不合，就無法相互討論或共事。
  - type: free_text
    prompt: 1.寫出本課大意
  - type: free_text
    prompt: 2.作者通常會在文章結尾處，表達感受或說明道理，這就是關鍵語句。這一課的文章內容是政見發表會，以下文章結尾的句子，哪一句最可能成為關鍵語句？請打勾。(單選)
  - type: guide
    text: □票選活動進入最後階段，主持人為發表會做總結。
  - type: guide
    text: 謝謝大家發表了自己的觀點，謝謝大家專心聆聽彼此的意見。
  - type: guide
    text: □誰會成為第一名的卡通人氣王？我們就投票來決定囉。
  - type: free_text
    prompt: 3.下列哪一個選項敘述符合本課主旨？請打勾。(單選)
  - type: guide
    text: □A.少數服從多數，最優秀的人就是你自己。
  - type: guide
    text: B.每個人都可以有不同的觀點，我們應該彼此尊重。
  - type: guide
    text: □C.只要我喜歡，有什麼不可以。
  - type: guide
    text: □D.人可以犯錯，但是不可犯同一個錯。
  - type: free_text
    prompt: 4.透過這一課，我學到了什麼？
  - type: guide
    text: 勇於發表自己的想法／尊重他人／如何找出文章主旨
