spotlight:
  lesson: G8-L3
  strategy_name: 寫作手法：看見文章結構與主旨支撐鏈
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: '這篇文章的主旨雖然是明示的，但作者不是只把主旨「講出來」；他先安排背景，再用多個意象鮮明、有具體轉折的例子，把主旨一步步撐起來。

      我們來學習作者的寫作手法：

      1.文章結構安排：導入問題→背景→具體例子→道理→總結/主旨

      2.主旨如何形成的：例子（故事）→概念（道理）→主旨（總結句）'
  - type: guide
    text: 一、寫作手法：看見本文的結構
  - type: passage
    source: unknown
    paragraphs:
    - 本文採用「導入問題→背景→例子/道理→總結/主旨」的結構，請在【  】填入對應的段落數。
  - type: fill_table
  - type: guide
    text: 二、先找主旨（明示）
  - type: guide
    text: 祕訣：主旨通常會出現在總結段
  - type: single
    prompt: 1.請在主旨段落，找出本文明示的主旨。（單選）
    options:
    - 外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇。
    - 法蘭柯戰後創設意義治療法，幫助很多人。
    answer: 外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇。
  - type: single
    prompt: 2.把主旨拆成兩個「關鍵面向」（單選）
    options:
    - 痛苦很可怕 vs 人要更堅強
    - 外在奪走 vs 內在回應
    answer: 外在奪走 vs 內在回應
  - type: guide
    text: 三、主旨怎麼來的？從例子中的轉折，推出本文的道理
  - type: guide
    text: 你已經知道文章結構與主旨，接下來做的是：
  - type: guide
    text: 驗證主旨是怎麼被段5～9的例子一步步推出來的。
  - type: guide
    text: （一）例子→概念：用例子中的轉折推出作者想說的道理
  - type: passage
    source: unknown
    paragraphs:
    - 這篇文章的每一個例子，都有一個「轉折」，把讀者從「A：外在很糟」推向「B：內在仍能…」。用A襯托B，讓B成為重點。
    - 以下例子，請你圈出或補上轉折詞，再判斷作者透過這些例子要凸顯什麼概念？
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: （二）概念→主旨：五個概念是否能支持主旨？
  - type: guide
    text: 主旨：外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇
  - type: passage
    source: unknown
    paragraphs:
    - 主旨是一句話，但你要看見：前面的概念如何共同支撐它：在壞事不可逆轉時，我仍可決定什麼？（以下均為單選）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 四、我的發現：
  - type: single
    prompt: 1.我學到的「方法流程」最接近哪一項？（單選）
    options:
    - 先看結尾主旨，再回頭找一兩個例子當佐證。
    - 先看文章結構與主旨，再用轉折抓重點，推成概念並回扣主旨。
    - 先找到每段重點，再把看起來相似的句子圈起來整理。
    answer: 先看文章結構與主旨，再用轉折抓重點，推成概念並回扣主旨。
  - type: single
    prompt: 2.用一句話統整：這些例子共同要支持的主張是什麼？（單選）
    options:
    - 外在再艱難，只要互相扶持，痛苦就會慢慢減少變淡。
    - 外在可能被奪走，但仍能在內在做選擇，決定如何回應遭遇。
    - 外在越痛苦，越要保持樂觀，才能不被情緒拖垮。
    answer: 外在可能被奪走，但仍能在內在做選擇，決定如何回應遭遇。
  - type: single
    prompt: 3.下次遇到「很多例子、最後才總結」的文章，我會怎麼讀？（複選）
    options:
    - 我先找導入問題與總結主旨，再看例子如何支持主旨。
    - 我看到但／卻／仍／就算／原來，就提醒自己：重點多半在轉折後。
    - 我把每個例子推出概念，再檢查這些概念能不能一起撐住主旨。
    - 我先記住每個故事情節，主旨通常就會自然看懂。
    answer: 我先找導入問題與總結主旨，再看例子如何支持主旨。
