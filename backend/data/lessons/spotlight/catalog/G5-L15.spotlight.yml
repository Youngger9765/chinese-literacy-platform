spotlight:
  lesson: G5-L15
  strategy_name: 提取上位概念-從具體描述提取上位概念
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 練習一：以下再以「翠玉白菜」的描述做練習，讀完後，請分別寫出「灰底文字」與「加底線文字」上位概念。
  - type: guide
    text: 上位概念：【翠玉白菜的　外型　】
  - type: guide
    text: 翠玉白菜是以一塊半白半綠的玉料雕成，玉匠巧妙利用玉質顏色的變化，將玉石綠色部分，雕出翻捲的菜葉；白色部分，雕出脈絡分明的菜莖，白、綠的漸層變化，渾然天成，有如一棵鮮嫩欲滴，可以掐出水來的白菜。更有趣的是，玉匠神來一筆，在葉片上端，雕了兩隻活靈活現的螽斯。翠玉白菜，白菜寓意清白，象徴新娘的純潔；螽斯，俗稱「紡織娘」，能高聲鳴唱，而且繁殖力很強，用來祝福新娘多子多孫。
  - type: guide
    text: (資料來源:南一國語課本)
  - type: guide
    text: 上位概念：【翠玉白菜的　含意　】
  - type: guide
    text: 練習二：一則新聞報導
  - type: passage
    source: unknown
    paragraphs:
    - 近日，新竹市發生大樓火警，兩名消防員救災時不幸殉職，眾人同感心痛。為了感謝消防員的辛苦與付出，一位國小老師帶領學生在課程中繪製感謝卡片，一同寫上感謝與紀念的文字，並送到消防隊。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: passage
    source: unknown
    paragraphs:
    - ★ 你有沒有發現，找出這則新聞報導的上位概念──「起因、目的、參與者、活動方式」以後，你就會發現這則報導，只剩4個概念、11個字了。
  - type: guide
    text: 練習三：
  - type: guide
    text: 再回到本課課文。請你往前翻2頁，你看到了嗎？「五、文章重點表」最左邊的兩個欄位，都是課文的「上位概念」哦！
  - type: guide
    text: 請你參考「五、文章重點表」，寫出下表右欄文字的上位概念。
