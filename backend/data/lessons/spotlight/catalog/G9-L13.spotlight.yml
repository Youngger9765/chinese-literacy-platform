spotlight:
  lesson: G9-L13
  strategy_name: 正向思考-學習樂觀思考
  strategy_type: sel_character
  blocks:
  - type: guide
    text: '有時候，我們不是被事情打倒，而是被自己腦袋裡的「小劇場」打敗。朋友沒回訊息、比賽失誤、考試退步，腦中就會冒出：「他一定不想理我」、「我好爛」、「完了，我不行了」的想法，這些想法聽起來像事實，其實只是大腦在「編故事」。

      　　心理學家塞利格曼博士發現，樂觀的人和悲觀的人，差別在於他們怎麼解釋失敗。

      　　悲觀的人：「這件事會一直這樣」、「都是我的錯」、「我哪裡都不行」；

      　　樂觀的人：「這只是暫時的」、「只是某個部分出錯」、「我還能改變」。

      　　而且，樂觀不是天生的，它可以練習。當我們學會用新的角度看失敗，就能讓自己有力量繼續往前。接下來，讓我們一起練習，看怎麼把腦中的負面劇本，改寫成更勇敢、更樂觀的版本。'
  - type: guide
    text: 一、自我覺察：你的大腦也在「編劇」嗎？
  - type: guide
    text: 請閱讀下列情境，勾選出你是否也曾出現這樣的想法。（沒有標準答案喔）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 如果你的答案多是「有」，代表你常被大腦的悲觀小劇場帶著走。
  - type: guide
    text: 但別擔心，樂觀是可以學習的，我們可以練習用不同角度看事情，就能減少誤會，也更容易冷靜下來解決問題。
  - type: guide
    text: 二、樂觀是可以學習的：
  - type: guide
    text: 樂觀不是假裝沒事，而是能換個角度看事情。例如：有人覺得「沒考好＝我很笨」，但也有人會想：「只是這次準備不夠，下次還能更好。」
  - type: guide
    text: 你發現了嗎？他們面對同樣的事情，情緒卻完全不同，造成的結果也會不同，這就是「詮釋」的力量。
  - type: free_text
    prompt: 1.判斷下列想法是樂觀還是悲觀？(請打勾，單選)
  - type: guide
    text: 提示：樂觀＝暫時、特定、可改變；悲觀＝永久、全面、無法改變。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.換你試試看：現在我們用第一大題的情境來練習「樂觀詮釋」
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 3.進階練習：你的同學遇到了壞事，而且有了悲觀的詮釋，請你試著把他們的詮釋改成樂觀的詮釋。
  - type: free_text
    prompt: ❶今天出門後，發現忘記帶早餐。
  - type: guide
    text: 悲觀的詮釋：我真是笨死了，連這種事情也會忘記。
  - type: guide
    text: 樂觀的詮釋：還好，我身上有帶錢，可以去合作社買。
  - type: free_text
    prompt: ❷媽媽又在提醒我寫功課。
  - type: guide
    text: 悲觀的詮釋：她就是不相信我，老是要管我，真是煩死了。
  - type: guide
    text: 樂觀的詮釋：我可以跟她溝通讀書計畫，讓她放心也給我空間。
  - type: free_text
    prompt: ❸我遇到的壞事：　今天上課被老師點名回答問題，我答錯了。
  - type: guide
    text: 悲觀的詮釋：大家一定覺得我很笨，真丟臉。
  - type: guide
    text: 樂觀的詮釋：至少我敢舉手，下次準備更充足就好。
  - type: guide
    text: '結語：面對失敗時，關鍵不在輸贏，而在你怎麼看待它。

      　　當你能把挫折看成暫時、特定、可改變的挑戰，

      　　你就不再被失敗擊倒，而是讓自己一步步變得更堅強。'
  - type: guide
    text: ※如果你三項都打勾，恭喜你！你已經學會用「樂觀的思考方式」來面對挫折，你的心理韌性正在慢慢變強！期待你未來的蛻變。
  - type: self_check
    items:
    - 我能分辨出「樂觀詮釋」與「悲觀詮釋」的差別。
    - 我能為日常挫折找到不同的詮釋方式。
    - 我能嘗試把負面想法轉成「暫時、特定、可改變」的想法。
