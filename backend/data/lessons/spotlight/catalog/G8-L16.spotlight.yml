spotlight:
  lesson: G8-L16
  strategy_name: 推論策略-推論角色關係與觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: '推論和腦補

      請試著讀底下的文字，再回答一個問題：

      　　「阿嬤在屋裡喊：『過來！』我手心立刻冒汗，連呼吸都放輕，小跑步進房間。」

      問題：作者和阿嬤的關係可能是？【□很愛阿嬤　　很怕阿嬤】

      在回答這個簡單的問題時，你已經在做推論了。

      你看，「作者很怕阿嬤」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」，最近的流行語叫做「腦補」哦。

      閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！

      這篇故事，描述了作者和阿嬤之間的互動，故事沒有把他們的關係和想法講白，而是把線索藏在對話、動作和反應裡。

      接下來要做的就是抓住這些線索，推論作者和阿嬤的關係如何改變，並進一步理解作者真正想傳達的意思。'
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 二、把三個階段串連起來看歷程。(單選)
  - type: free_text
    prompt: 1.互動方式變化（關係）：
  - type: passage
    source: unknown
    paragraphs:
    - 請選出最符合本文「作者×阿嬤」互動方式的變化？
    - 噤聲不敢回→能提出不同想法→能幽默接住刻薄
    - □②噤聲不敢回→越來越反感→逐漸疏離對立
  - type: free_text
    prompt: 2.想法變化路線：
  - type: passage
    source: unknown
    paragraphs:
    - 本文中「作者對阿嬤的想法」，變化歷程為何？(單選)
  - type: guide
    text: □覺得被討厭→覺得溝通無用→決定遠離她
  - type: guide
    text: ②先求不挨罵→不再句句當真、看懂她的愛→理解脈絡並重新詮釋
  - type: guide
    text: 三、從上述作者觀點轉變歷程，本文最想提醒讀者的是什麼?(單選)
  - type: guide
    text: 人不會被早期經驗決定一輩子；我們可以選擇怎麼理解自己的童年
  - type: guide
    text: □②長輩多半愛挑剔，孩子只能忍耐，關係很難改變
  - type: guide
    text: □③心理韌性靠打罵養成，受過嚴格管教的人一定更強
  - type: guide
    text: □④當兵最能鍛鍊意志，因此比讀書更能改變一個人
  - type: self_check
    items:
    - 我會根據對話、語氣、動作與反應，推論作者和阿嬤的關係。
    - 我會把文章線索前後連起來，推論角色關係變化歷程。
    - 我能從關係變化推到作者的觀點轉變，並進一步推論本文的主旨。
