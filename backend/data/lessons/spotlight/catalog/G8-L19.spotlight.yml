spotlight:
  lesson: G8-L19
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  blocks:
  - type: guide
    text: 一、確定議題
  - type: passage
    source: unknown
    paragraphs:
    - 這篇文章在談「哪個議題／爭議」（提示：可能出現「爭議」、「要不要」、「是否」等關鍵詞）
  - type: guide
    text: 臺灣要不要核電？
  - type: guide
    text: 二、找觀點（立場）
  - type: guide
    text: 請你整理這個議題有哪些立場/主張？主要用哪些理由？有沒有證據支持？
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、比較觀點差異（用「價值／風險」兩個角度）
  - type: passage
    source: unknown
    paragraphs:
    - 我們先用「主張＋理由＋證據」掌握每一方在說什麼；再追問理由在強調什麼──最優先的價值與最害怕的風險。用這兩個角度看，就能清楚比較觀點差異。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ＊歸納觀點差異：
  - type: guide
    text: 反對核能把「  安全優先  」放第一，因此最怕「  核災失控    」。
  - type: guide
    text: 贊成核能把「  穩定供電  」放第一，因此最怕「  能源中斷    」。
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: passage
    source: unknown
    paragraphs:
    - 你已用表格整理兩派的「理由與證據」，也用「最優先的價值／最害怕的風險」比較差異。綜合這些整理，本文主旨最可能是什麼？（單選）
  - type: multi
    prompt: 請選擇
    options: &id001
    - 列出反對與贊成的理由，提醒能源決策必須權衡利弊並持續對話
    - 用核災案例證明核能最危險，呼籲台灣立刻全面停止使用核電
    - 用用電需求與減碳壓力證明核能必要，主張台灣應立即擴建核電廠
    answer: *id001
  - type: guide
    text: 五、推論作者意圖
  - type: passage
    source: unknown
    paragraphs:
    - 你在比較表中看見兩派「優先價值」與「害怕風險」不同；作者最後提出「公開透明的數據、嚴格監管與持續對話」。作者這樣收尾，最可能想達到什麼效果？（單選）
  - type: multi
    prompt: 請選擇
    options: &id002
    - 先由專家提出完整報告並公開發布，再依報告定案執行。
    - 讓討論回到可查核資料與制度程序，降低對立與互不信任。
    - 我能找出本文兩派立場的主張、理由與證據。
    - 我能用「價值／風險」比較兩派的差異
    - 我能從「觀點比較表」推論本文主旨與作者意圖。
    answer: *id002
  - type: guide
    text: 看見本文的結構與重點
  - type: passage
    source: unknown
    paragraphs:
    - 辯論式的議題文章，常見的論述結構是：「引出議題→一方論述→另一方論述→結尾」，請在【  】填入對應的段落數，並根據課文內容完成摘要。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
