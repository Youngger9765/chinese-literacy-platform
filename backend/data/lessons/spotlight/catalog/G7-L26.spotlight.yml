spotlight:
  lesson: G7-L26
  strategy_name: 推論策略—整理重點、推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 本聚光燈旨在引導學生學習如何整理文章各段重點，並從中推論作者欲傳達的觀點。學生將透過判斷段落主旨、找出支持線索，以及統整各段文化意義，最終歸納出作者的核心觀點。
  - type: single
    prompt: 段1/ 這段重點（單選）
    options:
    - 小米酒在原住民族文化中象徵祝福與連結
    - 小米酒主要只是部落用來招待客人的飲品
    answer: 小米酒在原住民族文化中象徵祝福與連結
  - type: single
    prompt: 段1/ 支持這個重點的線索（複選）
    options:
    - 小米酒出現在播種、收穫、婚禮與祭典等重要場合
    - 對族人而言，小米酒是連結祖靈、土地與族人的重要媒介
    - 小米酒只在祭典或婚禮等隆重場合才會出現
    answer: 小米酒出現在播種、收穫、婚禮與祭典等重要場合
  - type: single
    prompt: 段2/ 這段重點（單選）
    options:
    - 釀造小米酒的步驟十分繁複，因此更能看出部落女性的技術
    - 釀造小米酒的過程十分講究，表現出對祖靈與族人的禮敬
    answer: 釀造小米酒的過程十分講究，表現出對祖靈與族人的禮敬
  - type: single
    prompt: 段2/ 支持這個重點的線索（複選）
    options:
    - 許多部落由女性負責釀酒
    - 釀酒時手要乾淨、心要平靜，不能罵人或帶怒氣
    - 挑最好的小米，蒸熟後慢慢放涼，與酒麴混合後放進陶甕發酵
    answer: 釀酒時手要乾淨、心要平靜，不能罵人或帶怒氣
  - type: single
    prompt: 段4/ 這段重點（單選）
    options:
    - 不同族群雖然都使用小米酒，但彼此的意義並不相同
    - 不同族群在不同儀式使用小米酒，意義都是祝福與連結
    answer: 不同族群在不同儀式使用小米酒，意義都是祝福與連結
  - type: single
    prompt: 段4/ 支持這個重點的線索（複選）
    options:
    - 排灣、阿美、魯凱、卑南、鄒族都在儀式中使用小米酒
    - 這些儀式都指向同一件事：小米酒是一種連結
    - 不同族群儀式的動作與細節彼此完全相同
    answer: 排灣、阿美、魯凱、卑南、鄒族都在儀式中使用小米酒
  - type: single
    prompt: 段5/ 這段重點（單選）
    options:
    - 部落日常生活裡，小米酒只是招待客人的一般飲料
    - 部落日常生活裡，以小米酒招待客人象徵分享珍貴之物與接納對方
    answer: 部落日常生活裡，以小米酒招待客人象徵分享珍貴之物與接納對方
  - type: single
    prompt: '段1: 小米酒的象徵意義'
    options:
    - 祝福
    - 敬意
    - 連結
    - 分享與接納
    answer: 祝福
  - type: single
    prompt: '段2: 釀造時的講究與禁忌'
    options:
    - 祝福
    - 敬意
    - 連結
    - 分享與接納
    answer: 敬意
  - type: single
    prompt: '段4: 小米酒在儀式中的使用'
    options:
    - 祝福
    - 敬意
    - 連結
    - 分享與接納
    answer: 祝福
  - type: single
    prompt: '段5: 在日常生活中的意義'
    options:
    - 祝福
    - 敬意
    - 連結
    - 分享與接納
    answer: 分享與接納
  - type: single
    prompt: 段1～5合在一起
    options:
    - 祝福
    - 敬意
    - 連結
    - 分享與接納
    answer: 祝福
  - type: single
    prompt: 根據前面整理出的段落重點和文化意義，最符合作者觀點的是哪一項
    options:
    - 小米酒在原住民族文化中，不只是酒，更承載著祝福、敬意、連結，以及分享與接納的意義。
    - 小米酒因為常出現在重要場合，所以是原住民族生活中受重視的傳統飲品。
    answer: 小米酒在原住民族文化中，不只是酒，更承載著祝福、敬意、連結，以及分享與接納的意義。
