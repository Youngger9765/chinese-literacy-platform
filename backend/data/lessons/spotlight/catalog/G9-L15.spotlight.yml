spotlight:
  lesson: G9-L15
  strategy_name: 比較異同與科學方法
  strategy_type: comparison
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: single
    prompt: 巨石陣和摩艾石像有一個共同的未解之謎，是什麼？
    options:
    - 它們是誰建造的
    - 古代人在沒有大型機械的情況下，如何搬運巨大的石頭
    - 石頭是從哪裡來的
    answer: 古代人在沒有大型機械的情況下，如何搬運巨大的石頭
  - type: single
    prompt: 關於巨石陣設立的目的，哪個假設目前最可能成立？
    options:
    - 外星人的基地
    - 古代的醫院
    - 古代人為了觀測天文而建造
    answer: 古代人為了觀測天文而建造
  - type: single
    prompt: 關於摩艾石像的移動方式，課文提到的三個假設中，哪一個有實驗支持？
    options:
    - 超自然力量移動石像
    - 用滾輪把石像移到海邊
    - 把石像立起來，用繩索拉扯移動
    answer: 把石像立起來，用繩索拉扯移動
  - type: free_text
    prompt: 比較巨石陣和摩艾石像，寫出一個相同點和一個不同點
