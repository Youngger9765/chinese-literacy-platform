spotlight:
  lesson: G8-L6
  strategy_name: 推論策略-推論人物的動機、情緒與想法
  strategy_type: emotion_inference
  blocks:
  - type: guide
    text: "讀故事，不能只看角色「做了什麼」，還要思考角色「為何會這麼做」。唯有深入探索人物內心，推敲他的動機、情緒與想法，我們才能真正讀懂情節和作者的用心。現在就讓我們練習看看。\n\
      　　1.推測人物的動機：在文章中，人物的動機可能會「明示」，但也可能「隱含在情節中」。例如：第九段\n(1)明示──文章直接說明原因\n   例如：奶奶嫌電費貴，不准我開燈。\n\
      　　　奶奶不准我開燈的動機是【　　怕電費太貴　　　】。\n(2)隱含──原因沒寫明，要根據上下文情節推論\n例如：導師了解我的處境，每學期都會悄悄送我參考書。\n\
      請推測導師這樣做的動機是什麼？（請打勾，單選）\n知道作者家裡沒有錢，希望作者不用花太多錢買書\n□想提升班級整體成績，以獲得優良導師獎\n◎ 小試身手：\n\
      \        理化老師讓我晚上到他空著的宿舍自習。\n請推測理化老師這樣做的動機是什麼？（複選）\n希望作者能多一點安靜空間，好好讀書\n□希望作者替老師整理宿舍並幫忙打掃\n\
      心疼作者年紀小就要面對家庭動盪，想默默扶持\n    2.推測人物情緒與想法\n例如：第二段提到：父親和伯父戲院開張後，電視錄影帶崛起，戲院沒幾個客人。\n\
      \  你覺得父親和伯父對這情況可能會有什情緒？（單選）\n擔憂  □得意\n　　　他們當時的想法是什麼？\n　　　　答：擔心戲院快撐不下去，得趕緊想辦法挽回生意。\
      \ \n\n　　你學會了嗎？推論人物行為背後動機、想法和情緒可以幫助你抓住故事重點，也能幫助你更了解故事喔！"
  - type: guide
    text: ◎ 小試身手：
  - type: free_text
    prompt: 1.推論人物背後動機
  - type: free_text
    prompt: (1)明示──文章直接說明原因
  - type: free_text
    prompt: ❶第四段：父親為了填補戲院虧損，在戲院旁搭鐵皮屋賣香菸、檳榔和零食。
  - type: passage
    source: unknown
    paragraphs:
    - 父親賣東西的動機是想要【　　多賺點錢/填補戲院虧損  】。
  - type: free_text
    prompt: ❷第三段：後來他們甚至到賭場碰運氣，妄想一夜致富。
  - type: passage
    source: unknown
    paragraphs:
    - 他們去賭場的動機是【想要解決財務的困難/妄想一夜致富  】。
  - type: guide
    text: ※上述可推論當時作者的家境如何？(單選)【有困難　　□富有】
  - type: free_text
    prompt: (2)隱含──原因沒寫明，要根據情節推論
  - type: guide
    text: 第三段：作者看見爸爸和一群人在社區活動中心聚賭，他神色木然，我則漲紅了臉快步離開。
  - type: guide
    text: 為什麼作者會想要快點離開? （單選）
  - type: guide
    text: 覺得爸爸在公開場合賭博，覺得好丟臉
  - type: guide
    text: □想趕回戲院幫忙賣檳榔，擔心耽誤生意
  - type: guide
    text: □那群人中有作者暗戀的對象，作者感到不好意思
  - type: free_text
    prompt: 2.推論人物情緒與想法
  - type: free_text
    prompt: ❶第九段：顧檳榔攤時最怕遇見同學，我乾脆埋頭寫練習卷避開尷尬。
  - type: guide
    text: 你覺得作者當時可能有什麼情緒？(單選) □憤怒　　丟臉
  - type: guide
    text: 作者當時的想法是什麼？【不想讓同學看到他在顧檳榔攤 　 】
  - type: free_text
    prompt: ❷第六段：那天起，每晚我總要等到他們平安進門，才能安心睡著。
  - type: guide
    text: 你覺得作者每晚睡前可能有什麼情緒？(單選) 擔心　□安心
  - type: guide
    text: 當父母還沒回家，作者的想法是什麼？【怕父母會發生什麼意外 　】
  - type: guide
    text: ※總結：透過這些練習，你已經學會了推論人物的動機、情緒與想法，下次讀故事，相信你就能更快抓重點，也更能讀懂角色心裡在想什麼！
