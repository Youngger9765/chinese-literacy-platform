spotlight:
  lesson: G8-L15
  strategy_name: 推論策略-推論主要論點與作者意圖
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 一、找出觀點與支持理由
  - type: passage
    source: unknown
    paragraphs:
    - 本文第二段，作者主張(明示):啦啦隊是有價值、需要高度專業能力的職業。請從第2–4段找出支持這個主張的「觀點(看法)和支持理由(證據)」。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ※作者用四個理由說服：啦啦隊是「具有專業能力與職業價值」的工作者。
  - type: guide
    text: 二、作者要我們怎麼看待啦啦隊？（觀點與呼籲）
  - type: passage
    source: unknown
    paragraphs:
    - 前面說服你：啦啦隊很專業，作者接著把焦點推到「我們該怎麼看待她們」→請用第5–6段找出作者的觀點與呼籲。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、歸納作者主要論點/主旨(核心立場)
  - type: guide
    text: 請根據上述訊息，歸納作者的主要論點。（答案合理就好）
  - type: guide
    text: 提示①定位(她們是什麼樣的工作者) ②評價標準(不應..；應..)
  - type: passage
    source: unknown
    paragraphs:
    - ①啦啦隊是    有價值、需要專業能力   　　　  的職業工作者，
    - ②因此不應    只以外貌或服裝評價    ，應     尊重其專業與勞動       。
  - type: guide
    text: 四、作者主要意圖(作者想改變你什麼想法/態度?) (單選)
  - type: guide
    text: ①扭轉把啦啦隊當花瓶的刻板印象，引導讀者反思物化與網路惡評，呼籲以尊重眼光看待她們的專業與勞動。
  - type: guide
    text: □②分享啦啦隊的應援特色與觀賽樂趣，鼓勵讀者跟著口號投入，享受熱鬧氣氛。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: self_check
    items:
    - 我能分辨觀點（判斷句）與證據（事實描述）。
