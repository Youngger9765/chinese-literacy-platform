spotlight:
  lesson: G6-L13
  strategy_name: 自我提問-問好奇、疑惑的問題
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: "閱讀時，如果你能能夠持續的問自己問題，例如「他為什麼會這樣？」「不可思議，這是真的嗎？」「作者為什麼要寫這篇文章？」，你的閱讀就會變得更主動，你會注意到別人看不到的重點或細節，也會學得更好。這種問自己問題的閱讀策略，叫做「自我提問」。\n\
      \    要讀得好，閱讀時經常對自己提出問題，是很有效的方法喔！但不是每一個問題，都有助於文章的理解，所以底下我們要來學習怎麼問出好問題。\n1.自我提問，是有方法的，我們將會學自我提問的兩種類型：\n\
      1-1對自己好奇疑惑的地方提出問題。（本課學習目標）\n1-2對文章的重點提出問題。（下一課學習目標）\n2.對自己好奇疑惑的地方提出問題，步驟如下：\
      \ \n(1)先讀完課文，將自己好奇、疑問的地方用螢光筆畫標記。\n(2)把(1)紀錄的內容轉成問題。\n(3)確認自己提出來的，是不是「完整的問題」。完整的問題可以下面的檢核表幫忙確認。\n\
      以本課第一段為例：\n(1)將自己好奇、疑問的地方用螢光筆畫標記。\n他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。\n\
      (2)把(1)紀錄的內容轉成問題：  賴桑為什麼要種樹？ 　\n(3)檢核："
  - type: free_text
    prompt: 3.給學生的資料庫（疑問詞）
  - type: guide
    text: ◎小試身手：
  - type: free_text
    prompt: 1.判斷題：請問這些問題是否符合檢核表的3項要素？符合畫，不符合畫
  - type: guide
    text: （　）(1)作者想要藉由這篇文章告訴我們什麼道理？
  - type: guide
    text: （　）(2)賴桑的家人從不支持轉變為支持。(沒有問號)
  - type: guide
    text: （　）(3)最後的結果呢？(語意不完整)
  - type: guide
    text: （　）(4)賴桑的親友為什麼要嘲笑他？
  - type: guide
    text: （　）(5)作者為什麼將標題取名為「森林大軍的守護者」？
  - type: free_text
    prompt: 2.請你在下面段落，試著提出一個好奇或有疑問的地方。
  - type: free_text
    prompt: (1)將自己好奇、疑問的地方用螢光筆畫標記。
  - type: guide
    text: 第三段：二十九歲那年，他花了三千萬買下第一座山。卻發現整座山佈滿了垃圾及廢棄物，蒼蠅嗡嗡嗡的飛來飛去，根本沒什麼價值。原來，這裡曾是果園，因長年廢棄，讓人偷偷倒了大量的垃圾。他被眼前的景象震懾住了，但他隨即轉變念頭，告訴自己：沒關係！最壞的都留給我吧！
  - type: free_text
    prompt: (2)把(1)紀錄的內容轉成問題：【賴桑為什麼要買一座垃圾山？      】
  - type: free_text
    prompt: (3)檢核：
