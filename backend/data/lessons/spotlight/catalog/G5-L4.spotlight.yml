spotlight:
  lesson: G5-L4
  strategy_name: 拆詞釋義、從上下文推測詞義
  strategy_type: inference
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：拆詞釋義、
  - type: guide
    text: 一、請你自己檢查以下3項，確定遇到難詞時，自己是否會推論語詞的意思。
  - type: guide
    text: 二、如果三項都打勾，恭喜你，你已經學會推詞義的方法囉，也更能理解文章內容。你超厲害的！
  - type: free_text
    prompt: (1)網路謠言引發不必要的(  E  )，政府呼籲大家要冷靜。
  - type: free_text
    prompt: (2)他(  D  )的描述昨晚的驚悚電影，讓人聽得毛骨悚然。
  - type: free_text
    prompt: (3)當裁判舉起手準備宣布比賽結果時，全場(  B  )，等待裁判的宣布。
  - type: free_text
    prompt: (4)他看到幾個成功的創業故事，就以為創業一定能賺大錢，這種想法有(  C  )，因為他忽略了失敗的案例。
  - type: free_text
    prompt: (5)這款手機的外型與前一代產品(  A  )，消費者反應平平。
  - type: free_text
    prompt: (6)奧運選手的表現成為社群媒體上的(  F  )話題。
  - type: free_text
    prompt: (7)這支影片上線不到一天，(  G  )就突破十萬，太驚人了！
  - type: free_text
    prompt: (8)政府推動防災演練、疫情預警系統、食品安全檢驗等，都是提升全民(  I  )的措施。
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: null
  - type: self_check
    items:
    - 我會用「拆詞釋義」的方法推測詞語的意思。
    - 我會從上下文的線索來推想詞義。
    - 如果只用一種方法還不能確定意思，我可以兩種方法一起用。
