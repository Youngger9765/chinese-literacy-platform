spotlight:
  lesson: G5-L22
  strategy_name: 自我管理-時間管理四步驟
  strategy_type: sel_character
  blocks:
  - type: guide
    text: "課文中，學生棒球員每天在學業與訓練之間掙扎。當時間不夠時，他們必須學會取捨與調整，才能兼顧球技與課業。其實，我們也常遇到這樣的情況：作業、考試、活動、補習都都擠在同一天，時間根本不夠用！\n\
      \    這一課要帶你練習——當時間不夠時，如何抓重點、排優先順序。\n我們來試試一個好用的方法——時間管理四步驟：\n❶制定計畫(覺察)──先看清「有多少事情」或「時間花在哪裡」。\n\
      ❷設定優先順序(拆解)──分出哪些事情最重要、最急，該先做。\n❸合理安排時間(行動)──把要做的事排進時間表，照著去做。\n❹保持彈性(反思)──有突發狀況，懂得調整。\n\
      \  掌握這四步，生活會更有節奏，也更有效率。"
  - type: guide
    text: 情境一：功課太多的夜晚
  - type: guide
    text: 子安今天晚上事情特別多！白天老師指定一堆作業，明天還有小考。
  - type: guide
    text: 偏偏今晚又有補習班的課程，到晚上9點才能回家。
  - type: guide
    text: 他看著書包裡的課本和作業，心想：「那麼晚開始，來得及嗎？」
  - type: guide
    text: 如果你是子安，可以依據以下步驟來安排這個晚上的時間哦。
  - type: guide
    text: ①覺察——列出今晚的任務（可複選）
  - type: guide
    text: ※想一想：
  - type: guide
    text: 現在已經晚上9點了，你大約還有多少時間可以完成任務？
  - type: guide
    text: 小時
  - type: single
    prompt: 請選擇
    options:
    - 拆解——分清輕重緩急，設定優先順序
    - 行動——合理安排時間，確實執行
    answer: 拆解——分清輕重緩急，設定優先順序
  - type: guide
    text: 時間有限時，要先判斷什麼該先做。請從上面勾選的任務中，標註優先順序，並排出學習時間：
  - type: guide
    text: ※提示：
  - type: guide
    text: '明天要考試的科目屬於「重要又緊急」；

      作業也要交，但可先集中火力在最急、影響較大的任務上。'
  - type: guide
    text: ④反思──學會靈活調整
  - type: guide
    text: 計畫不一定能完全照著走，但可以保持彈性，學會靈活調整。
  - type: guide
    text: 請勾選你今晚可能會這樣做的選項：
  - type: guide
    text: 情境二：比賽與考試撞期的兩難
  - type: guide
    text: 你是校隊成員（或社團成員），這週末有一場重要比賽，
  - type: guide
    text: 但老師也宣布下週一要段考。
  - type: guide
    text: 練球和複習都很重要，但時間根本不夠。
  - type: guide
    text: 你開始煩惱：「我該怎麼安排？」
  - type: guide
    text: 這次我們從步驟②開始做練習
  - type: guide
    text: ②拆解──判斷優先順序
  - type: guide
    text: 當時間不夠時，我們可以先分清楚：哪一件事「短期影響」更大？（可依自己情況選）
  - type: guide
    text: ③行動──時間不夠時，我要怎麼執行？
  - type: guide
    text: 比賽和段考都很重要，但時間不夠時，關鍵是要「改變做法」。請從下面五種時間調整策略中，選出你覺得可行的行動。
  - type: figure
    referent: table
    asset: fig2.png
    bind_paragraph: null
  - type: guide
    text: '我這次最想實行的三項調整是：

      ①＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿

      ②＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿③＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿'
  - type: guide
    text: ④反思──找到最適合自己的時間管理方式
  - type: guide
    text: ※想一想：我這樣調整的目標是什麼？（可複選）
  - type: guide
    text: 如果再次遇到這種情況，我會：
  - type: guide
    text: →____________________________________________
  - type: guide
    text: ※最後想一想：
  - type: guide
    text: 在時間管理上自己最想改進的一件事是＿＿＿＿＿＿＿＿＿＿＿。
  - type: guide
    text: 我學會了時間管理嗎？請在符合的項目打勾，看看自己學到了什麼？
  - type: figure
    referent: table
    asset: fig3.png
    bind_paragraph: null
