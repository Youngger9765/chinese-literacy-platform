spotlight:
  lesson: G4-L11
  strategy_name: 推論策略-推論情緒和感受
  strategy_type: emotion_inference
  blocks:
  - type: guide
    text: 上一課我們已經學過怎麼透過「理解現場情境」與「觀察角色言行」的策略，來推敲人物內心的情緒與感受。這篇故事的情境，延續上一課公車博愛座的議題，各角色也有豐富的情緒變化，接下來，我們繼續來練習推論文章中角色的情緒和感受，並進一步體會故事傳達的意義。
  - type: guide
    text: 一、推論情緒和感受有方法-換位思考
  - type: guide
    text: (一)理解現場情境
  - type: guide
    text: 小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。可以試著「換位思考」—就是試著站在人物的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？
  - type: single
    prompt: '❶ 找情境：故事一開始，老爺爺上車後發生了什麼情況？（請在□打勾）

      車上沒有空位，卻有一位年輕人坐在博愛座上看書。

      □年輕人主動起身讓座，老爺爺順利坐下休息。'
    options:
    - 車上沒有空位，卻有一位年輕人坐在博愛座上看書。
    - 年輕人主動起身讓座，老爺爺順利坐下休息。
    answer: 車上沒有空位，卻有一位年輕人坐在博愛座上看書。
  - type: free_text
    prompt: ❷ 推情緒：看到這種情況，你猜作者（我）的心情是什麼？為什麼？
  - type: guide
    text: □開心，因為他看到年輕人坐車還在看書，值得讚賞
  - type: guide
    text: 不高興，因為他認為年輕人沒有讓座給老人家。
  - type: free_text
    prompt: ❸ 換位思考：如果是你，看見需要幫助的老人沒有座位，心裡會有什麼感受呢？ 【　　我會覺得生氣，年輕人怎麼可以坐博愛座　】
  - type: guide
    text: 小撇步
  - type: passage
    source: unknown
    paragraphs:
    - 推論情緒或感受，也可以用身歷其境的方法換位思考，想一想，「如果是你呢？你會有什麼感受？」這個方法，會讓你更容易體會角色的情緒與感受喔！
  - type: guide
    text: （二）觀察角色言行
  - type: guide
    text: 小祕訣：角色「說話內容、語氣、動作、表情」常常透露出他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。
  - type: free_text
    prompt: ❶ 觀察言行：(第三段) 我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。
  - type: free_text
    prompt: ❷ 找情緒：請找出這一段作者明白寫出來的情緒或感受？（複選）
  - type: guide
    text: 【不高興　　糾結、猶豫　　□懷疑　　】
  - type: guide
    text: ◎你發現了嗎，角色的情緒或感受，也有可能明白寫在文中喔！但角色的情緒或感受，如果沒有明白寫出來，你就需要進一步根據線索做推論喔。
  - type: guide
    text: 二、從故事發展，推論「作者」（我）的情緒或感受變化
  - type: guide
    text: 三、推論主旨或目的
  - type: passage
    source: unknown
    paragraphs:
    - 從作者的說話、語氣、動作，我們可以看到，老爺爺差點跌倒後，作者開始指責年輕人，表現出「生氣」的情緒；後來當他發現真相後，不但臉紅、快步追上對方，還低聲道歉，顯現出「慚愧、懊悔」的心情。最後，讓我們來想想，透過作者的情緒和行為變化，這個故事想要告訴我們什麼？（請在□打勾，複選）
  - type: guide
    text: 「對事情的理解程度」會能改變一個人的情緒和態度。
  - type: guide
    text: □遇到自己被誤會時，要勇敢站出來把真相說清楚。
  - type: guide
    text: 勇敢承認自己的錯誤，也是一種重要的勇氣。
  - type: guide
    text: ◎換你試試看-年輕人視角
  - type: guide
    text: 一、請推論寫下「持拐杖那位年輕人」的情緒或感受（答案合理即可）
  - type: figure
    referent: table
    asset: fig2.png
    bind_paragraph: null
  - type: guide
    text: 二、請推論寫作意圖
  - type: passage
    source: unknown
    paragraphs:
    - 年輕人從頭到尾沒有為自己解釋，最後只說：「我習慣了。」你覺得，作者寫出這樣的角色，想提醒我們什麼？（單選）
    - '身心障礙者經常被誤解的無奈與委屈。

      □忍讓是最好的處理方式，不需要解釋。

      ◎ 自我檢核'
  - type: guide
    text: 一、請你自己檢查以下2項，確定自己是否會推論情緒和感受了。
  - type: guide
    text: 二、如果兩項都打勾，恭喜你，你已經學會找推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！
  - type: figure
    referent: table
    asset: fig3.png
    bind_paragraph: null
