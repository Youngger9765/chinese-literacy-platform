spotlight:
  lesson: G9-L8
  strategy_name: 圖表繪製與判讀-折線圖
  strategy_type: image_text
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：圖表繪製與判讀
  - type: guide
    text: 例如：圖一是臺灣新生兒及全國性別比變化圖，
  - type: free_text
    prompt: (1)先觀察圖表類型：折線圖
  - type: free_text
    prompt: (2)閱讀標題：
  - type: guide
    text: 臺灣新生兒及全國性別比變化圖
  - type: free_text
    prompt: (3)閱讀橫軸與縱軸名稱：
  - type: guide
    text: 橫軸－民國/年
  - type: guide
    text: 縱軸－性別比，性別比是指
  - type: guide
    text: 女生和男生的比率，例如110表示，女生100人，男生110人。
  - type: single
    prompt: (4)理解圖例：
    options:
    - ––   代表  新生兒性別比
    - 全國性別比
    answer: ––   代表  新生兒性別比
  - type: guide
    text: ·······代表  □新生兒性別比   全國性別比
  - type: free_text
    prompt: (5)讀出統計圖表達什麼
  - type: guide
    text: A.從新生兒性別比（––）來看
  - type: free_text
    prompt: ❶根據圖一，對照橫軸與縱軸，找出新生兒性別比
  - type: free_text
    prompt: ❷由表格可看出，比較新生兒性別比（空格內填＞、＝或＜）
  - type: guide
    text: 民國80年男生 ＞ 女生，民國110年男生 ＞ 女生
  - type: single
    prompt: ❸可推論(單勾選)
    options:
    - 臺灣重男輕女的觀念仍然存在。
    - 臺灣人口呈現負成長趨勢。
    answer: 臺灣重男輕女的觀念仍然存在。
  - type: guide
    text: B.由全國性別比（·······）來看（空格內填上升或下降）
  - type: free_text
    prompt: ❶由右圖可知，
  - type: guide
    text: 男生從民國80年到民國110年全國性別比均呈現【下降　】趨勢。
  - type: free_text
    prompt: ❷由上述資料，可推論(單勾選)
  - type: guide
    text: 男生的人口數量逐漸減少。
  - type: guide
    text: □男生的人口數量逐漸增加。
  - type: guide
    text: １．請由圖二臺灣近百年來的人口成長變化圖研判，下列何者是(Ⅲ)階段的特徵？
  - type: free_text
    prompt: (1)判斷類型：此題為【折線圖　   】。
  - type: free_text
    prompt: (2)閱讀標題：臺灣近百年來的人口成長變化圖。
  - type: free_text
    prompt: (3)閱讀橫軸與縱軸名稱：
  - type: passage
    source: unknown
    paragraphs:
    - 橫軸－【民國/年　　　】，縱軸－【出生率、死亡率  　　 】。
  - type: free_text
    prompt: (4)讀出統計圖表達什麼：
  - type: free_text
    prompt: ❶請根據圖二，完成下表。
  - type: free_text
    prompt: ❷請根據圖二完成下面的表格。（空格內填高或低）
  - type: passage
    source: unknown
    paragraphs:
    - A.第(Ｉ)階段出生率【 高     】、死亡率【 高     】。
    - B.第(II)階段出生率【 高      】、死亡率【  低     】。
    - C.第(III)階段，出生率【  低     】、死亡率【 高     】。
  - type: free_text
    prompt: ❸由上述資料，可推出(空格填Ⅰ、II或 III)
  - type: passage
    source: unknown
    paragraphs:
    - A.第【 III  】階段，人口開始進入負成長。
    - B.第【 II   】階段，人口總數快速增長。
  - type: free_text
    prompt: 2. 112國中會考社會科練習題：
  - type: free_text
    prompt: (1)判斷類型：此題為【 折線圖   】。
  - type: free_text
    prompt: (2)閱讀標題：收入最高20%及最低20%的家庭可支配所得成長率變化。
  - type: free_text
    prompt: (3)閱讀橫軸與縱軸名稱：
  - type: guide
    text: 橫軸－【 年度   】及縱軸－【 成長率   】。
  - type: free_text
    prompt: (4)理解圖例：(單勾選)
  - type: single
    prompt: ❶—— 代表  收入最高20%家庭   □收入最低20%家庭
    options:
    - 收入最高20%家庭
    - 收入最低20%家庭
    answer: 收入最高20%家庭
  - type: single
    prompt: ❷…… 代表  □收入最高20%家庭   收入最低20%家庭
    options:
    - 收入最高20%家庭
    - 收入最低20%家庭
    answer: 收入最低20%家庭
  - type: free_text
    prompt: (5)讀出統計圖表達什麼：
  - type: free_text
    prompt: ❶請根據圖(九)，完成下表。
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: 目標策略：圖表繪製與判讀
  - type: free_text
    prompt: ❷請根據圖(九)完成下面的表格。（空格內填上升或下降）
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: 目標策略：圖表繪製與判讀
  - type: single
    prompt: ❸請根據圖(九)，勾選答案(單選)：
    options:
    - A.圖中
    - 看得出 看不出  經濟大幅衰退與區域發展的關係。
    - B.在網路泡沫和金融海嘯時期，兩條線（虛線和實線）的距離都較其他時間來的大，所以可判斷貧富差距  增大
    - 縮小。
    answer: A.圖中
  - type: free_text
    prompt: ❹可推論：(對的畫，錯的畫)
  - type: guide
    text: （　　） (A)收入較高者的財富減損情況漸嚴重。
  - type: guide
    text: （　　） (B)收入較低者的生活面臨較嚴重衝擊。
  - type: guide
    text: （　　） (C)經濟大幅衰退造成區域間發展不均。
  - type: guide
    text: （　　） (D)經濟大幅衰退反而縮小了貧富差距。
  - type: free_text
    prompt: 3. 自由挑戰題：111國中會考社會科練習題
  - type: free_text
    prompt: (1)判斷類型：此題為【   折線圖   】。
  - type: free_text
    prompt: (2)閱讀標題：不同年份出生的婦女，在育齡期間累積的生育數。
  - type: free_text
    prompt: (3)閱讀橫軸與縱軸名稱：
  - type: guide
    text: 橫軸－【   年齡   】及縱軸－【    累積生育數     】。
  - type: free_text
    prompt: (4)讀出統計圖表達什麼（特殊之處）：
  - type: guide
    text: A.當大家都30歲時，1950年代出生的婦女，累積生育【  2.5  】人，
  - type: guide
    text: 1980年代出生的婦女，累積生育【  1   】人。
  - type: guide
    text: B.代表生育率的【  下降   】。（空格內填上升或下降）
  - type: single
    prompt: (5)結論：該國未來【  少子化    □高齡化  】問題嚴重，
    options:
    - 高齡化
    - 】問題嚴重，
    answer: 】問題嚴重，
  - type: guide
    text: 必須【  提升生育率      】。(勾選和填寫)
