spotlight:
  lesson: G6-L12
  strategy_name: 摘要策略-從段落找主題句
  strategy_type: summary
  blocks:
  - type: guide
    text: '主題句指的是段落中最重要的句子，能夠簡單的說明整段的意思。有的作者在寫作時，會有清楚的主題句，我們在閱讀時，如果可以找出各段落的主題句，就能快速掌握文章要傳達的重點。底下是找出主題句的兩個步驟：

      一、切句子：找出段落中的句號、驚嘆號、分號與問號，運用這些標點符號，將一個段落分成幾個句子。

      二、找主題句：找出最能說明段落重點的句子，這個句子通常會和文章主題相互呼應。

      例如：<如何製作好喝的烏龍茶?>

      第一步：切句子（把段落裡的句子區分出來）

      ❶我們今天去參觀烏龍茶的製作過程。／❷師傅們先將剛摘下來的茶葉曬過，以減少水分；／❸接著讓茶葉發酵，高溫處理，保留茶葉的香氣；／❹最後，將茶葉乾燥、烘焙為好喝又清香的烏龍茶。

      →我總共分出（　4　）句。

      第二步：找主題句（最能說明段落重點的句子）

      (1)想想句子的關係，第❶句先告訴讀者今天參觀烏龍茶的製作過程，第❷、❸、❹句再仔細解釋製作的過程。

      (2)哪一個句子最能說明段落的重點？→因為我發現第❶句已包含第❷、❸、❹的內容，所以第（　１　）句為主題句。'
  - type: guide
    text: ◎ 小試身手一：＜咦，北極熊是什麼顏色？＞
  - type: passage
    source: unknown
    paragraphs:
    - 很多人誤以為白色的北極熊有一身雪白光亮的毛。／事實上，北極熊的毛根本不是白色的，而是透明的！／我們現在看到的白色，是因為透明中空的毛髮經過光線反射，才會讓我們覺得北極熊的毛是雪白色的。／
    - 第一步：切句子（把段落裡的句子區分出來）
    - →我總共分出（　３　）句。
    - 第二步：找主題句（最能說明段落重點的句子）
  - type: free_text
    prompt: (1)想想句子的關係，第❶句說出人們對北極熊既定的印象，第❷句說明北極熊的毛其實是透明的，第❸句是補充說明北極熊的毛為什麼是透明的原因。
  - type: free_text
    prompt: (2)所以哪一句是主題句？→我發現段落重點應該是呼應標題說明「北極熊是什麼顏色？」，所以第（　2　）句為主題句。
  - type: guide
    text: ◎ 小試身手二：＜愛冒險的公猴＞
  - type: guide
    text: 其實不只是人類，所有的雄性哺乳類動物都普遍比較喜歡冒險。／有兩位人類學家研究日本的短尾猴二十幾年，他們發現剛出生時，公猴和母猴的比例大約是5：5，但因為大量的青少年公猴死亡，到成年時，這個比例下降到1：5──一隻公猴：五隻母猴。／人類學家仔細檢視21年的觀察資料後發現，公猴比較喜歡做危險的動作。／例如，從這棵樹跳到那棵樹，母猴總是小心翼翼，寧願爬下樹、走到另一棵樹、再爬上去。／但公猴總是自命不凡，認為這點距離易如反掌，奮力一跳的結果是……摔死了。／公猴也比較不會審時度󠇡勢，喜歡冒險通過附近的公路，結果常常被高速行駛的車輛撞上，一命嗚呼。／
  - type: passage
    source: unknown
    paragraphs:
    - 第一步：切句子（把段落裡的句子區分出來）
    - →我總共分出（　６　）句。
    - 第二步：找主題句（最能說明段落重點的句子）
  - type: free_text
    prompt: (1)想想句子的關係，第（　１　）句說出雄性哺乳類動物普遍都喜歡冒險，第（　2　 ）～（　6　 ）句用例子支持雄性哺乳類動物普遍都喜歡冒險。
  - type: free_text
    prompt: (2)所以哪一句是主題句？→第（　１　）句。
