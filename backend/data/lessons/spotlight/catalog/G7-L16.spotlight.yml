spotlight:
  lesson: G7-L16
  strategy_name: 解決問題-麥肯錫解決問題法
  strategy_type: problem_solving
  blocks:
  - type: guide
    text: '果醬男孩林韡勳，在創業與經營果醬事業時，遇到了許多困難，但他想了許多方法，終於解決自己的問題。日常生活中，我們也會遇到一些挑戰，如何解決問題，其實也有步驟可以參考喔！

      有邏輯的思考與分析問題，會讓解決問題變得更容易。下面讓我們認識一下麥肯錫公司的「問題解決流程」吧！'
  - type: free_text
    prompt: 1.接下來就讓我們用第六段林韡勳的例子來仔細說明這四個步驟吧！
  - type: free_text
    prompt: (1)認清問題：一開始要了解現狀，確認自己要解決的問題是什麼。
  - type: free_text
    prompt: (2)拆解問題：更仔細的分析問題，可以將問題拆成更小的問題，或找出造成問題的可能原因。
  - type: free_text
    prompt: (3)思考解決方案：確定問題後，針對問題提出解決方法，在思考解決方案時，只要和問題有關的方法，都可以提出來，即使提出的方法可能不切實際都沒有關係，若有人可以一起討論會更好。
  - type: free_text
    prompt: (4)選擇解決方案並執行：選擇可行的、最有效的方案去執行，實際執行後再依據狀況修正問題或解決方案。
  - type: free_text
    prompt: 2.換你試試看：我們要來練習第三步驟的「思考解決方案」。現在面臨的問題是滑手機滑到沒寫功課，請先提出各種可能的解決方案，再判斷這個方案是不是可行，可行的畫Ｏ，不可行的打Ｘ。底下提供兩範例，你自己想３個哦。
