spotlight:
  lesson: G4-L8
  strategy_name: 推論策略-找出文章主旨
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: "「主旨」是作者在寫作時，想要傳達給讀者的主要想法或訊息。我們在閱讀時，如果可以找出文章主旨，就能快速掌握文章要傳達的重點。\n　　我們可以利用底下的三種線索找出主旨。\n\
      線索一：從文章題目找主旨\n文章題目經常會明示或暗示文章的主旨，我們可以想想作者為何訂下這樣的題目，再比對內容，了解作者的想法。\n例如：＜昆蟲的保命妙招＞\n\
      →文章主旨是：　　昆蟲有許多保護自己的方法　　　。\n\n線索二：從文章的開頭或結尾找主旨 \n有些文章在開頭或結尾段提示了文章的主旨。\n例如：＜小孩與糖果＞──本文選自伊索寓言\n\
      　　一個小孩把手伸進裝滿糖果的瓶子中，他想盡可能地抓上一大把。但是當他想要伸出手來時，手卻被瓶口卡住了。他一個糖果也不願意放，因此手緊緊卡住，拔不出來，急得哭了起來。一個路人對他說：「你還是知足點兒吧，只要少拿一半，你的手就不會卡在瓶口了。」人還是要知足，貪多可能危害自己啊。\n\
      →文章主旨是：告訴讀者　人要知足，不可貪心       　。\n\n線索三：從段落大意或關鍵語句找主旨\n有時作者會在文章的某個段落，用關鍵句明示或暗示出想表達的觀點。\n\
      \n\n例如：＜ＯＯ的重要＞ ──本文修改自國立編譯館\n　　小明放學回家，告訴媽媽：「老師說，學校的春季旅行在四月二日上午出發。參加的同學，要準時到校，在操場上集合。」\n\
      　　媽媽問小明說：「老師說幾點要到學校集合？」\n　　小明想了想說：「好像是八點，差不多跟平常一樣時間到校就好了，沒什麼關係吧。」\n　　媽媽說：「不能說『好像是』，也不能『差不多』!守時是很重要的事。不能遲到，讓大家等你一個人。你明天到學校，一定要再問老師。」\n\
      　　小明說：「我知道了，我明天會再問老師。我也一定會守時，請媽媽放心。」\n1.請先將媽媽的話，用螢光筆畫起來。\n2.從媽媽的話推論「本文主旨」是說明：　守時的重要　　\
      \ 　。"
  - type: guide
    text: ◎ 小試身手：以本課＜最美的畫面＞為例
  - type: guide
    text: 線索一：從文章題目找主旨
  - type: free_text
    prompt: 1.請問根據課文的文章題目是最美的畫面，可以找出主旨嗎？
  - type: guide
    text: □可以　不可以
  - type: guide
    text: 線索二：有些文章在開頭或結尾段提示了文章的主旨。
  - type: guide
    text: 現在，我出門也會在背包裡放一本書，一有空檔就拿出來讀，我猜，現在我也成了別人眼中最美的畫面啦！
  - type: free_text
    prompt: 2.作者覺得自己在別人眼中最美的畫面是：　看書的樣子　    　。
  - type: guide
    text: 線索三：從段落大意或關鍵語句找主旨。(課文第三段)
  - type: guide
    text: 瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。
  - type: free_text
    prompt: 3.作者覺得阿姨閱讀時的樣子如何? 　專注而優雅　            。
  - type: free_text
    prompt: 4.總結上述線索，本文的主旨是：
  - type: guide
    text: 作者鼓勵讀者【  多閱讀　】，成為別人眼中【  最美的畫面　　   】。
