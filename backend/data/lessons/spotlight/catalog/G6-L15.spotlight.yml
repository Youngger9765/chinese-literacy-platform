  - type: single
    prompt: 根據「其他例子」中關於學習不佳的事件，哪一個選項最符合「事實」的描述？
    options:
    - 我看到這次的數學成績不好。
    - 我覺得很難過，而且很丟臉。
    - 因為考試前，我沒有複習功課，還打電動，平時上課也不認真，才會導致我數學不及格。
    - 未來我可以改掉不好的學習行為，上課認真，不會的再去問師長，電動利用空閒時間再玩。
    answer: 我看到這次的數學成績不好。
