spotlight:
  lesson: G6-L15
  strategy_name: 自我提問-4F思考法自我提問
  strategy_type: express_opinion
  blocks:
  - type: guide
    text: ◎小試身手:看完課文，請你利用自我提問策略，寫出你的思考歷程。
  - type: free_text
    prompt: "【事實】\n問自己：這篇文章／事件什麼地方令我印象深刻？\n（句型：我看到了．．．）\n請寫下你的答案。"
  - type: free_text
    prompt: "【感受】\n問自己：對於這個事情，我感受到了什麼情緒？\n（句型：這個事件，我感到．．．（情緒））\n請寫下你的答案。"
  - type: free_text
    prompt: "【反思】\n問自己：我們做了什麼事，才會導致這件事的發生？\n（句型：因為．．．，才會．．．。）\n請寫下你的答案。"
  - type: free_text
    prompt: "【行動】\n問自己：我們未來應該怎麼做？才能避免這種情況發生？\n（句型：未來我們可以．．．）\n請寫下你的答案。"
  - type: single
    prompt: 根據「本文例子」中關於小藍鯨的事件，哪一個選項最符合「事實」的描述？
    options:
    - 我看到了人類為了方便，亂丟漁網到海裡，造成小藍鯨的死亡事件。
    - 對於小藍鯨的死亡，我感到很震驚又難過。
    - 因為人類貪圖方便，亂丟垃圾，才會汙染海洋。
    - 未來我們可以宣導環境保護，不亂丟垃圾，多參與淨灘活動。
    answer: 我看到了人類為了方便，亂丟漁網到海裡，造成小藍鯨的死亡事件。
