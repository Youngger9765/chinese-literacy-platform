spotlight:
  lesson: G5-L9
  strategy_name: 推論策略-從言行推論人物特質
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: 我們可以從一個人說的話、做的事來推論角色的人物特質。閱讀時，讀者若能從文中線索推論人物特質，就能對文章有更好的掌握，理解文章主旨。
  - type: free_text
    prompt: 1.將支持理由與所屬種類連起來，並找出課文提到的周天成的人物特質。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.除了上述特質，周天成還有其他的特質，請由文章中支持的理由推論人物特質。（單選）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
