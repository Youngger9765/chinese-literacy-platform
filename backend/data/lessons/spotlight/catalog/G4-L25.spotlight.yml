spotlight:
  lesson: G4-L25
  strategy_name: 身體覺察與照護
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 練習一：身體照護檢核表──透過營養、水分、休息三個面向來看看自己的身體照護習慣吧！
  - type: guide
    text: ＊營養：
  - type: guide
    text: ＊水分：
  - type: figure
    referent: table
    asset: fig10.png
    bind_paragraph: null
  - type: guide
    text: ＊休息：
  - type: figure
    referent: table
    asset: fig11.png
    bind_paragraph: null
  - type: guide
    text: ＊反思──我發現自己：
  - type: guide
    text: 做得不錯的是：□①營養補充　□②水分攝取　□③休息安排
  - type: guide
    text: 有待加強的是：□①營養補充　□②水分攝取　□③休息安排
  - type: guide
    text: 練習二：感謝身體
  - type: guide
    text: 寫下你今天最想感謝的三個身體部位，並在後方寫上原因。
  - type: guide
    text: 例1：我想感謝我的(   眼睛  )，(  讓我可以閱讀     ）
  - type: guide
    text: 例2：我想感謝我的(   手臂  )，(  幫助我完成體能訓練  ）
  - type: free_text
    prompt: (1)我想感謝我的(          )，(                           ）
  - type: free_text
    prompt: (2)我想感謝我的(          )，(                           ）
  - type: free_text
    prompt: (3)我想感謝我的(          )，(                           ）
  - type: guide
    text: 如果你的身體會說話，你覺得以下哪些句子是他最常說的？(可複選)
  - type: guide
    text: '□ ①「我有點累，可以讓我休息一下嗎？」

      □ ②「我好渴，請幫我喝點水。」

      □ ③「肚子餓了，該補充能量囉！」

      □ ④「好緊繃喔，幫我伸展一下吧。」

      □ ⑤「今天太久沒動了，帶我出去走一走！」

      □ ⑥「太久盯著螢幕了，讓眼睛休息一下。」

      □ ⑦「呼吸一下，別那麼趕。」

      □ ⑧「我表現得不錯吧？可以稱讚我一下！」

      □ ⑨「別再勉強我了，我真的需要放慢腳步。」

      □ ⑩其他：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿'
  - type: guide
    text: ◎根據你勾選的選項，想一想你可以怎麼用行動回應他？請選一個回應。(例如：十點前就上床睡覺、午休時好好休息)
  - type: guide
    text: 你的行動方案：我可以_____________________________________。
