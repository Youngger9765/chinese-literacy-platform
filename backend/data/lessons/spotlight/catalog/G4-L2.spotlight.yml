    source: unknown
    paragraphs:
    - 1「𪹚」音為「ㄅㄤˋ」為客家話發音同「棒」，源自於鞭炮爆炸的聲音，客家習俗中，龍被鞭炮炸的越烈越旺，運勢越發，希望透過傳統迎龍象徵藉神龍祥瑞之氣來聚福驅疫，帶給大家吉祥平安。是𪹚龍苗栗客庄地區特有的元宵傳統民俗。
