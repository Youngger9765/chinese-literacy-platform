spotlight:
  lesson: G7-L21
  strategy_name: 媒體素養與識讀-認識誘餌式新聞標題
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: free_text
    prompt: 1.誘餌式標題搜查：下列標題，是誘餌式標題的畫，不是的畫
  - type: free_text
    prompt: 2.誘餌式標題放大鏡：下列標題都是誘餌式標題，請將標題中的誘餌圈出來，每題至少圈出兩個
  - type: free_text
    prompt: 3.誘餌式標題顯微鏡：將標題中的誘餌使用的引誘手段代號寫進（  ）中。
  - type: guide
    text: ➀引發好奇心 ➁用誇張的句子 ➂誇大的情緒字眼
  - type: guide
    text: ➃利用熱門的話題或公眾人物
