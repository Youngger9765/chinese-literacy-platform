spotlight:
  lesson: G7-L1
  strategy_name: 寫作手法：排比─從排比歸納文意重點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: "當文章中有結構相似、意義相關的句子，且使用相同的詞或短句，並連續三句或以上，我們稱這組句子為「排比句」。使用「排比」能增加文句氣勢、加強論點，或是呈現事件具體、多元的樣貌。請看以下例子：\n\
      1.增加氣勢──「我們要追求進步，不怕困難，不懼挑戰，不畏艱險。」\n2.呈現具體、多元樣貌──「公園裡充滿春天來臨的氣息，柳樹正輕輕搖曳，花兒正灑落芬芳，蝴蝶正翩翩起舞。」\n\
      \    而閱讀排比句時，我們可以從排比句歸納、推論作者想強化的重點，如第1句強調的是「勇於面對困難」，第2句則著重於「春天來臨」。歸納後，就可將理解重點聚焦於統整後的結果，而不侷限在排比句中所提到的細節和面向。"
  - type: guide
    text: 一起來看看本篇文章中的三組排比句：
  - type: guide
    text: ※判讀方式：
  - type: guide
    text: 找出排比句型，並歸納排比句型中的內容。
  - type: passage
    source: unknown
    paragraphs:
    - (段一)當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，在音樂驚悚而畫面黯淡時，會聽到有人低語著「來了！來了！」。
  - type: passage
    source: unknown
    paragraphs:
    - (段二) 羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？
