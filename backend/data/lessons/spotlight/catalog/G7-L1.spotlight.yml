  - type: passage
    source: unknown
    paragraphs:
    - (段三) 當「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；「當街燈亮起來向村莊道過晚安」，更常是我們店裡忙得不可開交之時；當「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。
