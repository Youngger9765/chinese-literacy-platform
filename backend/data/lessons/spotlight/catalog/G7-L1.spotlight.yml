spotlight:
  lesson: G7-L1
  strategy_name: 閱讀聚光燈 - 寫作手法：排比
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: 請找出文章中的排比句型，並歸納其內容與重點。
  - type: single
    prompt: "請根據段一的排比句型，選出關於人物狀態的共同點：\n\n(段一)當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，在音樂驚悚而畫面黯淡時，會聽到有人低語著「來了！來了！」。\n\
      排比句型\n當……會……\n句型關鍵詞\n當……\n會……\n文句內容\n eq \\o\\ac(○,1)上課前大家玩鬧不休\n eq \\o\\ac(○,2)心儀對象迎面走來\n\
      \ eq \\o\\ac(○,3)三五好友一起壯膽看恐怖片\n eq \\o\\ac(○,1)面面相覷說道「來了！來了！」\n eq \\o\\ac(○,2)會聽見身旁損友竊笑「來了！來了！」\n\
      \ eq \\o\\ac(○,3)會聽到有人低語著「來了！來了！」\n共同點\n(單選)\n1.□隻身一人 好友成群"
    options:
    - 隻身一人
    - 好友成群
    answer: 好友成群
  - type: single
    prompt: "請根據段一的排比句型，選出關於事件發生時機的共同點：\n\n(段一)當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，在音樂驚悚而畫面黯淡時，會聽到有人低語著「來了！來了！」。\n\
      排比句型\n當……會……\n句型關鍵詞\n當……\n會……\n文句內容\n eq \\o\\ac(○,1)上課前大家玩鬧不休\n eq \\o\\ac(○,2)心儀對象迎面走來\n\
      \ eq \\o\\ac(○,3)三五好友一起壯膽看恐怖片\n eq \\o\\ac(○,1)面面相覷說道「來了！來了！」\n eq \\o\\ac(○,2)會聽見身旁損友竊笑「來了！來了！」\n\
      \ eq \\o\\ac(○,3)會聽到有人低語著「來了！來了！」\n共同點\n(單選)\n2.□固定時機 各種時機"
    options:
    - 固定時機
    - 各種時機
    answer: 各種時機
  - type: free_text
    prompt: 請根據段一的排比句型與共同點，將歸納重點填入句中：在【1  】的【2  】時機，都有人說【3 來了！來了！ 】。請依序填入正確的詞語。
  - type: single
    prompt: "請根據段二的排比句型，選出關於主語類型的共同點：\n\n(段二) 羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？\n\
      排比句型\n……【不是    】……【  嗎？  】\n句型關鍵詞\n……不是\n……嗎？\n文句內容\n eq \\o\\ac(○,1)羊隊和牛群\n\
      \ eq \\o\\ac(○,2)綠色的小河\n eq \\o\\ac(○,3)螢火蟲\n eq \\o\\ac(○,1)本來就會回家\n eq \\\
      o\\ac(○,2)一直都在歌唱\n eq \\o\\ac(○,3)原本就提著燈\n共同點\n(單選)\n1.皆為\n【 自然景物 □人類】"
    options:
    - 自然景物
    - 人類
    answer: 自然景物
  - type: single
    prompt: "請根據段二的排比句型，選出關於動作類型的共同點：\n\n(段二) 羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？\n\
      排比句型\n……【不是    】……【  嗎？  】\n句型關鍵詞\n……不是\n……嗎？\n文句內容\n eq \\o\\ac(○,1)羊隊和牛群\n\
      \ eq \\o\\ac(○,2)綠色的小河\n eq \\o\\ac(○,3)螢火蟲\n eq \\o\\ac(○,1)本來就會回家\n eq \\\
      o\\ac(○,2)一直都在歌唱\n eq \\o\\ac(○,3)原本就提著燈\n共同點\n(單選)\n2.皆為\n【人類動作 □動物/自然動作】"
    options:
    - 人類動作
    - 動物/自然動作
    answer: 人類動作
  - type: single
    prompt: "請根據段二的排比句型，選出作者對這些事物的看法：\n\n(段二) 羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？\n\
      排比句型\n……【不是    】……【  嗎？  】\n句型關鍵詞\n……不是\n……嗎？\n文句內容\n eq \\o\\ac(○,1)羊隊和牛群\n\
      \ eq \\o\\ac(○,2)綠色的小河\n eq \\o\\ac(○,3)螢火蟲\n eq \\o\\ac(○,1)本來就會回家\n eq \\\
      o\\ac(○,2)一直都在歌唱\n eq \\o\\ac(○,3)原本就提著燈\n共同點\n(單選)\n3.作者認為這些事都\n【理所當然 　□出乎意料】"
    options:
    - 理所當然
    - 出乎意料
    answer: 理所當然
  - type: free_text
    prompt: 請根據段二的排比句型與共同點，將歸納重點填入句中：作者認為【1  】能做出【2  】，是【3  】。請依序填入正確的詞語。
  - type: single
    prompt: "請根據段三的排比句型，選出所描述的日常事件屬於誰的日常：\n\n(段三) 當「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；「當街燈亮起來向村莊道過晚安」，更常是我們店裡忙得不可開交之時；當「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。\n\
      排比句型\n當……，……\n句型關鍵詞\n當……\n，……(後句)\n文句內容\n eq \\o\\ac(○,1)「火紅的太陽也滾著火輪子回家了」\n\
      \ eq \\o\\ac(○,2)「當街燈亮起來向村莊道過晚安」\n eq \\o\\ac(○,3)「小雞和小鴨們關在欄裡睡了」\n eq \\o\\\
      ac(○,1)我得匆忙趕回去幫忙家裡的生意\n eq \\o\\ac(○,2)更常是我們店裡忙得不可開交之時\n eq \\o\\ac(○,3)就是我和蚊子決鬥的時刻\n\
      共同點\n(單選)\n2.皆為\n【作者的日常 □楊喚的日常】"
    options:
    - 作者的日常
    - 楊喚的日常
    answer: 作者的日常
  - type: single
    prompt: "請根據段三的排比句型，選出所描述的時間點與〈夏夜〉的關係：\n\n(段三) 當「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；「當街燈亮起來向村莊道過晚安」，更常是我們店裡忙得不可開交之時；當「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。\n\
      排比句型\n當……，……\n句型關鍵詞\n當……\n，……(後句)\n文句內容\n eq \\o\\ac(○,1)「火紅的太陽也滾著火輪子回家了」\n\
      \ eq \\o\\ac(○,2)「當街燈亮起來向村莊道過晚安」\n eq \\o\\ac(○,3)「小雞和小鴨們關在欄裡睡了」\n eq \\o\\\
      ac(○,1)我得匆忙趕回去幫忙家裡的生意\n eq \\o\\ac(○,2)更常是我們店裡忙得不可開交之時\n eq \\o\\ac(○,3)就是我和蚊子決鬥的時刻\n\
      共同點\n(單選)\n3.時間點與〈夏夜〉【相同 □相異】"
    options:
    - 相同
    - 相異
    answer: 相同
  - type: single
    prompt: "請根據段三的排比句型，選出所描述的情景與〈夏夜〉的關係：\n\n(段三) 當「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；「當街燈亮起來向村莊道過晚安」，更常是我們店裡忙得不可開交之時；當「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。\n\
      排比句型\n當……，……\n句型關鍵詞\n當……\n，……(後句)\n文句內容\n eq \\o\\ac(○,1)「火紅的太陽也滾著火輪子回家了」\n\
      \ eq \\o\\ac(○,2)「當街燈亮起來向村莊道過晚安」\n eq \\o\\ac(○,3)「小雞和小鴨們關在欄裡睡了」\n eq \\o\\\
      ac(○,1)我得匆忙趕回去幫忙家裡的生意\n eq \\o\\ac(○,2)更常是我們店裡忙得不可開交之時\n eq \\o\\ac(○,3)就是我和蚊子決鬥的時刻\n\
      共同點\n(單選)\n4.情景與〈夏夜〉【□相同相異】"
    options:
    - 相同
    - 相異
    answer: 相異
  - type: free_text
    prompt: 請根據段三的排比句型與共同點，將歸納重點填入句中：【1  】原文與【2  】的日常，雖然是在【3  】的時間點，但情景【4  】，作者認為【5  】比較幸福。請依序填入正確的詞語。
