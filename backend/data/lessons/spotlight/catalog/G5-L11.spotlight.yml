spotlight:
  lesson: G5-L11
  strategy_name: 推論策略-從言行推論人物特質
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: 我們可以從一個人說的話、做的事來推論角色的人物特質。閱讀時，讀者若能從文中線索推論人物特質，就能對文章有更好的掌握，理解文章主旨。
  - type: free_text
    prompt: 1.將支持理由與相對應的人物特質連起來。
  - type: free_text
    prompt: 2.請看文章，找出田鼠阿飛的人物特質，寫下你的理由。(答案合理即可)
