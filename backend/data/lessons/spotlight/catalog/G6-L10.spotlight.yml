spotlight:
  lesson: G6-L10
  strategy_name: 摘要策略-從關鍵句找小主題與細節
  strategy_type: summary_keysentence
  blocks:
  - type: guide
    text: ◎小試身手
  - type: free_text
    prompt: 1.課文第四段：
  - type: guide
    text: 低溫乾燥的環境有利於保存種子，這座種子庫因而建造在斯瓦爾巴群島永久凍土區的山脈內部。這裡是挪威最北邊的國土，位於北極地區，冰天雪地，氣候極為寒冷，像一座大型的自然冷凍庫。種子庫的溫度維持在攝氏零下18度，這溫度可降低種子的代謝活動，並維持發芽的活性，是最適合保存種子的溫度。
  - type: free_text
    prompt: (1)找出小主題：
  - type: guide
    text: 依灰底關鍵句來看，本段的小主題是　種子銀行的【低溫環境 】。
  - type: free_text
    prompt: (2)找出與小主題最相關的重要細節（多選）
  - type: guide
    text: 種子庫建造在永久凍土區的山脈內部。
  - type: guide
    text: 溫度攝氏零下18度，可確保種子發芽的活性。
  - type: guide
    text: ⃞種子庫位於挪威最北邊的國土。
  - type: free_text
    prompt: 2.課文第六段：
  - type: guide
    text: 臺灣在2009年首度參與這項保存計畫，為了維繫臺灣原生小米的基因多樣性，2024年臺灣科學團隊特地前往北極，由三位排灣族原住民代表，將象徵繁榮和幸福的小米種子，存放在斯瓦爾巴全球種子庫。小米類穀物可以在惡劣的氣候條件下生存，抗旱又耐病蟲害，被視為極端氣候下解決糧食危機的重要作物。
  - type: free_text
    prompt: (1)找出小主題：
  - type: guide
    text: 請你先將關鍵句畫起來後，再勾選本段的小主題：（單選）
  - type: guide
    text: 臺灣也參與了種子保存計畫。
  - type: guide
    text: ⃞小米種子象徵繁榮和幸福。
  - type: guide
    text: ⃞小米種子抗旱又耐病蟲害。
  - type: free_text
    prompt: (2)找出與小主題最相關的重要細節（多選）
  - type: guide
    text: 2009年，臺灣首次參與斯瓦爾巴種子庫計畫。
  - type: guide
    text: 2024年，臺灣科學團隊將小米種子存放於此。
  - type: guide
    text: ⃞由原住民代表，將小米種子存放在全球種子庫。
  - type: guide
    text: 複習完小主題及細節，接下來就請你完成文章重點表吧！
