spotlight:
  lesson: G7-L2
  strategy_name: 用表格整理訊息-從細節解讀主要資訊
  strategy_type: info_organization
  blocks:
  - type: guide
    text: "閱讀一篇文章時，當訊息很多時，容易讓人眼花撩亂，若能善用表格做訊息的整理，就能更清楚文章的重點。整理比較表格，是把兩類事物放在一起進行比較，找出兩者之間的相同或相異處，是很常用的整理訊息的方式喔。\n\
      整理表格步驟：A.先畫出表格，「第一列」先寫出比較的對象，「第一欄」列出重點主題項目；B.再根據文章在空白格子內填入比較的訊息\n\n        \
      \   \n總結：根據這個表格進行分析，提出結論。"
  - type: guide
    text: ◎小試身手：讀完文章後，你是不是發現澳洲與臺灣有許多不同的地方？現在我們要來練習整理文章的訊息，幫助你更好抓住文章重點，若有文章未提到的訊息，可善用網路搜尋工具搜尋喔！
  - type: guide
    text: 總結：由上表可知：澳洲的人口數與臺灣差不多，但是澳洲對體育非常重視，體育設施的建設也比臺灣多，家長也重視體育，            所以這可能是澳洲得獎牌多於臺灣的原因。（答案合理即可）。
