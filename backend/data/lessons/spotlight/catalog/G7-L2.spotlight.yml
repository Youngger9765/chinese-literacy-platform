spotlight:
  lesson: G7-L2
  strategy_name: 閱讀聚光燈 - 用表格整理訊息
  strategy_type: info_organization
  blocks:
  - type: guide
    text: 請根據以下說明，學習如何使用表格整理文章訊息，並練習應用此策略。
  - type: single
    prompt: 根據文章說明，為什麼我們需要使用表格來整理訊息？
    options:
    - 讓文章看起來更美觀
    - 當訊息很多時，能更清楚文章的重點
    - 方便老師批改作業
    - 可以減少閱讀時間
    answer: 當訊息很多時，能更清楚文章的重點
  - type: single
    prompt: 根據「整理表格步驟」，畫出表格時，「第一列」應該寫什麼？
    options:
    - 重點主題項目
    - 比較的對象
    - 總結
    - 文章標題
    answer: 比較的對象
  - type: single
    prompt: 根據「整理表格步驟」，畫出表格時，「第一欄」應該列出什麼？
    options:
    - 比較的對象
    - 重點主題項目
    - 文章的結論
    - 作者的姓名
    answer: 重點主題項目
  - type: single
    prompt: 根據文章說明，完成表格填寫後，最後一個步驟是什麼？
    options:
    - 直接丟棄表格
    - 根據這個表格進行分析，提出結論
    - 將表格內容背誦下來
    - 與同學分享表格
    answer: 根據這個表格進行分析，提出結論
  - type: free_text
    prompt: 請根據課文摘要，嘗試畫出一個比較澳洲和臺灣的表格，並填入你認為重要的訊息。完成後，請寫下你的總結。
