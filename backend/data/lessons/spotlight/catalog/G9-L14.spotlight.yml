spotlight:
  lesson: G9-L14
  strategy_name: 正向思考-培養心理韌性
  strategy_type: sel_character
  blocks:
  - type: guide
    text: "生活有時候會讓人喘不過氣：壞事突然發生、努力了卻沒結果……但課文中的倫敦人告訴我們一件事：心理韌性不是不會害怕，而是雖然害怕，也能不被打敗，積極面對。\n\
      \    在課文中，倫敦的人民遇到了大轟炸這麼恐怖的事情，但仍然能夠挺過這場風暴，故事裡有三個值得學習之處：\n　　一、面對變故有彈性（適應力）→坦然面對倫敦大轟炸過後的家園\n\
      　　二、社會支持帶來的心理力量→第五、六段大家互相幫助的事蹟\n　　三、遇到挫折能保持樂觀的詮釋（復原力）→倖存者的鎮定\n　　強大的心理韌性並非與生俱來，而是可以學習的，現在我們就來練習看看吧！"
  - type: guide
    text: 一、面對突發變化保持彈性（適應力）：
  - type: guide
    text: 遇到不熟悉的情況時，可能會讓你很不舒服，哪一個想法最符合『面對變動時保持彈性』的能力？
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 當事情突然改變時，願意換個想法，就是在練習讓自己更能適應生活中的意外。
  - type: guide
    text: 二、社會支持帶來的心理力量：
  - type: guide
    text: 「社會支持」很重要，當你知道「我不孤單」、「大家可以一起努力」時，就比較不容易被打敗。遇到困難時，向別人求助不是一件壞事，更棒的是能主動去幫助別人，反而會讓你更有力量向前邁進。
  - type: guide
    text: 遇到困難時，你可以怎麼做？
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、遇到壞事能保持樂觀的詮釋（復原力）：
  - type: passage
    source: unknown
    paragraphs:
    - 樂觀不是裝開心，而是「換一個角度看事情」。下面的情境，都和課文中「沒打破我的茶壺」一樣，事情真的很糟，但有人選擇用一句話，讓自己不被擊倒。請選出最像課文中那種幽默詮釋的一句話。
  - type: free_text
    prompt: ❶颱風後，一戶人家的屋頂被掀開一個大洞。鄰居關心的問屋主：「你還好嗎？」
  - type: passage
    source: unknown
    paragraphs:
    - □ A.我真的很慘，家全被毀了。
    - B.至少家裡採光變好了。
    - □ C.都是颱風害的，氣死人了。
  - type: free_text
    prompt: ❷林肯當總統時，有人當眾嘲笑他長的很醜。
  - type: passage
    source: unknown
    paragraphs:
    - 如果你是他，哪一句回應最像用幽默化解困境？
  - type: guide
    text: □ A.我今天真倒楣，看什麼都壞掉了。
  - type: guide
    text: □ B.如果你一直笑我，你覺得我會開心嗎？
  - type: guide
    text: C.如果我有另一張臉，你覺得我會戴這張嗎？
  - type: free_text
    prompt: ❸你的手機掉進馬桶。撈起來時，螢幕一黑，完全沒反應，又沒錢換。（請寫句子作答）
  - type: guide
    text: 我的手機去泡湯了，一泡就睡著了/這次要戒手機，一定會成功了。
  - type: guide
    text: ※如果你三項都打勾，恭喜你！你已經能學會培養自己的心理韌性，你的心將會像倫敦人一樣：焚而不毀、越挫越強。
  - type: self_check
    items:
    - 面對變故時，我彈性思考，適應不熟悉的狀況。
    - 我知道自己不是一個人，可以適時尋求支持。
    - 我能把悲觀的想法，改成樂觀的詮釋，讓自己能重新站起來。
