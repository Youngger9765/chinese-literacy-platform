spotlight:
  lesson: G6-L3
  strategy_name: 解決問題-以實驗觀察找答案
  strategy_type: problem_solving
  blocks:
  - type: guide
    text: ◎小試身手：請你依據提出的科學問題，根據觀察到的證據，找到結論。
  - type: single
    prompt: 空氣是否佔有空間？
    options:
    - 空氣佔有空間。
    - 空氣不佔有空間。
    answer: 空氣佔有空間。
  - type: free_text
    prompt: 請舉出其他你知道的例子，證明空氣佔有空間。
  - type: single
    prompt: 動物會不會分工合作呢？
    options:
    - 動物會分工合作。
    - 動物不會分工合作。
    answer: 動物會分工合作。
  - type: free_text
    prompt: 請舉出其他你知道的例子，證明動物會分工合作。
