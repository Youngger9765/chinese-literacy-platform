spotlight:
  lesson: G4-L20
  strategy_name: 以不同角度的例子說明概念
  strategy_type: multiple_perspectives
  blocks:
  - type: guide
    text: 你發現了嗎？這三篇都是說明文，作者用不同角度的例子說明「物以稀為貴」與物價波動
  - type: guide
    text: 提出待說明概念 → 舉例（不同角度）→ 說明主題概念 → 下結論
  - type: guide
    text: 第一篇（商品市場）：物價由供給與需求決定
  - type: single
    prompt: 什麼因素決定了商品的價格？
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 需求＞供給
  - type: single
    prompt: 颱風來，大量青菜被風雨打壞了，青菜價格變貴
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 需求＜供給
  - type: single
    prompt: 農民搶種高麗菜，市場湧入大量高麗菜，高麗菜價格變便宜
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 需求＜供給
  - type: guide
    text: 第三篇（人力市場）：供需也會影響薪水高低
  - type: single
    prompt: 工作技術門檻高（引水人），市場稀缺性高，薪水高
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 需求＞供給
  - type: single
    prompt: 工作技術門檻低（一般工作），市場稀缺性低，薪水低
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 需求＜供給