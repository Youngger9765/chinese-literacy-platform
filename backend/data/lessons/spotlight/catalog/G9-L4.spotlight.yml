spotlight:
  lesson: G9-L4
  strategy_name: 閱讀聚光燈：表達看法——以科學證據說服人
  strategy_type: express_opinion
  blocks:
  - type: guide
    text: 這篇文章傳達了一個主張，說服讀者要讓孩子多曬太陽以預防近視。請辨識作者如何運用科學證據來支持其論點，並完成以下論述步驟。
  - type: single
    prompt: 作者首先舉出一個讓人驚訝的事實，請問是哪一個？
    options:
    - 近視的人越來越多。
    - 許多研究者把近視歸因於遺傳。
    - 受教育年數愈多，近視比例愈高。
    - 美國1970年時，近視率只有25%。
    answer: 近視的人越來越多。
  - type: single
    prompt: 作者針對這個驚訝的事實，提出了什麼論點（看法、主張）？
    options:
    - 近視是缺乏陽光所致。
    - 近視是遺傳因素造成的。
    - 近視與近距離工作時間增加有關。
    - 近視是全球性的流行病。
    answer: 近視是缺乏陽光所致。
  - type: single
    prompt: 作者為了支持其論點，舉出了哪些客觀證據？請選出其中一個。
    options:
    - 戶外活動時間與家長近視情況可有效預測學生是否會罹患近視。
    - 上海、新加坡、南韓、日本的學生近視率高達80-90%。
    - 受教育年數愈多，近視比例愈高。
    - 到2050年，全世界超過一半的人口需要戴眼鏡。
    answer: 戶外活動時間與家長近視情況可有效預測學生是否會罹患近視。
  - type: single
    prompt: 作者最後根據上述論點和證據，下了一個什麼結論？
    options:
    - 多點戶外活動，讓眼球多一點陽光的照明，可以預防近視。
    - 近距離工作是導致近視的主要原因。
    - 遺傳是近視率快速上升的關鍵因素。
    - 各國政府應推廣視力保健操以預防近視。
    answer: 多點戶外活動，讓眼球多一點陽光的照明，可以預防近視。
