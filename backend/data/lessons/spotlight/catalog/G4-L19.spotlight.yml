spotlight:
  lesson: G4-L19
  strategy_name: 用表格整理兩組對象的細節
  strategy_type: info_organization
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: 深夜，一場猛烈的火災吞噬了整棟大樓，濃煙不斷從建築物內竄出，現場瀰漫著焦味。驚慌的居民受困其中，消防員立刻趕赴現場，全力(  E  )受困者。
  - type: guide
    text: 要(  G  ) 艱難危險的救援任務，消防員必須具備專業的(  A  )，熟練操作各種滅火與救援設備。在看不清楚方向的火場中，他們的感官變得異常(  B  )，能迅速發現濃煙中的求救信號，及時搶救(  D  )者。
  - type: fill_table
  - type: guide
    text: "當文章的內容讓人看得眼花撩亂時，讀者可以試著用表格整理訊息。這樣做不但可以幫助我們掌握重點，還可以培養訊息整理的能力。在本課提到，救援行動中使用巨鼠好處多多，這時，我們就可以把狗與巨鼠放在一起進行比較，做成表格，就可以讓人一目了然兩者的差異囉。\n\
      整理表格步驟：\nA.請在表格的「第一列」先寫出比較的對象：巨鼠與狗\nB.找出比較的重點，當文章中出現像是「但是」、「不同」、\n「比較」這些語詞時，就表示作者可能正在拿兩件事來比較喔！\n\
      　範例：訓練有素的巨鼠可以跟多位訓練員合作，\n        但狗通常只接受一位訓練員的指導。\n❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）\n\
      \  巨鼠可以跟　多位　□一位　訓練員合作，\n　狗只接受　　□多位　一位　訓練員指導。\n❷這句話比較的重點是什麼？\n　可合作訓練員數量　　□嗅覺能力　\n\
      C.將比較重點：「可合作訓練員數量」填入「第一欄」\nD.在空白格子內填入比較的結果\n     巨鼠可合作訓練員數量多位，狗可合作訓練員數量只有一位。\n\
      \t\n　　\n總結：根據這個表格進行分析，提出結論。"
  - type: guide
    text: ◎小試身手：
  - type: free_text
    prompt: 1.現在讓我們找出每一題比較的重點
  - type: free_text
    prompt: (1)此外，巨鼠體型小，狗無法通過的瓦礫縫󠇡隙，巨鼠卻可以輕而易舉的鑽過。
  - type: free_text
    prompt: ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
  - type: guide
    text: 巨鼠的體型比狗【□大 小】，可以【輕易 □無法】鑽過瓦礫縫。
  - type: single
    prompt: ❷這句話比較的重點是什麼？□訓練員數量　體型  □成本。
    options:
    - 訓練員數量
    - 體型
    - 成本。
    answer: 體型
  - type: free_text
    prompt: (2)飼養和訓練巨鼠的成本比較低，不必花很多錢，只要有老鼠飼料和香蕉作為獎勵就可以了。
  - type: free_text
    prompt: ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
  - type: guide
    text: 巨鼠訓練時需要的食物獎勵是【□昂貴的專業食品 簡單的飼料和香蕉】，所以巨鼠的訓練成本比狗【□高 低】。
  - type: free_text
    prompt: ❷這句話比較的重點是什麼？　　訓練成本
  - type: free_text
    prompt: 2.請將比較重點與比較的訊息填入表格內(請打勾，單選)
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 3.想一想這些重點可以告訴我們什麼？
  - type: single
    prompt: ❶誰可以跟多位訓練員合作？ 巨鼠   □狗
    options:
    - 巨鼠
    - 狗
    answer: 巨鼠
  - type: single
    prompt: ❷誰可以鑽過瓦礫縫隙？ 巨鼠   □狗
    options:
    - 巨鼠
    - 狗
    answer: 巨鼠
  - type: single
    prompt: ❸誰的訓練成本比較低？ 巨鼠   □狗
    options:
    - 巨鼠
    - 狗
    answer: 巨鼠
  - type: single
    prompt: ❹作者認為訓練誰當救援幫手對人類比較有利? 巨鼠     □狗
    options:
    - 巨鼠
    - 狗
    answer: 巨鼠
  - type: free_text
    prompt: 4.總結：由上表可知，哪一句最能代表這篇文章的主旨？
  - type: guide
    text: □巨鼠和狗比起來有很多不同的地方。
  - type: guide
    text: 訓練巨鼠也能像狗一樣參與救援，對人類有幫助。
