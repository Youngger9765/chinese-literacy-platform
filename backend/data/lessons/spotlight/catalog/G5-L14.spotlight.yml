spotlight:
  lesson: G5-L14
  strategy_name: 摘要策略-刪除法找重點（刪除舉例
  strategy_type: summary
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: 週末，我和幾位朋友一起相約去新開的烤肉店聚餐。店裡的裝潢（  C  ），讓人一進門就感受到熱鬧的氣氛。烤肉的香氣撲鼻，我們看著烤得金黃酥脆的肉串，早已（  E  ）。等食物上桌後，大家立刻開始（  B  ），享受這美味的一餐，度過了一個開心又滿足的夜晚。
  - type: fill_table
  - type: guide
    text: '本課是一個說明文，為了讓讀者更容易理解文章，說明文的作者常會加入許多細節作為補充說明。然而，這可能使重點變得不明顯。因此，我們可以運用刪除法把不重要的訊息刪除，留下文章段落的重點。

      哪些細節可以刪除呢？首先可以刪的，就是「舉例」的文字。

      作者舉例時，經常會用「舉例」、「例如」、「如」、「像」這樣的關鍵詞。

      來看看下面這段文字，我們可以用❶❷❸的步驟，刪除舉例的文字：

      臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。'
  - type: guide
    text: '❶我們可以刪除「如」後面的文字，因為鹿野高台、池上伯朗大道都是「舉例」說明臺東有哪些風景區。注意，這些補充說明的文字，刪除後，也必須保留原文的意思，不能改變。

      臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。'
  - type: guide
    text: ❷留下段落重點臺東有名的風景區都是遊客們流連忘返的地方。
  - type: guide
    text: '❸判斷❷留下的重點，它主要的意思是否和原文相同？（打勾）

      是，留下的重點，主要的意思和原文相同。

      □否，留下的重點，主要的意思和原文不同。

      你發現了嗎，文章段落經過刪除法後，就可以更快找到重點，接下來就讓我們來練習看看吧！'
  - type: guide
    text: ◎小試身手：
