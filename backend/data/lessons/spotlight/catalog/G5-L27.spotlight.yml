spotlight:
  lesson: G5-L27
  strategy_name: 寫作手法：譬喻-以A比喻B
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: single
    prompt: 1. 以下哪些句子使用了譬喻法?請在□打勾，並將比喻的東西圈起來。
    options:
    - 請在
    - 打勾，並將比喻的東西圈起來。
    answer: 請在
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: null
  - type: free_text
    prompt: 2.換你試試看，填入適當的譬喻用詞代號。
  - type: free_text
    prompt: (1)孔雀開屏，尾巴如同張開的【　Ａ　】。
  - type: free_text
    prompt: (2)葉子上閃閃發亮的露珠，像是一顆顆璀璨的【　G　】。
  - type: free_text
    prompt: (3)妹妹粉嫩的臉龐，像一粒飽滿又可口的【　D　】。
  - type: free_text
    prompt: (4)湖泊是大地的【　B　】，藍天白雲、青山綠樹，都倒映在其中。
  - type: free_text
    prompt: (5)姐姐的說話速度太快了，簡直就像【　E　】一樣。
