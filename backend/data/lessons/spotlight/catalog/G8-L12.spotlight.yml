spotlight:
  lesson: G8-L12
  strategy_name: 推論策略-從例子推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: "這篇課文和上一篇虎襲課文一樣，作者沒有一開始就直接告訴你他的想法，反而先安排一連串吸引讀者注意的例子，為同一個觀點鋪路。所以，這一課你要學習的，仍然是下面這個策略，請你默讀一次。\n\
      從作者反覆舉的例子中，推論他真正想表達的觀點。\n   語言的足跡這篇文章，作者仍然是透過反覆的例子，來表達一個特定的想法。我們再練習一次，用❶～❸的步驟「推論（歸納）作者的觀點」。\n\
      \   【❶找例子】 【❷找共同點】【❸推論觀點】"
  - type: guide
    text: 一、步驟❶──找例子
  - type: passage
    source: unknown
    paragraphs:
    - 'A.作者在文中舉了不少語詞例子。請勾選這些語詞「出現在哪些地區」，

      為下一步找出它們的共同點做準備。（複選）'
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: null
  - type: passage
    source: unknown
    paragraphs:
    - "B.第五段用來說明「音變很常見」的兩個生活例子（請打勾，複選）\n   那個→辣個　很熱→很樂　□ 很冷→很勒"
  - type: guide
    text: ➡小祕訣：看到「例如、就像、亦然」常常就是例子要出現了。
  - type: guide
    text: 二、步驟❷──找這些例子的共同點：
  - type: guide
    text: 作者想讓我們注意到這些例子什麼共同點？（請勾選，單選）
  - type: passage
    source: unknown
    paragraphs:
    - ①南島語族分布在不同地區，卻出現相似發音的詞彙
    - □②例子顯示語言會一直改變，無法留下任何線索
    - □③例子來自不同語言，所以彼此沒有關聯
  - type: guide
    text: 三、步驟❸──推論作者觀點
  - type: guide
    text: □①萬華地名的重點，在於日治時期的改名過程。
  - type: guide
    text: ②南島語族雖分散在各地島嶼，卻擁有部分相似語彙，這些語言線索可推知他們曾經是一家人。
  - type: guide
    text: □③不同島嶼的語言之所以相似，是因為受到外來力量的共同影響。
  - type: guide
    text: □④語言會隨時間改變，因此難以用來追查來源與歷史。
  - type: guide
    text: ※ 如果你三項都打勾，恭喜你，
  - type: passage
    source: unknown
    paragraphs:
    - 表示你已經學會用 3 步驟「從例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！
  - type: figure
    referent: table
    asset: fig2.png
    bind_paragraph: null
  - type: self_check
    items:
    - 我能找出文章中作者反覆舉出的例子。
