spotlight:
  lesson: G8-L1
  strategy_name: 寫作手法：擬人－從擬人推論文章意涵
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: "寫作常見的手法--譬喻、轉化和誇飾修辭，都是運用聯想、想像力的方式，來聯想連結讀者普遍的經驗，以引起讀者共鳴，讓讀者感同身受。\n　　轉化修辭中的擬人是常見的聯想方式。擬人主要將動、植物或無生命之物想像成人，或是對它投射情感，就像我們對小時候的玩具或娃娃一樣，可能會幫它命名、跟它說話，把它當作人一樣對待。\n\
      \    而文章使用擬人之處，也是作者投入想像和感情之重點處，像是這篇文章將台東聯想成心愛的對象，進而對其傾訴，因此閱讀時我們可以留意擬人的句子，推論作者主要想傳達的感受或意涵。"
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: 試試看，從這篇文章的擬人句讀出原先的客觀事實，再找出其中的聯想，並推論作者背後想表達的意涵：
  - type: figure
    referent: table
    asset: fig1.png
    bind_paragraph: null
  - type: single
    prompt: 根據原文說明，下列何者最符合「擬人」修辭的定義？
    options:
    - 將兩種不同事物進行比較，使描述更生動。
    - 將動、植物或無生命之物想像成人，或對其投射情感。
    - 誇大事物的特徵或數量，以加強語氣或效果。
    answer: 將動、植物或無生命之物想像成人，或對其投射情感。
  - type: single
    prompt: 原文指出，作者使用擬人手法的目的為何？
    options:
    - 讓文章內容更客觀，避免主觀情感。
    - 運用聯想、想像力，引起讀者共鳴，讓讀者感同身受。
    - 使文章結構更嚴謹，增加閱讀難度。
    answer: 運用聯想、想像力，引起讀者共鳴，讓讀者感同身受。
  - type: free_text
    prompt: 根據課文摘要，請找出一個將「台東」或其相關事物「擬人化」的句子，並說明你判斷的理由。
