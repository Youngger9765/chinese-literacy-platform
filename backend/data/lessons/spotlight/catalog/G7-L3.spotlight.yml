spotlight:
  lesson: G7-L3
  strategy_name: 用表格整理訊息-從細節歸納標題列名稱
  strategy_type: info_organization
  blocks:
  - type: guide
    text: '之前我們學過閱讀文章時，可以將文章內容整理成表格。表格的優點有(1)能更快速查找文章重點。(2)可以幫助大腦更有效的分類資訊，鞏固長期記憶。

      ※整理比較表格的步驟：

      (1)確認比較的對象：是什麼和什麼比較？寫在表格對象列。

      (2)找重點：先用鉛筆將每段可能的「重點句」畫起來。

      (3)想項目欄內的主題名稱：從重點句判斷「主題名稱」，並用標示或寫出，例如：「阿波羅計畫從1969年~1972年」及「2022年NASA重啟阿提米絲登月計畫」，這二者的比較，主題名稱可以命名為「年代」。

      (4)將主題寫在項目欄內：將「主題」寫在表格左欄。

      (5)將文章細節填入細格。'
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 請依照上面的步驟，完成以下的表格。
