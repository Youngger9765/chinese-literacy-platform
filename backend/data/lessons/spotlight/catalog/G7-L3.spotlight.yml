spotlight:
  lesson: G7-L3
  strategy_name: 閱讀聚光燈-用表格整理訊息
  strategy_type: info_organization
  blocks:
  - type: guide
    text: 請依照以下步驟，學習如何將文章內容整理成表格，以幫助你更有效率地理解與記憶資訊。
  - type: single
    prompt: 根據課文摘要，這篇文章主要在比較哪兩個對象？
    options:
    - 阿姆斯壯和嫦娥
    - 阿波羅計畫和阿提米絲計畫
    - 月球和地球
    - 男性太空人和女性太空人
    answer: 阿波羅計畫和阿提米絲計畫
  - type: single
    prompt: 在整理比較表格時，尋找重點句的目的是什麼？
    options:
    - 快速瀏覽文章
    - 找出文章中所有不認識的字詞
    - 辨識出可用於比較的資訊
    - 練習畫線技巧
    answer: 辨識出可用於比較的資訊
  - type: single
    prompt: 根據課文摘要中「阿波羅計畫從1969年~1972年」和「2022年NASA重啟阿提米絲登月計畫」這兩段資訊，最適合的主題名稱是什麼？
    options:
    - 計畫名稱
    - 執行單位
    - 年代
    - 太空人
    answer: 年代
  - type: single
    prompt: 在比較表格中，我們應該將判斷出的「主題名稱」寫在哪個位置？
    options:
    - 表格最上方
    - 表格最右方
    - 表格左欄
    - 表格下方
    answer: 表格左欄
  - type: single
    prompt: 完成表格的最後一步是將什麼內容填入細格中？
    options:
    - 文章的標題
    - 文章的作者
    - 文章的細節資訊
    - 自己的感想
    answer: 文章的細節資訊
