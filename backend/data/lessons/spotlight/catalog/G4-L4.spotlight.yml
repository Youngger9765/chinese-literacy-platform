spotlight:
  lesson: G4-L4
  strategy_name: 認識句型-條件複句
  strategy_type: writing_technique
  blocks:
  - type: single
    prompt: ◎小試身手：因為不同類型的運動方式是相互衝突的。以下哪一種運動組合是最佳的？(單選)
    options:
    - 週一早上慢跑，下午再重訓。
    - 週一早上慢跑，週二早上重訓。
    answer: 週一早上慢跑，週二早上重訓。
  - type: single
    prompt: 1.辨別句子的意思，選出適當的分句，在□打勾。(單選)
    options:
    - 辨別句子的意思，選出適當的分句，在
    - 打勾。(單選)
    answer: 辨別句子的意思，選出適當的分句，在
  - type: free_text
    prompt: 2.連連看，先圈出關聯詞，再將相關的句子連起來。
  - type: figure
    referent: table
    asset: fig2.png
    bind_paragraph: null
  - type: guide
    text: 3.句型大比拚：我們這幾課學過了許多關聯詞，現在我們將這些關聯詞整理在下方的方框內。請你將適當的關聯詞填入括號內，成為一個通順的句子。
  - type: free_text
    prompt: (1)小美【 不但    】功課好，【 而且    】熱心助人。
  - type: free_text
    prompt: (2)【 雖然    】實驗失敗了，【 但是    】愛迪生絲毫不氣餒。
  - type: free_text
    prompt: (3)【 只要   】晚上早點睡，白天上課【 就   】不會打瞌睡了。
  - type: free_text
    prompt: (4)每次出門，爸爸會【 先   】把車子擦乾淨，【 然後    】再開車。
  - type: free_text
    prompt: (5) 【 無論   】謊言聽起來多麼動聽，最終【 都    】會被人拆穿的
