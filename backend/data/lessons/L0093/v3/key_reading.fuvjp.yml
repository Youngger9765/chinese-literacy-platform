  passage: 有位72歲的老太太獨居在美國康乃狄克州的一個城市裡。這天是感恩節，外面大雪紛飛。中午，一位鄰居烘了一個餅，請小孩送到老太太家，希望她在團圓的節日裡，不致於太孤苦伶仃。孩子拿著餅，按鈴、敲門都沒人應，只好逕自開門走進，一進房，小朋友尖叫一聲，血液都冰凍了。她看見老太太倒在廚房裡，一動也不動，已經死去。當天晚上十二點，世界聞名的刑事鑑識專家李昌鈺博士從床上爬起來接電話，電話那頭說：「李博士，我們是警局的重案小組，這裡發生了一樁令人髮指的命案，要請您移駕過來看看。」李昌鈺立刻著衣，冒著大雪趕到現場。李昌鈺到了現場，先問在場辦案的警方人員：「你們來多久了？」「十小時了。」法醫同時報告：「老太太被刺了18刀，凶刀就是廚房的刀，被丟在洗碗槽裡。」李昌鈺環顧四周，問：「十八刀？血呢？」地上沒有血。他馬上提出兩個假設：血跡已經清理過了，或者，這裡不是第一現場。
  start_text: 有位72歲的老太太獨居在美國康乃狄克州的一個城市
