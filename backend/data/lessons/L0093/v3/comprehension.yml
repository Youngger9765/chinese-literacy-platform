lesson_uid: L0093
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 聽老師說明後，他「赫然」發現自己的錯誤，立刻連聲道歉
      B: 他「環顧」手機裡所有關於大谷翔平的資料，覺得非常佩服
      C: 搭公車若看到老人或孕婦，我都會「移駕」，把座位讓給他們
      D: 他們用很少的經費蓋出高品質的房子，真是「令人髮指」
  - index: 2
    answer: B
    stem: 下列哪一項最能說明本文的寫作手法與目的？
    options:
      A: 用令人髮指的老太太謀殺案，說明警方伸張正義的決心
      B: 用具體的事例和鮮活的對話，說明李昌鈺辦案的科學方法
      C: 用李昌鈺和警察同仁的比較對照，凸顯李昌鈺的聰明過人
      D: 用年輕白人的真實個案，說明犯罪者如何一步一步走向歧途
  - index: 3
    answer: C
    stem: 根據本文，下列何選項不是李昌鈺運用科學方法辦案的過程？
    options:
      A: 發現地上沒有血跡，提出血跡可能被清理的假設
      B: 噴灑化學藥品觀察血跡反應，檢驗先前提出的假設
      C: 接到警局電話後，立刻冒著大雪趕到現場展開調查
      D: 推想沾血的鞋可能被丟棄，派刑警到附近垃圾箱搜尋
  - index: 4
    answer: D
    stem: 李昌鈺能做出「鞋子可能在購物中心旁的垃圾箱找到」這個推測，最需要哪一種能力？
    options:
      A: 觀察力
      B: 批判力
      C: 創造力
      D: 推論力
  - index: 5
    answer: C
    stem: 本課最強調李昌鈺辦案時的哪一項能力？
    options:
      A: 接到通知後立刻趕到現場，迅速展開調查的行動力
      B: 能調派大量警力搜索附近垃圾箱的領導與指揮能力
      C: 從有限線索提出合理假設，再找證據加以檢驗的科學思維
      D: 熟悉各種犯罪者的行為，可以直接猜出凶手身分的超能力
  notes:
    answer_carrier: 橘色手寫代號（PDF p9）；文字層的（　）內已填有同樣的代號
