    instruction: 大題標題那行印「劃掉刪除」（兩個動詞並列），格子上方那行印「刪除」。兩句原稿都在，本欄採大題標題那一句
    answer_paths: '10 個目標語詞全部圈到，逐格取字皆能拼回，格子無錯字。

      像素驗證：p10 橘色連通元件 10 個、觸紙緣（紙外殘留）0 個，與 10 條路徑一一對應。

      ⚠️ 全檔 `roundRect` 共 22 個，但**不能拿這個數字跟路徑數比** —— 聚光燈三張流程圖的

      圓角方框也是 roundRect。比較的範圍要限在找字那一頁，否則會誤報「少抓 12 條」。'
