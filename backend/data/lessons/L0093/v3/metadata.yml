strategy_explained: '這一課我們要練習的是，像偵探一樣，運用觀察、收集線索和實驗來找出真相的「解決問題」方法

  因為文章裡李昌鈺博士就是這樣辦案的，他仔細看現場、用化學藥品試血跡、從鞋印推斷凶手，這些都是科學探究的步驟，很適合我們模仿學習

  讀的時候，你可以試著跟著李博士的腳步，想像自己是現場的鑑識人員，想想你還會注意到什麼、會想做什麼實驗，幫助找線索'
