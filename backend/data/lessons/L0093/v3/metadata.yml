intro: 這篇文章介紹了刑事鑑識專家李昌鈺博士如何運用科學方法偵辦刑案。故事發生在一個寒冷的感恩節，一位獨居的老太太不幸在家中遇害。李博士接到報案後，冒著大雪趕到現場，透過仔細觀察與科學儀器的輔助，例如利用化學藥品檢測血跡，並從現場留下的鞋印推斷出凶手的特徵。接著，他指揮警方迅速行動，在短時間內找到關鍵證物，並循線追查到凶手。文章藉由這個真實案例，展現了科學探究的精神如何應用於實際辦案，幫助釐清真相，伸張正義。
