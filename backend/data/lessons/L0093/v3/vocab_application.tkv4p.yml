    stem: 二十年前的那場車禍，他失去所有的家人，只能(　)的長大。
    answer: B
  - index: 3
    stem: 他原以為自己被淘汰，沒想到名單公布時，(　)發現自己的名字在選手名單中，不禁欣喜若狂。
    answer: F
  - index: 4
    stem: 主持人說：「典禮即將開始，請貴賓(　)到十樓特賣現場搶購，再次感謝您的光臨！」
    answer: D
  - index: 5
    stem: 他不理會旁人的勸告，(　)跨過禁止線拍照，最終發生意外。
    answer: C
