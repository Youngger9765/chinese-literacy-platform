passage: 有位72歲的老太太獨居在美國康乃狄克州的一個城市裡。這天是感恩節，外面大雪紛飛。中午，一位鄰居烘了一個餅，請小孩送到老太太家，希望她在團圓的節日裡，不致於太孤苦伶仃。
