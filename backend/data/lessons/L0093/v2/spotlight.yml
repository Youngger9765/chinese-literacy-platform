spotlight:
  lesson: G7-L24
  strategy_name: 科學推理策略--用科學步驟解決問題
  strategy_type: problem_solving
  blocks:
  - type: guide
    text: 根據課文，李昌鈺博士在辦案的過程中，不斷運用這四個步驟思考、解決問題。發現問題→提出假設→檢驗假設→提出解答。*發現問題：從現場觀察到的現象或找到的線索，產生疑問。*提出假設：針對問題，提出一些可能的答案。*檢驗假設：運用方法、蒐集證據，判斷假設是否得到支持。*提出解答：根據驗證結果，回答原先的問題。除了警察辦案，遇到生活中的問題，我們也可以用這四個步驟，一步一步找出有根據的答案。讓我們回到課文，跟著李博士用這四個步驟一起辦案吧！
  - type: guide
    text: 一、推理示範
  - type: single
    prompt: 問題死者被刺18刀，為什麼地上沒有血？
    options:
    - 血跡已經清理過了。這裡不是第一現場。假設檢驗解答根據「廚房有大片血跡反應」，哪一假設較獲支持？
    - 假設一：血跡已經清理過了。
    - 假設二：這裡不是第一現場。問題死者被刺18刀，為什麼地上沒有血？血跡已經清理過了。這裡不是第一現場。假設檢驗解答根據「廚房有大片血跡反應」，哪一假設較獲支持？
    - 假設二：這裡不是第一現場。
    answer: 血跡已經清理過了。這裡不是第一現場。假設檢驗解答根據「廚房有大片血跡反應」，哪一假設較獲支持？
  - type: guide
    text: 用化學藥品，看到廚房大片血跡反應。用化學藥品，看到廚房大片血跡反應。
