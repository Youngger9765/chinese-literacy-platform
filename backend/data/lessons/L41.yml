story_text: '有一位富有領袖魅力的教主，他有一群擁護他、崇拜他、對他的言行毫不質疑的信眾。這位教主經常發表「智慧的言論」，在社會上引發許多爭議與批評。見到教主受到攻擊，許多信眾前仆後繼的集結，只要有膽敢批評教主者，就會遭受到信眾們在網路上大肆的攻擊。日子一天天過去，教主引發的爭議愈來愈多，教主的承諾，都沒有實現，教主的預言，都沒有發生。教主指出的方向和現實世界的發展簡直南轅北轍。你猜，接下來的日子，信眾們對教主的態度會有什麼改變？

  （單選）

  （　　）1.不會改變。

  （　　）2.對教主失望，離開教主而去。

  （　　）3.對教主的忠誠度，益發提高。

  （　　）4.視情況而定。

  在公布答案之前，我們先來看看底下這個經典的心理學研究。

  1953年，美國芝加哥出現一個宗教團體，教主是一位自稱通靈的家庭主婦，她說：「有一顆外太空的星球送給她神秘的預言，告訴她1954年的12月21日是世界末日，當天會有大洪水淹沒全世界，只有信徒會被外星人用飛碟救走。」這個末日預言喚起了許多人的恐懼，許多人為了得到救贖而加入這個宗教，有些人以具體的行動表達他們對這個預言的認同──他們辭去工作、和不信教的朋友斷絶關係、甚至傾家蕩產，放棄他們所擁有的一切，只為了追隨他們心中的「真理」。

  三位美國的社會心理學家認為，這是個做研究的大好機會，便用假身分加入了這個團體，他們在末日來臨之前、末日當天和末日之後祕密蒐集資料，描述信眾們會有什麼反應。

  12月21日晚上信徒都聚在一起，等著世界毀滅、等著外星人來拯救他們。他們等了又等，過了凌晨12點，外星人沒有來，也沒有洪水。他們想，會不會是鐘壞了？會不會是外星人的時區和我們不同，有了時差？但一直等到早上，什麼都沒有發生，此時，信眾一片安靜，沒有人說話。

  教主終於決定回她的房間去接收外星人的啟示。出來後，她告訴信眾：「你們的虔誠，外星人接收到了，外星人很感動，決定寬恕世人的罪孽，不再毀滅地球了，你們拯救了世界」。

  信眾們對這套聽起來難以自圓其說的說辭，展現了相當不同的反應。

  回到正題：「信眾們對教主的態度會有什麼改變？」

  正確答案是──「視情況而定」。

  曾經為教主犧牲奉獻、衝鋒陷陣、展臂廝殺者，會不顧事實，更加崇拜、擁戴教主；但原來習慣於心存質疑，始終對人「聽其言、觀其行」者，就恐怕要跟教主說再見了。

  學校教育，一直教導我們要「看證據再做決定」。但以上的心理學研究卻指出，人們心中若先有一套信仰，他們可能不顧是非黑白，仍然會作出令人匪夷所思的判斷，那些為信仰已經付出很大代價的人，尤其如此。哈佛大學校長福斯特曾經在對新生致辭時說，教育的目標在確保學生能夠辨別「有人在胡說八道」，真是至理名言啊。'
