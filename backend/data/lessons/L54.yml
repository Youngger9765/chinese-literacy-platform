vocabulary:
- word: 競技體操
  definition: 一種結合力量、平衡感和協調性的體育運動，選手需在器械上完成一系列動作，是奧運項目之一。
- word: 奧運
  definition: 即奧林匹克運動會，是國際性的多項運動賽事，每四年舉辦一次。
- word: 鞍馬
  definition: 體操項目之一，選手需在形似馬背的器械上完成各種平衡、支撐和旋轉動作。
- word: 湯瑪士迴旋
  definition: 體操鞍馬項目中的一種高難度動作，由臺灣選手李智凱自創並發揚光大。
- word: D分
  definition: 競技體操評分規則中的難度分數，由動作難度與動作組群組成，評估動作的技術含量。
- word: E分
  definition: 競技體操評分規則中的實施分數，評估選手動作的執行品質、流暢度與美感。
- word: 下法
  definition: 競技體操中，選手完成整套動作後，離開器械並雙腳落地的最後一個動作。
- word: 動作組群
  definition: 競技體操D分評分標準之一，根據不同類型的動作組合給予額外加分。
