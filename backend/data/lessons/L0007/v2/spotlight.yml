spotlight:
  lesson: G4-L16
  strategy_name: 推論策略-推論情緒和感受
  strategy_type: emotion_inference
  blocks:
  - type: guide
    text: 前面兩課我們已經學過，讀故事可以透過「觀察角色言行」，來推敲人物內心的情緒與感受。我們繼續來練習推論文章中角色的情緒和感受，並從這些情緒的變化，進一步瞭解作者想要告訴我們的事。
  - type: guide
    text: 一、從故事發展，推論「男人」的情緒或感受
  - type: passage
    source: unknown
    paragraphs:
    - 這個故事最重要的角色是──「男人」，我們先從故事發展找出主要事件，接著從關鍵線索中，寫出你對男人情緒或感受的推論。（答案合理即可）
  - type: guide
    text: (參考詞彙：平靜、難過、思念、愧疚、後悔、焦急、感動、釋懷、喜悅)
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 二、從情緒變化，推論返鄉之旅對男人的意義
  - type: passage
    source: unknown
    paragraphs:
    - 「男人」情緒或感受的變化是什麼？請推論這趟返鄉之旅對男人的意義是什麼？（請選出你認同的想法，在□打勾，可複選）
  - type: multi
    prompt: 請選擇
    options:
    - 在旅途中情緒起起伏伏，最終落淚，顯示他仍然無法放下過去的傷痛
    - 從回憶過去的後悔到看見黃絲帶的激動，表示長久壓抑的愧疚得到釋放和原諒
    - 雖一度難過與緊張，但最後哭一哭就好了，這趟旅程只是情緒的發洩
    - 從一開始的平靜到被勾起回憶，讓他一路擔心自己是否還能被家人接納
    answer:
    - 在旅途中情緒起起伏伏，最終落淚，顯示他仍然無法放下過去的傷痛
    - 從回憶過去的後悔到看見黃絲帶的激動，表示長久壓抑的愧疚得到釋放和原諒
    - 雖一度難過與緊張，但最後哭一哭就好了，這趟旅程只是情緒的發洩
    - 從一開始的平靜到被勾起回憶，讓他一路擔心自己是否還能被家人接納
  - type: guide
    text: 三、從故事發展，推論「學生」的情緒或感受
  - type: guide
    text: 接著我們來推論學生的情緒或感受。（答案合理即可）
  - type: guide
    text: （參考詞彙：尷尬、輕鬆、開心、關心、同情、緊張、激動）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 四、從「學生」情緒變化，推論角色的學習
  - type: passage
    source: unknown
    paragraphs:
    - 學生們從「輕鬆嘻笑」到「熱烈祝福」，這段情緒變化反映了什麼樣的心理歷程？請選出一項你認同的描述（請選出你認同的想法，在□打勾，可複選）
  - type: multi
    prompt: 請選擇
    options:
    - 學生原本只想開心玩樂，卻被男人的故事感動，變得真心想關心他。
    - 學生一開始沒有很在意，但聽完男人的故事後，變得更關心他，也更尊重他。
    - 學生本來只是出於禮貌安慰他，但看到黃絲帶後，真的感受到希望和溫暖。
    - 學生一開始很吵鬧，但最後一起為男人鼓掌祝福，說明他們學會了關心別人、支持別人。
    answer:
    - 學生原本只想開心玩樂，卻被男人的故事感動，變得真心想關心他。
    - 學生一開始沒有很在意，但聽完男人的故事後，變得更關心他，也更尊重他。
    - 學生本來只是出於禮貌安慰他，但看到黃絲帶後，真的感受到希望和溫暖。
    - 學生一開始很吵鬧，但最後一起為男人鼓掌祝福，說明他們學會了關心別人、支持別人。
  - type: guide
    text: 一、請你自己檢查以下3項，確定自己是否會推論情緒和感受了。
  - type: guide
    text: 二、如果三項都打勾，恭喜你，你已經學會推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: self_check
    items:
    - 我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
    - 我能把故事前後線索連起來，推論角色情緒的變化。
    - 我能從角色情緒的變化，明白故事想傳達的道理。
