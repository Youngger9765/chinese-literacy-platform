lesson_uid: L0007
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 文中提到「岳父的預言都是對的」，這句話最可能是指什麼？
    options:
      A: 岳父認為這段婚姻不會長久，兩人早晚會分開
      B: 岳父覺得男人沒有本事，將來一定會讓家人失望
      C: 岳父要求他去求得更高的學歷，才能賺更多錢
      D: 岳父認為妻子會受苦一輩子，最後會選擇離開他
    teacher_note: 岳父曾極力反對這門婚事，認為男人「沒有錢，沒有學歷，沒有未來」，意思是預言他日後難有出息。
  - index: 2
    answer: D
    stem: 火車快到大榕樹時，年輕學生們湊到窗邊、心中忐忑不安。他們為什麼會如此緊張？
    options:
      A: 他們擔心火車太快，到時會看不清楚那棵樹
      B: 他們懷疑火車可能出了狀況，而感到不安
      C: 他們擔心男人的家人會不會出現在樹下
      D: 他們期待看見黃絲帶，擔心男人能否回家
    teacher_note: 學生們已經知道黃絲帶代表的意思，所以他們既興奮又緊張，擔心看不見黃絲帶。
  - index: 3
    answer: C
    stem: 男人聽到學生們唱〈故鄉〉這首歌時，為什麼會突然哽咽、視線模糊？
    options:
      A: 因為他不喜歡有人在公共場合唱歌，覺得不耐煩
      B: 因為這首歌的旋律很悲傷，任何人聽了都會感動
      C: 因為歌詞觸動內心，使他想起家人和自己的過錯
      D: 因為年輕人的活潑有趣，讓他想起自己不年輕了
    teacher_note: 學生們彈唱起〈故鄉〉時，歌詞「故鄉我想起她」引發了男人強烈的思鄉之情和懊悔心情。
  - index: 4
    answer: B
    stem: 本文一開始先描寫火車上學生的互動，再描述男人的經歷。這樣的寫作手法有何用意？
    options:
      A: 增加篇幅內容，讓文章看起來更豐富完整
      B: 營造氣氛對比，讓讀者更能感受情緒轉折
      C: 凸顯學生的角色，使故事更貼近校園生活
      D: 淡化故事主軸，避免男人故事過於沉重直接
    teacher_note: 本文開頭以輕鬆、熱鬧的學生互動為起點，塑造出「日常／愉快」的氛圍，再逐步引出男人沉重的過去與內心煎熬，形成強烈的情緒對比。
  - index: 5
    answer: A
    stem: 黃絲帶這個故事主要想表達什麼？
    options:
      A: 人願意悔改，也能因關懷、愛與原諒重新得到希望
      B: 長輩的譏諷和輕蔑，會讓年輕人生氣，掉入罪惡的深淵
      C: 做錯事的人即使後悔，也不一定會被原諒，要看開點
      D: 好聽的音樂讓人想起悲傷的事，激發改過向善的良知
    teacher_note: 故事透過妻子以黃絲帶迎接悔改的丈夫，展現出親情的包容與愛帶來的希望。
