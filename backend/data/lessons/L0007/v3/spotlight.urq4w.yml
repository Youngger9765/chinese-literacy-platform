lesson_uid: L0007
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略—推論情緒和感受
  strategy_type: inference
  blocks:
  - type: concept_box
    text: 前面兩課我們已經學過，讀故事可以透過「觀察角色言行」，來推敲人物內心的情緒與感受。我們繼續來練習推論文章中角色的情緒和感受，並從這些情緒的變化，進一步瞭解作者想要告訴我們的事。
  - type: fill_table
    label: 一、從故事發展，推論「男人」的情緒或感受
    instruction: 這個故事最重要的角色是──「男人」，我們先從故事發展找出主要事件，接著從關鍵線索中，寫出你對男人情緒或感受的推論。（答案合理即可）
    word_bank_line: (參考詞彙：平靜、難過、思念、愧疚、後悔、焦急、感動、釋懷、喜悅)
    columns:
    - 事件
    - 關鍵線索
    - 「男人」的情緒或感受
    rows:
    - index: 1
      事件: 火車初遇學生
      關鍵線索: 看著學生嬉鬧，露出微笑。
      answer: 平靜
    - index: 2
      事件: 聽學生唱〈故鄉〉
      關鍵線索: 跟著哼唱，哽咽，視線模糊，臉埋手裡，肩膀抽動。
      answer: 難過、思念
    - index: 3
      事件: 談坐牢過去
      關鍵線索: 哽咽說：「我真是對不起老婆。」
      answer: 愧疚、後悔
    - index: 4
      事件: 火車接近三民站
      answer: 緊張
      note: 教材此列「關鍵線索」欄留空
    - index: 5
      事件: 看見滿樹黃絲帶
      關鍵線索: 一邊哭一邊笑說：「我要回家了。」
      answer: 感動、釋懷、喜悅
  - type: multi
    label: 二、從情緒變化，推論返鄉之旅對男人的意義
    prompt: 「男人」情緒或感受的變化是什麼？請推論這趟返鄉之旅對男人的意義是什麼？（請選出你認同的想法，在□打勾，可複選）
    options:
      1: 在旅途中情緒起起伏伏，最終落淚，顯示他仍然無法放下過去的傷痛
      2: 從回憶過去的後悔到看見黃絲帶的激動，表示長久壓抑的愧疚得到釋放和原諒
      3: 雖一度難過與緊張，但最後哭一哭就好了，這趟旅程只是情緒的發洩
      4: 從一開始的平靜到被勾起回憶，讓他一路擔心自己是否還能被家人接納
    answer:
    - 2
    - 4
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: fill_table
    label: 三、從故事發展，推論「學生」的情緒或感受
    instruction: 接著我們來推論學生的情緒或感受。（答案合理即可）
    word_bank_line: （參考詞彙：尷尬、輕鬆、開心、關心、同情、緊張、激動）
    columns:
    - 事件
    - 關鍵線索
    - 「學生」的情緒或感受
    rows:
    - index: 1
      事件: 上車時
      關鍵線索: 嘻笑吵鬧、互相調侃、唱歌聊天
      answer: 輕鬆、開心
    - index: 2
      事件: 發現男人落淚
      關鍵線索: 小心翼翼的走近男人，鼓起勇氣問：「大哥，你還好嗎？」
      answer: 關心
    - index: 3
      事件: 聽完男人的故事
      關鍵線索: 眼眶泛紅，拍男人的手說：「別擔心，…」
      answer: 同情
    - index: 4
      事件: 火車接近三民站
      關鍵線索: 圍在窗邊，心中忐忑不安
      answer: 緊張
    - index: 5
      事件: 看見黃絲帶
      關鍵線索: 歡呼鼓掌，高喊「祝福你！」
      answer: 開心、激動
  - type: multi
    label: 四、從「學生」情緒變化，推論角色的學習
    prompt: 學生們從「輕鬆嘻笑」到「熱烈祝福」，這段情緒變化反映了什麼樣的心理歷程？請選出一項你認同的描述（請選出你認同的想法，在□打勾，可複選）
    options:
      1: 學生原本只想開心玩樂，卻被男人的故事感動，變得真心想關心他。
      2: 學生一開始沒有很在意，但聽完男人的故事後，變得更關心他，也更尊重他。
      3: 學生本來只是出於禮貌安慰他，但看到黃絲帶後，真的感受到希望和溫暖。
      4: 學生一開始很吵鬧，但最後一起為男人鼓掌祝福，說明他們學會了關心別人、支持別人。
    answer:
    - 1
    - 4
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: self_check
    label: ◎自我檢核
    instruction: 一、請你自己檢查以下3項，確定自己是否會推論情緒和感受了。
    items:
    - 我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
    - 我能把故事前後線索連起來，推論角色情緒的變化。
    - 我能從角色情緒的變化，明白故事想傳達的道理。
    closing: 二、如果三項都打勾，恭喜你，你已經學會推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！
