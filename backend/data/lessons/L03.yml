story_text: '開學後不久，又是到健康中心量身高體重的時候。同學們嘰嘰喳喳講個不停，有人會開始炫耀自己的身高，有人則是會隱藏自己的體重。測量後老師大多會依照身高來安排班級的座位，「小承恩」只有一百三十公分，又要坐第一排。他一直都很羨慕最後一排的「大承恩」，明明都是男生，明明都叫承恩，身高卻差了近三十公分，他真的很不喜歡「小承恩」這個外號。

  可能很多同學都有「小承恩」這樣的煩惱。那麼要怎樣才能長高呢？是跳繩嗎？喝牛奶嗎？還是要喝轉骨湯呢？其實這些答案都不完全正確。根據研究：「充足的睡眠」、「適當的運動」及「均衡的飲食」才是長高的關鍵。

  我們會長高，主要是在睡眠時，身體會分泌「生長激素」，這種激素會刺激身體發育，所以國中小學生每天應該睡八至十個小時。晚上一直熬夜玩手機的小朋友，是不容易長高的。

  適當的運動也是長高相當重要的一環。有助於成長發育的運動有：有氧運動─適度提升核心體溫，促進生長激素分泌（如慢跑、游泳）；跳躍的動作刺激生長板（如跳繩、籃球、羽球）；肌力訓練（弓箭步、深蹲）和伸展運動（瑜珈）等。適當的運動有助於刺激成長，但運動若是太過激烈，不只容易造成運動傷害，更無法達到促進生長的效果。

  「多喝牛奶就可以長高」，這其實是錯誤的迷思，因為要長高不只需要蛋白質，蛋白質當然重要，但只攝取單一的營養素遠遠不夠。想長高，富含蛋白質的食物包含：雞蛋、牛奶、堅果、雞肉、鮭魚等當然要多吃，但也要攝取綠色蔬菜，補充維生素。同時避免過多甜食、冰品與油炸󠇡食物，亂吃可是會影響生長激素的分泌，不但會讓體重過重，反而不會長高喔。

  「小承恩」在把握這三個關鍵後，上國中後，短短一年內長高了25公分，連他自己也相當的意外。因為進入青春期後，身體會有大幅度的成長。但成長的前提是要把握前面提到的關鍵：「充足的睡眠」、「適當的運動」、「均衡的飲食」，進入青春期後，才有機會「高」人一等喔。'
