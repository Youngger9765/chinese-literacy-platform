fill_in_blank:
- sentence: 飯前的開胃菜可以(　　)食慾。
  answer: D
- sentence: 每天攝取(　　)的營養，才能常保身體的健康。
  answer: Ｃ
- sentence: 那一群人(　　)的，不知道在討論什麼？
  answer: E
- sentence: 我們不管到哪裡旅遊，都應該以安全為(　　)。
  answer: Ｇ
- sentence: 多巴胺（dopamine）是一種大腦神經的傳導物質。研究證實運動、食物都能促進大腦(　　)快樂激素「多巴胺」。
  answer: Ｆ
multiple_choice:
- question: 請問文中第四段提到「適當的運動也是要長高相當重要的一環。」，請問「一環」最可能的解釋是什麼?
  options:
  - 圓形而中空的東西。（玉環）
  - 指事物的關鍵。
  - 圍繞。（環繞）
  - 玉石雕的圓形圈子。（玉環）
  answer: B
  explanation: A錯：玉環；C錯：環繞；D錯：玉環
- question: 小承恩不喜歡他的外號的原因是什麼？
  options:
  - 因為他討厭承恩這個名字。
  - 因為他討厭大承恩。
  - 因為身高矮而自卑。
  - 因為都坐在第一排。
  answer: C
  explanation: 根據提供的課文內容，並未直接提及小承恩及其外號的具體情節。然而，從課文標題《長高的祕密》以及角色名稱「小承恩」中的「小」字判斷，該角色可能因身高矮小而感到困擾，進而自卑，因此最合理推測其不喜歡外號的原
- question: 長高的關鍵原因何者正確？
  options:
  - 轉骨湯是有效的民間偏方。
  - 激烈運動有助於骨骼生長。
  - 要熬夜才能分泌生長激素。
  - 攝取足夠且多樣的營養素。（第二段）
  answer: D
  explanation: 第二段
- question: 根據本文，請問促進成長的運動，下列何者配對錯誤？
  options:
  - 有氧運動慢跑。
  - 肌力訓練弓箭步。
  - 跳躍刺激生長板游泳。（第四段）
  - 伸展運動瑜珈。
  answer: C
  explanation: 第四段
- question: 下列何者是最符合均衡飲食的菜盤？
  options:
  - 白飯+菠菜+雞胸肉+杏鮑菇。
  - 一盤蛋炒飯。
  - 時蔬清炒義大利麵。
  - 滷肉飯+豆干+貢丸湯。
  answer: A
  explanation: B錯：少了肉類及蔬菜；C錯：少了肉類；D錯：少了蔬菜
