spotlight:
  lesson: 體-L3
  strategy_name: 品格力-身體覺察與照護
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 練習一：身體照護檢核表──透過營養、水分、休息三個面向來看看自己的身體照護習慣吧！
  - type: guide
    text: ＊營養：
  - type: table
    rows:
    - - ''
      - 描述
      - 經常
      - 有時
      - 很少
    - - １
      - 我三餐的分量適中，且盡量避免宵夜。
      - ''
      - ''
      - ''
    - - ２
      - 我三餐的時間規律，且能夠細嚼慢嚥。
      - ''
      - ''
      - ''
    - - ３
      - 我的正餐中都有蔬菜或水果。
      - ''
      - ''
      - ''
    - - ４
      - 我會在運動後補充蛋白質和碳水化合物。
      - ''
      - ''
      - ''
    - - ５
      - 我外食時會嘗試選擇少油、少炸的食物。
      - ''
      - ''
      - ''
  - type: guide
    text: ＊水分：
  - type: table
    rows:
    - - ''
      - 描述
      - 經常
      - 有時
      - 很少
    - - １
      - 我每天會帶水壺出門或上課。
      - ''
      - ''
      - ''
    - - ２
      - 我大多喝白開水，而不是飲料或手搖飲。
      - ''
      - ''
      - ''
    - - ３
      - 我會主動喝水，而不是等到口渴才喝。
      - ''
      - ''
      - ''
    - - ４
      - 我會注意尿液的顏色，並調整喝水量。
      - ''
      - ''
      - ''
    - - ５
      - 運動或天氣熱時，我會主動增加喝水量。
      - ''
      - ''
      - ''
  - type: guide
    text: ＊休息：
  - type: table
    rows:
    - - ''
      - 描述
      - 經常
      - 有時
      - 很少
    - - １
      - 我平日大約能睡7–8 小時。
      - ''
      - ''
      - ''
    - - ２
      - 睡前我會讓自己遠離手機或螢幕。
      - ''
      - ''
      - ''
    - - ３
      - 當感到疲累時，我會給自己短暫休息。
      - ''
      - ''
      - ''
    - - ４
      - 運動或活動後，我會做收操或伸展放鬆。
      - ''
      - ''
      - ''
    - - ５
      - 當身體出現受傷疼痛時，我會盡快冰敷。
      - ''
      - ''
      - ''
  - type: guide
    text: ＊反思──我發現自己：
  - type: multi
    prompt: 請選擇
    options:
    - 營養補充
    - 水分攝取
    - 休息安排
    answer:
    - 營養補充
    - 水分攝取
    - 休息安排
  - type: guide
    text: 練習二：感謝身體
  - type: guide
    text: 寫下你今天最想感謝的三個身體部位，並在後方寫上原因。
  - type: guide
    text: 例1：我想感謝我的(   眼睛  )，(  讓我可以閱讀     ）
  - type: guide
    text: 例2：我想感謝我的(   手臂  )，(  幫助我完成體能訓練  ）
  - type: free_text
    prompt: (1)我想感謝我的(          )，(                           ）
  - type: free_text
    prompt: (2)我想感謝我的(          )，(                           ）
  - type: free_text
    prompt: (3)我想感謝我的(          )，(                           ）
  - type: single
    prompt: 如果你的身體會說話，你覺得以下哪些句子是他最常說的？(可複選)
    options:
    - 「我有點累，可以讓我休息一下嗎？」
    - 「我好渴，請幫我喝點水。」
    - 「肚子餓了，該補充能量囉！」
    - 「好緊繃喔，幫我伸展一下吧。」
    - 「今天太久沒動了，帶我出去走一走！」
    - 「太久盯著螢幕了，讓眼睛休息一下。」
    - 「呼吸一下，別那麼趕。」
    - 「我表現得不錯吧？可以稱讚我一下！」
    - 「別再勉強我了，我真的需要放慢腳步。」
    - 其他：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
    answer: 「我有點累，可以讓我休息一下嗎？」
  - type: guide
    text: ◎根據你勾選的選項，想一想你可以怎麼用行動回應他？請選一個回應。(例如：十點前就上床睡覺、午休時好好休息)
  - type: guide
    text: 你的行動方案：我可以_____________________________________。
