lesson_uid: L0169
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answers_printed: true
  items:
  - index: 1
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 我寧願花心思修正錯誤，也「不妨」再重頭來過
      B: 面對記者「突如其來」的訪問，他仍能從容回應
      C: 儘管颱風天，爺爺「固然」到農田裡巡視排水系統
      D: 對喜歡穩定的他來說，「照表操課」的安排使他驚慌
    answer: B
    teacher_note: '第1題解析：

      (A)宜用「不願」

      (C)宜用「仍然」

      (D)宜用「突如其來」'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 2
    stem: 根據第二段「如果你這個老闆只顧著提高生產，直到機器冒煙、員工疲倦、倉庫爆滿——最後整座工廠可能陷入罷工危機。」這句話主要是想表達什麼？
    options:
      A: 人體如工廠一般，會因過度操勞而導致病痛
      B: 為了增加產能，工廠經營需要更多人力投入
      C: 從工廠的生產力可以看出，身體的健康狀況
      D: 懂得管理的老闆會重視團隊合作及生產效率
    answer: A
    teacher_note: '第2題解析：

      此處的「罷工」指的是身體生病'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 3
    stem: 根據本文，下列何者正確？
    options:
      A: 只有運動員的身體才是「工廠」
      B: 所有人都是自己身體的「老闆」
      C: 身體就像工廠一樣，會輪班工作
      D: 身體是完成責任，不需要被感謝
    answer: B
    teacher_note: '第3題解析：

      (A)每個人都是自己身體的老闆

      (C)像工廠一樣團結合作

      (D)身體也需要被感謝'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 4
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 人體就像運動員，在適當的壓力下才能激發潛力
      B: 只要有充足的營養與水分，身體就可以持續運作
      C: 人體運作如同工廠合作無間，也需要妥善的照顧
      D: 運動員的訓練辛苦，值得大家更多的尊敬與鼓勵
    answer: C
  - index: 5
    stem: 根據文章與品格聚光燈，下列何者最可能最需要調整生活習慣？
    options:
      A: 志豪會留意自己在三餐中有沒有攝取足夠的蛋白質
      B: 芷涵每天下課都會補充水分，並確認水壺水量充足
      C: 怡文運動完會確實收操，睡前也會做伸展幫助放鬆
      D: 偉翔每天熬夜讀書，常靠能量棒及手搖杯維持精神
    answer: D
    note: 題幹「下列何者最可能**最**需要」重複了「最」字，照原稿抄
  notes:
    option_key: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af0）
