  items:
  - index: 1
    definition: 發生得很突然，讓人來不及反應。
    answer: 突如其來
  - index: 2
    definition: 雖然。
    answer: 固然
  - index: 3
    definition: 能讓事情成功的小方法或關鍵技巧。
    answer: 祕訣
  - index: 4
    definition: 穩固、結實，此形容內容充實。
    answer: 紮實
  - index: 5
    definition: 比別人差一些，落後對方。
    answer: 輸人一截
  - index: 6
    definition: 依照固定的計畫或流程來做事情。
    answer: 照表操課
  - index: 7
    definition: 表示可以試試看，用來表達建議。
    answer: 不妨
  - index: 8
    definition: 一種主要的營養素，像是飯、麵、糖類等，是提供能量的來源。
    answer: 碳水化合物
  - index: 9
    definition: 能用來達成目標的資源、條件或優勢。
    answer: 本錢
  - index: 10
    definition: 技藝高明、熟練。
    answer: 精湛
  - index: 11
    definition: 流汗後留下的白色汗漬。
    answer: 鹽漬
  - index: 12
    definition: 做事隨便、不仔細，常出錯。
    answer: 馬虎
