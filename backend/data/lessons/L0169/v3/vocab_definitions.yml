vocab_definitions:
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  word_bank_line: '本課語詞：

    精湛、紮實、固然、祕訣、

    碳水化合物、輸人一截、

    不妨、鹽漬、突如其來、

    照表操課、馬虎、本錢。'
