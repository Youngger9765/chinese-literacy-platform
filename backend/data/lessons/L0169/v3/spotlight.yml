lesson_uid: L0169
version_id: v3
section_no: 六
spotlight:
  strategy_name: 身體覺察與照護
  blocks:
  - type: concept_box
    text: 讀完這篇文章，不妨回到自己的日常想想，那我們是身體的「好老闆」嗎？有沒有「顧好身體」呢？在身體覺察與照護上，可以從認識身體的需求開始──身體需要什麼樣的營養、需要多少的水分，這些都是照護身體重要的知識。現在就透過以下資料與練習，成為更優質的老闆吧！
  - type: guide
    text: '◎ 小試身手：

      練習一：身體照護檢核表──透過營養、水分、休息三個面向來看看自己的身體照護習慣吧！'
  - type: fill_table
    label: ＊營養：
    columns:
    - 描述
    - 經常
    - 有時
    - 很少
    rows:
    - 描述: 我三餐的分量適中，且盡量避免宵夜。
    - 描述: 我三餐的時間規律，且能夠細嚼慢嚥。
    - 描述: 我的正餐中都有蔬菜或水果。
    - 描述: 我會在運動後補充蛋白質和碳水化合物。
    - 描述: 我外食時會嘗試選擇少油、少炸的食物。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三欄格子全空
    note: 原稿每列左側另有一個全形數字欄（１~５），此處省略序號欄只留描述與三個勾選欄
  - type: fill_table
    label: ＊水分：
    columns:
    - 描述
    - 經常
    - 有時
    - 很少
    rows:
    - 描述: 我每天會帶水壺出門或上課。
    - 描述: 我大多喝白開水，而不是飲料或手搖飲。
    - 描述: 我會主動喝水，而不是等到口渴才喝。
    - 描述: 我會注意尿液的顏色，並調整喝水量。
    - 描述: 運動或天氣熱時，我會主動增加喝水量。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三欄格子全空
  - type: fill_table
    label: ＊休息：
    columns:
    - 描述
    - 經常
    - 有時
    - 很少
    rows:
    - 描述: 我平日大約能睡7–8 小時。
    - 描述: 睡前我會讓自己遠離手機或螢幕。
    - 描述: 當感到疲累時，我會給自己短暫休息。
    - 描述: 運動或活動後，我會做收操或伸展放鬆。
    - 描述: 當身體出現受傷疼痛時，我會盡快冰敷。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三欄格子全空
    note: 第一列的「7–8」用的是短破折號（EN DASH），不是連字號，照原稿抄
  - type: multi
    prompt: '＊反思──我發現自己：

      做得不錯的是：'
    options:
      1: 營養補充
      2: 水分攝取
      3: 休息安排
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    prompt: 有待加強的是：
    options:
      1: 營養補充
      2: 水分攝取
      3: 休息安排
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: free_text
    prompt: '練習二：感謝身體

      1.寫下你今天最想感謝的三個身體部位，並在後方寫上原因。

      例1：我想感謝我的(   眼睛  )，(  讓我可以閱讀     ）

      例2：我想感謝我的(   手臂  )，(  幫助我完成體能訓練  ）

      (1)我想感謝我的(          )，(                           ）

      (2)我想感謝我的(          )，(                           ）

      (3)我想感謝我的(          )，(                           ）'
    no_correct_answer: true
    answer_carrier: 學生自填，兩個「例」是原稿印好的示範，(1)~(3) 三行空白
    note: 每一行的左括號是半形「(」、右括號是全形「）」，照原稿抄
  - type: multi
    prompt: 2.如果你的身體會說話，你覺得以下哪些句子是他最常說的？(可複選)
    options:
      1: 「我有點累，可以讓我休息一下嗎？」
      2: 「我好渴，請幫我喝點水。」
      3: 「肚子餓了，該補充能量囉！」
      4: 「好緊繃喔，幫我伸展一下吧。」
      5: 「今天太久沒動了，帶我出去走一走！」
      6: 「太久盯著螢幕了，讓眼睛休息一下。」
      7: 「呼吸一下，別那麼趕。」
      8: 「我表現得不錯吧？可以稱讚我一下！」
      9: 「別再勉強我了，我真的需要放慢腳步。」
      10: 其他：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
    no_correct_answer: true
    answer_carrier: 學生自填，原稿十個□都沒有勾選
  - type: free_text
    prompt: '◎根據你勾選的選項，想一想你可以怎麼用行動回應他？請選一個回應。(例如：十點前就上床睡覺、午休時好好休息)

      你的行動方案：我可以_____________________________________。'
    no_correct_answer: true
    answer_carrier: 學生自填，原稿橫線是空的
