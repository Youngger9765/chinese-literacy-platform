  passage: 然而，垃圾食物卻是這麼好吃，讓人一口接一口停不下來，到底是什麼原因呢？首先，它們的味道都經過精心調配，製造商會找到鹽、糖、油的完美比例，讓食物又香又美味。像外酥內軟的雞塊、酸酸甜甜的糖果、又脆又鹹的洋芋片、香甜濃郁的巧克力……都讓人著迷，難以抗拒。其次，這些食物常含有大量的糖和脂肪。吃下去時，人會感到愉快和滿足，大腦也會釋放多巴胺，讓人更容易記住這種感覺。下次看到熟悉的食物，或聞到熟悉的味道時，就可能又想再吃。有些人在焦頭爛額或愁眉不展時，也會想靠吃東西讓自己好受一點；但這份滿足只是暫時的，並不能真正解決壓力。最後，垃圾食物常和快樂時光連結在一起，例如生日時吃蛋糕、看電影配爆米花、邊逛街邊吃薯條。再加上鮮豔吸睛的包裝，以及廣告中令人垂涎欲滴的美食畫面，彷彿有個看不見的小精靈在誘惑我們：「來一口吧，吃了會開心喔！」
  start_text: 然而，垃圾食物卻是這麼好吃，讓人一口接一口停不下
