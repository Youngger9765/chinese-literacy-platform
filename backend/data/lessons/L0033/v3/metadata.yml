lesson_no: 21
series: 一般
lesson_seq: 5210
intro: 這篇文章要帶大家認識「垃圾食物」。什麼是垃圾食物？為什麼它們這麼好吃，讓人忍不住一口接一口呢？文章會從食物的調味、成分，以及它們和我們的情緒、回憶之間的連結來一一說明。同時，也會探討垃圾食物雖然能帶來短暫的快樂，但長期食用可能對我們的身體健康造成哪些影響。透過了解垃圾食物的誘人之處與潛在的代價，希望能幫助大家更聰明地選擇食物，做出對自己身體更好的決定。
strategy_explained: '這一課我們要學會一種像偵探一樣找出文章裡最重要線索的技巧，特別是把那些像「舉例」一樣用來讓事情說得更清楚的說明，先暫時放到一邊

  這篇文章就是練習這個好方法的絕佳材料，因為它會詳細說明為什麼垃圾食物那麼誘人，但又提醒我們長期吃可能會帶來什麼問題，裡面有很多說明和舉例，很適合練習找出它的核心意思

  所以，讀的時候，你可以試著想想，作者為什麼要舉這些例子，然後想想，沒有這些例子，文章真正想告訴我們的重點是什麼'
