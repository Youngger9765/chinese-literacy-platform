lesson_uid: L0033
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 請問哪一個句子使用語詞正確？
    options:
      A: 他幽默的話語雖然誇張，但「無傷大雅」，並沒有冒犯別人
      B: 這部電影無聊到讓小明打瞌睡，「垂涎欲滴」，口水都流下來
      C: 看到對手得分，他「大快朵頤」，氣得說不出話來
      D: 他不擅長廚藝，火花竄出，燒得他「焦頭爛額」
    teacher_note: 第1題詳解：A.符合文意。B.「大快朵頤」指的是盡情享受美食，不能用來形容「氣得說不出話來」。C.「焦頭爛額」指的是比喻事情繁忙、困難重重，讓人焦慮不堪，並不是實際燒焦。D.「垂涎欲滴」形容看到美食時非常想吃，不能用來形容「打瞌睡」。）
  - index: 2
    answer: B
    stem: 根據本文，垃圾食物與多巴胺的關係是什麼？
    options:
      A: 多巴胺能增進食慾，讓人想吃更多的垃圾食物
      B: 垃圾食物會刺激大腦釋放多巴胺，讓人愉快並更想再吃
      C: 只有垃圾食物才能讓大腦釋放多巴胺，因此人們無法抗拒
      D: 多巴胺是一種垃圾食物中常見的添加劑，可以讓食物更美味
    teacher_note: 第2題詳解：第四段指出，垃圾食物會快速被身體吸收，促使大腦釋放多巴胺」，而多巴胺能帶來快樂感，因此人們會對垃圾食物產生依賴。)
  - index: 3
    answer: C
    stem: 哪一項最能概括本文主旨？
    options:
      A: 詳細列出了垃圾食物的種類，並提醒讀者如何避免它們
      B: 在壓力大時，可以偶爾享用垃圾食物，對健康無傷大雅
      C: 說明垃圾食物吸引人的原因與健康代價，提醒不要常吃
      D: 垃圾食物會使人產生快樂感，讓人容易與快樂時光連結
  - index: 4
    answer: A
    stem: 作者在第一段連續問讀者是否想吃洋芋片、炸雞、奶茶等食物，主要作用是什麼？
    options:
      A: 藉著人人熟悉的美食經驗，引起讀者的閱讀動機
      B: 用連續的三個問句，在文章最前方，提出本文待答的問題
      C: 為了要讓讀者對美食做出喜好程度的排序
      D: 為了要教導讀者學會「大快朵頤」的使用情境
  - index: 5
    answer: D
    stem: 作者把垃圾食物比作「戰友」和「損友」，主要想凸顯什麼？
    options:
      A: 說明分享垃圾食物能讓人交到更多朋友，增進人際關係
      B: 告訴大家垃圾食物有時候是好朋友，有時候是壞朋友
      C: 垃圾食物有好有壞，像交朋友一樣，需要辨別好壞
      D: 垃圾食物短暫帶來快樂，長期常吃卻可能傷害健康
    teacher_note: 作者用對比比喻凸顯「短暫快樂與長期代價」的落差
