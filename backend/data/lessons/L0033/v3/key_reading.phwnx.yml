  passage: 然而，垃圾食物卻是這麼好吃，讓人一口接一口停不下來，到底是什麼原因呢？首先，它們的味道都經過精心調配，製造商會找到鹽、糖、油的完美比例，讓食物又香又美味。像外酥內軟的雞塊、酸酸甜甜的糖果、又脆又鹹的洋芋片、香甜濃郁的巧克力……都讓人著迷，難以抗拒。
