  - label: 難以抗拒的原因
    value: '為什麼我們會忍不住想吃垃圾食物？（請打勾，多選）

      ①味道經過精心調配，口感令人難以抗拒

      ②吃下去會讓人感到愉快和滿足，也更容易想再吃

      □③吃垃圾食物能讓人變得更聰明

      ④與快樂時光連結'
    blanks: []
  - label: 健康代價
    value: '長期吃垃圾食物可能造成哪些影響？（請打勾，多選）

      ①熱量較高、膳食纖維較少，容易造成營養不均衡

      □②增強免疫力，讓身體更健康

      ③影響血糖穩定，容易感到飢餓，導致過量飲食

      ④可能引發高血壓、糖尿病、心血管疾病等健康問題'
    blanks: []
  - label: 給青少年的建議
    value: '在飲食方面，我們應該怎麼做？

      □①絕對不能吃垃圾食物，以免付出代價。

      ②偶爾吃無傷大雅，但不要讓垃圾食物主導飲食習慣。'
    blanks: []
  title: 垃圾食物的誘惑與代價
