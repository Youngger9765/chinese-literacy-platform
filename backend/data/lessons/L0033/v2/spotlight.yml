spotlight:
  lesson: G5-L21
  strategy_name: 摘要策略-刪除法找重點-刪除舉例
  strategy_type: summary
  blocks:
  - type: guide
    text: ◎ 小試身手
  - type: guide
    text: 週末，我和幾位朋友一起相約去新開的烤肉店聚餐。店裡的裝潢（  C  ），讓人一進門就感受到熱鬧的氣氛。烤肉的香氣撲鼻，我們看著烤得金黃酥脆的肉串，早已（  E  ）。等食物上桌後，大家立刻（  B  ），享受這頓美味的晚餐，度過一個開心又滿足的夜晚。
  - type: fill_table
  - type: single
    prompt: 請選擇
    options:
    - 句子完整、通順。
    - "原文最重要的意思仍然保留。\n先看一個例子：請閱讀下面的文字\n臺東有名的風景區，如鹿野高台、池上伯朗大道等，每到假日都吸引許多遊客。\n❶找出並刪除舉例：\n\
      可以刪除「如」後面的文字，「鹿野高台、池上伯朗大道」都是臺東著名景點的具體例子，可以刪除。 \n臺東有名的風景區，如鹿野高台、池上伯朗大道等，每到假日都吸引許多遊客。\n\
      ❷檢查刪除後的文字（打勾）\n   臺東有許多著名景點，每到假日都吸引許多遊客。\n①句子完整、通順。\n②原文最重要的意思仍然保留。\n　　你發現了嗎，刪掉景點名稱後，我們仍然知道：臺東有許多著名景點，能吸引遊客。"
    answer: 句子完整、通順。
  - type: guide
    text: ◎小試身手
  - type: free_text
    prompt: 1.請把下段文字中的舉例刪除(課內練習)
  - type: free_text
    prompt: ❶找出並刪除舉例：請用筆把舉例的文字劃掉
  - type: guide
    text: 垃圾食物常和快樂時光連結在一起，例如生日時吃蛋糕、看電影配爆米花、邊逛街邊吃薯條。
  - type: free_text
    prompt: ❷檢查刪除後的文字（打勾）
  - type: guide
    text: 垃圾食物常和快樂時光連結在一起。
  - type: single
    prompt: 請選擇
    options:
    - 句子完整、通順。
    - 原文最重要的意思仍然保留。
    answer: 句子完整、通順。
  - type: free_text
    prompt: 2.請把下段文字中的舉例刪除(課內練習)
  - type: free_text
    prompt: ❶找出並刪除舉例：請用筆把舉例的文字劃掉
  - type: guide
    text: 垃圾食物的味道都經過精心調配，製造商會找到鹽、糖、油的完美比例，讓食物又香又酥，像外酥內軟的雞塊、酸酸甜甜的糖果、又脆又鹹的洋芋片、香甜濃郁的巧克力……都讓人難以抗拒。
  - type: free_text
    prompt: ❷檢查刪除後的文字（打勾）
  - type: passage
    source: unknown
    paragraphs:
    - 垃圾食物的味道都經過精心調配，製造商會找到鹽、糖、油的完美比例，讓食物又香又酥，都讓人難以抗拒。
  - type: single
    prompt: 請選擇
    options:
    - 句子完整、通順。
    - 原文最重要的意思仍然保留。
    answer: 句子完整、通順。
  - type: free_text
    prompt: 3.請把下段文字中的舉例刪除(延伸文章)
  - type: free_text
    prompt: ❶找出並刪除舉例：請用筆把舉例的文字劃掉
  - type: guide
    text: 運動有益身體健康，因為它能增強體力，讓我們更有精神。例如，跑步能鍛鍊心肺，提升耐力，使我們不易疲勞；跳繩能增強耐力，讓身體更有活力；打籃球能提升協調性與爆發力，使動作更敏捷，專注力更高。
  - type: free_text
    prompt: ❷檢查刪除後的文字
  - type: guide
    text: 讀一讀沒有劃掉的文字，再打勾。
  - type: single
    prompt: 請選擇
    options:
    - 句子完整、通順。
    - 原文最重要的意思仍然保留。
    answer: 句子完整、通順。
  - type: free_text
    prompt: 4.請把下段文字中的舉例刪除(延伸文章)
  - type: free_text
    prompt: ❶找出並刪除舉例：請用筆把舉例的文字劃掉
  - type: guide
    text: 早餐是一天中重要的一餐，能提供能量與營養，幫助我們開始一天的生活。例如，有些人選擇麵包配牛奶，補充碳水化合物和蛋白質；也有人吃粥和饅頭，因為容易消化，利於吸收養分。相反的，不營養的早餐，如高油、高糖食物，可能導致疲倦，影響專注力。
  - type: free_text
    prompt: ❷檢查刪除後的文字
  - type: guide
    text: 讀一讀沒有劃掉的文字，再打勾。
  - type: single
    prompt: 請選擇
    options:
    - 句子完整、通順。
    - 原文最重要的意思仍然保留。
    answer: 句子完整、通順。
  - type: guide
    text: ★策略帶著走
  - type: guide
    text: 做摘要時，如果文章用舉例補充內容，可以問自己：
  - type: guide
    text: '①哪些文字是舉例細節？

      ②刪掉後，留下的文字是否完整，原文重點是否保留？'
  - type: guide
    text: 刪除法不是刪得越多越好，而是刪去舉例細節，留下重要訊息。
  - type: self_check
    items:
    - 我能找出並刪除舉例細節。
    - 我會檢查留下的文字是否完整，並保留原文重點。
