paragraphs:
- 放學後，你是否經常忍不住想來一包洋芋片，再喝上一杯冰涼的可樂？與朋友相聚時，你是否喜歡來點金黃酥脆的炸雞、薯條，邊聊天邊喝奶茶？當你聞到路邊烤香腸的誘人香味，看到色彩繽紛的糖果時，你是否會迫不及待掏出零用錢，買來大快朵頤一番？
- 如果是，你知道你吃下的可能就是所謂的「垃圾食物」嗎？別誤會，這裡的「垃圾」並不是指扔在地上不要的廢棄物，而是這類食物通常糖、鹽或脂肪含量較高，營養也不夠均衡，因此被稱為「垃圾食物」。常見的垃圾食物包括餅乾、洋芋片、蛋糕、炸物、熱狗和香腸等加工食品，以及含糖奶茶、可樂、汽水或果汁飲料。
- 然而，垃圾食物卻是這麼好吃，讓人一口接一口停不下來，到底是什麼原因呢？首先，它們的味道都經過精心調配，製造商會找到鹽、糖、油的完美比例，讓食物又香又美味。像外酥內軟的雞塊、酸酸甜甜的糖果、又脆又鹹的洋芋片、香甜濃郁的巧克力……都讓人著迷，難以抗拒。
- 其次，這些食物常含有大量的糖和脂肪。吃下去時，人會感到愉快和滿足，大腦也會釋放多巴胺，讓人更容易記住這種感覺。下次看到熟悉的食物，或聞到熟悉的味道時，就可能又想再吃。有些人在焦頭爛額或愁眉不展時，也會想靠吃東西讓自己好受一點；但這份滿足只是暫時的，並不能真正解決壓力。
- 最後，垃圾食物常和快樂時光連結在一起，例如生日時吃蛋糕、看電影配爆米花、邊逛街邊吃薯條。再加上鮮豔吸睛的包裝，以及廣告中令人垂涎欲滴的美食畫面，彷彿有個看不見的小精靈在誘惑我們：「來一口吧，吃了會開心喔！」
- 垃圾食物雖然能帶來美味和快樂，卻常有熱量高、營養不均衡的問題，膳食纖維通常也較少。有些高糖食物還可能讓血糖快速升高，接著又下降，使人沒過多久又感到飢餓，忍不住繼續吃。許多人會把這些垃圾食物看成開心解憂的「戰友」，但它們真實身分其實是「損友」，長時間與其相伴，就可能導致營養失衡，影響發育和成長；久而久之，除了肥胖，蛀牙、高血壓、心臟病，甚至糖尿病也會不請自來！
- 青少年的你正處於快速成長期，同時又面臨學業與人際等各種壓力，很容易選擇方便、好吃的垃圾食物作為「加油站」。雖然偶爾吃點無傷大雅，但千萬不要讓這些誘惑主導你的飲食習慣。別忘了，垃圾食物帶來的快樂是短暫的，但帶來的傷害卻會讓你付出長久的代價！
