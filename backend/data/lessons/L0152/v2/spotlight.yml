spotlight:
  lesson: G9-L9
  strategy_name: 分辨事實與判斷
  strategy_type: express_opinion
  blocks:
  - type: guide
    text: "本篇文章是作者讀完兩封秦朝家書後，結合其他史料，對信中內容做出推論，並在結尾提出自己的看法。\n　　也就是說，文章中的訊息主要有兩大類，第一類是「家書或史料中可以查證真假的訊息（以下稱事實）」，第二類是「作者根據事實做出的推論或看法（以下稱判斷）」。閱讀這樣的文章，如果能分辨哪些是客觀的事實，哪些是作者的判斷，就會有更好的理解。\n\
      \    那麼什麼是事實？什麼又是判斷呢？\n事實：\n可以被驗證真假的訊息。例如，第四段提到黑夫的家書寫著「請母親寄衣物或錢」。這項訊息可以直接從家書中查證，因此是「事實」。\n\
      判斷：\n作者根據文章中的事實，結合自己的知識和經驗所做的推測。例如，作者從黑夫「請母親寄衣物或錢」這個事實，推論秦國士兵沒有兵餉，國家只提供武器和口糧，這就是「作者判斷」。\n\
      接下來讓我們來練習分辨「事實」與「判斷」吧。"
  - type: free_text
    prompt: 1.基礎題：根據這篇文章，以下的文句是事實的請寫上F，是作者判斷的請寫上J。
  - type: guide
    text: ★事實的英文為Fact，判斷的英文為Judgment
  - type: free_text
    prompt: (1)【 F 】(第三段)文中的家庭有兄弟三人。
  - type: free_text
    prompt: (2)【 F 】(第四段)兄弟倆困在淮陽，缺乏夏衣。
  - type: free_text
    prompt: (3)【 J 】(第八段)黑夫和驚的母親沒有寄錢給他們。
  - type: free_text
    prompt: (4)【 J 】(第十三段)黑夫和驚最終都戰死沙場。
  - type: free_text
    prompt: (5)【 J 】(第十三段)大哥失去兩個弟弟後，深感悲傷和歉疚。
  - type: free_text
    prompt: (6)【 F 】大哥的墓中有書寫用品
  - type: free_text
    prompt: (7)【 J 】大哥能讀書識字，他們不會是社會最底層的家庭。
  - type: free_text
    prompt: 2.進階題：連連看，將「文章中的事實」與「作者判斷」配對。
  - type: table
    rows:
    - - 文章事實(第幾段)
      - ''
      - 作者判斷(第幾段)
    - - (1)
      - 驚的家書中再次催促母親寄錢和布料，並提到兄弟倆借錢過活。(7)
      - ''
      - A.秦朝的服役早而重。(5)
    - - (2)
      - 黑夫的家書中詢問了軍功是否換來爵位。(4)
      - ''
      - B.底層民眾將希望寄託在軍功和爵位上。(5)
    - - (3)
      - 驚和黑夫都剛成年，而且家裡有三個兄弟，兩個要上戰場。(3)
      - ''
      - C. 家裡可能確實沒錢，無法支援前線的兄弟。 (11)
    - - (4)
      - 黑夫的家書中請求寄送夏衣或錢財。(4)
      - ''
      - D.秦兵的裝備和生活用品需要自備。(5)
  - type: free_text
    prompt: 3.挑戰題：文中作者認為秦國將戰爭的成本轉嫁給底層民眾。下列哪些「事實」能支持這個判斷？能支持的畫O，不能的畫X。
  - type: guide
    text: （1）【 O 】黑夫在信中請母親寄夏衣或錢。
  - type: guide
    text: （2）【 O 】三兄弟中，有兩個剛成年兒子在前線征戰。
  - type: guide
    text: （3）【 X 】根據出土文物，秦國一件夏衣價值五十五錢
  - type: guide
    text: （4）【 O 】兄弟倆沒有收到錢物，只能借錢過活。
  - type: guide
    text: （5）【 X 】兩封家書被大哥衷帶進墳墓，成為陪葬品。
