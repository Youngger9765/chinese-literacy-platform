keypoints:
  lesson: G9-L9
  structure: nested
  columns:
  - label
  - sub_label
  - value
  rows:
  - label: 背景
    value: 兩封西元前225年秦國滅楚大戰時的__揭露了一個家庭的悲劇。這個家庭有兄弟3人，大哥衷在家贍養母親，20歲的二弟驚和17歲的三弟黑夫都在前線征戰。
    blanks:
    - answer: 家書
      hint: ''
  - label: 家書一
    sub_rows:
    - sub_label: 信件內容
      template: 作者判斷
      blanks: []
    - sub_label: '1.是__寫給大哥的。

        2.現被困在淮陽，生死難料。

        3.缺乏__，要母親寄衣服或__。

        4.詢問官府有沒有落實__。'
      template: '1.秦國服役早而重。

        2.服役是__，沒有兵餉，連衣物都要自己準備。

        3.秦王統一大業，卻將戰爭成本__到底層民眾身上。'
      blanks:
      - answer: 三弟/黑夫
        hint: ''
      - answer: 夏衣
        hint: ''
      - answer: 錢
        hint: ''
      - answer: 獎勵
        hint: ''
      - answer: 義務
        hint: ''
      - answer: 轉嫁
        hint: ''
  - label: 家書二
    sub_rows:
    - sub_label: 信件內容
      template: 作者判斷
      blanks: []
    - sub_label: '1.是__寫給大哥的。

        2.因沒收到錢物，明確要__和__。

        3.兄弟倆現在__過活，再不還錢就要死了。

        4.擔心自己的妻子，要她不要到太遠的地方撿柴火。'
      template: '1.兄弟跟家人要的錢並不多，一般家庭應該都能承受。

        2.如果有錢，一定不會吝嗇給在前線家人，沒給錢的原因只可能是__。

        3.他們並非底層人家，卻拿不出十件夏衣的救命錢。

        4.由此可知秦國年年征戰，對底層民眾層層__。'
      blanks:
      - answer: 二弟/驚
        hint: ''
      - answer: 錢
        hint: ''
      - answer: 布料
        hint: ''
      - answer: 借錢
        hint: ''
      - answer: 沒錢
        hint: ''
      - answer: 剝削
        hint: ''
  - label: 結果
    value: 兩兄弟最終__，只有如此大哥才會把兩個弟弟的家書作為陪葬品。從這裡可以看出哥哥心裡的悲傷和__。
    blanks:
    - answer: 戰死/死了
      hint: ''
    - answer: 歉疚
      hint: ''
  - label: 詰問
    value: 知道這個家庭的命運後，你還想成秦國的子民嗎？
    blanks: []
  title: 帝國家書：一個普通家庭的生與死
