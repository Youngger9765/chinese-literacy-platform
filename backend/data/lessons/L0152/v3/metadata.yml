strategy_explained: '這一課我們要練習的是，讀的時候能不能從文章裡找到「這是確定發生的事」和「這是作者或信裡的人的想法或感覺」之間的差別

  這篇文章很適合練習，因為它呈現了兩封戰國時代的竹簡家書，裡頭有士兵真實的遭遇和情感，但也有我們解讀時對他們命運的推測

  讀的時候，你可以試著想：信裡寫的「我餓了、我很想家」是當時的實際情況，而「他可能已經犧牲了」就是一種判斷，然後在心中把這些區分開來'
