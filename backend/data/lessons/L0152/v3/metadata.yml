intro: 這篇文章透過兩封出土的秦代竹簡家書，帶領我們回到兩千多年前的戰國時代。信件來自前線作戰的兩位年輕士兵，寫給留在家鄉的哥哥。透過這些簡短的文字，我們可以窺見當時秦國底層民眾的生活樣貌，包括他們在戰亂中的艱辛、家庭的牽掛，以及國家徵兵制度的實際情況。文章也探討了家書內容所反映的社會經濟狀況，以及這些年輕士兵在戰爭中的可能遭遇。
