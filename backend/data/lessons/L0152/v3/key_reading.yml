  passage: 戰火中價值萬金的家書不僅安然抵達了八百里外的故鄉——秦國安陸，而且最終還被收信人帶進了自己的墳墓。1975年，這批竹簡出土，使得我們今天有幸窺見那個龐大帝國底層民眾的血淚和悲哀。從信中可以得知，這個家庭有兄弟三人，大哥衷在家贍養母親，二弟驚20歲，剛新婚不久，三弟黑夫17歲，兩個弟弟均在前線征戰。兩份家書字跡相同，顯然是兩兄弟託軍中書吏寫的。這是他們各自的第一封家書，也是最後一封。第一封家書是三弟黑夫寫給大哥的。他在信中問候了母親、家人及親友，他說，兄弟倆現在因為戰況困在淮陽，生死難料。因為缺乏夏衣，請母親要嘛做衣服寄來，要嘛直接寄錢；他特別叮嚀母親，千萬不要寄少了。另外，黑夫還關心一件事——他在戰場上搏命，累積了戰功，這些戰功到底有沒有轉換成實質的獎勵？官府如果落實了獎勵，一定要告訴他。
  start_text: 戰火中價值萬金的家書不僅安然抵達了八百里外的故鄉
