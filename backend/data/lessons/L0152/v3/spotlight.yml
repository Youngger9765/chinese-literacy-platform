lesson_uid: L0152
version_id: v3
section_no: 六
spotlight:
  strategy_name: 分辨事實與判斷
  strategy_type: fact_vs_judgment
  answer_carrier: '橘色文字（字元樣式 rStyle=af，run 層無 w:color）為主；

    基礎題第 (6) 題與挑戰題 5 題的 O/X 是紅色（run 層 w:color=FF0000）。

    本課無任何 ☑。'
  blocks:
  - type: concept_box
    text: '本篇文章是作者讀完兩封秦朝家書後，結合其他史料，對信中內容做出推論，並在結尾提出自己的看法。

      　　也就是說，文章中的訊息主要有兩大類，第一類是「家書或史料中可以查證真假的訊息（以下稱事實）」，第二類是「作者根據事實做出的推論或看法（以下稱判斷）」。閱讀這樣的文章，如果能分辨哪些是客觀的事實，哪些是作者的判斷，就會有更好的理解。

      　　那麼什麼是事實？什麼又是判斷呢？

      事實：

      可以被驗證真假的訊息。例如，第四段提到黑夫的家書寫著「請母親寄衣物或錢」。這項訊息可以直接從家書中查證，因此是「事實」。

      判斷：

      作者根據文章中的事實，結合自己的知識和經驗所做的推測。例如，作者從黑夫「請母親寄衣物或錢」這個事實，推論秦國士兵沒有兵餉，國家只提供武器和口糧，這就是「作者判斷」。

      接下來讓我們來練習分辨「事實」與「判斷」吧。'
    text_note: '「事實：」「判斷：」兩行在 PDF 上前面各印一個「●」項目符號，那是 Word 自動編號

      （numbering.xml），不在文字流裡，故不寫入。'
  - type: guide
    text: 1.基礎題：
  - type: guide
    text: 根據這篇文章，以下的文句是事實的請寫上F，是作者判斷的請寫上J。
  - type: guide
    text: ★事實的英文為Fact，判斷的英文為Judgment
  - type: exercise
    option_bank:
      F: 事實
      J: 作者判斷
    option_bank_note: '代號含義取自上一行指示語的原文「是事實的請寫上F，是作者判斷的請寫上J」——

      原稿沒有印選項表格，此處只是把指示語裡定義的對應關係結構化，未自創文字。'
    answer_carrier: 第 (1)~(5)(7) 題為橘色（字元樣式）；第 (6) 題是紅色 run（w:color=FF0000）
    items:
    - index: 1
      stem: (第三段)文中的家庭有兄弟三人。
      answer: F
    - index: 2
      stem: (第四段)兄弟倆困在淮陽，缺乏夏衣。
      answer: F
    - index: 3
      stem: (第八段)黑夫和驚的母親沒有寄錢給他們。
      answer: J
    - index: 4
      stem: (第十三段)黑夫和驚最終都戰死沙場。
      answer: J
    - index: 5
      stem: (第十三段)大哥失去兩個弟弟後，深感悲傷和歉疚。
      answer: J
    - index: 6
      stem: 大哥的墓中有書寫用品。
      answer: F
    - index: 7
      stem: 大哥能讀書識字，他們不會是社會最底層的家庭。
      answer: J
    items_note: '前五題的段落標註（第三段等）在 PDF 上是上標小字，文字流裡緊接在【　】之後，

      此處保留在 stem 前段。第 (6)(7) 題原稿沒有段落標註。'
  - type: guide
    text: 2.進階題：
  - type: guide
    text: 連連看，將「文章中的事實」與「作者判斷」配對。
  - type: matching
    left_header: 文章事實(第幾段)
    right_header: 作者判斷(第幾段)
    left:
      1: 驚的家書中再次催促母親寄錢和布料，並提到兄弟倆借錢過活。(7)
      2: 黑夫的家書中詢問了軍功是否換來爵位。(4)
      3: 驚和黑夫都剛成年，而且家裡有三個兄弟，兩個要上戰場。(3)
      4: 黑夫的家書中請求寄送夏衣或錢財。(4)
    right:
      A: 秦朝的服役早而重。(5)
      B: 底層民眾將希望寄託在軍功和爵位上。(5)
      C: 家裡可能確實沒錢，無法支援前線的兄弟。 (11)
      D: 秦兵的裝備和生活用品需要自備。(5)
    answers_printed: false
    answer_note: "\U0001F534 教師版**沒有畫任何一條連線**，四組配對一組都沒有答案。三條獨立證據：\n  ① PDF p8 上八個「●」都在，但一條線都沒有；\n  ② 整份 document.xml 只有 **1** 個紅色（srgb FF0000）的 line 圖形；\n  ③ 那唯一一條線 `positionV relativeFrom=\"page\"` 的位移是 **−2.197in**\n     （頂端在紙面上緣之外），且它是連連看表格裡唯一的錨點 ——\n     也就是印不出來的紙外殘留，跟各課那個 rightMargin 的 roundRect 同類。\n依 skill「先在 XML 找紅色 line 再下結論」查過了，結論是**真的沒有連線**，\n不是 LibreOffice 漏畫。⛔ 四組配對在語意上雖然推得出來，但原稿沒印，\n故不填入 answer（硬塞等於編造）。"
  - type: guide
    text: 3.挑戰題：
  - type: guide
    text: 文中作者認為秦國將戰爭的成本轉嫁給底層民眾。下列哪些「事實」能支持這個判斷？能支持的畫O，不能的畫X。
  - type: exercise
    option_bank:
      O: 能支持
      X: 不能
    option_bank_note: 取自指示語原文「能支持的畫O，不能的畫X」，未自創文字。
    answer_carrier: 紅色 run（w:color=FF0000），PDF p8 可見
    items:
    - index: 1
      stem: 黑夫在信中請母親寄夏衣或錢。
      answer: O
    - index: 2
      stem: 三兄弟中，有兩個剛成年兒子在前線征戰。
      answer: O
    - index: 3
      stem: 根據出土文物，秦國一件夏衣價值五十五錢。
      answer: X
    - index: 4
      stem: 兄弟倆沒有收到錢物，只能借錢過活。
      answer: O
    - index: 5
      stem: 兩封家書被大哥衷帶進墳墓，成為陪葬品。
      answer: X
