version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 請問哪一個句子的語詞使用正確?
    options:
      A: 黑夫將白米裝進「竹簡」，煮竹筒飯給弟弟吃
      B: 經過細心的照顧，總算「安然」度過危險期
      C: 他被斬首，現場「拋頭顱灑熱血」，畫面驚悚
      D: 她畢業後搬到臺北，工作地點也「轉嫁」過去
    stem_note: 題末是半形問號「?」，原稿如此。
  - index: 2
    answer: C
    stem: 根據本文，秦朝士兵的生活狀況為何？
    options:
      A: 家人支援充足，前線衣食無虞
      B: 官府供給完善，只需專心作戰(從第4、5段可知)
      C: 艱難困苦，連衣物錢財都缺
      D: 戰功獎勵穩定，生活逐漸改善
    options_note: B 選項末的「(從第4、5段可知)」是橘色教師註記，印在選項文字後面，照原樣收在選項內。
  - index: 3
    answer: D
    stem: 根據作者推論，大哥把弟弟們的家書當陪葬品的主要原因為何？
    options:
      A: 秦國最後打了勝仗，家書是光榮的印記
      B: 竹簡在當時很昂貴，適合當作陪葬品
      C: 書信內容可能透露國家機密，他擔心外洩
      D: 兄弟戰死沙場，他悲傷歉疚，念念不忘(從13段可知)。
  - index: 4
    answer: A
    stem: 根據本文，下列哪句話最能總結這兩封家書所揭露的歷史真相？
    options:
      A: 帝國勝利背後，藏著平民家庭的犧牲
      B: 秦軍強盛背後，來自家人對前線支持
      C: 軍功制度推行，使士兵家庭獲得保障(根據第5及11段可知)
      D: 家書能被保存，主要因古人重視親情
  - index: 5
    answer: C
    stem: 本篇文章對於研究秦朝歷史有何重要意義？
    options:
      A: 揭示了秦朝統一戰爭的過程
      B: 展示了秦朝皇帝的英明神武
      C: 反映秦代底層人民的生活壓力
      D: 說明了秦朝的徵兵制度非常完善
  notes:
    answer_carrier: 橘色代號（字元樣式 rStyle=af），PDF p9 可見
    teacher_hint_carrier: '本課沒有藍框解析方塊；改成把出處直接印在**選項後面**（橘色小字），

