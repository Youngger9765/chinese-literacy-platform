section_no: 五
keypoints:
  title: 帝國家書：一個普通家庭的生與死
  layout: list
  answer_carrier: 橘色（字元樣式 rStyle=af），PDF p5~p6 可見
  rows:
  - label: 背景
    value: 兩封西元前225年秦國滅楚大戰時的【　】揭露了一個家庭的悲劇。這個家庭有兄弟3人，大哥衷在家贍養母親，20歲的二弟驚和17歲的三弟黑夫都在前線征戰。
    blanks:
    - answer: 家書
  - label: 家書一
    items:
    - label: 信件內容
      value: '1.是【　】寫給大哥的。

        2.現被困在淮陽，生死難料。

        3.缺乏【　】，要母親寄衣服或【　】。

        4.詢問官府有沒有落實【　】。'
      blanks:
      - answer: 三弟/黑夫
      - answer: 夏衣
      - answer: 錢
      - answer: 獎勵
    - label: 作者判斷
      value: '1.秦國服役早而重。

        2.服役是【　】，沒有兵餉，連衣物都要自己準備。

        3.秦王統一大業，卻將戰爭成本【　】到底層民眾身上。'
      blanks:
      - answer: 義務
      - answer: 轉嫁
  - label: 家書二
    items:
    - label: 信件內容
      value: '1.是【　】寫給大哥的。

        2.因沒收到錢物，明確要【　】和【　】。

        3.兄弟倆現在【　】過活，再不還錢就要死了。

        4.擔心自己的妻子，要她不要到太遠的地方撿柴火。'
      blanks:
      - answer: 二弟/驚
      - answer: 錢
      - answer: 布料
      - answer: 借錢
    - label: 作者判斷
      value: '1.兄弟跟家人要的錢並不多，一般家庭應該都能承受。

        2.如果有錢，一定不會吝嗇給在前線家人，沒給錢的原因只可能是【　】。

        3.他們並非底層人家，卻拿不出十件夏衣的救命錢。

        4.由此可知秦國年年征戰，對底層民眾層層【　】。'
      blanks:
      - answer: 沒錢
      - answer: 剝削
  - label: 結果
    value: 兩兄弟最終【　】，只有如此大哥才會把兩個弟弟的家書作為陪葬品。從這裡可以看出哥哥心裡的悲傷和【　】。
    blanks:
    - answer: 戰死/死了
    - answer: 歉疚
  - label: 詰問
    value: 知道這個家庭的命運後，你還想成秦國的子民嗎？
    note: 這一格沒有空格，是給學生思考的提問；「還想成秦國的子民嗎」原稿缺一個「為」字，未改。
  rows_note: '「家書一」「家書二」各是一個 vmerge 合併儲存格，底下橫跨「信件內容」「作者判斷」

    兩欄的子列，故用 items 表達。兩組的欄位標題（信件內容／作者判斷）在原稿各印一次。'
