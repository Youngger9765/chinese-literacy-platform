lesson_uid: L0032
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列選項「 」中的詞語，何者使用正確？
    options:
      A: 老師鼓勵學生「追溯」未來的職涯方向，盡早規劃
      B: 主持人在典禮中「即興」發表感人致詞，令全場感動
      C: 為了「緩解」疲憊，他選擇徹夜的工作，持續加班
      D: 課後「重拾」了老師上課講的重點，所以她的成績不理想
    teacher_note: (A)(B)(D)皆不符合語境
    teacher_note_check: 原稿的解析寫「(A)(B)(D)皆不符合語境」，但答案是 B —— 照抄，不替它改成 (A)(C)(D)
  - index: 2
    answer: A
    stem: 根據課文內容判斷，為何「小丑醫生」必須學習心理學相關知識？
    options:
      A: 便於了解病童及家屬的需求，在演出時撫慰他們的情緒
      B: 便於了解病童病情的嚴重程度，配合醫院提供治療
      C: 便於學習各種變臉與特技的心理效果，讓節目更吸睛
      D: 便於了解醫院的各種規範，知道如何在醫院表演
  - index: 3
    answer: C
    stem: 根據本課內容，以下哪一位最符合擔任小丑醫生的條件？
    options:
      A: 小文：個性安靜，做事一板一眼，常常喜歡一個人待著
      B: 小剛：學習認真，考試總是高分，是老師眼中的資優生
      C: 小玉：有創意又幽默，擅長舞台表演，也懂得關心別人
      D: 小偉：體力好，常代表學校參加比賽，是名優秀運動員
  - index: 4
    answer: D
    stem: 作者在文章最後寫到新冠肺炎和烏俄戰爭時的小丑醫生，主要想告訴我們什麼？
    options:
      A: 想表示小丑醫生不怕危險，常到處去旅行
      B: 表示小丑醫生工作時間長，假日也要工作
      C: 小丑醫生既有強健的身體又能打仗保護病童
      D: 不管遇到什麼困難，小丑醫生都努力帶來歡樂
  - index: 5
    answer: C
    stem: 文末寫道：「他們讓我們知道：笑，本身就是最好的良藥！」根據全文，作者想表達的是什麼意思？
    options:
      A: 醫生應該接受小丑專業訓練，以改善醫院的氣氛
      B: 小丑醫生的表演比藥物還重要，因此應取代部分治療
      C: 醫療中不該只是講求技術，也要關懷病人的心理需求
      D: 小丑醫生能成功讓病人分心忘記病痛，不再需要醫療
    teacher_note: 強調病人的心理與情感需求，也是相當重要。故選(C)
