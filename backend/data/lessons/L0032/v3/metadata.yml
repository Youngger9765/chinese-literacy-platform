intro: 這篇文章介紹了「小丑醫生」這個特殊的職業。他們不是傳統的醫生，而是運用幽默、創意和表演來帶給病患歡樂與希望。文章會說明小丑醫生的起源，以及他們如何透過魔術、音樂和搞笑表演，幫助病童減輕身體病痛帶來的焦慮和恐懼。此外，文章也探討了小丑醫生在醫療環境中的重要性，以及他們所需要具備的專業訓練和能力，讓讀者了解這個職業如何為冰冷的病房帶來溫暖與力量。
strategy_explained: '我們這一課要練習的是「抓出文章裡的小重點」

  這篇文章介紹了小丑醫生如何用歡樂和表演幫助病童，就像在找每一個讓病童開心的表演細節一樣，我們要學會從文章裡找出能幫助我們了解小丑醫生這個職業的具體故事和方法

  讀的時候，你可以試著問自己，讓小丑醫生「變」出歡樂的，到底有哪些魔術、音樂或搞笑表演呢'
