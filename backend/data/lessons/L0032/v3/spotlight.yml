lesson_uid: L0032
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略—從細節找小主題
  strategy_type: summarize
  blocks:
  - type: concept_box
    text: '上一課，我們學過：說明文常用「大主題—小主題—細節」來說明內容。本課也是一篇說明文，主要介紹「小丑醫生」。作者從幾個小主題來說明，每個小主題下面還會有細節或例子補充。

      閱讀這類文章時，先找到大主題，再分辨小主題和細節的關係，就能更清楚掌握文章重點。

      這一課，我們要練習：從一組細節找出小主題。'
  - type: guide
    text: 說明文結構圖：
  - type: figure
    referent: 說明文結構圖
    text_carrier: image
    content: '(1)先找主題：常可在文章名稱找到，或想想文章主要在介紹誰。

      (2)再找小主題：常可在段落前的小標題找到，或想想這個段落主要在講什麼。

      (3)補充細節：可以說明小主題的重要細節或舉例。'
  - type: sub_block
    label: 一、先確定大主題：
    instruction: '大主題通常可以從題目或文章開頭找到。

      這一課的標題是〈小丑醫生〉，文章開頭也在介紹小丑醫生，所以本文的大主題是【　】。'
    items:
    - type: free_text
      prompt: 本文的大主題是【　】。
      answer: 小丑醫生
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: sub_block
    label: 二、看細節，判斷小主題
    instruction: '本課的大主題是「小丑醫生」。作者從幾個小主題來說明小丑醫生。

      請仔細讀每一組細節，想一想：這組細節在說明小丑醫生的哪一個面向？再從選項中填入最適合的小主題。'
    items:
    - type: fill_table
      instruction: 填入選項：
      option_bank:
        A: 專業能力
        B: 重要貢獻
        C: 服務方式
        D: 特殊服務
        E: 發展起源
      columns:
      - 大主題
      - 小主題
      - 細節
      main_topic: 小丑醫生
      rows:
      - 小主題: 【　】
        answer: E
        細節: '①亞當斯醫生認為，治療病人不能只靠藥物和手術，也要關懷情感需求。

          ②1995年，「小丑照護計畫」在紐約開始推動。'
      - 小主題: 【　】
        answer: C
        細節: '①小丑醫生陪伴長期住院、手術或治療的孩子。

          ②他們用魔術、音樂、搞笑表演或即興互動，讓孩子放鬆。'
      - 小主題: 【　】
        answer: A
        細節: '①小丑醫生不是只要會表演。

          ②他們需要了解醫院規範、病人需求，也要熟悉心理學。'
      - 小主題: 各地推動
        prefilled: true
        細節: '①小丑醫生的工作已在世界各地普及。

          ②在臺灣，小丑醫生計畫由非營利組織推動。'
      - 小主題: 【　】
        answer: D
        細節: '①疫情期間，小丑醫生改用線上表演。

          ②烏 俄戰爭期間，小丑醫生進入烏克蘭醫院，安撫並陪伴病童。'
      - 小主題: 【　】
        answer: B
        細節: '①小丑醫生讓病房多了笑聲。

          ②他們幫助病童降低治療焦慮，也舒緩家長緊繃的心情。'
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: '◎你發現了嗎？

      一組細節常常會共同說明「小丑醫生」的一個面向。找出這個小主題，就能更清楚整理本文重點。'
