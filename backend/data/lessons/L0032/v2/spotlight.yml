spotlight:
  lesson: G5-L20
  strategy_name: 摘要策略-從細節找小主題
  strategy_type: summary
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：摘要策略──
  - type: guide
    text: 一、先確定大主題：
  - type: guide
    text: 大主題通常可以從題目或文章開頭找到。
  - type: passage
    source: unknown
    paragraphs:
    - 這一課的標題是〈小丑醫生〉，文章開頭也在介紹小丑醫生，所以本文的大主題是【  小丑醫生 　　】。
  - type: guide
    text: 二、看細節，判斷小主題
  - type: guide
    text: 本課的大主題是「小丑醫生」。作者從幾個小主題來說明小丑醫生。
  - type: guide
    text: 請仔細讀每一組細節，想一想：這組細節在說明小丑醫生的哪一個面向？再從選項中填入最適合的小主題。
  - type: guide
    text: 填入選項：
  - type: guide
    text: A.專業能力／B.重要貢獻／C.服務方式／D.特殊服務／E.發展起源
  - type: table
    rows:
    - - 大主題
      - 小主題
      - 細  節
  - type: guide
    text: ◎你發現了嗎？
  - type: guide
    text: 一組細節常常會共同說明「小丑醫生」的一個面向。找出這個小主題，就能更清楚整理本文重點。
  - type: guide
    text: 上面的閱讀聚光燈幫助我們了解文章的大主題、小主題和細節之間的關係。接下來，我們要完成「文章重點表」，把重點更清楚地整理出來。
  - type: table
    rows:
    - - 小丑醫生
    - - 起源
      - 1980年代，美國醫生亞當斯認為病人不只需要藥物和手術，也需要歡樂來幫助康復。
    - - 主要服務對象
      - 面臨【】、手術或治療的孩子。
    - - 主要工作內容
      - '緩解醫院緊張

        的氛圍'
      - "常見方式：(複選)\n□精密的手術   搞笑表演 \n變魔術       □提供治療藥物"
    - - 所需專業
      - 表演
      - 以多元的表演方式，讓孩子們感受到放鬆。
    - - 所需專業
      - 專業知識
      - 了解醫院的規範和病人的需求。
    - - 所需專業
      - 【】學
      - 應對病人和家屬的負面情緒。
    - - 貢獻
      - 讓病房多了笑聲，幫助病童降低【】，也舒緩了壓力鍋下家長緊繃的心情。
    answers:
    - 長期住院
    - 心理
    - 治療的焦慮
