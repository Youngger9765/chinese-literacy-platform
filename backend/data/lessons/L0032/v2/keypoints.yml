  - label: 小丑醫生______①亞當斯醫生認為，治療病人不能只靠藥物和手術，也要關懷情感需求。②1995年，「小丑照護計畫」在紐約開始推動。各地推動____①小丑醫生陪伴長期住院、手術或治療的孩子。②他們用魔術、音樂、搞笑表演或即興互動，讓孩子放鬆。①小丑醫生不是只要會表演。②他們需要了解醫院規範、病人需求，也要熟悉心理學。①小丑醫生的工作已在世界各地普及。②在臺灣，小丑醫生計畫由非營利組織推動。①疫情期間，小丑醫生改用線上表演。②烏俄戰爭期間，小丑醫生進入烏克蘭醫院，安撫並陪伴病童。①小丑醫生讓病房多了笑聲。②他們幫助病童降低治療焦慮，也舒緩家長緊繃的心情。小丑醫生______①亞當斯醫生認為，治療病人不能只靠藥物和手術，也要關懷情感需求。②1995年，「小丑照護計畫」在紐約開始推動。各地推動____①小丑醫生陪伴長期住院、手術或治療的孩子。②他們用魔術、音樂、搞笑表演或即興互動，讓孩子放鬆。①小丑醫生不是只要會表演。②他們需要了解醫院規範、病人需求，也要熟悉心理學。①小丑醫生的工作已在世界各地普及。②在臺灣，小丑醫生計畫由非營利組織推動。①疫情期間，小丑醫生改用線上表演。②烏俄戰爭期間，小丑醫生進入烏克蘭醫院，安撫並陪伴病童。①小丑醫生讓病房多了笑聲。②他們幫助病童降低治療焦慮，也舒緩家長緊繃的心情。
