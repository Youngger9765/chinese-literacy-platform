multiple_choice:
- question: 下列語詞何者使用正確？
  options:
  - 在車禍現場，他大聲「呼籲」旁人請救護車前來救援。
  - 班長又嘮叨了，他「諷刺」的說，妳讓我想起我阿嬤對我的關愛。
  - 這位運動員有非常優秀的心理素質，真是讓人「憂心忡忡」。(同音）
  - 為掩飾真相而「亂竄」歷史，必定使後人唾棄。
  answer: B
  explanation: A錯：誤用，呼叫；C錯：同音；D錯：誤用，竄改
- question: 第一段提到：「在這場強調為愛而跑的比賽中，看起來格外諷刺。」請問這句話的真正意思為何？
  options:
  - 強調「為愛而跑」，但卻造成汙染，根本不愛地球。
  - 路跑不是為愛舉辦，而是為了大眾利益才辦。
  - 看到這麼多人為製造的垃圾，令人憂心忡忡。
  - 呼籲大眾不要把快樂帶走，把悲傷留給地球！
  answer: D
  explanation: 第一段提到，作者看到路辦路跑而產生，為了健康，看起還很諷刺。
- question: 下列何者不是舉辦「綠色賽事」的主要用意？
  options:
  - 希望能讓地球能永續發展。
  - 減少賽事製造的人為垃圾。
  - 喚醒大眾的環境保護意識。
  - 可讓大眾獲得更多紀念品。
  answer: D
  explanation: 課文內容及環保3R的原則皆強調減少資源消耗與垃圾，並未提及贈送紀念品，且贈送更多紀念品與環保精神相悖。
- question: 這篇課文主要的目的是說明和說服，請問作者在第一段用了哪一種寫作手法吸引讀者聚焦在作者想強調的議題？
  options:
  - 用一個事件，意象鮮明地描述了問題的嚴重性。
  - 用阿國第一場路跑賽的成功，凸顯賽事對參賽者的意義。
  - 用「就像是…黃色小怪物」的譬喻，加強讀者印象。
  - 強調天氣因素對本次賽事環境所造成的影響。
  answer: A
  explanation: 課文主要目的是說明和說服，因此在第一段用一個具體的事件，鮮明地描寫問題的嚴重性（例如環境污染、氣候變遷對賽事的影響），最能吸引讀者注意並聚焦於作者想探討的「綠色賽事」議題的重要性。
- question: 看到今年元宵活動一團糟，底下選項中，哪一個是「諷刺」的評論？
  options:
  - 「天哪，我今晚的時間都耗在這個爛活動裡了！」
  - 「浪費民脂民膏，主辦單位應該要好好檢討！」
  - 「設計規劃的人到底有沒有腦筋？」
  - 「這真是天下最有創意的設計！」
  answer: D
  explanation: 「這真是天下最有創意的設計！」在活動一團糟的情況下，這句話是反話，用表面的讚美來挖苦和批評設計，符合課文中「諷刺」的定義（用幽默或挖苦的方式批評）。
