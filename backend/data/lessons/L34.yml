vocabulary:
- word: 地球公民
  definition: 指關心全球問題、致力於全球合作和永續發展的人。
- word: 碳排放
  definition: 人類生產、運輸和使用產品時，釋出溫室氣體（如二氧化碳）的過程。
- word: 碳足跡
  definition: 碳排放的總量。
- word: 提 案
  definition: 提出建議或計劃，通常用於解決問題或改善現況。
- word: 亂竄
  definition: 四處躲藏、亂跑。
- word: 環境永續
  definition: 人類在使用地球的生態體系時，能確保其永遠的再生不息。
- word: 禦寒
  definition: 抵抗寒冷。
- word: 大放異彩
  definition: 表現非常出色。
- word: 因應而生
  definition: 順應時機而出現或產生。
- word: 諷刺
  definition: 用幽默或挖苦的方式批評社會議題或人的行為。
- word: 氣候變遷
  definition: 指地球氣候在長時間裡的改變。例如，這兩百年人類活動導致的全球暖化。
- word: 憂心忡忡
  definition: 焦慮、擔憂或不安的心情。
- word: 象徵
  definition: 用具體事物來表現抽象的觀念。例如，用綠色象徵環保；用玫瑰象徵愛情。
