reading_strategy: 品格力－落實環保3R(減少使用、物盡其用、循環回收)
knowledge_video_url: https://www.youtube.com/watch?v=NiRq8rynz0Y
story_text: '阿國終於完成了自己有史以來第一場路跑賽，正在為成功抵達終點感到興奮時，他環顧四周看到了這一幕：路邊每隔幾步就有被丟棄的塑膠水杯，地面上到處可見五顏六色的能量膠；起跑時因為天氣濕冷，有些跑者穿上輕便雨衣禦寒，雨停後隨意把雨衣扔在分隔島，有時雨衣隨風揚起，就像是跑道上的黃色小怪物到處亂竄，在這場強調為愛而跑的比賽中，看起來格外諷刺。

  「運動是好事，但造成環境汙染就讓好事大大扣分了！」阿國心想：「有沒有可能舉辦沒有汙染的運動賽事呢？」

  事實上，已經有越來越多人重視運動賽事的環境永續議題。一場運動賽事，從賽前的宣傳旗幟、秩序冊，到比賽中的運動衣、紀念品，再到賽後的獎盃、證書……等等，耗費不少資源和能源。賽事規模越大，對環境造成的負擔也越大，像是交通運輸造成的碳排放、人潮聚集帶來的廢棄物，都讓人憂心忡忡，「綠色賽事」的理念於是因應而生。

  綠色，是環保運動的象徵，代表對自然環境的尊重和保護。把永續的理念融入體育賽事中，是為了減少對自然資源的消耗和對氣候變遷的影響，同時也能喚起參賽者和社會大眾的環境意識。

  「綠色賽事」的具體作法，就是落實「環保3R」：

  1.Reduce（減少使用）：減少碳足跡、減少消耗資源、減少垃圾。

  2.Reuse（物盡其用）：重複使用器材及裝備。

  3.Recycle（循環回收）：使用再生能源、使用再生材料。

  舉例來說，許多賽事採用網路報名，不再印製秩序冊，連完賽證書都能線上下載，減少紙張的使用；比賽紀念衫也改為選購，參賽者有需要再買，不再強制贈送，避免無謂浪費，這就是Reduce（減少使用）。再者，布置時不使用一次性的器材或物品，下次比賽還可以再用；比賽過程提供可重複使用的環保杯，參賽者「一杯用到底、杯杯不落地」，就是Reuse（物盡其用）的實踐。此外，像臺北馬拉松選用花蓮再生石材、新竹城市馬拉松以回收玻璃製作獎盃，都獲得民眾高度評價；臺灣利用寶特瓶回收製成的環保球衣，在世界盃足球賽中受到許多國家球隊歡迎，大放異彩，這些都是Recycle（循環回收）的展現。

  作為熱愛運動的地球公民，阿國意識到：「運動賽事不僅是健康和快樂的活動，也應該是一個環境教育的好機會。」阿國決定要讓更多同學知道這件事的重要性，並且一起向學校師長提案──從學校每年舉辦的運動會做起，落實環保3R，呼籲全校師生：不要把快樂帶走，卻把悲傷留給地球！'
