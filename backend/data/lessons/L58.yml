      type: checkbox
      options:
        - 天生的身體優勢（高海拔、小腿細長）
        - 團隊合作（陪跑員、教練團）
        - 自律、內省與閱讀
        - 只靠高科技跑鞋
      answer:
        - 0
        - 1
        - 2
    - prompt: 第二篇文章提出了什麼質疑？
      type: select
      options:
        - 基普喬吉的訓練方式不科學
        - 高科技跑鞋可能造成比賽不公平
        - 馬拉松的距離應該縮短
      answer: 1
    - prompt: 第三篇文章認為，運動成績進步的兩大因素是什麼？
      type: select
      options:
        - 營養和休息
        - 科技進步和專項選才
        - 獎金和國家支持
