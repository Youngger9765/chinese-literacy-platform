title: 多文本-馬拉松王者+靠跑鞋破紀錄合理嗎+促成更高更快更遠的因素
genre: 記敘文
text_type: 多*3
reading_strategy: 同一主題(運動-跑步)由比較不同作者觀點以形塑讀者觀點(基普喬吉破紀錄是否是靠自己的力量?)
story_text: "新聞標題一：前無古人的偉大！肯亞名將基普喬吉2小時內跑完馬拉松全程，樹立人類里程碑。\n「你覺得100公尺跑17秒，這樣速度快不快？」\t\t\n「很慢啦，還慢得要死。」\n「但每100公尺跑17秒，連續跑42公里呢？」\n「神經病，哪裡有可能？」\n「你不要不相信，2022年9月25日在柏林的馬拉松大賽，就有一個神人，用兩小時零1分鐘跑完了42公里，打破了世界紀錄，他就是基普喬吉。」\n來自肯亞的基普喬吉\n肯亞以長跑好手聞名於世，他們絶大多數都出身貧苦，身型苗條、小腿細長是他們天生的優勢，此外，肯亞許多村莊海拔都在2500公尺以上，高海拔、溫和的氣候以及綿延的鄉村小路提供長跑運動員合宜的訓練環境，有利於訓練出強大的心肺功能。年輕人有很高的動機投入長跑運動，只要跑出成績，就可以進入訓練中心接受訓練。在能力分級的制度下，頂級的選手將有機會出國比賽、拿獎金。奪牌後的獎金和福利將讓他們下半輩子都不愁吃穿，而基普喬吉就是眾多選手中的佼佼者。\n基普喬吉1984年出生於肯亞的裂谷省南迪郡，這裡海拔2047公尺，空氣中氧氣稀薄。他的家到學校有四、五公里遠，但他從小跑步上，長期下來，鍛鍊出他強大的心肺功能，奠定了長跑的基礎。基普喬吉認為：「在肯亞的農村長大，會幫助你培養各種技能，讓你的運動員生涯走得更長遠。」\n運用團隊力量獲勝。\n基普喬吉說：「馬拉松將越來越需要團隊的努力。」馬拉松的距離有42公里，過去體育界普遍認為2小時跑完42公里是人類的極限，基普喬吉如何利用團隊力量破紀錄呢？以2019年的「1小時59分挑戰計畫」為例，教練團安排了幾位不斷輪替的陪跑員，陪跑員在基普喬吉前方擺出倒V字隊形，在他後方還有另外兩名陪跑員，這樣安排的目的是要以人為的方式，把空氣阻力降到最低。教練團以雷射光點引導陪跑員的配速，基普喬吉只要跟上團隊的配速，就有機會破世界紀錄。不但如此，他還穿上了高科技的跑鞋，NIKE宣稱這種鞋子可以提升4%的跑步效率。基普喬吉最終的成績是1小時59分40.2秒，打破了有史以來的「馬拉松2小時魔障」。當然，這次的破紀錄並不是真實的比賽，但在2022年柏林馬拉松大賽時，他用兩小時零1分鐘破了世界紀錄，基普喬吉一樣也歸功於團隊的努力。\n看重自律、內省與閱讀。\n儘管基普喬吉是世界最頂尖的馬拉松選手，但他生活簡樸，和隊友住在面積不大的宿舍裡。他有次在接受記者採訪時談到：「我們在訓練中心的生活很簡單，早上起床後就練跑，回來後去吃午飯，接受按摩以放鬆肌肉；下午四點再跑，晚上喝點茶，休息，和隊友交流、討論，睡覺，日復一日。」他認為：「只有自律的人才能在生命中獲得自由。當你開始審視自己時，這就意味著要做正確的事，而不只是做你想做的事。我不是用腿在跑步，我是用心跟頭腦在奔跑。」此外，他也有寫訓練日記的習慣，寫下課程細節、感受和遇到的訓練難題，做為下一次調整的參考，多年下來，他累積了一大本厚厚的筆記。\n\
  更特別的是，許多人認為運動員是不讀書的，但基普喬吉熱愛閱讀，他認為閱讀能讓他專心，不必理會干擾他的紅塵俗事。他的閱讀書單有很高的多元性，希臘哲學家、傑出運動員傳記到各種心靈成長的書籍應有盡有。《與成功有約：高效能人士的七個習慣》就是他的愛書之一。\n出身貧苦的基普喬吉，在充滿挑戰的自然環境下成長，苦練之外，又看重團隊合作與自律，也藉著廣泛閱讀來提升自己、增廣見聞，真是\n值得全世界年輕運動員效法的好榜樣。\n新聞標題二：基普喬吉「跑出歷史」卻引人質疑！「跑鞋」或許將成為未來的奪牌關鍵。\n當代最傑出的馬拉松名將基普喬吉，2019年「跑出歷史」，成為史上首位在2小時之內完成馬拉松全程的選手，然而基普喬吉當時所穿的跑鞋卻備受爭議，原因在於只要穿上這雙高科技跑鞋（Nike ZoomX Vaporfly NEXT%），跑者屢屢打破紀錄，比賽不公平的抱怨聲浪也越來越大。\n此跑鞋最大的賣點是「極輕」及「高回彈」，鞋子雖然增加了15％的特製泡棉，但總重量不變。跑鞋鞋面的特殊材料，能預防汗水和雨水的過度吸收，讓它在跑步過程中保持透氣和乾爽。此外，前後腳掌高低差也降了0.3公分，這點微調讓腳掌在跑步時感覺更為穩定。\n此跑鞋發布以來，多位馬拉松選手穿著此跑鞋打破馬拉松世界紀錄，這引發了質疑的聲浪，認為高科技跑鞋造成不公平的競賽。2020年1月，國際田徑聯合會對此爭議做出了回應，大意是：跑鞋科技的進步與發展，對於運動員而言，都只是屬於輔助的功用，只要比賽前幾個月，跑鞋就已經公開販售，人人可取得，就沒有不公平的問題。\n新聞標題三：科技進步與專項選材\n1936年美國選手歐文斯（J. Owens）在奧運百公尺短跑創下10.2秒的世界紀錄，他如果來參加2013的奧運百公尺決賽，當牙買加選手博爾特（U. Bolt）以9.77秒的速度壓線時，歐文斯距離終點還有4.3公尺遠，更不幸的是，他是九名參賽選手中的最後一名。不只是短跑，幾乎每一項的競技運動的世界紀錄，包括跳高、跳遠、游泳、自行車和馬拉松，在一個世紀內都有讓人瞠目結舌的進步。\n從生物學的角度，人類絶對不可能在短短的100年內演化出新的人種來，問題來了，是什麼原因造成各項運動的世界紀錄這麼大的進步呢？美國的運動研究專家艾普斯坦（D. Epstein）分析了許多資料後，提出了「科技」和「選才」兩個面向的解釋：\n科技進步\n讓我們在跑道的起點蹲下來，看看歐文斯和博爾特這兩位歷史上最有名的短跑運動員，跑步的過程有什麼差異。博爾特起跑時，腳下有起跑架，幫助他可以把所有腳上的力氣爆發來，成為往前推動的力量；他雙腳向前大步邁開時，輕又合腳的釘鞋踩在鋪著彩色PU塑膠粒的特製跑道上，鞋子和跑道的設計讓跑者可以用最快的速度奔馳。反觀1936年的歐文斯，跑道由煤渣和木頭焚燒後的灰渣鋪成，他一腳跨出，鬆軟的跑道就吞噬了他腿上的力氣，有研究證據指出，和PU跑道相比，煤渣跑道會多耗費選手1.5%的力氣；此外，他沒有起跑器，自己帶著一把種花用的小鏟子，在起跑線挖洞助跑，而且，他穿的釘鞋是8年前才發明的，又重又容易變形。八十幾年之後，這些拖慢速度的因素全部都被科技產品改善了，怪不得每一位奧運百公尺決賽的選手的成績都領先當年的歐文斯了。\n\
  除了短跑之外，低阻力鯊魚泳衣、低風阻的輕量自行車及NIKE的高科技長跑鞋，也大幅提升了游泳、自行車和馬拉松競賽的世界紀錄。但，科技不是唯一讓人類運動成績進步的唯一因素，另一因素是「選才」。\n專項選才\n二十世紀的前半葉，教練們相信中等身高、中等體重的身材，是所有運動項目的最適合體型。但後來運動科學家和教練發現，不同的運動類型，需要不同體型的運動員。例一，1920年代，跳高優秀選手和鉛球優秀選手的平均身材幾乎沒有差別，但100年後的現在，世界頂尖的跳高選手都是高瘦型，平均身高有190公分，高於頂尖鉛球選手的平均身高約6公分，但平均體重卻只有73公斤，比鉛球選手少了將近50公斤。例二，體操選手個子要夠小，翻滾時才能靈動，近三十年，頂尖女子體操選手的平均身高從160公分降到150公分。而美國職業籃球NBA於1946年創立時，職業球員平均身高是188公分，都是長人沒錯，但現在的平均則是200公分，都是巨人了。\n教練的選才，不但讓選手們該高大的愈來愈高大，該小巧的愈來愈小巧，連比例古怪的，也愈來愈古怪。例如，游泳選手需要長而有力的雙臂，下半身短一點較好；跑步選手剛好顛倒，最好腿長一點，上半身短一點；結果全世界最厲害的游泳選手費爾普斯（M. Phehelps）身高193公分，全世界最厲害的中長跑選手奎羅依（H. Guerrouj）身高175公分，兩人身高差了18公分，但是他們的腿長卻差不多，居然能穿同號的長褲；另外，NBA球員的比例也和常人迥異，他們的雙手特別長，一般人的臂展（就是把雙臂平舉展開，從指尖到指尖的距離）差不多和身高相同。但平均身高200公分的NBA球員，平均臂展卻是213公分。\n不管哪一種運動項目，每位選手想取得進入奧運的門票，一定得經過千錘百煉的訓練和比賽。但這篇文章告訴我們，除了訓練之外，原來科技的運用和針對專項需求的選才也是得到獎牌的關鍵因素哦。"
