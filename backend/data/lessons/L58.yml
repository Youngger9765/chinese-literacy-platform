- '從生物學的角度，人類絶對不可能在短短的100年內演化出新的人種來，問題來了，是什麼原因造成各項運動的世界紀錄這麼大的進步呢？美國的運動研究專家艾普斯坦（D. Epstein）分析了許多資料後，提出了「科技」和「選才」兩個面向的解釋：

  科技進步。'
- 讓我們在跑道的起點蹲下來，看看歐文斯和博爾特這兩位歷史上最有名的短跑運動員，跑步的過程有什麼差異。博爾特起跑時，腳下有起跑架，幫助他可以把所有腳上的力氣爆發來，成為往前推動的力量；他雙腳向前大步邁開時，輕又合腳的釘鞋踩在鋪著彩色PU塑膠粒的特製跑道上，鞋子和跑道的設計讓跑者可以用最快的速度奔馳。反觀1936年的歐文斯，跑道由煤渣和木頭焚燒後的灰渣鋪成，他一腳跨出，鬆軟的跑道就吞噬了他腿上的力氣，有研究證據指出，和PU跑道相比，煤渣跑道會多耗費選手1.5%的力氣；此外，他沒有起跑器，自己帶著一把種花用的小鏟子，在起跑線挖洞助跑，而且，他穿的釘鞋是8年前才發明的，又重又容易變形。八十幾年之後，這些拖慢速度的因素全部都被科技產品改善了，怪不得每一位奧運百公尺決賽的選手的成績都領先當年的歐文斯了。
- '除了短跑之外，低阻力鯊魚泳衣、低風阻的輕量自行車及NIKE的高科技長跑鞋，也大幅提升了游泳、自行車和馬拉松競賽的世界紀錄。但，科技不是唯一讓人類運動成績進步的唯一因素，另一因素是「選才」。

  專項選才。'
- 二十世紀的前半葉，教練們相信中等身高、中等體重的身材，是所有運動項目的最適合體型。但後來運動科學家和教練發現，不同的運動類型，需要不同體型的運動員。例一，1920年代，跳高優秀選手和鉛球優秀選手的平均身材幾乎沒有差別，但100年後的現在，世界頂尖的跳高選手都是高瘦型，平均身高有190公分，高於頂尖鉛球選手的平均身高約6公分，但平均體重卻只有73公斤，比鉛球選手少了將近50公斤。例二，體操選手個子要夠小，翻滾時才能靈動，近三十年，頂尖女子體操選手的平均身高從160公分降到150公分。而美國職業籃球NBA於1946年創立時，職業球員平均身高是188公分，都是長人沒錯，但現在的平均則是200公分，都是巨人了。
- 教練的選才，不但讓選手們該高大的愈來愈高大，該小巧的愈來愈小巧，連比例古怪的，也愈來愈古怪。例如，游泳選手需要長而有力的雙臂，下半身短一點較好；跑步選手剛好顛倒，最好腿長一點，上半身短一點；結果全世界最厲害的游泳選手費爾普斯（M. Phehelps）身高193公分，全世界最厲害的中長跑選手奎羅依（H. Guerrouj）身高175公分，兩人身高差了18公分，但是他們的腿長卻差不多，居然能穿同號的長褲；另外，NBA球員的比例也和常人迥異，他們的雙手特別長，一般人的臂展（就是把雙臂平舉展開，從指尖到指尖的距離）差不多和身高相同。但平均身高200公分的NBA球員，平均臂展卻是213公分。
- 不管哪一種運動項目，每位選手想取得進入奧運的門票，一定得經過千錘百煉的訓練和比賽。但這篇文章告訴我們，除了訓練之外，原來科技的運用和針對專項需求的選才也是得到獎牌的關鍵因素哦。
