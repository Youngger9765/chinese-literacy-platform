lesson_uid: L0082
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 繁衍
  - 覓食
  - 本能
  - 求偶
  - 鎮日
  - 天兵
  - 基因
  - 體現
  - 紀律
  - 此起彼落
  - 片面
  items:
  - index: 1
    word: 本能
    definition: 生物天生就會，不必經過學習的行為或能力。
  - index: 2
    word: 此起彼落
    definition: 這裡起來，那裡落下。形容連續不斷。
  - index: 3
    word: 求偶
    definition: 尋找配偶的行為。
  - index: 4
    word: 覓食
    definition: 找尋食物。
  - index: 5
    word: 基因
    definition: 生物遺傳訊息的基本單位。
  - index: 6
    word: 鎮日
    definition: 整天。
  - index: 7
    word: 體現
    definition: 把抽象的特質具體表現出來。例如：螞蟻的合作精神體現了群體的力量。
  - index: 8
    word: 繁衍
    definition: 生物透過生殖產生後代，使族群延續。
  - index: 9
    word: 天兵
    definition: 原指天神的兵。現在被用來指稱搞不清狀況，做事糊塗或常出錯的人。
  - index: 10
    word: 紀律
    definition: 團體成員共同遵守的規則與秩序。
  - index: 11
    word: 片面
    definition: 只看到事情的一部分，不夠完整。
  notes:
    answer_carrier: 橘色手寫字（PDF p3）；文字層的空格內已填有同樣的答案
