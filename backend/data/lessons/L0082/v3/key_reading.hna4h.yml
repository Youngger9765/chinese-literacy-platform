  passage: 螞蟻雖然身軀小，卻有驚人的力氣，能夠扛起自己重量數十倍的食物。牠們是社會性昆蟲，分工嚴密。整個蟻群的核心是蟻后，所有的螞蟻都為了一個共同的目標——協助蟻后繁衍後代。工蟻日夜奔波，冒著生命危險外出覓食，都是為了延續蟻群的生命。從生物行為的角度來看，螞蟻的合作延續蟻群的生存，而蟋蟀則透過競爭爭取繁衍的機會。夏秋時節最容易發現蟋蟀的蹤影，草叢與灌木間常傳來一聲聲「唧唧」的蟲鳴，此起彼落、忽遠忽近，正是蟋蟀在大自然的舞台上放聲高歌。但你知道嗎？這些會發出鳴叫聲的都是雄蟋蟀呢！原來，蟋蟀高歌是為了求偶，雄蟋蟀會摩擦前翅，發出清脆的鳴聲，就像在演奏情歌，吸引女朋友的注意；有時也用鳴聲警告其他雄蟋蟀不要靠近地盤、不要來爭奪女朋友。雌蟋蟀最終會選擇鳴聲最吸引她的雄蟋蟀作為伴侶，進而交配，繁殖下一代。
  start_text: 螞蟻雖然身軀小，卻有驚人的力氣，能夠扛起自己重量
