  passage: 螞蟻雖然身軀小，卻有驚人的力氣，能夠扛起自己重量數十倍的食物。牠們是社會性昆蟲，分工嚴密。整個蟻群的核心是蟻后，所有的螞蟻都為了一個共同的目標——協助蟻后繁衍後代。工蟻日夜奔波，冒著生命危險外出覓食，都是為了延續蟻群的生命。
