lesson_uid: L0082
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
  questions:
  - index: 1
    answer: D
    stem: 下列文句中的語詞，何者使用正確？
    options:
      A: 這家工廠每天都「繁衍」上千個零件
      B: 他在網路上四處「求偶」，希望找到事業的夥伴來
      C: 他只讀了十分鐘，卻說自己「鎮日」用功
      D: 這幅畫「體現」了藝術家對大自然的熱愛和敬畏
    explanation: 第1題解析：(Ａ「繁衍」指的是生物的繁殖或延續。Ｂ將求偶用於人類社交場合的情境，語境不符。Ｃ「鎮日」通常形容的是固定的長時間行為，不適用於變動的旅行行為。)
    explanation_note: 原稿是一個浮動說明框，PDF p6 上整片疊在題幹與大題指示語上，幾乎讀不出來；文字層完整
  - index: 2
    answer: B
    stem: 文章第二段指出，螞蟻和蟋蟀的行為背後有什麼共同目的？
    options:
      A: 都是為了儲存食物
      B: 都是為了延續生命
      C: 都是為了避免天敵
      D: 都是為了獲得娛樂
    stem_note: 題目寫「第二段」，但螞蟻與蟋蟀行為的共同目的實際印在第 8 段（第 2 段只講螞蟻）。照原稿記錄，未更動。
  - index: 3
    answer: C
    stem: 作者寫「螞蟻可能覺得蟋蟀荒廢正業，蟋蟀也可能認為螞蟻缺乏情趣，但行為背後可能都有共同的目的」，主要想提醒讀者什麼？
    options:
      A: 生物行為不同，就不可能有共同目的
      B: 螞蟻和蟋蟀應改變行為，符合彼此期待
      C: 只從自己的角度看事物，容易形成片面結論
      D: 螞蟻和蟋蟀的行為都不符合生存需求
  - index: 4
    answer: A
    stem: 作者認為《伊索寓言》的做法有什麼問題？
    options:
      A: 為了教育兒童，把人類的道德標準加在昆蟲身上
      B: 讓昆蟲像人一樣說話，使故事缺少科學的真實感
      C: 作者為蟋蟀打抱不平，高歌行為並沒有對錯
      D: 強調昆蟲的個體行為，忽略了群體行為的重要性
    explanation: 第4題解析：(作者批判的是過度簡化昆蟲行為，讓人們以「美德 vs. 惡習」的二元對立方式去理解，而忽視了昆蟲行為背後共同的生物學目的—延續生命。)
    explanation_note: 原稿是一個浮動說明框，印在第 2 題選項右側
  - index: 5
    answer: C
    stem: 「如果只從自己的角度出發，導致片面結論，常會因此失去對事物多元客觀的理解。」下列情況，哪一個不是片面的結論？
    options:
      A: 看到一些畫家收入不高，便認定「藝術不能當飯吃」
      B: 認為孩子只有在學校名列前茅，未來才有可能成功
      C: 認為遊民未必懶惰，也許他們遭遇了不得已的困境
      D: 認為穿粉紅色衣服的男生，有女性化的傾向
    explanation: (A、B、D 都以單一的主觀價值或標準評斷，缺乏對文化背景、行為目的或多元價值的理解。)
    explanation_note: 原稿是一個浮動說明框，PDF p7 上壓在選項 D 上方
    options_note: PDF p7 上選項 D 被中間一個裝飾圖框擠到下方，看起來像脫隊；文字層順序正常
