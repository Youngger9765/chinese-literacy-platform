_總表_對照note: '本課語詞在**三個地方各不相同**，三份都照抄、未互相覆蓋：

  ・總表(10)：社會性昆蟲、繁衍、覓食、灌木、求偶、鎮日、天兵、基因、體現、紀律

  ・學習單語詞框(11)：繁衍、覓食、本能、求偶、鎮日、天兵、基因、體現、紀律、此起彼落、片面

  ・第八大題灰框(12)：灌木、紀律、覓食、天兵、鎮日、片面、求偶、繁衍、體現、基因、此起彼落、本能

  交集 8 個；總表獨有「社會性昆蟲」，語詞框獨有「本能／此起彼落／片面」，

  灰框則是語詞框 11 個再加回「灌木」。第三大題的 11 題對應語詞框那一組。

  ⛔ 未自行以任何一份覆蓋另一份 —— 要對齊的是 xlsx 與學習單，不是這份抽取。'
