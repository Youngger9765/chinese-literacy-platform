spotlight:
  lesson: G7-L14
  strategy_name: 用表格整理訊息-依比較項目看出異同
  strategy_type: comparison
  blocks:
  - type: guide
    text: 上一課〈女性太空人登月〉中，我們學會把兩個對象的細節放進表格，並從細節歸納出「比較項目」。這一課要再往前一步：把同一個比較項目的內容放在同一列，一列一列比較，找出相同與不同。祕訣：同一列，才可以比。　　在「女性太空人登月」，我們已經學過整理表格的步驟：❶找比較對象：這張表要比較哪兩個對象？把它們寫在表格對象列。❷找同列細節：找出同一列中比較對象可以互相比較的各個細節。❸問比較項目：把各細節放一起，問：「它們都在說哪一個項目？」❹填入並檢查：把比較項目和文章細節填進同一列，確認兩格都在回答同一個項目。項目           　　
      對象對象１對象２比較項目１文章細節文章細節比較項目２文章細節文章細節　　現在就讓我們利用本課文章來練習看看吧！
