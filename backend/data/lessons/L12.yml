multiple_choice:
- question: 依據本文，下列哪一個成語最能形容職棒選手面臨的「職業競爭」？
  options:
  - 精湛出色。
  - 汗流浹背。
  - 僧多粥少。
  - 合作無間。
  answer: C
  explanation: 課文解釋「僧多粥少」為「人多資源少，供不應求」，並舉例「這家公司提供的職位有限，應徵者卻很多，真是僧多粥少。」這句話最能貼切地形容職棒選手面臨的職業競爭，即有限的職位卻有眾多優秀的競爭者。
- question: 學生棒球運動員如果無法進入職棒，常見的職業選擇是什麼？？
  options:
  - 服務業。
  - 金融業。
  - 醫療業。
  - 科技業。
  answer: null
  explanation: null
- question: 根據本文，臺灣學生棒球運動員主要面臨的困難是什麼？
  options:
  - 訓練設施不夠完善。
  - 學業與棒球訓練難以兼顧。
  - 缺乏家長的支持。
  - 教練資源不足。
  answer: B
  explanation: 課文主要探討時間管理的重要性，並明確指出時間管理能幫助學生運動員在學業與運動訓練之間找到平衡，顯示這兩者難以兼顧是他們面臨的主要問題。
- question: 課文中說，不管繼續打球或離開球場，棒球運動員的職涯選擇都受到重重限制，請問最可能的原因是什麼？
  options:
  - 因為職棒選手的職涯太短，平均不到五年。
  - 球員經常因過度訓練而受傷，不易進入職棒。
  - 球員基礎學力弱，缺乏終身學習的能力。
  - 臺灣的訓練環境艱苦，不易培養出球技精湛的選手。
  answer: B
  explanation: 課文中的語詞「僧多粥少」意指「人多資源少，供不應求」，這直接說明了職業棒球的職位機會有限，而有志成為職棒選手的人數眾多，因此導致球員「不易進入職棒」，職涯發展自然受到限制。
- question: 課文最後一句中，「可以有不同於現在的想像」是什麼意思？
  options:
  - 學生球員可以提早轉職，去體驗不同的職業活動。
  - 棒球夢可以兼顧學業，未來職涯有更寬廣的選擇。
  - 學生球員必須放棄棒球夢，專注於學業才能有好前途。
  - 學生球員只能在棒球或學業中選擇一個，全心全意投入。
  answer: B
  explanation: 課文的時間管理部分強調「運動和學習並不是對立的」，並說明時間管理能幫助學生在學業和運動訓練之間找到平衡，進而「不僅在學業上取得好成績，還能在運動訓練和其他活動中有優異表現」，這表示兼顧兩者能讓未來的職
