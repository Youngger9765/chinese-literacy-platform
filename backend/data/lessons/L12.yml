title: 我有一個棒球夢
genre: 說明文
text_type: 單
reading_strategy: 時間管理－認識四步驟(計畫、優先順序、合理安排、保持彈性)，設定優先順序及練習規劃日程
knowledge_video_url: https://www.youtube.com/watch?v=u_ISd9R0_7s
story_text: '臺灣國小到高中大約有1萬5千名學生棒球運動員。大多數學生是在國小四年級加入學校棒球隊。投入學校棒球隊，長大成為職業選手，是許多家長與孩子的夢想。

  為了圓夢，也為了追求集體榮譽，學生棒球員必須在紅土上汗流浹背地進行球技及體能訓練，許多球員甚至必須離家集中住校，接受嚴格的作息與紀律要求。因為投入大量的時間接受訓練、比賽，學生球員經常難以兼顧學校課業，「臺灣巨棒」陳金鋒就說過：「四年級起就沒讀書……連字都不會寫」。學生球員這樣努力了八、九年，高中職畢業時，他們會來到一個生涯的叉路口：要「繼續打球」或「離開球場」。

  繼續打球

  表現優異的球員被選進大學球隊，接受更專業化的訓練及更難的挑戰，球技特別精湛出色的，甚至有機會通過非常競爭的選秀，進入職棒。但根據體育署的統計資料，學生運動員僅有500分之1的機會進入職棒，進入職棒後更大的兩項困境是「職涯短」和「轉業難」。棒球好手進入職棒的平均年齡是26歲，職棒生涯平均只有4.8年，亦即，多數職棒選手在30歲以前就退役，棒球職涯超過10年以上的球員不超過5％。

  離開球場

  許多球員會因運動傷害、身體條件、球技發展等因素離開球場，因為長期犧牲學業，導致這條路的職涯選擇受限。職業軍人、低技術體力工、服務業成為最常見的生涯選項。曾經有學者問棒球隊學生「如果沒辦法打職棒呢？」聽到的不外乎兩個答案：「那就去釘板模或當兵啊。」即使是職棒選手退役後，也面臨轉業受限的困境。擔任教練是許多退役球員的首選，但教練職缺僧多粥少，多數職棒退役球員，多朝保全、服務業等勞動性工作移動。

  許多學生球員仔細思考過夢想和事實之間可能的差距，他們也想兼顧學業和運動訓練，想讓自己未來有更寬廣的職涯選擇，但這不是學生自己就能辦到的。還好，現在全臺灣有許多愛棒球的校長及教練，運用了各種方法幫助學生球員在教室和球場間取得平衡。例如，花蓮縣三民國中的林國源校長、張志強教練和老師們合作無間󠇡地改善了球員學習、訓練及生活的樣貌。他們增加了宿舍的淋浴間及洗衣機，減少等待洗澡、洗衣服的時間，讓球員在繁重嚴格的訓練中，還能擠出讀書的時間來。學校還訂定了出賽辦法，要求學業成績達標才能出去比賽。再例如，新竹縣中山國小郭碧玄校長認為，為了確保孩子未來的人生能走得更寬廣，維持基本學力和開展運動技能同樣重要，他們加入中信基金會支持的「愛接棒計畫」，為棒球選手提供額外的夜間課輔，以確保學生的基本學力。

  綜上所述，學生運動員在生涯的選擇上的困難是，進入職棒的機會非常少，即使進入職棒，也會面臨職涯短、轉業難的困境；無法進入職棒的球員，則可能因缺少基礎學力，終身學習的能力較弱，讓他們難以找到專業性的工作。這也就是為什麼愈來愈多的學校，開始想方設法幫助學生棒球員兼顧球技與學力的原因。希望在學生、教練與學校共同的努力下，讓許多孩子的棒球夢，可以有不同於現在的想像。'
