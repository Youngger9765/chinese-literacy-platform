passage: 寫作文時，文章必須緊扣題目，是每個人都懂的道理。如果文不對題，一定會被老師扣很重的分數。但在日常生活中卻常常看到「題不對文」的現象，尤其是新聞報導——記者完成文章後，下標題時故意添加一些「調味料」，讓標題變得辛辣、浮誇，也就是閩南語所說的「重鹹」、「重口味」，目的是為了吸引閱聽大眾點擊閱讀或收看，我們稱這種標題為「誘餌式標題」或「釣魚式標題」。
