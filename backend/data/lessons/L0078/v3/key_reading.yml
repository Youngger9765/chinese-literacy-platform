  passage: 寫作文時，文章必須緊扣題目，是每個人都懂的道理。如果文不對題，一定會被老師扣很重的分數。但在日常生活中卻常常看到「題不對文」的現象，尤其是新聞報導——記者完成文章後，下標題時故意添加一些「調味料」，讓標題變得辛辣、浮誇，也就是閩南語所說的「重鹹」、「重口味」，目的是為了吸引閱聽大眾點擊閱讀或收看，我們稱這種標題為「誘餌式標題」或「釣魚式標題」。「下週雷雨炸全臺！氣象署急發快訊。」「某明星慘遭爆打，死前驚吐一句話！」正在滑手機的你，看到這樣的新聞標題，是不是很想點進去看看怎麼一回事？仔細看完新聞才發現，第一則氣象預報的新聞，其實是局部地區有雷擊和瞬間大雨的發生機率，不是「全臺」，也不到「炸」的程度，氣象署只是例行發布預報，沒有「急發」的意思；至於第二則新聞，寫的是這位明星在即將上映新戲中的情節，根本不是真實的社會事件。這兩則報導的內容都和標題描述有一大段差距，但「語不驚人死不休」的標題卻能輕易博取了人們的眼球。
  start_text: 寫作文時，文章必須緊扣題目，是每個人都懂的道理。
