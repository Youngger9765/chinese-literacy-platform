lesson_uid: L0078
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    answer: D
    stem: 下列選項「　」中的語詞，何者使用正確？
    options:
      A: 過了五十歲，許多人因為老花眼看東西總是「眼花撩亂」
      B: 早餐店湧入人潮，顧客一個接一個，真是「目不暇給」
      C: 這則新聞報導的標題「聳動」，這麼無聊的標題誰會想看
      D: 他這次會考作文寫的「文不對題」，難怪得不到高分
  - index: 2
    answer: A
    stem: 「誘餌式標題」通常文字聳動，吸引人們點擊，以下哪個不屬於「誘餌式標題」?
    options:
      A: 動物園保育技術突破，成功繁殖穿山甲
      B: 早餐千萬別吃這個，小心終身洗腎
      C: 天天騎機車上下班，40歲的她居然……
      D: 藝人飆高音唱歌曲，慘烈破音差點斷氣
    stem_note: 原稿的「不屬於」加了底線，末尾用半形問號。
  - index: 3
    answer: B
    stem: 誘餌式標題頻繁出現在我們的生活中，面對這些亂象，下面哪個做法較不恰當？
    options:
      A: 要對誇張的標題保持警戒
      B: 不再閱讀所有的報章雜誌
      C: 核對標題與內容的一致性
      D: 努力培養獨立思考的能力
    stem_note: 原稿的「不恰當」加了底線。
  - index: 4
    answer: C
    stem: 以下哪些是誘餌式標題的特徵？
    option_bank:
      甲: 誇張的文字
      乙: 利用熱門話題或公眾人物
      丙: 模糊不清的訊息
      丁: 直接的描述
      戊: 情緒性的字眼
    option_bank_note: 甲~戊 印在題幹下方的方框裡，四個選項是它們的組合。
    options:
      A: 甲乙丙丁
      B: 乙丙丁戊
      C: 甲乙丙戊
      D: 甲丙丁戊
  - index: 5
    answer: B
    stem: 這篇課文的作者最想達成什麼目的？
    options:
      A: 想要博取讀者的目光，對這篇文點讚
      B: 想要提醒讀者如何有智慧的閱讀網路文章
      C: 想要教導讀者避免寫出文不對題的文章
      D: 想要教導讀者寫作時如何下標
  notes:
    answer_carrier: 橘色手寫代號（PDF p10）；文字層的（　）內已填有同樣的代號
