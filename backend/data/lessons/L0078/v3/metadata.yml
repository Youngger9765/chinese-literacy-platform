strategy_explained: '這一課，我們要練習的是「不被聳動標題騙」的眼睛

  因為文章教我們分辨那些為了吸引你點進去看，但內容可能根本不是那麼一回事的標題，像是用誇張字眼或跟內容不符的

  所以下次看到很吸引人的標題時，記得先想想它是不是在騙你，再決定要不要相信它'
