  instruction: 請用計時器，從指定段落（一    )開始朗讀，在表格中記錄1分鐘朗讀的字數。如果你計時3次後，對自己還不滿意，可以多練幾次。最後一次，找一位同學請他計時、記錄並簽名！
  instruction_note: 括號內的 ☞ 是圖形物件，文字流只有「（一    )」的空白；右括號原稿是半形。
