comprehension:
  questions:
  - index: 1
    answer: A
    stem: 下列語詞，何者使用錯誤？
    options:
      A: 對手操作連續失誤，使他們得以輕鬆逆轉
      B: 主角運用統計知識，分析對手的戰術模式
      C: 他的隊友們發揮卓越的技術，憑靠實力獲勝
      D: 隊友們默契十足，一起想到了一個新的戰術
    rationale: 第6段指出，主角學會了時間管理，並制定了一個作息時間表，使他能夠兼顧學業與電競活動，最終在兩者上都取得進展。
  - index: 4
    answer: D
    stem: 主角覺得晚上九點半時要關機很痛苦，但他說：「還好這不是我一個人的武林」，請問他最可能的意思是什麼？
    options:
      B: 表示一起練武功的人，不會覺得孤單
      C: 我們關機了，總還有人在線上繼續努力
      D: 如果只有他一個人，想抗拒誘惑就更難了
    rationale: 關掉喜愛的遊戲是痛苦的，還好他有一群人在陪他奮鬥，如果只有一個人，根本難以抗拒誘惑。
  - index: 5
    answer: C
    stem: 從主角的經歷中，我們可以學到什麼樣的生活態度？
    options:
      A: 追逐夢想時，應優先提升專業能力，學業可以稍後補足
      B: 找到優秀的夥伴後，團隊合作會比個人自律更重要
      C: 安排好時間並持續努力，可以兼顧夢想與學業
      D: 只要把課本知識運用在電競上，就能提高比賽成績
    rationale: 第11段指出，不論是在追求夢想還是學業上，關鍵是找到平衡，並在面對困難時保持堅持和努力，這樣才能取得成功。
