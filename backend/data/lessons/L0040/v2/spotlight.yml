spotlight:
  lesson: G5-L28
  strategy_name: 自我管理-制定作息時間表
  strategy_type: sel_character
  blocks:
  - type: guide
    text: "上一課，我們學會在時間不夠時，用「列出任務、排出先後、安排做法、檢查調整」處理臨時出現的時間衝突。\n    〈我的電競夢〉的主角既要練電競，又要顧學業，他是怎麼做到「不拖延又自律」的呢？關鍵在於：制定規律的作息表，並按照計畫執行。\n\
      接下來，讓我們先找出自己容易浪費時間或拖延的地方，再制定一張適合自己的規律作息表。"
  - type: guide
    text: 步驟❶：看清時間──看看一天的時間怎麼用
  - type: guide
    text: 請先看看你平常一天的時間都怎麼用。在下列項目中，勾選你常做的三個項目。
  - type: guide
    text: ※想一想：請回答以下問題，也可以直接填寫上面的選項號碼。
  - type: free_text
    prompt: 1.哪一項最容易讓你拖延，也就是一直不想開始？
  - type: guide
    text: →____________________________
  - type: free_text
    prompt: 2.哪一項事情最容易讓你花掉太多時間，該停的時候還停不下來？
  - type: guide
    text: →____________________________
  - type: free_text
    prompt: 3.哪一項事情對你很重要，應該多安排一點時間？
  - type: guide
    text: →____________________________
  - type: guide
    text: （你已看出時間花在哪裡了。接下來，找出自己為什麼會拖延。）
  - type: guide
    text: 步驟❷：找出問題──找出拖延的原因，學習主角的做法
  - type: guide
    text: 在開始規畫之前，先了解自己「為什麼容易拖延」。（可複選）
  - type: guide
    text: ※想一想：
  - type: free_text
    prompt: 1.在上面的原因中，哪一個是你最常發生的？
  - type: guide
    text: 在旁邊畫個「☆」，這是你接下來要特別注意的習慣。
  - type: multi
    prompt: 2.我最常拖延的時段是
    options:
    - 放學後
    - 晚餐後
    - 睡覺前
    - 假日
    - 其他：【　　　　　　　　　】
    answer:
    - 放學後
    - 晚餐後
    - 睡覺前
    - 假日
    - 其他：【　　　　　　　　　】
  - type: guide
    text: 現在，你已經知道自己容易在什麼時候、因為什麼原因而拖延。接著來看看主角怎麼安排時間。
  - type: guide
    text: 主角的作息安排：
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 任務：請勾選你覺得主角值得學習的做法。（複選）
  - type: guide
    text: ※想一想：這些做法中，哪一個你也做得到？請在選項旁畫一個「☆」。
  - type: guide
    text: 步驟❸：安排作息──設計自己的作息時間表
  - type: guide
    text: 現在，請你根據自己的生活節奏，設計「我的自律作息表」
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 步驟❹：檢查調整──選擇可行的反拖延方法
  - type: guide
    text: 有作息表還不夠，重點是能不能準時開始、按時結束。請回想步驟②找到的拖延原因，選出一至兩個最適合自己的方法。
  - type: guide
    text: ※我的反拖延策略（可複選）
  - type: guide
    text: ※我的承諾：
  - type: free_text
    prompt: 1.為了不再拖延，我打算每天固定在【　】點開始【　　　　　　】（例如：寫功課、讀書或複習）。
  - type: free_text
    prompt: 2.我會用【　　　　　　　　　】（方法或工具）提醒自己準時開始。
  - type: self_check
    items:
    - 我能找出自己最容易浪費時間的時段
    - 我能分析自己拖延的原因
    - 我能設計符合自己生活的作息時間表
    - 我能設定可行的反拖延方法
