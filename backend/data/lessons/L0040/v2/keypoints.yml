  - label: 起因與困境
    value: '1.主角最初迷上《聯盟戰記》的原因是什麼？(單選)

      □①想要成為職業電競選手。

      ②電玩遊戲能讓他忘卻現實中的學習煩惱。

      2.沉迷於電競遊戲，出現哪些問題？(多選)

      ①作業沒完成 ②常感到愧疚與焦慮 ③成績直線下滑'
    blanks: []
  - label: 觀念轉變的契機
    value: "※主角透過觀看職業電競比賽的解說，理解到電競的優點有哪些？讓他重新思考電競的價值。(多選)\n  ①快速做出正確判斷。     ②運用邏輯思維。\n\
      \  ③理解數學或機率概念。   ④培養團隊合作。"
    blanks: []
  - label: 解決問題
    value: "1.主角把哪些活動排進作息時間表：(多選)\n__\n2.學習與遊戲的相輔相成：主角在課堂上是如何將遊戲中的經驗應用於學習的？(多選)\n\
      \  ①在數學課運用機率計算遊戲命中率\n  ②在物理課運用遊戲角色的移動軌跡解釋拋物線原理\n  □③他把遊戲戰術策略應用於班級的討論活動中\n3.在全國高中電競聯賽中，作者結合學科知識與遊戲策略，分析對手可能使用的戰術，最終成功逆轉比賽局勢。"
    blanks:
    - answer: ①晨讀與上課②複習、作業與預習③電競訓練□④晚餐與睡眠□⑤熬夜加強訓練
      hint: ''
  - label: 省思
    value: "主角認為，追逐夢想時應做到哪些事，才能增加成功的機會？\n (多選)\n①勇於接受挑戰   ②有效管理時間   \n③制定適當策略   ④持之以恆"
    blanks: []
