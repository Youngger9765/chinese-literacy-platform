  passage: 理智上我知道，作息時間表剛出爐時就必須嚴格執行，但情感上，這樣的自我要求讓我痛苦萬分，特別是晚上九點半，不論遊戲多麼精彩刺激，也必須強迫關機。還好，這不是我一個人的武林，隊友們雖然都捨不得下線，仍互相提醒，一起按表操課，登出遊戲。經過幾個月持之以恆的自律和精確的時間管理，我們在遊戲中的排名節節攀升，學校成績也有明顯進步。爸媽都看在眼裡，臉上終於露出欣慰的笑容。此外，常規的電競訓練與正課的學習也相輔相成。有一次數學老師在講解機率問題，我立刻聯想到遊戲中計算命中率的邏輯：「這不就像計算各項攻擊力，再決定怎麼分配資源，才能打倒對手嗎？」我舉手，興奮的在全班同學面前分享這個想法，全班同學都驚呆了！物理課學到拋物線時，我想到遊戲中拋射武器的飛行軌跡：「如果知道起始位置、速度和方向，就能預測它的落點。」這樣的反應居然得到老師的讚賞，原來這就是融會貫通。我在學習上不斷得到正向回饋，就越來越有信心，也燃起對學習的熱情，開始感覺自己正走在一條學業與電競都能發展的康莊大道上。進入高三準備大學入學考之際，電競社決定參加全國高中電競聯賽。我們過關斬將，終於進入決賽。當天，體育館座無虛席，加油聲此起彼伏，奮戰到比賽的最後一局，我們卻面臨巨大劣勢，眼看就要輸了！此時，我想起數學課學過的統計學知識，快速分析對手的戰術模式並與隊友討論：「他們每次都是從這個位置偷襲，我們可以設下陷阱！」隊友們決定採取我的建議，果然瞬間逆轉了局面。當裁判宣布我們是「Winner」的那一刻，我們尖叫、歡呼、擁抱，淚水模糊了我們的視線，觀眾席上，爸媽和親友團也激動的喝采、鼓掌，整個體育館都沸騰了起來。這次經歷讓我深刻明白，電競不只是遊戲，它教會了我時間管理、團隊合作，甚至能幫助我理解課本知識。現在的我，不僅是一個電競高手，更是懂得平衡生活的大學新鮮人。回顧這段旅程，我最大的收穫不僅是得到比賽的勝利，還體認到追逐夢想並不一定要放棄學業，無論是在遊戲裡，還是現實生活中，我們都應該勇於接受挑戰、採取適當策略，並堅持不懈，才能不斷突破自己，在人生的賽場上贏得專屬自我的精彩！
