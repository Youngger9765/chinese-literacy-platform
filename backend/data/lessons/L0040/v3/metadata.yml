intro: 這篇文章記錄了作者從沉迷電玩遊戲到成為一名優秀電競選手的歷程。作者原本因為過度投入遊戲而影響學業，但在觀看職業電競比賽後，他發現電競不只是單純的玩樂，更需要策略、判斷力與團隊合作。受到啟發後，作者開始學習時間管理，平衡課業與訓練，並將電競中的邏輯思維應用於課堂學習中，取得了顯著的進步。文章描述了作者如何透過自律和努力，與隊友一起克服挑戰，最終在全國聯賽中獲得勝利，並體認到追逐夢想與兼顧學業的可能性。
