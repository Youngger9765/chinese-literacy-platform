spotlight:
  lesson: G4-L10
  strategy_name: 寫作手法：順敘－從時間詞判斷事件順序
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: free_text
    prompt: 1.先圈出時間，再讀一讀這個時間點發生了什麼事，最後依先後順序在（ ）中填入1~4。
  - type: ordering
    items:
    - text: 2019年，楊俊瀚的體育生涯反而走到了谷底。他在拿坡里世大運比賽時受傷，開始了漫長的復健。
      correct_order: 3
    - text: 2018年雅加達亞運上，他以千分之二秒的差距與金牌擦身而過。
      correct_order: 2
    - text: 2017年夏季世界大學運動會田徑男子一百公尺決賽，替中華臺北拿下睽違二十六年的世大運田徑金牌。
      correct_order: 1
    - text: 終於熬過了這段恢復期，突破困境，在2021年重新回到賽場。他最終順利拿下東京奧運參賽的資格。
      correct_order: 4
  - type: single
    prompt: 2.排完時間順序後，把這些事件連起來看。哪一個說法最能整理楊俊瀚這幾年的經歷？
    options:
    - 拿下世大運金牌後，一路順利，最後取得奧運資格
    - 先拿下金牌，後來遇到失敗與受傷，但仍努力復健、重回賽場
    - 一開始就受傷復健，後來才拿下世大運金牌，最後參加亞運比賽
    answer: 先拿下金牌，後來遇到失敗與受傷，但仍努力復健、重回賽場
  - type: free_text
    prompt: 3.〈𪹚龍慶元宵〉　彭仁星
  - type: ordering
    items:
    - text: 元宵節過後，「化龍返天」是活動的尾聲，火化神龍象徵事事圓滿。
      correct_order: 4
    - text: 今年元宵節前，我回到苗栗的阿公家，參加𪹚龍慶元宵活動。
      correct_order: 1
    - text: 元宵夜，我們到公園參加「𪹚龍之夜」，這是活動的高潮。相傳「炸龍」可以納吉招福，越炸越旺，人山人海，歡天喜地，熱鬧得不得了。
      correct_order: 3
    - text: 元宵節前一天，街上家家戶戶歡喜的「迎龍」，希望迎來新年的好福氣。
      correct_order: 2
  - type: guide
    text: 你發現了嗎？
  - type: passage
    source: unknown
    paragraphs:
    - 時間詞不一定都是年份，也可能是「元宵節前、前一天、元宵夜、過後」這類說法。找到時間詞，就比較能看懂事情怎麼發展。
