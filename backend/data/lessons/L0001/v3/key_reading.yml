  passage: 但事與願違，在2019年，楊俊瀚的體育生涯反而走到了谷底。他在拿坡里世大運比賽時受傷，開始了漫長的復健。運動員一旦受傷，不只要花時間復健、無法訓練和出賽，心裡更負擔著損失積分與自我懷疑的種種壓力。然而，壓力並沒有擊垮他，他跟著物理治療師安排的復健課表，一步一腳印的復健，終於熬過了這段恢復期，突破困境，在2021年重新回到賽場。他最終順利拿下東京奧運參賽資格，一圓當時沒能跑進里約奧運的夢想，也成為臺灣二十五年來再度站上奧運一百公尺短跑項目的臺灣選手。短跑競賽是一項孤獨的運動，「十秒間的每個擺手、衝刺，都是經年累月的訓練與堅持。」很多時候必須自己獨自承受訓練受傷帶來的壓力、沮喪和孤寂感。不過楊俊瀚認為無論如何都要學會擁抱恐懼，深刻了解自己所害怕的事物，堅持到底，進而戰勝它。即便是在低潮、逆境時，試著與自己對話，從中尋找答案，現在所遇到的挫折都將成為下一次起跑的能量。人生路上的問題，相信也將可以迎刃而解。
