strategy_explained: '這一次，我們要學會怎麼找出故事裡事情發生的順序，就像偵探一樣，從時間的線索中找到答案

  透過「臺灣最速男」楊俊瀚的故事，你會發現文章裡有很多「時間詞」，像是「那一年」、「後來」，它們就像路標，告訴我們什麼事先發生，什麼事在後頭

  所以，讀的時候，記得眼睛要仔細看，找找看有沒有這些「時間的線索」，它們會帶你更清楚地了解楊俊瀚怎麼克服受傷的挑戰，一步步走向夢想'
