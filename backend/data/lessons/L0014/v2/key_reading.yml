passage: 從此，我的「觀察遊戲」就成了「尋找讀書人」。不限車廂，也包括車站、餐館，雖然滑手機者還是遙遙領先，但「讀書人」也偶有所見。瞧！有位背著旅行背包的叔叔在路邊的候車亭等車，他老神在在的拿出一本書看，帥極了。瞧！放學時刻有個小男孩蹲靠在圍牆邊看故事書，大人在一旁嘻嘻哈哈聊天，他完全樂在書中，不為所動。瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。
