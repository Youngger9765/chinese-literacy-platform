comprehension:
  questions:
  - index: 1
    answer: B
    stem: 下列語詞，何者使用錯誤?
    options:
      A: 陳老師風趣幽默，上起課來「趣味橫生」
      B: 下班時間是交通尖峰期，車輛幾乎「不為所動」
      C: 感冒鼻塞讓他吃東西時覺得食物「索然無味」
      D: 王教練訓練球員方式「與眾不同」，極少大聲叫罵
    rationale: null
  - index: 2
    answer: B
    stem: 媽媽為什麼要作者在人多、沒有位置的時候用眼睛觀察車廂上的人呢？
    options:
      A: 人們在滑手機的同時，其實更渴望單純的閱讀
      B: 生活中不是缺乏美，而是缺乏仔細觀察的眼睛
      C: 讀書的行為正逐漸取代滑手機，成為新的潮流
      D: 閱讀展現出的專注神情，令人移不開目光
    rationale: 在眾多滑手機的人中，讀書的大姊姊顯得特別，那專注的神情，令人著迷，也移不開目光。
  - index: 4
    answer: C
    stem: 第四段，從媽媽對「閱讀」與「滑手機」的分析中，可以推論出作者希望向讀者傳達什麼觀點？
    options:
      A: 閱讀可以改變他人對自己的看法
      B: 學會尊重他人，才能更融入現代社會
      C: 閱讀比滑手機更能讓人慢下來、主動思考
      D: 只有透過不斷觀察他人，才能發現自我優點
    rationale: null
  - index: 5
    answer: A
    stem: 請問下文＜種子的力氣＞的主旨是什麼呢？
    options:
      A: 說明種子強韌的生命力
      B: 舉證種子的力大無窮
      C: 說明種子發育的過程
      D: 瓦礫與石塊才能造就小草
    rationale: 你見過被壓在石塊下的小草嗎？它為了成長，為了接近陽光，不管上面的石塊如何重，縫隙如何窄，它還是會從彎彎曲曲的縫隙中，跑到地面上來。它的根往土裡扎，芽往地面挺，這是一種不可思議的力量。　　　　（本文出自國立編譯館
