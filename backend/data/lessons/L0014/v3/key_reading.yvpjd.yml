  passage: 從此，我的「觀察遊戲」就成了「尋找讀書人」。不限車廂，也包括車站、餐館，雖然滑手機者還是遙遙領先，但「讀書人」也偶有所見。瞧！有位背著旅行背包的叔叔在路邊的候車亭等車，他老神在在的拿出一本書看，帥極了。瞧！放學時刻有個小男孩蹲靠在圍牆邊看故事書，大人在一旁嘻嘻哈哈聊天，他完全樂在書中，不為所動。瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。我問媽媽，為什麼讀書和滑手機會給人這麼不一樣的感覺呢？媽媽說：「我看到一個人在專心閱讀時，也覺得這是一幅令人賞心悅目的畫面，也許是書本只有單純的文字訊息，閱讀過程讓人慢下來、主動思考；而手機裡有太多誘惑性的刺激，為了獲得快感不停滑動，往往只是被動的接收訊息，因此才會帶給旁人不同的感受吧！」現在，我出門也會在背包裡放一本書，一有空檔就拿出來讀，我猜，現在我也成了別人眼中最美的畫面啦！
  start_text: 從此，我的「觀察遊戲」就成了「尋找讀書人」。不限
