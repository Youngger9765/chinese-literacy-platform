lesson_uid: L0014
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列語詞，何者使用錯誤?
    options:
      A: 陳老師風趣幽默，上起課來「趣味橫生」
      B: 下班時間是交通尖峰期，車輛幾乎「不為所動」
      C: 感冒鼻塞讓他吃東西時覺得食物「索然無味」
      D: 王教練訓練球員方式「與眾不同」，極少大聲叫罵
    teacher_note: 車子應為停滯不動，不為所動通常指的是人的情緒不被外在影響。
  - index: 2
    answer: B
    stem: 媽媽為什麼要作者在人多、沒有位置的時候用眼睛觀察車廂上的人呢？
    options:
      A: 可以學到觀察的方法
      B: 可以打發無聊的搭車時間
      C: 可以讓自己與眾不同
      D: 可以學會禮貌，避免讓人不自在
  - index: 3
    answer: D
    stem: 文中描述讀書的大姊姊「像整個車廂裡唯一的主角」，這句話除了強調她的與眾不同，還可能隱含什麼訊息？
    options:
      A: 人們在滑手機的同時，其實更渴望單純的閱讀
      B: 生活中不是缺乏美，而是缺乏仔細觀察的眼睛
      C: 讀書的行為正逐漸取代滑手機，成為新的潮流
      D: 閱讀展現出的專注神情，令人移不開目光
    teacher_note: （在眾多滑手機的人中，讀書的大姊姊顯得特別，那專注的神情，令人著迷，也移不開目光。）
    placement_note: document.xml 把這個文字方塊排在第 2 題之後、第 3 題之前，但 PDF p8 印在第 3 題選項右側，內容也是解釋第
      3 題答案 D。歸給第 3 題。
  - index: 4
    answer: C
    stem: 第四段，從媽媽對「閱讀」與「滑手機」的分析中，可以推論出作者希望向讀者傳達什麼觀點？
    options:
      A: 閱讀可以改變他人對自己的看法
      B: 學會尊重他人，才能更融入現代社會
      C: 閱讀比滑手機更能讓人慢下來、主動思考
      D: 只有透過不斷觀察他人，才能發現自我優點
  - index: 5
    answer: A
    stem: 請問下文＜種子的力氣＞的主旨是什麼呢？
    passage: 你見過被壓在石塊下的小草嗎？它為了成長，為了接近陽光，不管上面的石塊如何重，縫隙如何窄，它還是會從彎彎曲曲的縫隙中，跑到地面上來。它的根往土裡扎，芽往地面挺，這是一種不可思議的力量。
    passage_source: （本文出自國立編譯館）
    options:
      A: 說明種子強韌的生命力
      B: 舉證種子的力大無窮
      C: 說明種子發育的過程
      D: 瓦礫與石塊才能造就小草
