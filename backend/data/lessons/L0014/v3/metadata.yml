intro: 這篇文章記錄了作者在搭乘火車時，媽媽引導他進行一項「觀察遊戲」的經驗。透過觀察車廂裡的乘客，作者發現了許多有趣的現象，特別是有些人專注閱讀的模樣，與周圍滑手機的人們形成鮮明對比。這個觀察遊戲後來擴展到生活中其他場合，讓作者開始尋找「讀書人」的身影。文章也探討了閱讀和滑手機帶給人的不同感受，以及專注閱讀時所展現的美。
strategy_explained: '我們要練習的是，從文章裡面找出作者最想告訴我們的大道理，也就是「抓到文章的重點」

  這篇文章裡，作者透過火車上的觀察，發現專心看書的人和滑手機的人很不一樣，讓我們一起想想，作者為什麼要特別講這件事，他想要傳達什麼感受

  讀的時候，可以想想看，作者在描述乘客時，心裡在想什麼，他覺得哪種樣子最「美」，那就是文章想講的重點喔'
