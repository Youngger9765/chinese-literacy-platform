intro: 這篇文章記錄了作者在搭乘火車時，媽媽引導他進行一項「觀察遊戲」的經驗。透過觀察車廂裡的乘客，作者發現了許多有趣的現象，特別是有些人專注閱讀的模樣，與周圍滑手機的人們形成鮮明對比。這個觀察遊戲後來擴展到生活中其他場合，讓作者開始尋找「讀書人」的身影。文章也探討了閱讀和滑手機帶給人的不同感受，以及專注閱讀時所展現的美。
