section_no: 五
keypoints:
  title: 最美的畫面
  layout: list
  rows:
  - label: 觀察遊戲
    items:
    - label: 起因
      value: 作者和媽媽搭區間車時，媽媽提議作者可以【　】車廂上的人。
      blanks:
      - answer: 觀察
    - label: 經過 1
      value: 1. 作者發現車廂上最常見的畫面是
      options:
        1: 閱讀
        2: 講電話
        3: 滑手機
      answer: 3
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - label: 經過 2
      value: 2.有位與眾不同的大姊姊，她在車廂內【　】書本。
      blanks:
      - answer: 閱讀
    - label: 經過 3
      value: 3.觀察遊戲變成了在各種場所裡，尋找【　】。
      blanks:
      - answer: 讀書人
    - label: 結果
      value: 發現讀書的畫面給人【　】的感覺。
      instruction: (請打勾，複選)
      options:
        1: 正向
        2: 用功
        3: 愉悅
      answers:
      - 1
      - 3
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 影響
    value: 作者出門都會隨身帶【　】，一有空檔就拿出來閱讀。
    blanks:
    - answer: 一本書/書
    blank_note: 原稿手寫「一本書/書」，兩種寫法都算對
