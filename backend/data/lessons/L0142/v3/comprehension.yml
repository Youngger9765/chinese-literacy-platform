lesson_uid: L0142
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    stem: 下列語詞何者使用錯誤？
    options:
      A: 失去兒子的婦人跪在地上「呼天搶地」，令人心酸不已
      B: 在疫情期間，醫護人員與民眾「同舟共濟」，齊心對抗病毒
      C: 段考過後，同學都無心上課，一片寂靜，真是「百廢待舉」
      D: 火警發生時，班長「處變不驚」，冷靜指揮同學依序疏散
    answer: C
    explanation: 第1題解析：選項C「百廢待舉」用來形容「國家或社會經歷戰亂、動盪後重建」的情況，不適合用在「課堂氣氛冷清」這種小範圍情境。
  - index: 2
    stem: 文中提到：「轟炸點燃了英國人心中的火焰。」這句話的「火焰」指的是什麼？
    options:
      A: 人心被點燃的勇氣與決心
      B: 建築燃起的真實大火
      C: 對敵產生的仇恨衝動
      D: 面對戰爭的興奮期待
    answer: A
    explanation: 第2題解析：這是比喻，重點在精神狀態：勇氣、堅韌、團結被激發，而非字面火焰。
  - index: 3
    stem: 那位婦人說：「炸得還可以，沒打破我的茶壺。」從這句話中，可以推論出這位婦人當時的心情或態度是什麼？
    options:
      A: 她對轟炸非常憤怒，想諷刺德國，表達不滿
      B: 她有心理韌性，用幽默的口吻面對災難的發生
      C: 她比較不在乎房子被炸，只在意茶壺是否完好
      D: 她想要安慰別人，假裝沒事，但其實很害怕
    answer: B
    explanation: 第3題解析：婦人面對街道成為廢墟，卻用幽默的口氣說「沒打破我的茶壺」，表現出面對災難仍保持鎮定與樂觀的心理韌性。
  - index: 4
    stem: 本文的主旨是什麼？
    options:
      A: 災難讓人類看見戰爭的殘酷與敵國的無情
      B: 恐懼是一種人性本能，並不是人所能控制的
      C: 心理韌性、勇氣與團結讓人們在危難中浴火重生
      D: 因政府有萬全準備，英國人挺過了倫敦大轟炸
    answer: C
    explanation: 第4題解析：全文由恐懼轉為勇氣、由毀滅轉為重生，核心在於人類的心理靭性。
    explanation_note: 解析用的是「心理靭性」（靭），課文與其他各處都寫「心理韌性」（韌）；原稿如此，不擅自統一
  - index: 5
    stem: 作者在文中引用「死亡與傷殘人數」以及「心理學家的調查結果」，這樣的寫法主要有什麼作用？
    options:
      A: 讓讀者更有現場感，感受當時倫敦的慘況
      B: 用來增加文章的情緒張力，讓內容更戲劇化
      C: 透過數據製造震撼效果，吸引讀者注意力
      D: 結合事證與研究，強化文章的可信度與說服力
    answer: D
    explanation: 第5題解析：作者在描寫戰爭慘況後引用具體數據與心理學研究，屬於「以事證支撐觀點」的寫作策略。
  notes:
    answer_carrier: 橘色手寫代號（在文字層），PDF p12 可見
