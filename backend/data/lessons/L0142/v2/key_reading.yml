passage: '戰後，心理學家調查發現，大轟炸後，幸運存活者非但沒有嚇壞，反而產生了強烈的自信與平靜，這現象被稱為「倖存者的鎮定」。心理學家把群眾分為三類，第一類是非死即傷的「直接受害者」；第二類是目睹傷亡破壞的「間接受害者」；第三類是住得遠、但每天聽得到警報的「未受波及者」。出乎意料的是，最恐懼的不是前兩類，而是第三類人，他們遠離災區，只能靠想像理解戰爭，他們的恐懼反而沒有出口；而身在重災區的人，因為能「親身體驗」，能「參與救災」，因此獲得掌控感，可以幫自己把紛亂的心緒重新找回秩序與平衡。

  原來，人類的恐懼，常常不只來自對危險本身的反應，也來自對未知的想像；原來，當人們真正面對恐懼，並開始採取行動，恐懼就沒那麼可怕；原來，當危險變成日常，人們反而會見怪不怪，處變不驚。'
