  - label: 倫敦大轟炸(段1~3)
    value: 1.1940年秋天，倫敦遭遇__轟炸機空襲，持續了許多個月。2.轟炸後倫敦__、焦土遍野，滿是殘垣敗瓦。3.死亡人數 □①眾多  □②稀少，可見轟炸造成嚴重傷亡。
    blanks:
    - answer: 德國
      hint: ''
    - answer: 滿目瘡痍
      hint: ''
  - label: 倫敦市民的反應(段4~9)
    value: 1.轟炸期間，許多民眾盡自己所能幫助受難的人員。2.警報解除後，大家儘速清理修復，讓城市恢復運轉。3.民眾以幽默的態度面對這場災難，英國人用__來形容這種面不改色的心理韌性。
    blanks:
    - answer: 克制的上唇
      hint: ''
  - label: 心理學家的發現(段10)
    value: 1.大轟炸後，幸運存活者非但沒有嚇壞，反而產生了強烈的自信與平靜，這現象被稱為__。2.心理學家將大轟炸後的倫敦人民分成三類，分析大轟炸對他們的影響。(1)哪幾類人較容易產生強烈的自信與平靜？(請打勾，複選)□①直接受害者   □②間接受害者   □③未受波及者(2)哪一類人最為恐懼？(請打勾，單選)□①直接受害者   □②間接受害者   □③未受波及者(3)重災區的人們能「親身體驗」，能「參與救災」，因此獲得__，就能讓自己找回秩序與平衡。
    blanks:
    - answer: 倖存者的鎮定
      hint: ''
    - answer: 掌控感
      hint: ''
  - label: 作者結論(段11~13)
    value: 1.人類的恐懼，常不只來自危險本身，也來自對__的想像。2.當人們真正__恐懼，恐懼就沒那麼可怕。3.當危險變成日常，人們反而會見怪不怪，__。4.大轟炸讓人看見了一種名為__的力量。
    blanks:
    - answer: 未知
      hint: ''
    - answer: 面對
      hint: ''
    - answer: 處變不驚
      hint: ''
    - answer: 心理韌性
      hint: ''
  title: 焚而不毀的倫敦
