spotlight:
  lesson: G9-L21
  strategy_name: 品格力-正向思考-培養心理韌性
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 生活有時候會讓人喘不過氣：壞事突然發生、努力了卻沒結果……但課文中的倫敦人告訴我們一件事：心理韌性不是不會害怕，而是雖然害怕，也能不被打敗，積極面對。    在課文中，倫敦的人民遇到了大轟炸這麼恐怖的事情，但仍然能夠挺過這場風暴，故事裡有三個值得學習之處：　　一、適應：面對變故有彈性→「我現在能調整什麼？」　　二、支持：社會支持帶來心理力量→「我可以求助，也可以助人。」　　三、樂觀：遇到挫折保持樂觀的詮釋→「我能不能換個角度想？」　　強大的心理韌性並非與生俱來，而是可以學習的，現在我們就來練習看看吧！
  - type: guide
    text: 一、適應：面對變故保持彈性（適應力）：
  - type: guide
    text: 遇到變故，可能會焦慮恐懼，哪一個想法最符合『面對變動時保持彈性』的能力？
  - type: table
    rows:
    - - ''
      - 情境
      - 『面對變動時保持彈性』的想法（單選）
    - - '1.'
      - 開學時，老師公布座位表，鄰座是不熟悉的同學。
      - □①覺得很煩躁，整天不想說話□②看看能不能和鄰座同學有合作機會□③開始抱怨老師不尊重學生
    - - '2.'
      - 小組報告時，負責簡報的人突然生病，臨時要換人上台報告。
      - □①怪她害到我們全組，心裡超不爽□②不關我的事，直接把責任撇掉□③先討論自己能做的，再想怎麼分工
    - - '3.'
      - 最喜歡的老師下學期不再教我們班。
      - □①雖然失望，但願意試試新老師□②覺得我們班沒救了，下學期完蛋了□③決定放棄這科，隨便學就好
  - type: guide
    text: 當事情突然改變時，願意換個想法，就是在練習讓自己更能適應生活中的意外。
  - type: guide
    text: 二、支持：社會支持帶來的心理力量：
  - type: guide
    text: 「社會支持」很重要，當你知道「我不孤單」、「大家可以一起努力」時，就比較不容易被打敗。遇到困難時，向別人求助不是一件壞事，更棒的是能主動去幫助別人，反而會讓你更有力量向前邁進。
  - type: guide
    text: 遇到困難時，哪個做法最符合「尋求或提供社會支持」？
  - type: table
    rows:
    - - ''
      - ''
      - 情境
      - 可行的做法
    - - '1.'
      - 尋求協助
      - 小組報告快截止，但我卡在資料整理。
      - □①跟朋友請教方法，或請他教我□②不讓任何人知道自己的壞情緒□③悶著頭硬做，之後再看哪裡錯
    - - '2.'
      - 尋求協助
      - 比賽前我很緊張，怕上場會失誤。
      - □①船到橋頭自然直，先上場再說□②提醒自己可以勇敢克服心魔□③我會問教練，請他給我建議
    - - '3.'
      - 主動助人
      - 地震停電時，天色很暗，有人找不到路。
      - □①開玩笑地說他們膽小，緩解氣氛□②開手機手電筒，再帶他們一起走□③我會先顧好自己，等天亮了再說
    - - '4.'
      - 主動助人
      - 社團排練時，有人一直跟不上動作。
      - □①叫他先看影片，回家自己補練□②那是他的問題，他自己要克服□③我會放慢示範一次，陪他練習
  - type: guide
    text: 三、樂觀：遇到壞事能保持樂觀的詮釋（復原力）：
  - type: passage
    source: unknown
    paragraphs:
    - 樂觀詮釋不是否認事情很糟，而是在承認困難之後，找到一個讓自己能繼續前進的說法。下面的情境，都和課文中「沒打破我的茶壺」一樣，事情真的很糟，但有人選擇用一句話，讓自己不被擊倒。請選出最像課文中那種幽默詮釋的一句話。
  - type: free_text
    prompt: ❶颱風後，一戶人家的屋頂被掀開一個洞。鄰居關心的問：「你還好嗎？」
  - type: passage
    source: unknown
    paragraphs:
    - □①我真的很慘，家全被毀了。
    - □②至少家裡採光變好了。
    - □③都是颱風害的，氣死人了。
  - type: free_text
    prompt: ❷林肯當總統時，有人當眾嘲笑他長得很醜。
  - type: passage
    source: unknown
    paragraphs:
    - 如果你是他，哪一句回應最像用幽默化解困境？
  - type: multi
    prompt: 請選擇
    options:
    - 我今天真倒楣，看什麼都壞掉了。
    - 如果你一直笑我，你覺得我會開心嗎？
    - 如果我有另一張臉，你覺得我會戴這張嗎？
    answer:
    - 我今天真倒楣，看什麼都壞掉了。
    - 如果你一直笑我，你覺得我會開心嗎？
    - 如果我有另一張臉，你覺得我會戴這張嗎？
  - type: free_text
    prompt: ❸你的手機掉進馬桶。撈起來時，螢幕一黑，完全沒反應，又沒錢換。
  - type: guide
    text: （請寫句子作答）
  - type: guide
    text: 我的手機去泡湯了，一泡就睡著了/這次要戒手機，一定會成功了。
  - type: guide
    text: ※如果你三項都打勾，恭喜你！你已經學會用這些方法培養自己的心理韌性，你的心將會像倫敦人一樣：焚而不毀、越挫越強。
  - type: guide
    text: 第1題解析：選項C「百廢待舉」用來形容「國家或社會經歷戰亂、動盪後重建」的情況，不適合用在「課堂氣氛冷清」這種小範圍情境。第1題解析：選項C「百廢待舉」用來形容「國家或社會經歷戰亂、動盪後重建」的情況，不適合用在「課堂氣氛冷清」這種小範圍情境。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 面對變故時，我能彈性思考，適應不熟悉的狀況。
    - 我知道自己不是一個人，可以適時尋求支持。
    - 我能把悲觀的想法，改成樂觀的詮釋，讓自己能重新站起來。
