  questions:
  - index: 1
    text: 在疫情的艱難時期，全國人民（　），互相支援，共同守護家園的安全。
    answer: H
  - index: 2
    text: 明天就要公佈會考成績，他整晚（　），腦中不斷浮現各種可能的結果。
    answer: J
  - index: 3
    text: 古城經過數百年風雨侵蝕，只剩（　），旅人只能從碎裂的牆面想像昔日風華。
    answer: A
  - index: 4
    text: 即使在眾人質疑的壓力下，他仍（　）回答每一個問題，展現自信的神情。
    answer: E
  - index: 5
    text: 野外教學時突然下起大雨，隊伍一陣混亂，領隊卻（　），迅速指揮大家躲到安全的地方。
    answer: D
  - index: 6
    text: 得知親人驟然離世，他悲痛得（　），旁人都忍不住跟著掉淚。
    answer: F
  - index: 7
    text: 長期砍伐讓整片山林（　），禿山與泥流成為大自然被破壞的證據。
    answer: G
  - index: 8
    text: 大地震過後，城市基礎設施幾乎全面損毀，政府必須在（　）的局面中，逐步恢復交通、水電與民生機能。
    answer: B
