comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用錯誤？
    options:
      A: 人心被點燃的勇氣與決心
      B: 建築燃起的真實大火
      C: 對敵產生的仇恨衝動
      D: 面對戰爭的興奮期待
    rationale: 第3題解析：婦人面對街道成為廢墟，卻用幽默的口氣說「沒打破我的茶壺」，表現出面對災難仍保持鎮定與樂觀的心理韌性。
  - index: 3
    answer: B
    stem: 那位婦人說：「炸得還可以，沒打破我的茶壺。」從這句話中，可以推論出這位婦人當時的心情或態度是什麼？
    options:
      A: 讓讀者更有現場感，感受當時倫敦的慘況
      B: 用來增加文章的情緒張力，讓內容更戲劇化
      C: 透過數據製造震撼效果，吸引讀者注意力
      D: 結合事證與研究，強化文章的可信度與說服力
    rationale: 第4題解析：全文由恐懼轉為勇氣、由毀滅轉為重生，核心在於人類的心理靭性。
