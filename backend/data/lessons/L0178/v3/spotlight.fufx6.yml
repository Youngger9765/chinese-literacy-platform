lesson_uid: L0178
version_id: v3
section_no: 六
spotlight:
  strategy_name: 找回內在動力
  blocks:
  - type: concept_box
    text: 有時候，我們明明很想把一件事做好，做著做著卻愈來愈沒力，開始懷疑自己，覺得努力了很久，卻看不見進步。沒動力，不一定只有一個原因。遇到這種時候，可以先從幾個方向找一找，再想想現在最適合自己的是哪個方法。
  - type: guide
    text: ◎重拾動力的開關：當事情越做越感到無力時，你可能會出現下表左欄的念頭，讓你的動力流失；而中欄列出A, B, C, D四個重拾動力的開關，也許可以重新幫助我們找回流失的動力。
  - type: table
    headers:
    - 讓你動力流失的念頭
    - 重拾動力的開關
    - 作法舉例
    rows:
    - - 一直重複，好無聊，我都提不起勁
      - A.換個方式，找回興趣
      - 改變練習方式、小挑戰，或找同伴一起
    - - 為什麼要做這個？做這個有用嗎？
      - B.找到理由，看見意義
      - 思考和目標的關係，或詢問前輩、老師
    - - 太難了，我大概做不到
      - C.縮小目標，找回信心
      - 把大目標拆成做得到的小目標
    - - 練這麼久，好像都沒有進步
      - D.留下紀錄，看見變化
      - 記錄時間、次數或成功率
  - type: exercise
    instruction: '小練習：

      把下面的作法，和最接近的動力開關配在一起（請填入A, B, C, D）。'
    option_bank:
      A: 換個方式，找回興趣
      B: 找到理由，看見意義
      C: 縮小目標，找回信心
      D: 留下紀錄，看見變化
    items:
    - index: 1
      stem: 把「一次跑完三千公尺」，先改成「不停下來跑完一千公尺」。
      answer: C
    - index: 2
      stem: 把這個月和上個月的長跑時間記下來，看看是否有進步。
      answer: D
    - index: 3
      stem: 問教練：「為什麼捕手要做腿部訓練？它在比賽中有什麼用？」
      answer: B
    - index: 4
      stem: 把每天重複五十次的基本動作，改成和隊友進行三關挑戰。
      answer: A
  - type: guide
    text: '◎情境演練：

      情境一：

      小琳剛開始學一首新歌，想要一開始就把整首歌完整彈好。幾個難的段落一直彈錯時，她就想：「整首都彈不好，我大概做不到。」'
  - type: single
    prompt: 1.她的念頭可能比較接近哪一個？
    options:
    - 「我都提不起勁」
    - 「為什麼要做這個？」
    - 「太難了，我大概做不到」
    - 「好像都沒有進步」
    answer: 3
  - type: single
    prompt: 2.根據她的念頭，哪個方法最值得她先試？
    options:
    - 可以換首更喜歡的歌曲，讓練習增加變化
    - 可以想想自己當初為什麼想學吉他
    - 可以把整首歌拆成小段，一次練熟一段
    - 可以記錄每週能完整彈好的段落，和以前比較
    answer: 3
  - type: guide
    text: '情境二：

      小傑最近準備英文單字比賽。他每天都照著同一張單字表，從第一個背到最後一個。幾個星期後，他開始覺得：「每天都一樣，我看到這張單字表就不想開始。」'
  - type: single
    prompt: 3.他的念頭可能比較接近哪一個？
    options:
    - 「我都提不起勁」
    - 「為什麼要做這個？」
    - 「太難了，我大概做不到」
    - 「好像都沒有進步」
    answer: 1
  - type: single
    prompt: 4.他哪個方法最值得他先試？
    options:
    - 可以把背單字改成配對、搶答或自己出題的小挑戰
    - 可以想想參加單字比賽對自己有什麼幫助
    - 可以把每天要背的單字量減少，先完成比較小的目標
    - 可以記錄每週記住多少單字，和以前的自己比較
    answer: 1
  - type: guide
    text: '→真實生活不像選擇題，一個人沒動力時，可能同時遇到好幾個問題。看不見進步時，「堅持」不一定只是一直做原來的事情。

      我們還可以：換個方式、找到理由、縮小一步、看見進步。

      不過有些事情，不是換一種方法就會立刻消失。

      受傷後，復健還是需要時間；選拔落選，結果已經發生；努力了很久，也不一定能得到原本期待的結果。'
  - type: free_text
    prompt: '◎換我試試看：

      想一件最近「我想做好，但最近有點沒動力」的事，回答以下問題：(沒有標準答案)'
    note: 三題都是主觀自評／複選，沒有客觀正解，依 skill 不給 answer。
  - type: self_check
    instruction: 1.最近的我，可能有下面哪些情況？(可複選)
    items:
    - ①做法一直重複，我漸漸失去興趣
    - ②我不太清楚，做這件事對我有什麼意義
    - ③失敗幾次後，我開始懷疑自己做不到
    - ④我只看到還沒做好的地方，常常看不見自己的改變
    - ⑤我現在其實太累、受傷或壓力太大，需要先休息或找人幫忙
    - ⑥其他：＿＿＿＿＿＿＿＿
  - type: self_check
    instruction: 2.我想先試哪個方法？（可複選）
    items:
    - ①換個方式：讓原來的事情增加一些變化
    - ②找到理由：重新想想，我為什麼想做這件事
    - ③縮小一步：先訂一個現在比較有機會完成的小目標
    - ④看見改變：留下紀錄，和以前的自己比較
    - ⑤先休息或找人幫忙：如果真的太累、受傷或壓力太大，先照顧自己，再決定下一步。
  - type: self_check
    instruction: 3.如果這段辛苦暫時不能消失，我希望走過以後，自己能藉此機會多學會什麼？
    items:
    - ①更了解自己的能力
    - ②學會調整方法
    - ③更能面對失敗
    - ④更懂得照顧自己
    - ⑤多一些自律、合作或面對挫折的韌性
