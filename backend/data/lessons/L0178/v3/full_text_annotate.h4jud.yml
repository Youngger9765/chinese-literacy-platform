full_text_annotate:
  lesson_heading: 第14課  在看不見成長的日子中
  paragraph_count: 9
  paragraphs:
  - idx: 1
    text: 天剛濛濛亮，你已經到了球場；放學後，別人回家了，你還留在場上，一遍又一遍練著相同的動作。汗水流進眼睛，手掌磨出水泡，雙腿痠得發抖。可是，教練念出先發名單時，還是沒有你的名字。你忍不住想：是不是我沒有天分？練了這麼久，到底有沒有用？
  - idx: 2
    text: 職棒投手林詩翔，也走過一段漫長、努力許久卻遲遲不見成果的日子。從國小到高中，他很少擔任先發。他總是早到、晚走，練得比許多人都勤奮，甚至睡覺時，他也會把棒球握在右手裡，維持指叉球的握法。然而，他的身材不突出，球速也不快，在隊上仍多半待在二軍，鮮少獲得先發機會。
  - idx: 3
    text: 有一次比賽，他接連被對手擊出安打。球不斷往外野飛，跑者一個個上壘，他站在投手丘上，第一次那麼清楚地看見自己和別人的差距。教練沒有責罵他，只說：「沒關係，這就是你現在和別人的差距。」這句話雖然直接，卻讓他第一次清楚知道，自己還有許多需要進步之處，也燃起了他的鬥志。
  - idx: 4
    text: 他積極請教前輩，重新調整投球動作，也讓身體重新適應新的方式。每天還是投球、修正，再投一次。當然，球速沒有立刻變快，也沒有人因此替他鼓掌。直到幾年後，他才逐漸在球場上看見努力與調整累積的成效──進入職棒，並成為球隊重要的後援投手。
  - idx: 5
    text: 林詩翔面對的是努力很久仍等不到成果；林智勝面對的，則是曾經站上高峰，受傷後又必須重新開始。他早已是知名球員，曾在滿場歡呼中打出好成績。可是，一年又一年，他追著全壘打和打擊成績，漸漸感到疲憊，甚至想過退休。後來，一場車禍造成他的頭部受傷，左膝韌帶斷裂。原本可以用力揮棒、快速跑壘的身體，變得連基本動作都必須重新練習。
  - idx: 6
    text: 八個多月的復健裡，他一次次彎曲、伸直膝蓋，從原本做不到的動作，一點一點練回來。好不容易重返球場，卻發現身體已經不像以前那麼聽話。他忍不住拿現在的自己和過去相比，也開始懷疑：我是不是已經不行了？
  - idx: 7
    text: 後來，他慢慢明白，比別人不看好自己，更可怕的是自己先失去信心。他開始正視自己的不足，不再只盯著成績，而是從每一場比賽中找出自己還能改進的地方。棒球不再只剩下一串數字，也重新成為一件他願意繼續做下去的事。
  - idx: 8
    text: 這條路上，或許有些人繼續練，後來等到了上場的機會；有些人改變位置，找到更適合自己的方向；也有人最後沒有成為職業選手，卻把訓練中學會的自律、合作，以及面對挫折的韌性，帶到球場外的學習、工作與生活。堅持並不只有一種樣子。它不只是沿著同一條路一味苦撐；有時是調整方法、改變位置，也有時是在評估後重新選擇更適合自己的方向，繼續往前。
  - idx: 9
    text: 看不見成長的日子，不一定都是白費。有時候，能力正在逐步累積；有時候，方法確實需要改變；也有時候，方向可以重新選擇。下一場比賽會不會更好，沒有人能保證。但你仍可以想一想：現在的自己，下一步可以怎麼走？
