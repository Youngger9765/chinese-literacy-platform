intro: 這篇文章寫的是努力很久卻遲遲看不見成果的那段日子。職棒投手林詩翔身材不突出、球速不快，長期待在二軍，直到一次比賽的挫折讓他清楚看見差距，才積極請教前輩、重新調整投球動作，幾年後才看見成效；林智勝則是曾站上生涯高峰，車禍受傷後從復健一點一點練回來，最後明白比別人不看好自己更可怕的，是自己先失去信心。文章歸納出「堅持不只有一種樣子」，並提供換個方式、找到理由、縮小目標、留下紀錄四個重拾動力的開關。
notes:
  總表_對照: 總表「2.體育生的品格教材」列 體-14：適用年級 5、文體 議論文，教材目標策略與第六大題標題皆為「品格力──找回內在動力」。⚠️ 這四課（體-12~15）是 2026-08-17 之後才加進來源 Drive 的，抽取管線先前沒跟上（#3011）。
