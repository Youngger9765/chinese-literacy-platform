  items:
  - index: 1
    stem: 一整天的校外教學結束後，同學們雖然（　），心情卻很愉快。
    answer: E
  - index: 2
    stem: 這個山區冬天天氣寒冷，十分荒涼，（　）有遊客前來。
    answer: A
  - index: 3
    stem: 身體已經受傷，就不能（　）忍痛練習，應該先接受檢查。
    answer: G
  - index: 4
    stem: 這位歌手正值事業（　）時，檢查出罹患了癌症，令人震驚。
    answer: C
  - index: 5
    stem: 小恩在繪畫方面表現（　），作品多次代表學校參賽。
    answer: I
  - index: 6
    stem: 老師先教基本操作，再一個個增加新功能，讓大家（　）學會使用新的軟體。
    answer: F
  - index: 7
    stem: 她轉學後花了一段時間適應新環境，也在過程中培養出面對改變的（　）。
    answer: H
  - index: 8
    stem: 她每天固定複習英文單字，幾個月後終於看見努力的（　）。
    answer: B
