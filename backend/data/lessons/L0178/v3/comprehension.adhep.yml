lesson_uid: L0178
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項中「  」的語詞，何者使用正確？
    options:
      A: 在走廊上要盡量避免「逐步」聊天，這樣會占用到行走空間
      B: 他經常做了「韌性」的決定，然後要別人一起幫他承擔後果
      C: 經過三個月的作息調整，他精神變得很好，已經能看見「成效」
      D: 今天的午後雷陣雨非常「突出」，讓在路上的行人措手不及
    teacher_note: 第1題解析：(A)可用「並排」；(B)宜用「任性」；(D)宜用「突然」
  - index: 2
    answer: B
    stem: 根據第四段，林詩翔調整動作後，「球速沒有立刻變快，也沒有人因此替他鼓掌」，作者最可能想凸顯什麼？
    options:
      A: 真正重要的練習通常不會受到其他人的注意
      B: 有些調整需要時間累積，努力不一定馬上看見成果
      C: 練習時太在意別人的肯定，容易讓人忽略自己的進步
      D: 改變原有動作可能暫時退步，因此需要忍受別人質疑
    teacher_note: 從後文可以知道後來林詩翔訓練的成效有出現，可知需要時間
  - index: 3
    answer: A
    stem: 根據本文，林智勝受傷前後，看待棒球的態度有什麼不同轉變？
    options:
      A: 從只盯著成績，轉為看見改進方向和打棒球的意義
      B: 從重視個人成績，轉為只會在意球隊能不能取得勝利
      C: 從希望成為知名球員，轉為不再那麼在意自己的表現
      D: 從堅定相信努力會有成果，轉為接受自己身體的限制
    teacher_note: 文章提到棒球不再是一串數字，而是想要做的事情，找出可以更好的地方
  - index: 4
    answer: D
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 長期勤奮練習，即使起步較慢，最後仍可能等到成功的機會
      B: 面對挫折時，要相信自己的能力，不因一時失敗而輕易放棄
      C: 不見成果時，不必急著放棄，持續累積能力終究能看見進步
      D: 面對困境時，不只持續努力，也要調整方法或重新選擇方向
  - index: 5
    answer: C
    stem: 小傑練三分球已經一段時間，目前十球大約只能進三球。他卻一直要求自己「一定要十球進八球」，每次練完都覺得：「差這麼多，我大概永遠做不到。」
    options:
      A: 換個方式，找回興趣：和朋友進行三分球闖關比賽
      B: 找到理由，看見意義：想想自己為什麼想練好三分球
      C: 縮小一步，找回信心：先以穩定十球進四球或五球為目標
      D: 留下紀錄，看見進步：每天記錄自己投進幾球
    teacher_note: 在失去信心覺得自己做不到時，可以先縮小目標
  slug: adhep
