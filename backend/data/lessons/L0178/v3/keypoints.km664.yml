      answer: 1
      tail: ），追求進步。
  - 結構: 舉例說明
    段落: 5-7
    子題: 林智勝
    內容:
    - 1.曾經站上生涯的【　】，卻因為【　】而受重傷，基本動作都得重新練習。
    - 2.好不容易重返球場，卻發現身體（）
    - 3.他明白最可怕的是對自己【　】，他重新找到能改進的地方，並繼續做下去。
