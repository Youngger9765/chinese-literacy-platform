spotlight:
  lesson: G6-L4
  strategy_name: 用表格整理訊息-比較異同
  strategy_type: comparison
  blocks:
  - type: guide
    text: ◎小試身手：實驗一
  - type: free_text
    prompt: 1.用表格整理訊息：
  - type: guide
    text: 這張表要比較中國大學生和美國大學生的兩項資料。請回到課文找答案，在（ ）裡填寫答案。
  - type: guide
    text: 實驗一：老中和老美「數字記憶廣度」與「數字發音長度」的比較
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.從表格歸納訊息：實驗一告訴我們什麼訊息(單選)
  - type: free_text
    prompt: (1)中國大學生的數字記憶得分比美國大學生（ ①高  □②低  ）。
  - type: single
    prompt: (2)漢語的數字發音長度比英語（ □①長  ②短  ）。
    options:
    - 長
    - 短
    answer: 短
  - type: free_text
    prompt: (3)大學生數字記憶廣度可能和什麼有關？   數字發音長度
  - type: guide
    text: ◎小試身手：實驗二
  - type: free_text
    prompt: 1.用表格整理訊息：
  - type: guide
    text: 實驗二也比較相同的兩項資料，只是受試者換成年紀較小的幼童。請回到課文找答案，在（ ）裡填寫答案。
  - type: guide
    text: 實驗二：小老中和小老美「數字記憶廣度」與「數字發音長度」的比較
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.從表格歸納訊息：實驗二告訴我們什麼訊息(單選)
  - type: free_text
    prompt: (1)中國幼童的數字記憶得分比美國幼童（ ①高   □②低  ）。
  - type: single
    prompt: (2)漢語幼童的數字發音長度比英語幼童（ □①長　 ②短  ）。
    options:
    - 長
    - 短
    answer: 短
  - type: single
    prompt: (3)把表格中的兩項資料合起來看：幼兒「數字記憶廣度」和「數字發音長度」有什麼關係？
    options:
    - 數字發音越短，數字記憶廣度越高
    - 數字發音越短，數字記憶廣度越低
    answer: 數字發音越短，數字記憶廣度越高
  - type: guide
    text: ◎小試身手：比較實驗一與二
  - type: free_text
    prompt: 1.用表格整理訊息：
  - type: guide
    text: 接下來，把兩個實驗放在一起比較，請根據前面兩張表，在（ ）裡填寫答案及完成勾選。
  - type: guide
    text: 表：「實驗一」與「實驗二」的比較
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.從表格歸納訊息：上表告訴我們什麼訊息(單選)
  - type: single
    prompt: (1)這兩個實驗的受試者年齡相同嗎？ □①相同　②不同
    options:
    - 相同
    - 不同
    answer: 不同
  - type: single
    prompt: (2)實驗二改用年紀較小的幼童，主要是想減少哪一項因素對實驗結果的影響？（單選）
    options:
    - 幼童記憶數字的能力
    - 長期補習或數字訓練的影響
    answer: 長期補習或數字訓練的影響
  - type: single
    prompt: (3)兩個實驗都出現哪一種結果？(單選)
    options:
    - 漢語組的數字發音較長，數字記憶廣度較低
    - 漢語組的數字發音較短，數字記憶廣度較高
    - 英語組的數字發音較短，數字記憶廣度較高
    answer: 漢語組的數字發音較短，數字記憶廣度較高
  - type: single
    prompt: (4)這兩個實驗都支持了數字記憶廣度和哪一項因素有關？
    options:
    - 數字發音長度
    - 受試者的年齡
    - 補習訓練的時間
    answer: 數字發音長度
