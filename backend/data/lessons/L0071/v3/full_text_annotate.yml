  printed_title: 第4課　數字記憶的奧秘
  byline_課文: 曾世杰
  byline_學習單: 陳虹君
  level_label: Level 6・說明文
  target_strategy_label: 目標策略：用表格整理訊息──比較異同
  paragraph_count: 7
  paragraphs:
  - idx: 1
    text: '在一個安靜的房間裡有一張桌子，桌子兩端各有一人，面對面坐著。其中一人要實施測驗，以下稱他為「施測者」；另一人接受測驗，以下稱他為「受試者」。

      施測者說：「接下來，我要每一秒鐘唸一個數字，請你注意聽，等我唸完了，請你依照順序照樣唸一遍。」接著，他唸出：「5-9-1-7。」

      受試者說：「5-9-1-7」。

      施測者說：「我再加一個數字：2-7-5-8-6」。

      受試者說：「2-7-5-8-6」。'
    layout_note: 四句對話在原稿是加粗、縮排的獨立行，但共用段號「一」。
  - idx: 2
    text: 這個好玩的測驗，叫做「數字記憶廣度測驗」，題目通常從3個數字開始，數字會愈來愈多。如果受試者成功通過9個數字，但在10個數字（例如，3-2-0-3-0-7-4-9-2-6）時，回憶不出來了。他的記憶廣度得分就是9，表示他可依照順序正確回憶出9個數字。
  - idx: 3
    section_heading: 實驗一
    section_heading_note: 「實驗一」是不佔段號的分節小標，印在本段之前。
    text: 1987年，科學家找了兩組大學生做這個測驗，第一組大學生是說漢語的中國人（以下稱呼他們「老中」），第二組大學生是說英語的美國人（以下稱「老美」），結果指出，老中的平均得分是9，老美的平均卻只有7，老中很明顯的超過老美。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 4
    text: 為什麼老中比較厲害呢？這個研究還測量了老中和老美的「數字發音長度」，兩組大學生用自己的母語以最快的速度從1數到10，他們數數的聲音被錄下來，科學家分析後發現，漢語的數字發音長度，比英語短了很多。科學家推論，漢語的數字發音比較短，所以大腦比較容易記憶，英語的數字發音比較長，比較不容易記，這可能是老中和老美數字記憶廣度出現差距的原因。
  - idx: 5
    section_heading: 實驗二
    section_heading_note: 「實驗二」是不佔段號的分節小標，印在本段之前。
    text: 「漢語的數字發音長度比英語短，所以比較容易記」，實驗一這個結論看起來蠻有道理。但馬上就有其他的科學家提出異議：老中的家長喜歡送孩子去補習，從小就有心算、珠算、數學的大量練習，而老美的家長卻喜歡送孩子去踢球、游泳，說不定是從小的訓練，讓老中對數字更熟練，這造成了老中和老美數字記憶廣度的差異，而不是漢語和英語的數字發音長度不同所致。
  - idx: 6
    text: 1988年，另外一批科學家複製了這個數字記憶廣度研究，也就是用相同的方法再做一次實驗，但他們這次用的是4、5、6歲的「小老中」和「小老美」，年紀這麼小，不管是「小老中」或「小老美」都還沒有開始補習，所以如果兩組的數字記憶廣度仍然有所差異，就絕對不可能是「補習」造成的。研究結果發現，不管是4歲、5歲，還是6歲，每一個年齡層的「小老中」，數字記憶廣度平均值都明顯的大於「小老美」。而且，他們發現，用母語唸數字，小老中每個數字平均的發音長度，比小老美短了約十分之一秒。也就是說，這個研究再次支持了「數字發音愈短，能記住的數字愈多」的說法。
  - idx: 7
    text: 這兩個實驗講的都是「數字」，但如果是「閱讀」呢？每個人閱讀的速度都不一樣，是不是讀得越快，閱讀理解的能力就越強呢？我們下一課要來談這方面的研究。
