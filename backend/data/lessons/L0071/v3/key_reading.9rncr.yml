  passage: 1987年，科學家找了兩組大學生做這個測驗，第一組大學生是說漢語的中國人（以下稱呼他們「老中」），第二組大學生是說英語的美國人（以下稱「老美」），結果指出，老中的平均得分是9，老美的平均卻只有7，老中很明顯的超過老美。為什麼老中比較厲害呢？這個研究還測量了老中和老美的「數字發音長度」，兩組大學生用自己的母語以最快的速度從1數到10，他們數數的聲音被錄下來，科學家分析後發現，漢語的數字發音長度，比英語短了很多。科學家推論，漢語的數字發音比較短，所以大腦比較容易記憶，英語的數字發音比較長，比較不容易記，這可能是老中和老美數字記憶廣度出現差距的原因。「漢語的數字發音長度比英語短，所以比較容易記」，實驗一這個結論看起來蠻有道理。但馬上就有其他的科學家提出異議：老中的家長喜歡送孩子去補習，從小就有心算、珠算、數學的大量練習，而老美的家長卻喜歡送孩子去踢球、游泳，說不定是從小的訓練，讓老中對數字更熟練，這造成了老中和老美數字記憶廣度的差異，而不是漢語和英語的數字發音長度不同所致。
