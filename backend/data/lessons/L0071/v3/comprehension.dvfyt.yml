lesson_uid: L0071
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 如果一個小朋友在記憶數字的測驗中，能夠成功記住「2-7-5-8」，但記不住「6-7-0-4-9」，他會得到幾分？
    options:
      A: 5分
      B: 4分
      C: 2758分
      D: 67049分
    explanation: 題目中的小朋友能記住4個數字，卻不能記住5個數字，所以得4分。
    explanation_note: 原稿是一個浮動說明框，印在選項 A 右側
    answer_printed_as: Ｂ
  - index: 2
    answer: D
    stem: 根據實驗一和實驗二，為什麼老中的記憶廣度比老美長？
    options:
      A: 因為老中從小就有補習
      B: 因為老中比老美記憶力好
      C: 因為老中接受了較多次測驗
      D: 因為漢語數字的發音時間較短
    explanation: 第4段與第6段都顯示，漢語數字的平均發音時間較短，漢語組的數字記憶廣度也較高，因此研究者認為兩者可能有關。
    explanation_note: '原稿是一個浮動說明框，印在選項 A 右側。

      ✅ 這句解說裡的「第4段與第6段」與本檔的段號歸屬完全相符，是 body.paragraph_grouping_note 的佐證。'
    answer_printed_as: Ｄ
  - index: 3
    answer: A
    stem: 實驗二提到小老中和小老美數字記憶廣度如果有所差異，「就絶對不可能是補習造成的」，為什麼作者可以這麼確定呢？
    options:
      A: 因為小老中和小老美都沒有補習
      B: 因為研究人員請家長不要讓小孩去補習
      C: 因為小老中有補習，小老美沒有
      D: 因為小老中的記憶力比小老美好
    explanation: 從第7段可知，實驗二的受試者是4至6歲的孩子，這些孩子還沒有開始補習，因此補習不會影響實驗結果。這就是「補習的影響被控制了」的意思。
    explanation_note: 原稿是一個浮動說明框，印在選項 B～D 右側
    stem_note: '題幹引課文時寫「就絶對不可能是補習造成的」，課文原句是「就絕對不可能是『補習』造成的」

      ——用了異體字「絶」、也少了「補習」兩側的引號。照原稿記錄，未更動（見 source_errata_note ①）。'
    paragraph_reference_note: '⚠️ 解說寫「從第7段可知」，但「4至6歲、還沒開始補習」實際印在**第 6 段**

      （第 7 段是「這兩個實驗講的都是『數字』…」）。段號差一號，照原稿記錄未更動。

      同型：L0061 的閱讀理解也有三題段號差一。'
    answer_printed_as: Ａ
  - index: 4
    answer: C
    stem: 實驗二也出現「漢語組發音較短、數字記憶廣度較高」的結果。這對實驗一的說法有什麼作用？
    options:
      A: 證明補習完全不會影響數字記憶
      B: 證明幼童一定比大學生更會記數字
      C: 讓「發音長度可能和記憶廣度有關」更有支持
      D: 推翻「發音長度可能影響記憶」的說法
    explanation: 實驗二改用不同年齡的受試者，仍得到和實驗一相近的結果，因此讓原來的說法得到更多支持。
    explanation_note: 原稿是一個浮動說明框，印在題幹右側
  - index: 5
    answer: B
    stem: 下列哪一個選項，是這篇文章最重要的結論？
    options:
      A: 閱讀速度越快，閱讀理解能力就越強
      B: 數字發音越短，可能越容易記住較多數字
      C: 年齡越小，數字記憶廣度通常就越高
      D: 補習經驗越多，數字記憶廣度就越高
    explanation: 實驗一與實驗二都出現「漢語數字發音較短、漢語組記憶廣度較高」的結果，因此支持B。
    explanation_note: 原稿是一個浮動說明框，印在選項 A 右側
