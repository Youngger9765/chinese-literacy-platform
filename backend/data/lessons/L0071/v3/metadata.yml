intro: 這篇文章要帶我們認識「數字記憶廣度測驗」，並探討為什麼說中文的人在記憶數字的表現上，似乎比說英文的人來得好。文章中介紹了兩項科學研究，分別從數字發音的長短以及從小接受的訓練等角度，試圖找出造成這種差異的原因。透過這些實驗，我們可以一起思考，究竟是什麼因素影響了我們的數字記憶能力。
