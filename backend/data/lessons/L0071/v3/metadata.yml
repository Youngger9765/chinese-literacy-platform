strategy_explained: '這一課我們要練習「比較不同點」

  這篇文章探討說中文和說英文的人在數字記憶上的差異，並且用科學研究來解釋原因，正好可以讓我們練習找出兩個方面（數字發音長短、從小訓練）的異同

  讀的時候，你可以一邊讀，一邊想想看，文章說什麼是說中文比較好的原因，又說什麼是說英文比較好的原因，把它們找出來比較看看'
