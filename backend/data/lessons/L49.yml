vocabulary:
- word: 流行疫病
  definition: 指在一定時期和一定地區內，大量感染的傳染病。
- word: 刻板印象
  definition: 指因為固有的觀念或經驗，而對人或事物形成的片面固執的印象。例如：男主內女主外。
- word: 望塵莫及
  definition: 比喻遠遠追不上。
- word: 咎責
  definition: 責罰、怪罪。
- word: 罹患
  definition: 染病。
- word: 鳳毛麟角
  definition: 形容極為少見的珍貴事物。
- word: 不言而喻
  definition: 指明顯到不需要說明的道理或情況。
- word: 多巴胺
  definition: 一種神經傳遞物質，對大腦的情感和動機起著重要作用。
