multiple_choice:
- question: 下列語詞何者使用正確？
  options:
  - 車子高速行駛，揚起地面上的灰塵，使人「望塵莫及」。
  - 他們倆今天結為夫妻，真是「無獨有偶」、天作之合。
  - 「刻板印象」指的是面無表情的人給他人的印象。
  - 他們日夜苦練，想爭取冠軍的決心早已「不言而喻」。
  answer: D
  explanation: A錯：成語誤用；B錯：成語誤用；C錯：成語誤用
- question: 這篇文章認為造成近視的原因為何？
  options:
  - 遺傳。
  - 近距離工作。
  - 受教育的時長。
  - 眼球缺乏陽光。
  answer: D
  explanation: 課文最後一段明確指出，這篇文章的主張是「說服讀者要讓孩子多曬太陽，以預防近視」，這暗示了近視的發生與眼球缺乏陽光有關。
- question: 根據本文的描述，請問下列有關近視的敘述，何者為非？
  options:
  - 長期在光源不足的環境下看書，可能會造成近視。
  - 陽光可以剌激視網膜分泌多巴胺，抑制眼軸伸長。
  - 室內開燈照明的效果和戶外活動的光線亮度相同。
  - 保持良好的視力方法就是多到戶外走動、曬太陽。
  answer: C
