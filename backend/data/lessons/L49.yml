- question: 請問這篇文章中，作者說服讀者的步驟為何？請排出順序。
  options:
  - 丙乙丁甲
  - 乙丁丙甲
  - 乙丙丁甲
  - 甲乙丁丙。
  answer: A
  explanation: 課文內容中未提供作者說服讀者的「論述步驟」甲、乙、丙、丁的具體內容，故無法判斷其正確順序，任何選項皆無依據。
- question: 在閱讀聚光燈裡提到「說服別人的論述步驟」，說明作者要用「客觀證據」支持自己的「主張」。請問下列何選項的證據，最不能支持說話者的「主張」？
  options:
  - 我主張學生不能參與學校獎懲會議：因為我認為學生年紀小，總是出錯誤的決定。
  - 我主張晚上過十點就不能放鞭炮：因為第二天大家都要上班上學，這會讓大家不能好好休息。
  - 我主張保護蜜蜂：因為蜜蜂變少，許多植物無法授粉，自然界食物來源就會變少。
  - 我主張營養午餐多點蔬菜：因為蔬菜有豐富的纖維素和維生素Ｃ，可以幫助消化和健康。
  answer: A
  explanation: 選項Ａ是個人主觀的看法
