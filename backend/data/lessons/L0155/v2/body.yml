source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 導讀：這課講一個發生在2700年前的精采的故事，說明了戰爭不一定要用兵刃，經濟戰完全不流血，一樣奏效：當時的齊國君主齊桓公，想要侵略魯國和梁國，他的臣子管仲，給他出了主意，在短時間內，讓兩個小國的人民放棄生產糧食，全力投入紡織業，要賣布給齊國。這麼做了一年多，齊國突然不買布了，這時魯、梁不但布賣不出去，連米糧都沒得吃，又要回頭求齊國幫忙。不久後，就自動向齊國臣服投降了。
- 齊桓公說：「我想拿下魯國和梁國，怎麼做才可以？」管仲回答：「魯國和梁國的人民習慣織『綈』來穿。主公可以帶頭穿綈做的衣服，並命令身邊的人穿，如此，人民也會跟著穿。接著，您再下令禁止齊國人織綈；主公的命令齊國人民不敢不聽，勢必仰賴魯、梁兩國，向他們購買綈。如此，魯、梁兩國的人民就會放下農活，爭相去織綈了。」齊桓公說：「好。」
- 管仲對魯國和梁國的商人說：「你們幫我運來一千匹綈，我就賞賜你們三百斤金；送到十倍的數量，就賞賜三千斤金。這樣，魯、梁兩國不用向人民課稅，國庫財政也能充足。」魯國和梁國的國君聽說這件事，果然大力號召、教導他們的人民去織綈。
- 十三個月後，兩國城裡的人民為了織綈、運綈，忙得路上都塵土飛揚，運綈的車一輛接一輛。管仲於是對齊桓公說：「主公現在可以改穿一般的絲織品，帶領人民不再穿綈，也不要與魯、梁兩國有任何外交往來。」齊桓公說：「好。」
- 又過了十個月，此時，兩國的人民因為缺糧，挨餓的人一個接一個。魯、梁兩國的國君驚覺不妙，立刻命令人民停止織綈、趕快回去務農種糧，但是糧食作物根本不可能在三個月內收成。結果，魯梁的人民買十升糧食要花上千錢，而齊國賣十升糧的成本卻只要十錢。
- 兩年後，魯梁的人民為了活下去而投奔齊國的，十人中就有六人。到了第三年，兩國的國君無計可施，只好向齊國請求歸順臣服。
- 桓公曰：「吾欲下魯梁.，何行.而可？」管子對曰：「魯梁之民.俗為綈，公服綈，令左右.服之，民從.而服之，公因令.齊勿敢為，必仰於魯梁，則是魯梁釋其農事.而作綈矣。」桓公曰：「諾。」
- 管子告魯梁之賈人曰：「子為󠇡我致綈.千匹󠇡，賜子.金三百斤，十至.而金三千斤，則是魯梁不賦於民.而財用足也。」魯梁之君.聞之，則教其民.為綈。十三月，魯梁郭中之民，道路.揚塵，車轂.連伍而行。管子對公曰：「公宜改.服帛，率󠇡民.去綈，毋與魯梁通使。」公曰：「諾。」
- 後十月，魯梁之民，餓餒相󠇡及，魯梁之君，即令其民.去綈.修農穀，不可以.三月而得，魯梁之人，糴十百，齊糶十錢。二十四月，魯梁之民.歸齊者十分之六，三年，魯梁之君.請服。
