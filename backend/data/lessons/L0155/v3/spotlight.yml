lesson_uid: L0155
version_id: v3
section_no: 四
spotlight:
  strategy_name: 賓語前置：倒裝句
  strategy_type: classical_grammar
  section_title_printed: 文言文聚光燈
  answer_carrier: 橘色代號與填空（字元樣式 aff6／af）＋ 橘色圈選（roundRect，srgb FF9900）
  blocks:
  - type: concept_box
    text: '你看過文字在句子裡玩「大風吹、換位子」嗎？在中文裡，有一種神奇的魔法叫做「倒裝句」！

      通常我們說話都有固定的順序，但有時候，為了「強調重點」或「傳達強烈的情感」，會故意把最重要的語詞搬到句子最前面，讓人第一眼就看到這個被強調的焦點，留下深刻的印象！而且，這種換位子的魔法，還能讓句子讀起來更有節奏感呢！

      接下來，請跟著說明，一起認識「賓語前置的倒裝句」。'
  - type: guide
    text: 一、重點攻略
  - type: guide
    text: 國文課本有一課〈愛蓮說〉，作者說他很愛蓮花，但他卻把「愛蓮」寫成「蓮之愛」。來看看這是怎麼回事？
  - type: figure
    referent: 正常敘事句與賓語前置倒裝的對照圖
    text_carrier: image
    content: "正常敘事句結構：(主語) + 述語(動詞) + 賓語           (我)愛蓮\n賓語前置的倒裝：(主語) + 賓語 + 之(為) + 述語(動詞)    蓮之愛\n                              是"
    content_note: '⚠️ 這裡標 text_carrier: image 是因為**兩條交叉箭頭與大箭頭是圖形**、空間關係讀不出來；

      但上面 content 的每一段文字**都在文字層**（已逐段 grep 命中），所以不是「整塊畫在圖上」。

      依規則「標太寬會讓文字逃過檢查」，這一塊的文字另外原樣寫進上下兩個 guide block 受檢。'
  - type: guide
    text: 正常敘事句結構：(主語) + 述語(動詞) + 賓語           (我)愛蓮
  - type: guide
    text: '賓語前置的倒裝：(主語) + 賓語 + 之(為) + 述語(動詞)    蓮之愛

      是'
  - type: guide
    text: 觀察到了嗎?為了達到倒裝的目的，賓語被移到動詞前面，而且賓語與動詞間還必須加「是」或「之(為)」，讓人知道這是文字「換位子」哦！
  - type: guide
    text: 可能有同學會問：文言文中，「之」很常見啊，要怎麼判斷句子是不是倒裝了呢?我們可以思考：賓語的詞性應該是什麼?沒錯！就是名詞、代詞。所以，賓語前置的倒裝句的結構應該像下面這樣：
  - type: table
    columns:
    - 成分
    - 說明
    instruction: 賓語提前倒裝句型
    rows:
    - - (主語)
      - 可省略
    - - 賓語
      - 名/代詞
    - - 是/之
      - 助詞
    - - 述語
      - 動詞
    shape_note: 原稿是一個橫向的圓角框，四個成分並排、下方各標詞性；這裡攤成兩欄表格
  - type: guide
    text: 另一種常見的形式是：
  - type: table
    columns:
    - 成分
    - 說明
    rows:
    - - 唯
      - 副詞
    - - 賓語
      - 名/代詞
    - - 是
      - 助詞
    - - 述語
      - 動詞
    shape_note: 同上，原稿是橫向圓角框
  - type: guide
    text: 寫成「唯……是……」。「唯」意思是「只」，用來限定動詞的範圍，「是」是表示賓語前置了。
  - type: guide
    text: 比如「只吃肉」，動詞是「吃」，吃肉，加了「只」就可以讓人知道限定吃肉，在「肉的範圍內都吃，其他的都不吃」。
  - type: guide
    text: 「只吃肉」是正常的敘事句，古文用語寫成「唯吃肉」，按照文字大風吹的規則：動詞跟賓語要換位子；賓語(肉)前置，動詞(吃)被擠到後面，賓語跟動詞中間要放助詞(是)讓人知道這是倒裝句。剩下的語詞(唯)位子不動，「唯吃肉」就會變成「唯肉是吃」了。
  - type: guide
    text: 現在，你已經了解賓語前置倒裝句的魔法了，但我們還需要進一步地熟悉「怎麼還原」?這將有助於我們快速地理解句意哦！具體步驟如下：
  - type: table
    instruction: 還原賓語前置倒裝句
    columns:
    - 步驟
    - 句子1
    - 句子2
    rows:
    - - 倒裝句
      - 牡 丹 之 愛
      - 唯 利 是 圖
    - - 1.去助詞
      - 牡 丹 之 愛
      - 唯 利 是 圖
    - - 2.助詞前後的賓語、動詞換位子
      - 愛  牡丹
      - 圖  利
    - - 3.有副詞就補(虛線表示)
      - ''
      - 唯 圖 利
    - - 4.理解句意
      - 愛牡丹
      - 只 貪圖 利益
    rows_note: '「1.去助詞」那一列原稿是把助詞（之／是）打叉刪除，刪除線是圖形、文字仍完整；

      「2.」那一列的換位子箭頭也是圖形。這裡照文字層原樣列出，箭頭與刪除線不轉錄成文字。'
  - type: guide
    text: '透過以上的說明，你是否對還原「賓語前置的倒裝句」更有信心了呢?

      你想挑戰看看：自己解開語序顛倒的文字密碼嗎？以下的題目，請務必嘗試看看。'
  - type: guide
    text: 二、輕練習
  - type: exercise
    instruction: (一)選一選。下列都是倒裝句，請選出還原後的句子。
    items:
    - type: single
      index: 1
      stem: 「何陋之有」 A陋何有 / B有何陋
      answer: B
      teacher_note: 第1題解析。何陋之有：原形「有何陋」。有什麼簡陋?
    - type: single
      index: 2
      stem: 「馬首是瞻」 A馬瞻首 / B瞻馬首
      answer: B
      teacher_note: 第2題解析。古代打仗時，士兵看主將的馬頭方向來決定前進或停止，後來就以「瞻(看)馬首」比喻聽從帶頭者的指揮。
    - type: single
      index: 3
      stem: 「何難之有」 A有何難 / B何難有
      answer: A
    - type: single
      index: 4
      stem: 「唯你是問」 A問唯你 / B唯問你
      answer: B
      teacher_note: 第4題解析。唯你是問：原形「唯問你」。有什麼事的話，只問你(的責任)。
    - type: single
      index: 5
      stem: 「何懼之有」 A有何懼 / B何有懼
      answer: A
    - type: single
      index: 6
      stem: 「唯利是圖」 A 圖唯利/ B唯圖利
      answer: B
      teacher_note: 第6題解析。唯利是圖：原形「唯圖利」。某人只貪圖利益。
    teacher_note_carrier: 深藍色（C:156082）文字方塊，印在題目右側；第 3、5 題沒有解析
  - type: guide
    text: (二)寫一寫。先還原倒裝句，再依還原句及語境圈出適當的意思解釋。
  - type: sub_block
    label: 寫一寫 1
    value: '1.韓愈說他很小的時候就失去父母，對父母沒有印象，「唯兄嫂是依」。

      「唯兄嫂是依」句子還原 → 唯【　】

      意思：只能【　】哥哥、嫂嫂生活。'
    blanks:
    - answer: 依兄嫂
    - answer: 依靠
    options_printed:
      1: 依靠
      2: 依然
    answer_carrier: 還原句是橘色手寫（字元樣式 aff6）；意思那一格是**橘色圈選**（roundRect FF9900，0.48×0.33in）圈住「依靠」
  - type: sub_block
    label: 寫一寫 2
    value: '2.孔子說：當父母的人「唯其疾之憂」。所以，子女愛護身體，不生病，就是孝順。

      「唯其疾之憂」句子還原 →【　】

      意思：唯一【　】的是孩子生病。'
    blanks:
    - answer: 唯憂其疾
    - answer: 憂心
    options_printed:
      1: 解憂
      2: 憂心
    teacher_note: 第2題：「解憂」，解除煩憂，與「孩子生病」的語境矛盾。
    answer_carrier: 還原句橘色手寫；意思那一格是橘色圈選（roundRect FF9900）圈住「憂心」
  - type: sub_block
    label: 寫一寫 3
    value: '3.劉蓉讀書時習慣邊走邊思考。房間有個窪坑，劉蓉常被絆倒卻不理會，時間久了竟也習慣了。他的父親看到後指正他：「一室之不治」，將來還談什麼治理國家？劉蓉這才領悟到習慣對人的影響有多深。

      「一室之不治」句子還原 →【　】

      意思：不能【　】好一個房間。'
    blanks:
    - answer: 不治一室
    - answer: 管理
    options_printed:
      1: 管理
      2: 醫治
    answer_carrier: 還原句橘色手寫；意思那一格是橘色圈選（roundRect FF9900）圈住「管理」
