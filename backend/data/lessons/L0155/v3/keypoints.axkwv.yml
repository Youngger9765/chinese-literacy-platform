lesson_uid: L0155
version_id: v3
section_no: 三
keypoints:
  title: 不流血的戰爭
  layout: matrix
  columns:
  - 結構
  - 內容摘要
  intro: '這一次的文章重點整理，除了整理事件的發展順序，請你邊整理邊想一想：

    👉 齊國在「前期」做了哪些安排？

    👉 到了「後期」，局勢如何反轉？

    👉 齊國如何在不流血的情況下取勝？

    準備好了嗎？讓我們一起來拆解這場「看不見刀劍」的戰爭吧！'
  answer_carrier: 橘色手寫（字元樣式 af）＋ 紅色 ☑（w:sym Wingdings F0FE，1 個）
  rows:
  - 結構: 提出問題
    內容摘要: '提問人：齊（　）

      問  題：想要攻取魯、梁兩國，但不知道怎麼做?'
    內容摘要_blanks:
    - answer: 桓公
  - 結構: 戰略前期
    內容摘要: '戰略設計人：（　）

      利用魯梁擅長製作（　）的習俗，實施以下政策：

      ❶齊國君臣帶頭（　）綈

      ❷禁止齊國（　）綈

      ❸向魯梁商人高價收購綈

      目的：利誘魯梁百姓及魯梁國君，轉移'
    內容摘要_blanks:
    - answer: 管仲
    - answer: 綈
    - answer: 穿
    - answer: 自製
    內容摘要_sub_questions:
    - stem: 目的：利誘魯梁百姓及魯梁國君，轉移
      options:
        1: 產業
        2: 金融
      answer: 1
      tail: 重心。
      note: 印成「轉移☑產業 ▢金融重心。」——兩個選項後面共用一個「重心。」
  - 結構: 戰略後期
    內容摘要: '反轉：❶齊國改穿帛，不再向魯梁進口綈。

      ❷禁止與魯梁（　）

      目的：造成梁魯內亂，通貨膨脹，經濟失衡。'
    內容摘要_blanks:
    - answer: 通商
  - 結構: 最終結局
    內容摘要: '（　）年後：魯梁大量人民逃往齊國（十分之六）

      （　）年後：魯梁國君被迫臣服齊國。

      想一想：齊國的戰略，為何能導致梁魯內亂，人民出逃?

      答：'
    內容摘要_blanks:
    - answer: 兩
    - answer: 三
    內容摘要_free_answer:
      answer: 魯梁為了生產綈，荒廢農業，導致糧食生產不足，糧價暴漲，鄰近的齊國又禁止通商，魯梁人有錢也買不到糧。不逃，只能餓死。
      label: (參考答案)
      answer_carrier: 橘色手寫（字元樣式 af），文字流有此資訊
  slug: axkwv
