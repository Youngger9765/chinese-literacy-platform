lesson_uid: L0155
version_id: v3
section_no: 二
key_reading:
  unit: 秒
  unit_note: 文言文計時的是「讀完全文要幾秒」，不是白話課的「1 分鐘幾字」；沒有累計字數欄、沒有 ☞ 起讀點
  instructions:
  - 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。計時3次後，還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
  - 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  instructions_note: 第 1 條的措辭與 L0154 略有不同（本課少了「如果你」「對自己」），照各自原樣抄
  timing_table:
    columns:
    - 第1次計時
    - 第2次計時
    - 第3次計時
    - 裁判計時
    unit: 秒
    judge_signature: true
  benchmark_instruction: ◎ 我的表現：請確認讀完全文的時間。不要太快也不要太慢，不漏字或加字，斷詞的位置也要正確哦！
  benchmark:
  - threshold: 90秒以下
    feedback: 速度有點快，要讀清楚哦！
  - threshold: 90~105秒
    feedback: 強者就是你啦！
  - threshold: 105秒以上
    feedback: 速度再快一點！
  benchmark_note: 門檻比 L0154（42／55 秒）高很多，因為本課原文長得多
