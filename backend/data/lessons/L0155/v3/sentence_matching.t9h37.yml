sentence_matching:
  instruction: 請 ❶ 閱讀原文；❷ 找出對應的參考句；❸ 在下方的[  ]寫上參考句代號。
  passage_paragraphs:
  - 桓公曰：「(吾欲下魯梁，何行而可)？」管子對曰：「魯梁之民俗為綈，(公服綈，令左右服之，民從而服之)，公因令齊勿敢為，必仰於魯梁，則是魯梁釋其農事而作綈矣。」桓公曰：「諾。」
  - 管子告魯梁之賈人曰：「(子為我致綈千匹，賜子金三百斤)，十至而金三千斤，則是魯梁不賦於民而財用足也。」魯梁之君聞之，則教其民為綈。十三月，魯梁郭中之民，(道路揚塵，車轂連伍而行)。管子對公曰：「(公宜改服帛，率民去綈)，毋與魯梁通使。」公曰：「諾。」
  - 後十月，(魯梁之民，餓餒相及)，魯梁之君，(即令其民去綈修農穀)，不可以三月而得，(魯梁之人，糴十百，齊糶十錢)。二十四月，魯梁之民歸齊者十分之六，三年，魯梁之君請服。
  reference_label: 參考句：
