lesson_uid: L0155
version_id: v3
classical_text:
  source_label: 戰國・《管子》
  punctuation_note: '原文的「.」是學習單印的**斷詞記號**（p3 明寫「文章中的「.」是表示斷詞的地方」），不是句號。

    「為／匹／相／率／繳」等字在文字層各夾一個隱藏 variation selector（U+E01Ex），比對前濾掉 Cf/Mn。

    ⚠️ 本課的注釋**沒有印編號**（L0154 有 1.2.3.4.），原文裡也沒有上標數字。'
  paragraphs:
  - 桓公曰：「吾欲下魯梁.，何行.而可？」管子對曰：「魯梁之民.俗為綈，公服綈，令左右.服之，民從.而服之，公因令.齊勿敢為，必仰於魯梁，則是魯梁釋其農事.而作綈矣。」桓公曰：「諾。」
  - 管子告魯梁之賈人曰：「子為我致綈.千匹，賜子.金三百斤，十至.而金三千斤，則是魯梁不賦於民.而財用足也。」魯梁之君.聞之，則教其民.為綈。十三月，魯梁郭中之民，道路.揚塵，車轂.連伍而行。管子對公曰：「公宜改.服帛，率民.去綈，毋與魯梁通使。」公曰：「諾。」
  - 後十月，魯梁之民，餓餒相及，魯梁之君，即令其民.去綈.修農穀，不可以.三月而得，魯梁之人，糴十百，齊糶十錢。二十四月，魯梁之民.歸齊者十分之六，三年，魯梁之君.請服。
  annotations_label: 注釋
  annotations:
  - term: 綈
    text: 古代一種光滑細澤的厚絲織品。可用來製袍、寫字等。
  - term: 郭
    text: 城牆外再築的一道城牆。即外城。
  - term: 糴
    text: 買入穀物。
  - term: 糶
    text: 賣出穀物。
