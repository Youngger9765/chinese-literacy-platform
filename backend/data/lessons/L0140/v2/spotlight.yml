spotlight:
  lesson: G9-L1
  strategy_name: 寫作手法-用故事帶出觀點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: "這篇文章先寫張曼娟和父親的故事，後面才說出作者對「認命」的看法。這種寫作方式，故事本身還不是作者觀點，讀者要繼續看作者怎麼解釋這個故事，才能知道作者真正想說的道理。讀這種文章，不能只看到故事情節，還要讀懂：\n\
      \ ①作者先說了什麼故事？\n ②作者怎麼解釋這個故事？\n ③作者最後想讓我懂什麼？\n最後，還要看出：故事、作者的解釋和作者的觀點，是怎麼一步一步接起來的。這樣，才算真正讀懂故事和觀點之間的關係。"
  - type: guide
    text: 任務一、找出文章結構，整理重點
  - type: guide
    text: 請根據課文，填入文章結構對應的段落數，並完成重點整理。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 任務二、從故事脈絡到作者的解釋
  - type: passage
    source: unknown
    paragraphs:
    - 請根據課文，判斷張曼娟的情緒／反應如何變化，以及作者怎麼解釋她最後的「大笑」。請在□中勾選合理的答案。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 任務三、把故事接到作者觀點
  - type: guide
    text: 你發現了嗎？這個故事是一步一步推向作者觀點的。
  - type: guide
    text: 作者最後說：「認命」不是吞忍，而是轉身。請根據上表，把這條線補完整。
  - type: guide
    text: 故事：張曼娟期待【　和解　】→期待【　落空　】→
  - type: guide
    text: 她沒有停留在【　怨恨　】裡，而是【　大笑　】 起來
  - type: guide
    text: →作者解釋：這是【　看清現實、不再被痛苦困住　        】
  - type: guide
    text: →作者推出觀點：「認命」不是弱者的吞忍，而是強者的轉身
  - type: single
    prompt: →根據作者的解釋，張曼娟的「認命」比較接近哪一種？
    options:
    - ①弱者的吞忍
    - ②強者的轉身
    answer: ②強者的轉身
  - type: self_check
    items:
    - 我能分辨文章哪裡在說故事，哪裡在解釋故事，哪裡在說出作者觀點。
    - 我能讀出作者如何從張曼娟的故事，一步一步推出對「認命」的觀點。
    - 我能用「故事 → 作者解釋 → 作者觀點」說明這篇文章怎麼用故事帶出觀點。
