spotlight:
  lesson: G9-L1
  strategy_name: 寫作手法-用故事帶出觀點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: "這篇文章先寫張曼娟和父親的故事，後面才說出作者對「認命」的看法。這種寫作方式，故事本身還不是作者觀點，讀者要繼續看作者怎麼解釋這個故事，才能知道作者真正想說的道理。讀這種文章，不能只看到故事情節，還要讀懂：\
      \ \n ①作者先說了什麼故事？\n ②作者怎麼解釋這個故事？\n ③作者最後想讓我懂什麼？\n最後，還要看出：故事、作者的解釋和作者的觀點，是怎麼一步一步接起來的。這樣，才算真正讀懂故事和觀點之間的關係。"
  - type: guide
    text: 任務一、找出文章結構，整理重點
  - type: guide
    text: 請根據課文，填入文章結構對應的段落數，並完成重點整理。
  - type: table
    rows:
    - - 文章結構
      - '起訖

        段落'
      - 重點
    - - 先說故事
      - '(  1  )

        ~

        ( 12  )'
      - '故事：張曼娟和父親的故事

        1.張曼娟長期照顧父親，最期待父親對她說一句【】，期待父親離開前能跟他【】。

        2.有一天，父親說出「ㄒㄧ……」時，張曼娟以為父親終於要說【】；沒想到父親最後說的是【】。

        3.張曼娟期待的大和解【】，但她最後竟然【】。'
    - - '作者

        詮釋故事'
      - '( 1 3  )

        ~

        ( 19  )'
      - '詮釋：作者開始解釋這個故事

        1.作者說這個故事有三個大【】。其中，最值得探究的是第【】次轉折。

        2.第三次轉折特別重要，因為張曼娟期待落空後，沒有心存【】，反而大笑。

        3.作者認為，張曼娟做了最好的決定，不必在這【】的議題上再多耗心力了。'
    - - '說出

        作者觀點'
      - '( 20  )

        ~

        ( 22  )'
      - "觀點：作者說出他對「認命」的看法\n1.作者認為，認命不是把【】吞下去，也不是咬牙摀著傷口說【】。 \n2.真正的認命是看清楚事情原本的樣子後，作一個【】的決定。\
        \ \n3.作者認為張曼娟做了一個強者的決定：她看清楚父親就是這樣，不會忽然改變。她笑的不是父親，而是苦苦等待【】的自己。她的笑證明她不想再讓這份痛繼續【】自己。\n\
        4.作者認為「認命」不是弱者的【】，而是強者的【】。"
    answers:
    - 謝謝
    - 和解
    - 謝謝
    - 吸管
    - 落空
    - 大笑
    - 轉折
    - 三
    - 怨懟
    - 無解
    - 委屈
    - 不痛
    - 強者
    - 奇蹟
    - 折磨
    - 吞忍
    - 轉身
  - type: guide
    text: 任務二、從故事脈絡到作者的解釋
  - type: passage
    source: unknown
    paragraphs:
    - 請根據課文，判斷張曼娟的情緒／反應如何變化，以及作者怎麼解釋她最後的「大笑」。請在□中勾選合理的答案。
  - type: table
    rows:
    - - 故事脈絡
      - 張曼娟情緒/反應
      - 作者解釋
    - - 1.張曼娟長期照顧父親，期待父親對她說一句謝謝，期待父親離開前能跟他和解。
      - '①期待和解

        □②期待落空'
      - （尚未進入作者解釋）
    - - 2.有一天，父親說出「ㄒㄧ……」時，張曼娟以為父親終於要說謝謝；沒想到父親最後說的是吸管。
      - '□①期待和解

        ②期待落空'
      - （尚未進入作者解釋）
    - - 3.張曼娟期待的大和解落空，但她最後竟然大笑起來。
      - '□①她用笑把失望藏起來

        ②她沒有怨恨而是大笑'
      - '①她看清現實，不再被痛苦困住

        □②她只是把委屈忍下來，接受父親不會改變'
    - - 因此，作者進一步提出觀點：「認命」不是弱者的吞忍，而是強者的轉身。
  - type: guide
    text: 任務三、把故事接到作者觀點
  - type: guide
    text: 你發現了嗎？這個故事是一步一步推向作者觀點的。
  - type: guide
    text: 作者最後說：「認命」不是吞忍，而是轉身。請根據上表，把這條線補完整。
  - type: guide
    text: 故事：張曼娟期待【　和解　】→期待【　落空　】→
  - type: guide
    text: 她沒有停留在【　怨恨　】裡，而是【　大笑　】 起來
  - type: guide
    text: → 作者解釋：這是【　看清現實、不再被痛苦困住　        】
  - type: guide
    text: → 作者推出觀點：「認命」不是弱者的吞忍，而是強者的轉身
  - type: single
    prompt: → 根據作者的解釋，張曼娟的「認命」比較接近哪一種？
    options:
    - ①弱者的吞忍
    - ②強者的轉身
    - 我能分辨文章哪裡在說故事，哪裡在解釋故事，哪裡在說出作者觀點。
    - 我能讀出作者如何從張曼娟的故事，一步一步推出對「認命」的觀點。
    - 我能用「故事 → 作者解釋 → 作者觀點」說明這篇文章怎麼用故事帶出觀點。
    answer: ②強者的轉身
