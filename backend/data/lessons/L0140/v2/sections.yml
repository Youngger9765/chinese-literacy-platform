  - index: 1
    text: 這次段考數學題目很（　），題目看起來簡單，卻藏了好幾個陷阱。
    answer: H
  - index: 2
    text: 每次打掃，阿翔都藉故離開，留下同組同學收拾善後；大家心裡早已對他（　） 。
    answer: E
  - index: 3
    text: 每次小組分工，整理資料和上台報告都落在小芸身上，她原本選擇（　），最後終於開口要求重新分配。
    answer: I
  - index: 4
    text: 球隊傷兵累累，吃盡苦頭後終於反敗為勝，教練在旁（　），卻強忍著不讓眼淚掉下來。
    answer: C
  - index: 5
    text: 他知道父親向來不擅表達，卻仍盼著一句溫柔的道歉；那份（　）背後其實藏著多年的委屈。
    answer: A
  - index: 6
    text: 颱風夜裡，山區居民聽著土石滑落的聲音，整晚都（　），無法入睡。
    answer: G
  - index: 7
    text: 她一方面渴望母親理解自己，一方面又怨母親從不傾聽；這份（　），讓兩人的距離越來越遠。
    answer: F
  - index: 8
    text: 那場失敗讓球員第一次看見自己的鬆散，也成了全隊開始認真練習的（　）。
    answer: B
