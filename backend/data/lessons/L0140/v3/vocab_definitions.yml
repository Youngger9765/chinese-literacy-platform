lesson_uid: L0140
version_id: v3
section_no: 三
vocab_definitions:
  vocabulary_bank:
  - 奢求
  - 契機
  - 泫然欲泣
  - 耐人玩味
  - 愛怨糾葛
  - 提心吊膽
  - 刁鑽
  - 吞忍
  - 心存怨懟
  items:
  - index: 1
    word: 契機
    definition: 讓事情開始改變或發展的關鍵機會。
  - index: 2
    word: 奢求
    definition: 過度期待很難得到的事物。
  - index: 3
    word: 耐人玩味
    definition: 值得仔細思考、反覆體會。
  - index: 4
    word: 心存怨懟
    definition: 心裡有怨恨和不滿。
  - index: 5
    word: 提心吊膽
    definition: 非常擔心、害怕，心裡一直不安。
  - index: 6
    word: 刁鑽
    definition: 指問題、情況或人的個性很難處理、很難應付。
  - index: 7
    word: 愛怨糾葛
    definition: 愛、不滿、委屈等感情交纏在一起，難以分清。
  - index: 8
    word: 吞忍
    definition: 把委屈或痛苦忍下來，不說出來或反抗。
  - index: 9
    word: 泫然欲泣
    definition: 欲泣：快要哭出來；指眼淚快要流下來，像要哭出來的樣子。
