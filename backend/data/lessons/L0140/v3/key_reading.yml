  passage: 這個故事有三個大轉折。第一次轉折是，聽眾被引導去猜想那個感人的一幕──硬脾氣的老人終於要向付出最多的女兒說謝謝了。第二次轉折是，原來老人根本沒要說謝謝，只是要一根吸管。第三次轉折是，女兒在期待的大和解落空後，居然大笑起來。第三次轉折是最值得探究的。張曼娟對老爸抱著這麼高的期待，而幾乎不可能的父女和解似乎出現，這時她應該會感動到泫然欲泣吧。但幾秒之內，她的感動變成幻影，現實中的老爸才不來這一套。最耐人玩味的是，女兒從天堂跌落谷底了，她此時如果淚眼模糊、捏緊拳頭、心存怨懟，長年身心的辛苦折磨和委屈一一從心底浮現，是完全可以理解的。但她沒有，她哈哈大笑，笑到站不穩。作為聽故事的人，我一邊聽，一邊為父女間的愛怨糾葛感到提心吊膽，聽到張曼娟大笑後，我提的心吊的膽一下全放鬆下來，為她歡喜寬心。我覺得，對她來說，這可能是當下最好的選擇：不必在這無解的議題上再多耗心力了。但，到底張曼娟是怎麼做到的呢？我想到「認命」這個概念。認命不是把委屈吞下去，更不是咬牙摀著傷口說不痛；認命，是看清楚事情原本的樣子後，做出一個強者的決定。張曼娟看清楚了，老去的父親就是這樣，他不會忽然變得溫柔，他不會忽然開口道謝，有些門不會打開，有些和解永遠不會發生，她終於認命。可是，看清楚這一點以後，人仍然可以自由的選擇要怎麼活。弱者可能繼續怨、繼續含淚等待。張曼娟不然，她作了一個強者的決定，她大笑起來。她笑的不是父親，也不是自己的傻，而是那個苦苦等待奇蹟的自己，承認「太好笑，原來我又想多了」。那個笑，證明她已經強大到不想再讓這份痛繼續折磨自己。老天丟來一個刁鑽的壞球，既然無法打擊，就閃開吧，別傷了自己就好。這時，她不再是一個被動的受難者，她主動地選擇了自己的命運。結論是，「認命」不是弱者的吞忍，而是強者的轉身。強者不是從來不受傷，而是受傷之後，做出一個強者的決定，離開傷痛，轉向那條光明、更有希望的路。
