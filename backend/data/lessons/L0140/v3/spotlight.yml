lesson_uid: L0140
version_id: v3
section_no: 五
spotlight:
  strategy_name: 寫作手法──用故事帶出觀點
  strategy_type: writing_technique
  blocks:
  - type: concept_box
    text: "這篇文章先寫張曼娟和父親的故事，後面才說出作者對「認命」的看法。這種寫作方式，故事本身還不是作者觀點，讀者要繼續看作者怎麼解釋這個故事，才能知道作者真正想說的道理。讀這種文章，不能只看到故事情節，還要讀懂：\n  ①作者先說了什麼故事？\n  ②作者怎麼解釋這個故事？\n  ③作者最後想讓我懂什麼？\n最後，還要看出：故事、作者的解釋和作者的觀點，是怎麼一步一步接起來的。這樣，才算真正讀懂故事和觀點之間的關係。"
  - type: fill_table
    label: 任務一、找出文章結構，整理重點
    instruction: 請根據課文，填入文章結構對應的段落數，並完成重點整理。
    columns:
    - 文章結構
    - 起訖段落
    - 重點
    rows:
    - 文章結構: 先說故事
      起訖段落: 【　】～【　】
      起訖_blanks:
      - answer: 1
      - answer: 12
      重點_title: 故事：張曼娟和父親的故事
      重點: '1.張曼娟長期照顧父親，最期待父親對她說一句【　】，期待父親離開前能跟他【　】。

        2.有一天，父親說出「ㄒㄧ……」時，張曼娟以為父親終於要說【　】；沒想到父親最後說的是【　】。

        3.張曼娟期待的大和解【　】，但她最後竟然【　】。'
      blanks:
      - answer: 謝謝
      - answer: 和解
      - answer: 謝謝
      - answer: 吸管
      - answer: 落空
      - answer: 大笑
    - 文章結構: 作者詮釋故事
      起訖段落: 【　】～【　】
      起訖_blanks:
      - answer: 13
      - answer: 19
      重點_title: 詮釋：作者開始解釋這個故事
      重點: '1.作者說這個故事有三個大【　】。其中，最值得探究的是第【　】次轉折。

        2.第三次轉折特別重要，因為張曼娟期待落空後，沒有心存【　】，反而大笑。

        3.作者認為，張曼娟做了最好的決定，不必在這【　】的議題上再多耗心力了。'
      blanks:
      - answer: 轉折
      - answer: 三
      - answer: 怨懟
      - answer: 無解
    - 文章結構: 說出作者觀點
      起訖段落: 【　】～【　】
      起訖_blanks:
      - answer: 20
      - answer: 22
      重點_title: 觀點：作者說出他對「認命」的看法
      重點: '1.作者認為，認命不是把【　】吞下去，也不是咬牙摀著傷口說【　】。

        2.真正的認命是看清楚事情原本的樣子後，作一個【　】的決定。

        3.作者認為張曼娟做了一個強者的決定：她看清楚父親就是這樣，不會忽然改變。她笑的不是父親，而是苦苦等待【　】的自己。她的笑證明她不想再讓這份痛繼續【　】自己。

        4.作者認為「認命」不是弱者的【　】，而是強者的【　】。'
      blanks:
      - answer: 委屈
      - answer: 不痛
      - answer: 強者
      - answer: 奇蹟
      - answer: 折磨
      - answer: 吞忍
      - answer: 轉身
  - type: fill_table
    label: 任務二、從故事脈絡到作者的解釋
    instruction: 請根據課文，判斷張曼娟的情緒／反應如何變化，以及作者怎麼解釋她最後的「大笑」。請在□中勾選合理的答案。
    columns:
    - 故事脈絡
    - 張曼娟情緒/反應
    - 作者解釋
    rows:
    - 故事脈絡: 張曼娟長期照顧父親，期待父親對她說一句謝謝，期待父親離開前能跟他和解。
      情緒_options:
        1: 期待和解
        2: 期待落空
      情緒_answer: 1
      作者解釋: （尚未進入作者解釋）
    - 故事脈絡: 有一天，父親說出「ㄒㄧ……」時，張曼娟以為父親終於要說謝謝；沒想到父親最後說的是吸管。
      情緒_options:
        1: 期待和解
        2: 期待落空
      情緒_answer: 2
      作者解釋: （尚未進入作者解釋）
    - 故事脈絡: 張曼娟期待的大和解落空，但她最後竟然大笑起來。
      情緒_options:
        1: 她用笑把失望藏起來
        2: 她沒有怨恨而是大笑
      情緒_answer: 2
      作者解釋_options:
        1: 她看清現實，不再被痛苦困住
        2: 她只是把委屈忍下來，接受父親不會改變
      作者解釋_answer: 1
    tail: 因此，作者進一步提出觀點：「認命」不是弱者的吞忍，而是強者的轉身。
  - type: sub_block
    label: 任務三、把故事接到作者觀點
    intro: '你發現了嗎？這個故事是一步一步推向作者觀點的。

      作者最後說：「認命」不是吞忍，而是轉身。請根據上表，把這條線補完整。'
    chain: 故事：張曼娟期待【　】→期待【　】→她沒有停留在【　】裡，而是【　】起來
    chain_blanks:
    - answer: 和解
    - answer: 落空
    - answer: 怨恨
    - answer: 大笑
    steps:
    - stem: →作者解釋：這是【　】
      blanks:
      - answer: 看清現實、不再被痛苦困住
    - stem: →作者推出觀點：「認命」不是弱者的吞忍，而是強者的轉身
    - stem: →根據作者的解釋，張曼娟的「認命」比較接近哪一種？
      options:
        1: 弱者的吞忍
        2: 強者的轉身
      answer: 2
  - type: self_check
    title: ◎自我檢核
    instruction: 如果你有做到，請在□內打勾。
    items:
    - 1.我能分辨文章哪裡在說故事，哪裡在解釋故事，哪裡在說出作者觀點。
    - 2.我能讀出作者如何從張曼娟的故事，一步一步推出對「認命」的觀點。
    - 3.我能用「故事 → 作者解釋 → 作者觀點」說明這篇文章怎麼用故事帶出觀點。
