intro: 這篇文章分享了作家張曼娟與年邁失能父親之間一個令人難忘的故事。故事描述了女兒對父親的付出，以及她心中對於父女關係和解的期待。然而，一次看似溫馨的餵食互動，卻出現了意想不到的轉折，讓女兒原本的期待落空。文章藉由這個情節，探討了「認命」這個概念，並提出「認命」並非消極的接受，而是看清事實後，強者所做的積極選擇。讀者將跟隨作者的敘述，一同思考在面對人生中的不如意時，如何做出更為豁達與堅強的決定。
strategy_explained: '這一課我們要學習的，是怎麼透過一個動人的故事，讓別人明白你的想法

  這篇作者用她和爸爸之間充滿情感卻又有些遺憾的相處點滴，帶出「認命」其實是種勇敢的選擇，很適合讓我們練習用生活中的真實經驗來說服別人

  讀的時候，你可以試著跟著作者一起感受她心中的期待落空，並思考為什麼她會覺得「認命」是一種積極的行動'
