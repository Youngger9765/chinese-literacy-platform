lesson_uid: L0064
version_id: v3
section_no: 五
keypoints:
  title: 感情小日記6──我失戀了
  layout: list
  instruction: 本篇日記從當下的心情，連結過去的事件，再回到當下整理想法，也就是「今─昔─今」的結構，讓我們一起根據文章，整理文章內容。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，9 個）與橘色手寫字；PDF p4~p5 可見
  structure_note: '原稿是三欄表，但只有「昔」那一段有中間欄（起因／經過／轉折／結果，且「昔」是縱向合併儲存格）；

    「今」「統整」兩段只有兩欄。所以用 list 佈局：「昔」用 items 帶四個子項。

    ⛔ 未寫成 matrix —— 那需要每一列都有同一組欄名，本表沒有。'
  rows:
  - label: 今（第一段）
    value: 天氣很好，而心情（　）
    options:
      1: 沉悶
      2: 平靜
    answer: 2
  - label: 昔（第二段～第五段）
    items:
    - label: 起因
      value: 聽到同學說喜歡的人（　），
      options:
        1: 有交往對象了
        2: 也喜歡自己
      answer: 1
    - value: 而感到（　）
      options:
        1: 出乎意料
        2: 理所當然
      answer: 1
      note: 與上一項同屬「起因」那一格（原稿是同一個儲存格裡的第二個選擇題），刻意不重複 label。
    - label: 經過
      value: 1.當下感受：（勾選，可複選）
      options:
        1: 震驚
        2: 失落
        3: 混亂
        4: 悸動
        5: 勇敢
        6: 不甘心
        7: 快樂
      answers:
      - 1
      - 2
      - 3
      - 6
    - value: 2.當下想法：還沒告白就失戀了，過去的相處算什麼呢？
      note: 與上一項同屬「經過」那一格；這一小題原稿直接印出答案，沒有空格也沒有選項。
    - label: 轉折
      value: 【　】告訴主角，喜歡一個人不是【　】，這也代表自己有能力【　】人。
      blanks:
      - answer: 朋友
      - answer: 壞事
      - answer: 喜歡
    - label: 結果
      value: 主角認為能有這份感情、曾經因此【　】與【　】就代表沒有白費。
      blanks:
      - answer: 開心
      - answer: 期待
  - label: 今（第六段）
    items:
    - value: 比起聽到消息的當下，心情（　）許多，
      options:
        1: 緩和
        2: 激動
      answer: 1
    - value: 覺得真心喜歡一個人是（　）的。
      options:
        1: 浪費
        2: 值得
      answer: 2
    note: 原稿是一個儲存格裡的一整句，中間有兩個選擇題；為了讓兩組選項各自對得到答案而拆成兩項。
  - label: 統整
    value: 本篇小日記主要在抒發自己【　】後，調適心情的歷程。
    blanks:
    - answer: 失戀
