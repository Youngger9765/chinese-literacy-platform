  passage: 我的心像被什麼狠狠撞了一下，混亂、震驚、失落，各種情緒交織在一起。這些日子以來的點點滴滴湧上心頭——我們之間的談話、他的笑容、那些讓我悸動的瞬間……這些感覺都還那麼清晰，可是現在，卻已遙不可及。如果我夠勇敢，能早一點向他說出我的心意，我們會不會也有機會呢？只是如今，這條路，似乎還沒開始，就已經走到了盡頭。
