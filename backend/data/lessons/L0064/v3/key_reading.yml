  passage: 我的心像被什麼狠狠撞了一下，混亂、震驚、失落，各種情緒交織在一起。這些日子以來的點點滴滴湧上心頭——我們之間的談話、他的笑容、那些讓我悸動的瞬間……這些感覺都還那麼清晰，可是現在，卻已遙不可及。如果我夠勇敢，能早一點向他說出我的心意，我們會不會也有機會呢？只是如今，這條路，似乎還沒開始，就已經走到了盡頭。晚上回到家，我癱倒在床上，盯著天花板發呆。原來，這就是失戀的感覺嗎？有點酸、有點苦，還夾雜著一絲不甘心。我不禁想，這些日子以來的心動，究竟算什麼？是不是我自作多情了？如果一開始就知道結果，我還會讓自己陷進這份感情裡嗎？可是一想到過去相處的點滴，我又無法否認，至少在那些時刻，我是快樂的。這些想法一直在我腦中拉扯，直到我把這件事告訴朋友。他聽完笑著說：「你是不是把這件事想得太悲壯了？喜歡一個人又不是什麼壞事。」我愣了一下，還沒來得及反駁，他又補充：「而且這代表你有能力去喜歡一個人，也代表你未來還會遇到更多值得喜歡的人，對吧？」這句話讓我沉默了。原來，我一直在想「失去」了什麼，卻忘了這段感情本身也是一種「擁有」。我曾經因為這份情感而開心，也曾經真心期待過——那麼，或許它就不是白費的。
