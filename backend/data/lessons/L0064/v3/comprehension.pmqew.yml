lesson_uid: L0064
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 失去寵物讓他心情非常「悲壯」，整天悶悶不樂
      B: 這杯果汁裡「交織」了一點檸檬，喝起來特別清爽
      C: 面對艱難選擇，他內心不斷「拉扯」，無法下定決心
      D: 從畢業旅行回來後，那份快樂仍在心中「難以平息」
    option_corrections:
      A: 宜用「悲傷」
      B: 宜用「摻雜」
      D: 宜用「迴盪」
    option_corrections_note: '三個錯誤選項的更正印在一個浮動文字方塊裡（教師版），方塊本身列在題目上方，

      內容是「A.宜用「悲傷」／Ｂ.宜用「摻雜」／D.宜用「迴盪」」（B 是全形Ｂ，其餘半形）。'
  - index: 2
    answer: A
    stem: 根據第三段「只是如今，這條路，似乎還沒開始，就已經走到了盡頭」，下列何者是此句想表達的意涵？
    options:
      A: 還沒讓對方知道自己的心意，就已失去機會
      B: 還沒確定好是否要接受告白，對方就離開了
      C: 對方還沒告訴他消息，朋友就已先洩漏出去
      D: 對方給出的承諾，還沒開始實踐就已放棄了
    explanation: 根據第三段「如果我夠勇敢，能早一點向他說出我的心意，我們會不會也有機會呢？」可知
    explanation_note: 原稿是一個浮動說明框，印在選項 A~D 右側
  - index: 3
    answer: C
    stem: 下列何者為本文主旨？
    options:
      A: 不要隨意公開關係，八卦消息經常對戀情帶來負面影響
      B: 暗戀就好，不應該主動告白，否則可能連朋友都做不成
      C: 感情的結果無法控制，但曾經喜歡也是一種成長與擁有
      D: 青少年心智尚未成熟，不應該過早投入情感，以免受傷
    explanation: 從段五、段六及文章重點可看出。
    explanation_note: 原稿是一個浮動說明框，印在題幹右側
  - index: 4
    answer: D
    stem: 本文在第一段提到「陽光灑在教室窗邊，心裡的烏雲好像也悄悄散開」，最後一段則寫「這場小小的失戀，也只是生命中的一場小雨，現在，天氣已經慢慢轉晴了」，這種寫法最主要的作用是什麼？
    options:
      A: 強調近期天氣多變化，連帶影響作者的心情起伏
      B: 凸顯人生有晴有雨，太在意外在變化是自討苦吃
      C: 利用不同心情來傳達不同晴、陰、雨帶來的感受
      D: 以天氣變化象徵情緒轉變為正向，形成首尾呼應
    explanation: 從「心裡的烏雲」、「生命的小雨」可看出天氣是用以表達心情轉折。
    explanation_note: '原稿是一個浮動說明框，疊在題幹末尾（PDF 上把「作用是什麼？」的問號蓋住了）。

      說明框寫「生命的小雨」，課文原句是「生命中的一場小雨」——原稿說明框如此，未更動。'
  - index: 5
    answer: B
    stem: 根據閱讀聚光燈的練習，關於悲傷五階段的調適，下列敘述何者正確？
    options:
      A: 處於否認階段時，要求對方提出證據或公開來讓大家知道
      B: 處於憤怒階段時，可以用適當方法抒發、宣洩自己的怒氣
      C: 處於討價還價階段時，面對無法掌控的事仍要嘗試和調整
      D: 處於沮喪階段時，提醒自己不可以讓別人看見自己的脆弱
    option_corrections:
      A: 找人聊聊、討論
      C: 專注於控制圈內的事
      D: 允許自己脆弱，也尋求他人支持
    option_corrections_note: 三個錯誤選項的更正印在一個浮動文字方塊裡（教師版），疊在選項 A 上方。
    stem_note: '題幹寫「根據**閱讀**聚光燈的練習」，但本課第六大題印的是「**品格**聚光燈」。

      原稿名稱不一致，照原樣記錄未更動。'
  notes:
    answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
