    - - '1'
      - 否認
      - 「應該是名單還沒公佈吧，不會沒有我吧？」
      - 【】他有另一半了？怎麼可能？那我們的相處算什麼？【】心感覺空空的，又像是有一把火【】如果我夠勇敢，能早一點向他說出我的心意，我們會不會也有機會呢？【】有點酸、有點苦，還夾雜著一絲不甘心。是不是我自作多情了？【】我曾經因為這份情感而開心，也曾經真心期待過——那麼，或許它就不是白費的。
