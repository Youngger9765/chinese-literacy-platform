  - type: passage
    source: unknown
    paragraphs:
    - 第三段寫道：「混亂、震驚、失落，各種情緒交織在一起。」這句話最能說明什麼？（單選）
  - type: multi
    prompt: 請選擇
    options:
    - 人面對失落時，可能同時出現多種感受。
    - 人一次只能有一種感受，不能同時悲傷和生氣。
    - 五種失落反應一定會按照相同的順序一一出現。
    answer:
    - 人面對失落時，可能同時出現多種感受。
    - 人一次只能有一種感受，不能同時悲傷和生氣。
    - 五種失落反應一定會按照相同的順序一一出現。
  - type: passage
    source: unknown
    paragraphs:
    - →小提醒：悲傷反應不一定按照順序出現，也不一定每一種都會出現；有時，幾種反應還可能同時出現。
  - type: guide
    text: 二、覺察自己的「悲傷五階段」：根據情境，勾選出你最常出現的內心語言。
  - type: guide
    text: ◎情境一：你和好朋友吵架，對方開始疏遠你。
  - type: single
    prompt: □①否認：「我們應該很快就會和好吧？」
    options:
    - 憤怒：「他怎麼可以那麼小氣，明明是他的錯！」
    - 討價還價：「如果我主動道歉，是不是就沒事了？」
    - 沮喪：「可能我們真的不會再像以前那樣了，好難過。」
    - 接受：「有些朋友會離開，但我還有其他重要的人。」
    answer: 憤怒：「他怎麼可以那麼小氣，明明是他的錯！」
  - type: guide
    text: ◎情境二：考試成績比預期差很多。
  - type: single
    prompt: □①否認：「一定是老師改錯卷了吧？」
    options:
    - 憤怒：「為什麼我明明有讀書卻考成這樣？太氣人了！」
    - 討價還價：「下次我每天多念一小時，是不是就能進步？」
    - 沮喪：「我可能就是讀書沒天分吧，覺得很沮喪。」
    - 接受：「雖然這次考不好，但我可以檢討下次再挑戰。」
    answer: 憤怒：「為什麼我明明有讀書卻考成這樣？太氣人了！」
  - type: guide
    text: ◎情境三：家人決定要搬家，你要離開熟悉的學校和朋友。
  - type: single
    prompt: □①否認：「應該只是說說吧，真的要搬嗎？」
    options:
    - 憤怒：「為什麼家人都不問我的意見，太過分了！」
    - 討價還價：「如果我乖一點，爸媽會不會就留下來？」
    - 沮喪：「我很捨不得這裡的一切，覺得很孤單。」
    - 接受：「搬家是新開始，雖然不捨，但我也可以交到新朋友。」
    answer: 憤怒：「為什麼家人都不問我的意見，太過分了！」
  - type: guide
    text: ◎我面對失落，最常出現或最有印象的反應是：(勾選)
  - type: multi
    prompt: 請選擇
    options:
    - 否認
    - 憤怒
    - 討價還價
    - 沮喪
    - 接受
    answer:
    - 否認
    - 憤怒
    - 討價還價
    - 沮喪
    - 接受
  - type: guide
    text: 三、調節「悲傷五階段」：這五階段不一定都會發生，有時候也反反覆覆，根據上一題答案，來看看你可以採取的調適策略。
  - type: table
    rows:
    - - 階段
      - 狀態
      - 常見感受（對應階段寫上1到5)
      - 調適方式
    - - '1'
      - 否認
      - 【】覺得事情不是真的、不敢相信【】覺得不公平、生氣、不甘心【】一直想「如果…就好了」【】失落、沮喪、自我懷疑【】慢慢釋懷、平靜、放下
      - 和信任的人聊聊，或寫下自己的感受
    - - '2'
      - 憤怒
      - 【】覺得事情不是真的、不敢相信【】覺得不公平、生氣、不甘心【】一直想「如果…就好了」【】失落、沮喪、自我懷疑【】慢慢釋懷、平靜、放下
      - 找安全的方式表達情緒（寫日記、運動、畫圖）
    - - '3'
      - 討價還價
      - 【】覺得事情不是真的、不敢相信【】覺得不公平、生氣、不甘心【】一直想「如果…就好了」【】失落、沮喪、自我懷疑【】慢慢釋懷、平靜、放下
      - 找出「控制圈」，接受有些事無法改變
    - - '4'
      - 沮喪
      - 【】覺得事情不是真的、不敢相信【】覺得不公平、生氣、不甘心【】一直想「如果…就好了」【】失落、沮喪、自我懷疑【】慢慢釋懷、平靜、放下
      - 允許自己難過，試著照顧好自己，做讓心情舒服的小事
    - - '5'
      - 接受
      - 【】覺得事情不是真的、不敢相信【】覺得不公平、生氣、不甘心【】一直想「如果…就好了」【】失落、沮喪、自我懷疑【】慢慢釋懷、平靜、放下
      - 給自己肯定，鼓勵自己嘗試新開始
