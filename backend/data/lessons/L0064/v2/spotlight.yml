    text: ◎你覺得你可以試試看的方法是：_______________________________________
  - type: passage
    source: unknown
    paragraphs:
    - 每個人遇到難過或失落時，心情都會經歷不同的變化。當我們能認識「悲傷五階段」，就能更清楚看見自己的情緒，學會用不同的方法陪伴和調適自己。希望你在未來遇到類似的困難時，也能溫柔對待自己的感受，勇敢走過每一個階段，找到屬於自己的力量❤︎
