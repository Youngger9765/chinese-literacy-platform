comprehension:
  questions:
  - index: 2
    answer: B
    stem: 請問文中第三段「捶胸頓足」最可能的情緒是哪個？
    options:
      A: 開心
      B: 懊惱
      C: 欣喜
      D: 寂寞
    rationale: null
    marker_notes:
      B: 由前後文「唉聲嘆氣」，後句「滿臉失落」可推論是懊惱的情緒
  - index: 3
    answer: B
    stem: 「贏了值得開心，輸了不必難過」，和下列哪一句話的意思最接近？
    options:
      A: 天生我材必有用
      B: 勝不驕，敗不餒。
      C: 天塌下來有高個子擋著
      D: 失敗是成功的必要條件
