passage: 2021年8月1日，小戴在東京奧運金牌賽的轉播收視率創下新高，這場小戴與陳雨菲的龍爭虎鬥，戰況勢均力敵，全臺觀眾守在電視前，目不轉睛。小戴一得分，大家歡天喜地、讚嘆不已；不幸鷹眼判定小戴的殺球出界，大家不免唉聲嘆氣、捶胸頓足。一場比賽帶出全國人民不可思議的凝聚力和向心力！
