  passage: 2021年8月1日，小戴在東京奧運金牌賽的轉播收視率創下新高，這場小戴與陳雨菲的龍爭虎鬥，戰況勢均力敵，全臺觀眾守在電視前，目不轉睛。小戴一得分，大家歡天喜地、讚嘆不已；不幸鷹眼判定小戴的殺球出界，大家不免唉聲嘆氣、捶胸頓足。一場比賽帶出全國人民不可思議的凝聚力和向心力！小戴在最後一局落後七分時，依然面不改色的一分一分追回來，她的每一下揮拍、每一次扣殺，都是在和自己比賽，她沒有因為想贏得比賽而選擇保守，她選擇的是做自己、用自己擅長的方式戰鬥，她要掌握比賽的節奏，她拚盡全力攻擊。雖然球評都指出小戴打得太精采了，但她最終還是以三分之差不敵對手的嚴密防守，只能奪得銀牌。下場時，小戴落寞的神情，讓全國粉絲們的心都揪了起來。受訪時，她卻不改大俠的性子，說：「盡力了，不後悔。」球迷們留言鼓勵。她，打得漂亮，雖然輸了比賽，卻贏得了人心，贏得全國人民的尊敬及喝采。
