lesson_uid: L0011
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank:
  - 喝采
  - 龍爭虎鬥
  - 讚嘆不已
  - 摸不著頭緒
  - 勢均力敵
  - 目不轉睛
  - 鷹眼
  - 凝聚力
  - 捶胸頓足
  - 疑難雜症
  - 落寞
  items:
  - index: 1
    word: 龍爭虎鬥
    definition: 形容像巨龍和猛虎般地相互爭鬥，難分高低。
  - index: 2
    word: 捶胸頓足
    definition: 捶打胸膛，以腳跺地。形容極為悲憤或悔恨。
  - index: 3
    word: 摸不著頭緒
    definition: 搞不清楚狀況的樣子。
  - index: 4
    word: 目不轉睛
    definition: 形容眼睛盯著、非常專心的樣子。
  - index: 5
    word: 凝聚力
    definition: 讓一群人非常團結的力量。
  - index: 6
    word: 勢均力敵
    definition: 雙方實力很接近，不知道誰會贏。
  - index: 7
    word: 喝采
    definition: 大聲叫好。
  - index: 8
    word: 讚嘆不已
    definition: 不停地讚美、驚嘆。
  - index: 9
    word: 落寞
    definition: 失望而且孤單寂寞的樣子。
  - index: 10
    word: 鷹眼
    definition: 在網球、羽球等球類運動中，用以追蹤記錄球的路徑的電腦輔助系統。
  - index: 11
    word: 疑難雜症
    definition: 難以解決的困難或問題。
  supplement:
    text: '*「鷹眼」常用的意思是銳利的眼光。'
  notes:
    vocabulary_bank: 學習單框內列 11 個，總表語詞欄只列 10 個（少「鷹眼」）。 以學習單為準 —— 第 (10) 小題的答案就是鷹眼，第七大題找字遊戲也要圈它。
