spotlight:
  lesson: G8-L3
  strategy_name: 寫作手法-對比-從對比歸納作者意圖
  strategy_type: writing_technique
  blocks:
  - type: free_text
    prompt: (6)他破產後(  G   )，過著有一頓沒一頓的辛苦日子。
  - type: free_text
    prompt: (7)叔叔欠債，被逼著還錢，這時卻又不幸失業，真的(  J   )了，只好向親友伸手求助。
  - type: free_text
    prompt: (8)外公以前走路很快，這兩年(  B   )，爬樓時得扶著扶手慢慢走。
  - type: guide
    text: 五文章重點表 五文章重點表
  - type: table
    rows:
    - - 爸爸的恩人們
    - - 現在爸爸的記憶（段1-2）
      - 爸爸九十四歲，記憶不行，記不得剛發生的事媽媽過世一年多，爸爸連媽媽過世也不記得。
    - - 轉折（段7）
      - 爸爸很多事都記不得了，但是還記得【】
    - - 列舉恩人(段8-11)
      - 戴校長（初中校長）：因為爸爸清晨要送牛奶，是全校唯一可以遲到的學生，還訂牛奶支持爸爸。林同學：請爸爸看電影、吃冰。蔡同學：把口琴借爸爸三年。阿公阿嬤：爸爸無父無母，爸爸為了去臺東讀初中，說服了老人家賣掉老家的菜園，搬到臺東，菜園賣了15,000元，但碰到惡性通貨膨脹，15,000元一夕變成廢紙，爸爸很自責爸爸講了更多人生中伸出援手的恩人。
    - - 爸爸的家境(段12)
      - 家裡很窮，沒東西吃，必須到漁港撿拾人家丟掉的魚內臟家裡【】，阿公靠著一把【】養家，撿漂流木、劈柴、賣柴。
    - - 貧困年代的見證(段13)
      - 作者把鏽跡斑斑的老斧頭裱框送給爸爸，紀念那個【】，卻彼此相愛的日子。
    - - 結尾(段14)
      - 在物資極度缺乏、經濟蕭條的時代，任何人給爸爸【】，爸爸就記一輩子，視為【】
    - - 反思段(段15-16)
      - 作者反問自己：「我有這麼多恩人嗎？」，在【】的年代，雖仍有許多值得感謝的人，但好像沒有可稱為恩人的。
    answers:
    - 八十年前的舊事
    - 一無所有
    - 斧頭
    - 貧無立錐
    - 一點點協助
    - 恩人
    - 物質充裕
  - type: guide
    text: 六閱讀聚光燈寫作手法——對比：從對比歸納作者意圖六閱讀聚光燈寫作手法——對比：從對比歸納作者意圖
  - type: guide
    text: 一、一起來看看本篇文章中的三組對比：
  - type: guide
    text: ◎找出對比的詞或句，並歸納對比想凸顯的重點。
  - type: table
    rows:
    - - 第一組(段7)「很多事都記不得了，但是……爸還記得八十年前的舊事……爸想得起來的，都是他的恩人。」
    - - 對比句型
      - 【】＋【】＋【】
    - - 句型關鍵詞
      - 但是
    - - 文句內容
      - A：記不得①洗過澡又問要不要洗②每次出門前問要去哪裡③忘了媽媽過世一年多
      - B：仍記得①仍記得八十年前舊事，且記得的都是「恩人」
    - - 落差焦點(複選)
      - □1.時間落差：近事 vs 舊事□2.內容落差：日常小事 vs 恩人恩情□3.人物落差：家人的提醒vs 爸爸的反應
    - - 凸顯重點(依序將重點填入句中)
      - 作者用「記不得  最近發生的事   」對比「仍記得  八十年前的恩人   」，想要強調的是：【】對爸爸的重要性。
    - - 回到理解
      - 作者已經用對比的手法，把「恩人」這個主題顯出來了，再來，我們就可以預期，後面很可能會進一步鋪陳許多恩人的故事。
    answers:
    - A：記不得
    - 但是
    - B：仍記得
    - 恩情／恩人
  - type: fill_table
  - type: table
    rows:
    - - 第三組：結尾反思（世代對照）「我有這麼多恩人嗎？……相較之下，我們這一代成長於物質相對充裕的年代，幾乎沒有走投無路的經驗……。」
    - - 對比句型
      - 【】VS【】
    - - 關鍵詞
      - 相較之下
    - - 文句內容
      - A：上一代的處境①在物資極度缺乏、經濟蕭條的時代，一點點協助就會被記一輩子
      - B：我們這代的處境①我們這一代物質相對充裕，幾乎沒有走投無路的經驗。②生命中仍然有許多值得感謝的人，但可以稱為「恩人」的好像沒有。
    - - 落差焦點(複選)
      - □1.地點落差：戰後貧苦的生活 vs 現代物質充裕的生活 □2.處境落差：匱乏、易陷困境 vs 充裕、較少絕境□3.容易把人稱「恩人」vs 較少有「被救一把」感覺
    - - 凸顯重點(依序將重點填入句中)
      - 作者用「【】」對比「【】」，想凸顯的是：不是現代人不會感恩，而是因為較少走投無路的經驗，雖然仍有感謝的人，但被稱為【】的，幾乎已經沒有了。
    answers:
    - A：上一代的處境
    - B：我們這代的處境
    - 上一代匱乏困難
    - 我們這代較少絕境
    - 恩人
  - type: guide
    text: 二、請試著自己找出下段文字的對比手法，和作者強調的重點：
  - type: passage
    source: unknown
    paragraphs:
    - 阿公菜園賣了一萬五千元，阿公當年笑呵呵，捧著一疊鈔票說，算命先生預言他有一天成為萬元戶，沒想到這麼快就成真了。沒想到，搬來台東不久，惡性通膨，舊台幣40,000元換新台幣1元，阿公的15,000元一夕變成廢紙。都是我害的，都是我害的
    - 對比落差：
    - 阿公拿著15,000元笑呵呵　vs 【　15,000元一夕變成廢紙　　】
    - 凸顯重點：　對比出阿公的重大損失，以及爸爸強烈的罪惡感
    - 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出文中的對比詞或對照句。
    - 我能分辨A、B兩邊分別寫什麼。
    - 我能說出兩邊的落差焦點。
    - 我能根據對比推論作者想強調的重點。
