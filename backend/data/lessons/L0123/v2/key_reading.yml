passage: 老人已經忘記了許多事情，但只要談起恩人，時隔80年，卻仍歷歷在目。替他繳了三年學費的電氣行李老闆、素昧平生卻在醫院伸出援手幫助他生病的阿嬤的曾護士、在國小服務時竭力為他爭取到宿舍的楊校長、服四個月補充兵役時，每人每月捐助5元，幫他的家庭度過難關的國小同事……說著說著，老人的眼中總泛起淚光。在那個物資極度缺乏、經濟蕭條的時代，任何人給爸爸一點點的協助，爸爸就記了一輩子，視為恩人。
