comprehension:
  questions:
  - index: 1
    answer: C
    stem: （段三、四）作者提醒爸爸「媽媽過世了」後，爸爸「眼睛瞪大」最可能代表什麼？
    options:
      B: 他想起往事所以興奮
      C: 他震驚且不敢相信
      D: 他早就知道所以冷淡
    rationale: C)爸爸接著追問「什麼時候的事？」代表他把這件事當成新消息
  - index: 2
    answer: D
    stem: 爸爸唱〈甜蜜的家庭〉時「泫然欲泣」，最可能的原因是什麼？
    options:
      B: 他想起這首歌的歌名與歌詞非常感人
      C: 他突然想起借他口琴的同學，很感恩
      D: 他的心被歌名「甜蜜的家庭」刺痛了
    rationale: D)歌名與歌詞的「甜蜜」反而撞上他的生命經驗（無父無母、缺乏家庭溫暖），因此觸動傷口而想哭
  - index: 3
    answer: A
    stem: 作者為何特別強調阿公賣菜園的15,000元「一夕變成廢紙」？
    options:
      A: 強調他對祖父的損失的罪惡感
      C: 強調老人家完全沒有理財的觀念
      D: 強調當年菜園若不要賣就好了
    rationale: A) 這段不是在講理財，而是在凸顯「努力與犧牲未必換來保障」，使「恩情」更沉重、更值得記一輩子
  - index: 4
    answer: C
    stem: 作者說「我們這一代好像沒有恩人」，他最可能想要強調什麼？
    options:
      A: 現代人比較自私，因此遇到困難也不太願意幫助別人
      B: 現代人缺乏道德教育，已經不會感謝幫助他的人了
      C: 現代人少有「走投無路」的經驗，所以恩人變少了
      D: 以前的人比較愛把恩情掛嘴邊，所以恩人特別多
    rationale: null
  - index: 5
    answer: A
    stem: 作者描寫他們把「鏽跡斑斑的老斧頭」裱裝加框，並題字紀念那個貧無立錐，卻彼此相愛的日子。這手法可以達成哪個目的？
    options:
      A: 以老斧頭象徵當年的艱困與情感，讓意象變得具體可見
      B: 透過描寫用裱框保護斧頭，表示裱框有防鏽的功能
      C: 把斧頭設計成一個伏筆，表示再來的情節會有大的突破
      D: 用裱框展示收藏品味與經濟能力，表示一切都已苦盡甘來
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 0
    verdict: ok
