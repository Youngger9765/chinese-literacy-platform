strategy_explained: 這篇文章要教你學會「對比」的寫作技巧，也就是透過比較不同事物來發現作者想傳達的訊息，你會發現爸爸即使記不清眼前的事，卻對八十年前幫助過他的人記憶猶新，正是這種「過去與現在」、「困難與溫暖」的對比，讓「恩人」的情感更加深刻，讀的時候，試著找出爸爸回憶中哪些地方形成了對比，想想這樣安排有什麼特別的用意
