  passage: 爸爸九十歲生日那天，我們把當年他阿公用來養家那把鏽跡斑斑的老斧頭裱裝加框，送給爸爸當禮物。斧頭旁的卡片上有爸爸顫巍巍的筆跡：「紀念那個貧無立錐，卻彼此相愛的日子。」老人已經忘記了許多事情，但只要談起恩人，時隔80年，卻仍歷歷在目。替他繳了三年學費的電氣行李老闆、素昧平生卻在醫院伸出援手幫助他生病的阿嬤的曾護士、在國小服務時竭力為他爭取到宿舍的楊校長、服四個月補充兵役時，每人每月捐助5元，幫他的家庭度過難關的國小同事……說著說著，老人的眼中總泛起淚光。在那個物資極度缺乏、經濟蕭條的時代，任何人給爸爸一點點的協助，爸爸就記了一輩子，視為恩人。「我有這麼多恩人嗎？」我反問自己。相較之下，我們這一代成長於物質相對充裕的年代，完全沒有那種走投無路的經驗，雖然生命中仍然有許多值得感謝的人，但可以稱為「恩人」的，好像一位也沒有了。
