version_id: v3
section_no: 六
spotlight:
  strategy_name: 寫作手法——對比：從對比歸納作者意圖
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層，5 個全為紅色）＋ 橘色手寫填空
  shape_note: "\U0001F534 這一節就是缺口清單上「blocks_present_but_none_renderable」的那一節。\n原稿是**三張各\
    \ 7 列的對比表**（第一組／第二組／第三組），每一張的列都固定是\n對比句型 → 關鍵詞 → 文句內容(A|B) → 落差焦點(打勾) → 凸顯重點(填空)\
    \ → 回到理解。\n表格型別在前端只把儲存格當純文字畫，選項不能作答，所以這裡：\n  · 純資訊的列（對比句型／關鍵詞／文句內容）→ `fill_table`，每列一個陣列，保留印出來的列名\n\
    \  · 打勾的列（落差焦點）→ `multi`，才作答得了\n  · 填空的列（凸顯重點）→ `sub_block` + 【　】 + blanks\n \
    \ · 敘述的列（回到理解）→ `guide`\n第三組原稿**沒有印「回到理解」那一列**（第一、二組有），所以這裡也不補。"
  blocks:
  - type: concept_box
    text: '對比的寫作手法有三個特色：

      把兩種差異超級大的情況放在一起，讓讀者有：「哇嗚，怎麼有這麼大的落差！」的感覺。

      作者用這樣令人驚訝的落差，目的是要強調文章的某一個重點。

      有「對比」時，作者常會用到「但是／卻／相較之下」等轉折詞。'
    text_note: 三個特色在原稿是 Word 自動編號的 1./2./3. 清單，編號不在 w:t 文字流裡，所以這裡不寫編號。
  - type: guide
    text: 一、一起來看看本篇文章中的三組對比：
  - type: guide
    text: ◎找出對比的詞或句，並歸納對比想凸顯的重點。
  - type: guide
    text: 第一組(段7)「很多事都記不得了，但是……爸還記得八十年前的舊事……爸想得起來的，都是他的恩人。」
  - type: fill_table
    rows:
    - - 對比句型
      - 【A：記不得】＋【但是】＋【B：仍記得】
    - - 句型關鍵詞
      - 但是
    rows_note: 「【A：記不得】＋【但是】＋【B：仍記得】」裡的方括號是句型示意，不是填空
  - type: fill_table
    rows:
    - - 文句內容
      - 'A：記不得

        ①洗過澡又問要不要洗

        ②每次出門前問要去哪裡

        ③忘了媽媽過世一年多'
      - 'B：仍記得

        ①仍記得八十年前舊事，且記得的都是「恩人」'
  - type: multi
    prompt: 落差焦點(複選)
    options:
      1: 時間落差：近事 vs 舊事
      2: 內容落差：日常小事 vs 恩人恩情
      3: 人物落差：家人的提醒vs 爸爸的反應
    answers:
    - 1
    - 2
  - type: sub_block
    label: 凸顯重點(依序將重點填入句中)
    value: 作者用「記不得【　】」對比「仍記得【　】」，想要強調的是：【　】對爸爸的重要性。
    blanks:
    - answer: 最近發生的事
    - answer: 八十年前的恩人
    - answer: 恩情／恩人
    answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
  - type: guide
    text: '回到理解

      作者已經用對比的手法，把「恩人」這個主題顯出來了，再來，我們就可以預期，後面很可能會進一步鋪陳許多恩人的故事。'
  - type: guide
    text: 第二組(段10)「（爸爸）說著說著，哼起歌來……泫然欲泣……『我哪裡來的甜蜜的家庭？我從小就無父無母……』」
  - type: fill_table
    rows:
    - - 對比句型
      - 【A：甜蜜意象】VS 【B：落淚情緒】
    - - 關鍵詞
      - 甜蜜的家庭／無父無母的家庭
    rows_note: 這一組的列名印「關鍵詞」，第一組印「句型關鍵詞」——原稿就不一致，照抄
  - type: fill_table
    rows:
    - - 文句內容
      - 'A：甜蜜意象

        ①歌名是「甜蜜的家庭」'
      - 'B：落淚情緒

        ①爸爸唱著唱著泫然欲泣

        ②爸爸說：「我哪裡來的甜蜜的家庭？我從小就無父無母……」'
  - type: multi
    prompt: 落差焦點(二選一)
    options:
      1: 技巧落差：吹口琴很熟練 vs 歌唱很走音
      2: 情緒落差：甜蜜的家庭 vs 不堪提起的家庭
    answers:
    - 2
    options_note: 原稿印「(二選一)」但仍用□，所以型別記 multi、答案只有一個
  - type: sub_block
    label: 凸顯重點(依序將重點填入句中)
    value: 作者用「【　】」對比「【　】」，想凸顯的是：爸爸想到自己的【　】，所以情緒才會被放大。
    blanks:
    - answer: 歌名甜蜜的家庭
    - answer: 自己不堪提起的家庭
    - answer: 身世缺憾／家庭傷口
    answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
  - type: guide
    text: '回到理解

      接下來讀例子時，請注意：恩人不只幫忙解決生活問題，也可能在他想起傷口時，仍有人用行動讓他感到溫暖、不孤單。'
  - type: guide
    text: '第三組：結尾反思（世代對照）

      「我有這麼多恩人嗎？……相較之下，我們這一代成長於物質相對充裕的年代，幾乎沒有走投無路的經驗……。」'
  - type: fill_table
    rows:
    - - 對比句型
      - 【A：上一代的處境】VS【B：我們這代的處境】
    - - 關鍵詞
      - 相較之下
  - type: fill_table
    rows:
    - - 文句內容
      - 'A：上一代的處境

        ①在物資極度缺乏、經濟蕭條的時代，一點點協助就會被記一輩子'
      - 'B：我們這代的處境

        ①我們這一代物質相對充裕，幾乎沒有走投無路的經驗。

        ②生命中仍然有許多值得感謝的人，但可以稱為「恩人」的好像沒有。'
  - type: multi
    prompt: 落差焦點(複選)
    options:
      1: 地點落差：戰後貧苦的生活 vs 現代物質充裕的生活
      2: 處境落差：匱乏、易陷困境 vs 充裕、較少絕境
      3: 容易把人稱「恩人」vs 較少有「被救一把」感覺
    answers:
    - 2
    - 3
  - type: sub_block
    label: 凸顯重點(依序將重點填入句中)
    value: 作者用「【　】」對比「【　】」，想凸顯的是：不是現代人不會感恩，而是因為較少走投無路的經驗，雖然仍有感謝的人，但被稱為【　】的，幾乎已經沒有了。
    blanks:
    - answer: 上一代匱乏困難
    - answer: 我們這代較少絕境
    - answer: 恩人
    answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
  - type: guide
    text: 二、請試著自己找出下段文字的對比手法，和作者強調的重點：
  - type: passage
    paragraphs:
    - 阿公菜園賣了一萬五千元，阿公當年笑呵呵，捧著一疊鈔票說，算命先生預言他有一天成為萬元戶，沒想到這麼快就成真了。沒想到，搬來台東不久，惡性通膨，舊台幣40,000元換新台幣1元，阿公的15,000元一夕變成廢紙。都是我害的，都是我害的
    paragraphs_note: '這是**改寫過的練習用引文**，跟課文第 11 段不完全相同（台東/臺東、舊台幣/舊臺幣、

      惡性通膨/惡性通貨膨脹、句末無句號、「沒想到」出現兩次）。照原稿抄，不改成課文版。'
  - type: sub_block
    label: 對比落差：
    value: 阿公拿著15,000元笑呵呵　vs 【　】
    blanks:
    - answer: 15
      000元一夕變成廢紙: null
    answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
  - type: sub_block
    label: 凸顯重點：
    value: 【　】
    blanks:
    - answer: 對比出阿公的重大損失，以及爸爸強烈的罪惡感
    answer_carrier: 橘色手寫（C:E97132），文字流有此資訊；原稿這一行只印底線，沒有印【 】
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出文中的對比詞或對照句。
    - 2.我能分辨A、B兩邊分別寫什麼。
    - 3.我能說出兩邊的落差焦點。
    - 4.我能根據對比推論作者想強調的重點。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
