section_no: 五
keypoints:
  title: 爸爸的恩人們
  layout: list
  answer_carrier: 橘色手寫（教師版答案）；答案寫在【 】之內，文字流有此資訊
  rows:
  - label: 現在爸爸的記憶（段1-2）
    value: '爸爸九十四歲，記憶不行，記不得剛發生的事

      媽媽過世一年多，爸爸連媽媽過世也不記得。'
  - label: 轉折（段7）
    value: 爸爸很多事都記不得了，但是還記得【　】
    blanks:
    - answer: 八十年前的舊事
  - label: 列舉恩人(段8-11)
    value: '戴校長（初中校長）：因為爸爸清晨要送牛奶，是全校唯一可以遲到的學生，還訂牛奶支持爸爸。

      林同學：請爸爸看電影、吃冰。

      蔡同學：把口琴借爸爸三年。

      阿公阿嬤：爸爸無父無母，爸爸為了去臺東讀初中，說服了老人家賣掉老家的菜園，搬到臺東，菜園賣了15,000元，但碰到惡性通貨膨脹，15,000元一夕變成廢紙，爸爸很自責

      爸爸講了更多人生中伸出援手的恩人。'
  - label: 爸爸的家境(段12)
    value: '家裡很窮，沒東西吃，必須到漁港撿拾人家丟掉的魚內臟

      家裡【　】，阿公靠著一把【　】養家，撿漂流木、劈柴、賣柴。'
    blanks:
    - answer: 一無所有
    - answer: 斧頭
  - label: 貧困年代的見證(段13)
    value: 作者把鏽跡斑斑的老斧頭裱框送給爸爸，紀念那個【　】，卻彼此相愛的日子。
    blanks:
    - answer: 貧無立錐
  - label: 結尾(段14)
    value: 在物資極度缺乏、經濟蕭條的時代，任何人給爸爸【　】，爸爸就記一輩子，視為【　】
    blanks:
    - answer: 一點點協助
    - answer: 恩人
  - label: 反思段(段15-16)
    value: 作者反問自己：「我有這麼多恩人嗎？」，在【　】的年代，雖仍有許多值得感謝的人，但好像沒有可稱為恩人的。
    blanks:
    - answer: 物質充裕
