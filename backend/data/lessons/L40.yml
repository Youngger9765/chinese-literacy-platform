multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 阿公有老花眼，只要沒戴眼鏡看東西都「眼花撩亂」。
  - 早餐店突然湧入人潮，老闆來不及出餐給客人，真是「目不暇給」。
  - 這篇新聞報導的標題「聳動」，這麼無聊的標題誰會想看。
  - 他這次會考作文寫的「文不對題」，難怪得不到高分。
  answer: D
  explanation: 「文不對題」的意思是文章內容和題目的意思不符合，這與作文寫作不符題意而導致低分的語境完全吻合。
- question: 「誘餌式標題」通常文字聳動，吸引人們點擊，以下哪個不屬於「誘餌式標題」？
  options:
  - 藝人飆唱歌曲「煎熬」，慘烈破音差點斷氣
  - 女子吃一大盤菠菜，沒想到換來終身洗腎！
  - 天天騎機車上下班，40歲的她居然……？
  - 調查發現：寵物餐廳超過四成場地不合法
  answer: D
  explanation: 「誘餌式標題」通常會利用引發好奇心、誇張的句子、誇大的情緒字眼或利用熱門話題來吸引點擊。選項A、B、C都明顯運用了這些技巧，例如誇大結果、製造懸念或驚人反轉來勾起讀者好奇心。而選項D的標題是客觀地呈現
- question: 誘餌式標題頻繁出現在我們的生活中，面對這些亂象，下面哪個做法較不恰當？
  options:
  - 要對誇張的標題保持警戒。
  - 不再閱讀所有的報章雜誌。
  - 核對標題與內容的一致性。
  - 努力培養獨立思考的能力。
  answer: B
  explanation: 面對誘餌式標題，應培養獨立思考與查證的能力，而非因噎廢食，完全停止閱讀所有報章雜誌。
- question: 以下哪些是誘餌式標題的特徵？
  options:
  - 甲乙丙丁
  - 乙丙丁戊
  - 甲乙丙戊
  - 甲丙丁戊。
  answer: A
  explanation: 課文中「誘餌式標題顯微鏡」部分直接列出了四種「引誘手段代號」，分別為「引發好奇心」、「用誇張的句子」、「誇大的情緒字眼」以及「利用熱門的話題或公眾人物」，這些都是誘餌式標題的明確特徵，若選項中的甲乙丙
- question: 這篇文章的作者最想達成什麼目的？
  options:
  - 想要博取讀者的目光，對這篇文點讚。
  - 想要提醒讀者如何有智慧地閱讀網路文章。
  - 想要教導讀者避免寫出文不對題的文章。
  - 想要教導讀者寫作時如何下標。
  answer: B
  explanation: 這篇文章的重點在於教導讀者辨識並分析「誘餌式標題」的各種手法，提醒讀者不要輕易受其影響，進而達到有智慧地閱讀網路文章的目的。
