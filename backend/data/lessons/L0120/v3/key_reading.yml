  passage: 鬼火通常出現在炎熱的夏天，夜裡趕路的行人經過墳場時，就可能看見黑暗中閃爍飄動的淡藍色或淡綠色的火焰，讓人毛骨悚然。人類是唯一會想像死後世界的動物，暗夜裡在墳場乍見搖曳浮盪的藍焰，人們難免聯想到鬼魂，說不害怕還真不可能。新聞節目說，曾經有盜墓賊在烏漆墨黑的墳場被鬼火嚇跑，甚至被活活嚇死。科學界對鬼火現象提出一個解釋──人類及動物的遺骸腐化後，產生了「磷化氫」，這種氣體很輕，燃點很低，從地底浮到地面後，在常溫下就會自燃。但是，這個說法最啟人疑竇之處：鬼火是藍色的，但磷化氫燃燒起來是明亮的黃光。後來一名英國地理學家提出了修正的解釋──冷焰。屍體腐壞後散發出的磷化氫和濕地的沼氣及空氣混合，形成燃點很低的可燃氣體，攝氏30度左右就可以燃燒，但它的燃燒不劇烈，必須在非常暗的地方才可看見，而且顏色多為藍色或淡紫色，所以被稱為「冷焰」。如果這個說法正確，就可以解釋為什麼最常見到鬼火的時間是夏天，地點是墳場了。
  start_text: 鬼火通常出現在炎熱的夏天，夜裡趕路的行人經過墳場
