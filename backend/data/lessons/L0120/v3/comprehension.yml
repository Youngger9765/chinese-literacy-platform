lesson_uid: L0120
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列語詞何者用法使用正確?
    options:
      A: 面對惡犬，他「毛骨悚然」，完全不畏懼
      B: 「乍見」新年的曙光，讓人內心雀躍不已
      C: 他能言善道，完全不像個「喑啞」人士
      D: 這棟鬼屋傳說眾多，真是「窮凶極惡」之地
    teacher_note: '(A)前後句矛盾

      (C)前後矛盾，瘖啞人士不會說話

      (D)通常形容人罪大惡極'
  - index: 2
    answer: D
    stem: 有關「睡眠癱瘓症」的描述，何者正確？
    options:
      A: 通常發生在睡眠時的深睡期
      B: 絕大多數的人會頻繁發生睡眠癱瘓
      C: 作噩夢時，身體可以自由移動
      D: 癱瘓現象是人體在睡眠中的保護機制
    teacher_note: '(A)快速眼動期

      (B)暫時性的發生

      (C)因為還在作夢，所以無法馬上移動。'
  - index: 3
    answer: C
    stem: 人們常常聽到「鬼火」與「鬼壓床」的經驗，請問兩者的共同之處為何？
    options:
      A: 都是鬼魂想要向人世間傳達訊息的一種手段
      B: 只有在深度睡眠時期，才可能會發生這種現象
      C: 都是人類對未知事物的恐懼感所產生的解釋
      D: 都是身體的自我保護，以避免人在黑暗中受傷
    teacher_note: (C)（因為人對未知事物的恐懼，才把一些科學可解釋的現象往靈異方面解釋。）
  - index: 4
    answer: D
    stem: 根據本文結論，如果遇到超自然事件時，哪一個選項不符合現代科學的精神？
    options:
      A: 調整思考，依據科學的角度去解釋異狀
      B: 心理治療，透過專業協助，找到問題的根源
      C: 身體檢查，看看是否有腦部或癲癇等疾病
      D: 敬畏鬼神，常去廟裡收驚、拜拜、保平安
    teacher_note: (D)（依據本文結尾理性的科學方法，將可以幫助我們更進一步對現象有客觀的認識，所以未必每件事都是鬼怪之說。）
  - index: 5
    answer: A
    stem: 解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。  以「止癢」為例，請將代號依步驟排出正確的順序。
    material:
    - 甲.我推測抓癢時會產生痛覺，我們抓癢是想要用「痛覺」蓋過「癢覺」。
    - 乙.為什麼身體癢時，會用抓癢來止癢？我們受傷時並不會想抓傷口來止痛？
    - 丙.下次蚊子叮咬時，可以拍打被叮的位置試試看，是否能止癢。
    material_note: 'PDF p9 的方框裡只看得到甲、乙兩項，丙被下方的圓形圖案壓住沒印出來 ——

      但「丙.下次蚊子叮咬時…」在 document.xml 的文字流裡，是轉檔缺陷不是教材缺項。'
    options:
      A: 乙甲丙
      B: 乙丙甲
      C: 甲乙丙
      D: 丙乙甲
  notes:
    answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊；解析印在右側藍色小方框
