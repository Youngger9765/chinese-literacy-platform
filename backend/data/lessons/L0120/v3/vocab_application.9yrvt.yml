  synonym_compound:
    title: ◎同義複詞
    definition: 由二個同義或近義的字，結合而成的複詞。
    rows:
    - label: 1.舉例
      value: '(1)聆聽，聆＝聽。(2)美麗，美＝麗。

        (3)肥胖，肥＝胖。

        ※注意：

        胖子，胖≠子，因為胖是胖，子是人的意思

        →「胖子」指的是胖的人。

        美女，美≠女，因為美是美麗，女是女生的意思

        →「美女」指的是美麗的女生。'
