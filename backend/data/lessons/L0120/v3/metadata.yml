strategy_explained: '這一課我們練習用科學的方法來找出事物的真相

  因為這篇文章用科學解釋了鬼火和鬼壓床這些過去被認為是靈異的現象

  所以讀的時候，你可以試著像作者一樣，看看能不能從現象背後找到合理的解釋'
