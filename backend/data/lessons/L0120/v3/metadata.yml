intro: 這篇文章探討了人們普遍感到害怕的「鬼火」和「鬼壓床」這兩種現象。作者首先點出，無論古今中外，人們都對鬼魂和死後世界感到恐懼，這些也常成為故事的題材。接著，文章分別介紹了科學家如何從理性的角度解釋鬼火的成因，以及「鬼壓床」這種在睡眠中動彈不得的感覺，其實是睡眠週期中的一種正常生理現象。透過這些科學的解釋，讓我們對這些看似神祕的現象有更客觀的認識，也引發我們思考，科學的發展如何改變了我們對世界的看法。
