spotlight:
  lesson: G8-L22
  strategy_name: 科學探究策略-假設與假設檢驗
  strategy_type: scientific_inquiry
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：科學探究策略
  - type: guide
    text: 一、鬼火是怎麼回事？科學探究的步驟
  - type: passage
    source: unknown
    paragraphs:
    - 在夏天的夜裡，有人在墳場看見黑暗中閃爍飄動的淡藍色或淡綠色的火焰，除了毛骨悚然的感覺之外，他會好奇地：
  - type: free_text
    prompt: 1.提出問題：
  - type: passage
    source: unknown
    paragraphs:
    - 「墳場夏夜裡閃爍飄動的藍綠火焰是怎麼回事？」
    - 針對這個問題，人們提出了幾個可能的解釋，這些解釋在科學程序裡被稱為【　　假設　　　】。底下是人們提出的幾個假設：
  - type: free_text
    prompt: 2.提出假設：
  - type: single
    prompt: 底下哪一個假設是可以蒐集資料來檢驗真假的？（2選1）
    options:
    - 假設一：鬼火是屍骸腐化後所產生的磷化氫，它很輕、燃點很低，從地底浮起後會自燃起來
    - 假設二：鬼火是心有不甘的人死後變成的鬼魂，在暗夜的墳場出來，想要抓交替
    answer: 假設一：鬼火是屍骸腐化後所產生的磷化氫，它很輕、燃點很低，從地底浮起後會自燃起來
  - type: free_text
    prompt: 3.檢驗假設：
  - type: single
    prompt: (1)如果「假設一：鬼火就是磷化氫」是真的，這個假設無法解釋哪一個現象？（單選；參考第三段的說明）
    options:
    - 鬼火會自己燃燒
    - 鬼火是藍綠色的
    - 鬼火會飄浮
    - 鬼火出現在墳場
    answer: 鬼火會自己燃燒
  - type: single
    prompt: (2)磷化氫燃燒時是明亮的黃光，但鬼火是藍綠光；從這裡看，「假設一：鬼火就是磷化氫」能接受嗎？需要修正嗎？
    options:
    - 要接受這個假設，不需要修正
    - 要拒絕這個假設，需要修正
    answer: 要接受這個假設，不需要修正
  - type: free_text
    prompt: 3.１提出新的（修正後的）假設：
  - type: single
    prompt: (3)根據課文第三段，有位英國地理學家提出了修正的假設，請問這修正假設的程序是在圖１的什麼地方？（請參照圖1作答；單選）
    options:
    - 證據支持假設，問題終於得到解決
    - 證據支持假設，鬼火是藍綠色的
    - 證據不支持原來的假設，回頭修正原來的假設
    - 證據不支持原來的假設，回頭修正原來的問題
    answer: 證據支持假設，問題終於得到解決
  - type: free_text
    prompt: 4.問題解決：
  - type: single
    prompt: 根據課文，這個關於「鬼火是怎麼回事」的研究問題，得到解決了嗎？
    options:
    - 得到解決：鬼火是磷化氫＋沼氣＋空氣
    - 未能解決：鬼火仍是個謎
    answer: 得到解決：鬼火是磷化氫＋沼氣＋空氣
  - type: guide
    text: 二、小試身手：
  - type: guide
    text: 請閱讀以下關於「假設與假設檢驗」的案例後，回答相關的問題。
  - type: passage
    source: unknown
    paragraphs:
    - 15世紀到18世紀的幾百年間，許多在海上長時航行的水手死於壞血病，他們先是牙齦、皮膚出血、到後來會全身出血而亡。當時的醫學對壞血病成因的假設是「瘴氣」——船艙狹小不通風，船員長時在壞空氣裡生活，因此得了壞血病。但是，所有改善船艙空氣的嘗試都無法降低壞血病的出現率。1753年，英國的海軍軍醫林德發現，讓船員吃柑橘類的食物可以治療、預防壞血病，人們才開始相信壞血病不是外來的壞東西引起的，而是身體缺少了某種營養素。但一直到20世紀，科學家才找到這種物質，並稱它為「維他命C」。
  - type: free_text
    prompt: 1.提出問題：
  - type: passage
    source: unknown
    paragraphs:
    - 「是什麼讓船員得到壞血病？」
    - 針對這個問題，早期的醫學人們提出一個可能的解釋，這些解釋在科學程序裡被稱為【　　　假設　　　】。
  - type: free_text
    prompt: 2.提出假設：
  - type: passage
    source: unknown
    paragraphs:
    - 底下哪一個是早期醫學提出的假設？（2選1）
  - type: single
    prompt: 請選擇
    options:
    - 假設一：壞血病是身體缺少某一種營養素而導致的疾病。
    - 假設二：壞血病是壞空氣所致，船員吸進船艙裡的壞空氣，就生病了。
    answer: 假設一：壞血病是身體缺少某一種營養素而導致的疾病。
  - type: free_text
    prompt: 3.檢驗假設：
  - type: single
    prompt: (1)如果「假設二：壞血病是壞空氣所致是真的，那麼這個假設無法解釋哪一個現象？（單選）
    options:
    - 為什麼長時在海上航行的船員會生病
    - 改善空氣的嘗試，無法減少壞血病
    answer: 為什麼長時在海上航行的船員會生病
  - type: single
    prompt: (2)「改善空氣不能減少壞死病」，從這裡看，「壞血病是壞空氣所致」是正確的嗎？
    options:
    - 是正確的，要拒絕這個假設
    - 是不正確的，要拒絕這個假設
    answer: 是正確的，要拒絕這個假設
  - type: free_text
    prompt: 3.１原來假說未得支持，然後呢？
  - type: single
    prompt: (3)現在知道「改善空氣不能減少壞血病」你是科學探究者，下一步該做什麼呢？請在圖１找到你可以進行的程序？（請參照圖1作答；單選）
    options:
    - 拒絕「瘴氣假說」，另提新假說
    - 拒絕「瘴氣假說」，放棄這個問題
    - 接受「瘴氣假說」，另提新假說
    - 接受「瘴氣假說」，放棄這個問題
    answer: 拒絕「瘴氣假說」，另提新假說
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我知道，為得到解答，可透過「提出問題→提出假設→檢驗假設」的科學探究程序。
    - 我能看出「假設，其實就是對一個研究問題的解釋」。
    - 我知道，假設不一定正確；假設要有證據支持，才能成立。
    - 我知道，當證據不支持假設時，必須拒絕假設，重提新的假設。
