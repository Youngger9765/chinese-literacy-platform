    answer: B
    stem: 下列語詞何者用法使用正確?
    options:
      B: 「乍見」新年的曙光，讓人內心雀躍不已
      C: 他能言善道，完全不像個「喑啞」人士
      D: 這棟鬼屋傳說眾多，真是「窮凶極惡」之地
    rationale: C)前後矛盾，瘖啞人士不會說話
  - index: 2
    answer: D
    stem: 有關「睡眠癱瘓症」的描述，何者正確？
    options:
      A: 調整思考，依據科學的角度去解釋異狀
      C: 身體檢查，看看是否有腦部或癲癇等疾病
      D: 敬畏鬼神，常去廟裡收驚、拜拜、保平安
      B: 心理治療，透過專業協助，找到問題的根源
    rationale: C)因為還在作夢，所以無法馬上移動。
  - index: 5
    answer: A
    stem: 解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。  以「止癢」為例，請將代號依步驟排出正確的順序。
    options:
      A: 乙甲丙
      B: 乙丙甲
      C: 甲乙丙
      D: 丙乙甲
    rationale: 甲.我推測抓癢時會產生痛覺，我們抓癢是想要用「痛覺」蓋過「癢覺」。
