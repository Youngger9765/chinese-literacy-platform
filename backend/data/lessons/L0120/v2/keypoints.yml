      template: 鬼 壓 床
      blanks:
      - answer: 鬼火
        hint: ''
  - label: 現象
    sub_rows:
    - sub_label: 黑暗中閃爍飄動的藍綠色火焰。
      template: 入睡或剛醒來時，感覺自己被一股力量壓著，動彈不得。
      blanks: []
  - label: 靈異的解釋
    sub_rows:
    - sub_label: 鬼火代表死者的鬼魂。
      template: 鬼魂壓制了睡眠者，想要傳達__的訊息。
      blanks:
      - answer: 警告
        hint: ''
  - label: 科學界的解釋
    sub_rows:
    - sub_label: (1)人類及動物的遺骸腐化後，產生磷化氫氣體，在常溫下__。(2)磷化氫和沼氣、空氣混合，形成燃點很低的可燃氣體，30度便可自燃，要在非常暗的地方才可以看得到，顏色為藍色或淡紫色，稱為__。
      template: (1)人類每晚有四到六次的睡眠週期，每次約90分鐘。(2)大腦在__最為活躍，正在作夢的睡眠者此時無法控制自己的肌肉，癱軟無力。(3)鬼壓床又稱__，是因為身體有自我保護機制，避免作夢時讓身體受傷。
      blanks:
      - answer: 自燃
        hint: ''
      - answer: 冷焰
        hint: ''
      - answer: 快速眼動期
        hint: ''
      - answer: 睡眠癱瘓症
        hint: ''
  - label: 結論
    value: 用科學方法，讓我們對未知的現象有了合理的解釋，因此把鬼魅的說法從我們的世界裡驅除了。
    blanks: []
  title: 靈異與科學
