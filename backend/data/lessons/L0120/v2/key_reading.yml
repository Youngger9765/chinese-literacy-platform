passage: 鬼火通常出現在炎熱的夏天，夜裡趕路的行人經過墳場時，就可能看見黑暗中閃爍飄動的淡藍色或淡綠色的火焰，讓人毛骨悚然。人類是唯一會想像死後世界的動物，暗夜裡在墳場乍見搖曳浮盪的藍焰，人們難免聯想到鬼魂，說不害怕還真不可能。新聞節目說，曾經有盜墓賊在烏漆墨黑的墳場被鬼火嚇跑，甚至被活活嚇死。
