spotlight:
  lesson: G7-L2
  strategy_name: 推論策略-找觀點與理由，推隱含意義
  strategy_type: main_idea_inference
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: ※ 如果你有做到下列事項，請在□內打勾。
  - type: guide
    text: 一、作者在第一段提出了什麼「問題」？
  - type: passage
    source: unknown
    paragraphs:
    - 先看第一段：根據開頭「公民課月經討論」的情境，作者想讓讀者思考的問題是什麼？（請打勾，單選）
  - type: single
    prompt: □①月經之所以被汙名化的原因是什麼？
    options:
    - AI功能越來越強，我們是否仍有學習的必要？
    - AI提供的所有資料是否都正確可靠？
    answer: AI功能越來越強，我們是否仍有學習的必要？
  - type: guide
    text: 二、作者的回答：從各段標題找作者觀點、支持理由與隱含意義
  - type: guide
    text: 步驟❶找作者觀點
  - type: single
    prompt: 請你看四、五段，作者的觀點是什麼？（請打勾，單選）
    options:
    - AI能快速回答問題，但真正的學習仍需要人主動提出值得追問的問題。
    - AI能在短時間提供各種資料，因此只要學會下指令就能完成學習。
    - AI能自行判斷哪一個問題最重要，不需要使用者再深入思考。
    answer: AI能快速回答問題，但真正的學習仍需要人主動提出值得追問的問題。
  - type: guide
    text: 步驟❷找支持理由
  - type: guide
    text: 祕訣：支持理由常是事實、研究、例子或說明，可能出現在觀點之前或之後。
  - type: passage
    source: unknown
    paragraphs:
    - 找一找，第四、五段作者提出「AI不懂發問」的觀點，底下哪一選項是作者提出的支持理由？（請打勾，單選）
  - type: multi
    prompt: 請選擇
    options:
    - AI能在很短的時間蒐集到大量資料，並列表整理出影響「月經汙名化」的各種歷史與文化的原因。
    - AI能協助使用者快速完成「月經汙名化」報告與分析，並提供使用者它最推薦的說法，及進一步的搜尋建議。
    - 作者舉例，AI雖能列出「月經汙名化」的原因，但無法提出「生活中還有類似偏見嗎？」這類重要的問題。
    answer:
    - AI能在很短的時間蒐集到大量資料，並列表整理出影響「月經汙名化」的各種歷史與文化的原因。
    - AI能協助使用者快速完成「月經汙名化」報告與分析，並提供使用者它最推薦的說法，及進一步的搜尋建議。
    - 作者舉例，AI雖能列出「月經汙名化」的原因，但無法提出「生活中還有類似偏見嗎？」這類重要的問題。
  - type: guide
    text: 步驟❸推論隱含意義
  - type: passage
    source: unknown
    paragraphs:
    - 祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）
  - type: guide
    text: ⑴觀點：「AI時代，人類更要會發問。」
  - type: guide
    text: ⑵理由：學習者需要主動判斷什麼值得繼續追問，才能深入思考與理解。
  - type: single
    prompt: ⑶我讀到的結論是什麼？（請打勾，單選）
    options:
    - 學習最重要的是避免接觸AI的錯誤資訊。
    - 學習的價值不只在取得答案，而在能主動思考與提出問題。
    - 只要AI再進步一點，就能替人決定所有值得追問的問題。
    answer: 學習的價值不只在取得答案，而在能主動思考與提出問題。
  - type: guide
    text: 三、小試身手
  - type: passage
    source: unknown
    paragraphs:
    - 上面我們用「三步驟」練習了一個觀點，在這篇文章中，作者還提出其他重要觀點。接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。
  - type: table
    rows:
    - - 作者的疑問
      - AI的功能越來越強，讓人懷疑學習是否還有必要?
    - - 作者的回答
      - （段落）觀點
      - 支持理由
      - '推論隱含意義

        （我讀到的結論）'
    - - 作者的回答
      - '（4~5）

        AI時代，人類更要會發問。'
      - AI能列出月經汙名化的多項原因，但「為什麼觀念持續存在」「生活中有沒有類似偏見」仍需要學習者主動追問。
      - 學習的價值不在記住答案，而在能主動思考、提出問題。
    - - 作者的回答
      - '（6~7）

        □①終有一天，AI也能像人一樣感受情緒與共鳴。

        ②AI雖能生成文字、分析資料，但無法取代人類真實的生活經驗與情感體驗。'
      - '①研究指出，讀者較容易對人類作者的故事產生情感共鳴。

        ②AI可以分析戰術、提供攻略，卻不能代替人親自練習、和隊友磨合，或感受突破難關的成就。

        □③AI生成的作文語句流暢，學生可直接交出，不必再判斷或修改。'
      - '□①只要AI把故事寫得更像真人，人類就不必再親自體驗。

        ②AI時代更要重視親身參與和情感連結，因為真正的體驗無法由AI代替。'
    - - 作者的回答
      - '（8~9）

        ①AI時代，要更會判斷

        □②只要AI能快速完成作文，就代表學習更有效率。'
      - '①「我的夢想」作文例子中，學生沒有照抄AI，而是用自己的想法改寫成真實經驗。

        □②AI能提供創作靈感，是人類的最佳夥伴。'
      - '□①AI永遠比人類聰明，所以學生的負擔大為減輕。

        ②聰明的學習者會駕馭AI：吸收建議、保留判斷、創造自己的作品。'
  - type: guide
    text: 四、推論主旨與寫作目的
  - type: passage
    source: unknown
    paragraphs:
    - 本文的觀點鋪陳：作者先以「AI回答月經問題」開場，指出AI的能力令人驚嘆，卻也引發「我們還需要學習嗎？」的思考。接著從三個面向說明——發問、體驗、判斷——來強調人類學習的價值。最後呼應開頭，指出「學習」仍是人類探索與成長的起點。
    - 根據以上鋪陳，請你做適當推論，並在底下選出本文主旨。（單選）
    - □①AI越進步，人類的學習重點仍然不會有所變。
    - ②AI時代裡，人類的發問、體驗與判斷能力更為重要。
    - □③學習的主要目的，是學會如何使用AI來節省時間。
    - 推論作者寫作目的：作者希望我們未來可以怎麼做？（單選）
    - ①善用AI協助學習，並保有自己的思考與創造。
    - □②把所有作業交給AI處理，節省時間。
    - □③不再使用AI，完全回到傳統學習方式。
  - type: guide
    text: ※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！
  - type: self_check
    items:
    - 我能找到作者的觀點。
    - 我能找到支持作者觀點的理由或證據。
    - 我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。
