comprehension:
  questions:
  - index: 1
    answer: A
    stem: 請問下列語詞，何者使用正確？
    options:
      A: 不需要，因為AI足以取代所有的學習過程
      B: 學習應更加重視「發問、體驗與判斷」
      C: AI可以回答問題，因此學生可以減少思考
      D: 擔憂AI出現後，學生記憶力、計算力下降
    rationale: 作者強調的是人類思考與體驗的不可取代性，而不是條件式或部分需要的說法。
  - index: 4
    answer: D
    stem: 作者以「月經汙名化」作為開頭例子，其作用最可能是什麼？
    options:
      A: 強調長久以來女性在生理議題上的委屈與不被理解
      B: 點出學生太依賴AI搜尋資料，缺乏自主思考能力
      C: 說明AI能解決社會性別平等問題，展現科技的進步
      D: 用生活化情境引出使用AI與人類學習的核心問題
    rationale: null
  - index: 5
    answer: C
    stem: 下列哪一種做法最符合本課作者對學生使用AI的主張？
    options:
      A: 學生用AI找到課文的重點，然後背誦這些重點
      B: 學生用 AI 分析自己的學習，並照AI的建議行動
      C: 學生利用AI查資料後，自己整理出觀點與問題
      D: 學生把報告交給 AI 完成，最後加上一句自己的心得
    rationale: 第5題解析：A、B、D是錯誤選項，它們的共同問題是：缺乏自主思考。A-看似合理（有整理重點），但缺乏「自己詮釋」。B-看似幫助學習，但學生仍是被動接受。D-看似有成果，但學生沒有參與思考過程。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 0
    verdict: ok
