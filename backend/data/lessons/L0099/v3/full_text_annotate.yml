  paragraph_count: 10
  section_subheads:
  - after_paragraph: 3
    text: AI時代，要更會發問
  - after_paragraph: 5
    text: AI時代，要更重視體驗
  - after_paragraph: 7
    text: AI時代，要更懂得判斷，不被AI牽著鼻子走
  paragraphs:
  - idx: 1
    text: 公民課，老師請大家分組討論「月經」這個主題，你打開手機問AI：「為什麼月經會被汙名化？」只不過轉瞬之間，螢幕上便出現一篇看似完整的分析，從歷史文化、性別刻板印象，到現代教育的缺口，AI列出了一連串原因，甚至還附上改善建議。你看著這些文字，心裡不免浮現一個想法：如果AI又快、整理得又完善，我們還需要辛辛苦苦的看書、查資料嗎？
  - idx: 2
    text: 這不只是你一個人的疑問。AI能撰寫報告、設計圖像、生成音樂、翻譯文章、編寫程式，甚至規劃簡報、安排行程——AI幾乎什麼都會。這讓許多人開始思考：是不是只要會用AI就夠了？學校裡的學習、考試、作業……還有存在的必要嗎？
  - idx: 3
    text: 這個問題聽起來像是在挑戰整個教育制度，但它更像是一個邀請——邀請我們重新思考：學習是什麼？我們該如何在AI的時代中學習？在AI越來越聰明的今天，學習的重點，也許不再是誰記得多、誰算得快。我們更該重新看重三件事——更會發問、更重視體驗、更懂得判斷。
  - idx: 4
    text: AI確實能幫我們更快找到答案，卻不能保證答案一定正確，也無法幫我們判斷哪個觀點更有意義。它甚至可以依照指令列出問題，卻不能像人一樣主動判斷「什麼問題值得繼續追問」，而「能主動發現問題，提出有意義的追問」，正是人類思考與學習的起點。
  - idx: 5
    text: 當你查找「為什麼月經被汙名化」時，AI可以列出一長串理由，但真正的學習者不會停在這裡，還會繼續追問：「為什麼這些觀念會一直存在？」「在我的生活裡，有沒有類似的偏見？」這些追問，讓學習不只是蒐集資訊，而是一次次主動思考理解。
  - idx: 6
    text: 2024年有一項研究指出，當我們閱讀故事時，如果作者是人類，我們更容易產生情感共鳴；但如果是AI寫的，即使語氣溫暖、詞藻優美，仍讓人覺得少了點「人味」。這種「人味」來自作者真實經歷過的人生——那些磨難與挫折、喜悅與感動、成長與覺悟——都是AI無法真正體會的。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 7
    text: 再想想運動場上的情景：AI能分析戰術、預測勝率，但它不能替你感受自己在球場上的手感起伏，不能陪你和隊友磨合，更無法代替你承受比賽中的壓力。玩遊戲時，AI能提出破關攻略，但無法替你體會「卡關後設法破關」的成就感。那種從「知道」到「會做」、從「聽過」到「體驗過」的過程，才是學習真正的價值——一場屬於人類的探索，而AI永遠無法代替。
  - idx: 8
    text: AI逐漸成為學習的一部分，它是學習與解決問題的好幫手。它能蒐集資料、整理資料、提供靈感，讓我們節省時間，把心力留給更高層次的任務。真正善用AI的人，不是完全依賴AI，而是懂得駕馭AI、引導AI，把省下的時間與心力用在思考、判斷和創造上。那麼，什麼叫「駕馭」AI呢？來看看一個例子。
  - idx: 9
    text: 有次國文課要寫一篇「我的夢想」作文，你請AI幫忙構思。AI立刻生成一篇語句流暢的文章，裡面提到「成為醫生、幫助別人」之類的理想答案。看起來完美，但讀起來卻不像你自己。但是你沒有直接照抄，而是問AI：「我的夢想是當遊戲設計師，開頭可以怎麼寫？」AI提供了幾種開頭的方向，你參考其中的想法，再融入自己真實的經驗──設計遊戲的樂趣、遇到的挫折，以及為什麼想讓人從遊戲中學到勇氣。最後完成的作文既有AI提供的靈感，也有你獨特的故事。AI幫你開了頭，但整篇文字的靈魂屬於你。這就是駕馭AI——讓它啟發你，而不是取代你。
  - idx: 10
    text: 回到一開始的問題：「AI什麼都會，我們還需要學習嗎？」答案是：需要，而且比以往更需要。因為學習不只是獲得知識，更要學會發問、親身體驗、判斷選擇與創造。當AI越來越聰明，我們更應該培養思考的深度、情感的溫度，以及面對未知的勇氣。學習，就是這一切的起點。
