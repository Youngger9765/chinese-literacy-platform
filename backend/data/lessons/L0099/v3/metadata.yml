strategy_explained: '這一課我們要練習的是，找出作者認為「在AI這麼厲害的時代，我們人類還有什麼價值，為什麼還要學習」的關鍵想法，以及他提出哪些理由來支持這個想法

  這篇文章正是在討論AI的進步，但作者告訴我們，人類的獨立思考、提問和情感連結才是AI做不到的，所以非常適合練習去找出作者的看法和他的證據

  讀的時候，你可以試著想想，作者認為AI和我們人哪裡不一樣，然後他說了哪些例子或原因來證明他的想法'
