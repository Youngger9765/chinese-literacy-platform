lesson_uid: L0099
version_id: v3
section_no: 六
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    answer: A
    stem: 請問下列語詞，何者使用正確？
    options:
      A: 只要學會方法，就能輕鬆「駕馭」這套新軟體
      B: 媽媽罵我之後，我花了一點時間「磨合」自己的情緒
      C: 他唱歌太大聲，讓整個教室都產生了「情感共鳴」
      D: 我昨天「構思」好了一篇作文，交給老師批改
    explanation: 第1題解析：選項Ｂ「磨合」引申為人與人、團隊之間互相適應、調整以達成默契，不能用在情緒上。選項Ｃ「共鳴」指的是因為別人的感受、經驗、想法與自己相似，而產生情感上的呼應與理解。選項Ｄ「構思」是準備、想法階段，還沒真正寫完。
    explanation_note: 原稿是一個浮動說明框，印在題目右上方；選項代號用全形。
    teacher_note: 選項Ｂ「磨合」引申為人與人、團隊之間互相適應、調整以達成默契，不能用在情緒上。選項Ｃ「共鳴」指的是因為別人的感受、經驗、想法與自己相似，而產生情感上的呼應與理解。選項Ｄ「構思」是準備、想法階段，還沒真正寫完。
  - index: 2
    answer: B
    stem: 作者最後如何回答「AI什麼都會，我們還需要學習嗎？」
    options:
      A: 不需要，因為AI足以取代所有的學習過程
      B: 需要，AI越聰明，人類更需要學會駕馭AI
      C: 視情況而定，只要AI使用能力好，就不必再學習
      D: 需要，但學會使用AI就夠了，其他能力不再重要
    explanation: 作者強調的是人類思考與體驗的不可取代性，而不是條件式或部分需要的說法。
    explanation_note: '原稿是一個浮動說明框，印在本題右側。⚠️ 它的內容與第 3 題的說明框**一模一樣**，

      只差第 3 題那個有「第3題解析：」前綴 —— 研判是重複貼上；兩個都照原樣保留。'
  - index: 3
    answer: B
    stem: 「學習的重點，也許不再是誰記得多、誰算得快」，這句話隱含的意思是什麼？
    options:
      A: 學校應該取消考試制度與評量方法
      B: 學習應更加重視「發問、體驗與判斷」
      C: AI可以回答問題，因此學生可以減少思考
      D: 擔憂AI出現後，學生記憶力、計算力下降
    explanation: 第3題解析：作者強調的是人類思考與體驗的不可取代性，而不是條件式或部分需要的說法。
    explanation_note: 與第 2 題的說明框內容重複（見該題註）。
    teacher_note: 作者強調的是人類思考與體驗的不可取代性，而不是條件式或部分需要的說法。
  - index: 4
    answer: D
    stem: 作者以「月經汙名化」作為開頭例子，其作用最可能是什麼？
    options:
      A: 強調長久以來女性在生理議題上的委屈與不被理解
      B: 點出學生太依賴AI搜尋資料，缺乏自主思考能力
      C: 說明AI能解決社會性別平等問題，展現科技的進步
      D: 用生活化情境引出使用AI與人類學習的核心問題
    explanation: 第4題解析-「月經汙名化」只是導入情境，作者藉此帶出：「AI能快速回答問題，但我們是否因此不再需要學習？」這是全文的核心問題。
    explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在第 3 題的選項之前，本檔歸位到本題。
    teacher_note: -「月經汙名化」只是導入情境，作者藉此帶出：「AI能快速回答問題，但我們是否因此不再需要學習？」這是全文的核心問題。
  - index: 5
    answer: C
    stem: 下列哪一種做法最符合本課作者對學生使用AI的主張？
    options:
      A: 學生用AI找到課文的重點，然後背誦這些重點
      B: 學生用 AI 分析自己的學習，並照AI的建議行動
      C: 學生利用AI查資料後，自己整理出觀點與問題
      D: 學生把報告交給 AI 完成，最後加上一句自己的心得
    explanation: 第5題解析：A、B、D是錯誤選項，它們的共同問題是：缺乏自主思考。A-看似合理（有整理重點），但缺乏「自己詮釋」。B-看似幫助學習，但學生仍是被動接受。D-看似有成果，但學生沒有參與思考過程。
    explanation_note: 原稿是一個浮動說明框，印在題目下方
    teacher_note: A、B、D是錯誤選項，它們的共同問題是：缺乏自主思考。A-看似合理（有整理重點），但缺乏「自己詮釋」。B-看似幫助學習，但學生仍是被動接受。D-看似有成果，但學生沒有參與思考過程。
