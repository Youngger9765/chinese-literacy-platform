lesson_uid: L0099
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框中，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 汙名化
  - 轉瞬之間
  - 情感共鳴
  - 詞藻優美
  - 磨難
  - 磨合
  - 破關攻略
  - 牽著鼻子走
  - 駕馭
  - 構思
  answer_carrier: 橘色手寫字（PDF p4）；文字層的空格內已填有同樣的答案
  items:
  - index: 1
    word: 情感共鳴
    definition: 產生情感上的共同感受，能互相理解或感受對方的心情。
  - index: 2
    word: 牽著鼻子走
    definition: 比喻被人操控，照著別人的意思行動，自己沒有主見。
  - index: 3
    word: 汙名化
    definition: 把負面標籤加在人或事物上，讓大家對他產生偏見或排斥。
  - index: 4
    word: 構思
    definition: 創作前先思考內容、安排與表達方式。
  - index: 5
    word: 詞藻優美
    definition: 用詞生動優美，讀起來富有美感。
  - index: 6
    word: 轉瞬之間
    definition: 形容時間極短，好像一眨眼就過去了。
  - index: 7
    word: 破關攻略
    definition: 指在遊戲中闖關或解題的具體方法與技巧。
  - index: 8
    word: 磨難
    definition: 指生活或成長中遇到的艱苦與挫折。
  - index: 9
    word: 磨合
    definition: 互相調整和適應，讓彼此更合得來。
  - index: 10
    word: 駕馭
    definition: 原指控制馬匹，現在也指能掌握並妥善運用某種工具或能力。
