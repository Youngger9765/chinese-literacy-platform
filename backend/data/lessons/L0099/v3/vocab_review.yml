  intended_word_note: '「轉眼瞬間」那一條的目標語詞是「轉瞬之間」——格子第3列第4欄印成「眼」、第4列第5欄印成「瞬」

    （見 source_errata E1、E2）。word 必須跟格子實際拼得出來的字一致，否則座標門會判 FAIL。

