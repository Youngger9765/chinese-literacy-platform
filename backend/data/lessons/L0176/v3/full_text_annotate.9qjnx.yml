full_text_annotate:
  lesson_heading: 第12課  一起變強，會更好
  paragraph_count: 12
  paragraphs:
  - idx: 1
    text: 無論是班上選幹部、參加接力，或在球隊爭取先發，我們都可能遇到和自己能力相近的人。看見對方進步，有人會替他高興，也有人忍不住擔心：「他會不會超過我？我的機會是不是變少了？」
  - idx: 2
    text: 棒球隊的佳恩也有這樣的煩惱。
  - idx: 3
    text: 佳恩和子皓都是捕手，也都想成為先發球員。佳恩接球穩、傳球快，能迅速把球傳向二壘，阻止跑者盜壘；子皓善於觀察，常能看出打者的習慣，提醒投手改變投球方式。他們平時一起練習，心裡卻難免暗自較勁：誰今天被教練稱讚？下一場比賽，誰會先上場？
  - idx: 4
    text: 有一天，子皓在練習阻擋偏低的球時，總是來不及移動，讓球從身旁滾走。他去請教佳恩，佳恩明知道方法，卻只回答：「沒事啦，多練習就會了。」他不是討厭子皓，只是心裡有所顧忌。這個念頭讓他把真正想分享的方法吞了回去：如果全部教給子皓，子皓變得比自己更強，自己的先發位置會不會就難保了？
  - idx: 5
    text: 幾天後的比賽，佳恩擔任先發捕手，前幾局傳接十分流暢，還抓到一名想盜壘的跑者。但到了後半場，佳恩的膝蓋卻隱隱作痛。他咬牙繼續蹲著，動作卻明顯遲鈍。教練察覺不對勁，立刻把他換下場，改由子皓接替。
  - idx: 6
    text: 子皓一上場就十分忐忑。沒過多久，投手投出一顆偏低的球。子皓來不及用身體擋住，球從旁邊滾到後方。壘上的跑者趁機跑上三壘，下一名打者又敲出安打，跑者回到本壘，球隊失去了原本的領先。
  - idx: 7
    text: 比賽結束，佳恩坐在休息區，懊惱自己的膝蓋不爭氣，也忍不住想：「如果我沒有被換下場，也許就不會輸了。」教練看見垂頭喪氣的佳恩，走到他身旁坐下。「你覺得今天為什麼沒守住？」教練問。佳恩低著頭說：「因為我的膝蓋痛，不能繼續上場。」教練看了看他正在冰敷的膝蓋，說：「受傷當然會影響比賽。不過，沒有人能保證自己每天都不累、不受傷。」
  - idx: 8
    text: 教練接著說：「今天這場比賽讓我們看見一件事：如果先發捕手突然不能上場，另一個捕手也要能立刻接上。這不是你一個人的責任，也不是子皓一個人的責任，是整支球隊都要準備好的事。你們爭取先發沒有錯，但同一個位置的隊友，不只是競爭者，也是彼此的後盾，是最能互相提醒、互相補位的最佳拍檔。」
  - idx: 9
    text: 佳恩想起幾天前，子皓來請教時，自己明明知道方法，卻只說了一句：「多練習就會了。」再想到那顆從子皓身旁滾過去的球，他的心裡一沉，曬的黑亮的臉龐頓時微微發燙。
  - idx: 10
    text: 從那天起，佳恩主動分享接球的訣竅，子皓也會把自己觀察打者的方法告訴佳恩。他們仍然會比較，也都希望自己能先發上場。不同的是，他們不再只想：「我一定要贏過他」，也會問自己：「他哪裡做得比我好？我能從他身上學到什麼？」
  - idx: 11
    text: 面對競爭，我們有時會落入「我好，你不好」、「你好，我不好」的想法。如果他進步了，我的機會就變少；如果他表現不好，我反而暗自鬆一口氣。可是，一個人變強，不一定代表另一個人就會變弱。真正能讓團隊變好的態度會是「我好，你也好」。這態度不是放棄競爭，而是互為後盾，兩個人都相信：我可以努力發揮自己的長處，也可以幫助隊友一起進步。兩個人都變強，整支球隊才有更多機會走得更遠。
  - idx: 12
    text: 多年以後，球員可能記不得每場比賽的分數，也未必記得自己得過幾座獎盃。但他們往往會記得那些一起練習到天黑、輸球後互相打氣，以及在自己快撐不住時，伸手接住自己的隊友。
