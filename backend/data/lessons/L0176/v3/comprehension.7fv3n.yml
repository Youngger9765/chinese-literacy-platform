lesson_uid: L0176
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項中「  」的語詞，何者使用正確？
    options:
      A: 他心中有很厚的「後盾」，任何鼓勵和建議他都聽不進去
      B: 我很感謝他對我的「顧忌」，幫助我度過許多困難時刻
      C: 當他看見思念的家人出現在火車站，「頓時」熱淚盈眶
      D: 他因為緊張所以說話「忐忑」，讓人聽不懂他在說什麼
    teacher_note: 第1題解析：(A)宜改成「防衛」、「心牆」(B)宜用「照顧」、「關照」；(D)宜用「結巴」
  - index: 2
    answer: B
    stem: 根據第九段，佳恩看到子皓失誤，後來「心裡一沉，曬得黑亮的臉龐頓時微微發燙」，最可能表示他當時有什麼感受？
    options:
      A: 他因為子皓失誤而偷偷感到有些開心和得意
      B: 他想到自己曾經故意不分享方法，感到慚愧
      C: 他擔心教練會責怪自己無法上場讓球隊失分
      D: 他認為子皓不適合擔任捕手，因此感到生氣
    teacher_note: 在教練的提醒下，佳恩了解不該只把隊友當作競爭者，也要是彼此的支持，因此想到過去的作為，感到慚愧。
  - index: 3
    answer: A
    stem: 根據第十一段，「一個人變強，不一定代表另一個人就會變弱。」這句話在本文中最接近下列哪一個意思？
    options:
      A: 別人的進步不一定會搶走自己的機會，彼此也可能一起變好
      B: 別人能力變強時，自己更應專心提升自己，不必再分享方法
      C: 團隊合作比競爭重要，因此同位置的隊友不應再爭取先發
      D: 能力和位置相近的隊友最好不要比較，避免影響彼此的感情
    teacher_note: 我好，你也好的思維
  - index: 4
    answer: C
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 球員應該先把自己的基本動作練熟，才能及時幫助隊友
      B: 面對競爭時，應該避免比較，才能維持良好的人際關係
      C: 競爭不必建立在壓過別人，也可以彼此學習、一起進步
      D: 團隊比賽中，替補球員的能力往往比先發球員更加重要
  - index: 5
    answer: D
    stem: 班上要派代表參加朗讀比賽，小庭和好友都很想入選，看著好友的進步，小庭開始擔心自己。哪種想法最符合本文所強調的態度？
    options:
      A: 「她進步得這麼快，我最好不要再把練習方法告訴她。」
      B: 「既然她現在比我好，我乾脆不要參加，免得最後失望。」
      C: 「為了維持友情，我們兩個都不要參加，這樣最公平。」
      D: 「我可以繼續爭取，也看看她進步的方法，彼此一起練習。」
