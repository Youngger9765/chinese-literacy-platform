section_no: 六
spotlight:
  strategy_name: 我好，你也好
  blocks:
  - type: concept_box
    text: 和別人相處時，我們心裡常常會比較：誰比較厲害？誰做得比較好？有時候，我們會因為怕自己輸，而希望別人不要太好；有時候，也會覺得別人什麼都比自己強。子皓和佳恩的故事告訴我們，在團隊裡，「我好，你也好」的互動，是一種比較健康的選擇。
  - type: guide
    text: ◎情境回顧：先從佳恩的故事來看看：子皓來請教接球的方法時，佳恩心裡想：「如果全部教給子皓，子皓變得比自己更強，自己的先發位置會不會就難保了？」請問佳恩當時最接近哪一種想法？
  - type: single
    prompt: 請問佳恩當時最接近哪一種想法？
    options:
    - 我有我的長處，子皓也有他的長處。
    - 我希望自己比較好，子皓不要變得比我更強。
    - 子皓比我厲害，我再努力也沒有用。
    - 我們兩個都不可能成為好捕手。
    answer: 2
  - type: guide
    text: →佳恩並不是討厭子皓，而是擔心：如果你好了，我可能就不好了。這種想法和我們怎麼看「自己」與「別人」有關。
  - type: guide
    text: ◎心理地位介紹：一個人心裡怎麼看自己、怎麼看別人，大致可能出現下面四種想法。
  - type: table
    headers:
    - 心理地位
    - 心裡的想法
    - 可能說出的話
    rows:
    - - 我好，你也好
      - 我有我的長處，你也有你的長處。
      - 「你做得好的地方我可以學，我會的也可以和你分享。」
    - - 我好，你不好
      - 我比較好，你比較差。
      - 「你們都不會，還是我自己做比較快。」
    - - 我不好，你好
      - 你比較好，我比不上你。
      - 「你那麼厲害，我怎麼努力都沒用。」
    - - 我不好，你也不好
      - 我不行，你也好不到哪裡去。
      - 「反正我們都做不好，算了啦！」
  - type: guide
    text: →「我好，你也好」不是說大家都一樣厲害、不用比較，而是「我看見自己的價值，也看見別人的價值。」
  - type: guide
    text: ◎辨別練習：我們會肯定自己也會否定自己；會肯定他人也會否定他人，而這就構成了互動中不同的心理地位。請根據底下的話語判斷這句話屬於哪一種心理地位。
  - type: sub_block
    prompt: 1.小宇在小組報告時說：「你們都不會做，還是全部交給我比較快。」
    items:
    - type: single
      prompt: →這想法是（　）自己
      options:
      - 肯定
      - 否定
      answer: 1
    - type: single
      prompt: （　）他人
      options:
      - 肯定
      - 否定
      answer: 2
    - type: single
      prompt: →心理地位屬於
      options: &id001
      - 我好，你也好
      - 我好，你不好
      - 我不好，你好
      - 我不好，你也不好
      answer: 2
  - type: sub_block
    prompt: 2.小哲看到同學這次考得比自己好，心想：「他本來就比我聰明，我再怎麼讀也不可能追上他。」
    items:
    - type: single
      prompt: →這想法是（　）自己
      options:
      - 肯定
      - 否定
      answer: 2
    - type: single
      prompt: （　）他人
      options:
      - 肯定
      - 否定
      answer: 1
    - type: single
      prompt: →心理地位屬於
      options: *id001
      answer: 3
  - type: sub_block
    prompt: 3.小安說：「小晴的英文比我好，我可以跟他學；我的數學比她強，也可以幫她準備考試。」
    items:
    - type: single
      prompt: →這想法是（　）自己
      options:
      - 肯定
      - 否定
      answer: 1
    - type: single
      prompt: （　）他人
      options:
      - 肯定
      - 否定
      answer: 1
    - type: single
      prompt: →心理地位屬於
      options: *id001
      answer: 1
  - type: guide
    text: →當你能夠從語言中辨識出彼此互動的心理地位時，也就可以有意識的去調整，把自己放回「肯定自己也肯定他人」的位置。
  - type: guide
    text: ◎情境練習：根據下列情境，選出「我好，你也好」的想法。
  - type: single
    prompt: 1.你和朋友都想參加學校的數理競賽。這次考試，他的成績比你好。哪一個想法比較接近「我好，你也好」？
    options:
    - 他最好下次考差一點，我才有機會。
    - 他這次準備得比我好，我可以向他請教。
    - 反正我比不上他，不如乾脆不要準備了。
    - 他本來就比我聰明，我大概沒有希望了。
    answer: 2
  - type: single
    prompt: 2.你的組員很會做簡報，但不太敢上臺；你很會口頭報告，但對電腦操作比較不熟。怎麼做比較接近「我好，你也好」？
    options:
    - 我比較會說，所以整份報告都照我的方法做。
    - 他簡報做得這麼好，我在這組好像沒什麼用。
    - 我們各有擅長的地方，可以分工，也可以互相教對方。
    - 我們兩個都有不會的地方，隨便完成就好了。
    answer: 3
  - type: single
    prompt: 3.你和好朋友一起參加才藝表演甄選，最後只有朋友入選。哪一個想法比較接近「我好，你也好」？
    options:
    - 他入選，就表示我一定比他差。
    - 希望他之後出錯，證明老師選錯人。
    - 以後我們都不要參加，就不會互相比較了。
    - 我很替他高興，也看看自己可以加強的部分。
    answer: 4
  - type: guide
    text: ◎調整一下
  - type: single
    prompt: 4.小哲想：「他期中考考那麼好，他本來就比我聰明，我再怎麼讀也追不上。」哪一個想法比較能把自己調整回「我好，你也好」？
    options:
    - 他比較聰明，智商是天生的，比也比不過，我還是不要跟他比。
    - 太丟臉了，我下次一定要贏他，拚死拚活也要證明我也很厲害。
    - 他這次表現比我好，我可以學他；我也可以找出自己能加強的地方。
    - 反正考試只是運氣，起起落落，要看開一點，太在乎是沒有用的。
    answer: 3
  - type: guide
    text: →「我好，你也好」不是放棄自己，也不是壓過別人，而是既肯定自己，也肯定別人。遇到比較或挫折時，可以問自己：1.我還可以做什麼讓自己進步？2.對方有哪些地方值得我學習或支持？這樣就比較容易回到「我好，你也好」的位置。
  - type: self_check
    items:
    - 我能辨認「我好，你也好」和另外三種互動位置。
    - 我能發現自己什麼時候在否定自己或否定別人。
    - 遇到比較時，我能提醒自己：我可以繼續努力，也可以看見別人值得學習的地方。
