  passage: 教練接著說：「今天這場比賽讓我們看見一件事：如果先發捕手突然不能上場，另一個捕手也要能立刻接上。這不是你一個人的責任，也不是子皓一個人的責任，是整支球隊都要準備好的事。你們爭取先發沒有錯，但同一個位置的隊友，不只是競爭者，也是彼此的後盾，是最能互相提醒、互相補位的最佳拍檔。」佳恩想起幾天前，子皓來請教時，自己明明知道方法，卻只說了一句：「多練習就會了。」再想到那顆從子皓身旁滾過去的球，他的心裡一沉，曬的黑亮的臉龐頓時微微發燙。從那天起，佳恩主動分享接球的訣竅，子皓也會把自己觀察打者的方法告訴佳恩。他們仍然會比較，也都希望自己能先發上場。不同的是，他們不再只想：「我一定要贏過他」，也會問自己：「他哪裡做得比我好？我能從他身上學到什麼？」
