intro: 這篇文章從球隊裡兩位捕手的故事出發，談面對能力相近的隊友時，那種既想進步又怕被超越的心情。佳恩因為擔心先發位置不保，把接球的方法留了下來；一場比賽的失誤與教練的提醒，讓他重新看見同位置的隊友「不只是競爭者，也是最佳拍檔」。文章接著介紹「我好，你也好」「我好，你不好」「我不好，你好」「我不好，你也不好」四種心理地位，並用辨別練習與情境題，帶讀者練習從話語中認出彼此的互動位置，再有意識地把自己調整回「肯定自己也肯定他人」的位置。
notes:
