lesson_uid: L0168
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answers_printed: true
  items:
  - index: 1
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 這枚戒指也許對其他人來說「微不足道」，卻是他的傳家之寶
      B: 她第一次擔任幹部，對她來說要管理同學是「家常便飯」
      C: 他說話「一針見血」，常常讓人聽完後還是摸不著頭緒
      D: 他這次比賽的表現「乏善可陳」，最後獲得了最佳投手獎
    answer: A
    teacher_note: '第1題解析：(B)宜用「難如登天」

      (C)宜用「毫無邏輯」(D)宜用「可圈可點」'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 2
    stem: 根據第四段「我像瞬間被戳破的氣球，洩氣地搖搖頭」這句話主要是想表達什麼？
    options:
      A: 主角對教練的責備感到生氣和懊惱
      B: 主角被教練說中，心裡也感到沮喪
      C: 主角面對錯誤不想面對，只想逃避
      D: 主角心中因此產生退出球隊的念頭
    answer: B
    teacher_note: 第2題解析：根據前後文，主角的確沒有好好休息，和教練說的一樣。
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    note: '題幹說「第四段」，該引文實際在課文**第 14 段**；且題幹引「洩氣**地**搖搖頭」，

      課文原句是「洩氣**的**搖搖頭」。兩處都照各自原樣抄，不改。'
  - index: 3
    stem: 根據本文，關於主角的情緒推論，下列何者正確？
    options:
      A: 被換下場，心想「唉，又搞砸了！」──慶幸
      B: 被隊長拍拍肩膀打氣、被邀請去找教練──自責
      C: 聽完隊長的話，反思自己的身體狀況──困惑
      D: 被教練發現自己沒有好好休息──生氣
    answer: C
    teacher_note: '第3題解析：

      (A)沮喪

      (B)倍受鼓勵

      (D)慚愧'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 4
    stem: 根據本文，下列何者最符合文章想傳達的重點？
    options:
      A: 求表現應該是運動員的首要責任和目標
      B: 等到身體出狀況才休息會讓身體更強壯
      C: 運動員應該懂得平衡訓練與身體照顧
      D: 教練透過挑剔球員來讓球員繼續進步
    answer: C
    teacher_note: '第4題解析：

      (A)照顧身體才是首要責任 (B)應該按時休息(D)沒有提到'
    teacher_note_carrier: 藍框浮動文字方塊（在文字層）
  - index: 5
    stem: 下列哪一項行為最符合「把身體當作夥伴」的態度？
    options:
      A: 練球時為了有好表現，即使肌肉拉傷也硬撐到底
      B: 回家後先好好放鬆滑手機，之後再熬夜把作業寫完
      C: 儘管身體還發著燒，但不想錯過比賽，決定帶病上場
      D: 練球後覺得身體疲憊，主動伸展放鬆並增加睡眠時間
    answer: D
  notes:
    option_key: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af0）
