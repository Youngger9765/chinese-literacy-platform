  passage: 「哦！阿哲也來啦！」教練一邊準備貼紮的用具，一邊熱絡的打招呼。「教練，我們的小學弟有煩惱想要請教您。」隊長先替我開了口。「什麼煩惱？最近都表現不好嗎？」教練一針見血的說，「你有好好放鬆、好好睡覺嗎？」我像瞬間被戳破的氣球，洩氣的搖搖頭。「可是他自主菜單都有認真練哦！」隊長急忙幫我緩頰。「我知道他很努力，」教練轉過身來說，「但放鬆跟休息也是訓練的一環。就像你，受傷還硬要上場，只會讓恢復時間拉長，反而影響到更重要的比賽。」教練說，「你們都很認真，也都會照顧隊友，但別忘了，你們還有一個最重要的夥伴──自己的身體。身為運動員，更要懂得照顧他，感謝他。如果只是一直使喚他、抱怨他，有一天他也會不理你喔！」
