paragraphs:
- 「阿哲，你先下來休息！」教練一聲令下，把我從場上換下來。唉，又搞砸了！最近真的很奇怪，練球時總覺得身體特別沉重，怎麼都提不起勁。以前肌肉痠痛只要睡一覺就能恢復，現在卻兩、三天還是覺得卡卡。雖然只是友誼賽，我仍希望能留在場上，但以這種乏善可陳的狀況，會被換下來也是理所當然的吧！
- 正當我垂頭喪氣時，隊長走了過來，拍了拍我的肩膀說：「別想太多！趕快調整狀態比較重要！」我連忙道謝，這才忽然聞到他身上痠痛噴霧的味道。
- 「對啊！」他苦笑著說：「他唸了我一頓，說求表現之前，要先顧好身體，要做學弟們的榜樣。」學長這句話雖然不是在說我，卻不禁讓我思考──我的卡關，會不會也是因為我只想求表現，卻沒有「顧好身體」呢？
- 回想起來，教練常叮嚀我們要按時補水、確實收操、早點休息，但我總當成耳邊風。總覺得裝水好麻煩，渴了再喝也沒關係；反正練完就要回家，沒收操似乎也無所謂。再加上訓練結束後還得寫作業，常常一忙就很晚，滑個手機又不知不覺過了十二點，熬夜已經是家常便飯。會不會，就是這些看似微不足道的習慣，慢慢對我的身體產生影響呢？
- </w:r><w:r w:rsidR="00A127C7" w:rsidRPr="00E6147F"><w:rPr><w:rFonts w:ascii="芫荽" w:eastAsia="芫荽" w:hAnsi="芫荽" w:cs="芫荽" w:hint="eastAsia"/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr><w:t>「哦！阿哲也來啦！」教練一邊準備貼紮的用具，一邊熱絡的打招呼。
- 「我知道他很努力，」教練轉過身來說，「但放鬆跟休息也是訓練的一環。就像你，受傷還硬要上場，只會讓恢復時間拉長，反而影響到更重要的比賽。」教練說，「你們都很認真，也都會照顧隊友，但別忘了，你們還有一個最重要的夥伴──自己的身體。身為運動員，更要懂得照顧他，感謝他。如果只是一直使喚他、抱怨他，有一天他也會不理你喔！」
- </w:r><w:r w:rsidRPr="00E6147F"><w:rPr><w:rFonts w:ascii="芫荽" w:eastAsia="芫荽" w:hAnsi="芫荽" w:cs="芫荽" w:hint="eastAsia"/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr><w:t>離開辦公室後，我反覆想著教練的話。一直以來，我只希望自己的身體能更快、更有力量，卻從沒想過他需要什麼，或許，是學著傾聽他的聲音、學著成為他可靠的夥伴的時候了。
