spotlight:
  lesson: 體-L2
  strategy_name: 品格力-身體覺察與照護
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 看完阿哲的故事，我們也可以回到自己的日常想一想──我們，真的有「顧好身體」嗎？在成為身體的好夥伴之前，就像交新朋友一樣，我們可以先帶著好奇的眼光去認識他。透過觀察、體驗與小小的練習，讓我們一起傾聽身體的聲音，一起更認識這位默默陪著你的好夥伴，也更了解適合自己的放鬆和休息方式。
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 練習一：身體有些小習慣、小動作是我們平常沒有發覺的，請根據題目觀察看看，並記錄下來。
  - type: single
    prompt: 雙手交叉放在胸前，哪一隻手臂在外側？
    options:
    - 右手
    - 左手
    answer: 右手
  - type: single
    prompt: 翹腳坐著，通常是哪一腳在上方？
    options:
    - 右腳
    - 左腳
    answer: 右腳
  - type: single
    prompt: 聳肩時，哪邊比較容易抬高？
    options:
    - 右肩
    - 左肩
    - 一樣容易
    answer: 右肩
  - type: single
    prompt: 輕輕轉頭看右邊、再看左邊，哪一邊轉得比較順？
    options:
    - 右邊
    - 左邊
    - 一樣順
    answer: 右邊
  - type: single
    prompt: 雙腳自然放地面，感覺哪一隻腳踩得比較實？
    options:
    - 右腳
    - 左腳
    - 一樣踏實
    answer: 右腳
  - type: single
    prompt: 感受一下臀部與椅子接觸的感覺，觀察身體重量放在哪一邊比較多？
    options:
    - 右半邊
    - 左半邊
    - 一樣多
    answer: 右半邊
  - type: guide
    text: ※好奇的眼光是重新認識身體的第一步，用一句話寫下你對身體的發現與觀察吧！
  - type: guide
    text: 例如：我發現原來我的身體重心很常放在右邊
  - type: guide
    text: →我發現，原來______________________________________________
  - type: guide
    text: 練習二：在生活中，你都如何讓身體放鬆和休息呢？根據以下題目找出適合自己的方法。（可複選）
  - type: multi
    prompt: 1.當身體覺得「累」的時候，我最想──
    options:
    - 躺下來或靠著椅背閉眼休息
    - 喝幾口水
    - 慢慢伸展或轉動肩膀、手、腳
    - 讓身體靜止不動幾分鐘
    - 深呼吸幾次，讓身體放慢節奏
    - 其他：＿＿＿＿＿＿＿＿＿
    answer:
    - 躺下來或靠著椅背閉眼休息
    - 喝幾口水
    - 慢慢伸展或轉動肩膀、手、腳
    - 讓身體靜止不動幾分鐘
    - 深呼吸幾次，讓身體放慢節奏
    - 其他：＿＿＿＿＿＿＿＿＿
  - type: multi
    prompt: 2.當身體某個地方「卡卡的」或覺得緊繃時，我會──
    options:
    - 起身走一走或換個姿勢
    - 抬手伸懶腰，做全身的伸展
    - 輕拍緊繃的部位
    - 用手按壓、按摩緊繃的部位
    - 轉一轉、動一動緊繃的部位
    - 其他：＿＿＿＿＿＿＿＿＿＿
    answer:
    - 起身走一走或換個姿勢
    - 抬手伸懶腰，做全身的伸展
    - 輕拍緊繃的部位
    - 用手按壓、按摩緊繃的部位
    - 轉一轉、動一動緊繃的部位
    - 其他：＿＿＿＿＿＿＿＿＿＿
  - type: multi
    prompt: 3.當身體「沒力」的時候，我覺得他最需要──
    options:
    - 睡一覺或小睡一下
    - 吃一點營養的東西
    - 安靜坐一會兒
    - 喝水或補充飲料
    - 不說話，只是慢慢呼吸
    - ⑥和人互動、聊天
    - □⑦其他：＿＿＿＿＿＿＿＿＿＿＿
    answer:
    - 睡一覺或小睡一下
    - 吃一點營養的東西
    - 安靜坐一會兒
    - 喝水或補充飲料
    - 不說話，只是慢慢呼吸
    - ⑥和人互動、聊天
    - □⑦其他：＿＿＿＿＿＿＿＿＿＿＿
  - type: multi
    prompt: ４.如果給我 10 分鐘讓身體休息，我會選擇──
    options:
    - 躺平閉眼
    - 慢走或伸展
    - 輕輕按摩肩膀或腿
    - 坐著深呼吸
    - 靜靜喝水、什麼都不做
    - 其他：＿＿＿＿＿＿＿＿＿＿＿
    answer:
    - 躺平閉眼
    - 慢走或伸展
    - 輕輕按摩肩膀或腿
    - 坐著深呼吸
    - 靜靜喝水、什麼都不做
    - 其他：＿＿＿＿＿＿＿＿＿＿＿
  - type: guide
    text: ※每個人都有適合自己的放鬆休息套餐，寫下你的觀察，也作為對身體「回信」，讓他知道你願意開始照顧他。
  - type: guide
    text: 例如：我發現我的身體最需要睡眠，可能因為我太常熬夜了。
  - type: guide
    text: →我發現我的身體最需要＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿，
  - type: guide
    text: 因為＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。
  - type: guide
    text: ※如果你發現有些方法「越休息越累」，例如：滑手機時大腦需要不斷切換注意力、想休息但卻又擔心還沒做完的事情。那就代表需要換個方式，好好讓身體靜下來、讓心停下來。
  - type: guide
    text: 練習三：感受呼吸，呼吸時時刻刻陪伴著我們，透過一些小練習，也能幫助身體、大腦放鬆，休息。
  - type: single
    prompt: 觀察呼吸，數一數吸氣和吐氣的秒數，哪一個比較長？
    options:
    - 吸氣
    - 吐氣
    - 一樣長
    answer: 吸氣
  - type: multi
    prompt: 請選擇
    options:
    - 放鬆
    - 平靜
    - 煩躁
    - 焦慮
    - 沒感覺
    - 其他：______
    answer:
    - 放鬆
    - 平靜
    - 煩躁
    - 焦慮
    - 沒感覺
    - 其他：______
  - type: guide
    text: ※呼吸是我們與身體連結的小幫手，也是放鬆休息的好方法，在這個練習中，你最喜歡哪一個環節？為什麼呢？
  - type: guide
    text: 例如：我最喜歡吸氣的時候，因為可以讓我覺得充滿力量。
  - type: multi
    prompt: 請選擇
    options:
    - 吸氣
    - 閉氣
    - 吐氣 ）的時候，
    answer:
    - 吸氣
    - 閉氣
    - 吐氣 ）的時候，
  - type: guide
    text: 因為______________________________________________________
  - type: guide
    text: ※聽聽身體的聲音，如果吐氣可以幫助你帶走一些痠痛、緊繃，你最希望哪些地方的不舒服可以被帶走呢？
  - type: guide
    text: 例如：我最希望可以帶走膝蓋的不舒服，因為他很常發炎受傷。
  - type: guide
    text: →我最希望可以帶走__________________________的不舒服，
  - type: guide
    text: 因為______________________________________________________
  - type: passage
    source: unknown
