- id: p3
  type: paragraph
  text: 表二則說明了兩種八哥近年族群數量的變化。從表二可知，不論是整體數量、出現的地點，還是在部分地區的觀察結果，外來種白尾八哥都明顯多過原生種臺灣冠八哥；有些地方甚至已經看不到臺灣冠八哥的身影了。可是，當初白尾八哥被引進臺灣時，牠們的數量很少，臺灣冠八哥才是隨處可見的常客。那麼，為什麼幾十年過去，原生種臺灣冠八哥逐漸消聲匿跡，白尾八哥卻愈來愈常見，聲勢愈來愈大呢？
