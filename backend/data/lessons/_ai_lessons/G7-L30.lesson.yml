  - id: p3
    type: paragraph
    text: >-
      表二則說明了兩種八哥近年族群數量的變化。從表二可知，不論是整體數量、出現的地點，還是在部分地區的觀察結果，外來種白尾八哥都明顯多過原生種臺灣冠八哥；有些地方甚至已經看不到臺灣冠八哥的身影了。可是，當初白尾八哥被引進臺灣時，牠們的數量很少，臺灣冠八哥才是隨處可見的常客。那麼，為什麼幾十年過去，原生種臺灣冠八哥逐漸消聲匿跡，白尾八哥卻愈來愈常見，聲勢愈來愈大呢？
  - id: table-2
    type: table
    label: 表二
    title: 表二 近年兩種臺灣常見八哥之族群數量之變化
    headers: [指標, 白尾八哥, 臺灣冠八哥, 解讀重點]
    rows:
      - ["近年數量變化（2009-2020）（註1）", "成長 250%", 無明顯變化, 原生種的數量沒有增加，外來種快速擴張]
      - ["看得到的地點數／總調查地點數（2009-2021）", "341/584", "84/584（註2）", "外來種分布更廣，可見度更高，比原生種更容易看見 4.1 倍。"]
      - [2021 年看得到的地點數, 225 個地點, 23 個地點, "2021 年外來種仍明顯多於原生種約 9.8 倍。"]
      - [2018 年花蓮調查結果, 674 隻, 0 隻, 某些區域幾乎看不到原生種]
    notes:
      - "註1. 資料來源：我們的島（2022）；環境資訊中心（2023）"
      - "註2.「84／584」表示：研究人員一共調查了 584 個地點，其中有 84 個地點看得到臺灣冠八哥。"
  - id: p4
    type: paragraph
    text: >-
      這個問題的答案可能和兩種八哥的一項習性差異有關，也和臺灣這四、五十年來的都市化有關。請回到表一看一看，哪一種八哥比較不怕人？哪一種八哥比較常利用人造建築築巢？再想一想，當馬路、橋樑、房舍佔地面積愈來愈大時，鳥類的天性會怎麼樣影響牠們族群的發展呢？請根據表一試著推論兩種八哥族群變化的原因。

