- id: p4
  type: paragraph
  text: 這個問題的答案可能和兩種八哥的一項習性差異有關，也和臺灣這四、五十年來的都市化有關。請回到表一看一看，哪一種八哥比較不怕人？哪一種八哥比較常利用人造建築築巢？再想一想，當馬路、橋樑、房舍佔地面積愈來愈大時，鳥類的天性會怎麼樣影響牠們族群的發展呢？請根據表一試著推論兩種八哥族群變化的原因。
