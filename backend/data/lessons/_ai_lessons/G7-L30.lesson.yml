lesson_code: G7-L30
title: 都是八哥，為什麼命運不一樣？
blocks:
  # ── 左欄閱讀材料：課文 4 段，依原文順序；圖表插在對應段旁 ──────────────────
  - id: p1
    type: paragraph
    text: >-
      你最常見到哪一種野鳥？二十年前，臺灣民眾的回答會是嘰嘰喳喳的麻雀。但近年，在公園、校園、農地與河濱綠地裡，這個答案已經被聒噪喧囂的黑鳥——八哥——取代。但你知道嗎？一眼望去，黑忽忽的八哥還分兩種：「白尾八哥」和「臺灣冠八哥」。白尾八哥是外來種，因為很會模仿聲音，四、五十年前被引進臺灣作為寵物鳥。沒想到，近年鳥類族群的調查發現，白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。從圖一可以看出，這兩種八哥外形十分相似，不容易單靠外表一眼分辨。
  - id: fig-1
    type: figure
    label: 圖一
    caption: 白尾八哥（左）與 臺灣冠八哥（右）外形圖
    asset: images/G7-L30/G7-L30-06.png
  - id: p2
    type: paragraph
    text: >-
      表一比較了白尾八哥和臺灣冠八哥在外形與習性上的異同。這兩種八哥外表相似，體型、羽色和動作都很接近，在生物分類上也同屬八哥屬。不過，只要觀察嘴喙和尾羽的顏色，就能分辨牠們：白尾八哥尾羽末段白色，嘴喙黃色，所以又稱「黃嘴八哥」；臺灣冠八哥嘴喙白色、鼻頭有明顯的冠羽，尾羽只有少許白色，因為是臺灣原生種，也被稱為「臺灣八哥」。
