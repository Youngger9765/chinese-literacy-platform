    text: >-
      他緊緊抓住對手的柔道衣，他隨時感受到對手重心的移動，一抓到時機，就要運用技巧和力量，將對手狠狠的摔在地板上；就算被對手壓制，他也能冷靜應對，一個翻身就能將劣勢轉為優勢。他是目前男子60公斤量級世界第一的柔道選手──楊勇緯。楊勇緯從小就以自律和強韌的心理素質受到矚目。國小三年級，他就跟著哥哥一同練習柔道，最後擊敗哥哥成為國手。哥哥說：「勇緯勤於訓練，每天都提早三、四十分鐘到校練習，連休息時間也不得閒，總是不斷的精進自己。」楊媽媽也說，「其實沒有什麼天才啦，是勇緯自己埋頭苦幹，老師給他課表，他就按部就班去做。」楊勇緯的飲食也有嚴格的要求。有位記者採訪楊勇緯時，點了份薯條給他，卻馬上被拒絕：「我不能吃油炸的，當選手後就很克制！」比賽要到了，他更是小心注重，怎麼吃，怎麼睡，總要讓自己身體保持在最佳的狀態。不但如此，他隨身帶著手掌般大小的小冊子，隨時用工整的字記下每天所學、所想和該注意的事項，從不放掉任何精進的機會。心、體、技！心、體、技！競技場上，除了體能和技術，心理素質更是成敗關鍵。楊勇緯說：「賽前，我學會把注意力全部放在比賽上，讓身邊的干擾降到最低，專注在當下。先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼，好讓自己多一點機會。」數年的苦練，2021年楊勇緯在東京奧運一路過關斬將，挺進六十公斤級金牌戰，最後卻不幸敗給日本選手，只得到銀牌。「奪奧運銀牌的心情如何？」記者問。楊勇緯眼眶泛紅，激動的說：「想拿金牌！」記者安慰：「拿銀牌也很好啊！」楊勇緯再也止不住淚水，搖著頭的對著鏡頭再說一次：「我的目標是金牌！」雖然失去了金牌，但楊勇緯仍展現了強大的心理素質，他說：「失敗讓你更成長，讓你知道自己哪裡做不好，在下一個階段更上層樓。」經歷了東奧的挫折後，2021、2022年楊勇緯奪下兩面柔道大滿貫金牌。他用行動告訴大家，他不只是拿獎牌的選手，更是一位自律嚴格、內心強大，能把挫折當養分，持續優化細節的運動員楷模。

