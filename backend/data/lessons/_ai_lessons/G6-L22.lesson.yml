id: G6-L22
lesson_code: G6-L22
title: 小兵立大功：雞鳴狗盜的故事
blocks:
  # ── 左欄閱讀材料：完整課文 p1..p9 (與朗讀同源，依原序) ──────────────────────
  - id: p1
    type: paragraph
    text: >-
      中國的戰國時期，有七個國家總是爭強鬥勝、互比苗頭，為了要在競爭中勝出，各國都在搶傑出的管理人才，其中最有名的人才，就是齊國的孟嘗君。孟嘗君是有錢的貴族，最讓人津津樂道的是他在家裡養了三千名食客，食客就是在家裡吃飯的客人，三千人開飯的場面一眼望不完，真是非常壯觀。只要自認為有本事的人來投奔孟嘗君，他二話不說，總是張開雙手歡迎。這些食客具備各式各樣的才能，可以隨時幫他解決各種問題。
  - id: p2
    type: paragraph
    text: >-
      公元前299年，秦昭王聽說孟嘗君的賢達，便邀請他到秦國當宰相。孟嘗君便高高興興的和一批食客一起去秦國赴任。天有不測風雲，誰知道到了秦國，還沒有登上相位，就有人看他不順眼，開始對秦昭王咬耳根：「他是齊國人，做決策時一定先想齊國的好處，而後才考慮秦國，這樣可危險了。」秦昭王多疑狠毒，這些讒言讓他心裡的懷疑、猜忌一起發作，他不但開除了孟嘗君，還動了殺心，心想：「這人我不用，也不能給別人用。」便把他軟禁起來。
  - id: p3
    type: paragraph
    text: >-
      大事不妙了，孟嘗君每一根汗毛都感受得到死亡的威脅。這時他想到美女幸姬，秦昭王最寵愛的小老婆，可能是讓自己死裡逃生的關鍵人物。孟嘗君托人去見幸姬，開門見山向她求救。結果幸姬開了個條件說：「我想要那件白狐裘皮大衣。」原來孟嘗君來秦國時，帶了一件價值千金、舉世無雙的白狐裘皮大衣送給秦昭王當見面禮。愛漂亮的幸姬看在眼裡，從此日日夜夜都幻想著這件皮大衣穿在自己身上的樣子，因此趁機向孟嘗君索取：「我也要一件。」
  - id: p4
    type: paragraph
    text: >-
      這下孟嘗君頭大了，大衣只有一件，已經送給秦昭王，現在他的女人又要一件，如果不給，自己就凶多吉少。他立刻召集手下的食客開緊急會議，看怎麼解決問題。食客們面面相覷，會議現場鴉雀無聲。終於，一位坐在最後面、總是悶不吭聲的食客說話了：「我能得到那件皮大衣」。這位矮小瘦削的食客，在投奔孟嘗君時就說過自己的特長是「狗盜」──模仿狗的樣子和動作潛入家戶偷東西，他說他能潛入秦王收藏寶物的庫房盜取白狐裘，這事聽來匪夷所思，但事已至此，只能試試了。
  - id: p5
    type: paragraph
    text: >-
      當晚，夜黑風高，狗盜先生一身黑衣出任務去。又累又焦慮的孟嘗君徹夜失眠，正在孤燈前踱方步時，門開了。狗盜先生捧了個包袱進來，在桌上攤開，白狐裘雪亮的光芒帶來了活下去的希望。
  - id: p6
    type: paragraph
    text: >-
      得到白狐裘的幸姬芳心大悅，當夜就用撒嬌的聲音在枕邊為孟嘗君說好話，秦昭王被美女迷得暈頭轉向，下令解除對孟嘗君的軟禁，命令即刻生效。
  - id: p7
    type: paragraph
    text: >-
      孟嘗君太了解秦昭王的性格了，他必須趁著秦昭王還在美人窩裡昏睡時，儘快離開險地，以免他清醒後突然又開始「想念」孟嘗君。於是他率著眾食客迅速離開軟禁之處，連夜逃離咸陽城，一行人馬來到函谷關下，要出了城門，才算真正離開秦國國土，但新的問題來了，他們出不了關。
  - id: p8
    type: paragraph
    text: >-
      依照當時的法令，守城的士兵天亮才能開城門。兩千多年前沒有時鐘，人們聽著公雞的叫聲，來判定天亮了，所以士兵必須聽到雞鳴，才能開城門讓人們進出。狀況緊急，時間慢的像蝸牛，寒夜裡，孟嘗君額頭上全是冷汗。這時，一位食客雞鳴先生站出來了，他說「老大，我會學雞叫，讓我來試試看。」他站在城下，半合著手掌靠近嘴巴，發出唯妙唯肖的公雞鳴叫聲，他的叫聲嘹亮悠揚，立刻誘發附近公雞們的鬥志，都不甘示弱的叫了起來，雄雞報曉的聲音此起彼落。
  - id: p9
    type: paragraph
    text: >-
      函谷關的門終於打開，孟嘗君和食客們策馬狂奔而出，消失在夜色裡。秦昭王一早離開美人窩後，果然開始「想念」孟嘗君，當他發現軟禁處已經人去樓空，立刻派兵快馬加鞭去追，但這時孟嘗君已經脫困，來到安全的地方了。

  # ── 右欄作答區：閱讀聚光燈引導流程 (guided_steps) ───────────────────────────
  - id: ex-spotlight
    type: exercise
    question:
      kind: guided_steps
      strategy_name: 摘要策略──問題.解決.結果結構
      instruction: >-
        好故事，大家都愛看。為什麼？因為主角不是一帆風順，而是會遇到困難，然後想辦法解決，最後扭轉局面，迎向結局。這樣的故事最精彩、最吸引人！所以，一個經典又精彩的故事，常常有四個重點：❶主角是誰？　❷主角遇到了什麼「問題」？　❸問題如何「解決」？　❹最後得到什麼「結果」？今天，我們就來學一個超實用的閱讀方法，用「問題、解決、結果」的方式來整理故事內容，幫助你輕鬆抓到重點。
      steps:
        # ── 子流程 1：範例(烏鴉喝水) — 故事不在課文，放本區第一步 context ──
        - prompt: ❶主角是誰？
          type: free_text
          reference_answer: 烏鴉
          section: 例一：烏鴉喝水
          context: >-
            天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。
        - prompt: ❷主角遇到了什麼「問題」？
          type: select
          options:
            - 喝不到水
            - 天氣炎熱
          answer: 0
          section: 例一：烏鴉喝水
        - prompt: ❸問題如何「解決」？
          type: free_text
          reference_answer: 叼來小石頭丟進瓶子裡，讓水面升高。
          section: 例一：烏鴉喝水
        - prompt: ❹最後得到什麼「結果」？
          type: select
          options:
            - 主角順利喝到水
            - 主角沒有喝到水
          answer: 0
          section: 例一：烏鴉喝水

        # ── 子流程 2：課文故事(雞鳴出關) — 學習單給的簡化版，放本區第一步 context ──
        - prompt: ❶主角是誰？
          type: select
          options:
            - 孟嘗君
            - 秦昭王
            - 雞鳴先生
          answer: 0
          section: 課文故事：雞鳴先生出關
          context: >-
            孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。孟嘗君一行人順利出關，逃出秦國。
        - prompt: ❷主角遇到了什麼「問題」？
          type: select
          options:
            - 被追兵追到
            - 天沒亮，城門不能開
          answer: 1
          section: 課文故事：雞鳴先生出關
        - prompt: ❸問題如何「解決」？孟嘗君的食客【　？　】，引來附近公雞也一起叫。
          type: free_text
          reference_answer: 模仿雞叫
          section: 課文故事：雞鳴先生出關
        - prompt: ❹最後得到什麼「結果」？
          type: select
          options:
            - 成功出關
            - 沒有出關
          answer: 0
          section: 課文故事：雞鳴先生出關

        # ── 子流程 3：小試身手一(狗盜偷白狐裘) — 學習單給的簡化版，放本區第一步 context ──
        - prompt: ❶主角是誰？
          type: select
          options:
            - 秦昭王
            - 孟嘗君
            - 幸姬
            - 狗盜先生
          answer: 1
          section: 小試身手一：狗盜偷白狐裘
          context: >-
            孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很開心，幫孟嘗君在秦王面前說好話。秦王聽信她的話，便放了孟嘗君。
        - prompt: ❷主角遇到了什麼「問題」？
          type: select
          options:
            - 沒錢買白狐裘
            - 幸姬要白狐裘但已送給秦王
            - 找不到人幫忙
          answer: 1
          section: 小試身手一：狗盜偷白狐裘
        - prompt: ❸問題如何「解決」？
          type: select
          options:
            - 拜託秦王讓給幸姬
            - 再去買一件
            - 食客潛入寶庫偷回白狐裘
          answer: 2
          section: 小試身手一：狗盜偷白狐裘
        - prompt: ❹最後得到什麼「結果」？
          type: select
          options:
            - 幸姬幫忙說話，秦王放了孟嘗君
