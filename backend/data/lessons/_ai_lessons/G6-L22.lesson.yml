            - 秦王說話不算話，不肯放人
          answer: 0
          section: 小試身手一：狗盜偷白狐裘

        # ── 子流程 4：小試身手二(大象有多重？曹沖秤象) — 故事不在課文，放本區第一步 context ──
        - prompt: ❶主角是誰？
          type: select
          options:
            - 曹操
            - 曹沖
          answer: 1
          section: 小試身手二：大象有多重？
          context: >-
            有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。
        - prompt: ❷主角遇到了什麼「問題」？
          type: free_text
          reference_answer: 大象太重，沒辦法秤。
          section: 小試身手二：大象有多重？
        - prompt: ❸問題如何「解決」？
          type: select
          options:
            - 請工人抬大象放到大磅秤上秤重
            - 讓大家猜一個大概的重量
            - 用船的下沉水位線比對石頭重量，間接秤量體重
          answer: 2
          section: 小試身手二：大象有多重？
        - prompt: ❹最後得到什麼「結果」？
          type: select
          options:
            - 知道大象的重量
            - 不知道大象的重量
          answer: 0
          section: 小試身手二：大象有多重？
