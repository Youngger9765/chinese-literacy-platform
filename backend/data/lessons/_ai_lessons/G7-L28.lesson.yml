id: G7-L28
lesson_code: G7-L28
title: 看不見的兇手:以實驗破解肉湯腐敗之謎
blocks:
  # ── 課文段落 (段1~5) — anchored by the spotlight steps ──────────────────────
  - id: p1
    type: paragraph
    text: >-
      「為什麼煮好的肉湯，過了幾天就會腐敗，變酸發臭，甚至長蟲？」在還沒有顯微鏡的時代，人類還不知道有細菌或微生物的存在，對這個問題，最普遍的解釋是「自然發生說」——肉湯之所以會壞掉，是因為湯裡含有某種特殊條件，讓無生命的物質變成生命。只要溫度、濕度、空氣合適，就能自己長出生物，讓湯腐敗。
  - id: p2
    type: paragraph
    text: >-
      但法國的科學家巴斯德卻有一個新的說法，他認為，也許是有人類看不見的微生物造成肉湯腐敗。滾燙的肉湯涼了以後，空氣中的微生物掉進湯裡，就導致了肉湯腐敗。如果這個解釋正確，巴斯德提出假設：「只要把肉湯煮沸，並且阻止空氣中的微生物落入湯裡，肉湯即使接觸空氣，應該也不會腐敗。」
  - id: p3
    type: paragraph
    text: >-
      為了檢驗這個假設，1865年，他設計了一種鵝頸玻璃瓶，如圖一，並在三種情況下進行實驗。情境①：先把瓶中的肉湯煮沸，之後讓鵝頸瓶保持開口，外界空氣仍可進入，但空氣中的微生物會被彎曲的瓶頸攔住，沉積在頸部，因此無法進入瓶中的肉湯。結果發現：經過很長時間，瓶中的肉湯仍然清澈，沒有腐敗。情境②：巴斯德將瓶頸折斷，空氣中若有微生物，就會掉進湯裡；情境③：把瓶身傾斜，讓肉湯流到瓶口，接觸到可能存在的微生物。結果，第②、③種情況下，肉湯很快就發臭了。
  - id: p4
    type: paragraph
    text: >-
      這些結果支持了巴斯德的假設——肉湯腐敗的原因，來自於環境中原本存在的微生物。巴斯德的結論是：生物只能來自既有生物，腐敗與微生物污染有關。他進一步主張，若要避免食物腐敗，預防疾病，只要控制微生物來源就可以了。
  - id: p5
    type: paragraph
    text: >-
      巴斯德的鵝頸瓶實驗不只回答了生命是否會自然產生的問題，也改變了醫學、生物學與公共衛生的發展方向，今天我們日常生活中，食物的消毒、滅菌、無菌操作，疫情時強調洗手、戴口罩的重要性，都與這項研究的精神息息相關。

  # ── 圖一 — physically printed after 段五 (end of 讀全文), semantically referenced
  #    by 段三「…設計了一種鵝頸玻璃瓶，如圖一…」. Three arrow-flow scenarios. ──
  - id: fig-1
    type: figure
    label: 圖一
    caption: >-
      巴斯德鵝頸瓶實驗的設計與程序。以箭頭呈現三個情境：情境①煮沸→靜置燒瓶→肉湯不腐敗；情境②煮沸→打斷瓶頸後靜置→肉湯開始腐敗；情境③煮沸→肉湯接觸瓶口後靜置→肉湯開始腐敗。
