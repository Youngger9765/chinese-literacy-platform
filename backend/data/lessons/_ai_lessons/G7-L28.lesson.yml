          options:
            - 用箭頭呈現三個實驗情境的進行方式與結果
            - 用顏色呈現三種肉湯的不同味道
          answer: 0
        - section: 步驟❶：先看圖——看整體，預測本文主要在談什麼
          prompt: 圖一整體來看，這張圖最像在比較什麼？
          type: select
          options:
            - 肉湯在什麼情境下會產生改變？
            - 肉湯加熱後，會產生什麼改變？
          answer: 0
        - section: 步驟❶：先看圖——看整體，預測本文主要在談什麼
          prompt: 根據圖一，你猜這篇文章最可能想回答哪一個問題？
          type: select
          options:
