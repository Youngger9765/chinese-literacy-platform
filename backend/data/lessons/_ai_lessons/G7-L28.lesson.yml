          prompt: 圖一的標題是什麼？
          type: free_text
          reference_answer: 巴斯德的鵝頸瓶實驗的設計與程序
        - section: 步驟❶：先看圖——看整體，預測本文主要在談什麼
          prompt: 實驗共有幾個情境？
          type: free_text
          reference_answer: 三個
        - section: 步驟❶：先看圖——看整體，預測本文主要在談什麼
          prompt: 圖一用什麼方式呈現實驗？
