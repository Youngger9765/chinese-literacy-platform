          context: "我們可以這樣思考：第一段有三個句子，第一句和第二句都是描述「不好的事」，我覺得第二句「發現超過3000隻野鳥屍體」更嚴重，所以我留下第二句，並把第二句畫線。"
          prompt: "❷精簡重點句：請判斷第1段的「問題」可以精簡成哪一個句子？（二選一）"
          type: select
          options:
            - "1.有大量的野鳥中毒死亡。"
            - "2.在屏東縣做田野調查。"
          answer: 0
        # 二、找「解決」（對應第 4 段）
        - section: "二、找「解決」"
          context: "祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡，一個精彩的故事，通常有多個解決方法。"
          prompt: "❶找重點句（第4段）：請你先判斷哪些句子是描述「有人想出辦法或行動的句子」。（三選二，可複選）"
          type: multi_select
          options:
            - "解決1：屏東科技大學在縣政府的協助下，找上當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這個生態的悲劇。"
            - "解決2：林先生坦承錯誤，自2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。"
            - "解決3：林先生雖然成為無毒農法的先驅，但這樣做成本高，18公頃紅豆田的收入，比過去少了100萬，因此無法大量推廣，只能苦撐待變。"
          answer: [0, 1]
        - section: "二、找「解決」"
          context: "我們可以這樣思考：解決1和2，都是描述為了野鳥中毒死亡問題，句子都是「誰＋做了什麼事」。"
          prompt: "❷精簡重點句：請判斷「解決1」可以精簡成底下哪一個句子？（二選一）"
          type: select
          options:
            - "1.屏科大找林先生溝通。"
            - "2.屏科大找縣政府協助。"
          answer: 0
        - section: "二、找「解決」"
          prompt: "❷精簡重點句：請判斷「解決2」可以精簡成底下哪一個句子？（二選一）"
          type: select
          options:
