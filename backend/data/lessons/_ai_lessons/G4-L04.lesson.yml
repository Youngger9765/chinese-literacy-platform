  # ── 六 閱讀聚光燈：條件複句（guided_steps）────────────────────────────────
  # part1 打勾單選（3 題）+ part2 連連看（5 配對），每一項為一個 select step。
  - id: ex-spotlight
    type: exercise
    question:
      kind: guided_steps
      strategy_name: 閱讀聚光燈－條件複句
      instruction: "條件複句的前句是『條件』、後句是『結果』（如「只要獲得獎牌，就有保送升學的機會」）。先辨別句子的條件與結果，選出／連出正確的分句。"
      steps:
        # part1 — 辨別句子的意思，選出適當的分句（單選）
        - prompt: "1. 只要妹妹想畫畫，＿＿"
          type: select
          options: ["就會拿起彩色筆。", "就會穿上游泳衣。"]
          answer: 0
        - prompt: "2. 只要＿＿，就會有很多人出國去玩。"
          type: select
          options: ["放暑假", "開學"]
          answer: 0
        - prompt: "3. 只要有人打電話求助，＿＿"
          type: select
          options: ["警察就會立刻提供援助。", "植物就可以快速生長。"]
          answer: 0
        # part2 — 連連看（左條件 → 右產生結果）
        - prompt: "連連看：只要遵照訓練菜單，＿＿"
          type: select
          options: ["就可以加入籃球隊。", "就有機會打敗敵人。", "隔天就無精打采。", "都改變不了既定的事實。", "否則你不能出去玩。"]
          answer: 1
        - prompt: "連連看：你沒有早睡早起，＿＿"
          type: select
          options: ["就可以加入籃球隊。", "就有機會打敗敵人。", "隔天就無精打采。", "都改變不了既定的事實。", "否則你不能出去玩。"]
          answer: 2
        - prompt: "連連看：不管你再怎麼辯解，＿＿"
          type: select
          options: ["就可以加入籃球隊。", "就有機會打敗敵人。", "隔天就無精打采。", "都改變不了既定的事實。", "否則你不能出去玩。"]
          answer: 3
        - prompt: "連連看：哥哥只要再長高一點，＿＿"
          type: select
          options: ["就可以加入籃球隊。", "就有機會打敗敵人。", "隔天就無精打采。", "都改變不了既定的事實。", "否則你不能出去玩。"]
          answer: 0
        - prompt: "連連看：除非把功課寫完，＿＿"
          type: select
          options: ["就可以加入籃球隊。", "就有機會打敗敵人。", "隔天就無精打采。", "都改變不了既定的事實。", "否則你不能出去玩。"]
          answer: 4
    answer_space: free_text
    answer: [0, 0, 0, 1, 2, 3, 0, 4]
    grader: rubric_ai
    anchors:
      - { block_id: p1 }
      - { block_id: p2 }

