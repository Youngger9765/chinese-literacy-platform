fill_in_blank:
- sentence: 今年校慶我們班要表演舞臺劇，到時全班都會(　　)。
  answer: D
- sentence: 颱風來襲，狂風呼嘯而過，暴雨(　　)，整個城市瞬間被雨淹沒。
  answer: E
- sentence: 學校旁荒廢許久的公園整修後，令人(　　)。
  answer: Ｃ
- sentence: 這款新零食，不僅好吃而且好玩，受到消費者的(　　)。
  answer: Ｆ
- sentence: 運動會上，參賽選手(　　)，努力爭取最好的成績。
  answer: A
- sentence: 士兵(　　)的列隊行走，圍觀的路人都覺得太酷了！
  answer: Ｇ
- sentence: 林家的女兒到了適婚年齡，父母決定在村子貼公告(　　)，希望能為女兒找到合適的丈夫。
  answer: Ｂ
multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 小狗一直追著自己的尾巴跑，「尾隨而至」的模樣，真是可愛極了！
  - 家裡換了新的窗簾和新的沙發後，整個環境令全家人「耳目一新」。
  - 王阿姨的兒子小時候不小心走失了，於是她上網「招親」找兒子。
  - 姊姊參加繪畫比賽，帶著常用畫具和粉彩筆，準備「粉墨登場」。
  answer: B
  explanation: 「耳目一新」的解釋為「聽到的和看到的都和以前不同，讓人感覺很新鮮」，句中描述家裡換了新窗簾和新沙發後，環境給人煥然一新的感覺，符合其語意。
- question: 根據本文，下列關於動物求偶的敘述，何者不恰當？
  options:
  - 求偶的方式十分多元
  - 求偶的時間各不相同
  - 求偶目的為繁衍後代
  - 不同動物求偶地點皆相同。
  answer: D
  explanation: 課文中提到青蛙在池塘裡求偶，五色鳥站在茂密枝葉搭起的舞台上，雌蛾則在花園裡、田野間吸引雄蛾，這些求偶地點明顯不同，因此選項D不恰當。
- question: 本文主旨為何？
  options:
  - 作者對大自然被破壞感到憂心，希望大家能盡可能地愛護動物。
  - 作者非常喜愛動物，希望動物能多多繁衍，豐富大自然的風采。
  - 動物求偶的方式不一，目的都在繁衍後代，同時也讓自然更豐富。
  - 動物要足夠強大，才能在險惡的自然環境中繁衍後代，不被淘汰。
  answer: C
  explanation: 課文開頭明確指出「本課是一個說明文，主要是介紹和動物求偶有關的知識」，並透過青蛙、五色鳥、雌蛾等不同動物的例子，說明牠們以歌聲或氣味等「方式不一」的方法「求偶」，最終目的都是「繁衍後代」，這也讓大自然
- question: 小華閱讀了<口腔保健>一文，文章內有多個小標題，請問下列何者較不可能是它的小標題？
  options:
  - 裝飾牙齒的方法
  - 牙齒疾病形成原因
  - 潔牙方式與步驟
  - 牙齒的功能與分類。
  answer: A
  explanation: <口腔保健>這篇文章的核心內容應聚焦於牙齒的健康維護、疾病預防與治療等，而「裝飾牙齒的方法」屬於美容範疇，與「保健」的主題關聯性較弱。
- question: 大雄這週作文題目是<動物界的奶爸>，其中一個小主題想要寫「海馬」，於是上網查了資料，下面哪段文字最適合放進小主題裡呢？
  options:
  - 雄海馬提供脂肪及鈣質，幫小海馬長出骨骼。
  - 生下小海馬之前，雄海馬有複雜的求偶儀式。
  - 海馬喜歡生活在有珊瑚、海草的海洋環境中。
  - 研究發現母海馬會提供充分的營養給小海馬。
  answer: A
  explanation: 大雄作文的題目是「動物界的奶爸」，因此內容應著重於動物父親如何照顧後代。選項A描述雄海馬（父親）提供營養幫助小海馬生長，符合「奶爸」的角色定位。
