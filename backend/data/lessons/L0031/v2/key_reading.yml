passage: '心、體、技，缺一不可。競技場上，除了體能和技術，心理素質更是成敗關鍵。楊勇緯說：「賽前，我學會把注意力全部放在比賽上，讓身邊的干擾降到最低，專注在當下。先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼，好讓自己多一點機會。」

  經過多年苦練，2021年楊勇緯在東京奧運一路過關斬將󠇡，挺進六十公斤級金牌戰，最後卻不幸敗給日本選手，只得到銀牌。「奪奧運銀牌的心情如何？」記者問。楊勇緯眼眶泛紅，激動的回答：「想拿金牌！」記者安慰：「拿銀牌也很好啊！」楊勇緯再也止不住淚水，他搖搖頭，對著鏡頭再次說：「我的目標是金牌！」

  雖然未能拿下金牌，楊勇緯仍展現出面對挫折的力量，他說：「失敗讓你更成長，讓你知道自己哪裡做不好，在下一個階段更上層樓。」'
