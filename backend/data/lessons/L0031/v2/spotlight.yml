spotlight:
  lesson: G5-L1
  strategy_name: 推論策略-找言行，認識人物特質
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: 小安答應幫忙收作業。他說：「交給我，我會整理好。」放學前，他仔細清點，發現少了一份，便主動提醒同學補交。「交給我，我會整理好」是小安說的話；「仔細清點、主動提醒同學」是小安做的事。從小安說話和做的事，可以看出他很負責任。「負責任」是人物特質。人物特質，就是一個人常表現出來的做事方式或態度。文章有時會直接寫出人物特質，有時則要從人物說的話和做的事來推論。本課一開始就寫出楊勇緯具有「自律」和「強韌的心理素質」。接下來，我們要練習回到課文，找出能支持這些特質的言行。我們可以用三個步驟，找出能說明人物特質的言行：❶找特質：課文寫出人物具有什麼特質？❷找言行：哪些話或做法能看出這個特質？❸對一對：這些言行真的能說明這個特質嗎？
  - type: guide
    text: 一、判斷：這是人物特質？還是言行？
  - type: guide
    text: 請判斷下面的內容是人物「做的事」、「說的話」，還是「人物特質」，並在正確的格子裡打勾。
  - type: table
    rows:
    - - 內容
      - 做的事
      - 說的話
      - 人物特質
    - - ①「我的任務，我一定會做好。」
      - □
      - □
      - □
    - - ②輪到他照顧班級植物，他每天都記得澆水。
      - □
      - □
      - □
    - - ③負責任
      - □
      - □
      - □
  - type: guide
    text: →小提醒：人物說了什麼、做了什麼，可以幫助我們看出他是怎樣的人；  「負責任」就是人物特質。
  - type: guide
    text: 二、找線索：哪些言行能支持「自律」？
  - type: guide
    text: 課文直接寫出楊勇緯具有「自律」的特質。請先判斷每個線索是人物「說的話」還是「做的事」，再判斷它能不能支持「自律」？
  - type: table
    rows:
    - - 文中線索
      - 這是什麼？
      - 能不能支持「自律」？
    - - ①每天提早三、四十分鐘到校練習。
      - □說的話 □做的事
      - □能 □不能
    - - ②「我不能吃油炸的，當選手後就很克制！」
      - □說的話 □做的事
      - □能 □不能
    - - ③按照老師給的課表，一步一步完成訓練。
      - □說的話 □做的事
      - □能 □不能
    - - ④「我的目標是金牌！」
      - □說的話 □做的事
      - □能 □不能
    - - ⑤國小三年級時，跟著哥哥開始練習柔道。
      - □說的話 □做的事
      - □能 □不能
    - - ⑥隨時記下每天所學和需要注意的事情。
      - □說的話 □做的事
      - □能 □不能
  - type: guide
    text: →你發現了嗎？不是所有人物說的話、做的事，都能支持同一項特質。能支持「自律」的線索，要能看出人物會要求自己、按照計畫行動。
  - type: guide
    text: 三、合起來想：這些線索表現出什麼特質？
  - type: guide
    text: 讀一讀下面的線索，先勾選最符合的說明，再想想這些線索有什麼共同點？
  - type: table
    rows:
    - - 文中線索
      - 從線索可以看出……
    - - ①被對手壓制時，他仍能冷靜應對，找機會將劣勢轉為優勢。
      - □①遇到壓力時，仍能冷靜思考應對方法。□②他的柔道技巧很好，每次都能取得優勢。
    - - ②「先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼。」
      - □①只要按照固定步驟調整，就能贏得比賽。□②受到干擾時，懂得調整自己、重新專注。
    - - ③東奧失利後，他持續調整改進，後來奪下兩面柔道大滿貫金牌。
      - □①遇到挫折後，仍能繼續改進、朝目標前進。□②只要參加更多比賽，就能自然獲得好成績
    - - 1.三個線索合起來看，它們有什麼共同點？□①面對壓力或挫折時，他能調整自己，繼續想辦法前進。□②他很重視比賽輸贏，總是希望自己獲得最好的成績。
    - - 2.這些線索，最能表現楊勇緯的哪一項特質？□①沉著冷靜    □②做事謹慎    □③強韌的心理素質
  - type: guide
    text: →小提醒：強韌的心理素質，是指面對壓力或挫折時，能調整自己，不輕易被困難打倒。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能分辨人物的言行和人物特質。
    - 我能判斷哪些言行能支持人物特質。
    - 我能把幾個線索合起來，選出最適合的人物特質。
