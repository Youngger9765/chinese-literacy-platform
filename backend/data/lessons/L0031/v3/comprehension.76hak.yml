lesson_uid: L0031
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 第三段中的「注重」，意思最接近下列何者？
    options:
      A: 注意、重視
      B: 將視線注意在一點上
      C: 集中注意力，精神專注
      D: 上天早已決定，非人力所能改變
    teacher_note: 各選項後面分別註「（注重）」「（注目）」「（全神貫注）」「（注定）」，標出該敘述對應的詞
  - index: 2
    answer: D
    stem: 根據第二段，楊勇緯後來能在國手選拔賽中擊敗哥哥，最可能與哪一項行為有關？
    options:
      A: 哥哥在比賽中禮讓弟弟
      B: 楊勇緯天生比哥哥厲害
      C: 楊勇緯三年級就學柔道
      D: 他長期勤於訓練、持續精進
    teacher_note: D 後面註「（第二段）」
  - index: 3
    answer: B
    stem: 楊勇緯說：「我的目標是金牌！」你認為他說這句話的心情是什麼？
    options:
      A: 憤怒，因為被判犯規輸給對手
      B: 不甘心，因為沒為臺灣拿到金牌
      C: 驕傲，獲得臺灣柔道奧運銀牌
      D: 恐懼，因為達不成人民的期望
    teacher_note: （第五段，楊勇緯眼眶泛紅，激動的說「想拿金牌！」）
  - index: 4
    answer: C
    stem: 根據第四段，楊勇緯如何讓自己在比賽中重新專注？
    options:
      A: '遇到挫折

        思考意義

        幫助成長'
      B: '提早到校

        勤於練習

        精益求精'
      C: 深呼吸冷靜→調整心情→思考下一步
      D: '雙手緊握

        仔細觀察

        壓制對手'
    options_note: A、B、D 三項在版面上是用箭頭串起三個詞（Wingdings 3 F022），此處以換行代替；C 用的是文字「→」
    teacher_note: （第三段，先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼，好讓自己多一點機會。）
  - index: 5
    answer: D
    stem: 根據全文，下列哪一句最適合作為本文結語？
    options:
      A: 思考會讓你的思想更強大
      B: 不怕你犯錯，只要你改過
      C: 人生要放慢腳步，才能欣賞沿途的美景
      D: 自律讓人進步，挫折也能帶來成長
    teacher_note: （第六段，因為失敗會讓你更成長）
