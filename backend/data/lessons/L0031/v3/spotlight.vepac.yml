lesson_uid: L0031
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略——找言行，認識人物特質
  strategy_type: comprehension_strategy
  blocks:
  - type: concept_box
    text: '小安答應幫忙收作業。他說：「交給我，我會整理好。」放學前，他仔細清點，發現少了一份，便主動提醒同學補交。

      「交給我，我會整理好」是小安說的話；「仔細清點、主動提醒同學」是小安做的事。從小安說話和做的事，可以看出他很負責任。「負責任」是人物特質。

      人物特質，就是一個人常表現出來的做事方式或態度。文章有時會直接寫出人物特質，有時則要從人物說的話和做的事來推論。

      本課一開始就寫出楊勇緯具有「自律」和「強韌的心理素質」。接下來，我們要練習回到課文，找出能支持這些特質的言行。

      我們可以用三個步驟，找出能說明人物特質的言行：

      ❶找特質：課文寫出人物具有什麼特質？

      ❷找言行：哪些話或做法能看出這個特質？

      ❸對一對：這些言行真的能說明這個特質嗎？'
  - type: guide
    text: 一、判斷：這是人物特質？還是言行？
  - type: fill_table
    instruction: 請判斷下面的內容是人物「做的事」、「說的話」，還是「人物特質」，並在正確的格子裡打勾。
    columns:
    - 內容
    - 做的事
    - 說的話
    - 人物特質
    columns_note: 後三欄各是一個打勾格；此處用 options/answer 表達「這一列勾在哪一欄」
    rows:
    - 內容: ①「我的任務，我一定會做好。」
      options:
        1: 做的事
        2: 說的話
        3: 人物特質
      answer: 2
    - 內容: ②輪到他照顧班級植物，他每天都記得澆水。
      options:
        1: 做的事
        2: 說的話
        3: 人物特質
      answer: 1
    - 內容: ③負責任
      options:
        1: 做的事
        2: 說的話
        3: 人物特質
      answer: 3
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: guide
    text: →小提醒：人物說了什麼、做了什麼，可以幫助我們看出他是怎樣的人；  「負責任」就是人物特質。
  - type: guide
    text: 二、找線索：哪些言行能支持「自律」？
  - type: fill_table
    instruction: 課文直接寫出楊勇緯具有「自律」的特質。請先判斷每個線索是人物「說的話」還是「做的事」，再判斷它能不能支持「自律」？
    columns:
    - 文中線索
    - 這是什麼？
    - 能不能支持「自律」？
    rows:
    - 文中線索: ①每天提早三、四十分鐘到校練習。
      這是什麼？_options:
        1: 說的話
        2: 做的事
      這是什麼？_answer: 2
      能不能支持「自律」？_options:
        1: 能
        2: 不能
      能不能支持「自律」？_answer: 1
    - 文中線索: ②「我不能吃油炸的，當選手後就很克制！」
      這是什麼？_options:
        1: 說的話
        2: 做的事
      這是什麼？_answer: 1
      能不能支持「自律」？_options:
        1: 能
        2: 不能
      能不能支持「自律」？_answer: 1
    - 文中線索: ③按照老師給的課表，一步一步完成訓練。
      這是什麼？_options:
        1: 說的話
        2: 做的事
      這是什麼？_answer: 2
      能不能支持「自律」？_options:
        1: 能
        2: 不能
      能不能支持「自律」？_answer: 1
    - 文中線索: ④「我的目標是金牌！」
      這是什麼？_options:
        1: 說的話
        2: 做的事
      這是什麼？_answer: 1
      能不能支持「自律」？_options:
        1: 能
        2: 不能
      能不能支持「自律」？_answer: 2
    - 文中線索: ⑤國小三年級時，跟著哥哥開始練習柔道。
      這是什麼？_options:
        1: 說的話
        2: 做的事
      這是什麼？_answer: 2
      能不能支持「自律」？_options:
        1: 能
        2: 不能
      能不能支持「自律」？_answer: 2
    - 文中線索: ⑥隨時記下每天所學和需要注意的事情。
      這是什麼？_options:
        1: 說的話
        2: 做的事
      這是什麼？_answer: 2
      能不能支持「自律」？_options:
        1: 能
        2: 不能
      能不能支持「自律」？_answer: 1
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: guide
    text: →你發現了嗎？不是所有人物說的話、做的事，都能支持同一項特質。能支持「自律」的線索，要能看出人物會要求自己、按照計畫行動。
  - type: guide
    text: 三、合起來想：這些線索表現出什麼特質？
  - type: fill_table
    instruction: 讀一讀下面的線索，先勾選最符合的說明，再想想這些線索有什麼共同點？
    columns:
    - 文中線索
    - 從線索可以看出……
    rows:
    - 文中線索: ①被對手壓制時，他仍能冷靜應對，找機會將劣勢轉為優勢。
      從線索可以看出……_options:
        1: 遇到壓力時，仍能冷靜思考應對方法。
        2: 他的柔道技巧很好，每次都能取得優勢。
      從線索可以看出……_answer: 1
    - 文中線索: ②「先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼。」
      從線索可以看出……_options:
        1: 只要按照固定步驟調整，就能贏得比賽。
        2: 受到干擾時，懂得調整自己、重新專注。
      從線索可以看出……_answer: 2
    - 文中線索: ③東奧失利後，他持續調整改進，後來奪下兩面柔道大滿貫金牌。
      從線索可以看出……_options:
        1: 遇到挫折後，仍能繼續改進、朝目標前進。
        2: 只要參加更多比賽，就能自然獲得好成績
      從線索可以看出……_answer: 1
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: single
    label: 三-1
    prompt: 1.三個線索合起來看，它們有什麼共同點？
    options:
      1: 面對壓力或挫折時，他能調整自己，繼續想辦法前進。
      2: 他很重視比賽輸贏，總是希望自己獲得最好的成績。
    answer: 1
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: single
    label: 三-2
    prompt: 2.這些線索，最能表現楊勇緯的哪一項特質？
    options:
      1: 沉著冷靜
      2: 做事謹慎
      3: 強韌的心理素質
    answer: 3
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: guide
    text: →小提醒：強韌的心理素質，是指面對壓力或挫折時，能調整自己，不輕易被困難打倒。
  - type: self_check
    prompt: ◎自我檢核
    items:
    - 1.我能分辨人物的言行和人物特質。
    - 2.我能判斷哪些言行能支持人物特質。
    - 3.我能把幾個線索合起來，選出最適合的人物特質。
    no_correct_answer: true
    answer_carrier: 學生自我檢核，原稿三個 □ 都沒有勾
