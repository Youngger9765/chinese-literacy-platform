intro: 這篇文章介紹了柔道選手楊勇緯的成長歷程。文章描述了他如何透過嚴格的自我要求，包括勤奮的練習、飲食控制、細心記錄學習心得，以及在比賽中培養專注力與心理素質，來不斷精進自己。即使在東京奧運中未能達成金牌的目標，他也從中學習，並持續努力，最終在其他賽事中獲得佳績。透過楊勇緯的故事，我們可以看見一位運動員如何在挑戰中成長，並展現出堅韌的毅力與不斷追求卓越的精神。
strategy_explained: '這一課我們要練習「從楊勇緯的說話和做事，看出他有多厲害」

  因為這篇文章告訴我們，楊勇緯為了變強，不只練習，還會控制飲食、寫心得，比賽時也很專心，這些都是他很棒的特質

  讀的時候，你可以找找看，他做了哪些事，說了哪些話，來展現他有多認真，多麼想變更好'
