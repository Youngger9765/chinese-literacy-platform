  title: 奧運銀牌背後的自我鍛鍊
  layout: list
  rows:
  - label: 人物背景
    value: 主角是【　】，他從國小三年級開始練習柔道，後來成為國手。
    blanks:
    - answer: 楊勇緯
  - label: 人物特質
    value: 楊勇緯從小就很【　】，也有【　】。
    blanks:
    - answer: 自律
    - answer: 強韌的心理素質
  - label: 日常鍛鍊
    value: 楊勇緯平時怎麼要求自己？（多選）
    options:
      1: 每天提早三、四十分鐘到校練習。
      2: 按照老師給的課表，一步一步完成訓練。
      3: 控制飲食和作息，讓身體保持最佳狀態。
      4: 隨時記下所學和需要注意的事情。
      5: 只在比賽前加強練習，平時很少主動練習。
    answers:
    - 1
    - 2
    - 3
    - 4
