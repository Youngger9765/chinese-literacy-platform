  - label: 挫折
    value: 2021年東京奧運金牌戰中，他未能達成奪金目標，最後獲得【　】。
    blanks:
    - answer: 銀牌
  - label: 面對方式
    value: 他認為失敗能讓人【　】，也能幫助自己找出【　】，在下一個階段繼續進步。
    blanks:
    - answer: 成長
    - answer: 做不好的地方
  - label: 結果
    value: 東奧之後，他持續調整改進，在2021年及2022年的柔道【　】中，共奪下兩面金牌。
    blanks:
    - answer: 大滿貫賽
