lesson_uid: L0151
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（字元樣式 rStyle=af），PDF p9 可見
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1、3 題有
  questions:
  - index: 1
    answer: B
    stem: 下列語詞何者使用正確?
    options:
      A: 看見車禍，他「煽情」的呼叫路人一同幫忙
      B: 這件命案，經過警方「抽絲剝繭」，終於真相大白
      C: 他天生兩眼全盲，所以對任何東西都「視若無睹」
      D: 我們以天為被、地為席，「鋪天蓋地」徜徉在大自然中
    teacher_hint: Ａ.引發人情緒、Ｃ.誤用，不關心、Ｄ.誤用
    stem_note: 題末是半形問號「?」，原稿如此。
  - index: 2
    answer: C
    stem: 下列選項何者最符合本文結尾所提到「盡信書不如無書」的涵義？
    options:
      A: 沒有書本，世界上就可以減少紛爭
      B: 與其完全相信書，不如就不要讀書
      C: 讀書時，必須保有獨立懷疑的精神
      D: 如何選擇書中知識，全在一念之間
  - index: 3
    answer: A
    stem: 下列何者是「旁觀者效應」的例子？
    options:
      A: 老人跌倒受傷，路人都以為別人會幫忙，結果反而沒有人上前
      B: 善良的人，看到的都是美好；多疑的人，會認為別人都不懷好意
      C: 最近種植高麗菜利潤非常高，大家便一窩蜂到菜園裡栽種高麗菜
      D: 本來乾淨的公廁，只要有人不愛惜乾淨，大家就會跟著亂丟垃圾
    teacher_hint: '第3題解析：

      Ｂ.投射效應

      Ｃ.羊群效應

      Ｄ.破窗效應'
  - index: 4
    answer: D
    stem: 「長達43年，都沒有人對凱蒂案提出質疑？」最可能的原因為何？
    options:
      A: 一般老百姓並沒有管道與方法可以提出質疑
      B: 多數人會害怕自己的判斷與大家不一樣
      C: 大家都認為事不關己，不想多管閒事
      D: 過度相信權威與教科書記載，沒有重新查核
  - index: 5
    answer: D
    stem: 未來生活中若遇到真假難辨的訊息，我們應該怎麼做？
    options:
      A: 警察為人民保母、有問題可詢問警察
      B: 書中的知識都經過前人驗證，可相信
      C: 聽權威的科學家、醫師等專業人士怎麼說
      D: 多質疑、多檢驗，並保持探究的心
