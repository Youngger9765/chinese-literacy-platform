intro: 這篇文章從一樁發生在紐約的謀殺案談起，這起案件曾被廣泛報導，並引發了「旁觀者效應」的心理學理論。然而，作者透過深入調查，揭露了當初報導中的許多不實之處，以及後續學術界長期以來對此案例的誤用與忽略。文章藉此強調，即使是看似權威的科學發現或理論，也可能存在錯誤，因此我們不應全盤接受，而應保持質疑的精神，不斷檢驗，才能更接近真相。這種批判性思考的能力，在現今資訊爆炸的時代尤為重要。
