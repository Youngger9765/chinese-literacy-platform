strategy_explained: '這一課要練的是「查證新聞真偽」的本事，你會學到如何像偵探一樣，仔細看看報導是不是真的，背後有沒有藏其他目的

  這篇關於殺人案的文章很適合練習，因為它告訴我們，就算聽起來很厲害的科學說法，也可能出錯，不能什麼都信

  所以讀的時候，可以試著問問自己，這篇報導說的是真的嗎？有沒有其他證據可以證明或推翻它呢'
