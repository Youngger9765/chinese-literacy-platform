  items:
  - index: 1
    word: 抽絲剝繭
    definition: 比喻由淺入深，一層層深入分析，探求真相。
  - index: 2
    word: 鋪天蓋地
    definition: 形容聲勢很大，範圍很廣，好像連天空和地面都被覆蓋。
  - index: 3
    word: 劈頭
    definition: 指一開始就直接講或做，沒有緩和的過程。
  - index: 4
    word: 眼睜睜
    definition: 清楚看著壞事發生，但無法改變情況。
  - index: 5
    word: 援助
    definition: 援救幫助。
  - index: 6
    word: 煽情
    definition: 故意挑動情緒，以引起共同情感的反應。
  - index: 7
    word: 杜撰
    definition: 無事實根據、憑空捏造。
  - index: 8
    word: 令人髮指
    definition: 形容事情非常殘忍、可惡，使人憤怒到極點。
  - index: 9
    word: 最負盛名
    definition: 最具有名望。
  - index: 10
    word: 視若無睹
    definition: 雖然看到，但因不關心，好像沒有看到一樣。等同「視而不見」。
