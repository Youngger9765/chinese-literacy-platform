lesson_seq: 5140
intro: 這篇文章記錄了作者收到同學告白時的內心掙扎。面對突如其來的告白，作者感到驚訝、困惑，甚至有些煩惱，開始思考該如何回應才能不傷害對方，同時也顧慮到兩人之間的友誼。文章描寫了作者在猶豫過程中，對於感情的選擇、如何誠實面對自己的心意，以及最終做出回應的過程。透過這次經驗，作者體會到誠實表達感受的重要性，以及拒絕並不代表關係的終結。
notes:
  intro_topic: 品格力：SEL自我覺察
strategy_explained: '這一課我們要練習的是，當別人跟你表達好感時，如何溫柔而堅定地說出自己的想法，也就是「拒絕的藝術」

  文章裡，作者收到同學告白時，內心既驚訝又煩惱，一直在想怎麼回應才不會讓對方受傷，這就是練習如何好好表達自己真實感受的好機會

  所以讀的時候，你可以試著想想，如果是你，會怎麼做，也感受一下作者內心的各種想法'
