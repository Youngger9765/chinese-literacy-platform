version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank:
  - 映入眼簾
  - 忽視
  - 坦然
  - 惱怒
  - 尷尬
  - 悸動
  - 苦惱
  - 猶豫
  - 卸下
  vocabulary_bank_errata_ref: E1
  items:
  - index: 1
    word: 映入眼簾
    definition: 某個景象出現在眼前，常用來形容第一眼看到的畫面。
  - index: 2
    word: 尷尬
    definition: 處在不好意思、不知道該怎麼辦的情況中。
  - index: 3
    word: 苦惱
    definition: 感到困擾、不知道怎麼辦。
  - index: 4
    word: 坦然
    definition: 心裡平靜，能自然面對，不感到不安或愧疚。
  - index: 5
    word: 惱怒
    definition: 因為不高興而生氣。
  - index: 6
    word: 猶豫
    definition: 拿不定主意，不知道該不該做。
  - index: 7
    word: 忽視
    definition: 不重視、不在意某件事情或人。
  - index: 8
    word: 卸下
    definition: 拿下、放下；也可比喻放下心理負擔。
  - index: 9
    word: 悸動
    definition: 心跳突然加快的感覺，常因感動或緊張。
  answer_carrier: 橘色手寫字（圖形層），文字流有字但無顏色資訊
