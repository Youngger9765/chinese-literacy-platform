lesson_uid: L0026
version_id: v3
section_no: 六
spotlight:
  strategy_name: 人際溝通──拒絕的藝術
  strategy_type: character
  blocks:
  - type: concept_box
    text: '在人與人相處的過程中，每個人互動的方式和對關係的期待，往往都有自己的想法。這些期待沒有誰對誰錯，只是在彼此想法不同的時候，難免會有人出現困擾或受傷的感覺。

      在這篇文章裡，無論是勇敢告白的人，還是接收到告白的人，都展現了真誠、尊重與善意。今天就讓我們一起思考，當面對期待有落差的情境時，該如何表達自己的立場，同時也照顧彼此的心情。'
  - type: guide
    text: 一、人際經驗回顧：
  - type: multi
    no_correct_answer: true
    prompt: ◎請勾選你曾有過的期待落差經驗。(沒有標準答案，請依據自己的經驗勾選)
    options:
      1: 朋友希望和我交換秘密，但我想保持距離
      2: 有同學跟我告白，但我對那位同學沒有同樣的感覺
      3: 我希望和朋友更好，但對方好像沒有很熱情
      4: 朋友想邀我出去玩，但我並沒有特別想跟她出去
      5: 我鼓起勇氣向同學告白，但對方沒有回應
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 二、認識應對姿態：我們可以將人際溝通的姿態分成五種，而在拒絕的情境中，請勾選你曾聽過或遇過的應對方式。(請依據你自己的經驗勾選)
  - type: table
    columns:
    - 溝通姿態
    - 方式
    - 舉例
    checkbox_column: 溝通姿態
    no_correct_answer: true
    rows:
    - - 指責型
      - 否定或批評對方、冷淡或直接切割
      - '1.「你這樣我覺得很煩，你想太多了」

        2.直接封鎖'
    - - 打岔型
      - 轉移焦點，開玩笑、換話題
      - '1.朋友問小凱：「聽說你喜歡曉芬？」小凱：「欸！等一下要不要去福利社買東西？

        2.同學：「你怎麼今天頭髮那麼亂？」小明：「這叫流行啦！」'
    - - 理智型
      - 講道理或找藉口推辭
      - '1.「最近考試很多，還是不要太常約。」

        2.「我爸媽不准我交男女朋友。」'
    - - 討好型
      - 只顧對方感受，避免衝突。
      - '1.「沒辦法一直陪你玩，對不起啦」

        2.「你真的很棒，我不值得你喜歡啦」'
    - - 一致型
      - 坦白表達自己的感受與選擇，同時顧及對方感受。
      - '1.「我很喜歡和你一起打球，但有時我也想跟其他同學多互動。」

        2.「謝謝你的喜歡，但我對你沒有戀愛的感覺，希望我們可以繼續做朋友。」'
    note: 打岔型第 1 例原稿的下引號未閉合（「…買東西？ 後面沒有」），照原樣抄
  - type: single
    no_correct_answer: true
    prompt: ◎你覺得哪種拒絕方式最讓人受傷？（勾選）
    options:
      1: 指責型
      2: 打岔型
      3: 理智型
      4: 討好型
      5: 一致型
    answer_carrier: 學生自填，原稿無勾選
  - type: free_text
    no_correct_answer: true
    prompt: 為什麼呢？因為
    note: 原稿是一條手寫底線
  - type: multi
    no_correct_answer: true
    prompt: ◎根據你上一題的答案，換個角度想想，你認為為什麼有人會用這種方式拒絕呢？（勾選，可複選）
    options:
      1: 怕尷尬，不知道怎麼面對氣氛
      2: 不知道怎麼說才合適
      3: 怕傷對方心情或破壞友情
      4: 希望時間自然解決，「拖一拖就好了」
      5: 其實也沒那麼在乎對方的感受
      6: 怕被對方糾纏、不想再被問
      7: 想保護自己，避免被嘲笑或遭到報復
      8: 習慣用玩笑或模糊話語逃避尷尬場合
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 三、學習新方法：在文章中，告白的人及被告白的人都展現了真誠與善意，也較接近我們的「一致型」應對姿態，而無論是在友情、愛情或任何關係，當想表達不同互動期待時，我們都可以參考以下原則，請同步將你已經會使用的原則打勾──
  - type: table
    columns:
    - 會用的打勾
    - 原則
    - 目的
    - 舉例
    checkbox_column: 會用的打勾
    no_correct_answer: true
    rows:
    - - ①
      - 誠實──坦白說出自己的感受與界線
      - 誠實直接、避免誤會
      - '1.「我有時候比較想自己一個人待著，不是你的問題。」

        2.「我對你沒有戀愛的感覺，還是想當朋友。」'
    - - ②
      - 感謝──感謝對方的勇氣或付出
      - 讓對方能感受到心意有被看見和珍惜。
      - '1.「謝謝你總是願意陪我說心事。」

        2.「謝謝你願意坦白告訴我你的心意。」'
    - - ③
      - 尊重──給對方情緒和回應的空間
      - 尊重對方感受，讓對方自在表達情緒。
      - '1.「如果你覺得不太舒服，可以先跟我說。」

        2.「如果你需要時間調整心情，我都可以理解。」'
    - - ④
      - 祝福──善意祝福並尊重選擇
      - 讓關係自在、不強求。
      - '1.「希望我們還能自在做朋友，但如果你想保持距離我也懂。」

        2.「你很好，也希望你遇到真正適合你的人。」'
  - type: guide
    text: ◎小試身手
  - type: multi
    prompt: 根據以上原則，底下回應，哪些是最符合「一致型」，展現善意與尊重的？
    options:
      1: 「真的謝謝你對我的喜歡，但我現在的心情還沒準備好談感情。」
      2: 「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」
      3: 「我沒有那麼好啦，我覺得你不要考慮我，希望你不要生氣。」
      4: 「你為什麼要跟我說這個？不覺得這樣很尷尬嗎？」
      5: 「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」
      6: 「哈哈哈，你別鬧了啦，趕快去跟別人聊一聊啦！」
    answers:
    - 1
    - 5
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: guide
    text: ◎實戰練習
  - type: guide
    text: 根據以下情境，練習以真誠、善意的方式回覆。
  - type: figure
    referent: image
    text_carrier: image
    caption: 手機聊天畫面截圖：對方（小魚）傳來的告白訊息
    transcript: '小魚

      今天

      想和你說，希望你不要嚇到 其實我一直很喜歡你，覺得和你聊天很開心，也覺得我們想法很像，不知道你有沒有可能也喜歡我？

      7:27 PM'
  - type: free_text
    no_correct_answer: true
    prompt: 假設你想拒絕，請寫下你的回覆：
    answer_carrier: 學生自填，原稿留白
  - type: concept_box
    text: 在面對人際相處上的期待落差時，如何表達立場是很重要的能力。真誠表達自己的想法與界線，既能尊重自己，也能照顧對方的感受。或許拒絕別人從來不容易，但你的坦率和善意，會讓彼此都更自在、更安心❤︎
  slug: t93wh
  text_ref: jetyv
