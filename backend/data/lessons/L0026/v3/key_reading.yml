  passage: 我盯著螢幕，思緒變得混亂。每次遇到這樣的情境，我總是會猶豫：到底要堅持追求自己喜歡的人，但可能沒有結果，還是要選擇喜歡自己的人，也許會更幸福？當下有個念頭閃現：不如答應他的告白吧，這樣至少不用擔心受傷，畢竟他對我很好，和他在一起應該會很輕鬆吧？或許……我也可以試著喜歡他？可是，不管我怎麼努力說服自己，心裡卻始終沒有任何悸動。我低下頭，輕輕嘆了口氣——勉強自己接受一段沒有心動的關係，最後只會讓彼此都不快樂吧。我很苦惱，猶豫著要怎麼回覆，拇指停在螢幕上方，卻遲遲打不出字。該怎麼說，才能清楚拒絕，卻又不至於讓他覺得自己不夠好？如果立場互換，我收到什麼樣的拒絕會比較能接受呢？最後我送出：「謝謝你告訴我這件事，真的很抱歉，我沒有辦法以同樣的心情回應你。不過，你真的很好，也一定會遇到一個真正喜歡你的人。」訊息傳出去後，我的手指還停留在螢幕上，心裡卻慢慢變得平靜。我知道，這是我最真誠的回應，也是我能做到的事情。
