lesson_uid: L0026
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列選項「　」中的語詞，何者使用正確？
    options:
      A: 打開相簿，一張張舊照片「映入眼簾」，讓我回想起兒時
      B: 看完那場恐怖電影，我內心充滿「悸動」，整晚睡不著覺
      C: 他面對批評內心忐忑不安，顯得十分「坦然」。
      D: 每當朋友來訪，他總是特別「尷尬」，熱情招呼每位客人
    teacher_note: (B)宜改為「驚嚇」 (Ｃ)宜改為「惱怒」 (D)宜改為「雀躍」
  - index: 2
    answer: C
    stem: 根據第三段「我低下頭，輕輕嘆了口氣——勉強自己接受一段沒有心動的關係，最後只會讓彼此都不快樂吧」推論這句話所傳達的心情為何？
    options:
      A: 感到遺憾，因為會錯失了一段可能的戀情
      B: 感到不甘，因為可能因此失去這位好朋友
      C: 感到平靜，因為他接受了自己真實的感受
      D: 感到無力，因為他決定順從對方的期待
    teacher_note: 從句中可推知作者接受自己無法勉強的狀態，也因此放下掙扎。
    answer_carrier: 橘色手寫字（圖形層）；原稿此題答案印的是全形「Ｃ」
  - index: 3
    answer: A
    stem: 根據第二段至第四段內容，以下何者最能推論出主角內心真正的掙扎？
    options:
      A: 害怕拒絕後會破壞彼此的友情與班上的氣氛
      B: 不確定自己是否也喜歡對方，只是還沒發現
      C: 曾經在感情上受傷，不確定是否要接受告白
      D: 擔心拒絕告白會惹怒對方，引起更多的衝突
    teacher_note: 從第二段最後可看出作者擔心影響互動、變得尷尬。
  - index: 4
    answer: B
    stem: 根據文中主角的心路歷程，下列哪一項情緒變化順序最符合她的內在轉折？
    options:
      A: 驚訝→高興→接受→平靜
      B: 驚訝→惱怒→掙扎→坦然
      C: 驚喜→糾結→生氣→無奈
      D: 驚嚇→無奈→勉強→釋懷
    teacher_note: 第一、二段收到訊息的驚訝，第二段因不知如何回應而惱怒，第三段因猶豫是否該接受而掙扎，第四、五段因真誠拒絕而釋懷。
  - index: 5
    answer: D
    stem: 根據閱讀聚光燈的練習，下列何者對於「拒絕」的想法與表達較為合適？
    options:
      A: 阿健：不喜歡的事要當面果斷拒絕，不要為了對方委屈自己
      B: 安安：與其直接拒絕，不如保持模糊空間，這樣就不會尷尬
      C: 小明：拒絕別人的時候一定要記得道歉，才不會讓對方生氣
      D: 大宇：感謝對方勇敢表達心意，也真誠回覆自己的立場看法
    teacher_note: (A)不一定要當面(B)建議要表達立場與界線 (C)不該為了怕對方生氣而道歉。
