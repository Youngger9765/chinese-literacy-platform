source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 放學後，我照常滑開手機，打算看看今天的社群動態，卻發現一則新訊息靜靜躺在對話框裡。點開後，映入眼簾的是一句簡單卻讓人無法忽視的話——「我喜歡你，很久了。」
- 發訊息的是他，一個和我關係不錯的同學。我愣住，心跳微微亂了一拍，不是因為驚喜，而是因為不知該如何回應。接著，一股惱怒湧上心頭。為什麼要說這些？我們原本相處得好好的，現在該怎麼辦？如果我拒絕了，是不是連朋友都當不成？以後在班上見到他，會不會變得尷尬？這些念頭讓我抓緊了手機，內心有些煩躁。
- 我盯著螢幕，思緒變得混亂。每次遇到這樣的情境，我總是會猶豫：到底要堅持追求自己喜歡的人，但可能沒有結果，還是要選擇喜歡自己的人，也許會更幸福？當下有個念頭閃現：不如答應他的告白吧，這樣至少不用擔心受傷，畢竟他對我很好，和他在一起應該會很輕鬆吧？或許……我也可以試著喜歡他？可是，不管我怎麼努力說服自己，心裡卻始終沒有任何悸動。我低下頭，輕輕嘆了口氣——勉強自己接受一段沒有心動的關係，最後只會讓彼此都不快樂吧。
- 我很苦惱，猶豫著要怎麼回覆，拇指停在螢幕上方，卻遲遲打不出字。該怎麼說，才能清楚拒絕，卻又不至於讓他覺得自己不夠好？如果立場互換，我收到什麼樣的拒絕會比較能接受呢？
- 最後我送出：「謝謝你告訴我這件事，真的很抱歉，我沒有辦法以同樣的心情回應你。不過，你真的很好，也一定會遇到一個真正喜歡你的人。」訊息傳出去後，我的手指還停留在螢幕上，心裡卻慢慢變得平靜。我知道，這是我最真誠的回應，也是我能做到的事情。
- 幾分鐘後，對方回覆了：「沒關係，謝謝你告訴我。」短短幾個字，卻讓我心裡卸下了一塊大石頭。我知道他還是會難過一陣子，或許未來幾天相處也會有點不自在，但我希望，時間能讓一切回到原本的樣子。這次的事件讓我明白，拒絕一個人，並不是世界末日；誠實面對自己的心，也能讓人變得更坦然。最後還是要謝謝他的理解，我想明天我會給他一個溫暖的微笑。
