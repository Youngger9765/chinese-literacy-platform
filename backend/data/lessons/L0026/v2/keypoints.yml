keypoints:
  lesson: G5-L14
  structure: nested
  columns:
  - label
  - value
  rows:
  - label: 一、二
    sub_rows:
    - sub_label: 收到同學的告白訊息
      template: "不知該__\n2.擔心相處會變得__ (勾選，可複選)\n①驚訝  □②驚喜 \n③惱怒  ④煩躁"
      blanks:
      - answer: 如何回應
        hint: ''
      - answer: 尷尬
        hint: ''
  - label: 三
    sub_rows:
    - sub_label: '猶豫是否

        該答應'
      template: "1.也許選擇（□①自己喜歡的人　  ②喜歡自己的人），比較不會受傷\n2.不想__接受沒有心動的關係 (勾選，可複選)\n①混亂\
        \ \n□②輕鬆 \n□③悸動  \n④矛盾"
      blanks:
      - answer: 勉強
        hint: ''
  - label: 四
    sub_rows:
    - sub_label: '思考如何

        拒絕'
      template: '想要__拒絕，又不希望讓他覺得自己__ (勾選，可複選)

        ①苦惱 ②猶豫

        □③憤怒  □④無奈'
      blanks:
      - answer: 清楚
        hint: ''
      - answer: 不夠好
        hint: ''
  - label: 五
    sub_rows:
    - sub_label: "傳訊息  \n表達拒絕"
      template: 盡可能給出最__的回應 感到__
      blanks:
      - answer: 真誠
        hint: ''
      - answer: 平靜
        hint: ''
  - label: 六
    sub_rows:
    - sub_label: 收到對方  回覆
      template: "1.能同理對方的感受\n2.真誠面對__很重要\n3.感謝對方的__ (勾選，可複選)\n①如釋重負\n②坦然 \n□③難過"
      blanks:
      - answer: 自己
        hint: ''
      - answer: 理解
        hint: ''
  - label: 統整
    value: 作者寫下這篇小日記，是想抒發被告白後（ ①混亂  □②平靜）的感受，以及勇敢（ □①答應   ②拒絕）後，內心的（①踏實坦然  □②沮喪難過）。
    blanks: []
  title: 感情小日記4──我被告白了
