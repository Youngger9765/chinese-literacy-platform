  questions:
  - index: 1
    answer: A
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 害怕拒絕後會破壞彼此的友情與班上的氣氛B.不確定自己是否也喜歡對方，只是還沒發現C.曾經在感情上受傷，不確定是否要接受告白D.擔心拒絕告白會惹怒對方，引起更多的衝突
      B: 感到不甘，因為可能因此失去這位好朋友
      C: 感到平靜，因為他接受了自己真實的感受
      D: 感到無力，因為他決定順從對方的期待
    rationale: Ｃ ）2. 根據第三段「我低下頭，輕輕嘆了口氣——勉強自己接受一段沒有心動的關係，最後只會讓彼此都不快樂吧」推論這句話所傳達的心情為何？
  - index: 4
    answer: B
    stem: 根據文中主角的心路歷程，下列哪一項情緒變化順序最符合她的內在轉折？
    options:
      A: 阿健：不喜歡的事要當面果斷拒絕，不要為了對方委屈自己
      B: 安安：與其直接拒絕，不如保持模糊空間，這樣就不會尷尬
      C: 小明：拒絕別人的時候一定要記得道歉，才不會讓對方生氣
      D: 大宇：感謝對方勇敢表達心意，也真誠回覆自己的立場看法
    rationale: 第一、二段收到訊息的驚訝，
