    text: ◎小試身手
  - type: guide
    text: 根據以上原則，底下回應，哪些是最符合「一致型」，展現善意與尊重的？
  - type: passage
    source: unknown
    paragraphs:
    - □①「真的謝謝你對我的喜歡，但我現在的心情還沒準備好談感情。」□②「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」□③「我沒有那麼好啦，我覺得你不要考慮我，希望你不要生氣。」□④「你為什麼要跟我說這個？不覺得這樣很尷尬嗎？」□⑤「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」□⑥「哈哈哈，你別鬧了啦，趕快去跟別人聊一聊啦！」
  - type: guide
    text: ◎實戰練習
  - type: passage
    source: unknown
    paragraphs:
    - 假設你想拒絕，請寫下你的回覆：假設你想拒絕，請寫下你的回覆：根據以下情境，練習以真誠、善意的方式回覆。
    - 在面對人際相處上的期待落差時，如何表達立場是很重要的能力。真誠表達自己的想法與界線，既能尊重自己，也能照顧對方的感受。或許拒絕別人從來不容易，但你的坦率和善意，會讓彼此都更自在、更安心❤︎
