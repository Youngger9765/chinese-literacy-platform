spotlight:
  lesson: G5-L14
  strategy_name: 品格力-人際溝通-拒絕的藝術
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手
  - type: single
    prompt: 根據以上原則，底下回應，哪些是最符合「一致型」，展現善意與尊重的？
    options:
    - 「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」
    - 「我沒有那麼好啦，我覺得你不要考慮我，希望你不要生氣。」
    - '「你為什麼要跟我說這個？不覺得這樣很尷尬嗎？」

      ⑤「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」'
    - 「哈哈哈，你別鬧了啦，趕快去跟別人聊一聊啦！」
    answer: 「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」
  - type: guide
    text: ◎實戰練習
  - type: guide
    text: 根據以下情境，練習以真誠、善意的方式回覆。
  - type: passage
    source: unknown
    paragraphs:
    - 在面對人際相處上的期待落差時，如何表達立場是很重要的能力。真誠表達自己的想法與界線，既能尊重自己，也能照顧對方的感受。或許拒絕別人從來不容易，但你的坦率和善意，會讓彼此都更自在、更安心❤︎
