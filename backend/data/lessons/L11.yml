vocabulary:
- word: 沉著󠇤
  definition: 鎮靜而不慌亂。
- word: 監測
  definition: 持續的監視測量。
- word: 獨當一󠇡面
  definition: 獨力擔當重任。
- word: 傾訴
  definition: 把心中的話全部說出來。
- word: 如魚得水
  definition: 好像魚和水般的契合。比喻得到很適合自己的環境或遇到和自己意氣相投的人。
- word: 質疑
  definition: 心中懷疑而提出問題。
- word: 防禦
  definition: 抵擋對手的進攻。
- word: 雕琢
  definition: 細緻地雕刻玉石，有費心培育人才的意思。
- word: 扳回一󠇢城
  definition: 在比賽時稍微挽回劣勢、救回不利的局面。
- word: 心力交瘁
  definition: 精神和體力都已疲勞。比喻非常勞苦。
- word: 橫逆
  definition: 生命出出現負面事件，例如生了重病。
