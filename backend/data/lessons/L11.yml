story_text: '陳念琴在兩歲時跟著家人們到馬祖生活。她除了膚色較深被當地人取笑外，她的原住民身分也被當地人排擠。那時的陳念琴很自卑，不管到哪裡都躲在哥哥身後。跟著哥哥加入角力隊後，陳念琴發現技擊運動對她有股吸引力，選手在擂台上必須獨當一面、必須發揮自己的力量、必須在逆境中扳回一城，在幾次成功的嘗試後，她感到自己是有力量的。她想，也許擂台是我可以發出耀眼光芒的地方。

  國中時，陳念琴隻身來到台灣，改練拳擊，跟隨教練加入新竹成德高中拳擊隊訓練，她天生的爆發力與沉著󠇤冷靜的臨場表現，讓愛惜人才的柯教練覺得她是拳擊界一塊未經雕琢的璞玉。男生們對她的態度都不太友善，會對她說:「回你的馬祖啦！」全隊只有陳念琴一個女生，在練習對打時，只能和男生對練，但她從來沒有贏過，她又孤單又沒有成就感。所幸，她靠著不服輸的心，撐了下來。她說：「在苦難或強大的壓力下，要讓自己的心平靜下來，才有能力尋求方法解決問題。」陳念琴仍舊每天和男生對練，想辦法讓自己打到對方，她開始防禦、躲閃，想辦法讓自己輸的不那麼難看，每天一點一滴掌握對打的技巧，慢慢的讓自己變得更強大。她用不服輸的心態，將挫折轉化成讓自己正面迎擊的動力，總有一天，成績會證明一切！在高強度的訓練下，陳念琴的技巧持續進步。她讀國中時，在67公斤級的女子拳擊獲得冠軍；16歲，她「越級打怪」挑戰臺北城市邀請賽，擊敗了年紀更大、身材更好的蒙古亞運銅牌選手，她開始找回了自信。

  在陳念琴以為往後的拳擊生涯會如魚得水時，她卻經歷了橫逆。高一時，只是慢跑或爬樓梯，她就會氣喘如牛，甚至要休息很久才可以繼續訓練。在醫院連續幾個月的詳細檢查後，才知道原來是有嚴重的先天缺鐵性貧血。所以她必須一邊訓練，一邊監測身體的狀況，讓她 心力交瘁。

  雪上加霜的是，她在準備2020年東京奧運時，陳念琴發現脖子有小小的硬塊，醫生告訴她罹患了淋巴癌。她和教練討論後，決定隱瞞病情，一邊備戰的同時也接受化學治療。化療的副作用讓她無力、想吐、掉髮，而且辛苦的治療過程，無人可以傾訴。她心力交瘁的同時，還要承受媒體的質疑：「你不是奧運選手嗎？怎麼在奧運前的賽事表現的那麼弱？」她的委屈沒有人可以理解，她堅持飛舞在拳擊的擂台上，因為她的信念是：「為了夢想我願意忍耐，在追求成功的過程中，再苦再累我都要咬牙撐過。」她堅韌的心志使她成為第一個拿到奧運拳擊項目資格的女拳手。她的抗癌經歷，也鼓舞了許多癌症的病友。

  陳念琴說：「我的拳擊生涯就像搭乘雲霄飛車，ＯＯＯＯＯＯ。」有往上攀到高峰的榮耀，有往下跌到深谷的恐懼，而在走過生死關卡後，她展現更多的感恩。東京奧運時，她進入前八強，比賽結束後她親吻了擂台，感謝她經歷的苦難與挫折，以及一路上幫助她的人。陳念琴把苦難挫折化為祝福，戴起了拳擊手套，她將擊破一個一個迎面而來的挑戰和困難。'
