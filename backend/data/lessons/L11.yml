fill_in_blank:
- sentence: 面對突發狀況，他總能保持（　　），找出最佳解決方案。
  answer: A
- sentence: 科學家們透過儀器，對環境變化進行長期的（　　），以預測未來的趨勢。
  answer: B
- sentence: 經過多年的訓練，他已經有能力（　　），負責整個專案的執行。
  answer: C
- sentence: 心情低落時，找個信任的朋友（　　），會讓心裡舒服許多。
  answer: D
- sentence: 自從轉到這個部門後，他覺得自己的才能終於能被看見，工作起來真是（　　）。
  answer: E
- sentence: 對於課本上某個觀點，小明鼓起勇氣向老師提出（　　），希望能有更深入的了解。
  answer: F
- sentence: 為了抵擋外敵入侵，這座古老的城堡建造了堅固的城牆作為（　　）工事。
  answer: G
- sentence: 老師就像一位園丁，不斷地（　　）著每個學生的潛力，希望他們都能發光發熱。
  answer: H
- sentence: 雖然比賽一開始落後許多，但靠著隊友們的努力，我們終於（　　），讓比分差距縮小了。
  answer: I
- sentence: 連續加班好幾個星期，他感到身心俱疲，整個人幾乎是（　　）了。
  answer: J
- sentence: 儘管人生路上會遇到許多（　　），我們仍應保持樂觀，勇敢面對。
  answer: K
multiple_choice:
- question: 請問文中提到「她是塊璞玉，更需要雕琢」，「璞玉」代表什麼意思?
  options:
  - 能力已經非常強大的人。
  - 有潛力而未經開發的人。
  - 膽小害怕、不敢做的人。
  - 所有人都知道的名人。
  answer: B
  explanation: 雕琢表示還需要再加工，所以璞玉代表未開發。
- question: 請問文中第一段「陳念琴讓尋找人才的柯教練眼睛為之一亮」，柯教練最可能的情緒是哪個？
  options:
  - 羨慕
  - 悲傷
  - 驚喜
  - 憤怒
  answer: C
  explanation: 「眼睛為之一亮」這個詞語通常用來形容一個人看到或發現某件令人驚訝、欣賞或滿意的事物時，表現出驚訝和喜悅的神情。柯教練正在尋找人才，當他看到陳念琴時「眼睛為之一亮」，表示他對陳念琴的潛力或表現感到非常驚
- question: 第五段陳念琴說：「我的拳擊生涯就像坐雲霄飛車，oooooo」，請問oooooo最有可能是哪句話？
  options:
  - 忽高忽低，充滿挑戰。
  - 左搖右擺，頭暈眼花。
  - 急煞急停，如魚得水。
  - 忽上忽下，緩慢前進。
  answer: A
  explanation: 由後句有榮耀時刻、有低潮，可知不是一帆風順
- question: 文中第三段提到「陳念琴「越級打怪」挑戰台北城市邀請賽」，請問下列何者不是越級打怪的例子？
  options:
  - 體重50公斤，去參加70公斤級的比賽。
  - 打敗同年齡的對手。
  - 挑戰比自己能力強的選手。
  - 業餘球隊挑戰職業聯賽。
  answer: B
  explanation: 「越級打怪」指的是挑戰比自己更高層級、更困難的對手或任務。選項B「打敗同年齡的對手」是指在同一個水平或層級中獲勝，不屬於挑戰更高難度的情況，因此不是越級打怪的例子。
- question: 根據本文，陳念琴的拳擊人生遭遇的事件順序為何？
  options:
  - 面對低潮→找回自信→身分自卑→擊破困難。
  - 擊破困難→身分自卑→找回自信→面對低潮。
  - 身分自卑→擊破困難→面對低潮→找回自信。
  - 身分自卑→找回自信→面對低潮→擊破困難。
  answer: null
  explanation: null
