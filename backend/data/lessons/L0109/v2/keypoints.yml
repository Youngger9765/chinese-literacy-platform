keypoints:
  lesson: G8-L11
  structure: nested
  columns:
  - label
  - sub_label
  - value
  rows:
  - label: 情境（段1）
    value: 球場氣氛沸騰，帶動氣勢的推手是__
    blanks:
    - answer: 啦啦隊
      hint: ''
  - label: 觀點/主張（段2）
    value: 啦啦隊已蛻變成一種有價值與需要高度__的職業
    blanks:
    - answer: 專業能力
      hint: ''
  - label: 支持理由
    sub_rows:
    - sub_label: 有功能（段2）
      template: 啦啦隊能把球迷零散聲音整合成整齊有力的音浪，讓球隊氣勢如虹，也為運動員注入__。
      blanks:
      - answer: 信心
        hint: ''
    - sub_label: 有能力(段3)
      template: 1.許多人以為啦啦隊只要__。2.啦啦隊要付出很多的訓練。需要驚人的__與__。
      blanks:
      - answer: 長得好看、會跳舞
        hint: ''
      - answer: 記憶力
        hint: ''
      - answer: 反應力
        hint: ''
    - sub_label: 需體能(段4)
      template: 工作消耗體力，長時間跳躍揮手、需要__；訓練含重訓、核心訓練、拉筋。
      blanks:
      - answer: 心肺功能/肌耐力
        hint: ''
    - sub_label: 心理韌性(段4)
      template: 需__，落後仍保持活力，絕對不是__。
      blanks:
      - answer: 心理韌性/情緒管理
        hint: ''
      - answer: 花瓶
        hint: ''
  - label: 反思(段5)
    value: 啦啦隊的服裝常成為輿論靶心。服裝爭議表面在「穿什麼/辣不辣」，但深層涉及觀看的立場是__或__。
    blanks:
    - answer: 尊重專業
      hint: ''
    - answer: 物化評比
      hint: ''
  - label: 呼籲/結語(段5.6)
    value: 呼籲讀者換一種角度看啦啦隊，把焦點放回__，看見笑容背後的訓練與心意。
    blanks:
    - answer: 專業、紀律、勞動
      hint: ''
  title: 球場上的另類指揮家
