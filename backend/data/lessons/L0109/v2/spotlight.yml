spotlight:
  lesson: G8-L11
  strategy_name: 推論策略-推論主要論點與作者意圖
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 一、找出觀點與支持理由
  - type: passage
    source: unknown
    paragraphs:
    - 本文第二段，作者主張(明示):啦啦隊是有價值、需要高度專業能力的職業。請從第2～4段找出支持這個主張的「觀點和支持理由(證據)」。
  - type: table
    rows:
    - - 段落/聚焦
      - ❶觀點(看法)
      - ❷支持理由(證據)
    - - 段2/有功能
      - □A.啦啦隊主要靠外貌與舞蹈吸睛，專業性並不是重點□B.啦啦隊能整合加油節奏並影響球隊的氣勢。
      - □①把零散加油聲變成整齊有力的音浪，全場齊喊形成聲勢。□②觀眾常被外表吸引，以為長得好看、會跳舞就能勝任。
    - - 段3/有能力
      - □A.啦啦隊需要驚人的記憶力與反應力，才能臨場帶領觀眾進入節奏。□B.啦啦隊只要照固定流程表演，就能穩定帶動全場氣氛。
      - □①要記大量舞步與節奏，並在幾秒內迅速反應調整帶動。□②球員上場會搭配主題曲與手勢，需配合做出相對動作。
    - - 段4/需體能
      - □A.啦啦隊需要高強度的體力。□B.啦啦隊只要表現整齊動作。
      - □①在烈日或乾燥場館中持續跳躍揮手數小時。□②只要動作整齊好看，就能完成應援，不必特別訓練體能。
    - - 段4/心理韌性
      - □A.啦啦隊需要心理韌性與情緒管理，才能在低迷時仍帶動現場。□B.啦啦隊只要跟著節奏跳，情緒自然跟著氣氛變化。
      - □①比賽中觀眾情緒起伏不定，啦啦隊只要跟著節奏跳就好。□②球隊落後、氣氛低迷時，啦啦隊員仍要保持笑容與活力，帶動大家重新投入。
  - type: guide
    text: ※作者用四個理由說服：啦啦隊是「具有專業能力與職業價值」的工作者。
  - type: guide
    text: 二、作者要我們怎麼看待啦啦隊？（觀點與呼籲）
  - type: passage
    source: unknown
    paragraphs:
    - 前面說服你：啦啦隊很專業，作者接著把焦點推到「我們該怎麼看待她們」→請用第5–6段找出作者的觀點與呼籲。
  - type: table
    rows:
    - - 段落/角色
      - 作者觀點/看法(判斷句)
    - - 段5/觀點
      - □A.服裝爭議主要談尺度與美感，因此重點應放在穿著是否合宜□B.服裝爭議表面談穿著，深層其實牽涉尊重專業與物化評比
    - - 段6/呼籲
      - □A.作者呼籲觀眾換角度，把焦點放回專業、紀律與勞動，給予尊重。□B.作者建議觀眾投入加油口號，讓球場文化更熱鬧豐富就足夠
  - type: guide
    text: 三、歸納作者主要論點/主旨(核心立場)
  - type: guide
    text: 請根據上述訊息，歸納作者的主要論點。（答案合理就好）
  - type: guide
    text: 提示①定位(她們是什麼樣的工作者) ②評價標準(不應..；應..)
  - type: passage
    source: unknown
    paragraphs:
    - ①啦啦隊是    有價值、需要專業能力   　　　  的職業工作者，
    - ②因此不應    只以外貌或服裝評價    ，應     尊重其專業與勞動       。
  - type: single
    prompt: 四、作者主要意圖(作者想改變你什麼想法/態度?) (單選)
    options:
    - 扭轉把啦啦隊當花瓶的刻板印象，引導讀者反思物化與網路惡評，呼籲以尊重眼光看待她們的專業與勞動。
    - 分享啦啦隊的應援特色與觀賽樂趣，鼓勵讀者跟著口號投入，享受熱鬧氣氛。
    answer: 扭轉把啦啦隊當花瓶的刻板印象，引導讀者反思物化與網路惡評，呼籲以尊重眼光看待她們的專業與勞動。
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: table
    rows:
    - - 球場上的另類指揮家
    - - 情境（段1）
      - 球場氣氛沸騰，帶動氣勢的推手是【】
    - - 觀點/主張（段2）
      - 啦啦隊已蛻變成一種有價值與需要高度【】的職業
    - - 支持理由
      - 有功能（段2）
      - 啦啦隊能把球迷零散聲音整合成整齊有力的音浪，讓球隊氣勢如虹，也為運動員注入【】。
    - - 支持理由
      - 有能力(段3)
      - 1.許多人以為啦啦隊只要【】。2.啦啦隊要付出很多的訓練。需要驚人的【】與【】。
    - - 支持理由
      - 需體能(段4)
      - 工作消耗體力，長時間跳躍揮手、需要【】；訓練含重訓、核心訓練、拉筋。
    - - 支持理由
      - 心理韌性(段4)
      - 需【】，落後仍保持活力，絕對不是【】。
    - - 反思(段5)
      - 啦啦隊的服裝常成為輿論靶心。服裝爭議表面在「穿什麼/辣不辣」，但深層涉及觀看的立場是【】或【】。
    - - 呼籲/結語(段5.6)
      - 呼籲讀者換一種角度看啦啦隊，把焦點放回【】，看見笑容背後的訓練與心意。
    answers:
    - 啦啦隊
    - 專業能力
    - 信心
    - 長得好看、會跳舞
    - 記憶力
    - 反應力
    - 心肺功能/肌耐力
    - 心理韌性/情緒管理
    - 花瓶
    - 尊重專業
    - 物化評比
    - 專業、紀律、勞動
  - type: passage
    source: unknown
    paragraphs:
    - 請根據文章內容，讀完每一個選項後，選出最適合的答案。請根據文章內容，讀完每一個選項後，選出最適合的答案。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能分辨觀點（判斷句）與證據（事實描述）。□2.我能統整主要論點／主旨，並推論作者意圖。
