lesson_uid: L0109
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略——推論主要論點與作者意圖
  strategy_type: inference
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，共 11 個）＋橘色手寫填空
  blocks:
  - type: concept_box
    text: '這篇文章的主要論點不是一句話直接說完，文章的論點散落在不同段落，作者先明示一個看法，再用一連串理由說服你。讀這樣的文章，你要注意到：

      觀點和支持理由是什麼?

      作者的意圖（呼籲）是什麼?

      最後再根據「觀點＋理由＋呼籲」整理出本文的主要論點（主旨），並推論作者想改變你什麼想法或態度（作者意圖）？'
    text_note: '中間兩行在 PDF 上印成「一、觀點和…」「二、作者的意圖…」，那個「一、二、」是 Word

      自動編號（numbering.xml），不在 w:t 文字流裡，故不寫入。

      另：中間兩行句末是半形「?」，末行是全形「？」——原稿混用，照原樣。'
  - type: guide
    text: 一、找出觀點與支持理由
  - type: guide
    text: 本文第二段，作者主張(明示):啦啦隊是有價值、需要高度專業能力的職業。請從第2～4段找出支持這個主張的「觀點和支持理由(證據)」。
  - type: fill_table
    columns:
    - 段落/聚焦
    - ❶觀點(看法)
    - ❷支持理由(證據)
    answer_carrier: 紅色 ☑（w:sym），PDF p5~p6 可見；本表 8 個 ☑
    rows:
    - 段落/聚焦: '段2/

        有功能'
      ❶觀點(看法): 'A.啦啦隊主要靠外貌與舞蹈吸睛，專業性並不是重點

        B.啦啦隊能整合加油節奏並影響球隊的氣勢。'
      ❶觀點(看法)_options:
        A: 啦啦隊主要靠外貌與舞蹈吸睛，專業性並不是重點
        B: 啦啦隊能整合加油節奏並影響球隊的氣勢。
      ❶觀點(看法)_answer: B
      ❷支持理由(證據): '①把零散加油聲變成整齊有力的音浪，全場齊喊形成聲勢。

        ②觀眾常被外表吸引，以為長得好看、會跳舞就能勝任。'
      ❷支持理由(證據)_options:
        1: 把零散加油聲變成整齊有力的音浪，全場齊喊形成聲勢。
        2: 觀眾常被外表吸引，以為長得好看、會跳舞就能勝任。
      ❷支持理由(證據)_answer: 1
    - 段落/聚焦: '段3/

        有能力'
      ❶觀點(看法): 'A.啦啦隊需要驚人的記憶力與反應力，才能臨場帶領觀眾進入節奏。

        B.啦啦隊只要照固定流程表演，就能穩定帶動全場氣氛。'
      ❶觀點(看法)_options:
        A: 啦啦隊需要驚人的記憶力與反應力，才能臨場帶領觀眾進入節奏。
        B: 啦啦隊只要照固定流程表演，就能穩定帶動全場氣氛。
      ❶觀點(看法)_answer: A
      ❷支持理由(證據): '①要記大量舞步與節奏，並在幾秒內迅速反應調整帶動。

        ②球員上場會搭配主題曲與手勢，需配合做出相應動作。'
      ❷支持理由(證據)_options:
        1: 要記大量舞步與節奏，並在幾秒內迅速反應調整帶動。
        2: 球員上場會搭配主題曲與手勢，需配合做出相應動作。
      ❷支持理由(證據)_answer: 1
    - 段落/聚焦: '段4/

        需體能'
      ❶觀點(看法): 'A.啦啦隊需要高強度的體力。

        B.啦啦隊只要表現出整齊的動作。'
      ❶觀點(看法)_options:
        A: 啦啦隊需要高強度的體力。
        B: 啦啦隊只要表現出整齊的動作。
      ❶觀點(看法)_answer: A
      ❷支持理由(證據): '①在烈日或乾燥場館中持續跳躍揮手數小時。

        ②只要動作整齊好看，就能完成應援，不必特別訓練體能。'
      ❷支持理由(證據)_options:
        1: 在烈日或乾燥場館中持續跳躍揮手數小時。
        2: 只要動作整齊好看，就能完成應援，不必特別訓練體能。
      ❷支持理由(證據)_answer: 1
    - 段落/聚焦: '段4/

        心理

        韌性'
      ❶觀點(看法): 'A.啦啦隊需要心理韌性與情緒管理，才能在低迷時仍帶動現場。

        B.啦啦隊只要跟著節奏跳，情緒自然跟著氣氛變化。'
      ❶觀點(看法)_options:
        A: 啦啦隊需要心理韌性與情緒管理，才能在低迷時仍帶動現場。
        B: 啦啦隊只要跟著節奏跳，情緒自然跟著氣氛變化。
      ❶觀點(看法)_answer: A
      ❷支持理由(證據): '①比賽中觀眾情緒起伏不定，啦啦隊只要跟著節奏跳就好。

        ②球隊落後、氣氛低迷時，啦啦隊員仍要保持笑容與活力，帶動大家重新投入。'
      ❷支持理由(證據)_options:
        1: 比賽中觀眾情緒起伏不定，啦啦隊只要跟著節奏跳就好。
        2: 球隊落後、氣氛低迷時，啦啦隊員仍要保持笑容與活力，帶動大家重新投入。
      ❷支持理由(證據)_answer: 2
    rows_note: '第 4 列的「段4/心理韌性」在原稿是三個段落（段4/ ／心理 ／韌性），而且正好被分頁

      切開（PDF p5 印到「心理」，p6 才印「韌性」），照原樣保留三行。'
  - type: guide
    text: ※作者用四個理由說服：啦啦隊是「具有專業能力與職業價值」的工作者。
  - type: guide
    text: 二、作者要我們怎麼看待啦啦隊？（觀點與呼籲）
  - type: guide
    text: 前面說服你：啦啦隊很專業，作者接著把焦點推到「我們該怎麼看待她們」→請用第5–6段找出作者的觀點與呼籲。
  - type: fill_table
    columns:
    - 段落/角色
    - 作者觀點/看法(判斷句)
    answer_carrier: 紅色 ☑（w:sym），PDF p6 可見；本表 2 個 ☑
    rows:
    - 段落/角色: '段5/

        觀點'
      作者觀點/看法(判斷句): 'A.服裝爭議主要談尺度與美感，因此重點應放在穿著是否合宜

        B.服裝爭議表面談穿著，深層其實牽涉尊重專業與物化評比'
      作者觀點/看法(判斷句)_options:
        A: 服裝爭議主要談尺度與美感，因此重點應放在穿著是否合宜
        B: 服裝爭議表面談穿著，深層其實牽涉尊重專業與物化評比
      作者觀點/看法(判斷句)_answer: B
    - 段落/角色: '段6/

        呼籲'
      作者觀點/看法(判斷句): 'A.作者呼籲觀眾換角度，把焦點放回專業、紀律與勞動，給予尊重。

        B.作者建議觀眾投入加油口號，讓球場文化更熱鬧豐富就足夠'
      作者觀點/看法(判斷句)_options:
        A: 作者呼籲觀眾換角度，把焦點放回專業、紀律與勞動，給予尊重。
        B: 作者建議觀眾投入加油口號，讓球場文化更熱鬧豐富就足夠
      作者觀點/看法(判斷句)_answer: A
  - type: guide
    text: 三、歸納作者主要論點/主旨(核心立場)
  - type: guide
    text: 請根據上述訊息，歸納作者的主要論點。（答案合理就好）
  - type: guide
    text: 提示①定位(她們是什麼樣的工作者) ②評價標準(不應……；應……)
  - type: free_text
    prompt: ①啦啦隊是（　）的職業工作者，
    blanks:
    - answer: 有價值、需要專業能力
    answer_carrier: 橘色手寫（教師版參考答案），文字流有此資訊
    answer_note: 題目明示「答案合理就好」，此為原稿印的參考答案
  - type: free_text
    prompt: ②因此不應（　），應（　）。
    blanks:
    - answer: 只以外貌或服裝評價
    - answer: 尊重其專業與勞動
    answer_carrier: 橘色手寫（教師版參考答案），文字流有此資訊
    answer_note: 原稿兩個空格是底線留白不是【　】，此處以（　）標示空格位置。
  - type: single
    prompt: 四、作者主要意圖(作者想改變你什麼想法/態度?) (單選)
    options:
      1: 扭轉把啦啦隊當花瓶的刻板印象，引導讀者反思物化與網路惡評，呼籲以尊重眼光看待她們的專業與勞動。
      2: 分享啦啦隊的應援特色與觀賽樂趣，鼓勵讀者跟著口號投入，享受熱鬧氣氛。
    answer: 1
    answer_carrier: 紅色 ☑（w:sym），PDF p6 可見
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能分辨觀點（判斷句）與證據（事實描述）。
    - 2.我能統整主要論點／主旨，並推論作者意圖。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
