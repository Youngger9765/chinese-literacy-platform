strategy_explained: '這一次我們要練習的是，讀懂文章裡「作者到底想說什麼，他想藉由啦啦隊告訴我們什麼」

  這篇文章描述了啦啦隊如何在球場上扮演重要角色，也分析了成為啦啦隊員所需的條件，更呼籲大家要尊重她們的專業，因為這些內容都是作者想讓你思考的重點

  讀的時候，你可以一邊讀一邊想，作者在講啦啦隊的付出和專業時，是不是在暗示我們不該只看外表呢'
