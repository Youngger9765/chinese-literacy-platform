    1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
    2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  target_note: 原文全文
  timing_table:
    columns: [第1次計時, 第2次計時, 第3次計時, 裁判計時]
