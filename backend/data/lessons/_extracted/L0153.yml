# ── 古文今譯（不編號）────────────────────────────────────────────
modern_translation:
  label: 古文今譯
  paragraphs:
    - 魏國的鮑子都某天傍晚走在荒野，碰巧見到一名書生突然心絞痛。鮑子都立刻下馬，為他按摩心臟。不久，書生還是死了。鮑子都看書生的袋子裡有一冊兵書和十個金餅，就賣了一個金餅，把賣的錢全用來安葬書生，剩下的九個金餅就墊在書生的頭下，兵書也放在書生的肚子邊。
    - 幾年後，子都在路上，一位騎著駿馬的人追趕他。等到那人追上以後，把子都當作強盜，還一再追問鮑子都他兒子的屍身在哪裡。鮑子都就把當時的情況全說了，然後那個人跟隨鮑子都來到書生的墓前。
    - 那人挖開墳墓，取出兒子的屍身要帶回去，果然看到九個金餅墊在兒子的頭下，兵書也在身旁。書生全家都非常感謝鮑子都的恩德與義舉。從此鮑子都的名字與事蹟被眾人口耳相傳，一下子就有名起來了。
  position_note: 本課「古文今譯」印在**原文之前**（第 1 頁），與 L0161 相同。

# ── 原文＋注釋（不編號）──────────────────────────────────────────
classical_text:
  label: 原文
  source: 唐朝・李亢
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  note_dots_note: |-
    ⚠️ 指示語這樣寫，但**本課原文的文字流裡沒有任何斷詞點「.」**（PDF p2 也看不到）。
    L0161 的原文則是每個詞組之間都有「.」。本課屬指示語留著、斷詞點沒排進去。
  paragraphs:
    - 魏　鮑子都，暮行於野，見一書生卒1心痛。子都下馬，為摩其心。有頃2，書生卒。子都視其囊中，有《素書》3一卷，金十餅。乃賣一餅，具葬書生，其餘枕之頭下，置素書於腹旁。
    - 後數年，子都於道上，有乘驄馬者逐之。既及，以子都為盜，固問兒屍所在。子都具言，於是相隨往。
    - 開墓，取兒屍歸，見金九餅在頭下，素書在腹旁。舉家感子都之德義。由是聲名大振。
  paragraphs_note: |-
    「魏」與「鮑子都」之間是一個全形空格，原稿如此。
    段內的 1／2／3 是原稿印的注釋標號（字面數字，不是自動編號）。
  annotations:
    - {"no": 1, term: 卒, text: 卒：ㄘㄨˋ，通「猝」。急促、突然。}
    - {"no": 2, term: 有頃, text: 有頃：不久、一會兒。}
    - {"no": 3, term: 卒, text: 卒：死亡。}
    - {"no": 4, term: 素書, text: 素書：兵書。}
    - {"no": 5, term: 枕, text: 枕：ㄓㄣˋ，當動詞，用什麼東西墊頭。}
  annotations_note: 注釋的 1.~5. 是 Word 自動編號（不在文字流），此處補上序號；標號對不上原文，見 source_errata E1。

