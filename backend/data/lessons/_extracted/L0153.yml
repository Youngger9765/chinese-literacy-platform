# ── 二 文白詞語比對 ──────────────────────────────────────────────
word_matching:
  label: 二、文白詞語比對
  instruction: 以下是原文與白話文的對照。請依照文意，寫出原文中灰底的白話文意思。
  answer_carrier: 橘色（字元樣式），PDF p4~p5 可見
  items:
    - index: 1
      文言: 魏　鮑子都，暮行於野，見一書生卒心痛。
      白話: 魏國的鮑子都，某天(　)走(　)荒野，碰巧見到一名書生(　)心絞痛。
      blanks: [{answer: 傍晚}, {answer: 在}, {answer: 突然}]
    - index: 2
      文言: 子都下馬，為摩其心，有頃，書生卒。
      白話: 子都立刻下馬，為他(　)心臟，(　)，書生還是(　)。
      blanks: [{answer: 按摩}, {answer: 不久}, {answer: 死了}]
    - index: 3
      文言: 乃賣一餅，具葬書生，其餘枕之頭下，置素書於腹旁。
      白話: (　)賣了一個金餅，把賣的錢(　)安葬書生，剩下的九個金餅就墊在(　)的頭下，兵書也放(　)書生的肚子邊。
      blanks: [{answer: 就}, {answer: 全用來}, {answer: 書生}, {answer: 在}]
    - index: 4
      文言: 後數年，子都於道上，有乘驄馬者逐之。
      白話: 幾年後，子都(　)路上，一位騎著駿馬的人追趕(　)。
      blanks: [{answer: 在}, {answer: 他}]
    - index: 5
      文言: 既及，以子都為盜，固問兒屍所在。
      白話: 等到那人追上以後，(　)子都(　)強盜，還(　)鮑子都他兒子的屍身在哪裡。
      blanks: [{answer: 把}, {answer: 當作}, {answer: 一再追問}]
    - index: 6
      文言: 子都具言，於是相隨往。
      白話: 子都就把當時的情況(　)，然後那個人跟隨子都來到書生的墓前。
      blanks: [{answer: 全說了}]
    - index: 7
      文言: 舉家感子都之德義。由是聲名大振。
      白話: 書生(　)都非常感謝鮑子都(　)恩德與義舉。(　) 鮑子都的名字與事蹟被眾人口耳相傳，一下子就有名起來了。
      blanks: [{answer: 全家}, {answer: 的}, {answer: 從此}]
  items_note: |-
    第 2 題的文言把原文的兩句（「子都下馬，為摩其心。有頃，書生卒。」）併成一句並改標點為逗號；
    第 1 題的文言則與原文完全一致。原稿如此。

# ── 三 文章重點表 ────────────────────────────────────────────────
keypoints:
  label: 三、文章重點表
  layout: matrix
  intro: |-
    我們練習過很多次「問題、解決、結果」的故事結構，相信你現在已經是拆解故事的高手了！
    這次我們換個方式，把這篇課文當成一部微電影。在電影開拍前，我們要先佈置好「故事舞台」，然後跟著鮑子都一起經歷高潮迭起的三幕劇。
    準備好了嗎？讓我們一起看看這場發生在荒野的意外，鮑子都如何化解危機，寫下自己的傳奇吧！
  columns: [劇本設定, 內容摘要]
  column_note: 【 】處填入原文，找不到原文時，再用自己的話寫。
  answer_carrier: 橘色（字元樣式），PDF p6 可見
  rows:
    - 劇本設定: 故事舞台
      內容摘要: |-
        場景：魏國的(　)
        時間：(　)時分。
      內容摘要_blanks: [{answer: 野/荒野}, {answer: 暮/傍晚}]
    - 劇本設定: 第一幕
      內容摘要: |-
        問題：鮑子都偶遇書生(　)
        解決：鮑子都立刻下馬施救。
        結果：書生不治身亡。
      內容摘要_blanks: [{answer: 卒心痛/突發心絞痛}]
    - 劇本設定: 第二幕
      內容摘要: |-
        問題：書生不治身亡。
        解決：(1)發現書生有一本(　)與(　)。
        (2)變賣(　)安葬書生，剩下(　)墊在遺體的頭下，兵書也放在書生的身邊。
        結果：書生得到安葬。
      內容摘要_blanks: [{answer: 素書/兵書}, {answer: 十塊金餅}, {answer: 一金/一個金餅}, {answer: 九金/九個金餅}]
    - 劇本設定: 第三幕
      內容摘要: |-
        問題：書生家人誤認鮑子都是(　)，厲聲質問兒子的下落。
        解決：鮑子都坦然說明往事，並帶路至墓地。
        結果：開墓後，九金與兵書完好無缺，證實鮑子都並未私吞財物。
      內容摘要_blanks: [{answer: 盜/強盜}]
    - 劇本設定: 結局
      內容摘要: |-
        1.真相大白後，書生的家人從質疑轉為(　)。
        2.鮑子都的義舉在眾人的口耳相傳下，不久就成了很有名的人了。
      內容摘要_blanks: [{answer: 感激}]
  rows_note: |-
    答案多為「原文/白話」兩種寫法並列（野/荒野、暮/傍晚…），對應欄位說明的
    「【 】處填入原文，找不到原文時，再用自己的話寫」。照原樣保留斜線兩式。
    ⚠️ 空格在原稿印的是圓括號(　)不是【　】，雖然欄位說明講的是【 】。

# ── 四 文言文聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 固定句式：以……為……
  strategy_type: classical_fixed_pattern
  answer_carrier: |-
    紅色 ☑（w:sym Wingdings F0FE，共 5 個，全在輕練習1）
    ＋橘色填答（字元樣式 rStyle=aff6，輕練習2 與溫故兩題的代號）
  blocks:
    - type: guide
      text: 一、溫故：複習「主語判斷」
    - type: guide
      text: 1.下面的文字取自課文，請根據提問判讀主語：
    - type: single
      index: 1
      prompt: (1)本文第二段末「既及，以子都為盜，固問兒屍所在。」這句話主語是誰？
      options: {A: 乘驄馬者, B: 書生, C: 鮑子都, D: 舉家}
      answer: A
    - type: single
      index: 2
      prompt: (2)本文第三段末「由是聲名大振。」這句話主語是誰？
      options: {A: 乘驄馬者, B: 書生, C: 鮑子都, D: 舉家}
      answer: C

    - type: guide
      text: 二、知新：本課新策略「固定句式：以……為」
      text_note: 這個小標的策略名只寫到「以……為」（少了後面的「……」），與大題標題「以……為……」不同。原稿如此。
    - type: concept_box
      text: |-
        課文中，鮑子都義務幫書生安葬，卻被人「以子都為盜」，差點要讓人懷疑是不是沒天理了呢！
        話說回來，類似「以子都為盜」這樣的句子，我們現在還在用哦！例如「以中央伍為準，向右看齊！」
        是不是很熟悉呢？其實是文言文中很常見的表達方式，又因為這種句子的結構有一定的模式，所以我們稱它——固定句式。
        現在，我們先認識第一式：
    - type: concept_box
      label: 句式框
      text: 句式：「以A為B」，意思：「把A當作是B」
    - type: guide
      text: |-
        這個句式在文言文中不但常見，意思也很清楚，像是剛才的例句「以子都為盜」，意思就是「把子都當作是盜賊」；
        這種結構不只出現在人物評價上，也常用在觀念判斷、價值選擇中，是很重要的表達方式。
        接下來，我們就透過例句、分析、練習，一步一步掌握這個句型的用法吧！

    - type: exercise
      label: 輕練習1
      instruction: 依原文找出意思對的句子；正確的請打勾。（單選）
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），PDF p8 可見；本節 5 個 ☑ 即全課全部
      items:
        - type: single
          index: 0
          label: 例題
          prompt: 以子都為盜。
          options: {1: 把子都當作是盜賊, 2: 把盜賊當作是子都}
          answer: 1
        - type: single
          index: 1
          prompt: 1.以和為貴。
          options: {1: 把貴重的當作是和諧, 2: 把和諧當作是可貴的}
          answer: 2
        - type: single
          index: 2
          prompt: 2.以叢草為林。
          options: {1: 把樹林當作是草叢, 2: 把草叢當作是樹林}
          answer: 2
        - type: single
          index: 3
          prompt: 3.民以食為天。
          options: {1: 人民把糧食當作是生存的根本, 2: 人民把上天當作是食物來索求}
          answer: 1
        - type: single
          index: 4
          prompt: 4.以天下興亡為己任。
          options: {1: 把天下的興亡當作自己的責任, 2: 把天下的興亡任由自己處理與決定}
          answer: 1

    - type: exercise
      label: 輕練習2
      instruction: 以下各題都是固定句式「……以……為……」的句子。請在翻譯的空格處填入適當的語詞，讓意思完整。
      answer_carrier: 橘色（字元樣式 rStyle=aff6），PDF p8 可見
      items:
        - type: free_text
          index: 1
          prompt: 句子：以土礫凸者為丘。
          stem: 翻譯：(　)凸起的小石頭(　)山丘
          blanks: [{answer: 把}, {answer: 當作是}]
        - type: free_text
          index: 2
          prompt: 句子：以退為進。 (退，退讓／進，進攻)
          stem: 翻譯：把(　)當作是(　)的手段
          blanks: [{answer: 退讓}, {answer: 進攻}]
        - type: free_text
          index: 3
          prompt: 句子：以史為鏡。
          stem: 翻譯：把(　)當作是(　)來對照。提醒後人不要犯同樣的錯
          blanks: [{answer: 歷史}, {answer: 鏡子}]
        - type: free_text
          index: 4
          prompt: 句子：以鄰為壑。 (鄰，鄰國／壑，山溝)
          stem: 翻譯：把(　)當作是(　)來洩洪。比喻傷害別人讓自己得到好處
          blanks: [{answer: 鄰國}, {answer: 山溝}]
      items_note: |-
        第 1 題連「把」「當作是」本身都是空格（其餘三題「把」「當作是」是印好的），原稿如此。
        原稿的空格是底線留白，此處以(　)標示位置。

# ── 五 閱讀理解 ──────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（字元樣式 rStyle=aff6），PDF p9 可見
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 3、5 題有
  layout_note: |-
    ⚠️ PDF p9 上「五 閱讀理解」標題框與指示語**疊印在第 1 題上面**，三者互相遮蓋、
    幾乎讀不出來。那是 LibreOffice 把浮動框排在文字上造成的，不是教材缺頁 ——
    第 1 題的完整內容在文字流裡是齊全的。另有 2 個橘色「✓」字元浮在標題附近
    （文字層裡就是字面 U+2713，不是 w:sym），不屬於任何一題，用途不明，未當成答案。
  questions:
    - index: 1
      answer: C
      stem: 鮑子都在荒野中遇到心絞痛的書生時，第一個動作是什麼？
      options:
        A: 立即將他送往城裡
        B: 賣掉一個金餅買藥
        C: 下馬為他按摩心臟
        D: 向路人求助
    - index: 2
      answer: A
      stem: 書生身上攜帶了哪些物品？
      options:
        A: 一卷兵書和十個金餅
        B: 一袋銀子和一把劍
        C: 一把劍和十個餅
        D: 一卷佛經和九個金餅
    - index: 3
      answer: D
      stem: 根據故事，下列哪一選項不適合用來形容鮑子都？
      options:
        A: 懂得變通
        B: 見義勇為
        C: 光明磊落
        D: 面惡心善
      teacher_hint: |-
        第3題解析：
        鮑子都在書生死後變賣金餅為書生安葬，可見他懂得隨機應變。
        人路倒，他立刻上前幫忙；人死，他就幫忙處理喪事。
        C.即使沒有人看見，他也沒有侵占書生的任何財物。
        D.文中沒有提到鮑子都的長相是否「面惡(醜)」。
      teacher_hint_note: 解析的第 2 行對應 B（見義勇為）但沒有印「B.」，其餘兩行有印代號。原稿如此。
    - index: 4
      answer: B
      stem: 根據本文，書生家人對鮑子都的態度發生了怎樣的轉變？
      options:
        A: 從「冷漠忽視」轉為「重金酬謝」
        B: 從「懷疑指責」轉為「感佩德義」
        C: 從「悲慟萬分」轉為「欣慰釋懷」
        D: 從「感激不盡」轉為「猜忌疏遠」
    - index: 5
      answer: C
      stem: 「之」在文言中有時當代詞，有時又有白話文「的」的意思。請問：哪一選項中的「之」字當「的」使用？
      options:
        A: 乃賣一餅，具葬書生，其餘枕「之」頭下
        B: 子都於道上，有乘驄馬者逐「之」
        C: 舉家感子都「之」德義
        D: 「之」暮行於野，見一書生卒心痛
      teacher_hint: |-
        第5題解析：
        代詞，指「書生」。
        代詞，指「鮑子都」
        沒有這種用法。
      teacher_hint_note: 解析三行分別對應 A、B、D，但原稿沒有印代號。
    - index: 6
      answer: B
      stem: 書生的家人相信鮑子都並非盜賊的關鍵原因為何？
      options:
        A: 鮑子都長相正經，不像是會作惡的人
        B: 看到九塊金餅與素書放在屍身的頭下、身旁
        C: 鮑子都主動帶路，表現出問心無愧的樣子
        D: 鮑子都詳細描述了書生當時發病的情況
  questions_note: 本課有 6 題（白話課多為 5 題）。

# ── 六 自我挑戰 ──────────────────────────────────────────────────
self_challenge:
  label: 六、自我挑戰
  teacher_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow: [❶斷句, ❷找動詞/形容詞, ❸找/補主語, ❹用自己的話說一說]
  strategy_flow_note: 四個方框之間印的箭頭是圖形，不在文字流裡，故不寫入箭頭字元。
  passage:
    classical: 袁宏道與友人書1云：「人情必有所寄，然後能樂。故有以弈2為寄，有以色為寄，有以技為寄，有以文為寄。古之達人3，高人一層，只是他情有所寄，不肯浮泛虛度光景。」
    source: (104會)
    annotations:
      - {"no": 1, term: 書, text: 書：寫信。}
      - {"no": 2, term: 弈, text: 弈：下棋。}
      - {"no": 3, term: 達人, text: 達人：指品德修養高、能把事情看得很清楚的人。}
    modern: 袁宏道寫給朋友的信中說：「人的感情必須有所寄託，然後才能快樂。所以有人把下棋（弈）當作是心靈上的寄託，有人把聲色當作寄託，有人把鑽研技藝當作寄託，有人把寫作文章當作寄託。古代通達事理的人，能高出一般人一等，只是因為他們情感有所寄託，不肯敷衍虛度時光。」
    modern_note: 翻譯印在藍框裡（教師版），文字流有此資訊。
  items:
    label: （一）請依照故事脈絡，回答下列問題。
    answer_carrier: 橘色（字元樣式 rStyle=aff6）；第 4 題另有橘色 roundRect 圈選
    questions:
      - {index: 1, stem: 斷句後的第一個分句，主語是誰？, answer: 袁宏道}
      - {index: 2, stem: 承上題，這個主語怎麼樣或做什麼？, answer: 與友人書/寫信給朋友}
      - {index: 3, stem: 「人情必有所寄，然後能樂」一句的主語是什麼？, answer: 人情}
      - index: 4
        stem: 承上題，這個主語做了什麼才「能樂」？
        options: {1: 寄信, 2: 有寄託}
        answer: 2
        answer_carrier: 橘色 roundRect 圈住「有寄託」（全課唯一的圈選圖形），PDF p10 可見
        instruction_inline: (圈出適當答案)
  quiz:
    label: （二）閱讀理解測驗
    questions:
      - index: 1
        answer: C
        stem: 這段文字的主要涵義，與下列何者最接近?
        options:
          A: 以物為寄應該有所節制，不可浮濫
          B: 古之達人寄懷於民，不求一己之樂
          C: 情感有所依託，生命方能愉悅自適
          D: 習得多種才藝，方能晉身達人之列
        options_note: 四個選項的代號後面**沒有句點**（A 以物為寄…），與第五大題的「A.」不同。原稿如此。
        stem_note: 題末是半形問號「?」，原稿如此。
