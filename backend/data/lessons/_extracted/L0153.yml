    - {threshold: 45~55秒, feedback: 強者就是你啦！}
    - {threshold: 55秒以上, feedback: 速度再快一點！}
  benchmark_threshold_note: |-
    ⚠️ 三格的文字與 L0161 相同，但門檻不同（本課 45／45~55／55，L0161 是 90／90~100／100）——
    原文長度不同所致。另外三句回饋與門檻的對應在原稿上就是這樣：
    「45秒以下→速度有點快」「55秒以上→速度再快一點」語意是反的，但照原樣不改。

