    C: 問同學。
  vocabulary_bank: [鬆懈, 口腹之欲, 拜會, 日復一日, 輕盈, 羅馬不是一天造成的, 潛能, 贊助, 鍛鍊]
  items:
    - {index: 1, word: 羅馬不是一天造成的, definition: 好成果需要長時間累積，不可能一下子完成。}
    - {index: 2, word: 日復一日, definition: 一天又一天，持續重複做同一件事。}
    - {index: 3, word: 鬆懈, definition: 放鬆懈怠；放鬆對自己的要求。}
    - {index: 4, word: 拜會, definition: 拜訪會面。}
    - {index: 5, word: 潛能, definition: 還沒有完全發揮出來的能力。}
    - {index: 6, word: 輕盈, definition: 形容身體或動作輕快的樣子。}
    - {index: 7, word: 口腹之欲, definition: 想吃美食的欲望。}
    - {index: 8, word: 鍛鍊, definition: 透過反覆練習，使體能或能力變強。}
    - {index: 9, word: 贊助, definition: 提供金錢或物資，幫助活動進行。}

