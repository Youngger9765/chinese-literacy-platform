# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 7
  # ⚠️ 段號欄印 7 個號碼，但 document.xml 有 8 個段落 —— 第四段被切成兩塊
  #    （「…幫助自己控制」／「食量、維持輕盈的體態…」），是**句子中間**斷開的排版換行，
  #    不是兩段。這裡合成一段。
  # ⚠️ 版面上「五」印在「食量、維持輕盈的體態…」那一行旁邊，但那是段號欄的行距漂移。
  #    真正的依據是 ☞ 與字數欄：☞ 印在「到了晚上…」，而第一格字數 27
  #    剛好等於「到了晚上，周天成有時要出席公開活動，或拜會企業與政府機」的字數。
  paragraphs:
    - idx: 1
      text: 2014年，周天成成為臺灣第一位在世界羽聯超級系列賽奪冠的男單選手，此後長期名列世界前段班，成為臺灣頂尖的男子羽球選手。俗話說：「羅馬不是一天造成的。」讓我們看看周天成如何靠著日復一日的自律，逐步成為世界級選手。
    - idx: 2
      text: 羽球基本訓練，是周天成每天必做的訓練「菜單」。他一大早起床，八點前便到達羽球館。暖身時，他先把掃把柄架在肩膀上轉動身體，讓關節充分活動；接著用腳踩網球大小的硬球，放鬆腳底筋膜；再和陪練員進行網前平推、殺球、發球等基本練習。陪練員也會變換不同球路，訓練他的移動步伐。最後，再進行對打練習。這些日復一日的訓練，是他站上世界級羽球舞台的重要基礎。
    - idx: 3
      text: 周天成說：「強健的肌肉是每個運動員必備的條件之一。」多年的鍛鍊讓周天成的體脂率不到百分之五，但他對自己的要求從不鬆懈。完成辛苦的羽球訓練後，他便直奔健身房，繼續進行重量訓練。首先，他進行核心肌群訓練；接著，他舉啞鈴強化左手肌肉，讓左手的肌力接近慣用手，使左右兩側的肌力更加平衡，降低脊椎歪斜的風險；最後，他進行好幾組下肢重量訓練。強健的下肢肌肉，可以提升他在球場上的移動速度、步伐穩定性、彈跳高度和擊球表現。周天成把開發身體潛能視為重要課題，也會請運動指導員協助，訓練平時較少使用的肌肉，讓不同肌群都能充分發揮作用，使身體更加平衡、協調。
    - idx: 4
      text: 頂尖運動員也得管好自己的口腹之欲。到了午餐時間，周天成連吃飯都有一套規矩。他只吃原型食物，不加任何調味料，並按照水果、蔬菜、澱粉、肉類的順序進食。每一種食物吃完後，才能換下一種，不會一口飯、一口菜交替著吃。他每一口都慢慢咀嚼，幫助自己控制食量、維持輕盈的體態，讓他在羽球場上移動得更靈活。
    - idx: 5
      text: 到了晚上，周天成有時要出席公開活動，或拜會企業與政府機構。身為經常參加國際賽事的選手，除了比賽和訓練，他也有推廣羽球、回饋社會的責任，而這些工作往往也需要企業贊助或政府支持。此外，為了減少受傷的風險，他不騎機車，也不自行開車，盡量搭乘捷運或公車。保護自己，也是運動員對職業生涯負責的表現。
    - idx: 6
      text: 在夜深人靜的時候，周天成會自我反省、調整心態，也激勵自己。他說：「雖然我有時候輸掉比賽，但只要參賽，總是可以學到很多東西。最重要的是，你必須為自己奮鬥。我也會時刻提醒自己，在每場比賽中保持謙虛；每當我驕傲起來，就無法在場上打出好表現。」即使已經是臺灣頂尖的羽球選手，周天成仍然不自滿，持續尋找各種進步的方法，哪怕只有百分之一的進步機會，他都會去嘗試。他說：「只有拿出好成績、具有影響力，才能回饋社會，影響更多人；不然，我就只是個路人。」
    - idx: 7
      text: 周天成日復一日過著高度自律的生活，從訓練、飲食到外出方式，每個環節都仔細安排，讓自己保持最佳狀態。陪他過一天，也許會覺得新鮮；但要一年三百六十五天，天天這樣過並不容易。你能像他一樣，每天鍛鍊技術、增強體能、控制飲食，也好好保護自己嗎？
  inline_marked_terms: [羅馬不是一天造成的, 日復一日, 鍛鍊, 鬆懈, 口腹之欲, 輕盈, 拜會, 贊助]

