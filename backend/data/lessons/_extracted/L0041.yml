# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 請問第三段「多年的鍛鍊讓周天成的體脂率不到百分之五，但他對自己的要求從不鬆懈。」文中的「鍛鍊」可以用哪個詞語替換？
      options:
        A: 刻苦訓練
        B: 練習功夫
        C: 放鬆筋骨
        D: 排練演習
      teacher_note: （由多年的鍛鍊讓周天成的脂肪不到5%可知，是經由不斷的訓練而來）
    - index: 2
      answer: C
      stem: 下列哪一項最不能直接看出周天成的自律？
      options:
        A: 每天完成羽球基本訓練
        B: 羽球訓練結束後，繼續進行重量訓練
        C: 私人拜會、參與公開活動
        D: 控制飲食，按照固定順序進食
      teacher_note: 由第五段可知拜會行程是為了爭取企業贊助。
    - index: 3
      answer: D
      stem: 為什麼周天成已經是頂尖選手，仍持續精進自己？
      options:
        A: 他認為輸了比賽，先前的努力都白費了
        B: 想得到更多企業、政府機構的贊助
        C: 他想要追求體脂率5%的體態
        D: 他希望用好成績回饋社會，影響更多人
      teacher_note: |-
        A-第六段，就算比賽輸了，參賽總是可以學到很多東西。
        B-未提到。
        C-訓練是為了增進自己的表現，而非追求體態。
        D-第六段，好成績才可以去回饋影響他人。
      placement_note: 這個解析方塊在版面上印在第 4 題旁邊，但內容逐項對應第 3 題的 A~D 選項，故歸給第 3 題。
    - index: 4
      answer: B
      stem: 下列何者是本篇文章沒有提到的內容？
      options:
        A: 周天成日復一日的練習（第二段）
        B: 周天成每天固定睡眠幾小時
        C: 運動員的自主保護觀念（第五段）
        D: 周天成強健肌肉的由來（第三段）
      note: A、C、D 三個選項後面各印一個段落出處，是教師版註記，這裡照原樣留在選項文字裡
    - index: 5
      answer: B
      stem: 根據本文第六段，關於羽球選手周天成的形象，何者正確？
      options:
        A: 追求完美，保持全身體態的健美
        B: 力求突破，不滿足於已有的成績
        C: 追求新鮮感，喜愛嘗試新奇事物
        D: 熱愛臺灣，提升臺灣國際競爭力
      teacher_note: 第六段提到百分之一的進步機會，他都會去嘗試。

