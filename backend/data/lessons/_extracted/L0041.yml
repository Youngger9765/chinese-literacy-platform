# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論人物特質
  strategy_type: inference
  blocks:
    - type: concept_box
      text: |-
        上一課，我們學過：課文直接寫出人物特質時，可以回到人物說的話和做的事，找出支持這項特質的線索。這一課，課文沒有把周天成的每一項特質都直接說出來。我們要從他的言行，推論他是怎樣的人。
        推論人物特質的方法：
        ❶找言行：人物說了什麼、做了什麼？
        ❷找共同點：這些言行有什麼相同的地方？
        ❸推特質：這些言行最能看出人物具有什麼特質？
    - type: sub_block
      label: 一、先複習：哪些言行能支持「自律」？
      instruction: 課文直接寫出周天成過著高度自律的生活。下列哪些言行能支持「自律」？
      items:
        - type: multi
          prompt: 下列哪些言行能支持「自律」？（複選）
          options:
            1: 每天按照順序完成羽球基本訓練。
            2: 完成羽球訓練後，繼續進行重量訓練。
            3: 選擇原型食物，並按照固定順序進食。
            4: 晚上出席公開活動，拜會企業與政府機構。
            5: 為了降低受傷風險，外出時選擇大眾運輸工具。
          answers: [1, 2, 3, 5]
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: guide
          text: →你發現了嗎？楊勇緯和周天成都有「自律」的特質，這是他們成為頂尖選手的重要條件之一喔。
    - type: sub_block
      label: 二、把線索合起來，推論人物特質
      instruction: 除了「自律」這項特質，周天成還有哪些特質，請讀一讀每組課文句子，先判斷是人物「說的話」還是「做的事」，再把兩個線索合起來，選出最適合的人物特質。（單選）
      left_header: 課文線索
      right_header: 人物特質
