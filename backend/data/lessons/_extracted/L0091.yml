    - {index: 6, stem: 颱風季即將到來，鎮公所(　)，開始修剪路樹、疏通水溝。, answer: H}
    - {index: 7, stem: 每天熬夜又不運動， (　) ，身體容易出現問題。, answer: G}
    - {index: 8, stem: 網路假消息造成的影響 (　)，轉傳前應先查證。, answer: J}

# ── 五 文章重點表 ──
keypoints:
  title: 看見時代的灰犀牛了嗎？談人口負成長
  layout: list
  answer_carrier: 橘色手寫字（PDF p7）；文字層的【　】內已填有同樣的答案
  rows:
    - label: 段1~2 灰犀牛？本課主題
      value: |-
        1.灰犀牛是指明明可見，會造成重大衝擊的【　】事件，但因為壞影響還有一段時間才發生，因此被大眾忽視。高糖飲料和炸雞對國中生健康的影響就是一例。
        2.揭示本課主題—人口負成長。
      blanks:
        - {answer: 負面}
    - label: 段３ 人口負成長：定義及現狀
      value: |-
        1.當每年的「【　】人口數」少於「【　】人口數」時，出現人口負成長。
        2.人口負成長主要原因是【　】。
      blanks:
        - {answer: 出生}
        - {answer: 死亡}
        - {answer: 少子化}
    - label: 段４~5 圖1、２:臺灣婦女總生育率與人口負成長趨勢
      value: |-
        1.臺灣自1951年以來婦女總生育率【　】。
        2.2011年至2023年，臺灣出生人數逐年【　】，死亡人數逐年【　】。
        3.2020年開始，死亡人數【　】出生人數，臺灣出現人口負成長。
      blanks:
