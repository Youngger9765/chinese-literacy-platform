    - 手行長不長負視每先看
    - 搓蹂每天見成負面電鋒
    - 揉要拳況情長不可蹂情
    - 視不見擦愈況大躪愈況
    - 逆行可藥掌下家愈下每
    - 蘊草見逆風順視而不見
    - 愈含愈快向行駛叛逆向
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 里程碑
      cells: [[1, 1], [1, 2], [1, 3]]
      direction: horizontal
    - word: 琢磨
      cells: [[1, 10], [2, 9]]
      direction: diagonal_down_left
    - word: 開路先鋒
      cells: [[2, 7], [3, 8], [4, 9], [5, 10]]
      direction: diagonal_down_right
    - word: 眾所矚目
      cells: [[3, 3], [3, 4], [3, 5], [3, 6]]
      direction: horizontal
    - word: 負成長
      cells: [[4, 6], [5, 6], [6, 6]]
      direction: vertical
    - word: 每況愈下
      cells: [[5, 3], [6, 4], [7, 5], [8, 6]]
      direction: diagonal_down_right
    - word: 蹂躪
      cells: [[6, 9], [7, 8]]
      direction: diagonal_down_left
    - word: 不可逆
      cells: [[7, 2], [8, 3], [9, 4]]
      direction: diagonal_down_right
