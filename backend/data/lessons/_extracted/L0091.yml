    → 紙上 10 ＝ 路徑 10，不觸發「紙上 > 路徑」警報。
    ⚠️ 橘色連通元件只數到 9 個，那是因為「眾所矚目」與「負成長」兩個框在 目(3,6)／負(4,6)
    上下相鄰而黏成一塊 —— 元件數是下限不是真值，逐格取字才是判準。

