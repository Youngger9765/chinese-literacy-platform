# ── 一 讀全文—做記號 ──
body:
  header_level: Level 7・說明文
  header_strategy: 目標策略：圖表繪製與判讀─折線圖
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 請在重要的地方、喜歡的語詞、句子或段落做記號
  paragraph_count: 7
  paragraphs:
    - idx: 1
      text: 所謂灰犀牛，指的是明明可見、可能帶來重大影響的負面事件，但因為沒有急迫性，大家卻視而不見。例如，每天都吃高糖飲料和炸雞，長此以往，可能對國中生的健康造成負面影響；但這些影響往往不會立刻出現，因此許多國中生並不在意。這種長期累積、容易被忽略的健康風險，就是他們視而不見的灰犀牛。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 2
      text: 這一課要講的主題是每況愈下、影響不容小覷的「人口負成長」，你看見這頭灰犀牛了嗎？
    - idx: 3
      text: 當一個國家每年的「出生人口數」少於「死亡人口數」時，我們就說，這個國家出現了「人口負成長」。目前許多國家都面臨人口負成長，其主因是「少子化」。少子化會讓年輕人口比率逐漸降低，老年人口比率逐漸增加。臺灣正是全世界少子化情況最嚴重的國家。
    - idx: 4
      text: 圖1顯示臺灣從1951年（民國40年）以來，婦女總生育率整體呈下降趨勢。「總生育率」指的是「平均每位婦女一生中所生育之子女數」。從圖1可知，民國40年時，臺灣平均每位婦女一生生育約7個子女；再來總生育率一路下滑，到了1984年，平均只生2.1個；2021年，則只剩0.975個子女，是全世界各國倒數第一名。新生兒減少，兒童所占比率降低，老年人口所占的比率相對愈來愈高，人口結構也逐漸老化。
    - idx: 5
      text: 圖2呈現的是2011年到2023年臺灣出生人數與死亡人數的折線圖，可以看到出生人數（●實線）是逐年下滑，而死亡人數（▲虛線）逐年上升。2019年以前，實線高於虛線，也就是出生人數大於死亡人數，人口正成長。但2019年，虛線與實線開始交叉，表示出生人數和死亡人數相當。但2020之後，趨勢倒過來了，虛線開始高於實線，人口開始負成長。
    - idx: 6
      text: 人口負成長對經濟會帶來什麼影響呢？悲觀者認為，工作年齡人口（即年輕人和壯年人）承擔的扶養壓力將越來越重。2025年，臺灣每100個人中，有68人屬於工作年齡人口，32人屬於依賴人口，其中包括20名老人及12名小孩。也就是說，平均約2名工作年齡人口扶養1名依賴人口。但推估到2065年，每100個人中的工作年齡人口減少到50人，他們要負擔50名依賴人口（41名老人及9名小孩），也就是平均每1名工作年齡人口要負擔1名依賴人口。樂觀者則認為許多老年人長年累積財富，他們有積蓄、有房產，他們年紀大了，會需要購買各種貨品及服務，因此可能會帶動經濟，創造工作機會。也有人認為，人口負成長可能是對環境友善的，因為糧食和各種物資的消耗會減少，對地球帶來的負擔、污染，也可能降低，人類長年蹂躪這個水藍色的星球，現在總算開始踩煞車了。
    - idx: 7
      text: 在臺灣，人口負成長已呈現近乎不可逆的趨勢，它會改變人口結構、使工作年齡人口比率下降，雖然加重扶養壓力；但同時也可能帶動新一波的經濟與產業變革。人口負成長是我們的現在、更是我們必須面對的未來，認識它帶來的改變，才能未雨綢繆，為自己的未來做好準備。
  # 課文中夾在段落之間的兩張圖（不佔段號）
  figures:
    - label: 圖1
      caption: 圖1   1951~2024年臺灣婦女總生育率
      after_paragraph: 4
      note: PDF 上這張圖幾乎整片沒畫出來，只剩一條線與圖上文字「臺灣婦女總生育率 逐年下滑」；圖內資料在圖片上
    - label: 圖2
      caption: 圖2 臺灣出生人數與死亡人數在2019年出現死亡交叉
      after_paragraph: 5
      note: PDF 上只剩「150000」與虛線片段；圖內資料在圖片上
  # 課文右緣印的累計字數（從 ☞ 所在的第 1 段起算）
  running_char_counts: [28, 58, 88, 118, 138, 164, 178, 206, 236, 266, 294, 319, 350, 379, 406]
  char_count_note: |-
    第 1 段 138 字 ＝ 印出的第 5 個數字（精準）；＋第 2 段 40 ＝ 178 ＝ 第 7 個數字（精準）。
    第 3 段我算 117、Word 算 116（294），差 1 字屬計數口徑差異。
    最後一個數字 406 落在第 4 段中間（第 4 段共 194 字），字數欄在此停止，不是段界。
  inline_marked_terms: [視而不見, 長此以往, 每況愈下, 不容小覷, 負成長, 蹂躪, 不可逆, 未雨綢繆]
  underlined_terms: [臺灣]
  # 語詞應用那一頁旁邊的兩個補充框
  sidebars:
    - label: 灰犀牛是什麼意思?
      text: |-
        (1)非洲大草原上的灰犀牛，看起來笨重無害，即使走近，大家也認為牠是吃素的，沒有危險。但只要牠生起氣來，卻會造成很大的傷害。
        (2)後來灰犀牛被引申為：一定會發生重大負面影響、卻因發展緩慢，長年被社會忽視的事件。
    - label: 灰犀牛小檔案
      text_carrier: image
      text: |-
        ●體長：2.2～4.5 公尺
        ●體重：1.7-2.5 公噸
        ●特徵：短腿和粗壯身體；草食動物；陸地上體型第二大的哺乳類。
        ●戰鬥指數：★★★★★，遠看起來溫和無害，實際攻擊力強，連獅子也會懼怕三分。
      note: |-
        🔴 這一整塊畫在圖片上，`document.xml`／`footnotes.xml`／`endnotes.xml` 全部 grep 回 0
        （體長／體重／小檔案／哺乳類／公噸 五個關鍵詞皆 0 命中），所以標 text_carrier: image
        讓逐字門列進「無法驗證」而不是靜默跳過。同頁還有一張灰犀牛壓倒人的插圖。

