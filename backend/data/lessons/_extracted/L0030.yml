# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  # 段號欄印 一二三四五 共 5 個。段號欄行距比課文欄窄會往下漂
  #（「三」印在第 2 段末行旁、「四」「五」同理），對位靠語意起頭。
  paragraph_count: 5
  paragraphs:
    - idx: 1
      text: 飾演雷神索爾的克里斯·漢斯沃（C. Hemsworth）結實的胸肌、壁壘分明的腹肌，令許多粉絲羨慕不已。但是我們低頭看看自己的肚子，卻是一團軟綿綿的脂肪。為什麼他們是整齊的六塊肌，而我們卻像是六塊雞組成的全家餐呢？
    - idx: 2
      text: 其實，我們每一個人都有這些肌肉，只是都被厚厚的脂肪覆蓋住了，所以想要有結實的肌肉，首先要做到「減脂」，等到肌肉出現後再開始做「增肌」，但這中間可是需要相當的毅力跟專業才能做到。
    - idx: 3
      text: 想擁有雷神索爾般的身材，首先要做到「均衡的飲食控制」，倘若每餐都是炸雞、薯條、可樂、珍奶，就算運動得很努力，也跟不上脂肪增加的速度，因此減少油炸類、甜食的攝取是非常關鍵的；再來是「保持良好的睡眠」，因為生長激素在睡覺時，濃度會快速上升，以利身體組織成長，所以充足的睡眠是不可或缺的；最後是「專業且規律的訓練」，身體的肌肉有相當多種類，不同的訓練方式，則會增強不同的肌肉，例如：伏地挺身會練到胸肌、三頭肌；拉單槓會練到背肌、二頭肌；棒式是核心肌群、肩膀、胸部；深蹲則是大腿、臀大肌。重要的是，每次練習，都要「離開舒適區」，練習的分量，要比自己能承受的最大重量再高一點點才行。
      note: 念順順的 ☞ 錨點印在本段首行
    - idx: 4
      text: 不過有很多新手急於速成，想要趕快擁有肌肉，例如：教練說一天做二十下，新手卻一天做四十下，造成一個星期的肌肉酸痛，甚至帶來運動傷害，真是欲速則不達。其實，練肌肉沒有一步登天的方法，新手可以請教教練或是閱讀專門的書籍，循序漸進的飲食控制和規律練習才會慢慢看見成效。
    - idx: 5
      text: 練得專業、吃得好、睡得飽就是減脂增肌的基本原則。欲速則不達，想要擁有令人羨慕的身材，是需要時間跟訓練堆疊而成，只要有心就能拋去「六塊雞」，擁有「六塊肌」。
  inline_marked_terms: [結實, 壁壘分明, 脂肪, 覆蓋, 倘若, 炸, 不可或缺, 舒適區, 分量, 欲速則不達, 一步登天, 循序漸進]
  inline_marked_terms_note: 課文框起來的除了 10 個本課語詞，還多框了「脂肪」與「炸」兩處（不在本課語詞清單裡）

