# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略—用主題細節整理重點
  strategy_type: comprehension_strategy
  blocks:
    - type: concept_box
      text: |-
        說明文有許多不同的寫法。本課是一篇說明文，主要介紹與鍛鍊肌肉有關的知識。這一課很適合用「主題—細節結構」來整理：先找出文章的大主題，再看作者分成哪幾個小主題來說明，最後找出每個小主題中最重要的說明細節。
        下面的結構圖，可以幫助我們把文章重點分成三層，並把大主題、小主題和重要細節放到圖裡。
    - type: guide
      text: 以本課第三段為例：看文章怎麼變成結構圖
    - type: single
      label: ⑴
      prompt: 大主題：第三段主要講什麼？
      options: {1: 鍛鍊肌肉的方法, 2: 動作訓練}
      answer: 1
      answer_carrier: Wingdings F0FE（☑，圖形字元），文字流無此資訊
    - type: guide
      text: 這就是結構圖最上方的大主題喔。
    - type: guide
      label: ⑵
      text: 小主題：第三段用「首先、再來、最後」依序說明三個小主題。請看下面的結構圖，找出作者分別用了哪三個小主題來說明，並填入【 】中。
    - type: fill_table
      label: 第三段結構圖
      columns: [大主題, 小主題, 細  節]
      # ⚠️ 這是一張「主題—細節」樹狀結構圖，不是一般表格：大主題只有一格、
      #    跨三個小主題；每個小主題各連到自己的細節格。此處攤平成三列表達。
