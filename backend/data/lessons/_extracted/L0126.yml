          value: 結果：考上【　】、【　】，鎮上貼賀榜。最後當了老師、校長，還成了一位作家。
          blanks: [{answer: 臺南女中}, {answer: 臺南師專}]
    - label: 回顧與體會
      value: 回顧作者的成長經歷，下列哪些敘述正確？（請打勾，複選）
      options:
        1: 她一直以來都很理解父母的辛苦，不曾抱怨過
        2: 她曾經對家庭的動盪感到埋怨與難堪
        3: 隨著年齡增長，她逐漸體會父母的無奈與辛勞
        4: 她難忘老師在困境中給予支援與溫暖
        5: 她因為環境惡劣，選擇放棄努力而聽天由命
        6: 她相信自己擁有改變命運的力量，並付諸行動
      answers: [2, 3, 4, 6]
      label_note: 原稿這一列的標籤印成兩行「回顧與／體會」

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略──推論動機、情緒和想法
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）共 17 個 + 橘色手寫填空，PDF p6~p9 全部可見
  blocks:
    - type: concept_box
      text: |-
        上一課，我們讀人物的行為，推想他為什麼這樣做。這一課，我們要學會用三個步驟，找出有根據的推論。
        推論人物內心三步驟
        ❶找言行：找出人物做了什麼、說了什麼，有什麼表情或反應。
        ❷看情境：回到前後文，看看人物當時遇到什麼事情或困難。
        ❸推內心：把言行和情境合起來，推論人物的動機、情緒或想法。

    - type: table
      rows:
        - [要推論什麼？, 可以怎麼問？]
        - [動機, 他為什麼這樣做？]
        - [情緒, 他當時有什麼感受？]
        - [想法, 他心裡可能怎麼想？]

    # ── 一、戲院困境與賭博事件 ──
    - type: guide
      text: 一、戲院困境與賭博事件

    - type: single
      label: 1.找父母的動機（單選）
      prompt: 根據本文3、4段，作者一家遇到什麼困難？父母採取哪些方法改善困境？
      options:
        1: 戲院生意蕭條，父母四處借錢、到賭場碰運氣，並在戲院旁賣東西。
        2: 戲院生意蕭條，父母恢復巡迴放映、到鄉間招攬觀眾，停止經營戲院。
      answer: 1

    - type: guide
      text: |-
        2.推論作者的情緒與想法
        請閱讀下面兩段課文，再完成表格。

    - type: passage
      label: （課文第三段）
      paragraphs:
        - 「有次放學路上，我看見爸爸和一群人在社區活動中心聚賭，他神色木然，我則漲紅了臉快步離開，像逃離一場不願面對的夢。」

    - type: single
      prompt: ❶找言行：當事人（作者）有什麼表情或動作？（2選1）
      options: {1: 漲紅了臉，快步離開, 2: 神色木然的面對}
      answer: 1

    - type: single
      prompt: ❷看情境：當時發生了什麼事？（2選1）作者看見：
      options: {1: 爸爸紅著臉快步離開, 2: 爸爸在社區活動中心賭博}
      answer: 2

    - type: single
      prompt: ❸推內心：把「言行」和「情境」合起來，推論主角的內心。
      options:
        1: 她覺得爸爸公開賭博很丟臉，想趕快避開。
        2: 她擔心爸爸正在生氣，想趕快回家讀書。
      answer: 1

    - type: passage
      label: （課文第四段）
      paragraphs:
        - 「某個深夜，他倆一身泥巴回到家，我在床上瞇著眼偷聽，才知道警察突襲抓賭，爸媽和賭客們倉皇逃進剛灌溉過的香蕉園，才會如此狼狽。從那天起，每晚我總要等到他們平安進門，才能安心睡著。」

    - type: single
      prompt: ❶找言行：後來，當事人（作者）反覆出現了什麼行為？（3選1）
      options:
        1: 每天晚上在床上瞇著眼偷聽
        2: 每晚等父母平安進門才睡
        3: 每天幫父母清洗沾滿泥巴的衣服
      answer: 2

    - type: single
      prompt: ❷看情境：當時發生了什麼事？（2選1）
      options: {1: 警察抓賭，爸媽經香蕉園逃回家, 2: 戲院生意差，家中收入不穩定}
      answer: 1

    - type: sub_block
      label: ❸推內心：
      items:
        - type: single
          prompt: 情緒：作者每晚等父母回家的情緒是什麼？（4選1）
          options: {1: 安心, 2: 得意, 3: 擔心, 4: 憤怒}
          answer: 3
        - type: single
          prompt: 想法：作者心裡可能有什麼想法？（3選1）
          options:
            1: 希望父母賺更多錢回家
            2: 希望每晚父母都可以平安回來
            3: 希望父母晚一點回來，讓她安心睡著
          answer: 2
        - type: free_text
          prompt: 動機：作者等父母回家的動機是什麼？想要確認【　】，她才能放心睡覺。
          blanks: [{answer: 父母平安回家}]

    - type: single
      label: 3.把前面的推論合起來
      prompt: 把父母的動機和作者的內心合起來看，可以看出什麼？（2選1）
      options:
        1: 父母為了維持家計想盡辦法，作者也期待他們靠賭博改善生活。
        2: 父母為了維持家計想盡辦法，但其中賭博的做法讓作者感到難堪與擔心。
      answer: 2

    # ── 二、師長支持與作者讀書行動 ──
    - type: guide
      text: |-
        二、師長支持與作者讀書行動
        請閱讀下面的課文。你可以一邊讀，一邊把角色做的事畫線。

    - type: passage
      label: （課文第九段）
      paragraphs:
        - 「導師了解我的處境，每學期都會悄悄送我參考書；理化老師讓我晚上到他空著的宿舍自習，雖然只去幾次，卻讓我倍感溫暖。」

    - type: sub_block
      label: 1.推論老師的動機
      items:
        - type: free_text
          prompt: ❶找言行：兩位老師分別做了什麼？導師：【　】；理化老師：【　】
          blanks: [{answer: 送作者參考書}, {answer: 讓作者用他的宿舍讀書}]
        - type: single
          prompt: ❷看情境：作者當時處在什麼情境中？（2選1）
          options: {1: 成績太差，不願意讀書, 2: 家境困難，也缺少安靜的讀書環境}
          answer: 2
        - type: single
          prompt: ❸推內心：動機：兩位老師幫助作者的共同動機，最可能是什麼？（2選1）
          options:
            1: 了解作者的困難，想支持她繼續學習
            2: 希望作者進步後，替老師贏得比賽榮譽
          answer: 1

    - type: guide
      text: |-
        2.推論作者的想法和動機
        請閱讀下面的課文。你可以一邊讀，一邊把角色做的事畫線

    - type: passage
      paragraphs:
        - 「在紛亂的生活中，我逐漸摸索出讀書的時機與訣竅。顧檳榔攤時最怕遇見同學，我乾脆埋頭寫練習卷避開尷尬。電影放映時，我在戲院入口看門或顧車，沒有桌子，我便拿著需要記誦的課本，一邊背一邊來回踱步。需要計算的科目則留到打烊後，奶奶嫌電費貴，不准我開燈，我便等她熟睡後，再打開桌上小檯燈，在縫隙滲出的微光下解題。」
      note: 這一段是課文第 9 段的節錄改寫（教材自己刪去中間數句），不等於課文原段落

    - type: multi
      prompt: ❶找言行：作者做了哪些事？
      options:
        1: 顧檳榔攤時寫練習卷
        2: 看門或顧車時背課本
        3: 打烊後在微光下解題
        4: 等到家中環境改善後，再開始認真讀書
      answers: [1, 2, 3]

    - type: single
      prompt: ❷看情境：當時作者處在什麼情境中？
      options:
        1: 每天都有安靜、明亮的讀書空間。
        2: 要幫家裡工作，也缺少合適的讀書環境
      answer: 2

    - type: sub_block
      label: ❸推內心：
      items:
        - type: single
          prompt: ⑴把作者的行動和情境合起來，她當時最可能有什麼想法？（單選）
          options:
            1: 讀書環境太差，即使努力也無法改變結果。
            2: 環境雖然不好，我仍能找時間和方法學習。
          answer: 2
        - type: single
          prompt: ⑵作者不斷想辦法讀書，她的動機可能是什麼？（單選）
          options:
            1: 想得到客人的稱讚，證明自己是一個用功的學生。
            2: 想藉由持續學習，為自己走出不同的人生。
            3: 想趕快離開戲院，不必再幫家裡做任何工作。
          answer: 2

    - type: single
      label: 3.把前面的推論合起來
      prompt: 把老師的動機和作者的行動合起來看，可以看出什麼？
      options:
        1: 老師想幫助作者繼續學習，作者只要接受老師的安排即可。
        2: 老師想支持作者繼續學習，作者也主動把握時間、想辦法讀書。
      answer: 2

    # ── 三、串起前後線索 ──
    - type: single
      label: 三、串起前後線索，回到全文想一想
      prompt: 把前面的推論合起來，可以看出作者如何走出困境？（2選1）
      options:
        1: 家庭困境讓作者不安，但老師的支持和自己的努力，幫助她逐漸改變人生。
        2: 家庭困境讓作者不安，後來主要靠離開戲院，走出不同的人生。
      answer: 1

    - type: self_check
      prompt: ※我會推論了嗎？請你檢查自己是否做到：
      items:
        - 1.我會先找人物的動作、說話或表情。
        - 2.我會讀前後內容，了解人物所處的情境。
        - 3.我會先分清楚題目問的是動機、情緒或想法。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，讀完每一個選項後，選出最適合的答案。
  answer_carrier: 橘色手寫代號（在文字層），PDF p9~p10 可見
  items:
    - index: 1
      stem: 下列語詞何者使用不正確?
      options:
        A: 一聽到警報聲，大家「蜂擁而至」的逃出教室
        B: 這座城市因觀光業「崛起」，變得越來越繁榮
        C: 颱風來襲前，民眾「倉皇」搶購物資
        D: 他講稿沒準備好，上場時顯得非常「狼狽」
      answer: A
      explanation: Ａ－蜂擁而至指的是大家前來，語意錯誤
    - index: 2
      stem: 作者提到戲院是她的家，但為什麼她說「這個家讓人不安心」？
      options:
        A: 因為戲院經常斷電停水
        B: 戲院裡常發生混亂與危險事件
        C: 作者和家人關係不好
        D: 作者常需要在戲院旁顧攤而遇到同學
      answer: B
    - index: 3
      stem: 文章中提到作者用「黑色十字繡罩在燈上，在縫隙滲出的微光下解題」，這段文字作者主要想凸顯什麼？
      options:
        A: 她熱愛刺繡工藝
        B: 奶奶不疼愛她，嫌棄她是女生
        C: 她不喜歡在那麼亮的燈光下學習
        D: 她在艱困中仍舊堅持學習
      answer: D
    - index: 4
      stem: 這篇文章最主要想要表達的想法是什麼？
      options:
        A: 社會亂象無處不在，要小心保護自己
        B: 家庭是你永遠避風的港灣
        C: 堅持努力就能在逆境中改變命運
        D: 不要對人性失去信心，社會處處都有好人
      answer: C
    - index: 5
      stem: 作者描寫戲院中發生的各種事件，如賭博、吸膠、性騷擾，這樣的描寫目的為何？
      options:
        A: 最大化的展現父親管理戲院的混亂
        B: 豐富文章情節，使文章更具有可看性
        C: 用童年所處的艱難環境，襯托她仍能努力讀書的可貴
        D: 呈現早期鄉鎮戲院的治安隱憂，提醒觀眾自我保護
      answer: C
      explanation: (這些事件皆為鋪陳童年的社會背景與不安定感，為後段作者奮發讀書做情境對比與情感深化。)

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  instruction_note: |-
    文字層另有一份同位置的重複文字方塊，句末寫「刪除」而不是「劃掉」（各 2 份，是 mc:Choice/Fallback 的兩份）。
    PDF p10 上印出來的是「劃掉」那一份，本檔照印出來的取。
  target_words: [集資, 蜂擁而至, 崛起, 妄想, 倉皇, 狼狽, 突如其來, 驚心動魄, 喧嘩, 驚駭不已, 蕭條, 訣竅]
  grid_size: [10, 10]
  grid:
    - 米蒼皇帝王驚駭不已驚
    - 倉白族集滿蜂窩宣祕喜
    - 突然金資料蜜擁告訣竅
    - 發如庫集崛起至而　祕
    - 狀此其合強制親人至密
    - 況這實來誕妄條件狼喧
    - 驚般倉促思想膽狽嚎賓
    - 訝已庫皇竹蕭大妄為奪
    - 鬼迷心竅驚心動魄蕭主
    - 狼喧嘩孔動心不已條來
  grid_note: |-
    第 4 列第 9 欄是**空格**（文字層該儲存格無字，PDF p10 上也印成空白）。
    本檔用全形空格「　」佔位，讓每列都是 10 欄、座標對得上；沒有任何一條圈選路徑用到這一格。
