# ── 三 語詞我最棒 ──
vocab_definitions:
  vocabulary_bank: [集資, 蜂擁而至, 崛起, 妄想, 倉皇, 狼狽, 突如其來, 驚心動魄, 喧嘩, 驚駭不已, 蕭條, 訣竅]
  vocabulary_bank_label: 本課語詞
  instruction: |-
    請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
    🅐 從本課語詞框框，找語詞。
    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    🅒 問同學。
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  items:
    - {index: 1, word: 妄想, definition: 不切實際、難以實現的想法。}
    - {index: 2, word: 突如其來, definition: 形容事情發生得非常突然，讓人措手不及。}
    - {index: 3, word: 集資, definition: 許多人一起出錢，湊足所需要的資金。}
    - {index: 4, word: 驚心動魄, definition: 形容情況驚險緊張，令人十分震撼。}
    - {index: 5, word: 倉皇, definition: 匆忙驚慌的樣子。}
    - {index: 6, word: 喧嘩, definition: 大聲說話、叫喊、笑鬧的聲音。}
    - {index: 7, word: 崛起, definition: 迅速興起、發展起來。}
    - {index: 8, word: 蕭條, definition: 冷清、沒有生機的樣子，常用來形容經濟或景氣低迷。}
    - {index: 9, word: 驚駭不已, definition: 形容非常震驚、害怕，久久無法平靜。「不已」是無法停止的意思。}
    - {index: 10, word: 訣竅, definition: 做好一件事的重要方法或技巧。}
    - {index: 11, word: 狼狽, definition: 形容人處在困難、尷尬或混亂的情況，進退兩難的樣子。}
    - {index: 12, word: 蜂擁而至, definition: 形容人群像蜜蜂一樣迅速且大量的朝某個方向聚集。}

