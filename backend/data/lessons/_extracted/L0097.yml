  strategy_name: 落實環保3R─從問題到行動
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  answer_carrier: |-
    橘色手寫字為主（【　】內的 A/B/C 與 ①②③），另有 **2 個**紅色 ☑
    （w:sym Wingdings F0FE）在「二-1-2」與「二-(二)」兩道單選，PDF p6~p7 可見。
  structure_note: |-
    ⛔ 兩張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: |-
        課文中的綠色賽事，用3R改變物品和材料的使用方式，減少對環境的負擔。
        真正落實3R，不只是知道三個R的意思，還要學會：
        ①找出問題 → ②想3R改善方法 → ③檢查問題有沒有改善
        3R小提醒：
        A. Reduce（減少使用）
        B. Reuse（重複使用）
        C. Recycle（回收再利用）

    - type: guide
      text: 一、從生活中辨認3R

    - type: fill_table
      prompt: 下面三種做法，主要運用哪一個R？(請填入A、B或C)
      columns: [生活中的做法, 主要運用哪個R？]
      answer_carrier: 橘色手寫代號（PDF p5）；文字層的【　】內已填有同樣的代號
      rows:
        - 生活中的做法: ①能看電子資料時，就不另外列印紙本。
          主要運用哪個R？: 【　】
          主要運用哪個R？_blanks: [{answer: A}]
        - 生活中的做法: ②哥哥在二手網站購買仍可使用的家電
          主要運用哪個R？: 【　】
          主要運用哪個R？_blanks: [{answer: B}]
        - 生活中的做法: ③選用回收紙再製成的筆記本。
          主要運用哪個R？: 【　】
          主要運用哪個R？_blanks: [{answer: C}]

    - type: guide
      text: 二、用3R解決問題：

    - type: guide
      text: （一）幫阿國完成「綠色運動會」提案

    - type: guide
      text: 阿國和同學觀察以前的運動會，發現三個可以改善的地方。

    - type: passage
      paragraphs:
        - 問題A：每人都會拿到一件紀念衫，但有些人不需要，拿回家後也很少穿。
        - 問題B：每年都重新製作班級指示牌，活動結束後就丟掉。
        - 問題C：活動後留下許多寶特瓶，有些被丟進一般垃圾。

    - type: fill_table
      prompt: 1.請從下面圓框中選出最適合的改善方法，完成提案。
      option_bank:
        1: 調查需求，有需要的人再訂購紀念衫。
        2: 指示牌活動後收回保存，下次繼續使用。
        3: 設置清楚的瓶罐回收區，將寶特瓶分類回收。
        4: 在體育館屋頂裝設太陽能板，利用太陽能發電。
      option_bank_note: 原稿把這四項印在一個圓角框裡，位在表格上方；④ 是誘答（見下一題）。
      columns: [發現的問題, 改善方法（填入①～④）, 主要運用哪個R？（填入A～C代號）]
      answer_carrier: 橘色手寫的圈碼與代號（PDF p6）
      rows:
        - 發現的問題: A-紀念衫有人不需要
          改善方法（填入①～④）: 【　】
          改善方法（填入①～④）_blanks: [{answer: ①}]
          主要運用哪個R？（填入A～C代號）: 【　】
          主要運用哪個R？（填入A～C代號）_blanks: [{answer: A}]
        - 發現的問題: B-指示牌用完就丟
          改善方法（填入①～④）: 【　】
          改善方法（填入①～④）_blanks: [{answer: ②}]
          主要運用哪個R？（填入A～C代號）: 【　】
          主要運用哪個R？（填入A～C代號）_blanks: [{answer: B}]
        - 發現的問題: C-寶特瓶沒有做好回收
          改善方法（填入①～④）: 【　】
          改善方法（填入①～④）_blanks: [{answer: ③}]
          主要運用哪個R？（填入A～C代號）: 【　】
          主要運用哪個R？（填入A～C代號）_blanks: [{answer: C}]

    - type: single
      prompt: 2.想一想，圓框中最後一項「改善方法④」也是環保做法，為什麼沒有被放進這份3R提案裡？
      options:
        1: 太陽能對環境沒有幫助。
        2: 太陽能有環保作用，但不屬於Reduce、Reuse或Recycle。
        3: 只有運動用品才能使用3R的方法。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: guide
      text: （二）這份提案真的能改善問題嗎？

    - type: guide
      text: 阿國把提案寫好後，又逐項檢查這些做法是否真的能改善原來的問題：

    - type: passage
      paragraphs:
        - A.紀念衫改為有需要的人再訂購 → 減少不必要的製作
        - B.指示牌收回，下次再用 → 減少重複製作與丟棄
        - C.寶特瓶分類回收 → 讓材料可以回收再利用

    - type: single
      prompt: 從這三個例子可以看出，運用3R改善問題時，應該先怎麼做？
      options:
        1: 每一場活動都一定要同時做到三個R。
        2: 活動結束後把所有垃圾分類好就可以。
        3: 先找出活動中的問題，再用適合的3R方法改善。
      answer: 3
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: guide
      text: 三、換我做做看

    - type: self_check
      instruction: 下次班級或學校辦活動時，請至少選一項你願意先做到的事：
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三格皆為空 □（無 w:sym F0FE）
      items:
        - ①不拿自己不需要的用品。
        - ②把可以再用的物品留下來，下次繼續使用。
        - ③把可回收的物品放進正確的回收區。

    - type: self_check
      label: ◎自我檢核
      instruction: 如果你有做到，請在□打勾。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿兩格皆為空 □（無 w:sym F0FE）
      items:
        - 我能找出活動中需要改善的問題。
        - 我能選擇適合的3R方法，想出做得到的改善方式。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p7~p8）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: B
      stem: 下列語詞何者使用正確？
      options:
        A: 在車禍現場，他拿起手機「呼籲」救護車前來救援
        B: 學生會提出一份「提案」，說明如何減少運動會垃圾
        C: 這位運動員有非常優秀的心理素質，真是讓人「憂心忡忡」
        D: 為了掩飾錯誤，有人故意「亂竄」活動紀錄
      explanation: 第1題解析：（A－誤用，呼叫。Ｃ－誤用，同音不同義。Ｄ－誤用，應是竄改。）
      explanation_note: 原稿是一個浮動說明框，印在題目右上方；C、D 兩個代號用全形。
    - index: 2
      answer: A
      stem: 第一段說：「這一幕出現在強調『為愛而跑』的比賽中，顯得格外諷刺。」這句話的意思是什麼？
      options:
        A: 活動強調關愛，賽後卻留下大量垃圾，形成反差
        B: 阿國完成第一場路跑，卻因天氣濕冷而無法享受比賽
        C: 跑者為了保暖穿上雨衣，表示主辦單位沒有提供足夠服務
        D: 參賽者留下許多垃圾，表示運動賽事帶來的壞處多於好處
    - index: 3
      answer: D
      stem: 下列何者不是舉辦「綠色賽事」的主要用意？
      options:
        A: 減少自然資源的消耗
        B: 降低賽事造成的環境負擔
        C: 提升大眾的環境保護意識
        D: 增加參賽者可獲得的紀念品
      explanation: 第3題解析：（第三、四段提到，綠色賽事針對地球的永續經營，以減少因賽事製造的物品為主。）
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 B 之前；題幹的「不是」加了底線。
    - index: 4
      answer: C
      stem: 作者先描寫阿國看見賽後垃圾，再介紹綠色賽事與3R，最後寫阿國準備向學校提案。這樣安排主要有什麼作用？
      options:
        A: 先介紹路跑流程，再說明參賽者需要準備哪些運動用品
        B: 先比較各種賽事，再選出最適合由學校舉辦的運動活動
        C: 先呈現環境問題，再說明改善方法，最後帶向行動
        D: 先描寫阿國的心情，再證明運動能提升個人的環保意識
      explanation: 第4題解析：全文依「問題→方法→行動」推進
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在第 3 題的選項 C 之前
    - index: 5
      answer: B
      stem: 下列哪一項最能概括本文主旨？
      options:
        A: 大型賽事可縮小規模，減少垃圾產生
        B: 運動賽事可運用3R降低環境負擔，落實環保行動
        C: 綠色賽事主要是活動後做好垃圾分類
        D: 運動賽事應改用再生材料製作紀念品
      explanation: 第5題解析：B正確，涵蓋環境問題、3R改善方法與實際行動
      explanation_note: 原稿是一個浮動說明框，在 PDF p8 上印在選項 C 與 D 之間

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [禦寒, 亂竄, 諷刺, 環境永續, 碳排放, 憂心忡忡, 象徵, 氣候變遷, 碳足跡, 大放異彩, 地球公民, 提案]
  target_words_note: 灰框 12 個詞，比本課語詞（13 個）少「因應而生」—— 它沒進找字遊戲，不是抽漏。
  grid_size: [10, 10]
  grid:
    - 環境永續約象徵碳碳水
    - 球界遠氣癱捶胸頓足古
    - 異能禦寒候瘓碳倔跡蹟
    - 能量嬌帶遍變熱排強地
    - 題蕉提示地移遷衷放亂
    - 目案問環球憂心沖沖竄
    - 睽煽情大公心心怒發刷
    - 違變放放民衝突忡掘新
    - 光異襯異審衝諷喇忡鮮
    - 彩虹衫採視撞次刺條款
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 環境永續
      cells: [[1, 1], [1, 2], [1, 3], [1, 4]]
      direction: horizontal
    - word: 象徵
      cells: [[1, 6], [1, 7]]
      direction: horizontal
    - word: 碳足跡
      cells: [[1, 9], [2, 9], [3, 9]]
      direction: vertical
    - word: 氣候變遷
      cells: [[2, 4], [3, 5], [4, 6], [5, 7]]
      direction: diagonal_down_right
    - word: 禦寒
      cells: [[3, 3], [3, 4]]
      direction: horizontal
    - word: 碳排放
      cells: [[3, 7], [4, 8], [5, 9]]
      direction: diagonal_down_right
    - word: 提案
      cells: [[5, 3], [6, 2]]
      direction: diagonal_down_left
    - word: 地球公民
      cells: [[5, 5], [6, 5], [7, 5], [8, 5]]
      direction: vertical
    - word: 亂竄
      cells: [[5, 10], [6, 10]]
      direction: vertical
    - word: 憂心忡忡
      cells: [[6, 6], [7, 7], [8, 8], [9, 9]]
      direction: diagonal_down_right
    - word: 大放異彩
      cells: [[7, 4], [8, 3], [9, 2], [10, 1]]
      direction: diagonal_down_left
    - word: 諷刺
      cells: [[9, 7], [10, 8]]
      direction: diagonal_down_right
  answer_paths_note: |-
    12 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。
    幾何交叉驗證（單向警報）：以找字表格元素當邊界，表格內 roundRect = **12 個**，
    路徑 12 條 → 沒有「紙上 > 路徑」的缺條警報（全文 13 個，多的 1 個在表格外）。
    ⚠️ **紙外殘留：未驗**（`posOffset` 判準只認錨點型溢出，對「掛在儲存格裡被排版推出去」零命中，
    2026-08-18 更正）；扣掉未偵測的殘留只會讓紙上數更少，不會讓警報成立。
    正確性證據是每條 cells 套回 grid 拼字（12/12 全中）。

