# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略──從小標題找重要細節
  strategy_type: summarization_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層），共 14 個
  blocks:
    - type: concept_box
      text: |-
        　　本課是一篇說明文，文章用小標題分段，分別說明文章主題的不同面向。想要做這類文章的讀後摘要，你只要抓住四件事就能掌握重點：
        一、確認大主題的核心議題
        二、確認小標題下的重點在說明哪個面向
        三、在每個面向找關鍵細節
        四、把各段文字精簡成一句話，重點整合為摘要
        接下來，我們就來做這四件事：確認大主題與小主題、找重要細節。
      text_note: |-
        ⚠️ 這個框在 PDF p5 被 LibreOffice 疊印在大題標題上，第一行只看得到「小標題…同」；
        document.xml 的文字流是完整的，本欄以文字層為準。

    - type: sub_block
      label: 一、確認大主題的核心議題
      intro: 說明文的「大主題」通常就是文章標題。大主題要精簡，也要抓到本文最核心的議題。
      items:
        - sub_label: 下列哪一個名稱，也可做為本文的大主題？（單選）
          options:
            1: 齊柏林號：升空的第一步
            2: 福衛八號：守望臺灣的衛星星系
          answer: 2

    - type: guide
      text: |-
        二、確認小標題下的重點＋找關鍵細節
        本文每段資訊都很多，請用小標抓住這段的重點，並找到最能支持小標的「關鍵細節」句子。

    - type: sub_block
      label: （一）第3~4段〈太空中的巡邏隊〉
      items:
        - sub_label: 1.確認小標題下的重點：①和②哪個最接近小標題的重點？(單選)
          options:
            1: 星系接力觀測：間隔變短、看得更清楚
            2: 衛星速度驚人：太空中的高速飛行
          answer: 1
        - sub_label: 2.找關鍵細節：哪些句子最能直接支持你選的重點？(4選2)
          options:
            1: 福衛八號從2025起逐年發射，到2031全部就位
            2: 衛星在約561公里的太陽同步軌道運行，輪流拍攝
            3: 星系完成後，觀測間隔將大幅縮短，能更快取得影像
            4: 解析度比以往更高，能看清災區地形、道路、建築、農田
          answers: [3, 4]
        - sub_label: 3.精簡成一句話，重點整合為摘要(3選1)
          options:
            1: 星系完成後觀測更頻繁、影像更清楚，能更快掌握災情
            2: 衛星在太陽同步軌道運行，所以速度很快、很壯觀
            3: 福衛八號會逐年發射到2031，形成一套完整的觀測系統
          answer: 1

    - type: sub_block
      label: （二）第５～６段〈沒有「重來」的按鈕〉
      items:
        - sub_label: 1.確認小標題下的重點：①和②哪個最接近小標題的重點？(單選)
          options:
            1: 太空環境嚴酷：溫差、輻射與隕石
            2: 失誤難挽回：發射前要反覆測試
          answer: 2
        - sub_label: 2.找關鍵細節：哪些句子最能直接支持你選的重點？(4選３)
          options:
            1: 在地球上壞了可以修，但在太空失誤往往覆水難收
            2: 太空環境嚴酷，有溫度變化、輻射和微小隕石撞擊
            3: 因此發射前必須在地面經歷無數次的模擬測試
            4: 衛星只有冰箱大小，但內部塞滿精密相機和推進系統
          answers: [1, 2, 3]
          sub_label_note: 「(4選３)」的「３」在原稿是**全形**，其餘題號是半形 —— 照抄
        - sub_label: 3.精簡成一句話，重點整合為摘要(3選1)
          options:
            1: 太空危險多、失誤很難補救，所以發射前必須反覆模擬測試
            2: 太空環境很嚴酷，所以衛星要縮小到冰箱大小，較不易故障
            3: 人造衛星設備太精密了，所以發射成功主要靠運氣
          answer: 1

    - type: sub_block
      label: （三）第7段〈星光背後的二十年〉
      items:
        - sub_label: 1.確認小標題下的重點：①和②哪個最接近小標題的重點？(單選)
          options:
            1: 二十年太空里程：從仰賴他國到自主製造
            2: 二十年太空成果：解析度更高、看得更清楚
          answer: 1
        - sub_label: 2.找關鍵細節：哪些句子最能直接支持你選的重點？ (4選2)
          options:
            1: 臺灣位處地震帶與颱風路徑上，需要更快掌握災情
            2: 福衛八號有許多關鍵零件，由臺灣本土團隊研發製造
            3: 自1999年福衛一號起，二十多年累積，從仰賴他國走到自主製造
            4: 就像運動員磨練成國手，象徵每一步都在挑戰極限
          answers: [2, 3]
        - sub_label: 3.精簡成一句話，重點整合為摘要(2選1)
          options:
            1: 臺灣累積二十多年太空經驗，逐步提升衛星技術的自主能力。
            2: 臺灣關鍵零件自己研發，因此衛星資料一定最準也最完整
          answer: 1

    - type: sub_block
      label: （四）第8段〈齊柏林衛星守望臺灣〉
      items:
        - sub_label: 找重要細節：請寫出最能支持「齊柏林衛星守望臺灣」的句子
          value: 透過衛星影像，我們能更快速掌握災情、守護國土。
          answer_carrier: 橘色手寫（教師版示範答案），文字流有此資訊

    - type: sub_block
      label: （五）第9段〈守護家園，也有你一份〉
      items:
        - sub_label: 請先找出最能支持「守護家園，也有你一份」的關鍵細節，並精簡為一句話。（答案合理即可）
          value: 衛星為我們守望家園，你可以成為那個看見臺灣、珍惜臺灣的人。
          answer_carrier: 橘色手寫（教師版示範答案），文字流有此資訊

    - type: self_check
      label: ◎自我檢核
      items:
        - 我能確認這篇文章的「大主題的核心議題」是什麼。
        - 我能確認「小標題以下的重點」，並找到最能支撐小主題的「關鍵細節」、並精簡成一句話，將重點整合為摘要。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      reflection: ※如果你兩項都打勾，恭喜你，表示你已經學會用「大主題—小標題—關鍵細節」來抓說明文重點，先抓大方向，再抓段落重點與關鍵細節。

