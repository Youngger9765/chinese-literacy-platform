  target_words: [萬籟俱寂, 劃破, 縝密周延, 潰決, 仰人鼻息, 覆水難收, "麻雀雖小，五臟俱全", 一蹴可幾, 未雨綢繆, 休戚與共]
  grid_size: [10, 10]
