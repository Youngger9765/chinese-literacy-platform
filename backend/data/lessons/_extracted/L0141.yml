# ── 一 讀全文-做記號 ──
body:
  title_line: 第20課  臺灣的太空之眼
  byline: |-
    課文  ：林玫伶
    學習單：陳淑麗
  paragraph_count: 9
  paragraph_numbering_note: |-
    段號欄印 一~九 共 9 個。課文儲存格裡有 15 個區塊：**9 個散文段落**（＝這 9 個段號）
    ＋ **5 個不佔段號的小標題**（太空中的巡邏隊／沒有「重來」的按鈕／星光背後的二十年／
    齊柏林衛星守望臺灣／守護家園，也有你一份）。這五個小標題是本課聚光燈策略的主角
    （「從小標題找重要細節」），所以特別重要。

    ⚠️ **第 4 段在 XML 裡被拆成兩個 `<w:p>`**，切點在「等地表細節，｜簡直就是千里眼。」
    ——切在逗號之後、句子中間，是原稿為了分頁硬斷的。合併後才是 9 段。
    字數欄佐證：321（前半結束）與 329（後半結束）是相鄰的兩個數字，兩個都對得上。
    ⚠️ PDF 上段號欄整體下移（「五」印在第 4 段的最後一行「簡直就是千里眼。」旁邊），
    不要照「號碼旁邊那一行」對位。
  paragraphs:
    - idx: 1
      text: 2025年11月29日凌晨，當整座城市萬籟俱寂、沉入夢鄉時，位於新竹的國家太空中心（TASA）卻是一片緊張氣氛。工程師們緊盯螢幕上的數據，現場安靜得連心跳聲都聽得到。
    - idx: 2
      text: 凌晨2點44分，美國 加州傳來振奮的消息：SpaceX 的獵鷹9號火箭拖著長長的尾焰，載著「福衛八號」計畫的首顆衛星——「齊柏林」號，呼嘯著劃破天際。臺灣時間的清晨5點34分，當螢幕跳出它從外太空傳回的訊號時，現場情緒潰堤、掌聲如雷。
      footnote_ref: 1
      footnote_note: 註腳號印在「首顆衛星」後面（上標 1），註腳內容見 body.footnotes
    - idx: 3
      text: 福衛八號是一套由8顆光學遙測衛星組成的「衛星星系」，從2025年起逐年發射，到2031年全部就位，形成一套縝密周延的觀測系統。這些衛星會在地球上空約561公里的太陽同步軌道運行，彼此分工合作、相互接力，就像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區的上空拍攝。
    - idx: 4
      text: 它們的速度比子彈快，一秒鐘可以跑7.5公里，比方程式賽車快73倍，即使如此，仍需90到100分鐘才能繞過臺灣上空一次。只有一顆衛星時，如果發生重大災難（如2025年花蓮馬太鞍溪堰塞湖潰決造成光復鄉災情），要再次拍到同一地點，仍必須等待好一段時間；星系完成後，觀測間隔將大幅縮短，能更快取得影像。不僅如此，它們的「視力」也大幅提升，拍攝影像的解析度比以往的衛星更高，可以清楚看見災區地形、道路、建築、農田等地表細節，簡直就是千里眼。
      paragraph_note: |-
        ⚠️ 這一段在 `word/document.xml` 是**兩個 `<w:p>`**，切在「等地表細節，」與
        「簡直就是千里眼。」之間。合併成一段才對得上印出來的段號與字數欄（321／329）。
    - idx: 5
      text: 送衛星上天，是一場艱鉅的挑戰。在地球上，機器壞了可以維修；但在距離地面561公里的軌道上，一旦發生重大失誤，往往覆水難收。
    - idx: 6
      text: 太空環境非常嚴酷，衛星必須承受劇烈的溫度變化、強大的輻射、微小隕石的撞擊。因此，衛星在發射前，必須在地面經歷無數次的模擬測試。福衛八號雖然只有冰箱大小，但麻雀雖小，五臟俱全，內部塞滿了精密的相機和推進系統。每一個零件、每一道程序，都必須層層檢驗，才能把它送上太空。也正因為沒有重來的機會，每一次成功都需要長期累積。
    - idx: 7
      text: 最令人自豪的是，福衛八號有許多關鍵零件，是由臺灣本土團隊研發製造的，這代表臺灣在衛星關鍵技術上更加自主，不再完全仰人鼻息。臺灣的太空之路，絕非一蹴可幾，自1999年發射「福衛一號」開始，從仰賴他國到臺灣自製，從單顆衛星到衛星星系，二十多年的累積，每一步都在挑戰極限，就像一名運動員從初學者磨練成國手，最終在星空中刻下屬於臺灣的名字。臺灣位處地震帶與颱風路徑上，在許多科學家與工程團隊水滴石穿的努力之後，我們終於有了能夠守望家園、未雨綢繆的太空科技。
    - idx: 8
      text: 福衛八號首顆衛星的名字，是為了紀念已故的紀錄片導演齊柏林。齊導演生前透過空拍鏡頭，拍下了《看見台灣》。他讓我們看見阿里山的壯闊，也讓我們看見河流被染紅、山林被濫墾的傷痕。他曾說：「當你看見這片土地的美麗與哀愁，才能真正祝福她。」現在，齊導演雖然不在了，但這顆衛星繼承了他的眼睛，透過衛星影像，我們能更快速的掌握災情、守護國土，也讓齊導演的精神在500多公里的高空延續，守望這片我們熱愛的土地。
    - idx: 9
      text: 或許你會覺得外太空遙不可及，但請記得，這不是課本裡的冷冰冰的知識，而是與你我生活休戚與共的真實故事。當這八顆衛星全部就位，敏銳的「太空之眼」就會日夜在五百多公里的高空，為我們守望家園。你不一定要會設計衛星，但你可以成為那個「看見臺灣、珍惜臺灣」的人。
  inline_headings:
    - {after_paragraph: 2, text: 太空中的巡邏隊}
    - {after_paragraph: 4, text: 沒有「重來」的按鈕}
    - {after_paragraph: 6, text: 星光背後的二十年}
    - {after_paragraph: 7, text: 齊柏林衛星守望臺灣}
    - {after_paragraph: 8, text: 守護家園，也有你一份}
  inline_headings_note: |-
    五個小標題不佔段號，但**它們就是本課聚光燈要學生「從小標題找重要細節」的那些小標**，
    聚光燈逐一引用（第3~4段〈太空中的巡邏隊〉／第5～6段〈沒有「重來」的按鈕〉／
    第7段〈星光背後的二十年〉／第8段〈齊柏林衛星守望臺灣〉／第9段〈守護家園，也有你一份〉）
    —— 段落對應與本檔的段號完全一致，是段號對位的獨立佐證。
    ⚠️ 聚光燈與重點表引用小標時省略了引號（重點表寫「沒有重來的按鈕」、
    原文小標是「沒有『重來』的按鈕」），照各自原樣抄、不統一。
  footnotes:
    - index: 1
      text: 臺灣雖然可以自製衛星，但仍需向美國購買SpaceX的火箭服務，把衛星送上太空。
      attached_to_paragraph: 2
  inline_marked_terms: [萬籟俱寂, 劃破, 縝密周延, 潰決, 覆水難收, "麻雀雖小，五臟俱全", 仰人鼻息, 一蹴可幾, 未雨綢繆, 休戚與共]
  inline_marked_terms_note: |-
    課文裡被加了字元外框的語詞（PDF 上是方框），十個等於本課語詞。
    有底線的是專名（新竹／國家太空中心／美國／加州／獵鷹9號／臺灣／福衛八號／
    花蓮馬太鞍溪／福衛一號／齊柏林／阿里山），那是強調不是語詞標記。

