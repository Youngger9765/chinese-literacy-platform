    - {index: 3, word: 縝密周延, definition: 規劃非常嚴謹完整。}
    - {index: 4, word: 覆水難收, definition: 水倒在地上就收不回來，比喻事情一旦出錯，就很難挽回。}
    - {index: 5, word: "麻雀雖小，五臟俱全", definition: 俱全：全部都有。指地方或東西雖然小，但功能很完整。}
    - {index: 6, word: 一蹴可幾, definition: 一下子就能成功或達成。}
    - {index: 7, word: 仰人鼻息, definition: 比喻完全依賴別人，自己沒有主導權。}
    - {index: 8, word: 潰決, definition: 多指堤防出現破口，水一下子衝出來。}
    - {index: 9, word: 休戚與共, definition: 與共：一起分享、共同承擔。形容彼此的好事、壞事都連在一起，要一起承擔。}
    - {index: 10, word: 未雨綢繆, definition: 事情還沒發生前，先做好準備。}

