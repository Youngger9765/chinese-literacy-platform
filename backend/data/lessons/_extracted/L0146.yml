    - {index: 7, definition: 把話題拉回原來要談的重點。, answer: 言歸正傳}
    - {index: 8, definition: 內容很有吸引力，帶人走進美好的情境。, answer: 引人入勝}
    - {index: 9, definition: 像樹木長出新的枝葉，比喻家族或事物逐漸繁衍、擴展。, answer: 開枝散葉}
    - {index: 10, definition: 常常看到，已經覺得很平常、不奇怪。, answer: 司空見慣}
    - {index: 11, definition: 踵：腳後跟；「接踵而來」指的是前一人的腳後跟，接著下一個人的腳後跟。比喻事情一件接著一件發生，連續不斷的到來。, answer: 接踵而來}
    - {index: 12, definition: 比喻時間像水流一樣，不斷沖刷、篩選，造成了改變。, answer: 歲月淘洗}
    - {index: 13, definition: 形容想法非常自由、不受拘束，富有想像力。, answer: 天馬行空}
    - {index: 14, definition: 讓人越想越覺得有意思，值得細細品味、反覆思考。, answer: 耐人尋味}

