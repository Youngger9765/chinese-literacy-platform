# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略—從例子推論作者觀點
  blocks:
    - type: concept_box
      text: |-
        這篇課文的作者不是一開始就把他的觀點全部說清楚，而是先安排一連串吸引讀者注意的例子，讓讀者發現「不同地方的語言怎麼這麼像？」再一步一步推向作者想表達的觀點。所以，這一課你要練習的是：
        從文章反覆舉出的例子中，推論作者真正想表達的觀點。
        語言的足跡這篇文章，作者仍然是透過反覆的例子，來表達一個特定的想法。我們再練習一次，用❶～❸的步驟「推論（歸納）作者的觀點」。
        【❶找例子】
        【❷找共同點】
        【❸推論觀點】
      arrow_note: |-
        最後三行在原稿是印成**一行**：【❶找例子】→【❷找共同點】→【❸推論觀點】，
        兩個「→」是 `w:sym Wingdings F0E0` **符號**（沒有 w:t）。
        依 SKILL 規則，符號箭號前後斷行 → 拆成三行的流程步驟。
        ⚠️ 接成一句也會通過逐字門（符號不貢獻 w:t，兩半都在原稿裡），
        但那樣讀起來就不是「三個依序進行的步驟」了 —— 門綠不等於寫對。
    - type: guide
      text: |-
        一、步驟❶──找例子
        A.作者在文中舉了不少語詞例子。請勾選這些語詞「出現在哪些地區」，
        為下一步找出它們的共同點做準備。（複選）
    - type: fill_table
      columns: [語詞（作者舉的例子）, 出現地區（觀察分布）]
      rows:
        - 語詞（作者舉的例子）: 1.manga、 vanga（小船）
          出現地區（觀察分布）: [①臺灣, ②東南亞, ③南太平洋]
          出現地區（觀察分布）_answers: [1, 2, 3]
        - 語詞（作者舉的例子）: 2.mata（眼睛）
          出現地區（觀察分布）: [①臺灣, ②東南亞, ③南太平洋]
          出現地區（觀察分布）_answers: [1, 2, 3]
        - 語詞（作者舉的例子）: 3.ina / tina（母親）
          出現地區（觀察分布）: [①臺灣, ②東南亞, ③南太平洋]
          出現地區（觀察分布）_answers: [1, 2, 3]
        - 語詞（作者舉的例子）: 4.lima / nima / rima（五）
          出現地區（觀察分布）: [①臺灣, ②東南亞, ③南太平洋]
          出現地區（觀察分布）_answers: [1, 2, 3]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）—— 四列各三個全部勾選，共 12 個
      note: 四列的答案都是「三個都勾」，這是原稿印的，不是抄錯
    - type: multi
      prompt: B.第五段用來說明「音變很常見」的兩個生活例子（請打勾，三選二）
      options:
        1: 那個→辣個
        2: 很熱→很樂
        3: 很冷→很勒
      answers: [1, 2]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）×2
      arrow_note: 這三個選項裡的「→」是**字面**字元（U+2192），在句內、不斷行
    - type: guide
      text: ➡小祕訣：看到「例如、就像、亦然」常常就是例子要出現了。
      arrow_note: 行首的「➡」是字面 U+27A1 BLACK RIGHTWARDS ARROW，不是 w:sym
    - type: single
      prompt: |-
        二、步驟❷──找這些例子的共同點：
        作者想讓我們注意到這些例子什麼共同點？（請勾選，單選）
      options:
        1: 南島語族分布在不同地區，卻出現相似發音的詞彙
        2: 例子顯示語言會一直改變，無法留下任何線索
        3: 例子來自不同語言，所以彼此沒有關聯
      answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: single
      prompt: 三、步驟❸──推論作者觀點
      options:
        1: 萬華地名的重點，在於日治時期的改名過程。
        2: 南島語族雖分散在各地島嶼，卻保留部分相似語彙，這些語言線索可推知他們可能有共同祖語、共同來源。
        3: 不同島嶼的語言之所以相似，是因為有人刻意在各島推行同一套語言。
        4: 語言會隨時間改變，因此難以用來追查來源與歷史。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出文章中作者反覆舉出的例子。
        - 2.我能把這些例子合起來看，找出它們的共同點。
        - 3.我能根據例子與共同點，推論出作者想表達的觀點。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三個□都沒有勾選
    - type: guide
      text: |-
        ※如果你三項都打勾，恭喜你，
        表示你已經學會用 3 步驟「從例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！

# ── 六 文章重點表 ──
keypoints:
  title: 語言的足跡：從臺北 萬華到南太平洋的航海之路
  layout: list
  answer_carrier: 橘色填在【　】內；**顏色來自字元樣式 af，run 層沒有 w:color**
  rows:
    - label: 萬華地名典故
      value: 「萬華」這個地名，來自原住民語 manga，原本是指【　】
      blanks: [{answer: 小船／獨木舟}]
    - label: 擴大觀察
      value: 不只臺北，【　】　與 【　】等地，也以manga（或vanga）指稱小船或獨木舟。人類學家把這些使用相似語言的族群稱為【　】。
      blanks: [{answer: 東南亞}, {answer: 南太平洋}, {answer: 南島語族}]
    - label: 更多例子
      items:
        - label: '1'
          value: 南島語族共享許多相似語彙，例如眼睛稱 mata，母親稱 ina（或 tina），數字「５」稱 lima（或 nima／rima）
        - label: '2'
          value: 語言在傳遞過程中會產生【　】，這是一種自然現象。
          blanks: [{answer: 音變}]
    - label: 疑問與解釋
      items:
        - label: '1'
          value: 1.南島語族彼此相隔很遠，怎麼可能使用相似語言？
        - label: '2'
          value: 2.科學界的解釋：他們曾有【　】，並透過航海逐步【　】、拓展至各島嶼。
          blanks: [{answer: 共同祖先}, {answer: 遷徙}]
    - label: 結尾
      value: 語言是一條【　】，語言能保存族群【　】與【　】 的歷史。
      blanks: [{answer: 跨越千年的足跡}, {answer: 遷徙}, {answer: 交流、生活}]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  option_key_note: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af）
  answers_printed: true
  items:
    - index: 1
      stem: 請問下列語詞，何者使用錯誤？
      stem_note: 「錯誤」二字在原稿加了底線
      options:
        A: 這條馬路又直又長，一直通向遠方，看起來「如出一轍」
        B: 這本書用故事開場的方式講解歷史，內容「引人入勝」
        C: 他長年救災，面對災難事件早已「司空見慣」，仍能冷靜處理
        D: 這位設計師的想法「天馬行空」，創意常讓人眼睛為之一亮
      answer: A
      teacher_note: 第1題解析：選項A句子雖提到「幾乎一樣」，但實際只是在描述同一條路的樣子，不是比較「兩個不同事物」，成語誤用。
      teacher_note_carrier: 藍框浮動文字方塊，印在該題右側（在文字層）
    - index: 2
      stem: 作者說語言「即使過了數百年歲月的淘洗，發音已經略有改變，仍可溯源」，最接近的意思是什麼？
      options:
        A: 語言一旦發音改變，就很難再追查到更早的來源
        B: 語言隨著時間推移會逐漸消失，因此不具研究價值
        C: 語言即使發音改變，仍可能追查到更早的來源與根源
        D: 語言隨時間改變的只有發音，原本的語意一定不會改變
      answer: C
    - index: 3
      stem: 文中舉「那個→辣個」、「很熱→很樂」的例子，是用來說明什麼？
      stem_arrow_note: 題幹裡的兩個「→」是字面字元（U+2192），照原樣留在句內
      options:
        A: 臺灣人說話咬字不清楚
        B: 語言會自然演化、產生音變
        C: 南島語族之間的語言完全相同
        D: 年輕人喜歡創造新詞
      answer: B
      teacher_note: 第3題解析：作者用生活例子說明語言在傳遞過程中會自然變化，呼應南島語族語言的音變現象。
      teacher_note_carrier: 藍框浮動文字方塊，印在該題右側（在文字層）
      note: 原稿 B、C 兩個選項印在同一個段落裡，中間用換行分開
    - index: 4
      stem: 根據〈語言的足跡〉這篇文章的寫法，下列哪一項最符合作者表達觀點的方式？
      options:
        A: 先直接說出結論，再舉幾個例子加以說明
        B: 先介紹背景知識，最後用數據證明自己的看法
        C: 先提出許多具體例子，讓讀者從中推論作者的觀點
        D: 透過人物對話與情節發展，引導讀者感受情緒變化
      answer: C
    - index: 5
      stem: 這篇文章最主要如何吸引讀者，並推進作者想表達的觀點？
      options:
        A: 從萬華地名的溯源切入，讓讀者了解當地原住民與漢人的互動
        B: 透過跨島語族詞彙的相似性引起驚奇，再說明其背後的觀點
        C: 詳細介紹南島語族的分布範圍，讓讀者認識其活動區域之廣
        D: 運用專業的語言學知識與研究成果，提高文章的學術深度
      answer: B

