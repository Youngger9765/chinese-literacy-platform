# ── 課文（印在「一 閱讀聚光燈」標頭底下，無獨立大題編號）────────────────
body:
  lesson_heading: 第9課  帶著「血拼清單」閱讀
  課文作者: 曾世杰
  學習單: 陳淑麗
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: 上街買東西，英文叫shopping，它戲謔的譯名叫「血拼」。有「萬頭鑽動，一群人流『血』流汗，『拼』死搶貨」的意思，譯名和原文的發音相近、意象鮮明。但這篇課文重點其實不是血拼，而是藉著「血拼」這個意象鮮明的概念，來講一個重要的閱讀策略——帶著問題閱讀。
    - idx: 2
      text: 血拼有兩種，一種稱為「逛街」，另一種稱為「採買」。
    - idx: 3
      text: 如果你上街的目的是殺時間，並沒有什麼特別想買的東西。你走到哪裡，看到哪裡，這邊翻一翻換季服飾，那邊看一看手機配件。逛一個下午，也許滿載而歸，也許一樣都沒買，這就是「逛街」了。
    - idx: 4
      text: 「採買」就不同了，它有清楚的目的性。上街前你會先列一張血拼清單，拿筆寫下每一項需要的東西，例如，要去超市買雞蛋、牛奶、紅豆麵包，再去郵局買郵票。採買回來，你清清楚楚知道，清單上的項目是否買齊了。
    - idx: 5
      text: 閱讀也有兩種，一種是「篇章瀏覽」，另一種則是「帶著問題閱讀」。
    - idx: 6
      text: 大多數人早上打開手機，點進常用的社群媒體時，只是在「逛街」，這裡讀一點偶像新聞，那裡看一下職棒賽況，這樣的閱讀沒有特定的目的，只是走馬看花的「篇章瀏覽」。
    - idx: 7
      text: 但，如果你是為了週末要去平溪放天燈而上網的，你上網前，心中就會有清楚的待答問題，天氣如何？怎麼搭車？幾點要到？附近有什麼著名小吃？……這樣的閱讀就是「帶著問題閱讀」。
    - idx: 8
      text: 對國中生特別重要的是，「帶著問題閱讀」可以幫助你在國文閱讀理解的考試時，幫你快速找到重點、解決問題哦。
  underlined_terms: [平溪]
  inline_marked_terms: []
  inline_marked_terms_note: |-
    課文裡**沒有**加框的語詞（`w:bdr` 非 auto 的 6 段全在聚光燈的練習2、練習3 裡）。
    這與總表「語詞1 = 無」一致 —— 這課沒有語詞單元。
  paragraph_numbering_note: |-
    段號欄印的是「ㄧ二三四五六七八」，其中第一個是注音符號 `ㄧ`（U+3123）不是漢字「一」，
    原稿如此（全庫常見）。本檔的 idx 用阿拉伯數字，對應關係 ㄧ=1 … 八=8。

# ── 一 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 解題策略—帶著問題閱讀
  strategy_type: reading_strategy
  _practises: 會考國文題目（110-5／110-3／111-3／114-27）＋ 5 題自我練習
  answer_carrier: |-
    三種載體都有：
    ① 紅色 ☑（w:sym Wingdings F0FE ＋ w:color FF0000）19 個
    ② 橘色字元框線（w:bdr FF3300／E1721F）6 段 —— 「請圈出」類題目的答案
    ③ 橘色手寫填空與括號內代號（文字流有此資訊）
  blocks:
    # ── 示範1 ────────────────────────────────────────────
    - type: guide
      text: 示範１：來看一個例子（110年會考國文第５題；110-5）
    - type: passage
      label: 110年會考國文第5題
      paragraphs:
        - 5.「山田汽車成立於西元1916年。高橋汽車在山田汽車成立100週年時發表一段賀詞：『感謝100年來的競爭，沒有你的那30年有點孤獨。』」根據這段文字，高橋汽車最可能成立於西元哪一年？
        - (A)1816　 (B)1846　 (C)1886　 (D)1946
      note: |-
        圓角外框內的題目。PDF p2 上「高橋汽車最可能成立於西元哪一年?」外面另加一個橘色方框
        （圖形層的 rect），示範「圈題目問句」這個動作；被圈的文字本身在文字層裡，已照錄。
    - type: guide
      text: 1.沒有策略的閱讀 vs 帶著問題的閱讀
    - type: guide
      text: 我們先來看兩種不同閱讀策略的差異：
    - type: table
      columns: [A.沒有策略的閱讀, B.帶著問題的閱讀]
      rows:
        - A.沒有策略的閱讀: |-
            很多同學可能這樣讀：從「山田汽車……」一路讀到最後一句「……成立於西元哪一年?」才發現題目到底要你做什麼?
            但你還沒看見問句前，你其實不知道自己要找什麼，你的閱讀是目的不清楚，只是在逛街，一直讀到最後一句，才知道哪裡是必須細讀的重點。
          B.帶著問題的閱讀: 如果你先讀最後一句——「高橋汽車……成立於西元哪一年？」情況就不同了。你馬上知道這題要問什麼，這時再回頭去讀題幹的文字，你會更容易抓到重點——年代。
    - type: guide
      text: |-
        所以，考試作答是有方法的喔，這一課我們要來學解題3步驟:
        ❶問什麼→❷帶著問題閱讀→❸確定答案
      source_text: |-
        所以，考試作答是有方法的喔，這一課我們要來學解題3步驟:
        ❶問什麼❷帶著問題閱讀❸確定答案
      note: |-
        紙上印的兩個「→」是 `<w:sym w:font="Wingdings" w:char="F0E0"/>`（Wingdings 右箭頭），
        **不在 w:t 文字流裡**，所以逐字門比的是 `source_text`（文字層原樣，沒有箭頭），
        `text` 保留印出來的樣子。箭頭是排版符號，不是答案符號。
    - type: guide
      text: 2.解題步驟：
    - type: sub_block
      label: ❶問什麼：圈題目問句
      items:
        - label: 問題是──高橋汽車最可能成立於西元哪一年?
        - label: 關鍵訊息是──年代
      note: 兩行都是印好的示範答案（教材直接寫出來），不是留白讓學生填
    - type: sub_block
      label: ❷帶著問題閱讀，❸確定答案
      items:
        - value: 從題幹可知，山田已經100週年了，而高橋說「沒有你的那30年有點孤獨」，換句話說，高橋成立30年後，山田才成立。因為山田是1916年成立的，再往前推30年，答案就是(C)1886年。
    - type: guide
      text: 你發現了嗎？這題的解題過程，你必須先問自己「這題在問什麼？」，然後再進行「帶著問題閱讀」哦。

    # ── 練習1（110-3）────────────────────────────────────
    - type: guide
      text: 練習1：讓我們再練習用相同的步驟來做另一題（110-3），看看「帶著問題閱讀」的效果。
    - type: passage
      label: 110年會考國文第3題
      paragraphs:
        - 3.這是某相機使用說明書的一部分：
        - 對於以下主體，可能無法成功自動對焦：
        - 與背景色彩相近的主體
        - 自動對焦點同時覆蓋遠近主體
        - 重複的圖案
        - 根據以上說明，這臺相機在相同的設定下，下列哪一個景物最容易自動對焦？
        - (A)雪地上的雪人　         (B)欄杆後的盆栽　
        - (C)沙漠中的綠色仙人掌　   (D)花色相同的馬賽克磁磚
      note: |-
        圓角外框內的題目。「下列哪一個景物最容易自動對焦」外面另加一個橘色方框（圖形層 rect），
        示範「圈題目問句」；被圈文字在文字層裡。
    - type: figure
      referent: image
      note: |-
        四張黑白線稿景物圖橫排，下方各標 (A)(B)(C)(D)：
        (A) 雪地上的雪人　(B) 欄杆後的盆栽　(C) 沙漠中的仙人掌　(D) 馬賽克磁磚。
        圖上沒有文字（選項文字在文字層，見上一個 passage），所以沒有要轉錄的字。
      placement_note: 印在題目框內、選項文字上方（PDF p3）
    - type: guide
      text: ❶問什麼：圈題目問句
    - type: single
      prompt: (1)題目「問什麼」(單選)：
      options:
        1: 最容易自動對焦
        2: 哪一個景物
      answer: 1
    - type: guide
      text: 你發現了嗎？讀了圈起來的文字之後，看到底下4張景物，你馬上就知道，題目要你找出「最容易自動對焦」的那個圖。
    - type: guide
      text: ❷帶著問題閱讀
    - type: single
      prompt: (1)帶著「哪一個景物最容易自動對焦？」的問題，去讀說明書裡三個黑點後的文字。關鍵訊息是：(單選)
      options:
        1: 無法成功自動對焦的三個情況
        2: 能自動對焦的三個情況
      answer: 1
    - type: sub_block
      label: (2)讀一項文字後，立刻判斷符合底下哪一個圖（符合就排除）(單選)
      columns: ["說明書說明：", 符合哪個圖（符合就排除）]
      items:
        - type: single
          prompt: 與背景色彩相近的主體
          options: {A: A, B: B, C: C, D: D}
          answer: A
        - type: single
          prompt: 自動對焦點同時覆蓋遠近
          options: {A: A, B: B, C: C, D: D}
          answer: B
          note: |-
            這一列的說明書文字原稿印到「遠近」為止（比題目框內的「自動對焦點同時覆蓋遠近主體」
            少一個「主體」）。文字層與 PDF p4 一致，照原樣抄，不補字。
        - type: single
          prompt: 重複的圖案
          options: {A: A, B: B, C: C, D: D}
          answer: D
    - type: guide
      text: ❸確定答案
    - type: single
