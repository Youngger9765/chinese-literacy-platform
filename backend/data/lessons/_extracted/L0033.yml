# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略──刪除法找重點：刪除舉例
  strategy_type: summarize
  blocks:
    - type: concept_box
      text: |-
        本課是一篇說明文。為了幫助讀者理解，作者常會加入許多細節，例如具體的事物或生活情境。不過，做摘要時，不必把所有細節都留下。
        舉例是常見的補充細節。我們可以運用「刪除法」，刪除舉例的文字，讓段落重點更清楚。
        作者舉例時，常會使用「例如」、「如」、「舉例來說」或「像」等提示詞。
        刪除舉例兩個步驟：
        ❶找出並刪除舉例
        找出提示詞後面的具體例子，用筆劃掉。刪除後多餘的標點，也要一起刪除。
        ❷檢查刪除後的文字
        讀一讀沒有劃掉的文字，確認：
        □①句子完整、通順。
        □②原文最重要的意思仍然保留。
        先看一個例子：請閱讀下面的文字

    # ── 示範例 ──
    - type: sub_block
      label: 先看一個例子
      items:
        - type: passage
          paragraphs:
            - 臺東有名的風景區，如鹿野高台、池上伯朗大道等，每到假日都吸引許多遊客。
        - type: guide
          text: |-
            ❶找出並刪除舉例：
            可以刪除「如」後面的文字，「鹿野高台、池上伯朗大道」都是臺東著名景點的具體例子，可以刪除。
        - type: free_text
          prompt: ❷檢查刪除後的文字（打勾）
          # 這一句的刪除線是**字元格式**（document.xml 的 <w:strike/>），不是畫上去的
          delete_spans: [如, 鹿野高台, '、', 池上伯朗大道, 等, '，']
          delete_carrier: 字元刪除線（w:strike），文字流查得到
          result: 臺東有許多著名景點，每到假日都吸引許多遊客。
        - type: self_check
          items:
            - ①句子完整、通順。
            - ②原文最重要的意思仍然保留。
          checked: [1, 2]
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: guide
          text: 你發現了嗎，刪掉景點名稱後，我們仍然知道：臺東有許多著名景點，能吸引遊客。

