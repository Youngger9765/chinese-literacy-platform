# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；只有第 2、3 題有
  questions:
    - index: 1
      answer: A
      stem: 文中第三段提到「資源僧多粥少」，根據上下文，「僧多粥少」最可能的意思是：
      options:
        A: 投入救援的資源遠不及白鯨龐大的需求，顯得非常不足
        B: 救援人員人數眾多，救援的物資不夠村民和船員使用
        C: 救援人員人數眾多，但實際受困的白鯨數量卻很少
        D: 雖投入不少資源，但救援工作幾乎沒有成果，徒勞無功
    - index: 2
      answer: C
      stem: 文章描述白鯨初見破冰船「又驚又怕，根本不敢靠近」。造成牠們恐懼的原因可能是？
      options:
        A: 破冰船攜帶的燈光
        B: 船體顏色過於鮮豔
        C: 龐大的外形、黑煙與噪音
        D: 船員朝海面投擲魚餌
      teacher_hint: 破冰船「冒著黑煙、又會發出噪音的大怪獸」
    - index: 3
      answer: B
      stem: 根據第六段，古典音樂在救援中發揮了什麼作用？
      options:
        A: 讓白鯨不再害怕破冰船，主動游到船的旁邊
        B: 讓原本害怕的白鯨開始游動，沿著水道前進
        C: 讓白鯨恢復體力，不再需要村民繼續餵食
        D: 讓白鯨誤以為同伴在前方，因此跟著叫聲前進
      teacher_hint: 第六段明白寫出，白鯨聽到古典音樂後開始緩緩游動，沿著水道前進，因此選B
    - index: 4
      answer: D
      stem: 作者以「協奏曲」作為副標題，主要想凸顯這場救援的哪一項特色？
      options:
        A: 破冰船發出轟隆聲響，像多種樂器同時演奏
        B: 船員播放古典音樂，使救援過程充滿藝術氣息
        C: 白鯨能欣賞優美旋律，與人類有相同音樂喜好
        D: 不同的人與方法接力配合，共同完成白鯨救援
    - index: 5
      answer: A
      stem: 本文最想傳達的觀點是什麼？
      options:
        A: 面對其他生命時，關懷、理解與創意可能創造新的希望
        B: 面對極地災難時，只有大型機械才能有效完成救援任務
        C: 野生動物容易受到環境威脅，人類應避免接近牠們
        D: 古典音樂能安撫各種動物，可以廣泛運用在救援行動中

