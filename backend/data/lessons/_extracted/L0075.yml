    - {index: 1, word: 束手無策, definition: 束手是「手被綁起來」，無策是「沒有辦法」。束手無策是形容完全沒有辦法解決問題。}
    - {index: 2, word: 翻騰, definition: 形容水、浪等劇烈地上下滾動；也可比喻情緒起伏很大、難以平靜。本課用來形容海水翻動。}
    - {index: 3, word: 屏氣凝神, definition: 屏住呼吸，集中精神，形容非常專注的樣子。}
    - {index: 4, word: 凜冽, definition: 形容天氣非常寒冷。}
    - {index: 5, word: 筋疲力竭, definition: 形容非常疲累，一點力氣也沒有了。}
    - {index: 6, word: 僧多粥少, definition: 比喻資源有限，需求的人太多，無法滿足每個人。}
    - {index: 7, word: 窒息, definition: 無法呼吸；也可比喻感到非常壓迫，像喘不過氣來。}
    - {index: 8, word: 緩不濟急, definition: 行動太慢，無法應付迫切的需要。}
    - {index: 9, word: 徒勞無功, definition: 努力想做某件事，卻沒達成目標，白費力氣。}

