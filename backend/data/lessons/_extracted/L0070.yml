  blocks:
    - type: concept_box
      text: |-
        ◎策略說明：
        本課介紹了文章中的「關鍵少數」：
        1.文章或段落的開頭、結尾
        2.結論詞及後面的文句
        這些位置常藏有重要線索。當「選項剩下二選一」，或「作答時間不夠」時，可以幫助我們快速掌握文章或段落的重點。

    - type: guide
      text: 策略：❶讀題幹與選項　❷比選項　❸看頭尾　❹找結論詞　❺綜合判斷

    - type: guide
      text: ◎小試身手：讓我們先來讀讀以下的文章，並依照狀況與策略找出答案。

    # ── 小試身手 · 狀況一 ──
    - type: guide
      text: 狀況一：選項剩下二選一

    - type: passage
      paragraphs:
        - 手機通知看似只占幾秒鐘，卻可能用不同方式打斷我們的學習。當訊息聲響起時，有些人會立刻拿起手機，原本正在思考的內容便被中斷。即使忍住不看，也可能一直猜想「是不是有人找我」，注意力因而分散。看完訊息後，還可能順手點進影片或社群網站，過了很久才發現自己忘了回到功課。長期下來，作業時間不但變長，也更容易漏掉重要細節。由此可見，通知的影響不只是花掉幾秒鐘，更可能打斷思考、分散注意力，甚至改變原本的學習安排。因此，讀書時暫時關閉通知，是保護專注力的一種方法。

    - type: guide
      text: ❶讀題幹與選項

    - type: single
      prompt: 根據本文，作者最可能贊成下列哪一種做法？
      options:
        A: 讀書時先關閉手機通知，減少注意力被打斷
        B: 查看通知後立即回到功課，就不會影響學習
      answer: A
      answer_note: 這一題的答案不是以 ☑ 標在選項旁，而是印在 ❺「因此與選項【 A 】相符」。

    - type: guide
      text: ❷比選項

    - type: free_text
      prompt: |-
        選項A：讀書先【　】手機通知
        選項B：先看通知後立即回到功課
        關鍵差異是：「做法」不同。
      blanks:
        - {answer: 關閉}

    - type: guide
      text: ❸看頭尾：本文只有一段，因此閱讀段落的頭尾句。

    - type: single
      prompt: 1.開頭句重點：（　）會打斷學習。
      options:
        1: 影片
        2: 手機通知
      answer: 2

    - type: single
      prompt: 2.結尾句重點：因此，讀書時應該暫時（　）手機通知。
      options:
        1: 關閉
        2: 查看
      answer: 1

    - type: guide
      text: ❹找結論詞

    - type: free_text
      prompt: |-
        結尾有兩個結論詞：
        1.【　】後面統整手機通知帶來的影響。
        2.【　】後面提出讀書時暫時關閉通知的建議。
      blanks:
        - {answer: 由此可見}
        - {answer: 因此}

    - type: single
      prompt: 題目問的是作者贊成哪種「做法」，所以最需要注意的是哪一個結論詞後面的文句？
      options:
        1: 由此可見
        2: 因此。
      answer: 2

    - type: guide
      text: ❺綜合判斷：

    - type: free_text
      prompt: 開頭句指出，手機通知會打斷學習；結尾句又建議讀書時暫時關閉通知，因此與選項【　】相符。
      blanks:
        - {answer: A}

    - type: guide
      text: →你有沒有發現，回答這個問題，掌握結尾，就可能選對答案了！

    # ── 小試身手 · 狀況二 ──
    - type: guide
      text: 狀況二：時間不足時

    - type: passage
      paragraphs:
        - 爺爺以前最喜歡坐在陽臺的藤椅上。每天放學回家，我總會看見他戴著老花眼鏡讀報紙，旁邊還放著一杯熱茶。爺爺住院後，那張藤椅便空了下來。起初，我沒有特別在意，照樣回房間寫功課、玩手機。直到有一天，我考了一百分，興沖沖跑到陽臺，正想把考卷拿給爺爺看，才突然停下腳步。風吹動椅背上的舊毛巾，像是有人剛剛離開。我把考卷放在藤椅上，小聲說：「爺爺，我這次考得不錯喔。」原來，有些思念平常安安靜靜，直到你習慣找的那個人不在了，才會忽然湧上心頭。

    - type: guide
      text: ❶讀題幹與選項

    - type: single
      prompt: 1.下列何者最能表達本文主要呈現的情感？
      options:
        A: 因為考了一百分，而感到十分得意
        B: 看見空著的藤椅，才察覺自己思念爺爺
