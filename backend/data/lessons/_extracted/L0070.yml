body:
  printed_title: 第3課　掌握解題的「關鍵少數」
  byline: 課文/學習單：張筱晴
  level_label: Level 6・說明文
  target_strategy_label: 目標策略：解題策略──看頭尾、找結論線索
  placement_note: |-
    課文表格直接排在「一 閱讀聚光燈」標頭下方，本課沒有獨立的「讀全文-做記號」大題，
    也沒有該大題慣有的「※如果你有做到下列事項，請在□內打勾」核取清單。
  paragraph_count: 9
  paragraphs:
    - idx: 1
      text: 「又來了！二選一難題！」教室很安靜，只聽得到翻考卷和寫字的聲音，大家都埋頭努力著，阿光也是。看著眼前的閱讀題，好不容易刪掉錯誤的選項，卻還剩兩個，心裡有點著急。「上次我在兩個答案間改來改去，最後反而選錯。到底怎樣才會選對啊？」阿光的手在頭上抓了又抓。
    - idx: 2
      text: 教室的另一端是佑佑，眼看考試時間只剩下五分鐘，他卻還有三組閱讀測驗沒寫。「死定了，根本來不及寫完，只能瞎猜了嗎？」佑佑心裡十分著急，但越慌張反而越難專心閱讀。「啊，還是算了，不要亂猜。能寫多少算多少，搞不好還能答對。」佑佑一邊努力保持專注，一邊掙扎著。
    - idx: 3
      text: 如果你是阿光和佑佑，你會選擇怎麼做呢？有的人可能乾脆擲橡皮擦決定，也有的人會回頭計算哪個選項出現最少，又或者你也可能聽說「猜C答對的機率最高」？這些方法或許都有機會猜中，不過，與其只靠運氣，其實可以運用解題方法，從文章中尋找線索，讓猜測不再只靠運氣。
    - idx: 4
      text: 經濟學家曾提出被稱為「二八法則」的觀察，提醒我們：有時候少數關鍵因素可能帶來大部分的影響，像是：衣櫃裡二成的衣物，就足夠讓你應付八成場合的穿著；圖書館裡二成的藏書，就可以滿足八成讀者的需求。當然這裡的「二」和「八」也可能是個比喻，而不是固定比例。文章也是如此，多數的重點可能集中在少數幾個位置。但你可能會想問，那會在哪裡呢？答案是文章或段落的開頭與結尾。
    - idx: 5
      text: 因此，當你做題目，遇到不得不求助幸運女神時，請將注意力放在最可能藏有重要線索的地方：先看文章的開頭，再看文章的結尾。
    - idx: 6
      text: 一篇文章中，作者常會在開頭提出主題、交代問題或介紹背景；到了結尾，則可能整理結果、表達感想、提出建議，或點出最想傳達的觀點。因此，開頭和結尾往往藏著重要線索。雖然重要訊息不一定都出現在頭尾，但當時間有限時，優先查看這兩個地方，通常比隨意猜測更有根據。
    - idx: 7
      text: 除了開頭和結尾，文章中還有一種重要線索──結論詞，像是「所以」、「因此」、「總之」、「可見」、「由此可知」等詞語，就像作者舉起一面小旗子，提醒讀者：「注意！注意！接下來我要統整說過的內容，或提出結論了。」
    - idx: 8
      text: 下次遇到二選一的難題時，可以先比較兩個選項有什麼不同，再回到文章的開頭、結尾和結論詞附近找線索，看看哪一個選項更符合文意。而如果考試時間快到了，來不及把全文慢慢讀完，也可以先快速掃描文章的開頭和結尾，並留意出現結論詞的文句。這些位置不一定直接寫出答案，卻能幫助你在有限的時間裡，更快掌握文章的主題和結論唷！
    - idx: 9
      text: 不過，要記得，看頭尾、找結論線索是解題時的急救方法，不能代替完整閱讀全文。時間足夠時，還是要仔細讀完文章，真的來不及，再把握「看頭尾、找結論線索」的原則，讓每一次選擇都有文章線索可以支持。接下來，就讓我們一起練習，看看這個方法可以怎麼幫助我們解題吧！
  running_char_counts: []
  char_count_note: 本課課文右緣**沒有字數欄**（表格只有段號、課文兩欄），與沒有念順順一致。
  underlined_terms: [阿光, 佑佑]
  underlined_terms_note: 課文只有人名加底線（`w:u`），沒有任何加方框的語詞（全文 `w:bdr` 只有狀況二那三個橘框）。

# ── 一 閱讀聚光燈 ──
