# ── 古文今譯（無大題編號）──
modern_translation:
  section_name: 古文今譯
  paragraphs:
    - 明朝有位叫陸盧峰的人，在京城等待朝廷的任用。他曾在市集上見到一塊上好的硯臺，可是議價沒有成功。回到官邸之後，他還是派僕人前往，用一兩銀子買硯臺回來。
    - 僕人拿著硯臺回來，陸公驚訝它不像自己想買的那個，僕人卻堅持說它就是。陸公說：「剛才我看的硯臺有個八哥眼，現在為何沒有了？」僕人回答說：「我嫌棄它有點凸，路上正好遇見石工，幸好有剩餘的銀子，就叫他打磨讓微凸的地方平整了。」陸公感到十分可惜。

# ── 故事賞析（無大題編號）──
intro_guide:
  section_name: 故事賞析
  paragraphs:
    - 好的故事都會有它吸引人的「賣點」，如有趣的地方、出人意料之外的轉折、發人深省的啟示等，這篇文章也不例外。
    - 　　硯臺是古代的讀書人每日用品，這位陸先生在市場上看到一方好硯，非常喜歡，但因價錢談不攏，沒有買成。但他回家後，念念不忘，最後終於叫來僕人，給他錢，叫他去買硯。
    - 　　故事到這裡，作者告訴你兩件事：1、陸先生有多麼喜歡這方硯臺；2、它的價錢貴到讓陸先生猶豫再三。
    - 　　再來是故事的轉折。
    - 　　僕人買硯回來了，陸先生一看就說：「它不像我想買的那個硯啊！我要買那個硯有個漂亮的八哥眼喔！」僕人這時卻答道：「我覺得那個突起不好看，就請石匠把它磨掉了。」陸先生花了一大筆錢買硯，結果不識貨的僕人出自好心，竟把主人最喜愛的部分破壞掉了。
  layout_note: |-
    「故事賞析」四個字是標題文字方塊，內容印在一個圓角外框裡。
    ⚠️ 這一節在 L0155 叫「導讀」、內容是一段；本課叫「故事賞析」、內容是五段，
    功能相同（讀前導引），故同樣走 intro_guide 模組。

# ── 原文（無大題編號）──
classical_text:
  source_label: 明朝・馮夢龍
  punctuation_note: |-
    原文的「.」是學習單印的**斷詞記號**（朗讀說明第 2 條明寫），不是句號。
    「還／一／不」等字在文字層夾了隱藏 variation selector（U+E01Ex），比對前濾掉 Cf/Mn。
  paragraphs:
    - 明.有陸盧峰者，於京城.待用。嘗於市.遇一佳硯，議價.未定。既還邸，使門人.往，以一金.易歸。
    - 門人.持硯歸，公.訝其不類，門人.堅稱其是。公曰：「向觀硯.有鴝鵒眼，今何.無之？」答曰：「吾.嫌其微凸，路值.石工，幸有.餘銀，令.磨而平之。」公.大惋惜。
  annotations_label: 注釋
  annotations:
    - {index: 1, term: 鴝鵒眼, text: 一種硯石。這種硯石上有圓點形狀的花紋，就像是鴝鵒鳥的眼睛，所以叫「鴝鵒眼」。}
  qr_note: 「明朝・馮夢龍」那一格右側印了一個 QR code

# ── 朗讀計時（無大題編號）──
