# ── 三 文章重點表 ──
keypoints:
  title: 陸公買硯
  layout: matrix
  columns: [元素, 內容簡述]
  intro: |-
    本課課文是明朝作家馮夢龍所寫的短篇筆記小說。
    很明顯，它是一個「故事」，所以我們仍要運用「故事結構」的概念，來閱讀並理解故事哦！
    現在，請利用故事結構，配合課文內容，在下表的【 】處填入原文，找不到原文時，再用自己的話寫。
  answer_carrier: 橘色手寫（字元樣式 aff），文字流有此資訊
  rows:
    - 元素: 背景
      內容簡述: 明朝人【　】。
      內容簡述_blanks:
        - {answer: 陸盧峰}
    - 元素: 起因
      內容簡述: 陸盧峰在市集看上一塊【　】，當下沒有買，後來後悔了。
      內容簡述_blanks:
        - {answer: 佳硯/硯臺}
    - 元素: 經過
      內容簡述: |-
        1.派僕人用【　】銀子買回來。
        2.僕人買回來的硯臺，跟他想買的【　】。
        3.陸盧峰問硯臺怎麼沒有【　】，原來僕人請【　】把微凸的地方磨平了。
      內容簡述_blanks:
        - {answer: 一金/一兩}
        - {answer: 不類/不像}
        - {answer: 鴝鵒眼/八哥眼}
        - {answer: 石工/石匠}
    - 元素: 結果
      內容簡述: 陸盧峰感到十分可惜。
      內容簡述_note: 這一列沒有空格，是印好的黑字

# ── 四 文言文聚光燈 ──
spotlight:
  strategy_name: 斷句及判讀主語II
  strategy_type: classical_grammar
  section_title_printed: 文言文聚光燈
  answer_carrier: |-
    橘色手寫（字元樣式 aff）＋ **紅筆斷句「/」與圈補主語的紅框**（19 個紅色圖形）
    ＋ 綠色螢光標示（動詞／形容詞）。紅筆與螢光都是圖形，主語文字本身在文字層。
  blocks:
    - type: concept_box
      text: |-
        在「不量田」一課，我們學習如何判讀主語、補主語。現在，我們要在這基礎上再學一點小技巧——斷句。
        想想：一大塊食物沒辦法一口吞下，我們會怎麼做呢？拿刀切一小塊一小塊吃，是不是容易多了；長一點的文章也是這樣，我們可以利用斷句將一大段的文字變成一句句，這樣就「好讀」多了？

    - type: guide
      text: 一、斷句的具體作法
    - type: concept_box
      text: 看到句號。或問號？，就在後面畫「/」，表示斷句的地方
      text_note: 印在一個虛線框裡；「句號」「問號」「畫「/」」三處是**白字黑底**（反白）
    - type: figure
      referent: 以課文示範的斷句圖
      text_carrier: image
      placement_note: 印在「以課文示範：」下方（PDF p6 中段），對應 word/media/image10.png
      content: 課文第 1 段的三個分句，句末各畫一道紅色「／」斷句記號（共 3 道）。
      shows_sentences_from: classical_text.paragraphs[0]（原文第 1 段，逐字內容在那裡受檢）
      content_note: |-
        ⚠️ **這張圖只轉錄「圖上獨有」的東西（紅筆斷句記號與它的位置）**，
        句子本身不重抄 —— 它們在 `classical_text` 與 `sentence_matching` 已經逐字受檢。
        自檢時發現原本把整段句子寫進 image 子樹，那會讓那些字**逃過逐字門**（標太寬）。
    - type: guide
      text: 斷句後，一大段的文字會變成3個句子，分好的句子，我們稱它為「分句」。但仔細觀察，只有分句1有主語，其他的句子都沒有，此時，我們可以配合還原省略主語的步驟(找動詞、形容詞)往前找最近的主語，或是依照文意脈絡補上合理的主語，具體思路如下：
    - type: figure
      referent: 圈補主語的思路圖
      text_carrier: image
      placement_note: 印在「具體思路如下：」下方（PDF p6 下段），對應 word/media/image11.png
      content: |-
        1.誰在京城待用?
        2.依文意脈絡，陸公派門人去買，買東西回來的自然是「門人」。
      shows_sentences_from: classical_text.paragraphs[0]（原文第 1 段，逐字內容在那裡受檢）
      annotation_marks: |-
        圖上把課文第 1 段重排兩次：上半在動詞上方用紅字補主語（陸／陸／陸），動詞用灰底標出；
        下半改寫成「(陸)議價未定／(陸)既還邸,(陸)使門人往,(門人)以一金易歸／」的形式，
        並用藍色箭頭指向右側那兩條註記。
      content_note: |-
        ⚠️ **只有上面 content 那兩條註記是「圖上獨有」的**（拿回合併 run 後的 dump grep：
        「誰在京城待用」0、「依文意脈絡，陸公派門人去買」0、「買東西回來的自然是」0），
        正向對照（「以課文示範」「有醫者，自稱善外科」）都 >0 —— 兩組分得開。
        句子本身不重抄，理由同上一張圖。
    - type: guide
      text: |-
        閱讀時可以這樣表示
        總結文言文圈補主語步驟
    - type: concept_box
      text: |-
        1.斷句，看到「句號。」或「問號？」就畫/。
        2.找動詞(包括有/沒有、是/不是)或形容詞。
        3.	判斷是「誰做什麼」、「誰怎麼樣」、「誰有/沒有」、「誰是/不是」以確認主語。
        4.如果句子沒有主語，就往前找最近的主語，或是依照文意脈絡補上合理的主語
      text_note: 印在一個虛線框裡；第 3 條的序號後面是 tab 不是空格，照原樣

    - type: guide
      text: 二、換你試試看：請依「文言文圈補主語步驟」閱讀下文並完成練習
    - type: sub_block
      label: 練習一
      annotations:
        - 注1：裨將，副將。裨，音ㄆㄧˊ。
        - 注2：矢，箭。矢，音ㄕˇ。
        - 注3：膜，指肌肉。
        - 注4：謝，酬勞。
        - 注5：鏃，箭鏃，箭頭。鏃，音ㄗㄨˊ。
        - 注6：不意，不該
      teacher_note: 練習一翻譯：有個醫生，自稱擅長外科手術。一位副將從戰場回來，被亂箭射中，箭深入肌肉，他請醫生醫治。醫生就拿剪刀剪，剪去箭頭，然後跪在地上討要酬勞。副將說：箭頭還在肉裡需要趕快治療。醫生說：「這是內科的事，不該要求我。」
      teacher_note_carrier: 橘色文字方塊（字元樣式），印在原文右側
      instruction: |-
        1.斷句。用紅筆在上文句號「。」或問號「?」的地方畫 /。
        2.參考①、②的作法，完成③-⑤題：用螢光筆標示出動詞或形容詞，並圈補主語
      passage_figure:
        referent: 練習一原文（已畫紅筆斷句）
        text_carrier: image
        placement_note: 印在「練習一」右方的方框裡（PDF p7 上段）
        content: |-
          練習一的五個句子連排成一段，句末共畫 5 道紅色「／」斷句記號。
          圖上第四句印的是「鏃⁵在膜內，須亟治」（與注 5 一致）。
        shows_sentences_from: spotlight 練習一的 items ①~⑤（逐字內容在那裡受檢）
        content_note: |-
          ⚠️ **只轉錄「圖上獨有」的東西**（斷句記號、以及圖上用「鏃」這件事）——
          句子本身不重抄，它們就是底下的 ①~⑤，已逐字受檢。
          圖用「鏃」而文字層第②句用「簇」，那個差異是 source_errata E1 的證據。
      items:
        - sub_label: ①
          text: 「有醫者，自稱善外科。」
          subjects: [{verb_phrase: 自稱善外科, subject: 醫者}]
        - sub_label: ②
          text: 裨將曰：「鏃在膜內者，須亟治。」
          source_text: 裨將曰：「簇在膜內者，須亟治。」
          errata_ref: E1
          subjects: [{verb_phrase: 須亟治, subject: 我}]
        - sub_label: ③
          text: 「一裨將陣回，中流矢，深入膜內，延使治。」
          subjects:
            - {verb_phrase: 陣回, subject: 裨將}
            - {verb_phrase: 深入膜內, subject: 矢}
            - {verb_phrase: 延使治, subject: 裨將}
        - sub_label: ④
          text: 乃持并州剪，剪去矢管，跪而請謝。
          subjects:
            - {verb_phrase: 乃持并州剪, subject: 醫者}
            - {verb_phrase: 剪去矢管, subject: 醫者}
            - {verb_phrase: 跪, subject: 醫者}
            - {verb_phrase: 請謝, subject: 醫者}
        - sub_label: ⑤
          text: 醫曰：「此內科事，不意並責我！」
          subjects: [{verb_phrase: 此內科事, subject: 此/這件事}]
      subjects_note: |-
        ⚠️ 主語標籤（我／醫者×5／裨將×2／矢／此·這件事，共 10 個）**是文字層的浮動文字方塊**，
        但 `<wp:anchor>` 的 document 順序 ≠ 版面順序，所以「哪個標籤配哪個動詞」是
        用 PDF p7 的版面位置 ＋ 語意配對推出來的，並通過兩項交叉檢查：
        ① 標籤總數 10 = ①1 + ②1 + ③3 + ④4 + ⑤1 ② 每個動詞短語都恰好配到一個標籤。
        （與 L0154／L0155 的 sentence_matching 同型的處理方式。）
        紅筆的圈（框住主語）與螢光筆（標動詞／形容詞）都是圖形，不在文字層。
    - type: single
      prompt: |-
        3. 閱讀理解測驗
        關於本文，下列敘述何者正確？
      options:
        A: 醫者治好裨將的傷，但裨將不滿意，醫者只好跪地求饒
        B: 醫者剪去箭桿，治好裨將的傷，裨將因此跪地感謝他
        C: 雖然醫者醫術高明，但為人廉潔，只收取合理的酬勞
        D: 醫者認為自己剪去箭桿後，手術已完成，所以要求酬勞
      answer: D

    - type: sub_block
      label: 挑戰題
      value: 王夷甫雅尚玄遠，常嫉1其婦貪濁，口未嘗言「錢」字。婦欲試之，令婢以錢遶床，不得行。夷甫晨起，見錢閡2行，呼婢曰：「舉卻3阿堵物。」
      value_note: 「嫉」「閡」「舉卻」後面的 1／2／3 是上標注號，照文字層原樣留在句中
      annotations:
        - 注1：嫉，厭惡、憎恨。嫉，音ㄐㄧˊ。
        - 注2：閡，阻隔、妨礙。閡，音ㄏㄜˊ。
        - 注3：舉卻，拿開。
      teacher_note: 挑戰題翻譯：王夷甫崇尚玄學，總厭惡他的妻子貪心汙濁，他的嘴裡從來不說「錢」字。他的妻子想試試他(是不是真的不愛錢)，就命令婢女把錢繞著床放，讓他不能行走。夷甫清晨起床，看見(床邊的)錢阻礙他的行動，就呼喊婢女說：「拿開這些東西。
      teacher_note_carrier: 橘色文字方塊（字元樣式），印在原文右側
      instruction: |-
        讀完上文後，完成以下任務。
        1.斷句。用紅筆在上文句號「。」或問號「?」的地方畫 /
        2.用螢光筆標示出動詞或形容詞，並圈補主語
        3.閱讀理解測驗
    - type: single
      prompt: 關於上文的描述，下列何者正確？
      options:
        A: 王夷甫嫉妒妻子比他有錢
        B: 王夷甫口是心非，實際上很愛錢
        C: 王夷甫用錢遶床是為了討好妻子
        D: 王夷甫把「錢」叫做「阿堵物」
      answer: D
    - type: figure
      label: 挑戰題1、2解答
      referent: 挑戰題斷句與圈補主語的解答圖
      text_carrier: image
      placement_note: 印在挑戰題第 3 小題下方（PDF p8 底部），對應 word/media/image15.png
      content: |-
        紅字補上的主語由左至右：王／王／王／婦／婦／王／王／王
        綠色螢光標示的動詞／形容詞：雅尚玄遠／嫉／未嘗言／欲試／令／不得行／晨起／見／呼
        原文句末共畫 5 道紅色「／」斷句記號。
      shows_sentences_from: spotlight 挑戰題的 value（挑戰題原文，逐字內容在那裡受檢）
      content_note: |-
        「挑戰題1、2解答」這個標籤是文字方塊（在文字層），底下標記過的原文是圖。
        ⚠️ 同樣只轉錄「圖上獨有」的東西（補上的主語、螢光標示的詞、斷句記號），
        原文句子不重抄 —— 它在挑戰題的 value 已經逐字受檢。

# ── 五 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（字元樣式 aff），文字流有此資訊
  teacher_note_carrier: 藍色（156082）文字方塊，印在題目右側；第 4 題沒有解析
  questions:
    - index: 1
      answer: A
      stem: 下列選項「」中字，何者字音、字義完全正確？
      options:
        A: 「嘗」於市遇一佳硯——ㄔㄤˊ，曾經
        B: 既「還」邸，使門人往——ㄏㄞˊ，還是
        C: 吾嫌其微「凸」——ㄊㄨ，突出
        D: 公大「惋」惜——ㄨㄢˇ，可惜
      explanation: |-
        第1題解析：
        B字音ㄏㄨㄢˊ，字義「返回」；
        C字音ㄊㄨˊ；
        D字音ㄨㄢˋ。
    - index: 2
      answer: B
      stem: 根據「陸公買硯」一文，關於陸盧峰這個人的敘述下列何者正確？
      options:
        A: 玩物喪志，優柔寡斷
        B: 寬厚仁愛，度量很大
        C: 管理下屬，恩威並濟
        D: 言出必行，做事果斷
      explanation: |-
        第2題解析：
        B由僕人任意花錢請人磨平主人(陸公)的硯臺，而陸公僅是「大惋惜」可知。
    - index: 3
      answer: B
      stem: 「淳于恭，北海人。人有盜刈1恭禾者，恭見之，念其愧，因伏草中，至去乃起。」根據這則故事，下列敘述何者最恰當？
      stem_note: 「盜刈」後面的 1 是上標注號，照文字層原樣留在句中
      annotations:
        - 1.刈：音ㄧˋ，割取。
      annotations_note: 這條注釋前面印了一個裝飾符號（w:sym Wingdings F026），不在 w:t 裡，故不寫入
      options:
        A: 當時五穀歉收，盜賊四處搶糧
        B: 淳于恭個性溫厚寬容，能體恤他人
        C: 北海地區盜賊兇悍，人民不敢與之對抗
        D: 淳于恭伏於草中，乃心中有愧，不欲見人
      explanation: 第3題說明：本題是「不量田」一課主語判讀的練習題延伸。詳見該課P.11。
    - index: 4
      answer: C
      stem: 據「陸公買硯」一文，下列關於故事中人物的敘述，何者最恰當？
      options:
        A: 門人買錯硯臺卻不知道
        B: 陸公惋惜是因為石工技藝不佳
        C: 門人請人磨平硯眼是自作聰明
        D: 陸公對門人購硯的價格感到驚訝
    - index: 5
      answer: A
      stem: 下列何者不可能是「陸公買硯」一文的寓意？
      stem_note: 題幹的「不可能」在原稿加了底線強調
      options:
        A: 不聽老人言，吃虧在眼前
        B: 即使是好心也可能辦壞事
        C: 知人善任才不會反受其害
        D: 託人辦事，一定要先清楚溝通
      explanation: |-
        第5題解析:
        A諺語。意思是不聽有經驗者的意見，往往會吃虧後悔。
    - index: 6
      answer: D
      stem: 下列哪一選項的閩南語俗諺可以形容課文中的僕人？
      options:
        A: 痟貪軁雞籠
        B: 好心予雷唚
        C: 目睭花花，匏仔看做菜瓜
        D: 生雞卵的無，放雞屎的一大堆
      explanation: |-
        A嘲笑人一時恍神，把形狀相近的物品看成別的東西。
        B形容團體中沒有能帶來利益或好處的人，只有會惹事生非，帶來壞處或麻煩的人。
        C勸人千萬不要貪得無厭。
        D比喻好心沒報
      explanation_note: |-
        ⚠️ 這個解析框的 A 與 B 兩條**跟選項對不起來**：A 條講的是選項 C（目睭花花）、
        B 條講的是選項 D（生雞卵的無）。原稿如此，照原樣抄、不重排
        （重排等於替教材決定哪一條配哪一項）。
