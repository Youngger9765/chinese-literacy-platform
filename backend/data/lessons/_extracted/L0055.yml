# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略──從段落找主題句
  strategy_type: summarizing
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        主題句是段落中最能說出主要內容的句子。其他句子通常會說明、舉例或補充它。
        有些段落的主題句在開頭，有些在中間或結尾。找主題句時，不能只看句子的位置，還要判斷：
        哪一句最能說出整段的主要內容？
        其他句子是不是在說明、舉例或補充它？
        找主題句可以用兩個步驟：
        一、分句子：找出句號、問號和驚嘆號，把段落分成幾句，依序標上號碼。
        二、找主題句：找出最能說明整段主要內容的句子，再用其他句子檢查答案。

    - type: sub_block
      label: 例如：〈如何製作好喝的烏龍茶？〉
      instruction: 例如：〈如何製作好喝的烏龍茶？〉
      layout_note: 這段示範跟上面的策略說明印在**同一個外框**內，跨第 6~7 頁。
      answer_carrier: 橘色手寫字（圖形字型），文字流的括號內已填有答案
      items:
        - {type: guide, text: "第一步：分句子：把段落裡的句子分出來"}
        - type: passage
          paragraphs:
