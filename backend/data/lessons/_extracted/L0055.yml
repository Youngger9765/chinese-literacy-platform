          paragraphs:
            - ❶其實不只是人類，日本短尾猴的公猴也比母猴更常做出冒險行為。/❷有兩位人類學家研究日本的短尾猴二十幾年。/❸他們發現，剛出生時，公猴和母猴的比例大約是5：5，但因為大量的公猴在青少年期就死亡，到了成年時，比例便下降到1：5──一隻公猴：五隻母猴。/❹人類學家仔細檢視21年的觀察資料後發現，公猴比較喜歡做危險的動作。/❺例如，從這棵樹跳到那棵樹，母猴總是小心翼翼，寧願爬下樹、走到另一棵樹、再爬上去；公猴總是自命不凡，認為這點距離易如反掌，奮力一跳的結果是……摔死了。/❻公猴也比較不會審時度勢，喜歡冒險穿越附近的公路，結果常常被高速行駛的車輛撞上，一命嗚呼。/
