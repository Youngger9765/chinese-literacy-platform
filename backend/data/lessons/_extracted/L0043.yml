      value: 小花感激姊姊們為家庭所做的犧牲，並意識到【　】對人生進路的影響。
      blanks: [{answer: 教育}]

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論人物特質
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        前面，我們學會從人物說的話、做的事的言行推論人物特質。這一課要再往前一步：把推論出的特質放回故事裡，看看這項特質如何影響人物的重要選擇，又如何影響後來的發展。
        小花和姊姊們都很努力，為什麼最後走向不同的人生？我們用四個步驟來讀懂：
        ❶找關鍵選擇    ❷串事件、推特質
        ❸比較不同處境  ❹統整全文關係

    - type: fill_table
      label: 一、找出改變人生方向的關鍵選擇
      instruction: 一、找出改變人生方向的關鍵選擇
      sub_instruction: 高中畢業時，小花大學聯考落榜。請根據課文，判斷她當時面臨的兩條路，以及這個選擇帶來的影響。
      columns: [想一想, 請勾選正確答案]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      rows:
        - 想一想: 1.媽媽希望小花
          請勾選正確答案_options: {1: 再補習一年, 2: 找工作幫忙賺錢}
          請勾選正確答案_answer: 2
        - 想一想: 2.小花為自己爭取
          請勾選正確答案_options: {1: 和姊姊一樣直接工作, 2: 再考一次，靠教育翻身}
          請勾選正確答案_answer: 2
        - 想一想: 3.這個選擇為什麼重要
          請勾選正確答案_options: {1: 讓她從直接工作，轉向繼續升學, 2: 讓她從鄉下生活轉向臺中生活}
          請勾選正確答案_answer: 1

    - type: guide
      text: ➡小花選擇了升學這條路，但她還要解決補習費和生活費等新困難。

    - type: fill_table
      label: 二之1、看小花怎麼把升學這條路走下去
