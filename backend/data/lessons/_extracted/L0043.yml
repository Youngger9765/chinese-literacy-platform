            2: 懂得感恩：記得並感謝別人的幫助
            3: 積極進取：主動爭取並找方法前進
          請勾選最適合的答案_answer: 3
        - 想一想: 這項特質如何影響她的人生發展？
          請勾選最適合的答案_options:
            1: 讓她遇到困難仍能找方法，把升學之路繼續走下去
            2: 讓她把賺錢放在升學之前，逐步轉向全職工作
          請勾選最適合的答案_answer: 1

    - type: guide
      text: ➡小花積極進取，會主動爭取、想辦法，因此能把升學這條路繼續走下去。但是，人物特質是她改變人生的唯一原因嗎？

    - type: fill_table
      label: 三、比較小花與姊姊
      instruction: 三、比較小花與姊姊：為什麼人生進路不同？
      sub_instruction: |-
        小花和姊姊們都很努力，後來卻走向不同的人生。
        1.請把課文線索合起來，完成判斷。
      columns: [比較重點, 大姊、二姊, 小花]
      answer_carrier: 紅色手寫字（圖形），文字流的【　】內已填有答案
      rows:
        - 比較重點: 努力表現
          大姊、二姊: 國小畢業後便工作，長期為家庭付出
          小花: 從小打工，重考及上大學後仍繼續工作
        - 比較重點: 教育機會
          大姊、二姊: 二姊成績優秀，卻因家境困難而【　】
          大姊、二姊_blanks: [{answer: 放棄升學}]
          小花: 爭取重考，並得到妹妹支援，【　】
          小花_blanks: [{answer: 持續接受教育}]
        - 比較重點: 後來發展
          大姊、二姊: 大姊在工地工作，二姊逐戶【　】
          大姊、二姊_blanks: [{answer: 為人打掃}]
          小花: 成為助教，繼續念碩士、博士，最後成為【　】
          小花_blanks: [{answer: 教授}]

    - type: single
      label: 三之2
      prompt: 2.從表格可以看出，小花和姊姊們最重要的差別是什麼？（單選）
      options:
        1: 小花工作比較勤奮，姊姊們工作不夠認真。
        2: 她們都很努力，但持續接受教育的機會不同。
        3: 小花比較喜歡讀書，姊姊們比較喜歡工作。
      answer: 2
