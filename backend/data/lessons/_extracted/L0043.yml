      rows:
        - 人生階段: ①大學聯考落榜
          遇到的困難: 媽媽希望她去工作
          小花怎麼做: 爭取再考一次
          事情怎麼往前: 得到重考的機會
          note: 本列的「小花怎麼做」是題目印好的，不是選擇題
        - 人生階段: ②準備重考
          遇到的困難: 補習費和生活費沒有著落
          小花怎麼做_options: {1: 留在家裡，等待家人籌錢, 2: 到補習班打工，想方法招收學生籌錢}
          小花怎麼做_answer: 2
          事情怎麼往前: 賺到補習費；妹妹支援生活費
        - 人生階段: ③考上大學後
          遇到的困難: 還要負擔生活，並完成學業
          小花怎麼做_options: {1: 繼續打工、接家教, 2: 暫停學業，先全心工作}
          小花怎麼做_answer: 1
          事情怎麼往前: 完成大學，繼續念碩士和博士

    - type: fill_table
      label: 二之2、找出這些行動的共同點
      instruction: 2.找出這些行動的共同點
      columns: [想一想, 請勾選最適合的答案]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      rows:
        - 想一想: 小花遇到困難時，一貫的做法是什麼？
          請勾選最適合的答案_options:
            1: 等待家人安排，再照別人的決定行動
            2: 主動爭取機會，並想方法繼續前進
