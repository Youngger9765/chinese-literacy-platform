# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 正向思考—如何面對不能改變的事
  strategy_type: character
  section_title_printed: 品格聚光燈
  section_title_note: 印的是「品格聚光燈」不是「閱讀聚光燈」；標題是品格議題，不是閱讀策略
  blocks:
    - type: concept_box
      text: |-
        文章重點表已經整理了媽媽和家人經歷的事情。接下來，我們不只要看「發生了什麼」，還要把媽媽面對病痛時的不同反應合起來，找出背後共同的信念。
        接著再看看：這個信念如何影響家人和作者，最後成為紅領帶的重要意義。

    - type: sub_block
      label: 一、從媽媽的反應找出共同信念
      instruction: 媽媽的病痛一步步加重，但她每次面對病痛的方式不完全相同。請讀媽媽的反應，選出主要的面對方式。
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊（被勾中的 □ 從文字流消失）
      items:
        - type: sub_block
          table_header: [媽媽面對病痛時的反應, 這個反應主要表現什麼？]
          table_header_note: 原稿是兩欄表格，左欄為媽媽的反應、右欄為兩個選項；四列各是一題單選
          items:
            - type: single
              label: 1.沒有胃、無法躺著睡，媽媽說：「沒有胃就不會胃痛了。」
              options: {1: 用幽默轉換個角度看, 2: 珍惜並感謝仍然擁有的}
              answer: 1
            - type: single
              label: 2.化療後身體很虛弱，媽媽說可以整天躺在沙發上看球賽
              options: {1: 用幽默轉換個角度看, 2: 珍惜並感謝仍然擁有的}
              answer: 1
            - type: single
              label: 3.不能進食，只能喝一點點水，媽媽說：「這水好甜，好好喝喔。」
              options: {1: 用幽默轉換個角度看, 2: 珍惜並感謝仍然擁有的}
              answer: 2
            - type: single
              label: 4.醫師建議不再繼續化療，媽媽說：「有一天我們還會在天父那裡再見哦。」
              options: {1: 珍惜並感謝仍然擁有的, 2: 用信仰面對死亡與分離}
              options_note: 本列選項與前三列不同（①改成「珍惜並感謝仍然擁有的」、②是「用信仰面對死亡與分離」），原稿如此
              answer: 2
        - type: single
          prompt: 1.媽媽面對病痛方式雖然不同，背後哪個信念一直沒有改變？（單選）
          options:
            1: 只要保持喜樂，病情最後就會慢慢好轉。
            2: 不能決定病痛如何發展，仍可以選擇如何面對。
            3: 為了不讓家人難過，應把痛苦全部藏在心裡。
          answer: 2
        - type: single
          prompt: 2.課文說：「我們下定決心要跟媽媽看齊。」這可以看出媽媽的做法對家人產生什麼影響？（單選）
          options:
            1: 讓家人相信媽媽的病情其實沒有那麼嚴重。
            2: 讓家人看見，面對無法改變的事仍能作出選擇。
            3: 讓家人不用再擔心，也不必陪伴媽媽治療。
          answer: 2

    - type: guide
      text: |-
        你發現了嗎？
        媽媽有時用幽默，有時表達感謝，有時依靠信仰。做法雖然不同，背後的信念卻相同：
        →很多事不能掌控，但仍可以選擇如何面對。
        →這個信念不只幫助媽媽，也影響了家人和作者。

    - type: sub_block
      label: 二、看信念如何由媽媽走向作者
      answer_carrier: 紅色 ☑（圖形）與橘色手寫字；☑ 不在文字流，橘字已在文字流的【】內
      items:
        - type: single
          prompt: 1.作者說「跟媽媽看齊」最接近什麼意思？（單選）
          options:
            1: 要求自己和媽媽一樣，完全不害怕死亡
            2: 學習媽媽面對無法掌控之事的方式。
          answer: 2
        - type: fill_table
          prompt: 2.請完成「信念被承接」的歷程
          columns: [信念的發展, 課文中的表現]
          rows:
            - 信念的發展: 媽媽活出信念
              課文中的表現: 用【　】、【　】與【　】面對病痛。
              blanks: [{answer: 幽默}, {answer: 感謝}, {answer: 信仰}]
            - 信念的發展: 媽媽說出信念
              課文中的表現: 很多事不是我們能【　】的，但可以決定如何【　】。
              blanks: [{answer: 掌控}, {answer: 面對}]
            - 信念的發展: 家人跟媽媽看齊
              課文中的表現: 說好笑的事、唱詩歌，開心陪媽媽走完【　】。
              blanks: [{answer: 最後一段路}]
            - 信念的發展: 作者用行動承接
              課文中的表現: 在告別式和追思禮拜中，繫上【　】送別媽媽。
              blanks: [{answer: 紅領帶}]
            - 信念的發展: 紅領帶持續提醒
              課文中的表現: 往後遇到不可逆轉的困難時，提醒自己仍能選擇【　】。
              blanks: [{answer: 如何面對}]

    - type: sub_block
      label: 三、讀懂紅領帶承接了什麼？
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: single
          prompt: 1.紅領帶如何把「看不見的信念」變得看得見？（單選）
          options:
            1: 紅領帶的顏色很鮮豔，所以容易被大家注意。
            2: 作者用繫紅領帶的行動，實踐媽媽教給他的面對方式。
            3: 親友看見紅領帶，就不會在告別式感到難過。
          answer: 2
        - type: single
          prompt: 2.下列哪一組最能說明全文的重要關係？（單選）
          options:
            1: 媽媽生病→作者難過→作者穿上特別的服裝
            2: 媽媽活出信念→家人跟媽媽看齊→作者用紅領帶繼續實踐
            3: 媽媽接受治療→家人陪伴照顧→作者日後不再感到悲傷
          answer: 2

    - type: sub_block
      label: 四、換你試試看：把信念帶到生活裡
      instruction: 情境：重要比賽前，小傑受傷了。醫師說：「這次不能上場。」小傑很失望，也擔心辜負隊友。
      answer_carrier: 紅色 ☑（圖形）與橘色手寫字；☑ 不在文字流，橘字已在文字流的【】內
      items:
        - type: single
          prompt: 1.哪一個想法較符合本課的信念？（單選）
          options:
            1: 告訴自己：「受傷其實是好事，我根本不想參加比賽。」
            2: 不讓隊友失望，忍著疼痛上場，等比賽結束再治療。
            3: 接受這次不能上場，先配合治療，也和教練討論自己還能怎麼幫助球隊。
          answer: 3
        - type: free_text
          prompt: |-
            2.小傑怎麼把「不能掌控的事」和「仍能選擇的事」分開？
            (1)不能掌控的事：【　】
            (2)我仍然可以選擇的事：【　】
          blanks:
            - {answer: 這次不能上場}
            - {answer: 配合治療，並和教練討論如何幫助球隊}
        - type: single
          prompt: 3.第③個做法為什麼符合本文媽媽的信念？（單選）
          options:
            1: 他承認受傷和失望，也在現況中找出自己仍能做的事。
            2: 他努力忘記受傷的事，讓自己不要再感到失望。
          answer: 1

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能從媽媽的不同反應，找出共同信念。
        - 2.我能看出家人和作者如何接下這個信念。
        - 3.我能說明紅領帶的意義，並把信念用在新情境中。

# ── 七 閱讀理解 ──
