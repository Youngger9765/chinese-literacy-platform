spotlight:
  strategy_name: 成長型思維
  strategy_type: sel_character
  blocks:
    - type: concept_box
      text: 成長型思維和固定型思維有什麼不同？兩種思維都可能出現在我們心裡。請先看下面的比較，再完成後面的練習。
    - type: table
      columns: [比較項目, 成長型思維, 固定型思維]
      rows:
        - [基本想法, 能力可以透過練習進步。, 能力是天生的，很難改變。]
        - [面對挑戰, 困難代表我有機會練習。, 困難代表我做不到、不適合。]
        - [面對失敗, 失敗提醒我哪裡需要調整。, 失敗讓我丟臉，想藏起來。]
        - [看到別人成功, 想知道他用了什麼方法。, 覺得自己被比下去了。]
        - [內心對話, 「我想再試一次！」, 「我就知道我不行。」]
    - type: sub_block
      label: ◎練習一
      instruction: |-
        ◎練習一：請閱讀下列情境中的「腦中想法」，完成兩件事：
        判斷這句話比較像「固定型思維」還是「成長型思維」。
        想一想：如果我相信這句話，我接下來比較可能會怎麼做？
      items:
        - index: 1
          stem: 數學題寫錯，我想：「我數學就不好。」
          items:
            - {label: 思維類型, options: {A: 固定型, B: 成長型}, answer: A}
            - {label: 如果我相信這句話，我可能會……, options: {ㄅ: 放棄練習, ㄆ: 找出錯在哪一步}, answer: ㄅ}
        - index: 2
          stem: 英文太難，我想：「反正我再努力也不會更好。」
          items:
            - {label: 思維類型, options: {A: 固定型, B: 成長型}, answer: A}
            - {label: 如果我相信這句話，我可能會……, options: {ㄅ: 停止思考, ㄆ: 換一個方法再試}, answer: ㄅ}
        - index: 3
          stem: 看到同學很快解出題目，我想：「他是怎麼做到的？我可以學他的第一步。」
          items:
            - {label: 思維類型, options: {A: 固定型, B: 成長型}, answer: B}
            - {label: 如果我相信這句話，我可能會……, options: {ㄅ: 覺得自己輸了, ㄆ: 問他第一步怎麼想}, answer: ㄆ}
        - index: 4
          stem: 比賽失分後，我想：「可能是策略被對方抓到了，我可以和隊友討論。」
          items:
            - {label: 思維類型, options: {A: 固定型, B: 成長型}, answer: B}
            - {label: 如果我相信這句話，我可能會……, options: {ㄅ: 找人討論策略, ㄆ: 覺得自己不適合打球}, answer: ㄅ}
        - index: 5
          stem: 考差之後，我想：「我就知道我不行，以後不要再碰這種題目了。」
          items:
            - {label: 思維類型, options: {A: 固定型, B: 成長型}, answer: A}
            - {label: 如果我相信這句話，我可能會……, options: {ㄅ: 避開類似題目, ㄆ: 找出自己卡在哪裡}, answer: ㄅ}
    - type: guide
      text: →你觀察到了嗎？固定型思維通常讓我們停下來、躲起來；成長型思維通常讓我們調整、求助、再試一次。而怎麼看待思考會影響我們的下一步。
    - type: sub_block
      label: ◎練習二
      instruction: |-
        ◎練習二：加入「Not yet」精神──
        成長型思維中，面對挑戰，會把「我不會」變成「我還不會」；把「我做不到」變成「我還沒找到方法」。每個人都會有固定型的想法，而當這樣的想法出現時，我們可以先看見它、理解它，試著加入「Not yet」精神，幫助自己找出下一步。
      note: 表頭右欄印「我的回答（沒有標準答案，每個人都不一樣哦）」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      items:
        - index: 1
          stem: 我最常出現的固定型思維句子
          options:
            1: 「我辦不到」
            2: 「這太難了」
            3: 「這我不擅長」
            4: 「我就是不會」
            5: 「我不可能像他一樣」
            6: 其他：
          no_correct_answer: true
        - index: 2
          stem: 這個句子可能想保護我不要經歷什麼？
          options:
            1: 不要丟臉
            2: 不要再次失敗
            3: 不要被別人笑
            4: 不要努力後卻沒成果
            5: 不要面對自己不會
            6: 其他：
          no_correct_answer: true
        - index: 3
          stem: 這個句子提醒我，我現在可能需要什麼？
          options:
            1: 先讓心情穩定一點
            2: 把目標變小一點
            3: 知道可以怎麼開始
            4: 找到一個方法或示範
            5: 有人給我一點支持
            6: 其他：
          no_correct_answer: true
        - index: 4
          stem: 在開始之前，我已經有哪一點可以幫助自己？
          options:
            1: 我知道自己正在害怕或挫折
            2: 我知道自己想要變好一點
            3: 我曾經有一點點成功經驗
            4: 我可以把目標切成更小的任務
            5: 我身邊有可以請教的人
            6: 其他：
          no_correct_answer: true
        - index: 5
          stem: 我可以運用什麼資源，先往前一小步？
          options:
            1: 運用一點時間，先試最小的一步
            2: 運用之前的例子，看看別人怎麼做
            3: 運用提問，請別人給我提示
            4: 運用過去經驗，想想以前怎麼撐過去
            5: 運用休息時間，讓自己穩定後再開始
            6: 其他：
          no_correct_answer: true
        - index: 6
          stem: 加入 Not yet 精神，選出你可以改寫的句子，並完成它。
          options:
            1: "我現在還不會____________________________，\n但我可以先__________________________________。"
            2: "我還沒有掌握____________________________，\n下一次我想試____________________________。"
            3: "這題／這件事我還沒做好，可能是因為我卡在\n____________________________________________。"
          no_correct_answer: true
          _選項note: 底線是原稿印的書寫線，長度照抄；\n 是原稿的換行
    - type: guide
      text: →當想放棄的念頭出現時，或是固定型思維又出來保護我們時，也許不是要我們停下來，而是提醒我們需要成長、需要試試別的方法！
    - type: guide
      text: |-
        補充小站：
        以後當固定型思維出現時，可以試著換一句話，幫自己從「我不行」找到下一小步。
    - type: table
      title: 換個說法，換個思維：九個改變
      columns: [固定型思維可能會說, 你可以試著換成這樣說]
      rows:
        - [我就是不懂, 我忽略了什麼嗎？]
        - [我放棄了, 我得試試我學過的（別的）方法。]
        - [我犯錯了, 犯錯能讓我變得更好。]
        - [這太難了, 我可能需要更多的時間和精力（才能搞定）。]
        - [已經挺好的了, 這真的是我的最好成績嗎？]
        - [我不可能像她一樣聰明, 她是怎麼做的，我也要試試看。]
        - [我不能做得更好了, 我還能做得更好，我要繼續試試！]
        - [我閱讀不太好, 我要訓練我的閱讀能力。]
        - [我不擅長這個, 我正在提升自己。]
      _箭號note: >-
        兩欄之間印有九個箭號，是 straightConnector1 圖形（全檔 9 個，與列數相同），
        不在文字流裡，所以不寫進儲存格文字。

comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列選項中「  」的語詞，何者使用正確？
      options:
        A: 他經常「義無反顧」，說話不算話，不可以輕易相信他的承諾
        B: 在這場競爭激烈的比賽中，他「一步到位」，率先衝過終點線
        C: 這次的選拔比賽會有許多球探來觀賽，你可別錯失「良機」了
        D: 他鼓起勇氣「喃喃」唸出告白信，結果讓整個走廊都聽見了
      teacher_note: 第1題解析：(A)應換成「出爾反爾」；(B)應換成「一馬當先」；(D)「喃喃」是小聲的意思，不會整個走廊都聽見
    - index: 2
      answer: B
      stem: 根據第五段，作者將固定型思維比喻成大腦進入「省電模式」，以下何者最符合固定型思維的特色？
      options:
        A: 會主動尋找更困難的任務，讓自己持續進步
        B: 會避免挑戰與風險，讓自己待在安全範圍內
        C: 會快速分析失敗原因，找出下一步練習方向
        D: 會把別人的成功看成榜樣，進一步模仿學習
      teacher_note: 固定型思維傾向保護自己
    - index: 3
      answer: D
      stem: 根據第六段，作者提到棒球是「高失敗率的運動」，即使優秀打者也常常失敗。作者舉這個例子，最主要是為了說明什麼？
      options:
        A: 棒球選手之所以成功，是因為比一般人天分更高
        B: 棒球比數學更困難，所以更適合用來練習抗壓
        C: 只要選擇失敗率高的活動，就能自然培養信心
        D: 優秀的人也會失敗，重點是如何從失敗中調整
      teacher_note: 第六段最後一句：只要能從失敗中修正、調整，就能更靠近成功。
    - index: 4
      answer: A
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 面對失敗時，改變解釋方式，能幫助自己找出下一步
        B: 學生在教室裡容易放棄，主要是因為缺少足夠的興趣
        C: 成功者之所以能成功，是因為他們具有良好天賦
        D: 每個人都應該多多運動，才能改變原本的學習能力
      teacher_note: 強調成長型思維帶來的影響。
    - index: 5
      answer: C
      stem: 下列何者的思維最具成長型思維的特質？
      options:
        A: 小荷：「每個人天生就有擅長與不擅長的事情，不用過分執著。」
        B: 阿玖：「避免失敗、避免犯錯，才是追求成功的最高原則。」
        C: 奇奇：「遇到問題或挫折，不代表做不到，只是還需要找方法。」
        D: 方仔：「人生的追逐無窮無盡，練習知足才能帶來真正的快樂。」
      teacher_note: (C)符合「Not yet」的精神

