      76 == 段4；98 == 段4+5；277 == 段4~6；366 == 段4~7。
    第 8~15 段沒有標 —— 屬「字數欄提早停」的形狀，366 不是全文長度。
    🔴 要**同時套兩條**才對得上（只套一條四個段界會全錯）：
      ① 一串阿拉伯數字算 1 個字（段6 有「18」「30」）
      ② **破折號 U+2014 完全不計入**（段4 的「——」兩個字元，Word 一個都沒算）
    第 ② 條不在 skill 現有的四條口徑裡，是本課新發現的第五條：
