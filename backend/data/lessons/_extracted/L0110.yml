        觀點轉折
        （段4-6）
      value: |-
        1.作者小時候對阿嬤【　】。長大發現也許不是我【　】，阿嬤連看電視都會挑剔演員。
        2.作者18歲上成功嶺，班長很兇，作者聽見鄰兵啜泣卻覺得他們【　】；反而開始感謝阿嬤，認為這種教養方式對他在軍的【　】有幫助。
      blanks: [{answer: 又怨又怕}, {answer: 一無是處}, {answer: 嬌生慣養}, {answer: 心理韌性}]
    - label: |-
        關係改變
        (段7-8)
      value: 下成功嶺，作者回家時，晚餐有滿桌子的菜，作者知道那是阿嬤表達愛的方式；但作者開始敢用【　】抗議，阿嬤卻以「我到40歲還不是被打」回應。
      blanks: [{answer: 尊重接納／無條件關注}]
    - label: |-
        成熟
        互動關係
        (段9-11)
      value: 35歲回家，作者動作慢被嫌、唱歌被嫌。作者逮到機會幽默的用玩笑【　】「阿嬤，你牙齒痛是嗎？」阿嬤笑回「我又沒牙齒。」
      blanks: [{answer: 反酸}]
    - label: |-
        對阿嬤身世有同情的
        理解
        (段13)
      value: |-
        1.阿嬤的爸爸滿口髒話，生活拮据，阿嬤13歲就去日本警察家幫傭，警察大人很會罵人。
        2.阿嬤成長在【　】的時代，長大後說話的方式其實就是她小時候被對待的方式。
      blanks: [{answer: 威權當道、階級分明}]
    - label: |-
        結尾
        (段14)
      value: 作者以教師身分提醒：人不是被【　】決定的，我們可以決定怎麼【　】自己的童年經驗。
      blanks: [{answer: 早期經驗}, {answer: 詮釋}]
  rows_note: |-
    第 1、6 列的兩個空格在原稿是黑色印刷（非橘色手寫），其餘空格答案都是橘色 ——
    即「我愛你／該改進的地方／早期經驗／詮釋」四個在文字流裡就是一般顏色。照原樣收錄。

# ── 六 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 推論策略──推論角色關係與觀點
  strategy_type: inference
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，共 17 個）
  blocks:
    - type: concept_box
      label: 推論和腦補
      text: |-
        請試著讀底下的文字，再回答一個問題：
        　　「阿嬤在屋裡喊：『過來！』我手心立刻冒汗，連呼吸都放輕，小跑步進房間。」
    - type: single
      prompt: 問題：作者和阿嬤的關係可能是？
      options: {1: 很愛阿嬤, 2: 很怕阿嬤}
      answer: 2
      answer_carrier: 紅色 ☑（w:sym），PDF p7 可見
      prompt_note: 題幹前印的「➔」是 Wingdings 符號（w:sym F0E0），不在文字流裡，故不寫入箭頭字元。
    - type: guide
      text: |-
        在回答這個簡單的問題時，你已經在做推論了。
        你看，「作者很怕阿嬤」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」，最近的流行語叫做「腦補」。
        閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！
        這篇故事，描述了作者和阿嬤之間的互動，故事沒有把他們的關係和想法講白，而是把線索藏在對話、動作和反應裡。
        接下來要做的就是抓住這些線索，推論作者和阿嬤的關係如何改變，並進一步理解作者真正想傳達的意思。

    - type: sub_block
      label: 小時候
      left_header: 階段
      right_header: 文章線索及推論想法
      table_note: |-
        原稿是一張三欄表格（階段／標籤／內容），「階段」欄用 vMerge 縱跨該階段所有列。
        此處以 sub_block 表達分組，每個「推論…」小題各自帶答案。
      items:
        - type: guide
          label: 文章線索
          text: |-
            ①只看見作者該改進的地方
            ②「再哭一聲看看！」我會立刻噤聲。
            ③她只要大喊我的名字……小朋友立刻神色大變……
        - type: single
          label: |-
            推論作者想表達的想法
            （單選）
          options: {1: 阿嬤很嚴厲，讓我總是戰戰兢兢, 2: 阿嬤討厭我，總是修理我、恐嚇我}
          answer: 1
        - type: single
          label: 推論祖孫關係(單選)
          prompt: 阿嬤與作者：
          options: {1: 權威者 vs. 服從者, 2: 照顧者 vs. 被照顧者}
          answer: 1

    - type: sub_block
      label: 讀大學時期
      items:
        - type: guide
          label: 文章線索
          clue_index: 1
          text: 阿嬤連看八點檔，都會挑剔演員，說他很醜
        - type: single
          label: |-
            推論作者想表達的想法
            （單選）
          options: {1: 我常挨阿嬤罵，是因為我很糟，不夠好, 2: 阿嬤愛罵人是她自己的問題，我不必每句話都當真}
          answer: 2
        - type: guide
          label: 文章線索
          clue_index: 2
          text: 聽見鄰兵啜泣……我心裡不屑：哼，嬌生慣養！開始感謝起阿嬤來。
        - type: single
          label: |-
            推論作者未寫出的想法
            (單選)
          options: {1: 班長本來就該嚴厲，我不懂鄰兵為什麼哭, 2: 阿嬤對我的嚴厲，能幫助我適應軍中生活}
          answer: 2
        - type: guide
          label: 文章線索
          clue_index: 3
          text: （從軍中回家見到阿嬤）把她風雨不透的抱離地面，轉了一個圈。
        - type: multi
          label: |-
            推論作者未寫出的想法
            (3選2)
          options:
            1: 藉此展現在部隊裡訓練出來的肌肉
            2: 很久沒有見到阿嬤，很高興再見到她
            3: 不再是小孩了，現在不論身心，我都能輕易面對阿嬤
          answers: [2, 3]
        - type: guide
          label: 文章線索
          clue_index: 4
          text: 我試著講完全的尊重接納……並抗議她總是在嫌我罵我。
        - type: single
          label: |-
            推論作者未寫出的想法
            (單選)
          options: {1: 我們的關係改變了，我不再怕她，可以提不同想法, 2: 我進入了反抗期，對什麼都不滿意，都要抗議}
          answer: 1
        - type: guide
          label: 文章線索
          clue_index: 5
          text: 晚餐有滿桌子的菜，我知道這是她愛我的方式
        - type: single
          label: |-
            推論作者未寫出的想法
            (單選)
          options: {1: 壞脾氣的她，畢竟也有心情好的時候, 2: 我開始讀懂她用行動在乎我，雖然說話難聽}
          answer: 2
        - type: single
          prompt: 推論作者認為自己的角色有了什麼變化？(單選)
          options:
            1: |-
              從「受壓迫的小孩」
              「能平等提出不同意見的大人」
            2: |-
              從「又怕又怨的小孩」
              「能夠勇敢反擊的大人」
          answer: 1
          options_note: |-
            兩個選項的引號之間原稿印了一個箭頭，那是 Wingdings 符號（w:sym Wingdings/F0E0）、
            不在 w:t 文字流裡，故**不寫入字面箭頭，改在箭號位置斷行**
            （SKILL「箭號與圈號常是 w:sym」那條；L0031 的同款寫法用的是 Wingdings 3/F022）。
            PDF p8 上仍印成一行。
      clue_index_note: |-
        「文章線索」後面印的 ❶❷❸❹❺ 是 Wingdings 2 符號（w:sym F075~F079），不在文字流裡，
        故不併進 label，另以 clue_index 記錄。

    - type: sub_block
      label: |-
        35歲
        ｜
        作者在大學教學
      items:
        - type: guide
          label: 文章線索
          clue_index: 1
          text: |-
            ①她嫌我動作慢：「我看你一輩子也做不完。」忘了鎖門，她：「你讀什麼博士？讀到天邊去了？」我哼個歌，她：「你牙齒痛是嗎？」
            ②三歲的小昀被薰陶一個月，也學會說「幹恁婆啊！」
        - type: single
          label: |-
            推論作者未寫出的想法
            (單選)
          options: {1: 在任何情境，不管對誰，阿嬤說話方式從未改變, 2: 阿嬤對孩子的口頭霸凌方式歷歷可數}
          answer: 1
        - type: guide
          label: 文章線索
          clue_index: 2
          text: 作者唱歌被罵，阿嬤唱歌，作者笑著反酸：「阿嬤，你牙齒痛是嗎？」
        - type: single
          label: |-
            推論作者未寫出的想法
            (單選)
          options: {1: 祖孫關係改變了，我現在能幽默接住阿嬤的刻薄, 2: 從小被罵被酸，我當然要找機會報仇一下}
          answer: 1
        - type: guide
          label: 文章線索
          clue_index: 3
          text: 阿嬤成長在一個威權當道、階級分明的世代。阿嬤對我們說話的方式，就是她小時候大人對她說話的方式。
        - type: single
          label: |-
            推論作者未寫出的想法
            (單選)
          options: {1: 我不再怕她，能用幽默接住她的刻薄，也能理解她的成長，並決定如何詮釋自己的童年經驗, 2: 我用反酸贏了她，證明我比較厲害，她以後就不敢再罵我了}
          answer: 1
        - type: single
          prompt: 試著推論作者現在怎麼看待他的阿嬤？
          options: {1: 一個沒水準、滿口髒話、家暴小孩、死性不改的長輩, 2: 阿嬤愛我，她說話刻薄有其成長背景，我能理解}
          answer: 2

    - type: guide
      text: 二、把三個階段串連起來看歷程。(單選)
    - type: guide
      text: 1.互動方式變化（關係）：
    - type: single
      prompt: 請選出最符合本文「作者×阿嬤」互動方式的變化？
      options:
        1: 噤聲不敢回→能提出不同想法→能幽默接住刻薄
        2: 噤聲不敢回→越來越反感→逐漸疏離對立
      answer: 1
      options_note: |-
        這兩題的「→」跟角色變化那題不同，是文字流裡真正的箭頭字元，照抄。
        另：原稿只在第 2 個選項印了「②」，第 1 個選項沒有印「①」（被 ☑ 佔位），
        下一題與第三大題也是同樣形狀 —— 照原樣，不補號。
    - type: guide
      text: 2.想法變化路線：
    - type: single
      prompt: 本文中「作者對阿嬤的想法」，變化歷程為何？(單選)
      options:
        1: 覺得被討厭→覺得溝通無用→決定遠離她
        2: 先求不挨罵→不再句句當真、看懂她的愛→理解脈絡並重新詮釋
      answer: 2
    - type: single
      prompt: 三、從上述作者觀點轉變歷程，本文最想提醒讀者的是什麼?(單選)
      options:
        1: 人不是被早期經驗決定的；我們可以選擇怎麼詮釋自己的童年
        2: 長輩多半愛挑剔，孩子只能忍耐，關係很難改變
        3: 心理韌性靠打罵養成，受過嚴格管教的人一定更強
        4: 當兵最能鍛鍊意志，因此比讀書更能改變一個人
      answer: 1

    - type: self_check
      label: ◎自我檢核
      instruction: 請你自己檢查以下3項，確定自己是否會推論角色關係與想法了
      items:
        - 1.我會根據對話、語氣、動作與反應，推論作者和阿嬤的關係。
        - 2.我會把文章線索前後連起來，推論角色關係變化歷程。
        - 3.我能從關係變化推到作者的觀點轉變，並進一步推論本文的主旨。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1~5 題都有
  questions:
    - index: 1
      answer: D
      stem: 作者在後段補寫阿嬤的成長背景（貧困、威權、階級、被罵而躲桌下），最主要的用意是什麼？
      options:
        A: 把責任推給那個日本警察，他才是造成悲劇的根源
        B: 為了讓故事更曲折熱鬧，以增加故事的戲劇張力
        C: 用阿嬤更辛苦的童年來對照，暗示作者不該計較
        D: 交代阿嬤的成長，開始理解她為何會這樣對待小孩
      teacher_hint: 阿嬤在威權與貧困的環境中長大，被大人用責罵對待，她長大後也容易用同樣方式說話。作者補上這段，是要引導讀者理解
      teacher_hint_note: 藍框內的句子在原稿就以「引導讀者理解」結束，沒有句號、話沒說完，照原樣。
    - index: 2
      answer: A
      stem: 第六段為什麼作者在當兵時，聽到鄰兵啜泣，會不屑地想：「哼，嬌生慣養！」又感謝起阿嬤來？
      options:
        A: 作者覺得班長再兇也不過如此，和阿嬤比起來不算什麼
        B: 作者覺得當兵就是要吃苦，哭出來只會讓家人更難過
        C: 作者覺得鄰兵是想博取同情，好讓班長對他放寬標準
        D: 作者知道成功嶺結訓後，阿嬤會煮一大桌好菜等他回家
      teacher_hint: 第2題解析：作者把班長的吼罵和阿嬤的嚴厲放在同一條尺度上比較，發現自己早已習慣高壓語言，因此覺得班長「也不過如此」。因這種承受力是童年被阿嬤訓練出來的，反而感謝阿嬤
      teacher_hint_note: 這一則藍框印在第七大題標題旁（PDF p10 右上），不在題目旁邊。
    - index: 3
      answer: C
      stem: 作者安排「阿嬤很兇、滿口髒話」與「晚餐滿桌菜、作者擁抱阿嬤」的對照，最主要是在凸顯什麼？
      options:
        A: 阿嬤既然出口粗魯，就不可能真的在乎家人
        B: 阿嬤情緒忽冷忽熱，讓人永遠摸不清她的心思
        C: 愛的表達不只靠言語，也可能藏在照顧與付出裡
        D: 作者懂得討好長輩，所以才換來比較好的對待
      teacher_hint: 作者用「對比」手法照讓讀者看見：同一個人可能用很粗的方式說話，卻用很實際的方式愛人
    - index: 4
      answer: C
      stem: 作者和阿嬤的關係，為什麼會從「又怨又怕、能逃就逃」變成可把阿嬤抱離地面、幽默反酸她？最可能的原因為何？
      options:
        A: 作者長大成為教授後，阿嬤改變了，比較不會罵人了
        B: 作者教會阿嬤心理學裡尊重接納小孩的現代教養觀念
        C: 阿嬤沒有改變，是作者開始正向詮釋自己的童年經驗
        D: 作者長大後，知道要忍耐、吃苦，才能提升家人關係
      teacher_hint: 阿嬤沒有改變，是作者長大後改變了理解與詮釋方式
    - index: 5
      answer: C
      stem: 有同學讀完後說：「這篇文章是在替打罵式教養背書，甚至鼓勵家長用打罵管教。」你認為最貼近本文立場的回應是什麼？
      options:
        A: 沒錯，因為作者最後很感謝，所以他真的在鼓勵打罵
        B: 沒錯，因為作者後來當教授，可見打罵管教很有效果
        C: 不對，本文未推廣打罵，只強調人不是早期經驗決定的
        D: 不對，作者完全否定童年經驗，所以教養方式不重要
      teacher_hint: 文章確實呈現體罰與惡言，但作者最後的焦點放在「詮釋」與「主體性」：同樣的經驗可能造成傷害，也可能被重新理解成某種力量。作者是在分享自己如何理解阿嬤，而不是在下指令說「打罵才對」

# ── 八 詞語複習 ────────────────────────────────────────────────
vocab_review:
