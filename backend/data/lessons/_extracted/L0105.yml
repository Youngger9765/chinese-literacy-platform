spotlight:
  strategy_name: 摘要策略──從人物發展找重點
  strategy_type: summary
  blocks:
    - type: concept_box
      text: |-
        本課是一篇記人的文章。這類文章常介紹一位重要或值得學習的人。
        記人文章常會描述人物經歷了什麼、怎麼面對困難，最後展現出什麼值得學習的地方。讀記人的文章時，可以先看作者怎麼安排人物經歷。
        本課我們用五個問題找重點：
          ❶一開始是什麼樣子？
          ❷怎麼開始行動？
          ❸遇到什麼困難？
          ❹中間有什麼重要改變？
          ❺最後有什麼成就，帶來什麼影響？
        這一課，我們要用這五個問題，整理珍古德長年研究、守護黑猩猩的過程。
    - type: fill_table
      label: 一、找到文章裡的人物發展
      instruction: 記人的文章常常按照人物經歷來寫。請你試著判斷全文9個自然段，各屬於人物發展的哪一部分。
      columns: [人物發展, 起點：夢想與準備, 契機：開始行動, 困難：遇到考驗, 改變：從防備到信任, 影響：成就與守護]
      rows:
        - 列: 自然段
          起點: 第【　】段
          契機: 第【2-3】段
          困難: 第【4-5】段
          改變: 第【5-7】段
          影響: 第【　】段
          blanks: [{answer: 1}, {answer: 8-9}]
      note: 教材已預填「2-3」「4-5」「5-7」，學生只需填首尾兩格
    - type: sub_block
      label: ❶找起點
      stem: 主角一開始的夢想是什麼？為何有這個夢想？（第1段）
      value: 珍古德小時候因為讀了《杜立德醫生非洲歷險記》，所以夢想著【　】。
      blanks: [{answer: 去非洲探險}]
    - type: sub_block
      label: ❷找「契機」
      stem: 開始行動的機會（第2.3段）
      items:
        - {index: 1, value: 珍古德23歲時到非洲，在【　】工作。, blanks: [{answer: 博物館}]}
        - {index: 2, value: 館長想【　】，她因【　】，獲得機會。, blanks: [{answer: 找人到岡貝研究黑猩猩}, {answer: 對動物的熱情得到賞識}]}
    - type: sub_block
      label: ❸找「困難」
      stem: 研究初期遇到哪些考驗？（第4.5段）
      items:
        - index: 1
          stem: 她遇到什麼阻礙或考驗？
          table:
            columns: [困難描述, 困難類型]
            options: {1: 環境危險, 2: 研究困難, 3: 身體考驗}
            rows:
              - {困難描述: 森林中有險峻的山壁、密林。, answer: 1}
              - {困難描述: 黑猩猩行動迅速，不知道如何追蹤。, answer: 2}
              - {困難描述: 有時還得面臨花豹和毒蛇的威脅。, answer: 1}
              - {困難描述: 黑猩猩拒人於千里之外，只能用望遠鏡觀察。, answer: 2}
              - {困難描述: 研究工作三個月沒有太大進展。, answer: 2}
              - {困難描述: 她和媽媽同時得了瘧疾。, answer: 3}
        - index: 2
          stem: 將珍古德研究初期的困難精簡為一句話。
          options:
            1: 研究初期，珍古德面對森林危險、研究不順利和感染瘧疾等多重困難。
            2: 研究初期，珍古德最主要的困難是森林危險，其他困難只是補充細節。
          answer: 1
    - type: sub_block
      label: ❹找「改變」
      stem: 黑猩猩和珍古德的關係怎麼變化？（第5～7段）
      table:
        columns: [課文線索, 黑猩猩態度(1~4) / 珍古德理解(5)]
        rows:
          - {課文線索: 黑猩猩拒人於千里之外，她只能用望遠鏡觀察。, options: {1: 防備, 2: 接納, 3: 信任}, answer: 1}
          - {課文線索: 三隻黑猩猩看到她，不像過去那樣驚慌逃開。, options: {1: 防備, 2: 開始接納, 3: 信任}, answer: 2}
          - {課文線索: 越來越多黑猩猩接受她的存在，在她附近活動。, options: {1: 防備, 2: 接納, 3: 關心}, answer: 2}
          - {課文線索: 一隻公猩猩溫和地握了她的手指一下。, options: {1: 防備, 2: 觀望, 3: 信任}, answer: 3}
          - {課文線索: 珍古德知道黑猩猩有感情、會痛苦、會悲傷，也能與人交流。, options: {1: 觀察, 2: 紀錄, 3: 更深理解}, answer: 3}
      tail:
        stem: →將黑猩猩和珍古德的關係變化精簡為一句話。
        options:
          1: 黑猩猩從防備、接納，到慢慢信任她，讓她更了解黑猩猩。
          2: 珍古德用堅果接近黑猩猩，所以黑猩猩很快信任她。
        answer: 1
    - type: sub_block
      label: ❺找「影響」
      stem: 人物最後有什麼成就？帶來什麼影響？
      value: 珍古德成為有名的黑猩猩【　】，並成立【　】，推動【　】和【　】。
      blanks: [{answer: 研究專家}, {answer: 國際珍古德協會}, {answer: 動物保育}, {answer: 環境教育}]
    - type: sub_block
      label: 三、統整
      stem: 本文重點摘要
      instruction: 前面已經找出「起點、契機、困難、改變、影響」的重點，請選出最適合當作本文重點摘要的一句話。
      options:
        1: 珍古德小時候喜歡《杜立德醫生非洲歷險記》，長大後終於到非洲研究黑猩猩。
        2: 珍古德從小嚮往非洲，後來得到研究黑猩猩的機會；雖然研究初期遇到許多困難，她仍慢慢取得黑猩猩的信任，最後成為研究專家並投入保育工作。
        3: 珍古德克服森林危險和瘧疾，最後取得博士學位，成為有名的黑猩猩研究專家。
      answer: 2
    - type: self_check
      title: ◎自我檢核
      instruction: 如果你有做到，請在□中打勾。
      items:
        - 1.我知道記人的文章常按照人物經歷來寫。
        - 2.我能看出文章安排了哪些重要歷程。
        - 3.我能用本課的「起點、契機、困難、改變、影響」，找出珍古德人物發展的重點。

comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 小雅騎車跌倒，膝蓋在柏油路上摩擦受傷，傷口「深不可測」
        B: 小麗參加運動會的百公尺短跑，「馬不停蹄」的奪得第一名
        C: 小洛因為口渴，便到冰箱隨手拿了一瓶「夢寐以求」的水來喝
        D: 爸媽時常「掛慮」離家住校的小成，擔心他飲食或作息不夠正常
    - index: 2
      answer: C
      stem: 根據本文第六段，為什麼珍古德能確認黑猩猩和她交心了呢？
      options:
        A: 黑猩猩撇開臉是因為害羞，代表牠接受了珍古德
        B: 黑猩猩用動作示意，珍古德因此了解牠不喜歡紅堅果
        C: 雖然黑猩猩不要堅果，卻依舊做出握手示好的動作
        D: 雖然黑猩猩一開始不要堅果，最後依然收下了堅果
    - index: 3
      answer: A
      stem: 根據本文，下列選項哪一個最能描述珍古德的一生？
