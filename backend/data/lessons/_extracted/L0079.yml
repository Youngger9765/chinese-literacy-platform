# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 從具體事實提取上位概念
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）與橘色手寫字，PDF p8~p9 可見
  structure_note: |-
    ⛔ 三張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: |-
        寫作時，作者常用具體事實或例子來說明一個概念；閱讀時，我們則要反過來，把多個具體事實的細節合起來，提取出這些具體事實共同顯示的上位概念。這樣才能不只看見細節，還能讀懂整體。來看底下這兩個定義：具體事實：文章中看得到的時間、數量、行為或事件。
        上位概念：把多個事實合起來說出的整體意思，例如「負擔沉重」「症狀惡化」。

    - type: fill_table
      prompt: 一、以下讓我們先練習用常見的「具體事實」提取出「上位概念」，注意，上位概念可以是名詞，也可以是形容詞。
      columns: [具體、可觀察的各種事實, 在最右欄選出適當的上位概念填入【　】, 上位概念選項]
      answer_carrier: 橘色手寫的圈碼（①~⑥），PDF p8 可見
      option_bank_note: |-
        🔴 **兩組選項各自獨立編號**：第 1~3 題用「名詞」那組，第 4~6 題用「形容詞」那組。
        同一個圈碼在兩組是不同答案（④在名詞組是「多樣性」、在形容詞組是「謹慎」）。
        原稿把兩組分別印在第 2 列與第 6 列的最右欄，中間用一條粗線分開。
      rows:
        - 具體、可觀察的各種事實: |-
            示例：
            他早睡早起，每天慢跑，會留意自己一天水分的攝取，而且完全不碰含糖飲料。
          在最右欄選出適當的上位概念填入【　】: |-
            示例：
            他很注意自己的【　】
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ３}]
          上位概念選項: |-
            名詞：
            ①基礎建設
            ②安全
            ③健康
            ④多樣性
            ⑤交通通訊
            ⑥適應力
        - 具體、可觀察的各種事實: 1.剛轉學時，小凱人地不熟，但他主動交朋友、了解新學校的規定，現在已習慣新生活了。
          在最右欄選出適當的上位概念填入【　】: 小凱展現很強的【　】
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ⑥}]
        - 具體、可觀察的各種事實: 2.強烈地震後，○○鎮無法對外聯絡，橋樑崩塌、鐵公路不通、機場關閉、4.3萬戶停電。
          在最右欄選出適當的上位概念填入【　】: |-
            ○○鎮的【　】
            已經陷入孤立
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ⑤}]
        - 具體、可觀察的各種事實: 3.班上有人擅長運動，有人喜歡畫畫，有人善於計算，有人領導力佳，有人表達能力很好。
          在最右欄選出適當的上位概念填入【　】: |-
            班上同學的特質
            具有【　】
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ④}]
        - 具體、可觀察的各種事實: 4.今天的回家作業有國文習作、數學課本、英文造句、自然複習卷，各科難度都很高。
          在最右欄選出適當的上位概念填入【　】: |-
            今天的回家作業
            非常【　】
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ②}]
          上位概念選項: |-
            形容詞：
            ①利弊並存
            ②繁重
            ③高科技
            ④謹慎
            ⑤困難
            ⑥聰明
        - 具體、可觀察的各種事實: 5.手機可以溝通、搜尋、看影片、玩遊戲、照相……，但它也使人們付出視力衰退的代價。
          在最右欄選出適當的上位概念填入【　】: |-
            手機是一種
            【　】的設備
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ①}]
        - 具體、可觀察的各種事實: 6.小安過馬路會先看左右來車；交卷時會逐題檢查答案；網購前會先比較價格和評價。
          在最右欄選出適當的上位概念填入【　】: |-
            小安是一個非常
            【　】的人
          在最右欄選出適當的上位概念填入【　】_blanks: [{answer: ④}]

    - type: fill_table
      prompt: 二、接著回到本課課文，下表整理了第二、三段所描述的具體事實，作者想要表達什麼上位概念？
      columns: [比較面向, 約5年前, 一年多前, 今年年初起, 情況的變化]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），PDF p8 可見
      rows:
        - 比較面向: 1.影響範圍
          約5年前: 主要影響家中的阿公
          一年多前: 主要影響家中的阿公
          今年年初起: |-
            到銀行大鬧，
            驚動警方
          情況的變化: |-
            ☑①範圍變大
            □②範圍變小
          情況的變化_options: {1: 範圍變大, 2: 範圍變小}
          情況的變化_answer: 1
        - 比較面向: 2.發生頻率
          約5年前: 2～3天一次
          一年多前: 1～2天一次
          今年年初起: 每天2～3次
          情況的變化: |-
            ☑①頻率變高
            □②頻率變低
          情況的變化_options: {1: 頻率變高, 2: 頻率變低}
          情況的變化_answer: 1
        - 比較面向: 3.持續時間
          約5年前: 約1個鐘頭
          一年多前: 2～3個鐘頭
          今年年初起: 2～4個鐘頭
          情況的變化: |-
            ☑①時間變長
            □②時間變短
          情況的變化_options: {1: 時間變長, 2: 時間變短}
          情況的變化_answer: 1
        - 比較面向: 4.行為方式
          約5年前: 怪罪、責罵
          一年多前: 怪罪、責罵
          今年年初起: 揮菜刀、丟尖銳物
          情況的變化: |-
            ☑①危險性變高
            □②危險性變低
          情況的變化_options: {1: 危險性變高, 2: 危險性變低}
          情況的變化_answer: 1

    - type: single
      prompt: 5.作者想要描述的上位概念是？答：
      options:
        1: 精神症狀
        2: 性格特質
      answer: 1

    - type: single
      prompt: 6.阿嬤的情況隨著時間如何變化？答：阿嬤愈來愈
      options:
        1: 痛苦
        2: 嚴重
      answer: 2

    - type: free_text
      prompt: |-
        7.綜合第5、6題，用一句話整合第二、三段的上位概念，寫在【　】中：
        上位概念：隨著時間，阿嬤的【　】愈來愈【　】。
      blanks:
        - {answer: 精神症狀}
        - {answer: 嚴重}

    - type: fill_table
      prompt: 三、下表整理了第四段描述的具體事實，作者想要表達什麼上位概念？
      columns: [第四段的各種事實, 想表達的上位概念]
      answer_carrier: 橘色手寫字與紅色 ☑（w:sym），PDF p9 可見
      rows:
        - 第四段的各種事實: 1.我們生活拮据……週末兩天，我每天打工時數超過十二小時……有時甚至到晚上九點才下班……妹妹的負擔也同樣沉重。
          想表達的上位概念: 我們【　】的負擔非常沉重
          想表達的上位概念_blanks: [{answer: 經濟及工作}]
        - 第四段的各種事實: 2.阿公今年78歲了，沒有固定收入，表達也不清楚。
          想表達的上位概念: |-
            阿公的狀況不佳，
            ☑也無法解決阿嬤的問題
            □帶來阿嬤之外的新問題
          想表達的上位概念_options: {1: 也無法解決阿嬤的問題, 2: 帶來阿嬤之外的新問題}
          想表達的上位概念_answer: 1
        - 第四段的各種事實: 3.我們擔心阿嬤是否遭人控制，……，更害怕她被人拐騙簽寫契約或購物，而造成我們無法承擔的交易損失。如果她的病難以改善，後續的安置或照顧該怎麼辦？我們負擔得起嗎？
          想表達的上位概念: |-
            我們對現況與未來非常
            【　】
          想表達的上位概念_blanks: [{answer: 擔憂/害怕}]
        - 第四段的各種事實: 4.想到這些，我和妹妹常常哭泣，晚上難以入睡。
          想表達的上位概念: |-
            這一切，都讓我們覺得
            【　】
          想表達的上位概念_blanks: [{answer: 無助/不知怎麼辦}]

    - type: free_text
      prompt: 5.請把第1~4題右欄的上位概念整合在一起，成為第四段的上位概念。
      answer: 我們經濟及工作的負擔非常沉重，阿公的狀況不佳，也無法解決阿嬤的問題。我們對現在及未來非常擔憂，這一切都讓我們覺得無助。
      answer_carrier: 橘色手寫字（PDF p9）；文字層已填有同樣的答案

    - type: self_check
      label: ◎自我檢核
      no_correct_answer: true
      answer_carrier: 學生自填，原稿四格皆為空 □（無 w:sym F0FE）
      items:
        - 我能讀到同一段裡各種具體的細節
        - 我能提取各個具體細節共同要表達的上位概念
        - 我可以找一個適當的詞彙，為這個上位概念命名
        - 我知道這個上位概念可能是名詞，也可能是形容詞

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p10~p11）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: B
      stem: 下列語詞，何者使用正確？
      options:
        A: 多虧善心路人真誠的「拐騙」，小女孩才終於停止哭泣
        B: 阿公向營養師「諮詢」飲食建議後，才了解平常都吃太鹹了
        C: 他不僅錄取了柔道隊，還獲得學長的肯定，真是「雪上加霜」
        D: 在美麗的燈光與柔和的音樂中，他們夫妻「聯手」走進會場
      explanation: A.與真誠矛盾、C雪上加霜是指負面情境、D應為攜手。
      explanation_note: 原稿是一個浮動說明框，印在題目右上方
    - index: 2
      answer: A
      stem: 根據文章，為什麼作者要用寫信的方式表達？
      options:
        A: 作者在臺東讀大學，無法陪伴阿嬤就醫
        B: 作者口語表達能力不佳，擔心說明不清楚
        C: 阿嬤沒有病識感，所以作者先寫信偷偷告訴醫師
        D: 因為作者諮詢過懂法律的人，那人建議寫信
      explanation: (第一段有提到)
      explanation_note: 原稿印在選項 A 之後，斜體小字
    - index: 3
      answer: C
      stem: 請從信件中第二段推論，作者的「居中協調」，可能是指什麼作為或行動？
      options:
        A: 在阿嬤怪罪阿公時，擋在他們中間
        B: 向阿公、阿嬤抱怨自己和妹妹的困難
        C: 在阿嬤對阿公發脾氣時，努力安撫阿嬤
        D: 在醫院和家庭間協調，讓阿嬤願意就醫
      explanation: （從前後文可看出有作者和妹妹的「居中協調」會降低衝突次數，因此最能降低衝突的應該是C選項)
      explanation_note: 原稿是一個浮動說明框；左括號用全形、右括號用半形，照原樣保留
    - index: 4
      answer: A
      stem: 請從信件中上下文推論，作者在第五、六段提及想獲得法院的「監護宣告」，最可能的目的是下列何者？
      options:
        A: 讓阿嬤不會因為被拐騙而有金錢損失
        B: 讓阿嬤在外面行動時有法院的人員保護
        C: 讓家人可以知道阿嬤生活的一舉一動
        D: 向社區宣告，讓大家知道阿嬤生病了
      explanation: (文中有提及，作者希望申請監護宣告是為了「保護阿嬤也保護家人」，而根據前後文發生的狀況，A選項的保護應該最貼近阿嬤與家人的需求。
      explanation_note: 原稿是一個浮動說明框，左括號沒有對應的右括號，照原樣保留
    - index: 5
      answer: D
      stem: 根據文章判斷，若雷醫師回應了作者的請求，下列何者最可能發生？
      options:
        A: 阿嬤診斷的結果為精神與行為皆正常，返家休養
        B: 阿公被要求一起接受診斷治療，協助兩人相處
        C: 醫院直接報警，指出阿嬤是偷竊腳踏車的兇手
        D: 開立阿嬤的診斷書，並請社工師聯繫作者
      explanation: (根據最後作者提出的要求「開立診斷證明，向法院申請監護宣告」，與A矛盾，而「向社工師諮詢」則符合D的情境。
      explanation_note: 原稿是一個浮動說明框，左括號沒有對應的右括號，照原樣保留

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  target_words: [祈請, 與日俱增, 雪上加霜, 哄騙, 拮据, 病識感, 秋祺, 諮詢, 聯手, 錦上添花]
  target_words_note: 灰框 10 個詞，比本課語詞（9 個）多一個「錦上添花」—— 它是第三大題「雪上加霜」定義裡寫的相反詞。
  grid_size: [10, 10]
  grid:
    - 舒適區分你我奮力一搏
    - 伯合雪花冰富數哄騙執
    - 特加持上沮喪而黃前著
    - 生機盎然加散旗魚鬆聯
    - 活大同小異霜害秋收手
    - 諮滿與日俱增孤祺藏節
    - 詢貫口國字滿寂法傾性
    - 底徹合覆病識感外告訴
