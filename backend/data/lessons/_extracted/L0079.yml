# ── 一 讀全文—做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 在重要的地方、喜歡的語詞、句子或段落做記號。
  checklist_note: 第 2 條在 PDF p1 被文字方塊邊界裁掉尾字，印成「…段落做記」；文字層是完整的「做記號。」
  # 段號欄外的未編號文字，各自獨立欄位（不併進編號段落）
  preface: 前言：文字除了用來記錄與抒發外，也能成為我們尋求協助的方法，來看看一位19歲的大學生，如何用清楚的文字表達，為家中的困難帶來希望。(為保護隱私，本文所有的姓名都是假名)
  salutation: 雷醫師您好：
  paragraph_count: 7
  paragraph_split_note: |-
    段號欄印 **7 個號碼**（ㄧ二三四五六七），但課文儲存格裡有 **14 個 `w:p`**。對應關係：
    ・`w:p[0]` 雷醫師您好：           → salutation（未編號）
    ・`w:p[3]+[4]`                    → 第 3 段（「…必須用哄」／「騙的方式…」是同一段被換行拆開，
                                        「哄騙」一詞跨行斷開）
    ・`w:p[7]+[8]+[9]`                → 第 6 段（「…幫忙我們兩件事：」與它引出的「一、」「二、」兩項）
    ・`w:p[11][12][13]` 秋祺／署名／日期 → closing（未編號）
    這樣剛好 7 段。⛔ 不要把「一、開立診斷書」「二、協助我們聯繫社工師」當成獨立段落 ——
    那會變成 9 段，跟印出來的 7 個號碼對不上，念順順的 ☞ 索引就會偏。
  paragraphs:
    - idx: 1
      text: 我是病患蔡淑惠的孫女林麗怡，因在臺東讀大學，無法陪同阿嬤就醫，故想藉此信向您報告阿嬤就醫前的症狀，希望對後續的診斷與治療有所幫助。這封信也在向您求助——阿嬤的狀況帶來了許多我們無法解決的困難，也祈請您幫助我們。
    - idx: 2
      text: 我和妹妹是阿公阿嬤養大的，爸媽在我們小時候就離開了，家裡就只有四個人。約莫5年前，阿嬤開始會時常莫名對阿公發脾氣、怪罪阿公年輕時對她有多壞，頻率2~3天一次，每次約1個鐘頭。一年多前，我離家求學，妹妹多數時間在外打工，家裡少了我們居中協調，阿嬤發脾氣的次數與日俱增，增加為1~2天一次，每次2~3個鐘頭。更嚴重的是，從今年年初開始，阿嬤開始指控阿公偷她的錢，甚至認為阿公與銀行聯手騙她，因此跑到數間銀行大鬧，多次因有人報警而被帶離現場。此時，阿嬤發脾氣的頻率已攀升到每天2~3次，每次2~4個鐘頭，近來甚至會揮舞菜刀、朝阿公丟尖銳物品。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 3
      text: 讓我們非常困擾的除了上述行為外，她還時常遺失重要物品，例如這星期她將機車弄丟在外，之後又向鄰居借腳踏車外出，並且一樣弄丟。另外，阿嬤也出現搞不清楚狀況而不告而取的行為，目前家裡前前後後已有數萬元現金不知去向。雪上加霜的是，阿嬤沒有病識感，她不知道也不承認自己生病，這次我們要帶她到醫院，必須用哄騙的方式，才能帶她就醫。
    - idx: 4
      text: 我們生活拮据，我19歲，妹妹17歲，都要靠打工養活自己，週末兩天，我每天打工時數超過十二小時；而平日沒有課的時間也都塞滿了打工，有時甚至到晚上九點才下班，妹妹的負擔也同樣沉重。阿公今年78歲了，沒有固定收入，表達也不清楚。阿嬤的狀況令我們不知所措。我們擔心她是否遭人控制，才會總想著要拿家裡的錢？更害怕她被人拐騙，簽下契約或購物，造成我們無法承擔的交易損失。最後，如果她的病難以改善，後續的安置或照顧該怎麼辦？我們負擔得起嗎？想到這些，我和妹妹常常哭泣，晚上更是難以成眠。
    - idx: 5
      text: 我們諮詢過懂法律的人，他說我們若能取得醫師開立的診斷書，或許能夠向法院聲請監護宣告，以保護阿嬤，也保護我們一家人。
    - idx: 6
      text: |-
        總之，我們要拜託雷醫師，除了幫阿嬤治療之外，也希望您幫忙我們兩件事：
        一、開立診斷書：我們想向法院聲請監護宣告。
        二、協助我們聯繫社工師：我們想知道再來該怎麼辦？社會局會有哪些資源？以及還有哪些求助管道？
    - idx: 7
      text: 最後，還是要感謝您的協助，在凱旋醫院病床不足的狀況下，您仍緊急排出病床讓阿嬤入院，11月20日我們到凱旋急診時，若沒有病床，急診處理完就得回家，之後要再送她進醫院就幾乎不可能了。最後敬祝
  closing:
    - 秋祺
    - 林 麗 怡 敬上
    - 20XX/11/21
  # 課文右緣印的累計字數（從 ☞ 所在的第 2 段起算）
  running_char_counts: [28, 57, 85, 115, 142, 173, 202, 230, 258, 286, 316, 346, 375, 405, 417]
  char_count_note: |-
    🔴 **本課的字數欄是「逐行」不是「逐段」的，段界不會落在數字上** —— 跟 L0076／L0078 相反。
    實測：第 2 段 268 字，但 268 不在印出來的數字裡（最接近的是 258 與 286）。
    第 2 段＋第 3 段前半（`w:p[3]`，147 字）＝ 415；再加後半（`w:p[4]`，12 字）＝ 427。
    印出來的最後一個數字 **417** 落在 415 與 427 之間，也就是第 3 段最後一行的中途。
    ⛔ 所以**不能拿這欄反推段界**（skill §⑥.7 的警告在本課成立）。段界的依據是段號欄印的 7 個號碼。
    朗讀範圍：第 2~3 段，印出的累計字數 417。
  inline_marked_terms: [祈請, 與日俱增, 聯手, 雪上加霜, 病識感, 哄騙, 拮据, 諮詢, 秋祺]
  inline_marked_note: 以 `w:bdr color=auto`（黑框）標在課文裡的生難語詞，逐一由 XML 取得，共 9 個。
  underlined_terms: [蔡淑惠, 林麗怡, 臺東, 雷醫師, 凱旋, 這些, 哪些]

