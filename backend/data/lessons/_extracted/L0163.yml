# ── 一 文白句子比對 ──
sentence_matching:
  label: 一、文白句子比對
  instruction: |-
    請模仿例句作法：
    ❶閱讀原文；❷找出對應的參考句；❸在下方的[  ]寫上參考句代號。
  answer_carrier: 橘色數字（在文字層，但顏色只有解 rStyle 才看得到），PDF p2 可見
  example:
    文言: 崑山  顧寧人先生，生長世族
    answer: 8
    marker_note: 例句在參考句清單上是第 [8] 條，該條被劃掉並在左邊加了一個 ☞ 圖形（w:drawing）
  reference_sentences:
    1: 從小到老，從來沒有一天不讀書
    2: 年少時就擁有超越其他人的資質
    3: 到旅店稍微休息後，就翻找書箱拿書出來讀
    4: 他專注於研究古代的學問
    5: 出門時，車上一定要帶上幾箱的書隨行
    6: 從不曾表現出疲倦的樣子來
    7: 儒家的書及各種史書，差不多都能背誦
    8: 崑山有一位顧寧人先生，生長在世代做官的家族
    9: 他的精力超越一般人，沒有其他嗜好
  reference_sentences_note: |-
    ［１］～［７］的號碼印成全形，［8］［9］印成半形，原稿如此。
  items:
    - {文言: 少負絕異之資, answer: 2}
    - {文言: 潛心古學, answer: 4}
    - {文言: 九經諸史，略能背誦, answer: 7}
    - {文言: 。精力絕人，無他嗜好, answer: 9}
    - {文言: 自少至老，未嘗一日廢書, answer: 1}
    - {文言: 。出必載數簏自隨, answer: 5}
    - {文言: 旅店少休，披尋搜討, answer: 3}
    - {文言: 曾無倦色, answer: 6}
  items_note: |-
    括號的位置與原文的句號不完全對齊（「。精力絕人…」「。出必載數簏自隨」兩條把前一句的句號
    圈進括號裡），照原稿的括號範圍抄。另外「出必載數簏自隨」在這裡少了原文的「書」字
    （原文是「出.必載書.數簏.自隨」），是原稿括號內的寫法，照抄不補。

