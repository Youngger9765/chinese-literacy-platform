# ── 三 文章重點表 ──
keypoints:
  label: 三、文章重點表
  intro: |-
    <愛讀書的顧寧人>的課文內容寫的是一位愛讀書的人，「他的背景」、「他是怎麼樣的人」、「他做了什麼」的文章。這跟白話文的寫法是一樣的。
    讀文言文時，我們可以善用文章的結構來幫助我們讀文言文喔。我們一起根據寫人的結構，來整理文章重點。
  layout: list
  answer_carrier: 橘色手寫（在文字層，顏色只有解 rStyle 才看得到），PDF p3 可見
  rows:
    - label: 主角
      value: 【　】
      blanks: [{answer: 顧寧人}]
    - label: 背景
      items:
        - label: 居住地
          value: 【　】
          blanks: [{answer: 崑山}]
        - label: 家世背景
          value: 【　】
          blanks: [{answer: 世族/世代做官的家族}]
    - label: 特質
      value: 【　】，而且精力【　】。
      blanks: [{answer: 絕異之資/超越其他人的資質}, {answer: 絕人/超越一般人}]
    - label: 專長
      value: 【　】，九經諸史，都能背誦。
      blanks: [{answer: 古學/古代的學問}]
    - label: 嗜好：【　】
      value: 支持的證據有：
      blanks: [{answer: 讀書}]
      items:
        - label: '1'
          value: 自少至老，未嘗【　】。
          blanks: [{answer: 一日廢書/從來沒有一天不讀書}]
        - label: '2'
          value: 出必【　】數簏自隨，旅店少休，披尋搜討，曾無【　】。
          blanks: [{answer: 載書/帶上書}, {answer: 倦色/疲倦的樣子}]
  rows_note: |-
    「嗜好」那一列的標籤本身就含一個填空（【 讀書 】），跟其他列不同 —— 原稿如此。
    表格欄名是「元素／內容摘要」。

# ── 四 文言文聚光燈 ──
spotlight:
  label: 四、文言文聚光燈
  strategy_name: 認識文言文—一字多義：少
  strategy_type: classical_chinese
  answer_carrier: 橘色代號（在文字層，顏色只有解 rStyle 才看得到），PDF p4 可見
  blocks:
    - type: concept_box
      text: |-
        讀完了這一課，你是否發現到文言文經常有「一字多義」的特性，意思是「一個字，有多種解釋」。例如課文中的「少」字就是這樣。
        以下是「少」字的多義整理：

    - type: table
      columns: [多義字, 讀 音, 意 思, 例 句, 例句解釋]
      rows:
        - [少, ㄕㄠˇ, Ａ稍微, 旅店少休, 到旅店稍微休息後]
        - [少, ㄕㄠˇ, Ｂ缺少或很少, 但少閑人如吾兩人耳, 只是缺少有閒情的人像我們兩人罷了]
        - [少, ㄕㄠˋ, Ｃ小或年幼、年輕的, 少負絕異之資, 年少時就擁有超越一般人的資質]
      rows_note: |-
        原稿的「多義字」欄只在第 1 列印「少」、「讀 音」欄 ㄕㄠˇ 跨前兩列合併，
        本檔為了讓每一列自成一筆而把合併欄的值補齊；欄名照原稿（含中間的全形空格）。

    - type: exercise
      instruction: 換你試試看！下面的每個句子都有「少」，請利用上表查找合適的意思，再將代號填入(  )中。
      items:
        - {type: free_text, prompt: 1.「少」不更事。, answer: Ｃ}
        - {type: free_text, prompt: 2.陳涉「少」時，嘗(曾經)與人傭耕(替人種田)。, answer: Ｃ}
        - {type: free_text, prompt: 3.聽僕(我)之所為，「少」安勿躁(不要急)。, answer: A}
        - {type: free_text, prompt: 4.兒(小時候)能騎羊，引(拉)弓射鳥鼠；「少」長(長大)則射狐兔。, answer: Ａ}
        - {type: free_text, prompt: 5.遙知兄弟登高處，遍插茱萸「少」一人。, answer: B}
        - {type: free_text, prompt: 6.濟從騎(隨從)有一馬，絕(非常)難乘，「少」能騎者。, answer: Ｂ}
      answer_note: |-
        六題的答案代號原稿全形半形混用（Ｃ／Ｃ／A／Ａ／B／Ｂ），照原樣抄，不統一。

# ── 五 閱讀理解 ──
comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（在文字層，顏色只有解 rStyle 才看得到），PDF p5 可見
  questions:
    - index: 1
      stem: 下列成語，何者最適合用來形容顧寧人先生的讀書態度？
      options:
        A: 旁徵博引
        B: 溫故知新
        C: 孳孳不倦
        D: 披星戴月
      answer: C
      explanation: |-
        第1題解析：
        表達想法時，廣泛引用材料，做為證據說服人。
        一邊複習已經學過的，同時有學習新的。
        勤於讀書或工作。孳孳，勤勉不懈。孳，音ㄗ。
        早早出門，很晚才回家，非常辛苦的意思。
      explanation_note: 解析方塊在 PDF p5 上逐項對到 A~D，但文字層沒有印 A./B./C./D. 前綴，照文字層抄
    - index: 2
      stem: 有關顧寧人先生的描述，下列何者沒有在本文中提及？
      options: {A: 家世背景, B: 興趣嗜好, C: 資質稟賦, D: 學術地位}
      answer: D
    - index: 3
      stem: 下列選項，何者無法證明顧寧人是愛讀書的人？
      options:
        A: 生長世族，少負絕異之資
        B: 潛心古學，九經諸史，略能背誦
        C: 自少至老，未嘗一日廢書
        D: 旅店少休，披尋搜討，曾無倦色
      answer: A
    - index: 4
      stem: 下列何者是本文主旨？
      options:
        A: 敘述顧寧人優秀不凡的資質
        B: 讚美顧寧人勝過一般人的精力
        C: 推崇顧寧人勤勉好學的精神
        D: 介紹顧寧人顯赫尊貴的家世
      answer: C
    - index: 5
      stem: 「旅店少休」的「少」，與下列哪一選項的「少」字意思相同？
      options: {A: 老「少」咸宜, B: 「少」安勿躁, C: 「少」管閒事, D: 積「少」成多}
      answer: B
      explanation: |-
        第5題解析：
        A年幼的人；B稍微；C不要；D很少、不多的。
