# ── 古文今譯 ──
modern_translation:
  label: 古文今譯
  paragraphs:
    - 崑山有一位顧寧人先生，生長在世代做官的家族，年少時就擁有超越其他人的資質，他專注於研究古代的學問，儒家的書及各種史書，差不多都能背誦。
    - 他的精力超越一般人，沒有其他嗜好，從小到老，從來沒有一天不讀書。出門時，車上一定要帶上幾箱的書隨行，到旅店稍微休息後，就翻找書箱拿書出來讀，從不曾表現出疲倦的樣子來。

# ── 原文（含斷詞點）＋注釋 ──
classical_text:
  label: 原文
  source: 清朝・潘耒
  has_qr: true
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  paragraphs:
    - 崑山.顧寧人.先生，生長.世族，少負.絕異之資，潛心古學，九經.諸史，略能.背誦。
    - 精力.絕人，無他.嗜好，自少.至老，未嘗.一日.廢書。出.必載書.數簏1.自隨，旅店少休，披尋.搜討，曾無.倦色。
  annotations:
    - {"no": 1, term: 簏, text: 竹子編成的箱子。}

# ── 朗讀計時（不佔大題號）──
key_reading:
  label: 朗讀計時
  instruction: |-
    1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
    2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  timing_table:
    columns: [第1次計時, 第2次計時, 第3次計時, 裁判計時]
    unit: 秒
    judge_signature: true
  benchmark_note: ◎ 我的表現：請確認讀完全文的時間。不要太快也不要太慢，不漏字或加字，斷詞的位置也要正確哦！
