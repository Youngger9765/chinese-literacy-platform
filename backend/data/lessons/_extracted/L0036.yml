# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 5
  paragraphs:
    - idx: 1
      text: 2024年，臺灣在世界12強棒球賽一舉拿下冠軍，棒球，作為臺灣的「國球」，又再次讓臺灣躍上世界舞台，被世界看見。說到臺灣棒球的輝煌歷史，很多人會想到「紅葉少棒隊」和電影《KANO》裡的「嘉義農林棒球隊」。但你知道嗎？臺灣第一支踏上日本甲子園球場的棒球隊，是來自花蓮、全由阿美族原住民組成的「能高團」。早在一百多年前，這支球隊就已在日本嶄露頭角。
    - idx: 2
      text: 時間回到日治時代的1921年。為了讓更多人認識花蓮港，花蓮港的廳長江口良三郎找來從事棒球運動的臺灣人林桂興，請他組一支球隊。當時，花蓮的棒球場上幾乎清一色是日本人的身影。某天，林桂興走在秀姑巒溪畔，看到一群在河邊嬉戲的原住民少年，腦中浮現了一個大膽的想法──如果這些孩子組成一支球隊，會有怎樣的可能？於是，他招募了一群阿美族少年，成立了「高砂棒球隊」。這群來自山林的青年，沒受過正統訓練，也沒有華麗的裝備，卻靠著驚人的體能與默契，在短短兩年內，竟能和當時的頂尖球隊平起平坐，讓人跌破眼鏡。後來，這群少年進入花蓮港農業補習學校（今天的花蓮高農）就讀，球隊改名叫「能高團」。「能高」指的是坐落在花蓮港正西方30公里處的能高山，和當時的新高山（玉山）、次高山（雪山）並稱「臺灣三高」。這座山也是原住民常去打獵的地方，球隊用這個名字，正好凸顯球員的原住民出身。
    - idx: 3
      text: 1925年，這群來自花蓮的年輕阿美族球員，懷抱著緊張又興奮的心情前往日本。首戰面對豐島師範棒球隊，他們一開場就像脫韁野馬般猛攻，前四局就以28比0大幅領先，讓裁判不得不提早結束比賽。第二場比賽，能高團對上東京的強隊，最後打成平手，讓日本觀眾非常驚訝。能高的隊員在場上用阿美族語打暗號，不僅讓對手摸不著頭緒，連裁判都聽不懂，而他們揮棒的力道和傳球的速度，更讓日本觀眾忍不住瞪大了眼睛。賽後，他們獲得「若武者」的稱號，也就是「年輕的武士」，彷彿從山林裡走出的戰士。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 4
      text: 此次訪日後，有些表現傑出的主力球員便受邀加入日本球隊。其中，伊藤正雄（本名羅沙威，戰後改名莊初明）在大學畢業後，回到花蓮擔任小學棒球教練，「伊藤先生」以嚴格著稱，對訓練一絲不苟，也因此培育出許多傑出的棒球選手，至今仍受到後輩敬仰。他把一代又一代的選手帶上了舞台，也把原住民的棒球夢，一棒一棒傳了下去。
    - idx: 5
      text: 1981年，阿美族的棒球選手郭源治加入日本職棒。儘管相隔60年，日本媒體仍以「高砂、能高的後代來了！」當作標題，由此可知，當年能高團使日本人印象深刻。當年那群站上甲子園的少年，或許沒想過自己會成為臺灣棒球的起點，更成為一段民族記憶。能高團不只是臺灣棒球通往國際舞台的先驅，更是原住民族的驕傲。
  # 課文右緣印的累計字數（從 ☞ 所在的第三段起算）
