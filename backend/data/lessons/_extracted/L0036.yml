# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 這位發明家開啟全新的研究方向，是研發綠能的「先驅」
        B: 這家公司產品以品質不佳「著稱」，受到許多消費者批評
        C: 小孩子洗完澡後，常常「一絲不苟」在房間裡跑來跑去
        D: 他個性內向，不喜歡「嶄露頭角」，但做事十分認真負責
      option_notes:
        A: (A)宜用「強出頭」
        B: (B)多用於正面敘述
        C: (C)宜用「一絲不掛」
      option_notes_placement_note: |-
        三個藍框註記在 PDF 上印在題號右側，未逐條對齊選項。依內容判讀：
        「多用於正面敘述」對應 B（用在負面語境）、「宜用『一絲不掛』」對應 C。
        而「宜用『強出頭』」語意上對應的是 D（不喜歡嶄露頭角），標籤寫 (A) 與內容對不上
        —— 標籤與內容何者為準無法從原稿判定，故照原樣記錄、不改也不列勘誤。
    - index: 2
      answer: C
      stem: 根據第三段「日本觀眾忍不住瞪大了眼睛」這句話最可能表達什麼意思？
      options:
        A: 觀眾想幫裁判找出對手犯規的證據
        B: 觀眾對規則不熟，不懂發生什麼事
        C: 觀眾對球隊的表現感到震驚與讚嘆
        D: 觀眾想表達對比賽結果的無法接受
      teacher_note: 從段三可看出能高團的表現令人出乎意料。
    - index: 3
      answer: B
      stem: 根據第五段，60年後能高團的故事仍被日本媒體提及，最可能的原因是什麼？
      options:
        A: 能高團的球員後來有多人加入日本職棒球隊
        B: 球員的表現超出當時他們對臺灣球隊的期待
        C: 能高團曾經擊敗過所有日本的頂尖棒球隊伍
        D: 他們比賽時使用阿美族語作為溝通暗號語言
      teacher_note: 第五段有提及「由此可知，當年能高團使日本人印象深刻」
    - index: 4
      answer: B
      stem: 本文以「2024年臺灣奪冠」作為引入，最主要的用意是什麼？
      options:
        A: 提醒讀者臺灣棒球的歷史源自於日治時期
        B: 引起讀者興趣並銜接到能高團的歷史地位
        C: 讓讀者對現代棒球情況有更多的深入了解
        D: 暗示能高團的組成與2024年的冠軍隊有關
      option_notes:
        A: (A)奪冠隊伍和日治時期無關
        C: (C)文章主題不是聚焦在現代棒球
        D: (D)沒有提及
    - index: 5
      answer: D
      stem: 「2021年，臺灣體操選手李智凱在東京奧運男子鞍馬決賽中，以招式『湯瑪士迴旋』獲得銀牌，創下臺灣在奧運體操項目的最佳成績，被媒體稱為『鞍馬王子』。」根據本段文字，下列內容對應的上位概念何者正確？
