# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 從具體描述提取上位概念
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        上一課，我們學會：看到文章裡的具體描述時，可以先想一想：「這些內容主要在說哪一方面？」再找出一個簡短的名稱，例如「外型、目的」。這個名稱就是「上位概念」。
        上位概念可以用來整理不同範圍的內容：
        一、找出句中細節的上位概念
        一句話裡的細節，也可以找出上位概念。
        例如：「日治時代的1921年，林桂興組了一支球隊。」
        其中，「1921年」主要在說球隊何時成立，上位概念是【成立時間】；「林桂興」主要在說由誰創辦球隊，上位概念是【創辦人】。
        二、找出整段內容的上位概念
        把一段文字合起來看，也可以想一想：「這一段主要在說什麼？」再用一個簡短名稱整理。這個名稱，就是整段內容的上位概念。
        例如，本文第3段，這段主要講的是「能高團第一次出賽的戰績」，這就是第3段的上位概念。
        這一課，我們練習第一個層次：從一句話裡的具體細節找出上位概念。
        例如：「他（林桂興）招募了一群阿美族少年，成立了高砂棒球隊。」

    - type: single
      label: 概念說明框內的示範題
      prompt: 文章中的「林桂興」就是球隊的
      options: {1: 隊員, 2: 對手, 3: 創辦人}
      answer: 3
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      layout_note: 本題與前後兩個 block 印在同一個外框內，不是獨立的一題

    - type: guide
      text: 「創辦人」就是我們從具體描述中提取的上位概念。

