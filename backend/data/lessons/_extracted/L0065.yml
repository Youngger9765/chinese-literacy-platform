# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法—倒反：讀懂反話
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）、橘色手寫字與橘色方框
  answer_carrier_bdr_note: |-
    第三種載體（框選語詞＝`<w:bdr>` 非 auto 顏色的字元框線）**本課有，而且就是下面那個
    fill_table 的 circled_terms**：全課 13 個 w:bdr run 裡，11 個是 auto（課文語詞的黑框），
    2 個是 `w:color="E97132" w:themeColor="accent2"` —— 正好是『雙喜臨門』與『好運』。
    已逐一比對過，沒有第三個非 auto 的框，也就沒有漏掉的框選答案。
  blocks:
    - type: concept_box
      text: |-
        有些話表面上像在稱讚或說好事，放回前後文，卻會發現真正意思剛好相反。這種故意用相反的話表達真正意思的寫作手法，叫作「倒反」，也就是常說的「說反話」。
        反話可以帶來幽默，也可以表達諷刺。文字中的反話有時會加上引號，但判斷時仍要連同前後文一起讀。
        反話若使用不當，也可能讓人誤會或感到不舒服。

    - type: guide
      text: 一、找出反話，讀懂真正意思

    - type: guide
      text: 圈出課文句子中使用倒反的語詞，再根據課文前後情境，完成右欄。

    - type: fill_table
      prompt: 圈出課文句子中使用倒反的語詞，再根據課文前後情境，完成右欄。
      columns: [課文句子, 字面意思和真正意思]
      answer_carrier: 「圈出倒反語詞」的答案是**橘色方框**（w:bdr 字元框），不是勾選；右欄空格是橘色手寫字
      circled_terms: ['『雙喜臨門』', '『好運』']
      circled_terms_note: |-
        這兩個就是「圈出課文句子中使用倒反的語詞」的答案 ——
        原稿把它們用橘色方框標在左欄的課文句子上（PDF p5 可見）。
      rows:
        - 課文句子: 運動防護員詹老師說：「哈哈，少見少見，你右腿『雙喜臨門』，不但腳踝扭傷，小腿也抽筋了。」
          字面意思和真正意思: |-
            字面意思：同時遇到兩件喜事
            真正意思：同時受了兩種傷，實在很【　】
          字面意思和真正意思_blanks: [{answer: 倒楣}]
        - 課文句子: 你最後一跳用盡全力，可能就是在那時抽筋了。偏偏又因為碰撞跌倒，扭傷了腳踝，這樣的『好運』，真的很少見啊。
          字面意思和真正意思: |-
            字面意思：運氣很好
            真正意思：同時扭傷與抽筋，運氣【　】。
          字面意思和真正意思_blanks: [{answer: 很差}]

    - type: guide
      text: 二、找證據，讀懂反話的作用

    - type: multi
      prompt: 1.哪些前後文線索可以幫助我們判斷，「雙喜臨門」是反話？（3選2）
      options:
        1: 皓祥的腳踝扭傷，小腿也抽筋
        2: 皓祥疼得直皺眉，聽完後苦笑了一下
        3: 隊友因為投進關鍵一球，興奮得擁抱、歡呼
      answers: [1, 2]

    - type: single
      prompt: 2.詹老師使用「雙喜臨門」和「好運」這些反話，主要有什麼作用？（單選）
      options:
        1: 真心祝賀皓祥同時遇到兩件值得高興的事
        2: 點出皓祥同時受了兩種傷，也讓語氣帶有幽默
        3: 表示皓祥的傷勢不嚴重，不需要特別處理
      answer: 2

    - type: guide
      text: 三、換你試試看

    - type: guide
      text: 1.下列句子都使用了倒反。請勾選句中說反話的語詞。

    - type: single
      prompt: 你騎車的技術真是高明，都騎到去撞電線桿了。
      options:
        1: 高明
        2: 撞電線桿
      answer: 1

    - type: single
      prompt: 你投籃真準，連投三球都沒碰到籃框。
      options:
        1: 真準
        2: 籃外大空心
      answer: 1

    - type: single
      prompt: 這麼簡單的題目居然會寫錯，你真是天才。
      options:
        1: 寫錯
        2: 天才
      answer: 2

    - type: guide
      text: 2.小安出門時忘了帶傘，才走出校門，天空就下起大雨。他全身淋得溼答答，抬頭說：「我今天的運氣真好！」

    - type: single
      prompt: (1)「運氣真好」真正想表達什麼？（單選）
      options:
        1: 小安很喜歡淋雨，覺得今天特別幸運
        2: 小安沒帶傘又遇到大雨，覺得自己很倒楣
        3: 小安想提醒同學，下雨天一定要帶雨具
      answer: 2

    - type: single
      prompt: (2)你是根據什麼判斷的？
      options:
        1: 只看「運氣真好」的字面意思
        2: 把「忘了帶傘、全身淋溼」和這句話合起來看
      answer: 2

    - type: guide
      text: ３.人際關係延伸題

    - type: multi
      prompt: (1)詹老師說反話後，皓祥雖然疼得直皺眉，卻苦笑了一下，沒有因這句話生氣。從這段互動可以推測，兩人的關係可能如何？（複選）
      options:
        1: 彼此熟悉
        2: 有一定的信任
        3: 彼此生疏
        4: 互相敵視
      answers: [1, 2]

    - type: multi
      prompt: (2)幽默也要看對象，下列哪些關係或情況比較適合說反話？（複選）
      options:
        1: 相處已久、了解彼此界線的朋友
        2: 第一次見面、還不了解彼此的陌生人
        3: 關係緊張、正在爭吵的同學
        4: 彼此信任、能理解對方玩笑的夥伴
      answers: [1, 4]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p7~p8）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: B
      stem: 請問下列句子內使用的詞語，哪一個使用正確？
      options:
        A: 她眉頭緊皺，冷汗直流，看起來似乎非常「放鬆」
        B: 他「全神貫注」的聆聽音樂，連門鈴響了也不知道
        C: 他品學兼優，表現良好， 令父母親「憂心忡忡」
        D: 期中考開始，監考老師一走進教室，全班同學立刻「哄堂大笑」
      option_corrections: {A: 痛苦, C: 驕傲, D: 鴉雀無聲}
      option_corrections_note: |-
        三個錯誤選項旁印有橘色的更正詞（教師版）。A「(痛苦)」與 C「（驕傲）」在文字流裡；
        D 的「鴉雀無聲」是浮動文字方塊，疊在該選項句末。
    - index: 2
      answer: B
      stem: 詹老師說皓祥的右腿「雙喜臨門」，真正想表達什麼？
      options:
        A: 皓祥投進關鍵一球，球隊也贏得比賽
        B: 皓祥腳踝扭傷，小腿也同時抽筋
        C: 隊友立即呼喊，防護員也趕來處理
        D: 皓祥完成背後運球，也成功突破防守
      explanation: 由第二段可知皓祥小腿抽筋及扭傷。
      explanation_note: 原稿是一個浮動說明框，印在選項 B、C 右側
      stem_note: 說明框寫「第二段」，該情節實際印在第 3 段（段號以學習單印的為準）。照原稿記錄，未更動。
    - index: 3
      answer: B
      stem: 下列關於 PEACE 原則的說明，何者正確？
      options:
        A: 保護（Protect）：把受傷部位抬高，幫助減少腫脹
        B: 壓迫（Compress）：由專業人員適度包紮，幫助抑制腫脹
        C: 避免（Avoid）：為加快復原，應立即恢復原本的運動量
        D: 抬高（Elevation）：認識恢復的進程、避免過度的壓力
      option_corrections: {A: 抬高, C: 保護, D: 教育}
      option_corrections_note: 三個錯誤選項句末印有橘色更正詞（教師版），都在文字流裡。
    - index: 4
      answer: A
      stem: 下列關於運動前暖身的說明，何者最符合課文？
      options:
        A: 暖身要循序漸進，並依運動內容、強度和個人狀況調整
        B: 運動強度越高，暖身時間越應縮短，以免提前感到疲累
        C: 暖身只需活動身體關節，不必讓心跳與呼吸逐漸加快
        D: 所有運動都應使用相同的暖身時間，才能完成充分準備
    - index: 5
      answer: C
      stem: 除了原篇名外，你認為下列哪一個也適合當作本文的篇名？
      options:
        A: 暖身活動的重要
        B: 如何提高心肺功能
        C: 扭傷時的應變
        D: 保養肌肉的方法
      explanation: 文章主旨在說明運動扭傷時可以怎麼做應變。
      explanation_note: 原稿是一個浮動說明框，印在選項 B、C 右側

