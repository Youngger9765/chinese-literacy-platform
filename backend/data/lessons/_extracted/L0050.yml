# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 10
  paragraphs:
    - idx: 1
      text: 十七世紀初，荷蘭是一個小小的國家，但它有大大的夢想。當時，來自亞洲的香料十分珍貴，一點點胡椒或肉桂就可以賣到很高的價錢。許多歐洲人想航行到遙遠的亞洲買香料，再帶回歐洲賣。
    - idx: 2
      text: 雖然出海遠航可能帶來很高的利潤，可是四百多年前，要展開一場長途遠洋探險可不容易：要造船、準備糧食、僱用水手。航行途中還可能遇到風暴和海盜，船員也可能生病或受傷。每一項都需要很多錢，這是一筆任何個人都無法單獨承擔的龐大費用。
    - idx: 3
      text: 這時，荷蘭人有了一個巧妙的構想——大家一起出錢，讓一家公司主導遠洋行動。於是，荷蘭東印度公司（Dutch East India Company）成立了，它是全世界第一家發行「股票」的公司。它把經營公司所需的資金分成許多小份，每一小份就是一張股票。如果人們認為這家公司會賺錢，就可以出錢認購股票，投資這家公司。只要有許多人投資，公司就能集到足夠的經費，組成船隊，揚帆啟航。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 4
      text: 「投資？那是有錢人的事吧？」你心裡也許會這樣問。
    - idx: 5
      text: 股票制度出現前，投資幾乎是君王和貴族的專利。但是，股票出現後，連平民百姓也能參與投資了。例如，假設一趟航行需要1000萬元，荷蘭東印度公司就發行了10萬張股票，每張股票100元。瑪莉是個傭人，她用工作多年存下的1000元買了10張股票；達安是個滿手老繭的水手，他用節衣縮食存下的5000元買了50張股票；奧倫治是個貴族，也是大富翁。他大手一揮，掏出5萬元買了500張股票。
    - idx: 6
      text: 買了股票後，瑪莉、達安、奧倫治和數以千計的平民百姓都成為公司的「股東」，也就是共同擁有公司的人。透過股票，連替人打掃的瑪莉，也可以參與投資了。
    - idx: 7
      text: 如果公司順利把香料帶回來，並從中獲利，就會把一部分利潤分給股東，這筆錢叫做「股利」。股東擁有的股票越多，分到的股利通常也越多。假如今年公司賺了很多錢，發放18%的股利，每張股票可以分到18元。瑪莉有10張股票，就可以領到180元的股利。看看以下的表格，你會更清楚每位股東今年各能領到多少股利。
      followed_by_table_note: 之後接「股利對照表」（見 body.inline_table）
    - idx: 8
      text: 假如瑪莉每年都領到180元股利，過了10年，她一共領到1800元。文森太羨慕了，於是他問瑪莉：「我用2000元跟你買你的股票好嗎？」如果交易談成了，瑪莉當時用1000元買的股票，現在可以賣2000元。若加上這10年的股利，你算算看，瑪莉一共賺了多少錢？
    - idx: 9
      text: 股票制度讓全世界的人看到了集資的力量，只要許多人願意各出一點錢，就能完成過去難以想像的大型計畫，例如造更大的船、開發新的貿易路線，甚至到遙遠的陌生國度，展開新的建設。
    - idx: 10
      text: 最後，荷蘭東印度公司集到龐大資金，派遣船隊遠航。1624年，船隊航行半個地球後來到臺灣，在臺南建立了熱蘭遮城（今天的安平古堡），統治臺灣長達38年。這支厲害的船隊，原來是股票制度撐起來的呢。
  # 課文第 7 段之後的股利對照表（原稿印在課文欄裡，屬課文的一部分）
