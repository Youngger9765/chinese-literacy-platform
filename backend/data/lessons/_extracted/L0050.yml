    - 積蓄獲繭滋溼豆揮股東
    - 溫蟲福利潤滑乳別資金
    - 潤繭力用集滿手投資便
    - 喉節衣縮食訓地盡其利
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
