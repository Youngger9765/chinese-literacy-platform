      direction: horizontal
    - word: 大手一揮
      cells: [[4, 5], [5, 6], [6, 7], [7, 8]]
      direction: diagonal_down_right
    - word: 滿手老繭
      cells: [[4, 7], [5, 6], [6, 5], [7, 4]]
      direction: diagonal_down_left
    - word: 集資
      cells: [[5, 2], [6, 3]]
      direction: diagonal_down_right
