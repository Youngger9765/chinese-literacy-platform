        - （段6）然而，保種中心卻因為他只有國中學歷，多次拒絕他。
        - （段7）阿介沒有就此放棄。為了跨過學歷這道門檻，中年的他決定重返校園，考上員林農工園藝科。這一次，他成為全班最認真的學生。對自己喜歡、擅長的事，他有一種「要做就做到最好」的執著。最後，他終於以學生身分進入保種中心，讓多年累積的能力有了發揮的機會。
      paragraphs_note: 原稿印（段6）（段7），第 7 段末印【停點C】

