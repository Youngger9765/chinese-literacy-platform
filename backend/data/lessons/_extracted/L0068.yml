        - （段2）但你知道嗎？阿介從小過動，不擅長與人相處，在課堂上總是坐不住，成績更是慘不忍睹，學習路上挫折不斷。長大後，他的工作也一直不穩定，四十四歲以前，只能靠打零工維生。所幸，他一直熱愛植物，也在大自然中找到了屬於自己的祕密花園。雖然在學校時課業不好，他卻沒有停止學習植物知識。植物圖鑑是他的精神糧食，遇到不懂的地方，他就請教專家，不斷汲取新知。日積月累，連拗口的植物學名也難不倒他。對植物的熱愛，讓他找到適合自己的學習方式，也奠定了日後成為植物獵人的基礎。
        - （段3）為什麼需要植物獵人呢？氣候變遷與人為開發不斷破壞棲地，使許多物種悄然從地球上消失。為了維持生態多樣性，科學家必須跟時間賽跑，趕在這些物種滅絕前，將它們保存下來，讓後世的科學家研究與復育。
        - （段4）但是，要在原始森林裡採集植物並不容易。森林裡的植物分布位置有高有低，有些接近地面，有些位在高大的樹木上。位置越高，採集就越困難，樹冠層的植物尤其難以取得。採集者不只要會爬山、爬樹，還要能在無水無電、杳無人煙的森林裡求生；同時，也得辨識物種，判斷哪些植物稀有或具有研究價值。能爬山、爬樹、在野外求生的人其實不少，熟悉植物的人也有，但能同時具備山林能力與植物專業的人少之又少，阿介正是其中的佼佼者。他走在樹上就像走在平地一樣自然，又有專業的植物知識，能和科學家溝通。多年累積的山林經驗與植物知識，使他成為許多植物專家心目中的不二人選。
        - （段5）2008年，辜嚴倬雲植物保種中心成立，需要植物獵人進行野外採集，以保存逐漸從野外消失，甚至瀕臨滅絕的物種。阿介很想進入保種中心，讓自己多年累積的山林經驗和植物專長，真正用在植物保育上。
      paragraphs_note: 原稿印（段1）～（段5），第 5 段末印【停點B】

    - type: self_check
      label: 【停點B】❶停一下，檢查理解
      items:
