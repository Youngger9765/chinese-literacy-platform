        讀到【停點E】，把找到的答案畫線。

    - type: passage
      label: 植物獵人
      paragraphs:
        - （段10）二十五年來，阿介一次次走進山林，總共採集了兩萬種植物。他完成許多植物學家難以獨自完成的野外採集，也成為多篇學術論文的作者之一。因為他的努力，許多珍稀植物有了被保存、研究與復育的機會，更多人也開始看見植物保育的重要。
        - （段11）而山林帶給他的，還不只是這些成就。過去，他在學校和工作中屢受挫折，嘗盡人情冷暖，甚至覺得自己這輩子就是一個衰人，人生看不出有什麼意義。然而，默默累積的山林經驗和植物專業知識並沒有白費。如今，他對各種植物的名稱與特性倒背如流，也能和研究人員用專業語言溝通。這份專業為他贏得尊重，也讓他找回失去已久的自信。
        - （段12）他曾說：「在社會中，我是個貧窮失敗的人。」但是，在森林裡，他不只保存了植物，也找回了自己，走出一條真正屬於自己的路。
      paragraphs_note: 原稿印（段10）（段11）（段12）—— 第一段的段號重複，見 source_errata E1；末段印【停點E】

