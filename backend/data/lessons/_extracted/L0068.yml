    - type: passage
      label: 植物獵人
      paragraphs:
        - （段8）進入保種中心後，他面對的困難並沒有結束。阿介每年將近三分之一的時間待在森林裡。為了採集稀有植物，他常帶著一把鐮刀，揹著四十公斤重的背包，獨自徒步進入山林十幾天。他要沿途砍路、辨認與採集植物、進行現場測量，並完整記錄數據。在茂密的山林中，他還必須快速掃視四周，認出稀有且瀕危的植物。
        - （段9）有人說，阿介從事的是全臺灣最危險的工作。為了採集植物，即使面對近乎垂直的峭壁，他也要冒著生命危險，想盡辦法爬上去。他曾一腳踩在枯枝上，從二十公尺高的樹上摔下；也曾在山林裡迷路，「在山上哭了三天」，才僥倖存活。他曾經兩天沒吃飯，只能吃腐木中的蟲。有一次，他受傷躺在地上，黃喉貂以為他死了，把他當成獵物；沒想到，他反而設下陷阱抓住牠，靠牠充飢，才活了下來。至於被虎頭蜂追，更是家常便飯。
        - （段10）有人問阿介：「植物獵人這份工作，賺錢不多，又辛苦又危險，為什麼還要繼續下去？」阿介回答：「有些事情還是必須要有人去做啊！」他最大的期望，就是讓瀕臨絕種的植物得到妥善照顧，在保種中心永續留存，甚至有朝一日能在野外成功復育。這也是他一次次走入危險山林的原因。
      paragraphs_note: 原稿印（段8）（段9）（段10），第 10 段末印【停點D】

