       ・瀕危 → 瀕 560／危 562 px，是「瀕臨」直框的左右兩道邊線；
         真的橫向瀕危圈會產生一個約 2 格寬的元件，元件清單裡沒有。
    ③ 紙外殘留：頁面右緣 x=1650～1653（頁寬 1654）有 3 個被裁掉的圖形
       （y=785～932／1027～1182／1265～1328，約 2、2、1 格高），只剩左邊緣印得出來。

    **roundRect 單向警報（先扣紙外殘留再比）**：XML 有 15 個 roundRect，
    其中 13 個在渲染上留下橘色（10 完整 + 3 被裁），另 2 個完全排到紙外、一個像素都沒有。
    扣掉這 5 個殘留後 **紙上 10 個 ＝ 路徑 10 條，不觸發警報**。
    （15 個裡有 2 個框線是硬寫死 `srgb E97132` 而非佈景 `accent2`，與其餘 13 個不同 ——
    那正是「排到紙外、從來沒被印出來」的殘留特徵。）
    ⚠️ 中途一度誤判成「紙上 12 > 路徑 10 → 少抓一條」，原因是只扣了看得見的 3 個殘留、
    漏扣完全隱形的 2 個。以逐格像素為準，沒有漏抓。

    🔴 **「posOffset 換算超過頁寬」這個判準抓不到本課的殘留**（實測）：
    本課 9 個 roundRect anchor 的 `positionH` 全是 `column`／`margin` 基準、
    位移介於 −0.2in ～ +0.4in，**沒有一個超過頁寬 7563600 EMU**，判準零命中；
    但像素證據明確有 3 個被裁在紙右緣、2 個完全不見。
    對照 L0069（判準的來源案例）：它那個殘留是 `relativeFrom="rightMargin"` + posOffset
    5264785，換算 6645910+5264785 = 11910695 EMU ＝ 13.0in，遠超頁寬 —— 判準命中。
    ⇒ 兩課是**兩種不同的溢出**：L0069 是「錨點自己被放到紙外」，
    本課是「錨點位移正常，但它掛在找字表格儲存格裡，排版時整個被推出去」。
    posOffset 判準只涵蓋前者。後者要靠像素（橘色是否觸及紙緣）才驗得到。
    共通的旁證是框線硬寫死 `srgb E97132`：L0069 那一個、本課那兩個都是，其餘全是佈景 accent2。

