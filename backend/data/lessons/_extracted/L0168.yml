# ── 一 讀全文-做記號 ──
body:
  title_line: 第2課  成為身體的最佳夥伴
  byline: 課文/學習單：張筱晴
  paragraph_count: 16
  paragraphs_note: 敘事對話體，第 3~9、11~14 段多為單句對話，故段數比同批其他課多一倍
  paragraphs:
    - {idx: 1, text: 「阿哲，你先下來休息！」教練一聲令下，把我從場上換下來。唉，又搞砸了！最近真的很奇怪，練球時總覺得身體特別沉重，怎麼都提不起勁。以前肌肉痠痛只要睡一覺就能恢復，現在卻兩、三天還是覺得卡卡。雖然只是友誼賽，我仍希望能留在場上，但以這種乏善可陳的狀況，會被換下來也是理所當然的吧！, errata_ref: E1}
    - {idx: 2, text: 正當我垂頭喪氣時，隊長走了過來，拍了拍我的肩膀說：「別想太多！趕快調整狀態比較重要！」我連忙道謝，這才忽然聞到他身上痠痛噴霧的味道。}
    - {idx: 3, text: 「學長是因為受傷所以沒上場嗎？」我擔心地問。}
    - {idx: 4, text: 「沒有啦！」他笑笑的搖搖手：「只是肩膀又痛了。本來以為可以瞞過教練，結果還是被發現。」}
    - {idx: 5, text: 「教練好厲害！」我不知道自己是讚嘆，還是哀嘆。}
    - {idx: 6, text: 「對啊！」他苦笑著說：「他唸了我一頓，說求表現之前，要先顧好身體，要做學弟們的榜樣。」學長這句話雖然不是在說我，卻不禁讓我思考──我的卡關，會不會也是因為我只想求表現，卻沒有「顧好身體」呢？}
    - {idx: 7, text: 「所以我最近覺得身體很力不從心，也是因為沒有顧好身體嗎？」我低聲說著腦中閃過的疑惑。}
    - {idx: 8, text: 「這樣吧！我等等要去找教練貼紮，你也一起來！」隊長爽朗的語氣讓我備受鼓勵。}
    - {idx: 9, text: 我點點頭：「好！謝謝學長！」}
    - {idx: 10, text: 回想起來，教練常叮嚀我們要按時補水、確實收操、早點休息，但我總當成耳邊風。總覺得裝水好麻煩，渴了再喝也沒關係；反正練完就要回家，沒收操似乎也無所謂。再加上訓練結束後還得寫作業，常常一忙就很晚，滑個手機又不知不覺過了十二點，熬夜已經是家常便飯。會不會，就是這些看似微不足道的習慣，慢慢對我的身體產生影響呢？}
    - {idx: 11, text: 「哦！阿哲也來啦！」教練一邊準備貼紮的用具，一邊熱絡的打招呼。}
    - {idx: 12, text: 「教練，我們的小學弟有煩惱想要請教您。」隊長先替我開了口。}
    - {idx: 13, text: 「什麼煩惱？最近都表現不好嗎？」教練一針見血的說，「你有好好放鬆、好好睡覺嗎？」}
    - {idx: 14, text: 我像瞬間被戳破的氣球，洩氣的搖搖頭。「可是他自主菜單都有認真練哦！」隊長急忙幫我緩頰。}
    - {idx: 15, text: 「我知道他很努力，」教練轉過身來說，「但放鬆跟休息也是訓練的一環。就像你，受傷還硬要上場，只會讓恢復時間拉長，反而影響到更重要的比賽。」教練說，「你們都很認真，也都會照顧隊友，但別忘了，你們還有一個最重要的夥伴──自己的身體。身為運動員，更要懂得照顧他，感謝他。如果只是一直使喚他、抱怨他，有一天他也會不理你喔！」}
    - {idx: 16, text: 離開辦公室後，我反覆想著教練的話。一直以來，我只希望自己的身體能更快、更有力量，卻從沒想過他需要什麼，或許，是學著傾聽他的聲音、學著成為他可靠的夥伴的時候了。}
  inline_marked_terms: [乏善可陳, 垂頭喪氣, 力不從心, 貼紮, 耳邊風, 家常便飯, 微不足道, 一針見血, 使喚]
  inline_marked_note: 課文中加了細方框的本課語詞，九個全部出現；另「熱絡」也加了框但不是本課語詞

