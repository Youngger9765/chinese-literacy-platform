# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 請問哪一個句子使用語詞正確？
      options:
        A: 在山頂欣賞夜景，城市「烽火漫天」，給人寧靜祥和之感
        B: 這所醫院戒備「森嚴」，任何人隨時都可以進入病房探病
        C: 他上學遲到，老師竟處罰全班，連無辜同學也受罰，真是「殃及池魚」
        D: 他總是在最後時刻才完成報告，真是「未雨綢繆」
      teacher_note: A.指戰爭。B. 前後矛盾。D.前後矛盾。
      teacher_note_carrier: 獨立文字方塊，浮貼在選項 C 右側
    - index: 2
      answer: D
      stem: 根據文章，何者不是建造末日種子庫的原因？
      stem_emphasis_note: 「不是」在原稿加了底線
      options:
        A: 因應大規模災害，預先儲備種子
        B: 若遇氣候變遷，有些基因會消失
        C: 全球戰爭發生，農作物容易滅絕
        D: 有恐怖攻擊時，可解決糧食短缺
      teacher_note: (第二段：末日種子庫是為了防止農作物的滅絕，並非解決糧食短缺的問題。)
      teacher_note_carrier: 獨立文字方塊，浮貼在選項 A 右側
    - index: 3
      answer: B
      stem: 根據本文，關於末日種子庫的說明何者正確？
      options:
        A: 種子所有權為挪威政府
        B: 低溫環境適合保存種子
        C: 目前還未有人取用種子
        D: 地理位置有利於取用種子
      option_notes:
        A: (所有權為儲存國)
        C: (中東國家已取用)
        D: (地理位置偏遠，位於北極圈)
      option_notes_carrier: 橘色小字，**直接寫在選項字串內**（與第 1、2、5 題的浮貼文字方塊不同）
    - index: 4
      answer: C
      stem: 作者為什麼希望「永遠沒有人需要使用斯瓦爾巴種子庫裡的種子」？
      options:
        A: 斯瓦爾巴種子庫地處偏遠北極，不方便人們使用
        B: 因為種子庫的成本太高，取用種子會耗費大量金錢
        C: 需要取用的話，通常表示某地發生大的災難
        D: 氣候變遷太快，可能種子庫到時已消失不見
    - index: 5
      answer: D
      stem: 下列選項，何者是文章的主旨？
      options:
        A: 臺灣重視農業，願意與國際組織來合作
        B: 全球戰爭頻傳，導致農作物快速的滅絕
        C: 斯瓦爾巴群島是最適合儲存種子的地方
        D: 介紹末日種子庫的功能，並提醒人們保護環境
      teacher_note: 由第八段可知，科學家未雨綢繆，運用科技為人類的生存而努力。所以先預防萬一，為人類儲存種子。
      teacher_note_carrier: 獨立文字方塊，浮貼在選項 A～C 右側

