            找到小主題後，從兩組內容中，找最重要的細節。
        - type: single
          prompt: |-
            1.在句❶～❹，哪一句最能說明低溫為什麼有利於長期保存種子？
            （單選）
          options: {1: 句❷, 2: 句❸, 3: 句❹}
          answer: 2
        - type: single
          prompt: 2.哪一句直接說明種子的包裝與密封方法？（單選）
          options: {1: 句❺, 2: 句❻}
          answer: 2
        - type: guide
          text: →句❺說明種子庫的容量，和「保存環境與方法」關係較遠，可以省略。
        - type: guide
          text: （三）整理成段落重點
        - type: free_text
          prompt: |-
            1.請把小主題和兩個重要細節精簡成一句話。
            種子庫利用【　】減慢種子的代謝活動，並將種子【　】，讓種子能長期保存。(答案合理即可）
          blanks:
            - {answer: 攝氏零下18度的低溫}
            - {answer: 真空包裝和三層鋁箔密封}

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出段落的小主題。
        - 2.我能依小主題選出重要細節。
        - 3.我能把小主題和重要細節整理成段落重點。

# ── 六 文章重點表 ──
