# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: 銀行是存錢的地方，你可知道，現在還有一種銀行，專門儲存來自世界各地的種子喔！
    - idx: 2
      text: 這個種子銀行的正式名稱叫做斯瓦爾巴全球種子庫，是挪威政府出資興建的非營利儲藏庫，2008年完工開放以來，裡面已儲存了數以萬計的種子包，用來保存全世界的農作物種子。
    - idx: 3
      text: 由於全球氣候變遷越來越劇烈，對生物多樣性造成威脅，不僅影響動物的生存，連植物也難以倖免。萬一發生區域性或全球性的大災害，某些農作物可能從此滅絕。興建種子庫，就是為了預防這樣的末日景象，保護農作物的多樣性，因此它也被稱為「末日種子庫」。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 4
      text: 低溫乾燥的環境有利於保存種子，這座種子庫因而建造在斯瓦爾巴群島永久凍土區的山脈內部。這裡是挪威最北邊的國土，位於北極地區，土地長年冰凍，氣候極為寒冷，像一座大型的自然冷凍庫。種子庫的溫度維持在攝氏零下18度，這樣的低溫可讓種子的代謝活動變慢，減少消耗，並維持發芽活性，最適合長期保存種子。即使停電或製冷機故障，永凍土也能讓內部溫度保持在零下8度左右。這個世界最大的種子銀行，最多可存放450萬種作物的種子。珍貴的種子要先經過真空包裝，再用三層鋁箔密封，才能上架。
    - idx: 5
      text: 這裡的戒備十分森嚴。如果你有機會進入內部，會先經過大約120公尺的隧道，再通過5扇有密碼裝置的門，才能進入地下的種子儲存庫。整棟建築位在海拔130公尺的地方，外牆的混凝土厚達1公尺，可承受芮氏規模6.2的地震和核子武器攻擊。即使冰川融化、海平面上升，也不會威脅種子的安全。
    - idx: 6
      text: 臺灣在2009年首度參與這項保存計畫。為了保存臺灣原生小米的基因多樣性，也就是保留各種小米不同的特徵，2024年臺灣科學團隊和三位排灣族代表特地前往北極，把象徵繁榮和幸福的小米種子存放在斯瓦爾巴全球種子庫。小米這類穀物能在惡劣的氣候條件下生長，抗旱又耐病蟲害，被視為極端氣候下有助於因應糧食危機的重要作物。
    - idx: 7
      text: 斯瓦爾巴全球種子庫的設計概念就像銀行。各國存放在裡面的種子，所有權仍屬於存放種子的國家；有需要時，可以把種子取回，讓種子從冷凍中甦醒後，再拿來播種。2015年，敘利亞發生內戰，烽火漫天，第一大城阿勒坡受到嚴重破壞，城裡的種子庫也遭到波及，真是殃及池魚。中東的研究人員於是從斯瓦爾巴全球種子庫取出存放其中的130箱種子。這也是末日種子庫成立以來，第一次有人取出種子的案例。
    - idx: 8
      text: 科學家未雨綢繆，運用科技為人類的生存而努力。我們每個人更要保護生態環境，也希望永遠沒有人需要使用斯瓦爾巴種子庫裡的種子！
