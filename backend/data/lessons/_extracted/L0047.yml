    第 8 段是全文唯一含非中文字元的段落（手打上標「1」「2」），差值也剛好是 1，
    ⚠️ 但我沒有查出 Word 究竟把哪一個字元算掉了，故**不臆測規則**。
    段界本身不受影響（三個檢查點吻合，且差值從 314 起就固定為 1、不再累加）。
    依 skill ⑥.7：這是字數口徑差異，不是抓錯段落，故**不**標 span_confidence: medium。
    中間的數字是逐行累計，不是段界，不要拿它反推段落。
  inline_marked_terms: [粗野陽剛, 溫柔婉約, 長袖善舞, 調度, 無虞, 度量, 使臂使指, 拜請, 調停, 指點迷津, 當面戳破, 心知肚明, 穿梭, 調停折衝]
  inline_marked_note: |-
    照 PDF 上的方框原樣記錄。第 5 段的「銜接無虞」被版面拆成兩個框（「無」在行末、
    「虞」在下一行行首），故此處出現「無虞」而不是「銜接無虞」——是排版換行造成的，
    不是教材把它當成兩個語詞（本課語詞框寫的是「銜接無虞」）。
  underlined_terms: [這些大嫂們默默收管著自己的丈夫, 臺灣社會]

