# ── 六 文章重點表 ──
keypoints:
  title: 工地大嫂
  title_note: 表格第一列的右欄印「工地大嫂」，左欄空白，是整張表的標題列。
  layout: list
  answer_carrier: 橘色手寫字；文字流的【　】內已填有答案
  rows:
    - label: 定義
      value: 作者稱六十歲以下，和丈夫一起來工地工作的女性叫大嫂。
    - label: 來工地的原因
      items:
        - label: 1
          value: 工地環境【　】，女性多半與父親、丈夫或兄弟同行，以確保安全。
          blanks: [{answer: 粗野陽剛}]
        - label: 2
          value: 大嫂往往早婚，年紀較【　】，學歷相對【　】。
          blanks: [{answer: 輕}, {answer: 不高/低}]
          blanks_note: 第二格教師版印「不高/低」，是兩個並列的可接受答案，照原樣記錄不拆。
        - label: 3
          value: 跟著丈夫進工地，不僅可多出一分勞力，也能【　】丈夫、照應工作。
          blanks: [{answer: 約束}]
    - label: 大嫂的類型
      items:
        - label: 1
          value: 互補型：丈夫技術好，但是好強高傲。大嫂們【　】，擅長【　】調度，使工程銜接無虞。
          blanks: [{answer: 長袖善舞}, {answer: 接案}]
        - label: 2
          value: 管束型：丈夫技術不錯，但個性較【　】。大嫂們會默默收管丈夫，使其工作穩定順暢。
          blanks: [{answer: 不穩定}]
        - label: 3
          value: 人脈型：大嫂極有【　】、人脈廣闊，可隨時調度各方人手協助趕工。
          blanks: [{answer: 度量}]
    - label: 大嫂在工地的功用
      items:
        - {label: 1, value: 【　】工人爭執。, blanks: [{answer: 調停}]}
        - {label: 2, value: 提供偏方與【　】給身體不適的工人。, blanks: [{answer: 藥物}]}
        - {label: 3, value: 協助【　】工地死亡的貓狗。, blanks: [{answer: 埋葬}]}
        - {label: 4, value: 工程順利時，帶工人同樂慶祝。}
        - {label: 5, value: 工程不順利時，下一步該怎麼做，大嫂會【　】。, blanks: [{answer: 指點迷津}]}
    - label: 總結
      value: 工地大嫂是臺灣社會中堅強、溫柔又美麗的女性縮影，值得眾人【　】。
      blanks: [{answer: 尊敬}]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫字；文字流已含答案
  questions:
    - index: 1
      answer: B
      stem: 請問哪一個句子使用語詞正確？
      options:
        A: 她「長袖善舞」穿梭舞台之中，優美的舞姿令人心動不已
        B: 當謊言被「戳破」的那一刻，他的臉瞬間漲得通紅
        C: 氣溫突然升高，我們把冷氣的「調度」到二十六度才舒服
        D: 新買的手機操作簡單，拍照也很清晰，功能「銜接無虞」
      teacher_note: |-
        第1題解析：
        A-長袖善舞表示社交手腕靈活，和舞姿無關。
        C-指調派、調整人力／物資／時間等（多用於工作安排）。
        D-通常形容兩件工作、計畫或流程之間接續順利，沒有接軌問題，此為誤用。
    - index: 2
      answer: A
      stem: 第八段提到：「即使她們心知肚明，也不願讓自己的丈夫出糗。」這句話的意思是什麼？
      options:
        A: 大嫂刻意保護丈夫體面
        B: 大嫂無法改善丈夫問題
        C: 大嫂不知道丈夫的缺點
        D: 大嫂很崇拜自己的丈夫
      teacher_note: (為了顧及丈夫的面子，即使知道問題，也不願意當場指出)
    - index: 3
      answer: C
      stem: 綜合第5至9段，下列哪一項最能說明大嫂在工地的核心功能？
      options:
        A: 監工驗收
        B: 行政核帳
        C: 協調與支援
        D: 專業設計
    - index: 4
      answer: D
      stem: 根據文中「約束丈夫、顧好工作」與「丈夫帶上妻子後有所收斂、能繼續接案」的說明，大嫂陪同丈夫工作，主要發揮什麼作用？
      options:
        A: 學習丈夫技術，準備日後自行接案
        B: 分擔丈夫勞務，提高工程施工速度
        C: 陪伴丈夫工作，維持家人相處時間
        D: 約束丈夫行為，協助工作穩定進行
      teacher_note: （第四段，作者提到大嫂陪在身邊，不但多一分人力，也能約束丈夫，顧好工作。）
    - index: 5
      answer: D
      stem: 下列哪一項是作者寫這篇文章的主要用意？
      options:
        A: 介紹工地常見的輩分稱呼與新手求生禮儀
        B: 男人粗野陽剛功夫一流，這是女人辦不到的
        C: 說明大嫂在工地的弱勢，希望推動性別平等
        D: 凸顯工地大嫂的多元能力並表達敬意
      teacher_note: 第五到十段，作者先介紹大嫂的功用與職場的重要性，最後結論是無比尊敬工地大嫂。

