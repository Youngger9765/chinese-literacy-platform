# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 10
  section_headings: []
  section_headings_note: 本課課文中間沒有分節小標（不同於 L0045/L0046），字數口徑因此不必扣小標。
  paragraphs:
    - idx: 1
      text: 像我這種在工地現場沒有靠山的年輕人，活下來的第一個先決條件就是「嘴甜」。總之是管工地的每個都叫「主任」，做工的每個都叫「師傅」，管便當、福利社的每個都叫「老闆」，司機每個都叫「老大」。這樣叫對了是上道，叫錯了是禮貌。
    - idx: 2
      text: 至於工地較少有的女性，全部都要年輕化。但凡四十歲以下的單身女生全部叫「妹妹」。六十歲以下，和丈夫一起來的叫「大嫂」，單獨一個人來的叫「大姊」，超過六十歲的，則都叫「阿姨」。嘴甜一點準沒錯。
    - idx: 3
      text: 在工地工作的女性，通常是和父親、丈夫、兄弟等家人或男友一起做。這種環境粗野陽剛，非常現實地不適合女性一人單獨前來。
    - idx: 4
      text: 工人師傅們往往早早結婚生子，對象也相對年輕。在妻子學歷也不大高的狀態下，跟著自己丈夫到工地是一個很自然的選擇，畢竟多一人在身邊，既能約束丈夫，也能顧好工作，這樣的狀態自然而正常。接連做上幾年後，有些工地現場的大嫂掌握了個別技能，甚至超越丈夫的也常有，甚至有令人驚嘆的技能和才華。
    - idx: 5
      text: 有些師傅功夫一流，技術絕精，但好強高傲。他在旁的妻子則是溫柔婉約，長袖善舞地負責接案調度，使他們夫妻倆工程銜接無虞，完全補上自己丈夫能力不足處，成為真正顧場，指揮調度的專業女性。
    - idx: 6
      text: 有些師傅技術可以，但個性不穩定，在工地就是愛喝、愛賭，帶上妻子後也都有所收斂，並且能繼續接案。這些大嫂們默默收管著自己的丈夫，前後調度，拉著顧著，讓丈夫不至於出大包，能穩穩地工作。
    - idx: 7
      text: 也有的大嫂極有度量，帶著娘家、夫家侄兒親戚等一同工作，徒子徒孫遍布整個行業，整個家族全靠她用一支電話聯繫，指揮調度使臂使指，喊水會結凍，喊米變肉粽。真正趕起工來，她們的人脈比我們營造廠還多、還廣。往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 8
      text: 在工地有人吵起架來，調停的常常是她們；在工地看見有人病痛時，分藥、提供偏方的是她們；工地有貓狗死亡，埋葬的還是她們，工程順利時，帶著下包師傅一同唱歌的也是她們。甚至工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在指點迷津。許多男人誇口技術好，卻連支票也不會開；有些男人炫耀力氣，卻無法說服業主1放款2。這種不為人知的細節，女人不當面戳破。即使她們心知肚明，也不願讓自己的丈夫出糗。
      inline_superscripts_note: 「業主」後的 1 與「放款」後的 2 是手打上標註腳標記，兩者都在文字流內。
    - idx: 9
      text: 我常常看著她們在工地的身影，那無可取代、又無比堅毅地在惡劣環境中工作，穿梭其間，調停折衝。這些女性完全就是台灣社會女性最為堅強、最為溫柔，又最為美麗的縮影。
    - idx: 10
      text: 我很尊敬這些在工地的大嫂，無比尊敬。
  source_note: 本課選自寶瓶文化出版的《做工的人》散文集。
  footnotes:
    - marker: 1
      term: 業主
      text: 稱土地房屋等產業的所有人。
      note: 文字流此條前面沒有上標「1」（只有一個空格），PDF 上有；標記本身不在文字層。
    - marker: 2
      term: 放款
      text: 銀行或機構借(貸)出資金。
  # 課文右緣印的累計字數（從 ☞ 所在的第 7 段起算）
  running_char_counts: [28, 58, 88, 118, 123, 151, 181, 211, 241, 271, 302, 314, 343, 373, 392, 410]
