# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略─整合證據，形成結論
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        上一課，我們學會找證據，看證據能支持什麼判斷。
        這一課，文章提出「昆蟲會不會思考」的問題，並提供兩項觀察。閱讀時，我們要找出真正能回答問題的證據，再把證據合起來，看看能形成什麼結論。

    - type: sub_block
      label: 一、先鎖定問題
      instruction: 一、先鎖定問題
      answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
      items:
        - type: single
          prompt: 這篇文章主要想回答什麼問題？（單選）
          options:
            1: 捲葉象鼻蟲和黃面蜂如何為幼蟲準備住處或食物？
            2: 昆蟲是否只會依循本能，還是也可能因情況改變做法？
            3: 捲葉象鼻蟲和黃面蜂的行為有哪些相同和不同？
          answer: 2

    - type: guide
      text: 二、找出行為怎麼改變

    - type: sub_block
      label: ㈠捲葉象鼻蟲：哪一項才是關鍵證據？
      instruction: ㈠捲葉象鼻蟲：哪一項才是關鍵證據？
      answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
      items:
        - type: single
          prompt: 1.文章寫了許多捲葉象鼻蟲的動作。哪一項觀察最能幫助我們回答「昆蟲會不會思考」？（單選）
          options:
            1: 母蟲會拉一拉葉片、推一推葉緣，測試葉片的彈性。
            2: 母蟲會在葉片上前進、後退、橫著走，測量葉片大小。
            3: 葉苞轉不動時，母蟲改把葉緣拉過來，包住並固定葉苞。
          answer: 3
        - type: guide
          text: |-
            →小提醒
            前兩個選項是母蟲平常都會做的事，可能是固定的本能行為。
            第③選項比較重要，因為牠在原來的方法無法成功時，改變了做法。
        - type: single
          prompt: 2.這項證據最能支持哪一項判斷？（單選）
          options:
            1: 捲葉象鼻蟲遇到困難時，會改變原來的做法來解決問題。
            2: 捲葉象鼻蟲一開始就知道葉苞會轉不動，已準備好另一種方法。
            3: 捲葉象鼻蟲反覆進行捲葉動作後，動作會變得更加熟練。
          answer: 1

    - type: sub_block
      label: ㈡黃面蜂：牠改變了什麼？
      instruction: ㈡黃面蜂：牠改變了什麼？
      answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
      items:
        - type: single
          prompt: 1.哪一組最完整呈現黃面蜂改變追逐方式的過程？（單選）
          options:
            1: 來回追逐幼蟲→幼蟲形成固定路線→繼續來回追逐→抓住幼蟲。
            2: 來回追逐幼蟲→幼蟲形成固定路線→改守葉苞開口→抓住幼蟲。
            3: 用觸鬚碰葉苞→幼蟲形成固定路線→加快速度追逐→抓住幼蟲。
          answer: 2
        - type: single
          prompt: 2.黃面蜂原本跟著幼蟲來回追逐，後來卻不再追逐，改守在開口處。這項觀察最能支持哪一項判斷？（單選）
          options:
            1: 黃面蜂只靠快速追趕，就能順利抓住葉苞裡的幼蟲
            2: 黃面蜂可能會因應幼蟲的行動規律，改變追逐方式
            3: 黃面蜂一開始就知道幼蟲會跑到開口，事先在那裡等待
          answer: 2

    - type: sub_block
      label: 三、合併證據，形成結論
      instruction: 三、合併證據，形成結論
      answer_carrier: 橘色手寫字與紅色 ☑（皆為圖形）
      items:
        - type: fill_table
          instruction: 1.整理兩項觀察
          sub_instruction: 請從下列選項中，選出適合的代號，填入表格的【　】中。
          option_bank:
            A: 葉苞怎麼轉也轉不動
            B: 把葉緣拉過來包住葉苞
            C: 幼蟲逐漸形成來回奔跑的規律
            D: 不再來回追逐，改守在葉苞開口
          columns: [觀察對象, 原來的做法, 遇到的新情況, 改變後的做法]
          rows:
            - 觀察對象: 捲葉象鼻蟲
              原來的做法: 旋轉葉苞，把它固定
              遇到的新情況: 【　】
              遇到的新情況_blanks: [{answer: A}]
              改變後的做法: 【　】
              改變後的做法_blanks: [{answer: B}]
            - 觀察對象: 黃面蜂
              原來的做法: 跟著幼蟲來回追逐
              遇到的新情況: 【　】
              遇到的新情況_blanks: [{answer: C}]
              改變後的做法: 【　】
              改變後的做法_blanks: [{answer: D}]
        - type: single
          prompt: 2.把兩項觀察合起來看，它們有什麼共同點？（單選）
          options:
            1: 遇到新情況後，仍照原來的方式繼續行動。
            2: 遇到新情況後，會調整做法，並達成目的。
            3: 遇到新情況前，已經安排好完整的行動計畫。
          answer: 2
        - type: single
          prompt: 3.根據前面兩項觀察，哪一個結論最適合？（單選）
          options:
            1: 這兩項觀察只顯示昆蟲的動作很複雜，還不能說牠們會調整做法。
            2: 這兩項觀察顯示，有些昆蟲可能會依情況調整行動，展現解決問題的能力。
            3: 這兩項觀察證明，所有昆蟲都能像人類一樣分析情況，事先安排完整計畫。
          answer: 2
        - type: multi
          prompt: 4.上題選項③有哪兩個地方超過文章提供的證據？（3選2）
          options:
            1: 文章只觀察兩種昆蟲，不能擴大成「所有昆蟲」。
            2: 文章只觀察昆蟲的行為，不能確定牠們像人類一樣分析和計畫。
            3: 文章顯示昆蟲會調整做法，不能說牠們具有解決問題的能力。
          answers: [1, 2]

    - type: guide
      text: →方法帶著走：先鎖定問題，再找出情況改變後的做法，最後整合證據，檢查結論有沒有說得太大。證據能支持到哪裡，結論就說到哪裡。

    - type: self_check
      label: ◎自我檢核
      instruction: 如果你有做到，請在□內打勾。
      items:
        - 1.我能從許多觀察中，找出真正能回答問題的證據。
        - 2.我能比較行為前後的變化，找出多項證據的共同點。
        - 3.我能根據證據形成結論，並檢查結論有沒有超過證據。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫字（圖形），文字流的（　）內已填有代號
  questions:
    - index: 1
      answer: C
      stem: 下列哪一項最能作為「昆蟲可能會因情況改變做法」的證據？
      options:
        A: 捲葉象鼻蟲母蟲在交配後，會尋找葉片並產卵
        B: 捲葉象鼻蟲會在葉片不同部位來回檢查葉片
        C: 葉苞轉不動時，捲葉象鼻蟲改用葉緣包住葉苞
        D: 黃面蜂會在野地尋找獵物，為幼蟲準備食物
    - index: 2
      answer: A
      stem: 文中捲葉象鼻蟲如何找出適合的葉子作為「育嬰室」，請排出正確的順序？
      sub_items:
        - ㄅ.在葉片不同部位來回重複檢查
        - ㄆ.測試葉片的彈性
        - ㄇ.仔細測量葉片的長度和寬度
      source_hint: （第二、三段）
      sub_items_note: 三個待排序的項目印在題幹下方一個獨立方框裡，選項則在方框外。
      options:
        A: ㄆ→ㄅ→ㄇ
        B: ㄅ→ㄆ→ㄇ
        C: ㄇ→ㄆ→ㄅ
        D: ㄆ→ㄇ→ㄅ
    - index: 3
      answer: D
      stem: 黃面蜂最後能抓到捲葉蛾幼蟲，最關鍵的做法是什麼？
      options:
        A: 用觸鬚碰葉苞底部，讓幼蟲開始在葉苞裡移動
        B: 以迅雷不及掩耳的速度，追趕在葉苞裡逃跑的幼蟲
        C: 在葉苞外前後追逐，跟著幼蟲來回變換位置
        D: 不再來回追逐，改守在葉苞開口，等幼蟲自己跑過來
    - index: 4
      answer: B
      stem: 小丸想知道：「彩虹是怎麼形成的？」哪一種做法最符合「根據證據形成結論」的方法？
      options:
        A: 只看見一次雨後出現彩虹，就判斷彩虹一定是雨水造成的
        B: 查找可靠的科學資料，再用三稜鏡觀察陽光能否分散成不同顏色
        C: 詢問同學支持哪一種說法的人最多，把多數意見當成答案
        D: 看到網紅說彩虹是飛機留下的，就直接接受他的說法
    - index: 5
      answer: B
      stem: 為什麼作者要用疑問句當標題呢？
      options:
        A: 因為作者還沒有找到任何證據，只能把問題留給讀者
        B: 因為全文從問題出發，引導讀者根據觀察一步步尋找答案
        C: 因為作者想比較兩種昆蟲的能力，判斷哪一種比較聰明
        D: 因為昆蟲是否會思考無法研究，所以只能用疑問句當標題
  questions_note: 本課五題**都沒有**印解析方框（與 L0052 不同），非漏抄。

