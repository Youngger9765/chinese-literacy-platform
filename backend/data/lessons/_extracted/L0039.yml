# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 6
  # 課文中有兩個粗體小標題「繼續打球」「離開球場」，分別印在第 3、4 段的段首上方。
  paragraphs:
    - idx: 1
      text: 臺灣國小到高中大約有1萬5千名學生棒球運動員。大多數學生是在國小四年級加入學校棒球隊。投入學校棒球隊，長大成為職業選手，是許多家長與孩子的夢想。
    - idx: 2
      text: 為了圓夢，也為了追求集體榮譽，學生棒球員必須在紅土上汗流浹背地進行球技及體能訓練，許多球員甚至必須離家集中住校，接受嚴格的作息與紀律要求。因為投入大量的時間接受訓練、比賽，學生球員經常難以兼顧學校課業，「臺灣巨棒」陳金鋒就說過：「四年級起就沒讀書……連字都不會寫。」學生球員這樣努力了八、九年，高中職畢業時，他們會來到一個生涯的叉路口：要「繼續打球」或「離開球場」。
    - idx: 3
      heading: 繼續打球
      text: 表現優異的球員有機會被選進大學球隊，接受更專業化的訓練及更難的挑戰，球技特別精湛的，甚至有機會通過非常競爭的選秀，進入職棒。但根據體育署的統計資料，學生運動員僅有500分之1的機會進入職棒，進入職棒後更大的兩項困境是「職涯短」和「轉業難」。棒球好手進入職棒的平均年齡是26歲，職棒生涯平均只有4.8年，多數職棒選手在30歲左右就退役，棒球職涯超過10年的球員不超過5％。
    - idx: 4
      heading: 離開球場
      text: 許多球員會因運動傷害、身體條件、球技發展等因素離開球場，因為長期犧牲學業，導致不打球後的職涯選擇受限。職業軍人、技術門檻較低的勞力工作和服務業，成為最常見的生涯選項。有位學者問棒球隊學生「如果沒辦法打職棒呢？」聽到的不外乎兩個答案：「那就去釘板模或當兵啊。」即使是職棒選手退役後，也面臨轉業受限的困境。擔任教練是許多退役球員的首選，但教練職缺僧多粥少，多數職棒退役球員會轉往保全、服務業等勞力工作。
    - idx: 5
      text: 許多學生球員仔細思考過夢想和事實之間可能的差距，他們也想兼顧學業和運動訓練，想讓自己未來有更寬廣的職涯選擇，但這不是學生自己就能辦到的。還好，現在全臺灣有許多愛棒球的校長及教練，運用各種方法幫助學生球員在教室和球場間取得平衡。例如，花蓮縣三民國中的林國源校長、張志強教練和老師們合作無間，改善了球員的學習、訓練及生活。他們增加了宿舍的淋浴間及洗衣機，減少等待洗澡、洗衣服的時間，讓球員在繁重嚴格的訓練中，還能擠出讀書的時間。學校還訂定了出賽辦法，要求學業成績達標才能出去比賽。再例如，新竹縣中山國小郭碧玄校長認為，為了確保孩子未來的人生能走得更寬廣，維持基本學力和發展運動技能同樣重要，他們加入中信基金會支持的「愛接棒計畫」，為棒球選手提供額外的夜間課輔，以確保學生的基本學力。
    - idx: 6
      text: 綜上所述，學生運動員在生涯選擇上的困難是：進入朝思暮想的職棒，機會非常少；即使進入職棒，也會面臨職涯短、轉業難的困境。無法進入職棒的球員，則可能因基礎學力不足，日後學習新知或轉換工作較困難，也較難找到需要專業能力的工作。這也就是為什麼愈來愈多的學校開始想方設法，幫助學生棒球員兼顧球技與學力。希望在學生、教練與學校共同的努力下，讓許多孩子的棒球夢能有更多不同的未來。
  inline_marked_terms: [汗流浹背, 精湛, 不外乎, 僧多粥少, 合作無間, 達標, 朝思暮想, 想方設法]

