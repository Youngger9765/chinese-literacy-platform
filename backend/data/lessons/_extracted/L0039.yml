# ── 六 品格聚光燈 ──
# 這一大題幾乎整節是**學生自填的自我管理練習**：多數勾選格教師版都是空的 □，
# 那不是缺印，是本來就沒有標準答案（原稿在情境二步驟❸還明寫「（沒有標準答案）」）。
# 只有兩處有教師版 ☑：情境二步驟❹（單選）與「※你發現了嗎」的三條。
spotlight:
  strategy_name: 自我管理──時間管理策略
  strategy_type: self_management
  blocks:
    - type: concept_box
      text: |-
        課文中，學生棒球員每天在學業與訓練之間掙扎。當時間不夠時，他們必須學會取捨與調整，才能兼顧球技與課業。其實，我們也常遇到這樣的情況：作業、考試、活動、補習都擠在同一天，時間根本不夠用！
        這一課要帶你練習——當時間不夠時，如何抓重點、排優先順序。
        我們來試試一個好用的方法——時間管理四步驟：
        ❶列出任務──列出要做的事，也看清還有多少時間。
        ❷排出先後──先做最重要、最急的事。
        ❸安排做法──決定什麼時候做，以及用什麼方法完成。
        ❹檢查調整──邊做邊看進度，必要時再改順序或方法。
        掌握這四步，生活會更有節奏，也更有效率。

    # ── 情境一 ──
    - type: sub_block
      label: 情境一：功課太多的夜晚
      items:
        - type: passage
          paragraphs:
            - 子安今天晚上事情特別多！白天老師指定一堆作業，明天還有小考。
            - 偏偏今晚又有補習班的課程，到晚上9點才能回家。
            - 他看著書包裡的課本和作業，心想：「那麼晚開始，來得及嗎？」
        - type: guide
          text: 如果你是子安，可以依據以下步驟來安排這個晚上的時間哦。
        - type: multi
          label: 步驟❶：列出任務
          prompt: 步驟❶：列出任務—列出今晚的任務（可複選）
          options:
            1: 作業（例：國文、英文、數學）
            2: 小考準備（例：自然、社會等科）
            3: 預習明天課程
            4: 整理書包或明天要帶的東西
            5: 洗澡、吃飯、休息
            6: '其他：'
          no_correct_answer: true
          note: 學生列自己今晚的任務，教師版六格全空 □ —— 本來就沒有標準答案。第 6 項後面印一條填寫線。
        - type: free_text
          prompt: |-
            ※想一想：
            現在已經晚上9點了，你大約還有【　】小時可以完成任務。
          no_correct_answer: true
          note: 依學生自己的情況填，教師版留空
        - type: guide
          text: 步驟❷：排出先後—分清哪些事最重要、最急
        - type: fill_table
          label: 步驟❸：安排做法
          instruction: |-
            步驟❸：安排做法─排出完成任務的時間
            請只填寫你在上面勾選的任務，標上優先順序，再排出完成時間：
          columns: [任務, 優先順序, 時間區間]
          column_note: 第二欄表頭印「優先順序（填1、2、3..）」，第三欄印「時間區間（填幾點～幾點）」
          rows:
            - {任務: 作業}
            - {任務: 小考準備}
            - {任務: 預習明天課程}
            - {任務: 整理書包或明天要帶的東西}
            - {任務: 生活雜事（如洗澡、吃飯）}
          no_correct_answer: true
          note: 右邊兩欄教師版整片空白，學生依自己的安排填
        - type: guide
          text: |-
            ※提示：
            明天要考試的科目屬於「重要又緊急」；
            作業也要交，但可先集中火力在最急、影響較大的任務上。
        - type: multi
          label: 步驟❹：檢查調整
          prompt: |-
            步驟❹：檢查調整─靈活調整
            計畫不一定能完全照著走，但可以保持彈性，學會靈活調整。
            請勾選你今晚可能會這樣做的選項：
          options:
            1: 調整時間：如果到23:00還沒做完，我可以明早提早起床補完。
            2: 彈性取捨：如果太累，就先完成最重要的部分，其它明天再補。
          no_correct_answer: true
          note: 教師版兩格皆空 □

    # ── 情境二 ──
    - type: sub_block
      label: 情境二：比賽與考試撞期的兩難
      items:
        - type: passage
          paragraphs:
            - 你週末要代表團隊參加一場重要比賽，例如球賽或團體舞蹈比賽；學校下週一要段考。兩件事都很重要，但時間有限。你該怎麼安排？
        - type: guide
          text: 這個情境已經列出兩件重要任務，所以這次從步驟❷開始練習。
        - type: multi
          label: 步驟❷：排出先後
          prompt: |-
            步驟❷：排出先後
            當時間不夠時，還要想：不做會影響誰？哪一件事「短期影響」更大？（可依自己情況選）
            我們可以先分清楚：
          options:
            1: 比賽／表演（關係到團隊表現）
            2: 段考（影響學期成績）
            3: 其他任務
          no_correct_answer: true
          note: 原稿明寫「可依自己情況選」，教師版三格皆空 □。第 3 項印「其他任務（請填寫____）」，後面是填寫線。
        - type: sub_block
          label: 步驟❸：安排做法
          instruction: |-
            步驟❸：安排做法─把先後順序變成可行計畫
            比賽和段考都很重要，但時間不夠時，不必平均分配時間，而要改變完成的方法。請勾選你最想使用的做法。（沒有標準答案）
          left_header: 策略
          right_header: 可以這麼做
          items:
            - type: multi
              label: 提前準備
              options:
                1: 週五前先複習最重要的科目。
                2: 先整理一張重點卡，週末快速複習。
              no_correct_answer: true
            - type: multi
              label: 抓住重點
              options:
                1: 先複習老師提醒、自己常錯的範圍。
                2: 熟悉的內容快速檢查，不平均分配所有時間。
              no_correct_answer: true
            - type: multi
              label: 分段安排
              options:
                1: 把複習分成週五、比賽空檔和週日晚間幾個時段。
                2: 只在安全、不影響集合或教練說明時，利用零碎時間複習。
              no_correct_answer: true
            - type: multi
              label: 尋求協助
              options:
                1: 告訴家人或教練比賽和段考撞期，一起討論可以調整的安排。
                2: 請老師指出最需要先複習的章節。
              no_correct_answer: true
          note: 原稿在指示語裡明寫「（沒有標準答案）」，八格教師版全空 □
        - type: single
          label: 步驟❹：檢查調整
          prompt: |-
            步驟❹：檢查調整─計畫有變時，再調整做法
            你原本已經安排好比賽和複習時間，沒想到比賽延後一小時，回到家時，比預定時間晚了。原來的複習計畫已經做不完了，你會怎麼調整？（單選）
          options:
            1: 照原來的範圍全部讀完，晚一點睡沒有關係。
            2: 先完成最重要、最不熟的內容，熟悉的部分快速檢查，並保留足夠睡眠。
            3: 把剩下的內容全部留到星期一考試前再複習。
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: self_check
      label: ※你發現了嗎？
      instruction: 好的時間安排，不是把所有事情硬塞進有限的時間，而是：
      items:
        - ①先比較事情的影響，排出不同時段的先後順序。
        - ②用提前準備、抓住重點和分段安排，讓兩件重要的事都能完成。
        - ③計畫有變時，保留最重要的部分，重新調整；必要時主動尋求協助。
      checked: [1, 2, 3]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: self_check
      label: ◎自我檢核表
      instruction: 我學會了時間管理嗎？請在符合的項目打勾，看看自己學到了什麼？
      columns: [是, 否]
      items:
        - 1.我能先列出要做的事和可以使用的時間。
        - 2.我能排出先後，選擇合適的完成方法。
        - 3.計畫改變時，我會檢查進度，再調整或尋求協助。
      checked: []
      no_correct_answer: true
      note: 學生自評，教師版三列的「是／否」兩欄都是空 □ —— 本來就沒有標準答案

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 依據本文，下列哪一個語詞最能形容「想當教練的退役球員很多，但教練職缺很少」的情況？
      options:
        A: 僧多粥少
        B: 汗流浹背
        C: 精湛出色
        D: 合作無間
      teacher_note: （在第三段中提到：「教練是許多退役球員的首選，但教練職缺僧多粥少。
      teacher_note_check: 原稿的解析引號沒有收尾、也沒有右括號，照抄不補
    - index: 2
      answer: D
      stem: 學生棒球運動員如果無法進入職棒，常見的職業選擇是什麼？
      options:
        A: 科技業
        B: 金融業
        C: 醫療業
        D: 服務業
      teacher_note: （在第四段提到：「職業軍人、低技術體力工、服務業成為最常見的生涯選項。」)
    - index: 3
      answer: B
      stem: 根據本文，臺灣學生棒球運動員主要面臨的困難是什麼？
      options:
        A: 訓練設施不夠完善
        B: 學業與棒球訓練難以兼顧
        C: 缺乏家長的支持
        D: 教練資源不足
      teacher_note: （在第二段中提到：「因為投入大量的時間接受訓練、比賽，學生球員經常難以兼顧學校課業。」)
    - index: 4
      answer: C
      stem: 學生球員努力多年後，為什麼仍可能面臨職涯困境？
      options:
        A: 比賽次數太少，球員缺少展現球技的機會
        B: 訓練設備不足，球員難以提升體能與技術
        C: 職棒機會少、職涯短，加上學業基礎弱，轉業不易
        D: 家長缺少支持，球員常在訓練途中離開球隊
    - index: 5
      answer: B
      stem: 課文最後希望學生的棒球夢「能有更多不同的未來」，這句話是什麼意思？
      options:
        A: 學生球員可以提早轉職，去體驗不同的職業活動
        B: 讓學生兼顧球技與學力，未來有更多職涯選擇
        C: 讓學生把全部時間投入棒球，提高進入職棒的機會
        D: 讓學生先放下棒球訓練，專心準備升學與就業
      teacher_note: （根據本文，學校和教練們的努力，希望學生棒球員能在學業和運動間取得平衡，為未來提供更多職涯選擇的機會。)

