      value: |-
        1.塞翁的馬跑走、馬回來、兒子摔斷腿、兒子未被徵兵，形成福禍轉折，讓人明白：眼前的【　】不一定是最後的【　】。
        2.這個故事表現了【　】的智慧，提醒我們【　】，得失難料，不必太早下定論。
        3.塞翁的反應也可以用認知心理學來理解：不同的【　】會影響情緒與行動。
      blanks:
        - {answer: 得失}
        - {answer: 定局}
        - {answer: 禍福相倚}
        - {answer: 世事無常}
        - {answer: 詮釋}
    - label: 舉例(段5～6)
      value: |-
        新冠肺炎讓全台遠距上學上班，市井間的商店【　】；但遠距設備需求增加，也讓臺灣電子產業迎來爆發性成長。
        羅伯茲提出【　】，不幸不一定只有傷害，也可能帶來【　】。
      blanks:
        - {answer: 門可羅雀}
        - {answer: 反向祝福}
        - {answer: 成長契機}
    - label: 結論(段7)
      value: 挫敗不必看成失敗的【　】，可以看成照出問題的【　】。只要先【　】，再調整方法，就可能成為【　】的起點。
      blanks:
        - {answer: 判決書}
        - {answer: 鏡子}
        - {answer: 穩住心}
        - {answer: 反敗為勝}

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法——用故事和例子支持觀點
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層，22 個全為紅色）；歸納格的填空是橘色手寫
  shape_note: |-
    原稿的一、三、四大題各有一張表格，表格裡**每一格都是一組單選**（□①…／□②…）。
    表格型別（fill_table/table）在前端只會把儲存格當純文字畫出來，選項不能作答；
    所以這裡把每一列拆成一個 sub_block（label ＝ 該列的事件／人物／例子），
    底下掛該列的 single。表頭字（一開始看起來／後來怎麼變化？…）當成 single 的 prompt，照原稿。
  blocks:
    - type: concept_box
      text: |-
        本文透過故事和例子提醒我們：遇到挫敗時，不要太快認定事情只有壞的一面；先穩住心，換個角度看，可能會發現轉機或成長。
        讀這類文章時，不能只看故事或例子，還可學到：作者如何使用故事和例子，讓文章的觀點更清楚、更有說服力？

    # ── 一、看故事轉折，讀出道理 ──
    - type: guide
      text: 一、看故事轉折，讀出道理
    - type: guide
      text: 1.從塞翁故事看福禍轉折，請先根據課文完成表格
    - type: sub_block
      label: ⑴馬忽然跑走了
      items:
        - type: single
          prompt: 一開始看起來
          options: {1: 福, 2: 禍}
          answer: 2
        - type: single
          prompt: 後來怎麼變化？
          options: {1: 馬回來了，還帶回幾匹漂亮的野馬。, 2: 馬再也沒有回來。}
          answer: 1
    - type: sub_block
      label: ⑵馬回來，還帶回野馬
      items:
        - type: single
          prompt: 一開始看起來
          options: {1: 福, 2: 禍}
          answer: 1
        - type: single
          prompt: 後來怎麼變化？
          options: {1: 野馬讓一家人從此過得很富有。, 2: 兒子騎野馬，結果摔斷了腿。}
          answer: 2
    - type: sub_block
      label: ⑶兒子摔斷了腿
      items:
        - type: single
          prompt: 一開始看起來
          options: {1: 福, 2: 禍}
          answer: 2
        - type: single
          prompt: 後來怎麼變化？
          options: {1: 兒子因為跛足，沒有被徵兵。, 2: 兒子因此被派去打仗。}
          answer: 1
    - type: sub_block
      label: ⑷兒子沒有被徵兵
      items:
        - type: single
          prompt: 一開始看起來
          options: {1: 福, 2: 禍}
          answer: 1
        - type: single
          prompt: 後來怎麼變化？
          options: {1: 他因此逃過戰爭，保住性命。, 2: 他因此失去所有生活希望。}
          answer: 1
    - type: single
      prompt: 2.看完上表，這個故事讓我們明白什麼？
      options:
        1: 眼前看似幸運的事，通常會一直帶來好結果。
        2: 遇到不幸時，只要耐心等待，事情自然會好轉。
        3: 眼前看似福或禍，都不一定是最後定局。
      answer: 3

    # ── 二、看人物對照 ──
    - type: guide
      text: 二、看人物對照：理解想法（詮釋）怎麼影響情緒和行動
    - type: guide
      text: |-
        1.小宇和塞翁怎麼看待不順利的事
        一件事發生後，我們會對它產生想法。這個想法，就是「詮釋」。
        不同的詮釋，可能帶來不同的情緒和行動。請根據課文勾選答案。
    - type: sub_block
      label: 小宇
      intro: 遇到的事
      instruction: 小考52分
      items:
        - type: single
          prompt: 詮釋：怎麼解釋這件事？
          options: {1: 我不是讀書的料。, 2: 是福是禍？還不知道。}
          answer: 1
        - type: single
          prompt: 情緒／行動
          options: {1: 沮喪、心不在焉。, 2: 不過度悲傷，保持清醒。}
          answer: 1
    - type: sub_block
      label: 塞翁
      intro: 遇到的事
      instruction: 馬跑走
      items:
        - type: single
          prompt: 詮釋：怎麼解釋這件事？
          options: {1: 我不是養馬的料。, 2: 是福是禍？還不知道。}
          answer: 2
        - type: single
          prompt: 情緒／行動
          options: {1: 沮喪、心不在焉。, 2: 不過度悲傷，保持清醒。}
          answer: 2
    - type: single
      prompt: 2.從小宇和塞翁的比較，可以看出作者想提醒我們什麼？
      options:
        1: 遇到不順利的事，情緒主要由事情本身決定。
        2: 同樣遇到不順利的事，不同的詮釋，會帶來不同的情緒和行動。
      answer: 2

    # ── 三、看例子：找共同點 ──
    - type: guide
      text: 三、看例子：找共同點
    - type: guide
      text: |-
        1.看例子的一開始和後來變化
        作者把這個道理放到不同情境中說明。
        請完成表格，看看這些情境前後有什麼共同變化。
    - type: sub_block
      label: ⑴小宇小考52分
      intro: 一開始看起來
      instruction: 考差了，好像自己很失敗
      items:
        - type: single
          prompt: 後來或換個角度詮釋之後
          options: {1: 可以發現哪些地方還要加強。, 2: 代表自己真的不是讀書的料。}
          answer: 1
    - type: sub_block
      label: ⑵新冠肺炎
      intro: 一開始看起來
      instruction: 遠距上學上班，商店受影響，看起來是危機
      items:
        - type: single
          prompt: 後來或換個角度詮釋之後
          options: {1: 遠距設備需求增加，臺灣電子產業出現成長的轉機。, 2: 所有事情都變壞，沒有任何轉機}
          answer: 1
    - type: sub_block
      label: ⑶羅伯茲的反向祝福
      intro: 一開始看起來
      instruction: 不公平、孤單、失敗，聽起來都不好
      items:
        - type: single
          prompt: 後來或換個角度詮釋之後
          options: {1: 只要經歷不公平、孤單或失敗，人自然就會成長。, 2: 可能讓人懂得正義、珍惜朋友、學會謙遜。}
          answer: 2
    - type: sub_block
      label: 歸納例子的共同點
      value: |-
        一開始都看起來是【　】
        後來或換個角度詮釋，都可能出現【　】
      blanks:
        - {answer: 不順利/不好的事}
        - {answer: 轉機/ 成長}
      answer_carrier: 橘色手寫（C:E97132），文字流有此資訊；這一列是三.1 表格的最後一列
    - type: single
      prompt: 2.共同變化：上表中的例子，共同想說明什麼？
      options:
        1: 眼前的不順利不一定是最後結果，換個角度看，可能發現轉機或成長
        2: 遇到不順利時，先等待事情自行改變，比採取行動更重要。
        3: 只要保持樂觀，就可以忽略挫敗帶來的問題和影響。
      answer: 1

    # ── 四、連回觀點 ──
    - type: guide
      text: 四、連回觀點：判斷故事和例子的作用
    - type: guide
      text: |-
        本文透過故事和例子支持的主要觀點是：遇到挫敗時，不必太快認定事情只有壞的一面；先穩住心，換個角度看，可能會發現轉機或成長。
        作者最後再進一步提出行動建議：看見問題後，還可調整方法。
    - type: guide
      text: 1. 請判斷前面的故事和例子，分別支持主要觀點的哪一個面向。
    - type: sub_block
      label: ⑴塞翁故事
      items:
        - type: single
          prompt: 它怎麼支持主要觀點？
          options: {1: 說明眼前福禍不一定是最後定局，不要太快判定好壞。, 2: 說明壞事最後一定會自然變好，只要等待好運就可以。}
          answer: 1
    - type: sub_block
      label: ⑵小宇和塞翁
      items:
        - type: single
          prompt: 它怎麼支持主要觀點？
          options: {1: 說明同樣遇到不順利的事，怎麼詮釋會影響情緒和行動。, 2: 說明只要保持正面的想法，不順利的事就會自然消失。}
          answer: 1
    - type: sub_block
      label: ⑶羅伯茲反向祝福、新冠肺炎
      items:
        - type: single
          prompt: 它怎麼支持主要觀點？
          options: {1: 說明遭遇的不順利越多，後來得到的成長就越大。, 2: 說明不順利的事，換個角度看，可能有轉機或成長。}
          answer: 2
    - type: single
      prompt: 2.這些故事和例子合起來，有什麼作用？
      options:
        1: 它們分別從「事情未定、想法影響、換角度有轉機」三個面向，支持主要觀點。
        2: 它們主要用來增加故事與背景資料，即使刪除，也不影響作者觀點的說服力。
      answer: 1

    - type: self_check
      label: ◎自我檢核
      instruction: 如果你有做到，請在□中打勾。
      items:
        - 1.我能判斷故事和例子，是如何支持作者的觀點。
        - 2.我能把多個例子合起來看，找出它們共同支持的意思。
        - 3.下次讀到「用故事或例子說明觀點」的文章時，我會問自己：這些故事和例子怎麼讓作者的觀點更清楚、更有說服力？
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案，印在題號前的括號內），文字流有此資訊
  teacher_notes_note: |-
    每一題右側都有一個深藍色（C:0F4761）的教師解析文字方塊，印在頁面右緣。
    PDF 上第 2、3 題的方塊被右邊界裁掉一部分（看起來像缺字），
    但 document.xml 的內容是完整的，這裡以文字層為準。
  questions:
    - index: 1
      answer: D
      stem: 本文第4段提到，塞翁失馬後說：「是福是禍？還不知道呢。」從這段可以推論，塞翁遇見事情時，有怎樣的詮釋習慣？
      options:
        A: 相信失馬之後可能會有好事，因此先忽略眼前的損失
        B: 把失馬當成老天安排，不再思考後續可能變化
        C: 暫時壓下所有難過情緒，假裝自己完全不受影響
        D: 不急著判定好壞，讓自己保持清醒，等待後續發展
      teacher_note: 第1題解析：塞翁沒有因失馬而過度悲傷，也沒有因得馬而得意忘形。由此可推論，他的想法使他能暫時保留判斷，保持清醒，等待事情的後續發展。
    - index: 2
      answer: B
      stem: 本文第6段說，羅伯茲的「反向祝福」和「塞翁失馬」有相通之處。兩者相通的地方是什麼？
      options:
        A: 都認為挫折本身值得追求，能使人獲得好的結果
        B: 都提醒人，不要只看當下的不順利，就急著下定論
        C: 都強調經歷多次失敗之後，人自然就會懂得珍惜
        D: 都說明人生主要靠運氣，努力和選擇並不那麼重要
      teacher_note: 羅伯茲的「反向祝福」和「塞翁失馬」都不是說壞事一定會變好，而是提醒人：眼前看似不順利的事，不一定只有負面意義，不要太快下定論。
    - index: 3
      answer: A
      stem: 本文第3段說「不必太早下定論」，第4段又說「想法會影響情緒與行動」。把這兩段合起來看，下列哪一種反應最符合作者的想法？
      options:
        A: 考差時先不要急著否定自己，可以想想哪裡還能調整
        B: 考差可能只是運氣不好，先等下一次成績再判斷
        C: 考差後先不要往壞處想，成績自然會慢慢進步
        D: 考差時先避免談論成績，等心情平靜後再處理
      teacher_note: |-
        這兩段最符合作者想法的是：先不要急著否定自己，再思考可以調整的地方。
        B把文章誤解成「一定會變好」
        C把重點誤解成壓抑情緒
        D則偏向逃避
    - index: 4
      answer: C
      stem: 本文後半舉出新冠肺炎和羅伯茲「反向祝福」的例子，最主要是為了達成哪一種寫作效果？
      options:
        A: 把例子放到社會與文化，證明壞事最後都會變好
        B: 把內容放到社會與文化，補充疫情與演講資料
        C: 把道理放到社會與文化，說明壞事也可能帶來轉機
        D: 把主題放到社會與文化，改談經濟發展與演講
      teacher_note: 把「塞翁失馬」的道理放到不同情境中，使觀點更清楚、更有說服力。
    - index: 5
      answer: D
      stem: 你上台報告時太緊張，講得斷斷續續，下台後很沮喪。下列哪一種想法最符合本文觀點？
      options:
        A: 都是同學沒有提醒我，這次講不好不能怪自己
        B: 我果然不適合上台報告，以後能避開就避開
        C: 這次只是運氣不好，下次可能自然會講得更順
        D: 我可以想想哪裡講得不順，整理內容後再多練習
      teacher_note: D不是否定自己，也不是等待壞事自然變好，而是從挫敗中看見問題，思考可以調整的方法，最符合本文觀點。

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  target_words: [心不在焉, 鄙夷, 轉圜, 契機, 禍福相倚, 無常, 詮釋, 愁雲慘霧, 得意忘形, 於事無補, 市井, 門可羅雀, 奠定]
  grid_size: [10, 10]
  grid:
    - 素泫然欲轉泣於支離路
    - 心不在焉雕圜事生技投
    - 立鄙合為錐貴無常貧門
    - 破夷鏤廣禍擴補智萬可
    - 響經之福日愁點賀無羅
    - 契機相群貨雲老新緣雀
    - 精倚星詮釋慘布鄙市走
    - 經濟中段拜霧跡斑斑井
    - 奠淺綿臨得意忘形舉足
    - 定葉延終脹一目了龍手
  answers_are_graphical: true
  answer_paths:
    - word: 轉圜
      cells: [[1, 5], [2, 6]]
      direction: diagonal_down_right
    - word: 於事無補
      cells: [[1, 7], [2, 7], [3, 7], [4, 7]]
      direction: vertical
    - word: 心不在焉
      cells: [[2, 1], [2, 2], [2, 3], [2, 4]]
      direction: horizontal
    - word: 鄙夷
      cells: [[3, 2], [4, 2]]
      direction: vertical
    - word: 無常
      cells: [[3, 7], [3, 8]]
      direction: horizontal
    - word: 門可羅雀
      cells: [[3, 10], [4, 10], [5, 10], [6, 10]]
      direction: vertical
    - word: 禍福相倚
      cells: [[4, 5], [5, 4], [6, 3], [7, 2]]
      direction: diagonal_down_left
    - word: 愁雲慘霧
      cells: [[5, 6], [6, 6], [7, 6], [8, 6]]
      direction: vertical
    - word: 契機
      cells: [[6, 1], [6, 2]]
      direction: horizontal
    - word: 詮釋
      cells: [[7, 4], [7, 5]]
      direction: horizontal
    - word: 市井
      cells: [[7, 9], [8, 10]]
      direction: diagonal_down_right
    - word: 奠定
      cells: [[9, 1], [10, 1]]
      direction: vertical
    - word: 得意忘形
      cells: [[9, 5], [9, 6], [9, 7], [9, 8]]
      direction: horizontal
  geometry_check: |-
    全檔 roundRect 錨點 14 個。扣掉 1 個紙外殘留 ＝ 紙上 13 個，與 13 條 answer_paths 相同，無警報。
    紙外那個的兩個旁證同時成立：`positionH relativeFrom="rightMargin" posOffset=+5.76in`
    （換算距頁左超過 A4 頁寬 8.27in），且框線硬寫死 srgb E97132，其餘 13 個都是佈景色 accent2。
    ⚠️ 依 SKILL，「硬寫死 E97132」單獨不足以判定殘留（L0122 全部都是硬寫死的），
    這裡是靠 posOffset 換算出界才判掉，顏色只當旁證。
    格子沒有跨頁（10 列都在 p12）；13 個目標語詞在格子裡都拼得回來，無錯字。

