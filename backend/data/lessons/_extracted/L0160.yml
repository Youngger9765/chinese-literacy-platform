# ── 三 文章重點表 ──
keypoints:
  label: 三、文章重點表
  intro: |-
    在<不量田>那一課，我們使用故事體結構 (故事背景、起因、問題、解決、結果) 來掌握文章重點；之前的課文<黑猩猩的守護者>同樣也教我們運用故事體結構(故事背景、起因、經過、結果)來理解文章。
    等等！同樣是故事體結構，怎麼好像有點不一樣？
    其實兩者都對，差別在於一個重視問題如何解決，另一個則偏重故事的時間順序。
    想一想：<重義的荀巨伯>可以用哪一種結構方式來整理呢？
  instruction: 如果你已經有想法了，請配合課文內容完成下表，注意左欄有一個小空格也要填寫哦！
  layout: list
  column_note: 表格欄名是「故事結構／內容摘要」；內容摘要欄下另印「【 】處填入原文，找不到原文時，再用自己的話寫。」
  answer_carrier: 橘色手寫（在文字層），PDF p5 可見
  rows:
    - label: 起因
      value: 【　】去看望【　】，卻遇上胡兵準備攻打朋友所在的城邑。
      blanks: [{answer: 荀巨伯}, {answer: 友人疾/生病的朋友}]
    - label: 【　】
      label_blanks: [{answer: 經過}]
      label_note: 這一列的**標籤本身**就是要填的空格（就是 instruction 說的「左欄有一個小空格」）
      items:
        - label: 胡兵攻城前
          value: |-
            1.荀巨伯的朋友因為拖著病體跑不了，就勸荀巨伯趕快逃。
            2.荀巨伯告訴朋友，自己絕不會做【　】的事。
          blanks: [{answer: 敗義以求生/敗壞道義而求取生路}]
        - label: 胡兵入城後
          value: |-
            1.胡兵發現竟然還有人沒逃，驚訝地問荀巨伯為何不逃跑？
            2.荀巨伯回答：因為不忍心【　】，所以才沒逃，甚至表達【　】代替朋友死。
          blanks: [{answer: 委之/拋下朋友}, {answer: 寧以我身/寧願用自己的命}]
    - label: 結果
      value: 胡兵被荀巨伯的捨命護友的情操感動，於是決定【　】，一城的人因此倖免了一場可能的戰爭。
      blanks: [{answer: 班軍而還/撤兵回去}]

# ── 四 文言文聚光燈 ──
spotlight:
  label: 四、文言文聚光燈
  strategy_name: 認識文言文代詞—人稱代詞
  strategy_type: classical_chinese
  answer_carrier: 橘色手寫與 V／X 判斷（都在文字層），PDF p6~p7 可見
  blocks:
    - type: concept_box
      text: |-
        之前的課文我們了解到文言文為了簡潔的緣故，常有許多省略的現象，比如省略主語；假如兩句(或兩句以上)的主語相同，第一句出現主語後，後面的句子主語就省略，或是以代詞來代替主語。
        那麼問題來了：什麼是代詞呢？

    - type: concept_box
      text: 代詞：具有代替或指示作用的語詞

    - type: guide
      text: |-
        用現代的白話來說明
        代替作用：❶人稱代詞（你、我、他）；
        指示作用：❷指示代詞（這個、那個）、
        ❸疑問代詞（誰、什麼、多少）。
        由上面的說明可知，代詞分三類，這一課，我們先來認識文言文中的人稱代詞。

    - type: guide
      text: |-
        一、常見的文言文人稱代詞
        ( 淺灰 ) 語詞出現頻率較不高，可依需要自行記憶，增加詞彙量哦！

    - type: table
      label: 第一人稱代詞
      rows:
        - [我, 我、吾、余、予、某]
        - [我們, 我等、我輩、吾等、吾輩、某等]
        - [謙稱, 私、僕、愚、在下、（敝人、不才、鄙人、臣、妾）]
        - [君王專用, 朕、孤、寡人、本王]

    - type: table
      label: 第二人稱代詞
      rows:
        - [你 / 你的, 爾、汝、    、(若、乃、而)]
        - [「你」的敬稱, 君、子、公、卿、足下、閣下]
        - [你們 / 你們的, 爾等、爾曹、汝等、汝曹]
        - [帝王專用, 陛下]
      image_note: |-
        第 1 列第 2 欄「爾、汝、    、(若、乃、而)」中間那四個空格處插了**一張圖**
        （w:drawing，Word 自動產生的 alt 沒有內容），PDF p6 印出一個帶注音的字形。
        ⚠️ **不轉錄那個字形**：render 上形近字分不出來，而它在文字層沒有任何字可交叉驗證。
        整格照文字層抄；未標 `text_carrier: image`，因為同格其餘的字確實在文字層，
        標了會讓它們一起逃過逐字門。

    - type: table
      label: 第三人稱代詞
      rows:
        - [他 / 他們, 彼、其、之]

    - type: guide
      text: 二、人稱代詞—基礎題練習

    - type: exercise
      label: 練習一
      instruction: 在(   )中寫出標示灰底的人稱代詞現代的用詞，如，你、我、他等。
      items:
        - type: free_text
          prompt: 荀巨伯遠看友人疾，值胡賊攻郡。
          no_correct_answer: true
          answer_carrier: 這一句沒有灰底代詞，原稿無答案
        - type: free_text
          prompt: 友人語巨伯曰：「吾(　)今死矣，子(　)可去！」
          blanks: [{answer: 我}, {answer: 你}]
        - type: free_text
          prompt: 巨伯曰：「遠來相視，子(　)令吾(　)去；敗義以求生，豈荀巨伯所行邪？」
          blanks: [{answer: 你}, {answer: 我}]
        - type: free_text
          prompt: 賊既至，謂巨伯曰：「大軍至，一郡盡空，汝(　)何男子，而敢獨止？」
          blanks: [{answer: 你}]
        - type: free_text
          prompt: 巨伯曰：「友人有疾，不忍委之(　)，寧以我(　)身代友人命。」賊相謂曰：「我輩(　)無義之人，而入有義之國！」
          blanks: [{answer: 他}, {answer: 我}, {answer: 我們}]

    - type: exercise
      label: 練習二
      instruction: 下面各題皆有文言、白話的對讀，請判斷白話的理解是否正確；正確的✓，錯誤的畫╳。
      answer_carrier: 橘色手寫的 V／X（在文字層）；原稿指示語寫「✓／╳」但答案實際印成「V／X」
      items:
        - type: free_text
          prompt: |-
            1. 文言：予獨愛蓮之出淤泥而不染。
            白話：他只愛蓮花生長在淤泥中卻不受汙染。
          answer: X
          explanation: 第1題解析：「予」是指「我」。
        - type: free_text
          prompt: |-
            2. 文言：余憶童稚時能張目對日，明察秋毫。
            白話：我回憶小時候能張著眼睛看太陽，仔細觀察秋天鳥獸新生的細毛。
          answer: V
        - type: free_text
          prompt: |-
            3. 文言：爾安敢輕吾射？汝亦知射乎？
            白話：他怎麼敢輕視我的射箭技術？你也懂射箭嗎？
          answer: X
          explanation: 第3題解析：「爾」是指「你」。
        - type: free_text
          prompt: |-
            4. 文言：宋有富人，天雨牆壞。其子曰：「不築，必將有盜。」
            白話：宋國有位富人，他的房子因為下雨，牆坍塌了。他的兒子說：「不修築的話，必定有盜賊會來。」
          answer: V
        - type: free_text
          prompt: |-
            5. 文言：鬼言：「卿太重，將非鬼也？」定伯言：「我新鬼，故身重耳。」
            白話：鬼說：「你太重了，莫非不是鬼？」定伯說：「我是新鬼，所以身體才比較重而已。」
          answer: V
        - type: free_text
          prompt: |-
            6. 文言：眾皆驚服曰：「丞相玄機，神鬼莫測。若某等之見，必棄城而走矣。」
            白話：眾人都驚訝又佩服，說：「丞相的機智，神鬼都無法預測。如果是他們的見識，必定放棄守城而逃。」
          answer: X
          explanation: 第6題解析：「某等」是指「我們」。
      explanation_placement_note: |-
        第 1、3、6 題的解析印在題目旁的橘色文字方塊裡，但**第 3 題的解析方塊排在第 2 題後面**
        （PDF p7 可見），是版面位置，不是對錯 —— 解析內容明確寫「第3題解析」。

# ── 五 閱讀理解 ──
comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（在文字層），PDF p7~p8 可見
  questions:
    - index: 1
      stem: 下列選項「」中字，何者字音、字義完全正確？
      options:
        A: 「豈」荀巨伯所行邪——ㄎㄞˇ，難道
        B: 友人有疾，不忍「委」之——ㄊㄨㄛ，委託
        C: 「寧」以我身代友人命——ㄋㄧㄥˊ，寧願
        D: 「遂」班軍而還——ㄓㄨˊ，於是
      answer: C
      explanation: |-
        第1題解析：
        A字音ㄑㄧˇ；
        B字音ㄨㄟˇ，字義「拋下」；
        D字音ㄙㄨㄟˋ。
    - index: 2
      stem: 關於「重義的荀巨伯」一文的寫作手法，下列敘述何者最恰當？
      options:
        A: 運用對話，凸顯人物個性
        B: 夾敘夾議，事理分析清楚
        C: 全文採第一人稱敘述
        D: 以設問法結尾，激發讀者思考
      answer: A
      explanation: |-
        第2題解析：
        B夾敘夾議，一段敘述，一段議論，常見於議論文的結構。C本文使用第三人稱敘述；敘述者不是荀巨伯，也不是荀巨伯的朋友或胡兵。D結尾沒有提出問題。
    - index: 3
      stem: 下列哪一個選項，最能看出荀巨伯的人格特質？
      options:
        A: 荀巨伯遠看友人疾，值胡賊攻郡
        B: 我輩無義之人，而入有義之國
        C: 大軍至，一郡盡空，汝何男子，而敢獨止
        D: 友人有疾，不忍委之，寧以我身代友人命
      answer: D
      explanation: |-
        第3題解析:
        D荀巨伯不忍心丟下朋友自己逃命，甚至願意為了朋友犧牲，可見他有多麼重視道義。
    - index: 4
      stem: 下列哪一個選項中的代詞代表荀巨伯的朋友？
      options:
        A: 「吾今死矣，子可去」的「子」
        B: 「友人有疾，不忍委之」的「之」
        C: 「汝何男子，而敢獨止」的「汝」
        D: 「遠來相視，子令吾去」的「吾」
      answer: B
      explanation: |-
        第4題解析:
        A、C、D都是指荀巨伯。
    - index: 5
      stem: 「重義的荀巨伯」一文的主旨近似於下列何者？
      options:
        A: 勿以善小而不為，勿以惡小而為之
        B: 改變自己是自救，影響別人是救人
        C: 良藥苦口利於病，忠言逆耳利於行
        D: 為人若真誠有德，自能感召人心
      answer: D
    - index: 6
      stem: 武俠小說中的人物，常以謙遜的口吻自稱。下列哪個人物沒有使用自謙詞？
      options:
        A: 鐵心蘭：「妾身就此告退。」
        B: 花無缺：「承蒙閣下對本人的指點。」
        C: 燕南天：「這劍法確實是在下自創。」
        D: 小魚兒：「敝人這就前往一探究竟。」
      answer: B
      explanation: |-
        第6題解析:
        妾身，女子自稱的謙虛用法；
        閣下，您，敬稱，
        本人，不含謙遜意圖的自稱；
        在下，我，自謙詞；
        敝人，我，自謙詞。

# ── 六 自我挑戰 ──
self_challenge:
  label: 六、自我挑戰
  title: 人稱代詞挑戰題
  teacher_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  strategy_flow_note: |-
    這三個箭號是文字層真的字元 U+2B62（⭢），不是 w:sym —— 全檔 w:sym 總數 0，
    所以照字面抄無誤。
  passage: 濟陰之賈人，渡河而亡其舟，棲於浮苴1之上，號呼救命。有漁者以舟往救之。未至，賈人曰：「我富者也，能救我，予爾百金！」漁者載而登陸，則予十金。漁者曰：「向2許百金，而今但予十金？」賈人勃然作色3曰：「若漁者也，一日捕魚能獲幾何？而驟4得十金，猶爲不足乎？」漁者黯然而退。他日，賈人舟又覆，而漁者在焉。或曰：「何以不救？」漁者曰：「是許金而不酬者也！」未久，賈人沒。
  annotations:
    - {"no": 1, term: 浮苴, text: 浮在水面的水草。苴，音ㄐㄩ。}
    - {"no": 2, term: 向, text: 剛才。}
    - {"no": 3, term: 勃然作色, text: 憤怒、生氣，突然翻臉。}
    - {"no": 4, term: 驟, text: 突然、一下子。驟，音ㄗㄡˋ。}
  translation: |-
    濟陰有位商人，渡河時船沉了，他趴在浮在水面的水草上大聲呼救。一位漁夫駕着船去救他。船還沒到，商人就大喊：「我是有錢人，你能救我，就給你一百兩銀子。」漁夫把他載到岸上後，商人卻只給漁夫十兩銀子。漁夫問他：「剛才你許諾給我一百兩銀子，怎麼現在只給十兩？」商人立刻變臉說：「你是個打漁的，一天能有多少收入？現在一下子得了十兩銀子，還不滿足嗎?⎦漁夫很失望地走開了。
    後來，商人的船又沉了，而漁夫剛好也在附近。有人見漁夫不動，便問他：「為何你不去救他？」漁夫回答說：「那個人是答應給我百兩銀子卻說話不算的人。」沒多久，商人就沉沒水中了。
  translation_errata_ref: E1
  items:
    - label: （一）
      instruction: 請依照故事脈絡，寫出畫底線字的人稱代詞及所指對象。
      answer_carrier: 橘色手寫（在文字層），PDF p9 可見
      questions:
        - {index: 1, prompt: 「濟陰之賈人，渡河而亡其舟」, answer: 他的，賈人}
        - {index: 2, prompt: 「有漁者以舟往救之」, answer: 他，賈人}
        - {index: 3, prompt: 「我富者也，能救我，予爾百金！」, answer: 你，漁者}
        - {index: 4, prompt: 「若漁者也，一日捕魚能獲幾何？」, answer: 你，漁者}
  quiz:
    label: （二）閱讀理解測驗
    questions:
      - index: 1
        stem: 關於本文，下列敘述何者正確？
        options:
          A: 「渡河」、「亡其舟」、「號呼救命」的人都是漁夫
          B: 漁夫是因為商人重賞才去救人的
          C: 依據文意，「向許百金」的「許」意思是「許諾」
          D: 商人的情緒變化依序是驚恐、高傲、憤怒、心虛
        answer: Ｃ
        answer_note: 這一題的答案代號印成全形「Ｃ」，第 2 題也是全形「Ｄ」，第 3 題是半形「B」，原稿如此
        explanation: |-
          第1題解析：
          A主語都是賈人；B漁夫救人行動在先，商人才提酬金的事；
          D商人最後沉水，卻無人來救，應該是「後悔」、「絕望」。
      - index: 2
        stem: 關於本文，下列敘述何者正確？
        options:
          A: 商人因為沒錢，所以跟漁夫討價還價酬謝金額
          B: 商人最後沒錢付酬金，乾脆逃跑，一走了之
          C: 漁夫救了商人兩次，共得酬金二十金
          D: 漁夫厭惡商人輕諾背信，才眼睜睜看商人溺斃
        answer: Ｄ
      - index: 3
        stem: 這個故事的主旨為何？
        options: {A: 有錢能使鬼推磨, B: 人須言而有信, C: 得饒人處且饒人, D: 多行不義必自斃}
        answer: B
