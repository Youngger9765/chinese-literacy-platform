# ── 古文今譯 ──
modern_translation:
  label: 古文今譯
  paragraphs:
    - 荀巨伯到很遠的地方去看望生病的朋友，正巧遇上胡兵準備攻打這座城。朋友告訴荀巨伯說：「我就要死了，你趕快離開吧！」荀巨伯說：「我遠道來看你，現在有危險了，你就叫我丟下你自己逃命去，這種敗壞道義而求取生路的事，難道我荀巨伯做得出來嗎？」
    - 胡兵進城後，一看見荀巨伯就說：「大軍到來，整座城全部都空了，你是什麼人？竟敢獨自留在這裏？」荀巨伯說：「我的朋友身患重病，我不忍心拋下他，寧願用我的命換我朋友的命。」
    - 在場的胡兵聽了這番話相互議論說：「我們這些不懂道義的人，竟然入侵了這樣重道義的國家！」於是撤軍回去，整座城的人因此全都獲得了保全。

# ── 原文（含斷詞點）＋注釋 ──
classical_text:
  label: 原文
  source: 南朝宋・劉義慶(編)
  has_qr: true
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  paragraphs:
    - 荀巨伯.遠看.友人疾，值胡賊.1攻郡。友人語巨伯.曰：「吾今.死矣，子可去！」巨伯曰：「遠來.相視2，子令.吾去；敗義.以求生，豈.荀巨伯所行邪？」
    - 賊既至，謂巨伯曰：「大軍至，一郡.盡空，汝何.男子，而敢獨止？」巨伯曰：「友人有疾，不忍.委之，寧以我身.代友人命。」賊相謂曰：「我輩.無義之人，而入.有義之國！」遂.班軍而還，一郡並獲全。
  annotations:
    - {"no": 1, term: 胡賊, text: 胡，古代對外族的通稱，秦、漢時多指北方的匈奴。因外族入侵中國，中國屬於「被侵略者」，所以稱外族的軍隊為「胡賊」，表示鄙視、憤怒的情緒。}
    - {"no": 2, term: 「相」視, text: 具代詞功能的助詞。這裡的代詞指的是「你」；「相視」的意思是「看你」。}

