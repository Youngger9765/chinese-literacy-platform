# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略──找出一連串因果
  strategy_type: inference
  blocks:
    - type: concept_box
      text: |-
        本課課文提到巧克力產業中農民的困境，文章隱含了許多環環相扣的前因後果。文章說明了「事情的原因是什麼？」、「結果又是什麼？」、「結果又引發了什麼問題？」閱讀這樣的文章，如果我們能找出這些因果關係，就能幫助我們更了解事件的來龍去脈。
        我們用❶～❹四個步驟，幫助你把文章的前因後果看得更清楚。

    - type: figure
      referent: 找出一連串因果四步驟（流程圖）
      text_carrier: image
      note: 圖檔名 找出一連串因果四步驟.png；圖內所有字串 grep document.xml/footnotes.xml/endnotes.xml 皆 0，確為畫在像素上
      steps:
        - {label: ❶找事件, hint: 識別文章中討論的主要事件／文章討論哪些事}
        - {label: ❷找線索, hint: 尋找文章中的因果關係提示詞／圈出因果提示詞}
        - {label: ❸判斷因果畫箭頭, hint: 分析並標示原因與結果／標出原因與結果}
        - {label: ❹一連串因果圖, hint: 串連形成完整的因果關係鏈／串連完整因果鏈}

    - type: guide
      text: 接下來，我們來學習這個非常重要的閱讀策略──「找出一連串因果」。
      note: 以上 concept_box、圖、本句原稿印在同一個外框內

    - type: guide
      text: 一、推論本文的因果關係-以第四段為例

    - type: guide
      text: |-
        步驟❶──找事件
        1.問自己：這段文字提到了哪些重要事件或現象？

    - type: multi
      label: ◎小試身手：
      prompt: 本課第四段談到哪些事？請在□中打勾（複選，提示：有5個答案）
      options:
        1: 農民收入低、貧困
        2: 利潤分配不公
        3: 童工現象
        4: 代代複製貧窮
        5: 無法靠教育翻身
        6: 可可豆採收繁瑣
      answers: [1, 2, 3, 4, 5]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），文字流查得到

    - type: guide
      text: |-
        步驟❷──找因果線索
        1.問自己：文章中哪些地方透露出「原因→結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？
        2.祕訣：
        A.「有關鍵詞」的文句：
        表示「原因」的關鍵詞有「因為、由於、為了」等等。
        表示「結果」的關鍵詞有「因此、所以、導致、造成」等等。
        B.「沒有關鍵詞」的文句：
        判斷策略：自己加上因果關鍵詞，判斷是否為因果句。
        前句開頭加「因為」、後句開頭加「所以」，看看整句是否合理。
      # 「原因→結果」的箭頭是 Wingdings 符號（w:sym F0E0），**不在文字流**，
      # 所以逐字門在原稿裡找不到它。text 保留印出來的樣子，source_text 是文字流原樣。
      source_text: |-
        步驟❷──找因果線索
        1.問自己：文章中哪些地方透露出「原因結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？
        2.祕訣：
        A.「有關鍵詞」的文句：
        表示「原因」的關鍵詞有「因為、由於、為了」等等。
        表示「結果」的關鍵詞有「因此、所以、導致、造成」等等。
        B.「沒有關鍵詞」的文句：
        判斷策略：自己加上因果關鍵詞，判斷是否為因果句。
        前句開頭加「因為」、後句開頭加「所以」，看看整句是否合理。

    - type: fill_table
      label: ◎小試身手
      instruction: |-
        A.有關鍵詞：先圈關鍵詞，再判斷這個關鍵詞提示的是「因」還是「果」。
        B.沒有關鍵詞：判斷是否為因果句。
      rows:
        - [第四段-A有關鍵詞，先圈關鍵詞, 這個關鍵詞表達]
        - ['1.為了活下去，許多父母不得不把未成年子女送進這個產業鏈當童工', '☑①原因　□②結果']
        - ['2.未成年子女送去當童工。這些孩子因此不可能靠教育翻身', '□①原因　☑②結果']
        - [第四段-B沒有關鍵詞, 判斷是否為因果句]
        - ['1.可可豆乾燥後，交由採購商出口', '□①是因果句　☑②不是因果句']
        - ['2.在這個扭曲的分配制度下，農民永遠無法改善生計', '☑①是因果句　□②不是因果句']
        - ['3.這些孩子不可能靠教育翻身，只能一代一代複製貧窮', '☑①是因果句　□②不是因果句']
      circled_keywords: [為了, 因此]
      answer_carrier: |-
        兩種載體：☑ 是 w:sym Wingdings F0FE；「先圈關鍵詞」的答案是字元框線
        —— 「為了」w:bdr color=auto（黑框）、「因此」w:bdr color=C00000 sz=24（紅框），
        沒有框的關鍵詞就不是答案。第一列表頭原稿印在同一張表內。

    - type: guide
      text: |-
        步驟❸──判斷因果，畫箭頭
        1.問自己：在找到的因果語句中，「原因」是哪一部分？「結果」是哪一部分？兩者之間如何連接？
        2.祕訣：畫一個箭頭「→」從原因指向結果，就一目了然了！

    - type: fill_table
      label: ◎小試身手
      instruction: 根據上表，請判斷誰是因？誰是果？並畫正確箭頭方向
      rows:
        - [事件, 因, 果, 箭頭方向, 事件, 因, 果]
        - ['1.利潤分配不公', '☑', '□', '→', 農民生活貧困, '□', '☑']
        - ['2.農民生活貧困', '☑', '□', '→', 送孩子當童工, '□', '☑']
        - ['3.孩子當童工', '☑', '□', '→', 不能靠教育翻身, '□', '☑']
        - ['4.不能靠教育翻身', '☑', '□', '→', 一代代複製貧窮, '□', '☑']
      answer_carrier: |-
        ☑ 為 w:sym Wingdings F0FE（第 1 列黑色、第 2~4 列紅色，顏色不同不代表意義不同）；
        「箭頭方向」欄的 → 原稿已印，第 2~4 列印成紅色。四列一律左＝因、右＝果。

    - type: guide
      text: |-
        3.你發現了上表的兩個特色嗎？
        A：1、2、3、4的「因」和「果」，都是「因」在前，「果」在後。
        B：事件1的果，變成了事件2的因；事件２的果，變成了事件３的因，以此類推。

    - type: figure
      referent: diagram
      note: |-
        因果接力示意圖：因1→果1、因2→果2、因3→果3，前一組的「果」連到下一組的「因」。
        橢圓與連接線是圖形，但標籤在文字層（txbxContent），所以不標 text_carrier: image。
      labels: [因1, 果1, 因2, 果2, 因3, 果3]

    - type: guide
      text: |-
        步驟❹──連成一連串因果
        1.問自己：文章中是否有一連串環環相扣的因果關係（因果鏈）？能否把多個因果關係串連起來，形成一個完整的脈絡？
        2.祕訣：當一件事的「結果」又成為下一件事的「原因」時，就形成了一連串的因果。
        我們可以把這些環環相扣的關係連接成一個流程圖或概念圖，來幫助理解整體脈絡。

    - type: figure
      referent: diagram
      note: |-
        一連串因果示意圖：因1→果1→因2→果2→因3→果3→因4→果4，外圈以虛線框起整條因果鏈。
        同上，標籤在文字層，不標 text_carrier: image。
      labels: [因1, 果1, 因2, 果2, 因3, 果3, 因4, 果4]

    - type: free_text
      label: ◎小試身手
      prompt: |-
        A.以本文為例，第四段隱含著一條重要的因果鏈。上表我們已經找到4個因果關係，接下來我們再看看它們之間的關係，請排序畫出一條因果鏈。
        ❶利潤分配不公    ❷農民收入低、貧困  ❸童工現象
        ❹無法靠教育翻身  ❺代代複製貧窮
        B.一連串因果（可以寫編號或寫自己看得懂的關鍵詞）
      answer_chain: [利潤分配不公, 農民收入低、貧困, 童工現象, 無法靠教育翻身, 代代複製貧窮]
      answer_carrier: 原稿已填（首尾為黑色印刷，中間三格為橘色手寫體答案）

    - type: guide
      text: 'C.這條因果鏈告訴我們：不公平的利潤分配引發了一連串社會問題，最終讓農民的貧窮代代相傳。'

    - type: free_text
      label: 二、挑戰題：推論因果關係-再以第五段為例
      prompt: 1.本課第五段也有一組因果鏈，請你用4個步驟，畫出第五段的因果鏈。
      answer_chain: [氣候變遷 + 農民貧困, 砍伐森林, 破壞生態, 病蟲害增加, 可可產量不穩, 農民更貧困]
      answer_carrier: 「破壞生態」「可可產量不穩」為橘色手寫體（學生填），其餘原稿已印

    - type: guide
      text: '2.這條因果鏈告訴我們：環境變遷和農民貧困問題交織在一起，最終讓農民更貧困。'

    - type: figure
      referent: 實作流程示例（側欄四步驟小圖）
      text_carrier: image
      note: 圖檔名 實作流程示例.png；「步驟1 閱讀文章 找出主要事件」等字串 grep 三個 xml 皆 0
      steps:
        - {label: 步驟1, hint: 閱讀文章 找出主要事件}
        - {label: 步驟2, hint: 標記關鍵詞「因為」「所以」……}
        - {label: 步驟3, hint: 用箭頭連接 原因 → 結果}
        - {label: 步驟4, hint: 完成因果圖 理解來龍去脈}

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出文章中的重要事件。
        - 2.我能辨識表示原因和結果的關鍵詞。
        - 3.我能判斷誰是因？誰是果？並用箭頭連接因果關係。
        - 4.我能將相關的因果事件，連出一連串因果。
        - 5.我發現因果鏈分析，可以幫我把零散的訊息連成有意義的脈絡。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

    - type: guide
      text: ※如果你5項都打勾，恭喜你，表示你已經學會用 4 步驟「推論一連串因果」！而且你瞭解這個策略對你的幫助。

# ── 六 文章重點表 ──
keypoints:
  title: 讓你口中的甜蜜，成為遠方農民的希望
  intro: 這是一篇說明文，閱讀聚光燈你已經學會用「一連串因果」整理事件的脈絡，接著，我們就來整理本課的重點嘍！
  layout: list
  rows:
    - label: |-
        問題1：
        農民辛苦與童工問題
      value: |-
        1.種植與採收可可豆【　】，但農民的收入很低，難以養家活口
        2.為節省成本，不少農場雇用【　】。
      blanks: [{answer: 過程繁瑣、費工耗時}, {answer: 童工}]
    - label: |-
        問題 2：
        利潤分配不均與世代貧窮
      value: |-
        1.全球巧克力產業【　】，大量利潤被製造商與經銷商取得，底層農民收益不到總額5%。
        2.扭曲的分配制度導致農民無法改善生計，被迫讓子女從事童工，一代代【　】。
      blanks: [{answer: 利潤分配不均}, {answer: 複製貧窮}]
    - label: |-
        問題3：
        環境惡化
      value: |-
        1.【　】使病蟲害加劇，農民無力改善問題，只好【　】開墾新地。
        2.砍伐森林又【　】，惡化病蟲害與土壤流失，導致【　】。
      blanks: [{answer: 氣候變遷}, {answer: 砍伐森林}, {answer: 破壞生態}, {answer: 可可產量不穩}]
    - label: |-
        解決方案：
        公平交易模式
      value: |-
        1.採【　】模式，直接與農民合作社簽約，減少中間商【　】，保證合理的價格，並禁用童工。
        2.「東尼公平巧克力」為典範，無奴工、不規則巧克力造型提醒【　】，並投資農村建設。
      blanks: [{answer: 公平交易}, {answer: 剝削}, {answer: 分配不公}]
    - label: 結語
      value: 提醒讀者選購有【　】標章的巧克力，以實際支持農民。
      blanks: [{answer: 公平交易/永續認證}]
  answer_carrier: 橘色手寫體填在【　】內，文字流查得到

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列哪一選項最能說明本文揭露的可可產業主要問題？
      options:
        A: 巧克力產業的工序繁瑣，讓可可農民過於費工耗時
        B: 可可種植過程大量使用機械，工人需求日益減少
        C: 農民被剝削，收入太低，農場雇用未滿15歲的童工
        D: 受到氣候變遷衝擊，農民開始使用農藥與肥料
    - index: 2
      answer: A
      stem: 作者在第二段詳細描述可可果的生長位置和採收方式，這樣安排的用意為何？
      options:
        A: 凸顯可可採收繁瑣，讓讀者理解農民辛苦，為後面的問題鋪墊
        B: 教導讀者如何親自採收可可果，鼓勵大家實地體驗農耕生活
        C: 對比可可與一般水果生長的差異，以說明巧克力特殊風味的來源
        D: 描繪可可果貼幹生長的奇觀，增添文章畫面感與趣味性
    - index: 3
      answer: B
      stem: 作者舉「東尼公平巧克力」的例子，這樣的寫作安排主要有什麼作用？
      options:
        A: 替公司打廣告，吸引讀者購買該品牌推出的特殊造型巧克力產品
        B: 提供實例說明公平交易的制度，以改善產業鏈不公平的現象
        C: 強調荷蘭巧克力在造型設計上創新有趣，建議其他品牌仿效
        D: 表明只有大型企業才有能力解決可可產業問題，消費者無力改變現況
    - index: 4
      answer: A
      stem: 下列何者最符合本文的主旨？
      options:
        A: 揭露巧克力產業鏈背後隱藏的不公平，呼籲消費者支持公平交易
        B: 詳細介紹巧克力的原料來源、生產過程、商業模式與發展歷史
        C: 探討童工造成教育中斷與貧窮的惡性循環，呼籲保障兒童受教權
        D: 聚焦在氣候變遷與砍伐森林對產業鏈的威脅，呼籲注重環保問題
      explanation: 第4題解析：本文強調我們口中甜蜜的巧克力背後有可可農民的辛酸血汗，包括極低的收入、童工問題和生態困境，並在結尾呼籲大家選擇有「公平交易」或「永續認證」的良心品牌，以改善農民處境。
    - index: 5
      answer: D
      stem: 下列哪一種情境最符合文章所提倡的「公平交易」精神？
      options:
        A: 一家科技公司將部分營收投入新產品研發，以提升產品性能和國際競爭力
        B: 一個服飾品牌為降低成本而削減工人薪資，商品以低價出售，以利消費者
        C: 某超市大量進口廉價巧克力，宣稱價格愈低愈能幫助消費者節省開支
        D: 一家咖啡公司以高於市場的價格向小農收購咖啡豆，以改善農民生活
      explanation: 選項D 咖啡公司的作法（給小農公道收購價）與文章描述的公平交易理念相符，也是將文章最後號召的行動延伸到其他產業的實例。
  answer_carrier: 答案代號印在題號前的（　）內，橘色手寫體；兩則解析印在獨立的文字方塊中

