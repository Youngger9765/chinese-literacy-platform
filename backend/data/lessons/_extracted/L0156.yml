    第 2 條（註腳計入）**本課不必套**，雖然本課真的有 10 條註腳 ——
    因為註腳都掛在 Q1~Q4 那幾段，落在計數區間（段2~段4）之外。
    第 3、4 條不必套。
    字數欄在第 4 段就停止（Q1~Q4 與第 6 段沒有數字），所以最後一個數字 396 不是全文長度。
  timing_table:
    columns: [第1次計時, 第2次計時, 第3次計時, 裁判計時]
    unit: 字
    unit_note: 🔴 本課是**字**（1 分鐘讀幾字），跟 L0154／L0155 的「秒」不同 —— 又一個「這課走白話那套」的證據
    judge_signature: true
  benchmark_instruction: ◎ 我的表現
  benchmark:
    - {threshold: ＜220字, feedback: 還要多加練習。}
    - {threshold: 221~250字, feedback: 嗯，還不錯喲！}
    - {threshold: ＞251字, feedback: 哇嗚，超級厲害！}

