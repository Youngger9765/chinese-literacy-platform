    那幾個看起來反常的小跳躍（102→107、193→195→200）正是小標與段落換行造成的，
    不是抓錯段落。
    ⚠️ 本課屬「字數欄提早停止」那一型：第 9 段沒有數字，所以 478 **不是全文長度**
    （全文逐字約 1105，含四個小標）。
  inline_marked_terms: [青睞, 爭強鬥勝, 粉墨登場, 嬌客, 耳目一新, 招親, 真摯, 迢迢, "雄赳赳、氣昂昂", 尾隨而至, 丰采]
  inline_marked_terms_note: |-
    課文中加方框的語詞。⚠️ 第 6 段方框只框住「迢迢」兩字（不是整個「千里迢迢」），
    照版面記錄。第 7 段的方框跨行框住「雄赳赳、氣昂昂」。

