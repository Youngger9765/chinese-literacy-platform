# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  lesson_heading: 第14課  動物談情說愛的方式
  paragraph_count: 9
  section_headings: [用歌聲求偶, 用舞姿求偶, 以氣味求偶, 用力量求偶]
  section_headings_note: |-
    四個小標印在課文中間、外加灰底方框，是段落之間的分節標題，不佔段號
    （段號欄只有「一~九」九個號碼）。⚠️ 但它們**會被算進右緣的累計字數**（見 char_count_note）。
    這四個小標同時是第五大題（聚光燈）整個策略的骨架。
  paragraphs:
    - idx: 1
      text: 每一種動物，都需要繁衍後代。但是，在大自然遼闊的空間裡，動物會用哪些方式傳遞出「我在這裡！」「我準備好了！」的訊息，吸引求偶對象前來相會，上演一場「月上柳梢頭，人約黃昏後」的約會呢？
      footnote_ref: 1
      followed_by_heading: 用歌聲求偶
    - idx: 2
      text: 潮濕溫暖的夏夜，嘓嘓嘓、嘓嘓嘓，雄蛙奮力的在池塘裡展現歌喉，只為求得雌蛙的青睞，繁衍下一代。雄蛙求偶的鳴叫聲響遍池畔，也引來其他雄蛙爭強鬥勝。是否能順利成為心儀對象的「青蛙王子」？雄蛙們可要各憑本事才行。
    - idx: 3
      text: 春天來臨，住在枯木洞裡的五色鳥，開始粉墨登場，準備在演唱會上一展歌喉。牠身穿綠衣裳，頭戴彩色帽，站在茂密枝葉搭起的舞臺上，揭開演唱會的序幕。五色鳥發出喀、喀、喀喀喀喀……的求偶叫聲，盡情的歌唱。牠獨特的聲音吸引愛慕者，為繁衍後代做準備。
      followed_by_heading: 用舞姿求偶
    - idx: 4
      text: 頭形像馬、長相特殊的海馬，是海底世界的嬌客。到了繁殖期，雄海馬會讓體色忽明忽暗，舞出曼妙的姿勢，吸引仰慕者；牠還會展示腹部的孵卵囊，也就是用來孵育小海馬的袋子。等到彼此接受，牠們便腹部相對，上下漂浮、旋轉嬉戲；翻滾的海水彷彿奏起結婚進行曲，一對佳偶在浪漫的旋律中，跳著雙人舞進入洞房。
    - idx: 5
      text: 到了繁殖季節，鴕鳥會舉行熱鬧非凡、令人耳目一新的招親活動。平常沉默的雄鳥，在求偶期間卻大展身手：一方面發出低沉的叫聲，呼喚雌鳥；一方面有節奏的展開、收合翅膀，露出尖端的白色羽毛，繞著雌鳥跳起獨特的求偶舞。
      marker: ☞ 印在本段首行（念順順起點）
      followed_by_heading: 以氣味求偶
    - idx: 6
      text: 花園裡、田野間，飛蛾也翩翩飛舞。飛蛾的生命雖然短暫，卻仍能完成繁衍後代的任務。雌蛾會分泌一種特殊氣味，這股氣味隨著空氣擴散，傳遞真摯的求偶訊息，吸引遠方的雄蛾千里迢迢飛來相會。
      followed_by_heading: 用力量求偶
    - idx: 7
      text: 為了躲避敵人的攻擊，也為了避免陽光曝曬，招潮蟹會在地洞裡築巢。到了求偶季節，雄蟹頂著兩根像火柴棒般的眼柄，雄赳赳、氣昂昂的站在洞口，快速揮動大螯，向雌蟹發出求偶訊息。醒目的大螯不但能吸引雌蟹，也能向競爭對手展示力量，彷彿在說：「看看我，我可是強壯又有本事的對象！」
    - idx: 8
      text: 春暖花開時，許多蛇結束冬眠，出洞尋覓佳人。雌蛇會釋放特殊氣味，藉此傳出「我已經成熟，可以繁衍後代」的訊息。雄蛇聞到後，便循著氣味尾隨而至，展開追求。有些蛇類若有多隻雄蛇同時追求同一隻雌蛇，雄蛇可能彼此搏鬥，勝出的雄蛇才有較多機會與雌蛇交配。雄蛇的競爭熱鬧了山林，蛇類也在一次次求偶中延續生命。
    - idx: 9
      text: 動物透過多采多姿的求偶方式，尋找配偶、繁衍後代。聲音、舞姿、氣味和力量，各有不同作用，也讓大自然展現出萬千丰采。
  footnotes:
    - {ref: 1, term: 月上柳梢頭，人約黃昏後, text: 月亮剛爬到柳樹頭上時，一對戀人約好在黃昏後見面。}
