    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
    層級關係改用 guide 標題（一~六 與 ❶❷❸）表達。
  blocks:
    - type: concept_box
      text: |-
        誘餌式標題充斥在我們的生活中，但我們可以用三個步驟判斷，到底所讀的報導是不是誘餌式標題：
        ❶看標題：標題用什麼方式吸引我？它用了引發好奇、誇張等方式嗎？
        ❷對內容：標題和內容是否一致？有沒有省略、放大或扭曲？
        ❸下判斷：這是準確標題、吸睛但不誤導？還是誘餌式標題？
        底下的學習任務將讓你有多次練習這三個判斷步驟的機會！

    - type: guide
      text: 一、跟著做：判讀「雷雨炸全臺」

    - type: passage
      paragraphs:
        - 新聞標題：「雷雨炸全臺！氣象署急發快訊」
        - 新聞內容：氣象署例行發布天氣預報，提醒下週部分地區可能出現雷擊與瞬間大雨。

    - type: guide
      text: ❶看標題：

    - type: multi
      prompt: 它用了哪些語詞吸引讀者？（可複選）
      options:
        1: 雷雨炸全臺
        2: 下週
        3: 氣象署
        4: 「急發快訊」
      answers: [1, 4]

    - type: guide
      text: →是的，「炸全臺」會讓人感到災情嚴重；「急發」則製造緊急感。

    - type: concept_box
      text: ※小提醒：看到誇張、模糊或引發強烈情緒的語句時，應該提高警覺，但還不能立刻判定它是誘餌式標題，要繼續核對內容。

    - type: guide
      text: ❷對內容：

    - type: table
      prompt: 標題和內容有什麼落差？請看底下表格的分析：
      columns: [標題寫法, 實際內容]
      rows:
        - [雷雨炸全臺, 部分地區可能出現雷擊與瞬間大雨]
        - [急發快訊, 氣象署例行發布天氣預報]
      rows_note: PDF 上「炸全臺」「部分地區」「急發」「例行發布」四處加了黑框強調，文字層沒有樣式資訊。

    - type: multi
      prompt: 請問這個標題用了哪兩種誤導方式？（複選）
      options:
        1: 把「局部」放大成「全部」
        2: 把已經發生的事說成尚未發生
        3: 完全沒有提到新聞的主題
        4: 把「例行發布」說成「緊急發布」。
      answers: [1, 4]

    - type: guide
      text: ❸下判斷：

    - type: single
      prompt: 這個標題最適合判斷為：
      options:
        1: 準確標題：完整呈現內容。
        2: 吸睛標題：寫法較有趣，但沒有造成明顯誤解。
        3: 誘餌式標題：放大或扭曲內容，容易使讀者產生錯誤理解。
      answer: 3

    - type: guide
      text: 二、再練一次：判讀「明星慘遭爆打」

    - type: passage
      paragraphs:
        - 新聞標題：「某明星慘遭爆打，死前驚吐一句話！」
        - 新聞內容：報導介紹這位明星即將上映的新戲。劇中角色遭人毆打，臨死前說出一句重要臺詞。

    - type: guide
      text: ❶看標題：

    - type: multi
      prompt: 這個標題用了哪些方式吸引讀者？（可複選）
      options:
        1: 使用「死前驚吐一句話」引發好奇
        2: 完整說明這是戲劇情節
        3: 清楚交代事件發生的時間地點
        4: 使用「慘遭爆打」等強烈字眼
      answers: [1, 4]

    - type: guide
      text: ❷對內容：

    - type: single
      prompt: 1.標題省略了哪一項最重要的資訊？
      options:
        1: 明星的年齡
        2: 這是新戲中的情節
        3: 電影上映的日期
        4: 明星在劇中的名字
      answer: 2

    - type: single
      prompt: 2.省略這項資訊後，讀者可能產生什麼誤會？
      options:
        1: 以為明星不再演戲
        2: 以為明星在現實生活中遭到攻擊或死亡
        3: 以為電影已經下檔
        4: 以為明星拒絕接受訪問
      answer: 2

    - type: guide
      text: ❸下判斷：

    - type: single
      prompt: 1.這個標題最適合判斷為：
      options:
        1: 準確標題
        2: 吸睛但未造成誤解
        3: 誘餌式標題
      answer: 3

    - type: free_text
      prompt: 2.我這樣判斷
      answer: 標題刻意省略「戲中角色」這項重要資訊，使讀者誤以為是真實事件，因此屬於誘餌式標題。
      answer_carrier: 原稿已印出參考答案（黑字，非學生手寫）

    - type: guide
      text: 三、你發現了嗎？誘餌式標題常用的三種方法

    - type: table
      columns: [誤導方式, 意思, 例子]
      rows:
        - [❶放大, 把局部、少數或可能發生，寫成全部、普遍或一定發生, 把「部分地區有雨」寫成「雷雨炸全臺」]
        - [❷省略, 故意不說重要背景，引起好奇或誤解, 不說明「明星被打」是戲劇情節]
        - [❸扭曲, 改變原本的程度、原因或關係, 把「例行預報」寫成「急發快訊」]

    - type: guide
      text: |-
        提醒：看到下列誇張的語詞，可以先提高警覺：
        沒想到、震驚、慘遭、恐怖、千萬不要、所有人、一定

    - type: guide
      text: 四、分一分：三種標題不一樣

    - type: guide
      text: 閱讀下列標題與內容摘要，判斷標題屬於哪一類。

    - type: guide
      text: 第1則

    - type: passage
      paragraphs:
        - 標題：「登革熱旺季，衛福部提醒：檢查並清除家中積水」
        - 內容摘要：衛福部提醒民眾定期檢查住家環境，清除容易孳生病媒蚊的積水容器。

    - type: single
      prompt: 我的判斷：
      options:
        1: 準確標題
        2: 吸睛但不誤導
        3: 誘餌式標題
      answer: 1

    - type: guide
      text: 第2則

    - type: passage
      paragraphs:
        - 標題：「每天喝這種飲料，國中生成績竟然一路下滑！」
        - 內容摘要：一項調查發現，睡眠不足和學習表現可能有關；部分睡眠不足的學生也常喝含糖飲料，但研究沒有證明飲料會直接造成成績下降。

    - type: single
      prompt: 1.我的判斷：
      options:
        1: 準確標題
        2: 吸睛但不誤導
        3: 誘餌式標題
      answer: 3

    - type: multi
      prompt: 2.標題有什麼問題？（可複選）
      options:
        1: 把同時出現的兩件事，寫成直接的因果關係。
        2: 把「可能有關」寫得像「一定造成」。
        3: 沒有提到國中生。
        4: 沒有使用驚嘆號。
      answers: [1, 2]

    - type: guide
      text: 五、小試身手：換你自己判斷

    - type: passage
      paragraphs:
        - 新聞標題：「去健身房千萬不要這樣做，95%的人都不知道！」
        - 內容摘要：文章提醒初次使用跑步機的人，應先了解操作方式，並依自己的體能調整速度。文中沒有提供「95%」的調查來源。

    - type: multi
      prompt: ❶看標題：標題使用了哪些吸引方式？（可複選）
      options:
        1: 「千萬不要」製造危險感
        2: 用「這樣做」隱藏重要資訊。
        3: 使用「95%」增加可信感。
        4: 清楚說明是哪一個健身動作。
      answers: [1, 2, 3]

    - type: multi
      prompt: ❷對內容：標題和內容有哪些落差？（可複選）
      options:
        1: 標題暗示有嚴重危險，內容只是一般安全提醒。
        2: 標題使用「95%」，內容卻沒有提供調查來源。
        3: 標題說的是健身房，內容卻在介紹游泳池。
        4: 標題提到操作跑步機，內容也完整說明。
      answers: [1, 2]

    - type: single
      prompt: ❸下判斷：這個標題最適合判斷為?
      options:
        1: 準確標題
        2: 吸睛但不誤導
        3: 誘餌式標題
      answer: 3

    - type: guide
      text: 六、幫新聞換一個好標題

    - type: passage
      paragraphs:
        - 誘餌式標題：「去健身房千萬不要這樣做，95%的人都不知道！」

    - type: single
      prompt: 哪一個修改後的標題比較完整、準確？
      options:
        1: 震驚！跑步機竟藏著可怕危機
        2: 初次使用跑步機，先了解操作方式與安全速度
        3: 跑步機千萬別亂碰，否則後果不堪設想
      answer: 2

    - type: guide
      text: |-
        ※好標題的三個原則
        ❶說清楚主題。
        ❷符合文章內容。
        ❸不故意誇大或製造誤解。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p10）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: D
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 過了五十歲，許多人因為老花眼看東西總是「眼花撩亂」
        B: 早餐店湧入人潮，顧客一個接一個，真是「目不暇給」
        C: 這則新聞報導的標題「聳動」，這麼無聊的標題誰會想看
        D: 他這次會考作文寫的「文不對題」，難怪得不到高分
    - index: 2
      answer: A
      stem: 「誘餌式標題」通常文字聳動，吸引人們點擊，以下哪個不屬於「誘餌式標題」?
      options:
        A: 動物園保育技術突破，成功繁殖穿山甲
        B: 早餐千萬別吃這個，小心終身洗腎
        C: 天天騎機車上下班，40歲的她居然……
        D: 藝人飆高音唱歌曲，慘烈破音差點斷氣
      stem_note: 原稿的「不屬於」加了底線，末尾用半形問號。
    - index: 3
      answer: B
      stem: 誘餌式標題頻繁出現在我們的生活中，面對這些亂象，下面哪個做法較不恰當？
      options:
        A: 要對誇張的標題保持警戒
        B: 不再閱讀所有的報章雜誌
        C: 核對標題與內容的一致性
        D: 努力培養獨立思考的能力
      stem_note: 原稿的「不恰當」加了底線。
    - index: 4
      answer: C
      stem: 以下哪些是誘餌式標題的特徵？
      option_bank: {甲: 誇張的文字, 乙: 利用熱門話題或公眾人物, 丙: 模糊不清的訊息, 丁: 直接的描述, 戊: 情緒性的字眼}
      option_bank_note: 甲~戊 印在題幹下方的方框裡，四個選項是它們的組合。
      options:
        A: 甲乙丙丁
        B: 乙丙丁戊
        C: 甲乙丙戊
        D: 甲丙丁戊
    - index: 5
      answer: B
      stem: 這篇課文的作者最想達成什麼目的？
      options:
        A: 想要博取讀者的目光，對這篇文點讚
        B: 想要提醒讀者如何有智慧的閱讀網路文章
        C: 想要教導讀者避免寫出文不對題的文章
        D: 想要教導讀者寫作時如何下標

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  instruction_note: 原稿同時存在「劃掉」版與「刪除」版兩句（兩個重疊的文字方塊），表格正上方印的是「刪除」版。
  target_words: [文不對題, 辛辣, 誘餌, 閱聽大眾, 博取, 聳動, 目不暇給, 語不驚人死不休, 推播, 帶風向, 核對, 氾濫, 眼花撩亂]
  grid_size: [10, 10]
  grid:
    - 點擊率聳動捕浮誇獎誘
    - 播文章勳釣魚式標題餌
    - 話語不驚人死不休息室
    - 氾爛核對秀耳聞聽太眾
    - 監調味料題目不耳帶警
    - 幸莘辛苦不閱問颱風戒
    - 重辣空暇眼聽説氾向傳
    - 口味給該花大濫製造取
    - 味堆亥對撩眾人娶博暖
    - 推播媒體亂題不對愛取
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 聳動
      cells: [[1, 4], [1, 5]]
      direction: horizontal
    - word: 誘餌
      cells: [[1, 10], [2, 10]]
      direction: vertical
    - word: 文不對題
      cells: [[2, 2], [3, 3], [4, 4], [5, 5]]
      direction: diagonal_down_right
    - word: 語不驚人死不休
      cells: [[3, 2], [3, 3], [3, 4], [3, 5], [3, 6], [3, 7], [3, 8]]
      direction: horizontal
    - word: 核對
      cells: [[4, 3], [4, 4]]
      direction: horizontal
    - word: 目不暇給
      cells: [[5, 6], [6, 5], [7, 4], [8, 3]]
      direction: diagonal_down_left
    - word: 帶風向
      cells: [[5, 9], [6, 9], [7, 9]]
      direction: vertical
    - word: 辛辣
      cells: [[6, 3], [7, 2]]
      direction: diagonal_down_left
    - word: 閱聽大眾
      cells: [[6, 6], [7, 6], [8, 6], [9, 6]]
      direction: vertical
    - word: 眼花撩亂
      cells: [[7, 5], [8, 5], [9, 5], [10, 5]]
      direction: vertical
    - word: 氾濫
      cells: [[7, 8], [8, 7]]
      direction: diagonal_down_left
    - word: 博取
      cells: [[9, 9], [10, 10]]
      direction: diagonal_down_right
    - word: 推播
      cells: [[10, 1], [10, 2]]
      direction: horizontal
  answer_paths_note: |-
    13 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。
    幾何交叉驗證（單向警報）：**以找字表格元素本身當邊界**（不是用指示語字串切），
    表格內、扣掉紙外殘留後的 roundRect = **13 個**，路徑也是 13 條 → 沒有「紙上 > 路徑」的缺條警報。
    紙外殘留檢查：表格內帶 roundRect 的 anchor 換算成距頁左絕對位置全部 < 頁寬
    （A4 直式 7560310 EMU），**0 個紙外**。
    ⚠️ 全文共 20 個 roundRect —— 表格外那 7 個是聚光燈第一~六個任務的**圓角新聞框**
    （新聞標題／內容摘要那幾個框），不是漏抽的答案。
    ⚠️ 反向（紙上 < 路徑）不代表缺陷 —— 圈選常用別種圖形畫，roundRect 不是全部。
    主判準仍是下面每一條的 cells 套回 grid 拼字（比內容不比數量）。
    ⚠️ 三條路徑會共用格子：「文不對題」的〔3,3〕與「語不驚人死不休」的〔3,3〕是同一格「不」，
    〔4,4〕又同時屬於「核對」的「對」——原稿的圈線確實互相交叉，不是座標抄錯。

