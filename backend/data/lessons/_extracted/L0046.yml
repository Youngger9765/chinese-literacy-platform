# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫字；文字流已含答案
  questions:
    - index: 1
      answer: B
      stem: 請問哪一個句子使用語詞正確？
      options:
        A: 美術比賽競爭激烈，參賽者精心準備，現場氣氛「險象環生」
        B: 考試前夕，失敗的念頭一直在腦中「盤旋」，讓我失眠了
        C: 我「引領」著我家的寵物貓和狗去公園散步
        D: 他對數學的興趣「廣闊無垠」，總是喜歡研究各種題目
      teacher_note: （A-「險象環生」用於形容危機四伏的情境，而美術比賽並無危險性，現場氣氛應為緊張刺激。C-「引領」通常用於帶領人群或象徵性的指導、領導。D-「廣闊無垠」用來形容空間的無邊無際，而非興趣範圍，應為廣泛。）
    - index: 2
      answer: D
      stem: 根據本文，下列發明與其功能的對應關係，何者描述不正確？
      options:
        A: 單翼飛行機器人——可垂直起飛，在狹窄空間移動
        B: 仿生太陽能板——能調整角度，提高吸收陽光的效率
        C: 風滾草探測器——可利用風力在火星地表移動
        D: 風滾草探測器——固定在原地，只觀察同一個地點
    - index: 3
      answer: B
      stem: 本課是說明文，作者主要運用哪一種說明方法來介紹「仿生學」？
      options:
        A: 比較說明─透過科技產品的比較來說明仿生學
        B: 舉例說明─透過列舉具體事例讓讀者理解仿生學
        C: 定義說明─直接解釋各種科技品的概念和用途
        D: 過程說明─詳細描述仿生學是如何逐步發明出來的
      teacher_note: （文章先描述楓樹種子的飛行方式，接著介紹科學家如何受到啟發發明「沙馬雷」，這是典型的舉例說明手法）
    - index: 4
      answer: D
      stem: 有許多語詞，可以用「拆詞釋義」的方式猜出它的意思，例如，防腐劑、危機四伏。請問底下選項中，哪一個語詞無法用「拆詞釋義」的策略來猜出它的意思？
      options:
        A: 一目十行
        B: 日新月異
        C: 垂直起降
        D: 馬馬虎虎
      options_note: 這四個選項在原稿印成同一行（A.一目十行　B.日新月異　C.垂直起降　D.馬馬虎虎），此處拆成四個選項。
    - index: 5
      answer: C
      stem: 課文末段說明了什麼是「仿生學」，請問底下選項中哪一個是「仿生學」的例子？
      options:
        A: 把速度最快的游泳選手取一個叫飛魚的綽號
        B: 把河馬張開大嘴的相片貼在大胃王餐廳的招牌上
        C: 模仿荷葉不易沾水的特性，設計不容易沾水的雨傘
        D: 把虎豹的斑紋印在布料上，做成服飾，以吸引人注意

