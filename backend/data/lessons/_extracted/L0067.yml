# ── 二 讀全文 ──
body:
  header_level: Level 6・說明文
  header_strategy: 目標策略：自我提問策略1──跟著人物故事線問問題
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: 臺灣有個種樹達人，名叫賴倍元，大家都稱他為賴桑。童年時期的賴桑，喜歡到溪邊抓泥鰍、到樹上摘果實，整天與大自然為伍。十四歲開始，他跟著父親經營家族的運輸事業，工作之餘，就會騎著機車上山看神木。他常仰望著三千多歲的神木，呼吸著森林裡獨特的沁涼空氣，感受到自己生命的短暫與大自然的永恆，所有的煩惱也消失殆盡。他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 2
      text: 心志定了，接下來就是實際行動。
    - idx: 3
      text: 二十九歲那年，他花了三千萬元買下第一座山，卻發現整座山布滿垃圾和廢棄物，蒼蠅嗡嗡嗡的飛來飛去，根本沒什麼價值。原來，這裡曾是果園，因為長年無人管理，遭人偷偷倒了大量垃圾。他被眼前的景象震懾住了，但隨即轉變念頭，告訴自己：「沒關係！最壞的都留給我吧！」
    - idx: 4
      text: 他開著卡車上山清運垃圾，花了好幾個月，來來回回跑了兩千多趟，才把垃圾清光。親友們都認為賴桑若不是瘋了，就是很笨。但是他不以為意，還將貨運行交給妻子管理，就這樣一個人上山去種樹。
    - idx: 5
      text: 但要種什麼樹呢？他諮詢了許多木材行老闆，大家都告訴他要種肖楠。肖楠是臺灣特有種，適合種在海拔一千多公尺的山區，樹高可達五十公尺。於是他買了數千株樹苗，準備種樹。但這裡過去是廢棄的果園，長期使用除草劑，不但破壞了土質，也使土壤失去涵養水分的功能。為了讓樹苗順利長大，賴桑決定不使用化學肥料和除草劑。他不畏懼挑戰，改以人工除草，又鋪設了四十多公里的水管，定時澆灌剛種下的小樹苗。這可是一項耗時費力的浩大工程。辛苦歸辛苦，但賴桑說：「我的信仰就是種樹，人類過去砍了太多樹，我要把它們種回來！」三十年來，他已經在大雪山種了三十多萬棵珍貴樹木。賴桑的夢想，是在有生之年種下五十萬棵臺灣珍貴樹木，包括肖楠、牛樟、松樹、柏樹等。
    - idx: 6
      text: 買地要錢、買樹苗要錢、僱工種樹要錢、鋪設水管要錢，每一樣都要錢。賴桑哪裡來的錢呢？這就要說到一路支持他的家人。
    - idx: 7
      text: 在賴桑專心上山種樹後，賴太太扛起家庭與公司的一切責任，生活非常辛苦，常常躲起來哭泣。但她擦乾眼淚後，總會想辦法幫先生籌措一筆又一筆的錢，讓他買下一座又一座的山，種下一棵又一棵的樹。賴桑的兩個兒子看見媽媽如此辛苦，起初很不能諒解父親的作為，覺得爸爸拋家棄子、不負責任；但隨著地球暖化日益嚴重，愈來愈多人注意到他所做的事，連總統也到山上感謝賴桑的付出。兒子們才漸漸理解，父親做的是真正重要、能造福子子孫孫的事。看到爸爸種樹有成，兒子們也開始在樹蔭下種植不太需要陽光直射、又有經濟價值的咖啡樹，再將販售所得投入父親的種樹志業。
    - idx: 8
      text: 經過數十年的用心經營，現在走進大雪山林場，從山坡上往下看，一棵棵站得挺直的大樹，像極了精神抖擻的森林大軍。森林裡的生態豐富而多元，小動物、小昆蟲處處可見，鳥聲蟲鳴時時入耳；大冠鷲盤旋天空的景致，更是迷人！這樣的美景感動了一批又一批的登山者，在眾人口耳相傳、媒體爭相報導後，愈來愈多人認同賴桑的理念，一起加入種樹的行列。賴桑認為，推廣種樹和種樹一樣重要，他希望影響更多人，一起為下一代留下美麗的森林寶藏。
