    - {index: 6, word: 震懾, definition: 受到強烈的力量或景象影響，感到震驚、害怕。}
    - {index: 7, word: 畏懼, definition: 害怕，恐懼。}
    - {index: 8, word: 與…為伍, definition: 和……相處、作伴。}
    - {index: 9, word: 有生之年, definition: 人還活在世上的時間。}
    - {index: 10, word: 拋家棄子, definition: 離開家庭，不管孩子。}
    - {index: 11, word: 籌措, definition: 想辦法準備或募集所需的資金、物資。}

