        2: 跟著故事線選問題，能找重要內容；回答不完整時，我會回頭找線索。
      answer: 2

    - type: self_check
      label: 2.自我檢核
      instruction: 如果你有做到，請在□打勾。
      items:
        - ①我能根據人物故事發展，選出現在最適合問自己的問題。
        - ②我會帶著問題找線索；回答不完整時，會回頭再讀。
        - ③我能把三個問題的答案合起來，看懂全文發展。
      no_correct_answer: true
