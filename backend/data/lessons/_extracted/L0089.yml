# ── 五 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 自我提問──詰問作者
  strategy_type: self_questioning
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）＋橘色手寫填空
  blocks:
    - type: concept_box
      text: |-
        課文中的曼屏讀〈背影〉時，產生一個疑問：「朱自清為什麼要寫自己和父親面對面時沒有感動，看見父親的背影時卻感動到流淚？」
        老師認為這是個好問題，便提議舉辦讀書會，討論主題定為：「〈背影〉的作者朱自清，為什麼特別描寫父親買橘子時的『背影』？」
        像這樣，針對作者的表達提出問題，追問「作者為什麼這樣寫？」或「這樣寫想讓我們讀到什麼？」就是「詰問作者」
        作者不在眼前，不能直接回答我們。問完後，要回到文章找線索，把前後內容放在一起想，才能找到有根據的答案。
        詰問作者，可以幫助我們不只知道文章「寫了什麼」，還能進一步看懂作者「為什麼這樣寫」。

    - type: guide
      text: 一、跟著問題，重新看〈背影〉
    - type: guide
      text: 我們就帶著這個問題，再看看文章前後的線索：
    - type: guide
      text: 〈背影〉的作者朱自清為什麼特別描寫父親買橘子時的「背影」？
    - type: guide
      text: ❶前面和後來，有什麼不同？
    - type: guide
      text: 請把「前三次父子互動」和「父親買橘子」的兩個情節放在一起看。
    - type: fill_table
      columns: [項目, 前三次父子互動, 父親買橘子]
      column_note: 第一欄沒有印欄名，格內印的是列名（父親的行動／兒子的反應／兒子注意到什麼？），本檔命名為「項目」
      rows:
        - 項目: 父親的行動
          前三次父子互動: 囑託、送行、講價、叮嚀，都是在替兒子張羅
          父親買橘子: 吃力爬上、爬下月臺，替兒子買橘子
        - 項目: 兒子的反應
          前三次父子互動: 不置可否、插嘴、覺得父親多此一舉
          父親買橘子: 看著父親的背影，對父親的看法改變
        - 項目: 兒子注意到什麼？
          前三次父子互動: |-
            ①父親一直為自己付出
            ②父親說話、做事讓自己不耐的地方
          前三次父子互動_options: {1: 父親一直為自己付出, 2: 父親說話、做事讓自己不耐的地方}
          前三次父子互動_answer: 2
          父親買橘子: |-
            ①父親年紀已大，仍辛苦為自己做事
            ②父親動作不夠俐落
