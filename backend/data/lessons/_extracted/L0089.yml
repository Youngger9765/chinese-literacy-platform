# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版詳解），文字流有此資訊；五題都有
  questions:
    - index: 1
      answer: C
      stem: 下列語詞何者使用正確？
      options:
        A: 這家鞋店的商品「鉅細靡遺」，各種尺寸都有
        B: 大雄剛寫完作文，就自稱這篇文章是「經典之作」
        C: 面對是否參賽的詢問，他始終「不置可否」
        D: 藍色顏料用完，這幅畫的天空只好「獨白」了
      teacher_hint: 第1題詳解：A的「鉅細靡遺」不能形容商品齊全；B的作品尚未經過長時間肯定；D的「獨白」只能用於角色獨自說出內心想法。
    - index: 2
      answer: A
      stem: 比較〈背影〉中兒子對父親的態度，與第十三段同學分享的經驗，下列哪一項是共同之處？
      options:
        A: 起初不耐煩長輩的關心，後來看見長輩的付出
        B: 起初期待長輩的協助，後來嫌棄長輩不夠能幹
        C: 起初害怕受到長輩責備，後來主動向長輩道歉
        D: 起初認為長輩十分冷漠，後來才發現長輩關心
      teacher_hint: 第2題詳解：兒子、義傑和愛玲起初都對長輩的關心感到不耐；後來看見長輩的背影與付出，才重新理解長輩的心意。
    - index: 3
      answer: B
      stem: 〈背影〉中，兒子看見父親背影之前和之後，態度有什麼轉變？
      options:
        A: 從擔心與害怕，轉為安心與依賴
        B: 從不耐與輕視，轉為理解與感動
        C: 從冷漠與疏遠，轉為熱情與體貼
        D: 從快樂與期待，轉為悲傷與失望
      teacher_hint: 第3題詳解：兒子先前嫌父親說話很迂、認為父親多此一舉；看見父親費力買橘子的背影後，才感受到父親的愛。
    - index: 4
      answer: D
      stem: （課文第十一段）俊良提到父親為兒子買橘子的細節，最直接受到哪一組表演的啟發？
      options: {A: 第一組, B: 第二組, C: 第三組, D: 第四組}
      teacher_hint: 第4題詳解：第四組表演的正是父親費力爬月臺買橘子，兒子坐在遠處觀看的情節。
    - index: 5
      answer: B
      stem: 本文作者林玫伶為什麼詳細描寫四組學生的表演與討論，而不直接由老師說出答案？
      options:
        A: 交代各組不同的表演方式，完整呈現班級活動
        B: 讓讀者跟著學生比較線索，逐步理解背影感人的原因
        C: 強調四組學生對原文情節的記憶都十分正確
        D: 說明讀書會應以角色扮演取代個人閱讀與思考。
      teacher_hint: 第5題詳解：作者詳細呈現表演、畫圖與討論，是讓讀者跟著學生一步步比較父子互動，形成對「背影」的理解。A只是表面效果，C、D都不是文章要表達的重點。

