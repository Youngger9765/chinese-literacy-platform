          blanks: [{answer: 科學證據}]
        - label: 2
          value: 面對災難，平時應具備【　】與防災能力，並留意專業機構發布的資訊。
          blanks: [{answer: 風險意識}]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫字；文字流已含答案
  questions:
    - index: 1
      answer: B
      stem: "請選出最適合「繪聲繪影」語意的句子："
      options:
        A: 他用簡單的語句說明了整件事，大家都聽懂了
        B: 她講故事時聲音忽高忽低，手舞足蹈，讓大家彷彿身歷其境
        C: 老師用公式解釋原理，大家似懂非懂，低頭猛抄筆記
        D: 他只說了一句「事情很複雜」，就結束了報告
    - index: 2
      answer: B
      stem: 文中說「天空會降下火光」這種說法容易讓人覺得「好像應驗了」，人們會這樣覺得的原因是什麼？
      options:
        A: 預言者精確描述了事件的時間與地點
        B: 這句話可以套用到太多不同類型的事件上
        C: 預言者事先觀察到天文異常現象
        D: 人們對天空現象普遍感到恐懼
      teacher_note: (文章解釋這句話可以被套用到火山爆發、戰爭或煙火秀等情況，因而產生「應驗」的感覺。)
    - index: 3
      answer: A
      stem: 「倖存者偏誤」會讓人覺得某個預言很準的原因是什麼？
      options:
        A: 人們會只記住應驗的預言，忽略未應驗的
        B: 所有應驗的預言都附有科學證據
        C: 人們特別尋找符合自己信念的證據
        D: 人們因為未來不確定而尋求安心
    - index: 4
      answer: D
      stem: 作者提到諾查丹瑪斯和瑪雅曆法的例子，是想告訴我們什麼？
      options:
        A: 古代的災難預言比現代更可怕
        B: 不要只聽信預言，平時要做好防災準備
        C: 災難預言會帶來恐懼，所以多去求神拜佛
        D: 即使廣為流傳的著名預言，也可能沒有成真
    - index: 5
      answer: C
      stem: 假如未來有一則預言「東亞地區將在未來五年內出現重大自然災害」，根據文章內容，下列哪種行為最合理？
      options:
        A: 立即搬離東亞，避免任何可能風險
        B: 每天追蹤與預言相符的新聞，確保第一時間得知
        C: 評估科學機構的資料，並落實日常防災準備
        D: 在網路上大量轉發預言，提醒更多人注意
      teacher_note: （文章強調真正可靠的是防災意識與專業機構資訊，而不是聽信模糊預言。）
      options_note: D 選項在 PDF p10 被「八 詞語複習」的圓形標題圖示擠到下方，文字流內完整。

