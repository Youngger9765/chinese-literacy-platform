  option_bank_note: 10 個代號 A–J，對應 8 道小題（H 應驗、J 預言 未被任何一題用到）。
  answer_carrier: 橘色手寫字；文字流已含答案
  items:
    - {index: 1, stem: 網路謠言引發不必要的（　），政府呼籲大家要冷靜。, answer: E}
    - {index: 2, stem: 他把昨晚的驚悚電影說得（　），讓人聽得毛骨悚然。, answer: D}
