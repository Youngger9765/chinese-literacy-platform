    - {index: 4, stem: 他看到幾個成功的創業故事，就以為創業一定能賺大錢，這種想法有（　），因為他忽略了失敗的案例。, answer: C}
    - {index: 5, stem: 這款手機的外型與前一代產品（　），消費者反應平平。, answer: A}
    - {index: 6, stem: 奧運選手的表現引發社群媒體上的（　）。, answer: F}
    - {index: 7, stem: 這支影片上線後，（　）快速上升，顯示受到許多人關注。, answer: G}
