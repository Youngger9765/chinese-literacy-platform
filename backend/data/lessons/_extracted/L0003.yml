# ── 一 讀全文-做記號 ──
body:
  marking_checklist:
    instruction: 如果你有做到下列事項，請在□內打勾
    items:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  level_box: Level 4・說明文
  strategy_box: 目標策略：摘要策略──找小主題與重要細節
  paragraph_count: 8
  paragraphs:
  - idx: 1
    text: 明天學校要去露營，你早早就把背包收好了，也查過天氣預報。但你還是忍不住走到陽台，抬頭看看天空，希望明天是個大晴天。就在這時，你發現陽台的角落有一隻蜘蛛正忙著結一個大網。你皺起眉頭，拿起掃把想把牠揮掉。
  - idx: 2
    text: 且慢！你也許不知道，蜘蛛雖小，但牠的結網卻是一個天晴或下雨的好指標哦。
  - idx: 3
    text: 蜘蛛的絲纖細到幾乎隱形，又怕風、又怕雨。如果即將下雨，牠們察覺到空氣中的濕度，就不會浪費力氣結一張會被雨打壞的大網。所以，當你看到蜘蛛在結網時，代表空氣是乾的，天氣會穩定，可能還會放晴。相反的，如果你發現蜘蛛網縮得很小，甚至整張網都不見了，也許就是快要下雨的信號。
  - idx: 4
    text: 很有趣吧，其實，大自然裡到處都是線索，告訴人們接下來的天氣會有什麼變化呢。只要你能明察秋毫，留心身邊的事物，也許就能像氣象署那樣預報天氣呢。
  - idx: 5
    text: 有位農夫宣稱，他可以從蟋蟀叫聲的頻率，判斷現在的氣溫大概幾度。經過研究，科學家的確發現，有些蟋蟀的叫聲會受到氣溫影響，氣溫越高，牠們叫得越快。如果錄下草叢裡蟋蟀的叫聲，數一數8秒內大約叫了幾聲，再把這個數字加5，就可以估算現在的攝氏氣溫。例如，蟋蟀8秒鐘內叫了20聲，20加5，現在的氣溫大概是25度。
  - idx: 6
    text: 除了蜘蛛、蟋蟀之外，你家的毛小孩也可能透露天氣的祕密。下雨前，空氣中的濕氣提高，氣壓降低。這種變化改變了狗狗和貓咪的毛髮乾爽度，會讓牠們坐立難安，狗狗可能會一直在屋子裡走來走去、發出低鳴；貓咪則可能變得特別愛躲藏，或身體不時抽搐。那就是快下雨的徵兆！
  - idx: 7
    reading_anchor: true
    text: 除了動物，天空本身也會說話。「日暈三更雨，月暈午時風」，所謂「暈ㄩㄣˋ」就是圍繞著太陽或月亮的光環。這句諺語指出，看到日暈，夜裡可能下雨，看到月暈，隔天白天可能起風。因為高空有一層很薄的冰晶雲，把光折射開來，我們才會看到日暈或月暈，這種雲常常是鋒面來臨的前兆，也就是說，看到日暈或月暈，再過半天，很可能就會起風或下雨。此外，我們偶爾會覺得今天的星星或遠山好像變近了，歷歷在目。有文學細胞的人就會寫下「今夜星辰分明，遠山如洗，彷彿天地間的距離被悄悄拉近」的美麗文句，這通常預示著冷空氣來臨，空氣潔淨，天氣即將轉晴或變涼。
  - idx: 8
    text: 當然，這些自然的線索不是百分之百準確，但連中央氣象署的預報也不是絕對正確啊，它們就像是大自然的小提示。所以，當你擔心明天會不會下雨時，除了查手機上的天氣預報，也可以看看蜘蛛有沒有結網、毛小孩是不是焦躁不安，或是月亮是不是戴了光圈。說不定，大自然早就偷偷告訴你答案了！
  inline_marked_terms:
  - 纖細
  - 即將
  - 明察秋毫
