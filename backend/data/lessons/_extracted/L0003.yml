# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞，何者使用正確？
    options:
      A: 他「坐立不安」在沙發上閱讀，十分投入
      B: 我想「明察秋毫」一下這杯飲料的味道
      C: 小樹「纖細」的枝芽，禁不起風吹雨打
      D: 我「即將」在昨天看一場精采的電影
    teacher_note: Ａ「坐立不安」指的是情緒焦急，A狀況不符。Ｂ「明察秋毫」形容人觀察細微。D「即將」表示事情快要發生。
    note: 本題 A 選項與教師註記寫「坐立不安」，但本課語詞是「坐立難安」；兩處一致，未列為勘誤。
  - index: 2
    answer: B
    stem: 根據文章，下列哪一項動物行為可能預示「快要下雨」？
    options:
      A: 蜘蛛結大網
      B: 狗狗不停的在屋子裡走動
      C: 蟋蟀叫聲速度變慢
      D: 鳥類在空中不停盤旋
    teacher_note: （文中第二至七段提到，狗坐立不安是快下雨的徵兆。D未提及也不正確）
  - index: 3
    answer: B
    stem: 文章中提到：「你皺起眉頭，拿起掃把想把牠揮掉。且慢！」這段話中的「且慢」最可能代表什麼意思？
    options:
      A: 作者要呼喚他人幫忙處理蜘蛛
      B: 提醒主角先停下來、仔細觀察
      C: 作者想用宏亮的聲音嚇退蜘蛛
      D: 作者流露出對蜘蛛的強烈憤怒
    teacher_note: （B「且慢」是說話者介入，引導讀者改變立場、暫停原先動作，轉而觀察蜘蛛。）
  - index: 4
    answer: D
    stem: 依據本文，當家裡的狗狗坐立難安、貓咪亂躲藏時，你外出時可能需要準備什麼？
    options:
      A: 手電筒
      B: 毛帽
      C: 太陽眼鏡
      D: 雨具
  - index: 5
    answer: A
