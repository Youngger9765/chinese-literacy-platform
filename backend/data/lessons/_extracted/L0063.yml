    遠低於被圈中格的 800~1600），沒有第 16 條路徑。

    另記：格子右上角埋了一組「比比皆是」（(1,10)→(4,10) 直向），
    但它**不在灰框的 15 個語詞裡，像素檢查也確認該四格無橘色** —— 是干擾詞，不是漏抽的答案。

