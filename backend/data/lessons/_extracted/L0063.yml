# 七*綜合閱讀理解（**三篇合讀**）
# ══════════════════════════════════════════════════════════════════════════
comprehension:
  _scope: 三篇合讀
  instruction: 請根據三篇文章的內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p21）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: C
      stem: 下列語詞，何者使用正確？
      options:
        A: 符合引水人資格的人在市場上「比比皆是」
        B: 看到天氣這麼熱，他「義憤填膺」的打開冷氣
        C: 公司的營收提升，員工薪資也跟著「水漲船高」
        D: 奶奶坐在公園看風景，看得「望穿秋水」
      explanation: |-
        第1題解析：
        Ａ「比比皆是」很常見，引水人的月薪不常見。
        Ｂ天氣炎熱是自然現象，與正義無關。
        D「望穿秋水」多用於強烈的期待或盼望，與沿途美景無關。
      explanation_note: 原稿是一個浮動說明框，印在第 2 題旁邊（但內容是第 1 題的解析，原稿自己標了「第1題解析」）
    - index: 2
      answer: A
      stem: 三篇文章都提到了一個經濟學的核心原則，這個原則是什麼？
      options:
        A: 供需法則
        B: 比較利益法則
        C: 分散風險原則
        D: 機會成本原則
      explanation: (物以稀為貴為供需法則。)
      explanation_note: 原稿是一個浮動說明框，印在選項 A 右側
    - index: 3
      answer: B
      stem: 依據圖片，請問該項商品最後在市場上出現了什麼狀況？
      stem_note: 題幹的「最後」在原稿加了底線
      figure:
        count: 3
        description: |-
          三張並排的圖，中間用紅色向右箭頭連接：
          ① 一群人排隊等著買蛋塔（店前大排長龍）
          ② 街道上到處都是蛋塔店
          ③ 一家「葡式蛋塔」店貼上「出租」的招牌
        text_carrier: image
      options:
        A: 供需均衡
        B: 供過於求
        C: 供不應求
        D: 飢餓行銷
      options_note: 四個選項原稿印在同一行（A.供需均衡　B.供過於求　C.供不應求　D.飢餓行銷）
    - index: 4
      answer: D
      stem: 以下哪一種情境最符合「物以稀為貴」的道理？
      options:
        A: 超商推出夜間打折活動，珍愛剩食
        B: 風調雨順大豐收，蔬菜水果供應量充足
        C: 大街上一人一手機，手機的需求穩定
        D: 公司高薪聘請具備進階AI技術的研發人員
      explanation: (市場對工程師的需求大過於供給。)
      explanation_note: 原稿是一個浮動說明框，印在選項 B、C 右側
    - index: 5
      answer: B
      stem: 綜合三篇文章，下列哪一項最能說明「供需關係」在三篇文章中的作用？
      options:
        A: 政府訂定價格後，商品價格與工作薪資就不再波動
        B: 供需會影響價格與薪資；限制價格也可能改變市場供給
        C: 工作薪資主要由辛苦程度決定，與人力供需關係無關
        D: 商品或人才只要數量稀少，價格與薪資就會持續上漲
      explanation: 第一、三篇說明供需影響價格與薪資；第二篇指出限價可能減少供給，因此選B
      explanation_note: 原稿是一個浮動說明框，疊在題幹上（PDF p21 蓋住了題幹尾巴）

