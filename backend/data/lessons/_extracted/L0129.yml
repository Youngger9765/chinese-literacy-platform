spotlight:
  strategy_name: 推論策略──整合各段觀點，找主要論點
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）；任務三的填空是橘色手寫，也在文字層
  blocks:
    - type: concept_box
      text: 議論文章常會先引出議題，再由各段提出觀點、說明、案例或做法，最後形成全文的主要論點。閱讀時，可以先找出各段的核心訊息，再判斷它在全文中扮演的角色，最後沿著論述主線整合出主要論點。

    # ── 任務一 ──
    - type: sub_block
      label: 一、找出各段的核心訊息（看法／判斷）
      instruction: 下表列出每個段落的兩個句子。請先選出本段最重要的句子，再判斷另一句在段落中具有什麼功能。
      columns: [段落, ❶勾選本段核心訊息, ❷判斷另一句的功能]
      columns_note: |-
        表格印三欄。每一列是**兩題**：❶ 從 A/B 兩句挑出本段核心訊息，
        ❷ 從 ①②③ 挑出另一句的功能。兩題各有一個紅色 ☑。
        ⚠️ 第 1 列的第三個選項印「②例子（證據）」，第 2~5 列印「②案例證據」——
        原稿就不一致，照抄不統一。
      items:
        - label: 段落 1
          items:
            - prompt: ❶勾選本段核心訊息
              options:
                A: 「讚」有時代表喜歡支持，有時是關心，也可能只是感興趣。
                B: (按讚)這個輕輕一點的動作，背後卻隱藏著你未必察覺的真相。
              answer: B
            - prompt: ❷判斷另一句的功能
              options: {1: 補充說明, 2: 例子（證據）, 3: 具體做法}
              answer: 1
        - label: 段落 2
          items:
            - prompt: ❶勾選本段核心訊息
              options:
                A: 按讚提供即時與簡單回饋，讓人們更常使用社群媒體的互動。
                B: 朋友按讚你會覺得被重視，你按讚也讓對方收到關注
              answer: A
            - prompt: ❷判斷另一句的功能
              options: {1: 補充說明, 2: 案例證據, 3: 具體做法}
              answer: 1
        - label: 段落 3
          items:
            - prompt: ❶勾選本段核心訊息
              options:
                A: 過度在意讚數，可能左右人的心緒、自我價值，甚至心理健康。
                B: 網紅艾絲娜為追求讚數反覆拍照修圖，最後刪除帳號。
              answer: A
            - prompt: ❷判斷另一句的功能
              options: {1: 補充說明, 2: 案例證據, 3: 具體做法}
              answer: 2
        - label: 段落 4
          items:
            - prompt: ❶勾選本段核心訊息
              options:
                A: 同學按了遊戲影片的讚，之後手機幾乎都被遊戲內容佔滿
                B: 平台可能根據使用紀錄推薦相似內容，久而久之形成過濾泡泡，使視野變窄。
              answer: B
            - prompt: ❷判斷另一句的功能
              options: {1: 補充說明, 2: 案例證據, 3: 具體做法}
              answer: 2
        - label: 段落 5
          items:
            - prompt: ❶勾選本段核心訊息
              options:
                A: 按讚本身沒有錯，但不要讓讚數左右情緒與自我價值，也要平衡使用。
                B: 有些人使用「隱藏按讚數」功能，作為減壓的方法。
              answer: A
            - prompt: ❷判斷另一句的功能
              options: {1: 補充說明, 2: 案例證據, 3: 具體做法}
              answer: 3

    - type: guide
      text: 你在任務一已經找出各段的主要觀點，這讓複雜的文字有了清楚的概念。

    # ── 任務二 ──
    - type: sub_block
      label: 二、本文主要論點的論述架構：
      intro: |-
        任務二要做的是：看見作者怎麼把這些觀點，做清楚的論述——讓你一眼就看見文章的論述主線，即「描述現象
        說明它的影響
        給出建議」。
      instruction: 請根據論述的主線，找到對應的段落，填入段落數代號，並選出該段的關鍵詞。下一題要用這條主線和關鍵詞，整合出文章的主要論點。
      columns: [作者的論述主線, 填上段落數, 這段的關鍵詞（單選）]
      intro_note: |-
        說明句裡的兩個箭頭是 `w:sym Wingdings F0E0`，**不在 w:t 文字流裡**，
        所以 intro 照文字層記錄、不寫入箭頭字元（同 L0057／L0090 的做法）。
        畫面上那一句是「即『描述現象→說明它的影響→給出建議』」。
      items:
        - label: 1.先說「作者看到的現象」
          value: 填上段落數（　）
          blanks: [{answer: 1~2}]
          items:
            - prompt: 這段的關鍵詞（單選）
              options: {1: 按讚背後另有真相, 2: 要多按讚表示關心支持}
              answer: 1
        - label: 2.再說「影響一：情緒、心理會受到什麼影響」
          value: 填上段落數（　）
          blanks: [{answer: 3}]
          items:
            - prompt: 這段的關鍵詞（單選）
              options: {1: 情緒與心理健康失控, 2: 覺得開心備受矚目}
              answer: 1
        - label: 3.再說「影響二：演算法會怎樣限制你的視野」
          value: 填上段落數（　）
          blanks: [{answer: 4}]
          items:
            - prompt: 這段的關鍵詞（單選）
              options: {1: 過度依賴按讚數, 2: 受困過濾泡泡，視野變窄}
              answer: 2
        - label: 4.最後說「建議你可以怎麼做」
          value: 填上段落數（　）
          blanks: [{answer: 5}]
          items:
            - prompt: 這段的關鍵詞（單選）
              options: {1: 平衡使用社群, 2: 追求更多按讚}
              answer: 1

    # ── 任務三 ──
    - type: free_text
      prompt: 三、整合主要論點：請用一句話說出作者的主要論點。
      hint: 提示：參考上表的「論述主線」與「關鍵詞」，合起來，用「心理影響＋資訊影響＋作者建議」三個元素，寫出作者的主要論點。（答案合理就好）
      word_bank_line: （提示詞可選用：自我價值、心理健康、過濾泡泡、視野、平衡使用）
      answer_text: ①按讚看似小動作，但它背後另有真相，②它會影響你的自我價值和心理健康，③還會讓你受困於過濾泡泡，視野變窄，④因此，不要讓讚數左右情緒與自我價值，要懂得平衡使用，讓社群媒體成為幫手。
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
      answer_note: |-
        印出來的句子是「填空式」：黑色印刷的骨架是
        「①按讚看似小動作，但它背後另有真相，②它會影響你的　③還會讓你　④因此，　。」，
        橘色手寫補上的是「自我價值和心理健康」「受困於過濾泡泡，視野變窄」
        「不要讓讚數左右情緒與自我價值，要懂得平衡使用，讓社群媒體成為幫手」三段。
        上面的 answer_text 是把兩者接起來的完整句（原稿的空白與底線已省略）。

    - type: self_check
      label: ◎自我檢核
      items:
        - 我能判斷出每段作者的主要看法/觀點。
        - 我能判斷另一句的功能是「說明／例子／做法」
        - 我能判斷每一段的主要看法的角色
        - 我能寫出本文的主要論點
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      reflection: ※如果你四項都打勾，恭喜你，表示你能統整各段的看法，整合成一個主要看法。

# ── 六 文章重點表 ──
keypoints:
  title: 「按讚」背後的真相！
  layout: list
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  rows:
    - label: 議題-現象
      value: 很多人看到貼文會自然按「讚」，但這個動作背後，隱藏著你未必察覺的【　】
      blanks: [{answer: 真相}]
    - label: 原因
      value: 按讚之所以讓人容易一直滑，是因為它帶來【　】，讓人覺得被重視、被看見。
      blanks: [{answer: 即時回饋感}]
    - label: 論點一/論據
      value: |-
        1.論點：按讚不只是數字，有些人把自己的【　】建立在按讚數上，心情隨之起伏，甚至影響【　】。
        2.論據：
        (1)澳洲網紅為追求按讚數，反覆拍照修圖，最後刪除帳號。
        (2)美國11歲瑟琳娜因按讚數太少而自卑焦慮。
      blanks: [{answer: 自我價值}, {answer: 心理健康}]
      label_note: 表格左欄印成兩行「論點一 / /論據」，這裡合成一個 label
      value_note: |-
        ⚠️ 原稿這一格的「論點：」前面**沒有**印「1.」，但「論據：」前面印了「2.」；
        下一列（論點二）兩邊都有印 1./2.。上面照下一列的形狀補齊會改到原稿，
        所以 value 保留原樣 —— 這裡寫的 1. 是 Word 自動編號產生的，w:t 文字流裡沒有。
    - label: 論點二/論據
      value: |-
        1.論點：平台會記下你的偏好，推播更多【　】給你，久而久之形成【　】，讓你視野變窄。
        2.論據：
        (1)同學按了遊戲影片的讚，之後手機被遊戲內容佔滿。
        (2)莫莉看了情緒低落貼文後，平台大量推送負面內容，導致悲劇
      blanks: [{answer: 類似內容}, {answer: 過濾泡泡}]
    - label: 結論與建議
      value: 按讚本身沒有錯，但不要讓按讚數左右情緒與自我價值；可以使用【　】功能減壓，也要留意滑動內容，學會【　】使用社群媒體。
      blanks: [{answer: 隱藏按讚數}, {answer: 平衡}]
      label_note: 表格左欄印成兩行「結論與 / 建議」

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，讀完每一個選項後，選出最適合的答案。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  questions:
    - index: 1
      answer: C
      stem: 文中「按讚…正悄悄左右我們的心緒」的「左右」最接近何意？
      options:
        A: 來回擺動
        B: 左右兩邊
        C: 暗中影響著
        D: 分成兩部分
      explanation: （此處「左右」是動詞，指「影響、牽動」）
      explanation_placement_note: 印在選項 D 後面同一行（橘色斜體），不是選項的一部分
    - index: 2
      answer: A
      stem: 作者舉「網紅艾絲娜」與「11歲瑟琳娜」的例子，最主要要說明什麼？
      options:
        A: 讚數會傷心理健康
        B: 網紅都愛演戲賣慘
        C: 年紀小就不該上網
        D: 向平台提告效果好
    - index: 3
      answer: C
      stem: 綜合全文，作者對「按讚」的立場最接近下列何者？
      options:
        A: 按讚應被禁止，因為危害太大
        B: 按讚越多越好，能證明個人價值
        C: 按讚是工具，重點在有意識使用
        D: 按讚是騙局，平台只想操控人心
      explanation: C作者明說「按讚本身沒有錯」，但提醒別被讚數左右情緒與自我價值，也要留意推播與過濾泡泡，強調「平衡使用」。這是「工具中立、使用需自覺」立場
      explanation_placement_note: 印在題目右側的獨立文字方塊（藍框），是教師版解析
    - index: 4
      answer: B
      stem: 作者大量使用「真實案例」（網紅、同學、莫莉），最主要目的為何？
      options:
        A: 製造八卦話題
        B: 讓論點更可信
        C: 證明人人受害
        D: 比較各國文化
      explanation: B案例的功能是當「論據」，讓抽象影響（心理、推播）具體可感、提高說服力
      explanation_placement_note: 印在題目右側的獨立文字方塊（藍框），是教師版解析
    - index: 5
      answer: D
      stem: 依作者整體提醒，下列哪個做法最能同時照顧「情緒/自我價值」與「資訊/視野」兩個面向？
      options:
        A: 頻繁發文並反覆修圖求按讚
        B: 追逐讚數並只看同類內容
        C: 關掉通知並只看熟人貼文
        D: 隱藏讚數並刻意看不同內容
      explanation: 作者建議別讓讚數左右情緒與自我價值（可用隱藏讚數減壓），也要留意自己滑動內容、避免過濾泡泡限制視野；D同時符合兩面向。
      explanation_placement_note: 印在題目右側的獨立文字方塊（藍框），是教師版解析

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  target_words: [自我價值, 席捲, 欲罷不能, 心緒, 備受矚目, 悵然若失, 起伏不定, 左右, 過濾泡泡, 演算法, 推播]
  grid_size: [10, 10]
  grid:
    - 影出音回自疑主輕身宴
    - 片席春饋我惑席演席加
    - 思考捲貴價可算缺奉備
    - 慮卷張全值法許輕還受
    - 片悵開撩球心緒鬆推矚
    - 面帳然亂蔽叮囑咐播目
    - 狹戶起若隱若現火爐於
    - 隘益伏發失過濾泡泡麵
    - 欲罷不能呆保不可思議
    - 疲倦定佐料佑情緒左右
  answers_are_graphical: true
  answer_paths:
    - word: 自我價值
      cells: [[1, 5], [2, 5], [3, 5], [4, 5]]
      direction: vertical
    - word: 席捲
      cells: [[2, 2], [3, 3]]
      direction: diagonal_down_right
    - word: 演算法
      cells: [[2, 8], [3, 7], [4, 6]]
      direction: diagonal_down_left
    - word: 備受矚目
      cells: [[3, 10], [4, 10], [5, 10], [6, 10]]
      direction: vertical
    - word: 心緒
      cells: [[5, 6], [5, 7]]
      direction: horizontal
    - word: 推播
      cells: [[5, 9], [6, 9]]
      direction: vertical
    - word: 悵然若失
      cells: [[5, 2], [6, 3], [7, 4], [8, 5]]
      direction: diagonal_down_right
    - word: 起伏不定
      cells: [[7, 3], [8, 3], [9, 3], [10, 3]]
      direction: vertical
    - word: 過濾泡泡
      cells: [[8, 6], [8, 7], [8, 8], [8, 9]]
      direction: horizontal
    - word: 欲罷不能
      cells: [[9, 1], [9, 2], [9, 3], [9, 4]]
      direction: horizontal
    - word: 左右
      cells: [[10, 9], [10, 10]]
      direction: horizontal
  geometry_check: |-
    全檔 roundRect 錨點 11 個，全部在第八大題那一頁（本課沒有別的 roundRect —— 聚光燈與
    重點表用的是一般表格，不是圓角框），與 11 條 answer_paths 相同，無「>」方向的警報。
    posOffset 全部以 `column` 為基準、位移在 −0.60in ～ +0.03in，換算絕對位置遠在頁寬
    8.27in 之內 → 無紙外殘留。格子沒有跨頁（10 列都在 p9）。
    11 個目標語詞、11 個圈、11 條路徑，三者一致；每一條都套回 grid 拼得回目標語詞
    （`normalize_word_search.py --check` 綠），本課**沒有**格子錯字。
  grid_note: |-
    格子裡有數個誘答字：第 2 列有兩個「席」（c2 是答案、c7 c9 是誘答）、
    第 7 列有兩個「若」、第 9 列有兩個「不」。取字時以路徑座標為準。

