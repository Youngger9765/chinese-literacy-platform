    - {index: 3, stem: 因為颱風，學校的校舍工程進度嚴重（　），恐怕無法及時完工。, answer: D}
    - {index: 4, stem: 他做了一個錯誤的決策，還想（　），扭曲事實的真相。, answer: B}
    - {index: 5, stem: 他的身材（　），又經過專業的武術訓練，十分適合擔任保全人員。, answer: A}
    - {index: 6, stem: 他因為緊張過度，嘴角微微（　），臉上表情極不自然。, answer: E}
    - {index: 7, stem: 進入寺廟參觀時，要尊重當地的（　），不要大聲喧嘩或隨意拍照。, answer: I}
    - {index: 8, stem: 受傷的小狗躲在牆角低聲（　），讓路過的人聽了很心疼。, answer: F}
  items_note: 第 (2) 題原稿寫「歳月」（歳，U+6B33），不是常用的「歲」。照原樣抄。

# ── 五 文章重點表 ──
keypoints:
