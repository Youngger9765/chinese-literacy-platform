# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略——從文本線索理解標題
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本大題 5 個）與橘色手寫字
  blocks:
    - type: concept_box
      text: |-
        有些文章標題一看就知道意思，但有些標題卻不能只看字面。這時，想知道標題在說什麼，就要在文章裡找線索，把線索連起來，才能知道作者想透過這個標題告訴讀者什麼。
        要看懂標題，可以照❶~❹的步驟這樣做：
        ❶看標題：標題裡哪個詞最值得注意？我想知道什麼？
        ❷找線索：回到文章，找出和標題最有關的內容。
        ❸連線索：這些線索共同說明了什麼？
        ❹說出理解：用以下的句型說出你的理解：
        從______________和_____________這些線索，
        我推論標題「___________」可能是在說____________。

    - type: guide
      text: 底下就讓我們用這４個步驟來練習看出標題的意思。

    - type: guide
      text: 一、標題中的「弗蘭肯斯坦」，這是……？

    - type: guide
      text: |-
        ❶看標題
        我們要回答：這個標題中的「弗蘭肯斯坦」指的是誰？

    - type: multi
      prompt: |-
        ❷找線索：先在課文中圈出關於弗蘭肯斯坦的描述。
        下面哪些選項是判斷標題意思的重要線索？請在□打勾。（多選）
      options:
        1: 弗蘭肯斯坦是一位研究生命起源的年輕科學家
        2: 弗蘭肯斯坦就是偷了眾神的火種，賜給人類的那個神話人物
        3: 弗蘭肯斯坦把屍塊縫合，進行造人實驗
        4: 怪物睜眼甦醒後，弗蘭肯斯坦嚇得奪門而出
        5: 「弗蘭肯斯坦」就是那位醜陋的人造怪物
      answers: [1, 3, 4]

    - type: single
      prompt: |-
        ❸連線索
        根據線索，哪一項理解最合理？
      options:
        1: 「弗蘭肯斯坦」是怪物的名字，因為故事主要在寫怪物
        2: 「弗蘭肯斯坦」是科學家的名字，怪物其實沒有名字
        3: 「弗蘭肯斯坦」是造人實驗的名稱，不是人物的名字
        4: 「弗蘭肯斯坦」是科學家和怪物共同使用的名字
      answer: 2

    - type: free_text
      prompt: |-
        ❹說出理解
        你可以這樣說：從課文中所描述的弗蘭肯斯坦，我找到幾個線索：
        *弗蘭肯斯坦是一位研究【　】的年輕科學家
        *弗蘭肯斯坦把【　】縫合，進行造人實驗
        *怪物睜眼甦醒後，他嚇得奪門而出
      blanks:
        - {answer: 生命起源}
        - {answer: 屍塊}

    - type: single
      prompt: →所以，我推論標題中弗蘭肯斯坦指的是
      options:
        1: 那個醜陋的怪物
        2: 那個創造怪物的科學家
      answer: 2
      note: 原稿把兩個選項印在同一組【　】裡（【 □那個醜陋的怪物；　☑那個創造怪物的科學家 】），沒有①②編號。

    - type: guide
      text: 二、標題中弗蘭肯斯坦為什麼有「現代普羅米修斯」的副標？

    - type: guide
      text: 請在底下的【　】填上適當的步驟名稱或詞彙

    - type: free_text
      prompt: |-
        ❶【　】
        我先圈出現代普羅米修斯，我問自己：弗蘭肯斯坦和普羅米修斯有什麼相像的地方？
      blanks:
        - {answer: 看標題}
      prompt_note: 「現代普羅米修斯」在原稿加了黑色方框（w:bdr auto）當強調，不是答案載體。

    - type: free_text
      prompt: |-
        ❷【　】
        我回到文章，找到兩組重要線索：
        *弗蘭肯斯坦：　創造生命 → 跨越原有的界線 → 引發悲劇
        *普羅米修斯：【　】→ 觸犯禁忌 → 受到懲罰
      blanks:
        - {answer: 找線索}
        - {answer: 偷取火種}
      prompt_note: 這一段裡的 → 是**文字**箭頭（U+2192），照抄。

    - type: free_text
      prompt: |-
        ❸【　】
        我發現，兩個人做的事情雖然不同，卻有個共同點：
        他們都做了原本不被允許或不該輕易跨越的事，而且後來都付出了代價。
      blanks:
        - {answer: 連線索}
      prompt_note: 最後一行句首原稿印一個箭頭，它是 `w:sym Wingdings F0E0` 符號物件、不在文字流，未寫進 prompt。

    - type: free_text
      prompt: |-
        ❹【　】
        從普羅米修斯偷火種後受到【　】，以及弗蘭肯斯坦創造生命後導致【　】引發，我推論「現代普羅米修斯」是在暗示：他們倆都同樣觸犯了【　】，也因此帶來嚴重的後果。
      blanks:
        - {answer: 說出理解}
        - {answer: 懲罰}
        - {answer: 悲劇}
        - {answer: 禁忌}
      prompt_note: 第二行句首原稿印一個箭頭（`w:sym Wingdings F0E0`，不在文字流），未寫進 prompt。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: D
      stem: 請問怪物的名字是什麼？
      options:
        A: 弗蘭肯斯坦
        B: 瑪麗•雪萊
        C: 普羅米修斯
        D: 怪物沒有名字
      explanation: |-
        第1題解析：
        （第七段提到，怪物其實沒有名字。
      explanation_note: 原稿是一個浮動文字方塊，印在題目右側；只有開括號沒有關括號，照原樣。
    - index: 2
      answer: B
      stem: 下列哪個句子中的語詞運用錯誤？
      stem_note: 題幹的「錯誤」在原稿加了底線。
      options:
        A: 夫妻大吵一架後，這位太太一時氣不過便「奪門而出」
        B: 陽光太強，小美一手提東西，只好「隻手遮天」擋住陽光
        C: 為了準備國家考試，他「離群索居」，專心讀書了三個月
        D: 這外國人不了解台灣的「禁忌」，居然用紅筆寫信給友人
    - index: 3
      answer: C
      stem: 根據文章，下列敘述何者不正確？
      stem_note: 題幹的「不正確」在原稿加了底線。
      options:
        A: 弗蘭肯斯坦因爲想起曾看見樹被閃電擊中的景象，而得到用電流進行造人實驗的靈感
        B: 雖然弗蘭肯斯坦成功的造出「人」來，但隨後就被自己創造出來的「人」嚇得奪門而出
        C: 怪物透過學習，慢慢擁有知識和判斷力，起初被討厭，最終因他的善良而被人類接納
        D: 小說的中文翻譯是《科學怪人》，有人認為「科學怪人」是指怪物，也有人認為是科學家
    - index: 4
      answer: A
      stem: 為什麼小說原作者給本書書名的副標題是「現代普羅米修斯」？
      options:
        A: 弗蘭肯斯坦造人的行為和普羅米修斯一樣，都觸犯了禁忌
        B: 弗蘭肯斯坦把普羅米修斯當成目標，立志成為普羅米修斯
        C: 科學怪人和普羅米修斯一樣，都被用鐵鍊綁起來並鎖在高處
        D: 作者希望弗蘭肯斯坦能像普羅米修斯一樣，接受神的懲罰
    - index: 5
      answer: D
      stem: 根據課文，下面哪一個選項比較可能是小說原作者透過故事想要傳達給讀者的？
      options:
        A: 為了讓科學可以有更好的發展，我們應該要投注所有的心力
        B: 不要隨便觸犯神的禁忌，否則將會招來厄運，最後不得善終
        C: 怪物很可憐，沒有名字，也沒有人愛，才會造成一連串悲劇
        D: 發展科學時不能只關注研發成果，也要留意可能帶來的後果

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  instruction_note: 原稿有兩個重疊的文字方塊，另一句寫「…把灰框內的語詞刪除。」；PDF p9 上層是「劃掉」。
  target_words: [魁梧, 離群索居, 遲滯, 抽搐, 轉瞬即逝, 倫理, 奪門而出, 神祇, 禁忌, 隻手遮天, 哀鳴]
  target_words_note: 灰框原文分兩行：「魁梧、離群索居、遲滯、抽搐、轉瞬即逝、倫理／奪門而出、神祇、禁忌、隻手遮天、哀鳴」（11 個，與語詞框相同）。
  grid_size: [10, 10]
  grid:
    - 棒全拼離認懲祝禁忌弗
    - 球遍湊群同罰福頓足蘭
    - 魁悟縫索奪門而出痙轉
    - 富梧補居醜陋外表攣瞬
    - 蒻蒟普羅米修斯生強即
    - 遲干屍之隻科神祇髮逝
    - 滯擾塊手違學哀怒發強
    - 犧潰遮秀莽怪鳴迢抽掘
    - 牲天襯退倫人疑有畜搐
    - 悲劇雞偷理種希臘神話
  grid_note: |-
    🔵 **格子跨頁**：第 1~4 列印在 p9 最下方、第 5~10 列印在 p10 最上方。
    ⚠️ 而且橘圈與格子在 PDF 上**錯位**：碰到第 1 列的兩條（禁忌、離群索居）整個被推到 p10 頁首，
    變成兩個懸空的框；p10 的其餘框也整體下移約一列。
    ⛔ 因此本課**不能靠「圈壓在哪一格上」判讀** —— 判準是 cells 套回 grid 拼不拼得回目標語詞。
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 禁忌
      cells: [[1, 8], [1, 9]]
      direction: horizontal
    - word: 離群索居
      cells: [[1, 4], [2, 4], [3, 4], [4, 4]]
      direction: vertical
    - word: 魁梧
      cells: [[3, 1], [4, 2]]
      direction: diagonal_down_right
    - word: 奪門而出
      cells: [[3, 5], [3, 6], [3, 7], [3, 8]]
      direction: horizontal
    - word: 轉瞬即逝
      cells: [[3, 10], [4, 10], [5, 10], [6, 10]]
      direction: vertical
    - word: 遲滯
      cells: [[6, 1], [7, 1]]
      direction: vertical
    - word: 神祇
      cells: [[6, 7], [6, 8]]
      direction: horizontal
    - word: 隻手遮天
      cells: [[6, 5], [7, 4], [8, 3], [9, 2]]
      direction: diagonal_down_left
    - word: 哀鳴
      cells: [[7, 7], [8, 7]]
      direction: vertical
    - word: 抽搐
      cells: [[8, 9], [9, 10]]
      direction: diagonal_down_right
    - word: 倫理
      cells: [[9, 5], [10, 5]]
      direction: vertical
  answer_paths_note: |-
    11 個目標語詞全部圈到（11/11），逐格取字都能拼回目標語詞，格子沒有錯字。
    幾何交叉驗證（單向警報）：全檔 11 個 roundRect **全部都在找字那一 block**（block 138），
    11 == 11 條路徑 → 11 ＞ 11 不成立，**不觸發**「少抓一條」警報。
    ⚠️ 紙外過濾在本課同樣不可信：naive 公式把 11 個裡的 7 個算成「紙外」，
    但格子裡明明看得到 11 個圈（與 L0063、L0094 同型的旋轉框誤判）。
    像素佐證（200dpi 重繪、數橘色連通塊）：p9 有 3 塊、p10 有 8 塊，**合計恰好 11**，
    與 roundRect 數與 answer_paths 條數三者一致。
    這一步是必要的：本課的圈在 PDF 上與格子錯位（碰到第 1 列的兩條整個被推到 p10 頁首），
    光看「圈壓在哪一格」會判錯。
    另記：格子裡埋了「痙攣」((3,9)(4,9))，它在總表的語詞欄裡但**不在學習單的 11 個目標語詞**，
    也沒有被圈起來 —— 是干擾詞，不是漏抽的答案（見 meta._總表_對照note）。

