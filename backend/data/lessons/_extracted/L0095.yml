    字數欄止於第 6 段，不含第 7~11 段。
  inline_marked_terms: [魁梧, 轉瞬即逝, 離群索居, 遲滯, 抽搐, 奪門而出, 神祇, 禁忌, 隻手遮天, 哀鳴, 倫理]
  inline_marked_terms_note: 課文中用方框（w:bdr，黑色 auto）標出的 11 個語詞，與語詞框的 11 個完全相同。
  underlined_terms: [弗蘭肯斯坦, 瑪麗‧雪萊, 普羅米修斯]

