# ── 一 讀全文—做記號 ──
body:
  header_level: Level 7・應用文(讀書報告)
  header_strategy: 目標策略：推論策略──從文本線索理解標題
  lesson_heading: |-
    第26課　科學怪人
    （弗蘭肯斯坦：現代普羅米修斯）
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 請在重要的地方、喜歡的語詞、句子或段落做記號。
  paragraph_count: 11
  paragraph_mapping_note: |-
    DOCX 那一格 15 個 `<w:p>`，學習單只印 11 個段號。差的 4 個是**分節小標**
    （一、故事大意：／二、書名意義：／(1)主標題：弗蘭肯斯坦／(2)副標題：《The Modern Prometheus》（現代普羅米修斯）），
    它們自己一行、旁邊沒有段號。小標收在 `inline_headings`，不佔 idx。
    ⛔ 若把小標各算一段，段號會往後推最多 4 號，念順順的「三☞」與閱讀理解解析的「第七段」都會指錯。
  inline_headings:
    - {after_idx: 1, text: 一、故事大意：}
    - {after_idx: 5, text: 二、書名意義：}
    - {after_idx: 5, text: "(1)主標題：弗蘭肯斯坦", order_after: 二、書名意義：}
    - {after_idx: 8, text: "(2)副標題：《The Modern Prometheus》（現代普羅米修斯）"}
  inline_headings_note: |-
    這四行印在課文欄裡、但段號欄沒有對應號碼。它們**會被算進右緣的累計字數**
    （見 char_count_note 的 333 與 343 兩個檢查點），所以不是裝飾，學生朗讀時也會讀到。
  paragraphs:
    - idx: 1
      text: 聽到「科學怪人」四個字，很多人腦中會浮現頭上佈滿疤痕、臉部由不同肉塊縫合而成、眼窩深陷、身材魁梧的怪物。這位怪物出自英國作家瑪麗‧雪萊創作的小說，書名叫做《Frankenstein》（弗蘭肯斯坦），中文翻譯為《科學怪人》。
    - idx: 2
      text: 小說中，弗蘭肯斯坦是一位充滿夢想的青年科學家，對探究生命起源相當迷戀。他為了瞭解「生」，長時間鑽到墓園觀察「死」，有一次，他發現腐敗的人體竟會發出一道轉瞬即逝的光芒，他回想起十五歲那年曾看過閃電劈毀一棵老橡樹，心中頓時出現了一個大膽的想法：「生命的起源來自於電」。他從電流中得到這個啟發，開始進行創新的「造人」實驗，他心想，如果成功製造出一個「人」，那該是多麼傑出的科學成就啊！
    - idx: 3
      text: 他從此離群索居，祕密進行實驗，從停屍房和墓穴找來許多屍塊當作「實驗材料」，將屍塊縫補成人的形狀，幻想他自己可以扮演上帝的角色，讓冰冷的屍體甦醒過來。某個夜晚，他苦心製造的「人」居然慢慢睜開了枯黃遲滯的眼睛，開始吃力的呼吸，四肢不斷抽搐著。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 4
      text: 弗蘭肯斯坦目睹這一刻，嚇得連連退後，他驚恐萬分，看著自己精心創造的「人」竟然如此恐怖，他淒厲的尖叫：「我創造了一個怪物啊！」接著奪門而出，留下這位身高八呎的怪物，好奇的開始對世界展開探索。
    - idx: 5
      text: 換句話說，弗蘭肯斯坦成功的創造出一個「人」，但隨即拋棄了他。怪物被迫進入人類的世界，四處流浪，透過觀察學習，慢慢擁有知識，也學會判斷善惡、美醜，也希望被人類接納，卻因為醜陋無比的外表，一再遭受誤解與傷害，最後導致一連串的悲劇。
    - idx: 6
      text: 每個人都有專屬於自己的名字，通常是由父母、家人所取名，一個名字的背後帶著取名之人的寄望、祝福。
    - idx: 7
      text: 人們常常誤以為書名的「弗蘭肯斯坦」指的是那位怪物，實際小說中，怪物並沒有名字，這也可以解讀為：他從未得到他人的認同與祝福。
      idx_evidence_note: 第七大題第 1 題的解析寫「第七段提到，怪物其實沒有名字」，指的就是這一段。
    - idx: 8
      text: 小說的中文譯名是《科學怪人》，直接易懂，不過有人認為「科學怪人」是指怪物，也有人認為是那位瘋狂科學家，你認為呢？
    - idx: 9
      text: 這本小說還有一個副標題《The Modern Prometheus》（現代普羅米修斯）。傳說人類本來不知道如何用火，普羅米修斯是希臘神話裡的神祇，祂偷了眾神的火種，賜給人類，賦予人類力量。但偷火種觸犯了禁忌，祂也因此被鐵鍊鎖在高山上，長久遭受禿鷹啄食的懲罰。
    - idx: 10
      text: 作者雪萊把弗蘭肯斯坦比喻為「現代普羅米修斯」，是不是也意謂著弗蘭肯斯坦同樣觸犯了神的禁忌？他扮演了上帝的角色，利用拼湊縫補的屍塊，創造一個嶄新的生命，但也因此產生了一連串的悲劇。人類是否真的能「隻手遮天」，創造生命？這樣做，會不會受到上帝的懲罰？這些都引發後世讀者熱烈的討論。
    - idx: 11
      text: 小說1818年出版至今已超過兩百年，多次被改編成影視作品。大家閱讀這本書時，難以忘懷怪物「出生」以來不斷發出渴望擁有愛的哀鳴，進而思考科學的發展是不是也該有一條倫理的界線。
  # 課文右緣印的累計字數（從 ☞ 所在的第 3 段起算），共 17 個
  running_char_counts: [27, 57, 85, 114, 119, 146, 176, 205, 213, 241, 270, 299, 326, 333, 343, 370, 390]
