# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 11
  paragraphs:
    - idx: 1
      text: 成為高中生後，我開始沉迷於最愛的《聯盟戰記》電玩遊戲，每天放學就迫不及待地打開電腦，投入其中。螢幕上閃爍的特效，耳機裡隊友的呼喊聲，鍵盤和滑鼠的飛速點擊聲，都讓我忘卻現實中的學習煩惱。
    - idx: 2
      text: 「又在打電動！作業寫完了嗎？」媽媽的喊叫聲把我拉回現實，我看了看時間，已經晚上十一點了，我連一項功課都還沒寫！我慌忙關掉電腦，心裡充滿愧疚和焦慮，但如此場景有如惡夢般幾乎天天上演，我的成績也跟著直線下滑。
    - idx: 3
      text: 轉機出現在一個週末，我偶然在YouTube上看到《聯盟戰記》的職業比賽，正巧，解說員正激情洋溢的分析賽局：「看看Faker的操作！他不僅反應快，更重要的是他能做出正確決策，而且和團隊配合超有默契！」我頓時驚訝的發現，原來電子競技不只是玩遊戲，還需要運用邏輯和數學知識，快速做出判斷，也高度需要團隊合作，如此才能增加獲勝的機會。
    - idx: 4
      text: 這場比賽徹底改變我對電競的看法，我開始認真研究遊戲策略，並加入學校電競社，認識了學霸社長，他成為改變我人生的貴人。學霸社長強調「要成為頂尖的電競選手，時間管理是關鍵」，他嚴守紀律，讓自己的學習和電競訓練能夠得到平衡。我也依樣畫葫蘆，規劃了作息時間表，開始全新的生活方式。
    - idx: 5
      text: 每天早上六點半，鬧鐘一響立刻起床，梳洗後到七點半是晨讀時間，我安排需要記憶的內容，例如背英文單字，因為我早晨精神較好，比較容易專心。晨讀後，吃早餐、整理書包出門上學。早上八點進入學校後，我要求自己每一堂課都專心聽講，盡量在第一次學習時就理解。回家後，要在記憶猶新時立即複習，因此，放學後就是複習和寫作業的最佳時間，並儘量在晚餐七點前完成。晚餐時間是家人交流的寶貴時刻，全家一起用餐並分享彼此生活。七點半到九點半是我最期待的電競訓練時間，我與戰友們制定了每天練習目標與進度，雖然我們熱愛電競遊戲，仍必須堅持在九點半準時結束。接著我用半小時預習隔天的課程，十點開始洗漱，準備就寢，讓自己隔天有充沛的體力。
    - idx: 6
      text: 理智上我知道，作息時間表剛出爐時就必須嚴格執行，但情感上，這樣的自我要求讓我痛苦萬分，特別是晚上九點半，不論遊戲多麼精彩刺激，也必須強迫關機。還好，這不是我一個人的武林，隊友們雖然都捨不得下線，仍互相提醒，一起按表操課，登出遊戲。經過幾個月持之以恆的自律和精確的時間管理，我們在遊戲中的排名節節攀升，學校成績也有明顯進步。爸媽都看在眼裡，臉上終於露出欣慰的笑容。
    - idx: 7
      text: 此外，常規的電競訓練與正課的學習也相輔相成。有一次數學老師在講解機率問題，我立刻聯想到遊戲中計算命中率的邏輯：「這不就像計算各項攻擊力，再決定怎麼分配資源，才能打倒對手嗎？」我舉手，興奮的在全班同學面前分享這個想法，全班同學都驚呆了！物理課學到拋物線時，我想到遊戲中拋射武器的飛行軌跡：「如果知道起始位置、速度和方向，就能預測它的落點。」這樣的反應居然得到老師的讚賞，原來這就是融會貫通。我在學習上不斷得到正向回饋，就越來越有信心，也燃起對學習的熱情，開始感覺自己正走在一條學業與電競都能發展的康莊大道上。
    - idx: 8
      text: 進入高三準備大學入學考之際，電競社決定參加全國高中電競聯賽。我們過關斬將，終於進入決賽。當天，體育館座無虛席，加油聲此起彼伏，奮戰到比賽的最後一局，我們卻面臨巨大劣勢，眼看就要輸了！此時，我想起數學課學過的統計學知識，快速分析對手的戰術模式並與隊友討論：「他們每次都是從這個位置偷襲，我們可以設下陷阱！」隊友們決定採取我的建議，果然瞬間逆轉了局面。
    - idx: 9
      text: 當裁判宣布我們是「Winner」的那一刻，我們尖叫、歡呼、擁抱，淚水模糊了我們的視線，觀眾席上，爸媽和親友團也激動的喝采、鼓掌，整個體育館都沸騰了起來。
    - idx: 10
      text: 這次經歷讓我深刻明白，電競不只是遊戲，它教會了我時間管理、團隊合作，甚至能幫助我理解課本知識。現在的我，不僅是一個電競高手，更是懂得平衡生活的大學新鮮人。
    - idx: 11
      text: 回顧這段旅程，我最大的收穫不僅是得到比賽的勝利，還體認到追逐夢想並不一定要放棄學業，無論是在遊戲裡，還是現實生活中，我們都應該勇於接受挑戰、採取適當策略，並堅持不懈，才能不斷突破自己，在人生的賽場上贏得專屬自我的精彩！
  inline_marked_terms: [愧疚, 激情洋溢, 依樣畫葫蘆, 出爐, 按表操課, 節節攀升, 相輔相成, 融會貫通, 康莊大道, 座無虛席, 沸騰]

