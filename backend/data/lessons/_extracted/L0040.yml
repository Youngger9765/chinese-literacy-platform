# ── 六 品格聚光燈 ──
# 跟 L0039 同型：整節是學生自填的自我管理練習，教師版**沒有任何 ☑**。
# 那不是缺印，是本來就沒有標準答案 → 一律 no_correct_answer: true。
spotlight:
  strategy_name: 自我管理─制定作息時間表
  strategy_type: self_management
  blocks:
    - type: concept_box
      text: |-
        上一課，我們學會在時間不夠時，用「列出任務、排出先後、安排做法、檢查調整」處理臨時出現的時間衝突。
        〈我的電競夢〉的主角既要練電競，又要顧學業，他是怎麼做到「不拖延又自律」的呢？關鍵在於：制定規律的作息表，並按照計畫執行。
        接下來，讓我們先找出自己容易浪費時間或拖延的地方，再制定一張適合自己的規律作息表。
      # ⚠️ 這個概念框被分頁切成兩半：前兩行印在 p7 表格下方、後半（「拖延又自律」…）
      #    印在 p8「六 品格聚光燈」標題之下。document.xml 的順序是連續的一整段。
    - type: sub_block
      label: 步驟❶：看清時間──看看一天的時間怎麼用
      instruction: 請先看看你平常一天的時間都怎麼用。在下列項目中，勾選你常做的三個項目。
      items:
        - type: multi
          options:
            1: 上課、校隊練習或補習
            2: 寫功課、讀書或複習
            3: 打電動、滑手機、看電視
            4: 聊天或社團活動
            5: 運動、娛樂、出去玩
            6: 幫家裡做事、打工
            7: 發呆或休息或睡太久
            8: '其他：【　】'
          no_correct_answer: true
          note: 學生勾自己常做的三項，教師版八格全空 □
        - type: free_text
          prompt: |-
            ※想一想：請回答以下問題，也可以直接填寫上面的選項號碼。
            1.哪一項最容易讓你拖延，也就是一直不想開始？
            2.哪一項事情最容易讓你花掉太多時間，該停的時候還停不下來？
            3.哪一項事情對你很重要，應該多安排一點時間？
          no_correct_answer: true
          note: 三題各印一條「→____」填寫線，教師版全空
        - type: guide
          text: （你已看出時間花在哪裡了。接下來，找出自己為什麼會拖延。）
    - type: sub_block
      label: 步驟❷：找出問題──找出拖延的原因，學習主角的做法
      instruction: 在開始規畫之前，先了解自己「為什麼容易拖延」。（可複選）
      items:
        - type: multi
          options:
            1: 事情太多，不知道要先做哪一件。
            2: 任務太難，一開始做，就想逃開。
            3: 本來只想休息一下，結果滑手機或看影片太久。
            4: 旁邊有誘惑──例如手機、遊戲、影片或聊天。
            5: 覺得還有時間，明天再做就好。
            6: '其他原因：【　】'
          no_correct_answer: true
        - type: free_text
          prompt: |-
            ※想一想：
            1.在上面的原因中，哪一個是你最常發生的？
            在旁邊畫個「☆」，這是你接下來要特別注意的習慣。
          no_correct_answer: true
        - type: multi
          prompt: 2.我最常拖延的時段是
          options:
            1: 放學後
            2: 晚餐後
            3: 睡覺前
            4: 假日
            5: '其他：【　】'
          no_correct_answer: true
        - type: guide
          text: |-
            現在，你已經知道自己容易在什麼時候、因為什麼原因而拖延。接著來看看主角怎麼安排時間。
            主角的作息安排：
        - type: table
          columns: [類別, 內容, 關鍵策略]
          rows:
            - [學習時間, 晨讀、上課、複習、預習, 在固定時間專心學習]
            - [電競練習, 19:30–21:30, 九點半準時下線]
            - [休息時間, 晚餐、洗漱、睡眠, 保留充足睡眠時間]
        - type: multi
          prompt: 任務：請勾選你覺得主角值得學習的做法。（複選）
          options:
            1: 早上晨讀。
            2: 放學後先做作業。
            3: 設定電競結束時間，九點半準時下線。
            4: 睡前預習。
            5: 保留充足睡眠時間。
          no_correct_answer: true
          note: 教師版五格全空 □；下一行還印「※想一想：這些做法中，哪一個你也做得到？請在選項旁畫一個「☆」。」
        - type: guide
          text: ※想一想：這些做法中，哪一個你也做得到？請在選項旁畫一個「☆」。
    - type: fill_table
      label: 步驟❸：安排作息──設計自己的作息時間表
      instruction: 現在，請你根據自己的生活節奏，設計「我的自律作息表」
      columns: [時間, 我要做的事, 提醒方式]
      column_note: 第一欄表頭下印「（可依自己的作息 修改）」，第三欄表頭下印「（選填）」
      rows:
        - {時間: 06:30–07:30}
        - {時間: 08:00–16:00}
        - {時間: 16:00–19:00}
        - {時間: 19:00–21:30}
        - {時間: 21:30–22:00}
      no_correct_answer: true
      note: 右邊兩欄教師版整片空白，學生自己設計
    - type: sub_block
      label: 步驟❹：檢查調整──選擇可行的反拖延方法
      instruction: 有作息表還不夠，重點是能不能準時開始、按時結束。請回想步驟②找到的拖延原因，選出一至兩個最適合自己的方法。
      items:
        - type: multi
          prompt: ※我的反拖延策略（可複選）
          options:
            1: 設定固定的「開始時間」（例：晚餐後7點準時開始）。
            2: 和同學約好一起讀書或寫功課。
            3: 使用番茄鐘：專心25分鐘，休息5分鐘。
            4: 手機放遠、調靜音或請家人暫時保管。
            5: 把大任務拆成三個小步驟（例如：找資料→完成內容→修改）。
            6: 完成一小段後，讓自己休息一下或得到小獎勵。
          no_correct_answer: true
        - type: free_text
          prompt: |-
            ※我的承諾：
            1.為了不再拖延，我打算每天固定在【　】點開始【　】（例如：寫功課、讀書或複習）。
            2.我會用【　】（方法或工具）提醒自己準時開始。
          no_correct_answer: true
    - type: self_check
      label: ◎自我檢核表
      instruction: 請你自己檢查，在符合的項目打勾，看看你學到了什麼？
      items:
        - 1.我能找出自己最容易浪費時間的時段
        - 2.我能分析自己拖延的原因
        - 3.我能設計符合自己生活的作息時間表
        - 4.我能設定可行的反拖延方法
      checked: []
      no_correct_answer: true

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 下列語詞，何者使用錯誤？
      options:
        A: 小明每天都在家休息，他的收入「節節攀升」
        B: 訓練時，教練要求大家要「按表操課」，準時完成每個項目
        C: 他的努力和老師的指導「相輔相成」，成績逐漸提升
        D: 小華邏輯思考能力很好，能把不同的知識「融會貫通」
      teacher_note: (單靠休息不可能帶來收入的增加，使用「節節攀升」不合邏輯。)
    - index: 2
      answer: C
      stem: 主角的成績為什麼能逐漸進步？
      options:
        A: 主角每天熬夜用功讀書，逐漸提高成績
        B: 遇到困難時，他選擇放棄電競專注於學業
        C: 他制定作息時間表，並且持續按照計畫執行
        D: 他不斷參加電競比賽，磨練自己的專業技能
      teacher_note: (第6段指出，主角學會了時間管理，並制定了一個作息時間表，使他能夠兼顧學業與電競活動，最終在兩者上都取得進展。)
    - index: 3
      answer: B
      stem: 主角在電競比賽中逆轉局勢的關鍵原因是什麼？
      options:
        A: 對手操作連續失誤，使他們得以輕鬆逆轉
        B: 主角運用統計知識，分析對手的戰術模式
        C: 他的隊友們發揮卓越的技術，憑靠實力獲勝
        D: 隊友們默契十足，一起想到了一個新的戰術
      teacher_note: (第 8 段指出，主角回憶起數學課的統計學知識，並利用它來分析對手的戰術模式，從而逆轉了比賽的局勢。)
    - index: 4
      answer: D
      stem: 主角覺得晚上九點半時要關機很痛苦，但他說：「還好這不是我一個人的武林」，請問他最可能的意思是什麼？
      options:
        A: 夥伴們也必須關機，主角幸災樂禍
        B: 表示一起練武功的人，不會覺得孤單
        C: 我們關機了，總還有人在線上繼續努力
        D: 如果只有他一個人，想抗拒誘惑就更難了
      teacher_note: (關掉喜愛的遊戲是痛苦的，還好他有一群人在陪他奮鬥，如果只有一個人，根本難以抗拒誘惑。)
    - index: 5
      answer: C
      stem: 從主角的經歷中，我們可以學到什麼樣的生活態度？
      options:
        A: 追逐夢想時，應優先提升專業能力，學業可以稍後補足
        B: 找到優秀的夥伴後，團隊合作會比個人自律更重要
        C: 安排好時間並持續努力，可以兼顧夢想與學業
        D: 只要把課本知識運用在電競上，就能提高比賽成績
      teacher_note: (第11段指出，不論是在追求夢想還是學業上，關鍵是找到平衡，並在面對困難時保持堅持和努力，這樣才能取得成功。)

