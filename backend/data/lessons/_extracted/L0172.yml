# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 特質的多元樣貌
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  _總表_第六大題標題: 品格力──特質的多元樣貌
  _總表_note: 總表兩個欄位（教材目標策略／第六大題標題）都填「品格力──特質的多元樣貌」；學習單第六大題旁邊只印後半「特質的多元樣貌」，右上角的目標框才印完整那句。
  blocks:
    - type: concept_box
      text: 每個人都有自己的特質，而每種特質都有適合的舞台。本文主角阿翔比較內向、自省，因此容易焦慮和想很多，這樣的特質可以幫助他更細心、準備更周到；但有時也讓他太擔心、太緊張。所以，理解一個人的特質時，不能只做好、壞的判斷，而是要看見它在什麼情況下能幫一個人發揮潛力，什麼時候又會變成限制、需要調整。現在就讓我們一起來練習看見特質的多元樣貌！
    - type: matching
      instruction: ◎認識特質的多元樣貌：每一種看似令人困擾的特質，可能有著隱藏的「超能力」。請發揮你的觀察力，試著將左邊的「困擾特質」與右邊對應的「隱藏超能力」連起來，找出它們真實的模樣吧！
      left_header: 困擾特質
      right_header: 隱藏超能力
      left:
        1: 想太多
        2: 固執
        3: 衝動
        4: 愛說話
        5: 好勝、愛比較
        6: 沒主見
      right:
        A: 行動力強、反應快
        B: 隨和、配合性高
        C: 充滿鬥志、認真投入
        D: 心思細膩，做事謹慎
        E: 口條流暢、能表達
        F: 有恆心、能堅持
      answer: {1: D, 2: F, 3: A, 4: E, 5: C, 6: B}
      answers_are_graphical: true
      answer_carrier: 連線（圖形）；5 條紅色 srgb C00000 + 1 條黑色虛線（1→D 那條），文字流無此資訊
      answer_note: |-
        三個獨立來源指到同一組配對，才敢寫下來：
        ① 幾何：6 條 line 的端點（off + ext + flipV）換算成左右兩欄的第幾列，得到 1→D 2→F 3→A 4→E 5→C 6→B。
        ② 像素：PDF 上 6 條線都畫得出來（沒有紙外殘留、沒有被 LibreOffice 漏畫），走向與 ① 一致。
        ③ 語意：下一個練習「特質伸展台」把同樣六組寫成「想太多／謹慎」「固執／堅持」「衝動／反應快」
           「愛說話／口條好」「好勝／有鬥志」「沒主見／隨和」—— 逐組對上 ① 的配對。
    - type: guide
      text: →特質是一體兩面，當看見令人困擾的特質時，也可以換個角度找找它隱藏的超能力唷！
    - type: sub_block
      label: 特質伸展台
      instruction: ◎特質伸展台：不同的特質在適合的情境下才能展現「超能力」，讓特質成為優勢。請依據特質判斷，哪一個情境更適合發揮？請在（ ）打勾。
      columns: ['', 特質, 情境(適合發揮的打勾)]
      answer_carrier: 手寫「Ｖ」字元（在 w:t 文字流裡）；第 1 題黑色，第 2~6 題紅色 EE0000
      items:
        - type: single
          label: '1.'
          intro: 想太多／謹慎
          options:
            A: 籃球比賽剩下 3 秒，必須立刻在三分線外出手
            B: 負責規劃班級出遊，安排交通路線和雨天備案
          answer: B
        - type: single
          label: '2.'
          intro: 固執／堅持
          options:
            A: 討論園遊會的活動，需要各種創意想法互相討論
            B: 練習一項枯燥、需要重複才能熟練的基本動作
          answer: B
        - type: single
          label: '3.'
          intro: 衝動／反應快
          options:
            A: 按照老師指示操作實驗器材，並記錄觀察結果
            B: 體育課同學意外受傷，需要立刻去找護理師協助
          answer: B
        - type: single
          label: '4.'
          intro: 愛說話／口條好
          options:
            A: 擔任園遊會的叫賣人員，吸引路過的同學和家長
            B: 上課時，需要靜下心來自己閱讀和寫學習單
          answer: A
        - type: single
          label: '5.'
          intro: 好勝／有鬥志
          options:
            A: 陪伴心情低落的朋友，傾聽對方的煩惱與壓力
            B: 在班際競賽時，在場邊為班上選手加油
          answer: B
        - type: single
          label: '6.'
          intro: 沒主見／隨和
          options:
            A: 小組分工，剩下無人認領的工作，需要有人完成
            B: 和同學一起出去玩，要負責決定午餐吃什麼
          answer: A
    - type: guide
      text: →能把握適合發揮的舞台，就能讓不同特質成為一份寶藏。
    - type: guide
      text: ◎特質鏡子：現在回來思考看看自己身上也有哪些特質？而這個特質隱藏的超能力又是什麼？適合運用在什麼情境呢？
    - type: free_text
      prompt: |-
        例：我有一個常被當成缺點的特質是想很多。
        在這個特質背後的超能力是心思細膩，做事謹慎，我認為它適合發揮的舞台是在需要避免危險或突發狀況的時候。
        →我有一個常常被當成缺點的特質是________________。
        在這個特質背後的超能力是＿＿＿＿＿＿________________________。
        我認為它適合發揮的舞台是在＿＿＿＿＿＿_____________________________________________________________________________的時候。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿空白（「例：」那兩行是題目給的示範，不是答案）

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（run 層 w:color E97132）
  teacher_note_carrier: 深藍色（C:0F4761）文字方塊，印在題目右側
  questions:
    - index: 1
      answer: C
      stem: 下列選項中「  」的語詞，何者使用正確？
      options:
        A: 那位高級餐廳的服務生態度親切，詢問也十分「刁鑽」
        B: 上台前五分鐘他還拿著稿子練習，看起來很「荒謬」
        C: 聽到這個假消息後，他「氣急敗壞」的說要找出造謠的人
        D: 他做人不老實，說話常常變來變去，絕對「不可置信」
      teacher_note: 第1題解析：(A)「刁鑽」有刻意為難的意思(B)「荒謬」應換成「慌張」(D)「不可置信」應換成「不可相信」
      teacher_note_note: 這個文字方塊在 PDF 上被右邊界裁掉一部分（「不可相」之後看不到），此處以文字層為準
    - index: 2
      answer: D
      stem: 根據第三段，作者說阿翔是「隊上動作最標準、最像教科書的那一個」，這句話最能推論出下列何者？
      options:
        A: 阿翔只是模仿他人動作，缺乏真正理解
        B: 阿翔球技最好因此比賽時完全不會失誤
        C: 作者特別偏愛阿翔因此常給予額外稱讚
        D: 阿翔的基本功與動作紮實，可做為典範
      teacher_note: 從前後文可看出，阿翔的認真努力，而此處的「教科書」有可以效法和標準答案的意思。
    - index: 3
      answer: B
      stem: 根據第五、六段內容，下列何者為阿翔被選為先發後仍悶悶不樂的原因？
      options:
        A: 他認為隊友比自己更有資格上場，因此心裡感到十分嫉妒
        B: 他把一次守備的失誤放大成對自己的否定，因而陷入懷疑
        C: 他介意作者叫他「翔太多」，所以不想和他一起上場比賽
        D: 他擔心教練是想讓他在比賽中出糗丟臉，才故意安排先發
      teacher_note: 解析：從前後文提到他被教練提醒後「臉色一沉」可推知。
    - index: 4
      answer: D
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 強調球隊紀律的重要性，說明成功來自嚴格訓練
        B: 描寫比賽競爭激烈，提醒球員必須保持絕對專注
        C: 說明自我反省的重要，唯有反省才能不斷提升實力
        D: 藉阿翔的故事，指出特質若運用適宜也能成為助力
      teacher_note: (Ｄ)符合「想很多」是認真、細心，也可以是力量。
      teacher_note_source_text: (Ｄ)符合「想很多」是認真、細心，也可以是力量。」
      errata_ref: E1
    - index: 5
      answer: A
      stem: 根據品格聚光燈，下列關於「特質」的敘述，何者最符合？
      options:
        A: 特質沒有好壞，但是需要找到適合發揮的舞台
        B: 我們不需要刻意隱藏自己的特質，要大方展現
        C: 某個特質如果帶來困擾，就代表那不是好特質
        D: 我們可以改變自己的特質，來符合他人的期待
      teacher_note: |-
        (B)文本沒有提到
        (C)特質沒有好壞
        (D)本文沒有提到

