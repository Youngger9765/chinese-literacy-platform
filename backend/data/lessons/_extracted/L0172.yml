vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [五體投地, 靦腆, 游擊, 精神抖擻, 鑽牛角尖, 刁鑽, 臉色一沉, 不可置信, 荒謬, 氣急敗壞, 悠悠, 低潮]
  target_words_note: 灰框裡分兩行印：第 1 行「五體投地、靦腆、游擊、精神抖擻、鑽牛角尖」，第 2 行「刁鑽、臉色一沉、不可置信、荒謬、氣急敗壞、悠悠、低潮」。
