  geometry_check: |-
    🔴 **12 個圈，但只有 11 個是圖形**：群組（4.87×3.93in）裡有 11 個 roundRect
    ＋ **1 張內嵌圖片**（`圖片 103` / rId27，off 0.918,0.000、ext 0.383×0.815in）。
    那張圖蓋住的正是 R1C3+R2C3 的「刁鑽」——只數 `prst="roundRect"`（＝11）會判成
    「刁鑽沒被圈、answers_printed: partial」，而那是錯的。
    怎麼抓到的：把 PDF 點陣化（200dpi）後對橘色做連通元件 → **12 個**，
    跟圖形數（11）差一個，回頭在 XML 才找到那張圖。
    ⚠️ `fitz.get_drawings()` 也只看得到 11 個（它看不到那張點陣圖），
       所以**向量清點與圖形清點會一起漏掉同一個東西**，兩者不算互相對照 —— 要用像素。
    沒有紙外殘留（11 個 roundRect 的 positionH 換算後全在紙內，也沒有 bg1/白色線的隱形框）。
    格子沒有跨頁（10 列都在同一頁）。
    12 條路徑全部用「把 cells 套回 grid 拼字」驗過，都拼得回目標語詞 —— 格子沒有印錯字。
