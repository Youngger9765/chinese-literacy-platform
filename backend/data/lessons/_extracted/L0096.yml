    與「110＝段2 末、254＝段3 末」互相印證。
  inline_marked_terms: [臨界點, 岌岌可危, 首當其衝, 雲端, 鳥瞰, 先例, 流離失所, 溫室氣體, 池魚之殃, 氣候難民, 冤屈, 沒有人是局外人]
  inline_marked_terms_note: |-
    課文中用方框（w:bdr，黑色 auto）標出 12 個語詞 —— 這是「B 組」清單，
    **含「溫室氣體」但不含「元宇宙」**，與第三大題語詞框（A 組）差一個字詞。
    見 meta._語詞三份清單note。
