# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 反思策略——4F反思法
  strategy_type: reflection
  section_title_printed: 閱讀聚光燈
  answer_carrier: 橘色手寫字；**本大題沒有任何 ☑**（全課 F0FE ＝ 0），因為 4F 反思是開放書寫不是選擇題。
  blocks:
    - type: concept_box
      text: |-
        「反思」的能力很重要，它能幫助我們發現自己的問題，進而思考：我可以怎麼做？當有新聞或校園事件發生時，你可以問自己：「這是怎麼回事？我覺得……再來可以怎麼做？」這就是「反思」了。
        作者看到吐瓦魯的報導也進行了反思，她想到臺灣也受到全球暖化的威脅，認為對抗全球暖化是全人類的共同議題。
        反思很重要，但該怎麼做呢？接下來我們要介紹一個易學、步驟清楚的「4F反思法」。
        1.事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。
        2.感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？
        3.發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？
        4.未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？

    - type: guide
      text: 一、請你利用課文來練習4F反思法，幫忙填入「未來（Future）」的格子內，能有什麼行動預防全球暖化吧。

    - type: fill_table
      prompt: 一、請你利用課文來練習4F反思法，幫忙填入「未來（Future）」的格子內，能有什麼行動預防全球暖化吧。
      columns: [4F 步驟, 內容]
      layout_note: |-
        原稿是 2×2 的四個虛線方框，用灰色箭頭連成 事實(左上)→感受(右上)→發現(右下)→未來(左下)。
        箭頭是圖形、不在文字流。本表照 4F 的流向排列。
      answer_carrier: 只有「未來」那一格是要學生填的，橘字是示範答案
      rows:
        - {4F 步驟: 事實（Facts）, 內容: 吐瓦魯因為全球暖化即將被淹沒，宣布要建立元宇宙國家。}
        - {4F 步驟: 感受（Feeling）, 內容: 我覺得很擔心，也覺得不公平，因為吐瓦魯排放的溫室氣體很少，卻受到很大的影響。}
        - {4F 步驟: 發現（Finding）, 內容: 我發現全球暖化不只是吐瓦魯的問題，臺灣也可能受到海平面上升影響，所以沒有人是局外人。}
        - 4F 步驟: 未來（Future）
          內容: |-
            我們可以做哪些事，減少溫室氣體排放，為減緩全球暖化盡一份力？節能低碳生活。
            （答案合理都正確）
          內容_note: |-
            「節能低碳生活。」是橘色示範答案，「（答案合理都正確）」是原稿印的批改說明。
            ⛔ 不標 `no_correct_answer` —— 這一格**有**印出示範答案，只是答案不唯一。

    - type: guide
      text: ◎小試身手：

    - type: guide
      text: 二、請閱讀以下新聞，並練習4F反思法完成表格。

    - type: passage
      label: 〈缺糧讓兒童面臨童工、童婚風險〉
      byline: 　陳芝瑄／臺北報導(2024/6/20)
      paragraphs:
        - 世界展望會發布的「缺糧」報告指出，在一些需要援助的國家，許多家庭因為缺少食物，每天只能吃一頓飯，甚至有人整天沒有東西吃。
        - 長期缺糧，影響不只是吃不飽，許多兒童的生活也因此改變。有些兒童不到十歲就被迫工作，幫忙賺錢或換取食物；有些家庭無力照顧孩子，只好讓女兒提早結婚。原本應該上學、成長的孩子，因此失去受教育和安全生活的機會。
        - 世界展望會指出，氣候變遷、戰爭衝突等因素，使許多人陷入飢餓危機。人道救援組織正提供食物和其他協助，希望減少家庭的生存壓力，也避免更多兒童因缺糧而被迫工作或提早結婚。
      source_line: <節選自國語日報網路新聞https://reurl.cc/bVLQzy>
      underlined_terms: [世界展望會]

    - type: fill_table
      prompt: 二、請閱讀以下新聞，並練習4F反思法完成表格。
      columns: [4F 步驟, 內容]
      layout_note: 與上一張同型的 2×2 虛線方框＋灰色箭頭，流向 事實→感受→發現→未來。
      answer_carrier: 橘色手寫字（PDF p6）；原稿註明「格子內答案只要合理都正確，無標準答案」
      rows:
        - {4F 步驟: 事實（Facts）, 內容: 有些國家長期缺糧，許多兒童因此被迫提早工作或結婚，人道組織正提供食物及其他協助，希望改善現況。}
        - 4F 步驟: 感受（Feeling）
          內容: 我覺得【　】，因為【　】
          內容_blanks:
            - {answer: 好驚訝、難過}
            - {answer: 許多小孩無法上學，被迫工作，女孩子被迫結婚}
        - 4F 步驟: 發現（Finding）
          內容: 我發現缺糧【　】
          內容_blanks:
            - {answer: 的影響不只是吃不飽，還可能使兒童失去上學和正常成長的機會。}
          內容_label_printed: 延伸思考後的發現
        - 4F 步驟: 未來（Future）
          內容: 我應該要【　】
          內容_blanks:
            - {answer: 珍惜食物、減少浪費，也主動了解缺糧問題和各種人道援助方式}
          內容_label_printed: 未來我可以怎麼做？
      tail_note: 表格下方印有「（格子內答案只要合理都正確，無標準答案）」。

    - type: guide
      text: 最後，國文和社會科老師經常會針對最近的新聞或校園事件，請同學們發表看法，無論是要同學口頭或書面發表，都是運用「4F反思法」的最好時機。

