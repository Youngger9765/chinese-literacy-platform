# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 議論文結構──用論據支持論點
  strategy_type: text_structure
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層），共 13 個
  blocks:
    - type: concept_box
      text: |-
        議論文通常包含四個要素：論點、支持理由、論據和結論。在議論文中，「論點」是作者的觀點，「支持理由」則是作者支持此觀點的原因，「論據」是作者舉出的事實、例子、數據、研究結果或生活經驗，用來支持理由，增加說服力，最後，作者再根據前面的內容得出「結論」。掌握這些部分，可以幫助我們清楚了解作者的立場和說理方式。
        接下來，我們聚焦在「支持理由」和「論據」。練習判斷作者舉出的內容，是否適合用來支持理由。

    # ── 任務一 ──
    - type: sub_block
      label: 一、本文的論點、支持理由和論據
      instruction: 以下整理本文的論點、支持理由和論據。請勾選正確答案。
      columns_note: 表格印三列：論點／支持理由／論據。前兩列各是一題單選（各一個紅色 ☑），第三列是資訊列。
      items:
        - label: 論點
          options:
            1: 國高中生學數學可以使用計算機，以提升學習效能。
            2: 國高中生學數學應加強手算練習，以深化數學理解。
          answer: 1
        - label: 支持理由
          options:
            1: 反覆練習繁複的計算，可以增強學生的計算能力、深化數學理解。
            2: 運用工具可以把能力、經驗或知識外化，擴充人的能力、提升效能。
          answer: 2
        - label: 論據
          value: |-
            紙筆
            計算機
            長竿與石子
            語言
            文字
            圖書館
            網路
          value_note: |-
            這一列在原稿是**七個並排的儲存格**，沒有題目也沒有勾選，是把本文用到的論據列出來。
            這裡一列一個詞（原稿的儲存格界線＝這裡的換行），不加分隔符號 ——
            寫成「紙筆／計算機／…」會被逐字門判 FAIL，而且它判得對：那些「／」原稿沒有。
          argument_evidence: [紙筆, 計算機, 長竿與石子, 語言, 文字, 圖書館, 網路]

    # ── 任務二 ──
    - type: guide
      text: 二、檢查例子是否適合作為論據
    - type: guide
      text: |-
        支持理由：運用工具可以把能力、經驗或知識外化，擴充人的能力、提升效能。
        論據檢核：論據要能支持理由，才能讓論點更有說服力，請判斷下列課文內容能不能支持這個理由。
    - type: sub_block
      label: 論據檢核
      columns: [課文內容（論據舉例）, 能支持理由嗎？]
      items:
        - label: 例一
          value: 紙筆幫助人完成二位數乘法
          options: {1: 是, 2: 否}
          answer: 1
        - label: 例二
          value: 計算機協助處理繁複的計算
          options: {1: 是, 2: 否}
          answer: 1
        - label: 例三
          value: 國小階段要熟練基礎計算
          options: {1: 是, 2: 否}
          answer: 2

    # ── 小試身手 ──
    - type: guide
      text: |-
        ◎小試身手：
        請根據論點和支持理由，判斷下列例子是否適合作為論據，並在□打勾。
    - type: sub_block
      label: 練習一
      columns: [論據舉例, 檢核提問, 檢核結果]
      columns_note: |-
        表頭印的是「檢核提問: / 這個例子能說明手機容易使學生分心嗎？」與
        「檢核結果： / 是否適合作為論據？」，兩欄各自是一題單選，所以每個例子有兩個 ☑。
      items:
        - label: 論點
          value: 學校應該統一管理手機。
        - label: 支持理由
          value: 在校期間，手機放在身旁容易使學生分心。
        - label: 檢核提問
          value: 這個例子能說明手機容易使學生分心嗎？
        - label: 檢核結果
          value: 是否適合作為論據？
        - label: 例一
          value: 小明常在上課看手機，沒有聽到上課重點。
          options: {1: 是, 2: 否}
          answer: 1
          second_question_answer: 1
          second_question_note: 「檢核提問」與「檢核結果」兩欄各勾一次，本例兩欄都勾①是
        - label: 例二
          value: 小美在放學時會和同學分享手機照片。
          options: {1: 是, 2: 否}
          answer: 2
          second_question_answer: 2
          second_question_note: 兩欄都勾②否
    - type: sub_block
      label: 練習二
      columns: [論據舉例, 檢核提問, 檢核結果]
      items:
        - label: 論點
          value: 早自習應該開放學生到操場運動。
        - label: 支持理由
          value: 運動能提升學習專注力。
        - label: 檢核提問
          value: 這個例子能說明運動可以提升學習專注力嗎？
        - label: 檢核結果
          value: 是否適合作為論據？
        - label: 例一
          value: 研究顯示，每天運動30分鐘的學生，專注力比不運動的學生提高20%。
          options: {1: 是, 2: 否}
          answer: 1
          second_question_answer: 1
          second_question_note: 兩欄都勾①是
        - label: 例二
          value: 小華打籃球時總是能付出全力、聚精會神。
          options: {1: 是, 2: 否}
          answer: 2
          second_question_answer: 2
          second_question_note: 兩欄都勾②否

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  questions:
    - index: 1
      answer: C
      stem: 下列「」中的詞語，何者替換後文意改變？
      options:
        A: 計算機幫助學生「騰出」更多心力專注於思考→空出
        B: 關於這則訊息的真實性仍有待「商榷」，不可輕易相信→討論
        C: 體育館興建後，雨天訓練的難題也變得「迎刃而解」→困難重重
        D: 在嚴格訓練之下，球隊實力迅速「躍升」，成為聯賽黑馬→提升
      options_note: 四個選項裡的「→」是一般文字字元（不是 Wingdings 符號），照原樣保留
      explanation: C. (意思不同)
      explanation_placement_note: 印在題號右側的獨立文字方塊（藍框），是教師版解析
    - index: 2
      answer: D
      stem: 第三段最後兩行，作者問道：「以上的教學活動中，哪一個步驟是國中生數學學習的重點？我想應該不會有人說是乘除計算的正確性與速度。」請問作者認為文中教師的教學活動其學習重點為何？
      options:
        A: 能理解書桌、講桌、窗戶的幾何形狀如何構成
        B: 能精確測量各種長方形的長、寬、對角線長度
        C: 能夠熟記畢氏定理「a2+b2＝c2」公式
        D: 理解所有的直角三角形都符合畢氏定理
      explanation: 第2題解析：教師檢核學生是否理解「畢氏定理是否放諸四海皆準，適用於每一個不同的直角三角形」。
      explanation_placement_note: 印在選項右側的獨立文字方塊（藍框），是教師版解析
    - index: 3
      answer: C
      stem: 文章中提到人類文明發展歷程中的「外化」例子，以下哪一項不屬於「外化」的例子？
      stem_note: 題幹的「不屬於」在原稿加了底線強調
      options:
        A: 用手機行事曆提醒自己買牛奶
        B: 用筆記本寫下未完成的重要事項
        C: 熟記數學的重要公式及應用方法
        D: 將課堂所學重點打在電腦上
      explanation: 第3題解析：C選項未將訊息外化，只是記在心裡。其他選項ABD都涉及將信息外化。
      explanation_placement_note: 印在選項右側的獨立文字方塊（藍框），是教師版解析
    - index: 4
      answer: B
      stem: 根據本文，關於數學學習中使用計算機的敘述，下列何者正確？
      options:
        A: 手動計算能幫助學生增加理解數學概念，但容易出錯
        B: 計算機可以節省心力，讓大腦資源用於更重要的學習
        C: 手動計算能增加學生對數學的興趣，也能深化數學的理解
        D: 計算機能減少計算錯誤，但可能會讓學生不思考解題過程
      explanation: 第4題解析：B計算機能快速計算，並釋放大腦空間，讓學生可以專注於理解數學概念。其他選項的描述不完全符合文章中的觀點。
      explanation_placement_note: 印在第 3 題選項右側的獨立文字方塊（藍框），版面上比它所屬的第 4 題還早出現
    - index: 5
      answer: D
      stem: 請問以下選項，何者最能說明作者第五、六段的「寫作目的」？
      options:
        A: 詳細描述人類異於禽獸的文明發展歷史
        B: 舉各種例子，說明人類的溝通可以跨越時間與空間
        C: 講述電腦、網路及行動裝置的興起對書藉與圖書館的衝擊
        D: 說明心智外化是世界趨勢，不必排斥在課堂上用計算機
      options_note: |-
        ⚠️ PDF p9 上選項 D 被中間一個裝飾圖框擠到下一段，看起來像脫隊；
        文字層順序正常（A→B→C→D）。另，選項 C 的「書藉」原稿如此（未改）。
      explanation: ABC皆不是寫作目的。
      explanation_placement_note: 印在選項 A 右側的獨立文字方塊（藍框），是教師版解析

