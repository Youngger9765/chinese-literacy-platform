  vocabulary_bank_label: 本課語詞
  instruction: |-
    請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
    🅐 從本課語詞框框，找語詞。
    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    🅒 問同學。
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  items:
    - {index: 1, word: 負荷超載, definition: 超過了可以承受的範圍，變得太多、太重，無法負擔。}
    - {index: 2, word: 有待商榷, definition: 還需要進一步討論，還不能確定是對或錯。}
    - {index: 3, word: 迎刃而解, definition: 問題很輕鬆、很順利地解決了，就像用刀刃切東西一樣簡單。}
    - {index: 4, word: 繁複, definition: 又多又複雜，不容易理解或處理。}
    - {index: 5, word: 躍升, definition: 快速地提升，變得更好，或達到新的高度。}
    - {index: 6, word: 闕如, definition: 缺少某個部分，不完整。}
    - {index: 7, word: 攸關生命, definition: 和生命安全有關，非常重要，不能忽視。}
    - {index: 8, word: 前瞻性, definition: 能預先想到未來的需要或發展，並提早做準備。}
    - {index: 9, word: 放諸四海皆準, definition: 在任何地方、任何情況下都適用，都是對的。}
    - {index: 10, word: 外化, definition: 將經驗、知識或力量，藉由工具表現出來的過程。例如：把數字或想法寫在紙上。}
  items_note: |-
    答案填在底線上，教師版用橘色手寫。第 (4)(6) 題的答案在原稿印成「繁 複」「闕  如」
    （字間有空白），那是填在底線上的手寫間距，不是兩個詞。

