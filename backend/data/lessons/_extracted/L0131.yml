# ── 一 讀全文-做記號 ──
body:
  title_line: 第10課  國高中數學課當然可以使用計算機！
  byline: |-
    課文  ：曾世杰
    學習單：高芳瑄
  preface: 前言：2016年，中研院的林長壽院士召開記者會，發表了對數學教育的論點，他主張要讓學生「透過計算來深化數學的理解」、「數學課讓學生按按計算機……是不道德的。」但本課作者曾世杰卻反對林院士的看法，他認為應該讓國高中學生在數學課裡使用計算機，讓我們來看看曾世杰怎麼反駁林院士，怎麼提出不同的論點，並舉出論據來支持自己的論點。後來教育界普遍接受曾世杰的看法，現在國高中的數學課，已經可以使用計算機了。
  preface_note: |-
    ⛔ 這段「前言」印在段號欄**之外**（自己一列、旁邊沒有段號），不是第 1 段。
    照 skill §⑥.55 獨立存 preface，不併進 paragraphs —— 併進去會讓念順順的
    「☞ 第五段」指到第 4 段。
  paragraph_count: 6
  paragraphs_note: 段號欄印 一~六 共 6 個，與有編號的課文 6 段一致（前言不佔段號）。
  paragraphs:
    - idx: 1
      text: 在國小階段，我贊成林院士的說法。基礎計算能力的自動化當然是數學教育的重中之重，如果7+6還要數手指，8x7還要從「8x1=8、8x2=16……」背起，基礎計算會耗盡所有的大腦資源，大大影響了數學的學習。但是，進了國高中，「透過計算來深化數學的理解」，這個說法就有待商榷，我認為這個階段的學生若有計算機做為「大腦工具」，可望大幅增加學習的效能。
    - idx: 2
      text: 先舉例說明什麼是「大腦工具」。文字及紙筆就是大腦工具中的一種，一般人未必能心算二位數的加減乘除（如65x23=?），但這只是大腦容量不足，無法同時負載這麼多的數字，並不表示計算能力闕如。只要紙筆在手，把腦袋裡的數字「外化」成白紙上的黑字，大腦負荷超載的問題立刻迎刃而解，多數人就能比較順利地完成計算。在這個例子裡，同一個人在「無紙筆」和「有紙筆」狀況下的表現，會有小老鼠與大象的差別。同樣的，計算機是功能更強大的大腦工具，我主張把複雜的計算「外化」給計算機完成後，學生的數學學習才可能更精進、更有效率，小老鼠可以躍升為大象。
    - idx: 3
      text: 例如，國中數學課，老師請同學們測量出教室裡各種長方形的寬邊（a）、長邊（b）和對角線（c）長度，如學生書桌、講桌、窗戶等，再把數據代入畢氏定理的公式（a2+b2＝c2），以檢驗畢氏定理是否放諸四海皆準，適用於每一個不同的直角三角形。請問：以上的教學活動中，哪一個步驟是國中生數學學習的重點？我想應該不會有人說是乘除計算的正確性與速度。
      text_note: |-
        「a2+b2＝c2」的三個 2 在版面上是**上標**（`w:vertAlign superscript`），
        文字流裡就是一般的「2」。照文字層記錄，不代打 ² 字元。
    - idx: 4
      text: 「透過計算來深化數學理解」的說法，在這裡顯然是不適用的。學生測量得到的三個長度，可能都不是整數，計算起來容易出錯，這時候使用計算機，會幫助學生節省心力，更專注於數學概念的理解。把繁複的計算交給計算機後，學生的大腦可以騰出空間來做更重要的理解、推理和問題解決，才更可能享受數學的實用與美麗。
    - idx: 5
      text: 其實，人類的文明發展，就是一部把能力、經驗與知識「外化」的歷史。當人類祖先執起長竿打落樹上的果實，或撿起石子丟向獵物時，他異於禽獸之處，在於把自身的力量外化到長竿和石子上了；當最早使用語言的祖先，大喊：「有蛇！」以警告旁人時，他異於禽獸之處，在於把感官經驗外化成語言，將攸關生命的警報分享給同伴。六千年前，語言被外化成書面文字，知識得以有系統的被保存，讓今人仍然可知二千五百年前孔子講了什麼，人類的溝通因此得以跨越時空。二十世紀的圖書資訊專業，將數千年來累積的知識從書籍外化到圖書館；而二十一世紀電腦、網路及行動裝置的興起，又把圖書館外化到網路上。
    - idx: 6
      text: 也就是說，當前的世界已經把大量極為複雜的知識及計算外化，我們國家的數學教育當然也要有前瞻性，讓國高中生學習時部分的心智歷程外化，使用計算機讓數學學習更有效能，如果此時我們還規定國高中數學課不能使用計算機，那實在太不可思議了。
  inline_marked_terms: [有待商榷, 闕如, 外化, 負荷超載, 迎刃而解, 躍升, 放諸四海皆準, 繁複, 攸關生命, 前瞻性]
  inline_marked_terms_note: |-
    課文裡被加了字元外框的語詞（PDF 上是方框），十個剛好等於本課語詞表。
    有底線的是專名（中研院／林長壽／曾世杰／畢氏定理／孔子），那是強調不是語詞標記。

