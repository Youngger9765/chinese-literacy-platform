    - type: concept_box
      text: |-
        上一課，我們學會把幾個言行線索合起來，找出共同點，再推論人物特質。
        這一課，我們要再往前一步：不只找出人物有什麼特質，還要把她在不同階段的言行連起來，看看同一項特質如何在不同困境中反覆表現，又如何影響人物一步一步成長。
        陳念琴一再遇到困難，她每次怎麼面對？這些做法又讓她產生哪些改變？我們用四個步驟來讀懂：
        ❶看前後變化　  ❷看困境、做法與發展
        ❸推論核心特質　❹用特質理解成長

    - type: sub_block
      label: 一、看陳念琴的前後變化
      instruction: 一、看陳念琴的前後變化
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: passage
          label: 1.先讀一讀故事開始與結尾的陳念琴
          paragraphs:
            - 故事開始：那時的陳念琴很自卑，不管到哪裡都躲在哥哥身後。
            - 故事結尾：她再次戴起拳擊手套，準備揮出下一拳，迎戰一個又一個新的挑戰。
        - type: single
          index: 2
          prompt: 2.故事開始到結尾，陳念琴最大的改變是什麼？（單選）
          options:
            1: 從害怕練拳、常想放棄，變成只重視比賽成績。
            2: 從自卑、躲在哥哥身後，變成有力量、有信心迎向挑戰。
          answer: 2
        - type: guide
          text: ➡我們已經看見陳念琴前後有明顯的改變。
        - type: guide
          text: 接著看看：她在一次次的困難中怎麼做，才逐漸成為後來的自己。

    - type: fill_table
      label: 二、看陳念琴的困境、做法與發展
      instruction: 二、看陳念琴的困境、做法與發展
      sub_instruction: 請根據課文，勾選她怎麼面對困難，以及後來的外在成果與內在成長。
      columns: [階段, 遇到的困境, 怎麼面對, 外在, 內在]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      rows:
        - 階段: 1.剛加入拳擊隊
          遇到的困境: 男生排斥她；練習對打時，她一次也沒有贏過
          怎麼面對_options:
            1: 不再和男生對練，改做比較容易的訓練。
            2: 先讓心平靜，練防禦、躲閃，再尋找出拳機會。
          怎麼面對_answer: 2
          外在_options:
            1: 技巧進步，並在拳擊賽中獲得冠軍。
            2: 技巧雖有進步，卻始終沒有贏得比賽。
          外在_answer: 1
          內在_options:
            1: 從沒有成就感，逐漸相信自己可以變強。
            2: 雖然繼續訓練，仍覺得自己不適合拳擊。
          內在_answer: 1
        - 階段: 2.發現缺鐵性貧血
          遇到的困境: 慢跑或爬樓梯就氣喘如牛，訓練時常感到心力交瘁。
          怎麼面對_options:
            1: 一邊訓練，一邊監測身體狀況，沒有因此放棄。
            2: 暫停所有訓練，等身體完全恢復後再重新開始。
          怎麼面對_answer: 1
          外在_options:
            1: 暫停拳擊訓練，等身體恢復後再重新開始。
            2: 拳擊之路沒有中斷，後來取得奧運拳擊資格。
          外在_answer: 2
          內在_options:
            1: 因為擔心身體狀況，開始懷疑自己能否繼續。
            2: 擊敗年紀更大的選手後，她真正找回自信。
          內在_answer: 2
        - 階段: 3.罹患淋巴癌、媒體質疑
          遇到的困境: 承受化療副作用，也面對媒體對比賽表現的質疑。
          怎麼面對_options:
            1: 停止治療，先把所有心力放在奧運備戰上。
            2: 和教練討論、接受治療，也繼續為奧運備戰。
          怎麼面對_answer: 2
          外在_options:
            1: 進入奧運前八強，抗癌經歷也鼓舞病友。
            2: 退出奧運比賽，改以抗癌經歷鼓舞病友。
          外在_answer: 1
          內在_options:
            1: 走過生死關卡後，心中多了一份感恩。
            2: 更想用比賽成績，回應外界對她的質疑。
          內在_answer: 1

    - type: sub_block
      label: 三、推論人物特質
      instruction: 三、推論人物特質
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: single
          index: 1
          prompt: |-
            1.找共同點
            把三次困境合起來看，陳念琴面對困難的方式有什麼共同點？（單選）
          options:
            1: 遇到困難時，她總想用成績證明自己比別人強。
            2: 遇到困難時，她會穩住自己、尋找方法，繼續前進。
            3: 遇到困難時，她主要等待教練替她解決問題。
          answer: 2
        - type: single
          index: 2
          prompt: |-
            2.推論核心特質
            這些反覆出現的做法，最能表現陳念琴具有哪一項特質？（單選）
          options:
            1: 自律──能按計畫要求自己
            2: 堅韌──受挫後仍能調整前進
            3: 感恩──會記得別人的幫助
          answer: 2
        - type: guide
          text: ➡遇到困難仍能調整方法、繼續前進，就是「堅韌」。

    - type: sub_block
      label: 四、用特質理解成長
      instruction: 四、用特質理解成長
      sub_instruction: 請把前面的活動和課文線索連起來，讀一讀陳念琴的兩條發展線。
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: guide
          label: A.外在成果
          text: 獲得女子拳擊賽冠軍→取得奧運拳擊資格→進入東京奧運前八強
        - type: guide
          label: B.內在成長
          text: 自卑→感受到自己有力量→開始相信自己可以變強→真正找回自信→心中多了一份感恩
        - type: single
          index: 1
          prompt: 1.把兩條發展線合起來看，陳念琴的「堅韌」如何影響她的成長？(單選)
          options:
            1: 讓她的拳擊成績不斷進步，往後也不再遇到任何困難。
            2: 讓她的拳擊生涯持續向前，內心也由自卑走向自信與感恩。
            3: 讓她更重視比賽勝負，希望用成績回應所有質疑。
          answer: 2
        - type: guide
          text: ➡陳念琴的成長，不只有外在成果，也有內在成長；她在困境中反覆展現的堅韌，正是連起這兩條發展線的關鍵。

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能把人物在不同困境中的做法合起來，推論核心特質。
        - 2.我能用核心特質，看懂人物的外在成果和內在成長。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: B
      stem: 文中柯教練認為陳念琴是一塊「尚待雕琢的璞玉」。「璞玉」在這裡最接近什麼意思？
      options:
        A: 能力已經非常強大的人
        B: 有潛力、仍需培養的人
        C: 膽小害怕、不敢做的人
        D: 所有人都知道的名人
      teacher_note: 雕琢表示還需要再加工，所以璞玉代表未開發。
    - index: 2
      answer: C
      stem: 請問文中第一段「陳念琴讓尋找人才的柯教練眼睛為之一亮」，柯教練最可能的情緒是哪個？
      options:
        A: 羨慕
        B: 悲傷
        C: 驚喜
        D: 憤怒
      teacher_note: 選項C由後句「火速邀請她加入拳擊隊」可推論是發現人才，驚喜的感受。
      stem_mismatch_note: |-
        🔴 題幹引的「陳念琴讓尋找人才的柯教練眼睛為之一亮」**整句不在本課課文裡**
        （全文搜「眼睛為之一亮」只命中題幹自己）；課文對應處是「讓愛惜人才的柯文明教練看見她的潛力」。
        教師註解引的「火速邀請她加入拳擊隊」同樣不在課文裡。且該情節在第二段，不是第一段。
        判為命題對著較早版本的課文寫，非錯字，照原樣記錄不改。
    - index: 3
      answer: A
      stem: 第五段陳念琴說：「我的拳擊生涯就像坐雲霄飛車，忽高忽低，充滿挑戰」，這句話主要在說明什麼？
      options:
        A: 她的拳擊生涯有榮耀，也有低谷
        B: 她訓練時常常感到頭暈
        C: 她喜歡刺激的遊樂設施
        D: 她的比賽速度忽快忽慢
      teacher_note: 後文寫出「攀到高峰的榮耀」和「跌到深谷的恐懼」。
      stem_mismatch_note: 題幹引「就像**坐**雲霄飛車」，課文是「**搭乘**雲霄飛車」；題幹說「第五段」，該句在第六段。照原樣記錄不改。
    - index: 4
      answer: B
      stem: 文中第三段提到「陳念琴「越級打怪」挑戰臺北城市邀請賽」，請問下列何者不是越級打怪的例子？
      options:
        A: 體重50公斤，去參加70公斤級的比賽
        B: 打敗同年齡的對手
        C: 挑戰比自己能力強的選手
        D: 業餘球隊挑戰職業聯賽
      teacher_note: 由第二段可知，她打敗了年紀更大身材更好的亞運選手，代表越級打怪是超越自己的能力做的事。
      teacher_note_mismatch_note: 註解說「由第二段可知」，但「越級打怪／蒙古亞運銅牌選手」在第三段（題幹自己標的第三段才是對的）。
    - index: 5
      answer: C
      stem: 作者為什麼把標題寫成「『拳』力出擊──陳念琴」？
      options:
        A: 表示她遇到問題時，習慣用拳頭和別人爭輸贏。
        B: 表示她比賽時只會主動出拳，不重視防禦和躲閃。
        C: 用「拳」代替「全」，表現她全力投入拳擊、迎向挑戰。
        D: 強調她靠著天生的爆發力，不需苦練就能獲得成功。
      teacher_note: 「拳力出擊」讓人聯想到「全力出擊」，又能扣住陳念琴的拳擊生涯。

