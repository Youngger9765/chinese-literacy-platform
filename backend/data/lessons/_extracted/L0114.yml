body:
  lesson_heading: 第17課  石虎保育：遷移與否的兩難
  課文作者: 曾世杰
  學習單: 陳淑麗
  paragraph_count: 6
  paragraph_numbering_note: |-
    段號欄印的是「ㄧ二三四五六」——第一個是**注音符號 ㄧ（U+3127）**不是漢字一（U+4E00）。
    原稿如此，跟 L0113 同一個形狀。
  paragraphs:
    - idx: 1
      text: 2025年6月底，農業部生物多樣性研究所（生多所）宣布：「傳奇石虎」豆棗死於犬隻攻擊。豆棗倒臥在雜林中，身上滿布犬咬傷痕，獸醫還在牠體內發現殘留多時的鉛彈，顯示牠曾遭盜獵射擊。2021年4月，命運坎坷的這隻母石虎被送到生多所接受救援時，只是一星期大的幼貓，身上滿是跳蚤。經過一年照護與訓練，豆棗於2022年4月繫上發報器、成功野放。同年9月，自動相機紀錄到豆棗和兩隻小石虎的身影。但接下來的第二、三胎，因遇到草堆火警和溪水上漲，皆以失敗告終。豆棗的故事，正好反映出瀕危物種保育的困境——要怎麼做，才能避免像石虎走向絕種呢？
    - idx: 2
      text: 石虎需要連續的棲地，才能覓食、躲避危險、繁衍後代。可是牠們最主要的棲地已經因道路開闢、聚落擴張、農業與工程活動而破碎化。牠們經常慘遭疾駛的汽車路殺、因闖入雞舍而被捕殺、因農人毒鼠而被間接毒殺，更常被遊蕩犬追逐殺害。雖然有少數石虎在保育單位的照護下繁殖，但嘗試野放回到原棲地後，也因前述種種威脅而死亡，豆棗就是一例。
    - idx: 3
      text: 於是，一個爭議的問題浮上檯面：如果石虎在原棲息地裡越來越難存活，我們該不該「幫牠換個地方」呢？保育界對這個「物種遷移」的議題有非常不一樣的想法。
      marker_note: ☞ 圖檔（wp:anchor）錨在這一段的段首，PDF p1 上也印在「於是，一個爭議的問題」之前 —— 與念順順指示語印的「（三）」一致
    - idx: 4
      text: 反對遷移的學者認為，把野生動物「搬家」，看似積極，卻可能引發難以預料的新風險，因此主張先把原棲地變得更安全。他們的理由不只是不捨「干預自然」，也包括法規、倫理與生態後果。首先，他們相信「生命自有出口」，認為野生動物有自主生存的韌性，可能自行克服障礙，找到出路。此地不適合生存，石虎自然會尋找別處；相反地，若人為將牠們遷移到「我們覺得安全」的區域，食物可能不足、地形與植被不符合狩獵需求、新地有其他掠食者與競爭者，甚至讓牠們遭遇新的疾病及人為風險。這一派提出的解方是：與其花大錢移走石虎，不如把資源用在「讓原地變得安全」，例如把破碎棲地用動物廊道重新連接、設減速設施、犬隻管理、改良雞舍、友善農法與補償機制。因為真正要解決的，是人與自然的相處方式，而不是把動物送到看不見的地方。
      footnote_ref: 生命自有出口
      split_note: |-
        🔴 這一段在 DOCX 裡被拆成**兩個 `<w:p>`**，斷點落在句子中間
        （「…也包括法規、倫理與生態後果。首先，」＋「他們相信「生命自有出口」…」）。
        段號欄只有 6 個號碼、而文字流有 7 個 `<w:p>` —— 靠這個數字對不上才發現，
        PDF p1/p2 也顯示「五」印在「支持遷移的人則認為」那段，證實中間沒有多一個段號。
        本檔按段號欄合成 1 段。⛔ 不合的話後面每一段的段號都會少 1（#2555 那批 bug 的形狀）。
    - idx: 5
      text: 支持遷移的人則認為應該先把石虎的死亡風險降到最低，他們常用一句話形容自己的立場：「先救命，再談理想。」主要原因是，當棲地已經被切割成孤島，石虎每一次移動都像在走鋼索，單靠「生命自有出口」的信念，可能緩不濟急。再者，他們指出這些威脅多來自人類活動，因此人類就有責任先降低這些風險。他們提出的作法是：先把石虎移到較安全、人為干擾較少、管制更嚴格的區域（例如限制開發的臺北 翡翠水庫保護區），這類區域可大幅降低路殺、犬殺與雞舍衝突等風險。但他們也強調，遷移不是放棄原棲地，而是爭取時間：當原棲地修復、廊道建置、社區友善措施逐步到位，僅存的石虎才更有機會擴散、逐步建立較穩定的族群。
    - idx: 6
      text: 讀到這裡，你可能會發現：兩派其實都在乎石虎，差別在於他們對風險的排序不同——一派怕「做錯後難以收拾」，另一派怕「不做就來不及了」。原來，石虎的未來，不只是一個生物學問題，也是一個社會選擇：為了這種可愛的動物，我們願意付出怎樣的改變？你的看法是什麼？
  footnotes:
    - marker: '1'
      attached_to: 生命自有出口
      text: 「生命自有出口」（Life will find its way out）源自電影《侏羅紀公園》，意指生命具備自主生存的韌性，能在困境中克服障礙找到出路。
  running_char_counts: [27, 56, 72, 100, 129, 160, 189, 218, 248, 276, 305, 335, 365, 395, 415]
  inline_marked_terms: [坎坷, 瀕危, 絕種, 棲地, 破碎化, 疾駛, 路殺, 干預, 植被, 掠食者, 補償機制, 緩不濟急]
  inline_marked_terms_note: 課文裡加方框的 12 個語詞與「本課語詞」框完全一致；全部是 `<w:bdr w:color="auto">`，不是答案載體
  underlined_terms: [農業部, 生物多樣性研究所, 生多所, 豆棗, 臺北, 翡翠水庫保護區]

