# ── 四 文言文聚光燈 ──
spotlight:
  strategy_name: 疑問標籤：疑問助詞
  strategy_type: classical_grammar
  section_title_printed: 文言文聚光燈
  answer_carrier: 橘色代號（字元樣式 aff6）＋ 橘色字元框線（w:bdr E97132／E76D29）＋ 橘色連線（圖形）
  blocks:
    - type: concept_box
      text: 古人沒有「問號 (?)」，沒有「嗎、呢」等「句尾」疑問助詞，也沒有「如何、為什麼、哪裡、怎麼」等「非句尾」的疑問詞，但他們會利用特定的字來表達「疑問」。這就像是句子的「標籤」，看到它們，就知道這是在提問哦！

    - type: guide
      text: 一、重點攻略：問句的兩大「標籤」
    - type: guide
      text: 我們把疑問句分成兩種最常見的標籤，只要記住位置就很好認：
    - type: table
      columns: [標籤字, 意思]
      rows:
        - [誰、孰（ㄕㄨˊ）, 問「是哪個人」。]
        - [何, 問「什麼」或「為什麼」。]
        - [安、焉, 問「哪裡」或「怎麼」。]
      instruction: |-
        1. 不是放在句尾的：問題主角
        這些字通常指著某個「人」或「事情」在提問。
    - type: table
      columns: [標籤字, 意思]
      rows:
        - [乎, 相當於「嗎」。最常出現的疑問詞，可以用於真的提問，也常用於反問。]
        - [耶 / 邪（ㄧㄝˊ）, 相當於「嗎、呢」。它通常帶有說話者主觀的猜測、為難或悲傷情感。]
        - [與 / 歟（ㄩˊ）, 相當於「吧、呢」。說話者心裡大概有答案，但用一種比較委婉、推測的語氣問。]
      instruction: |-
        2. 放在句子結尾：語氣標籤(疑問助詞)
        這些字就像我們現在說「嗎」、「呢」，放在句子的最後面。
    - type: guide
      text: 你可能注意到了，「問題主角」的概念，其實就是我們在〈江乙媽媽告御狀〉裡學過的「疑問代詞」。接下來的練習，可以幫助你更熟悉文言文的疑問句，請務必練習看看。

    - type: guide
      text: 二、輕練習
    - type: guide
      text: (一)連連看：請將文言文的「標籤字」與它的白話意思連起來。
    - type: matching
      prompt: 連連看1：
      left: {1: 孰, 2: 何, 3: 乎}
      right: {A: 嗎, B: 誰 / 哪一個, C: 什麼 / 為什麼}
      answer: {1: B, 2: C, 3: A}
      answer_carrier: 橘色手繪連線（圖形，佈景色 accent2），文字流無此資訊
    - type: matching
      prompt: 連連看2：
      left: {1: 與、歟, 2: 安, 3: 耶、邪}
      right: {A: 哪裡 / 怎麼, B: 嗎 / 呢, C: 吧 / 呢}
      answer: {1: C, 2: A, 3: B}
      answer_carrier: 橘色手繪連線（圖形，佈景色 accent2），文字流無此資訊
    - type: guide
      text: (二)標籤圈圈看：圈出句子中的「疑問標籤」，並選出正確的白話意思。
    - type: exercise
      instruction: (二)標籤圈圈看
      items:
        - {type: single, index: 例題, stem: '解狐非子之仇邪？ 標籤的意思是：A什麼 B嗎', answer: B, is_printed_example: true, boxed_term: 邪}
        - {type: single, index: 1, stem: '不亦樂乎？  A嗎 / B誰', answer: A, boxed_term: 乎}
        - {type: single, index: 2, stem: '人非聖賢，孰能無過？ A什麼 / B誰', answer: B, boxed_term: 孰}
        - {type: single, index: 3, stem: '何不各言爾志？  A為什麼 / B哪裡', answer: A, boxed_term: 何}
        - {type: single, index: 4, stem: '安能辨我是雄雌？  A嗎 / B怎麼', answer: B, boxed_term: 安}
        - {type: single, index: 5, stem: '兵法寧可以小試耶?  A嗎 / B怎麼', answer: A, boxed_term: 耶}
      boxed_terms_note: |-
        `boxed_term` 是原稿用**橘色字元框線**圈起來的那個疑問標籤字（也就是題目要學生「圈出來」的答案）。
        例題的「邪」是黑框（color=auto，示範用）；1~5 題是橘框：
        「乎」用 E76D29，「孰／何／安／耶」用 E97132 —— **同一課兩種橘色碼**，只認一種會漏掉「乎」。
    - type: guide
      text: (三)讀讀看：閱讀下列句子，再根據提示填入正確的代號：
    - type: exercise
      instruction: 讀讀看1
      prompt: 讀讀看1：提示 (A)呢　(B)誰　(C)嗎
      option_bank: {A: 呢, B: 誰, C: 嗎}
      items:
        - {type: single, index: 1, stem: '「汝亦知射乎」 — 你也懂射箭（   ）？', answer: C}
        - {type: single, index: 2, stem: '「我與徐公孰美」 — 我跟徐公（   ）美？', answer: B}
        - {type: single, index: 3, stem: '「是何言歟」—這是什麼話(   )？', answer: A}
    - type: exercise
      instruction: 讀讀看2
      prompt: 讀讀看2：提示 (A)哪裡、怎麼　(B)吧　(C)嗎  (D)呢
      option_bank: {A: 哪裡、怎麼, B: 吧, C: 嗎, D: 呢}
      items:
        - {type: single, index: 1, stem: '敗義以求生，豈荀巨伯所行邪——敗壞道義來求生存，哪裡是我荀巨伯會做的事（   ）？', answer: D}
        - {type: single, index: 2, stem: '覆巢之下，安有完卵——傾覆的鳥巢下，（   ）會有完好的鳥蛋？', answer: A}
        - {type: single, index: 3, stem: '一室之不治，何以天下國家邪——一個房間都管理不好，如何(談)治理國家(    )?', answer: D}
        - {type: single, index: 4, stem: '若棄城而走，必不能遠遁，得不為司馬懿所擒乎——如果棄城跑了，必不能跑遠，能不被司馬懿抓住(    )?', answer: C}
        - {type: single, index: 5, stem: '天下事有難易乎——天下的事有困難或容易的區別（   ）?', answer: C}
        - {type: single, index: 6, stem: '何必名山吾廬邪——我家何必一定要在有名的山中（   ）?', answer: D}
        - {type: single, index: 7, stem: '愛國治民，能無知乎——愛國而治理人民，能無知（   ）?', answer: C}
        - {type: single, index: 8, stem: '既已納其自託，寧可以急相棄邪——既然已經接受他的請託，怎麼可以因為事情緊急了就丟棄他(    )?', answer: D}
        - {type: single, index: 9, stem: '孝悌也者，其為仁之本與——孝順父母，友愛兄弟，這就是實踐仁愛的根本（   ）？', answer: B}
        - {type: single, index: 10, stem: '燕雀安知鴻鵠之志——燕子麻雀（  ）知道大鳥的志向?', answer: A}
  connect_the_dots_geometry_note: |-
    兩組連連看的答案是 6 條橘線（佈景色 accent2 的 `prstGeom prst="line"`），
    PDF 上畫得出來，但為了不靠肉眼，另外用幾何解過一次，兩邊結論一致：
      每條線的 `<wp:anchor>` 掛在**左欄該列的段落**上，`wp:extent` 的高度 ≈ 跨幾列
      （一列約 0.34in），`<a:xfrm flipV="1">` 代表由左下往右上（往上連），無 flipV 代表往下連。
    連連看1：孰(列1)↓1列→B ／ 掛列1、h=0.69↑2列 ⇒ 左端在列3(乎)、右端在列1 ⇒ 乎→A ／ 何(列2)↓1列→C
    連連看2：掛列1、h=0.38↑1列 ⇒ 安(列2)→A ／ 與、歟(列1)↓2列→C ／ 掛列2、h=0.30↑1列 ⇒ 耶、邪(列3)→B
    結果與「重點攻略」給的定義完全吻合（孰=誰/哪一個、何=什麼/為什麼、乎=嗎；
    與/歟=吧/呢、安=哪裡/怎麼、耶/邪=嗎/呢），三方互相印證。

# ── 五 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（字元樣式 aff6，色 E97132），文字流有此資訊
  stray_marks_note: |-
    標題附近有兩個橘色「✓」字元（字元樣式 af），不在任何題號上、也不對應任何一題，
    照原稿記錄，不當成答案。
  questions:
    - index: 1
      answer: C
      stem: 根據文章，晉平公兩次詢問祁黃羊的目的是什麼？
      options:
        A: 想要測試祁黃羊對國家是否忠誠
        B: 想要化解祁黃羊與解狐之間的恩怨
        C: 尋求合適的人選來填補官職的空缺
        D: 考驗祁黃羊是否會提拔自己的親信
    - index: 2
      answer: B
      stem: 當晉平公問解狐不是他的仇人嗎，祁黃羊的回答展現了什麼樣的態度？
      options:
        A: 放下恩怨，與仇人和解
        B: 對事不對人，只看才幹
        C: 迫於君威，不敢說真話
        D: 展現自己的寬宏大量
    - index: 3
      answer: B
      stem: 孔子對祁黃羊的評價「外舉不避仇，內舉不避子」的核心意義為何？
      options:
        A: 選拔人才應先考慮親近的人，再考慮仇人
        B: 選拔人才應以國家的利益與能力為唯一準則
        C: 選用人才時必須同時包含仇人和親人，才算公正
        D: 為了表現公正，即使是仇人也要故意提拔
    - index: 4
      answer: A
      stem: 有個養猴子的老人，每天餵猴子橡木果實。一天，他跟猴子們說：「朝三而暮四，足乎？」猴子們聽完都「起而怒」。老人又說：「朝四而暮三，足乎？」猴子們聽完都「伏而喜」。請問：老人這兩種分配果實的說法，有什麼共同點？
      options:
        A: 提供的果實總數都一樣
        B: 都成功讓猴子們接受
        C: 都讓猴子們又愛又怒
        D: 讓猴子晚上吃得比較飽
    - index: 5
      answer: B
      stem: 「阮宣子論鬼神有無者，或以人死有鬼，宣子獨以為無，曰：『今見鬼者，云著生時衣服，若人死有鬼，衣服復有鬼邪？』」關於上文的理解，下列何者正確？
      options:
        A: 阮宣子堅信世界上一定有鬼神的存在
        B: 阮宣子用「衣服也有鬼嗎」的疑問，來反駁有鬼的說法
        C: 阮宣子認為鬼喜歡穿著生前最喜歡、最漂亮的衣服出現
        D: 阮宣子和大家一樣，都親眼看過鬼穿著衣服的樣子
      teacher_note: 第5題翻譯：阮宣子和別人討論世上有沒有鬼神，有人以為人死後會變成鬼，唯獨阮宣子認為沒有，他說：「現在那些說自己見過鬼的人，都說見到鬼穿著活著時候的衣服。如果人死後會變成鬼，難道衣服死後也會變成衣服鬼嗎？」
      teacher_note_carrier: 深藍色（C:156082）文字方塊，印在題目右側

# ── 六 自我挑戰 ──
self_challenge:
  optional_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_banner: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  strategy_banner_note: |-
    四個步驟各裝在一個帶框的字元樣式（afff6）裡，中間的箭號是**字面字元「⭢」（U+2B62）**，
    不是 `→`（U+2192）也不是 `w:sym` —— 依規則字面箭號保留原樣、不斷行。
  passage: 安邑里巷口有賣餅者，吾每早過戶，未嘗不聞其歌。一日，召之與語，貧窘可憐。因與萬錢，令多其本1，日取餅以償之。欣然持錢而去。後過其戶，則寂然不聞謳歌之聲。及呼乃至，謂曰：「爾何輟2歌之遽3乎？」曰：「本流既大，所謀益增，不暇唱曲矣。」(114會)
  # ⚠️ 同上，不是勘誤：「六 自我挑戰」的標題文字方塊被插在「安邑里」與「巷口」之間。
  passage_source_text: 安邑里六自我挑戰六自我挑戰巷口有賣餅者，吾每早過戶，未嘗不聞其歌。一日，召之與語，貧窘可憐。因與萬錢，令多其本1，日取餅以償之。欣然持錢而去。後過其戶，則寂然不聞謳歌之聲。及呼乃至，謂曰：「爾何輟2歌之遽3乎？」曰：「本流既大，所謀益增，不暇唱曲矣。」(114會)
  annotations:
    - {index: 1, term: 本, text: 本錢，做生意的資金。}
    - {index: 2, term: 輟, text: ㄔㄨㄛˋ，停止。}
    - {index: 3, term: 遽, text: ㄐㄩˋ，突然。}
  annotations_marker_note: 注釋清單前印一個 `w:sym Wingdings F026` 的書本圖示，不是文字
  translation: 安邑里巷口有一個賣餅的人。我每天早上經過他家，都能聽到他唱歌。有一天，我叫他來說話，發現他的生活很是貧窮可憐。就給他一萬錢，讓他增加本錢做生意，我再每天跟他拿餅，把餅作為抵債品。他很高興地拿錢走了。後來我經過他家，卻一片安靜，聽不到他唱歌的聲音。就喊他，他才出來，我問他：「你為何突然不唱歌了呢?」他說：「因為做生意的資本變大了，要考慮的事情增加了，沒時間唱歌啊。」
  translation_carrier: 深藍色（C:156082）文字方塊，印在文章右側
  part_one:
    label: （一）請依照故事脈絡，回答下列問題。
    answer_carrier: 橘色手寫（字元樣式 af）；第 3、4 題另有橘色字元框線標出被圈選的答案
    items:
      - {index: 1, stem: '斷句後的第一個分句，主語是誰？', answer: 賣餅者/賣餅的人}
      - {index: 2, stem: '承上題，這個主語怎麼樣或做什麼？', answer: (早上都在)唱歌}
      - index: 3
        stem: 「一日，召之與語，貧窘可憐」一句，誰「貧窘可憐」？
        options: {1: 吾(作者), 2: 賣餅人}
        answer: 2
        instruction: (圈出適當答案)
        answer_carrier: 橘色字元框線（w:bdr E97132）圈住「賣餅人」
      - index: 4
        stem: 「因與萬錢，令多其本，日取餅以償之」，誰「給萬錢」？
        options: {1: 吾(作者), 2: 賣餅人}
        answer: 1
        instruction: (圈出適當答案)
        answer_carrier: 橘色字元框線（w:bdr E97132）圈住「(作者)」
  part_two:
    label: （二）閱讀理解測驗
    answer_carrier: 橘色手寫代號（字元樣式 aff6）
    items:
      - index: 1
        answer: B
        stem: 關於文中的「吾」與賣餅者，下列敘述何者最恰當?
