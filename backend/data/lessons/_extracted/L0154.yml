keypoints:
  title: 祁黃羊的思路解密
  layout: matrix
  columns: [結構, 內容摘要]
  intro: 之前的文章整理重點，大多是依照文章的順序設計的，但這次的任務多了一點點難度喔！有幾題「勾選題」沒有依照文章順序提問；而且還要請你想一想：「祁黃羊為什麼會這樣推薦？」準備好了嗎？讓我們開始吧！
