# ── 古文今譯（無大題編號）──
modern_translation:
  section_name: 古文今譯
  paragraphs:
    - 晉平公問祁黃羊說：「南陽出缺縣令，誰可以擔任這個職位？」祁黃羊答道：「解狐可以。」平公說：「解狐不是你的仇人嗎？」(祁黃羊)回答說：「您問的是(誰)可以，又不是問我的仇人是(誰)。」平公說：「很好！」就任用了解狐。國人都稱讚(任命解狐)好。
    - 過了一段時間，平公又問祁黃羊說：「國家少一名軍官，誰可以擔任這個職位？」 (祁黃羊)回答說：「祁午可以。」平公說：「祁午不是你的兒子嗎？」 (祁黃羊)回答說：「您問的是(誰)可以，又不是問我的兒子是(誰)。」平公說：「很好！」就又任用了祁午。國人都稱讚(任命祁午)好。
    - 孔子聽說這件事就說：「祁黃羊的話，說得好啊！推舉外人，不避開仇人；推舉自己人，不避開自己的兒子，祁黃羊可以稱得上是大公無私了。」

# ── 原文（無大題編號）──
classical_text:
  source_label: 戰國・《呂氏春秋》
  has_qr: true
  punctuation_note: |-
    原文裡的「.」是學習單印的**斷詞記號**（p2 明寫「文章中的「.」是表示斷詞的地方，
    朗讀時，不要把「同組的詞」分開」），不是句號，照原樣保留。
    段落中的上標 1~4 是注釋編號，也照原樣保留。
    「解狐」的「解」與「居有間」的「間」在文字層各夾一個隱藏 variation selector（U+E01Ex），
    比對前要濾掉 Unicode 類別 Cf/Mn。
  paragraphs:
    - 晉平公.問於祁黃羊曰.：「南陽.無令1，其誰可.而為之？」祁黃羊對曰.：「解狐.可。」平公曰.：「解狐.非子之仇邪.？」對曰.：「君.問可，非問.臣之仇也.。」平公曰.：「善.。」遂用之.。國人.稱善焉.。
    - 居有間.2，平公又問祁黃羊曰.：「國.無尉3.，其誰可.而為之.？」對曰.：「午.可.。」平公曰.：「午.非子之子邪.？」對曰.：「君.問可.，非問.臣之子也.。」平公曰.：「善.。」又遂用之.。國人.稱善焉.。
    - 孔子.聞之曰.：「善哉.，祁黃羊之論也.！外舉.4不避仇，內舉.不避子。祁黃羊可謂.公矣.。」
  annotations_label: 注釋
  annotations:
    - {index: 1, term: 令, text: 縣令。古代負責管理一縣的長官。}
    - {index: 2, term: 居有間, text: 過了不久、隔一段時間。居，停留、過了，指時間的推移。有間，有一段間隙。}
    - {index: 3, term: 尉, text: 軍官。}
