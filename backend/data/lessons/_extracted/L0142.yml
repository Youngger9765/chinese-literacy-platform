# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 正向思考──用三種方法培養心理韌性
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）共 8 個 + 一題橘色手寫參考答案，PDF p9~p10 可見
  blocks:
    - type: concept_box
      text: |-
        生活有時候會讓人喘不過氣：壞事突然發生、努力了卻沒結果……但課文中的倫敦人告訴我們一件事：心理韌性不是不會害怕，而是雖然害怕，也能不被打敗，積極面對。
        在課文中，倫敦的人民遇到了大轟炸這麼恐怖的事情，但仍然能夠挺過這場風暴，故事裡有三個值得學習之處：
        一、適應：面對變故有彈性→「我現在能調整什麼？」
        二、支持：社會支持帶來心理力量→「我可以求助，也可以助人。」
        三、樂觀：遇到挫折保持樂觀的詮釋→「我能不能換個角度想？」
        強大的心理韌性並非與生俱來，而是可以學習的，現在我們就來練習看看吧！
      note: 這三條裡的 → 是**文字層真的有的字元**（w:t），與下方兩個 w:sym F0E0 的箭號不同

    # ── 一、適應 ──
    - type: guide
      text: |-
        一、適應：面對變故保持彈性（適應力）：
        遇到變故，可能會焦慮恐懼，哪一個想法最符合『面對變動時保持彈性』的能力？

    - type: exercise
      label: 一、適應
      note: 表格三欄（欄名照原稿）：（無標題）／情境／『面對變動時保持彈性』的想法（單選）
      items:
        - type: single
          label: '1.'
          prompt: 開學時，老師公布座位表，鄰座是不熟悉的同學。
          options:
            1: 覺得很煩躁，整天不想說話
            2: 看看能不能和鄰座同學有合作機會
            3: 開始抱怨老師不尊重學生
          answer: 2
        - type: single
          label: '2.'
          prompt: 小組報告時，負責簡報的人突然生病，臨時要換人上台報告。
          options:
            1: 怪她害到我們全組，心裡超不爽
            2: 不關我的事，直接把責任撇掉
            3: 先討論自己能做的，再想怎麼分工
          answer: 3
        - type: single
          label: '3.'
          prompt: 最喜歡的老師下學期不再教我們班。
          options:
            1: 雖然失望，但願意試試新老師
            2: 覺得我們班沒救了，下學期完蛋了
            3: 決定放棄這科，隨便學就好
          answer: 1

    - type: guide
      text: 當事情突然改變時，願意換個想法，就是在練習讓自己更能適應生活中的意外。
      leading_marker_note: 這一行開頭有一個箭號，載體是 w:sym Wingdings F0E0（圖形符號，不在文字層），故不寫入字面

    # ── 二、支持 ──
    - type: guide
      text: |-
        二、支持：社會支持帶來的心理力量：
        「社會支持」很重要，當你知道「我不孤單」、「大家可以一起努力」時，就比較不容易被打敗。遇到困難時，向別人求助不是一件壞事，更棒的是能主動去幫助別人，反而會讓你更有力量向前邁進。
        遇到困難時，哪個做法最符合「尋求或提供社會支持」？

    - type: exercise
      label: 二、支持
      note: 表格四欄（欄名照原稿）：（無標題）／（分類：尋求協助／主動助人，跨列合併）／情境／可行的做法
      items:
        - type: single
          label: '1.'
          category: 尋求協助
          prompt: 小組報告快截止，但我卡在資料整理。
          options:
            1: 跟朋友請教方法，或請他教我
            2: 不讓任何人知道自己的壞情緒
            3: 悶著頭硬做，之後再看哪裡錯
          answer: 1
        - type: single
          label: '2.'
          category: 尋求協助
          prompt: 比賽前我很緊張，怕上場會失誤。
          options:
            1: 船到橋頭自然直，先上場再說
            2: 提醒自己可以勇敢克服心魔
            3: 我會問教練，請他給我建議
          answer: 3
        - type: single
          label: '3.'
          category: 主動助人
          prompt: 地震停電時，天色很暗，有人找不到路。
          options:
            1: 開玩笑地說他們膽小，緩解氣氛
            2: 開手機手電筒，再帶他們一起走
            3: 我會先顧好自己，等天亮了再說
          answer: 2
        - type: single
          label: '4.'
          category: 主動助人
          prompt: 社團排練時，有人一直跟不上動作。
          options:
            1: 叫他先看影片，回家自己補練
            2: 那是他的問題，他自己要克服
            3: 我會放慢示範一次，陪他練習
          answer: 3

    # ── 三、樂觀 ──
    - type: guide
      text: |-
        三、樂觀：遇到壞事能保持樂觀的詮釋（復原力）：
        樂觀詮釋不是否認事情很糟，而是在承認困難之後，找到一個讓自己能繼續前進的說法。下面的情境，都和課文中「沒打破我的茶壺」一樣，事情真的很糟，但有人選擇用一句話，讓自己不被擊倒。請選出最像課文中那種幽默詮釋的一句話。

    - type: single
      prompt: ❶颱風後，一戶人家的屋頂被掀開一個洞。鄰居關心的問：「你還好嗎？」
      options:
        1: 我真的很慘，家全被毀了。
        2: 至少家裡採光變好了。
        3: 都是颱風害的，氣死人了。
      answer: 2

    - type: single
      prompt: |-
        ❷林肯當總統時，有人當眾嘲笑他長得很醜。
        如果你是他，哪一句回應最像用幽默化解困境？
      options:
        1: 我今天真倒楣，看什麼都壞掉了。
        2: 如果你一直笑我，你覺得我會開心嗎？
        3: 如果我有另一張臉，你覺得我會戴這張嗎？
      answer: 3

    - type: free_text
      prompt: |-
        ❸你的手機掉進馬桶。撈起來時，螢幕一黑，完全沒反應，又沒錢換。
        （請寫句子作答）
      answer: 我的手機去泡湯了，一泡就睡著了/這次要戒手機，一定會成功了。
      answer_carrier: 橘色手寫參考答案（在文字層）；該行開頭另有一個 w:sym Wingdings F0E0 箭號（圖形，不寫入字面）

    - type: self_check
      prompt: ◎自我檢核
      items:
        - 1.面對變故時，我能彈性思考，適應不熟悉的狀況。
        - 2.我知道自己不是一個人，可以適時尋求支持。
        - 3.我能把悲觀的想法，改成樂觀的詮釋，讓自己能重新站起來。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

    - type: guide
      text: ※如果你三項都打勾，恭喜你！你已經學會用這些方法培養自己的心理韌性，你的心將會像倫敦人一樣：焚而不毀、越挫越強。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（在文字層），PDF p12 可見
  items:
    - index: 1
      stem: 下列語詞何者使用錯誤？
      options:
        A: 失去兒子的婦人跪在地上「呼天搶地」，令人心酸不已
        B: 在疫情期間，醫護人員與民眾「同舟共濟」，齊心對抗病毒
        C: 段考過後，同學都無心上課，一片寂靜，真是「百廢待舉」
        D: 火警發生時，班長「處變不驚」，冷靜指揮同學依序疏散
      answer: C
      explanation: 第1題解析：選項C「百廢待舉」用來形容「國家或社會經歷戰亂、動盪後重建」的情況，不適合用在「課堂氣氛冷清」這種小範圍情境。
    - index: 2
      stem: 文中提到：「轟炸點燃了英國人心中的火焰。」這句話的「火焰」指的是什麼？
      options:
        A: 人心被點燃的勇氣與決心
        B: 建築燃起的真實大火
        C: 對敵產生的仇恨衝動
        D: 面對戰爭的興奮期待
      answer: A
      explanation: 第2題解析：這是比喻，重點在精神狀態：勇氣、堅韌、團結被激發，而非字面火焰。
    - index: 3
      stem: 那位婦人說：「炸得還可以，沒打破我的茶壺。」從這句話中，可以推論出這位婦人當時的心情或態度是什麼？
      options:
        A: 她對轟炸非常憤怒，想諷刺德國，表達不滿
        B: 她有心理韌性，用幽默的口吻面對災難的發生
        C: 她比較不在乎房子被炸，只在意茶壺是否完好
        D: 她想要安慰別人，假裝沒事，但其實很害怕
      answer: B
      explanation: 第3題解析：婦人面對街道成為廢墟，卻用幽默的口氣說「沒打破我的茶壺」，表現出面對災難仍保持鎮定與樂觀的心理韌性。
    - index: 4
      stem: 本文的主旨是什麼？
      options:
        A: 災難讓人類看見戰爭的殘酷與敵國的無情
        B: 恐懼是一種人性本能，並不是人所能控制的
        C: 心理韌性、勇氣與團結讓人們在危難中浴火重生
        D: 因政府有萬全準備，英國人挺過了倫敦大轟炸
      answer: C
      explanation: 第4題解析：全文由恐懼轉為勇氣、由毀滅轉為重生，核心在於人類的心理靭性。
      explanation_note: 解析用的是「心理靭性」（靭），課文與其他各處都寫「心理韌性」（韌）；原稿如此，不擅自統一
    - index: 5
      stem: 作者在文中引用「死亡與傷殘人數」以及「心理學家的調查結果」，這樣的寫法主要有什麼作用？
      options:
        A: 讓讀者更有現場感，感受當時倫敦的慘況
        B: 用來增加文章的情緒張力，讓內容更戲劇化
        C: 透過數據製造震撼效果，吸引讀者注意力
        D: 結合事證與研究，強化文章的可信度與說服力
      answer: D
      explanation: 第5題解析：作者在描寫戰爭慘況後引用具體數據與心理學研究，屬於「以事證支撐觀點」的寫作策略。

