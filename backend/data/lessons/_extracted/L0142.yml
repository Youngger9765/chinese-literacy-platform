# ── 三 語詞我最棒 ──
vocab_definitions:
  vocabulary_bank: [心神不寧, 餘燼, 滿目瘡痍, 殘垣敗瓦, 瓦礫, 呼天搶地, 面不改色, 百廢待舉, 同舟共濟, 生死與共, 處變不驚, 心理韌性]
  vocabulary_bank_label: 本課語詞
  instruction: |-
    請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
    🅐 從本課語詞框框，找語詞。
