      text: |-
        我們先複習長條圖、圓形圖，再把重點放在折線圖，學會判讀數據隨時間變化的趨勢。
        1.常見的統計圖：
        2.怎麼閱讀統計圖：
        (1)先觀察圖表類型：首先確定圖表的類型，如長條圖、折線圖、圓形圖等。
        (2)閱讀標題：標題通常告訴我們圖表的主題。
