body:
  lesson_heading: 第15課  未來的農夫
  課文作者: 曾世杰
  學習單: 陳淑麗
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: 「你畢業後要做什麼？」上了高職二年級以後，同學們常互相追問這個問題。宇晴的答案始終如一：「我要當農夫。」
    - idx: 2
      text: 高三上學期，宇晴被安排到桃園一座垂直農場實習，這座農場種植總面積達12,000平方公尺，相當於28.6個籃球場。領了識別證，推開門，廠房沒有泥土味，宇晴聞到的是淡淡的消毒酒精味。她換上髮網、口罩、鞋套，外加一件防塵外套；走進廠區前，還得穿過一段用強風吹除外套灰塵的廊道，強風把衣角吹得啪啪作響，像在提醒：這裡不是觀光溫室，這裡是「高科技無塵室」。
    - idx: 3
      text: 門一推開，宇晴愣住了：「這是農場嗎？」長長的走道兩側，一層又一層的栽培架往上堆疊；LED燈板在頭頂亮成一片，帶著紫粉色的冷冽感，讓整個空間像科幻片的太空站。每一層水耕槽裡，舒展著鬱鬱蔥蔥的嫩綠葉片，看起來生機勃勃，而且整齊得彷彿用尺量過一樣。
    - idx: 4
      text: 帶她的大仁哥，是工程師兼「科技農夫」，一邊走，一邊指著牆邊的控制箱與感測器解說：「這裡的水耕蔬菜不是用土種出來的，而是用營養液。輸送營養液的管路都有流量、溫度、酸鹼值、肥料濃度跟電導度的監測；溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。」他說：「這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。」以萵苣類作物為例，溫度常被控制在約18～25°C、濕度65～75%；營養液的酸鹼值大約維持在5.5～6.5；為了加速光合作用，室內二氧化碳濃度也控制在1000～1500ppm之間。
    - idx: 5
      text: 「你的任務之一，」他把平板遞給她，「就是每天巡檢數據：看哪一區的酸鹼值或肥料配方有偏差、哪一層的溫濕度曲線不正常。能自己處理的問題就儘快處理，必要時回報，讓值班同事去校正或調整配方。」宇晴盯著平板看，螢幕上跳動的數字像心電圖，她緊張的心情，忽然踏實了幾分：原來讀圖表、看趨勢、抓異常也是在種菜。
    - idx: 6
      text: 「可是這樣的垂直農場所費不貲，公司會賺錢嗎？」宇晴皺起眉頭，一臉狐疑。大仁哥笑著說：「好問題。一開始的投資真的很大，但我們不用煩惱雜草、蟲害、土壤病菌、雨災、日照不足、溫度變化這些問題。而且，蔬菜比在田園裡種植時長得快，例如，小白菜30到35天就可以收成，在菜園種的至少要45到50天。」他繼續說：「此外，我們的菜不但沒有農藥，而且特別乾淨漂亮，你不會在晚餐的炒青菜裡看到令人作嘔的『加菜』。」他做著鬼臉，一邊橫著食指，做出一伸一縮的動作，模擬那個「加菜」。他最後下結論：「同樣是剪髮，家庭理髮和髮廊設計師的價錢當然會有天壤之別囉。」
      marker_note: ☞ 圖檔（wp:anchor「圖片 127」）就錨在這一段的段首，PDF p2 上也印在「可是這樣的垂直農場」之前
    - idx: 7
      text: 在回家的公車上，宇晴突然想起，媽媽小時候要幫祖母在菜園裡種菜，用鋤頭、鐮刀、畚箕等農具施作，有些工作要徒手完成，甚至還要收集大小便，當作肥料……。宇晴想著想著，鼻子皺了起來，雞皮疙瘩掉了一地。
    - idx: 8
      text: 但那是以前的生活。宇晴今天最大的學習是——未來的農夫，不再只是戴斗笠拿鋤頭，工作更像是工程師呢！
  running_char_counts: [27, 58, 88, 117, 145, 174, 204, 234, 263, 290, 319, 347, 358]
  inline_marked_terms: [始終如一, 冷冽, 鬱鬱蔥蔥, 生機勃勃, 校正, 所費不貲, 狐疑, 令人作嘔, 模擬, 天壤之別, 徒手, 雞皮疙瘩]
  inline_marked_terms_note: |-
    課文裡加方框的語詞有 12 個，但「本課語詞」只有 10 個 ——
    **令人作嘔**與**天壤之別**在課文裡有框，卻不在語詞框、代號表與找字格子裡。原稿如此。
    這 12 個框全是 `<w:bdr w:color="auto">`（一般語詞框），不是答案載體。
  underlined_terms: [宇晴, 桃園, 大仁]
  hidden_char_note: |-
    「校正」在課文與「本課語詞」框裡都寫成 `校` + `U+E01E1`（變體選擇符）+ `正`，
    在第五大題代號表與第四大題定義列則是乾淨的「校正」。
    本檔一律寫乾淨的「校正」；記在這裡是因為 naive `len()` 會多算 1 個字，
    算念順順字數時要先濾掉 Unicode 類別 Cf/Mn。

