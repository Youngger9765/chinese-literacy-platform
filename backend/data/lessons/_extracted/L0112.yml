        〈未來的農夫〉也有不少專有名詞。這一課，我們用第4、5段練習分辨：哪些細節可以先略過，哪些重點不能漏掉。
    - type: passage
      label: 〈未來的農夫〉
      paragraphs:
        - （段4）帶她的大仁哥，是工程師兼「科技農夫」，一邊走，一邊指著牆邊的控制箱與感測器解說：「這裡的水耕蔬菜不是用土種出來的，而是用營養液。輸送營養液的管路都有流量、溫度、酸鹼值、肥料濃度跟電導度的監測；溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。」他說：「這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。」以萵苣類作物為例，溫度常被控制在約18～25°C、濕度65～75%；營養液的酸鹼值大約維持在5.5～6.5；為了加速光合作用，室內二氧化碳濃度也控制在1000～1500ppm之間。
        - （段5）「你的任務之一，」他把平板遞給她，「就是每天巡檢數據：看哪一區的酸鹼值或肥料配方有偏差、哪一層的溫濕度曲線不正常。問題能自己排除就儘快排除，必要時回報，讓值班同事去校正或調整配方。」宇晴盯著平板看，螢幕上跳動的數字像心電圖，她緊張的心情，忽然踏實了幾分：原來讀圖表、看趨勢、抓異常也是在種菜。
      note: 圓角外框內的引文
      duplicate_copy_note: |-
        🔴 段4、段5 在檔內各出現兩次（一 讀全文的表格版、二 聚光燈的引文版）：
          ・段4 兩份**逐字相同**（各 256 字）。
          ・段5 **不同**：讀全文版「能自己**處理的問題**就儘快**處理**」，
            聚光燈版「**問題**能自己**排除**就儘快**排除**」。
        兩種寫法都通順、都不是錯字（L0087 同型）→ 不列勘誤、不挑一份當 corrected，
        `body` 取讀全文版，這裡原樣保留聚光燈版，差異交給人判斷。

    - type: guide
      text: 步驟0：30秒快速瀏覽（先抓方向）
    - type: free_text
      prompt: 1.任務：只抓「第4～5段大概在講什麼？」（約10–15字）　→我猜第4～5段在講：【　】
      blanks: [{answer: 垂直農場用科技方法種菜}]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    - type: guide
      text: 步驟1：標示卡關點＋先往下讀
    - type: free_text
      prompt: 1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。
      no_correct_answer: true
      answer_carrier: 學生在上面的引文框內自己圈／畫線，原稿沒有畫任何線
    - type: guide
      text: 2.再讀一次第4～5段：圈起的地方暫時略過，繼續往下讀，不要停太久。
    - type: single
      prompt: 3.自我檢核：跳過卡關處後，是否能讀完第4、5段並說出大意？（單選）
      options:
        1: 能，我可以繼續往下讀
        2: 不能，我需要回頭讀剛才標記的地方
      no_correct_answer: true
      answer_carrier: 學生自填，原稿兩個 □ 都沒有勾

    - type: guide
      text: 步驟2：抓第4段重點
    - type: single
      prompt: 1.下列哪一句最能概括第4段重點？（單選）
      options:
        1: 水耕蔬菜不用泥土，而是用營養液栽種
        2: 全環境控制能維持適合蔬菜生長的條件
        3: 農場會監測溫度、濕度與二氧化碳濃度
      answer: 2
    - type: single
      prompt: 2.第4段中，哪一類內容較適合先暫時略過？（單選）
      options:
        1: 一長串監測項目、數值與舉例；先略過仍能理解段落重點
        2: 「全環境控制系統」這個反覆出現、連結全段的核心概念
      answer: 1

    - type: guide
      text: 步驟3：抓第5段重點
    - type: guide
      text: 小提示：第5段雖然也有數據與工作細節，但重點是宇晴主要做什麼，以及她有了什麼新理解。先抓主要工作，細節暫時放過。
    - type: guide
      text: 1.第5段：先抓「宇晴在做什麼」，再抓「作者想告訴你什麼」。
    - type: single
      prompt: （1）宇晴主要在做什麼工作？（單選）
      options:
        1: 巡檢數據，找出異常並處理或回報
        2: 校正所有儀器，直接調整各區配方
      answer: 1
    - type: single
      prompt: （2）下列哪一句最能表達第5段的重點？（單選）
      options:
        1: 必要時回報，讓值班同事校正或調整配方
        2: 原來讀圖表、看趨勢、抓異常也是在種菜
      answer: 2
    - type: single
      prompt: 2.第5段你跳過的地方，是哪一類訊息？為什麼可以跳過？（單選）
      options:
        1: 是補充細節；先跳過也不影響理解工作內容
        2: 是主要流程；先跳過就會看不懂她在做什麼
      answer: 1

    - type: guide
      text: 步驟4：合併兩段：抓段意
    - type: single
      prompt: 第4、5段想要表達什麼？請選出意思最接近的選項？（單選）
      options:
        1: 用很多數字與專有名詞，要讀者學會現代種菜的技術
        2: 垂直農場用環境控制與數據巡檢的方式種菜
        3: 這家垂直農場設備昂貴，所以種菜的成本非常高
      answer: 2

    - type: guide
      text: 步驟5：覺察與回顧──讀完後，要不要回頭？（複選）
    - type: multi
      prompt: 讀完整段後，什麼情況需要回讀？
      options:
        1: 略過後，我仍說不出段落大意
        2: 題目正好問到那個數字或專有名詞
        3: 只要是專有名詞或數字，都永遠不用再看
      answers: [1, 2]

# ── 三 念順順 ──────────────────────────────────────────────────
key_reading:
  instruction: 請用計時器，從指定段落（五     ）開始朗讀，在表格記錄計時1分鐘的朗讀字數。如果計時3次後，對自己還不滿意，可以多練幾次。最後一次，找一位同學，請他計時、記錄並簽名！
  start_paragraph: 6
  end: 課文結束
  spans_paragraphs: [6, 7, 8]
  approx_chars_from_start: 358
  start_paragraph_conflict_note: |-
    🔴 **指示語印的段號（五）與 ☞ 標記的位置（第 6 段）不一致，這一條要人來裁決。**
    我採 6，因為指向第 6 段的證據有三條、彼此獨立：
      ① ☞ 圖檔（wp:anchor「圖片 127」）錨在第 6 段的段首，PDF p2 上也印在「可是這樣的垂直農場」之前。
      ② 右緣字數欄的第一個數字 27 == 第 6 段第一行的字數；第 9 個數字 **263 == 第 6 段的完整字數**
         （267 字扣掉 4 串阿拉伯數字，套 Word 口徑第 1 條）。若改從第 5 段起算，
         第 5 段結束的累計是 147，**不在印出來的數列裡**，而第 6 段結束會變成 410、超出末筆 358。
      ③ 字數欄那一格在數字之前有 **28 個空段落**，正好等於第 1~5 段在 Word 裡佔的行數
         （每行約 29 字：2+6+5+9+6=28）。從第 5 段起算的話應該只墊 22 行。
    ⛔ 我**沒有**去改指示語裡的「五」——無法判斷是「五」寫錯還是 ☞ 放錯，
    替教材決定哪一邊是錯的不是抽取者該做的事（同 L0087 兩份課文不一致的處置）。
    這一條的形狀正是 #2555 那批 bug（☞ 指到錯段落），請人回頭跟出版方確認。
  char_count_note: |-
    末筆 358 不是全文長度：字數欄只標到第 7 段結束，第 8 段沒有標（「字數欄提早停」的形狀，已見 5 課）。
    兩個段界檢查點**都精準吻合**，用的是 Word「字數＝中日韓字元＋非中日韓單字」這個算法：
      ・第 6 段 267 個字元，其中 8 個是阿拉伯數字、分成 4 串（30／35／45／50）
        → 259 個中文字元 ＋ 4 個「單字」＝ 263 == 印出來的第 9 個數字。
        （這就是 skill 第 1 條「一串數字算 1 個字」的來源。）
      ・第 7 段 96 個字元，其中 2 個是刪節號 U+2026、算一串
        → 94 個中文字元 ＋ 1 個「單字」＝ 95；263 ＋ 95 = 358 == 末筆。
      ・另外要先濾掉隱藏字元（skill 第 4 條）：課文的「校正」中間夾 U+E01E1，不濾會多算 1。
    ⚠️ **這個算法不能直接推廣**：同批的 L0113 有一段含破折號「——」（兩個 U+2014，同樣是一串
    非中日韓標點），那一課要把它算成 **0** 才對得上（三個檢查點全中），算 1 就全差 1。
    兩課各自內部一致、彼此矛盾，樣本都只有 1 段，所以我沒有把它寫成通則，只記錄現象。
  timing_table:
    columns: [第1次計時, 第2次計時, 第3次計時, 裁判計時]
    unit: 字
    judge_signature: true
  benchmark_label: ◎ 我的表現
  benchmark:
    - {threshold: ＜220字, feedback: 還要多加練習。}
    - {threshold: 221~250字, feedback: 嗯，還不錯喲！}
    - {threshold: ＞251字, feedback: 哇嗚，超級厲害！}

# ── 四 語詞我最棒 ──────────────────────────────────────────────
vocab_definitions:
  instruction: |-
    請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
    🅐 從本課語詞框框，找語詞。
    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    🅒 問同學。
  vocabulary_bank: [始終如一, 冷冽, 鬱鬱蔥蔥, 生機勃勃, 徒手, 校正, 所費不貲, 狐疑, 模擬, 雞皮疙瘩]
  vocabulary_bank_label: 本課語詞
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  items:
    - {index: 1, word: 鬱鬱蔥蔥, definition: 植物長得很茂盛、很濃密，一片綠油油。}
    - {index: 2, word: 始終如一, definition: 常用來形容人的態度、想法或做法從開始到結束都沒有改變。}
    - {index: 3, word: 冷冽, definition: 形容寒冷、清冷；也可形容色調、語氣或氣氛給人冷峻、刺骨的感覺。}
    - {index: 4, word: 生機勃勃, definition: 充滿生命力，看起來很有活力、很旺盛。}
    - {index: 5, word: 狐疑, definition: 像狐狸一樣多疑。比喻心中懷疑、拿不定主意。}
    - {index: 6, word: 雞皮疙瘩, definition: 因為冷、害怕或噁心，皮膚毛孔出現的一粒一粒小突起。}
    - {index: 7, word: 徒手, definition: 空手、未用工具。}
    - {index: 8, word: 模擬, definition: 模仿真實的動作、情境或過程，讓人看出相似的樣子；也可用於教學、訓練或研究。}
    - {index: 9, word: 所費不貲, definition: '不貲：不可計算。形容花費非常高。'}
    - {index: 10, word: 校正, definition: 修正錯誤，把不準或有偏差的地方調整回正確的狀態。可用於數據、儀器或位置等。}
  items_note: |-
    第 10 題的定義在 PDF p6 上被一個空的圓形徽章切成兩截（「可用於數據、儀器或位置等。」
    落到徽章下方）。文字層是同一個段落，本檔照文字層合起來記。

