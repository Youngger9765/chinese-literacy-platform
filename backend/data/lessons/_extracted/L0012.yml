# ── 一 讀全文-做記號 ──
body:
  # ⚠️ marking_instruction 放在 body 底下：split_lesson_modules.py 只搬對照表上的頂層
  #    key，放頂層會被靜默丟掉。
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號
      - 重要的地方、喜歡的語詞、句子或段落做上記
  # ⚠️ 同 L0010：課文是兩封信，段號欄**每封各自從一重數**（第一封 一~三、第二封 一~七）。
  #    idx = 學習單印的號碼（會重複），seq = 全文連續序號。
  #    念順順印「六☞」，☞ 圖形落在第二封信第 6 段（第三位朋友的故事更精彩…），即 seq 9。
  #    段號欄與右緣字數欄的行距都會漂（號碼未必貼齊該段首行），但兩欄的**順序**一致，
  #    且 ☞ 的位置與「六」互相印證。
  paragraph_count: 10
  letters:
    - index: 1
      sender: 阿耀
      recipient: 健豪學長
      subject: 主旨：請教—想讀書，該從哪裡著手？
      salutation: 健豪學長，您好：
      signature: 阿耀 敬上
      numbered_paragraphs: [1, 2, 3]
    - index: 2
      sender: 健豪學長
      recipient: 阿耀
      subject: 主旨：RE：請教—想讀書，該從哪裡著手？
      salutation: 阿耀，你好：
      signature: 健豪學長
      numbered_paragraphs: [1, 2, 3, 4, 5, 6, 7]
  paragraphs:
    - seq: 1
      idx: 1
      letter: 1
      text: 謝謝您的回信，我懂您說的「多準備一條路」，這真的很重要。
    - seq: 2
      idx: 2
      letter: 1
      text: 只是我有時候也不是不想讀書！比賽、集訓很多，我們常常請假在外，回來也跟不上課程，越落後越感到挫折。
    - seq: 3
      idx: 3
      letter: 1
      text: 我該從哪裡開始努力？您有什麼建議嗎？謝謝。
    - seq: 4
      idx: 1
      letter: 2
      text: 你說的情況我懂。求學階段，我們要兼顧學生與選手的角色，真的很不容易。
    - seq: 5
      idx: 2
      letter: 2
      text: 不過我想跟你說——學習的方式很多，不一定要坐在教室讀課本才叫學習。你可以先從自己最熟悉、最喜歡的事開始。
    - seq: 6
      idx: 3
      letter: 2
      text: 讓我分享三個朋友的故事：
    - seq: 7
      idx: 4
      letter: 2
      text: 第一位是我的高中隊友，一直想去美國打球，他從國中開始，每天晚上自學英文，但仍然跟不上學校的英文課。怎麼辦？他想：「就從我最熟悉的棒球開始吧！」於是他訂閱了英文棒球雜誌，每天都讀一點、查單字、聽MP3、看體育台的美國職棒報導。棒球的故事太精采了，所以他學英文學得興味盎然、欲罷不能。就這樣，他一邊打棒球一邊練英文，滴水穿石，他熟悉了所有跟棒球有關的英文。你知道嗎？後來他因傷沒能繼續打球，但卻成了旅美選手的翻譯！
    - seq: 8
      idx: 5
      letter: 2
      text: 第二位是我們球隊的隊醫，以前也是學生棒球隊選手，但因運動傷害，打球期間一邊復健，一邊研究身體骨骼肌肉的解剖學，探討怎麼運動、如何訓練才能預防傷害。俗語說，久病而成良醫，他不但自己受傷，球隊裡受傷的情況太多、太頻繁了，這讓他有機會學習隊友們受傷的原因、醫師的診斷、復健師的復健指導到底怎麼做。靠著這些投入，他後來居然考上醫學相關科系。他最終雖然沒有成為職棒選手，卻用不一樣的方式，在最愛的棒球界完成夢想。
    - seq: 9
      idx: 6
      letter: 2
      text: 第三位朋友的故事更精彩，他從四年級進棒球隊後，就不愛讀書，到國中時，連簡單的文章都讀不懂。有一天，他迷上一套名叫《青少棒揚威記》的日本漫畫，廢寢忘食的閱讀，遇到不懂的字詞，就請教老師或同學。這套漫畫讓他的閱讀胃口大開，接著他讀了更多讓國中生愛不釋手的漫畫，像是《野球狂之詩》、《灌籃高手》和《好小子》。憑著對運動的熱愛，也是田徑高手的他，開始挑戰一本沒有插圖的運動少年小說《轉瞬為風》，不但讀完，還看了兩次。這樣的成功經驗，帶動了他所有學科的學習信心，最後在會考時，他的成績和普通班的同學不相上下呢！
    - seq: 10
      idx: 7
      letter: 2
      text: 這三位朋友都有一個共同點：當原本的路受挫時，他們想辦法從熱愛的棒球出發，找出新的可能，靠著行動與學習，繼續留在自己熱愛的領域。相信你也一定找得到自己的方法，往夢想前進！
  inline_marked_terms: [兼顧, 興味盎然, 欲罷不能, 滴水穿石, 解剖學, 久病而成良醫, 廢寢忘食, 胃口大開, 愛不釋手, 不相上下, 受挫]

