    - {index: 3, word: 佇足, definition: 停下腳步。}
    - {index: 4, word: 揣想, definition: 猜測、猜想。}
    - {index: 5, word: 呢喃, definition: 小聲說話。}
    - {index: 6, word: 林立, definition: 像樹林一樣密集排列，形容數量很多。}
    - {index: 7, word: 絡繹不絕, definition: 連續不斷，通常指人車接連不斷。}
    - {index: 8, word: 一貫, definition: 從來沒改變。}
    - {index: 9, word: 流連忘返, definition: 沉醉而不願離開。}
    - {index: 10, word: 汲汲營營, definition: 形容一心急切追求名利。}
    - {index: 11, word: 遣返, definition: 把人送回原來的國家或地區。}
    - {index: 12, word: 餞行, definition: 為人送行。相似詞有「餞別」。若歡迎歸來可用「接風」、「洗塵」。}
