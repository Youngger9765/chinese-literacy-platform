  blocks:
    - type: concept_box
      text: |-
        這又是一篇「用科學步驟解決問題」的說明文，讀起來就像科學偵探故事。作者先找「問題」，再提出「假設」，接著做實驗，用證據「驗證假設」，最後下「結論」，再把結論應用出來。
        這樣的文章，閱讀時要先注意「證據是否能支持（或推翻）假設」。
        我們要先用4個步驟把「解決科學問題的過程」整理清楚。請根據你過去所學，把底下「四個科學步驟」和「ＡＢＣＤ的說明」連連看：

    - type: matching
      left:
        ❶: 找問題
        ❷: 提假說
        ❸: 找驗證
        ❹: 下結論
      right:
        A: 推測原因可能是…；或暫時性的答案常出現「可能」、「推測」等關鍵詞。
        B: 文章主要想解決（或追問）什麼問題？
        C: 證據最後支持哪個假說？
        D: 用什麼方法、看到什麼結果？結果符不符合推測？
      left_header: 步驟
      right_header: 關鍵概念或說明
      answer: {❶: B, ❷: A, ❸: D, ❹: C}
      answer_carrier: |-
        紅色手繪連線。`document.xml` 有 4 條 srgbClr FF0000 的 line 圖形
        （2 條無 flip＝右下斜、2 條 flipV=1＝右上斜），與四組配對的方向完全相同。
      answers_partially_missing_in_pdf_note: |-
        🔴 **PDF 只畫得出 3 條**（❶–B／❸–D／❹–C），❷–A 那條在 XML 裡但完全沒被畫出來
        （它是獨立 anchor：0.948×0.442in、flipV=1、anchorH=column@0.13、anchorV=paragraph@0.206；
        另外 3 條同屬一個 anchor 群組 0.977×1.867in）。只看 PDF 會判成「這題只連了 3 條」。
        端點還原（200dpi）：圓點在 x=514（左欄）與 x=728（右欄），y=968/1104/1251/1381；
        三條可見紅線各自有一致的上移量（−22/−32、−60/−57、−73/−71），校正後接上的就是
        ❶–B、❸–D、❹–C。剩下的 ❷–A 同時被「XML 有第 4 條上斜線」與「語意」兩邊支持。

    # ── 一、找問題→提假說→看驗證→下結論 ──
    - type: guide
      text: 一、找問題→提假說→看驗證→下結論
    - type: guide
      text: 表：本課的科學解決四步驟：找問題→提假說→看驗證→下結論
    - type: guide
      text: 根據課文內容，請勾選或填寫答案（答案合理即可）
    - type: free_text
      label: ❶問題
      prompt: |-
        1.花期落差
        蝴蝶蘭自然盛開於（　）月；市場需求卻在（　）月
      answers: [3-4, 1-2]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    - type: free_text
      label: ❶問題
      prompt: 2.文章要解決什麼問題？
      answers: [如何讓蝴蝶蘭提早開花，以配合市場需求？]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    - type: fill_table
      label: ❷假說⭣❸驗證
      columns: [影響因素可能是, 用什麼方法, 結果/是否支持假說？]
      rows:
        - - 1.肥料
          - 1.施用高磷、鉀肥
          - |-
            1.花更大更美，但沒提早開花
            ➜□①是 □②否 □③部分支持
        - - 2 白晝長度
          - 2.用黑塑膠網遮光    ，讓蝴蝶蘭以為白天變短
          - |-
            2.遮光可催花但僅提早5–7天
            ➜□①是 □②否 □③部分支持
        - - 3.低溫
          - 3.實驗組放冷氣房、對照組留原來花房
          - |-
            3.實驗組一個多月後，抽出花梗       ；對照組則無。
            ➜□①是 □②否 □③部分支持
      row_answers:
        - {row: 1, options: {1: 是, 2: 否, 3: 部分支持}, answer: 2}
        - {row: 2, options: {1: 是, 2: 否, 3: 部分支持}, answer: 3}
        - {row: 3, options: {1: 是, 2: 否, 3: 部分支持}, answer: 1}
      answer_carrier: |-
        ☑ 是紅色 `w:sym Wingdings F0FE`（3 個）；每一列的「用什麼方法／結果」欄裡
        底線處的字（用黑塑膠網遮光／僅提早5–7天／一個多月後、抽出花梗）是橘色手寫，
        兩種都在文字流裡。
    - type: free_text
      label: ❹結論
      prompt: ❹結論
      answers: [低溫，溫度26度以下，持續30-40天，就能成功催花]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    # ── 二、應用 ──
    - type: guide
      text: 二、應用（把結論帶回現場：問題→解決→結果）
    - type: guide
      text: 前面我們用科學步驟找出「低溫能催花」。再來是把結論應用到現場。但農民遇到了新的問題，請根據課文寫出他們如何解決問題。
    - type: free_text
      prompt: 1.問題：【　】
      answers: [花房面積大，冷氣電費成本太高]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    - type: free_text
      prompt: |-
        2.解決：
        ①把平地蘭花送到高海拔蘭園降溫
        ②
        ③
      answers: [在高海拔地方設置蘭園, 用深層海水降溫]
      answer_carrier: 橘色手寫；①是原稿印好的示例（黑字），②③才是要學生填的，教師版填了答案
    - type: guide
      text: 3.結果：用大自然降溫，降低電費負擔，也能順利催花。

    - type: self_check
      title: ◎自我檢核（請打勾）
      items:
        - 1.我能用四步驟整理文章：找問題→提假說→看驗證→下結論
        - 2.我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 六 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號印在題號前的（　）裡，文字流有此資訊
  questions:
    - index: 1
      answer: D
      stem: 下列哪一個選項中，語詞使用「錯誤」？
      options:
        A: 他剛創業時收入太少，經常「入不敷出」，靠朋友接濟度日
        B: 畫展作品風格新穎，構圖尤其「別出心裁」，讓人眼睛一亮
        C: 臺北的午後像火爐一樣，走在街上讓人覺得「暑氣蒸人」
        D: 小安運動會時跑最後一名，在參賽選手中表現「首屈一指」
    - index: 2
      answer: A
      stem: 文中說「遮光能催花，但只能提早5到7天，對農民沒有太大幫助」，主要原因是什麼？
      options:
        A: 遮光只能小幅提早，仍難把開花時間提前到過年
        B: 遮光會減少光照，花朵品質容易明顯變差
        C: 遮光需要整片花房覆蓋，材料與人力成本太高
        D: 遮光會影響生長節奏，導致花梗抽得不整齊
      teacher_note: 文章要解決的是「把三、四月的盛開拉到一、二月」。遮光雖有效，但只提早5–7天，幅度太小，仍無法真正配合過年市場，所以作者說「幫助不大」
      note: |-
        解析框在原稿是**兩個重疊的文字方塊**：一個裝上面那整句，另一個只裝「正配合過年市場。」，
        兩者在 PDF 上互相遮蓋（看得到的是拼接後的樣子）。這裡取完整的那一句，
        另一個殘留片段不另存 —— 疑為編輯殘留，不列勘誤（無法確定原意）。
    - index: 3
      answer: A
      stem: 根據文中最後幾段，花農把蘭花送上高海拔、或利用海邊冷源降溫。這兩種做法最共同的特色是什麼？
      options:
        A: 都是改用自然條件降溫，減少大量開冷氣的成本
        B: 都是把蘭花換到不同地點，讓花期自然提前一段時間
        C: 都是利用環境刺激讓花梗冒出，縮短開花準備期
        D: 都是用新設備提供冷風，讓花房溫度下降更快更穩
    - index: 4
      answer: C
      stem: 本文主要想說明什麼？
      options:
        A: 只要調整白天光照長短，就能讓蝴蝶蘭提早開花
        B: 提高磷鉀肥比例，可讓蝴蝶蘭花團錦簇、大放異彩
        C: 以花期調整為例，說明如何用科學步驟解決問題
        D: 只要政府補助冷氣電費，花農就能輕鬆調整花期
      teacher_note: 全文核心是透過科學歷程與農民巧思來解決催花問題。也強調要把研究結論變成花農做得到、成本負擔得起的方法
    - index: 5
      answer: D
      stem: 若你要用同樣的「科學辦案四步驟」研究「為什麼某班段考平均下降」，下列哪一組最符合「假說」的寫法？
      options:
        A: 這次平均下降了，應該要趕快安排補救教學
        B: 這班平均下降，是因為天時、地利、人和未到位
        C: 平均下降的原因很多，大家都不知道從哪裡開始
        D: 平均下降可能和作息、練習量或題型改變有關
      teacher_note: 假說要有「可能原因」而且可再被驗證。D提出可檢查的因素

