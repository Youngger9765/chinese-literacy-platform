# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 正向思考—換個角度看事情
  strategy_type: character
  section_title_printed: 品格聚光燈
  blocks:
    - type: concept_box
      text: |-
        　　作者在文章前面總覺得自己好慘、別人比較幸運；到了文章最後，遇到不順利的事，他卻總說「太精采了」「太棒了」。
        發生的事情真的都變好了嗎？並沒有。改變的是作者看事情的想法。
        接下來，我們先整理作者舉出的三個生活例子，找出他共同使用的轉念方法，再用這些例子讀懂「把手上的餅吃香一點」的意思。最後，試著把這個方法用在自己的生活中。

    - type: guide
      text: 一、整理例子：看作者怎麼換一個角度看事情

    - type: fill_table
      columns: [發生的事情, 這件事原本帶來什麼不順利？, 作者怎麼說？, 作者把事情重新說成什麼？]
      answer_carrier: 第二欄的答案是**紅色 ☑**（圖形），第四欄的【　】是橘色手寫字；文字流裡被勾中的那一項少了「□」
      rows:
        - 發生的事情: 遇到故意找麻煩的人
          這件事原本帶來什麼不順利？: ""
          這件事原本帶來什麼不順利？_options: {1: 遇到令人不愉快、需要應付的事情, 2: 得到一個精采又難得的生活經驗}
          這件事原本帶來什麼不順利？_answer: 1
          作者怎麼說？: 「太精采了，這種經驗一百萬也買不到。」
          作者把事情重新說成什麼？: |-
            把不愉快的遭遇，說成一種
            【　】
          作者把事情重新說成什麼？_blanks: [{answer: 難得的經驗}]
        - 發生的事情: 回程飛機延誤
          這件事原本帶來什麼不順利？: ""
          這件事原本帶來什麼不順利？_options: {1: 可以繼續留在國外，多玩一天, 2: 不能按照原定時間回家，行程被打亂}
          這件事原本帶來什麼不順利？_answer: 2
          作者怎麼說？: 「太棒了，還可以在國外多玩一天。」
          作者把事情重新說成什麼？: |-
            把行程延誤，說成多得到
            【　】
          作者把事情重新說成什麼？_blanks: [{answer: 一天旅遊時間}]
        - 發生的事情: 感染新冠病毒，不能工作
          這件事原本帶來什麼不順利？: ""
          這件事原本帶來什麼不順利？_options: {1: 身體生病，不能照常工作和生活, 2: 可以在家看電視，而且仍然領薪水}
          這件事原本帶來什麼不順利？_answer: 1
          作者怎麼說？: 「在家裡看電視還能領薪水，我也很『困擾』啊！」
          作者把事情重新說成什麼？: |-
            把不能工作，說成可以在家
            【　】
          作者把事情重新說成什麼？_blanks: [{answer: 休息又有薪水}]

    - type: sub_block
      label: 二、用例子讀懂作者的轉念
      instruction: 二、用例子讀懂作者的轉念
      intro: 前面的表格整理了三個生活例子。接著，把這些例子合起來想一想，讀懂作者怎麼面對不順利的事情，以及這些例子和作者領悟的關係。
      answer_carrier: 紅色 ☑（圖形）與橘色手寫字；文字流裡被勾中的選項少了「□」
      items:
        - {type: guide, text: "(一)找出例子的共同做法"}
        - type: single
          prompt: 1.看完三個例子，可以發現作者怎麼面對這三件不順利的事？（單選）
          options:
            1: 否認事情帶來的不方便，假裝問題沒有發生。
            2: 用幽默換一種方式描述自己的處境，不讓自己只停在抱怨裡。
            3: 證明這些事情原本都是值得期待的好事。
          answer: 2
        - type: guide
          text: |-
            →你發現了嗎？
            發生的事情並沒有消失，作者改變的是看待、描述事情的角度。
        - {type: guide, text: "（二）用例子解釋作者的領悟"}
        - type: guide
          text: |-
            1.作者說：「問題不在餅的大小，而在怎麼樣把手上的餅吃香一點。」
            請根據前面的三個例子，完成下列句子。
        - type: free_text
          prompt: (1)「手上的餅」是指：自己目前【　】事物或正在面對的處境。
          blanks: [{answer: 擁有的}]
        - type: free_text
          prompt: (2)「把餅吃香一點」是指：換一個【　】看自己的處境，不只停在不滿和抱怨裡。
          blanks: [{answer: 角度}]
        - {type: guide, text: "（三）看懂生活例子的作用"}
        - type: single
          prompt: 1.第10段列出三個生活例子，對作者的領悟有什麼作用？（單選）
          options:
            1: 補充作者後來還遇到哪些倒楣的事情。
            2: 證明作者後來的生活比其他人更幸運。
            3: 具體說明作者如何在生活中「把手上的餅吃香一點」。
            4: 說明只要說話幽默，就會讓別人羨慕自己。
          answer: 3

    - type: sub_block
      label: 三、換你把手上的餅吃香一點
      instruction: 三、換你把手上的餅吃香一點
      intro: 前面我們從三個生活例子，看見作者如何換一個角度看自己的處境。現在，換你把這個方法用在生活中。
      items:
        - {type: guide, text: "（一）辨一辨"}
        - type: single
          prompt: |-
            數學考不及格，老師多給我一份練習卷。哪一個想法比較能幫助自己面對事情？（單選）
          options:
            1: 怎麼又是我？為什麼別人都不用寫？
            2: 雖然要多寫一份，但可以幫我找出不會的地方，下次再進步。
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流裡被勾中的那一項少了「□」
        - type: guide
          text: →有幫助的轉念不是假裝事情不困難，而是換個角度，看見能幫助自己的地方。
        - {type: guide, text: "（二）換你試試看"}
        - type: free_text
          prompt: |-
            打掃時，我被分配到掃廁所，心想：「掃廁所又髒又累，真是太倒楣了！」
            請幫自己換一個角度想。（答案合理即可）
            掃廁所雖然【　】，但是【　】。
          blanks: [{answer: 比較辛苦}, {answer: 把它打掃乾淨，大家使用時會更舒服}]
          answer_note: |-
            原稿印著「（答案合理即可）」，橘色手寫字是**參考答案**不是唯一解。
            ⛔ 沒有標 no_correct_answer —— 這題教師版有印答案，只是接受其他合理回答。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 括號內的答案代號為橘色手寫字（圖形字型），文字流已含此資訊
  items:
    - index: 1
      answer: B
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 胖虎把桌上的牛奶倒在大雄頭上，讓大雄「醍醐灌頂」，好過分
        B: 弟弟遊戲輸了都會「撒賴」，要大家陪他再玩一次，真拿他沒辦法
        C: 小夫在教室大聲的「嘀咕」說小明的壞話，讓小明氣到不跟他說話
        D: 馬戲團表演者被大砲發射出去，飛到天上去，可說是「難如登天」
    - index: 2
      answer: D
      stem: 作者小時候百思不解的問題是什麼呢？
      options:
        A: 為什麼大人給零食時，都要他們「公家吃」
        B: 為什麼作者常常要被迫跟姊姊分享同一個餅
        C: 為什麼祖母都是讓姊姊來分餅，作者選餅呢
        D: 為什麼他用盡策略，最後仍覺得姊姊的餅比較大
    - index: 3
      answer: C
      stem: 第六段中提到「……，吸引了一位跟我有同樣毛病的小朋友，……」，請問這裡指的「同樣毛病」，是什麼毛病呢？
      options:
        A: 愛計較，見到糖果餅乾都非常「餓鬼」
        B: 只要遇到不順心的事，就對家人耍賴
        C: 覺得別人得到的，都比自己擁有的好
        D: 平常愛抱怨，總是自怨自艾感到鬱悶
    - index: 4
      answer: A
      stem: 作者讀完《湯姆歷險記》後，最重要的改變是什麼？
      options:
        A: 事情不一定改變，但他開始換個角度看自己遇到的事
        B: 他學會用方法讓別人替自己完成所有麻煩的工作
        C: 他發現只要說自己很幸運，生活中的問題就會消失
        D: 他認為別人擁有的東西，其實都不如自己的東西好
    - index: 5
      answer: D
      stem: 運動會，大家期待已久的大隊接力比賽，因為下雨而延期了，下面哪些想法是比較正向的呢？
      statements:
        甲: 比賽延期我們就能多練習幾天了
        乙: 比賽延期我們前面不就都白練了
        丙: 今天沒有比賽，整個運動會都沒有意義
        丁: 幸好比賽延期，否則地面溼滑跑步容易受傷
      options:
        A: 甲乙
        B: 乙丙
        C: 丙丁
        D: 甲丁
      layout_note: 甲乙丙丁四句先列出，四個選項印在下一頁的段標圖案之後。

