      options: {1: 疾病, 2: 歌唱, 3: 公私, 4: 寧靜, 5: 整理, 6: 喜悅, 7: 利弊, 8: 乍見}
      answers: [1, 2, 4, 5, 6]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），PDF p5 可見

