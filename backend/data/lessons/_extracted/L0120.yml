# ── 一 讀全文—做記號 ──
body:
  title_line: 第22課  靈異與科學
  paragraph_count: 8
  # 段號欄印的是 一二三四五六七八 共 8 個，跟 v2 的 8 段一致。
  # 「現象一：鬼火」「現象二：鬼壓床」是課文中間的加框小標，**不佔段號**，
  # 所以另存在 inline_headings，不併進 paragraphs（併進去會讓念順順的段號整個位移）。
  paragraphs:
    - idx: 1
      text: 「中國人怕鬼、西洋人也怕鬼，全世界的人都怕鬼。恐怖喔！恐怖到了極點喔！」這是已故的鬼故事大師──司馬中原的名言。人類對於死後世界的恐懼，跨越世代與文化。傳說中的鬼魂、幽靈、妖怪，一直都是引人入勝的故事題材。然而，這些看似神祕的故事，科學家會怎麼解釋呢？
    - idx: 2
      text: 鬼火通常出現在炎熱的夏天，夜裡趕路的行人經過墳場時，就可能看見黑暗中閃爍飄動的淡藍色或淡綠色的火焰，讓人毛骨悚然。人類是唯一會想像死後世界的動物，暗夜裡在墳場乍見搖曳浮盪的藍焰，人們難免聯想到鬼魂，說不害怕還真不可能。新聞節目說，曾經有盜墓賊在烏漆墨黑的墳場被鬼火嚇跑，甚至被活活嚇死。
    - idx: 3
      text: 科學界對鬼火現象提出一個解釋──人類及動物的遺骸腐化後，產生了「磷化氫」，這種氣體很輕，燃點很低，從地底浮到地面後，在常溫下就會自燃。但是，這個說法最啟人疑竇之處：鬼火是藍色的，但磷化氫燃燒起來是明亮的黃光。後來一名英國地理學家提出了修正的解釋──冷焰。屍體腐壞後散發出的磷化氫和濕地的沼氣及空氣混合，形成燃點很低的可燃氣體，攝氏30度左右就可以燃燒，但它的燃燒不劇烈，必須在非常暗的地方才可看見，而且顏色多為藍色或淡紫色，所以被稱為「冷焰」。如果這個說法正確，就可以解釋為什麼最常見到鬼火的時間是夏天，地點是墳場了。
    - idx: 4
      text: 你也許有過這樣的經驗：在入睡或快醒來時，感覺自己被一股力量重重的壓著，想逃，動彈不得；想喊，喑啞無聲；想起身，卻陷在噩夢裡醒不過來，這種難受的感覺被稱為「鬼壓床」。不同文化的人們，普遍把這個現象和鬼神聯結起來，認為是有幽冥世界的鬼魂壓制了睡眠者、企圖傳遞警告的訊息。但科學家怎麼解釋鬼壓床呢？
    - idx: 5
      text: 科學家發現人類每晚大概有四到六次的睡眠週期，每次約90分鐘，每個週期又有「淺睡期」、「中睡期」、「深睡期」及「快速眼動期」四個階段。快速眼動期時，眼球在眼皮下快速的移動著，沉睡的大腦又活躍起來，腦波看來很熱鬧，和白天醒著時差不多。但是，睡眠者此時卻無法控制全身的肌肉、癱軟無力。如果你在此時推他一把說：「欸，起來啦。」睡眼惺忪的他，有八九成的機會告訴你，他正在作夢。
    - idx: 6
      text: 醫學上把鬼壓床稱作「睡眠癱瘓症」，它就發生在快速眼動期。患者此時正在作噩夢，卻覺得自己醒著，能睜開雙眼、能看到周圍事物、能聽到聲音，然而卻發現自己無法移動，也無法發出聲音。其實，睡眠者此時動彈不得才是對自己最好的保護。想想看，如果作夢時手腳身體是能動的，你正夢見被窮凶極惡的匪徒追殺，你為了防衛，回身給他一記詠春拳、一腳迴旋踢。糟了，你可能一拳打破了旁邊的玻璃，一腳踢在水泥牆上，把趾甲踢斷，那才慘呢。
    - idx: 7
      text: 睡眠癱瘓症是睡眠障礙的一種，這種情況通常是暫時性的，大多數人偶爾會有這樣的經驗。但如果睡眠癱瘓症出現頻繁，並對生活產生影響，就建議就醫，進行進一步的評估和治療。
    - idx: 8
      text: 鬼火和鬼壓床雖然被許多人解釋為靈異現象，但理性的科學方法，讓我們對這些現象有了客觀的認識。另外，你有沒有發現，對同樣的現象，鬼魂說和科學說，分別帶給你驚悚可怕和有趣新奇的情緒呢？有一位社會學家說，現代文明的特色之一就是「除魅」，用科學的解釋，把鬼魅的說法從我們的世界裡驅除了，你認為呢？
  inline_headings:
    - {after_paragraph: 1, text: 現象一：鬼火}
    - {after_paragraph: 3, text: 現象二：鬼壓床}
  inline_marked_terms: [引人入勝, 閃爍, 毛骨悚然, 乍見, 烏漆墨黑, 啟人疑竇, 喑啞無聲, 週期, 癱瘓, 窮凶極惡]

