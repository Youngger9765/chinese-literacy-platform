# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 科學探究策略——假設與假設檢驗
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），PDF p7~p9 全部可見（9 個）
  blocks:
    - type: concept_box
      text: |-
        人們看到難以理解的現象，如鬼火或鬼壓床，常會根據過去的經驗或知識，提出一些可能的解釋，這些解釋在科學歷程裡被稱為假設。但是，假設到底正確嗎？科學探究的方法，絕對不是先相信哪一種說法，而是依照下面的程序追尋真相（請默讀底下1~4的黑體字）。
        1.提出問題：從現場觀察到的現象、找到的線索，而產生的疑問。
        2.提出假設：對問題提出一些可能的答案。
        3.檢驗假設：運用方法、蒐集證據驗證假設的答案是否正確。
        4.提出解答：根據驗證的結果，回答提出的問題。
        特別要說明的是，在「檢驗假設」時，如果蒐集到的證據支持假設，假設就成立了，問題解決！這個程序如底下的科學探究步驟的示意圖。
        但如果證據不支持假設呢？則原來的假設就不成立，探索者必須回頭修正假說或研究問題，如示意圖下方、指向提出問題及提出假設的兩個箭頭，一直到問題得到合理的解答。

    - type: figure
      id: 圖1
      referent: 科學探究步驟的示意圖
      # 🔴 這張流程圖的字**整個畫在圖片上**（word/media/image17.png，719KB）。
      #    判準是拿合併 run 之後的 dump grep：「假設得到支持」= 0 命中（原始 XML grep 也是 0）。
      #    對照組：「科學探究步驟」raw XML grep = 0 但 dump = 1（被拆 run），它在文字層——
      #    所以只用 raw grep 會把文字層的東西誤標成圖。
      text_carrier: image
      content: |-
        圖1. 科學探究步驟的示意圖
        提出問題 → 提出假設 → 檢驗假設 → 假設得到支持？
        （是）證據支持假設 → 問題解決！
        （否）證據不支持假設 → 兩個「修正」箭頭分別回頭指向「提出問題」與「提出假設」
      placement: 印在概念說明框下方、「一、鬼火是怎麼回事？」之前（PDF p7 上緣）

    # ── 一、鬼火是怎麼回事？科學探究的步驟 ──
    - type: guide
      text: 一、鬼火是怎麼回事？科學探究的步驟
    - type: guide
      text: 在夏天的夜裡，有人在墳場看見黑暗中閃爍飄動的淡藍色或淡綠色的火焰，除了毛骨悚然的感覺之外，他會好奇地：
    - type: guide
      text: 1.提出問題：
    - type: passage
      paragraphs:
        - 「墳場夏夜裡閃爍飄動的藍綠火焰是怎麼回事？」
    - type: free_text
      prompt: 針對這個問題，人們提出了幾個可能的解釋，這些解釋在科學程序裡被稱為【　】。底下是人們提出的幾個假設：
      answers: [假設]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    - type: guide
      text: 2.提出假設：
    - type: single
      prompt: 底下哪一個假設是可以蒐集資料來檢驗真假的？（2選1）
      options:
        1: 假設一：鬼火是屍骸腐化後所產生的磷化氫，它很輕、燃點很低，從地底浮起後會自燃起來
        2: 假設二：鬼火是心有不甘的人死後變成的鬼魂，在暗夜的墳場出來，想要抓交替
      answer: 1
    - type: guide
      text: 3.檢驗假設：
    - type: single
      index: 1
      prompt: (1)如果「假設一：鬼火就是磷化氫」是真的，這個假設無法解釋哪一個現象？（單選；參考第三段的說明）
      options: {1: 鬼火會自己燃燒, 2: 鬼火是藍綠色的, 3: 鬼火會飄浮, 4: 鬼火出現在墳場}
      answer: 2
    - type: single
      index: 2
      prompt: (2)磷化氫燃燒時是明亮的黃光，但鬼火是藍綠光；從這裡看，「假設一：鬼火就是磷化氫」能接受嗎？需要修正嗎？
      options: {1: 要接受這個假設，不需要修正, 2: 要拒絕這個假設，需要修正}
      answer: 2
    - type: guide
      text: 3.１提出新的（修正後的）假設：
    - type: single
      index: 3
      prompt: (3)根據課文第三段，有位英國地理學家提出了修正的假設，請問這修正假設的程序是在圖１的什麼地方？（請參照圖1作答；單選）
      options:
        1: 證據支持假設，問題終於得到解決
        2: 證據支持假設，鬼火是藍綠色的
        3: 證據不支持原來的假設，回頭修正原來的假設
        4: 證據不支持原來的假設，回頭修正原來的問題
      answer: 3
    - type: guide
      text: 4.問題解決：
    - type: single
      prompt: 根據課文，這個關於「鬼火是怎麼回事」的研究問題，得到解決了嗎？
      options: {1: 得到解決：鬼火是磷化氫＋沼氣＋空氣, 2: 未能解決：鬼火仍是個謎}
      answer: 1

    # ── 二、小試身手 ──
    - type: guide
      text: 二、小試身手：
    - type: guide
      text: 請閱讀以下關於「假設與假設檢驗」的案例後，回答相關的問題。
    - type: passage
      paragraphs:
        - 15世紀到18世紀的幾百年間，許多在海上長時航行的水手死於壞血病，他們先是牙齦、皮膚出血、到後來會全身出血而亡。當時的醫學對壞血病成因的假設是「瘴氣」——船艙狹小不通風，船員長時在壞空氣裡生活，因此得了壞血病。但是，所有改善船艙空氣的嘗試都無法降低壞血病的出現率。1753年，英國的海軍軍醫林德發現，讓船員吃柑橘類的食物可以治療、預防壞血病，人們才開始相信壞血病不是外來的壞東西引起的，而是身體缺少了某種營養素。但一直到20世紀，科學家才找到這種物質，並稱它為「維他命C」。
    - type: guide
      text: 1.提出問題：
    - type: passage
      paragraphs:
        - 「是什麼讓船員得到壞血病？」
    - type: free_text
      prompt: 針對這個問題，早期醫學界提出一個可能的解釋，這些解釋在科學程序裡被稱為【　】。
      answers: [假設]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    - type: guide
      text: 2.提出假設：
    - type: single
      prompt: 底下哪一個是早期醫學提出的假設？（2選1）
      options:
        1: 假設一：壞血病是身體缺少某一種營養素而導致的疾病。
        2: 假設二：壞血病是壞空氣所致，船員吸進船艙裡的壞空氣，就生病了。
      answer: 2
    - type: guide
      text: 3.檢驗假設：
    - type: single
      index: 1
      prompt: (1)如果『假設二：壞血病是壞空氣所致』是真的，那麼這個假設無法解釋哪一個現象？（單選）
      prompt_source_text: (1)如果「如果『假設二：壞血病是壞空氣所致』是真的，那麼這個假設無法解釋哪一個現象？」（單選）
      errata_ref: E1
      options:
        1: 為什麼長時在海上航行的船員會生病
        2: 改善空氣的嘗試，無法減少壞血病
      answer: 2
    - type: single
      index: 2
      prompt: (2)「改善空氣不能減少壞血病」，從這裡看，「壞血病是壞空氣所致」是正確的嗎？
      options: {1: 是正確的，要拒絕這個假設, 2: 是不正確的，要拒絕這個假設}
      answer: 2
      note: 兩個選項都印「要拒絕這個假設」，選項①語意自相矛盾——照原樣抄，見 source_errata_note
    - type: guide
      text: 3.１原來假說未得支持，然後呢？
    - type: single
      index: 3
      prompt: (3)現在知道「改善空氣不能減少壞血病」你是科學探究者，下一步該做什麼呢？請在圖１找到你可以進行的程序？（請參照圖1作答；單選）
      options:
        1: 拒絕「瘴氣假說」，另提新假說
        2: 拒絕「瘴氣假說」，放棄這個問題
        3: 接受「瘴氣假說」，另提新假說
        4: 接受「瘴氣假說」，放棄這個問題
      answer: 1

    - type: self_check
      title: ◎自我檢核
      instruction: 如果你有做到，請在□內打勾。
      items:
        - 1.我知道，為得到解答，可透過「提出問題→提出假設→檢驗假設」的科學探究程序。
        - 2.我能看出「假設，其實就是對一個研究問題的解釋」。
        - 3.我知道，假設不一定正確；假設要有證據支持，才能成立。
        - 4.我知道，當證據不支持假設時，必須拒絕假設，重提新的假設。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊；解析印在右側藍色小方框
  questions:
    - index: 1
      answer: B
      stem: 下列語詞何者用法使用正確?
      options:
        A: 面對惡犬，他「毛骨悚然」，完全不畏懼
        B: 「乍見」新年的曙光，讓人內心雀躍不已
        C: 他能言善道，完全不像個「喑啞」人士
        D: 這棟鬼屋傳說眾多，真是「窮凶極惡」之地
      teacher_note: |-
        (A)前後句矛盾
        (C)前後矛盾，瘖啞人士不會說話
        (D)通常形容人罪大惡極
    - index: 2
      answer: D
      stem: 有關「睡眠癱瘓症」的描述，何者正確？
      options:
        A: 通常發生在睡眠時的深睡期
        B: 絕大多數的人會頻繁發生睡眠癱瘓
        C: 作噩夢時，身體可以自由移動
        D: 癱瘓現象是人體在睡眠中的保護機制
      teacher_note: |-
        (A)快速眼動期
        (B)暫時性的發生
        (C)因為還在作夢，所以無法馬上移動。
    - index: 3
      answer: C
      stem: 人們常常聽到「鬼火」與「鬼壓床」的經驗，請問兩者的共同之處為何？
      options:
        A: 都是鬼魂想要向人世間傳達訊息的一種手段
        B: 只有在深度睡眠時期，才可能會發生這種現象
        C: 都是人類對未知事物的恐懼感所產生的解釋
        D: 都是身體的自我保護，以避免人在黑暗中受傷
      teacher_note: (C)（因為人對未知事物的恐懼，才把一些科學可解釋的現象往靈異方面解釋。）
    - index: 4
      answer: D
      stem: 根據本文結論，如果遇到超自然事件時，哪一個選項不符合現代科學的精神？
      options:
        A: 調整思考，依據科學的角度去解釋異狀
        B: 心理治療，透過專業協助，找到問題的根源
        C: 身體檢查，看看是否有腦部或癲癇等疾病
        D: 敬畏鬼神，常去廟裡收驚、拜拜、保平安
      teacher_note: (D)（依據本文結尾理性的科學方法，將可以幫助我們更進一步對現象有客觀的認識，所以未必每件事都是鬼怪之說。）
    - index: 5
      answer: A
      stem: 解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。  以「止癢」為例，請將代號依步驟排出正確的順序。
      material:
        - 甲.我推測抓癢時會產生痛覺，我們抓癢是想要用「痛覺」蓋過「癢覺」。
        - 乙.為什麼身體癢時，會用抓癢來止癢？我們受傷時並不會想抓傷口來止痛？
        - 丙.下次蚊子叮咬時，可以拍打被叮的位置試試看，是否能止癢。
      material_note: |-
        PDF p9 的方框裡只看得到甲、乙兩項，丙被下方的圓形圖案壓住沒印出來 ——
        但「丙.下次蚊子叮咬時…」在 document.xml 的文字流裡，是轉檔缺陷不是教材缺項。
      options: {A: 乙甲丙, B: 乙丙甲, C: 甲乙丙, D: 丙乙甲}

