        - type: multi
          index: 1
          prompt: 1.支持觀點重點：「他有信念和堅持」
          sub_prompt: 哪些事件或細節可以看出他有「信念和堅持」？
          options:
            1: 他不願違背良心，也不願辜負最愛的棒球和支持他的球迷
            2: 他要求自己不管環境如何，每場比賽都要全力以赴
            3: 他念高中時，英文畢業考只考 26 個英文字母的大、小寫
          answers: [1, 2]
          prompt_marker_note: PDF 上「重點」與冒號之間印有 ❶，該符號不在文字流（Word 圖形／符號物件）
        - type: multi
          index: 2
          prompt: 2.支持觀點重點：「他沒有走錯方向」
          sub_prompt: 哪些事件或細節可以看出他「沒有走錯方向」？
          options:
            1: 他拒絕黑道提出的五、六百萬簽約金與打假球的要求
            2: 假球案爆發，他是少數沒有打假球嫌疑的人
            3: 他進入職棒第三年才當上先發球員
          answers: [1, 2]
          prompt_marker_note: PDF 上「重點」與冒號之間印有 ❷，該符號不在文字流

    - type: exercise
      label: 四、組合應用
      instruction: 四、組合應用：下列選項為作者的觀點及支持觀點的細節，請用以下的結構整理作者想法。
      sub_instruction: 閱讀以下選項與結構，並根據文意填入A、B、C。
      option_bank:
        A: 要求自己每場比賽都要全力以赴
        B: 信念和堅持能幫助我們不走錯方向
        C: 拒絕黑道提出的百萬簽約金與打假球的要求
      answer_carrier: 紅色手寫字（圖形），文字流的（　）內已填有答案
      items:
        - type: free_text
          label: ◎作者想法
          prompt: ◎作者想法：作者認為（　）。首先，周思齊（　），不拿環境當藉口，也不能辜負球迷。再者，他因著這份信念和堅持，在多數人都妥協時，他（　），沒有走錯方向。最後，這份信念與堅持，造就了他穩定的表現，並幫助他在臺灣棒球史上留下重要地位。
          prompt_source_text: ◎作者想法：作者認為（　）。首先，周思齊（　），不拿環境當藉口，也不能辜負球迷。再者，他因著這份信念和堅持，在多數人都妥協時，他（　），沒有走錯方向。最後，這份信念與堅持，造就了他穩定的表現，並幫助他在臺灣棒球史上留下的重要地位。
          errata_ref: E1
          blanks: [{answer: B}, {answer: A}, {answer: C}]
          boxed_terms: [作者認為, 首先, 再者, 最後]
          boxed_terms_note: 這四個結構詞在教材上加了外框，用來提示「觀點→理由→理由→總結」的組合順序

    - type: multi
      label: 五、延伸練習
      prompt: 五、延伸練習：上面找出的支持理由，還可以支持下列哪些觀點？(複選)
      options:
        1: 面對眼前利益時，不應放棄自己的原則
        2: 持續學習新知，能為未來增加更多選擇
        3: 良好的學習環境，能幫助運動員提升能力
        4: 困境中堅守原則，能幫助人保持清白
      answers: [1, 4]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出文章想傳達的觀點。
        - 2.我能找出觀點中的不同重點。
        - 3.我能跨段找出支持各個重點的理由。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 因為天生「膽戰心驚」，所以在比賽中總能冷靜分析局勢
        B: 他初次上場就能「辜負」全隊的期望，讓大家倍感振奮
        C: 這次他難得願意「倔強」，和隊友們溝通，嘗試取得共識
        D: 他在首次比賽中就能「大展身手」，贏得了觀眾們的掌聲
      option_notes:
        A: (A)宜用「細心謹慎」
        B: (B)宜用「回應」
        C: (C)宜用「妥協」
    - index: 2
      answer: D
      stem: 根據周思齊面對打假球威脅時的行為，可以推論他最重視的是下列何者？
      options:
        A: 保護個人安全，避免任何風險
        B: 維護球隊形象，保持外界信任
        C: 獲得更多比賽以及高額獎金的機會
        D: 堅守職業道德，不違背初衷和良心
      teacher_note: 從他不願違背良心、辜負球迷的期待來看宜選(D)
    - index: 3
      answer: A
      stem: 根據第六段，為什麼文中會提到「球員的平均職業運動生涯只有 4.8 年」？
      options:
        A: 突顯周思齊職棒生涯長達 20 年的難能可貴
        B: 說明棒球比其他運動失敗率更高也更易受傷
        C: 說明多數職業球員不願意長期投入棒球運動
        D: 暗示球員生涯短是因為缺乏專業訓練與防護
      teacher_note: 根據第六段前後文可知。
      quote_mismatch_note: 題幹引號內寫「球員的平均職業運動生涯只有 4.8 年」，課文第六段原文是「球員的平均職棒生涯只有4.8年」——引用與原文不符，但改動它等於改題目，故不列勘誤
    - index: 4
      answer: B
      stem: 下列何者最符合本文主旨？
      options:
        A: 周思齊的成功完全依靠天賦與運氣來取得成就
        B: 堅守信念並持續努力才能夠走過困境達成目標
        C: 棒球員應避免參加職業比賽以免捲入假球事件
        D: 棒球生涯若想要長久必須選擇收入較高的球隊
      option_notes:
        A: 是靠努力
        C: (C)(D)文章未提及
    - index: 5
      answer: A
      stem: 第七段描述周思齊手上的厚繭、脫皮與疤痕，最能支持下列哪一個觀點？
      options:
        A: 長期投入訓練，會在身體上留下努力的痕跡
        B: 面對挑戰，經常必須伴隨代價才能有所收穫
        C: 手上的厚繭越多，職業運動生涯通常越長久
        D: 保持良好狀態需要在日常中養成自律的習慣
      teacher_note: 根據第七段後文「這些都是他堅持與努力的痕跡」可知。

