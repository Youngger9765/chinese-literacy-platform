# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 請問哪一個句子使用語詞正確?
      options:
        A: 近來很流行戶外活動，大家很喜歡「追溯」溪邊的小魚
        B: 這對雙胞胎的長相真的「不分軒輊」，看起來很難分辨
        C: 看似瘦弱的他，居然能徒手打退歹徒，真令人「刮目相看」
        D: 網路購物廣告說達到消費門檻就可以「應運而生」，買多賺多
      teacher_note: 「刮目相看」指的是很厲害，讓人佩服。其他選項誤解詞語意思，應用錯誤。
    - index: 2
      answer: B
      stem: 從課文第一段可推論，現在的植物肉相較於早期豆腐製成的素肉，最強調哪一項改進？
      stem_source_text: 從課文第一段可推論，現在的植物肉相較於早期豆腐製成的素肉，，最強調哪一項改進？
      errata_ref: E1
      options: {A: 價錢, B: 口感, C: 營養, D: 成分}
    - index: 3
      answer: A
      stem: 根據課文，下列何者不是現代植物肉的風行的原因？
      options:
        A: 商店提供了消費者更多樣化的產品選擇
        B: 植物肉的營養價值及口感逐漸接近真肉
        C: 真肉必須屠宰動物，讓人看了很不忍心
        D: 大家重視環保議題，希望減少環境負擔
      teacher_note: 選項A為植物肉風行後的結果，並非風行原因。
    - index: 4
      answer: B
      stem: 作者寫這篇文章，最主要的目的是什麼？
      options:
        A: 希望藉由介紹植物肉來探討環境保護的議題
        B: 希望介紹植物肉讓更多人認識並願意考慮嘗試
        C: 比較兩種肉品的不同，質疑動物肉的必要性
        D: 教導讀者如何正確的寫出植物肉的介紹文章
      teacher_note: 由最後一段可知，作者希望大家都去嘗試看看植物肉，所以答案為B。
    - index: 5
      answer: C
      stem: 下列有關文章觀點與支持理由的配對，何者正確？
      passage_box:
        text: 坐在搖曳的篝火旁邊，他用低沉的聲音，告訴我熱帶雨林的祕密。原來，這表面看來深沉寧靜的叢林，往往有突如其來的殺手──大風、暴雨、毒蟲、猛獸，盤桓其中，隨時可能要人性命；不過，只要謹慎小心，這片赤道旁的熱帶雨林，不只會讓我們走入神祕的世界，更會讓我們見識到各種新鮮有趣的事物。
        source: ～出自周寶興＜走進原始雨林＞
      options:
        A: 雨林是個祕密的地方，搖曳的篝火令人有無限的遐想
        B: 雨林是個深沉寧靜的地方，因為有各種新鮮有趣的事物
        C: 雨林是個危險的地方，因為有很多自然殺手隱藏其中
        D: 雨林是個有豐富生物的地方，因為有很多毒蟲及猛獸
      teacher_note: 由大風、暴雨、毒蟲、猛獸隨時可能要人性命，可知雨林是個危險的地方

