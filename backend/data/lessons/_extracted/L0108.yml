# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1、4、5 題有
  questions:
    - index: 1
      answer: C
      stem: 文中寫婦女去洗衣「還得請兩名壯丁持矛守望」，主要說明什麼？
      options:
        A: 河邊離村落較遠，婦女需要壯丁協助搬運衣物
        B: 食人虎多在清晨出沒，因此村民只敢在白天洗衣
        C: 虎患已侵入日常生活，連洗衣都必須有人持矛警戒
        D: 村民準備主動搜尋老虎，所以先安排壯丁在河邊守候
      teacher_hint: 這句話的重點是「恐懼已進入生活」
    - index: 2
      answer: B
      stem: 科貝先走遍村莊訪察虎襲時間與地形，最主要的用意是什麼？
      options:
        A: 確認受害者身分，方便逐戶向家屬說明
        B: 整理遇襲線索，推定老虎出沒路線並安排伏擊
        C: 比較各村傷亡人數，決定先保護人口較多的村落
        D: 尋找最容易召集村民的地方，方便發放火把與武器
    - index: 3
      answer: A
      stem: 根據本文「人口增加、農園擴大、棲地被侵占」的說明，下列哪一項最符合作者對「人虎衝突增加」原因的推論？
      options:
        A: 棲地被侵占→人虎活動範圍重疊→衝突變多
        B: 村落人口增加→食物垃圾增加→老虎偏好進村覓食
        C: 農園不斷擴大→村民持械巡守→老虎因受驚而攻擊
        D: 士兵圍剿失敗→老虎不再害怕人類→衝突增加
      options_note: 這一題的「→」是文字流裡真正的箭頭字元（與聚光燈那個 Wingdings 符號不同），照抄
    - index: 4
      answer: B
      stem: 第２段連續寫了「夜裡／清晨／正午」的虎襲情境，其用意為何？
      options:
        A: 交代老虎在不同時段選擇不同獵物的固定規律
        B: 透過連續列舉，營造虎患隨時可能發生的壓迫感
        C: 比較夜間與白天的危險程度，說明正午最難防備
        D: 預告科貝將依照不同時段安排圍捕老虎的計畫
      teacher_hint: 不同時段都出事，讓人感到「隨時可能遇襲」，是典型的氣氛鋪陳與危機堆疊手法
    - index: 5
      answer: D
      stem: 下列哪一項最能概括全文主旨？
      options:
        A: 文章著重歌頌獵人英勇除害，成功獵殺猛虎以安定人心
        B: 文章強調虎患殘酷可怕，主張必須徹底圍剿才能自救救人
        C: 文章重點在追虎與伏擊技巧，呈現獵虎過程並教人方法
        D: 文章透過虎襲案例反思，指出人虎衝突常與人類行為相關
      teacher_hint: 文章最後談人口與棲地擠壓、科貝轉向保育，核心在「反思原因與責任」。

