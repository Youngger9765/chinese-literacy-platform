# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 6
  # ⚠️ 段號欄第一格印的是注音符號「ㄧ」（U+3127）不是漢字「一」，其餘是二三四五六。
  #    這裡的 idx 一律用整數，念順順的「五☞」對應 idx 5。
  paragraphs:
    - idx: 1
      text: 「一個夢想如果可以被想像，那就有存在的價值。但重點是你要怎麼計劃並且執行。」臺灣極地超級馬拉松好手陳彥博說。他跑過沙漠、高山和冰原，是第一位勇奪四大極地超級馬拉松巡迴賽總冠軍的亞洲人。
    - idx: 2
      text: 2008年，陳彥博與超馬好手林義傑、劉柏園組隊，挑戰磁北極六百五十公里極限馬拉松，獲得團體組第三名的殊榮，他是歷屆最年輕完賽的選手，這場比賽帶給他的感動無可言喻，也是他跨入極地賽的夢想起點。
    - idx: 3
      text: 2011年，二十三歲的陳彥博下了一個決定：「我要在五年內挑戰世界七大洲、八大站的超級馬拉松。」沒想到，在逐夢的過程中，遇到一段意外的插曲。
    - idx: 4
      text: 陳彥博在一次重感冒後，一直咳痰，而且痰裡有血絲。到醫院檢查後，醫生看著X光片對他說：「這是一個不好的東西，要開刀。」陳彥博一直問：「這到底是什麼？」當醫生沉重的回答：「咽喉癌。」陳彥博的內心瞬間崩潰。接受手術時，他非常害怕，害怕打了麻醉之後就醒不過來，或是醒來之後再也不能跑步。
    - idx: 5
      text: 手術順利完成，醫生說以他身體虛弱的狀態，可能不能跑步，因為跑極地馬拉松腳磨破、起水泡是家常便飯，炎熱或酷寒的天氣，增加了死亡的風險。身邊親友都勸他不要執著於賽事，好好過生活也不錯。陳彥博卻不這麼想，他問自己：「如果有一天，陳彥博不再跑步、不再冒險，那會怎樣？」他發現，答案很簡單，跑步是他唯一擅長也享受其中的事，如果上天給了他再活一次的機會，怎麼能夠不痛快淋漓的享受它？所以他克服身體上的不舒服，一次次的努力復健，開始嘗試再次跑步。雖然術後的體力大不如前，肌肉強度也不見了，但頑強的他，靠著漫長的訓練慢慢走出來，恢復從前狀態。
    - idx: 6
      text: 陳彥博雖然在2011年罹癌，但他仍然以五年時間完成了當初訂下的超馬夢想，他跑過高溫五十四度的戈壁沙漠，他歷經零下六十二度的酷寒極地，甚至是爬升七千公尺的喜馬拉雅山。他被眼前的大山大海大漠吸引，把「不可能」狠狠地拋在腦後，超越了自己的極限！
  inline_marked_terms: [殊榮, 歷屆, 無可言喻, 插曲, 崩潰, 家常便飯, 執著, 痛快淋漓, 頑強, 罹癌]

