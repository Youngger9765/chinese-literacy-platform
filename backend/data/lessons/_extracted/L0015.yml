# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 第一段陳彥博為亞洲創下了什麼成就？
      options:
        A: 勇奪四大極地超級馬拉松巡迴賽總冠軍
        B: 醫生告知他得了咽喉癌，但他成功復原
        C: 高中時即為田徑長跑選手，有亮眼成績
        D: 他克服家人與醫生的勸說，不放棄夢想
      teacher_note: （第一段）— 原稿印在選項 A 右側
    - index: 2
      answer: B
      stem: 第三段陳彥博意外的遇到一段「插曲」，根據後文這裡的「插曲」指的是什麼事件？
      options:
        A: 他再也不能跑步了
        B: 醫生告知他得癌症
        C: 害怕麻醉後醒不來
        D: 肌肉強度都不見了
      teacher_note: （第四段）— 原稿印在選項 B 右側
    - index: 3
      answer: A
      stem: 為什麼陳彥博說磁北極六百五十公里極限馬拉松是他的夢想起點？
      options:
        A: 因為他獲得好成績，也有成就感，所以願意繼續挑戰
        B: 他夢想五年內挑戰世界七大洲、八大站的超級馬拉松
        C: 他認為夢想存在的價值在於制定計畫並且勇於執行
        D: 他利用這場賽事進行肌肉復健，加速復健的速度
      teacher_note: （第二段，這場比賽帶給他的感動無可言喻。）
      placement_note: document.xml 把這個文字方塊排在第 2 題之後、第 3 題之前，PDF p6 印在第 3 題題幹右側，內容也是解釋第 3 題。歸給第 3 題。
    - index: 4
      answer: B
      stem: 第六段說陳彥博『超越自己的極限』，下列哪一項最能說明這句話的意思？
      options:
        A: 跑出極地馬拉松的世界紀錄
        B: 克服癌症，完成自己的夢想
        C: 磁北極極限馬拉松獲得第三名
        D: 他成功登上喜馬拉雅的高山
      teacher_note: （第四段及第六段）— 原稿印在選項 B 右側
    - index: 5
      answer: C
      stem: 根據本文，哪一項最能表現陳彥博的精神？
      options:
        A: 充滿智慧，眼光長遠
        B: 寬宏大量，有容乃大
        C: 不屈不撓，永不放棄
        D: 身體強壯，精力過人
      teacher_note: （第六段）— 原稿印在選項 C 右側

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  # ⚠️ 灰框列了 11 個，比「本課語詞」多一個「咽喉癌」（本課語詞只有 10 個）。原稿如此。
  target_words: [咽喉癌, 殊榮, 歷屆, 無可言喻, 插曲, 崩潰, 家常便飯, 執著, 痛快淋漓, 頑強, 罹癌]
  grid_size: [10, 10]
  grid:
    - 謝天土無可奈痛快淋漓
    - 家上壤大可何轉瞬即逝
    - 如常態之嘆言解而刃迎
    - 鯁在便於別論喻麻執虛
    - 咽喉癌飯水泡歷醉著弱
    - 讚經年累月屆張賁脈血
    - 嘆罹特殊擊垮目不轉睛
    - 不癌榮凝聚力崩潰沉重
    - 已陳彥博勇於挑戰文插
    - 頭緒頑強感寂孤喝采曲
  answers_are_graphical: true
  # ⚠️ 11 個框全部畫在 p7，格子沒有跨頁。10 個是橘色、**「咽喉癌」那個是黑色**
  #    （document.xml 裡它的線色是 tx1，其餘 10 個是 accent2）—— 顏色不同不代表它不是
  #    答案：11 個語詞對 11 個框，逐一對得上。
