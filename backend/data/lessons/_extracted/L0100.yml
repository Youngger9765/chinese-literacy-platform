    9 個代號對應 8 道小題；I.精誠所至，金石為開 未被任何一題用到。
    代號組成 = 語詞框 10 個扣掉「保護令」（見 meta._總表_對照note）。
  answer_carrier: 橘色手寫代號（PDF p4）；文字層的（　）內已填有同樣的代號
  items:
    - {index: 1, stem: 做科展過程雖然艱辛，但她以(    )的態度完成了研究。, answer: C}
    - {index: 2, stem: 明天要上台報告，他很焦慮，一整晚(    )。, answer: B}
    - {index: 3, stem: 經歷那場火災後，他變得像（    ）一樣，一聽到警鈴就害怕。, answer: A}
    - {index: 4, stem: 她的前男友(    )，使她不得不報警以保護自己。, answer: H}
    - {index: 5, stem: 她不懂得與人相處的(    )，常讓人覺得不舒服。, answer: E}
    - {index: 6, stem: 他參加志工服務的(    )，是希望用自己的力量幫助需要的人。, answer: G}
    - {index: 7, stem: 他肇事逃逸的行為已經(    )法律，因此被法院定罪。, answer: F}
    - {index: 8, stem: 看見暗戀的人走來，他不禁(    )，臉紅到了耳根。, answer: D}
  items_note: |-
    第 3 題的括號原稿用**全形**（　），其餘七題用半形(  )；本檔照抄。
    答案代號在文字層已填在括號內，本檔把括號還原成空白、代號放進 `answer`。

# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論作者觀點與寫作目的
  strategy_type: reading_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本節 15 個），PDF p5~p6 可見
  single_vs_multi_note: |-
    有印「（請打勾，單選）／（複選）」的照著標；**沒有印標記**的，依 ☑ 的個數判定
    （1 個 → single、2 個以上 → multi）。⛔ 沒有硬套「小試身手一律複選」那種形狀啟發式。
  blocks:
    - type: concept_box
      text: |-
        閱讀說明文或議論文時，讀出「作者的觀點」和「寫作目的」，才能完全理解文章。我們用底下❶～❹步驟來讀出「作者的觀點」和「寫作目的」。
        ❶確認議題：文章主要在談什麼？
        ❷推論觀點：作者對這個議題提出什麼看法或主張？
        ❸找支持證據：作者用哪些案例、事實、法律或說明支持觀點？
        ❹推論寫作目的：作者想讓讀者知道、相信或採取什麼行動？
        接下來，我們練習用這個閱讀策略，來找出作者的觀點與目的。

    - type: guide
      text: 一、推論本文作者觀點與目的

    - type: guide
      text: |-
        步驟❶確認焦點
        1.問自己：這篇文章在談「哪個主題」？
        2.祕訣：看標題＋開頭兩段，判斷主題關鍵字。
        ◎小試身手：

    - type: single
      prompt: 〈你以為的浪漫，可能是跟騷〉，這篇文章在談哪個主題？
      options: {1: 浪漫與跟騷的區別, 2: 浪漫的行為, 3: 《跟蹤騷擾防治法》}
      answer: 1

    - type: guide
      text: |-
        步驟❷推論作者觀點（可和「步驟❸找支持證據」同時進行）
        1.問自己：作者對文章事件的看法或主張？支持或反對？
        2.祕訣：(1)找出表達情緒語詞（開心/害怕…）或例子方向（好/壞）。
        (2)勾選觀點。
        ◎小試身手

    - type: multi
      prompt: (1)閱讀課文後，選出表達被跟騷者情緒的語詞（請打勾，複選）
      options:
        1: 感到壓力越來越大
        2: 聽到腳步聲便緊張回頭
        3: 夜裡輾轉難眠
        4: 收到禮物後感到溫馨自在
      answers: [1, 2, 3]

    - type: single
      prompt: (2)判斷選出的語詞是正面或負面的
      options: {1: 正面, 2: 負面}
      answer: 2

    - type: single
      prompt: (3)作者對持續違反意願的追求提出什麼看法？
      options: {1: 只要真心，就是浪漫, 2: 不受歡迎的追求，可能成為跟騷}
      answer: 2

    - type: guide
      text: |-
        步驟❸找支持證據
        1.問自己：作者用什麼證據說服我？
        2.祕訣：通常作者會用「案例、數據、法律、名言」當支持證據。

    - type: multi
      prompt: ◎小試身手：找一找，本文用什麼證據說服讀者？（請打勾，複選）
      options: {1: 情境案例, 2: 名人採訪, 3: 法律規定, 4: 統計數據}
      answers: [1, 3]

    - type: guide
      text: |-
        步驟❹推論寫作目的
        1.問自己：作者想要讓我知道、相信或採取什麼行動？
        2.祕訣：呼籲句、結論段重點
        ◎小試身手
        (1)第五段寫道，如果遭遇跟騷，你有權明確表達拒絕，甚至報警。末段呼籲：「如果真心喜歡，就從尊重開始！」

    - type: multi
      prompt: "(2)作者想讓我知道："
      options:
        1: 喜歡一個人要不顧一切、以浪漫方式追求
        2: 追求異性時，要尊重對方的意願，避免觸法
        3: 遭遇騷擾時，可以明確拒絕並尋求協助
      answers: [2, 3]

    - type: guide
      text: |-
        二、挑戰題：
        再讀一個短文，看看你是否可以讀出作者的主要觀點和寫作目的。

    - type: passage
      paragraphs:
        - 別讓紙吸管成為下一個塑膠袋
        - 為響應減塑，許多飲料店改用紙吸管。但不少消費者已養成用完即丟的習慣，因此常一次拿幾支吸管，以備不時之需。環保團體調查發現，一些觀光區紙吸管一週的垃圾量竟高於過去使用塑膠吸管時期。此外，多數紙吸管難以有效回收處理，最終仍將送進焚化爐。減塑真正該做的是「少用一次性吸管」，而非僅將材質從塑膠換成紙。下次點飲料前，先問自己──我真的需要吸管嗎？

    - type: guide
      text: |-
        步驟❶確認焦點
        1.問自己：這篇在談「哪個主題」？

    - type: single
      prompt: 2.這篇文章主要關注哪個主題？（請打勾，單選）
      options: {1: 塑膠袋污染, 2: 一次性吸管帶來的環境問題}
      answer: 2

    - type: guide
      text: |-
        步驟❷推論作者觀點
        1.問自己：作者對這個主題有什麼看法？支持、反對？

    - type: single
      prompt: 2.根據標題與短文內容，作者主要的看法為何？（請打勾，單選）
      options: {1: 紙吸管能解決塑膠污染問題, 2: 應該減少使用一次性吸管，而非僅更換材質}
      answer: 2

    - type: guide
      text: |-
        步驟❸找支持證據
        1.問自己：作者用什麼說服我？

    - type: multi
      prompt: 2.文中哪兩項資訊用來支持作者觀點？（請打勾，複選）
      options:
        1: 調查發現某些景點的紙吸管垃圾量甚至比塑膠吸管更多
        2: 多數紙吸管仍難以有效回收，只能送入焚化爐
        3: 飲料店為消費者提供紙吸管，增加了消費成本
      answers: [1, 2]

    - type: guide
      text: |-
        步驟❹推論寫作目的
        1.問自己：作者想要影響我什麼？

    - type: single
      prompt: "2.作者寫這篇短文想讓我知道："
      options:
        1: 提醒讀者減少飲料的購買頻率
        2: 鼓勵讀者盡量不要使用一次性吸管
        3: 鼓勵讀者多使用紙吸管而非塑膠吸管
      answer: 2

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能判斷作者對關切主題的觀點。
        - 2.我能找到支持作者觀點的證據。
        - 3.我能檢查推論出的寫作目的，是否符合前面的觀點與證據。
        - 4.我能用這四個步驟閱讀另一篇文章。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿四個 □ 都沒有勾

    - type: guide
      text: ※如果你四項都打勾，恭喜你，表示你已經學會用 4 步驟「推論作者觀點與寫作目的」，你超厲害的！

# ── 六 文章重點表 ──
keypoints:
  title: 你以為的浪漫可能是跟騷
  layout: list
  instruction: 請根據課文內容，整理浪漫與跟騷的判斷方式，以及遇到跟騷時可以採取的行動。
  answer_carrier: 橘色手寫字（PDF p7）；文字層的【　】內已填有同樣的答案
  rows:
    - label: 主題
      value: 你以為的浪漫可能是跟騷
      value_note: 原稿最上面這一列的左欄印「主題」、右欄印課名，是表格的第一列不是表頭。
    - label: 情境案例
      value: 阿哲反覆追求小芳，小芳【　】很大，甚至失眠。
      blanks: [{answer: 壓力}]
    - label: 迷思來源
      value: 愛情電影常把糾纏行為美化為浪漫，容易誤導觀眾產生錯誤認識。
    - label: 法律標準
      value: 《跟蹤騷擾防治法》：若反覆或持續對特定人做出違反其意願、且與【　】有關的行為，造成對方【　】，並影響【　】，就可能構成「跟蹤騷擾」。
      blanks:
        - {answer: 性或性別}
        - {answer: 恐懼或焦慮}
        - {answer: 學習、工作或日常生活}
    - label: 判斷關鍵
      value: 如何區別浪漫和跟騷，關鍵在是否【　】對方的意願，及是否取得【　】。
      blanks:
        - {answer: 尊重}
        - {answer: 同意}
    - label: 行動建議
      value: 遭遇跟騷時，可以明確表達【　】，向可信任的【　】求助；情況嚴重時，可【　】或依法申請【　】。
      blanks:
        - {answer: 拒絕}
        - {answer: 大人}
        - {answer: 報警}
        - {answer: 保護令}
    - label: 結語
      value: 真正的喜歡要從尊重他人開始。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: D
      stem: 下列選項「  」中的語詞，何者使用錯誤？
      options:
        A: 小強每天送早餐、寫紙條給小芳，「死纏爛打」的追求讓人反感
        B: 自從發生意外後，小美像「驚弓之鳥」，聽到車聲就嚇得發抖
        C: 與人互動時，應尊重彼此「界線」，不輕易干涉別人的選擇
        D: 每次聽到警車聲，他就「怦然心動」，又是緊張又是害怕
      explanation_note: 本題**沒有**浮動解析框（第 1 題的解析原稿就沒有印）。
    - index: 2
      answer: B
      stem: 作者描寫愛情電影中的誇張追求和唯美畫面，其主要目的為何？
      options:
        A: 說明電影的追求情節已經構成法律上的跟騷
        B: 提醒許多人易被電影影響，誤以為那就是浪漫
        C: 說明浪漫與跟騷只要依照行為形式就能區分
        D: 強調音樂與唯美畫面能使追求較不易觸法
      explanation: 第2題解析：作者描述電影情節讓觀眾「誤以為這就是浪漫的模樣」，暗示大眾易受電影影響而產生錯誤認知。
      explanation_note: 原稿是一個浮動說明框，印在題目右側；在 document.xml 裡排在第 1 題選項之後。
    - index: 3
      answer: C
      stem: 下列何者最符合本文的主旨？
      options:
        A: 只要真心付出並持續追求，最終就能感動對方
        B: 愛情電影裡的浪漫情節都不切實際，千萬不能當真
        C: 真正的喜歡應尊重對方意願；忽視拒絕的追求可能觸法
        D: 遇到跟蹤騷擾要自保、勇敢反擊，以免自己受害
      explanation: 第3題解析：本文重點在提醒讀者「你以為的浪漫，可能是跟騷」，強調尊重他人意願的重要。
      explanation_note: 說明框裡另有一段殘留的重複片段「意願的重要。」，見 errata E2，未收進本檔。
    - index: 4
      answer: A
      stem: 如果你發現朋友有像阿哲那樣死纏爛打的行為，你會給他哪一項建議最符合本文的觀點？
      options:
        A: 勸他尊重對方的決定，不要再干擾對方
        B: 鼓勵他更加熱情地表達愛意，對方終會被感動
        C: 要他暫時先放棄，隔一段時間再繼續嘗試
        D: 建議他設計更有創意的驚喜，好讓對方回心轉意
      explanation: 第4題解析：文章強調真正喜歡一個人就應該尊重對方意願，因此遇到朋友糾纏他人時，最符合本文觀點的建議是勸他停止干擾、尊重對方的決定。
      explanation_source_text: 第4題解析：文章強調真正喜歡一個人就應該尊重對方意願，因此遇到朋友纠纏他人時，最符合本文觀點的建議是勸他停止干擾、尊重對方的決定。)
      errata_ref: E1
      explanation_note: 說明框裡另有一段殘留的重複片段「議是勸他停止干擾、尊重對方的決定。」，見 errata E3，未收進本檔。
    - index: 5
      answer: B
      stem: 若有人不斷在網路社群標註你、留言「我愛你」，使你感到困擾，依文章觀點，下列哪一種處理方式較適當？
      options:
        A: 默默刪除留言或退出群組，不要讓人知道
        B: 清楚告知對方停止，若仍持續，可向大人求助
        C: 找好朋友去警告，再不停止會有嚴重後果
        D: 對方畢竟是好意，保持安靜，不理會不處理
      explanation_note: 本題**沒有**浮動解析框。

# ── 八 詞語複習 ──
