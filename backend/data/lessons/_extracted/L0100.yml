    - {index: 7, word: 觸犯, definition: 違反法律或規定，或冒犯他人。}
    - {index: 8, word: 驚弓之鳥, definition: 鳥兒曾經被獵人的弓箭所傷，再看見弓時，就害怕起來。形容一個人曾經受過驚嚇或傷害，變得非常敏感。}
