    路徑 9 條 → 沒有「紙上 > 路徑」的缺條警報。
    ⚠️ 紙外殘留：本課 9 個框的線色**全部**硬寫死 `srgbClr E97132`（不是佈景色 accent2），
    所以「硬寫死＝殘留」那條旁證在本課**不成立**，不能拿來判定；改以「9 框 ↔ 9 詞 ↔ 9 條路徑
    全部拼得回」當證據。posOffset 判準亦零命中（群組錨在 column +0.81in，遠在頁內）。
    ⚠️ 格子裡有多個誘答：第 1 列「精成所致」（成/致 是同音替換）、第 4 列「棄而不舍」（舍/捨），
    第 5 列第 3~4 格排得出「初衷」但它不在灰框、圖上也沒圈。

