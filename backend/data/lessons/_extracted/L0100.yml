  items:
    - {index: 1, word: 保護令, definition: 法院為保護當事人的安全，而發出禁止對方靠近、聯絡的命令。}
    - {index: 2, word: 死纏爛打, definition: 糾纏不休、讓人厭煩，形容不知分寸的強求。}
