# ── 一 讀全文-做記號 ──
body:
  header_level: Level 7・記敘文
  header_strategy: 目標策略：科學推理策略──用科學步驟解決問題
  header_extra: 科學探究法
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 請在重要的地方、喜歡的語詞、句子或段落做記
  checklist_note: 第 2 條在 PDF p1 被文字方塊邊界裁掉尾字，印成「…段落做記」；文字層就是這樣（沒有「號。」）
  paragraph_count: 17
  paragraphs:
    - idx: 1
      text: 科學探究，是一種系統性解決問題的方法。科學家觀察自然界的現象，產生「研究問題」後，會先對這個問題提出暫時性的答案，稱為「研究假設」；接著蒐集證據，檢驗假設是否獲得支持，最後根據證據提出合理的解答。其實，警察辦案也常運用類似的程序：「發現問題、提出假設、檢驗假設、提出解答」。底下是世界聞名的刑事鑑識專家李昌鈺博士親身經歷的故事。
    - idx: 2
      text: 有位72歲的老太太獨居在美國康乃狄克州的一個城市裡。這天是感恩節，外面大雪紛飛。中午，一位鄰居烘了一個餅，請小孩送到老太太家，希望她在團圓的節日裡，不致於太孤苦伶仃。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 3
      text: 孩子拿著餅，按鈴、敲門都沒人應，只好逕自開門走進，一進房，小朋友尖叫一聲，血液都冰凍了。她看見老太太倒在廚房裡，一動也不動，已經死去。
    - idx: 4
      text: 當天晚上十二點，世界聞名的刑事鑑識專家李昌鈺博士從床上爬起來接電話，電話那頭說：「李博士，我們是警局的重案小組，這裡發生了一樁令人髮指的命案，要請您移駕過來看看。」李昌鈺立刻著衣，冒著大雪趕到現場。
    - idx: 5
      text: 李昌鈺到了現場，先問在場辦案的警方人員：「你們來多久了？」
    - idx: 6
      text: 「十小時了。」法醫同時報告：「老太太被刺了18刀，凶刀就是廚房的刀，被丟在洗碗槽裡。」
    - idx: 7
      text: 李昌鈺環顧四周，問：「十八刀？血呢？」地上沒有血。他馬上提出兩個假設：血跡已經清理過了，或者，這裡不是第一現場。
    - idx: 8
      text: 李昌鈺請同仁在廚房地板上噴化學藥品，這種藥品和血液裡的鐵離子反應後，會放出藍色螢光。一噴完藥，看起來乾淨的地板，在關燈後，赫然出現大片藍色螢光的血跡反應。李昌鈺判斷，清理現場需要一段時間，凶手很可能是老太太的熟人，清楚知道她的作息與交往關係，這才敢留在現場清理血跡。此外，凶手踩過血跡之後留下的幾個鞋印，也因為藥品的緣故清楚顯現，經過比對，這是彪馬牌球鞋，從球鞋的大小，可以推斷出凶手的身高。
    - idx: 9
      text: 他立刻下了一個指令，派出200名刑警去翻找附近所有的定置垃圾箱，目標是找到凶手的球鞋。同仁問：「今天是感恩節團聚的日子，不能隔兩天再去找嗎？」李昌鈺回答：「不行，兵貴神速，現在就要動員，今晚不搜，明天垃圾會去哪裡？垃圾場。垃圾場太大、垃圾太多，很難找，即使找到了，也早被汙染了。」
      footnote: 美國社區在街角放置垃圾箱，讓附近的居民把家裡的垃圾丟在垃圾箱裡，半夜時，垃圾車再把垃圾箱裡的垃圾收走。
      footnote_note: 原稿的頁尾註腳 1，掛在本段「定置垃圾箱」之後
    - idx: 10
      text: 動員令下達25分鐘之後，指揮中心收到回報：找到球鞋了。鑑識人員立刻檢驗這雙鞋，鞋上有血點，而且從鞋子裡的毛髮，可以初步判斷鞋子的主人可能是白人，但到底這個人是誰呢？
    - idx: 11
      text: 李昌鈺說：「鞋子是不是在購物中心旁邊的垃圾箱找到的？」
    - idx: 12
      text: 同仁答：「是的，你怎麼知道？」
    - idx: 13
      text: 李昌鈺說：「別管我怎麼知道的，快去找那個購物中心的運動用品店或鞋店的老闆。」
    - idx: 14
      text: 老闆三更半夜被電話吵醒，刑警請他回憶，前一天有沒有一個白人來買鞋子？老闆查了店裡的記錄，找到前一天下午，有一個男人用信用卡買了一雙鞋子，警方立刻查出信用卡的主人和地址。
    - idx: 15
      text: 清晨六點。「叮咚！叮咚！」男人睡眼惺忪地開門，門外滿是警察，在詢問後，這位年輕的白人承認昨天殺了老太太。
    - idx: 16
      text: 凶手是老太太的遠親，有吸毒的惡習，老太太偶爾請他到家裡幫忙，工作之後會給他一點錢。昨天感恩節，凶手去找老太太要錢，老太太不給，兩人起了爭執，凶手情緒失控出手打昏了老太太，他害怕老太太醒來會報警，便一不做二不休，拿了廚房的刀殺死了老太太。
    - idx: 17
      text: 案子破了。你能看到李博士「發現問題、提出假設、檢驗假設、提出解答」的辦案過程嗎？一個沒有人目睹、線索有限的凶案，李博士和他的團隊用鑑識科學，替無聲的死者說話，終於讓正義得到伸張。
  # 課文右緣印的累計字數（從 ☞ 所在的第 2 段起算）
