  char_count_note: |-
    🔵 **六個端點全部吻合，但要套 Word 的「一串阿拉伯數字算 1 個字」口徑**：
    段2 實際 83 字、內含「72」→ Word 算 82 ＝ 印出的 82 ✓
    ＋段3(67) ＝ 149 ✓｜＋段4(99) ＝ 248 ✓｜＋段5(29) ＝ 277 ✓
    ＋段6（實際 43、內含「18」→ 42）＝ 319 ✓｜＋段7(56) ＝ 375 ✓（最後一個數字）
    ⛔ 不要因為「83≠82」就判成段落抓錯 —— 兩處差額都精準落在數字串上。
    所以朗讀範圍是第 2～7 段。
