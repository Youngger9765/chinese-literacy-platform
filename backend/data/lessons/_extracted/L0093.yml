  vocabulary_bank: [孤苦伶仃, 逕自, 移駕, 惺忪, 環顧, 赫然, 一不做二不休, 令人髮指, 兵貴神速, 目睹]
  answer_carrier: 橘色手寫字（PDF p4）；文字層的空格內已填有同樣的答案
  items:
    - {index: 1, word: 赫然, definition: 突然出現或發現，讓人感到吃驚。}
    - {index: 2, word: 惺忪, definition: 剛睡醒，瞇著眼，看不清楚的樣子。}
    - {index: 3, word: 令人髮指, definition: 使人憤怒到了極點，頭髮都豎了起來。}
    - {index: 4, word: 逕自, definition: 不等別人同意或回應，自己直接去做。}
    - {index: 5, word: 孤苦伶仃, definition: 孤單、無依無靠。}
    - {index: 6, word: 環顧, definition: 觀察周圍。}
    - {index: 7, word: 一不做二不休, definition: 事情既然已經開始，就索性做到底，不再中途停止。多用來形容不好的事情。}
    - {index: 8, word: 移駕, definition: 敬語，客氣地請對方前往某地。}
    - {index: 9, word: 兵貴神速, definition: 做事要把握時機，迅速行動。}
    - {index: 10, word: 目睹, definition: 親眼看見某件事情發生。}

