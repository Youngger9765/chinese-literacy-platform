      第 1 條（連續的非中文字串算 1 個字）：第 4 段有「30公分」「20公分」「30公」，
        第 5 段有「30公分」「A4」「1882年」。
      第 5 條（破折號 `U+2014` 一個字都不算）：第 4 段開頭「新的問題來了——」2 個、
        第 5 段「共同演化」的結果——」2 個。
    只套第 1 條的話 第 4 段前半算 173、第 5 段算 195，四個界線**全部差 1~2**
    （173／188／194／389）；兩條都套才落在 172／187／193／387。
    第 2 條（註腳）不必套：footnotes.xml 是空的。第 3 條（分節小標算字數）本課**要照算**
    而且已經算進去了。第 4 條（variation selector）不必套：計數區間內沒有。
    ⚠️ 第 6~9 段沒有配到數字 —— 字數欄停在第 5 段，屬 SKILL 記過的常見形狀。
    ⚠️ PDF 上數字欄整體上移約一行（193 印在「器長達 30 公」那一行、220 印在
       「分的蛾類…」那一行），不要照視覺位置反推段界；上面的算式才是硬證據。
