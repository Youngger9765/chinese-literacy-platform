  inline_marked_terms_note: |-
    課文裡被加了字元外框的語詞（PDF 上是方框），八個等於本課語詞。「繁衍」加框兩次
    （第 4、5 段各一次）。有底線的是專名（達爾文／非洲／馬達加斯加島／馬達加斯加），
    那是強調不是語詞標記。

