    - word: 輻射
      cells: [[5, 8], [5, 9]]
      direction: horizontal
    - word: 意味深長
      cells: [[5, 6], [6, 5], [7, 4], [8, 3]]
      direction: diagonal_down_left
    - word: 世紀
      cells: [[6, 2], [7, 2]]
      direction: vertical
    - word: 月相變化
      cells: [[7, 6], [8, 7], [9, 8], [10, 9]]
      direction: diagonal_down_right
    - word: 幽閉
      cells: [[7, 9], [8, 10]]
      direction: diagonal_down_right
