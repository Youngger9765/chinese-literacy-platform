  answer_paths_note: |-
    10 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。
    幾何交叉驗證（單向警報）：以找字表格元素當邊界，表格內、扣掉紙外殘留後的 roundRect
    = **10 個**，路徑 10 條 → 沒有「紙上 > 路徑」的缺條警報。
    ⚠️ **紙外殘留：未驗**（判準只認錨點型溢出，對排版推出型零命中，2026-08-18 更正）；
    扣掉未偵測的殘留只會讓紙上數更少，不會讓警報成立。正確性證據是拼字 10/10。
    全文 11 個，多的 1 個在表格外，不是漏抽的答案。
    ⚠️ **格子跨頁**：第 1~4 列印在 PDF p7、第 5~10 列印在 p8。
    p7 上除了前四列的圈之外，格子下方還畫了幾個看似空白的橘框 —— 那是終點落在
    p8 的路徑（意味深長／月相變化／幽閉／世紀／輻射）的圈線整組留在 p7 的結果。
    只讀 p8 會判成「這課只圈了重啟一個」。兩頁都要讀。

