    ⛔ 兩張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 table/fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
  layout_note: |-
    ⚠️ 「◎小試身手」的比較表在 PDF p6 上印在「七 閱讀理解」標題之後，看起來像閱讀理解的題目；
    `document.xml` 的元素順序是 ◎小試身手 → 指示語 → 表格 → 七閱讀理解，所以它屬於第六大題。
    是浮動標題方塊被推到表格上方造成的假象。
  blocks:
    - type: concept_box
      text: |-
        之前我們學過，可以將文章內容整理成表格。比較表能把兩個對象的相關訊息放在同一列，幫助我們快速看出相同與相異之處。這一課要再學一步：看到兩邊的細節後，想出它們共同在比較什麼，替這一列取一個清楚的「比較項目」名稱。整理比較表格的步驟如下：
        ❶找比較對象：這張表要比較哪兩個對象？把它們寫在表格對象列。
        ❷找同列細節：找出同一列中不同對象可以互相比較的細節，用筆畫起來。
        ❸問共同項目：把兩個或多個細節放在一起，問：「它們都在說哪一個項目？」
        例如：「阿波羅計畫從1969年~1972年」及「2022年NASA重啟阿提米絲登月計畫」，這二者比較的共同項目，可以命名為「年代」。
        ❹填入並檢查：把項目和細節填進同一列，確認兩格都在回答同一個項目。
        (5)將文章細節填入細格。

    - type: table
      columns: [項目　　　　對象, 對象１, 對象２]
      rows:
        - [項目１, 文章細節, 文章細節]
        - [項目２, 文章細節, 文章細節]
      table_note: |-
        這是概念說明框裡的示意表（不是要填的題目），原稿是巢狀在說明框內的小表格。
        PDF p5 上「項目１」「項目２」兩格加了紅框強調 —— 那是在標示「這一欄就是你要命名的比較項目」，
        不是答案勾選。

    - type: guide
      text: ◎小試身手

    - type: guide
      text: 請依照上面的步驟，完成以下的表格。

    - type: fill_table
      columns: [項目　　　　對象, 阿波羅計畫, 阿提米絲計畫]
      answer_carrier: 橘色手寫字（PDF p6）；文字層的【　】內已填有同樣的答案
      rows:
        - 項目　　　　對象: |-
            範例
            【　】
          項目　　　　對象_blanks: [{answer: 計畫特色}]
          阿波羅計畫: 實現人類登月夢想
          阿提米絲計畫: 強調性別、族裔多元參與
          row_note: 第一列是原稿already印好的範例（項目名已填），供學生參照。
        - 項目　　　　對象: 【　】
          項目　　　　對象_blanks: [{answer: 代表神話人物}]
          阿波羅計畫: 太陽神阿波羅
          阿提米絲計畫: 月亮女神阿提米絲
        - 項目　　　　對象: 【　】
          項目　　　　對象_blanks: [{answer: 執行時間}]
          阿波羅計畫: 1969年~1972年
          阿提米絲計畫: 2022年~2025年
        - 項目　　　　對象: 【　】
          項目　　　　對象_blanks: [{answer: 太空人的背景}]
          阿波羅計畫: 12位太空人都是男性
          阿提米絲計畫: |-
            第一位女性太空人與
            第一位有色族裔太空人

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: D
      stem: 下列文句中的語詞，何者使用正確？
      options:
        A: 他故意把一句話拉得很長，顯得十分「意味深長」
        B: 她站在山頂「仰望」山谷中的清幽景致 (由高往低看是「俯視」）
        C: 這個「艱鉅」的任務，必須花五分鐘才能解決(前後句矛盾）
        D: 臺灣文化發展蓬勃，節慶的慶祝方式十分「多元」
      explanation: (邏輯錯誤）
      explanation_note: |-
        橘色小字，印在題幹右側（指的是選項 A）。選項 B、C 後面另有各自的橘色教師註，
        在文字流裡，照原樣保留在選項字串內；三處都是左半形括號配右全形括號。
    - index: 2
      answer: C
      stem: NASA 2022年的登月計畫命名為「阿提米絲」，請問最可能代表的意義是什麼？
      options:
        A: 阿提米絲是月亮的守護之神
        B: 代表人類再度登往月球，恢復往日榮光
        C: 用女性的名字傳達性別平等的時代來臨
        D: 之前已使用「阿波羅」，現在接著用他姐姐的名稱
      explanation: （第三段提到阿提米絲計畫不但要再度登月，還要讓「女性」送上太空。）
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 之前
    - index: 3
      answer: A
      stem: 根據本文的敘述，你認為下列何種情況可能會在2025年美國國家航空暨太空總署（NASA）登月計畫內發生？
      options:
        A: 太空衣及補給用品會考量女性的需要
        B: 計畫會選擇黑人擔任登月太空人
        C: 女性擔任太空人數遠超過男性人數
        D: 至少有一半太空人穿抗輻射的背心
      explanation: （女性越來越受到重視，所以太空包也會有女性專屬的物品）
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 之前
    - index: 4
      answer: C
      stem: 一個描述希臘神話人物阿波羅和阿提米絲異同的表格裡，第一列比較性別（男、女）、第二列比較代表的星球（太陽、月亮），第三列的左右欄分別寫著「陽剛威猛」和「溫柔婉約」的細節，請問，下列選項中，哪一個名稱，最適合填入這個對比的「比較項目」？
      options:
        A: 道德優勢
        B: 心理韌性
        C: 性格特質
        D: 星座運勢
      answer_note: 原稿的答案代號用全形「Ｃ」，其餘題用半形；本檔一律記半形。
    - index: 5
      answer: B
      stem: 以下是2022年阿提米絲計畫執行內容的說明，何者有誤？
      options:
        A: 計畫的目的可以獲得更多數女性太空人的數據
        B: 計畫中的太空人不能再選白人男性（文中並未提到）
        C: 內含假人模型，模仿成年女性的骨骼、肌肉器官
        D: 使用兩具假人的目的是為了對比背心的防護效果
      stem_note: 題幹的「有誤」加了底線；選項 B 後面的「（文中並未提到）」是橘色教師註，在文字流裡，照原樣保留。

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  instruction_note: 原稿同時存在「劃掉」版與「刪除」版兩句（兩個重疊的文字方塊），表格正上方印的是「劃掉」版。
  target_words: [天體, 月相變化, 意味深長, 世紀, 重啟, 偏見, 消耗, 幽閉, 輻射, 族裔]
  target_words_note: 灰框 10 個詞，比本課語詞（12 個）少「承載」「模擬」—— 那兩個沒進找字遊戲，不是抽漏。
  grid_size: [10, 10]
  grid:
    - 藥寶體玉天體啟消兔玉
    - 度長偏變相寶偏門耗道
    - 量見聞月消玉兔搗藥味
    - 重折新族裔記世日思意
    - 化變相日中意門輻射核
    - 三世童啟味射偏粥相消
    - 清紀相深幅月方清幽關
    - 老兔長藥門色相搗門閉
    - 族王裔重啟不同變世記
    - 長見天開動耗子味化緣
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 天體
      cells: [[1, 5], [1, 6]]
      direction: horizontal
    - word: 消耗
      cells: [[1, 8], [2, 9]]
      direction: diagonal_down_right
    - word: 偏見
      cells: [[2, 3], [3, 2]]
      direction: diagonal_down_left
    - word: 族裔
      cells: [[4, 4], [4, 5]]
