# ── 四 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號印在題號前的（　）裡，文字流有此資訊；第 4 題的代號印成全形（Ｃ），其餘半形
  questions:
    - index: 1
      answer: D
      stem: 根據第二段的說明，「溫室效應假說」主要在說明哪一件事？
      options:
        A: 地球本來就會自己變冷變熱，所以近年暖化只是自然循環
        B: 近年天氣變得特別古怪，因此都市人對暖化感受最為明顯
        C: 二氧化碳排放量逐漸升高，所以兩條曲線後來一起往上爬升
        D: 大量二氧化碳使部分熱量不易散出，所以地球逐漸升溫
    - index: 2
      answer: B
      stem: 第四段為什麼要把時間拉長到 40 萬年來看地球溫度變化？
      options:
        A: 為了說明圖一和圖三的資料有限，因此前面的說法都要放棄
        B: 為了提醒讀者改變觀看尺度以後，推論近年暖化要更小心
        C: 為了證明遠古人類已會大量燃燒燃料，因此很早就影響氣候
        D: 為了證明近年暖化只是自然循環，因此與人類活動沒有關係
      note: |-
        題幹寫「40 萬年」，課文第 4 段與圖四標題寫的是「42 萬年」。
        看起來是取整數的講法（不是把 42 抄錯成 40 的那種形狀），
        兩種讀法都通，所以照原樣抄、不列勘誤、不替教材決定。
    - index: 3
      answer: A
      stem: 本文運用四張圖組織說明，主要有什麼作用？下列哪一項最能說明這一篇文章的寫作手法和意圖？
      options:
        A: 多元呈現地球暖化及可能解釋，提醒讀者整合證據並審慎推論
        B: 藉由四張圖介紹暖化現象，直接證明人類活動就是唯一原因
        C: 藉由四張圖整理不同看法，批評部分科學家忽略整體的證據
        D: 藉由四張圖練習答題技巧，提醒學生只要熟記圖表就能作答
      teacher_note: 第3題解析：這篇文章不是只在傳遞暖化知識，更重要的是藉由四張圖帶學生學會比較不同訊息、整合圖文、並在推論時保持審慎。
    - index: 4
      answer: C
      stem: 如果老師要你只用一句話分別概括圖一和圖二的功能，下列哪一組最合適？
      options:
        A: 圖一看近代升溫速度，圖二看長時間冷熱循環
        B: 圖一看排放與氣溫趨勢，圖二看熱量移動變化
        C: 圖一看升溫現象變化，圖二看暖化可能原因
        D: 圖一看生活感受例子，圖二看人類歷史發展
      teacher_note: 圖一主要是升溫的趨勢現象，圖二則是溫室效應的機制示意。
    - index: 5
      answer: A
      stem: 下面哪一種做法，最符合這一課教的「圖文整合閱讀策略」？
      options:
        A: 先讀文字抓重點，再到圖中找和文字對應的訊息，最後整合
        B: 先把整篇文字讀完，再回頭一次把四張圖全部快速看完
        C: 先看圖片猜出大意，再靠自然科的知識補上沒有寫明的內容
        D: 先挑最容易的圖來看，只要圖看懂了就不必細讀文章內容
