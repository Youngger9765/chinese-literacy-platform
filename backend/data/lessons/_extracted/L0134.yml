# ── 一 讀全文 ──
body:
  explanation_box: 遇到圖文題時，不能只看文字，也不能只看插圖，眼睛必須在文、圖間來回移動，把文圖的關係弄清楚，才能又快又正確地答題。這一課我們用地球升溫這個話題來學習如何閱讀、解答圖文題。前一課從圖開始，本課從文字開始；不論先讀哪一邊，最後都要找出圖文對應與互補的訊息，再合起來判斷。
  title_line: 第13課  從四張圖看地球暖化
  paragraph_count: 5
  paragraphs:
    - idx: 1
      text: 近年來的天氣愈來愈古怪，四、五月已經熱到汗流浹背，冬天了居然還有颱風警報。這些現象，讓人不禁懷疑：地球是不是愈來愈熱了？不過，要回答這個問題，不能只靠生活中的感受，而要看長期的平均氣溫變化。圖一中，縱軸為0.0所對應的橫線，代表20世紀的平均氣溫。從圖一可看出，1850年以來，地球平均氣溫整體愈來愈高，1975年以後，地球開始快速升溫。而且，2024年為有記錄以來的最暖年。其它研究顯示，2024年的平均氣溫比20世紀高1.29°C，比19世紀高1.46°C；1975年以後，平均氣溫上升的速度比1975年之前加快了３倍。
    - idx: 2
      text: 為什麼地球氣溫會逐漸升高呢？「溫室效應假說」是目前獲得較多證據支持的解釋——工業革命以來，人類開始大量燃燒煤、石油等化石燃料，因此，大量的二氧化碳（CO2）被釋放到大氣層，過多的二氧化碳，就好像給地球穿上一件厚外套，讓太陽照到地球的熱量，有一部分沒有辦法散到太空去，地球就愈來愈熱了，如圖二。
    - idx: 3
      text: 圖三進一步說明了「二氧化碳排放量（點點線）」和「全球氣溫（虛線）」共同上升的趨勢。可以看出，從1880年到2025年，二氧化碳的排放量愈來愈高，地球氣溫也隨之上升。兩條曲線的前半段還算平穩緩升，但後半段曲線往上爬的角度變大，亦即，二氧化碳排放和全球氣溫，兩者的上升速度都加快了。❶~❹的圓框則說明溫室效應的推論歷程。
    - idx: 4
      text: 但是，並非所有的科學家都認為這一、兩百年來的升溫是人類燃燒石化燃料所致，有些科學家把時間拉長來看，畫出地球史上平均溫度的變化情形，如圖四。在這個圖裡，橫軸的時間長達42萬年，而地球溫度曲線本來就有高有低——低下去的「∪形」就是「冰河期」，高起來的「倒∪形」就是「發燒期」。你可以點數一下，這42萬年裡，冰河期和升溫期各有出現多少次？此外，人類的祖先大概在10萬年前才從非洲走出，開始向全球各地遷徙，那時人類還不會「大量燃燒化石燃料」，因此，10萬年以前地球幾次的「發燒期」就不可能是人類大量燃燒化石燃料造成的，而是「自然發生」的。亦即，近年的暖化現象「也許」只是地球氣溫長期變化中的一小段，「不一定」和人類使用化石燃料有關。
    - idx: 5
      text: 總結來說，雖然近代科學家找到了一個新的、很強的解釋，可以說明地球暖化，但地球本來就會自己變冷或變熱，所以到底今天地球暖化的原因為何？在推論時，還需要特別小心才行。
  # 課文中的四張插圖（不佔段號）。整張圖的字都畫在像素裡（含圖標題），所以整個節點標 image。
  figures:
    - id: 圖一
      after_paragraph: 1
      asset: word/media/image4.png
      text_carrier: image
      title: 圖一：近兩世紀地球暖化程度示意圖
      content: |-
        折線圖（數條深淺不一的折線疊在一起）。
        縱軸刻度：1.2／1.0／0.8／0.6／0.4／0.2／0.0／-0.2
        橫軸刻度：1850／1875／1900／1925／1950／1975／2000／2025
        圖內灰底標注：（1975年後，地球快速升溫）
        圖下方三個指向橫軸的方框標籤（由左到右）：阿公阿嬤出生／爸媽出生／你出生
        （「你出生」那一個是黑底白字，位置在 2020 附近）
        折線整體由左下往右上，1975 之後坡度明顯變陡，最右端來到最高點。
      placement_note: 圖排在第 1 段之後、第 2 段之前（PDF p2 中段）

    - id: 圖二
      after_paragraph: 2
      asset: word/media/image5.png
      text_carrier: image
      title: 圖二：溫室效應示意圖
      content: |-
        照片式示意圖（黑色太空背景、左上角太陽、右下方地球）。
        標籤：太陽（指向左上角光球）／地球（指向右下方星球）
        對話框：溫室氣體（如二氧化碳）替地球穿上一層外套，把部分來自日光的熱能困住，讓地球升溫了。
        太陽射出多條波浪形（彈簧狀）曲線斜向地球；
        地球上方有一條橫貫畫面的大弧形線（＝溫室氣體形成的「外套」）；
        大弧形線與地球之間有山形（來回彈跳）曲線 ＝ 被困住的熱能；
        另有帶箭頭的曲線穿過弧形線往外太空 ＝ 散出去的熱能。
      placement_note: 圖排在第 2 段之後、第 3 段之前（PDF p3 中段）

    - id: 圖三
      after_paragraph: 3
      asset: word/media/image6.png
      text_carrier: image
      title: 圖三：二氧化碳排放量和氣溫升高息息相關（1880~2025）
      content: |-
        上排四個圓角方框（推論歷程）：
        ❶燃燒化石燃料｜工廠、汽車、火力發電會排放大量氣體。
        ❷二氧化碳變多｜支持者認為，空氣中的CO2明顯增加，
        ❸熱更難散出去｜向蓋上更厚的被子，地球散熱更慢。   ← 「向」疑為「像」，見 source_errata E1
        ❹近代氣溫上升｜因此，近年的全球均溫就一步一步往上升。
        下方折線圖圖例：CO2（點點線）／全球均溫（長虛線）
        橫軸刻度：1880／1950／2025
        圖內三個直書方框標籤（由左到右）：阿公阿嬤出生／爸媽出生／你出生
        兩條曲線都由左下往右上，後半段坡度變陡，CO2 那條始終在全球均溫那條之上。
      placement_note: 圖排在第 3 段中間（PDF p3 下半）

    - id: 圖四
      after_paragraph: 4
      asset: word/media/image7.png
      text_carrier: image
      title: 圖四：地球近42萬年來的平均氣溫變化示意圖
      content: |-
        面積折線圖。
        縱軸標題：相對現代溫度變化（℃）；刻度 6／4／2／0／-2／-4／-6
        橫軸標題：距今時間（萬年前）；刻度 40萬年／35萬年／30萬年／25萬年／20萬年／
        15萬年／10萬年／5萬年／現在
        黑底白字標籤：暖化期 ×3（約 38 萬年前、約 17 萬年前、最右端「現在」附近）
        白底方框標籤：冰河期 ×2（約 26 萬年前、約 6 萬年前，兩處都畫成黑色實心低谷）
        曲線反覆出現「∪形」低谷與「倒∪形」高峰。
      figure_note: |-
        圖上寫「暖化期」，課文第 4 段寫「發燒期」，聚光燈題目寫「較暖時期」——
        三種說法都是原稿印的，不統一。
      placement_note: 圖排在第 4 段中間（PDF p4 下半）

# ── 二 閱讀聚光燈 ──
spotlight:
  strategy_name: 圖文整合閱讀策略——先文後圖，再整合
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: |-
    紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）26 個，PDF p5~p9 全部可見；
    填空題（圖二標題、兩大星體、練習三與練習四的步驟❹）是橘色手寫，也在文字層。
  note: |-
    五個練習（練習一~四各對一段一圖，練習五統整），每個練習底下是步驟❶~❹。
    原稿的練習標題印在一個黑框裡（w:bdr auto），這裡用 guide 呈現，框線不另外記。
  blocks:
    - type: concept_box
      text: |-
        前一課我們已經知道圖片有助於理解文章重點。讀有插圖的文章時，不能只看文字，也不能只看圖片，而要把文字和圖片對照起來讀。至於先看文字還是先看圖片，其實並沒有固定的順序。這一課，我們要練習先讀文字，再看圖片的閱讀策略。下面4個步驟可幫助我們進行圖文整合閱讀：
        ❶先讀文——抓到重點，想一想：要我從圖中看什麼
        ❷再看圖——讀懂這張圖告訴我們什麼訊息
        ❸文圖對照——從圖中找對應的訊息
        ❹整合文圖——把文和圖合起來想，文圖要表達什麼

    # ── 練習一：第一段 vs 圖一 ──
    - type: guide
      text: 練習一：第一段 vs 圖一
    - type: guide
      text: 步驟❶：先讀文——抓到文字重點，想一想：要我從圖中看什麼？
    - type: guide
      text: 小祕訣：文字會告訴我們，哪些地方要看圖。你讀到「如圖一」「如圖二」這些提示詞時，就要看圖，並問自己這段要你看圖的什麼？
    - type: free_text
      prompt: 1.在第一段畫出需要用圖一確認的訊息：整體氣溫趨勢、1975年後的變化，以及近年的高點。
      answer_carrier: 在課文上畫線；教師版把要畫的三處直接印在題目裡並加粗（整體氣溫趨勢／1975年後的變化／近年的高點）
    - type: multi
      prompt: 2.第一段的末尾提到一些事實，並非是圖一呈現的，而是「其他研究顯示」的，請你把它們選出來？（複選）
      options:
        1: 1850年以來地球平均氣溫逐年升高
        2: 1975年以後，地球升溫的情況比之前快了3倍
        3: 1975年以後，地球開始快速升溫
        4: 2024年的平均氣溫比20世紀高1.29°C
      answers: [2, 4]
    - type: guide
      text: 步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息
    - type: guide
      text: 小祕訣：看圖時，要先看標題、縱軸、橫軸分別表示什麼，再看整體方向。
    - type: single
      prompt: 1.圖一主要在說什麼？（單選）
      options:
        1: 圖一呈現不同地區在同一年的氣溫差異
        2: 圖一是張時間趨勢圖，告訴我們地球氣溫隨年代怎麼變化
      answer: 2
    - type: multi
      prompt: 2.下面哪兩個選項最能從圖一直接看出來？（複選）
      options:
        1: 1850年以來，地球平均氣溫整體呈上升趨勢
        2: 1975年以來，上升的速度加快了3倍
        3: 2024年地球的平均氣溫比19世紀高1.46°C
        4: 1975年以後，地球平均氣溫快速升高
      answers: [1, 4]
    - type: guide
