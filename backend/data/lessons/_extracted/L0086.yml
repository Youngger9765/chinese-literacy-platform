        - 正太與小豬：武僧的養成之路: |-
            （段2）正太十四歲時終於進到興福寺，剃度成為小和尚。可是負責教他的師父並沒有教他武功，只是給他一頭小豬，比貓還要小，囑咐他說：「這是你的小豬，養在菜園後面的豬圈。每天三餐之後，你要把這隻小豬從菜園抱到廚房，餵牠吃廚餘。吃飽了，你再把牠抱回豬圈，這樣明白了嗎？」
            （段3）正太說：「明白了。」
            （段4）但他心裡不高興，私下嘀咕著說：「不教我武功就算了，還要叫我養豬？要從平地的豬圈走到半山腰的廚房？」可是他也沒辦法，誰叫他是全寺最菜的人呢，只好照做了。
          自我提問: |-
            第2～4段
            師父叫正太養豬，和他想學武功有什麼關係？
        - 正太與小豬：武僧的養成之路: |-
