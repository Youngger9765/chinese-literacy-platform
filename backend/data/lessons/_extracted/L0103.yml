    - {index: 1, word: 兩全其美, definition: 一件事同時顧到兩方面，讓兩方面都能獲益。}
    - {index: 2, word: 脫穎而出, definition: 在眾人中顯露出優秀的表現。}
    - {index: 3, word: 籌措, definition: 設法準備或募集需要的錢、物品。}
    - {index: 4, word: 坐困愁城, definition: 形容情況艱難，沒有出路，而且無力擺脫。}
    - {index: 5, word: 口碑, definition: 眾人口耳相傳的評價。}
    - {index: 6, word: 靈機一動, definition: 突然想到了解決問題的方法。}
    - {index: 7, word: 虜獲, definition: 吸引並獲得。本文指獲得評審的喜愛。}
    - {index: 8, word: 雲集, definition: 許多人從各地聚集在一起。}
    - {index: 9, word: 桂冠, definition: 原指月桂葉編成的冠帽，後來比喻比賽中的最高榮譽。}
    - {index: 10, word: 大為嘆服, definition: 很讚嘆、佩服。}
    - {index: 11, word: 層出不窮, definition: 形容接連不斷地出現，好像永遠不會停止。}

