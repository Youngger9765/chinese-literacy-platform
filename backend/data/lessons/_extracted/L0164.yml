# ── 原文＋注釋（不編號）──────────────────────────────────────────
classical_text:
  label: 原文
  source: 宋朝・王安石
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  paragraphs:
    - 金谿民.方仲永，世.隸耕。仲永.生五年，未嘗.識書具，忽啼.求之。父異焉，借旁近.與之。即書.詩四句，並.自為其名。
    - 其詩以.養父母、收族為意，傳一鄉秀才.觀之。自是.指物作詩.立就，其文理.皆有可觀者。邑人.奇之，稍稍賓客.其父，或以.錢幣.乞之。父.利其然也，日扳仲永.環謁於邑人，不使學。
    - 予聞之.也久，明道中，從先人.還家，於舅家.見之，十二三矣。令作詩，不能稱.前時之聞。又七年，還自揚州1，復到.舅家，問焉。曰：「泯然2.眾人矣。」
  paragraphs_note: 本課原文有完整的斷詞點「.」（L0153 那課的指示語留著但沒排斷詞點）。1／2 是原稿印的注釋標號。
  annotations:
    - {"no": 1, term: 還自揚州, text: '1.還自揚州：這個句子中的「還」意思是「回來」；「自」的解釋是「從」。配合後方的地名，整句翻譯成「從揚州回來」。'}
    - {"no": 2, term: 泯然, text: 2.泯然：消失的樣子。}
  annotations_note: |-
    本課注號 2 個、注釋 2 條，一一對應（L0153 那課是 3 個注號對 5 條注釋）。
    ⚠️ 本課的「1.」「2.」是**文字流裡的字面字元**（L0153 那課是 Word 自動編號、不在文字流），
    所以照抄進 text；`no` 欄另存數字供程式使用。

