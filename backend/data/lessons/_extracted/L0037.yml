# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列語詞，何者使用正確？
      options:
        A: 籃球比賽時，兩方人馬「面面相覷」，防守嚴密
        B: 那本漫畫十分有趣，讓他看得「津津樂道」。
        C: 他對於事情的解釋前後矛盾，讓人感到「匪夷所思」
        D: 他的報告把事情說得「唯妙唯肖」，內容清楚又有條理
      teacher_note: 第1題詳解：A.指的是大家驚訝、慌張、困惑或尷尬樣子。B.指高興地談論。D.模仿得非常傳神、生動、像極了原本的樣子)。
    - index: 2
      answer: D
      answer_printed_as: Ｄ      # 原稿印全形
      stem: 第五段說：「狗盜先生捧了個包袱進來，白狐裘雪亮的光芒帶來了活下去的希望。」這裡的「活下去的希望」最可能代表什麼？
      options:
        A: 有了白狐裘，孟嘗君可以再次收買更多食客，幫助他逃難
        B: 白狐裘象徵孟嘗君的誠意，可能讓秦國君王重新考慮釋放他
        C: 白狐裘的光芒喚醒了孟嘗君求生的意志，使他下定決心逃亡
        D: 代表孟嘗君終於能滿足幸姬的條件，換取她出面求情的機會
    - index: 3
      answer: A
      stem: 哪一個選項正確描述了孟嘗君從赴秦到成功逃離秦國的順序？
      options:
        A: 獲邀赴秦→被誣陷軟禁→食客協助脫困→成功逃離秦國
        B: 獲邀赴秦→被誣陷軟禁→幸姬主動求情→食客回贈白狐裘
        C: 獲邀赴秦→食客盜取白狐裘→秦王震怒→追殺孟嘗君
        D: 因白狐裘被奪失信秦王→求助食客→食客讓幸姬求情→逃離秦國
    - index: 4
      answer: B
      answer_printed_as: Ｂ      # 原稿印全形
      stem: 文中說：「他必須趁著秦昭王還在美人窩裡昏睡時，儘快離開險地，以免秦昭王清醒後突然又開始『想念』孟嘗君。」這裡的「想念」最可能代表什麼意思？
      options:
        A: 秦昭王想再見孟嘗君一面，當面解釋誤會
        B: 秦昭王後悔放走孟嘗君，重新生出殺意
        C: 秦昭王覺得孟嘗君的才能可貴，想重新任用孟嘗君
        D: 秦昭王回憶兩人曾經的交情，希望孟嘗君能常伴左右
      teacher_note: (「想念」在日常語境中是帶有情感的正面詞，但在這段話中，是帶有隱含殺意的諷刺轉義，代表秦昭王情緒反覆、心懷殺機。)
      stem_quote_note: 題幹引文把課文第七段的「以免他清醒後」寫成「以免秦昭王清醒後」（代名詞改成人名），語意相同；照原樣記錄，不列勘誤
    - index: 5
      answer: C
      stem: 孟嘗君最後能夠逃出秦國的關鍵因素是什麼？
      options:
        A: 他自己機智過人，靠自己想出所有辦法逃脫
        B: 秦昭王心軟，主動赦免孟嘗君讓他自由離開
        C: 食客們發揮各自的專長，幫助孟嘗君化解危機
        D: 齊國軍隊立刻出兵支援，幫助孟嘗君逃出秦國
      teacher_note: (雞鳴與狗盜先生的技能看似無用，但在關鍵時刻發揮出力量，解救孟嘗君。)

