# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略—推論情緒和感受
  strategy_type: inference
  blocks:
    - type: concept_box
      text: |-
        請試著讀底下的文字，再回答一個問題：
        「晚間新聞正播報明天的天氣預報，爺爺坐在電視前的沙發上，早就進入夢鄉。」

    - type: single
      prompt: 問題：爺爺有聽到明天的天氣預報嗎？
      options: {1: 有聽到, 2: 沒有聽到}
      answer: 2
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊

    - type: concept_box
      text: |-
        在回答這個簡單的問題時，你已經在做推論了。
        你看，「爺爺睡著了，所以沒有聽到天氣預報」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」的過程，最近的流行語叫做「腦補」哦。
        閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！
        這篇故事描述公車上發生的爭執，文中角色的情緒起伏很大，但故事並沒有直接寫出角色的情緒或感受，我們可以透過兩個方法來推論：
        ①理解現場情境：人物遇到什麼事？
        ②觀察角色言行：人物說了什麼？做了什麼？表情、語氣？
        接下來，我們就用這兩個方法，練習推論角色──「大媽」的情緒和感受。並進一步瞭解故事想傳達的深層意義。

    - type: guide
      text: 一、推論情緒和感受有方法

    - type: sub_block
      label: (一)理解現場情境
      instruction: 小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。試著站在角色的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: single
          label: ❶找情境
          prompt: 故事一開始，大媽上公車後看到什麼？（請在□打勾）
          options:
            1: 一位年輕的女生坐在博愛座，而車上其他人都站著。
            2: 女生主動起身讓位，大媽馬上坐到了博愛座。
          answer: 1
        - type: single
          label: ❷推情緒
          prompt: 面對這種情況，你猜大媽的心情是什麼？為什麼？（請在□打勾）
          options:
            1: 生氣，因為她認為年輕人不該坐博愛座。
            2: 驚喜，因為有人馬上讓座給她。
          answer: 1

    - type: sub_block
      label: （二）觀察角色言行
      instruction: 小祕訣：角色「說的話、動作、表情、語氣」常常偷偷告訴我們他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。
      quote: 段5：大媽眉毛一挑：「我都沒得坐，小孩子裝個病，就有博愛座？真了不起！」
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: guide
          label: ❶情境
          text: 情境：生氣
        - type: multi
          label: ❷找動作
          prompt: 她「眉毛一挑」，這個動作通常表示什麼？（請打勾，可複選）
          options: {1: 驚訝, 2: 不高興, 3: 想笑, 4: 輕視}
          answer: [1, 2, 4]
        - type: single
          label: ❸推想法
          prompt: 你覺得「真了不起」的意思是什麼？(單選)
          options:
            1: 她年紀小，生病居然膽敢去坐博愛座，勇氣值得稱讚。
            2: 她在稱讚，司機先生明察秋毫、願意助人，值得稱讚。
            3: 她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。
          answer: 3

    - type: concept_box
      label: 什麼是「說反話」？
      text: |-
        當一個人有情緒時，卻說出和當時情緒相反的話語，很可能就是在「說反話」。
        1.很生氣卻說出「讚美」的話
        你犯了嚴重錯誤，夥伴說：「你真的很天才啊！」
        2.或很失望卻說出「感謝」的話
        導師被你們氣壞了，說：「感謝老天讓我教到你們這班！」

    - type: sub_block
      label: 在本課中出現好幾次「說反話」的例子
      instruction: 在本課中出現好幾次「說反話」的例子：
      items:
        - type: guide
          index: 1
          text: 1.段5：大媽明明不高興，卻說國中女生「真了不起！」
        - type: free_text
          index: 2
          prompt: 2.段8：明明看大媽不順眼，乘客卻用哪4個字稱讚她？
          answer: 真了不起
        - type: free_text
          index: 3
          prompt: 3.在段5和段8之間還有一句6個字的反話，請你找到，寫在下面。
          answer: 好有正義感呀

    - type: guide
      text: ◎你發現了嗎，文章中沒有直接寫出來人物內心的情緒與感受，我們可以透過「理解現場情境」（站在人物的角度）與「觀察角色言行」來推敲喔。

    - type: sub_block
      label: 二、從故事發展，推論「大媽」的情緒或感受變化
      columns: [事件, 關鍵線索, 「大媽」的情緒或感受]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: single
          index: 1
          event: 大媽一上車，看見年輕女生坐在博愛座
          clue: 板起臉、嚷道「誰家小孩這麼沒教養...」
          options: {1: 生氣、不滿, 2: 驚訝、不解}
          answer: 1
        - type: single
          index: 2
          event: 聽到司機解釋女生身體不舒服
          clue: 眉毛一挑，說：「小孩子裝個病...，真了不起！」
          options: {1: 稱讚女生厲害, 2: 不服氣、語氣諷刺}
          answer: 2
        - type: single
          index: 3
          event: 阿姨出聲挺女生
          clue: 提高音量：「唷，好有正義感呀...」
          options: {1: 覺得被針對、更生氣, 2: 真心佩服阿姨講得很好}
          answer: 1
        - type: single
          index: 4
          event: 聽到有人出聲批評她
          clue: 更大聲回嗆：「……我說個話也不行了嗎？」
          clue_source_text: 更大聲回嗆：「….，我說個話也不行了嗎？」
          errata_ref: E2
          options: {1: 覺得開心，有人注意到, 2: 被批評，火氣更大了}
          answer: 2
        - type: single
          index: 5
          event: 司機廣播警告
          clue: 「我要去投訴你...」
          options: {1: 想冷靜坐下來, 2: 憤怒不甘}
          answer: 2
        - type: single
          index: 6
          event: 老奶奶說女生真的生病了，願意讓座
          clue: 臉紅、連忙擺手說：「…我馬上到站了。」
          options: {1: 尷尬、丟臉、自覺理虧, 2: 還在生氣、不想理會}
          answer: 1
        - type: single
          index: 7
          event: 車子一停
          clue: 提著大包小包一溜煙下車
          options: {1: 慚愧或丟臉、急著離開現場, 2: 假裝什麼也沒發生}
          answer: 1

    - type: multi
      label: 三、推論主旨或目的
      prompt: 從大媽的說話、語氣、動作，我們可以看到她一開始因誤會而「生氣」，後來在老奶奶提醒後，轉為「尷尬」與「慚愧」。最後，讓我們來想想，透過大媽的轉變，這個故事想要告訴我們什麼？（請在□打勾，複選）
      options:
        1: 人會因為理解而改變態度
        2: 發脾氣是解決問題的最好方法
        3: 善意可以化解衝突、消除誤會
        4: 不用了解情況，吃虧時就應該生氣
      answer: [1, 3]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊

    - type: sub_block
      label: 四、換你試試看，推論其他角色的情緒或感受
      items:
        - type: free_text
          index: 1
          prompt: 1.段六：女生都快哭出來了，勉強要站起來。女生當時最可能的情緒是什麼？
          answer: 害怕、委屈
        - type: free_text
          index: 2
          prompt: 2.段八：人群聲音：「幹嘛呀，都幾歲了，還這樣講話？真了不起！」講這句話的人，最可能的情緒是什麼？
          answer: 忿忿不平／不屑

    - type: self_check
      label: ◎自我檢核
      instruction: 一、請你自己檢查以下3項，確定自己是否會推論情緒和感受了
      items:
        - 我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
        - 我會思考人物說的話是不是真心話，推測他隱藏的真正情緒。
        - 我能把故事前後線索連起來，推論大媽情緒的變化，並明白故事想傳達的道理。
      closing: 二、如果三項都打勾，恭喜你，你已經學會推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！

# ── 六 文章重點表 ──
keypoints:
  title: 美好的一天
  structure: flat
  rows:
    - label: 事件起點
      value: 一位女生上了公車，臉色慘白，司機請她去【　】
      blanks: [{answer: 坐博愛座}]
    - label: 衝突引爆
      value: |-
        1.一位【　】上車後看到女生坐在博愛座，大聲指責。
        2.【　】解釋，但大媽繼續罵。
      blanks: [{answer: 大媽}, {answer: 司機}]
    - label: 衝突擴大
      value: |-
        1.女生勉強要站起來，一位阿姨阻止女生讓座，認為博愛座是給需要的人坐的。大媽提高音量罵人
        2.其他乘客也開始議論怎麼這樣講話大媽回應，說話不行嗎？
        3.司機廣播請大家控制音量，不要干擾其他乘客
        大媽要【　】
      blanks: [{answer: 投訴}]
      note: 版面在「…人坐的。」「…這樣講話」「…其他乘客」之後各印一個 → 連接下句；箭頭是圖形物件，不在文字流，故不寫進 value
    - label: 關鍵轉折
      value: 老奶奶出面支持女生，願意【　】。
      blanks: [{answer: 讓座}]
    - label: 結局
      value: 大媽【　】，全車掌聲，司機以「美好的一天」作結尾
      blanks: [{answer: 尷尬下車}]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 課文中有幾位不認識國中女生的陌生人，都出來對大媽說話了，下列哪一個詞，最能夠形容這些人的共同特點？
      options:
        A: 熱心公益
        B: 誠懇善良
        C: 智慧溫暖
        D: 見義勇為
    - index: 2
      answer: A
      stem: 從「女生都快哭出來了，勉強要站起來」，可以推測女生當時想做什麼？
      options:
        A: 她感到害怕，想把座位讓給大媽
        B: 她覺得休息夠了，不想再坐
        C: 她生氣地想站起來跟大媽爭吵
        D: 她正好要下車，所以站起來
    - index: 3
      answer: A
      stem: 從司機在故事中「說的話、做的事」，可以推論他是個怎樣的人？
      options:
        A: 關心乘客，也懂得處理衝突的人
        B: 凶巴巴又不講理的人
        C: 冷淡、不關心乘客的人
        D: 害羞、不敢說話的人
    - index: 4
      answer: B
      stem: 這篇故事主要想表達什麼？
      options:
        A: 不舒服的時候可以坐博愛座，司機會幫忙留座位
        B: 互相體諒和幫助可以化解誤會，讓一天變得美好
        C: 在公車上大吵大鬧會被司機趕下車
        D: 年紀大的人通常比較有智慧，要聽從長者意見
    - index: 5
      answer: C
      stem: 故事中哪一個人物的舉動讓事情發生了轉折，走向美好的結局
      options:
        A: 司機在廣播中警告大聲喧嘩的乘客
        B: 旁邊的阿姨安慰女學生不要讓座
        C: 白髮老奶奶主動將座位讓給大媽
        D: 有人路見不平大聲譴責那位大媽
      teacher_note: （故事的轉折點在於白髮老奶奶站出來關心生病的女生，並願意把自己的座位讓給大媽）

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [示意, 側目, 火藥味, 局面, 不可收拾, 顫顫巍巍, 尷尬, 一溜煙, 路見不平]
  grid_size: [10, 10]
  grid:
    - 瓦礫不可收拾翻騰本顫
    - 敢怒不敢言輕稻收顫訓
    - 錯徒顫抖囑而契巍限練
    - 火拯救唱咐易巍金局有
    - 藥滴落行舉示意風滯素
    - 味水側目無倖議一靈敏
    - 寒氣逼人大存積溜馬路
    - 抱頭鼠竄局量啄煙看見
    - 遣尷派持面苦撐待縫不
    - 尬循序漸進暑廢墟隙平
  answers_are_graphical: true
  # ⛔ 本課字陣上「一個圈都沒有」——教師版答案未印。
  #    依 skill：沒圈到就整個省略 answer_paths，不寫空 list，更不可自己算路徑填進去。
  answers_printed: false
  render_note: |-
    文字流有完整 100 字（10×10），但 DOCX→PDF 轉出的版面只印第 2~10 列，
    第 1 列「瓦礫不可收拾翻騰本顫」被分頁切掉（p9 末與 p10 首皆無）。
    grid 以文字層為準；Word 原生版面是否同樣切掉未經證實。

# ── 九 語詞書寫練習 ──
writing_practice:
  instruction: 寫一寫：本課有一些語詞字形比較複雜，我們來練習書寫這些語詞，請先看著寫一遍，然後蓋起來考自己兩遍，最後檢查是否寫對了，若正確，在格子裡打V。
  columns: [語詞, 抄寫, 蓋起來考自己, 檢查（V）]
  words: [顫顫巍巍, 尷尬]
