# ── 一 讀全文-做記號 ──
body:
  # ⚠️ marking_instruction 放在 body 底下：split_lesson_modules.py 只搬對照表上的頂層
  #    key，放頂層會被靜默丟掉。
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號
  reading_tip: 讀文章時，隨時留意自己的理解和感受，並且用筆做記號，可以讓你和文章更有連結喔！
  paragraph_count: 5
  # 段號欄印 ㄧ二三四五（首字是注音符號 ㄧ，不是漢字 一）。
  # ⚠️ 第 5 個號碼「五」印在第 2 頁「的尊敬及喝采。」那一行旁邊，但那行是第 4 段的句尾
  #    （「贏得全國人民」＋「的尊敬及喝采。」是同一句）。跨頁後號碼欄的行距失去同步，
  #    真正的第 5 段是縮排起首的「其實比賽就像是一場模擬的人生」。
  paragraphs:
    - idx: 1
      text: 「戴資穎戴資穎第一名，戴資穎戴資穎我愛妳~~~」這一句洗腦的廣告臺詞，是否也在你的周遭出現？她就是臺灣第一人，累計214周排名世界第一的球后──戴資穎。
    - idx: 2
      text: 小戴即使在強大的壓力下，仍然堅持維持自己的風格。小戴相信攻擊是最好的防禦，總是主動出擊，她追求完美的邊角球和難以預測的穿越角度，她的攻擊千變萬化，讓對手摸不著頭緒。雖然這樣的進攻方式會提高失誤率，但如果要她打穩定的安全球風，小戴就不是小戴了。這就是她獨特的地方，也是她迷人之處。
    - idx: 3
      text: 2021年8月1日，小戴在東京奧運金牌賽的轉播收視率創下新高，這場小戴與陳雨菲的龍爭虎鬥，戰況勢均力敵，全臺觀眾守在電視前，目不轉睛。小戴一得分，大家歡天喜地、讚嘆不已；不幸鷹眼判定小戴的殺球出界，大家不免唉聲嘆氣、捶胸頓足。一場比賽帶出全國人民不可思議的凝聚力和向心力！
    - idx: 4
      text: 小戴在最後一局落後七分時，依然面不改色的一分一分追回來，她的每一下揮拍、每一次扣殺，都是在和自己比賽，她沒有因為想贏得比賽而選擇保守，她選擇的是做自己、用自己擅長的方式戰鬥，她要掌握比賽的節奏，她拚盡全力攻擊。雖然球評都指出小戴打得太精采了，但她最終還是以三分之差不敵對手的嚴密防守，只能奪得銀牌。下場時，小戴落寞的神情，讓全國粉絲們的心都揪了起來。受訪時，她卻不改大俠的性子，說：「盡力了，不後悔。」球迷們留言鼓勵。她，打得漂亮，雖然輸了比賽，卻贏得了人心，贏得全國人民的尊敬及喝采。
    - idx: 5
      text: 其實比賽就像是一場模擬的人生，有一些障礙你可以克服，也有一些不可控制的疑難雜症，「贏了值得開心，輸了也不必難過」，小戴面對挫折的坦然與勇氣、永不放棄的精神，值得我們學習，因為只要你沒有輸了自己，比賽就會一直持續下去。
  inline_marked_terms: [防禦, 摸不著頭緒, 龍爭虎鬥, 勢均力敵, 目不轉睛, 讚嘆不已, 鷹眼, 唉聲嘆氣, 捶胸頓足, 凝聚力, 拚, 落寞, 揪, 喝采, 疑難雜症]

