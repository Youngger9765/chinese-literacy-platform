# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法——用例子與道理支持主旨
  section_title_printed: 閱讀聚光燈
  answer_carrier: |-
    紅色 ☑（w:sym Wingdings F0FE，在文字層）共 22 個 + 橘色手寫填空 +
    **紅色字元框線 w:bdr color=EE0000** 3 個（轉折詞「但／但／竟然」）。PDF p6~p9 全部可見。
  blocks:
    - type: concept_box
      text: |-
        這篇文章先提出問題、交代背景，再用五個「外在困境＋內在選擇」的例子說明道理，最後明確說出主旨。作者不是只把主旨講出來，而是讓每個例子先形成一個概念，再由多個概念共同支持主旨。
        我們來學習作者的寫作手法：
        1.文章結構安排：導入問題→背景→具體例子與道理→總結主旨
        2.主旨如何形成的：例子（故事）→概念（道理）→主旨（總結句）

    # ── 一、寫作手法：看見本文的結構 ──
    - type: guide
      text: |-
        一、寫作手法：看見本文的結構
        本文採用「導入問題→背景→例子與道理→總結主旨」的結構，請參考課文，並在【  】填入對應的段落數。

    - type: fill_table
      columns: [結構, 導入問題, 背景, 例子與道理, 總結主旨]
      rows:
        - 結構: 段落數
          導入問題: 【　】
          導入問題_blanks: [{answer: '1'}]
          背景: 【　】
          背景_blanks: [{answer: 2～4}]
          例子與道理: 【　】
          例子與道理_blanks: [{answer: 5～9}]
          總結主旨: 【　】
          總結主旨_blanks: [{answer: '10'}]

    # ── 二、先找主旨（明示） ──
    - type: guide
      text: |-
        二、先找主旨（明示）
        本篇的主旨明示在結尾段。閱讀其他文章時，可以先查看開頭、結尾，以及反覆出現的觀念。

    - type: single
      prompt: 1.請在主旨段落，找出本文明示的主旨。（單選）
      options:
        1: 外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇。
        2: 法蘭柯戰後創設意義治療法，幫助很多人。
      answer: 1

    - type: single
      prompt: 2.把主旨拆成兩個「關鍵面向」（單選）
      options:
        1: 痛苦很可怕 vs 人要更堅強
        2: 外在可能被奪走 vs 內在仍可選擇
      answer: 2

    # ── 三、主旨怎麼來的？ ──
    - type: guide
      text: |-
        三、主旨怎麼來的？從例子中的轉折，推出本文的道理
        你已經知道文章結構與主旨，接下來，我們要從段5~9例子中的轉折推出概念，再檢查這些概念如何共同支持主旨。

    - type: concept_box
      text: |-
        （一）例子→概念：用例子中的轉折推出作者想說的道理
        這篇文章的每一個例子，都有一個「轉折」，把讀者從「A：外在很糟」推向「B：內在仍能…」。用A襯托B，讓B成為重點。
        以下例子，請你圈出或補上轉折詞，再判斷作者透過這些例子要凸顯什麼概念？

    - type: exercise
      label: （一）例子→概念
      note: 表格四欄（欄名照原稿）：段／原文（請圈出或在【】補上轉折詞）／轉折：對比什麼（單選）／欲凸顯的概念
      answer_carrier: |-
        「原文」欄的轉折詞答案有兩種載體：第 5、6、7 段是**紅色字元框線**（w:bdr color=EE0000）圈住
        「但／但／竟然」；第 8、9 段是印在【 】裡的橘字「但」。原稿混用兩種寫法。
      items:
        - type: sub_block
          label: 段5
          items:
            - type: free_text
              prompt: 集中營裡食物匱乏，一口麵包都可能關乎生死，但仍有瘦弱的難友把最後一口麵包分享出去。
              answer: 但
              answer_carrier: 紅色字元框線（w:bdr color=EE0000）圈住「但」
            - type: single
              prompt: 轉折：對比什麼（單選）
              options: {1: 飢餓匱乏vs人情溫暖, 2: 生存壓力vs道德選擇}
              answer: 2
            - type: free_text
              prompt: 人仍能決定【　】的高度
              blanks: [{answer: 道德／品格}]
        - type: sub_block
          label: 段6
          items:
            - type: free_text
              prompt: 獄卒辱罵：「你們根本不配喝這碗湯。」但有難友情緒不受影響，只說：「他們罵的不是事實…」
              answer: 但
              answer_carrier: 紅色字元框線（w:bdr color=EE0000）圈住「但」
            - type: single
              prompt: 轉折：對比什麼（單選）
              options: {1: 外界羞辱vs內在界線, 2: 羞辱言語vs情緒麻木}
              answer: 1
            - type: free_text
              prompt: 我可以選擇不讓【　】定義我
              blanks: [{answer: 謊言／羞辱}]
        - type: sub_block
          label: 段7
          items:
            - type: free_text
              prompt: 年輕女子失去所有親人、即將離世，她竟然是「愉快的」…仍能感恩
              answer: 竟然
              answer_carrier: 紅色字元框線（w:bdr color=EE0000）圈住「竟然」
            - type: single
              prompt: 轉折：對比什麼（單選）
              options: {1: 死亡逼近vs仍能感恩, 2: 失去親人vs轉移注意}
              answer: 1
            - type: free_text
              prompt: 我仍能抓住【　】來得到平靜與感恩
              blanks: [{answer: 智慧與想像}]
        - type: sub_block
          label: 段8
          items:
            - type: free_text
              prompt: 腳凍傷、腫脹、踉蹌前行，【　】靠想念太太最終走到目的地
              blanks: [{answer: 但}]
            - type: single
              prompt: 轉折：對比什麼（單選）
              options: {1: 走不動vs有人幫忙, 2: 身體痛苦vs愛與期待}
              answer: 2
            - type: free_text
              prompt: 【　】能支撐我走下去
              blanks: [{answer: 愛與期待}]
        - type: sub_block
          label: 段9
          items:
            - type: free_text
              prompt: 一群瘦骨嶙峋、失溫顫抖的難友，【　】能被黎明之美打動、能心存驚嘆
              blanks: [{answer: 但}]
            - type: single
              prompt: 轉折：對比什麼（單選）
              options: {1: 外在剝奪vs內在感受, 2: 星光vs晨光}
              answer: 1
            - type: free_text
              prompt: 人的內在仍保有【　】
              blanks: [{answer: 對美的感受力／尊嚴}]

    - type: guide
      text: |-
        （二）概念→主旨：五個概念是否能支持主旨？
        主旨：外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇。
        主旨是一句話，但你要看見：前面的概念如何共同支撐它：在壞事不可逆轉時，我仍可決定什麼？（以下均為單選）

    - type: exercise
      label: （二）概念→主旨
      note: 表格四欄（欄名照原稿）：段／概念（道理）／是否支持主旨／我可以決定什麼
      items:
        - type: sub_block
          label: 段5
          items:
            - type: single
              prompt: 即使情況壞到極點，人仍能決定自己道德與品格的高度
              prompt_note: 這是表格「概念（道理）」欄的內容；本題問的是「是否支持主旨」欄
              options: {1: 是, 2: 否}
              answer: 1
            - type: single
              prompt: 我可以決定什麼
              options: {1: 先活下去最重要, 2: 守住品格／選擇善良}
              answer: 2
        - type: sub_block
          label: 段6
          items:
            - type: single
              prompt: 我們不能阻止別人說什麼，但我們可以選擇不讓謊言定義我。
              prompt_note: 這是表格「概念（道理）」欄的內容；本題問的是「是否支持主旨」欄
              options: {1: 是, 2: 否}
              answer: 1
            - type: single
              prompt: 我可以決定什麼
              options: {1: 不把羞辱當真／不被假話控制, 2: 只要忍耐就不會受傷}
              answer: 1
        - type: sub_block
          label: 段7
          items:
            - type: single
              prompt: 在死亡前一刻，仍然有人能靠著想像而感恩
              prompt_note: 這是表格「概念（道理）」欄的內容；本題問的是「是否支持主旨」欄
              options: {1: 是, 2: 否}
              answer: 1
            - type: single
              prompt: 我可以決定什麼
              options: {1: 把痛苦當作不存在, 2: 能靠著想像感恩}
              answer: 2
        - type: sub_block
          label: 段8
          items:
            - type: single
              prompt: 不管身體有多麼痛苦，靠著愛與期待，受苦的人仍能得到鼓舞與自由
              prompt_note: 這是表格「概念（道理）」欄的內容；本題問的是「是否支持主旨」欄
              options: {1: 是, 2: 否}
              answer: 1
            - type: single
              prompt: 我可以決定什麼
              options: {1: 抓住愛與期待／保有盼望, 2: 靠身體強壯就能撐住}
              answer: 1
        - type: sub_block
          label: 段9
          items:
            - type: single
              prompt: 就算外在被剝奪到極致，人仍能保有對美的感受力，讓受苦的人短暫脫離苦境
              prompt_note: 這是表格「概念（道理）」欄的內容；本題問的是「是否支持主旨」欄
              options: {1: 是, 2: 否}
              answer: 1
            - type: single
              prompt: 我可以決定什麼
              options: {1: 看見美景就能忘記痛苦, 2: 保有對美的感受／仍能驚嘆}
              answer: 2

    # ── 四、我的發現 ──
    - type: guide
      text: 四、我的發現：

    - type: single
      prompt: 1.我學到的「方法流程」最接近哪一項？（單選）
      options:
        1: 先看結尾主旨，再回頭找一兩個例子當佐證。
        2: 先看文章結構與主旨，再用轉折抓重點，推成概念並回扣主旨。
        3: 先找到每段重點，再把看起來相似的句子圈起來整理。
      answer: 2

    - type: single
      prompt: 2.這些例子共同要支持的主張是什麼？請用一句話統整。（單選）
      options:
        1: 外在再艱難，只要互相扶持，痛苦就會慢慢減少變淡。
        2: 外在可能被奪走，但仍能在內在做選擇，決定如何回應遭遇。
        3: 外在越痛苦，越要保持樂觀，才能不被情緒拖垮。
      answer: 2

    - type: multi
      prompt: 3.下次遇到「很多例子、最後才總結」的文章，我會怎麼讀？（複選）
      options:
        1: 我先找導入問題與總結主旨，再看例子如何支持主旨。
        2: 我看到但／卻／仍／就算／原來，就提醒自己：重點多半在轉折後。
        3: 我把每個例子推出概念，再檢查這些概念能不能一起撐住主旨。
        4: 我先記住每個故事情節，主旨通常就會自然看懂。
      answers: [1, 2, 3]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（在文字層），PDF p9~p10 可見
  items:
    - index: 1
      stem: 第2段寫道：「他們一下火車，在月台上面臨與家人生離死別的『篩選』。」根據這句話的語意，「篩選」最可能強調的是什麼？
      options:
        A: 家人被要求各自排隊，按規定分流到不同車廂等待
        B: 當場被決定生死去向，家人因此被迫立刻生離死別
        C: 工作人員逐一核對資料，確認身分後再安排住宿地點
        D: 醫護人員依健康狀況檢查，協助病弱者優先接受照顧
      answer: B
      explanation: 第1題解析：「生離死別」暗示這不是普通分流或檢查，而是外在權力在月台上「一決定就改變命運」，導致家人被迫立刻分離
    - index: 2
      stem: 第3段提到：「他們的頭髮被剃光、姓名被手臂刺青編號取代。」這樣的描寫最可能想強調什麼？
      options:
        A: 人數龐大不易辨識，因此用編號管理以便點名與管控
        B: 生活規定十分嚴格，所以每個人都必須維持外表整潔
        C: 以編號取代姓名，把人變成數字並抹去身分與尊嚴
        D: 為了避免疾病傳播，所以要求剃髮並完成身分記錄
      answer: C
      answer_note: PDF p9 上這一題的答案括號被解析方塊蓋住，看起來是空的；文字層印的是「（ C ）」
      explanation: 第2題解析：作者特別寫「姓名被編號取代」，重點不只是效率或衛生，而是把人變成數字，削弱個體身分與尊嚴。
    - index: 3
      stem: 他把考卷摺了又摺，想把那些腥紅叉叉藏進書包。回家的路好長，連風吹樹葉聲，都像是在嘲笑。即使如此，回家後他仍翻開考卷，把錯的題目重新算了一遍。文中的「即使」最想凸顯的是什麼？
      options:
        A: 風吹樹葉像在嘲笑，凸顯他回家路上的失落與敏感
        B: 考得再差，心情再壞，他仍選擇面對、解決問題
        C: 只要把錯題重算一次，下次考試就一定能進步
        D: 因為害怕被責備，所以只能假裝努力來掩飾失落
      answer: B
      explanation: B「即使」引出讓步轉折，強調「條件不利（挫敗、低落）仍做出選擇（重新整理、行動）」
    - index: 4
      stem: 根據本文的寫作手法，下列哪一個流程最能說明作者是怎麼用例子把主旨「撐起來」的？
      options:
        A: 場景越驚悚→ 情緒越強烈→ 主旨越容易被接受
        B: 例子越特別→ 讀者越感動→ 主旨越顯得正確
        C: 多個例子指向同一概念→ 概念共同支撐主旨→ 主旨更站得住
        D: 先講出主旨→ 再補充故事→ 讀者更容易記住內容
      answer: C
    - index: 5
      stem: 運動會前，你被同學嘲笑「你根本不配參加比賽」。若用文中法蘭柯所說「我可以決定用什麼態度回應」，下列哪個做法最符合？
      options:
        A: 覺得對方說得有道理，決定先退出比賽，避免再被嘲笑
        B: 承認自己會難過，但不把嘲笑當成真相，繼續準備並尋求支持
        C: 當場用更刺的話回嗆對方，讓他閉嘴，維持自己的面子
        D: 裝作完全不在乎這件事，把情緒吞下去，硬撐到結束
      answer: B
      explanation: 第5題解析：C承認「我會難過」很正常，同時把嘲笑視為「別人的話」而不是「我的定義」，再選擇繼續準備、尋求支持，這就是把主導權拿回來
      explanation_note: 解析文字開頭寫「C」，但題目印的答案是 B，且解析內容描述的正是 B 選項；原稿如此，不擅自改

