  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        本課一直強調一個觀點：「成功不只靠貴人相助，自己的努力也很重要。」為了讓讀者相信這個觀點，作者舉出朱蒂努力學習、自立自強的事例，作為支持理由。
        觀點和支持理由的關係，就像桌面和桌腳：桌面要有桌腳支撐，才站得穩；觀點也要有合理的理由支持，才更有說服力。
