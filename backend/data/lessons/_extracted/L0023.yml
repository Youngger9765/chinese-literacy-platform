        2: 研究發現，晚一點上學的國中生，缺曠課較少，白天也較不易打瞌睡
        3: 研究發現，戶外活動時間較多的兒童，近視率比較低。
        4: 我認為學生每天應該增加戶外活動時間。
      right:
        A: 觀點（看法）
        B: 支持理由
      answers_printed: false
      answer_note: |-
        教師版沒有畫連線 —— 該表兩側只有文字的 ● 圓點，逐頁看過沒有任何線條
        （對照組：本批 L0019 的連連看有清楚可見的黑線與紅線）。
        依題幹用語可推得 ①④→A（皆以「我認為」起頭）、②③→B（皆以「研究發現」起頭），
        但那是我推的、不是教材印的，所以不寫進 answer。
        ⚠️ 這跟「本題沒有標準答案」不同：本題有標準答案，只是教師版沒印，
        故**不標** no_correct_answer。

    - type: guide
      text: 二、判斷觀點和支持理由的關係

    - type: guide
      text: 請讀一讀每個觀點，勾選能支持觀點的理由。（可複選）

    - type: sub_block
      label: 1.基礎題
      instruction: 1.基礎題（請打勾，多選）
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: multi
          index: 1
          prompt: (1)觀點：為了減少剩食，學校推出新菜色前，應先請部分學生試吃。
          options:
            1: 某校依試吃意見調整新菜後，剩食少了三成。
            2: 營養師表示，這道新菜含有足夠的蔬菜和蛋白質。
            3: 學生反映咖哩太辣；降低辣度後，剩食明顯減少。
            4: 這道新菜使用當季食材，食材費用比原來少了一成。
          answers: [1, 3]
        - type: multi
          index: 2
          prompt: (2)觀點：上課時，手機應統一放進教室的收納袋。
          options:
            1: 某班實施後，上課查看手機的人次從每週十五次降為三次。
            2: 小偉把手機放進收納袋後，不再一直看訊息，能專心完成練習。
            3: 許多手機都有相機、鬧鐘和計算機等功能。
            4: 同學使用的手機品牌、大小和外殼都不相同。
          answers: [1, 2]

    - type: sub_block
      label: 2.課內練習
      instruction: 2.課內練習（請打勾，多選）
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: multi
          index: 1
          prompt: (1)觀點：朱蒂是一個自立自強的人。
          options:
            1: 她替神祕的資助人取了「長腿叔叔」這個綽號。
            2: 她發現自己的程度落後後，主動訂定學習計畫。
            3: 長腿叔叔要求她上大學後按時寫信，鍛鍊文筆。
            4: 她靠自己的能力賺得稿費、獲得獎學金，還想償還資助。
          answers: [2, 4]
        - type: multi
          index: 2
          prompt: (2)觀點：朱蒂的努力，是她克服學習困難的重要原因。
          options:
            1: 面對數學和拉丁文不及格，她沒有逃避，仍繼續努力學習。
            2: 長腿叔叔提供學費和生活費，讓她有機會進入大學。
            3: 她持續閱讀與學習，從成績不及格進步到名列前茅。
            4: 她在孤兒院沒有受到完整教育，知識比其他同學落後。
          answers: [1, 3]

    - type: concept_box
      label: ★策略帶著走
      text: |-
        讀文章時，先分清楚「觀點」和「支持理由」，再看看兩者是否接得起來：
        ☆作者的觀點是什麼？
        ☆哪些事實、例子或數據是支持理由？
        ☆這些理由真的能支持觀點嗎？

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 請問哪一個句子使用語詞正確？
      options:
        A: 螞蟻的視角非常「低微」，所以看見的世界與我們大不相同
        B: 這棵樹的枝葉從圍牆外「脫穎而出」，伸到了馬路上
        C: 他總是把失敗「歸咎」於運氣不好，而不願檢討自己的問題
        D: 我仔細「瞥見」了這本書的內容，覺得很有趣
      teacher_note: |-
        第一題解析A.「低微」：地位、身分或聲望低下
        B.「脫穎而出」：人或事物的優秀表現。
        D.「瞥見」：短暫的看到
    - index: 2
      answer: B
      answer_printed_as: Ｂ      # 原稿印全形，其餘四題半形
      stem: 朱蒂如何彌補自己學識上的不足？
      options:
        A: 她選擇放棄困難課程，學習容易的科目
        B: 積極訂定計畫補足自己缺少的知識
        C: 她請長腿叔叔當家教老師輔導功課
        D: 她參加學校舉辦的晚間自習活動
      teacher_note: (第四段寫朱蒂沒有因程度落後而逃避，第五段則寫她訂定學習計畫、持續閱讀，答案是B)
    - index: 3
      answer: C
      stem: 請問這篇文章的主旨是什麼？
      options:
        A: 一個人只要有貴人相助，就能改變人生，獲得成功
        B: 這是一部浪漫的愛情故事，描述了朱蒂的感情發展
        C: 朱蒂的成功不只得到貴人相助，也來自她持續不懈的努力
        D: 朱蒂的成功來自長腿叔叔的幫助，沒有資助，她就無法成長
      teacher_note: (主旨首段及末段指出，真正的幸運要靠自己創造，朱蒂付出了無數努力才能成功。)
    - index: 4
      answer: A
      stem: 朱蒂與長腿叔叔的關係，為什麼能從單向資助逐漸走向平等交流？
      options:
        A: 朱蒂的努力與獨立見解，贏得長腿叔叔的理解與尊重
        B: 朱蒂發現長腿叔叔的真實身分後，立刻和他成為朋友
        C: 長腿叔叔決定不再擔任資助者，也不再提供任何幫助
        D: 朱蒂長大後和長腿叔叔合夥，一起資助其他孤兒
      teacher_note: 第七段指出，朱蒂的個性、努力與獨立見解，感動了長腿叔叔，能平等的交流想法。
    - index: 5
      answer: B
      stem: 根據本文，以下哪位同學的成長過程和朱蒂最相像？
      options:
        A: 小明因考試不及格，決定換個學校，選擇合適的環境學習
        B: 小芳家境貧困，但她積極努力，利用免費資源持續提升自己
        C: 小強因為家人支持，從不擔心成績問題，隨遇而安的生活
        D: 小玲學習講求效率，專注自己擅長的科目，弱科順其自然

