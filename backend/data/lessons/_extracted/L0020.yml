              answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 3
          prompt: 根據轉折詞之後的敘述，選項何者正確？
          answer: D
          note: 選項 (A)~(D) 印在上方那張圖片裡，不重複列
          answer_carrier: 橘色手寫字（圖形層）
    - type: sub_block
      label: 2.節錄文章自112年第34~35題：
      items:
        - type: passage
          paragraphs:
            - 「隱私」是一種多元流動的概念，窗簾代表一種隱私，提款卡密碼是一種 隱私，筆電防窺貼片是一種隱私。在我讀高中的年代，「隱私」意謂著上鎖的日記本、父母進房間前先敲門。
            - 如今在網路上，瀏覽紀錄、按讚喜好、地理位置、基本個資等這些看不到的數據，都是商業可變現、政治可操縱的黑箱資料。
            - 關於網路隱私，當前最重要的挑戰是，當我們同意使用某一網路服務，形同自願交出私密資料。然而，我們完全不知道，誰可能取得這些資料，又會用在哪些地方？
          attribution: ——改寫自黃哲斌〈個資可以吃嗎？給現代公民的網路隱私守則〉
        - type: free_text
          index: 1
          prompt: 請圈出轉折詞。
          answers: [然而]
          answer_carrier: 學生自圈，原稿無圈選痕跡
        - type: single
          index: 2
          prompt: 留意轉折詞後面主要強調哪一項訊息？請勾選。
          options:
            1: 「隱私」在現在與過去有截然不同的定義和範圍。
            2: 我們的隱私資料在商人與政治家眼中是有價值的。
            3: 我們難以確認自己提交的隱私資料會被如何運用。
          answer: 3
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 3
          prompt: 依據本文，下列何者最符合作者的觀點？
          options:
            A: 只要使用者同意，交出資料就不算隱私問題。
            B: 網路隱私的難處，是資料交出後難以掌握去向。
            C: 網路資料有商業價值，所以最好完全不要使用網路。
            D: 現代隱私都藏在數據中，傳統隱私已經不重要。
          answer: B
          answer_carrier: 橘色手寫字（圖形層）

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 他為了出席這場會議，打扮得十分「工整」正式
        B: 他熱情地「婉拒」朋友，還一直要求朋友留下來
        C: 父母過世後，他一個人「顧慮」妹妹，十分辛苦
        D: 按照「常理」，校外教學前他應該會興奮得睡不著
      teacher_note: 第1題解析：(A)「工整」用於字跡 (B)「婉拒」是拒絕 (C)宜用「照顧」
    - index: 2
      answer: C
      stem: 下列哪一組語詞皆屬於「轉折詞」？
      options:
        A: 因為、所以、如果、只要
        B: 首先、接著、然後、最後
        C: 可是、但是、不過、然而
        D: 例如、像是、可能、也許
    - index: 3
      answer: C
      stem: 下列何者最能作為這篇文章的主旨？
      options:
        A: 聽別人說話時，不應事先猜測對方接下來的話
        B: 接受別人的邀約前，應先說明自己的所有顧慮
        C: 看到轉折詞，要留意後面的訊息，並配合前後文理解
        D: 閱讀文章時，找到轉折詞後就不必再閱讀前面的內容
      teacher_note: 呼應「轉折詞後有重點」
    - index: 4
      answer: A
      stem: 「很多人以為會求助就是不夠厲害，不過懂得求助，也是一種解決問題的能力。」下列何者最符合句意？
      options:
        A: 懂得在適當的時候求助，也是一種解決問題的能力
        B: 只有能力不足的人，才會需要主動向別人尋求幫助
        C: 遇到問題時，先自己處理，通常比開口求助更重要
        D: 向別人求助雖能解決問題，卻會凸顯自己能力不足
      teacher_note: 第4題解析 關鍵在於「不過」之後：「懂得求助，也是一種解決問題的能力」
    - index: 5
      answer: B
      stem: 「撐一把有形的傘，那是正當的事，因為我們不必在雨中表現異於同類的乖張。但如果撐起一把無形的傘，使我們不去面對風雨，面對苦難，那我們永遠無法領略雨過天青的喜悅。」這段話所寄寓的道理，與下列何者最接近？（題幹引自103年會考國文第9題）
      options:
        A: 人遇到困難時，應該拒絕所有保護與幫助
        B: 面對人生風雨時，不應只靠逃避來保護自己
        C: 撐傘躲雨的人，無法表現出與眾不同的勇氣
        D: 只要避開所有苦難，就能得到雨過天青的喜悅
      teacher_note: 關鍵在於「但」之後：不面對風雨就無法領略喜悅，所以不該逃避。

