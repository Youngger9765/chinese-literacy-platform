# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  # ⚠️ 段號欄印的是 ㄧ二三四五六七八九十 共 **10** 個，所以 paragraph_count=10。
  #    段號欄的行距比課文欄窄，愈往後漂愈多（到第 8 段時「八」已印在第 7 段末行旁），
  #    不能照「號碼旁邊那一行」對位。對位靠兩件事互相印證：
  #      ① 段落本身的語意起頭
  #      ② 右緣「字數」欄的累計數 —— 它從 ☞ 那一段開始算，
  #         第一個數字 27 = 「後來我發現…作者常常把重要的話放在「可」= 27 字，
  #         而它印在**上一行**的位置，證實整欄往上漂一行。
  # ⚠️ 第 8 段的四個列點在 DOCX 裡是獨立的 <w:p>（v2 因此拆成 14 段），
  #    但學習單只給它們一個段號「八」，而且念順順的字數累計把它們算在內
  #    （51 → 77 → 100 → 125 → 147 → 174）。所以列點併進第 8 段的 text，
  #    以換行分隔（逐字門以換行切段比對，各行仍逐字驗）。
  paragraph_count: 10
  paragraphs:
    - idx: 1
      text: 在和別人說話時，有時候我會覺得自己好像有一點讀心術。別人的話還沒說完，我就先猜到對方後面可能要接什麼。
    - idx: 2
      text: 像朋友對我說：「這部電影我也很想看，但是……」我心裡可能馬上想：「糟了，他是不是不能跟我一起去？」又或者，老師對我說：「你作業上的字寫得很工整，但是……」我也會有點緊張，心想：「後面是不是要提醒我哪裡要改？」
    - idx: 3
      text: 不過，「但是」後面也不一定都是壞消息。像朋友說：「我今天有點累，但是我還是想聽你說話。」聽到這裡，我就會知道，前面是在說他的狀況，後面才是他真正想告訴我的心意。
    - idx: 4
      text: 你也有過這種感覺嗎？這不是因為我們真的會讀心，而是因為「但是」像一個小路標。它提醒我們：話要轉彎了，「但是」後面的話可能才是對方最想說的重點。我前陣子就有過一次很難忘的經驗。
    - idx: 5
      text: 那時候，我一直想和班上的小恩變熟，有天放學，我終於鼓起勇氣問她：「星期六我們一起去圖書館讀書好嗎？」小恩低下頭，想了一下，慢慢的說：「我們認識還沒有很久……」
    - idx: 6
      text: 完了，這聽起來不像是好消息。她又說：「我也還不太了解你……」我更緊張了，接下來她會婉拒我嗎？沒想到，小恩居然接著說：「但是，我覺得一起去圖書館應該還不錯。」
    - idx: 7
      text: 聽到這裡，我在心裡吶喊「YES！」原來，小恩不是不想答應我，她只是先說出自己的顧慮，「但是」後面的話，才是她真正的回答。「但是」就像一個轉彎的路口，轉過彎後，能讓我們看見截然不同的風景與結局。
    - idx: 8
      text: |-
        後來我發現，讀文章也是一樣。作者常常把重要的話放在「可是、但是、不過、然而」這些「轉折詞」後面。例如：
        失敗雖然很丟臉，可是失敗也能提醒我們，下次怎麼改進。
        燕麥奶拿鐵有點貴，一杯75元，但是實在超好喝的。
        我原本想去打籃球，不過突然下起大雨，只好留在家裡。
        他每天都很認真複習，然而這次考試還是考砸了。
      note: 課文的 ☞ 錨點印在本段首行；四個列點是本段的舉例，段號欄只給一個「八」
    - idx: 9
      text: 發現了嗎？轉折詞前面的句子，會讓人心裡自然產生一個「照常理，接下來應該……」的預期或猜測，但轉折詞一出現，就像一個急轉彎，讓人有「咦，怎麼跟想的不一樣」的感覺，出現「出乎意料」的結果。而整個句子中，作者特別想說的話，常常會出現在轉折詞之後。
    - idx: 10
      text: 所以，不論是聽人說話，還是讀一篇文章，只要出現「可是、但是、不過、然而」這樣的轉折詞，你就知道，轉彎路標來了。跟著這些小路標看下去，先留意後面的話，再配合前後文，常常就能更快掌握重要訊息。
  inline_marked_terms: [讀心術, 工整, 路標, 婉拒, 吶喊, 顧慮, 截然不同, 常理, 預期, 出乎意料]
  inline_underlined_terms: [小恩]

