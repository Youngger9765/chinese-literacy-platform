      merged_note: 這一列在原稿是跨第二、三欄的合併儲存格
    - label: 支持證據
      items:
        - label: 研究一
          value: 缺乏戶外活動可能是近視的重要因素
        - label: 研究一(1)
          value: |-
            (1)2007年美國研究者研究514位小學生，發現
            □①戶外活動時間 □②家長近視情況 □③做功課時間(複選)
            可有效預測學生是否會罹患近視。
          options: {1: 戶外活動時間, 2: 家長近視情況, 3: 做功課時間}
          answers: [1, 2]
        - label: 研究一(2)
          value: |-
            (2)新加坡和澳洲比較兩國6、7歲華裔兒童近視率，發現
            (□內請填＞、＜或＝)
            ❶室內閱讀與做功課的時間：澳洲□新加坡
            ❷戶外活動時間：澳洲□新加坡
            ❸近視率：澳洲□新加坡
          blanks: [{answer: ＞}, {answer: ＞}, {answer: ＜}]
        - label: 研究二
          value: |-
            「光線」可能有保護眼球的效果。(□內請填＞、＜或＝)
            動物實驗：高照明度養大的雞誘發近視率□低照明度養大的雞
            →科學家提出「光線－【　】假說」，光線可能刺激視網膜釋放多巴胺，阻止眼球過度拉長，預防近視。
          blanks: [{answer: ＜}, {answer: 多巴胺}]
        - label: 研究三
          value: |-
            增加戶外活動有助於預防近視。(□內請填＞、＜或＝)
            臺灣國小實驗：
            ❶每天進行40分鐘的戶外活動的兒童近視率□室內活動對照組
            ❷333名下課離開教室的學生近視率□未出去玩的學生
          blanks: [{answer: ＜}, {answer: ＜}]
        - label: 研究四
          value: |-
            戶外的照度大於室內。(□內請填＞、＜或＝)
            室內的照明約100-500的流明，戶外的流明陰天約15000，晴天約130000，由此可知戶外流明□室內。
          blanks: [{answer: ＞}]
    - label: 研究結論
      value: 孩子應該【　】！
      blanks: [{answer: 多出去玩，別關在家／多去戶外晒太陽}]

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 科學推理策略——整合多項研究證據
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），PDF p7~p10 全部可見（11 個）
  note: |-
    （二）解讀研究數據在原稿是一張兩欄表（閱讀步驟／根據研究內容勾選答案），
    ❶❷❸ 是左欄的三個小列。這裡攤成 guide + single 的序列，讓每一題各自可作答；
    表格外框沒有承載任何內容，攤平不丟資訊。
  blocks:
    - type: concept_box
      text: |-
        你讀過研究報告或科普文章嗎？讀這類文章，不能只記住研究結果，還要看懂：研究者怎麼做？研究結果告訴我們什麼？
        不過，一項研究通常只能回答一部分問題，也可能留下新的疑問。科學家會再進行其他研究，從不同角度繼續追問、檢查和補充，讓問題的答案越來越完整。這一課，我們要看懂多項研究如何一步步補上線索，讓最後的結論更有根據。
        這一課，我們要練習：
        【看做法】→【讀結果】→【找線索】→【合證據】

    # ── 一、先讀懂一項研究 ──
    - type: guide
      text: 一、先讀懂一項研究
    - type: guide
      text: （一）研究比較澳洲和新加坡六、七歲的華裔兒童，以下是研究數據：
    - type: table
      columns: [比較項目, 澳洲兒童, 新加坡兒童]
      rows:
        - [室內閱讀和近距離功課時間, 較多, 較少]
        - [每週戶外活動時間, 約13小時, 約3小時]
        - [近視率, 約3％, 約29％]
    - type: guide
      text: （二）解讀研究數據
    - type: single
      prompt: ❶看做法
      options:
        1: 安排一組兒童增加戶外活動，再和另一組比較。
        2: 比較兩地兒童原有的生活情形和近視率。
      answer: 2
    - type: guide
      text: ❷讀結果
    - type: single
      prompt: 近距離用眼時間：
      options: {1: 澳洲兒童較多, 2: 新加坡兒童較多}
      answer: 1
    - type: single
      prompt: 戶外活動時間：
      options: {1: 澳洲兒童較多, 2: 新加坡兒童較多}
      answer: 1
    - type: single
      prompt: 近視率：
      options: {1: 澳洲兒童較高, 2: 澳洲兒童較低}
      answer: 2
    - type: guide
      text: 統整→澳洲兒童近距離用眼較多、戶外活動較多，近視率卻較低
    - type: single
      prompt: ❸研究帶來什麼新線索？
      options:
        1: 近距離用眼較多，近視率就一定比較高。
        2: 除了近距離用眼，戶外活動也可能是影響近視的重要因素。
      answer: 2
    - type: guide
      text: （三）這項研究還留下什麼問題？
    - type: single
      prompt: 這項研究比較了兩地兒童原有的生活情形。下列哪一個問題，還需要用其他研究繼續檢查？
      options:
        1: 澳洲兒童的戶外活動時間是否比新加坡兒童多？
        2: 增加兒童的戶外活動後，近視發生的機會是否會降低？
      answer: 2
    - type: guide
      text: →這項跨國比較先找到線索，接下來還要繼續檢查：增加戶外活動是否有助於降低近視風險？

    # ── 二、研究者怎麼繼續找答案 ──
    - type: guide
      text: 二、研究者怎麼繼續找答案
    - type: guide
      text: 前一項研究發現：戶外活動較多的兒童，近視率較低。為了繼續檢查這條線索，其他研究安排兒童增加戶外活動，看看近視發生的機會會不會降低。
    - type: guide
      text: （一）比較兩項研究，看看研究者如何繼續檢查前面的線索
    - type: table
      columns: [比較項目, 跨國比較研究, 戶外活動實驗]
      rows:
        - [研究怎麼做？, 比較兩地兒童原有的生活情形, 安排一組兒童增加戶外活動，再和另一組比較]
        - [研究看到什麼？, 戶外活動較多的兒童，近視率較低, 增加戶外活動組，近視發生的機會較低]
        - [研究的作用, 找到線索：戶外活動可能和近視有關, 繼續檢查：增加戶外活動可能真的有幫助]
    - type: single
      index: 1
      prompt: 1.戶外活動實驗和跨國比較研究最大的不同是什麼？
      options:
        1: 只是比較兒童原有的生活情形
        2: 實際安排一組兒童增加戶外活動
      answer: 2
    - type: single
      index: 2
      prompt: 2.戶外活動實驗研究結果支持哪一個說法？
      options:
        1: 增加戶外活動，有助於降低近視發生的機會
        2: 增加戶外活動，可以讓每一名兒童都不會近視
      answer: 1

    # ── 三、不同研究，繼續補上不同線索 ──
    - type: guide
      text: 三、不同研究，繼續補上不同線索
    - type: guide
      text: 研究：動物與多巴胺實驗
    - type: guide
      text: 1.研究結果：高照明度下，動物被誘發近視的機會較低；抑制多巴胺生成後，亮光的保護效果消失。
    - type: single
      prompt: 2.這項研究主要幫助我們了解什麼？
      options:
        1: 了解增加戶外活動後，兒童的近視率是否降低。
        2: 了解明亮光線可能如何發揮保護眼球的作用。
      answer: 2
    - type: guide
      text: 研究：室內外照度比較
    - type: guide
      text: 1.研究結果：一般室內照明約100～500勒克斯，戶外自然光通常可達數萬勒克斯以上。
    - type: single
      prompt: 2.這項資料主要幫助我們了解什麼？
      options:
        1: 一般室內燈光很難達到戶外自然光的亮度。
        2: 只要室內開燈，亮度就和戶外自然光一樣
      answer: 1

    # ── 四、把不同研究合起來 ──
    - type: guide
      text: 四、把不同研究合起來
    - type: table
      columns: [研究線索, 研究幫助我們知道什麼？]
      rows:
        - [研究：戶外活動較多的兒童，近視率較低, 戶外活動可能和近視率有關]
        - [研究：增加戶外活動組，近視發生機會較低, 增加戶外活動可能真的有幫助]
        - [研究：明亮光線下，動物較不容易被誘發近視, 光線可能具有保護眼球的作用]
        - [研究：戶外自然光遠比普通室內照明明亮, 一般室內燈光很難達到戶外自然光的亮度]
    - type: single
      prompt: 把四項線索合起來，哪一個結論最合理？
      options:
        1: 近視完全是缺少戶外光線造成的。
        2: 戶外光線可能是影響近視的重要因素；增加戶外活動有助於降低近視風險。
      answer: 2

    - type: guide
      text: ★策略帶著走
    - type: guide
      text: 下次讀到介紹多項研究的文章時，可以依序問自己：
    - type: passage
      paragraphs:
        - ☆研究者怎麼做？
        - ☆研究看到了什麼結果？
        - ☆這項研究幫助我們知道什麼？
        - ☆不同研究合起來，支持什麼結論？

    - type: self_check
      title: ◎自我檢核
      items:
        - 1.我能從研究資料中，找出研究怎麼做、看到了什麼結果。
        - 2.我能說出每項研究幫助我們知道什麼。
        - 3.我能把不同研究合起來，選出符合研究結果的結論。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號印在題號前的（　）裡，文字流有此資訊
  questions:
    - index: 1
      answer: D
      stem: 下列哪一句語詞使用正確？
      options:
        A: 車子高速行駛，揚起地面上的灰塵，使人「望塵莫及」
        B: 他們倆今天結為夫妻，真是「無獨有偶」、天作之合
        C: 「刻板印象」指的是面無表情的人給他人的印象
        D: 他們日夜苦練，想爭取冠軍的決心早已「不言而喻」
      teacher_note: |-
        Ａ.成語誤用
        B.成語誤用
        Ｃ.成語誤用
    - index: 2
      answer: D
      stem: 這篇文章認為造成近視的原因為何？
      options: {A: 遺傳因素, B: 近距離用眼, C: 受教育的時長, D: 缺乏戶外光線}
    - index: 3
      answer: C
      stem: 根據本文，下列哪一項最不符合文章內容？
      options:
        A: 多到戶外活動，可能降低發生近視的機會
        B: 光線可能促使視網膜分泌多巴胺，抑制眼軸拉長
        C: 室內燈光照度通常和戶外自然光一樣強
        D: 增加室內照明，未必能取代戶外活動的效果
    - index: 4
      answer: B
      stem: 本文介紹多項研究，最主要的作用是什麼？
      options:
        A: 重複相同結果，讓文章篇幅變得更長
        B: 從不同角度找線索、檢查效果並解釋原因
        C: 比較各國研究者使用的設備和研究經費
        D: 證明所有近視問題都只和戶外光線有關
    - index: 5
      answer: B
      stem: 根據本文多項研究，哪一個結論最合理？
      options:
        A: 只要每天到戶外活動，就一定不會近視。
        B: 戶外光線可能是重要因素，增加戶外活動有助降低近視風險。
        C: 近距離用眼完全不會影響近視，只有陽光才重要。
        D: 一般室內燈光和戶外自然光具有相同的保護效果。

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [望塵莫及, 鳳毛麟角, 流行疫病, 刻板印象, 咎責, 罹患, 多巴胺, 不言而喻]
  grid_size: [10, 10]
  grid:
    - 雕地影形流落花多責罰
    - 刻板印象花下巴多事錢
    - 鳳毛不流不胺不引內罹
    - 凰探水可行望得咎責負
    - 于望穿秋水疫患辭備鳳
    - 飛灰塵埃及並病職毛甲
    - 喻罹難莫言不行麟天不
    - 病患病過及可角人花言
    - 鳳麒麟行為理言可板而
    - 飛塵來多巴喻及印象喻
  answers_are_graphical: true
  answer_paths:
    - {word: 多巴胺, cells: [[1, 8], [2, 7], [3, 6]], direction: diagonal_down_left}
    - {word: 刻板印象, cells: [[2, 1], [2, 2], [2, 3], [2, 4]], direction: horizontal}
    - {word: 流行疫病, cells: [[3, 4], [4, 5], [5, 6], [6, 7]], direction: diagonal_down_right}
    - {word: 咎責, cells: [[4, 8], [4, 9]], direction: horizontal}
    - {word: 望塵莫及, cells: [[5, 2], [6, 3], [7, 4], [8, 5]], direction: diagonal_down_right}
    - {word: 鳳毛麟角, cells: [[5, 10], [6, 9], [7, 8], [8, 7]], direction: diagonal_down_left}
    - {word: 罹患, cells: [[7, 2], [8, 2]], direction: vertical}
    - {word: 不言而喻, cells: [[7, 10], [8, 10], [9, 10], [10, 10]], direction: vertical}
  geometry_check: |-
    紙上 roundRect 錨點 8 個（全檔即 8 個，posOffset 皆在紙內），與 8 條 answer_paths
    相同，無警報。8 個框的線色 4 個 srgb E97132、4 個佈景色 accent2 —— PDF p11 上
    八個都是橘框、都圈住一個目標語詞，顏色不一致不影響判讀。

