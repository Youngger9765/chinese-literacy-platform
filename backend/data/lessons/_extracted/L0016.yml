# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  # ⚠️ 段號欄印出來只有 **6 個號碼**（ㄧ二三四五六，第一格是注音符號「ㄧ」U+3127），
  #    但課文有 7 個排版段落 —— 段四包含兩行：「我們再來看看這一段日常場景：」
  #    與「今天家政課…」。
  #    依據不是版面（號碼行距會漂），是**教材自己的交叉引用**：聚光燈小試身手把
  #    「今天家政課…」標為 (第四段)、把「也正因為這些不同…」標為 (第六段)。
  #    所以 idx 只到 6，seq 才是排版段落序（念順順的 spans_paragraphs 用 seq）。
  paragraph_count: 7
  paragraphs:
    - seq: 1
      idx: 1
      text: 有一次，我走路不小心撞到隔壁班的同學，連忙說：「不好意思！」他不但沒生氣，還笑著說：「沒關係！」沒想到旁邊的朋友小聲的說：「我覺得他可能對你有意思喔。」我心想這人的確蠻不錯，聽說還常常幫忙同學，講話又幽默，或許是個很有意思的人。但我最愛的笑話類型是諧音冷笑話，不知道他會不會覺得跟這種人相處起來很沒意思呢？
    - seq: 2
      idx: 2
      text: 你發現了嗎？這段短短的對話裡，出現了好多種「意思」！
    - seq: 3
      idx: 3
      text: 在我們的日常對話中，「意思」可不只是「意義」這麼簡單，它還能變化出許多不同的意義。我們可以總結一下剛剛的用法：
    - seq: 4
      idx: 4
      text: 我們再來看看這一段日常場景：
    - seq: 5
      idx: 4
      text: 今天家政課，我們做杯子蛋糕，從準備材料、打蛋、進烤箱，到最後吃到成品，這過程真的很有意思！但有小組卻因為誤會彼此的意思而吵架，事後還說：「這根本一點意思都沒有！」下課後，老師請我們幫忙收拾環境，雖然器具很多，但對常做家事的我來說，實在是小意思。結束後，老師拿出自己做的手工餅乾，說要意思意思請我們吃幾片，感謝我們的幫忙。
    - seq: 6
      idx: 5
      text: 你發現了嗎？這篇短文裡的「意思」，又變出了哪些不同的模樣？
    - seq: 7
      idx: 6
      text: 語言真的很有趣，一個「意思」，就像一塊拼圖，只有放進文章裡，參考前後文，才看得出它真正的圖案。也正因為這些不同，讓語言變得這麼好玩、有趣。下次再看到這個詞時，不妨停下來想一想：這是什麼「意思」呢？
  # 課文裡夾了兩張「用法／意義」對照表，是課文的一部分（不是第五大題）。
  inline_tables:
    - after_paragraph_seq: 3
      columns: [用法, 意義]
      rows:
        - ['「不好意思」', 表達歉意或害羞]
        - ['「對你有意思」', 表示對某人有好感]
        - ['「很有意思的人」', 指人很有趣、有魅力]
        - ['「很沒意思」', 表示無趣、不好相處]
    - after_paragraph_seq: 6
      columns: [用法, 意義]
      rows:
        - ['「很有意思／一點意思都沒有」', 活動、事情的有趣或無趣]
        - ['彼此的「意思」', 想法]
        - ['「小意思」', 指這件事很簡單、沒什麼難度]
        - ['「意思意思」', 稍微表達心意、略表感謝]
  inline_marked_terms: [連忙, 諧音, 總結, 歉意, 好感, 器具, 略表, 不妨]

