# ── 五 文章重點表 ──
# 這一課的重點表是**配對題**（例句 → 解釋代號），不是填空表。
keypoints:
  title: 這是什麼「意思」？
  intro: 本篇文章運用小故事方式舉出了「意思」不同的用法，現在就請你讀一讀例句，選出「意思」在句子中的解釋，並填入代號。
  layout: matrix
  columns: [例句, 配對]
  # 「配對」欄的表頭印兩行：配對 /(填代號)
  column_note: 第二欄表頭印「配對(填代號)」；第三欄「解釋選項」是整欄合併的共用選項，收在 option_bank
  option_bank:
    A: 表達歉意或害羞
    B: 表示對某人有好感
    C: 指人很有趣、有魅力
    D: 表示人無趣、不好相處
    E: 活動、事情的有趣或無趣
    F: 想法
    G: 指這件事很簡單、沒什麼難度
    H: 用一點小東西，表示心意或感謝
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  rows:
    - 例句: 1.這訓練量對先發選手來說只是「小意思」。
      配對: G
    - 例句: 2.他「意思意思」捐了點錢，表達對活動的支持。
      配對: H
    - 例句: 3.相處久了，其實就會知道這個人「沒什麼意思」。
      配對: D
    - 例句: 4.一直到現在我都還搞不清楚他當初是什麼「意思」。
      配對: F
    - 例句: 5.他一直找話題跟我聊天，是不是對我「有意思」？
      配對: B
    - 例句: 6.他對很多事情都能分享想法，真是「有意思」的人。
      配對: C
    - 例句: 7.臨時才拜託他幫忙，還真的是有點「不好意思」。
      配對: A
    - 例句: 8.這個展覽結合了許多AI互動，真的「很有意思」。
      配對: E

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論代名詞
  strategy_type: inference
  blocks:
    - type: concept_box
      text: |-
        之前我們學過，代名詞也叫做指稱詞，像「你、我、他、牠、它」，可以代替前面出現的人、動物或東西，讓句子不用一直重複同一個詞。
        這一課我們要學「這、那、這些」這類的代名詞。它們常常指前面提到的一件事或一種情況。讀文章時，如果能知道「這、那、這些」指的是什麼，就更容易讀懂文章。
    - type: guide
      text: |-
        ◎ 小試身手：
        閱讀題目，並回到課文段落閱讀，勾選出指稱詞（框框內的語詞）所代表的事物。
    - type: concept_box
      text: |-
        推論三步驟：
        1.往前文找找：代名詞代替的人物、狀況，多是文章前面有提到的內容、事物。當不確定代名詞在指什麼時，可以往前文找找，再根據代名詞後面的描述來推論。
        2.圈詞＋畫線：往前文找找時，你可以先把代名詞(他/她/它/牠、這/那)圈起來，畫條線連到指稱的對象。會更清楚喔。
        3.代入句子讀讀看：如果你還不太確定，可以把指稱的對象，替換到句子中讀讀看，讀起來合理了，就對了。
        例如：
        雖然老師連假前派了一堆作業，但這對美美來說是小意思。
      note: 例句上有手繪標註：「一堆作業」被橘圈圈起、「這」被紅圈圈起，一條紅箭頭從「這」指回「一堆作業」，旁邊另有一個藍色虛線框寫著「一堆作業」。
    - type: sub_block
      label: ◎ 小試身手
      left_header: 課文段落---指稱詞（框框內的語詞）
      right_header: 勾選出指稱詞所代表的事物
      items:
        - type: single
          index: 1
          source_paragraph: 1
          prompt: (第一段)我心想這人的確蠻不錯，聽說還常常幫忙同學，講話又幽默，或許是個很有意思的人。
          referent: 這人
          options: {1: 旁邊的朋友, 2: 隔壁班同學}
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 2
          source_paragraph: 1
          prompt: (第一段)但我最愛的笑話類型是諧音冷笑話，不知道他會不會覺得跟這種人相處起來很沒意思呢？
          referent: 這種人
          answer_template: 這種人=（　）諧音冷笑話的人
          options: {1: 喜歡, 2: 不喜歡}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 3
          source_paragraph: 3
          prompt: (第三段)在我們的日常對話中，「意思」可不只是「意義」這麼簡單，它還能變化出許多不同的意義。
          referent: 它
          options: {1: '「意思」這個詞', 2: '「意義」這個詞'}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 4
          source_paragraph: 4
          prompt: (第四段)今天家政課，我們做杯子蛋糕，從準備材料、打蛋、進烤箱，到最後吃到成品，這過程真的很有意思！
          referent: 這過程
          options: {1: 吃杯子蛋糕的過程, 2: 做杯子蛋糕的過程}
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 5
          source_paragraph: 4
          prompt: (第四段)但有小組卻因為誤會彼此的意思而吵架，事後還說：「這根本一點意思都沒有！」
          referent: 這
          options: {1: 一起做杯子蛋糕, 2: 誤會彼此的意思}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 6
          source_paragraph: 6
          prompt: (第六段)也正因為這些不同，讓語言變得這麼好玩、有趣。
          referent: 這些不同
          options: {1: 圖案的不同, 2: 意思的不同}
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: sub_block
      label: ◎推論小偵探
      instruction: 底下文字中的「這」是指不同的事情，請試試看推論「這」是指什麼？
      items:
        - type: passage
          paragraphs:
            - 小恩今天到教室後，發現抽屜裡多了一張紙條。這會是誰放的呢？他心裡有點驚訝。紙條上寫著：「加油！你一定可以的！」看到這，小恩忍不住笑了。他立刻想到，是不是昨天他和朋友說完自己很擔心數學考試後，朋友偷偷放的？
        - type: free_text
          prompt: A：第一個「這」是指（　）；第二個「這」是指（　）
          blanks: [{answer: 紙條}, {answer: 紙條上的字}]

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 他在開場時「總結」了今天的重點，讓大家十分期待
        B: 面對即將到來的園遊會，班上已經「連忙」作足準備
        C: 陷入低潮時，「不妨」換個角度看看，也許會有新發現
        D: 國家代表隊舉辦盛大的慶祝活動，對球迷「略表」感謝
      teacher_note: |-
        (A)「總結」放在活動最後，宜用「揭示」
        (B)宜用「趁早」
        (D)場面盛大，不是「略表」，宜用「表達」
    - index: 2
      answer: B
      stem: 根據第四段「這根本一點意思都沒有！」這句話最可能表達什麼心情？
      options:
        A: 認為活動簡單，缺乏挑戰性
        B: 認為事情讓人很失望與生氣
        C: 覺得組員們講的話太過傷人
        D: 覺得老師安排的課程沒意義
      teacher_note: 從段四和同學吵架可看出。
    - index: 3
      answer: D
      stem: 根據文章最後一段「下次再看到這個詞時，不妨停下來想一想：這是什麼『意思』呢？」，這句話的用意最可能是什麼？
      options:
        A: 建議讀者閱讀時應該放慢速度
        B: 鼓勵讀者多背熟「意思」的定義
        C: 諷刺現代人對語言的使用太過隨便
        D: 引導讀者透過文章內容思考語詞意義
      teacher_note: 從最後一段強調「參考前後文，才看得出它真正的圖案」可知要透過文章內容了解。
    - index: 4
      answer: B
      stem: 這篇文章主要在說明什麼？
      options:
        A: '「意思」是中文裡最難理解的詞語'
        B: 同一個詞語在不同情況中會有不同的意義
        C: 語言的使用應該盡量簡單清楚，避免誤會
        D: 多使用諧音字詞和成語能讓語言更有深度
      teacher_note: 文章中舉出了許多「意思」的意義，其他選項皆未提及。
    - index: 5
      answer: A
      stem: 下列哪一句話中的「意思」與「我不是這個意思，你別誤會了」的「意思」用法最接近？
      options:
        A: 我聽不太懂你的「意思」是什麼
        B: 他說這點小「意思」，不用放在心上
        C: 真是沒「意思」的聚會，浪費我時間
        D: 在這麼重要的聚會遲到真是不好「意思」
      teacher_note: |-
        題幹和(A)都是指「想法」(B)心意
        (C)趣味(D)表達抱歉

