spotlight:
  strategy_name: 摘要策略—從細節找小主題
  strategy_type: summarize
  blocks:
    - type: concept_box
      text: |-
        上一課，我們學過：說明文常用「大主題—小主題—細節」來說明內容。本課也是一篇說明文，主要介紹「小丑醫生」。作者從幾個小主題來說明，每個小主題下面還會有細節或例子補充。
        閱讀這類文章時，先找到大主題，再分辨小主題和細節的關係，就能更清楚掌握文章重點。
        這一課，我們要練習：從一組細節找出小主題。
