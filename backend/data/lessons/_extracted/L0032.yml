# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: 醫院裡，有時會看到一群穿著鮮豔服裝、戴著紅鼻子的「醫生」，他們不是普通的醫生，而是專門帶來笑聲和歡樂的「小丑醫生」。
    - idx: 2
      text: 小丑醫生的構想最早可以追溯到20世紀80年代。美國一位名叫亞當斯的醫生認為，治療病人不能光靠藥物和手術，還需要關懷病人的情感需求。病人，尤其是住院的重病病人，必須同時面對身體的病痛、對病情變化的焦慮，對死亡的恐懼，因此經常受到疼痛、挫折、沮喪、恐懼的折磨。為了使病患恢復健康，他以幽默和創意作為「治療工具」，用開玩笑、搞怪的方式逗病人笑，在他的幫助下幾乎每位病人都成為他的朋友，並且重拾對生活的希望。亞當斯的故事後來還被改編成了電影！
    - idx: 3
      text: 1995年，「小丑照護計畫」在紐約開始推動，由小丑表演者克里斯廷創立，讓小丑醫生正式成為醫療團隊的一分子。他們經常出現在兒童病房，陪伴那些面臨長期住院、手術或治療的孩子。小丑醫生的工作可不只是講笑話那麼簡單，他們用魔術、音樂、搞笑表演，或是即興互動，讓眉頭深鎖的孩子們感受到片刻輕鬆與愉悅。
    - idx: 4
      text: 除此之外，小丑醫生還能緩解醫院裡的緊張氛圍。當孩子害怕打針或手術時，小丑醫生會用幽默和分散注意力的方式，讓孩子感到安全和放鬆。例如，有的小丑醫生會假裝害怕打針，誇張的表演害怕與逃避針頭的樣子，逗得孩子哈哈大笑，打針好像也就沒有那麼可怕了。
    - idx: 5
      text: 你或許會想，小丑醫生是不是只要會表演就可以了？其實不然！小丑醫生需要接受其他的專業訓練：包括必須了解醫院的規範和病人的需求，才能知道如何在醫療環境中表演，確保不影響病童的治療。此外，小丑醫生還需要熟悉心理學，知道如何與病人和家屬溝通，知道如何應對他們的焦慮、沮喪、恐懼甚至悲傷的情緒。
    - idx: 6
      text: 如今，小丑醫生的工作已經在世界各地普及，在臺灣，小丑醫生的計畫由一些非營利組織推動，許多志工投入其中，為孩子們帶來希望和勇氣。
    - idx: 7
      text: 新冠肺炎疫情期間，許多醫院限制訪客，小丑醫生改用線上表演的方式，透過螢幕繼續為病人帶來歡樂。烏俄戰爭爆發以後，醫療設施面臨被攻擊、被摧毀的壓力，住在醫院的兒童除了身體病痛，還必須面對兵荒馬亂中的忐忑不安。一批小丑醫生悄悄進入烏克蘭的醫院，安撫並陪伴病童，提供歡樂，讓他們笑逐顏開，暫時忘卻不安。
    - idx: 8
      text: 小丑醫生的到來，讓冰冷的病房多了笑聲，這份歡樂不僅幫助病童降低治療的焦慮，也舒緩了壓力鍋下家長緊繃的心情，他們讓我們知道：笑，本身就是最好的良藥！
  inline_marked_terms: [追溯, 沮喪, 重拾, 即興, 眉頭深鎖, 緩解, 氛圍, 非營利組織, 摧毀, 兵荒馬亂, 忐忑不安, 笑逐顏開, 忘卻, 壓力鍋]

