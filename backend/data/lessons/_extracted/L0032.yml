    - {index: 3, word: 摧毀, definition: 破壞。}
    - {index: 4, word: 兵荒馬亂, definition: 形容很亂、很緊張的情況。}
    - {index: 5, word: 笑逐顏開, definition: 笑得很開心，臉上充滿笑容。}
    - {index: 6, word: 重拾, definition: 重新找回或重新開始。}
    - {index: 7, word: 忐忑不安, definition: 心裡很緊張，覺得不放心。}
    - {index: 8, word: 即興, definition: 沒有事先準備，當場想到就做。}
    - {index: 9, word: 氛圍, definition: 周圍的感覺或氣氛}
    - {index: 10, word: 緩解, definition: 舒緩、減輕。}
    - {index: 11, word: 忘卻, definition: 忘記、遺忘。}
    - {index: 12, word: 追溯, definition: 回想或查找過去的事情。}
    - {index: 13, word: 眉頭深鎖, definition: 皺著眉頭，看起來很煩惱或生氣。}
    - {index: 14, word: 壓力鍋, definition: 可以快速加壓烹煮食物的鍋具。這裡引申為壓力極大、情緒緊繃的環境或狀態。}
