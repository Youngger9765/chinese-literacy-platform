      text: |-
        網路上的影片只要出現實驗器材、明顯的研究結果，再加上說話者充滿信心，就很容易讓人覺得：「有做實驗，應該是真的吧！」
        可是，看起來「像」科學，不代表結論真的有科學根據。
        看到讓你驚訝、害怕或很想相信的訊息時，先不要急著相信或轉傳，可以用下面四個步驟檢查。
        網路訊息判讀四步驟
        ❶抓主張：這則訊息要我相信什麼？
        ❷查來源：是誰發布的？有沒有說明資料從哪裡來？
        ❸驗證據：他拿什麼來證明？證據能支持結論嗎？
        ❹再查證：其他可靠來源怎麼說？證據不足時，先保留判斷。
        ※祕訣：判斷證據時，可以再問三個問題：
        1.他實際測到的是什麼？
        2.他最後下了什麼結論？
        3.測到的結果，真的能證明這個結論嗎？

    # ── 一、跟著做 ──
    - type: guide
      text: 一、跟著做：判讀「棉花肺實驗」

    - type: guide
      text: 影片中，網紅把紙菸和電子煙的煙霧分別導入兩團棉花。紙菸使棉花變成深褐色，電子煙的棉花仍然潔白。網紅藉此讓觀眾相信電子煙比較安全。

    - type: single
      prompt: ❶抓主張：影片要觀眾相信什麼結論？
      options:
        1: 紙菸會使棉花變色
        2: 電子煙不會使棉花變色，所以對人體無害
        3: 棉花可以吸收各種煙霧
        4: 電子煙的味道比紙菸好聞
      answer: 2

    - type: single
      prompt: |-
        ❷查來源：影片提供了哪些來源資訊？
        影片是否說明這項實驗來自哪一個研究機構，或引用哪一份醫學研究？
      options:
        1: 有，資料來源交代得很完整
        2: 沒有，文章中未提到查證的研究來源
      answer: 2

    - type: single
      prompt: 因此，可以先判斷：這部影片的資料來源【　】。
      options:
        1: 不完整
        2: 非常可靠
      answer: 1
      options_note: 這一題的兩個選項原稿印在同一組【 】裡（【☑①不完整　□②非常可靠】），不是分行列出。

    - type: single
      prompt: |-
        ❸驗證據：證據真的能支持結論嗎？
        影片提出的證據是：「電子煙煙霧導入棉花後，棉花仍然潔白。」
        下列哪一項判斷較合理？
      options:
        1: 棉花沒有變色，就能證明電子煙沒有任何有害物質。
        2: 棉花沒有變色，只能看出表面的顏色變化，不能排除看不見的有害物質。
        3: 棉花沒有變色，表示所有人的肺部都不會受到影響。
        4: 只要紙菸比較髒，電子煙就一定是安全的。
      answer: 2

    - type: guide
      text: |-
        課文指出，電子煙煙霧可能含有尼古丁、重金屬等看不見的物質。
        →因此：「棉花仍然潔白」不能直接推成「電子煙對人體無害」。

    - type: single
      prompt: ❹再查證：接下來怎麼做較適當？
      options:
        1: 看影片按讚數多不多
        2: 看留言區有多少人相信
        3: 查找衛生主管機關、醫療機構或研究資料，再互相比對
        4: 因為影片看起來可疑，就直接認定所有內容都是假的
      answer: 3

    - type: single
      prompt: 我目前的判斷：
      options:
        1: 影片已經證明電子煙無害
        2: 影片已經證明電子煙一定比紙菸危險
        3: 影片的證據不足，不能用棉花顏色證明電子煙無害
      answer: 3

    # ── 二、換你試試看 ──
    - type: guide
      text: 二、換你試試看：判讀「煙油食材實驗」

    - type: guide
      text: 影片中，網紅把煙油加入麵包、冰棒和飲料中，並當場吃下去。他說：「這些成分平常在食物裡也吃得到，沒問題啦！」請使用相同的四個步驟判讀。

    - type: single
      prompt: |-
        ❶抓主張
        這部影片想要讓觀眾相信什麼？
      options:
        1: 有些食品中含有香料
        2: 煙油可以吃，因此吸電子煙也不會傷害身體
        3: 冰棒和飲料可以加入不同口味
        4: 網紅很勇敢，願意親自嘗試
      answer: 2

    - type: single
      prompt: |-
        ❷查來源
        影片中，支持這個主張最主要的「證據或證明」是什麼？
      options:
        1: 網紅親自把煙油加入食物並吃下去
        2: 醫療機構進行長期人體研究
        3: 多個研究團隊得到相同結果
        4: 衛生主管機關公布安全檢驗
      answer: 1

    - type: single
      prompt: |-
        ❸驗證據
        這個實驗最大的問題是什麼？
      options:
        1: 網紅吃的煙油口味不夠多
        2: 食物和飲料的外觀不夠吸引人
        3: 「吃進消化道」和「吸入肺部」是不同途徑，不能放在一起比較
        4: 影片沒有說明網紅喜歡哪一種口味
      answer: 3

    - type: guide
      text: |-
        簡單的說，網紅敢吃下去，只能證明：他在影片中做了這個動作。
        不能因此證明：煙油對每個人都安全，也不能證明長期吸入不會造成危害。

    - type: single
      prompt: |-
        ❹再查證
        目前最合理的判斷是：
      options:
        1: 網紅敢吃，所以電子煙一定安全
        2: 只要是網紅影片，就一定是假消息
        3: 影片把食用和吸入混為一談，證據不足，不能支持「電子煙無害」
        4: 只要煙油有食物香味，就可以放心使用
      answer: 3

    # ── 三、四種陷阱 ──
    - type: guide
      text: 三、你發現了嗎？網路實驗常見的四種陷阱

    - type: table
      prompt: 三、你發現了嗎？網路實驗常見的四種陷阱
      columns: [常見陷阱, 意思, 本文例子]
      rows:
        - [❶只看表面, 只看容易看見的現象，忽略看不見的資訊, 棉花沒有變色，就說電子煙無害]
        - [❷偷換情況, 把兩種不同情況當成相同, 把「吃進消化道」和「吸入肺部」相提並論]
        - [❸一次當全部, 用一個人、一次示範，代表所有人與所有情況, 網紅敢吃煙油，就說煙油安全]
        - [❹結論說太滿, 證據只能說明一小部分，結論卻說得過度肯定, 從棉花潔白直接推成「對人體無害」]

    - type: guide
      text: |-
        ◎學習：看到網路實驗時，再問自己一句：
        這個實驗真正測到的是什麼？它真的能回答影片提出的問題嗎？

    # ── 四、換個情境 ──
    - type: guide
      text: 四、換個情境試試看：「能量手環讓球速立刻增加？」

    - type: guide
      text: |-
        某網紅發布短影音。他先投三球，最快球速是每小時100公里；接著戴上「能量手環」再投三球，最快球速變成每小時105公里。於是他宣布：
        「實驗證明，戴上能量手環就能提升球速！」
        影片只測試網紅一個人，也沒有找其他人重複測試。

    - type: single
      prompt: 1.這部影片提出的主要主張是什麼？
      options:
        A: 網紅投球的速度不太穩定
        B: 戴上能量手環可以提升球速
        C: 投手每次投球的速度都不同
        D: 測速儀可以測出投手的球速
      answer: B
      options_note: 這四題印的是 A~D 代號（不是①②③），答案也是以代號填在題號前的括號裡，故用字母 key。

    - type: single
      prompt: 2.影片用什麼證據支持主張？
      options:
        A: 本來100公里，戴上後變成105公里
        B: 影片有很多人按讚和轉傳
        C: 網紅表示自己很喜歡這款手環
        D: 手環的外形看起來很有科技感
      answer: A

    - type: single
      prompt: 3.這項「實驗」最大的問題是什麼？
      options:
        A: 球速增加了5公里，所以結果不明顯
        B: 網紅沒有說明手環有哪些顏色
        C: 只測一個人和少數幾球，球速變快也可能受到熱身或自然起伏影響
        D: 影片沒有訪問手環製造公司的老闆
      answer: C

    - type: single
      prompt: 4.目前最合理的判斷是什麼？
      options:
        A: 影片拍下球速增加，所以手環一定有效
        B: 所有運動用品廣告都是假的
        C: 只要再看網友留言，就能判斷手環是否有效
        D: 目前證據不足，需要更多人、更多次測試及可靠資料才能判斷
      answer: D

    - type: guide
      text: |-
        解析：
        影片確實拍到網紅戴手環後，最快球速由100公里變成105公里；但只測一人、少數幾球，也沒有排除熱身、投球自然起伏等其他可能。
        因此，這項證據不足以證明「手環能提升球速」。

    # ── 五、小結 ──
    - type: guide
      text: 五、方法小結

    - type: guide
      text: |-
        判斷網路訊息，不能只看影片拍得像不像科學，也不能只看發布者有沒有名氣。要先找出他想讓你相信的主張，再檢查他提出的證據能不能支持這個主張，最後查找其他可靠資料互相比對。
        抓主張 → 查來源 → 驗證據 → 再查證
        證據不足時，不急著相信、轉傳，先保留判斷，才是聰明的閱聽人。

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能說出一則訊息想讓我相信什麼。
        - 2.我會查看發布者與資料來源。
        - 3.我能分辨「實驗看到的結果」和「影片下的結論」。
        - 4.我會檢查證據是否真的能支持結論。
        - 5.我知道證據不足時，可以先保留判斷。
        - 6.我能把這四個步驟用在另一則網路訊息上。

# ── 六 文章重點表 ──
