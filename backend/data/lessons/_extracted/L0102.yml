    灰框多了「行銷手法」、少了「偽科學」。而格子裡**兩個都被圈起來**，
    所以答案路徑有 12 條、比灰框的 11 個多一條（多的是「偽科學」）。照原稿記錄。
  grid_size: [10, 10]
  grid:
    - 指說訴告勸毒查緝詢問
    - 鹿陷說戒世信以為真任
    - 為阱長人黏性器神靈迷
    - 馬行道路土黏長人魂尼
