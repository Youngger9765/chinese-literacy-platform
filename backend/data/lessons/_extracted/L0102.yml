# ── 一 讀全文—做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 請在重要的地方、喜歡的語詞、句子或段落做記號。
  printed_title: 第5課　網紅的電子煙實驗：偽科學的陷阱
  level_label: Level 7・說明文
  target_strategy_label: 目標策略：媒體素養與識讀──辨別網路訊息真偽
  paragraph_count: 10
  paragraph_grouping_note: |-
    學習單印 10 個段號，但課文在 DOCX 裡是 15 個非空 `w:p`：
    多出來的是**四個不佔段號的分節小標**（影片一：棉花肺實驗／影片二：煙油食材實驗／
    網路的偽科學／理性判斷 聰明識讀），以及第 5 段被分頁切成兩個 `w:p`
    （「…還怕」＋「用抽的啊！」阿政這樣想。」）。
    所有課文段落都以兩個全形空格（U+3000）縮排，小標不縮排 —— 可以拿它區分。
  paragraphs:
    - idx: 1
      text: 朋友傳給阿政兩部電子煙實驗影片，分別由兩位網紅拍攝。電子煙是一種新型菸品，造型像3C產品，又酷又炫，還有多種口味可選擇。阿政覺得影片很新奇，想知道網紅怎麼用科學的方法證明電子煙是否安全！
    - idx: 2
      section_heading: 影片一：棉花肺實驗
      section_heading_note: 不佔段號的分節小標，印在本段之前。
      text: 第一位網紅在兩個玻璃器皿內放滿棉花，當作是人的肺，接著分別導入傳統紙菸及電子煙的煙霧，不久紙菸便將整團棉花燻成深褐色，且帶有黏稠的液體；而導入電子煙霧的棉花，顏色依舊潔白，只有稍微潮溼。
    - idx: 3
      text: 實驗後的兩團棉花顏色落差好大，阿政不禁心想：「紙菸太毒了，千萬別碰！但電子煙看起來對身體無害呀，政府為什麼要禁？」
    - idx: 4
      section_heading: 影片二：煙油食材實驗
      section_heading_note: 不佔段號的分節小標，印在本段之前。
      text: 另一位網紅認為，電子煙的煙油成分，就和常見的食物添加物一樣，沒什麼害處，因此，網紅把不同口味的煙油沾在麵包、冰棒上食用，又把煙油滴進飲料當作調味，甚至把煙油入菜後吃下肚。網紅告訴觀眾：「這些成分你平常在食物裡也吃得到，沒問題啦！」
    - idx: 5
      text: 阿政看完這部有點搞笑的影片後，忍不住佩服網紅用自己的身體做實驗，同時也對電子煙的安全性更加放心。阿政本來想勸一位朋友戒掉電子煙，這下他覺得沒什麼好勸戒的，「煙油都能吃了，還怕用抽的啊！」阿政這樣想。
      text_note: 本段在 DOCX 裡被分頁切成兩個 `w:p`（斷在「還怕」與「用抽的啊！」之間），此處接回一段。
    - idx: 6
      section_heading: 網路的偽科學
      section_heading_note: 不佔段號的分節小標，印在本段之前。
      text: 然而，阿政看的這兩部影片都有問題，影片製作者的描述方式看起來很像科學，但實驗方法並不能回答「電子煙是否安全」這個問題，提供的訊息也不完整，容易讓觀眾信以為真，誤入偽科學的迷魂陣。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 7
      text: 以第一部影片為例，讓棉花變成深褐色的是紙菸裡的焦油，這是容易看得見的物質；但電子煙裡的煙油成分不一，加熱後產生的煙霧可能含有尼古丁、重金屬等有害物質，這些物質未必會使棉花明顯變色。此外，棉花並不等於人的肺，影片也沒有說明兩邊導入的煙霧量與時間是否相同。因此，只憑棉花沒有變色，就得出「電子煙無害」的結論，並不恰當。
    - idx: 8
      text: 再以第二部影片為例，網紅以「吃下煙油」證明煙油只是食品香料，不用緊張。但別忘了，食品香料是用來食用的，能添加哪些成分、添加多少，是依照「吃進消化道」的方式評估安全性；但電子煙的煙霧卻是「吸入肺部」的，它對身體產生的影響，不能和「吃下肚」相提並論。這種指鹿為馬的說法，並無說服力。更何況，健康問題也不是靠「敢吃」來證明的。
    - idx: 9
      section_heading: 理性判斷 聰明識讀
      section_heading_note: 不佔段號的分節小標，印在本段之前。
      text: 事實上，不僅網路上似是而非的實驗混淆大眾對電子煙的認知；電子煙廠商為了龐大利益，把目標鎖定在年輕族群，將電子煙包裝成無害、時尚、不會上癮的產品，以降低青少年的戒心。只要一上鉤，就可能成為業者的「長期提款機」。
    - idx: 10
      text: 2023年「菸害防制法」修法後，已全面禁止電子煙，但仍有業者不斷變換行銷手法，除了利用高人氣網紅行銷，也利用網路拍賣平台暗中販售，因此，只靠政府查緝禁止是不夠的，更重要的是認清菸品行銷手法，多方查證、辨識網路訊息，才不會掉進菸害的陷阱。
  running_char_counts: [28, 59, 89, 117, 147, 176, 206, 236, 249, 277, 308, 338, 368, 398, 409]
