# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p11）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: D
      stem: 下列語詞何者使用正確?
      stem_note: 句末問號在原稿是**半形** `?`（第 2 題也是），其餘題是全形。
      options:
        A: 弟弟作業沒做，又躲避檢查，就像進入了「迷魂陣」
        B: 妹妹實在是太「黏稠」了，走到哪跟到哪，甩都甩不掉
        C: 老師講解概念簡單清楚，學生非常容易「混淆」
        D: 他只要女友一喊缺錢，就給她錢，簡直就像「長期提款機」
      explanation: A-前後句無相關。B-詞語誤用。C-前後句矛盾。
      explanation_note: 原稿是一個浮動說明框，印在題目右上方；只解釋錯的三個選項。
    - index: 2
      answer: A
      stem: 電子煙的廠商為何會把目標鎖定在年輕族群?
      options:
        A: 因為年輕族群好奇心重，容易因行銷手法而受騙
        B: 因為年輕族群很有錢，可以當廠商長期提款機
        C: 因為電子煙有龐大的利益，如果越多人抽越好
        D: 因為年輕族群比較聰明，可躲開執法機關的查緝
      explanation: (年輕人容易因為廠商的行銷手法而上當，而忽略了實際的問題。)
      explanation_note: 原稿是一個浮動說明框，印在選項右側；連同括號一起照抄。
    - index: 3
      answer: C
      stem: 在本文中，判斷「電子煙好不好？」時，阿政犯了什麼錯誤？
      options:
        A: 覺察紙菸和電子煙的不同
        B: 查找科學影片去證實想法
        C: 毫不懷疑，直接相信網紅的實驗
        D: 對電子煙充滿好奇心
      explanation: （第六段，阿政看的兩部影片都有問題）
      explanation_note: 原稿是一個浮動說明框，印在選項 A、B 右側。
    - index: 4
      answer: D
      stem: 「社會上多的是『指鹿為馬』的人，常常亂說話混淆大眾視聽，所以閱讀媒體報導時，不可不慎。」請問『指鹿為馬』不可用哪個詞語替換？
      options:
        A: 顛倒黑白
        B: 是非不分
        C: 扭曲事實
        D: 龍蛇混雜
      explanation: （D比喻愚賢不一、高低程度不一樣的人混在一起）
      explanation_note: 原稿印在題幹後方（橘色），不是獨立浮動框。
    - index: 5
      answer: A
      stem: 請問何種情況最不符合本文所說的「理性判斷、聰明識讀」呢？
      options:
        A: 高人氣網紅製作、在網路上瘋傳的影片的可信度一定較高
        B: 看到吸引我的訊息時，我會想一想傳播者的動機是什麼
        C: 我可以用關鍵詞在Google上搜尋，查證新聞的正確性
        D: 投票前夕突然出現對某陣營特別不利的消息，我會特別小心
      explanation: （A要先蒐證再下判斷，不可人云亦云。）
      explanation_note: 原稿是一個浮動說明框，印在選項下方。

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [黏稠, 信以為真, 迷魂陣, 尼古丁, 相提並論, 似是而非, 混淆, 長期提款機, 行銷手法, 查緝, 指鹿為馬]
