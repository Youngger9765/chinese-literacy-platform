# ── 導讀 ──
intro_guide:
  label: 導讀：
  text: 一篇好的故事要有讓人印象深刻的「賣點」，會讓人瞪大雙眼，問說：「這有可能嗎？」底下這篇用古文寫的故事，講到兩個朋友之間約了兩年後在家裡吃飯，時間到了，相隔500公里的朋友會準時出現嗎？古時候，交通非常不便，沒有公車、火車，遠距溝通的電話、網路更是不可能。兩年沒有聯絡，連媽媽都在懷疑：「你的朋友到底會不會來啊？」結果，朋友真的準時出現了。這種信守承諾的故事非常難得，因此被流傳到今天。

# ── 古文今譯 ──
modern_translation:
  label: 古文今譯
  paragraphs:
    - 范式，字巨卿，山陽　金鄉縣人。他年少時曾到太學讀書，是一名太學生，因此跟汝南人張劭結成朋友。張劭，字元伯。後來兩人一起告假回鄉，范式對元伯說：「兩年後我會回來，到時我將拜訪你家，問候你的父母，看看你的孩子。」就一起約定了日期。
    - 約定的日子快到了，元伯把事情詳細地告訴他的母親，請他母親準備酒菜等范式來。元伯的母親說：「你們分別兩年了，相隔千里的約定，你如何確信他一定會來呢？」元伯回答：「巨卿是有信用的人，必定不會違背承諾的。」母親說：「如果是這樣，我就為你們準備酒吧！」等到約定的那天，巨卿果然來了，入屋後，他先拜見了元伯的母親，兩人再一起喝酒，盡情歡樂後才告別。

# ── 原文（含斷詞點）＋注釋 ──
classical_text:
  label: 原文
  source: 南朝・范曄
  has_qr: true
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  paragraphs:
    - 范式.字巨卿，山陽.金鄉人也。少.遊太學，為.諸生，與汝南.張元伯為友。劭.字元伯。二人並告.歸鄉里。式謂.元伯曰：「後二年.當還，將過.拜尊親，見孺子焉。」乃.共剋.期日。
    - 後.期方至，元伯具以白母，請設饌.以候之。母曰：「二年之別，千里.結言，爾何.相信之審邪？」對曰：「巨卿信士，必不乖違。」母曰：「若然，當為爾.醞酒。」至其日，巨卿.果到，升堂.拜飲，盡歡.而別。
  errata_ref: E1
  annotations:
    - {"no": 1, term: 字, text: 本名以外另取的別名。}
    - {"no": 2, term: 太學, text: 中國古代設立在京城(首都)的最高教育機構，相當於現代的大學。}
    - {"no": 3, term: 共剋期日, text: 一起約定了某個日期。剋，約定。}
    - {"no": 4, term: 審, text: 確實。}
    - {"no": 5, term: 乖違, text: 違背。}
  annotations_note: |-
    這五條注釋的序號是 Word 自動編號（不在 `w:t` 文字流裡），PDF p2 印成 1.~5.；
    同批 L0160／L0163 的注釋序號則是直接打在文字裡。本檔一律用結構化的 `no` 欄記錄。
    ⚠️ 原文正文裡**沒有**上標數字對應這五條（L0160/L0163 有），注釋與詞條靠 term 對應。

