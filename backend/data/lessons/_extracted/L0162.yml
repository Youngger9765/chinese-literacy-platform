# ── 四 文言文聚光燈 ──
spotlight:
  label: 四、文言文聚光燈
  strategy_name: 判斷句
  strategy_type: classical_chinese
  answer_carrier: |-
    三種載體混用：紅色 ☑（w:sym Wingdings F0FE）2 個、
    橘色手寫（解 rStyle 才看得到顏色）、以及文字層的字母 V（是／不是表格 7 格）。PDF p6~p8 可見。
  blocks:
    - type: guide
      text: 課文開頭介紹故事的主人翁出場時說「范式字巨卿，山陽金鄉人也」，這是一種很典型的文言文句子，像這樣的句型，我們稱它為判斷句。

    - type: concept_box
      text: 判斷句：用來判斷人、事、物是什麼或不是什麼的句子。

    - type: multi
      label: 輕練習
      prompt: 以白話文舉例，底下三個句子裡有兩個是判斷句，請你勾選出來。
      options:
        1: 這個圖書館是一幢美麗的建築物
        2: 那個長髮的孩子不是女生
        3: 猛虎突然竄出把他弟弟攫走了
      answers: [1, 2]

    - type: guide
      text: |-
        發現了嗎？判斷句裡都會有「是」或「不是」來「判斷」事物的屬性或內涵。
        那麼文言文要怎麼表示「是或不是」呢？

    - type: guide
      text: |-
        一、「者也」組合變化
        1.「……者，……也。」這一種最常見。
        例如：廉頗者，趙之良將也。(史記)
        白話：廉頗是趙國的良將。
        2.「……者，……。」只用「者」，不用「也」。
        例如：佳兵者，不祥之器。（天工開物）
        白話：精良的武器，是不祥的東西。
        3.「……，……也。」不用「者」，只用「也」。
        例如：儉，美德也。(儉訓)
        白話：節儉是美德。
        4.「……，……。」「者」、「也」都不用。
        例如：劉備，天下梟雄。(三國志)
        白話：劉備是天下的梟雄。

    - type: exercise
      label: 輕練習
      instruction: 依原文的意思，在白話的空格處填入適當的語詞，完成句子。
      items:
        - type: free_text
          prompt: 原文：孝，德之本也。➡白話：孝順（　）道德的根本。
          blanks: [{answer: 是}]
        - type: free_text
          prompt: 原文：信，國之寶也。➡白話：誠信（　）國家的珍寶。
          blanks: [{answer: 是}]
      prompt_note: |-
        這兩題的「➡」是文字層真的字元（全檔 w:sym 沒有箭號符號），照字面抄。

    - type: guide
      text: |-
        二、用「乃、為、即、蓋、非」表示
        「乃、為、即、蓋」相當於白話的「是」；「非」相當於白話的「不是」。
        例如：司馬懿乃魏之名將。(空城計)
        白話：司馬懿是魏國的名將。
        例如：非禮勿聽，非禮勿視。(論語)
        白話：不是合禮的事不要聽，不是合禮的事不要看。

    - type: exercise
      label: 輕練習
      instruction: 請猜一猜：下面有幾個句子，句中加框的字是什麼意思，請在正確的欄位打勾。
      note: 表格三欄（欄名照原稿）：是／不是／句子。答案是在「是」或「不是」欄印一個字母 V。
      answer_carrier: 文字層的字母「V」（不是 ☑ 也不是橘字）；前兩列黑色、後五列橘色
      items:
        - {type: free_text, prompt: 例1：司馬懿乃魏之名將, answer: 是}
        - {type: free_text, prompt: 例2：無是非之心，非人也。, answer: 不是}
        - {type: free_text, prompt: 人為刀俎，我為魚肉, answer: 是}
        - {type: free_text, prompt: 人非聖賢，孰能無過, answer: 不是}
        - {type: free_text, prompt: 少府徐仁，即丞相車千秋女婿也。, answer: 是}
        - {type: free_text, prompt: 勝敗乃兵家常事。, answer: 是}
        - {type: free_text, prompt: 庭下如積水空明，水中藻荇交橫──蓋竹柏影也。, answer: 是}

    - type: exercise
      label: 統整練習
      instruction: 下列有5個判斷句，各題的題幹都是文言文的白話翻譯，請依文意選出原來的文言文句子。
      items:
        - type: single
          prompt: 1.結成三尺厚的冰層，不是一天的寒冷所能造成的。
          options: {A: 冰凍三尺，非一日之寒, B: 冰凍三尺，一日之寒也}
          answer: A
        - type: single
          prompt: 2.我如果是司馬懿，一定不會退兵。
          options: {A: 吾若為司馬懿，必不便退也, B: 吾若司馬懿為，必不便退也}
          answer: A
        - type: single
          prompt: 3.法律是天子要跟天下人民共同遵守的。
          options: {A: 法者，天子所與天下公共也, B: 法與天子，所與天下公共也}
          answer: A
          explanation: |-
            第3題解析：
            本題的主語是「法律」，不是「法律與天子」。
        - type: single
          prompt: 4.只有來而沒有往，這不是符合禮節的行為。
          options: {A: 來而不往，蓋禮也, B: 來而不往，非禮也}
          answer: B
        - type: single
          prompt: 5.弈秋是全國最擅長下棋的人。
          options: {A: 弈秋通國者，善弈也, B: 弈秋，通國之善弈者也}
          answer: B
          explanation: |-
            第5題解析：
            判斷句是說明「主語是什麼或不是什麼」的句子，因此「是/不是」之前就是主語的位置。本題的主語是「弈秋」，不是「弈秋通國」。

# ── 五 閱讀理解 ──
comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（在文字層，顏色只有解 rStyle 才看得到），PDF p8~p9 可見
  header_note: 標題那一叢文字方塊裡有一個孤立的「✓」(U+2713)，是章節圖示的裝飾，不是答案
  questions:
    - index: 1
      stem: 下列選項「」中的字，何者字義解釋錯誤？
      options:
        A: 請設「饌」以候之——酒菜
        B: 當為「爾」醞酒——你們
        C: 「若」然——如果
        D: 必不「乖違」——遵從
      answer: D
      explanation: |-
        第1題解析：
        D.乖違，違背。
    - index: 2
      stem: 張劭對他的媽媽說：「巨卿信士，必不乖違」。依據對話的內容，請問：「信士」是什麼意思？
      options: {A: 誠實守信的人, B: 信任朋友的人, C: 相信報應的人, D: 信仰神靈的人}
      answer: A
    - index: 3
      stem: 「相隔千里的約定」一文的主旨與下列何者接近？
      options:
        A: 范式與張劭都是刻苦讀書的典範
        B: 張劭的母親不輕易相信他人的承諾
        C: 范式與張劭信守約定，展現誠信精神
        D: 朋友間不要計較利害，應該互相幫助
      answer: C
    - index: 4
      stem: 下列文句中，哪個選項的「為」字可以用白話文的「是」來解釋？
      options:
        A: 「為」了準時到校，他很早就起床了
        B: 這件衣服的材質「為」純棉
        C: 我們應該「為」自己的行為負責
        D: 他的夢想是成「為」一名醫生
      answer: B
      explanation: |-
        第4題解析：
        為了，表示行動的目的
        是
        替、給
        轉變成的意思。
      explanation_note: 解析方塊在 PDF p8 上逐項對到 A~D，但文字層沒有印 A./B./C./D. 前綴，照文字層抄
    - index: 5
      stem: 下列句子中的▢▢處都缺少了主語，如果依本文文意要為句子補上主語，請問：哪一選項的主語是指元伯？
      options:
        A: ▢▢遊太學，為諸生
        B: ▢▢後二年當還，將過拜尊親
        C: ▢▢請設饌以候之
        D: 巨卿信士，▢▢必不乖違
      answer: C
      explanation: |-
        第5題解析：
        B、D的主語都是范式。
        是「元伯」請他的母親準備酒菜，所以主語是「元伯」。
      explanation_note: |-
        這一題的解析方塊在文字層裡尾巴多黏了第 4 題解析的三行（「C.是／替、給／轉變成的意思。」），
        PDF p9 上那三行被排到方塊外看不見。判為文字方塊複製殘留，未收進 explanation。

# ── 六 自我挑戰 ──
self_challenge:
  label: 六、自我挑戰
  teacher_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  strategy_flow_note: |-
    三個箭號都是文字層真的字元 U+2B62（⭢），不是 w:sym —— 全檔 w:sym 只有 F0FE 與 F026，
    沒有任何箭號符號，所以照字面抄無誤（與同批 L0160 相同）。
  passage: 馬亮善相人，為夔路1監司2日，呂夷簡3父為州職官，一見夷簡，即許以女嫁之。其妻怒曰：「君嘗以此女為國夫人，何為與此人子？」亮曰：「此所以為國夫人也。」(112會)
  passage_note: 句末的「(112會)」是題目來源標記（112 年會考），原稿如此
  annotations:
    - {"no": 1, term: 路, text: 宋代地方行政單位，層級由高至低為路、州、縣。}
    - {"no": 2, term: 監司, text: 監察地方屬吏的職官。}
    - {"no": 3, term: 呂夷簡, text: 宋仁宗時的宰相。}
  annotations_note: 這三條注釋前面有一個 `w:sym Wingdings F026` 的裝飾圖示（書本符號），不是答案
  translation: |-
    馬亮很會看人，當時他是夔路監司，呂夷簡的父親是州職官(依注釋可知，馬亮是呂父的長官)。馬亮初見呂夷簡，就把女兒許配給他。他的妻子生氣地說：｢您曾說要讓女兒成為國公夫人，為何把女兒嫁給這個人的兒子?｣馬亮說：｢這就是讓女兒成為國公夫人的辦法。｣
  translation_note: |-
    翻譯方塊裡的引號用的是半形的「｢」「｣」(U+FF62/U+FF63)，不是全形的「」；問號也是半形「?」。
    照原稿抄，不改。
  items:
    - label: （一）
      instruction: 請依照故事脈絡，回答下列問題。
      answer_carrier: 橘色手寫（在文字層），PDF p10 可見
      questions:
        - {index: 1, prompt: 根據斷句後的第一個分句，主語是誰？, answer: 馬亮}
        - {index: 2, prompt: 承上題，這個主語怎麼樣或做什麼？, answer: 他很會相人/他是夔路監司}
        - {index: 3, prompt: 這個分句還有另一個人物，他叫什麼名字？, answer: 呂夷簡}
        - {index: 4, prompt: 承上題，這個人怎麼樣或做什麼？, answer: 他的爸爸是州職官}
        - {index: 5, prompt: '根據這個分句出現的人物，誰「一見夷簡，即許以女嫁之」？(補主語)', answer: 馬亮}
  quiz:
    label: （二）閱讀理解測驗
    questions:
      - index: 1
        stem: 根據這段文字，下列敘述何者最恰當？
        options:
          A: 馬亮預見呂夷簡將來必身居朝廷要職
          B: 馬亮與呂父有私交，故結為兒女親家
          C: 馬亮之妻希望女兒嫁入國夫人的家中
          D: 馬亮為了升官，把女兒許配給呂夷簡
        answer: A
        options_note: 這四個選項的代號後面沒有印頓點（A馬亮…），與前面各大題的「A.」不同，原稿如此
