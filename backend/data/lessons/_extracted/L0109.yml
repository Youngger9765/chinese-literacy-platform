comprehension:
  instruction: 請根據文章內容，讀完每一個選項後，選出最適合的答案。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 3、4、5 題有
  questions:
    - index: 1
      answer: D
      stem: 下列語詞何者使用不正確？
      options:
        A: 她走過挫折，終於從害羞的新人「蛻變」成為獨當一面的老手
        B: 網路直播讓訊息傳播「無遠弗屆」，海外觀眾也能即時觀看
        C: 這個角色外表亮麗，對劇情卻毫無作用，被批評只是個「花瓶」
        D: 他獨自站在空蕩的球場上，心中「群情激昂」，久久不能平靜
    - index: 2
      answer: B
      stem: 依據第5段內容，網路時代「鏡頭、截圖無遠弗屆」最可能造成哪一種連鎖影響？
      options:
        A: 片段影像更容易被保存，隊員便能自行檢查動作並改善表演
        B: 片段影像易被挪用、再製與放大，惡意評論使隊員承受壓力
        C: 隊員曝光機會增加，觀眾便能完整了解她們的訓練與工作
        D: 影像傳播範圍變廣，服裝爭議便會逐漸減少
    - index: 3
      answer: C
      stem: 文本把啦啦隊比喻為「掌握賽場氣氛的指揮家」，這個比喻最想強調哪一點？
      options:
        A: 啦啦隊必須像指揮家一樣懂得演奏各種樂器
        B: 啦啦隊的領導者必須指揮所有的隊員進行加油表演
        C: 啦啦隊能帶領觀眾進入節奏，整合氣氛並提升士氣
        D: 啦啦隊須依指揮劇本演出，不能根據比賽狀況調整
      teacher_hint: 比喻用來凸顯「領導節奏、整合群眾、帶動士氣」的功能
    - index: 4
      answer: A
      stem: 文章在結尾說「不妨換一種角度看待這群氣氛指揮家」，作者希望讀者做到哪件事？
      options:
        A: 看見笑容背後的訓練與紀律，用尊重取代誤解
        B: 更專注觀察服裝造型，分辨哪一隊的設計更用心
        C: 更積極學習應援口號，讓球場氣氛變得更加熱烈
        D: 避免在網路上討論啦啦隊，以免任何評論造成壓力
      teacher_hint: 作者希望讀者把焦點放回專業與勞動，並在網路時代更謹慎地觀看與評論
    - index: 5
      answer: C
      stem: 下列哪一項最能概括全文的主要論點？
      options:
        A: 認為啦啦隊訓練辛苦，因此觀眾不應再討論任何服裝設計
        B: 啦啦隊的主要價值在外貌與舞台效果，能讓觀賽更加熱鬧
        C: 強調啦啦隊的專業與辛勞，並呼籲觀眾以尊重的眼光看待
        D: 主張最好不要在網路上傳截圖改圖，以減少啦啦隊的爭議
      teacher_hint: 文中用大量篇幅說明訓練、體能、情緒管理，並在結尾呼籲「換一種角度」看她們背後的付出，立場明顯偏向尊重專業

