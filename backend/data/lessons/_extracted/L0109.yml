      columns: [段落/聚焦, ❶觀點(看法), ❷支持理由(證據)]
      answer_carrier: 紅色 ☑（w:sym），PDF p5~p6 可見；本表 8 個 ☑
      rows:
        - 段落/聚焦: |-
            段2/
            有功能
          ❶觀點(看法): |-
