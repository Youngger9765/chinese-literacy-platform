# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  checklist_note: 第 2 條在 PDF p1 被文字方塊邊界裁掉尾字，印成「…段落做上記」；文字層是完整的「做上記號。」
  # 段號欄外的三段未編號開場情境
  preface: |-
    亞倫是原住民，每當進入一個新環境時，別人最常用來跟他打招呼的話是：「你酒量很好吧！你皮膚怎麼那麼白？」
    下週是學校舉辦的社區服務日，育仁因為肢體障礙，好朋友對他說：「你不方便，不用來沒關係，老師一定會體諒的。」
    星期六園遊會，學務處老師請體育班同學幫忙：「跟上次運動會一樣，這次整個會場的桌椅就交給你們了，搬完我請你們喝飲料。」
  preface_note: |-
    ⚠️ 課文最前面有**三段未編號的開場情境**（三個微歧視場景），段號欄的「一」是從
    「上述場景在我們的生活中屢見不鮮…」才開始編。
    ⛔ 不要把它們併進第 1 段，也不要當成獨立編號段落 —— 那會讓段數變 10，跟印出的 7 個號碼對不上，
    念順順的 ☞（指第 6 段）就會指錯。
  paragraph_count: 7
  paragraphs:
    - idx: 1
      text: 上述場景在我們的生活中屢見不鮮，很多人聽到這樣的話也不會有特別的感覺。即使感覺到些許不對勁，也往往認為對方「沒有惡意」、「沒那麼嚴重」或「無傷大雅」。
    - idx: 2
      text: 那麼，讓我們再仔細想想。
    - idx: 3
      text: 與原住民朋友互動時，總是用酒量和膚色作為開場白，暗示原住民「應該」會喝酒，或「應該」有較深的膚色，這樣才符合「典型的原住民」形象。這類話語顯示了社會對原住民族群的理解不足，無形中也加深了刻板印象和偏見。
    - idx: 4
      text: 至於育仁的例子，朋友本意是體諒他的不便，但這句話卻隱含了對身障者的「低期望」和「過度保護」。預設育仁無法像其他同學一樣參與社區服務，甚至忽略了他可以自行決定是否參加，讓他感覺自己被「特別對待」了。
    - idx: 5
      text: 而學務處老師每次都請體育班的學生負責搬運桌椅，則流露出對體育班學生的單一印象，認為他們「就比較適合」做體力勞動工作，對他們並不公平，也忽視了體育班學生在其他領域的才能。
    - idx: 6
      text: 這些看似平常的小事，就是「微歧視」。微歧視的「微」指的是這些日常言語或行為往往很微小、隱蔽而不易察覺，卻可能隱含對特定群體的刻板印象或偏見。說話的人有時並沒有惡意，仍可能讓人受到傷害。例如，特別強調某些群體的特性，或對弱勢群體表現出過度的憐憫，日積月累後，這些說法可能逐漸滲透到人們的價值觀中，不但說話的人無感，甚至連長期受到微歧視的群體，也可能漸漸內化這些偏見，進而對自己產生負面的觀感。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 7
      text: 微歧視的「隱蔽」特性，讓它很難被發現。要破除微歧視，最重要的是時常反思自己，避免用簡化的思維模式去了解或形容某個群體。其次，萬一你正是那位「被微歧視」的對象，別人說的話讓你覺得不舒服，建議你溫和的提出自己當下的感受，這不只維護了自己的權益，也在幫助對方學到更合宜的價值觀與溝通方式。最後，我們都要留意自己脫口而出的話語，因為話語反映了我們對世界的看法，也是一面鏡子，照出我們在面對多元文化時，是否真正具備尊重與包容的態度。
  # 課文右緣印的累計字數（從 ☞ 所在的第 6 段起算）
