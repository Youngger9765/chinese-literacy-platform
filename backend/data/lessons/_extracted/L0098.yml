# ── 五 文章重點表 ──
keypoints:
  title: 隱藏在日常對話中的「微歧視」
  layout: list
  answer_carrier: 橘色手寫字與紅色 ☑（w:sym Wingdings F0FE，共 4 個），PDF p4 可見
  rows:
    - label: 定義
      value: |-
        微歧視：在互動中出現看似微小、隱蔽、無意的
        【　】或偏見。
      blanks: [{answer: 刻板印象}]
    - label: 例子分析
      instruction: ※請勾選出正確答案(單選)
      items:
        - label: "1"
          value: 對原住民的刻板印象：與原住民互動時，強調酒量與膚色，加深對原住民族群的【 □①憐憫　□②尊重　☑③偏見 】。
          options: {1: 憐憫, 2: 尊重, 3: 偏見}
          answer: 3
        - label: "2"
          value: 對身障者的過度保護：以體諒為出發點，但話語中隱含對身障者的【 ☑①低期望　□②尊重　□③平等 】與過度保護。
          options: {1: 低期望, 2: 尊重, 3: 平等}
          answer: 1
        - label: "3"
          value: 對體育班的單一印象：總是讓體育班學生做勞動性工作，對他們不公平，也忽視了他們在其他領域的潛力。
    - label: 影響與特點
      items:
        - label: "1"
          value: |-
            微歧視似無傷大雅，但長期累積會導致偏見被
            【 □①外化　☑②內化 】，滲透到人們的【　】中。
          options: {1: 外化, 2: 內化}
          answer: 2
          blanks: [{answer: 價值觀}]
        - label: "2"
          value: 微歧視的特點在於它【 □①明顯　☑②隱蔽 】，因此難以被發現和改正。
          options: {1: 明顯, 2: 隱蔽}
          answer: 2
    - label: 破除微歧視
      value: |-
        破除微歧視的關鍵是【　】，並避免用刻板印象來判斷某個群體。( 填入代號 )
        A.經常反思自己的思維模式和語言。
        B.對每個人保持低期望；
        Ｃ.被微歧視時，可溫和表達自己的感受與期望
      blanks: [{answer: "A、C"}]
      value_note: 原稿的答案印成「　A、Ｃ　」（第二個代號用全形Ｃ，選項清單的 C 也是全形），本檔 blanks 記半形。

# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 辨識與回應微歧視
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本節 7 個）與橘色手寫字，PDF p5~p7 可見
  structure_note: |-
    ⛔ 兩個勾選表刻意攤成 `multi` 留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的表格
    只會畫出 instruction，內容整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: |-
        看完了本課，我們知道，微歧視常常不是故意的，卻可能藏著刻板印象或偏見。這些話看似沒什麼，卻可能讓人不舒服或受傷。
        例如：「你是原住民，應該很會唱歌喔？」、「你是體育班，搬重的東西一定沒問題吧！」「女生找個好老公比找個好工作重要吧！」這些話可能沒有惡意，但如果只因對方屬於某個群體，就替他預設能力、個性或生活方式，便可能形成微歧視。
        為了避免這樣尷尬的情形發生，從日常生活中，我們可以培養個人的覺察能力，學習如何正面應對微歧視！底下是一些練習！

    - type: guide
      text: 小叮嚀：刻板印象或對某族群體的偏見，很可能就是微歧視。
      text_note: 原稿這行開頭有一個 `w:sym Wingdings 2 F045`（☛ 手指符號），是裝飾不是勾選。

    - type: guide
      text: ◎ 小試身手

    - type: guide
      text: 一、辨識微歧視：

    - type: multi
      prompt: 請判斷下列情況是否為微歧視，是微歧視的打Ｖ。
      options:
        1: 對女生說：「你這麼漂亮，面試絕對大大加分。」
        2: 對同學說：「你上次接力跑得很快，這次還想參加嗎？」
        3: 你是原住民？那運動會全看你表現了！
        4: 對身障者說：「你這樣還來上學，大家應該跟你看齊。」
        5: 對新朋友說：「你平常喜歡做什麼運動？」
        6: 對同性戀的朋友說：「同性戀的藝術細胞是不是都比較好？」
      answers: [1, 3, 4, 6]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），每列左欄一格

    - type: guide
      text: 二、處理微歧視：

    - type: multi
      prompt: 如果是你遭遇微歧視，可以怎麼反應？(可以的打Ｖ；可參考課文末段作答）
      options:
        1: 溫和的表達自己當下的感受：「你這樣講，我感覺不舒服」。
        2: 也許是我想太多，是我太玻璃心了。
        3: 如果當下不方便回應，可先離開，之後再找可信任的人協助。
        4: 說清楚界線：「我不希望別人因為我是OO，就這樣判斷我。」
      answers: [1, 3, 4]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），每列左欄一格

    - type: guide
      text: 三、向微歧視說不：停下來想一想、換個說法

    - type: guide
      text: |-
        ❶停下來想一想：
        1.這句話是不是在替一群人貼標籤？
        2.如果別人只看我的身分就判斷我，我會有什麼感受？
        被誤解？被小看？被特別對待？

    - type: guide
      text: |-
        ❷換個說法：
        避免群體標籤，改問個人特質

    - type: passage
      paragraphs:
        - 1.示例：
        - X（微歧視的說法）:「你是體育班，搬重物一定超強的！」
        - ↓換個說法
        - Ｏ（不是微歧視）:「現在需要人手幫忙搬桌椅，你可以來幫忙嗎？」

    - type: free_text
      prompt: |-
        2.你來換個說法：
        X（微歧視的說法）:「你是原住民，運動會大隊接力全靠你了！」
        ↓換個說法
        Ｏ（不是微歧視）:【　】
      blanks: [{answer: 運動會大隊接力缺人吔，你可以跑嗎？}]
      answer_carrier: 橘色手寫字（PDF p6）；文字層已填有同樣的答案

    - type: guide
      text: 四、開啟友善對話：問對方自己，不替群體下結論

    - type: guide
      text: 你想拉近與朋友的距離，但又不知道會不會讓對方不舒服嗎？來練習用「安全的話題」以及「請對方分享」的方式開啟友善對話吧！

    - type: free_text
      prompt: |-
        ❶用安全的話題開啟對話：有些話題是中性、大家喜歡，又不會踩雷的，例如：食物、天氣、運動、最近的時事。
        例→麟洋配又得一次奧運羽球雙打金牌，超感動的！你有看轉播嗎？
        （換你）→【　】
      blanks: [{answer: 學校旁邊開了一家賣滷肉飯的店，聽說便宜又好吃，你有吃過嗎？}]
      answer_carrier: 橘色手寫字（PDF p7）；文字層已填有同樣的答案

    - type: free_text
      prompt: |-
        ❷請對方分享：真心讚賞對方優點，邀請對方分享專長和興趣。
        例→你讀好多書喔，最近讀的哪一本好看？有推薦的嗎？
        （換你）→
      no_correct_answer: true
      answer_carrier: 學生自填，原稿這一格是空的（前一題有填、這題沒填）

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p7~p8）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: A
      stem: 下列語詞，何者使用錯誤？
      options:
        A: 模範生的她偶爾犯錯，被老師罵的場景「屢見不鮮」
        B: 他偶爾說話失禮，大家都覺得「無傷大雅」，沒必要太過在意
        C: 她靠著「日積月累」的練習，終於在舉重比賽中獲勝
        D: 這間小店位置「隱蔽」，第一次來的人很難發現
      explanation: 第1題解析：(指某事常見、已經見怪不怪，偶爾犯錯不太合適。)
      explanation_note: 原稿是一個浮動說明框，印在題目右上方；題幹的「錯誤」加了底線。
    - index: 2
      answer: B
      stem: 為什麼老師每次都讓體育班學生搬桌椅，可能構成微歧視？
      options:
        A: 因為老師可能忽略了其他班學生也可以搬桌椅的能力
        B: 因為老師只根據體育班身分，認為他們最適合體力勞動
        C: 因為體育班學生只有喝飲料就願意幫忙老師搬桌椅
        D: 因為老師不喜歡體育班的學生，故意使喚他們勞動
      explanation: 第2題解析：(段５：老師認為體育班學生只適合做體力勞動，這種忽視其他才能的行為是微歧視。)
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡排在第 5 題之後，本檔歸位到本題；「段５」的 5 用全形。
    - index: 3
      answer: A
      stem: 下列選項何者最能表達本文的主旨？
      options:
        A: 微歧視看似事小，實則影響深遠，應反思言行促成多元接納
        B: 微歧視是一種社會問題，應立法制止防治、處罰此類行為
        C: 弱勢群體需要被大家保護，讓他們不再被歧視
        D: 大眾應多關注社會問題，並尋求公平解決方案
      explanation: 第3題解析：(最能反映文章的主旨，強調微歧視的隱蔽性及其影響，並呼籲人們反思與避免此類行為。)
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡排在第 5 題之後，本檔歸位到本題
    - index: 4
      answer: D
      stem: 要破除微歧視，何者不是正確的方法？
      options:
        A: 時常反思自己的思維模式
        B: 要留意自己脫口而出的話語
        C: 被微歧視時可直接溫和溝通
        D: 可減少與他人的交談
      explanation: 第4題解析：(課文末段說明，要時常反思言行、避免過度簡化形容某些群體。而非減少交談。)
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 之前；題幹的「不是」加了底線。
    - index: 5
      answer: C
      stem: 下列情境敘述中，哪一項符合「微歧視」現象？
      options:
        A: 在公司裡，所有員工都必須參加安全培訓，無論其背景如何
        B: 每年學校都會舉辦運動會，鼓勵所有學生參與各項比賽
        C: 對轉學生說：「你從臺東來的，你會搭臺北的公車捷運嗎？」
        D: 老師在課堂上鼓勵學生提出不同的意見和觀點
      explanation: 第5題解析：根據轉學生是臺東來的，推測其不會使用交通工具，這顯示了對轉學生的刻板印象。
      explanation_note: 原稿是一個浮動說明框，排在本題之後

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [屢見不鮮, 無傷大雅, 開場白, 刻板印象, 隱蔽, 憐憫, 日積月累, 滴水穿石, 滲透, 內化, 偏見]
  target_words_note: |-
    灰框 **11** 個 —— 是總表那組（含滴水穿石）與語詞框那組（含偏見）的聯集。
    語詞框與第三、四大題都只有 10 個，見 meta._總表_對照note。
  grid_size: [10, 10]
  grid:
    - 隱藏癮君子無商大偏白
    - 形隱穩定滴水穿透冰見
    - 眼蔽遮屢開滲刻話滴水
    - 鏡看見戰場透象板鞋日
    - 傷不無屢白海印畫印積
    - 鮮家內敗人滲人蔘果象
    - 隱話畫化日積月累無理
    - 避雕刻畫人生印章傷受
    - 月滴水穿石可憐鄰大人
    - 累黑板白板聯憫懷雅風
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 偏見
      cells: [[1, 9], [2, 10]]
      direction: diagonal_down_right
    - word: 隱蔽
      cells: [[2, 2], [3, 2]]
      direction: vertical
    - word: 屢見不鮮
      cells: [[3, 4], [4, 3], [5, 2], [6, 1]]
      direction: diagonal_down_left
    - word: 開場白
      cells: [[3, 5], [4, 5], [5, 5]]
      direction: vertical
    - word: 滲透
      cells: [[3, 6], [4, 6]]
      direction: vertical
    - word: 刻板印象
      cells: [[3, 7], [4, 8], [5, 9], [6, 10]]
      direction: diagonal_down_right
    - word: 內化
      cells: [[6, 3], [7, 4]]
      direction: diagonal_down_right
    - word: 日積月累
      cells: [[7, 5], [7, 6], [7, 7], [7, 8]]
      direction: horizontal
    - word: 無傷大雅
      cells: [[7, 9], [8, 9], [9, 9], [10, 9]]
      direction: vertical
    - word: 滴水穿石
      cells: [[9, 2], [9, 3], [9, 4], [9, 5]]
      direction: horizontal
    - word: 憐憫
      cells: [[9, 7], [10, 7]]
      direction: vertical
  answer_paths_note: |-
    11 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。
    幾何交叉驗證（單向警報）：以找字表格元素當邊界，表格內 roundRect = **11 個**（全文也是 11），
    路徑 11 條 → 沒有「紙上 > 路徑」的缺條警報。
    ⚠️ **紙外殘留：未驗**（`posOffset` 判準只認錨點型溢出，對「掛在儲存格裡被排版推出去」零命中，
    2026-08-18 更正）；扣掉未偵測的殘留只會讓紙上數更少，不會讓警報成立。
    正確性證據是每條 cells 套回 grid 拼字（11/11 全中）。
    ⚠️ 格子裡有多個誘答：第 2 列有「滴水穿」但第 4 格是「透」不是「石」，真正的「滴水穿石」在第 9 列。

