# ── 三 語詞我最棒 ──
vocab_definitions:
  label: 本課語詞：
  vocabulary_bank: [忠心耿耿, 威風凜凜, 不寒而慄, 凜冽, 輾轉難眠, 淚水奪眶而出, 忐忑不安, 毫髮無傷, 凌亂, 遍體鱗傷, 蹭, 奄奄一息]
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  items:
    - {index: 1, word: 凜冽, definition: 形容天氣非常寒冷。}
    - {index: 2, word: 遍體鱗傷, definition: 全身都是傷。}
    - {index: 3, word: 蹭, definition: 用身體輕輕靠著、磨一磨，有時是撒嬌。}
    - {index: 4, word: 奄奄一息, definition: 形容生命快要結束，或非常虛弱。}
    - {index: 5, word: 忠心耿耿, definition: 非常忠實，不會背叛或離開。}
    - {index: 6, word: 毫髮無傷, definition: 形容在危險或災難中平安無事，連一點傷都沒有。}
    - {index: 7, word: 輾轉難眠, definition: 因為緊張、擔心或想太多事，翻來翻去睡不著。}
    - {index: 8, word: 忐忑不安, definition: 心情緊張、焦慮，不知道會發生什麼事。}
    - {index: 9, word: 淚水奪眶而出, definition: 眼淚不由自主的流出來。}
    - {index: 10, word: 凌亂, definition: 雜亂沒有秩序。}
    - {index: 11, word: 威風凜凜, definition: 看起來很有氣勢，讓人覺得厲害或很強。}
    - {index: 12, word: 不寒而慄, definition: 形容在極度恐懼之下，明明不冷，卻在發抖。}

