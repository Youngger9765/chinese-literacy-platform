# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 情緒管理ＡＢＣ
  strategy_type: character
  blocks:
    - type: concept_box
      text: |-
        在《白牙的最後一戰》裡，你可以看到獵人看到了滿地血跡，判斷白牙吃掉了小寶，因為一時的情緒和害怕，做出錯誤的決定，結果傷害了最忠心的朋友。生活中，我們其實也常遇到直接被情緒帶著走的時刻。
        那麼，情緒是怎麼來的呢？其實，情緒不只和事件本身有關，也會受到我們對事件的想法與解讀影響。心理學家將這個過程稱為「情緒管理的 ABC 模型」。

    - type: table
      label: 情緒管理的 ABC 模型
      rows:
        - [A（事件）, 發生的事（多數不可控）]
        - [B（認知）, 我們對事件的想法與解讀（可以練習調整）]
        - [C（情緒/結果）, 我們產生的情緒與行動反應（多數受B影響）]

    - type: sub_block
      label: 例如
      # 各段之間印的 ➔ 是圖形箭頭
      items:
        - {index: 1, text: 下雨了(事件)我可能會塞車、遲到(認知)焦躁，罵人(情緒/結果)}
        - {index: 2, text: 下雨了(事件)雨水可以幫助作物生長(認知)開心、感謝上天(情緒/結果)}

    - type: guide
      text: 你發現了嗎？同一件事，因想法不同，可能產生不同的情緒和反應。

    - type: fill_table
      label: ◎換你試試看
      instruction: 下列的情況下，你可能會產生什麼情緒呢？
      columns: [A事件, B認知（想法）, C情緒/結果]
      answer_carrier: 第三欄第 2、3 列為橘色手寫參考答案
      rows:
        - {index: 1, A事件: 下雨了, B認知: 不能上戶外體育課, C情緒: 厭煩、焦躁}
        - {index: 2, A事件: 老師表揚別的同學, B認知: 他比我優秀, C情緒: 失落、不開心}
        - {index: 3, A事件: 小寶不見了，白牙滿身是血。, B認知: 認為白牙吃掉小寶, C情緒: 生氣、憤怒}

    - type: fill_table
      label: 想一想，如果我們改變Ｂ認知（想法），結果會不會不同？
      columns: [A事件, B認知（想法）, C情緒/結果]
      answer_carrier: 第三欄為橘色手寫參考答案
      rows:
        - {index: 1, A事件: 下雨了, B認知: 可以到室內場地活動，不用曬太陽。, C情緒: 開心、興奮}
        - {index: 2, A事件: 老師表揚別的同學, B認知: 我平常都沒發現原來他有這些優點。, C情緒: 讚賞}
        - {index: 3, A事件: 小寶不見了，白牙滿身是血。, B認知: 白牙平常一直很保護小寶，不可能會傷害小寶，我來看看發生了什麼事。, C情緒: 擔心、緊張}

    - type: guide
      text: 你發現了嗎？改變「B-認知」，就可能產生不同的情緒，讓人感覺更舒服。所以，我們要練習換個角度看事情，就可以避免不可挽回的後果。

    - type: sub_block
      label: 例如 1（小明）
      passage: 小明開車時被別人超車嚇到，對方還按喇叭示威，他原來開心悠閒的心情一下變得又氣又急。他越想越生氣，猛踩油門想反超回去，結果因為速度過快而發生車禍。
      analysis: 小明被別人超車了，他認為受到別人挑釁，心情很不爽。
      prompt: 想一想，如果你是小明，在被超車時，你要怎麼想，才可以避免自己做出衝動的事？（複選）
      multi: true
      options:
        1: 告訴自己「安全比逞一時之快重要」
        2: 告訴自己「人善被人欺，總不能一輩子當個受氣包」
        3: 告訴自己「我才不要和這樣的人吵架」
      answer: [1, 3]
      answer_carrier: 紅色 ☑（圖形），被勾中的 □ 已從文字流消失

    - type: sub_block
      label: 例如 2（小芳）
      passage: 小芳下課時聽到同學竊竊私語，還朝她看，心想：「一定在說我壞話！」她感到很生氣，正準備質問時，才發現他們只是討論分組名單，根本與她無關，結果是自己白生氣了一場。
      analysis: 小芳看到同學竊竊私語，她認為他們在說她壞話，覺得很生氣。
      prompt: 想一想，如果你是小芳，你可以如何改變認知？
      answer_free_text: 告訴自己「事情還不確定前，不要急著下結論」

    - type: self_check
      label: ◎自我檢核
      instruction: 一、請你自己檢查以下3項，確定自己是否已經學會運用「情緒管理ABC模型」來思考與判斷。
      items:
        - 1.我能分辨A（事件）、B（想法）、C（情緒）之間的關係。
        - 2.我會嘗試改變B（想法），並觀察情緒是否因此改變。
        - 3.我能用改變想法的方式，避免因衝動做出錯誤決定。
      closing: 二、如果三項都打勾，恭喜你，你已經學會在情緒來臨時，做出更冷靜、更正確的選擇。你超厲害的！

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 下列語詞何者使用不正確？
      options:
        A: 一陣「凜冽」的寒風吹來，冷得我不由自主地縮起脖子
        B: 他從二樓跳下來，竟然「毫髮無傷」，真讓人驚訝
        C: 一想起跟好朋友吵架的事，我就「輾轉難眠」，一直睡不著
        D: 跑完一百公尺，我只能「奄奄一息」的喘氣
      teacher_note: (「奄奄一息」意思是生命垂危、快要死掉了，多用在重病、重傷或極度虛弱的情境中，語氣非常強烈。)
    - index: 2
      answer: C
      stem: 獵人在山中無法安心入睡，最可能的原因是什麼？
      options:
        A: 他擔心下雪抓不到獵物
        B: 他怕黑夜裡遇到狼群攻擊
        C: 他擔心家裡的小寶和白牙是否平安
        D: 他害怕明天天氣更差，會回不了家
      teacher_note: (第四段描述獵人「輾轉難眠，想著的都是：小寶會不會餓了？白牙會照顧他吧？」所以擔心的是孩子跟白牙。)
    - index: 3
      answer: B
      stem: 獵人為什麼會懷疑白牙吃了小寶？
      options:
        A: 因為白牙肚子餓了
        B: 因為朋友曾經警告他
        C: 因為白牙很喜歡小寶
        D: 因為白牙搖著尾巴迎接他
      teacher_note: (第六段。A－是誤導選項，故事沒寫白牙餓得失控。C－正確事實，但不可能因此懷疑。D－是白牙表現信任的行為，反而是無害的證據。)
    - index: 4
      answer: A
      stem: 第十三段提到：「白牙已經奄奄一息，但牠用盡全力，把尾巴搖了幾下。」為什麼白牙快死了，還在搖尾巴？
      options:
        A: 因為白牙還是很信任主人
        B: 因為每隻狗臨死時都會搖尾巴
        C: 因為白牙覺得主人在跟牠玩
        D: 因為白牙想要主人給牠東西吃
      teacher_note: (第十三段：白牙沒有反抗，還搖尾巴，是牠信任主人的表現。)
    - index: 5
      answer: B
      stem: 讀完本課，請問作者想要傳達什麼道理？
      options:
        A: 狗咬人的本性很難改變，要特別小心
        B: 衝動的決定可能帶來無法挽回的錯誤
        C: 不要單獨留小孩子在家裡，容易有意外發生
        D: 防人之心不可無，即使是信任的朋友，也要有所保留
      teacher_note: (A-是村人偏見的錯誤看法。C-是情節中安排情境，不是作者的主張。D-雖看似合理，但白牙並沒有背叛，是獵人自己誤會了牠。)

