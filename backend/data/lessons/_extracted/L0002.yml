      stem: 下列句子中，「　」內的語詞使用何者錯誤？
      options:
        A: 竹節蟲停在枝葉間，身體顏色和四周景物「融為一體」
        B: 詐騙集團把假簡訊「偽裝」成銀行通知，引誘民眾點開連結
        C: 他模仿老師說話的神情和語氣，表演得「活靈活現」
        D: 這座城堡裝飾華麗，像「銅牆鐵壁」般美麗
      teacher_note: 「銅牆鐵壁」比喻非常堅固、難以攻破，不能用來形容外觀華麗
    - index: 2
