      stem: 比較本文第2、3段，「保護色」和「偽裝」最主要的差別是什麼？
      options:
        A: 保護色靠毒液防禦，偽裝靠外殼抵擋攻擊
        B: 保護色讓顏色接近環境，偽裝讓外形像其他事物
        C: 保護色需要同伴合作，偽裝只能由動物單獨完成
        D: 保護色用來嚇退天敵，偽裝只用來隱藏身體
      teacher_note: 保護色的重點是身體顏色接近周圍環境；偽裝則是讓外形或花紋看起來像其他事物或動物
    - index: 3
      answer: A
      stem: 本文第4段先說：「有些動物雖然跑不快，卻能用毒液或難聞的氣味保護自己。」作者這樣寫，主要想說明什麼？
      options:
        A: 動物即使有行動上的弱點，也能用其他方法保護自己
        B: 動物只要跑得不快，就一定會使用毒液攻擊敵人
        C: 動物能不能生存，主要由牠們奔跑的速度決定
        D: 掠食者通常只會選擇跑得較慢的動物當食物
      teacher_note: 「雖然……卻……」形成轉折，凸顯有些動物跑不快，仍能靠毒液或氣味防禦
    - index: 4
      answer: C
      stem: 作者把動物的生存方法比成「祕密武器」，又把堅殼硬甲比成「銅牆鐵壁般的小房子」和「厚厚的裝甲」，主要想達到什麼效果？
      options:
        A: 增加軍事用語，使文章內容看起來更具科學性
        B: 說明動物的生存方法，都是模仿人類武器而來
        C: 把保護作用寫得具體有畫面，幫助讀者理解
        D: 強調動物只有身體強壯，才能在自然界中生存
      teacher_note: 這些比喻把抽象的保護功能轉成容易想像的畫面，使讀者更容易理解動物如何防禦敵人
    - index: 5
      answer: D
      stem: 下列哪一項最能概括本文主旨？
