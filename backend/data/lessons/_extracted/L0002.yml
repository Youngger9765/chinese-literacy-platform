body:
  paragraph_count: 9
  paragraphs:
    - idx: 1
      text: 臺灣溫暖濕潤，山林與溪河裡住著許多不同的動物。在大自然裡，每天都有追逐和逃生：掠食者四處尋找獵物，被捕食者設法逃過追捕。為了在大自然裡避開危險，許多動物發展出各種讓人驚嘆的生存妙招。
      source_text: 臺灣溫暖濕潤，山林與溪河裡住著許多不同的動物。在大自然裡，每天都有追逐和逃生：掠食者四處尋找獵物，被捕食者設法逃過追捕。為了在大自然裡避開危險，許多動物發展出各種讓人驚嘆竹的各種生存妙招。
      errata_ref: E1
    - idx: 2
      text: 第一招是保護色。有些動物的身體顏色和周圍的環境很像，所以敵人不容易發現牠們。例如，竹節蟲的身體呈褐色或綠色，停在枝葉間時，身體顏色和周圍環境十分接近；石虎有淺黃色的毛皮，上面還有黑色斑點，能和淺山的草叢、枯葉堆融為一體，很難被敵人看見。
    - idx: 3
      text: 第二招是偽裝。偽裝是指「把自己裝扮成另一種樣子」。
    - idx: 4
      text: 枯葉蝶就是偽裝高手，牠停在樹上時，整體看起來就像一片枯萎的黃葉（如圖1），連葉脈、破洞都和真的枯葉一模一樣。此外，臺灣最大的蛾──皇蛾，翅膀前端有像蛇頭的花紋。當牠擺動翅膀時，蛇頭圖案顯得活靈活現，像眼鏡蛇正在威嚇敵人（如圖2），常能把天敵嚇跑。
    - idx: 5
      text: 第三招是化學武器。有些動物雖然跑不快，卻能用毒液或難聞的氣味保護自己。眼鏡蛇遇到危險時，會張開脖子，準備用毒牙攻擊敵人。白鼻心受到驚嚇時，會分泌很臭的液體，黑眶蟾蜍的皮膚也會分泌毒液，讓敵人難受，不敢靠近，任何天敵都不會想吃這麼噁心的食物。
    - idx: 6
      text: 第四招是堅殼硬甲。有些動物沒有尖牙利爪、沒有毒，連跑都跑不快，但是牠們有堅硬的外殼。柴棺龜和食蛇龜遇到危險時，會把頭和四肢縮進龜殼裡；穿山甲則會把身體捲成一個圓球，用身上的硬鱗片保護自己。牠們一縮、一捲，就像躲進銅牆鐵壁般的小房子，也像穿上厚厚的裝甲，可以抵擋敵人的攻擊。
    - idx: 7
      text: 第五招是互助合作。對許多動物來說，大家一起合作，比單獨面對危險更安全。臺灣獼猴平常成群生活。當猴群在樹林裡找食物時，常會有幾隻猴子站在高處，注意四周，擔任警戒的工作。如果發現老鷹或其他危險，牠們就會大聲叫，提醒大家趕快逃走。猴媽媽們也會互相幫忙照顧小猴，讓牠們平安長大。大家互相幫忙，猴群就更容易生存。
    - idx: 8
      text: 動物使用的方法雖然不同，目的卻一樣──都是為了讓自己、同伴和下一代，在弱肉強食的自然競技場裡，有更高的存活機會。
    - idx: 9
      text: 這些有趣的生存妙招，讓我們看見大自然令人讚嘆的智慧與奧妙，也讓我們更懂得珍惜這個豐富多彩的世界。
  figures:
    - {id: 圖1, caption: 枯葉蝶（左下）與皇蛾（右上）翅膀上的蛇頭紋, bind: 枯葉蝶}
    - {id: 圖2, bind: 皇蛾蛇頭紋}
  inline_marked_terms: [融為一體, 偽裝, 枯萎, 一模一樣, 活靈活現, 威嚇, 銅牆鐵壁, 弱肉強食, 讚嘆]

