# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 遞進複句
  strategy_type: syntax
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        「我愛吃冰棒，更愛吃冰淇淋。」這句話裡，「更」表示：我喜歡冰棒，但我更喜歡冰淇淋，也就是喜歡冰淇淋的程度更高。像這樣，用「更」這類詞語，讓後半句的程度再加強的句子，就是遞進複句。
        常見的遞進複句語詞有：「還」、「更」、「不但……還……」、「不只……更……」、「不但……而且……」、「除了……還……」。這些能連接前後兩個內容的詞語，叫做關聯詞。
        讀到遞進複句時，可以特別注意後半句，因為後半句常是作者想加強說明的重點。
      emphasis_note: 首段「更喜歡」與末段「關聯詞」印成粗體

    - type: guide
      text: ◎ 小試身手：

    - type: figure
      referent: 兩台車比較的手繪插圖（綠色 1 號車、紅色 2 號車，配上下箭頭）
      text_carrier: image
      caption_lines:
        - 1.阿光的車子跑得很快。
        - 2.小傑的車子不但跑得很快，還很省油。
      placement: 印在「1.請依照下圖提示作答。」右側

    - type: exercise
      label: 小試身手第1題
      instruction: 1.請依照下圖提示作答。
      answer_carrier: 紅色手寫字與紅色 ☑（圖形），文字流無此資訊
      items:
