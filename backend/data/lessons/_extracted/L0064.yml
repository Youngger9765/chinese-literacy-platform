# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 情緒管理──悲傷五階段
  strategy_type: character_sel
  section_title_printed: 品格聚光燈
  section_title_note: |-
    本課印的是「品格聚光燈」，不是同系列其他課的「閱讀聚光燈」——
    但第七大題第 5 題的題幹又寫「根據**閱讀**聚光燈的練習」。原稿自己不一致，照原樣記錄。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）與橘色手寫字
  answer_carrier_bdr_note: |-
    第三種載體（框選語詞＝`<w:bdr>` 非 auto 顏色的字元框線）**本課沒有**：
    全課 13 個 w:bdr run 全是 `w:color="auto"`（都是課文那 10 個語詞的黑框＋標題框）。
    已查過，不是沒查。
  no_answer_note: |-
    「二、覺察自己的『悲傷五階段』」整節（三個情境 ＋ 一題自我盤點，共 4 題）
    原稿**一個勾都沒有** —— 那是自我覺察題，本來就沒有標準答案，逐題標 no_correct_answer。
    佐證：全課 F0FE 只有 10 個，9 個在文章重點表、1 個在本節「一、」的單選題，
    數量對得起來，不是漏抽。
  blocks:
    - type: concept_box
      text: |-
        失戀、落選、搬家或和朋友疏遠，都可能讓人感到失落。面對失落時，有人一開始不敢相信，有人會生氣，有人反覆想著「如果……就好了」，也有人感到沮喪，後來才慢慢接受。這些常見反應可以整理成「悲傷五階段」：
        否認、憤怒、討價還價、沮喪、接受
        這一課，我們要先辨識自己或他人可能出現的失落反應，再選擇合適的調適方法，幫助自己慢慢走過難過的時刻。

    - type: guide
      text: 一、辨識情緒--悲傷五階段：

    - type: fill_table
      prompt: 一、辨識情緒--悲傷五階段：
      columns: [階段, 狀態, 舉例, 辨識]
      column_headers_printed:
        階段: 階段
        狀態: 狀態
        舉例: 舉例（情境：被告知參加比賽落選、沒被選上學校代表）
        辨識: 辨識(根據本文情節，按階段寫上1到5)
      column_headers_note: |-
        表頭原稿是兩行排版（主標＋括號說明），`columns` 取主標以免欄名太長；
        完整字串留在 column_headers_printed。
      answer_carrier: 橘色手寫數字（PDF p5）；文字層的【 】內已填有同樣的數字
      rows:
        - 階段: "1"
          狀態: 否認
          舉例: 「應該是名單還沒公佈吧，不會沒有我吧？」
          辨識: |-
            【　】他有另一半了？怎麼可能？那我們的相處算什麼？
            【　】心感覺空空的，又像是有一把火
            【　】如果我夠勇敢，能早一點向他說出我的心意，我們會不會也有機會呢？
            【　】有點酸、有點苦，還夾雜著一絲不甘心。是不是我自作多情了？
            【　】我曾經因為這份情感而開心，也曾經真心期待過——那麼，或許它就不是白費的。
          辨識_blanks:
            - {answer: "1"}
            - {answer: "2"}
            - {answer: "3"}
            - {answer: "4"}
            - {answer: "5"}
          辨識_rowspan: 5
          辨識_note: 「辨識」欄是一個縱跨 5 列的合併儲存格，內容整個放在第 1 列，其餘 4 列該欄為空。
        - 階段: "2"
          狀態: 憤怒
          舉例: 「為什麼老師沒有選我？明明我也很努力！」
        - 階段: "3"
          狀態: 討價還價
          舉例: 「我如果去跟老師道歉、更認真練習，老師會不會給我機會？」
        - 階段: "4"
          狀態: 沮喪
          舉例: 「我是不是很差，怎麼做什麼都不行……」
        - 階段: "5"
          狀態: 接受
          舉例: 「雖然這次沒被選上很可惜，但我還是學到很多，也更認識自己的能力。」

    - type: single
      prompt: 第三段寫道：「混亂、震驚、失落，各種情緒交織在一起。」這句話最能說明什麼？（單選）
      options:
        1: 人面對失落時，可能同時出現多種感受。
        2: 人一次只能有一種感受，不能同時悲傷和生氣。
        3: 五種失落反應一定會按照相同的順序一一出現。
      answer: 1

    - type: guide
      text: →小提醒：悲傷反應不一定按照順序出現，也不一定每一種都會出現；有時，幾種反應還可能同時出現。

    - type: guide
      text: 二、覺察自己的「悲傷五階段」：根據情境，勾選出你最常出現的內心語言。

    - type: multi
      prompt: ◎情境一：你和好朋友吵架，對方開始疏遠你。
      options:
        1: 否認：「我們應該很快就會和好吧？」
        2: 憤怒：「他怎麼可以那麼小氣，明明是他的錯！」
        3: 討價還價：「如果我主動道歉，是不是就沒事了？」
        4: 沮喪：「可能我們真的不會再像以前那樣了，好難過。」
        5: 接受：「有些朋友會離開，但我還有其他重要的人。」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

    - type: multi
      prompt: ◎情境二：考試成績比預期差很多。
      options:
        1: 否認：「一定是老師改錯卷了吧？」
        2: 憤怒：「為什麼我明明有讀書卻考成這樣？太氣人了！」
        3: 討價還價：「下次我每天多念一小時，是不是就能進步？」
        4: 沮喪：「我可能就是讀書沒天分吧，覺得很沮喪。」
        5: 接受：「雖然這次考不好，但我可以檢討下次再挑戰。」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

    - type: multi
      prompt: ◎情境三：家人決定要搬家，你要離開熟悉的學校和朋友。
      options:
        1: 否認：「應該只是說說吧，真的要搬嗎？」
        2: 憤怒：「為什麼家人都不問我的意見，太過分了！」
        3: 討價還價：「如果我乖一點，爸媽會不會就留下來？」
        4: 沮喪：「我很捨不得這裡的一切，覺得很孤單。」
        5: 接受：「搬家是新開始，雖然不捨，但我也可以交到新朋友。」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

    - type: single
      prompt: ◎我面對失落，最常出現或最有印象的反應是：(勾選)
      options:
        1: 否認
        2: 憤怒
        3: 討價還價
        4: 沮喪
        5: 接受
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      note: 原稿只寫「(勾選)」沒寫單複選；因題幹說「最常出現或最有印象的反應**是**」而視為單選。

    - type: guide
      text: 三、調節「悲傷五階段」：這五階段不一定都會發生，有時候也反反覆覆，根據上一題答案，來看看你可以採取的調適策略。

    - type: fill_table
      prompt: 三、調節「悲傷五階段」：這五階段不一定都會發生，有時候也反反覆覆，根據上一題答案，來看看你可以採取的調適策略。
      columns: [階段, 狀態, 常見感受, 調適方式]
      column_headers_printed:
        常見感受: 常見感受（對應階段寫上1到5)
      column_headers_note: 「常見感受」表頭的括號說明原稿是**開全形、關半形**（…寫上1到5)），照原樣留在 printed。
      answer_carrier: 橘色手寫數字（PDF p7，全形１２３４５）；文字層的【 】內已填有同樣的數字
      rows:
        - 階段: "1"
          狀態: 否認
          常見感受: |-
            【　】覺得事情不是真的、不敢相信
            【　】覺得不公平、生氣、不甘心
            【　】一直想「如果…就好了」
            【　】失落、沮喪、自我懷疑
            【　】慢慢釋懷、平靜、放下
          常見感受_blanks:
            - {answer: "１"}
            - {answer: "２"}
            - {answer: "３"}
            - {answer: "４"}
            - {answer: "５"}
          常見感受_rowspan: 5
          常見感受_note: |-
            「常見感受」欄是縱跨 5 列的合併儲存格，內容整個放在第 1 列。
            這裡的答案數字原稿印**全形**（１２３４５），與「一、辨識情緒」那張的半形不同。
          調適方式: 和信任的人聊聊，或寫下自己的感受
        - 階段: "2"
          狀態: 憤怒
          調適方式: 找安全的方式表達情緒（寫日記、運動、畫圖）
        - 階段: "3"
          狀態: 討價還價
          調適方式: 找出「控制圈」，接受有些事無法改變
        - 階段: "4"
          狀態: 沮喪
          調適方式: 允許自己難過，試著照顧好自己，做讓心情舒服的小事
        - 階段: "5"
          狀態: 接受
          調適方式: 給自己肯定，鼓勵自己嘗試新開始

    - type: free_text
      prompt: ◎你覺得你可以試試看的方法是：
      no_correct_answer: true
      answer_carrier: 學生自填，原稿是一條空白底線

    - type: concept_box
      text: 每個人遇到難過或失落時，心情都會經歷不同的變化。當我們能認識「悲傷五階段」，就能更清楚看見自己的情緒，學會用不同的方法陪伴和調適自己。希望你在未來遇到類似的困難時，也能溫柔對待自己的感受，勇敢走過每一個階段，找到屬於自己的力量❤︎

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: C
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 失去寵物讓他心情非常「悲壯」，整天悶悶不樂
        B: 這杯果汁裡「交織」了一點檸檬，喝起來特別清爽
        C: 面對艱難選擇，他內心不斷「拉扯」，無法下定決心
        D: 從畢業旅行回來後，那份快樂仍在心中「難以平息」
      option_corrections: {A: 宜用「悲傷」, B: 宜用「摻雜」, D: 宜用「迴盪」}
      option_corrections_note: |-
        三個錯誤選項的更正印在一個浮動文字方塊裡（教師版），方塊本身列在題目上方，
        內容是「A.宜用「悲傷」／Ｂ.宜用「摻雜」／D.宜用「迴盪」」（B 是全形Ｂ，其餘半形）。
    - index: 2
      answer: A
      stem: 根據第三段「只是如今，這條路，似乎還沒開始，就已經走到了盡頭」，下列何者是此句想表達的意涵？
      options:
        A: 還沒讓對方知道自己的心意，就已失去機會
        B: 還沒確定好是否要接受告白，對方就離開了
        C: 對方還沒告訴他消息，朋友就已先洩漏出去
        D: 對方給出的承諾，還沒開始實踐就已放棄了
      explanation: 根據第三段「如果我夠勇敢，能早一點向他說出我的心意，我們會不會也有機會呢？」可知
      explanation_note: 原稿是一個浮動說明框，印在選項 A~D 右側
    - index: 3
      answer: C
      stem: 下列何者為本文主旨？
      options:
        A: 不要隨意公開關係，八卦消息經常對戀情帶來負面影響
        B: 暗戀就好，不應該主動告白，否則可能連朋友都做不成
        C: 感情的結果無法控制，但曾經喜歡也是一種成長與擁有
        D: 青少年心智尚未成熟，不應該過早投入情感，以免受傷
      explanation: 從段五、段六及文章重點可看出。
      explanation_note: 原稿是一個浮動說明框，印在題幹右側
    - index: 4
      answer: D
      stem: 本文在第一段提到「陽光灑在教室窗邊，心裡的烏雲好像也悄悄散開」，最後一段則寫「這場小小的失戀，也只是生命中的一場小雨，現在，天氣已經慢慢轉晴了」，這種寫法最主要的作用是什麼？
      options:
        A: 強調近期天氣多變化，連帶影響作者的心情起伏
        B: 凸顯人生有晴有雨，太在意外在變化是自討苦吃
        C: 利用不同心情來傳達不同晴、陰、雨帶來的感受
        D: 以天氣變化象徵情緒轉變為正向，形成首尾呼應
      explanation: 從「心裡的烏雲」、「生命的小雨」可看出天氣是用以表達心情轉折。
      explanation_note: |-
        原稿是一個浮動說明框，疊在題幹末尾（PDF 上把「作用是什麼？」的問號蓋住了）。
        說明框寫「生命的小雨」，課文原句是「生命中的一場小雨」——原稿說明框如此，未更動。
    - index: 5
      answer: B
      stem: 根據閱讀聚光燈的練習，關於悲傷五階段的調適，下列敘述何者正確？
      options:
        A: 處於否認階段時，要求對方提出證據或公開來讓大家知道
        B: 處於憤怒階段時，可以用適當方法抒發、宣洩自己的怒氣
        C: 處於討價還價階段時，面對無法掌控的事仍要嘗試和調整
        D: 處於沮喪階段時，提醒自己不可以讓別人看見自己的脆弱
      option_corrections: {A: 找人聊聊、討論, C: 專注於控制圈內的事, D: 允許自己脆弱，也尋求他人支持}
      option_corrections_note: 三個錯誤選項的更正印在一個浮動文字方塊裡（教師版），疊在選項 A 上方。
      stem_note: |-
        題幹寫「根據**閱讀**聚光燈的練習」，但本課第六大題印的是「**品格**聚光燈」。
        原稿名稱不一致，照原樣記錄未更動。

