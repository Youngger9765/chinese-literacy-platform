keypoints:
  title: 感情小日記6──我失戀了
  layout: list
  instruction: 本篇日記從當下的心情，連結過去的事件，再回到當下整理想法，也就是「今─昔─今」的結構，讓我們一起根據文章，整理文章內容。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，9 個）與橘色手寫字；PDF p4~p5 可見
  structure_note: |-
