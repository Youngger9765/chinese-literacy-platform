    幾何交叉驗證（單向警報）：`<wp:anchor>` 裡 roundRect 共 8 個，**紙外殘留 0 個** → 紙上 8 個。
    8 ＞ 10 不成立 → **不觸發**「少抓一條」警報；反向（少於）依規定不代表任何缺陷。
    少的原因這一課看得到：圈選**不是全用 roundRect 畫的** ——
    另有 2 個 `prst="rect"`（反駁、交織那兩條直向的），兩種形狀加起來才是 10。
    ⛔ 未因為「數量對不上」就刪掉或補上任何一條 —— 判準是 cells 套回 grid 拼不拼得回目標語詞。

