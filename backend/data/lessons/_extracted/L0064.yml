    「今」「統整」兩段只有兩欄。所以用 list 佈局：「昔」用 items 帶四個子項。
    ⛔ 未寫成 matrix —— 那需要每一列都有同一組欄名，本表沒有。
  rows:
    - label: 今（第一段）
      value: 天氣很好，而心情（　）
      options: {1: 沉悶, 2: 平靜}
      answer: 2
    - label: 昔（第二段～第五段）
      items:
        - label: 起因
          value: 聽到同學說喜歡的人（　），
          options: {1: 有交往對象了, 2: 也喜歡自己}
          answer: 1
        - value: 而感到（　）
          options: {1: 出乎意料, 2: 理所當然}
          answer: 1
          note: 與上一項同屬「起因」那一格（原稿是同一個儲存格裡的第二個選擇題），刻意不重複 label。
        - label: 經過
          value: 1.當下感受：（勾選，可複選）
          options:
            1: 震驚
            2: 失落
            3: 混亂
            4: 悸動
            5: 勇敢
            6: 不甘心
            7: 快樂
          answers: [1, 2, 3, 6]
        - value: 2.當下想法：還沒告白就失戀了，過去的相處算什麼呢？
          note: 與上一項同屬「經過」那一格；這一小題原稿直接印出答案，沒有空格也沒有選項。
        - label: 轉折
          value: 【　】告訴主角，喜歡一個人不是【　】，這也代表自己有能力【　】人。
