# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略──看證據如何支持判斷
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        這篇課文寫研究團隊如何根據小藍鯨遺體留下的線索，判斷牠為什麼死亡。
        文章中，有些內容是研究團隊實際發現的證據；有些則是根據證據作出的判斷。讀這類文章時，不能只看最後的判斷，還要找出支持判斷的證據：
        ①研究團隊發現了哪些證據？
        ②這些證據能支持什麼判斷？
        ③把多項證據合起來，能不能支持最後的死因判斷？

    - type: sub_block
      label: 一、找出要回答的問題
      instruction: 一、找出要回答的問題
      answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
      items:
        - type: single
          prompt: 研究團隊檢驗小藍鯨的遺體，主要想回答什麼問題？
          options:
            1: 藍鯨為什麼會成為珍稀的瀕危物種？
            2: 這頭小藍鯨生前遭遇什麼，為什麼死亡？
            3: 這頭小藍鯨的骨骼要用什麼方式修復與展示？
          answer: 2

    - type: sub_block
      label: 二、區分「證據」和「判斷」
      instruction: 二、區分「證據」和「判斷」
      answer_carrier: 紅色 ☑（圖形），被勾中的格子在文字流是空的、未勾的仍留 □
      items:
        - type: fill_table
          instruction: 請根據課文，在正確的□內打勾
          columns: [課文內容, 證據, 判斷]
          rows:
            - 課文內容: 1.小藍鯨體內仍有許多軟骨
              證據: ☑
              判斷: □
            - 課文內容: 2.牠不到兩歲，還在生長期
              證據: □
              判斷: ☑
            - 課文內容: 3.食道和胃裡只有一顆半消化的魚眼睛
              證據: ☑
              判斷: □
            - 課文內容: 4.牠生前吃到的食物很少
              證據: □
              判斷: ☑
        - type: guide
          text: →你發現了嗎？證據是實際觀察到的線索；判斷要有證據支持。

    - type: sub_block
      label: 三、看證據能支持什麼判斷
      instruction: 三、看證據能支持什麼判斷
      sub_instruction: 請先勾選能回答問題的證據，再選出最合理的判斷。證據可能不只一項。
      table_columns_printed: [要回答的小問題, 能回答問題的證據, 根據證據選出最合理的判斷]
      answer_carrier: 紅色 ☑（圖形），文字流中被勾中的選項前沒有 □
      items:
        - type: sub_block
          label: 1.繩索是否長期纏繞小藍鯨的頭部？
          items:
            - type: multi
              prompt: 能回答問題的證據
              options:
                1: 嘴部留有纏繞的尼龍繩
                2: 頭骨兩側有超過10公分深、5公分寬的溝痕
                3: 牠的身形十分削瘦
              answers: [1, 2]
            - type: single
              prompt: 根據證據選出最合理的判斷
              options:
                1: 繩索只是短暫纏住牠的頭部
                2: 深而寬的溝痕顯示，繩索長期勒住牠的頭部
              answer: 2
        - type: sub_block
          label: 2.繩索是否妨礙小藍鯨進食？
          items:
            - type: multi
              prompt: 能回答問題的證據
              options:
                1: 嘴巴被繩索勒住，無法張開
                2: 食道和胃近乎空腹，只有一顆半消化的魚眼睛
                3: 牠體內仍有許多軟骨
              answers: [1, 2]
            - type: single
              prompt: 根據證據選出最合理的判斷
              options:
                1: 繩索妨礙牠張嘴，使牠吃到的食物很少
                2: 牠雖然被繩索纏住，仍能正常進食
              answer: 1
        - type: sub_block
          label: 3.小藍鯨是否長期缺乏食物和能量？
          items:
            - type: multi
              prompt: 能回答問題的證據
              options:
                1: 牠的身形十分削瘦
                2: 體內脂肪幾乎消耗殆盡
                3: 頭骨兩側有深而寬的溝痕
              answers: [1, 2]
            - type: single
              prompt: 根據證據選出最合理的判斷
              options:
                1: 牠只是天生較瘦，身體仍有足夠能量
                2: 牠長期缺乏食物和能量，身體已十分衰弱
              answer: 2

    - type: guide
      text: |-
        →你發現了嗎？
        不同證據，支持死亡過程中不同的判斷；把判斷連起來，才能看出完整死因。

    - type: sub_block
      label: 四、合併證據，檢查死因判斷
      instruction: 四、合併證據，檢查死因判斷
      answer_carrier: 橘色手寫字與紅色 ☑（皆為圖形）
      items:
        - type: ordering
          label: "1"
          instruction: 1.前面三項判斷可以連成完整死因。請依事情發生的順序填入【　】中。
          sequence_printed: 【　】→【　】→【　】→最後餓死
          sequence_answer: [C, B, A]
          items:
            - {index: 1, option_label: A, text: 長期缺乏食物和能量，身體嚴重衰弱, answer: 3}
            - {index: 2, option_label: B, text: 無法正常張嘴，吃到的食物很少, answer: 2}
            - {index: 3, option_label: C, text: 繩索長期勒住小藍鯨的頭部, answer: 1}
        - type: single
          prompt: 2.把這些證據合起來，哪一項死因判斷最合理？
          options:
            1: 小藍鯨因海中食物不足，長期找不到食物而餓死。
            2: 小藍鯨因廢棄漁具長期纏繞，無法正常進食而餓死。
            3: 小藍鯨擱淺後無法回到海裡，因此飢餓而死亡。
          answer: 2

    - type: self_check
      label: ◎自我檢核
      instruction: 如果你有做到，請在□內打勾。
      items:
        - 1.我能區分證據和判斷。
        - 2.我能找出能支持判斷的證據。
        - 3.我能把多項證據合起來，檢查判斷是否合理。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫字（圖形），文字流的（　）內已填有代號
  questions:
    - index: 1
      answer: B
      stem: 下列「　」中的語詞，哪一個使用正確？
      options:
        A: 博物館將珍貴標本「研判」多年，供民眾參觀
        B: 救援人員發現一艘船「擱淺」在沙洲旁
        C: 這隻貓恢復健康後，身形變得更加「削瘦」
        D: 校園裡隨處可見的麻雀，是十分「珍稀」的鳥類
      explanation: B的「擱淺」是指船隻在淺水處卡住，使用正確。
    - index: 2
      answer: A
      stem: 根據第二段，藍鯨在不到一個世紀內幾乎滅絕，主要原因是什麼？
      options:
        A: 人類為取得商業利益，大量獵殺藍鯨
        B: 藍鯨經常擱淺，無法回到海中生活
        C: 海水溫度升高，藍鯨失去主要棲息地
        D: 海洋魚群減少，藍鯨長期缺乏食物
      explanation: 第二段指出，捕鯨者在商業利益的追逐下使用大型鯨砲獵殺藍鯨，因此A正確
    - index: 3
      answer: D
      stem: 根據第三段，哪一張圖最符合小藍鯨生前被漁具纏繞的情況？
      options:
        A: 藍鯨骨骼標本
        B: 鯊魚(上端有鰭)
        C: 藍鯨
        D: ""
      options_are_images: true
      option_note: |-
        四個選項是同一列表格裡的四張手繪圖。A~C 在圖上方印有文字標籤（已抄進 options），
        D 那一格**只有圖、沒有標籤**，故 D 的文字是空的——不是漏抄。
        圖的內容只在像素裡：A 是骨骼標本、B 是有背鰭的鯊魚、C 是完整的藍鯨、
        D 是嘴部被深色繩索纏繞的藍鯨（答案）。
    - index: 4
      answer: B
      stem: 下列哪一組正確區分「證據」和「判斷」？
      options:
        A: 證據：小藍鯨最後餓死；判斷：胃裡只有一顆魚眼睛
        B: 證據：頭骨兩側有深溝痕；判斷：繩索長期勒住頭部
        C: 證據：小藍鯨不到兩歲；判斷：體內仍有許多軟骨
        D: 證據：小藍鯨長期缺乏能量；判斷：脂肪幾乎消耗殆盡
    - index: 5
      answer: C
      stem: 下列哪一項最能說明作者的寫作意圖？
      options:
        A: 介紹藍鯨標本的製作過程，吸引民眾參觀海生館
        B: 說明藍鯨數量減少的歷史，反對所有海洋捕撈活動
        C: 藉小藍鯨的死亡與展示，提醒人們正視廢棄漁具的危害並保育海洋
        D: 讚揚研究團隊的修復技術，證明標本能延續動物生命

