# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 自我覺察──想法與情緒的關係
  strategy_type: character
  section_title_printed: 品格聚光燈
  blocks:
    - type: concept_box
      text: |-
        本文作者看到「朋友和別人聊天」，會不開心；但很多人會覺得這根本沒什麼。為什麼同一件事，不同人會有不同的情緒感受？
        情緒常受到兩件事影響：一、遭遇的事件本身，二、我們「怎麼想這件事」。也就是說，你有情緒時，你的情緒也許是「想法」造成的。底下的練習，讓我們來學著覺察「想法和情緒間的關係」。

    - type: exercise
      label: 小試身手（第一張表）
      instruction: ◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)
      columns: [事件, 背後可能的想法（單選）, 情緒感受]
      flow_note: 表頭三欄之間印有虛線箭頭，表示「事件 → 想法 → 情緒感受」的推進方向
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: single
          index: 1
          event: 看見喜歡的人與別人談笑
          options: {1: 我沒有那個人幽默風趣, 2: 他真棒，能和這麼多人打成一片}
          answer: 1
          emotion: 不是滋味
        - type: single
          index: 2
          event: 他（喜歡的人）下課沒有來找我
          options: {1: 我是不是沒那麼重要？, 2: 今天他另有重要的事要做}
          answer: 1
          emotion: 沮喪失落
        - type: single
          index: 3
          event: 下課時和喜歡的人說到話或對到眼
          options: {1: 對他來說，我一定不只是普通同學, 2: 我可以繼續觀察我們的關係變化}
          answer: 1
          emotion: 雀躍欣喜

    - type: guide
      text: ☆勾完後，再看看沒有勾選的選項，那樣的想法所帶來的情緒有什麼不同呢？

    - type: sub_block
      label: 更多情境事件（第二張表）
      instruction: ◎接著，我們再來看看更多情境事件，並根據題目的情緒，選擇對應的想法。
      columns: [事件, 背後可能的想法（單選）, 情緒感受]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: single
          index: 1
          event: 上課舉手發言，結果被老師糾正錯誤
          options: {1: 天啊！大家一定覺得我愛現又很蠢, 2: 幸好我有發言，才能得到老師的糾正}
          answer: 2
          emotion: 踏實、感謝
        - type: single
          index: 2
          event: 傳訊息問朋友作業，被未讀未回
          options: {1: 他可能嫌我太煩、太笨所以不想回, 2: 他可能在忙，我先問問看其他人}
          answer: 1
          emotion: 焦慮、失落
        - type: single
          index: 3
          event: 放學的時候，朋友沒等我一起走
          options: {1: 他今天是不是有什麼急事呢？, 2: 是我做錯了什麼嗎？他想刻意避開我}
          answer: 1
          emotion: 平靜、好奇
        - type: single
          index: 4
          event: 同學在群組約大家看電影，沒有標註我
          options: {1: 他們可能以為我一定會去了, 2: 他們是不是想排擠我？故意針對我？}
          answer: 2
          emotion: 傷心、憤怒
        - type: single
          index: 5
          event: 同學主動幫我處理老師交代的任務
          options: {1: 同學好熱心，也為我省下了不少時間, 2: 他好瞧不起我，不相信我可以做好}
          answer: 1
          emotion: 開心、溫暖

    - type: multi
      label: 歸納
      prompt: ◎根據上面的回答，請試著歸納，能帶來平靜、好心情的想法多半具備下列哪些特質呢？
      options:
        1: 能換位思考，願意站在他人立場理解行為
        2: 願意接受事情有很多種可能，不針對自己
        3: 自我中心，凡事只相信自己的判斷
        4: 能從善意的角度解釋他人行為
        5: 能保持好奇，不急著下判斷
        6: 過度連結，認為許多事情都是自己的責任、都跟自己有關
        7: 能看見自己的優點，不隨意否定自己
      option_examples:
        1: （如：他放學沒等我，可能是剛好跟家人有約，來不及說。）
        2: （如：他已讀不回，可能是不小心按到，或是點開後手機沒電了。）
        3: （如：對方的委婉拒絕可能只是剛好沒空，我相信他一定對我有好感。）
        4: （如：他沒約我打遊戲，也許是怕我作業太多會分心。）
        5: （如：他今天都沒跟我說話，不知道他怎麼了？晚點來關心他。）
        6: （如：他分組沒有找我，一定是因為上禮拜我沒陪他去福利社。）
        7: （如：雖然我的意見沒有被小組採用，但勇敢分享本身就是很棒的表現。）
      answer: [1, 2, 4, 5, 7]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊

    - type: guide
      text: 回到文章，我們會看見，作者雖然是因為那份「喜歡」，所以十分在乎對方，以至於心情劇烈起伏，但影響情緒的關鍵也包含他的想法。所以當我們學會覺察想法，就能慢慢讓情緒變得穩定、有力量❤︎

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: B
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 經過多年的努力，他終於打破紀錄，攀上了「深淵」
        B: 美國暫緩提升關稅後，大家都密切關注市場「動向」
        C: 春天已經悄悄來臨，時不時都能看見路邊「心花怒放」
        D: 他對公司「揮之不去」，儘管時常加班，他也無怨無尤
      option_corrections: {A: 宜改為「高峰」, C: 宜改為「小花綻放」, D: 宜改為「忠心耿耿」}
    - index: 2
      answer: C
      stem: 根據第三段，「（這些念頭）像是一群停不下來的蜜蜂，在腦袋裡嗡嗡作響」這句話最可能表現出作者當時的什麼狀態？
      options:
        A: 手足無措，對於未來感到一片茫然
        B: 活力四射，腦海中有大量靈感出現
        C: 煩亂不堪，無法停止各種胡思亂想
        D: 緊張無比，深怕自己做錯了什麼事
      teacher_note: 從前後文可推知這樣的狀態讓作者十分困擾，所以選(C)
    - index: 3
      answer: D
      stem: 根據文章結尾「也許只要他再對我笑一次，這些煩惱又會立刻煙消雲散吧。」下列選項何者最貼近這句話的背後意涵？
      options:
        A: 強調任何煩惱都該要用微笑面對
        B: 強調煩惱像煙霧消散，不用掛心
        C: 強調已準備放下對方，一笑置之
        D: 強調對方對自己的情緒影響極大
      teacher_note: 從文章可知作者心情的起伏都和對方有關。
    - index: 4
      answer: A
      stem: 根據本文標題「喜歡是什麼」及內容，下列敘述何者最貼近作者答案？
      options:
        A: 喜歡是颱風來臨時的海浪，高高低低，且難以控制
        B: 喜歡是大雨過後的彩虹，繽紛美好，卻也無法久留
        C: 喜歡是遲遲無法擺脫的惡夢，時刻相伴，無處可逃
        D: 喜歡是童年時的糖果，讓人滿口都甜蜜，心情愉快
      teacher_note: 從文章可知作者因為這份情感而心情起伏劇烈。
    - index: 5
      answer: D
      stem: 根據品格聚光燈的練習，下列何者對於「事件─想法─感受」的理解較為合適？
      options:
        A: 橘子：每個人在相同的事件中都有相同的感受
        B: 步美：比起想法，事件對感受的影響更為直接
        C: 靜香：越快對事件下判斷就越能保持平靜喜悅
        D: 小葵：釐清對事件的想法有助於自己調適心情
      teacher_note: |-
        (A)每個人感受不同(B)想法影響感受更多
        (C)應盡量避免太快下判斷。

