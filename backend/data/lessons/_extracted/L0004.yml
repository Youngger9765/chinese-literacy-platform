# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 6
  paragraphs:
    - idx: 1
      text: 最近心情起起伏伏，變得好不習慣，好不像我……
    - idx: 2
      text: 上課時，我明明想專心聽老師講解，但眼神總是不自覺飄向前排的那個身影。有時候只是瞄一眼，卻發現自己根本沒聽進去老師剛剛說了什麼。有一次，老師突然點我回答，我只能紅著臉站著，當下只想鑽進地洞裡。而下課時，無論是同學找我打球、上廁所或是去福利社，我總是會多觀察他的動向，總是偷偷跟隨著他做選擇，只希望有更多相處的機會。
    - idx: 3
      text: 然而最近我更發現當他和其他同學聊天聊得很開心，我的胸口就會被抓緊，心裡很不是滋味，也開始胡思亂想：他是不是喜歡那個很幽默的同學？他們會不會常常傳訊息？他跟我聊天有這麼開心嗎？還是我根本不特別？這些念頭在我腦中亂竄，有時候一閃而過，但有時候卻揮之不去，像是一群停不下來的蜜蜂，在腦袋裡嗡嗡作響，也讓我越想越難過。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 4
      text: 我變得很敏感，雖然還是維持著同學般的互動，但我卻發現我的情緒總是隨著他的一言一行起伏。當他下課時沒有找我，我會感到失落，但他一旦對我說句話或我們剛好對到眼，我內心就莫名雀躍。心情就像坐雲霄飛車一樣，有時心花怒放，有時卻跌入深淵。
      source_text: 我變得很敏感，雖然還是維持著同學般的互動，但我卻發現我的情緒總是隨著他的一言一行 起伏。當他下課時沒有找我，我會感到失落，但他一旦對我說句話或我們剛好對到眼，我內心就莫名雀躍。心情就像坐雲霄飛車一樣，有時心花怒放，有時卻跌入深淵。
      errata_ref: E1
    - idx: 5
      text: 這幾天睡前，我都躺在床上盯著天花板，覺得好累。為什麼會這麼在意他的眼神？為什麼他隨口的一句話，能讓我高興一整天？為什麼喜歡一個人，反而讓我這麼不快樂？我以前認為喜歡一個人應該是開心的事，但現在卻覺得腦中被強行安裝了警報器，時時都在偵測他和我的距離，太近或太遠都會讓警鈴大作。喜歡到底是什麼？
    - idx: 6
      text: 我到底是怎麼了？
