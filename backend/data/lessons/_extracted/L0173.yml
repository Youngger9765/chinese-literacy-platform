body:
  lesson_heading: 第7課  讓「想很多」助你一臂之力
  paragraph_count: 8
  paragraphs_note: >-
    課文另印兩個**不佔段號**的分節小標（「「想很多」也可能是致勝關鍵」「把焦慮的空轉，化為心中的「啦啦隊」」），
    分別排在第 1 段與第 4 段之後，記在該段的 followed_by_heading。
    ⚠️ PDF 上段號與字數欄整體上移約兩行（例：「六」印在第 5 段中段那一行），不能照「號碼旁邊那一行」對位；
    以文字層與字數算術為準。
  paragraphs:
    - idx: 1
      text: 你曾遇過「想很多」的人嗎？或者，你也曾被這樣說過呢？很多時候，我們習慣用「沒事啦！不要想那麼多！」、「你太擔心了！」、「你就是想太多才會壓力那麼大！」來安慰那些容易焦慮的人。其實，要是可以，他們一定也恨不得為大腦安裝一個暫停鍵，讓那些無止盡的擔心和反省停下來。不過，「想很多」真的只有壞處嗎？
      followed_by_heading: 「想很多」也可能是致勝關鍵
    - idx: 2
      text: 會被認為想太多的人，可能常常和「庸人自擾」、「杞人憂天」等負面描述綁在一起，但其實「想很多」的人經常擁有認真、謹慎、細心及願意反省等特質。更常見的是，那些在一件事情上想很多的人，往往也是願意投注心力和時間的人。
    - idx: 3
      text: 大聯盟知名棒球投手大谷翔平，因為出色的比賽成績而備受關注，他的成長經歷也引人好奇。「九宮格目標達成法」揭開了大谷投球技術的養成之路，他從中學便設立目標──「獲得八大球團第一指名」，並將努力方向拆解成九個面向，像是：「控球」、「球質」、「人品」、「運氣」等，再根據這些項目提出各八個實踐方式。你說，大谷翔平，難道想得不多嗎？那為什麼不會有人叫他「不要想那麼多」？
    - idx: 4
      text: 也許重點不在於「想很多」，而在於這些想法有沒有幫助一個人更靠近目標。當「想很多」變成規劃、準備和行動，它常常會被看成有遠見、有企圖心；但當「想很多」只剩下擔心、自責和害怕失敗，它就容易變成壓力。所以，也許我們真正該留意的，是讓「想很多」成為助力，將這些焦慮的念頭轉化成具體的目標和行動，而不是「不要想太多」。
      followed_by_heading: 把焦慮的空轉，化為心中的「啦啦隊」
    - idx: 5
      text: 然而，讓「想很多」變成準備和行動，就不會焦慮了嗎？其實有時候，真正難的是明明已經努力了，心裡還是會不安，還是會在過程中懷疑自己不夠格、不夠好。這時候，該怎麼辦呢？我們需要的，不是消滅焦慮，也不是強顏歡笑、故作堅強，我們可以組一支心中的「啦啦隊」。
    - idx: 6
      text: 在比賽中，啦啦隊的加油聲、場邊觀眾的應援，常能幫助提振士氣，重整旗鼓，心中的啦啦隊也是。這些啦啦隊成員，可以是給予我們支持、肯定的人，也可以是自己。然後，把心中的「擔心」化為  給自己的「祝福」和「打氣」。例如，擔心自己表現不好會拖累隊友，就可以在心裡許下祝福，對自己說：「祝福我能夠如常發揮實力」、「祝福我能和隊友並肩作戰  」，或是對自己說：「我可以的！我也會是可靠的隊友！」
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 7
      text: 這種對內心喊話的力量，在奧運金牌舉重選手郭婞淳身上也發揮了極大的作用。她說每當面對大賽，她總會在心裡一遍又一遍為自己打氣：「妳準備了那麼久，一定可以做得到」、「要相信自己，一定可以做到」，像是循環播放一樣，不斷重複的說。
    - idx: 8
      text: 因此，下次發現焦慮又找上門時，可以像大谷翔平一樣，善用自己「想很多」的能力，將大目標拆解成一個個小目標，先跨出一小步，也為自己的小小成就慶賀。也可以像郭婞淳一樣，召喚內心的啦啦隊出來應援，在內心對自己喊話。比起把「想很多」當成弱點，或許也可以慢慢練習去看見、去欣賞：這份情緒，藏著你的在乎；這份焦慮，也能成為助力。
  inline_marked_terms: [庸人自擾, 杞人憂天, 出色, 遠見, 企圖心, 不夠格, 強顏歡笑, 故作, 應援, 重整旗鼓, 如常]
  inline_marked_terms_note: >-
    課文中加框的詞。10 個本課語詞全部加框，另外「不夠格」也加了框但**不在語詞表裡**（原稿如此）。
    人名／機構（大聯盟、大谷翔平、奧運金牌舉重選手郭婞淳）是底線不是框。
  running_char_counts: [28, 57, 87, 118, 148, 177, 186, 214, 243, 274, 296, 324, 353, 383, 413, 443, 453]
  char_count_note: >-
    右緣累計字數自第 6 段（☞ 起點）起算，到課文結束。段界對位：186 = 第 6 段（本文 190 字，
    扣掉 4 個空白）；296 = 186 + 第 7 段 110 字；453 = 296 + 第 8 段 157 字 —— 三個段界都精準，
    所以本課只需套「空白不計入」這一條 Word 口徑。

