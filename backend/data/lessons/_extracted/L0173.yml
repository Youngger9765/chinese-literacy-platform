spotlight:
  strategy_name: 把焦慮化為助力
  strategy_type: sel_character
  blocks:
    - type: concept_box
      text: 本篇文章除了讓我們能換個視角看待焦慮外，也提出了把焦慮化為助力的方法。大谷翔平把他「想很多」的特質運用在適當的情境中，提出了周全的規畫，將目標轉化成行動，一步步實踐。而郭婞淳，面對上場的焦慮，則是在內心為自己打氣，給予自己加油與祝福。現在就讓我們透過底下的小練習來實踐看看吧！
    - type: sub_block
      label: ◎判斷情境
      instruction: ◎當我們感到擔心、焦慮時，可以先判斷：當下還有沒有可以採取的努力或行動？如果有，則把焦慮化為行動；如果沒有，就練習將焦慮化為打氣。我們可以先透過以下情境來練習！
      note: 表頭兩欄為「情境」「當下有可以採取的行動嗎？」
      items:
        - index: 1
          stem: 開學剩不到一個禮拜，還有好多暑假作業還沒寫完
          options: {A: 有→立刻採取行動, B: 沒有→穩住自己，幫自己打氣}
          answer: A
        - index: 2
          stem: 鼓起勇氣和喜歡的人告白，但對方還沒給我回覆，要我等等
          options: {A: 有→立刻採取行動, B: 沒有→穩住自己，幫自己打氣}
          answer: B
        - index: 3
          stem: 站在大隊接力的跑道上，準備聽槍聲起跑
          options: {A: 有→立刻採取行動, B: 沒有→穩住自己，幫自己打氣}
          answer: B
      answer_carrier: 紅色 ☑（Wingdings F0FE，文字流讀得到）
    - type: guide
      text: ◎腦力激盪──把焦慮化為「行動」：有時候我們的焦慮其實來自於缺乏行動的方向。大谷翔平將每個目標拆解成具體努力的方法，這樣就能化解焦慮了。現在換你試試，來為自己設定目標、行動、努力方法，及目標檢核吧！
    - type: table
      label: 範例
      instruction: |-
        例：目標──我希望我的唱歌技術可以進步。
          行動──每個禮拜學習一首新歌。
      columns: [努力方法, 時間, 地點, 頻率+份量]
      rows:
        - [1.把歌聽熟, 搭公車的時候, 公車上, 每天一首]
        - [2.記歌詞, 搭公車的時候, 公車上, 每天兩首歌]
        - [3.練習唱歌, 洗澡時, 浴室, 每天一首歌]
      tail: 目標檢核──在班級同樂會上唱歌給大家聽。
    - type: fill_table
      label: 練習
      instruction: "練習：目標──我希望_________________________________ 可以進步。\n  行動──____________________________________________________"
      columns: [努力方法, 時間, 地點, 頻率+份量]
      rows: []
      row_count: 3
      tail: 目標檢核──__________________________________________________
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三列全空
    - type: guide
      text: ◎處方二：化焦慮為「打氣」：有些時候，已經很努力的準備，腦袋卻還是一直擔心、想著「萬一失敗怎麼辦」。這時可以練習把腦中的焦慮語句，改成比較能幫助自己的話。
    - type: single
      label: 1
      prompt: 1. 回想一個你時常感到緊張焦慮的情境（例如：考試、上台、比賽），那時腦中最常冒出哪一句話？請選一個最像你的想法。
      options:
        1: 我一定不能失誤。
        2: 如果我失誤，會讓人很失望。
        3: 我這麼緊張，等一下會表現失常。
        4: 我如果表現不好，就代表我很差。
        5: "其他：____________________________________"
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: single
      label: 2
      prompt: 2. 這些話往往會讓人更焦慮，為什麼呢？請根據你上一題選的話，選一個它可能讓你更焦慮的原因。
      options:
        1: 它要求自己一定要完美。
        2: 它把別人的眼光想得太可怕。
        3: 它把緊張看成一定會失敗。
        4: 它把一次表現變成整個人的價值。
        5: "其他：____________________________________"
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: sub_block
      label: 3
      instruction: |-
        3. 把焦慮的話，改成能幫助自己的話：請在右欄勾選你說得出口的打氣句。
          （沒有標準答案）
      note: 表頭兩欄為「焦慮時腦中的話」「你可以給自己的打氣句(可複選)」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      items:
        - index: 1
          stem: ①我一定不能失誤
          options:
            A: 我會專注做好下一步，就算失誤了也可以調整回來
            B: 沒有人是完美的機器人，失誤了就馬上修正、繼續拚回來
          no_correct_answer: true
        - index: 2
          stem: ②如果我失誤，大家會怪我
          options:
            A: 我不能控制別人怎麼想，但我可以控制自己下一步怎麼做
            B: 我們是一個團隊，就算我失誤了，我的隊友也會幫我補位
          no_correct_answer: true
        - index: 3
          stem: ③我這麼緊張，等一下會失常
          options:
            A: 緊張代表我在乎，我可以帶著緊張完成眼前的任務
            B: 心跳變快是身體在熱身，這代表我正全力以赴、準備爆發
          no_correct_answer: true
        - index: 4
          stem: ④我表現不好，就代表我很差
          options:
            A: 這只是一次表現，不代表我這個人沒有價值
            B: 這次沒做好不代表以後都輸，學到的經驗是我變強的武器
          no_correct_answer: true
    - type: multi
      label: 4
      prompt: 4.加入其它啦啦隊：當你感到壓力、焦慮時，以下哪些話會讓你覺得被支持呢？可以把它留在心裡，變成對內心的喊話。
      options:
        1: 謝謝你沒有放棄，願意去做，本身就很不容易。
        2: 你已經夠好了，也確實盡力了，不完美也沒關係。
        3: 儘管害怕但還是願意踏出一步的樣子，很帥哦！
        4: 你不需要很厲害才開始，你要開始才會變得很厲害。
        5: 你已經盡了最大的努力，剩下的就交給時間。
        6: 先別急著否定自己，你其實比想像中更有力量。
        7: 這一刻不順，不代表你不夠好；你還是可以慢慢做到。
        8: 就算此刻表現不理想，你依然重要且值得被好好對待。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: free_text
      prompt: 也可以寫下你安慰朋友、鼓勵朋友時，最常說的話，轉換成給自己的鼓勵：
      answer_carrier: 學生自填
    - type: free_text
      prompt: →下次遇到挑戰，你最想大聲對自己說：
      answer_carrier: 學生自填
    - type: guide
      text: →焦慮不一定要消失。重要的是，我能不能在焦慮中，找回自己的力量。還有一些話，也可以放在心裡，當作加油站！

comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 身為領導者，卻對員工有差別待遇，處處充滿「遠見」
        B: 面對老師的要求，他只是稍微「應援」，沒有放在心上
        C: 你再猜下去也只是「庸人自擾」，不如直接把話講開吧
        D: 事隔多年，我們終於又拿下冠軍，大家都「強顏歡笑」
      teacher_note: |-
        (A)應改為「偏見」
        (B)應改為「應付」
        (D)應改為「欣喜若狂」
    - index: 2
      answer: B
      stem: 根據第一段，作者說「他們一定也恨不得為大腦安裝一個暫停鍵」，這句話是指焦慮者會有什麼樣的心聲？
      options:
        A: 他們非常希望能夠擁有像機器一樣的思考速度
        B: 他們對於自己無法停止擔心的現況感到很無奈
        C: 他們期待大腦能隨時儲存所有學習到的新知識
        D: 他們認為只要大腦暫停運作就能獲得比賽勝利
      teacher_note: 從前後文可看出焦慮者自己也很希望這些念頭可以停止。
    - index: 3
      answer: C
      stem: 根據第四段的觀點，將「想很多」從「壓力」轉化為「遠見」的關鍵因素是什麼？
      options:
        A: 是否具備強大的意志力來壓抑內心恐懼的念頭
        B: 是否能夠尋求身邊親友的安慰來消除焦慮情緒
        C: 是否有具體的規劃、準備與實際的行動去應對
        D: 是否能換一個環境來讓自己忘記原本擔心的事
      teacher_note: 延續大谷翔平的例子，強調將念頭轉化成目標和具體行動。
    - index: 4
      answer: A
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 學習如何與焦慮共處，並將其轉化為行動的能量
        B: 鼓勵大家對焦慮的人說「不要想太多」來給予安慰
        C: 成功的關鍵在於天賦，想得再多也無法改變結果
        D: 焦慮是成功的絆腳石，應該透過運動來釋放壓力
      teacher_note: 可參考最後一段。
    - index: 5
      answer: D
      stem: 下列描述何者最符合「內心啦啦隊」的概念？
      options:
        A: 在心裡假裝沒事發生，一起把煩惱都忘掉
        B: 模仿啦啦隊的舞蹈口號，幫自己打起精神
        C: 設立具體的目標行動，要求自己必須達成
        D: 練習像家人、朋友一樣對自己說鼓勵的話
      teacher_note: (D)符合將焦慮轉化成打氣的方法。

vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [庸人自擾, 杞人憂天, 出色, 遠見, 企圖心, 強顏歡笑, 故作, 應援, 重整旗鼓, 如常]
  grid_size: [10, 10]
  grid:
    - 精神抖擻我應強無短心
    - 荒庸人自擾如爰顏立見
    - 住謬重女夠嘗企走歡靦
    - 遠出故作交隔圖夠腆笑
    - 見臉旗見杞刁心己傭故
    - 歡色袁人不鑽優媛人做
    - 天五憂可應顏入如重企
    - 喜天置鼓格援常天整見
    - 地信低潮出色焦圖旗隔
    - 不夠格強心綠園開鼓花
  answers_are_graphical: true
  answer_paths:
    - {word: 強顏歡笑, cells: [[1, 7], [2, 8], [3, 9], [4, 10]], direction: diagonal_down_right}
    - {word: 庸人自擾, cells: [[2, 2], [2, 3], [2, 4], [2, 5]], direction: horizontal}
    - {word: 企圖心, cells: [[3, 7], [4, 7], [5, 7]], direction: vertical}
    - {word: 遠見, cells: [[4, 1], [5, 1]], direction: vertical}
    - {word: 故作, cells: [[4, 3], [4, 4]], direction: horizontal}
    - {word: 杞人憂天, cells: [[5, 5], [6, 4], [7, 3], [8, 2]], direction: diagonal_down_left}
    - {word: 應援, cells: [[7, 5], [8, 6]], direction: diagonal_down_right}
    - {word: 如常, cells: [[7, 8], [8, 7]], direction: diagonal_down_left}
    - {word: 重整旗鼓, cells: [[7, 9], [8, 9], [9, 9], [10, 9]], direction: vertical}
    - {word: 出色, cells: [[9, 5], [9, 6]], direction: horizontal}
  _圈選note: >-
    10 個目標語詞全部圈到，但**圈只有 9 個是 roundRect 圖形** ——「遠見」那一圈是嵌入的**圖片**
    （`pic`，0.382×0.814 in），只數 roundRect 會少算一條而且不會報錯。以群組框（4.776×3.533 in）
    換算格距後，該圖片中心正落在第 4~5 列第 1 欄，並經 PDF 第 12 頁像素比對確認。

