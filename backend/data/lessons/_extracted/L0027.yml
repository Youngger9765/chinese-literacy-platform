# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 用表格整理訊息──比較兩個對象
  strategy_type: comprehension_strategy
  blocks:
    - type: concept_box
      text: 文章同時介紹兩個對象，細節又很多時，可以用表格來整理。怎麼做呢？先找出文章在比較哪兩個對象，再看看比較哪些項目，最後把兩個對象的訊息填進表格。完成後，就能清楚看出它們哪裡相同、哪裡不同，也比較容易說出結論。
    - type: guide
      text: 本課提到，救援行動中使用巨鼠好處多多，這時，我們就可以把狗與巨鼠放在一起進行比較，做成表格，就可以讓人一目了然兩者的差異囉。

    # ⚠️ 下面的 (1)/(2) 與 A./B./C. 是 Word 自動編號，不在文字流裡，
    #    所以編號只寫進 label，text 一律不帶前綴（帶了逐字門會判 FAIL）。
    - type: guide
      label: (1)
      text: 整理表格步驟：
    - type: sub_block
      label: A. 找對象
      items:
        - type: guide
          text: 找對象：文章在比較誰和誰。
        - type: guide
          text: 先把比較的對象寫在表格「第一列」：巨鼠與狗
    - type: sub_block
      label: B. 找項目
      items:
        - type: guide
          text: 找項目：文章從哪些方面比較兩個對象？
        - type: guide
          text: 把文章比較的項目寫在表格「第一欄」
        - type: guide
          text: 祕訣：文章中出現「但是」、「不同」、「比較」等語詞時，可能表示作者正在比較兩個對象喔！
        - type: passage
          label: 範例
          paragraphs:
            - 範例：訓練有素的巨鼠可以跟多位訓練員合作，但狗通常只接受一位訓練員的指導。
        - type: sub_block
          label: ❶
          instruction: 讀一讀，找出巨鼠與狗不同的地方。（單選）
          items:
            - type: single
              prompt: 巨鼠可以跟（　）訓練員合作，
              options: {1: 多位, 2: 一位}
              answer: 1
              answer_carrier: 紅色 ☑（圖形），文字流無此資訊
            - type: single
              prompt: 狗只接受（　）訓練員指導。
              options: {1: 多位, 2: 一位}
              answer: 2
              answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: ❷
          prompt: 這句話比較的項目是什麼？
          options: {1: 可合作的訓練員人數, 2: 嗅覺能力}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: guide
          label: ❸
          text: 把比較項目「可合作的訓練員人數」填入「第一欄」
    - type: sub_block
      label: C. 填細節
      items:
        - type: guide
          text: 填細節：兩個對象在這個項目上有什麼不同？
        - type: guide
          text: 把巨鼠和狗的相關細節，分別填入對應的格子
        - type: guide
          text: 巨鼠可合作訓練員數量多位，狗可合作訓練員數量只有一位。
        - type: fill_table
          # 第一欄的表頭在教材上是空白格；此處補「項目」以便對位。
          # 表格外圍另有兩個指示文字方塊「第一欄」「第一列」用虛線箭頭指向表格。
          columns: [項目, 對象1：巨鼠, 對象2：狗]
          rows:
            - 項目: 項目1：可合作的訓練員人數
              對象1：巨鼠: 【　】
              對象1：巨鼠_blanks: [{answer: 多位}]
              對象2：狗: 【　】
              對象2：狗_blanks: [{answer: 一位}]
              answer_carrier: 橘色手寫字（圖形層）
            - 項目: 項目2：
              note: 教材此列留白，供學生自己填第二個比較項目
    - type: guide
      label: (2)
      text: 看表格：比較兩個對象，找出相同和不同，再說出重點。

    # ── 小試身手 ──
    - type: guide
      text: ◎小試身手
    - type: sub_block
      label: 1.
      instruction: 現在讓我們從文章找出比較的內容與項目
      items:
        - type: passage
          label: (1)
          paragraphs:
            - 此外，巨鼠體型小，狗無法通過的瓦礫縫隙，巨鼠卻可以輕而易舉的鑽過。
        - type: sub_block
          label: (1)❶
          instruction: 現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
          items:
            - type: single
              prompt: 巨鼠的體型比狗（　）
              options: {1: 大, 2: 小}
              answer: 2
              answer_carrier: 紅色 ☑（圖形），文字流無此資訊
            - type: single
              prompt: 可以（　）鑽過瓦礫縫。
              options: {1: 輕易, 2: 無法}
              answer: 1
              answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: (1)❷
          prompt: 這句話比較的項目是什麼？
          options: {1: 訓練員數量, 2: 體型, 3: 成本}
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: passage
