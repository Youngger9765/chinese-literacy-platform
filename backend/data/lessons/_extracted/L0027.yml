# ── 三 語詞我最棒 ──
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank: [救援, 瓦礫, 勝任, 靈敏, 拯救, 廢墟, 倖存, 縫隙, 輕而易舉, 成本, 本領, 訓練有素]
  items:
    - {index: 1, word: 瓦礫, definition: 建築物倒塌後留下的碎石或磚塊。}
    - {index: 2, word: 倖存, definition: 在災難或危險中活下來。}
    - {index: 3, word: 輕而易舉, definition: 形容做事情非常容易。}
    - {index: 4, word: 訓練有素, definition: 經過充分的訓練，表現出高水準的能力。}
    - {index: 5, word: 靈敏, definition: 感覺或反應迅速敏銳，能察覺細微的變化。}
    - {index: 6, word: 勝任, definition: 有能力完成工作或任務。}
    - {index: 7, word: 本領, definition: 技術或能力。}
    - {index: 8, word: 拯救, definition: 將人或動物從危險或困境中救出來。}
    - {index: 9, word: 廢墟, definition: 無人居住、廢棄不用的建築物。}
    - {index: 10, word: 救援, definition: 採取行動，幫助災難受困者，讓他們脫離危險。}
    - {index: 11, word: 縫隙, definition: 物體之間的細小空間或裂縫。}
    - {index: 12, word: 成本, definition: 為了完成某件事所需要付出的代價。例如：開飲料店需要材料費、店租、水電費和店員薪水，這些都是開店的「成本」。}
  answer_carrier: 橘色手寫字（圖形層），文字流有字但無顏色資訊

