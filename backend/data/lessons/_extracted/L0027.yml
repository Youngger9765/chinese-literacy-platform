# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  # 段號欄印 一二三四 共 4 個。段號欄行距比課文欄窄會往下漂
  #（「二」印在第 1 段末行旁、「三」印在第 2 段末行旁），對位靠語意起頭。
  paragraph_count: 4
  paragraphs:
    - idx: 1
      text: 當人們談到「救援動物」時，最有可能浮現在腦海中的形象是一隻在瓦礫中到處聞嗅的狗。然而，你可能從未想到的是，老鼠也可以勝任救援的工作。有一種原產於非洲的巨鼠，像小貓那麼大，聽力和嗅覺特別靈敏，現在，科學家正在訓練非洲巨鼠來拯救生命。
    - idx: 2
      text: 當強烈地震把大型建築物震垮，有人被困在像山一般高的瓦礫廢墟時，就是非洲巨鼠出任務的時機。受過專門訓練的巨鼠，配備著微型背包，背包裡有麥克風、攝影機和定位追蹤器。當巨鼠被帶到廢墟，牠們可以靠著靈敏的聽覺、嗅覺，以及鑽進狹小縫隙的能力尋找倖存者。當牠們來到倖存者身邊，就會扯一扯繫在背包上的警報器，讓它嗶嗶響，救援人員就可以根據這個信號來找到受困者。
      note: 念順順的 ☞ 錨點印在本段首行
    - idx: 3
      text: 科學家表示，在救援行動中使用巨鼠好處多多。它們的嗅覺能力與狗相當，而且訓練起來同樣容易。訓練有素的巨鼠可以跟多位訓練員合作，但狗通常只接受一位訓練員的指導。此外，巨鼠體型小，狗無法通過的瓦礫縫隙，巨鼠卻可以輕而易舉的鑽過。最後，飼養和訓練巨鼠的成本比較低，不必花很多錢，只要有老鼠飼料和香蕉作為獎勵就可以了。
    - idx: 4
      text: 比較麻煩的是，巨鼠可能會嚇壞陷在瓦礫裡的倖存者。為了預防這種情況發生，研究人員開始在媒體大力宣傳巨鼠救難的本領，讓更多人知道，會去災難現場救人的動物，不一定是狗，也可能是大老鼠；此外，研究人員也在巨鼠的背包內安裝了揚聲器，能夠持續播放音訊，讓人們知道這些看來噁心的大老鼠並不是陰溝裡冒出來的，而是救援大隊的好幫手呢！
  inline_marked_terms: [救援, 瓦礫, 勝任, 靈敏, 拯救, 廢墟, 倖存, 縫隙, 輕而易舉, 成本, 本領, 訓練有素]
  inline_underlined_terms: [非洲]

