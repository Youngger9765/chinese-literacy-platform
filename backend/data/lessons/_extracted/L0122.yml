      tail: |-
        結局：印加帝國的崩潰
        1.原本強大的【　】在西班牙人到來後迅速瓦解。
        2.印加人放棄原本的【　】和語言，改信天主教。
        3.【　】語成為南美洲的主要語言。
      tail_blanks: [{answer: 印加帝國}, {answer: 信仰}, {answer: 西班牙}]
    - label: 提問
      items:
        - {label: 左欄, value: 1.勢單力薄的西班牙人在短時間征服印加帝國，靠的是什麼？}
        - {label: 右欄, value: 2.為什麼歐洲人攜帶這麼多致命的病菌，自己卻不會生病？}
    - label: 說明
      items:
        - value: 賈德‧戴蒙的研究指出，是西班牙人從【　】帶過去的病菌。
          blanks: [{answer: 歐洲}]
        - value: 這些疾病在歐洲已經肆虐一千多年；歐洲人逐漸產生【　】。
          blanks: [{answer: 抗體}]
    - label: 詳細說明
      matching:
        left_header: 病菌所造成的影響
        right_header: 帝國有什麼改變?
        instruction: (配對連線)
        left:
          1: (1)1524年，歐洲人帶來的天花傳染到美洲，導致大量死亡。
          2: (2)1528年印加皇帝因天花病逝，繼承人爭奪王位，引發長年內戰。
          3: (3)印加人發現信仰天主教的西班牙人沒有生病，認為西班牙人的神才是真神。
        right:
          A: 眾人改變信仰，加速印加帝國的崩解。
          B: 印加帝國長年的內戰，導致帝國政治經濟瓦解。
          C: 大規模疫情，導致8年內印加帝國人口減半。
        answer: {1: C, 2: B, 3: A}
        answer_carrier: 紅色手繪連線（圖形），文字流無此資訊
        answer_note: |-
          原稿只畫了兩條線：(2)→B 與 (3)→A（兩條在圖上交叉）。
          (1) 與 C 的圓點都沒有連線 —— 但 C 是唯一沒被用掉的選項，且語意相符
          （1524 天花傳染導致大量死亡 → 大規模疫情導致 8 年內人口減半）。
          (1)→C 是**由剩餘推得**，不是圖上讀到的。
    - label: 總結
      value: |-
        1.如果沒有病菌，印加帝國可能不會那麼快被嚴重削弱。
        2.天花等疾病成為西班牙人征服印加的重要推力，改變了美洲的歷史。

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略──找出一連串因果
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）；步驟❸ 表格第 1 列的 2 個 ☑ 是**黑色**，屬原稿印的示範
  blocks:
    - type: concept_box
      text: |-
        你有沒有想過，有些事情不是突然發生的，而是一件事接著一件事，像骨牌一樣推下去？我們讀的這篇「隱形的征服者」，就是這樣。
        西班牙人只有168人，怎麼可能打敗8萬印加軍？課文要我們注意：西班牙能以少數軍隊取勝，不只是軍事力量的問題，更因為印加帝國在交戰前已被一連串事件嚴重削弱。
        這些事情不是同時發生的，而是一件接著一件來，形成「一連串因果關係」。
        在前一課：「讓你口中的甜蜜成為遠方農民的希望」我們學到了如何找出「一連串因果」，可以用❶～❹四個步驟，幫助你把文章裡的前因後果看得更清楚。現在我們再來練習看看吧！
      layout_note: |-
        這個框在 PDF p6 被 LibreOffice 排成左右兩欄且互相重疊，看起來像亂碼；
        document.xml 的文字流是完整乾淨的，本欄以文字層為準。

    - type: figure
      id: 找出一連串因果四步驟
      referent: 找出一連串因果四步驟流程圖
      # 🔴 整張圖的字都畫在圖片上：「四步驟」「識別文章中討論的主要事件」「圈出因果提示詞」
      #    「標出原因與結果」「串連完整因果鏈」「找線索」「判斷因果畫箭頭」「一連串因果圖」
      #    在合併 run 後的 dump 全部回 0 命中。
      #    ⚠️ raw XML grep「四步驟」會回 1，但那是圖檔檔名屬性
      #    （pic:cNvPr name="找出一連串因果四步驟.png"），不是內文 —— 只看 raw grep 會誤判成文字層。
      text_carrier: image
      content: |-
        找出一連串因果 四步驟
        ❶找事件：識別文章中討論的主要事件／文章討論哪些事
        ❷找線索：尋找文章中的因果關係提示詞／圈出因果提示詞
        ❸判斷因果畫箭頭：分析並標示原因與結果的關係／標出原因與結果
        ❹一連串因果圖：串連形成完整的因果關係鏈／串連完整因果鏈
      placement_note: 印在概念說明框下方、「一、推論本文的因果關係」之前（PDF p7 上半）

    - type: guide
      text: 一、推論本文的因果關係

    # ── 步驟❶ ──
    - type: guide
      text: 步驟❶──找事件
    - type: guide
      text: 1.問自己：這段文字提到提到了哪些重要事件或現象？
    - type: guide
      text: ◎小試身手：
    - type: multi
      prompt: 找出文中可能造成印加帝國被削弱或衰敗的事件。先不管發生順序，全部找出來。 (請在□中打勾，複選，有四個答案）
      options:
        1: 天花病菌傳入印加
        2: 繼承人爭奪王位，引發內戰
        3: 人民改說西班牙語
        4: 多年戰亂，政治經濟崩潰
        5: 印加皇帝染疫過世
        6: 皮薩羅帶著168名士兵準備偷襲
      answers: [1, 2, 4, 5]

    # ── 步驟❷ ──
    - type: guide
      text: 步驟❷──找因果線索
    - type: guide
      text: 1.問自己：文章中哪些地方透露出「原因結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？
    - type: guide
      text: |-
        2.祕訣：
        A.「有關鍵詞」的文句：
    - type: table
      columns: ['', 原因, 結果]
      rows:
        - [關鍵詞, 因為、由於、為了, 因此、所以、導致、造成]
    - type: guide
      text: |-
        B.「沒有關鍵詞」的文句：
        判斷策略：加因果關鍵詞，判斷是否為因果句。
        例如：「皇帝死了，內戰爆發。」
        加入關鍵詞「因為皇帝死了，所以內戰爆發。」
    - type: exercise
      instruction: ◎小試身手
      option_bank: {1: 是因果句, 2: 不是因果句}
      column_header_note: 表格印兩欄：「句子」與「判斷是否為因果句」
      items:
        - {type: single, index: 1, prompt: 1. 1528年，印加皇帝也染疫去世，兩位繼承人爆發激烈的內戰。, answer: 1}
        - {type: single, index: 2, prompt: 2.天花透過歐洲水手和士兵傳入美洲，造成印加人民大量死亡, answer: 1}
        - {type: single, index: 3, prompt: 3.皮薩羅帶著168人偷偷觀察印加軍隊, answer: 2}
        - {type: single, index: 4, prompt: 4.皇帝染病死亡，引發繼承人爭奪王位，爆發內戰, answer: 1}

    # ── 步驟❸ ──
    - type: guide
      text: 步驟❸──判斷因果，畫箭頭
    - type: guide
      text: |-
        1.問自己：在找到的因果語句中，「原因」是哪一部分？「結果」是哪一部分？兩者之間如何連接？
        2.祕訣：畫一個箭頭「→」從原因指向結果，就一目了然了！
    - type: guide
      text: |-
        ◎小試身手
        根據上表，請判斷誰是因？誰是果？並畫正確箭頭方向
    - type: fill_table
      columns: [事件, 因, 果, 箭頭方向, 事件, 因, 果]
      answer_carrier: 紅色 ☑ 與紅色「→」；**第 1 列的 ☑ 與 → 是黑色**，屬原稿印的示範
      rows:
        - {事件: 1.天花病菌傳入印加, 因: 1, 果: 2, 箭頭方向: →, is_printed_example: true}
        - {事件: 2.皇帝染病死亡, 因: 1, 果: 2, 箭頭方向: →}
        - {事件: 3.內戰與分裂多年, 因: 1, 果: 2, 箭頭方向: →}
      rows_note: |-
        每一列印成七格：左事件／因□／果□／箭頭方向／右事件／因□/果□。
        教師版一律勾「左事件＝因、右事件＝果」，所以上表用 1（左邊那一格打勾）
        與 2（右邊那一格打勾）表示；右事件依序是
        1.「印加人大量死亡，皇帝也染病死亡」2.「繼承人爭奪王位，爆發內戰」3.「帝國政治經濟瓦解」。
      right_events:
        1: 印加人大量死亡，皇帝也染病死亡
        2: 繼承人爭奪王位，爆發內戰
        3: 帝國政治經濟瓦解

    # ── 步驟❹ ──
    - type: guide
      text: 步驟❹──連成一連串因果
    - type: figure
      referent: 一連串因果鏈示意圖
      text_carrier: image
      content: |-
        虛線框內四組「因→果」串接的示意圖，標籤依序是
        因（1）果、因2 果、因3 果、因4 果
      content_note: |-
        八個標籤（因1 果1 因2 果2 因3 果3 因4 果4）其實**在文字層**（各自是一個文字方塊），
        只有虛線框與箭頭是圖形。這裡標 text_carrier: image 是因為整塊的空間關係讀不出來；
        標籤本身照原樣列在 labels。
      labels: [因1, 果1, 因2, 果2, 因3, 果3, 因4, 果4]
    - type: ordering
      prompt: A.以本文為例，隱含著一條重要的因果鏈。上表我們已經找到3個因果關係，接下來我們再看看它們之間的關係，請排序畫出一條因果鏈。
      instruction: ◎小試身手
      options:
        1: 天花病菌傳入印加地區
        2: 帝國持續內戰與分裂
        3: 皇帝染病死亡
        4: 帝國政治經濟瓦解
      answer: [1, 3, 2, 4]
      answer_line_label: B.一連串因果（可以寫編號或寫自己看得懂的關鍵詞）
      answer_text_removed_note: |-
        原本這裡有一行 answer_text，把 answer 的順序渲染成「①…→③…→②…→④…」。
        那是抽取者組裝的散文、不是教材印的字（原稿在這裡是一張表格，
        沒有這樣一條連續字串），所以逐字門判它對不上是對的。
        它也沒有多帶資訊 —— 順序在 answer: [1,3,2,4]，③格寫關鍵詞這件事在 answer_carrier。
        移除而不是豁免：answers_are_graphical 只表示答案是圈線，不豁免題目文字。
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊；③那一格寫的是關鍵詞而不只是編號
      shape_note: |-
        🔴 這一塊就是 content_known_gaps.yaml#mcq_options_emitted_as_guides 記在 L0122 的那一筆。
        它**不是選擇題的選項**，是排序題的教師答案；舊管線把它抽成 guide，
        而偵測器 `OPTION_LINE_IN_GUIDE_RE` 只看「開頭是不是①②③④⑤」，於是報成漏出的選項。
        改抽成 `ordering` 之後那個 guide 不存在了 → 這一課的 leaked 會變 0。
    - type: guide
      text: C.最後造成的總結果：帝國變得非常虛弱、不堪一擊。
    - type: guide
      text: D.這條因果鏈告訴我們：印加帝國在還沒跟西班牙人真正交戰前，已經因為天花傳入，造成大量人民死亡、皇帝染疫去世，進而引發內戰分裂和政治經濟瓦解，變得非常虛弱、不堪一擊。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  questions:
    - index: 1
      answer: C
      stem: 請問哪一個句子的語詞使用正確?
      options:
        A: 我今天和面試官「對峙」了十五分鐘，終於面試成功
        B: 最近校園裡的戀愛傳聞「肆虐」，讓大家沒辦法專心上課
        C: 期末考太難，班上「哀鴻遍野」，很多同學更是滿臉愁容
        D: 老師在台上「撕心裂肺」的講解題目，台下同學仍是聽不懂
    - index: 2
      answer: D
      stem: 根據本文內容，哪一張折線圖最能呈現天花傳入前後，印加帝國人口的變化？（縱軸為人口、橫軸為時間）
      # 🔴 四個選項本身是**四張折線圖**，連座標軸的「人口」「時間」都畫在圖上。
      #    文字層只留下「             B.           C.           D. 」——**選項 A 的字母整個不見**。
      #    下面四段是逐頁讀圖轉錄的，不是原稿的字。
      options_are_images: true
      text_carrier: image
      options:
        A: 從原點一路向右上方上升的直線（人口持續增加）
        B: 一條水平直線（人口始終不變）
        C: 先上升、再下降、再上升的折線（人口反覆起伏）
        D: 起點在高處，先緩後陡地下降，最後在低點持平（人口大幅減少後維持低檔）
    - index: 3
      answer: B
      stem: 根據課文，下列哪一項最能概括「隱形的征服者」這個標題的意涵？
      options:
        A: 西班牙人偷偷登陸印加地區
        B: 病菌沒有武器，卻讓整個帝國崩潰
        C: 西班牙士兵穿著盔甲讓人無法看清
        D: 印加人不敢對抗強大的神明
    - index: 4
      answer: C
      stem: 根據課文描述，印加人看見西班牙人似乎不受病菌影響後，最不可能產生哪一種想法？
      options:
        A: 開始懷疑自己的信仰是否可靠
        B: 認為自己的神明失靈，轉而改信天主教
        C: 認為神明不滿意祭典儀式，需舉辦更盛大的祭典
        D: 對西班牙人產生敬畏感，覺得他們受到神保護
      teacher_note: (文章明確指出印加人看到西班牙人不生病，「開始認為他們的神才是真神」，因此A、B、D皆符合文本心理轉變的描述。)
    - index: 5
      answer: B
      stem: 作者在開頭描寫168人對抗8萬人的場景，這樣的寫作手法可以達成什麼目的？
      options:
        A: 強調歷史偶然性，讓讀者相信人數少的一方也有戰勝的機會
        B: 刻意營造懸殊反差，第二段揭示出乎意料的結果，製造驚奇
        C: 為了突顯西班牙軍人英勇無畏，強調以小勝大的奇蹟
        D: 為了引導讀者相信歷史發展冥冥中自有安排，無從解釋

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  target_words: [區區, 懸殊, 對峙, 蔓延, 肆虐, 抗體, 勢單力薄, 不堪一擊, 哀鴻遍野, 撕心裂肺]
  grid_size: [10, 10]
  grid:
    - 血哀衰哀聲嘆氣瘧疾速
    - 藤傷敗鴻人滿為患病不
    - 蔓延遲遍對峙肄業堪鴻
    - 沿廷朝野持時虐一圖撕
    - 轉嫁安役窺待擊生大心
    - 裝飾肆然見絕懸死展裂
    - 勢力蛛虐文筆殊未歐肺
    - 均單疑懸賞抗勝卜洲崎
    - 力兵力單吭歌體軀區嶇
    - 敵餉抗薄土坑嚴竣區峻
  answers_are_graphical: true
  answer_paths:
    - word: 哀鴻遍野
      cells: [[1, 4], [2, 4], [3, 4], [4, 4]]
      direction: vertical
    - word: 不堪一擊
      cells: [[2, 10], [3, 9], [4, 8], [5, 7]]
      direction: diagonal_down_left
    - word: 蔓延
      cells: [[3, 1], [3, 2]]
      direction: horizontal
    - word: 對峙
      cells: [[3, 5], [3, 6]]
      direction: horizontal
    - word: 撕心裂肺
      cells: [[4, 10], [5, 10], [6, 10], [7, 10]]
      direction: vertical
    - word: 肆虐
      cells: [[6, 3], [7, 4]]
      direction: diagonal_down_right
    - word: 懸殊
      cells: [[6, 7], [7, 7]]
      direction: vertical
    - word: 勢單力薄
      cells: [[7, 1], [8, 2], [9, 3], [10, 4]]
      direction: diagonal_down_right
    - word: 抗體
      cells: [[8, 6], [9, 7]]
      direction: diagonal_down_right
    - word: 區區
      cells: [[9, 9], [10, 9]]
      direction: vertical
  geometry_check: |-
    全檔 roundRect 錨點 12 個，扣掉 2 個非圈選圖形（5.98×1.90in 的 tx1 概念框、
    3.41×0.75in 的 bg1/tx1 圖示）＝ 紙上 10 個橘圈，與 10 條 answer_paths 相同；
    posOffset 全在紙內，無紙外殘留；格子沒有跨頁（10 列都在 p11）。
    ⚠️ 本課 10 個圈的框線**全部**寫死 srgb E97132（沒有一個用佈景色 accent2）——
    SKILL 把「硬寫死 E97132」當紙外殘留的旁證，在這一課不成立。

