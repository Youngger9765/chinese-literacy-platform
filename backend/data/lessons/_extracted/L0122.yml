  # 印在第四大題底下、不另編大題號的辨析小練習
  word_discrimination:
    title: ◎牛刀小試
    instruction: 「肆虐」與「蔓延」，勾選出最適合填入空格的詞語。(單選)
    option_bank: {A: 肆虐, B: 蔓延}
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）；「例」那一列的 ☑ 是**黑色**，屬原稿印的示範
    example:
      label: 例
      stem: 你覺得哪一個詞的破壞性比較強？
      answer: A
      is_printed_example: true
    items:
      - {index: 1, stem: 強颱(   )台灣，造成嚴重災害。, answer: A}
      - {index: 2, stem: 流感病毒在社區中逐漸(   )。, answer: B}
      - {index: 3, stem: 豪雨來襲，山區水患(   )，村民被迫撤離。, answer: A}
      - {index: 4, stem: 疾病快速(   )，學校緊急停課。, answer: B}
    tip:
      title: 小提點
      text: |-
        「肆虐」與「蔓延」這兩個詞都與事物的擴散有關，但著重的點不同。
        肆虐：指災害、疾病或負面影響的猛烈擴散，帶有破壞性和嚴重程度。
        →這個詞常用來形容災害、戰爭或病毒快速侵害的狀況。
        蔓延：強調範圍逐漸擴大，但不一定帶有劇烈破壞性。
        →這可以用來描述疾病、思想、影響力等的擴散過程。

