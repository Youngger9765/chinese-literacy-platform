# ── 一 讀全文-做記號 ──
body:
  header_strategy: 目標策略：推論策略──推論故事主旨
  header_level: Level 6・議論文
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  lesson_heading: 第1課  心理出狀況，是壞事導致的嗎？
  paragraph_count: 16
  paragraphs:
    - idx: 1
      text: 許多人認為，一個人心理出了狀況，如憂鬱、焦慮、一蹶不振等，都是「自己不能控制的壞事」導致的。這些壞事包括家庭貧窮失能、惡劣的童年經驗、學業、情感或工作失敗等。但這個說法是真的嗎？來看看底下的三個故事：
    - idx: 2
      text: 阿堅16歲，因為偷竊、打架被送進少年觀護所。理著光頭的他，恨恨的對觀護人說：「我爸酗酒，每天喝得醉醺醺，我媽在我兩歲的時候就跑了，我有這樣的家庭，你期待我能怎麼樣？」不管是誰聽到這段，都會想：「可憐的孩子，被一個失能的家庭害了。」
    - idx: 3
      text: 故事還沒完，阿堅的姊姊小芸，20歲，國立大學的高材生，在校名列前茅，擔任慈幼社的幹部，下課後要兼家教賺錢、回家照顧酒醉的老爸、探望被關在少觀所的弟弟。
    - idx: 4
      text: 觀護人很驚訝的問姊姊：「你有三頭六臂嗎？怎麼這麼優秀啊？」
    - idx: 5
      text: 小芸聳聳肩說：「我家都已經這個樣子了，我不多努力一點行嗎？」
    - idx: 6
      text: 咦？這雙姊弟不是來自同一個家庭嗎？為什麼這個家庭會成為阿堅墮落犯罪的理由，卻又成為小芸發奮圖強的原因呢？
    - idx: 7
      text: 35歲的鄧小姐意外發現自己的血壓高達210/120，經詳細檢查後，醫師告訴她：「你有先天性高血壓，非常危險，必須一輩子服用降血壓藥。」
      layout_note: 原稿在「必須一輩子服用」與「降血壓藥。」之間有一個手動換行，仍是同一段
    - idx: 8
      text: 鄧小姐憂鬱起來，她日間茶飯不思，夜裡輾轉反側，心裡不斷反芻：「為什麼是我？我那麼年輕，看重飲食和運動，又沒有過重，無妄之災啊，我為什麼那麼倒楣？」
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 9
      text: 她四處求醫，但各家醫院的診斷都差不多，只要她聽到要一輩子吃藥，立刻潸然淚下。這天，她到臺大醫院，這位最有名的心臟血管科醫師宣判：「先天性的高血壓！一輩子服藥。」鄧小姐立刻眼前模糊一片，啜泣著說：「為什麼是我？我那麼年輕……我為什麼那麼倒楣？」
    - idx: 10
      text: 名醫皺著眉說話了：「你怎麼會倒楣？你運氣太好了。」鄧小姐愣了愣。醫師繼續說：「高血壓是沒有症狀的，年輕人尤其不會注意到自己血壓過高，許多人因此腦血管破裂，送醫時已經死亡或半身不遂了。你在完全沒症狀時就發現高血壓，每天只要一小顆藥就沒問題了。」他又說了一次：「你怎麼會倒楣？你運氣太好了。」
    - idx: 11
      text: 鄧小姐眼睛睜大，心想：「對耶，我運氣還真不錯。」從此，她乖乖吃藥，快樂起來，又能吃能睡了。
    - idx: 12
      text: 鄧小姐「得了高血壓，要一輩子吃藥」這個事實，有改變嗎？當然沒有。那她為什麼突然不憂鬱了？
    - idx: 13
      text: 黃美廉從出生即患有腦性麻痺，手腳變形扭曲，走路東倒西歪。她無法控制自己的口唇，不但沒辦法說話，還必須拿著毛巾，隨時擦拭流下來的口水。但腦性麻痺沒有影響她的樂觀進取，29歲，她在美國取得藝術博士的學位。回臺灣後，她經常應邀到各處演講，因為不能說話，她必須先寫好講稿，請人錄音，再以肢體表演配合講稿來表達。她幽默豁達的分享，激勵了許多人。
    - idx: 14
      text: 一次演講後，有位學生舉手問道：「妳從小就長成這個樣子，怎麼還快樂得起來呢？」這時講堂裡鴉雀無聲，大家都認為，這個學生問了個冒犯的問題。但黃美廉只是笑了笑，轉過頭來在黑板上寫下：
    - idx: 15
      text: 這時，教室內安靜到一根針掉在地上都聽得見。她回過頭來靜靜地看著大家，再回過頭去，在黑板上寫下她的結論：「ＯＯＯＯＯＯＯ」
    - idx: 16
      text: 你發現這三個故事的共同主題了嗎？是的，主角都遇到了自己不能控制的壞事。但即使惡劣的情況已不可能逆轉，一個人如果能「改變自己對壞事的看法」，就比較不會讓自己的情緒跌入萬丈深淵。最後再問一次：心理生病了，真的是「壞事」導致的嗎？
  # 課文裡印了、但**不佔段號**的行（跟 L0124 的 preface 同族，只是位置在中間不在開頭）
