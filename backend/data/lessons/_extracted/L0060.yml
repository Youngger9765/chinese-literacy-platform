    - {index: 3, stem: 每次比賽過後，他總會不斷（　）跑步中的每個動作，期待下次能有更好的表現。, answer: F}
    - {index: 4, stem: 這個廚師彷彿有（　），居然能一手炒菜，一手煮湯，還能同時完成擺盤，真是太厲害了！, answer: B}
    - {index: 5, stem: 他不僅被騙光積蓄，還被裁員，情緒一下子跌入（　）。, answer: H}
