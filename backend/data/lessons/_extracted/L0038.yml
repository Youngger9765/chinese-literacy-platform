    - label: 解決（誰＋做什麼）
      value: |-
        1.【　】。
        2.水下攝影機把魚群影像傳到網站；網友發現魚群聚集後按下「魚門鈴」，管理員收到訊息便開啟閘門。
      blanks: [{answer: 生態學家馬克．范赫斯和工程師、科學家合作，設計了魚門鈴}]
