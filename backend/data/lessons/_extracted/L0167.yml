        - {options: [肯定, 批評], answer: 2}
      內容_source_text:
        - 1.小美看見隊友的表現亮眼而感到【  不是滋味  】
        - 2.阿哲練習後對自己的表現感到【  沮喪  】
        - 3.小宇站在罰球線，心裡十分（①緊張　□②雀躍）
        - 4.佳恩準備上場，腦中都是他人
        - （□①肯定  ②批評）的聲音
      內容_note: |-
        第 3、4 項的選項在原稿印在括號內。**被勾中的那個選項前面是 `w:sym`（沒有 w:t），
        沒被勾的前面是字面「□」** —— 所以資料流其實是「（①緊張　□②雀躍）」。
        上面的 `內容` 是**讀起來乾淨的版本**（拿掉 □，否則等於用「哪個沒有框」洩漏答案），
        `內容_source_text` 保留資料流原樣供逐字門比對。**不是勘誤，是勾選符號的編碼差異。**
        另外第 4 項在原稿被分頁切成兩個段落，source_text 照切法分兩條。
        ☑ 是本課僅有的兩個 w:sym F0FE。
    - 主題: 提出主旨
      段落: 六
      內容:
        - 1.運動不只需要體力、技術，還需要可以和【　】好好合作。
        - 2.【　】會影響你面對壓力和挫折，以及看待自己與隊友。
      內容_blanks: [{answer: 身體}, {answer: 心}]
    - 主題: 提出證據  與建議
      段落: 七
      內容:
        - 1.證據：研究顯示，在實力相當的情況下，【　】往往是勝負的關鍵。
        - 2.建議：把握每一次訓練和比賽的機會，隨時【　】、調整自己的情緒與想法。
      內容_blanks: [{answer: 心理素質}, {answer: 覺察}]
    - 主題: 結論
      段落: 八
      內容:
        - 比賽帶來的不只是輸贏，更是對自己和他人的【　】。
      內容_blanks: [{answer: 了解}]

# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 自我覺察
  blocks:
    - type: concept_box
      text: |-
        「自我覺察」就是懂得觀察自己的心情和想法，知道「我現在在想什麼、為什麼會有這種感受、這些對我的行為有什麼影響」。有了這種能力，在考試或比賽很緊張時，就比較能冷靜，不會被情緒控制；跟同學吵架時，也能更快明白自己為什麼生氣，還能換位思考別人的心情。懂得自我覺察，就像幫自己裝了一個「提醒器」，讓你在做決定前多想一步，避免事後後悔。
        不過，「自我覺察」不是一下子就能學會的，需要在每天的生活裡一點一點累積，日常中我們可以練習問自己「我現在的情緒是什麼？」、「是什麼讓我有這樣的情緒？」接下來，我們可以先用幾個小問題，來練習觀察自己內心的情緒和想法。
    - type: guide
      text: |-
        ◎ 小試身手：
        練習一：從日常情境練習覺察自己的情緒和想法，能讓我們更懂自己，也更懂得照顧自己。請根據每個情境勾選或填寫你的想法。（可複選）
    - type: guide
      text: 情境一：明天段考要考你最在乎的那一科
    - type: multi
      prompt: ＊你的情緒會是：
      options: {1: 緊張, 2: 焦慮, 3: 專注, 4: 期待, 5: 有點壓力, 6: 自信, 7: 好奇, 8: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: ＊為什麼會有這種情緒：
      options: {1: 想知道自己的實力, 2: 怕被嘲笑, 3: 怕被比較, 4: 怕被罵, 5: 想挑戰自己, 6: 對自己沒有信心, 7: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: ＊這種情緒可能讓我：
      options: {1: 睡不著, 2: 更專心準備, 3: 覺得煩躁, 4: 想再複習一次, 5: 越想越慌, 6: 告訴自己「盡力就好」, 7: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: ＊更好的應對方式：
      options: {1: 做幾次深呼吸讓自己放鬆, 2: 告訴自己「我已經準備得不錯了」, 3: 把緊張當成專注的提醒, 4: 規劃休息時間，避免過度緊繃, 5: 考前與朋友聊聊、舒緩壓力, 6: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: guide
      text: 情境二：小組討論時，有同學沒幫忙，還批評你的意見。
    - type: multi
      prompt: ＊你的情緒會是：
      options: {1: 生氣, 2: 委屈, 3: 驚訝, 4: 無奈, 5: 失望, 6: 平靜, 7: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: ＊為什麼會有這種情緒：
      options: {1: 覺得不公平, 2: 覺得被誤會, 3: 沒想到他會這樣說, 4: 想讓討論更好, 5: 想維持小組和諧, 6: 希望大家一起做好, 7: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: ＊這種情緒可能讓我：
      options: {1: 想反擊或頂嘴, 2: 想冷靜一下再處理, 3: 不想再合作, 4: 想私下問清楚, 5: 想請老師協助, 6: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: ＊更好的應對方式：
      options: {1: 先讓自己冷靜一下再回應, 2: 試著理解對方的立場, 3: 選擇合適的時間再談, 4: 尋求老師或同學協助溝通, 5: 用「我覺得……因為……」表達想法, 6: '其他：＿＿＿＿＿'}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: free_text
      prompt: 練習二：請想一件最近發生在你身上的小事，寫下你的覺察。
      sub_prompts:
        - ＊發生的事情是：_________________________________________
        - ＊我當下的情緒是：_______________________________________
        - ＊讓我產生這種情緒的原因是：______________________________
        - ＊這種情緒讓我做了什麼事？結果如何？______________________
      no_correct_answer: true
      answer_carrier: 學生自填，原稿四條橫線都是空的

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  option_key_note: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af0）
  answers_printed: true
  items:
    - index: 1
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 比賽輸了，大家互相指責，場面「不動聲色」，令人緊張
        B: 她第一次來這座城市，走在街道上卻有「似曾相識」的感覺
        C: 即使在遭受嚴厲的批評時，他也「不是滋味」，繼續保持冷靜
        D: 湖泊和山林交織成一幅美景，「平分秋色」，讓人心情平靜
      answer: B
      teacher_note: |-
        第 1題解析：(A)宜用「一觸即發」
        (C)宜用「不動聲色」(D)宜用「湖光山色」
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 2
      stem: 根據第四段「這些話就像一群吵鬧的麻雀，在腦子裡飛來飛去，吵得她幾乎忘了眼前的投手正準備出手。」這句話表達了佳恩正遇到什麼困難？
      options:
        A: 太過專注於比賽，無法聽到隊友的提醒
        B: 觀眾的加油聲太熱烈，干擾她的注意力
        C: 腦中的負面想法太多，導致她無法專注
        D: 眼前的投手一直發出聲音，思緒被打斷
      answer: C
      teacher_note: 第2題解析：根據文章，「這些話」是佳恩腦袋中想像的批評。
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
      note: 題幹說「第四段」，該引文在課文第 5 段（佳恩那段）。原稿如此，照抄不改。
    - index: 3
      stem: 下列何者最能作為這篇文章的主旨？
      options:
        A: 心理素質與運動表現息息相關，也可以透過練習提升
        B: 選手應避免有情緒，情緒失控會讓選手失去比賽機會
        C: 提升運動表現最適當的方法是規律的技術與體能訓練
        D: 透過競爭、壓力能激發自己的潛力，要善用逆境進步
      answer: A
      teacher_note: 第3題解析：根據第六段、第七段可知。
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
      note: 四個選項在原稿印成同一個段落，中間以換行分隔
    - index: 4
      stem: 文末提到「原來我們可以不只被心帶著跑，心，也能支撐我們」，下列哪一個說法最能呼應這句話的意思？
      options:
        A: 心臟健康是運動表現的重要指標，應該重視心肺功能訓練
        B: 心情起伏是無法控制的，只能盡量逃避或靠意志力撐過去
        C: 情緒變化難以避免，但選手應該隱藏情緒，不讓他人發現
        D: 即使感到緊張，也可以透過練習學會穩定情緒、發揮實力
      answer: D
      teacher_note: (A)「心」是指「心理素質」(B)可以練習調節(C)不是需要隱藏
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 5
      stem: 面對考試成績不理想的狀況，下列何者的想法最符合「自我覺察」的表現？
      options:
        A: 柏丞：「我現在好沮喪，好像一直懷疑自己，感覺這次的考試對我來說意義重大。」
        B: 怡萱：「考那麼差，一定是因為我沒天分，算了啦，反正再怎麼努力也沒用。」
        C: 品妤：「老師也出太難了吧，這種題目到底有幾個人可以及格啊？」
        D: 祐廷：「只要考卷不用帶回家簽名就好了，反正也就是一次考試，沒什麼大不了的。」
      answer: A
      teacher_note: (B)(C)(D)都沒有針對自己的情緒、想法思考，只是逃避或指責其他人
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
      note: 四個選項在原稿排成 2×2 的表格（A/B 一列、C/D 一列），不是直式清單

