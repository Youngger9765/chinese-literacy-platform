  columns: [主題, 段落, 內容]
  answer_carrier: 橘色填在【　】內（字元樣式 af0）＋ 紅色 ☑（w:sym Wingdings F0FE）×2
  rows:
    - 主題: 舉例
      段落: 二~五
      內容:
        - 1.小美看見隊友的表現亮眼而感到【　】
        - 2.阿哲練習後對自己的表現感到【　】
        - 3.小宇站在罰球線，心裡十分（①緊張　②雀躍）
        - 4.佳恩準備上場，腦中都是他人（①肯定  ②批評）的聲音
      內容_blanks: [{answer: 不是滋味}, {answer: 沮喪}]
