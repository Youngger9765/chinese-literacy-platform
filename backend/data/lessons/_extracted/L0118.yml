# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法——用故事說道理
  strategy_type: writing_craft
  blocks:
    - type: concept_box
      text: |-
        上一課〈塞翁失馬，焉知非福〉，我們學到：作者如何用故事和例子支持觀點。這一課再往前一步：課文本身是一則故事，但「故事中有故事」，作者在主要情節中插入另一則故事，讓主角和讀者從中明白道理。
        我們可以依三個步驟讀這類文章，
        一、共同處境：內層故事和主要人物有什麼相同或相似的處境？
        二、理解用意：從對比中抓出內層故事要傳遞的道理
        三、看見改變：這個故事如何改變主要人物看事情的眼光？
        這一課的學習目標是：這個故事和主要情節有什麼關聯？它幫人物或讀者明白了什麼？

    - type: guide
      text: |-
        一、共同處境：
        讀這篇課文，不能只被法師講的故事吸引，還要對照一下，看看這個故事和林奶奶的處境有什麼相同或相似之處？它在文中產生了什麼作用？
        我們把法師講的故事拆成「樵夫險境」和「鮮美草莓」兩部分。先比較「樵夫險境」和林奶奶的處境。

    - type: fill_table
      label: 一、共同處境
      rows:
        - [對照, 林奶奶的現實處境, 樵夫在故事中的處境]
        - - 樵夫險境
          - |-
            受病痛折磨，又拖累家人，生命沒有別的出路。
            靠醫院和家人活著，但對病痛和死亡，完全無法控制。
          - |-
            1.後有猛虎，前有深崖，生命沒有別的出路。
            2.靠藤蔓活著，但對猛虎、懸崖和黑白老鼠，完全無法控制。
        - - |-
            相同相似處
            (複選)
          - |-
            ☑①處境相似：都面對生命盡頭、無路可退。
            ☑②對許多痛苦，大家都無能為力，做什麼都沒用。
            □③結果相同：兩人的危險和痛苦都立刻消失。
        - [故事作用, 讓林奶奶想到自己的處境，眼淚奪眶而出，覺得自己被理解、被同理。]
      answers: {相同相似處: [1, 2]}
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），文字流查得到；③未勾
      note: |-
        原稿是一張表；第 3、4 列的內容欄跨兩欄合併，所以那兩列只有兩格。
        「林奶奶的現實處境」欄的兩點原稿未編號（樵夫欄有 1./2.），照原稿保留差異。

    - type: guide
      text: |-
        二、理解用意：
        請想一想，（樵夫故事）中「香甜草莓」這一部分想告訴我們什麼道理？

    - type: fill_table
      label: 二、理解用意
      rows:
        - - |-
            香甜
            草莓
          - 樵夫身處險境，無能為力，卻能看見身邊的美好，開始品嘗身邊草莓。
        - - |-
            故事
            用意
            (複選)
          - |-
            ☑①讓林奶奶看見，除了怨恨憂鬱，她還可以有不同的選擇。
            □②對許多痛苦，大家都無能為力，做什麼都沒用。
            ☑③提醒林奶奶，身心折磨之外，可以看見同時存在的許多美好。
      answers: {故事用意: [1, 3]}
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: guide
      text: 三、看見改變：故事帶給林奶奶怎樣的改變？

    - type: single
      label: '1.回到人物轉變'
      prompt: 根據上表，林奶奶真正改變的是什麼？（單選）
      options:
        1: 故事沒有改變林奶奶的病情，卻改變了林奶奶看事情的眼光。
        2: 故事減輕了林奶奶的疼痛，也不再害怕死亡。
      answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: single
      label: '2.回到故事的力量'
      prompt: 林爺爺直接勸說，林奶奶更痛苦；法師說了一個不是真的故事，卻讓她看見家人的愛。為什麼故事比較有效？（單選）
      options:
        1: 因為故事把沉重的道理藏在驚險情節裡，讓林奶奶暫時不再想自己的病痛。
        2: 因為故事沒有直接責備她，而是讓她從樵夫身上看見自己，也看見痛苦旁邊仍有美好。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: single
      label: '3.回到故事作用'
      prompt: 法師說這個故事，最主要的用意是什麼？（單選）
      options:
        1: 讓林奶奶忘記病痛、死亡、拖累家人等無法控制的壞事。
        2: 讓林奶奶明白，痛苦是真的，但身邊的愛與美好也是真的。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: single
      label: '4.故事帶來的改變'
      prompt: 林奶奶因為這個故事而有了什麼改變？
      options:
        1: 林奶奶身體的疼痛和心裡的害怕都大幅降低。
        2: 林奶奶開始看見身邊的愛與美好，開始感恩。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
      note: 原稿此題未標（單選），但只勾一個答案

    - type: self_check
      label: ◎ 自我檢核
      instruction: 如果你有做到，請在□內打勾。
      items:
        - 1.我能看出樵夫故事和林奶奶處境的關聯。
        - 2.我能說出法師說這個故事的作用：故事改變的是林奶奶看待生命的眼光，而不是身體的病情。
        - 3.下次讀到「故事中有故事」的文章，我會問自己：這個故事和主要情節有什麼關聯？它產生了什麼作用？
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: B
      stem: 本文第3～4段，林爺爺原本想安慰林奶奶，為什麼反而讓她更激動？
      options:
        A: 因為林爺爺故意責備她，讓她覺得自己被拋棄
        B: 因為那些話讓她更覺得自己活著是在拖累家人
        C: 因為她以為家人已經決定放棄治療，不再陪伴她
        D: 因為那些話讓她懷疑家人根本不相信她真的痛苦
      explanation: 林爺爺是出於關心，但他提到「孩子們也撐得很辛苦」「大家都不知道怎麼陪你了」，林奶奶因此更加自責，覺得自己活著是在折磨別人，所以情緒更激動。
    - index: 2
      answer: D
      stem: 林奶奶最後吃著孫女削的蘋果，說：「好香，好甜。」作者這樣安排，最可能是想要讓讀者看見什麼？
      options:
        A: 林奶奶發現蘋果比草莓更甜，因此心情立刻變好了
        B: 林奶奶想安慰孫女不要擔心，所以故意裝作很快樂
        C: 林奶奶已經不再害怕死亡，也完全接受自己的病情了
        D: 林奶奶除了病痛之外，開始看見家人陪伴的美好
      explanation: 她能感受到孫女的陪伴與蘋果的香甜，表示她開始看見病痛旁邊仍存在的愛與美好
    - index: 3
      answer: C
      stem: 本文採用「故事中有故事」的寫法，主要用意是什麼？
      options:
        A: 讓文章看起來更長，增加故事情節的曲折變化
        B: 讓法師顯得更神祕，強調他比家人更了解病人
        C: 讓讀者跟著林奶奶一起，從樵夫故事中理解人生處境
        D: 讓樵夫故事成為主線，取代林奶奶的病房故事
      explanation: 第3題：外層是林奶奶的病房故事，內層是樵夫的寓言故事。作者是透過樵夫的處境，讓林奶奶和讀者一起理解：生命有限、痛苦真實，但仍有可以品嘗的美好。
    - index: 4
      answer: D
      stem: 法師說的故事，是在說明林奶奶的人生處境。下列哪一組「故事中的事物—象徵意義」的配對最符合文章意思？
      options:
        A: 猛虎象徵家人責備，草莓象徵逃離病房的方法
        B: 藤蔓象徵醫院規定，黑白老鼠象徵醫生與家人
        C: 懸崖象徵旅行冒險，蘋果象徵孫女的烹飪技巧
        D: 草莓象徵痛苦旁邊仍然可以珍惜的小小美好
      explanation: 草莓不是逃避現實，也不是單純好吃的水果。它象徵人在無法逃開痛苦與生命限制時，仍能感受當下的一點美好。
    - index: 5
      answer: B
      stem: 下列哪一項最能說明本文最可能帶給讀者的體會？
      options:
        A: 照顧病人時，應該多勸病人接受現實，才有助於改善情緒
        B: 故事不一定改變事實，卻可能改變當事人看待事實的眼光
        C: 遇到痛苦時，故事可轉移注意力，幫當事人忘記所有煩惱
        D: 生病的人應該忍耐情緒，不能讓身邊的照顧者承受壓力
      explanation: 本文不是說故事能治好病，也不是要求病人壓抑情緒。林奶奶的病痛和害怕仍然存在，但故事讓她換了一種眼光，看見家人的愛與生活中仍可品嘗的美好。
  answer_carrier: 答案代號印在題號前的（　）內，橘色手寫體；五則解析各印在獨立的文字方塊中

