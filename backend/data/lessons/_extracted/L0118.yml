# ── 一 讀全文—做記號 ──
body:
  header: 第20課  懸崖邊的那顆草莓
  paragraph_count: 14
  # 段號欄第 1 個字是注音符號「ㄧ」(U+3127) 不是漢字「一」，原稿如此。
  paragraphs:
    - idx: 1
      text: 一個明明不是真的故事，為什麼能讓一個快要放棄生命的人，重新看見活著的美好？
    - idx: 2
      text: 林奶奶半躺在癌症治療中心的病床上，淚眼婆娑。除了身體的病痛，她的心，鎮日浸泡在怨恨與憂鬱裡。她吃不下、睡不著，總是呼天搶地地哭泣：「老天爺不公平，我又沒做錯什麼，為什麼讓我得這個病？我花掉家裡這麼多錢，把兒孫都拖累了，我一天也過不下去，醫生哪，你乾脆給我一針，讓我走掉算了！」
    - idx: 3
      text: 林爺爺趁著沒有旁人時，又湊近她耳邊唸叨：「我們都知道你很難受，可是孩子們也撐得很辛苦。你每天這樣哭，對自己不好，大家都不知道怎麼陪你了。」
    - idx: 4
      text: 這些話不但沒有幫到林奶奶，她反而放聲大哭：「對啦，我活著就是來折磨人的啦。你以為我很喜歡這樣是嗎？我根本不能控制啊……你讓我去死，就不會折磨大家了……」
    - idx: 5
      text: 每個家人都神經緊繃，心裡惴惴不安，卻都不知所措。
    - idx: 6
      text: 這天下午，一位常來病房關懷的禪宗法師聽說了林奶奶的事，坐在床邊。林奶奶提高警覺說：「他們要你來教訓我嗎？」法師握著林奶奶枯乾的手，微笑著說：「放心，我是來講一個好聽的故事的。」法師開始娓娓道來。
    - idx: 7
      text: 「有個樵夫上山砍柴，忽然遇見猛虎。他拚命逃，被逼到懸崖邊。身後有惡虎，眼前是深不可測的懸崖，他無可選擇，只能閉眼一跳。下墜時幸好有一條藤蔓勾住了他，讓他懸在半空。他驚魂未定，但一條小命暫時保住了。他鬆了一口氣，但是……」林奶奶哭泣已停，急著問：「但是怎樣？」
      note: 原稿在「林奶奶哭／泣已停」處換到下一個 w:p，是同一段（「哭泣」被拆開），非兩段
    - idx: 8
      text: 「但是，這時來了一隻黑老鼠和一隻白老鼠，在樵夫夠不著的上方，開始你一口我一口地啃嚙著那條藤蔓。樵夫知道，再這麼下去，藤蔓遲早會斷，他的生命終將結束。他求助無門，自己也無計可施。」這時，法師用澄澈而安定的眼神看著林奶奶，問道：「你覺得他可以怎麼辦呢？」
    - idx: 9
      text: 林奶奶看著法師，想到了自己的處境，百感交集。她搖了搖頭，淚水奪眶而出。
    - idx: 10
      text: 「就在這時，他看見崖壁上竟長著一顆晶瑩飽滿的野草莓，鮮豔欲滴，它紅得發亮，像把陽光藏在果肉裡。樵夫伸出手，把它摘下來放入口中。他閉上眼：『嗯，好香好甜的草莓啊！』故事講完了。」
    - idx: 11
      text: 「這是什麼故事？好像沒有結束呢。」林奶奶皺眉問。
    - idx: 12
      text: 法師沉默片刻，才說：「人生就是這樣。這輩子少不了各種壓力的追逼，也少不了左右為難的抉擇。黑白老鼠分別象徵黑夜與白天，牠們啃嚙著生命線，你做什麼都無法阻止，大限終究會到。有些痛苦，我們終究無能為力；但在痛苦旁邊，有時仍藏著一點可以品嘗的美好。病痛是真，害怕也是真，但你有沒有想過，你曾牽過孩子的手、吃過家人煮的熱粥、現在也能看見窗外的陽光、感受到家人對你的愛，這些也都是真。藤蔓會斷，但草莓仍然香甜啊。」
    - idx: 13
      text: 那天傍晚，讀國中的孫女放學後來看奶奶，為她削了一小塊蘋果。林奶奶慢慢嚼著，眼淚滑下來。她沒有說自己不痛了，也沒有說自己不怕了，只是輕輕握住孫女的手，低聲說：「好香，好甜。謝謝你們，還陪在我身邊。」
    - idx: 14
      text: 窗外的夕陽斜斜照進病房，那一刻，她像是終於嘗到了懸崖邊的那顆草莓。
  inline_marked_terms: [淚眼婆娑, 鎮日, 呼天搶地, 唸叨, 惴惴不安, 娓娓道來, 深不可測, 啃嚙, 百感交集, 晶瑩飽滿, 鮮豔欲滴, 大限]

