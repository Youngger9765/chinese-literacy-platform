        1.大家常見的質疑：有的人不值得【　】；有的人不被相信。
        2.回應質疑：不是只能在「冒險相信」或是「全部自己來」之間二選一，可以練習把任務內容、【　】和【　】說清楚。
      內容_blanks: [{answer: 信任}, {answer: 完成標準}, {answer: 下一步行動}]
    - 結構: 統整結論
      段落: '8'
      內容: |-
        1.成為值得信任的人：答應的事要做到；失誤後願意承擔責任並【　】。
        2.給予夥伴成熟的信任：不要求對方永遠完美，而是看見他願意【　】，並一起補救。
      內容_blanks: [{answer: 修正補救}, {answer: 負責的行動}]
  rows_note: 「段落」欄是印好的段號範圍，不是空格。

# ── 六 品格聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 成為值得信任的夥伴
  strategy_type: character_being_trustworthy
  section_label: 品格聚光燈
  answer_carrier: 橘色代號（全部 8 題單選都是；本節**沒有任何 ☑**）
  blocks:
    - type: concept_box
      text: |-
        上一課，我們練習在「我不放心隊友」時，先說清楚疑慮、調整合作。這一課換個角度：「當別人不放心我」時，我可以怎麼用行動重新累積信任？你是否曾經遇過這些情況？
        明明很想參與，組員卻不願意把重要工作交給你。
        你說自己會完成，組員還是不斷追問進度。
        你曾經忘記或沒有做好，大家便覺得你不可靠。
        這時，你可能會感到委屈：「我又不是故意的！」、「為什麼大家就是不相信我？」、「他們根本不願意再給我機會！」
        但是，別人無法直接看見你心裡有多想做好，只能從你的行動判斷，所以信任不能只靠一句「相信我」，而要用一次次可靠的行動慢慢累積。讓我們來看看，如何可以讓自己成為值得信任的夥伴！
      text_note: |-
        中間三行在 PDF 上前面各印一個「・」項目符號，那是 Word 自動編號，不在文字流裡。
        本課的 concept_box 明確接續 L0165（「上一課…這一課換個角度」），兩課是同一單元。
    - type: multi
      prompt: ◎當同學已經不太相信你，想重新取得信任並不容易。當你發現自己承諾的事情沒有做到，哪些會是你心中可能出現的想法？
      instruction: （複選；沒有標準答案）
      options:
        1: 現在說，一定會被責怪，晚一點再說好了。
        2: 承認我不會，大家一定會更看不起我。
        3: 我不是故意的，他們不應該一直怪我。
        4: 我不知道該怎麼開口，所以乾脆先不說。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿四個都是空的 □（指示語自己就寫「沒有標準答案」）
    - type: guide
      text: |-
        →這些想法並不奇怪。我們可能是怕被責怪、怕丟臉，也可能是不想再次失望，所以想先躲開問題。但若想修復信任，可以試著依底下三個步驟，採取必要行動。
        ❶說清楚：任務、期限、困難與需要的協助。
        ❷主動回報：目前完成多少、還缺什麼、何時再回報。
        ❸負責補救：承認影響、立即補救、改變下次做法。
        底下讓我們用更具體的例子，說明「當別人不放心我」時，該怎麼修復信任。

    - type: guide
      text: 步驟❶：說清楚
    - type: passage
      paragraphs:
        - 說法一：「你們相信我，我這次一定會做好。」
        - 說法二：「我負責找兩張圖片，星期三晚上以前放到群組。            如果星期二還找不到，我會先告訴大家。」
      paragraphs_note: 說法二中間有一長串空白（原稿排版），照原樣保留。
    - type: single
      index: 1
      prompt: 1.請比較下面兩種說法，哪一種說法比較能讓組員放心？為什麼？
      options:
        A: 說法一，因為語氣有信心，能表現出強烈決心
        B: 說法一，因為沒有說得太細，之後可以彈性調整
        C: 說法二，因為任務、期限和遇到問題的做法都清楚
        D: 說法二，因為答應後就不需要其他組員再次確認
      answer: C
      options_note: 選項代號在原稿是圈框字🄐🄑🄒🄓（U+1F150~），此處以 A~D 記錄。
    - type: guide
      text: →說清楚不是只說「我會做」或「我不會」，而是說清楚：我負責什麼；我能先完成哪一部分；我卡在哪一個步驟；我需要哪一種協助。

    - type: guide
      text: 步驟❷：主動回報
    - type: single
      index: 2
      prompt: 2.如果小楷星期五要上傳小組報告的圖片，什麼時間點最適合先主動回報？
      options:
        A: 星期三發現進度落後，而且有一部分找不到
        B: 星期五放學後，確認自己已經無法完成任務
        C: 報告當天上臺前，組員主動詢問圖片在哪裡
        D: 等老師發現內容不足，再向全組說明原因
      answer: A
    - type: single
      index: 3
      prompt: 3.哪一句回報最完整？
      options:
        A: 「我還沒完成，不過你們不要一直催我。」
        B: 「圖片有點難找，我應該還是可以趕得上。」
        C: 「我找到一張，還缺兩張；今晚八點前再回報一次。」
        D: 「我真的已經很努力了，沒完成也不是故意的。」
      answer: C
    - type: guide
      text: →主動回報不必一次解決全部問題，只要讓夥伴知道：現在完成到哪裡；還缺少什麼；下一次何時再回報；是否需要協助。提早說不一定舒服，卻能讓問題還有處理的空間。

    - type: guide
      text: 步驟❸：負責補救
    - type: single
      index: 4
      prompt: 4.哪一個回應最有助於修復信任？
      options:
        A: 「我真的很抱歉，希望你們不要再提這件事。」
        B: 「我沒有按時完成，但你們也應該早點提醒我。」
        C: 「我沒按時交，耽誤大家；今晚補完，下次提早回報。」
        D: 「這次大家一起幫忙完成，以後就不要再分工作了。」
      answer: C
    - type: guide
      text: |-
        →出錯後，可以做三件事：
        1.承認影響：我的行動對夥伴造成什麼影響？
        2.立即補救：現在還能補回哪一部分？
        3.改變做法：下一次要怎麼避免同樣的問題？
        道歉讓人知道你在乎；補救與改變，才讓人重新看見可靠的行動。

    - type: guide
      text: ◎綜合練習：
    - type: passage
      paragraphs:
        - 校隊週末要參加比賽。小凱曾經兩次答應提早到場，最後卻遲到，也沒有事先通知。這次教練只先請他負責整理球具，沒有讓他擔任先發球員。小凱心裡很不是滋味：「教練和隊友根本不相信我。只讓我整理球具，就算做好了，又能證明什麼？」
    - type: single
      index: 1
      prompt: 1.小凱的想法反映了哪一種阻礙？
      options:
        A: 怕被責怪，所以不敢說明遲到原因
        B: 怕被看不起，所以不敢承認能力不足
        C: 覺得信任無法恢復，所以不想再付出
        D: 覺得整理球具太困難，所以想請人代勞
      answer: C
    - type: single
      index: 2
      prompt: 2.哪一種想法比較能幫助小凱繼續行動？
      options:
        A: 教練應該立刻讓他先發，才表示真正相信他
        B: 只要這次準時到場，大家就應忘記過去的遲到
        C: 整理球具不是重要任務，做好也無法改變看法
        D: 先把眼前的任務穩定做好，再逐步累積新的信任
      answer: D
    - type: single
      index: 3
      prompt: 3.小凱接下來最適合怎麼做？
      options:
        A: 提早到場整理球具，完成後主動告知教練
        B: 要求教練立刻讓他上場，證明自己的比賽能力
        C: 等隊友提醒後再整理，避免表現得太過積極
        D: 拒絕整理球具，表達自己受到不公平的對待
      answer: A
    - type: guide
      text: →重新取得信任並不容易。先說清楚困難，主動讓夥伴知道進度；如果已經出錯，就負責完成補救。信任會從一件件小而可靠的行動中，慢慢累積。

# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號，PDF p10 可見
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1、2、5 題有
  questions:
    - index: 1
      answer: B
      stem: 下列選項中「  」的語詞，何者使用正確？
      options:
        A: 這項活動由全班共同分工，大家「一手包辦」完成
        B: 我願意貢獻「一己之力」，協助完成這場演出
        C: 牆上的油漆剝落後，牆壁顏色變得更加「出色」
        D: 警方用尺「釐清」嫌疑人的身高是一百七十公分
      teacher_hint: |-
        (A)「一手包辦」是指獨立完成
        (C)宜用「褪色」、「失色」
        (D)宜用「測量」
      teacher_hint_note: 這則藍框印在第七大題標題旁（PDF p10 右上），不在題目旁邊。
    - index: 2
      answer: D
      stem: 根據第六段，「信任不是只有兩種選擇」，作者否定的是哪兩種極端想法？
      options:
        A: 相信有能力的人，或相信有責任感的人
        B: 相信過去的表現，或相信未來的承諾
        C: 相信隊友的態度，或相信隊友的能力
        D: 完全把事情交出去，或全部拿回來自己做
      teacher_hint: 原文：與其冒險相信別人，不如全部自己來。
    - index: 3
      answer: B
      stem: 作者先以大隊接力說明信任，再舉世界12強棒球賽的例子，這樣安排有什麼作用？
      options:
        A: 比較接力與棒球哪一種運動更需要團隊合作
        B: 先用熟悉經驗解釋概念，再用真實事件加以印證
        C: 先說明信任容易失敗，再證明競賽結果全靠運氣
        D: 比較學生參加比賽與職業球員參賽時的心理差異
    - index: 4
      answer: C
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 團隊要獲得成功，應由最出色的人負責關鍵工作
        B: 團隊成員應彼此鼓勵，不要指出夥伴所犯的錯誤
        C: 成熟的信任來自清楚分工、履行承諾與共同補救
        D: 只要經過充分練習，團隊成員就不會再發生失誤
    - index: 5
      answer: A
      stem: 小安負責準備比賽器材，卻發現自己可能無法在期限前完成。他擔心說出來會被責怪。根據本文，哪一種處理方式最成熟？
      options:
        A: 提早說明目前進度、困難，以及接下來的處理方式
        B: 要求隊友先保證不責怪他，再決定是否告知狀況
        C: 繼續獨自處理，等確定無法完成時再說明原因
        D: 先把工作交給別人，以免自己的失誤影響團隊
      teacher_hint: 修復信任的關鍵：說清楚、主動回報、負責補救。

