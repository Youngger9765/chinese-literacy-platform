body:
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: "在團隊合作中，你比較常是哪一種角色呢？是覺得「分工好麻煩，乾脆由我一手包辦」的人？還是那個總是擔心夥伴出錯、拖累自己的人？又或是那個滿腹委屈：「為什麼大家都不相信、覺得我不可靠」的人？"
    - idx: 2
      text: "許多人都跑過大隊接力，準備接棒的人最容易有這種感覺：明明已經站在接棒區，腳也開始往前跑了，卻還是忍不住頻頻回頭。「前一棒有沒有追上來？我們會不會掉棒？我會不會超出接力區？」然而，只要一回頭，腳步就亂了，原本該加速的地方慢了下來，原本該伸手接棒的時機也變得難以掌握。越是放心不下，越容易發生失誤。"
    - idx: 3
      text: "真正能全力往前衝的人，並不是毫無畏懼，而是因為他知道：我們已經練過起跑的位置，事先約定好交棒的口令，也熟悉彼此的助跑速度。到了交棒那一刻，他要做的不是一直回頭確認，而是相信前一棒會追上來，把接力棒穩穩交到自己手中。信任的力量，有時候就是讓我們不必頻頻回顧，能夠把全部心力放在眼前的每一步。"
    - idx: 4
      text: "這不只發生在大隊接力裡。2024 年世界棒球 12 強賽開打之前，由於台灣隊備受矚目的投、打球星無法參賽，許多被選入的球員年輕、缺乏國際大賽經驗，日本球評依實力排序時，把台灣隊排在倒數第2名。面對外界的分析與質疑，隊長陳傑憲只是說：「我相信我的隊友。」當時，沒有人知道最後誰會上壘、誰會開轟、誰會守住最後一個出局數，可是他先選擇相信：我們不是一個人上場，我們是一整隊人一起面對。"
    - idx: 5
      text: "後來，台灣隊在冠軍戰以 4 比 0 擊敗日本，陳傑憲也在冠軍戰擊出三分全壘打，並獲選該屆世界 12 強最有價值球員（MVP）。可是，如果只記得最後那支全壘打，就太可惜了。因為一場比賽的勝利，從來不可能只憑一己之力完成。有人要設法上壘，有人要推進跑者，有人要穩固守備，有人要投球，有人要在休息區裡提醒、鼓勵、觀察。奪冠之後，陳傑憲說的第一句話不是自己的表現，而是：「謝謝團隊讓世界看見台灣。」他的表現十分出色，可是他更記得，這不是一個人的勝利。"
    - idx: 6
      text: "不過，讀到這裡，也許有人會質疑：「相信隊友聽起來很好，但有些人就不值得信任啊！」也可能有人會想：「不是我不想做好，是大家一開始就不相信我。」這樣的想法並不奇怪。因為在真實的合作裡，我們確實可能遇到讓人不放心的隊友。有人答應了卻沒做到，有人常常拖到最後一刻，有人一遇到困難就不見蹤影，也有人不是不想做，而是真的還不會。這些經驗容易使人心生懷疑：與其冒險相信別人，不如全部自己來。可是，信任不是只有兩種選擇。"
    - idx: 7
      text: "更成熟的信任，是先釐清：我究竟對什麼感到不放心？再把任務內容、完成標準和下一步行動說清楚，進行中主動回報進度，遇到困難提早說明；把答應的事完成，也讓夥伴知道你做到了。信任不只是一種感覺，它是由每一次「我答應的事，我做到了」慢慢累積起來的。"
    - idx: 8
      text: "所以，成為值得信任的人，不代表永遠不會失誤，而是失誤後願意繼續承擔責任、修正補救。一份成熟的相信，也不是期待對方永遠完美，而是當對方失誤時，仍願意看見他負責的行動，並和他一起把事情做好，完成任務。"
  running_char_counts: [27, 55, 84, 113, 142, 172, 202, 212, 240, 270, 300, 330, 359, 389, 414]
  running_char_counts_note: |-
