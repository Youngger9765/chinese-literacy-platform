# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 2~5 題有
  questions:
    - index: 1
      answer: D
      stem: 請問哪一個句子使用語詞有誤？
      options:
        A: 我迫不及待要在這場比賽「大顯身手」，展現平時訓練成果
        B: 即使未來的路充滿「荊棘」，我們也要努力克服，繼續前行
        C: 為了幫助災民，公益協會呼籲各界踴躍捐款，「多多益善」
        D: 為了紀念蔣渭水的貢獻，政府設置了蔣渭水「里程碑」
    - index: 2
      answer: D
      stem: 根據文章，1900年第二屆的巴黎運動會為什麼會開放女性參賽？
      options:
        A: 奧運之父古柏坦改變心意
        B: 因為女性的地位提升許多
        C: 因性別、人權意識的抬頭
        D: 為了熱鬧有趣，讓更多人參與
      teacher_hint: 第2題解析：第二段：為了熱鬧有趣、多多益善，所以才意外打破女性不得參與奧運的規定。
    - index: 3
      answer: B
      stem: 根據本文，請問下列選項何者錯誤？
      options:
        A: 整體而言，女性選手參賽率呈上升趨勢
        B: 古代的女性都沒有參加奧運比賽的能力
        C: 運動中的性別文化，仍有待提升
        D: 2024巴黎奧運男女選手參與率為1:1
      teacher_hint: 第3題解析：第二段：女性是被禁止參賽，並不表示沒有能力參賽。
    - index: 4
      answer: A
      stem: 雖然本文提到巴黎奧運創下「性別平衡的全新里程碑」，但第九段提到：「性別平等這條路仍充滿荊棘。」似乎有所衝突。請問為什麼作者會這樣寫？
      options:
        A: 作者認為體育界仍有許多男女不平等的現象，不易改善
        B: 作者認為巴黎奧運的男女人數平等只是暫時的假平等
        C: 作者希望未來奧運比賽女子運動員人數應超過男子
        D: 因為奧運會無法對真實社會的性別平等產生實質影響
      teacher_hint: 第4題解析：由第九段可知，作者認為有進步，但還須持續努力，希望大家不要認為奧運就是性別平等的終結。
    - index: 5
      answer: C
      stem: 下列措施，何者最有助於性別平等的落實？
      options:
        A: 作為一個運動員，外表與實力缺一不可
        B: 沙灘排球女性應穿著比基尼，以減少阻力
        C: 國際奧會應該提升決策系統的女性占比
        D: 女性在月經期間應避免運動，以免受傷
      teacher_hint: (A-應注重實力就好。B-女性可自行選擇想穿的衣服。C-多元聲音，有助實施性別平等。D-無根據。)

