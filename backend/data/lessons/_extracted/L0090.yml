spotlight:
  strategy_name: 用表格整理訊息──從數據歸納趨勢
  strategy_type: data_trend
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）＋橘色手寫填空
  blocks:
    - type: concept_box
      text: |-
        這篇文章有許多年份、數字和比例。先把同一項資料依時間順序整理，再比較前後數值的變化，就能看出數據的趨勢。「趨勢」是什麼？
        詞語解釋趨勢：一件事在一段時間內，往哪個方向變化的情形。
        例子：這學期參加羽球社的人數，期初36人，期中22人，期末只剩13個人。這趨勢看來可真不妙。
        注意喔，看趨勢一定要注意兩個問題：「哪一段時間？（這學期）」和「事情有什麼變化？（變多、變少、持平）」
        這課的聚光燈要介紹「用表格的數據歸納出趨勢」的方法，建議的步驟是：❶抓主題 ❷排時間 ❸比數值 ❹說趨勢 來試試看吧！
      text_note: |-
        「詞語解釋」四字在版面上是左側一個小標籤方塊，攤平後會黏在「趨勢：」前面。
        四個步驟之間版面上印的是箭頭，但那是 Wingdings 符號（w:sym F0E0）、不在文字流裡，
        故本檔不寫入箭頭字元；閱讀順序即 ❶→❷→❸→❹。

