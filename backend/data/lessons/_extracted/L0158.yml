#    ⚠️ 第一大題的編號印的是**注音符號「ㄧ」**（U+3127 BOPOMOFO LETTER I），
#       其餘四個是漢字二三四五 —— 與 L0154／L0155 同型，照原稿記。
#
# 🔵 答案載體逐項查過（挑對本課有效的交叉驗證）：
#    ① ☑ 勾選 → **0 個**（`w:sym` 全檔 0、`symEx` 全檔 0）。本課答案**完全沒有勾選**，
#       所以「數 F0FE 對答案數」在這一課毫無效力 —— 換用顏色與逐頁讀圖交叉驗證。
#    ② 🔴 **橘色教師答案 run 層與字元樣式都有，兩邊都要看**：
#       `rPr/w:color` 掃到 31 個 E97132，解 `rStyle`→`styles.xml` 再多 **65 個**，合計 96。
#       只掃 run 層會少掉三分之二（填空的括號在 run 上、括號裡的答案在樣式上）。
#    ③ 框選語詞 `w:bdr` 非 auto 顏色 → **0 個**。文白詞語比對要解釋的字是用**灰底**
#       （`w:shd`）標的，不是框線。
#    ④ 紅線／連線 → **無**。全檔 `srgbClr FF0000` 出現 26 次，但遞迴到 `wps:wsp` 檢查
#       每個圖形的 `a:ln`，**紅色線圖形 0 個** —— 那 26 次全是**紅色文字**
#       （第四大題第 3 題的「翻譯：…」註解框）。⛔ 只 grep FF0000 會誤判成有連線題。
#    ⑤ 找字圈選 → 不適用（本課沒有詞語複習）。全檔 roundRect **0 個**。
#
# 🔴 箭號：`w:sym` 全檔 0，所以本課的箭號**全是字面字元**——
#    「請將主語補上➡」的 ➡（U+27A1）2 個，在 `w:t` 裡，**照抄保留**。
#    （對照 L0157 同一批有 Wingdings 符號箭號要斷行 —— 兩課處理方式不同，要逐個看。）
#
# 🔴 本課沒有任何 `text_carrier: image` 的節點。自檢：唯一的圖是 p1 的插畫
