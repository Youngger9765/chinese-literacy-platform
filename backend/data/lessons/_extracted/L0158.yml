# ── 古文今譯（無大題編號）──
modern_translation:
  section_name: 古文今譯
  paragraphs:
    - 某位商人，來到直隸省的邊界附近，忽然下起大冰雹，他連忙躲到田間。突然，他聽到空中有聲音說：「這是張不量的田，不要傷了他的莊稼。」商人心想：這張氏既然叫「不良」，為何反而受上天庇佑？等冰雹停止，商人進入村子，向人打聽那個人，並且詢問那人叫這名字的意思。
    - 原來張氏素來富有，積蓄的穀物很多。每到春天，窮人就來找他借貸穀物，償還時，不管還了多少也不計較，全都收下，不曾拿工具測量，要人還到足夠的數量，所以才叫他「不量」，並非「不良」啊！後來眾人趕到田中，只見麥子被冰雹砸得像亂麻一樣，只有張氏的田一點事也沒有。
  illustration_note: 這一節下方印了一張插畫（農夫在麥田中舉手擋冰雹），無文字

# ── 原文（無大題編號）──
classical_text:
  source_label: 清朝・蒲松齡
  punctuation_note: |-
    原文的「.」是學習單印的**斷詞記號**（朗讀說明第 2 條明寫），不是句號。
    「雨／量」等字在文字層夾了隱藏 variation selector（U+E01Ex），比對前濾掉 Cf/Mn。
    注釋編號在原文裡是上標數字（1~5），本欄照文字層原樣保留在句中。
  paragraphs:
    - 賈人.某，至.直隸1界，忽.大雨2雹，伏.禾中。聞.空中.云：「此.張不量田，勿傷.其稼。」賈.私意.張氏既云「不良」，何反.佑護？雹止，入村，訪問.其人，且問.取名之義。
    - 蓋.張素豐，積粟.甚富。每春間.貧民就貸，償時.多寡不較，悉納之，未嘗.執概3取盈4，故名.「不量」，非.不良也。眾趨.田中，見稞穗.摧折如麻，獨.張氏諸田.無恙5。
  annotations_label: 注釋
  annotations:
    - {index: 1, term: 直隸, text: 清代的直隸省，現在中國的河北省。}
    - {index: 2, term: 大雨雹, text: 雨，當動詞，表示落下的意思。「大雨雹」的意思是下了很大的冰雹。}
    - {index: 3, term: 概, text: 用來刮平「米斗」的工具。米斗，交易時用來測量米量的容器。}
    - {index: 4, term: 盈, text: 有「滿」的意思，課文是指足夠的數量。}
    - {index: 5, term: 恙, text: 疾病或異樣。「無恙」的意思是沒有病痛、憂慮，課文是指沒事。}
  qr_note: 「清朝・蒲松齡」那一格右側印了一個 QR code

# ── 朗讀計時（無大題編號）──
key_reading:
  unit: 秒
  unit_note: 文言文計時的是「讀完全文要幾秒」，不是白話課的「1 分鐘幾字」；沒有累計字數欄、沒有 ☞ 起讀點
  instructions:
    - 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
    - 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  timing_table:
    columns: [第1次計時, 第2次計時, 第3次計時, 裁判計時]
    unit: 秒
    judge_signature: true
  benchmark_instruction: ◎ 我的表現：請確認讀完全文的時間。不要太快也不要太慢，不漏字或加字，斷詞的位置也要正確哦！
  benchmark:
    - {threshold: 40秒以下, feedback: 速度有點快，要讀清楚哦！}
    - {threshold: 40~50秒, feedback: 強者就是你啦！}
    - {threshold: 50秒以上, feedback: 速度再快一點！}

# ── ㄧ 文白句子比對 ──
sentence_matching:
  instruction: |-
    請模仿例句作法：
    ❶閱讀參考句；❷找出參考句對應的原文；❸將對應的原文(  )起來
    ❹在下方的[  ]寫上參考句代號。
  answer_carrier: 橘色代號（run 層 w:color 與字元樣式兩種都有），文字流有此資訊
  shape_note: |-
    本課**分成兩題**（第一題標「例句」、第二題），各自有一份原文與一組 7 個參考句，
    兩題的參考句代號各自從 1 編到 7（不是連號）。與 L0155 的「一份原文 8 段」形狀不同。
  parts:
    - part: 第一題
      label: 例句
      passage_paragraphs:
        - (賈人某，至直隸界)，（忽大雨雹，伏禾中）。（聞空中云）：
        - 「此張不量田，勿傷其稼。」(賈私意張氏既云「不良」，何反佑護)？
        - （雹止，入村，訪問其人），（且問取名之義）
      passage_note: |-
        照原稿的**印刷斷行**分成三行（每一行下方另有一行放［N］代號）。
        ⚠️ 不要把三行接成一整段 —— 原稿沒有那個接法，逐字門會判 FAIL 而且判得對。
        括號有全形也有半形，照各自原樣。
      reference_label: 參考句：
      reference_sentences:
        1: 他聽到空中有聲音說
        2: 並且詢問那人叫這名字的意思
        3: 商人心想：這張氏既然叫「不良」，為何反而受上天庇佑
        4: 忽然下起大冰雹，他連忙躲到田間
        5: 等冰雹停止，商人進入村子，向人打聽那個人
        6: 某位商人，來到直隸省的邊界附近
        7: 這是張不量的田，不要傷了他的莊稼
      segments:
        - {index: 1, classical: 賈人某，至直隸界, answer: 6}
        - {index: 2, classical: 忽大雨雹，伏禾中, answer: 4}
        - {index: 3, classical: 聞空中云, answer: 1}
        - {index: 4, classical: 此張不量田，勿傷其稼。, answer: 7, note: 這一段用原有的引號「」當界線，沒有另外加括號}
        - {index: 5, classical: 賈私意張氏既云「不良」，何反佑護, answer: 3}
        - {index: 6, classical: 雹止，入村，訪問其人, answer: 5}
        - {index: 7, classical: 且問取名之義, answer: 2}
      pointer_note: 參考句［6］那一行左邊印了一個指標符號（圖形，非文字），指向例句的第一個答案
    - part: 第二題
      passage_paragraphs:
        - text: |-
            　　（蓋張素豐，積粟甚富）。（每春間貧民就貸），（償時多寡不較，悉納
            之），(未嘗執概取盈)，（故名「不量」，非不良也）。(眾趨田中，見稞穗
            摧折如麻）。(獨張氏諸田無恙)。
          source_text: |-
