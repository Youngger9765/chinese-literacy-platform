# ── 三 文章重點表 ──
keypoints:
  title: 不量田
  layout: matrix
  columns: [元素, 內容摘要]
  intro: |-
    本課課文是蒲松齡所寫的短篇小說故事。
    故事體的結構一般包含：「故事背景」、「起因」、「問題」、「解決」、「結果」等，你在讀故事時，若用「故事結構」去讀，讀完後，用故事結構去理解、回想，你可以更容易理解、更容易記憶哦！
    請利用故事結構，配合課文內容，在【 】處填入原文，找不到原文時，再用自己的話寫。
  answer_carrier: 橘色手寫（run 層 w:color ＋ 字元樣式兩種），文字流有此資訊
  rows:
    - 元素: 背景
      內容摘要: 某位【　】來到【　】時，為了躲避大【　】，便躲到田間。
      內容摘要_blanks:
        - {answer: 賈人/商人}
        - {answer: 直隸界/河北省界}
        - {answer: 冰雹}
    - 元素: 起因
      內容摘要: |-
        神祕經歷
        空中有聲音說：「這是【　】田，不要傷害他的莊稼。」
      內容摘要_blanks:
        - {answer: 張不量}
    - 元素: 問題
      內容摘要: |-
        產生疑惑
        這個叫【　】的人，為何受上天保佑？
      內容摘要_blanks:
        - {answer: 不良}
    - 元素: 解決
      內容摘要: |-
        向村民尋求答案
        這個叫【　】的人非常富有，積蓄的【　】很多。
        他借給【　】的穀物，人家償還多少都不計較，不曾拿工具測量，所以大家才叫他【　】。
      內容摘要_blanks:
        - {answer: 張不量}
        - {answer: 粟/穀物}
        - {answer: 貧民/窮人}
        - {answer: 不量}
    - 元素: 結果
      內容摘要: |-
        商人恍然大悟
        是自己誤解了人家名字的意思。
        眾人趕到田中，發現只有張不量的田【　】。
      內容摘要_blanks:
        - {answer: 無恙/一點事也沒有}
  rows_note: 每一列的第一行小標（神祕經歷／產生疑惑／向村民尋求答案／商人恍然大悟）是灰底，不是空格

# ── 四 文言文聚光燈 ──
spotlight:
  strategy_name: 判讀主語
  strategy_type: classical_grammar
  section_title_printed: 文言文聚光燈
  answer_carrier: 橘色手寫代號與填空（run 層 w:color ＋ 字元樣式），文字流有此資訊
  blocks:
    - type: concept_box
      text: |-
        在古代，「寫字」是一件很花錢的事，以致古人寫字時惜字如金，能省則省，但這往往造成我們閱讀文言文時產生困難，所以，如果我們能了解文言文省略了什麼，就比較能理解文章。
        文言文省略的成分很多，其中一種就是省略「主語」。但，主語是什麼？

    - type: sub_block
      label: 一、什麼是主語
      value: 主語是句子中做動作的人或物，或是句子所形容的對象
      value_note: |-
        這一句印在一個虛線框裡；框內「做動作的」與「所形容的」是**白字黑底**（反白），
        並各有一條藍色指示線分別指向例1的「看書」與例2的「真是美極了」。
        指示線是圖形（`srgbClr 4472C4`），文字全在文字層。
      items:
        - sub_label: 例1：哥哥在房間裡看書。
          value: |-
            找到動詞，看書。
            「看書」的是「哥哥」，所以「哥哥」就是這個句子的主語。
        - sub_label: 例2：夏夜的景色真是美極了。
          value: |-
            找到形容詞，真是美極了。
            「真是美極了」的是「夏夜的景色」，所以「夏夜的景色」就是這個句子的主語。

    - type: exercise
      instruction: 二、換你試試看！請選出下列各句的主語
      items:
        - {type: single, index: 1, stem: 微風輕輕地吹拂著。, options: {A: 微風, B: 吹拂著}, answer: A}
        - {type: single, index: 2, stem: 人類的本性是善惡摻雜的。, options: {A: 人類, B: 人類的本性}, answer: B}
        - {type: single, index: 3, stem: 月光多麼明亮皎潔。, options: {A: 月光, B: 明亮皎潔}, answer: A}
        - {type: single, index: 4, stem: 他是否缺席要確認一下。, options: {A: 他, B: 他是否缺席}, answer: B}

    - type: guide
      text: |-
        三、文言文主語的判讀方式
        　　現在，你已經知道什麼是主語了。回到主題，如何判斷省略主語的文言文句子，被省略的主語是什麼呢？如何「補回」?我們可以從中文的四個基本句型來思考：
    - type: table
      instruction: 　中文基本句型
      columns: [句型, 句型結構, 形式, 例句]
      rows:
        - [敘事句, 主語+動詞, 誰做什麼, 哥哥在房間看書。]
        - [表態句, 主語+形容詞, 誰怎麼樣, 天氣很熱。]
        - [有無句, 主語+有/沒有, 誰有沒有, 這裡沒有網路。]
        - [判斷句, 主語+是/不是, 誰是不是, 春天是繁花盛開的季節。]
      rows_note: 「主語」與例句中的主語部分在原稿是灰底
    - type: guide
      text: 　觀察基本句型的形式，可以歸納出還原省略主語的步驟：
    - type: concept_box
      text: |-
        1.找動詞(包括有/沒有、是/不是)或形容詞。
        2.判斷是「誰做什麼」、「誰怎麼樣」、「誰有/沒有」、「誰是/不是」以確認主語
      text_note: 印在一個虛線框裡
    - type: sub_block
      label: 　　例1：「蓋張素豐，(張)積粟甚富。」
      value: |-
        1.找到「素豐」跟「積粟甚富」這些形容。
        2.由第一句的「張素豐」判斷，這兩個句子的主語都是張氏，只是第二句省略了主語。
    - type: sub_block
      label: 例2：「賈人某，至直隸界，(天)忽大雨雹，(賈人某)伏禾中。」
      value: |-
        1.找到「至直隸界」、「大雨雹」、「伏禾中」這些動作。
        2.結合第一句的主語賈人某，判斷是「賈人某至直隸界」、「賈人某伏禾中」；但賈人某無法下冰雹，能下冰雹的是天。
      value_note: 例1、例2 括號裡補上的主語（張／天／賈人某）是原稿印的黑字示範，不是橘色答案

    - type: guide
      text: 四、換你試試看
    - type: exercise
      instruction: |-
        1.下面的文字取自部分課文，請根據提問判讀主語：
        「雹止，入村，訪問其人，且問取名之義。」
      option_bank: {A: 賈人某, B: 張氏, C: 貧民, D: 村民}
      items:
        - {type: single, index: 1, stem: '雹止後，誰「入村」？', answer: A}
        - {type: single, index: 2, stem: '誰「訪問其人」？', answer: A}
        - {type: single, index: 3, stem: '誰「且問取名之義」？', answer: A}
    - type: sub_block
      label: 請將主語補上➡
      value: 「（　）入村，（　）訪問其人，（　）且問取名之義。」
      blanks:
        - {answer: 賈人某}
        - {answer: 賈人某}
        - {answer: 賈人某}
      label_note: 「➡」是**字面字元**（U+27A1，在 w:t 裡），照抄保留；本課沒有任何 w:sym 符號箭號
    - type: exercise
      instruction: |-
        2.下面文字依然節錄課文，請根據提問判讀主語：
        「每春間貧民就貸，償時多寡不較，悉納之，未嘗執概取盈。」
      option_bank: {A: 賈人某, B: 張氏, C: 貧民, D: 村民}
      items:
        - {type: single, index: 1, stem: '誰「償」?', answer: C}
        - {type: single, index: 2, stem: '誰「多寡不較」?', answer: B}
        - {type: single, index: 3, stem: '誰「悉納之」?', answer: B}
        - {type: single, index: 4, stem: '誰「未嘗執概取盈」?', answer: B}
    - type: sub_block
      label: 請將主語補上➡
      value: 「每春間貧民就貸，（　）償時，（　）多寡不較，（　）悉納之，（　）未嘗執概取盈。」
      blanks:
        - {answer: 貧民}
        - {answer: 張氏}
        - {answer: 張氏}
        - {answer: 張氏}
    - type: exercise
      instruction: |-
        3.「人有盜刈淳于恭禾者，恭見之，念其愧，因伏草中，至去乃起。」
        (注：盜刈，偷偷割取)根據上文回答下列問題：
      teacher_note: 翻譯：有人偷偷割取淳于恭的稻禾，淳于恭看到了，顧念那人看到自己會感到羞愧，因此就趴在草叢中，等到對方離去才起來。
      teacher_note_carrier: 紅色文字（run 層 w:color FF0000）的文字方塊，印在題目右側
      items:
        - {type: single, index: 1, stem: '誰「盜刈」?', options: {A: 人, B: 淳于恭}, answer: A}
        - {type: single, index: 2, stem: '承上，「盜刈」了什麼？', options: {A: 淳于恭, B: 淳于恭的禾}, answer: B}
        - {type: single, index: 3, stem: '誰「念其愧」?', options: {A: 人, B: 淳于恭}, answer: B}
        - {type: single, index: 4, stem: '誰「因伏草中」?', options: {A: 人, B: 淳于恭}, answer: B}
        - {type: single, index: 5, stem: '「至去乃起」一句有兩個動詞。請問：誰「去」、誰「起」，主語依序應是誰?', options: {A: 人、淳于恭, B: 淳于恭、人}, answer: A}

# ── 五 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（run 層 w:color ＋ 字元樣式），文字流有此資訊
  teacher_note_carrier: 藍色（156082／215E99）文字方塊，印在題目右側；只有第 1、3、5 題有
  questions:
    - index: 1
      answer: D
      stem: 下列選項「」中字，何者字音、字義完全正確？
      options:
        A: 忽大雨「雹」——ㄅㄠˋ，冰雹
        B: 償時多寡不較，「悉」納之——ㄒㄧ，吸收
        C: 「蓋」張素豐——ㄍㄞˋ，大概
        D: 獨張氏諸田無「恙」——ㄧㄤˋ，異樣
      explanation: 第1題解析：A字音ㄅㄠˊ；B字義「全部」；C字義「原來」。
    - index: 2
      answer: A
      stem: 課文中的商人把「不量」誤以為是「不良」，從而產生疑惑，這就是諧音雙關。請問下列何者造成誤解的原因與課文商人相同？
      options:
        A: |-
          店員：「請問您是付清嗎?」；
          客人：「不、不，我是叔叔。」
        B: |-
          客人：「我買了這麼多，可以送我點什麼吧?」
          店員：「好的，我送您出去。」
        C: |-
          老師：「壽司是Sushi，那『握壽司』跟『散壽司』的英文怎麼說?」
          學生：「握壽司是Wow!Sushi.， 散壽司是s、u、s、h、i。」
        D: |-
          老師：「寫功課時要多用點心，作業才寫得好。」
          學生：「點心可以吃麥當勞嗎?」
    - index: 3
      answer: D
      stem: 「物產豐富」中的「物產」是本句的主語。下列各選項「」中的語詞，何者不做主語使用？
      options:
        A: 「四海」昇平
        B: 「群魔」亂舞
        C: 「氣焰」囂張
        D: 「百年」樹人
      explanation: D選項省略了主語「學校或教育單位」。
    - index: 4
      answer: A
      stem: 根據本文，「張田獨無恙」的原因最可能是下列何？
      stem_note: 題幹句末印「下列何？」少一個「者」，原稿如此
      options:
        A: 張氏行善積德，得到護佑
        B: 貧民虔誠祈願，感動上天
        C: 張氏田產甚多無法丈量，看不出損失
        D: 賈人福澤深厚，連帶使張田倖免於難
    - index: 5
      answer: B
      stem: 下列哪一選項與本文的主旨最接近？
      options:
        A: 天助自助者，自助者人恆助之
        B: 好心自有好報
        C: 人在做，天在看
        D: 謀事在人，成事在天
      explanation: |-
        第5題解析:
        A強調「要努力上進、自力自強」；
        B好人自有好報，善良的人自有上天的幫助；
        C人做的壞事，上天都看著。比喻天理昭昭，報應不爽；
        D盡自己的能力去做，但能否成功就看上天的安排。
