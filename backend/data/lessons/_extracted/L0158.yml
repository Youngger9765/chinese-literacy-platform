      shaded_terms: [聞, 云, 其]
      vernacular: 他（　）空中有聲音（　）：「這是張不量的田，不要傷了（　）莊稼。」
      blanks: [{answer: 聽到}, {answer: 說}, {answer: 他的}]
    - index: 3
