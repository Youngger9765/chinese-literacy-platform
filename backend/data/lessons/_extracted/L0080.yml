# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 用表格整理訊息——比較兩者異同
  strategy_type: information_organization
  section_title_printed: 閱讀聚光燈
  answer_carrier: |-
    🔴 全部是**橘色手寫字**，本節沒有任何 ☑（w:sym F0FE 全課只有 1 個，在第五大題）。
    橘色答案在文字層裡，所以文字流抽得到；PDF p5~p6 也看得見。
  structure_note: |-
    ⛔ 比較表刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: |-
        當文章同時介紹兩個對象，而且訊息很多時，可以用「比較表」把相同主題的資料放在一起。這樣不但容易看出相同點和不同點，也能根據差異歸納文章重點。
        (1)畫表格
        (2)整理表格步驟：
        ❶找對象：找出文章要比較的兩個對象，寫在最上面一列。
        ❷找項目：找出兩邊都能比較的重點，寫在最左邊一欄。
        ❸填訊息：只根據文章，把資料填進對應的格子。
        ❹下結論：比較各格資料，用一句話說出重要差異及可能原因。
        (3)總結：根據這個表格進行分析，提出結論。

    - type: guide
      text: ◎小試身手：

