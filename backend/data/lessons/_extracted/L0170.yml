# ── ㄧ 讀全文-做記號 ──
body:
  title_line: 第4課  專注當下：關掉內心的批評噪音
  paragraph_count: 6
  paragraphs_note: 段號欄印 ㄧ二三四五六 共 6 個。第 5 段之後有一張插圖（圖片 127），不佔段號。
  paragraphs:
    - idx: 1
      text: 「狀態爛死了。對不起大家。真的很討厭現在的自己。我到底在幹嘛。」煩悶的心情無處抒發，我忍不住在社群媒體上發文。幾秒後就跳出隊友的留言：「哎呀不要想太多！一起加油啦！」我也不想要想這麼多啊，我輕輕嘆了口氣，便往床上一躺，想要拋開腦袋中的各種念頭，但比賽的畫面還是不斷浮現。
    - idx: 2
      text: 五局下半，三壘有跑者，球場上瀰漫著緊張的氣氛，對手虎視眈眈，緊盯著可以突破的機會。「鏗！」一聲清脆的擊球聲劃破空氣，高飛球！跑者腳踩著壘包，蓄勢待發，我也朝球飛去的方向全速奔去，這球應該能穩穩接殺——然而就在伸手的前一瞬，突然我被自己的腳絆倒，一個踉蹌，只能眼睜睜看著球落地。下一秒，腦內的毒舌球評開始廣播：「你真是爛透了！」、「都是你害的！」、「你根本沒有資格上場！」──這些惡毒的聲音和場邊震耳欲聾的歡呼，同時在我腦海裡炸開。
    - idx: 3
      text: 回到休息區後，沒有人責怪我，但低迷的士氣，讓我內心充滿自責。腦中反覆播放剛才的失誤──明明只差一步、明明手已經伸出去，怎麼會這樣？
    - idx: 4
      text: 「專心！專心！下一局拚回來！」教練宏亮的聲音稍稍提振了大家的精神，同是外野手的隊友走向我，拍拍我的背說：「調整一下，沒事啦！」他的語氣既輕鬆又帶著肯定，好像在提醒我：剛才的失誤只是其中一球，不是全部。我深吸了一口氣，勉強對他點點頭，在心裡下定決心，輪到我的打席時，一定要扳回一城。
    - idx: 5
      text: 隨著打席越來越接近，沒想到腦中的念頭又開始作祟——「我真的打得到嗎？」、「不要又丟人現眼了啊！」、「再打不好，大家會恨死我！」我走向打擊區時，隊友們吆喝著「給他們好看！」、「加油，你沒問題的！」，但這讓我更加緊張，腦海裡的廣播排山倒海而來。我站上打擊區，手心全是汗，我無法全神貫注，根本來不及反應。「OUT！」三球就被解決，「又來了……」我在心裡嘆了一口氣，不敢看隊友。隨著攻守互換的哨聲響起，我戴上手套跑向外野，心裡滿是失落。每次都這樣，只要關鍵時刻或遭遇挫折，那個毒舌球評總是拖我後腿。
    - idx: 6
      text: 「叮咚！」提示音將我的注意力拉回現實，我拿起手機，發現貼文有許多新的回覆，大部分是鼓勵打氣的話：「沒事啦，加油！」、「下一場一定更好！」我一條條滑過，心裡有點暖，但又有點想哭，那種沉重的自責並沒有完全散去。直到我看到教練的留言。沒有安慰，也沒有責備，只短短一句話：「懊悔不如行動。覺得打不好，就再多做幾組體能。」我盯著那行字看了幾秒，忍不住苦笑。至少，這件事我做得到。這就是教練的風格，不隨情緒起伏，只問一句：你現在要做什麼？我把手機丟到一旁，深吸一口氣，趴在地上，撐起棒式，開始默數，雖然肌肉越來越痠，呼吸越來越急，但那些毒舌評論好像被調小了音量。我忽然懂了教練的用意：只要專注在當下，把注意力拉回正在做的事上，心裡好像也就沒有那麼糾結了。
  inline_marked_terms: [瀰漫, 虎視眈眈, 蓄勢待發, 踉蹌, 震耳欲聾, 士氣, 宏亮, 打席, 扳回一城, 作祟, 吆喝, 排山倒海, 懊悔]
  inline_marked_terms_note: 課文用黑色字元框線（w:bdr color=auto）標出本課語詞；是題目標示不是答案

