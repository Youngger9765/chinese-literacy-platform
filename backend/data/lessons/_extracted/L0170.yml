# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 覺察與辨識負面念頭
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  section_title_note: |-
    🔴 這個課型印的是「**品格聚光燈**」，不是白話課的「閱讀聚光燈」、也不是文言文的「文言文聚光燈」。
    右上角目標框印的也是「**目標議題**」而非「目標策略」。這是體育生品格教育課型唯二的結構標記。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，色碼 EE0000，3 個在本節）
  blocks:
    - type: concept_box
      text: |-
        在這篇文章中，讓主角最困擾的不是失誤本身，而是腦中不斷冒出的自我批評：「我很爛」、「都是我害的」、「等一下又要丟臉了」，而最後主角發現，靠著專注在當下（如，做棒式），內心的噪音就會變小聲。
        回到我們的生活，當腦中出現各種負面念頭時，我們需要先看見它、認識它，而下一課，我們會再一起練習降低內心噪音的方法。
    - type: guide
      text: ◎ 認識負面念頭：青少年常見的負面思考模式有以下三種──
    - type: figure
      referent: 三種負面思考模式插圖
      text_carrier: image
      content: |-
        三格插圖，各配一個標題與對白：
        1. 非黑即白 (極端思考)：學生舉著「完美／失敗」的看板，想著「不是一百分，就是零分。」
        2. 腦補推論 (過度推斷)：學生想著「他們一定在說我壞話…大家都不喜歡我。」
        3. 都怪我 (個人化歸因)：學生扛著寫著「都是我的錯」的大石頭，旁邊有人打破花瓶
      content_note: |-
        ⚠️ 標 text_carrier: image 前已做自檢：這三段描述文字**在文字層 grep 全部 0 命中**
        （標題「非黑即白 (極端思考)」等字樣雖然在下方表格裡有，但插圖裡的對白
        「不是一百分，就是零分。」「他們一定在說我壞話」「都是我的錯」確實只畫在像素裡）。
    - type: table
      columns: ['', 思考模式, 特徵, 舉例]
      rows:
        - ['1', 非黑即白（極端思考）, 把事情只分成兩種：不是很好，就是很爛。, 只是一次失誤就覺得「我沒救了、我爛透了。」]
        - ['2', 腦補推論（過度推斷）, 沒有證據，就先幫事情下結論，或預測未來一定很糟。, 「他剛看我一眼，一定在笑我。」]
        - ['3', 都怪我（個人化歸因）, 忽略事情可能有其他原因，只怪罪自己。, 「朋友心情不好，就是因為我講錯話。」]
    - type: guide
      text: ◎ 小試身手：
    - type: guide
      text: 練習一：從文章中，主角對事情的反應、內心冒出的念頭，判斷他陷入了哪一個思考模式。
    - type: sub_block
      label: 練習一
      columns: [事件, 念頭, 思考類型]
      items:
        - type: single
          intro: 漏接高飛球
          prompt: 「你真是爛透了！」
          options: {1: 非黑即白, 2: 腦補推論, 3: 都怪我}
          answer: 1
        - type: single
          intro: 準備上場打擊
          prompt: 「再打不好，大家會恨死我！」
          options: {1: 非黑即白, 2: 腦補推論, 3: 都怪我}
          answer: 2
        - type: single
          intro: 輸了比賽
          prompt: 「都是我害的！」
          options: {1: 非黑即白, 2: 腦補推論, 3: 都怪我}
          answer: 3
      columns_note: |-
        原稿是三欄表；`intro` 放「事件」欄、`prompt` 放「念頭」欄，兩段各自照原稿逐字。
        ⛔ 不把兩欄用分隔符接成一句 —— 那是我造的字串，原稿沒有。
    - type: guide
      text: 練習二：這是一個心理測驗。以下有三個生活中常見的情境。請在每一題中，選出一個「最像你當下會冒出的想法」。沒有對錯，只是看看你在壓力來時，腦袋比較常用哪一種方式說話。
    - type: single
      prompt: 1.你花了很多時間準備，結果成績或表現卻不理想。你腦中出現的話最接近下列哪一句？
      options:
        Ａ: 「我就是那種怎麼努力都沒有用的人。」
        Ｂ: 「同學會笑我，老師一定對我很失望。」
        Ｃ: 「都是我，全班的平均分數就是被我拉低的。」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選；題目明寫「沒有對錯」
    - type: single
      prompt: 2.你和朋友們聊天時，你說了一句話後，大家瞬間安靜，但沒有人回應你，而是繼續其他話題。你腦中出現的話最接近下列哪一句？
      options:
        Ａ: 「我好不會說話，我看我還是別跟別人聊天。」
        Ｂ: 「他們是不是覺得我很奇怪或是不想理我。」
        Ｃ: 「看吧，只要有我在的地方就會很尷尬。」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: single
      prompt: 3.你在報告、比賽或重要時刻前很緊張。你腦中出現的話最接近下列哪一句？
      options:
        Ａ: 「如果我失誤，一切努力就都白費了。」
        Ｂ: 「如果我沒有表現好，就會失去大家的信任。」
        Ｃ: 「怎麼辦，我會不會毀了大家的心血。」
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: guide
      text: |-
        ◎統計看看，在你的答案中Ａ、Ｂ和C選項，哪一個出現最多次呢？
        說明：看看你的思考傾向
    - type: table
      columns: [選最多, 你在壓力時，容易出現]
      rows:
        - ['A 選最多', 非黑即白（極端思考）：把表現直接判成好或壞，對自己很快下結論]
        - ['B 選最多', 腦補推論（過度推斷）：事情還沒發生，腦袋已經先演完最糟劇情]
        - ['C 選最多', 都怪我（個人化歸因）：很多因素一起發生，但你會先把責任扛起來]
      rows_note: 原稿每一項印成兩行「X 選最多 → 你在壓力時，容易出現」＋「👉…」，這裡攤成兩欄
    - type: free_text
      prompt: |-
        ◎請根據你的觀察完成下面這句話：
        我發現，當我遇到壓力或挫折，我最常用的是＿＿＿＿＿＿這一型，
        我很常說：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
      no_correct_answer: true
      answer_carrier: 學生自填，原稿空白
    - type: free_text
      prompt: |-
        ◎再想一想：
        這種想法通常出現在＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿的時候。
        它常常讓我感覺＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿空白
    - type: single
      prompt: 勾選你的狀況
      options: {1: 我一直都知道我常這樣想, 2: 我以前從來沒注意}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: guide
      text: ◎這些思考習慣不會一下子就消失，但也不一定要立刻被「消滅」。就像檸檬水雖然很酸，只要加一點煉乳，味道就會順口許多；當那些刺耳的念頭冒出來，而被我們發現時，我們也能先用幾個小魔法，暫時降低它的威力。現在，就一起來試試看下面的小魔法吧！
    - type: table
      columns: [魔法句型, 概念, 句型應用]
      rows:
        - [我注意到我正在想…, 拉開距離，辨認念頭, 啊..我注意到我正在想「我真是爛透了」]
        - [但也可能…, 加上句子，看見不同的可能, 「大家一定很失望，但也可能是我自己多想了」]
        - [先停一下，不急著下結論, 擱置想法，不急著做判斷, 「都是我害的──先停一下，不急著下結論」]
    - type: free_text
      prompt: ※選一個魔法改寫你常說的句子：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
      no_correct_answer: true
      answer_carrier: 學生自填，原稿空白

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（run 層 w:color E97132），文字流有此資訊
  teacher_note_carrier: 深藍色（C:0F4761）文字方塊，印在題目右側
  questions:
    - index: 1
      answer: A
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 升上國三後，龐大的考試壓力「排山倒海」而來
        B: 已經二連霸的隊伍，今年再度「扳回一城」拿下冠軍
        C: 感謝祖靈的「作祟」，讓我們今年穀物豐收，家畜平安
        D: 一聲尖叫「瀰漫」寧靜的夜晚，附近聽到的人都很不安
      teacher_note: |-
        第1題解析：(B)「扳回一城」用於扭轉局勢(C)「作祟」用於帶來災禍
        (D)「瀰漫」用於氣氛，此處宜用「劃破」
    - index: 2
      answer: C
      stem: 根據第二段「下一秒，腦內的毒舌球評開始廣播：『你真是爛透了！』、『都是你害的！』」這句話主要是想表達什麼？
      options:
        A: 球場上出現的轉播聲音太吵雜
        B: 大腦扭曲了教練和隊友的建議
        C: 主角內心充滿自我批評的聲音
        D: 主角模仿球評播報比賽的語氣
      teacher_note: 第2題解析：從前後文可看出，此處的「毒舌球評」士主角內在的自我批評
      teacher_note_errata_note: |-
        ⚠️ 解析裡的「士主角內在」應為「是主角內在」（「士」是「是」的錯字）。
        這是**教師解析**不是課文，且 PDF 上該文字方塊被右邊界裁掉一部分；
        我照文字層原樣抄，未更正（若要列勘誤請人工確認）。
    - index: 3
      answer: A
      stem: 根據本文，下列敘述何者正確？
      options:
        A: 主角一次次的失誤，使他內心產生巨大自責
        B: 主角認為朋友的關心只是風涼話，沒有幫助
        C: 主角的內在批評都是事實，只是他不敢面對
        D: 主角在隊友的打氣之後隨即振作，全力以赴
      teacher_note: |-
        第3題解析：
        (B)還是有幫助
        (C)不一定是事實
        (D)沒有馬上振作
    - index: 4
      answer: D
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 挫折來自能力不足，應加強訓練避免失誤
        B: 面對批評時應學會反擊，證明自己的價值
        C: 球員需要壓抑情緒才能在比賽中有好表現
        D: 專注當下的行動，有助於調整情緒與狀態
    - index: 5
      answer: B
      stem: 根據品格聚光燈，下列哪一種想法最能降低內在批評的影響？
      options:
        A: 「我就是爛，做什麼都會失敗」
        B: 「他們是不是不喜歡我？但也可能我誤會了」
        C: 「不管我有沒有努力，結果都沒差」
        D: 「只要有我參與的比賽，就一定會輸」
      teacher_note: 第5題解析：(B)儘管有負面念頭，仍加入了不同可能的思考。

