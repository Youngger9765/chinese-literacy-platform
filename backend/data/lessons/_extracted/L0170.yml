    - 做獼待來蹌欲限打習頁
    - 么祟曷發截龍虎視眈眈
  answers_are_graphical: true
  answer_paths:
    - word: 排山倒海
      cells: [[1, 3], [1, 4], [1, 5], [1, 6]]
      direction: horizontal
    - word: 懊悔
      cells: [[1, 8], [2, 7]]
      direction: diagonal_down_left
    - word: 吆喝
      cells: [[2, 1], [3, 1]]
      direction: vertical
    - word: 震耳欲聾
      cells: [[2, 9], [3, 9], [4, 9], [5, 9]]
      direction: vertical
    - word: 扳回一城
      cells: [[4, 3], [5, 3], [6, 3], [7, 3]]
      direction: vertical
    - word: 宏亮
      cells: [[5, 4], [6, 5]]
      direction: diagonal_down_right
    - word: 打席
      cells: [[5, 6], [5, 7]]
      direction: horizontal
    - word: 作祟
      cells: [[6, 10], [7, 10]]
      direction: vertical
    - word: 瀰漫
      cells: [[7, 8], [8, 7]]
      direction: diagonal_down_left
    - word: 踉蹌
      cells: [[8, 5], [9, 5]]
      direction: vertical
    - word: 蓄勢待發
      cells: [[7, 1], [8, 2], [9, 3], [10, 4]]
      direction: diagonal_down_right
