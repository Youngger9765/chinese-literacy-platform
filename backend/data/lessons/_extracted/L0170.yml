vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [瀰漫, 虎視眈眈, 踉蹌, 震耳欲聾, 宏亮, 打席, 扳回一城, 作祟, 吆喝, 排山倒海, 蓄勢待發, 懊悔]
  grid_size: [10, 10]
  grid:
    - 施作排山倒海板懊島海
    - 吆崇虎視耽耽悔回震土
