      cells: [[10, 7], [10, 8], [10, 9], [10, 10]]
      direction: horizontal
  geometry_check: |-
    圈選全部包在一個「群組 92」（4.90×3.90in）裡，內含 **9 個 roundRect ＋ 3 個 rect ＝ 12 個圖形**，
    與 12 個目標語詞相符、無警報。
    🔴 **只數 roundRect 會得到 9，看起來像「少 3 條」** —— 這一課的圈有三個畫成 `rect` 而不是 roundRect。
    依 SKILL「少於什麼都不代表」本來就不該當缺陷，但更準的做法是**數該群組內的所有圖形**。
    沒有紙外殘留（群組的 positionH=column+0.50in，在紙內）。格子沒有跨頁（10 列都在 p13）。
    12 條路徑都用「把 cells 套回 grid 拼字」驗過，全部拼得回目標語詞。
    ⚠️ 第 2 列的「虎視耽耽」（耽）是**同音誘答**，橘圈圈的是第 10 列正確的「虎視眈眈」（眈）。

