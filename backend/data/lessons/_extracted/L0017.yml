# ── 五 文章重點表 ──
keypoints:
  title: 感情小日記1──是友情還是愛情？
  intro: 日記常用來記錄生活事件與心情感受，並藉此抒發情緒，因此讀日記時，我們也透過整理作者經歷的事件及感受來理解日記內容。
  layout: matrix
  columns: [段落, 事件, 感受]
  answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  rows:
    - 段落: 二
      事件: 他主動詢問要幫我交【　】
      事件_blanks: [{answer: 聯絡簿}]
      感受: (勾選，可複選)
      感受_options: {1: 茫然, 2: 害羞, 3: 緊張}
      感受_answers: [1, 2, 3]
    - 段落: 三
      事件: 【　】課被分在同一組
      事件_blanks: [{answer: 體育}]
      感受: 【　】漏了一拍
      感受_blanks: [{answer: 心跳}]
    - 段落: 四
      事件: 習慣看向他、【　】突然對上、偷偷觀察他
      事件_blanks: [{answer: 眼神}]
      感受: 在乎、緊張、期待
    - 段落: 五
      事件: 幫我撿掉在地上的筆、小組討論時叫我的【　】
      事件_blanks: [{answer: 名字}]
      感受: (勾選，可複選)
      感受_options: {1: 溫暖, 2: 害羞, 3: 興奮}
      感受_answers: [1, 2, 3]
    - 段落: 統整
      事件: 結合第一段與最後一段，作者寫下這篇小日記，是想抒發（　）的心情。
      事件_options: {1: 不知所措, 2: 深情思念}
      事件_answer: 1
      note: 此列的「事件」與「感受」兩欄在教材上合併成一格，內容橫跨整列

# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 自我覺察──是友情還是愛情？
  strategy_type: character
  section_title_printed: 品格聚光燈
  blocks:
    - type: concept_box
      text: |-
        在人際關係中，我們有時會對某些朋友特別在意──會想多知道他在做什麼、會因為一句訊息而開心或失落。
        這樣的感覺，可能只是友情的親密，也可能讓人誤會成其他情感。友情與愛情之間的界線，有時並不明顯，也容易讓人感到困惑。這種曖昧的關係時常出現在我們的生活中，因此我們需要學會觀察、釐清、尊重彼此的感受，讓關係保有自在與安全。
        日常生活中的互動，到底是友情？還是愛情？你可以幫忙判斷一下，作者記錄的互動，究竟靠近友情多一點？還是靠近愛情多一點呢？
      emphasis_note: 「友情與愛情之間的界線，有時並不明顯，也容易讓人感到困惑。」印有底線

    - type: exercise
      label: 小試身手（第一張表·課文中的互動）
      instruction: ◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)
      columns: [互動與反應, 較偏向的感情類型(勾選)]
      option_bank: {1: 友情, 2: 愛情, 3: 難以區分}
      note: 教材明印「沒有標準答案」，教師版亦未印任何 ☑，故各題一律無 answer
      items:
        - {type: single, index: 1, prompt: 被詢問要不要幫忙時，突然結巴、害羞}
        - {type: single, index: 2, prompt: 上體育課被分到同一組時，感到害羞、緊張}
        - {type: single, index: 3, prompt: 時常關注他的一言一行、一舉一動}
        - {type: single, index: 4, prompt: 喜歡回想和他相處的片段}
        - {type: single, index: 5, prompt: 被他幫忙、被他叫到名字時感到心裡發熱}
        - {type: single, index: 6, prompt: 因為他而特別期待上學}

    - type: exercise
      label: 第二張表·更多生活情境
      instruction: ◎接著，請再試著思考，以下的互動，對你來說，更偏向友情還是愛情呢？一樣沒有正確答案哦！
      columns: [互動方式, 較偏向的感情類型(勾選)]
      option_bank: {1: 友情, 2: 愛情, 3: 難以區分}
      note: 同上，教材明印「沒有正確答案」，教師版未印 ☑，故無 answer
      items:
        - {type: single, index: 1, prompt: 我喜歡和他一起聊天或玩手遊，也會約好幾個朋友一起上線。}
        - {type: single, index: 2, prompt: 是我唯一每天傳「晚安」的對象，有時還會期待收到他的貼圖或表情符號。}
        - {type: single, index: 3, prompt: 他一整天沒回我訊息，我就會開始覺得是不是我做錯了什麼。}
        - {type: single, index: 4, prompt: 我們會互相傾吐心事，也會為彼此保守秘密。}
        - {type: single, index: 5, prompt: 他如果和某位同學有親密的互動，我會很在意。}
        - {type: single, index: 6, prompt: 當我難過的時候，他總是第一個關心我、陪我說話、讓我開心。}
        - {type: single, index: 7, prompt: 我們會聊到未來畢業後還可以怎麼保持聯絡。}
        - {type: single, index: 8, prompt: 他常提醒我帶東西、寫作業，也很樂意和我討論作業怎麼做。}
        - {type: single, index: 9, prompt: 聽到我受委屈、被誤會，他會為我打抱不平。}
        - {type: single, index: 10, prompt: 我們有很多共同興趣和話題，也很願意分享。}

    - type: multi
      # 學習單上這題沒有 ☑ —— 它是自我覺察題，答案由學生自己決定。
      # 標了這個欄位，contract 就不會把它算進 answer_recall 的分母
      # （否則等於逼抽取者替一道沒有標準答案的題目編一個答案）。
      # codex 獨立看圖覆核過：該題各選項前皆無勾選記號。
      no_correct_answer: true
      label: 歸納
      prompt: ◎根據上面的回答，以及你自己的觀察，關於友情與愛情差異，哪些是你認同的？請打勾，也可以寫上自己的想法。
      options:
        1: 如果有頻繁的聊天、相處，就偏向愛情。
        2: 如果願意和對方分享心事，也信任對方，就偏向愛情。
        3: 如果會時時刻刻留意對方的行為或在乎他的反應，就偏向愛情。
        4: 如果會希望能成為對方最重要的人或是唯一，就偏向愛情。
        5: 如果相處時會有比較大或頻繁的情緒起伏，就偏向愛情。
      note: 五個選項全部印空白 □，教師版未勾選任何一項（承接上文「沒有正確答案」）

    - type: free_text
      label: 自由填寫
      prompt: (自由填寫) 如果_________________________________________，就偏向愛情。   # 原稿是 41 個半形底線

    - type: concept_box
      label: 結語
      text: |-
        謝謝你的嘗試與覺察，相信透過回答，你也更了解了自己的感受！
        友情與愛情的界線，有時真的不容易分清楚。但比起急著為關係命名，更重要的是，你有沒有注意到自己的「在意」和「情緒」，你對關係的理解、期待，及如何看待人與人之間的互動。願你記得，關係不必馬上定義，但你的感受值得被看見、被理解。這就是認識自己的開始。❤︎
      emphasis_note: 「但你的感受值得被看見、被理解」印有底線

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 由於經過充分的準備，輪到他上台報告時，他一臉「茫然」
        B: 他「不經意」準備了生日驚喜，希望能夠讓好朋友開心
        C: 當她穿著一襲禮服登場時，所有人的「目光」都落在她身上
        D: 小老師「結結巴巴」的交代著作業，令老師相當讚賞
      option_corrections: {A: 宜改為「自信」, B: 宜改為「精心」, D: 宜改為「條理清楚」}
    - index: 2
      answer: B
      stem: 根據第四段，「他的眼神會突然和我對上，我只好急忙低下頭看小說」這句話最可能表現出敘述者當時的什麼情緒？
      options:
        A: 害怕與自卑，擔心對方嘲笑他看的小說
        B: 害羞與緊張，因為被對方注意到而慌亂
        C: 討厭與厭煩，不想和對方產生任何互動
        D: 擔心與尷尬，不想突然被拉去加入話題
      teacher_note: 從前文想關注同學一舉一動的心情，可以推論是(B)
    - index: 3
      answer: B
      stem: 根據全文，下列選項何者最貼近作者的心理變化？
      options:
        A: 一開始就確定自己愛上了他，並準備向對方表白
        B: 感到不確定，但發現這份情感與友情不同而疑惑
        C: 雖然覺得他不錯，但後來發現其實和朋友差不多
        D: 不想給予對方任何回應，最後決定完全忘記對方
      teacher_note: 從結尾可以知道作者不知所措與疑惑。
    - index: 4
      answer: D
      stem: 根據閱讀聚光燈的練習，下列何者對待感情的態度較為合適？
      options:
        A: 小新：交朋友不需要想太多，反正船到橋頭自然直
        B: 大雄：為了避免被他人誤會，保持適當距離比較安全
        C: 柯南：友情和愛情必須有很清楚的界線，一看就知道
        D: 小智：比起為關係命名，更重要的是了解自己的感受
      teacher_note: 從聚光燈結尾可知感情界線可能是難以定義的，但重點是了解自己。
    - index: 5
      answer: A
      stem: 關於本文的行為與心理感受描述，下列詮釋何者正確？
      options:
        A: 「像是在腦袋裡播一部只屬於自己的小電影（第五段）」──表達心中對美好回憶的陶醉
        B: 「像心臟被什麼輕輕撞了一下（第三段）」──表示受到攻擊而委屈
        C: 「像被陽光輕輕照到一樣（第五段）」──突顯作者因害羞而臉紅
        D: 「我覺得我的腦袋要炸掉了（第六段）」──是指作者出現頭痛症狀
      option_corrections: {B: (B)是驚喜與害羞, C: (C)是突顯心中的暖意, D: (D)是指心煩意亂}

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [腦海, 茫然, 結結巴巴, 心跳漏了一拍, 片段, 不經意, 不自覺, 目光, 瞬間]
  grid_size: [10, 10]
  grid:
    - 目不轉睛我惱言外之意
    - 心跳漏了一拍覺啪結露
    - 海洋翻目然而得結沮喪
    - 皺巴巴前棋徑巴分腦海
    - 黑不經意越巴學家依炒
    - 爿段可消息走漏常依片
    - 期待目留意腦無便不段
    - 無所謂光想霧不飯瞬結
    - 茫然發熱不光自可間碌
    - 陸陸續續到年覺經過去
  grid_note: |-
    第 6 列第 1 字是「爿」不是「片」（DOCX 文字層如此），第 2 列第 8 字是「啪」、
    第 9 列第 10 字是「碌」—— 三處在 PDF 上都容易看成別的字，以文字層為準。
    「爿段」是與答案「片段」形近的誘答，不是教材印錯。
  answers_are_graphical: true
  answer_paths:
    - word: 心跳漏了一拍
      cells: [[2, 1], [2, 2], [2, 3], [2, 4], [2, 5], [2, 6]]
      direction: horizontal
    - word: 結結巴巴
      cells: [[2, 9], [3, 8], [4, 7], [5, 6]]
      direction: diagonal_down_left
    - word: 腦海
      cells: [[4, 9], [4, 10]]
      direction: horizontal
    - word: 不經意
      cells: [[5, 2], [5, 3], [5, 4]]
      direction: horizontal
    - word: 片段
      cells: [[6, 10], [7, 10]]
      direction: vertical
    - word: 目光
      cells: [[7, 3], [8, 4]]
      direction: diagonal_down_right
    - word: 不自覺
      cells: [[8, 7], [9, 7], [10, 7]]
      direction: vertical
    - word: 瞬間
      cells: [[8, 9], [9, 9]]
      direction: vertical
    - word: 茫然
      cells: [[9, 1], [9, 2]]
      direction: horizontal

