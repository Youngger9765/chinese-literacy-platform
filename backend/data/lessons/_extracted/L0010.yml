# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 生涯探索──讀書，讓夢想多一條路
  strategy_type: career
  blocks:
    - type: concept_box
      text: |-
        「我現在學的這些，真的有用嗎？」讀書不只是為了考高分，也是在累積未來需要的知識和能力。想讓夢想多一條路，可以這樣想：
        ①想方向：如果原來的計畫改變，還有哪些方向？
        ②找能力：這些方向需要哪些能力？
        ③做準備：我現在可以怎麼學？
    - type: guide
      text: ◎小試身手：

    # ── 情境一 ──
    - type: sub_block
      label: 情境一：運動員的退路
      items:
        - type: passage
          paragraphs:
            - 智凱是學校羽球隊的王牌，他的夢想是打進國家代表隊。教練提醒他：「如果哪天受傷不能打球，你還有別的計畫嗎？」智凱開始想，如果不能當選手，也許他可以當體能教練或裁判、體育主播。這麼一想，他突然覺得自己該好好讀書了。
        - type: single
          index: 1
          prompt: 【想方向】你覺得智凱為什麼開始想「讀書」？（單選）
          options: {1: 想讓自己有退路, 2: 想比同學更厲害, 3: 想改變夢想}
          answer: 1
        - type: multi
          index: 2
          prompt: 【找能力】以下哪些能力對智凱的未來有幫助？（複選）
          options:
            1: 英文：出國比賽、與外隊交流
            2: 溝通表達：接受訪問、與隊友合作
            3: 醫學與運動防護：預防受傷
            4: 分析能力：能分析不同戰術
          answer: [1, 2, 3, 4]
        - type: matching
          index: 3
          instruction: 承第2題，智凱如何學會上述的能力呢？請連連看。
          left_header: 智凱可以學習的能力
          right_header: 要怎麼做才能培養這些能力？
          left:
            1: 英文
            2: 醫學與運動防護
            3: 溝通表達
            4: 分析能力
          right:
            A: 每天練習英文，主動開口與外國人交流。
            B: 閱讀醫學運動防護文章，學習照顧身體的方法。
            C: 觀看比賽，練習分析球員表現和戰術。
            D: 把握小組合作機會，練習聆聽與表達。
          answer: null
          answer_carrier: 紅色連線（圖形），文字流無此資訊。⚠️ 原稿的線判讀不出配對：
            只有 (1)(2) 兩列有筆跡，(3)(4) 兩列完全沒畫；且線段止於連線欄中間、
            未落在右欄任何錨點上（(1) 一條黑一條紅皆水平向右，(2) 為紅色交叉 X）。
            不臆測配對 —— 見 diff 註記。
        - type: multi
          index: 4
          label: 從智凱的例子可以學到：
          prompt: 讀書不是放棄打球，而是讓他擁有【】一條能走的路。
          options: {1: 多, 2: 少}
          answer: 1
      trailing_table:
        type: table
        title: 智凱未來可以從事的職業（複選）
        multi: true
        options: {ㄅ: 體育教練, ㄆ: 國際比賽翻譯, ㄇ: 體能訓練員或防護員, ㄈ: 體育記者、運動主播}
        answer: [ㄅ, ㄆ, ㄇ, ㄈ]
        answer_carrier: 紅色 ☑（圖形）；四項全勾

    # ── 情境二 ──
    - type: sub_block
      label: 情境二：讓作品更有內容
      items:
        - type: passage
          paragraphs:
            - 宥蓁喜歡拍短影片，常常上傳搞笑的片段。但她發現，只靠搞笑，大家看幾次就不想看了。後來，她開始學著寫腳本、學著拍攝並剪輯更精緻的畫面、學著構思主題，她的影片變得更有故事性，也有越來越多人喜歡看。
        - type: multi
          index: 1
          prompt: 【想方向】宥蓁開始「學更多」後，有什麼好處？（複選）
          options: {1: 讓作品更有內容, 2: 讓興趣變成能力, 3: 全心投入拍片，不管課業}
