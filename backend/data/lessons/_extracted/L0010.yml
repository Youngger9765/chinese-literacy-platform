    - {index: 2, word: 疲憊, definition: 身體或精神非常累。}
    - {index: 3, word: 孤注一擲, definition: 把全部力量或希望放在一次行動上，冒險做最後一搏。}
    - {index: 4, word: 累癱, definition: 累到像癱瘓了一樣，幾乎動不了。}
    - {index: 5, word: 雀屏中選, definition: 在一群優秀人才中，被選中了。}
    - {index: 6, word: 豐厚, definition: 形容東西很豐富、很充足。常用來形容報酬或獎品。}
    - {index: 7, word: 揮之不去, definition: 一直留在心中或腦中，想忘也忘不了。}
    - {index: 8, word: 報酬, definition: 指完成事情之後得到的回報。}
    - {index: 9, word: 勸誡, definition: 好好的提醒或告訴別人不要做錯事。}
    - {index: 10, word: 擦身而過, definition: 比喻差一點就得到，最後卻錯過人、事或機會。}

