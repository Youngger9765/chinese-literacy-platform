# ── 一 讀全文-做記號 ──
body:
  # ⚠️ marking_instruction 放在 body 底下不是排版偏好：split_lesson_modules.py 只搬
  #    對照表上的頂層 key，放在頂層會被靜默丟掉（v3 完全沒有它，且沒有任何一道門會叫）。
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號
      - 重要的地方、喜歡的語詞、句子或段落做上記號。

  # ⚠️ 本課課文是「兩封信」，段號欄在**每封信各自從一重數**（第一封 一~四、第二封 一~八）。
  #    所以 idx = 學習單印出來的號碼（會重複），seq = 全文連續序號（給 spans 用）。
  #    念順順印的是「二☞」，而 ☞ 圖形實際落在第二封信的第 2 段（說實話…），
  #    對應 seq 6 —— 只看 idx 會唸到第一封信的第 2 段，差了四段。
  paragraph_count: 12
  letters:
    - index: 1
      sender: 阿耀
      recipient: 健豪學長
      subject: 主旨：請教─棒球隊學生需要讀書嗎？
      salutation: 健豪學長，您好：
      signature: 阿耀 敬上
      numbered_paragraphs: [1, 2, 3, 4]
    - index: 2
      sender: 健豪學長
      recipient: 阿耀
      subject: 主旨：RE:請教─棒球隊學生需要讀書嗎？
      salutation: 阿耀，你好：
      signature: 健豪學長
      numbered_paragraphs: [1, 2, 3, 4, 5, 6, 7, 8]
  paragraphs:
    - seq: 1
      idx: 1
      letter: 1
      text: 我叫阿耀，是您母校棒球隊的學弟，現在八年級，擔任投手兼外野手。最近我有個煩惱一直在腦中揮之不去，想請教您。
    - seq: 2
      idx: 2
      letter: 1
      text: 升上八年級後，我被排進先發名單，除了大隊訓練和晨操，我晚上還會自己加練。雖然很累很操，但我真的喜歡棒球，而且不少學長都告訴我們：「球打得好，以後就有高中、大學可讀；更強的話，高中就能直接進職棒！」我總是夢想有朝一日能像您一樣進職棒。
    - seq: 3
      idx: 3
      letter: 1
      text: 但老師又會勸誡我們：「打球雖然重要，但書還是要讀。」我知道這是為我們好，可是訓練後真的累癱了，一聽到這些話就覺得煩，甚至有點想逃避。我總是在想：一定要讀書嗎？未來真的不能只靠打球嗎？
    - seq: 4
      idx: 4
      letter: 1
      text: 您是我最崇拜的學長，也是真正走過這條路的人，想聽聽您的看法。謝謝您！
    - seq: 5
      idx: 1
      letter: 2
      text: 謝謝你的來信，很開心看到你對棒球這麼熱愛。我當年和你一樣，天天拚命練球，心裡只想著怎麼打得更好。
    - seq: 6
      idx: 2
      letter: 2
      text: 說實話，我以前也覺得只要球打得好，就能進職棒、獲得豐厚報酬。但等我真的進了職棒，我才發現：成功，不只要努力，還要「運氣站在你這邊」。
    - seq: 7
      idx: 3
      letter: 2
      text: 怎麼說呢？就算你再怎麼拚，還是可能遇到以下這些情況：
    - seq: 8
      idx: 4
      letter: 2
      text: 同年選秀剛好出現一堆「怪物級」選手，你就算很強，也未必雀屏中選。
    - seq: 9
      idx: 5
      letter: 2
      text: 長時間比賽、過度疲憊，身體很容易受傷，萬一需要休息，就可能和機會擦身而過。
    - seq: 10
      idx: 6
      letter: 2
      text: 守備的位置有太多人爭取，即使你實力不錯，也可能沒機會上場。
    - seq: 11
      idx: 7
      letter: 2
      text: 這些都不是你能控制的。所以我想跟你說：「打球很重要，但如果你孤注一擲，只有這一條路可走，真的太冒險了。」
    - seq: 12
      idx: 8
      letter: 2
      text: 讀書，不是要你考高分，而是讓你多一條路。當棒球這條路卡住的時候，你還有別的方向可以走。就像比賽不能只練一招，人生也不能只靠一種能力。你準備得越多，選擇就越多喔！祝福你。
  inline_marked_terms: [揮之不去, 有朝一日, 勸誡, 累癱, 豐厚報酬, 雀屏中選, 疲憊, 擦身而過, 孤注一擲]

