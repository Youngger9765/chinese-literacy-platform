word_matching:
  instruction: 請依照文意，勾選出原文「 」中的白話文意思。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層），8 題各 1 個
  shape_note: 每題一列：文言原句（要解釋的字用「」框住）＋ 兩個白話選項二選一
  items:
    - {index: 1, classical: 「俄而」腥風驟起, boxed_term: 俄而, options: {1: 經常, 2: 突然}, answer: 2}
    - {index: 2, classical: 有道士謂之「曰」, boxed_term: 曰, options: {1: 說, 2: 太陽很大}, answer: 1}
    - {index: 3, classical: 於是。醫數十日漸平，「乃」偕歸, boxed_term: 乃, options: {1: 於是, 2: 可是}, answer: 1}
    - {index: 4, classical: 含光「竭力」以口遍吮之, boxed_term: 竭力, options: {1: 用力, 2: 盡力}, answer: 2}
    - {index: 5, classical: 虎怒，力不得「肆」, boxed_term: 肆, options: {1: 施展, 2: 放肆}, answer: 1}
    - {index: 6, classical: 含光負其弟「疾」奔下嶺, boxed_term: 疾, options: {1: 快速, 2: 疾病}, answer: 1}
    - {index: 7, classical: 其弟尚「一息未殊」, boxed_term: 一息未殊, options: {1: 還有一口氣沒, 2: 一口氣還沒有斷絕}, answer: 2}
    - {index: 8, classical: 「既」息肩, boxed_term: 既, options: {1: 已經, 2: 既然}, answer: 1}
  items_note: |-
    第 (3) 題的文言句在原稿印成「於是。醫數十日漸平，「乃」偕歸」——句首多了「於是。」
    而課文原句是「醫數十日漸平，乃偕歸」。這是題目自己的寫法（把答案先寫在前面當提示），
    照原樣抄、不修。

# ── 三 文言文聚光燈 ──
spotlight:
  strategy_name: 如何讀懂文言文
  strategy_type: classical_reading_strategy
  section_title_printed: 文言文聚光燈
  answer_carrier: |-
    紅色 ☑（w:sym Wingdings F0FE）＋ 橘色手寫（**字元樣式 af**，色 E97132，run 層掃不到）
    ＋ 紅色手繪連線（4 條，PDF 上看不見，只在 XML）
  blocks:
    - type: concept_box
      text: 看完了這篇文章，你是否對文言文有更深一層了解呢？其實，古人平時講話也是講「白話文」，就是淺白的話語；至於書寫，因為寫字印刷成本太高，則使用「文言文」，所以「文言文」是寫文章使用的語言。現在，就讓我們一起練習文言文怎麼讀吧！

    - type: guide
      text: |-
        1.用故事情節來推測：
        我們來讀＜狐假虎威＞這篇文言文。這是一個故事，故事通常會有「角色」和「角色間發生的事」，只要讀懂了他們的關係，即使有些文句不懂，也經常可以推測出七、八成了。
    - type: table
      columns: [文言文, 今天的白話文]
      rows:
        - - |-
            虎求百獸而食之，得狐。
            狐曰：「子無敢食我也，天帝使我長百獸，今子食我，是逆天帝之命也。子以我為不信，吾為子先行，子隨我後，觀百獸之見我而敢不走乎？」
            虎以為然，故遂與之行。獸見之皆走。虎不知獸畏己而走也，以為畏狐也。
          - |-
            老虎獵捕百獸當食物，有一次抓到一隻狐狸。
            狐狸說：「你不敢吃我啦，天帝命令我掌管百獸，現在你吃我，就是違背天帝的命令。你如果認為我的話不可信，我可以走在你前面，你跟在我後面，你看看其他的野獸看到我，有誰敢不逃跑？」
            ＯＯＯＯＯＯＯＯＯＯＯＯＯＯＯ ＯＯＯＯＯＯＯＯＯＯＯＯＯＯＯＯＯＯＯ。（老虎認為狐狸的話很有道理，所以就跟著他走，結果野獸們看到老虎走在狐狸後面，全都嚇得逃走了。）老虎不知道野獸們是因為害怕自己而逃跑，還以為他們是怕狐狸呢！
      rows_note: |-
        ⚠️ 白話欄第三段在原稿是**先印 34 個全形Ｏ**（留給學生填的格子），
        橘色的教師參考答案印在圓圈後面的**全形括號裡**，接著才是黑字的「老虎不知道野獸們…」。
        三者照原順序連在一起抄（Ｏ／括號都是原稿印的）——
        ⛔ 一開始我把Ｏ與括號都拿掉、直接把橘字接到黑字上，逐字門判 FAIL 而且判得對：
        原稿沒有那個接法。
        文言欄裡的「子、之」在 PDF 上被螢光筆標黃 —— 那是題目要求學生做的標記（見下一題），
        不是答案。

    - type: guide
      text: |-
        2.讀懂文言文的代名詞
        (1)上述故事中的角色有老虎、狐狸、百獸。
        (2)文言文為了節省用字，會出現很多代名詞，這篇文章裡出現多次的代名詞有「子、之」，「子」就是「您」的意思；「之」就是「他、牠或牠們」的意思。
        (3)現在請你把本文中的「子、之」先用螢光筆畫起來。並連連看，配對出正確的意思。（其中有複選）可以對照旁邊的白話文喔。
    - type: matching
      instruction: 連連看，配對出正確的意思。（其中有複選）
      left:
        1: 虎以為然，故遂與「之」行。
        2: 吾為「子」先行
        3: 虎求百獸而食「之」
        4: 獸見「之」皆走
      right:
        A: 代名詞，在此指百獸
        B: 代名詞，在此指老虎
        C: 代名詞，在此指狐狸
      answer: {1: C, 2: B, 3: A, 4: B}
      answer_carrier: 紅色手繪連線（4 條 `srgbClr FF0000` 的 line 圖形），文字流無此資訊
      answer_note: |-
        🔴 **PDF 上一條線都看不到**（p5~p6 只印得出兩排圓點），只讀圖會判成「教師版沒連線」。
        答案是解 XML 幾何還原的，三重佐證同時成立：
        ① **幾何**：4 條線裝在同一個 anchor 群組（`群組 22`，extent 1.03×1.32in，
           chOff=(-0.060,0.088) chExt=(1.404,1.222)）。各線在子座標的起訖點：
             線1 (0.012,0.088)→(1.344,1.310)　線2 (-0.060,0.464)→(1.333,0.936)
             線3 (0.012,1.302)→(1.333,0.936)　線4 (-0.060,0.936)→(1.344,0.352)
           左端 y 由小到大 = 0.088／0.464／0.936／1.302 → 對應左欄第 1／2／4／3 項；
           右端 y = 1.310／0.936／0.936／0.352，而右欄三個圓點由上而下是 A／B／C
           → A=0.352、B=0.936（兩條共用）、C=1.310。
        ② **語意**：1「與之行」的之＝狐狸(C)；2 是狐狸對老虎說「吾為子先行」，子＝老虎(B)；
           3「虎求百獸而食之」的之＝百獸(A)；4「獸見之皆走」的之＝老虎(B)。四條都成立。
        ③ **題目自己的提示**：印著「（其中有複選）」，而 B 剛好被用到兩次 —— 與幾何一致。
        ⚠️ 只數 `<wp:anchor>` 會得到 1（四條線同屬一個群組），要遞迴到 `wps:wsp` 才數得到 4。
      marker_note: |-
        左欄每項前面的實心三角與兩欄的圓點都是 `w16se:symEx`（Segoe UI Emoji 25E4／25CF），
        不在 w:t 裡，故不寫入字面字元。
    - type: guide
      text: 你發現了嗎？文言文有很多代名詞，可以先找到有什麼人物，這些代名詞指的是誰，就比較容易讀懂文章在說什麼。
      text_note: |-
        這一句前面印了一個指標符號（`w:sym Wingdings 2 F045`），**不在 w:t 裡**，故不寫入。
        對照：本大題 5. 的結論句開頭那個「→」是**字面字元**（在 w:t 裡），照抄保留。
        同一份文件兩種都有 —— 只認某一個 char 會判錯。

    - type: guide
      text: |-
        3.遇到不認識的詞怎麼辦？
        懂了文言文的代名詞，就可以讀懂句意，但如果還有不認識的詞，怎麼辦呢？你可以試著根據上下文及推測字義。例如下句，「逆」天帝之命，我們可以猜是「違逆」。再帶回原句裡讀是否通順。現在換你試試看。
    - type: sub_block
      label: 例句：「虎以為然，故遂與之行。獸見之皆走。」
      value: 行：【　】，見：【　】，皆：【　】，走：【　】。
      blanks:
        - {answer: 同行/行動}
        - {answer: 看見}
        - {answer: 都}
        - {answer: 逃走/走開}
      answer_carrier: 橘色手寫（字元樣式 af），文字流有此資訊
    - type: exercise
      instruction: ◎小試身手：選擇題
      answer_carrier: 橘色手寫代號（字元樣式 af），文字流有此資訊
      items:
        - {type: single, index: 1, stem: 天帝「使」我長百獸, options: {A: 擅長, B: 命令, C: 增加, D: 使用}, answer: B}
        - {type: single, index: 2, stem: 虎不知獸「畏」己而走也, options: {A: 尊敬, B: 擔心, C: 危險, D: 害怕}, answer: D}
        - {type: single, index: 3, stem: 子「隨」我後, options: {A: 跟隨, B: 追隨, C: 隨便, D: 隨意}, answer: A}

    - type: single
      prompt: |-
        4.全句翻譯：
        懂了文言文的代名詞，也能推測出不認識的字的意思，你應該就可以理解句義了。請勾選出「虎以為然，故遂與之行。獸見之皆走。」的正確翻譯。
      options:
        1: 老虎認為狐狸的話很有道理，所以就跟著他走，野獸看到老虎走在狐狸後面，全都嚇得逃走了。
        2: 老虎認為狐狸在騙人，所以就想看看狐狸要做什麼行為，野獸看到老虎後，全都嚇得逃走了。
      answer: 1
    - type: sub_block
      label: 5.讀出作者意圖：試試看，從文中角色的關係，推論作者意圖：（單選）
      items:
        - sub_label: 野獸們怕的是誰？
          value: 野獸們怕的是誰？（　），因為會害怕被牠吃掉。
          options: {1: 老虎, 2: 狐狸}
          answer: 1
        - sub_label: 狐狸藉著老虎讓自己看來很厲害，讓野獸們紛紛走避。
          value: →所以作者藉這個故事諷刺那些沒有真本事的小人，藉著大人物的權勢，提高自己的地位。
          answer_carrier: 橘色手寫（字元樣式 af），文字流有此資訊
          value_note: 句首的「→」是**字面字元**（在 w:t 裡），照抄保留

    - type: exercise
      instruction: ◎ 小試身手：綜合測驗
      passage: 下課返家，事雜頗繁。舍弟閒置於椅，無所事事；喚，無動於衷；家嚴(父親)後至咱旁，無視其閒散，喚我做事。心偏之劣，厚此薄彼，吾欲哭無淚，憤恨難平。
      passage_note: 印在一個圓角外框裡；PDF 上「舍弟／家嚴(父親)／咱／我／此／彼／吾」被螢光筆標黃，那是第 (3) 小題要學生做的標記
      answer_carrier: 紅色 ☑（4 個）＋ 橘色手寫（字元樣式 af）
      items:
        - type: multi
          index: 1
          stem: 這個故事有哪些角色？（複選）
          options: {1: 哥哥, 2: 弟弟, 3: 父親, 4: 母親}
          answers: [1, 2, 3]
        - type: single
          index: 2
          stem: 這個故事的作者是誰？
          options: {1: 哥哥, 2: 弟弟, 3: 父親}
          answer: 1
        - type: free_text
          index: 3
          stem: 請你把人物用螢光筆畫出來。
          no_correct_answer: true
          answer_carrier: 學生自畫；PDF 上已標黃的部分是教師版示範
        - type: sub_block
          index: 4
          label: 寫出字詞的意思（可用推論的方式喔！)
          value: |-
            返：【　】；繁：【　】；閒置於椅：【　】；
            喚：【　】；心偏之劣：實在很偏心；厚此薄彼：對他好、對我差；
            無視其閒散，喚我做事：【　】
          blanks:
            - {answer: 回}
            - {answer: 繁重}
            - {answer: 閒閒地坐在椅子上}
            - {answer: 叫}
            - {answer: 沒有看到弟弟閒散，只叫我做事。}
          value_note: |-
            「心偏之劣：實在很偏心」與「厚此薄彼：對他好、對我差」兩格的答案**是印出來的黑字**
            （不是橘色手寫），屬原稿已填好的示範，故不列成空格。
        - type: free_text
          index: 5
          stem: 推測作者想要傳達的意圖：
          answer_text: 抱怨爸爸對弟弟偏心，都叫我（哥哥）做事。
          answer_carrier: 橘色手寫（字元樣式 af），文字流有此資訊

# ── 四 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（字元樣式 af），文字流有此資訊
  teacher_note_carrier: 深藍色（153D63）文字方塊，印在題目右側；只有第 1、3 題有
  questions:
    - index: 1
      answer: D
      stem: 下列文句，何者語詞使用最恰當？
      options:
        A: 小朋友被路上的石頭絆倒「墜地」，痛得哇哇大哭
        B: 為了這場比賽，他練習游泳許久，在泳池中大汗「淋漓」
        C: 他看起來很面熟，我苦思良久，「俄而」才喚出他的名字
        D: 街頭畫家掌握模特兒的神韻，運筆「疾速」，完成畫像
      explanation: Ａ－墜地為高處往低處掉落，跌倒不適合用此詞。Ｂ－泳池看不出大汗淋漓。Ｃ－俄而是時間短暫。）
      explanation_note: 這個解析框只有結尾的全形右括號、沒有開括號，且選項代號用全形Ａ／Ｂ／Ｃ。原稿如此。
    - index: 2
      answer: A
      stem: 閱讀完本篇課文，請問有關「文言文」的敘述，何者為不正確？
      stem_note: 題幹的「不正確」在原稿加了底線強調
      options:
        A: 文言文的出現是為了要記錄古代的生難字，以供後人閱讀
        B: 因為古代書寫成本很高，文言文大幅精簡了需要紀錄的文字
        C: 文言文是書面用語，和古人平常說話的方式有所不同
        D: 精簡文字的方式有精簡用詞、省略主詞和受詞及省略連接詞
    - index: 3
      answer: B
      stem: 下列選項，何者無法證明含光與老虎歷經一番搏鬥？
      stem_note: 題幹的「無法證明」在原稿加了底線強調
      options:
        A: 左手據虎頸，右手以鞭亂捶虎頭，呼號聲震山谷
        B: 含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地
        C: 虎怒，力不得肆，舍其弟據嵎而吼，將以搏含光
        D: 猛虎攫其弟去。含光大驚墜地，持短鞭力追
      explanation: 解析：B.只能說明弟弟傷勢嚴重。
    - index: 4
      answer: C
      stem: 下列何者是作者(曾世杰)想要學生學到的概念？
      options:
        A: 宣揚文言文寫作之美，推廣文言文
        B: 說明文言文中生字、難字、古字的字義
        C: 告訴讀者文言文的由來以及閱讀的策略
        D: 說明文言文傳承古人智慧，現代人不可不學
