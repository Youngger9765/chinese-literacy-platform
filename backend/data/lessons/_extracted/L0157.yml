# ── 一 讀全文-做記號 ──
body:
  title_line: 第2課  文言文怎麼讀？-以「鞭虎救弟記」為例
  byline: |-
    課文  ：曾世杰
    學習單：張明珠
  preface: 前言：前一篇課文是蔣衡的「鞭虎救弟記」，以白話文呈現，如表１的右欄；但三百多年前，蔣先生的這篇故事用文言文寫的，如表１的左欄。請你輕聲朗讀這篇看起來不太習慣的文字，如果不懂意思，可以對照著白話文讀讀看。
  preface_note: 印在標題列下方、段號欄之外，不佔段號
  comparison_table:
    title: 表１ 鞭虎救弟記的白話/文言文對照表
    columns: [三百多年前的文言文, 今天的白話文]
    classical_char_count: (195字)
    vernacular_char_count: (343字)
    marker_note: |-
      白話欄每一段開頭都印一個實心三角（◤），那是 `w16se:symEx` Segoe UI Emoji 25E4，
      **不在 w:t 文字流裡**，故不寫入字面字元。文言欄沒有這個符號。
    rows:
      - 三百多年前的文言文: 俄而腥風驟起，飛沙疾捲，木葉撲面如雨下，猛虎攫其弟去。
        今天的白話文: 忽然一陣帶著腥味的風刮起，場面飛沙走石，樹葉撲面有如雨下。一隻猛虎突然竄出把他弟弟攫走了。
      - 三百多年前的文言文: 含光大驚墜地，持短鞭力追，左手據虎頸，右手以鞭亂捶虎頭，呼號聲震山谷。
        今天的白話文: 含光大驚，跌倒在地上，然後他手持著短鞭奮力追虎，他左手緊緊抓著虎頸，右手用鞭子全力捶打虎頭，他大聲呼喊號叫，聲音震動了山谷。
      - 三百多年前的文言文: 虎怒，力不得肆，舍其弟據嵎而吼，將以搏含光。
        今天的白話文: 老虎大怒，因為（叼著一個人）無法施力，於是捨棄到口的獵物，靠著山坳，大聲吼叫，想要和含光搏鬥。
      - 三百多年前的文言文: 含光負其弟疾奔下嶺，投旅店。
        今天的白話文: 含光背著他弟弟飛奔下嶺，投宿旅店。
      - 三百多年前的文言文: 既息肩，其弟尚一息未殊，以湯灌之，徐甦；含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地。
        今天的白話文: 等到他把弟弟從肩上放下，他弟弟一息尚存。於是含光用湯藥灌下去，漸漸地弟弟甦醒過來；含光喘了口氣略微安定下來後，坐起來看他弟弟肩膀。前後十幾個血洞，鮮血淋漓滿地都是。
      - 三百多年前的文言文: 有道士謂之曰：「虎牙有毒，深入，惡血不盡出，不可救。」
        今天的白話文: 有個道士對他說：「老虎的牙齒有毒，已經深入體內了，毒血如果不全部排出，就没救了。」
      - 三百多年前的文言文: 含光竭力以口遍吮之，去血數升，醫數十日漸平，乃偕歸。
        今天的白話文: 含光用盡全力用嘴巴吮吸每一傷口的毒血，吸血數升，醫治了幾十天，等到病情平穩了，才和他弟弟一起回家。
    layout_note: |-
      ⚠️ 這張表在 PDF p1 只印得出表頭兩格（內容整片空白），內容從 p2 才開始 ——
      是分頁不是缺內容；document.xml 的七列完整。
  paragraph_count: 5
  paragraph_numbering_note: |-
    段號欄印 一~五 共 5 個，但課文儲存格有 **11 個區塊**（含 1 個空段），
    所以哪五個佔號要另外判。用**段落樣式**判（比對著版面猜可靠）：
      ・`a7`（無縮排的正文樣式）：區塊 1、2、8 → 三個
      ・無樣式＋左縮排 240：區塊 3（Ｑ１）、4（Ｑ１的引言）、10（Ｑ２）
      ・`a9` ＋ `numPr numId=32`：區塊 5、6、7 → 那是 Word 自動編號的**另一組**
        「一、二、三」（用詞精簡／省略主詞或受詞／省略連接詞），**不是段號**
      ・區塊 11：無樣式＋首行縮排 560
    版面上 一／二／三／五 都落在區塊 1／2／3／11 的**第一行**，四 落在區塊 8 的第二行
    （本批其他課的段號欄都是往**後**漂，不會往前漂，所以「三」印在 Ｑ１ 那一行
    代表它屬於 Ｑ１ 或更前面，而更前面已被「二」佔用）→ 判 段號 = 區塊 {1,2,3,8,11}。
    ⚠️ 本課**沒有念順順**，所以沒有字數欄可以做數值交叉驗證 ——
    上面是樣式證據＋漂移方向證據，不是精準對位。區塊 3（Ｑ１）與區塊 4 的樣式完全相同，
    單看樣式分不開這兩個，是漂移方向把它定在 3。**若日後有更硬的證據推翻，以那個為準。**
  paragraphs:
    - idx: 1
      text: 表1右欄中的白話文，連標點符號一共用了343字；左欄的文言文，連標點符號只用了195個字。讀完了以後，你會不會有一個疑問──「白話文比較容易懂吔，為什麼古人要用大家不容易懂的文言文寫文章啊？」
    - idx: 2
      text: 好問題！其實，對古人來說，白話文是日常的口語，也是比較容易懂的。但是，用白話文寫作的話，難免用上太多的字，古時候寫字要用毛筆，很不方便；紙還沒發明時，更不方便，還要用刀把字刻在竹簡上，印刷的門檻就更高了，現代人家家有印表機，在沒有電腦的時代，一般人想都別想。因為書寫、記錄和印刷都太麻煩、花太多時間、太花錢，因此可以大幅精簡文字的文言文應運而生。從西漢算起，文言文已經有兩千多年的歷史了，一直到100年前左右，紙、筆、印刷都更普遍之後，才開始有人推廣白話文。
    - idx: 3
      text: Ｑ１：文言文在哪裡節省用字？
      note: 這一段是問句標題，旁邊印了一個 QR code
    - idx: 4
      text: 文言文節省用字，提高了閱讀的門檻，所以，讀文言文時必須強調「腦補」，讀者要試著推敲出被省略的部分，動動腦筋，把它補上。例如，道士說的「不可救」，猜猜看是誰不可救？你可以腦補出來嗎？
    - idx: 5
      text: 除了用字精簡外，文言文另一個難讀的地方是因時代更迭，這麼多年之後，古人的用詞和今人已經有了差異。例如，「起視仲肩」的「仲」，指的是一群兄弟中，排行老二的人，在這篇文言文裡就是「弟弟」的意思，現代已經少有人知道「仲」有弟弟的意思。又如「力不得肆」的「肆」，意思是「施展」，老虎的力氣施展不出來，「肆」有「施展」的意思，現代人也幾乎不用了。其他如「負其弟疾奔下嶺」的「負」，就是「背書包」的「背」；「一息未殊」的「殊」，就是「斷絕」的意思。這些古人的用詞，增加了現代人閱讀的難度。還好，國、高中國文課本裡的文言文，對這些生字難字古字都有注釋，看一下注釋，就可以知道這些字詞的意思了。
  unnumbered_blocks:
    - after_paragraph: 3
      text: 以「鞭虎救弟記」為例，文言文比白話文少了148字，作者主要用了三個方式節省用字：
      role_note: Ｑ１ 底下的引言
    - after_paragraph: 3
      text: 用詞精簡：「弟弟」在文言文裡只剩「弟」；「老虎的牙齒」只剩「虎牙」；弟弟被灌了湯藥後，「徐甦」。「徐」有「慢慢的」意思，「甦」則是甦醒。因此，「徐甦」就是弟弟「慢慢的清醒過來」，省了５個字呢。
      role_note: 節省用字方式（自動編號 一、）
    - after_paragraph: 3
      text: 省略主詞或受詞：如果句子的主詞或受詞是可以推敲出來的，文言文往往就省略不寫了。例如，「虎牙有毒，深入，惡血不盡出，不可救。」這裡「深入」的主詞指的是什麼？當然是虎牙的毒，但虎牙的毒會深入哪裡呢？當然是深入傷者的身體囉，這裡也省略了受詞不寫。作者表達「虎牙的毒深入傷者體內」時，把「虎牙的毒」和「傷者體內」都省略了，因為這些訊息是可以推敲出來的。
      role_note: 節省用字方式（自動編號 二、）
    - after_paragraph: 3
      text: 省略連接詞：連接詞就是「讓前後文可以更有意義串連在一起」的詞彙，例如，然後、因為、所以、於是、如果、就、才等詞彙，都是文言文裡非常少用的連接詞。像「惡血不盡出，不可救」其實是「惡血（如果）不完全排出，（就）沒救了。」，「如果」和「就」被省略了。
      role_note: 節省用字方式（自動編號 三、）
    - after_paragraph: 4
      text: Ｑ2：文言文一堆生字、難字、古字怎麼辦？
      role_note: 問句標題
  unnumbered_blocks_note: |-
    「一、二、三」那三段的序號是 Word 自動編號（`numId=32`），**不在 w:t 文字流裡**，
    所以本欄的 text 不含序號。它們與段號欄的「一二三」是兩套不同的編號，不要混。

