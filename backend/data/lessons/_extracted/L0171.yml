# ── ㄧ 讀全文-做記號 ──
body:
  title_line: 第5課  從白熊到藍海豚：學習與念頭和平相處
  paragraph_count: 7
  paragraphs_note: 段號欄印 ㄧ~七 共 7 個。
  paragraphs:
    - idx: 1
      text: 清晨鬧鐘一響，你迷迷糊糊睜開眼睛，腦袋馬上開始運作：「好累喔，我一定起不來……等一下又會遲到吧。」刷牙時，看到鏡子裡的自己，又浮出另一個念頭：「今天看起來好沒精神，同學一定會覺得我很邋遢。」出門後，天氣陰陰的，你心裡冒出：「完了，沒帶傘，晚點下雨就慘了。」走進教室，看見同學三三兩兩聊天，突然瞥了你一眼，你心裡又冒出個聲音說：「他們是不是在講我？」
    - idx: 2
      text: 你有注意到嗎？從起床到踏進教室，不到一小時，我們的腦袋就冒出了十幾個念頭，而且有許多是負面的想法。研究顯示我們每天會產生數千個念頭，其中有些是我們根本不想要、卻反覆出現的負面念頭，然而大腦還會拿起擴音器大肆廣播，使我們腦海充斥懷疑與批評，也經常把我們困住。
    - idx: 3
      text: 有時候，一句「我很爛」，會讓我們明明有能力，卻在起步前就退縮；一句「我只會添麻煩」，讓我們覺得自己是別人的負擔，因此最需要協助時，卻把求助的話默默吞下去；一句「都是我的錯」，更會像一把沉重的鎖，把人關進自責的迷宮裡，不斷反覆回放失敗的畫面。當你越抗拒這些念頭，越要自己不去想，會發現這些「腦內酸民」反而更大聲。就像，如果我要求：「你現在可以胡思亂想，但不准你想白熊！」你看！你的腦海是不是開始反覆出現白熊的畫面了呢？這就是經典的「白熊效應」——你愈想抗拒、壓抑一個念頭，那個念頭就更容易跳出來。
    - idx: 4
      text: 然而，當「腦內酸民」開始丟出毒舌評論，甚至預言各種災難時，我們可以怎麼做呢？想要趕走「白熊」，你需要的是「藍海豚」。白熊效應告訴我們「越抗拒，越跳出來」，而「藍海豚」則是「轉移注意力」的妙方。任何能讓我們轉移注意力的想法或做法，都是藍海豚，可以帶你脫離惱人的白熊。
    - idx: 5
      text: 所以，當你準備上場打擊，感到非常緊張時，與其一直告訴自己「不要緊張」，不如對自己說：「每一個要上場的人都會緊張，這很正常。」甚至出聲把自己正在做的熱身動作說出來：「雙手將球棒上舉，前後俯仰三次、一、二、三…左右側彎各三次…」，都可以消滅白熊，迎來藍海豚。當你因失誤而感到自責時，與其一直說「都是我害的」，不如告訴自己：「失誤是挑戰的一部分，我可以先為下一步準備。」然後問問自己：「現在最重要的是什麼？下一步我可以怎樣避免失誤、可以怎樣做得更好？」這些自我對話，就是你的「藍海豚」，能讓你離開白熊，把腦內酸民的吶喊消音，讓注意力回到當下最重要的事上。
    - idx: 6
      text: 此外，那些唱衰、批評的念頭並不一定是真的，也不一定會發生。它們只是「路過的想法」，像一陣風一樣，來了就走。所以當「腦內酸民」說：「你不行」、「你一定會失敗」時，如果你能停一下，提醒自己──「這只是念頭，不是真的」、「這只是想法，它沒有證據」──你和念頭之間就會多出一點距離。這一點距離，會讓你有空間重新選擇：你要相信它、忽略它，或是選一個更能幫助自己的想法。
    - idx: 7
      text: 所以，下次你的大腦又開始酸言酸語時，記得喚出你的藍海豚，把注意力拉回當下真正重要的事。那些念頭只是路過而已——你看見它就好，可以不必跟著它跑喔。
  inline_marked_terms: [邋遢, 大肆, 充斥, 起步, 退縮, 效應, 預言, 惱人, 俯仰, 唱衰, 酸言酸語]
  inline_marked_terms_note: 課文用黑色字元框線（w:bdr color=auto）標出本課語詞；是題目標示不是答案

