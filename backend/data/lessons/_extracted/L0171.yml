      text: |-
        在〈專注當下：關掉內心的批評噪音〉中，我們已經學會看見那些常冒出來的負面念頭，知道它們有不同的說話方式。
        這一單元，我們要再往前一步──不是跟念頭吵架，也不是急著把它趕走，而是學一種比較不累的相處方式。
        當你越叫自己「不要想」，那個念頭反而越大聲，這就是所謂的「白熊效應」。而「藍海豚」則是幫助你轉移注意力，拉回當下。接下來的練習，會一步一步帶你找出適合你自己的藍海豚，讓你在緊張、焦慮或自責出現時，有一個真的用得上的方法。
    - type: figure
      referent: 白熊效應與藍海豚對照插圖
      text_carrier: image
      content: |-
        兩格插圖：
        1. 白熊效應 (越想刻意不去想某件事，反而會越常想到它)：學生抱頭，腦中全是白熊，
           旁邊標「結果腦袋裡全都是白熊…」與大字「不要想！」
        2. 藍海豚 (把注意力放到完全不同的另一個地方，讓自己分心，不再聚焦白熊)：
           學生在籃球場上指著前方，旁邊有海豚、籃球、書本、音符，
           對白是「去打球！專注在球場上！」與「看！是藍海豚！」
      content_note: |-
        ⚠️ 標 text_carrier: image 前已自檢：這些插圖內對白（「結果腦袋裡全都是白熊…」「不要想！」
        「去打球！專注在球場上！」「看！是藍海豚！」）在文字層 grep 全部 0 命中，確實只畫在像素裡。
        兩格的**標題**（白熊效應／藍海豚 與括號內說明）也一樣不在文字層。
    - type: guide
      text: ◎認識藍海豚：
    - type: table
      columns: ['', 類型, 說明, 舉例]
      rows:
        - ['1', 身體, 把注意力聚焦在身體或是感官。, 數呼吸10下、留意腳踩在地上的感覺。]
        - ['2', 行動, 把注意力聚焦在一段可描述的動作流程。, 依序留意完成揮棒的熱身動作，並說出來。（如果出聲讓你不自在，也可以改成在心中喃喃自語）]
        - ['3', 問題解決, 把注意力聚焦在自己可控的事物, 問自己「哪些是我能控制的？」、「下一步是什麼？」]
    - type: guide
      text: ◎小試身手：
    - type: guide
      text: 練習一：辨識藍海豚──判斷文章中，作者提出的「藍海豚」，分別屬於哪個層面。
    - type: sub_block
      label: 練習一
      columns: [事件, 藍海豚, 類型]
      items:
        - type: single
          intro: 準備上場打擊，感到非常緊張
          prompt: 出聲把自己正在做的熱身動作說出來
          options: {1: 身體, 2: 行動, 3: 問題解決}
          answer: 2
        - type: single
          intro: 因失誤而感到自責
          prompt: 問問自己：「下一步我可以怎樣做得更好？」
          options: {1: 身體, 2: 行動, 3: 問題解決}
          answer: 3
      columns_note: |-
        原稿是三欄表；`intro` 放「事件」欄、`prompt` 放「藍海豚」欄，兩段各自照原稿逐字。
        ⛔ 不把兩欄用分隔符接成一句。
    - type: single
      prompt: ※前一課〈專注當下，關掉內心的批評噪音〉中，主角因為做了棒式訓練，感受到肌肉越來越痠，呼吸越來越急，這是
      options: {1: 身體, 2: 行動, 3: 問題解決}
      answer: 1
      tail: 類型的藍海豚。
      tail_note: 原稿印「…這是（☑①身體 □②行動  □③問題解決 ）類型的藍海豚。」——選項夾在句中
    - type: guide
      text: 練習二：區辨白熊與藍海豚──比較下列相同情境的不同回應，哪個聚焦在白熊（抗拒的念頭），哪個聚焦在藍海豚（新的焦點）？
    - type: sub_block
      label: 練習二
      columns: [情境, 想法或作法, 聚焦重點]
      items:
        - type: single
          intro: 上台報告前，你心跳很快
          prompt: 1.一直告訴自己「拜託不要緊張」
          options: {1: 白熊, 2: 藍海豚}
          answer: 1
        - type: single
          intro: 上台報告前，你心跳很快
          prompt: 2.感受腳趾在鞋子裡曲伸的感覺，默讀資料上的文字
          options: {1: 白熊, 2: 藍海豚}
          answer: 2
        - type: single
          intro: 上台報告前，你心跳很快
          prompt: 3.不斷想像最糟的結果
          options: {1: 白熊, 2: 藍海豚}
          answer: 1
        - type: single
          intro: 小考考砸了，你很懊惱
          prompt: 1.一直回想自己哪一題寫錯、怎麼會寫錯
          options: {1: 白熊, 2: 藍海豚}
          answer: 1
        - type: single
          intro: 小考考砸了，你很懊惱
          prompt: 2.先把錯的題目標出來，看看是否有重複的類型
          options: {1: 白熊, 2: 藍海豚}
          answer: 2
        - type: single
          intro: 小考考砸了，你很懊惱
          prompt: 3.問自己下一次還可以嘗試什麼準備方法
          options: {1: 白熊, 2: 藍海豚}
          answer: 2
      columns_note: 「情境」欄在原稿是跨列合併儲存格（前 3 題共用一個、後 3 題共用一個），這裡每題各自重複一次
    - type: guide
      text: 練習三：找出自己的藍海豚──找到自己日常的「藍海豚」，幫助自己在負面念頭冒出來時，可以派上用場。
    - type: multi
      prompt: 1.使用時機：什麼時候我需要召喚藍海豚？請選出你能察覺的訊號。
      options:
        1: 我開始反覆重播剛剛的失誤
        2: 我一直想「不要緊張」
        3: 我心跳變快／手心冒汗
        4: 我腦中出現「都是我害的」
        5: 我一直在想別人會怎麼看我
        6: '其他：____________________'
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: guide
      text: 2.選擇策略：勾選你覺得適合你或可能有效的方法。
    - type: table
      columns: [身體藍海豚, 行動藍海豚, 問題解決藍海豚]
      rows:
        - ["□①數呼吸10下\n□②感覺雙腳在鞋子中的觸感、踩地的重量\n□③肩膀用力聳起然後放鬆，重複3次\n□④手握拳繃緊，然後放開，重複5次\n□⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿",
           "□①找出眼前任務的「第一步」並做完\n□②出聲描述完成任務的步驟，依序執行。\n□③離開當下，做一件1分鐘內可以完成的事（如：上廁所）\n□④完成一個熟悉的小流程（例：拿水→喝一口→放回）\n□⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿",
           "問自己：\n□①現在有哪些是我能控制的？\n□②我需要什麼資源或協助？\n□③哪一件事我先做到「及格」就好？\n□④現在最重要的是哪一件事？\n□⑤其他：＿＿＿＿＿＿＿＿＿＿＿＿＿"]
      rows_note: |-
        三欄各是一組自我勾選清單，**沒有正確答案**（學生自選）。
        行動欄第 4 項的「拿水→喝一口→放回」用的是**字面箭號「→」（U+2192）**，不是 w:sym，保留原樣。
      no_correct_answer: true
    - type: multi
      prompt: |-
        ３.檢核成效：請選出藍海豚出現的訊號。
        我們不需要把白熊趕走，只要做到：
      options:
        1: 念頭音量小一點點
        2: 能將注意力回到當下30秒
        3: 能開始採取行動，做到第一步
        4: '其他：___________________'
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      prompt_note: 原稿這一項的序號印的是**全形「３」**，前兩項印半形「1.」「2.」
    - type: free_text
      prompt: |-
        ◎總結：給自己一句話帶走召喚藍海豚的魔法──
        （例：當我反覆要自己不要緊張時，我可以數呼吸10秒。）
        →當我________________________時，我可以____________________。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿空白

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（run 層 w:color E97132）；第 1 題印全形「Ａ」，其餘半形
  teacher_note_carrier: 深藍色（C:0F4761）文字方塊，印在題目右側
  questions:
    - index: 1
      answer: A
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 這片山林因為民宿開發而被「大肆」破壞
        B: 他「邋遢」的行事風格，受到許多人喜愛
        C: 這「惱人」的鳥鳴聲，在早晨中使人喜悅
        D: 他「效應」了許多次都沒用，只好發起抗爭
      teacher_note: |-
        第1題解析：(B)「邋遢」形容不乾淨整潔(C)「惱人」形容不舒服的感受
        (D)「效應」應換成「反映」
    - index: 2
      answer: B
      stem: 根據第二段，作者提到「大腦還會拿起擴音器大肆廣播」，這句話最可能用來形容什麼現象？
      options:
        A: 大腦會幫助我們篩選並記住重要訊息
        B: 負面想法經常被大腦放大與重複播放
        C: 大腦習慣借助工具並處理簡單的任務
        D: 腦中許多想法都有所根據且不容忽視
      teacher_note: 第2題解析：從前後文可看出，此處的「擴音器大肆廣播」有重複和放大的效果
    - index: 3
      answer: C
      stem: 根據文章，作者認為「藍海豚」的功能最接近下列何者？
      options:
        A: 幫助我們逃避負面情緒
        B: 教我們忽略一切不好的事情
        C: 幫助我們將注意力拉回當下
        D: 用更嚴格的標準來要求自己
    - index: 4
      answer: B
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 認清大腦的運作方式，學會以理性取代負面思考
        B: 理解念頭的影響，並學習透過行動轉化注意力
        C: 建立自信心，避免讓別人看出自己的軟弱情緒
        D: 用樂觀取代擔憂，讓情緒盡可能保持正向狀態
    - index: 5
      answer: D
      stem: 根據品格聚光燈，面對上台時刻，下列哪一種因應方式最符合召喚「藍海豚」？
      options:
        A: 告訴自己「不要緊張，不要出錯！」
        B: 強迫自己不要去想最糟的結果會怎樣
        C: 放空不想任何事，或乾脆不去報告了
        D: 專注練習，在心中反覆複習報告重點
      teacher_note: (D)符合「專注當下」「找出可以控制的事」
      teacher_note_note: 這個文字方塊在 PDF 上被右邊界裁掉一部分，此處以文字層為準

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [邋遢, 大肆, 充斥, 起步, 退縮, 效應, 預言, 惱人, 俯仰, 唱衰, 酸言酸語]
  grid_size: [10, 10]
  grid:
    - 起獵塌大律充斥白起布
    - 昌步宏惱退唱衷熊退縮
    - 衰則亮人當下校應懊悔
    - 自酸練充斤邋言超預腦
    - 欲言又止念頭遢步言人
    - 大酸不妨唱扳腦人作祟
    - 震語蠟衰大回酸無語大
    - 耳褪大中四一效允肆瀰
    - 欲宿言俯仰城應斥想漫
    - 聾藍海豚好臥排山倒海
  answers_are_graphical: true
  answer_paths:
    - word: 起步
      cells: [[1, 1], [2, 2]]
      direction: diagonal_down_right
    - word: 充斥
      cells: [[1, 6], [1, 7]]
      direction: horizontal
    - word: 惱人
      cells: [[2, 4], [3, 4]]
      direction: vertical
    - word: 退縮
      cells: [[2, 9], [2, 10]]
      direction: horizontal
    - word: 酸言酸語
      cells: [[4, 2], [5, 2], [6, 2], [7, 2]]
      direction: vertical
    - word: 邋遢
      cells: [[4, 6], [5, 7]]
      direction: diagonal_down_right
    - word: 預言
      cells: [[4, 9], [5, 9]]
      direction: vertical
    - word: 唱衰
      cells: [[6, 5], [7, 4]]
      direction: diagonal_down_left
    - word: 大肆
      cells: [[7, 10], [8, 9]]
      direction: diagonal_down_left
    - word: 效應
      cells: [[8, 7], [9, 7]]
      direction: vertical
    - word: 俯仰
      cells: [[9, 4], [9, 5]]
      direction: horizontal
  geometry_check: |-
    圈選全部包在一個「群組 94」（4.81×3.55in）裡，內含 **8 個 roundRect ＋ 3 個 rect ＝ 11 個圖形**，
    與 11 個目標語詞相符、無警報。與 L0170 同型：**只數 roundRect 會得到 8，看起來像少 3 條**。
    沒有紙外殘留；格子沒有跨頁（10 列都在 p12）。
    11 條路徑都用「把 cells 套回 grid 拼字」驗過，全部拼得回目標語詞。
    ⚠️ 第 2 列的「唱衷」（衷）是**同音誘答**，真正被圈的「唱衰」在第 6~7 列的斜線上。

