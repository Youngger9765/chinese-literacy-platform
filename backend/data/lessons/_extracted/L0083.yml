vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  target_words: [典型, 動員, 獨門, 蘊含, 琢磨, 設身處地, 躡手躡腳, 窸窸窣窣, 喧鬧紛雜, 悲歡離合]
  grid_size: [10, 10]
