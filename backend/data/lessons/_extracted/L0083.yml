    格子放了多組形近／同字誘答：第 1 列「琢」與第 3 列真答案「琢磨」的「琢」、
    第 3 列「啄」、第 5 列「窸」與第 10 列真答案的「窸」、第 7 列「聶」對「躡」、
    第 5 列「獨立」對第 2 列真答案「獨門」的「獨」。上列路徑取的是被圈中的那一組。
  answers_are_graphical: true
