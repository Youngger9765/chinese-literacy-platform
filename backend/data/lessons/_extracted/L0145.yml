  answer_carrier: 橘色填在【　】內；**顏色來自字元樣式 af，run 層沒有 w:color**
  rows:
    - label: 觀點（段1-2）
      items:
        - label: '1'
          value: 1.智人能讓千千萬萬【　】的人，為了同一個目標一起工作。
          blanks: [{answer: 素昧平生}]
        - label: '2'
          value: 2.智人能成為有影響力的物種，不是因為身體最強，而是因為會相信【　】；這些故事看不見，卻能組織眾人，產生【　】。
          blanks: [{answer: 共同的故事}, {answer: 巨大的力量}]
    - label: 主要例子(段3-5)
      items:
        - label: '1'
          value: 1.錢：千元鈔只是一張【　】，卻能夠交易；錢的力量在大家共同【　】的故事裡。
          blanks: [{answer: 紙}, {answer: 相信}]
        - label: '2'
          value: 2.交通規則：紅綠燈本身沒有力量讓人停下或前進；大家相信並遵行【　】的規則，才不會撞成一團。
          blanks: [{answer: 紅燈停，綠燈行}]
        - label: '3'
          value: 3.公司：公司不是一個人，也不是一棟大樓；力量來自法律和大家承認它是一個【　】。
          blanks: [{answer: 法人}]
        - label: '4'
          value: 4.國家：我們看不見【　】這個抽象概念；國家的力量來自許多人相信「我們屬於同一個國家」。
          blanks: [{answer: 國家}]
    - label: 補充延伸(段6)
      value: 這裡的「虛構」不是【　】，而是人類共同創造、共同相信的【　】。例如冠軍、正義、民主、自由、人權等，雖然看不見，卻能影響人的行動。
      blanks: [{answer: 騙人}, {answer: 概念}]
    - label: 結論(段7～8)
      items:
        - label: '1'
          value: 1.其他動物多靠血緣、氣味、熟悉聲音或本能合作；智人能把【　】，把【　】 ，把【　】。
          blanks: [{answer: 想像變成秩序}, {answer: 故事變成制度}, {answer: 陌生人變成同伴}]
        - label: '2'
          value: 2.人類統治世界，靠的不是爪子，而是【　】；世界上強大的力量，常常是許多人同時相信的故事。
          blanks: [{answer: 想像力}]

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法——用例子說明觀點
  blocks:
    - type: concept_box
      text: |-
        有些文章會先直接說出作者的觀點，再舉幾個例子，讓觀點更清楚、更有說服力。讀這種文章時，不能只讀到個別例子，還要看：
        這些例子有什麼共同點？
        它們如何支持作者一開始提出的觀點？
        這一課，我們要練習：
        【❶找觀點】→【❷找例子】→【❸判斷共同點】→【❹回扣觀點】
      arrow_note: |-
        最後一行的三個「→」是**字面字元**（w:t 裡的 U+2192），不是 w:sym 符號，
        所以照原樣留在同一行、不斷行。（同批 L0146/L0147 另有 Wingdings F0E0 的符號箭號，
        那一種前後才斷行。）
    - type: guide
      text: |-
        一、步驟❶──找觀點
        這一課觀點是明示的，請選出作者一開始提出的觀點。
    - type: single
      prompt: 請選出作者一開始提出的觀點。
      options:
        1: 智人能成為地球上最有影響力的物種，是因為跑得最快、力氣最大。
        2: 智人能成為地球上最有影響力的物種，是因為會相信「共同的故事」。
        3: 智人和其他動物一樣，主要靠熟悉的同伴一起合作。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: guide
      text: |-
        二、步驟❷──找例子
        作者用了很多例子，說明「共同相信的故事」會產生真實力量。請根據課文完成下表的【】填寫和勾選，為下一步「找共同點」做準備。
    - type: fill_table
      columns: [例子, 看得見, 大家共同相信什麼？, 這個例子說明：共同相信能讓……]
      columns_note: 第 3、4 欄的表頭在原稿各印成兩行（「大家共同相信／什麼？」「這個例子說明：／共同相信能讓……」）
      rows:
        - 例子: 錢
          看得見: 一張紙
          大家共同相信什麼？: 大家相信它【有價值】
          大家共同相信什麼？_note: 這一格的【有價值】是**黑色**，原稿先填好的示範，不是教師答案
          這個例子說明：共同相信能讓……: [①紙張本身變得更有用, ②讓一張紙變成交易工具]
          這個例子說明：共同相信能讓……_options: {1: 紙張本身變得更有用, 2: 讓一張紙變成交易工具}
          這個例子說明：共同相信能讓……_answer: 2
        - 例子: 交通規則
          看得見: 紅綠燈
          大家共同相信什麼？: 大家相信【　】
          大家共同相信什麼？_blanks: [{answer: 紅燈停，綠燈行}]
          這個例子說明：共同相信能讓……: [①燈號顏色自然讓人停走, ②能讓交通形成共同秩序]
          這個例子說明：共同相信能讓……_options: {1: 燈號顏色自然讓人停走, 2: 能讓交通形成共同秩序}
          這個例子說明：共同相信能讓……_answer: 2
        - 例子: 公司
          看得見: 大樓、員工、產品
          大家共同相信什麼？: 法律承認公司是一個【　】
          大家共同相信什麼？_blanks: [{answer: 法 人}]
          這個例子說明：共同相信能讓……: [①讓看不見的法人產生力量, ②產品受歡迎才有力量]
          這個例子說明：共同相信能讓……_options: {1: 讓看不見的法人產生力量, 2: 產品受歡迎才有力量}
          這個例子說明：共同相信能讓……_answer: 1
        - 例子: 國家
          看得見: 土地、人民、國旗、護照
          大家共同相信什麼？: 大家相信我們屬於【　】
          大家共同相信什麼？_blanks: [{answer: 同一個國家}]
          這個例子說明：共同相信能讓……: [①讓陌生人產生歸屬與責任, ②讓土地國旗自動連結人民]
          這個例子說明：共同相信能讓……_options: {1: 讓陌生人產生歸屬與責任, 2: 讓土地國旗自動連結人民}
          這個例子說明：共同相信能讓……_answer: 1
      answer_carrier: 填空為橘色（字元樣式 af）；選項為紅色 ☑（w:sym F0FE）
      cell_shape_note: |-
        第 4 欄每格寫成**兩個字串的 list**（renderer 的 cellText 支援陣列、以換行排版），
        不是把兩個選項接成一句。理由：被勾中的那個選項前面是 w:sym（沒有 w:t），
        沒被勾的前面是字面「□」，所以原稿的字串是「①甲□②乙」——
        接成「①甲　②乙」會漏掉中間那個 □ 而對不上原稿（逐字門實際抓到這兩列）。
    - type: guide
      text: |-
        三、步驟❸──找這些例子的共同點
        看完上表，請把這些例子合起來想一想，歸納出重要概念：
    - type: single
      prompt: 1.錢、國家、學校、公司、紅綠燈這些例子中，作者舉出紅綠燈、大樓、國旗、護照……這些屬於（　）。
      options:
        1: 看得見的表面事物
        2: 真正產生力量的原因
      answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
      note: 原稿兩個選項印在題幹的括號裡（同一行）
    - type: single
      prompt: 2.這些看得見的東西，主要靠「它們本身」產生力量嗎？
      options: {1: 是, 2: 不是}
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: single
      prompt: 3.真正讓它們產生力量的是什麼？
      options:
        1: 看不見的共同相信、共同承認或共同遵守。
        2: 看得見的物品本身，例如紙張、國旗、大樓或燈號。
      answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: single
      prompt: 4.所以，這些例子最重要的共同點是什麼？（請勾選，單選）
      options:
        1: 這些例子說明：看得見的東西本身就有力量。
        2: 這些例子說明：看不見的共同相信，會讓不同事物產生真實影響。
        3: 這些例子說明：只要有法律和規則，就能產生社會秩序。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: guide
      text: |-
        四、步驟❹──回扣作者觀點
        前面我們看出：共同相信會產生真實力量。現在回到作者一開始提出的觀點：智人能成為最有影響力的物種，是因為會相信「共同的故事」。
    - type: single
      prompt: 1.錢、紅綠燈、公司、國家這些例子中，「共同相信」產生了什麼力量？
      options:
        1: 讓看得見的東西自己變得有力量。
        2: 讓互不相識的人，也能依同一套價值、制度或規則一起行動。
        3: 讓少數人訂出規則後，強迫他人服從規則。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: single
      prompt: 2.這些例子怎麼支持作者一開始的觀點？
      options:
        1: 它們說明人類會發明錢、紅綠燈等工具，所以生活變得更方便。
        2: 它們說明共同故事能組織許多陌生人合作，形成制度、秩序和巨大影響力。
        3: 它們說明社會秩序主要靠法律和規定維持，只要訂好規則，人們就會合作。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: guide
      text: |-
        ★策略帶著走
        下次讀到作者舉很多例子的文章時，要問自己：
        ☆這些例子背後有什麼共同點？
        ☆它們一起支持作者哪一個觀點？
    - type: self_check
      label: ◎自我檢核
      instruction: 如果你有做到，請在□內打勾。
      items:
        - 1.我能找出作者一開始明白表示的觀點。
        - 2.我能把很多例子合起來看，說出它們共同說明的重點。
        - 3.下次讀到作者舉很多例子的文章時，我會問自己：這些例子一起支持作者哪一個觀點？
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三個□都沒有勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  option_key_note: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af）
  answers_printed: true
  items:
    - index: 1
      stem: 一家公司為什麼能在老闆更換、員工離職、大樓拆掉後，仍然被認為存在？
      options:
        A: 因為公司的產品熱賣，所以公司就一定不會消失
        B: 因為法律承認它，銀行、顧客和員工也承認它
        C: 因為老闆曾經創立公司，所以公司永遠屬於老闆
        D: 因為公司的大樓還在，所以公司自然能繼續存在
      answer: B
      teacher_note: 公司能存在，是因為法律承認它，銀行替它開戶，顧客購買產品，員工相信自己在為它工作
      teacher_note_carrier: 藍框浮動文字方塊，印在該題右側（在文字層）
    - index: 2
      stem: 第5段提及：「國家像一張巨大的網，把無數陌生人連接在一起。」這句話最合理的意思是什麼？
      options:
        A: 國家的土地越大，人民就越容易彼此認識
        B: 國旗和護照本身，能直接把人民組織起來
        C: 共同的國家認同，能讓陌生人產生連結
        D: 國際比賽的加油聲，是國家存在的主要原因
      answer: C
    - index: 3
      stem: 本文第7段比較其他動物和智人，最主要是為了凸顯智人的哪一項特別能力？
      options:
        A: 多種其他動物也會合作，但多半靠本能或熟悉同伴
        B: 其實動物只要數量夠多，也能建立金錢和法律制度
        C: 人類合作完全不靠本能，也不需要熟人互相信任
        D: 只有人類能讓大量陌生人，因共同故事而一起合作
      answer: D
      teacher_note: 比較是為了說明智人的特別之處，是能讓大量互不相識的人，因共同相信同一張紙、同一面旗、同一條法律而合作
      teacher_note_carrier: 藍框浮動文字方塊，印在該題右側（在文字層）
    - index: 4
      stem: 作者舉出錢、紅綠燈、公司、國家等多個例子，最主要的寫作作用是什麼？
      options:
        A: 羅列生活中常見事物，讓文章內容顯得更為親切豐富
        B: 比較不同制度的優缺點，協助判斷哪一種最有力量
        C: 按照事物的重要程度，說明金錢比制度更有關鍵影響
        D: 用不同的例子，支持共同相信的故事會產生力量的觀點
      answer: D
      teacher_note: 作者舉很多例子是要讀者看見：不同生活層面都靠共同相信產生真實力量，進而支持作者一開始提出的觀點
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 5
      stem: 下列哪一選項的文字最能概括本文主旨？
      options:
        A: 人類能靠共同相信的故事，組織陌生人合作並推動世界
        B: 人類能靠科技工具和機器，改變生活並統治自然
        C: 人類能靠法律規定和命令，讓每個人都願意服從
        D: 人類能靠熟悉同伴和本能，建立穩定的社會秩序
      answer: A
      teacher_note: 本文錢、國家、學校、公司、紅綠燈等例子，都在說明共同故事能組織人類合作，推動看得見的世界
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）

