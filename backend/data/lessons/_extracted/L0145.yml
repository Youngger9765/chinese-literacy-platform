    - {index: 6, definition: 由人想像、創造出來的概念，不一定是自然界本來就存在的東西，也不等於騙人。, answer: 虛構}
    - {index: 7, definition: 指被法律承認的組織，例如公司、基金會、協會；它可以簽約、擁有財產，也要負責任。, answer: 法人}
    - {index: 8, definition: 大家長久以來都這樣做，慢慢形成大家都認同的習慣或規則。, answer: 約定俗成}

