#    ⚠️ symEx 的屬性是**帶命名空間**的（`w16se:font`/`w16se:char`），
#       用不帶前綴的 get() 會讀成 None、字碼靜默消失（我的 dump 一開始就是這樣，已修）。
#
# 🔵 三種答案載體：
