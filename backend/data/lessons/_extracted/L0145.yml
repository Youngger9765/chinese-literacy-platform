  answer_carrier: 橘色（E97132）填在橫線上；本節是全課**唯一**答案帶 run 層 w:color 的一節
  items:
    - {index: 1, definition: 從來沒有見過面，也不認識。, answer: 素昧平生}
    - {index: 2, definition: 指看不見、摸不到，但人可以理解和討論的想法，例如自由、正義、國家。, answer: 抽象概念}
    - {index: 3, definition: 比喻大家一起建立或完成某件事。本文是指大家一起形成並相信某種故事、信念或規則。, answer: 共同編織}
    - {index: 4, definition: 指生物的種類，例如人類、老虎、麻雀是不同物種。, answer: 物種}
