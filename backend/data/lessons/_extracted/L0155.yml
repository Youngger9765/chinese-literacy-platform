        answer_carrier: 橘色圈選（roundRect FF9900，2.07×0.26in，尺寸吻合 10 字）圈住「一心以為有鴻鵠將至者」
  part_two:
    label: （二）閱讀理解測驗
    answer_carrier: 橘色手寫代號（字元樣式 aff6）
    items:
      - index: 1
        answer: C
        stem: 關於文本內容，下列何者較符合文章主旨?
        options:
          A: 說明學習需依靠名師指導
          B: 強調天資將決定學習成敗
          C: 指出專心致志的重要性
          D: 說明下棋比射箭更難學
