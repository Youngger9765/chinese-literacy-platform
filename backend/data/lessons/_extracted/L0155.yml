# ── 四 文言文聚光燈 ──
spotlight:
  strategy_name: 賓語前置：倒裝句
  strategy_type: classical_grammar
  section_title_printed: 文言文聚光燈
  answer_carrier: 橘色代號與填空（字元樣式 aff6／af）＋ 橘色圈選（roundRect，srgb FF9900）
  blocks:
    - type: concept_box
      text: |-
        你看過文字在句子裡玩「大風吹、換位子」嗎？在中文裡，有一種神奇的魔法叫做「倒裝句」！
        通常我們說話都有固定的順序，但有時候，為了「強調重點」或「傳達強烈的情感」，會故意把最重要的語詞搬到句子最前面，讓人第一眼就看到這個被強調的焦點，留下深刻的印象！而且，這種換位子的魔法，還能讓句子讀起來更有節奏感呢！
        接下來，請跟著說明，一起認識「賓語前置的倒裝句」。

    - type: guide
      text: 一、重點攻略
    - type: guide
      text: 國文課本有一課〈愛蓮說〉，作者說他很愛蓮花，但他卻把「愛蓮」寫成「蓮之愛」。來看看這是怎麼回事？
    # ⚠️ 這一塊原本我寫成 figure + text_carrier: image，**那是標太寬** ——
    #    自檢（把標了 image 的片段拿回合併 run 後的 dump grep）3 個片段有 2 個命中，
    #    代表那些字其實在文字層、被 image 旗標放過不檢查。已改成純 guide，讓它們照常受檢。
    #    真正畫成圖形的只有兩條交叉箭頭與右側的大箭頭（沒有文字），不另立 figure。
    - type: guide
      text: 正常敘事句結構：(主語) + 述語(動詞) + 賓語           (我)愛蓮
    - type: guide
      text: |-
        賓語前置的倒裝：(主語) + 賓語 + 之(為) + 述語(動詞)    蓮之愛
        是
      text_note: 「是」印在「之(為)」正下方的小圓角框裡，表示兩者可替換；框是圖形、字在文字層
    - type: guide
      text: 觀察到了嗎?為了達到倒裝的目的，賓語被移到動詞前面，而且賓語與動詞間還必須加「是」或「之(為)」，讓人知道這是文字「換位子」哦！
    - type: guide
      text: 可能有同學會問：文言文中，「之」很常見啊，要怎麼判斷句子是不是倒裝了呢?我們可以思考：賓語的詞性應該是什麼?沒錯！就是名詞、代詞。所以，賓語前置的倒裝句的結構應該像下面這樣：
    - type: table
      columns: [成分, 說明]
      instruction: 賓語提前倒裝句型
      rows:
        - ['(主語)', 可省略]
        - [賓語, 名/代詞]
        - [是/之, 助詞]
        - [述語, 動詞]
      shape_note: 原稿是一個橫向的圓角框，四個成分並排、下方各標詞性；這裡攤成兩欄表格
    - type: guide
      text: 另一種常見的形式是：
    - type: table
      columns: [成分, 說明]
      rows:
        - [唯, 副詞]
        - [賓語, 名/代詞]
        - [是, 助詞]
        - [述語, 動詞]
      shape_note: 同上，原稿是橫向圓角框
    - type: guide
      text: 寫成「唯……是……」。「唯」意思是「只」，用來限定動詞的範圍，「是」是表示賓語前置了。
    - type: guide
      text: 比如「只吃肉」，動詞是「吃」，吃肉，加了「只」就可以讓人知道限定吃肉，在「肉的範圍內都吃，其他的都不吃」。
    - type: guide
      text: 「只吃肉」是正常的敘事句，古文用語寫成「唯吃肉」，按照文字大風吹的規則：動詞跟賓語要換位子；賓語(肉)前置，動詞(吃)被擠到後面，賓語跟動詞中間要放助詞(是)讓人知道這是倒裝句。剩下的語詞(唯)位子不動，「唯吃肉」就會變成「唯肉是吃」了。
    - type: guide
      text: 現在，你已經了解賓語前置倒裝句的魔法了，但我們還需要進一步地熟悉「怎麼還原」?這將有助於我們快速地理解句意哦！具體步驟如下：
    - type: table
      instruction: 還原賓語前置倒裝句
      columns: [步驟, 句子1, 句子2]
      rows:
        - [倒裝句, 牡 丹 之 愛, 唯 利 是 圖]
        - ['1.去助詞', 牡 丹 之 愛, 唯 利 是 圖]
        - ['2.助詞前後的賓語、動詞換位子', 愛  牡丹, 圖  利]
        - ['3.有副詞就補(虛線表示)', '', 唯 圖 利]
        - ['4.理解句意', 愛牡丹, 只 貪圖 利益]
      rows_note: |-
        「1.去助詞」那一列原稿是把助詞（之／是）打叉刪除，刪除線是圖形、文字仍完整；
        「2.」那一列的換位子箭頭也是圖形。這裡照文字層原樣列出，箭頭與刪除線不轉錄成文字。
    - type: guide
      text: |-
        透過以上的說明，你是否對還原「賓語前置的倒裝句」更有信心了呢?
        你想挑戰看看：自己解開語序顛倒的文字密碼嗎？以下的題目，請務必嘗試看看。

    - type: guide
      text: 二、輕練習
    - type: exercise
      instruction: (一)選一選。下列都是倒裝句，請選出還原後的句子。
      items:
        - {type: single, index: 1, stem: '「何陋之有」 A陋何有 / B有何陋', answer: B, teacher_note: '第1題解析。何陋之有：原形「有何陋」。有什麼簡陋?'}
        - {type: single, index: 2, stem: '「馬首是瞻」 A馬瞻首 / B瞻馬首', answer: B, teacher_note: 第2題解析。古代打仗時，士兵看主將的馬頭方向來決定前進或停止，後來就以「瞻(看)馬首」比喻聽從帶頭者的指揮。}
        - {type: single, index: 3, stem: '「何難之有」 A有何難 / B何難有', answer: A}
        - {type: single, index: 4, stem: '「唯你是問」 A問唯你 / B唯問你', answer: B, teacher_note: 第4題解析。唯你是問：原形「唯問你」。有什麼事的話，只問你(的責任)。}
        - {type: single, index: 5, stem: '「何懼之有」 A有何懼 / B何有懼', answer: A}
        - {type: single, index: 6, stem: '「唯利是圖」 A 圖唯利/ B唯圖利', answer: B, teacher_note: 第6題解析。唯利是圖：原形「唯圖利」。某人只貪圖利益。}
      teacher_note_carrier: 深藍色（C:156082）文字方塊，印在題目右側；第 3、5 題沒有解析
    - type: guide
      text: (二)寫一寫。先還原倒裝句，再依還原句及語境圈出適當的意思解釋。
    - type: sub_block
      label: 寫一寫 1
      value: |-
        1.韓愈說他很小的時候就失去父母，對父母沒有印象，「唯兄嫂是依」。
        「唯兄嫂是依」句子還原 → 唯【　】
        意思：只能【　】哥哥、嫂嫂生活。
      blanks:
        - {answer: 依兄嫂}
        - {answer: 依靠}
      options_printed: {1: 依靠, 2: 依然}
      answer_carrier: 還原句是橘色手寫（字元樣式 aff6）；意思那一格是**橘色圈選**（roundRect FF9900，0.48×0.33in）圈住「依靠」
    - type: sub_block
      label: 寫一寫 2
      value: |-
        2.孔子說：當父母的人「唯其疾之憂」。所以，子女愛護身體，不生病，就是孝順。
        「唯其疾之憂」句子還原 →【　】
        意思：唯一【　】的是孩子生病。
      blanks:
        - {answer: 唯憂其疾}
        - {answer: 憂心}
      options_printed: {1: 解憂, 2: 憂心}
      teacher_note: 第2題：「解憂」，解除煩憂，與「孩子生病」的語境矛盾。
      answer_carrier: 還原句橘色手寫；意思那一格是橘色圈選（roundRect FF9900）圈住「憂心」
    - type: sub_block
      label: 寫一寫 3
      value: |-
        3.劉蓉讀書時習慣邊走邊思考。房間有個窪坑，劉蓉常被絆倒卻不理會，時間久了竟也習慣了。他的父親看到後指正他：「一室之不治」，將來還談什麼治理國家？劉蓉這才領悟到習慣對人的影響有多深。
        「一室之不治」句子還原 →【　】
        意思：不能【　】好一個房間。
      blanks:
        - {answer: 不治一室}
        - {answer: 管理}
      options_printed: {1: 管理, 2: 醫治}
      answer_carrier: 還原句橘色手寫；意思那一格是橘色圈選（roundRect FF9900）圈住「管理」

# ── 五 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（字元樣式 aff6，色 E97132），文字流有此資訊
  stray_marks_note: 標題附近有兩個橘色「✓」字元（字元樣式 af），不在任何題號上、也不對應任何一題，照原稿記錄，不當成答案
  teacher_note_carrier: 深藍色（C:156082）文字方塊，印在題目右側；第 1、3 題沒有解析
  questions:
    - index: 1
      answer: B
      stem: 根據文章，魯梁國君下令全民生產綈，最直接的原因是什麼？
      options: {A: 綈的製作簡單, B: 齊國高價收購, C: 國內糧食不足, D: 人民喜歡穿綈}
    - index: 2
      answer: C
      stem: 根據本文，下列哪一組因果關係正確？
      options:
        A: 齊國禁止與魯梁通商，造成綈的需求增加
        B: 魯梁全民生產綈，經濟繁榮也帶動農業發展
        C: 魯梁荒廢農業，導致糧食不足
        D: 齊國改穿帛，直接讓魯梁增加獲利。
      teacher_note: 第2題解析：A.因齊國不與魯梁通商，也不買綈，所以綈的需求會下降。B.因全民生產綈，無人務農，所以農業停滯。C.因齊國的需求是「帛」，而魯梁只生產綈，所以齊國的新政策會讓魯梁賺不到錢。
      teacher_note_placement_note: 這個解析的文字方塊在版面上印在第 1 題右側，但內容講的是第 2 題（原稿如此）
    - index: 3
      answer: B
      stem: 下列哪一現代經濟行為，可能導致與魯梁相同的結果？
      options:
        A: 分散生產不同商品，並拓展多個市場
        B: 集中生產單一商品，並依賴單一市場
        C: 改良國內生產技術，提升產品品質
        D: 降低對外市場依賴，增加國內需求
    - index: 4
      answer: B
      stem: 根據本文，下列何者最能說明「經濟戰」的特點？
      options:
        A: 購買高價武器，直接攻打
        B: 利用價格與供需控制對方
        C: 依靠外交人才進行談判
        D: 利用流行文化，賺別國的錢
      teacher_note: 第4題：D，經濟戰通常帶有敵意、強制性與破壞性，而流行文化的輸出是消費者自願的選擇，因而不屬於經濟戰範圍。依賴流行文化賺錢，稱為「軟實力」。
    - index: 5
      answer: A
      stem: 孔子到楚國，看見一位捕蟬的老人，一抓一個準。孔子問他有什麼訣竅?他說：「雖天地之大，萬物之多，而唯蟬翼之知。吾不反不側，不以萬物易蟬之翼，何為而不得？」根據老人的話，什麼是他抓蟬率高的原因？
      options:
        A: 用心專一，集中精神
        B: 蟬的棲息地大，數量也多
        C: 熟能生巧，閉著眼都抓得到
        D: 了解蟬的習性，抓住翅膀就能手到擒來
      teacher_note: 第5題解析：由「唯蟬翼之知」可知。老人說：「(我捉蟬時)不管天地之大，萬物之多，我只看見蟬的翅膀；我身體不動，眼睛不側視，不用世界交換蟬的翅膀，能做到這一步，還怕捉不到蟬嗎？」

# ── 六 自我挑戰 ──
self_challenge:
  optional_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_banner: ❶斷句 ⭢❷找動詞/形容詞 ⭢❸找/補主語 ⭢❹用自己的話說一說
  strategy_banner_note: 箭號是**字面字元「⭢」（U+2B62）**，不是 `→` 也不是 `w:sym`；依規則保留原樣、不斷行
  passage: 弈秋，通國之善弈1者也。使弈秋誨二人弈，其一人專心致志，惟弈秋之爲聽；一人雖聽之，一心以爲有鴻鵠將至，思援弓繳2而射之。雖與之俱學，弗若3之矣。爲是其智弗若與？曰：非然也。(91基二)
  annotations:
    - {index: 1, term: 弈, text: 下(圍)棋。}
    - {index: 2, term: 繳, text: ㄓㄨㄛˊ，繫在箭尾的絲繩，便於尋找射中的獵物或回收箭枝。}
    - {index: 3, term: 弗若, text: 不如。}
  annotations_marker_note: 注釋清單前印一個 `w:sym Wingdings F026` 的書本圖示，不是文字
  translation: 弈秋是全國最會下棋的人。讓弈秋教兩個人下棋，其中一人專心學習，只聽弈秋的教導；另一人雖然也聽課，卻一心以為有大鳥要飛來，總想著要拉弓射鳥。雖然他跟那個專心學棋的人一起學習，棋力卻不如人。是因為他的智力不如人家嗎?(我)說：不是這樣的。
  translation_carrier: 深藍色（C:156082）文字方塊，印在文章右側
  part_one:
    label: （一）請依照故事脈絡，回答下列問題。
