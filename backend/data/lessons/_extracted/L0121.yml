# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 性別平等——辨識界線、安全回應、支持他人
  strategy_type: character_education
  section_title_printed: 品格聚光燈
  answer_carrier: |-
    是非題答案是 w:sym Wingdings 2 的 F081（○）與 F0CF（×），在文字層；
    綜合練習與閱讀理解的代號是橘色手寫，也在文字層。PDF p7~p9 全部可見。
  blocks:
    - type: concept_box
      text: |-
        性別平等──辨識界線、安全回應、支持他人
        每個人都有身體自主權，也有權決定自己的身體界線。界線不只和碰觸有關，也包括凝視、言語、玩笑、照片、影片及網路訊息。
        這份學習單要練習三個可以運用在不同情境中的能力：
        一、辨識界線：看行為是否得到同意、是否必要、是否使人感到不受歡迎或不舒服。
        二、安全回應：以安全為先，能拒絕時說不、離開現場，並向可信任的人求助。
        三、支持他人：傾聽、不責怪、不轉傳，尊重當事人的選擇，協助尋求支援。

    - type: guide
      text: 本單元延續課文中身體自主權、尊重界線、不是你的錯等核心概念，以下活動是一般性的界線與安全判斷練習。練習完成請根據後面的答案給自己評分，並思考自己有什麼學習。

    # ── 一、辨識界線 ──
    - type: guide
      text: 一、辨識界線
    - type: guide
      text: （一）說明：
    - type: table
      columns: [判斷問題, 想一想……]
      rows:
        - [有沒有同意？, 對方是否清楚、自主地表示願意？沉默、僵住或沒有反抗，不代表同意。同意也可以隨時改變。]
        - [行為是否必要？, 例如醫療、救援或運動指導中的碰觸，是否確有必要？是否事先說明、尊重意願並保護隱私？]
        - [對方是否不舒服？, 對方是否已說不、退開、沉默、表情僵硬，或表示不受歡迎、被冒犯？有疑慮時應先停止並確認。]
    - type: exercise
      instruction: （二）是非題（在判斷中學習；正確的打○，錯誤的打×）：
      option_bank: {1: ○, 2: ×}
      format_note: 學生在題號前的括號裡寫○或×，不是勾選框；option_bank 用的兩個符號就是指示語印的那兩個
      items:
        - {type: single, index: 1, prompt: 對方沉默或沒有把手推開，就可以當成他已經同意。, answer: 2}
        - {type: single, index: 2, prompt: 對方上次同意擁抱，不代表這一次也同意；同意可以隨時改變。, answer: 1}
        - {type: single, index: 3, prompt: 即使是好友、家人或交往對象，也要尊重對方的身體界線。, answer: 1}
        - {type: single, index: 4, prompt: 醫療或救援中的碰觸只要具有專業目的，就完全不必說明或尊重對方的感受。, answer: 2}
        - {type: single, index: 5, prompt: 感到不舒服是值得重視的警訊；至於是否構成法律上的性騷擾，還要考量完整情境。, answer: 1}

    # ── 二、安全回應 ──
    - type: guide
      text: 二、安全回應
    - type: guide
      text: |-
        （一）說明：如果你遇到讓你不舒服的言語或行為時，底下是幾個讓自己比較安全的回應原則：
        第一：安全比當場爭辯更重要。
        第二：適度反應：表達你不喜歡、要求停止；也可以離開現場、前往有人可協助的地方、向可信任的人求助、保留相關紀錄。
        第三：事後反思：發生性別平等事件時，每人的反應都可能不同。有人會立刻拒絕，有人可能嚇得說不出話。但當下沒有反抗，不代表同意，也不是當事人的錯。
    - type: exercise
      instruction: （二）是非題（在判斷中學習；正確的打○，錯誤的打×）：
      option_bank: {1: ○, 2: ×}
      items:
        - {type: single, index: 6, prompt: 遇到越界行為時，一定要立刻大聲反抗，否則就表示自己同意。, answer: 2}
        - {type: single, index: 7, prompt: 在安全的情況下，可以清楚說：「我不喜歡，請停止。」並離開現場。, answer: 1}
        - {type: single, index: 8, prompt: 如果對方利用身分、權力或利益威脅你，先離開並尋求協助，通常比單獨和對方爭辯安全。, answer: 1}
        - {type: single, index: 9, prompt: 收到讓人不舒服的網路訊息時，最好立刻刪除所有內容，不留下任何紀錄。, answer: 2}
        - {type: single, index: 10, prompt: 遇到事情時因害怕而僵住或說不出話，不代表同意，也不是自己的錯。, answer: 1}

    # ── 三、支持他人 ──
    - type: guide
      text: 三、支持他人
    - type: guide
      text: |-
        （一）說明：
        如果你的朋友願意跟你說出不舒服的經驗，可能已經鼓起很大的勇氣。支持她或他時，請記住：先傾聽，不責怪；不任意追問，不公開轉傳；詢問對方需要什麼協助，尊重他的選擇。
        不必急著問「為什麼不早點說」、「為什麼不反抗」，也不要自行把他的經驗告訴其他同學。如果對方有立即的安全危險，應協助尋找可信任的成人或專業支援，不宜只由學生獨自承擔。
    - type: exercise
      instruction: （二）是非題（在判斷中學習；正確的打○，錯誤的打×）：
      option_bank: {1: ○, 2: ×}
      items:
        - {type: single, index: 11, prompt: 對朋友說「你為什麼不早點說」或「你為什麼不反抗」，可能使他感到被責怪。, answer: 1}
        - {type: single, index: 12, prompt: 為了確定朋友說的是真是假，應先要求他詳細交代所有經過，再決定是否支持他。, answer: 2}
        - {type: single, index: 13, prompt: 未經當事人同意，不應把他的姓名、經驗、訊息或截圖轉傳給其他人。, answer: 1}
        - {type: single, index: 14, prompt: 即使朋友目前有立即危險，也應答應永遠不告訴任何人，才算尊重朋友。, answer: 2}
        - {type: single, index: 15, prompt: 支持朋友時，應尊重他何時、向誰求助的選擇；但若有立即危險，應協助尋找可信任的成人。, answer: 1}

    - type: table
      title: 是非題解答與說明
      columns: [題號, 答案, 說明]
      answer_carrier: 符號照原稿印的抄；➜ 是 w16se:symEx（Segoe UI Emoji U+2192）
      conflict_note: |-
        第 14、15 條的符號與上面是非題那一側**對不上**（見 source_errata E1）：
        解答印 14「○」15「×」，是非題印 14「×」15「○」。其餘 13 條兩側完全相符。
        本欄照解答框原樣記錄，不擅自對齊；answer 以是非題那一側為準（說明文字也支持那一側）。
      rows:
        - ["1", ×, 沉默、僵住、沒有反抗，都不能直接當成同意。]
        - ["2", ○, 同意只適用於當時的特定行為，也可以隨時改變。]
        - ["3", ○, 關係親近者仍不可以忽略身體界線。]
        - ["4", ×, 專業上的碰觸仍應儘可能先說明、取得同意。]
        - ["5", ○, 不舒服是重要警訊，但法律判斷仍須考量言行內容、情境及雙方關係等因素。]
        - ["6", ×, 是否能當場反抗，會受驚嚇、權力差距及安全情況影響；沒有反抗不等於同意。]
        - ["7", ○, 安全時可以明確拒絕，也可以直接離開。]
        - ["8", ○, 面對威脅或權力不對等，優先保護安全並尋求支援。]
        - ["9", ×, 訊息、截圖或時間紀錄日後可能有助於說明經過。]
        - ["10", ○, 僵住是人在害怕或驚嚇時可能出現的反應，不是當事人的錯。]
        - ["11", ○, 這類問題容易讓當事人感到自己被責怪，形成二度傷害。]
        - ["12", ×, 支持的第一步是傾聽與接住，不是審問或自行判案。]
        - ["13", ○, 不轉傳是尊重隱私，也是避免二度傷害。]
        - ["14", ○, 不宜承諾「無論如何都保密」；若有安全風險，應說明並一起找可信任的成人。]
        - ["15", ×, 尊重當事人的選擇；有立即危險時，則應協助尋找成人支援。]

    # ── 四、綜合練習 ──
    - type: guide
      text: 四、綜合練習
    - type: passage
      paragraphs:
        - 社團幹部阿哲多次私訊小芸，評論她的身材，並傳送帶有性意味的貼圖。小芸回覆：「我不喜歡，請停止。」阿哲仍繼續傳送，還說：「只是開玩笑，你太認真了。」小芸保留了訊息，並把事情告訴同學雅雯。
    - type: single
      index: 1
      prompt: 哪一項最能說明阿哲已越過小芸的界線？
      options:
        A: 阿哲是社團幹部
        B: 小芸已清楚表示不喜歡，阿哲仍持續傳送
        C: 兩人使用網路聊天
        D: 小芸沒有立刻封鎖阿哲
      answer: B
    - type: single
      index: 2
      prompt: 小芸接下來採取哪一種做法較安全？
      options:
        A: 約阿哲到兩人獨處的空間，要求道歉
        B: 刪除訊息，大事化小，小事化無，當作沒有發生
        C: 把訊息傳給所有同學，請大家公評，看誰有道理
        D: 保留紀錄、封鎖或檢舉帳號，並向可信任的成人求助
      answer: D
    - type: single
      index: 3
      prompt: 雅雯怎麼回應最能支持小芸？
      options:
        A: 「你怎麼現在才說？說不定他真的是開玩笑。」
        B: 「你是不是也回了什麼，才讓他誤會？」
        C: 「謝謝你告訴我，我不會傳出去。你希望我怎麼幫你？」
        D: 「我先把截圖傳給大家，請大家一起判斷。」
      answer: C

# ── 七 閱讀理解 ──
comprehension:
