    - {index: 7, stem: 每個人都有身體（  ），別人不能隨便碰觸或強迫。, answer: H}
    - {index: 8, stem: 性騷擾常發生在沒有旁人在場的地方，因此受害者往往難以（  ）。, answer: G}

