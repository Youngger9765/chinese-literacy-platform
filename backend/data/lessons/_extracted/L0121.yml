# ── 一 讀全文-做記號 ──
body:
  title_line: 第23課  #MeToo運動與我們的權利
  paragraph_count: 12
  paragraphs_note: |-
    段號欄印 一~十二 共 12 個。四個分節小標（#MeToo運動的起源／臺灣的#MeToo運動／
    不是你的錯，可以安心求助／身體自主權，從尊重界線開始）不佔段號，另存 inline_headings。
    ⚠️ 第 4 段在 DOCX 裡被拆成兩個 <w:p>（「…這個運動不僅關」＋「注女性，也強調男性也可能受害。」），
    那是為了讓文字繞過旁邊的小知識方框，不是兩段；v2 把它算成兩段。本檔併回一段。
  paragraphs:
    - idx: 1
      text: 近年「#MeToo」一詞受到社會大眾的關注和討論，究竟「#MeToo」是什麼？和我們又有什麼關係呢？
    - idx: 2
      text: 2006年，有位少女向社會運動人士伯克（T. Burke）傾訴她遭到性侵犯，伯克當時不知如何回應才好。後來伯克想到在網路平台使用「Me Too」（我也是）一詞，透過同理心的話語，讓受害女性知道她們並不孤單，幫助受害者逐步走出陰霾。
    - idx: 3
      text: 2017年，媒體披露好萊塢製片人溫斯坦（H. Weinstein）長期性侵多名演員，引發社會一片譁然。當時女演員米蘭諾（A. Milano）在推特（Twitter）上便使用「#MeToo」，分享自己的受害經驗，之後又有許多演員也陸續站出來，揭露他的加害行為。這個事件引發廣大迴響，#MeToo很快在網路社群傳播開來，成為全球的運動，不但串連受害者，同時呼籲大眾不要對性騷擾和性侵犯保持沉默。
    - idx: 4
      text: '#MeToo運動也在2018年傳到臺灣。2023年一連串的性騷擾事件被揭露，當年上映的影集《人選之人——造浪者》中，一句「我們不要就這樣算了，好不好？」的台詞更引爆了話題，許多受害者開始在社群媒體揭露自己遭受的性騷擾或性侵犯，讓人意想不到的是，原本最受信賴的師長、親友也可能是加害者；政界、文化界與演藝圈也陸續出現揭露，讓各界震驚不已。這個運動不僅關注女性，也強調男性也可能受害。'
    - idx: 5
      text: 「勇敢站出來」並不是一件容易的事。
    - idx: 6
      text: 性犯罪常發生在隱密的空間，這讓受害者難以舉證。有些受害者也擔心一旦說出來，自己會成為大眾茶餘飯後的八卦話題，甚至被指責「為什麼不早點說」、「為什麼不反抗」、「你自己也有問題吧」……這些都會造成受害者的二度傷害。
    - idx: 7
      text: 再者，不少加害者和被害者處於「權力不對等」的關係，例如導演與演員、上司與部屬、明星與粉絲、老師與學生、長輩與晚輩等。處於權力優勢位置的人，可能以愛護或關心的方式接近對方，使人一開始難以察覺界線已被越過；而處於權力弱勢位置的受害者，可能擔心說出來會被報復，或是不被相信。
    - idx: 8
      text: '#MeToo運動讓飽受身心創傷的受害者有了支持的後盾，更重要的是，開始扭轉社會對性侵犯受害者的偏見，讓受害者知道「這不是你的錯」，進一步打造「安心說出來」的友善社會，讓受害者有機會獲得療癒，也讓有加害意圖的人有所忌憚。'
    - idx: 9
      text: 另一方面，#MeToo運動喚起社會大眾對「身體自主權」的重視，意思是「我的身體是我自己的」。每個人都有權利決定，別人可以在什麼情況下碰觸或凝視自己的身體，也有權保護自己的界線不受侵犯；這個界線就是「身體界線」。
    - idx: 10
      text: 身體界線會因為對象、情境、時間而有所不同。例如，你可以接受教練在比賽剛結束時緊緊擁抱你，但平時或獨處時，不行！你可以接受車廂上擁擠時被陌生人碰到身體，但緊貼著，不行！你可以接受穿著露腰的服裝被大家欣賞，但一直盯著你的腰部看，不行！你可以接受朋友間開玩笑，但開黃腔，不行……！這些讓你有一絲不舒服或有片刻猶豫的感覺，不要輕輕放過，你可以大聲拒絕或離開現場，不需要對誰感到抱歉。
    - idx: 11
      text: 同樣的，我們也要尊重別人的身體自主權，沒有取得對方同意，就碰觸、凝視，或對對方說出使其不舒服的話，都是一種冒犯。如果發現自己的行為讓對方不舒服，應立即停止、真誠道歉，並尊重對方後續的選擇。
    - idx: 12
      text: 總之，#MeToo運動讓受害者打破沉默，也帶動大眾身體自主權的覺醒，提醒每個人都有責任創造一個安全和彼此尊重的環境。
  inline_headings:
    - {after_paragraph: 1, text: '#MeToo運動的起源'}
    - {after_paragraph: 3, text: 臺灣的#MeToo運動}
    - {after_paragraph: 4, text: 不是你的錯，可以安心求助}
    - {after_paragraph: 8, text: 身體自主權，從尊重界線開始}
  sidebar:
    title: 《小知識：為什麼寫成#MeToo？》
    placement_note: 印在第 4 段旁的方框（PDF p2 上半），課文繞著它排版
    paragraphs:
      - 你會不會感到奇怪，為什麼「Me Too」兩個字要合併為一個詞：MeToo，前面還加上「#」符號？
      - 這是因為在社群網站上，「#」代表「標籤」，用來標記特定主題，加了「#」的詞彙，就會變成可點擊的鏈結，其他人只要點擊該標籤，就能看到所有包含相同標籤的內容，達到串連的效果，而不含空格的單詞「MeToo」也更容易被搜尋。
      - 總之，「#MeToo」的格式一方面是為了技術上的方便，另一方面也是為了在社群媒體上建立一個強大且一致的運動標識。
  inline_marked_terms: [陰霾, 一片譁然, 鏈結, 標識, 舉證, 茶餘飯後, 有所忌憚, 凝視, 自主權, 冒犯]

