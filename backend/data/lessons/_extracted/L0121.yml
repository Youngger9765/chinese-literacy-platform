      answer: C
      stem: 下列語詞何者使用錯誤?
      options:
        A: 八卦新聞常是大家「茶餘飯後」聊天的話題
        B: 這件賄選案一經媒體披露，輿論「譁然」
        C: 他奉公守法，常幫助別人，絲毫不「忌憚」
        D: 開黃腔容易「冒犯」別人，使人不舒服
      teacher_note: 前後邏輯錯誤
