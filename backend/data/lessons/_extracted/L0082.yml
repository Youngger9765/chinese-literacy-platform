  lesson_heading: 第14課  從〈螞蟻與蟋蟀〉看生命的多樣性
  paragraph_count: 8
  paragraphs:
    - idx: 1
      text: 我喜歡觀察螞蟻工作的樣子。牠們往往集體出動，排著長長的隊伍，合力搬運食物，行動有紀律、有秩序。螞蟻的嗅覺一流，再微弱的甜味都逃不過牠們的好鼻子，只要糖罐、蜜瓶之類的東西沒收好，不久就會引來螞蟻大軍。
    - idx: 2
      text: 螞蟻雖然身軀小，卻有驚人的力氣，能夠扛起自己重量數十倍的食物。牠們是社會性昆蟲，分工嚴密。整個蟻群的核心是蟻后，所有的螞蟻都為了一個共同的目標——協助蟻后繁衍後代。工蟻日夜奔波，冒著生命危險外出覓食，都是為了延續蟻群的生命。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 3
      text: 從生物行為的角度來看，螞蟻的合作延續蟻群的生存，而蟋蟀則透過競爭爭取繁衍的機會。
    - idx: 4
      text: 夏秋時節最容易發現蟋蟀的蹤影，草叢與灌木間常傳來一聲聲「唧唧」的蟲鳴，此起彼落、忽遠忽近，正是蟋蟀在大自然的舞台上放聲高歌。但你知道嗎？這些會發出鳴叫聲的都是雄蟋蟀呢！
    - idx: 5
      text: 原來，蟋蟀高歌是為了求偶，雄蟋蟀會摩擦前翅，發出清脆的鳴聲，就像在演奏情歌，吸引女朋友的注意；有時也用鳴聲警告其他雄蟋蟀不要靠近地盤、不要來爭奪女朋友。雌蟋蟀最終會選擇鳴聲最吸引她的雄蟋蟀作為伴侶，進而交配，繁殖下一代。
    - idx: 6
      text: 了解蟋蟀的行為，就會知道牠們的高歌不是娛樂，而是競爭——牠們透過歌聲吸引雌蟋蟀，爭取繁衍的機會。螞蟻是全體合作協助蟻后繁殖，蟋蟀顯然不同，每隻雄蟋蟀都要爭取自己的交配機會，「蟀哥」間充滿了競爭。
    - idx: 7
      text: 蟋蟀和螞蟻並列比較，起源於《伊索寓言》。在寓言故事裡，蟋蟀是一隻鎮日高歌，不知貯糧的天兵，到了冬天只好向螞蟻伸手乞求，顯得懶惰又沒骨氣。然而，仔細了解後，我們會發現，蟋蟀的高歌與螞蟻的存糧一樣，都是生物遵循本能的行動。螞蟻藉由合作延續蟻群的生命；蟋蟀則透過競爭，延續自己的基因。
    - idx: 8
      text: 生命的多樣性體現在這些不同的生存策略中。我們看待事物時，如果只從自己的角度出發，很容易得出片面的結論。螞蟻可能覺得蟋蟀荒廢正業，蟋蟀也可能認為螞蟻缺乏情趣，但其實牠們的行為背後都有著共同的目的——延續生命。《伊索寓言》為了達到教育兒童的目的，把人類用來判斷行為好壞的道德標準強加在小昆蟲身上，真是委屈牠們了。
