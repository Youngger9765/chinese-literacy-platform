          value: 螞蟻藉由【　】，來達成【　】的需求；蟋蟀則透過【　】，延續自己的基因。
          blanks: [{answer: 合作}, {answer: 群體繁衍}, {answer: 競爭}]
    - label: 作者提醒
      value: 人們看待事物時，不要只從自己的角度出發，否則很容易得出【　】的結論。
      blanks: [{answer: 片面}]

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 用表格整理訊息——依比較項目找看出異同
  strategy_name_errata_ref: E1
  strategy_type: table_organize
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  blocks:
    - type: concept_box
      text: |-
        上一課〈女性太空人登月〉中，我們學會把兩個對象的細節放進表格，並從細節歸納出「比較項目」。這一課要再往前一步：把同一個比較項目的內容放在同一列，一列一列比較，找出相同與不同。
        祕訣：同一列，才可以比。
        在「女性太空人登月」，我們已經學過整理表格的步驟：
        ❶找比較對象：這張表要比較哪兩個對象？把它們寫在表格對象列。
        ❷找同列細節：找出同一列中比較對象可以互相比較的各個細節。
        ❸問比較項目：把各細節放一起，問：「它們都在說哪一個項目？」
        ❹填入並檢查：把比較項目和文章細節填進同一列，確認兩格都在回答同一個項目。

    - type: table
      note: 說明框裡的空白範例表（示範表格長什麼樣，沒有本課內容）
      columns: [項目           　　 對象, 對象１, 對象２]
      rows:
        - [比較項目１, 文章細節, 文章細節]
        - [比較項目２, 文章細節, 文章細節]

    - type: guide
      text: 現在就讓我們利用本課文章來練習看看吧！

    - type: guide
      text: ◎小試身手：

    - type: fill_table
      prompt: |-
        1.請依照上面的步驟，完成以下的表格。
        （項目主題參考：行為模式、行為背後的共同目的、生存目標）
      columns: [項目, 螞 蟻, 蟋蟀, 異同比較]
      header_note: |-
        原稿表頭第一格是斜分格「對象／項目」，第三格是要學生填的【　】（答案：蟋蟀），
        本檔把欄名寫成 columns，蟋蟀那格的答案記在 header_blanks。
      header_blanks: [{column: 蟋蟀, answer: 蟋蟀}]
      rows:
        - 項目: 行為模式
          螞 蟻: ""
          螞 蟻_options: {1: 合作, 2: 競爭}
          螞 蟻_answer: 1
          蟋蟀: ""
          蟋蟀_options: {1: 合作, 2: 競爭}
          蟋蟀_answer: 2
          異同比較: ""
          異同比較_options: {1: 相同, 2: 不同}
          異同比較_answer: 2
        - 項目: ""
          項目_options: {1: 延續生命的方式, 2: 同類競爭的方式}
          項目_answer: 1
          螞 蟻: 合作協力幫助蟻后繁衍後代
          蟋蟀: 雄蟋蟀彼此競爭，爭取交配機會
          異同比較: ""
          異同比較_options: {1: 相同, 2: 不同}
          異同比較_answer: 2
        - 項目: 行為背後的【　】
          項目_blanks: [{answer: 目標/目的}]
          螞 蟻: ""
          螞 蟻_options: {1: 延續生命, 2: 爭取最多資源}
          螞 蟻_answer: 1
          蟋蟀: ""
          蟋蟀_options: {1: 延續生命, 2: 爭取最多資源}
          蟋蟀_answer: 1
          異同比較: ""
          異同比較_options: {1: 相同, 2: 不同}
          異同比較_answer: 1
        - 項目: 人類強加的【　】
          項目_blanks: [{answer: 道德標準}]
          螞 蟻: 【　】
          螞 蟻_blanks: [{answer: 勤勞節儉}]
          蟋蟀: 懶惰、沒骨氣、天兵
          異同比較: ""
          異同比較_options: {1: 相同, 2: 不同}
          異同比較_answer: 2

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: D
      stem: 下列文句中的語詞，何者使用正確？
      options:
        A: 這家工廠每天都「繁衍」上千個零件
        B: 他在網路上四處「求偶」，希望找到事業的夥伴來
        C: 他只讀了十分鐘，卻說自己「鎮日」用功
        D: 這幅畫「體現」了藝術家對大自然的熱愛和敬畏
      explanation: 第1題解析：(Ａ「繁衍」指的是生物的繁殖或延續。Ｂ將求偶用於人類社交場合的情境，語境不符。Ｃ「鎮日」通常形容的是固定的長時間行為，不適用於變動的旅行行為。)
      explanation_note: 原稿是一個浮動說明框，PDF p6 上整片疊在題幹與大題指示語上，幾乎讀不出來；文字層完整
    - index: 2
      answer: B
      stem: 文章第二段指出，螞蟻和蟋蟀的行為背後有什麼共同目的？
      options:
        A: 都是為了儲存食物
        B: 都是為了延續生命
        C: 都是為了避免天敵
        D: 都是為了獲得娛樂
      stem_note: 題目寫「第二段」，但螞蟻與蟋蟀行為的共同目的實際印在第 8 段（第 2 段只講螞蟻）。照原稿記錄，未更動。
    - index: 3
      answer: C
      stem: 作者寫「螞蟻可能覺得蟋蟀荒廢正業，蟋蟀也可能認為螞蟻缺乏情趣，但行為背後可能都有共同的目的」，主要想提醒讀者什麼？
      options:
        A: 生物行為不同，就不可能有共同目的
        B: 螞蟻和蟋蟀應改變行為，符合彼此期待
        C: 只從自己的角度看事物，容易形成片面結論
        D: 螞蟻和蟋蟀的行為都不符合生存需求
    - index: 4
      answer: A
      stem: 作者認為《伊索寓言》的做法有什麼問題？
      options:
        A: 為了教育兒童，把人類的道德標準加在昆蟲身上
        B: 讓昆蟲像人一樣說話，使故事缺少科學的真實感
        C: 作者為蟋蟀打抱不平，高歌行為並沒有對錯
        D: 強調昆蟲的個體行為，忽略了群體行為的重要性
      explanation: 第4題解析：(作者批判的是過度簡化昆蟲行為，讓人們以「美德 vs. 惡習」的二元對立方式去理解，而忽視了昆蟲行為背後共同的生物學目的—延續生命。)
      explanation_note: 原稿是一個浮動說明框，印在第 2 題選項右側
    - index: 5
      answer: C
      stem: 「如果只從自己的角度出發，導致片面結論，常會因此失去對事物多元客觀的理解。」下列情況，哪一個不是片面的結論？
      options:
        A: 看到一些畫家收入不高，便認定「藝術不能當飯吃」
        B: 認為孩子只有在學校名列前茅，未來才有可能成功
        C: 認為遊民未必懶惰，也許他們遭遇了不得已的困境
        D: 認為穿粉紅色衣服的男生，有女性化的傾向
      explanation: (A、B、D 都以單一的主觀價值或標準評斷，缺乏對文化背景、行為目的或多元價值的理解。)
      explanation_note: 原稿是一個浮動說明框，PDF p7 上壓在選項 D 上方
      options_note: PDF p7 上選項 D 被中間一個裝飾圖框擠到下方，看起來像脫隊；文字層順序正常

