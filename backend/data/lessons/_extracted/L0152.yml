      value: 兩封西元前225年秦國滅楚大戰時的【　】揭露了一個家庭的悲劇。這個家庭有兄弟3人，大哥衷在家贍養母親，20歲的二弟驚和17歲的三弟黑夫都在前線征戰。
      blanks: [{answer: 家書}]
    - label: 家書一
      items:
        - label: 信件內容
          value: |-
            1.是【　】寫給大哥的。
            2.現被困在淮陽，生死難料。
            3.缺乏【　】，要母親寄衣服或【　】。
            4.詢問官府有沒有落實【　】。
          blanks: [{answer: 三弟/黑夫}, {answer: 夏衣}, {answer: 錢}, {answer: 獎勵}]
        - label: 作者判斷
          value: |-
            1.秦國服役早而重。
            2.服役是【　】，沒有兵餉，連衣物都要自己準備。
            3.秦王統一大業，卻將戰爭成本【　】到底層民眾身上。
          blanks: [{answer: 義務}, {answer: 轉嫁}]
    - label: 家書二
      items:
        - label: 信件內容
          value: |-
            1.是【　】寫給大哥的。
            2.因沒收到錢物，明確要【　】和【　】。
            3.兄弟倆現在【　】過活，再不還錢就要死了。
            4.擔心自己的妻子，要她不要到太遠的地方撿柴火。
          blanks: [{answer: 二弟/驚}, {answer: 錢}, {answer: 布料}, {answer: 借錢}]
        - label: 作者判斷
          value: |-
            1.兄弟跟家人要的錢並不多，一般家庭應該都能承受。
            2.如果有錢，一定不會吝嗇給在前線家人，沒給錢的原因只可能是【　】。
            3.他們並非底層人家，卻拿不出十件夏衣的救命錢。
            4.由此可知秦國年年征戰，對底層民眾層層【　】。
          blanks: [{answer: 沒錢}, {answer: 剝削}]
    - label: 結果
      value: 兩兄弟最終【　】，只有如此大哥才會把兩個弟弟的家書作為陪葬品。從這裡可以看出哥哥心裡的悲傷和【　】。
      blanks: [{answer: 戰死/死了}, {answer: 歉疚}]
    - label: 詰問
      value: 知道這個家庭的命運後，你還想成秦國的子民嗎？
      note: 這一格沒有空格，是給學生思考的提問；「還想成秦國的子民嗎」原稿缺一個「為」字，未改。
  rows_note: |-
    「家書一」「家書二」各是一個 vmerge 合併儲存格，底下橫跨「信件內容」「作者判斷」
    兩欄的子列，故用 items 表達。兩組的欄位標題（信件內容／作者判斷）在原稿各印一次。

# ── 六 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 分辨事實與判斷
  strategy_type: fact_vs_judgment
  answer_carrier: |-
    橘色文字（字元樣式 rStyle=af，run 層無 w:color）為主；
    基礎題第 (6) 題與挑戰題 5 題的 O/X 是紅色（run 層 w:color=FF0000）。
    本課無任何 ☑。
  blocks:
    - type: concept_box
      text: |-
        本篇文章是作者讀完兩封秦朝家書後，結合其他史料，對信中內容做出推論，並在結尾提出自己的看法。
        　　也就是說，文章中的訊息主要有兩大類，第一類是「家書或史料中可以查證真假的訊息（以下稱事實）」，第二類是「作者根據事實做出的推論或看法（以下稱判斷）」。閱讀這樣的文章，如果能分辨哪些是客觀的事實，哪些是作者的判斷，就會有更好的理解。
        　　那麼什麼是事實？什麼又是判斷呢？
        事實：
        可以被驗證真假的訊息。例如，第四段提到黑夫的家書寫著「請母親寄衣物或錢」。這項訊息可以直接從家書中查證，因此是「事實」。
        判斷：
        作者根據文章中的事實，結合自己的知識和經驗所做的推測。例如，作者從黑夫「請母親寄衣物或錢」這個事實，推論秦國士兵沒有兵餉，國家只提供武器和口糧，這就是「作者判斷」。
        接下來讓我們來練習分辨「事實」與「判斷」吧。
      text_note: |-
        「事實：」「判斷：」兩行在 PDF 上前面各印一個「●」項目符號，那是 Word 自動編號
        （numbering.xml），不在文字流裡，故不寫入。

    - type: guide
      text: 1.基礎題：
    - type: guide
      text: 根據這篇文章，以下的文句是事實的請寫上F，是作者判斷的請寫上J。
    - type: guide
      text: ★事實的英文為Fact，判斷的英文為Judgment
    - type: exercise
      option_bank: {F: 事實, J: 作者判斷}
      option_bank_note: |-
        代號含義取自上一行指示語的原文「是事實的請寫上F，是作者判斷的請寫上J」——
        原稿沒有印選項表格，此處只是把指示語裡定義的對應關係結構化，未自創文字。
      answer_carrier: 第 (1)~(5)(7) 題為橘色（字元樣式）；第 (6) 題是紅色 run（w:color=FF0000）
      items:
        - {index: 1, stem: (第三段)文中的家庭有兄弟三人。, answer: F}
        - {index: 2, stem: (第四段)兄弟倆困在淮陽，缺乏夏衣。, answer: F}
        - {index: 3, stem: (第八段)黑夫和驚的母親沒有寄錢給他們。, answer: J}
        - {index: 4, stem: (第十三段)黑夫和驚最終都戰死沙場。, answer: J}
        - {index: 5, stem: (第十三段)大哥失去兩個弟弟後，深感悲傷和歉疚。, answer: J}
        - {index: 6, stem: 大哥的墓中有書寫用品。, answer: F}
        - {index: 7, stem: 大哥能讀書識字，他們不會是社會最底層的家庭。, answer: J}
      items_note: |-
        前五題的段落標註（第三段等）在 PDF 上是上標小字，文字流裡緊接在【　】之後，
        此處保留在 stem 前段。第 (6)(7) 題原稿沒有段落標註。

    - type: guide
      text: 2.進階題：
    - type: guide
      text: 連連看，將「文章中的事實」與「作者判斷」配對。
    - type: matching
      left_header: 文章事實(第幾段)
      right_header: 作者判斷(第幾段)
      left:
        1: 驚的家書中再次催促母親寄錢和布料，並提到兄弟倆借錢過活。(7)
        2: 黑夫的家書中詢問了軍功是否換來爵位。(4)
        3: 驚和黑夫都剛成年，而且家裡有三個兄弟，兩個要上戰場。(3)
        4: 黑夫的家書中請求寄送夏衣或錢財。(4)
      right:
        A: 秦朝的服役早而重。(5)
        B: 底層民眾將希望寄託在軍功和爵位上。(5)
        C: 家裡可能確實沒錢，無法支援前線的兄弟。 (11)
        D: 秦兵的裝備和生活用品需要自備。(5)
      answers_printed: false
      answer_note: |-
        🔴 教師版**沒有畫任何一條連線**，四組配對一組都沒有答案。三條獨立證據：
          ① PDF p8 上八個「●」都在，但一條線都沒有；
          ② 整份 document.xml 只有 **1** 個紅色（srgb FF0000）的 line 圖形；
          ③ 那唯一一條線 `positionV relativeFrom="page"` 的位移是 **−2.197in**
             （頂端在紙面上緣之外），且它是連連看表格裡唯一的錨點 ——
             也就是印不出來的紙外殘留，跟各課那個 rightMargin 的 roundRect 同類。
        依 skill「先在 XML 找紅色 line 再下結論」查過了，結論是**真的沒有連線**，
        不是 LibreOffice 漏畫。⛔ 四組配對在語意上雖然推得出來，但原稿沒印，
        故不填入 answer（硬塞等於編造）。

    - type: guide
      text: 3.挑戰題：
    - type: guide
      text: 文中作者認為秦國將戰爭的成本轉嫁給底層民眾。下列哪些「事實」能支持這個判斷？能支持的畫O，不能的畫X。
    - type: exercise
      option_bank: {O: 能支持, X: 不能}
      option_bank_note: 取自指示語原文「能支持的畫O，不能的畫X」，未自創文字。
      answer_carrier: 紅色 run（w:color=FF0000），PDF p8 可見
      items:
        - {index: 1, stem: 黑夫在信中請母親寄夏衣或錢。, answer: O}
        - {index: 2, stem: 三兄弟中，有兩個剛成年兒子在前線征戰。, answer: O}
        - {index: 3, stem: 根據出土文物，秦國一件夏衣價值五十五錢。, answer: X}
        - {index: 4, stem: 兄弟倆沒有收到錢物，只能借錢過活。, answer: O}
        - {index: 5, stem: 兩封家書被大哥衷帶進墳墓，成為陪葬品。, answer: X}

# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（字元樣式 rStyle=af），PDF p9 可見
  teacher_hint_carrier: |-
    本課沒有藍框解析方塊；改成把出處直接印在**選項後面**（橘色小字），
    共 3 處：第 2 題 B、第 3 題 D、第 4 題 C。這是與其他課不同的做法。
  questions:
    - index: 1
      answer: B
      stem: 請問哪一個句子的語詞使用正確?
      options:
        A: 黑夫將白米裝進「竹簡」，煮竹筒飯給弟弟吃
        B: 經過細心的照顧，總算「安然」度過危險期
        C: 他被斬首，現場「拋頭顱灑熱血」，畫面驚悚
        D: 她畢業後搬到臺北，工作地點也「轉嫁」過去
      stem_note: 題末是半形問號「?」，原稿如此。
    - index: 2
      answer: C
      stem: 根據本文，秦朝士兵的生活狀況為何？
      options:
        A: 家人支援充足，前線衣食無虞
        B: 官府供給完善，只需專心作戰(從第4、5段可知)
        C: 艱難困苦，連衣物錢財都缺
        D: 戰功獎勵穩定，生活逐漸改善
      options_note: B 選項末的「(從第4、5段可知)」是橘色教師註記，印在選項文字後面，照原樣收在選項內。
    - index: 3
      answer: D
      stem: 根據作者推論，大哥把弟弟們的家書當陪葬品的主要原因為何？
      options:
        A: 秦國最後打了勝仗，家書是光榮的印記
        B: 竹簡在當時很昂貴，適合當作陪葬品
        C: 書信內容可能透露國家機密，他擔心外洩
        D: 兄弟戰死沙場，他悲傷歉疚，念念不忘(從13段可知)。
    - index: 4
      answer: A
      stem: 根據本文，下列哪句話最能總結這兩封家書所揭露的歷史真相？
      options:
        A: 帝國勝利背後，藏著平民家庭的犧牲
        B: 秦軍強盛背後，來自家人對前線支持
        C: 軍功制度推行，使士兵家庭獲得保障(根據第5及11段可知)
        D: 家書能被保存，主要因古人重視親情
    - index: 5
      answer: C
      stem: 本篇文章對於研究秦朝歷史有何重要意義？
      options:
        A: 揭示了秦朝統一戰爭的過程
        B: 展示了秦朝皇帝的英明神武
        C: 反映秦代底層人民的生活壓力
        D: 說明了秦朝的徵兵制度非常完善

