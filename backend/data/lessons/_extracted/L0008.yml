# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 8
  # ⚠️ 版面陷阱：PDF 上段號欄（ㄧ二三四五六七八）與課文欄的行高對不齊，
  #    「六」看起來印在第 5 段中間。以 document.xml 的段落界線為準＝8 段。
  #    第 5 段在 XML 裡被斷成兩塊（…拿出瓶 / 子喝了口水…），是同一段的換行。
  paragraphs:
    - idx: 1
      text: 在一個寒冷的晚上，一位在社區做資源回收的老人穿著反光背心，手上提著一個垃圾袋，袋子裡的寶特瓶、鋁罐已經半滿。他左手牽著一個小男孩，拐了個彎，走進那個賣麵的小攤子。
    - idx: 2
      text: 老人看了看攤位的菜單，數了數手裡的零錢，點了一碗最便宜的陽春麵。麵端上來了，碗裡雖然沒有什麼配料，但麵條熱氣騰騰的樣子，還是讓小男孩的口水像水龍頭一樣流個不停。
    - idx: 3
      text: 老人將碗推向孫子，小男孩抬頭看著他，吞了吞口水問道：「阿公，您真的吃過了嗎？」老人從袋子裡緩緩拿出瓶子，喝了口水，看著孫子，撫了撫自己的肚子說：「真的啊，飽得像蜘蛛一樣。」誇張的動作和語言，讓祖孫倆都笑了起來。老闆看見老人數錢的樣子，也聽出祖孫對話中的言外之意，他走到桌旁笑咪咪的對老人說：「恭喜恭喜，您是我們今天第一百個客人，這碗陽春麵我請客。」
    - idx: 4
      text: 寒流來襲那天，老闆又看見了小男孩。他守在攤子旁邊，每當有一位客人進入攤子，他就在自己的小冊子上記上一筆。雖然陸續有客人來，但過了好久好久，紙上的數字卻一直停留在八十五。天氣愈來愈冷，小男孩必須經常搓手踏腳以保持溫暖。老闆心急了，開始打電話給老顧客和朋友：「你今天有空嗎？能不能來吃碗麵？我請客。」
    - idx: 5
      text: 就這樣，客人一個接著一個到了店裡，當小男孩數到第九十九個客人時，他急忙跑去找在附近做回收的老人，把他拉進攤子裡。他驕傲的說：「阿公，這一次換我請客了。」成為第一百位客人的老人，讓小男孩招待了一碗陽春麵。這次換小男孩從自己的袋子裡，拿出瓶子喝了口水，開心的看著阿公呼嚕呼嚕的吃起麵來。
    - idx: 6
      text: 老闆娘看見這樣的景象，很不捨的說：「要不要也送一碗麵給那孩子呢？」「不，那孩子現在正在學習『不吃東西也會飽』的道理呢！」老闆回答。
    - idx: 7
      text: 這時老人問孫子：「你要不要也吃一點呢？」小男孩卻摸摸自己的肚子，學著老人說話的口氣：「不用了，我很飽，您看我的肚子，飽得像蜘蛛一樣。」
    - idx: 8
      text: 祖孫倆離開小麵攤時，背影在街燈下漸行漸遠。暈黃的路燈，把整條街渲染成一個溫暖的世界呢！
  # 課文右緣「字數」欄的累計字數，從第 4 段（☞）起算，末值 354＝第 4~6 段合計（實測吻合）
