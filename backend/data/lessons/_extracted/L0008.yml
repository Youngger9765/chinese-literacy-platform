# ── 三 語詞我最棒 ──
vocab_definitions:
  label: 本課語詞：
  vocabulary_bank: [熱氣騰騰, 搓手踏腳, 渲染, 暈黃, 漸行漸遠, 陸續, 言外之意]
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  items:
    - {index: 1, word: 熱氣騰騰, definition: 形容食物或飲料熱呼呼的，蒸氣不斷上升的樣子。}
    - {index: 2, word: 搓手踏腳, definition: 摩擦雙手並用腳踏地，形容藉著活動身體來取暖。}
    - {index: 3, word: 言外之意, definition: 沒有明白說出來，但間接透露出來的意思。}
    - {index: 4, word: 陸續, definition: 接連不斷的樣子。}
    - {index: 5, word: 渲染, definition: 用色彩、光線或文字，營造出某種氣氛或感覺。也比喻言詞、文字過度誇大。}
    - {index: 6, word: 漸行漸遠, definition: 慢慢的越走越遠。也可以形容方向、關係越來越疏離。}
    - {index: 7, word: 暈黃, definition: 帶著淡淡黃色、柔和不明亮的光。暈，光影、色澤四周模糊的樣子。}

