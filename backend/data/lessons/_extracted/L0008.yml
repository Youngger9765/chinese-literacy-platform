# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 想法感受的換位思考
  strategy_type: character
  blocks:
    - type: concept_box
      text: |-
        「換位思考」是站在別人的角度看事情，試著理解對方的處境、想法與感受。故事中的阿公、小男孩或是麵攤老闆，他們都能夠換位思考，懂得替別人著想。
        我們可以用三個步驟來學習「換位思考」喔：
        (1)觀察言行：看對方說了什麼、做了什麼。
        (2)推論動機：根據(1)的觀察，想想他為什麼這樣說或這樣做。
        (3)成功換位思考：綜合(2)的推論，站在他的角度，推想他可能的想法、感受或需要。
        接下來我們要用「換位思考三步驟」，來練習推論出本篇故事中人物說話或行為的動機，以及言外之意喔！

    - type: guide
      text: ◎小試身手

    - type: matching
      label: 1.（阿公的想法）
      instruction: 我們要利用換位思考三步驟來推論課文中阿公的想法，請根據阿公說的話或行為想一想、連連看，做出合理的推論。
      left_header: 步驟一：觀察言行
      right_header: 步驟二：推論動機
      left:
        1: 老人看攤位的菜單，數手裡的零錢，點了一碗最便宜的陽春麵。
        2: 老人從袋子裡緩緩拿出瓶子，喝了口水，摸自己的肚子。
        3: 阿公說：「真的啊，飽得像蜘蛛一樣。」誇張的動作和語言，讓祖孫倆都笑了起來。
      right:
        A: 可能是藉由這樣的方式填飽肚子。
        B: 用開玩笑的方式讓孫子放心吃麵。
        C: 阿公的錢應該不夠多。
      # 兩欄各印 ● 連接點，但教師版沒有畫任何連線 —— 沒有答案可轉錄，故不寫 answer
      answer_carrier: 連線（圖形）；此題教師版未畫線，無答案可轉錄

    - type: sub_block
      label: 步驟三：成功換位思考（阿公）
      stem: →阿公應該【 還沒 / 已經 】吃飽，用這麼誇張的方式說話是因為錢不夠，又想讓孫子【 安心/放心 】吃麵。
      selected: 還沒
      blanks: [{answer: 安心/放心}]
      answer_carrier: 橘色方框圈住「還沒」；「安心/放心」為橘色手寫參考答案

    - type: fill_table
      label: 2.進階題（老闆的想法）
      instruction: 我們要再利用換位思考三步驟來推論課文中老闆的想法，請根據老闆說的話或行為想一想、連連看，做出合理的推論。
      columns: [步驟一：觀察言行, 步驟二：推論動機]
      answer_carrier: 紅色 ☑（圖形）與橘色手寫字
      rows:
        - index: 1
          觀察言行: 老闆看見老人數錢的樣子，又把祖孫的對話聽在耳裡。
          推論動機: 他發現老人的經濟狀況
          options: {1: 好, 2: 不好}
          answer: 2
        - index: 2
          觀察言行: 他走到桌旁笑咪咪的對老人說：「恭喜恭喜，您是我們今天第一百個客人，這碗陽春麵我請客。」
          推論動機: 他想【　】老人，又不希望他覺得被同情。
          blanks: [{answer: 幫助}]
        - index: 3
          觀察言行: 寒流來襲時，老闆看見小男孩守在攤子旁記錄進店內客人的人數，老闆打電話請老顧客跟朋友吃麵。
          items:
            - index: 1
              stem: 他【　】今天賣不到100碗。
              options: {1: 擔心, 2: 希望}
              answer: 1
            - index: 2
              stem: 他擔心小男孩寒流中待太久會【　】。
              blanks: [{answer: 著涼/感冒/生病}]
        - index: 4
          觀察言行: 老闆娘問：「要不要也送一碗麵給那孩子呢？」老闆回答：「不，那孩子現在正在學習『不吃東西也會飽』的道理呢！」
          推論動機: 他想要讓小男孩也有機會【　】為家人付出。
          blanks: [{answer: 學習/練習}]

    - type: sub_block
      label: 步驟三：成功換位思考（老闆）
      stem: →老闆想要在不傷害老人及小男孩【 自尊心 / 自信心 】的情況下，【 幫助 】他們。
      selected: 自尊心
      answer_carrier: 橘色方框圈住「自尊心」；「幫助」為橘色手寫參考答案

    - type: free_text
      label: 3.挑戰題
      prompt: 讀下面故事，運用換位思考三步驟，寫出老闆可能的想法。
      passage: 有個貧窮的大學生，總在自助餐店快要打烊時，才走進店裡點了一碗白飯。他小心翼翼的詢問老闆：「請問可以幫我淋點滷肉汁嗎？」老闆笑咪咪地回：「當然沒有問題！」吃完那碗白飯後，大學生不好意思的問：「可以再給我一碗白飯嗎？我想要帶去學校當明天的午餐。」老闆接過餐盒，偷偷的把店裡的滷肉和滷蛋放在餐盒下方，並且裝了滿滿的白飯。老闆娘好奇老闆為什麼要把滷肉和滷蛋放在便當盒最下面，不放上方呢？
      stem: →老闆這麼做是因為：【　】
      answer_free_text: 怕大學生一看到老闆幫他加料，會覺得被施捨，傷害他的自尊心，因此才放在白飯下方。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: B
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 小夫捉弄胖虎，胖虎氣炸了，「熱氣騰騰」的跑去找他算帳
        B: 他們因為觀念相差太多，最終感情「漸行漸遠」，離婚收場
        C: 晚飯時間，我的爸爸下班後「陸續」離開公司回來了
        D: 開學前他去把頭髮「渲染」成金色，希望吸引大家的目光
    - index: 2
      answer: A
      stem: 根據本文，下列哪一個線索，主要是在表現老人想讓孫子安心吃麵？
      options:
        A: 老人家摸摸自己的肚子，對孫子說自己飽的像蜘蛛
        B: 老人家在社區做資源回收，提著裝了回收物的垃圾袋
        C: 老人家看菜單，數一數手中零錢，點最便宜的陽春麵
        D: 老人家只點一碗麵給孫子吃，自己只是拚命喝水
    - index: 3
      answer: D
      stem: 根據第三段，老阿公真的是第一百個客人嗎？為什麼老闆要這麼說？
      options:
        A: 是，因為這是他們店裡新的促銷活動，阿公正好是幸運兒
        B: 是，因為他是店裡第一百個客人，所以免費得到一碗麵
        C: 不是，因為老闆根本沒算人數，他只想快點賣完回家休息
        D: 不是，因為老闆看出祖孫生活不寬裕，想幫忙他們
