#    XML 有 6 個 `prstGeom prst="line"` + `srgbClr val="FF0000"` 的圖形，
#    分屬兩個群組（群組2＝巨石陣三列、群組3＝摩艾三列）。
#    ⚠️ 一開始我用 `wp:anchor` 的 posOffset 定位，**六條線只落在兩個錨點上**（全部相同），
#    看起來像「三條線重疊在同一列」。真正的位移在**群組內的 `a:off`**，不是錨點 ——
#    加上 a:off 之後六個左端點才分得開。
#    解出來的端點（群組內座標，單位 in，列距約 0.58）：
#      群組2 左端 -0.062／0.521／1.112 → 第 1／2／3 列；右端 0.563／1.111／-0.062
#      群組3 左端  0.000／0.692／1.127 → 第 4／5／6 列；右端 0.692／1.151／0.059
#    → (1)→B、(2)→C、(3)→A、(4)→E、(5)→F、(6)→D
