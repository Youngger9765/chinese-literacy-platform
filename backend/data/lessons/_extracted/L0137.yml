    title: 未解之謎：石頭的祕密（一）──巨石陣
    note: |-
      這張表**不佔大題號**，印在第 16 課課文之後、（請繼續閱讀下篇文章）之前。
      跟四*文章重點整理不同：那一張是兩篇合併比較，這一張只整理本篇。
    answer_carrier: 橘色手寫體印在【　】內（教師版答案），文字流有此資訊
    rows:
