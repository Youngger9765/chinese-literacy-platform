# 🔵 三種答案載體都查過，另加第四種：
#    ① ☑ 勾選 `w:sym Wingdings F0FE` → 21 個（重點表 7、小試身手 4、結論 3… 逐一對得上）
#    ② 找字圈選 `roundRect` → **11 個**，全部 srgbClr E97132，全部錨在紙內
#       （posOffset 換算後最大 1.06in，遠小於頁寬 8.27in，無紙外殘留）。
#       11 個圈 == 11 條 answer_paths == 11 個目標語詞，個數相符、無警報。
#    ③ 框選語詞 `w:bdr` 非 auto → **0 個**（22 個 w:bdr 全是 color=auto）
#    ④ 🔴 **紅色手繪連線**（四*第 2 題連連看）—— 見下方，這是本課最重要的發現。
