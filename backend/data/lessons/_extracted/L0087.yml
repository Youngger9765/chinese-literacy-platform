    - {index: 2, word: 嘀咕, definition: 小聲說話，常帶有抱怨、不滿或懷疑的語氣。}
    - {index: 3, word: 怨懟, definition: 心裡怨恨、不滿。}
    - {index: 4, word: 慢條斯理, definition: 形容說話或做事從容緩慢、不慌不忙。}
    - {index: 5, word: 自怨自艾, definition: 因為事情不順利而埋怨、責備自己，心情低落。}
    - {index: 6, word: 儼然, definition: 好像、很像。}
    - {index: 7, word: 嘴饞, definition: 看到或想到好吃的東西，就很想吃。}
    - {index: 8, word: 撒賴, definition: 賴皮、不講道理。}
    - {index: 9, word: 醍醐灌頂, definition: 受到很大的啟發，突然明白重要的道理。「醍醐」原指從牛奶提煉出的精華，佛教用來比喻智慧。}
    - {index: 10, word: 故技重施, definition: 再次使用以前用過的同一種手段或方法。}
    - {index: 11, word: 層出不窮, definition: 接連不斷的出現，好像沒有盡頭。「窮」是盡頭的意思。}
    - {index: 12, word: 百思不解, definition: 經過反覆思考，還是不能了解。}
    - {index: 13, word: 犯小人, definition: 遇到故意要害你的人。}

