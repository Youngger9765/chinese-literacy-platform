keypoints:
  title: 把手上的餅吃香一點！
  layout: list
  answer_carrier: 橘色手寫字（PDF p12）；文字層的【　】內已填有同樣的答案
  rows:
    - label: 問題
      value: |-
        1.作者百思不解的問題是：
        小時候大人分餅，為什麼每次總覺得【　】？
        2.類似的狀況在生活中層出不窮：
        (1)分組任務時，覺得別人的任務比較【　】。
        (2)看書時，覺得別人手裡的書比較有趣。
        (3)點餐時，覺得別人的餐點比較好吃。
        (4)看同學的家庭，覺得別人的家庭比較【　】。
        →作者遇到的問題是：無論在任何情況中，為什麼別人都比較【　】？
      blanks:
        - {answer: 姊姊的餅比較大}
        - {answer: 輕鬆}
        - {answer: 溫暖}
        - {answer: 好/幸運}
    - label: 轉念契機
      value: |-
        1.作者讀到【　】中刷籬笆的故事，解決了他的問題。
        2.湯姆的姨媽要他去【　】，一開始他刷得【　】。後來他把自己想成正在創作偉大壁畫的藝術家，全神投入。
      blanks:
        - {answer: 湯姆歷險記}
        - {answer: 刷籬笆}
        - {answer: 不甘願}
    - label: 領悟
      value: 原來問題不在於【　】，而在怎麼把手上的餅【　】。
      blanks:
        - {answer: 餅的大小}
        - {answer: 吃香一點}
    - label: 後來做法
      value: 作者遇到不順利的事時，會試著換個角度看，用【　】的方式面對。
      blanks:
        - {answer: 幽默}
  blanks_note: 第一列末的「好/幸運」在原稿就是用斜線並列兩個可接受答案，照原稿保留。

# ── 六（後半）閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p13）；文字層的（　）內已填有同樣的代號
  explanation_absent_note: 本課五題**都沒有**教師解說框（L0085／L0086 各有 4 個），不是漏抽。
  questions:
    - index: 1
      answer: B
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 胖虎把桌上的牛奶倒在大雄頭上，讓大雄「醍醐灌頂」，好過分
        B: 弟弟遊戲輸了都會「撒賴」，要大家陪他再玩一次，真拿他沒辦法
        C: 小夫在教室大聲的「嘀咕」說小明的壞話，讓小明氣到不跟他說話
        D: 馬戲團表演者被大砲發射出去，飛到天上去，可說是「難如登天」
    - index: 2
      answer: D
      stem: 作者小時候百思不解的問題是什麼呢？
      options:
        A: 為什麼大人給零食時，都要他們「公家吃」
        B: 為什麼作者常常要被迫跟姊姊分享同一個餅
        C: 為什麼祖母都是讓姊姊來分餅，作者選餅呢
        D: 為什麼他用盡策略，最後仍覺得姊姊的餅比較大
    - index: 3
      answer: C
      stem: 第六段中提到「……，吸引了一位跟我有同樣毛病的小朋友，……」，請問這裡指的「同樣毛病」，是什麼毛病呢？
      options:
        A: 愛計較，見到糖果餅乾都非常「餓鬼」
        B: 只要遇到不順心的事，就對家人耍賴
        C: 覺得別人得到的，都比自己擁有的好
        D: 平常愛抱怨，總是自怨自艾感到鬱悶
    - index: 4
      answer: A
      stem: 作者讀完《湯姆歷險記》後，最重要的改變是什麼？
      options:
        A: 事情不一定改變，但他開始換個角度看自己遇到的事
        B: 他學會用方法讓別人替自己完成所有麻煩的工作
        C: 他發現只要說自己很幸運，生活中的問題就會消失
        D: 他認為別人擁有的東西，其實都不如自己的東西好
    - index: 5
      answer: D
      stem: |-
        運動會，大家期待已久的大隊接力比賽，因為下雨而延期了，下面哪些想法是比較正向的呢？
        甲、比賽延期我們就能多練習幾天了
        乙、比賽延期我們前面不就都白練了
        丙、今天沒有比賽，整個運動會都沒有意義
        丁、幸好比賽延期，否則地面溼滑跑步容易受傷
      options:
        A: 甲乙
        B: 乙丙
        C: 丙丁
        D: 甲丁
      stem_note: |-
        這一題是「甲乙丙丁」四個敘述＋A~D 四個組合選項的兩層結構。
        四個敘述原稿印在題幹底下（不是選項），所以收進 stem；A~D 四個組合印在同一行。

