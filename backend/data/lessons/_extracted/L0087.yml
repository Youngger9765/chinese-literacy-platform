  option_bank: {A: 百思不解, B: 嘀咕, C: 層出不窮, D: 難如登天, E: 自怨自艾, F: 怨懟, G: 儼然, H: 慢條斯理, I: 犯小人}
  option_bank_note: 代號表只收 9 個語詞（未收 嘴饞、撒賴、醍醐灌頂、故技重施）；9 個代號對 8 小題，I.犯小人 未被任何一題用到。
  answer_carrier: 橘色手寫代號（PDF p11）；文字層的括號內已填有同樣的代號
  answer_width_note: |-
    八題的代號在原稿都是**全形**（Ｂ／Ｄ／Ｃ／Ｆ／Ｈ／Ｇ／Ｅ／Ａ），但代號表印的是半形（A.百思不解）。
    本欄的 `answer` 寫**半形**，讓它與 `option_bank` 的 key 對得起來（答案是指向詞庫的代號，不是被轉錄的字串）；
    原稿的全形寫法記在這裡。
  items:
    - {index: 1, stem: 教練要小夫每天多練習半小時，小夫不滿的（　）幾句，讓教練大發雷霆。, answer: B}
    - {index: 2, stem: 他向來小氣，你想要他請你吃東西，簡直就（　）。, answer: D}
    - {index: 3, stem: 詐騙集團騙人的手法不斷更新，被騙的案例（　），大家應該多加小心。, answer: C}
    - {index: 4, stem: 她總是認為自己受到了不公平的對待，因此內心充滿了（　）。, answer: F}
    - {index: 5, stem: 集合時間快要到了，同組的同學們還（　）的收拾行李，讓我好著急。, answer: H}
    - {index: 6, stem: 胖虎站在新歌發表會的舞台上，表情十分自信，（　）就是一位大歌星。, answer: G}
    - {index: 7, stem: 輸球後，他一直（　），責怪自己當天出現大失誤，因而與冠軍擦肩而過。, answer: E}
    - {index: 8, stem: 我們本來是無話不談的好朋友，為什麼她突然變得冷淡，這讓我（　）。, answer: A}

# ── 一（前半）閱讀聚光燈-自我提問策略3--問好問題 ──
spotlight:
  strategy_name: 自我提問策略3──問好問題
  strategy_type: self_questioning
  section_title_printed: 閱讀聚光燈-
  section_subtitle_printed: 自我提問策略3--問好問題
  section_no_printed: 一
  section_no_note: 這個大題印的是「一」且排在最前面，後面的「讀全文-做記號」才又從「一」開始。見 sections_note。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，10 個）與橘色手寫的①②③代號
  structure_note: |-
    ⛔ 所有表格刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: |-
        自我提問策略：一邊讀、一邊問自己的讀書方法
        閱讀高手，讀書時不是一直往下讀；高手會在關鍵處停一下，問自己問題，並且回到文章中找線索檢查自己的理解。
        前兩課，我們已經練習過：讀完一小段，要停一下，問自己「這段主要在說什麼？」也練習過如何找出前後段落文字之間的關係。
        這一課，我們要再往前一步：閱讀時，不是每個地方都問同一個問題，而是要判斷自己需要理解什麼，再問自己一個最有幫助的問題。
        這一課，我們練習三個常用的自我提問。

    - type: table
      prompt: 這一課，我們練習三個常用的自我提問。
      columns: [常用的自我提問問題, 這樣問可以……, 卡住時，可以怎麼做？]
      rows:
        - [①這段主要在說什麼？, 確認我有沒有抓到重點, 圈出找能回答問題的關鍵詞句。]
        - [②這段和前面內容有什麼關係？, 有沒有把前後文連起來, 回看前面內容，找前後反差、接續發展、結果或疑問的回答。]
        - [③作者真正想告訴我們什麼？, 讀出作者想法或文章主旨, 回看標題、開頭、結尾，把幾段重點合起來想]
      table_note: 這張三問對照表原稿印在概念框**裡面**（巢狀表格），此處拉到 blocks 最上層以免整片畫不出來。

    - type: guide
      text: 本課口訣：先抓主要內容→再串連前後文→最後讀出作者想法

    - type: guide
      text: 一、一邊讀，一邊問自己好問題

    - type: guide
      text: |-
        右欄提問是提醒你，閱讀到關鍵處時，先停下來想一想。看到問題時，請做兩件事：
        ❶先在心裡回答這個問題。
        ❷在課文中，圈出可以支持你回答的句子或關鍵詞。

    - type: fill_table
      prompt: 一、一邊讀，一邊問自己好問題
      columns: [把手上的餅吃香一點, 自我提問]
      table_note: |-
        課文全文在這張表裡再印一次（帶「（段N）」前綴）。⚠️ 這一份與後半「讀全文-做記號」
        那一份**文字不完全相同**（七處差異，見 body.duplicate_copy_note）；本表照前半原樣抄。
        右欄的提問依版面對齊到左欄的段落群；最後一列「段10 第②問」在原稿是重複出現的
        （段9～10 已經問過第③問），照原稿保留。
      rows:
        - 把手上的餅吃香一點: |-
            （段1）小時候我有一個百思不解的問題。故事發生在物質缺乏的花蓮鄉下，小孩子很少有機會吃糖，見到糖果、餅乾都非常「餓鬼」（臺語「嘴饞」的意思），偏偏大人給糖時，都要我們小孩「公家吃」（臺語「一起吃」的意思），我可不是孔融(註)，公家吃是一件痛苦的事，尤其是在計較大小、多少的時候。
            （段2）姊姊大我三歲，我常常被迫和她分享同一個餅。因為我年紀小，大的要讓小的，所以祖母說：「姊姊你來分，弟弟先選。」等姊姊小心的把餅分成兩半以後，我就要更小心的選出比較大的那一半來。好不容易選好了，我和姊姊各持半邊餅，她捨不得馬上吃，寶貝似的捧在手上，一副心滿意足的樣子。
            （段3）看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒賴一下，就可以把餅換回來。真的換回來後，我立刻狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？
          自我提問: |-
            段1～3
            ①作者「百思不解的問題」是什麼？
            註：孔融是知名的東漢文學家，他小時候就會把食物讓給他的哥哥，得到眾人的稱讚。
        - 把手上的餅吃香一點: （段4）類似的情況在生活中層出不窮。分組任務時，總是認為別人的任務比較輕鬆，自己的任務則是難如登天；我和同學都在看繪本，但別人手裡的書，看起來似乎比我的有趣多了；點餐，菜一上桌，我才發現隔壁桌點的脆皮炸雞似乎比我的麥香雞好吃；而且同學的家庭都特別溫暖，孩子不用做家事，就我的命最苦，每天都要洗衣服、洗碗、拖地。我總是邊做邊自怨自艾。
          自我提問: |-
            段4
            ②這段和前面分餅的經驗有什麼關係？
        - 把手上的餅吃香一點: |-
            （段5）沒想到，是馬克‧吐溫幫我解決了這個問題。我在他的《湯姆歷險記》中，居然讀到這麼一段讓人醍醐灌頂的小故事。
            （段6）湯姆的姨媽叫他去把籬笆刷上油漆，「大太陽下揮汗刷油漆？」湯姆嘴裡嘀咕，心中滿是怨懟，刷得不甘不願。後來他靈機一動，把自己當作正在創作偉大壁畫的藝術家。他刷了幾下，就退後幾步，雙手的拇指和食指圍出一個正方形，瞇起眼睛，透過正方形欣賞自己的傑作，然後再上前刷幾筆。他全神投入，儼然是一位藝壇大師。果不其然，這種迷人的模樣，吸引了一位跟我有同樣毛病的小朋友，他認為湯姆的刷油漆工作，比他正在吃的蘋果有趣多了，就問：「湯姆，可不可以借我刷一下？」
            （段7）「呃……可是我非常享受我的藝術創作呢。」湯姆連看都不看他一眼。「湯姆，拜託啦！要不然，這個蘋果給你，你借我刷一下好嗎？」小朋友一邊說，一邊把香氣逼人的大蘋果遞了過來。
            （段8）湯姆終於同意小朋友用他的蘋果換了刷油漆的「權利」。然後，湯姆一再故技重施，成功的讓幾個小朋友上鉤，不但在一個下午就把籬笆的油漆刷完，手裡還多了一些彈珠和其他玩具。
          自我提問: |-
            段5～8
            第①問：這個故事在說什麼？
            第②問：這個故事和前面的問題有什麼關係？
        - 把手上的餅吃香一點: |-
            （段9）啊哈，原來問題不在餅的大小，而在怎麼把手上的餅吃香一點。
            （段10）現在朋友問我過得好不好，我的回答總是：「喔，超讚的！」犯小人，我說：「太精采了，這種經驗一百萬也買不到。」出國，回程飛機延誤，我說：「太棒了，還可以在國外多玩一天。」感染新冠病毒，我會說：「害我不能去工作，但在家裡看電視還能領薪水，我也很『困擾』啊！」呵呵，我猜別人都以為我拿到比較大塊的餅呢！
          自我提問: |-
            段9～10
            第③問：作者真正想告訴我們什麼？
            段10
            第②問：這個故事和前面的問題有什麼關係？

    - type: guide
      text: 提醒：只看問題不算完成自我提問；能找出文章線索，並回答問題，才表示你真的讀懂了

    - type: guide
      text: 二、先判斷：現在需要問哪一個問題

    - type: guide
      text: |-
        閱讀時，先判斷閱讀任務，再選出最適合的自我提問。請把①②③填入【 】中。
        自我提問小卡：①這裡主要在說什麼？
        ②這段和前面內容有什麼關係？
        ③作者真正想告訴我們什麼？

    - type: fill_table
      prompt: 二、先判斷：現在需要問哪一個問題
      columns: [閱讀任務, 我可以問自己①、②或③]
      answer_carrier: 橘色手寫的①②③（PDF p4）；文字層的【 】內已填有同樣的代號
      rows:
        - 閱讀任務: A.我讀完一段，細節很多，不知道哪一點最重要。
          我可以問自己①、②或③: 【　】
          我可以問自己①、②或③_blanks:
            - {answer: ①}
        - 閱讀任務: B.我讀到「原來是」，想知道「原來是」之前和之後的文字有什麼關係。
          我可以問自己①、②或③: 【　】
          我可以問自己①、②或③_blanks:
            - {answer: ②}
        - 閱讀任務: C.我讀完整篇文章，想知道作者為什麼寫這篇文章。
          我可以問自己①、②或③: 【　】
          我可以問自己①、②或③_blanks:
            - {answer: ③}

    - type: guide
      text: 三、比較看看：自我提問後，理解有什麼不同？

    - type: guide
      text: 請看第5–8段，作者寫湯姆刷油漆的故事。這段可以讀出兩層意思：

    - type: table
      prompt: 請看第5–8段，作者寫湯姆刷油漆的故事。這段可以讀出兩層意思：
      columns: [理解層次, 可能讀出的意思]
      rows:
        - [①只看故事本身, 湯姆很聰明，靠著「我享受刷籬笆的藝術」這招，不但讓別人為他刷籬笆，還換到蘋果和一些玩具。]
        - [②連回全文來看, 湯姆的故事讓作者發現：你若能珍惜、享受現狀，旁人會投來羨慕的眼光，你的生活滿意度也會因而提高。]

    - type: single
      prompt: 1.你覺得課文的作者，希望告訴讀者的是哪一個層次呢？
      options:
        1: 只看故事本身
        2: 連回全文來看
      answer: 2
      options_note: 這一題原稿只印「□ ① ☑ ②」兩個代號，沒有重印選項文字；選項文字取自上方的理解層次表。

    - type: single
      prompt: 2.對湯姆的故事，如果我的理解要從①提升到②，最需要問自己哪一個問題？
      options:
        1: 這段主要在說什麼？
        2: 這段（湯姆的故事）和前面內容有什麼關係？
        3: 這段故事最有趣的地方是什麼？
      answer: 2

    - type: guide
      text: 四、小試身手：在關鍵處依需求問自己一個好問題

    - type: guide
      text: |-
        步驟一：請照下表最左兩欄的說明，回頭再讀一次課文
        步驟二：在第三欄選一個最能說明該段文字的選項
        步驟三：在最右欄填上該段文字最適用的自我提問好問題（請填入①②③）
        自我提問小卡：①這裡主要在說什麼？
        ②這段和前面內容有什麼關係？
        ③作者真正想告訴我們什麼？

    - type: fill_table
      prompt: 四、小試身手：在關鍵處依需求問自己一個好問題
      columns: [段落, 讀到的地方, 自我提問後，哪個理解比較好？（單選）, 最適用的自我提問是何者？]
      answer_carrier: 紅色 ☑（w:sym）5 個＋橘色手寫的①②③；PDF p5 可見
      rows:
        - 段落: 1~3
          讀到的地方: 作者小時候和姊姊分餅的經驗
          自我提問後，哪個理解比較好？（單選）: |-
            ①怎麼選都覺得姊姊的餅較大
            ②祖母分餅方式讓作者覺得不公
          自我提問後，哪個理解比較好？（單選）_options:
            1: 怎麼選都覺得姊姊的餅較大
            2: 祖母分餅方式讓作者覺得不公
          自我提問後，哪個理解比較好？（單選）_answer: 1
          最適用的自我提問是何者？: 【　】
          最適用的自我提問是何者？_blanks:
            - {answer: ①}
        - 段落: 1~3
          讀到的地方: 作者分餅後，總覺得自己受騙、吃虧
          自我提問後，哪個理解比較好？（單選）: |-
            ①作者從小很計較，想拿較大餅
            ②作者常覺得自己吃虧、別人比較好
          自我提問後，哪個理解比較好？（單選）_options:
            1: 作者從小很計較，想拿較大餅
            2: 作者常覺得自己吃虧、別人比較好
          自我提問後，哪個理解比較好？（單選）_answer: 2
          最適用的自我提問是何者？: 【　】
          最適用的自我提問是何者？_blanks:
            - {answer: ①}
        - 段落: '4'
          讀到的地方: 作者寫分組、看書、點餐、做家事等例子
          自我提問後，哪個理解比較好？（單選）: |-
            ①都在說作者常覺得別人的比較好
            ②都在說作者生活中處處不公平
          自我提問後，哪個理解比較好？（單選）_options:
            1: 都在說作者常覺得別人的比較好
            2: 都在說作者生活中處處不公平
          自我提問後，哪個理解比較好？（單選）_answer: 1
          最適用的自我提問是何者？: 【　】
          最適用的自我提問是何者？_blanks:
            - {answer: ②}
        - 段落: 5~8
          讀到的地方: 作者寫《湯姆歷險記》刷油漆的故事
          自我提問後，哪個理解比較好？（單選）: |-
            ①湯姆教作者用技巧換到更多好處
            ②湯姆讓作者看見：看法會改變感受
          自我提問後，哪個理解比較好？（單選）_options:
            1: 湯姆教作者用技巧換到更多好處
            2: 湯姆讓作者看見：看法會改變感受
          自我提問後，哪個理解比較好？（單選）_answer: 2
          最適用的自我提問是何者？: 【　】
          最適用的自我提問是何者？_blanks:
            - {answer: ②}
        - 段落: '9'
          讀到的地方: 作者說：啊哈，原來問題不在餅的大小…
          自我提問後，哪個理解比較好？（單選）: |-
            ①「吃香一點」是換角度看自己處境
            ②「吃香一點」是安慰自己不要抱怨
          自我提問後，哪個理解比較好？（單選）_options:
            1: 「吃香一點」是換角度看自己處境
            2: 「吃香一點」是安慰自己不要抱怨
          自我提問後，哪個理解比較好？（單選）_answer: 1
          最適用的自我提問是何者？: 【　】
          最適用的自我提問是何者？_blanks:
            - {answer: ③}

    - type: guide
      text: 五、換我試試看：少一點提示

    - type: guide
