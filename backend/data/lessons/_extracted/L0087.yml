    另外「孔融」的註解內容兩邊也不同：聚光燈版在右欄寫「註：孔融是知名的東漢文學家，
    他小時候就會把食物讓給他的哥哥，得到眾人的稱讚。」；讀全文版是頁尾註腳
    「某次，父親帶回幾顆梨讓家中小孩分享，孔融立刻選擇最小的梨，將大的梨留給哥哥。」
    ⚠️ 對照組：L0085 的兩份課文**完全相同**、L0086 只差第 1 段一個空格 ——
