      value: 【　】也可能犯錯，盡信書【　】，面對新聞、教科書或專家說法，都要保留「這是真的嗎？」的質疑精神，回到證據去【查核】與【檢驗】，才能一步步逼近真相。
      blanks: [{answer: 科學家}, {answer: 不如無書}]
      value_note: |-
        ⚠️ 這一格有四組【】，但**只有前兩組是空格**。後面的【查核】【檢驗】是印好的黑字
        （PDF p6 上不是橘色，style 掃描也沒命中），屬於原稿的強調用法，不是要學生填的。
        分辨依據：橘色答案清單裡只有「科學家」「不如無書」，沒有「查核」「檢驗」。
  rows_note: |-
    「凱蒂謀殺案」是一個 vmerge 的合併儲存格（原稿一字一行直排：凱蒂／謀／殺／案），
    底下橫跨三個子列（紐約時報報導／心理學界反應／重大轉折），故用 items 表達。

# ── 六 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 媒體素養與識讀──查核、辨識假新聞
  strategy_type: media_literacy
  answer_carrier: |-
    紅色 ☑（w:sym Wingdings F0FE，全課僅 1 個，在檸檬水那題）
    ＋橘色代號（字元樣式 rStyle=af，小試身手 5 題）
  blocks:
    - type: concept_box
      text: |-
        網路上的訊息很多，但不一定都是真的。有些訊息沒有經過查證，有些只呈現部分事實，或用誇張、錯誤的說法誤導讀者。
        因此，看到一則訊息時，不要急著相信或轉傳，先停下來問一問：
        這是真的嗎？
    - type: guide
      text: 先試試看，你會怎麼做？
      text_note: 原稿前面印一個「◆」項目符號，那是 Word 自動編號（numbering.xml）不在文字流裡，故不寫入。
    - type: guide
      text: 你在群組中看到這則訊息：
    - type: passage
      paragraphs:
        - 「研究證實：每天喝一杯檸檬水，就能提高30％的免疫力！趕快分享給大家！」
    - type: single
      prompt: 你會怎麼做？
      options:
        1: 檸檬有益健康，趕快轉傳給親友
        2: 先查研究來源，確認說法是否可靠
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），PDF p7 可見；這是全課唯一的 ☑
    - type: guide
      text: →看到「研究證實」、明確數字或催促轉傳，也不能立刻相信，要先查來源和證據。
      text_note: 這個「→」是文字流裡真正的箭頭字元（不是 w:sym），照抄。
    - type: guide
      text: 辨識假新聞的五個好習慣
    - type: guide
      text: |-
        A.看來源：誰發布的？可信媒體、專家、官方資料？還是匿名轉傳？
        B.查證據: 證據合理、符合常理？有無正式紀錄或可查證的來源？
        C.辨語氣：標題是否過度煽情、絕對化，刻意引發憤怒或恐懼？
        D.想目的：這則訊息可能讓誰得利？想影響我的什麼想法或行動？
        E.慢轉傳：不確定前先不要分享，先多查幾個來源。
      text_note: |-
        原稿是一行一條的文字，不是表格，故整段照抄不拆欄。
        ⚠️ B 條的冒號是**半形「:」**（其餘四條是全形「：」），原稿如此，未統一。
    - type: guide
      text: 小結
    - type: guide
      text: 看到訊息時，先問：「這是真的嗎？」再從來源、證據、語氣和目的進行查核，確定之後才轉傳。

    - type: guide
      text: ◎ 小試身手
    - type: guide
      text: 讀完文章後，我們一起來追查凱蒂案吧。
    - type: passage
      paragraphs:
        - 　　標題：38人目擊謀殺未報警，女性被殺反映社會冷血無情，震驚各界。
        - 　「有將近半個小時，住在皇后區的38位平日奉公守法的市民，隔窗觀看一名年輕女子在街上被三次追殺，他們的說話聲和開燈的亮光把凶手給嚇跑了，但凶手很快又跑回來追上那名女子，再次舉刀殺人。凶手一再動手的期間，沒有一位市民打電話報警，直到女子被殺死後，才有一個人打電話報警。」
      paragraphs_note: |-
        這段是課文第 2 段報導的**改寫版**，與課文原文有數處差異
        （「凸顯社會的冷漠無情，震驚警界」→「反映社會冷血無情，震驚各界」、
        「才有一個人以電話報警」→「才有一個人打電話報警」）。原稿如此，兩處都照各自原樣。
    - type: guide
      text: 王大宏有一些讓他對假新聞保持警覺的好習慣：
      text_note: 原稿前面印「1.」，那是 Word 自動編號不在文字流裡，故不寫入。
    - type: guide
      text: |-
        Ａ.看來源：誰發布的？可信媒體、專家、官方資料？還是匿名轉傳？
        Ｂ.查證據: 證據符合常理？有無正式紀錄或可查證的來源？
        Ｃ.辨語氣：標題是否過度煽情、絕對化，刻意引發憤怒或恐懼？
        Ｄ.想目的：這則訊息可能讓誰得利？想影響我的什麼想法或行動？
    - type: exercise
      instruction: 他看了以上的報導後，疑心大起，請你判斷他底下的反應，是哪一個好習慣帶來的? （在空格裡填入A, B, C, D）
      option_bank: {A: 看來源, B: 查證據, C: 辨語氣, D: 想目的}
      option_bank_note: |-
        ⚠️ 這裡的 A~D 用**全形字母Ａ Ｂ Ｃ Ｄ**（上面「五個好習慣」那份用半形 A~E），
        而且 B 條的文字比上面那份少了「合理、」三個字（「證據符合常理？」vs「證據合理、符合常理？」）。
        兩份各自照原樣，未統一。答案欄填的則是半形 A~D。
      answer_carrier: 橘色（字元樣式 rStyle=af），PDF p8 可見
      items:
        - {index: 1, stem: ①這標題太誇張聳動了吧！, answer: C}
        - {index: 2, stem: ②紐約時報？這家媒體常常因不實報導挨罵啊？, answer: A}
        - {index: 3, stem: ③全都冷漠旁觀？這太不可能，和常理有衝突, answer: B}
        - {index: 4, stem: ④記者怎麼可能一家家去調查窗後的目擊者有38人？, answer: B}
        - {index: 5, stem: ⑤報紙快被電視和多媒體打敗了，它想用這個多賣點報紙？, answer: D}

# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號（字元樣式 rStyle=af），PDF p9 可見
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1、3 題有
  questions:
    - index: 1
      answer: B
      stem: 下列語詞何者使用正確?
      options:
        A: 看見車禍，他「煽情」的呼叫路人一同幫忙
        B: 這件命案，經過警方「抽絲剝繭」，終於真相大白
        C: 他天生兩眼全盲，所以對任何東西都「視若無睹」
        D: 我們以天為被、地為席，「鋪天蓋地」徜徉在大自然中
      teacher_hint: Ａ.引發人情緒、Ｃ.誤用，不關心、Ｄ.誤用
      stem_note: 題末是半形問號「?」，原稿如此。
    - index: 2
      answer: C
      stem: 下列選項何者最符合本文結尾所提到「盡信書不如無書」的涵義？
      options:
        A: 沒有書本，世界上就可以減少紛爭
        B: 與其完全相信書，不如就不要讀書
        C: 讀書時，必須保有獨立懷疑的精神
        D: 如何選擇書中知識，全在一念之間
    - index: 3
      answer: A
      stem: 下列何者是「旁觀者效應」的例子？
      options:
        A: 老人跌倒受傷，路人都以為別人會幫忙，結果反而沒有人上前
        B: 善良的人，看到的都是美好；多疑的人，會認為別人都不懷好意
        C: 最近種植高麗菜利潤非常高，大家便一窩蜂到菜園裡栽種高麗菜
        D: 本來乾淨的公廁，只要有人不愛惜乾淨，大家就會跟著亂丟垃圾
      teacher_hint: |-
        第3題解析：
        Ｂ.投射效應
        Ｃ.羊群效應
        Ｄ.破窗效應
    - index: 4
      answer: D
      stem: 「長達43年，都沒有人對凱蒂案提出質疑？」最可能的原因為何？
      options:
        A: 一般老百姓並沒有管道與方法可以提出質疑
        B: 多數人會害怕自己的判斷與大家不一樣
        C: 大家都認為事不關己，不想多管閒事
        D: 過度相信權威與教科書記載，沒有重新查核
    - index: 5
      answer: D
      stem: 未來生活中若遇到真假難辨的訊息，我們應該怎麼做？
      options:
        A: 警察為人民保母、有問題可詢問警察
        B: 書中的知識都經過前人驗證，可相信
        C: 聽權威的科學家、醫師等專業人士怎麼說
        D: 多質疑、多檢驗，並保持探究的心

