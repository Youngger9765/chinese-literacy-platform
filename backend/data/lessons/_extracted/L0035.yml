          options: {1: 參與者, 2: 活動方式, 3: 目的}
          answers: [1, 2]
          answer_note: 題末印「（3選2）」
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: guide
          text: ★ 你有沒有發現，找出這則新聞報導的上位概念──「起因、目的、參與者、活動方式」以後，你就會發現這則報導，只剩4個概念、11個字了。
    - type: sub_block
      label: 練習三
      instruction: |-
        1. 再回到本課課文。請你往前翻2頁，你看到了嗎？「五、文章重點表」最左邊的兩個欄位，都是課文的「上位概念」哦！
        2. 請你參考「五、文章重點表」，寫出下表右欄文字的上位概念。
      items:
        - type: fill_table
          columns: [上位概念, 課文文字]
          rows:
            - 上位概念: 【　】
              answer: 兩位受迫害的青少年or 聲援對象
              answer_note: 原稿手寫兩個答案並列（「兩位受迫害的青少年 or 聲援對象」），兩個都算對
              課文文字: 2012年12月8日，15歲的女孩琪哈姆，試圖逃離國家而遭到逮捕。至今已超過10年，她生死不明、毫無消息，而她的家人求助無門，也只能乾著急。2020年8月，白俄羅斯16歲的米基塔，某日經過廣場時，意外被捲入抗議人群中，隔天，警方便指控他向警察投擲汽油彈，被判處五年徒刑。從那時起，他被關進黑牢，患有癲癇的他不但沒有得到適當的醫療照顧，且疑似遭受酷刑。
            - 上位概念: 【　】
              answer: 活動方式 or 活動目的
              answer_note: 原稿手寫兩個答案並列，兩個都算對
              課文文字: (寫信馬拉松)這個活動邀請世界各地的人寫一封信，支持那些受到政府壓迫、監禁的人們，給予他們的家人關心和鼓勵，也積極向政府或相關單位施壓，
          answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
          note: 右欄兩段都是課文的**改寫版**（例：課文寫「還疑似遭受酷刑」，這裡寫「且疑似遭受酷刑」；課文寫「透過信件支持那些受到政府壓迫、監禁的人」，這裡寫「支持那些受到政府壓迫、監禁的人們」）。各自照抄，不互相對齊。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      stem: 下列語詞何者使用正確？
      options:
        A: 能成為同班同學是珍貴的「緣起」，我們要好好珍惜
        B: 因為消息來得太突然，大家「素未謀面」，不知所措
        C: 偏鄉地區醫療資源缺乏，許多民眾生病時「求助無門」
        D: 「突發奇想」的大雨讓行人措手不及，紛紛跑到騎樓下躲雨
      teacher_note: |-
        (A)宜改為「緣分」(B)宜改為「面面相覷」
        (D)宜改為「突如其來」
    - index: 2
      answer: C
      stem: 「信件的力量不僅傳遞關懷，更改變了許多人的命運，讓他們從黑暗走向光明」，關於這句話的詮釋，下列敘述何者正確？
      options:
        A: 信件中的關懷，造成他人命運起起伏伏
        B: 信件的力量，幫助許多人去反省自己糟糕的生活
        C: 信件表達對收件者的關心，也幫助許多人擺脫困境
        D: 信件中的文字，讓許多人認識到他人不同的人生經歷
      teacher_note: 選項C說明信件既傳達了關心，又幫助受援者擺脫困境，正符合「從黑暗走向光明」的象徵意涵。
    - index: 3
      answer: A
      stem: 第1段作者用「你知道嗎？」和「你相信嗎？」兩個問句開頭，主要有什麼作用？
      options:
        A: 吸引讀者注意，引發對信件力量的好奇
        B: 表示作者懷疑信件是否真的能幫助別人
        C: 說明作者不清楚寫信馬拉松活動的由來
        D: 要求讀者回答問題後，才能繼續閱讀文章
      teacher_note: 這兩個問句的目的在於吸引讀者、並激發好奇心
    - index: 4
      answer: B
      stem: 根據第5段，「寫信馬拉松」為什麼有機會幫助聲援對象重獲自由？
      options:
        A: 許多信件感動了政府，使政府主動釋放受迫害者
        B: 大量信件引起國際關注，進而對政府形成壓力
        C: 活動主要針對少部分極權國家，因此成效較為明顯
        D: 寫信行動是由政府主動邀請民眾參與，想改善目前的政策
      teacher_note: 文章反覆提到信件能引起國際社會對案件的注意，從而對極權政府施加壓力，因此正確答案為 B。
    - index: 5
      answer: A
      stem: 文章已經舉琪哈姆與米基塔的例子，為何還需舉泰國蓉的例子？下列對「蓉的例子在文中的作用」的說明，哪一項不正確？
      options:
        A: 蓉的例子能證明所有受援者，最後都能獲得自由
        B: 蓉是援助成功的例子，能說明國際聲援確實能促使改變
        C: 三人皆來自不同國家，突顯援助對象不分國界。
        D: 蓉是成年人，搭配琪哈姆與米基塔這兩位青少年，展現援助對象年齡層的多元性。
      teacher_note: 所有受援者最後都能獲得自由，這並非事實，因此正確答案為 A。

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [國際特赦組織, 壓迫, 求助無門, 乾著急, 癲癇, 極權, 聲援, 充耳不聞, 素未謀面, 緣起, 突發奇想]
  grid_size: [10, 10]
  grid:
    - 電風扇下雨天乾著急忙
    - 充電器雨寫信國幫忙碌
    - 耳緣起天氣晴際瘋癲預
    - 不由突發奇想特聲練癇
    - 聞求緣分天人赦援武雨
    - 風助人民極權組助功過
    - 不無民突緣素織拉筋天
    - 動門口述發現未松鼠青
    - 做自己的主其來謀反木
    - 被受壓迫切尋想見面瓜
  answers_are_graphical: true
  # ⚠️ 格子裡有 **12 個圈**，但目標語詞只有 11 個。多出來的那一條見 source_errata E1
  #    （見下方 extra_circle_note）。11 條路徑與 12 個 roundRect 的尺寸一一對得上：
