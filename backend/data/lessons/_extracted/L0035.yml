          answer: 3
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
          explanation: 這段文字的上位概念是「起因」。因為它引發了後續的行動
          prefilled: true      # 範例列原稿就已勾好，不是要學生作答的
        - type: guide
