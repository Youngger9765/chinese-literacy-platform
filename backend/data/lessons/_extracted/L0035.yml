        - type: single
          index: 1
          prompt: 為了感謝消防員的辛苦與付出
          options: {1: 參與者, 2: 活動方式, 3: 目的}
          answer: 3
          answer_note: 題末印「（單選）」
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: multi
