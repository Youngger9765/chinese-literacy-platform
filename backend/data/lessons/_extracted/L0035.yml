# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 8
  # ⚠️ 段號欄第一格印的是注音符號「ㄧ」（U+3127）不是漢字「一」（同 L0015）。
  paragraphs:
    - idx: 1
      text: 你知道嗎？一封信，除了能尋求協助，也可能改變另一個人的命運。你相信嗎？一張張的明信片，不僅能帶來勇氣與力量，更可能支撐一個人從黑暗走向光明。
    - idx: 2
      text: 二十年前，一群關注社會議題與人權的朋友突發奇想，決定以創新的方式慶祝12月10日的世界人權日─舉辦一場24小時的寫信活動，為遭受不公平對待的人們發聲。這便是國際特赦組織「寫信馬拉松」活動的由來。這個活動邀請世界各地的人寫一封信，透過信件支持那些受到政府壓迫、監禁的人，給予他們的家人關心和鼓勵，也向政府或相關單位施壓，是現今全球最大的人權活動。
    - idx: 3
      text: 不過，或許你很難想像，即使當今世界看似文明進步，仍有人遭受不公不義的對待，其中也包括青少年。
    - idx: 4
      text: 在非洲東北部的厄利垂亞，20年來由同一位總統治理，人民沒有言論、參政、新聞等自由，被稱為「非洲版北韓」。2012年12月8日，15歲的女孩琪哈姆，試圖逃離國家而遭到逮捕。至今已超過10年，她生死不明、毫無消息，而她的家人求助無門，也只能乾著急。2020年8月，白俄羅斯16歲的米基塔，某日經過廣場時，意外被捲入抗議人群中，隔天，警方便指控他向警察投擲汽油彈，被判處五年徒刑。從那時起，他被關進黑牢，患有癲癇的他不但沒有得到適當的醫療照顧，還疑似遭受酷刑。
    - idx: 5
      text: 這兩位青少年，都是「寫信馬拉松」聲援的對象。「這封信，極權政府大概不會看，甚至可能無法送達收信人手上。」記者張育軒說，「然而，幾萬人同時發出聲援，即使極權政府充耳不聞，也能引起國際社會對案件的關注。」這項活動也確實對極權政府造成壓力，改變了超過百人的命運，讓他們擺脫了殘酷與不公不義的對待，泰國的蓉就是一例。
    - idx: 6
      text: 泰國是少數實施「冒犯君主罪」的國家之一，批評王室成員可能導致入獄。22歲的蓉，因為呼籲廢除國王特權，而面臨終身監禁，也因此成為寫信馬拉松聲援的對象。「這些字句，點亮了我最黑暗的時光，他們和我素未謀面，我卻感受他們的愛。」蓉在被釋放後表示，這些信件帶給她無比的力量。「如果沒有國際壓力，沒有人認識我，沒有人為我寫信，我可能會在監獄裡待更久，這對我來說就是奇蹟。」
    - idx: 7
      text: 每年12月，臺灣北中南各地也會舉辦寫信馬拉松的活動。2023年在臺北的華山文創園區，一群人專注地寫著明信片，有的明信片上是密密麻麻的英文，有的畫上了可愛的插圖，每張都傳達著滿滿的鼓勵與祝福。會場四周展示著活動的緣起與聲援對象的簡介，現場還有歌唱表演或講座，讓活動內容更加豐富。
    - idx: 8
      text: 信件的力量，遠超乎我們的想像。一封封充滿關懷與支持的信，猶如黑暗中的一道光芒，為世界各地身陷困境的人們帶來希望和勇氣。「寫信馬拉松」讓大家看見，每個人都能成為改變的推手，每一封信都是一個承諾，告訴世界上不公義的黑暗勢力：我們看見了，我們在乎，我們不會放棄。告訴每一位受難者和家人：我們與你同在，你不孤單，我們一起迎接雨過天青的那天。
  source_line: (文章資料來源：國際特赦組織網站)
  inline_marked_terms: [突發奇想, 國際特赦組織, 壓迫, 厄利垂亞, 求助無門, 乾著急, 癲癇, 極權, 聲援, 充耳不聞, 素未謀面, 緣起]

