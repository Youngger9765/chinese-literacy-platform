body:
  paragraph_count: 10
  paragraphs:
    - idx: 1
      text: "「鏘！」球棒敲到球的聲音又硬又脆，投手阿澤幾乎反射性的轉過身，看著球貼著草皮往游擊手小宇的方向竄去。三局上半，兩出局，二、三壘有人。只要小宇接起這顆球傳到一壘，這一局就結束了。但小宇撲上前時，球忽然彈高，擦著手套邊彈了出去。下一秒，三壘跑者衝回本壘。「SAFE！（安全上壘）」裁判張開雙臂──失分了。"
    - idx: 2
      text: "阿澤在投手丘上臭著臉：「那種球也接不起來？不能再被打中了。我得靠我自己。」下一位打者走上打擊區，捕手阿凱比出暗號，要他投低球讓打者打成滾地球。那原本是阿澤最擅長的方式。但這次他搖了搖頭——他只想靠直球三振打者，這樣就不需要仰賴任何人。"
    - idx: 3
      text: "第一球，直球，打者揮棒落空。阿澤握了一下拳，更加篤定自己的想法。第二球，被打者咬中，球高飛往左外野邊線。阿澤的心跳差點停住，直到球落在界外才鬆一口氣，手心卻已經冷汗直冒。心裡一亂，接連兩顆都沒投進好球帶。第五球一離手他就知道不對——壞球。兩好三壞。"
    - idx: 4
      text: "阿凱喊了暫停，跑上投手丘，壓低聲音問：「你是不相信我的配球，還是不相信後面的守備？」這句話直接戳中阿澤不願承認的心結。他說：「我沒辦法相信內野。剛剛那球明明能守下來。」阿凱沒有急著反駁，只說：「我知道你很氣，但你一直想三振，真的是最好的方法嗎？還是只是因為你不敢把球交給隊友？下一球，你至少相信我。」"
    - idx: 5
      text: "阿澤輕輕點頭，看著腳下紅土的痕跡又深又亂，就像他現在的心情，可是他也知道，如果再繼續一意孤行，這個打者可能就要被保送了。這一次，阿澤接受阿凱的暗號，球投出去，往低角度鑽進好球帶，打者揮棒，打成一顆速度不快的滾地球，二壘手穩穩接起來傳向一壘。「出局！」這一局終於結束。"
    - idx: 6
      text: "走回休息區，教練在阿澤身旁坐下，阿澤低著頭說：「我只是想自己解決。」教練只說：「可是你剛剛反而丟掉了自己最厲害的武器。」阿澤沉默了。「棒球不是只有投手一個人在打。投手只是站在最前面的人，不是孤軍奮戰的人。但你如果不相信守備，就等於不相信自己的投球方式。他漏接了，的確是他的失誤，但不代表你就要獨自承擔所有責任。」"
    - idx: 7
      text: "教練起身離開，小宇走了過來說：「剛剛那球，對不起。」他看著自己的手套，「那顆球我等太久，沒有往前接。下次球再往我這邊來，我會主動往前一步。」阿澤看見小宇手套邊還留著撲球時沾上的紅土。原來小宇也一直記得那一球。阿澤本來想說些什麼，最後只是點了點頭。"
    - idx: 8
      text: "攻守交換後，輪到小宇走進打擊區，三壘有人，一人出局。他等了兩球，第三球揮出去，球往一壘方向滾去。阿澤看著小宇從打擊區衝出來，奮不顧身往一壘跑，一點都沒有減速，像是非得搶到那個壘包不可。可是還是比球慢了一步，「出局！」但此時，三壘跑者已踩回本壘，比分追平了。小宇只是喘著氣，站起來拍掉身上的土，阿澤看著他，心想：小宇只是剛剛失誤了，其實他跟我一樣在乎。"
    - idx: 9
      text: "下一局，阿澤再度站上投手丘。阿凱比出低球暗號，阿澤點了點頭。球投出去，「鏘！」又是游擊方向的滾地球。阿澤的心揪了一下，可是這一次，他往前跨了一步，準備補位。那一刻，他還不知道小宇會不會接住，可是他選擇相信，並回到了自己的位置。同一時間，小宇果斷趨前迎球，俐落的將球收進手套，傳向一壘。「出局！」阿澤轉回本壘，看見阿凱再次比出暗號。"
    - idx: 10
      text: "這一次，他沒有抗拒，他想再次相信，相信他身後的隊友。他知道自己該怎麼投。"
