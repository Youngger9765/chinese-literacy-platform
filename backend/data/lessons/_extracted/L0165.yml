        （□①害怕　②在乎）
        3.小宇在下一局時，雖然上壘（□①成功　②失敗 ），但也讓隊上（①拿下一分　□②丟了一分）。
      情節摘要_blanks: [{answer: 教練}]
      情節摘要_choices:
        - {label: 教練告訴阿澤不必, options: {1: 孤軍奮戰, 2: 自責失誤}, answer: 1}
        - {label: 原來小宇也很, options: {1: 害怕, 2: 在乎}, answer: 2}
        - {label: 小宇上壘, options: {1: 成功, 2: 失敗}, answer: 2}
        - {label: 讓隊上, options: {1: 拿下一分, 2: 丟了一分}, answer: 1}
      情節摘要_choices_note: |-
        這一格有 4 組獨立單選，`{欄名}_options`／`_answer` 一格只能表達一組，
        故改用 `{欄名}_choices` 列出四組（各自 label／options／answer）。
    - 階段: 結果
      段落: 9-10
      情節摘要: |-
        1.小宇成功接起【　】，讓對方打者出局。
        2.阿澤重新相信身後的隊友，（①接受　□②拒絕）捕手的配球。
      情節摘要_blanks: [{answer: 滾地球}]
      情節摘要_options: {1: 接受, 2: 拒絕}
      情節摘要_answer: 1
  rows_note: |-
    「段落」欄填的是段號範圍（1-2／3-5／6-8／9-10），是**印好的**不是空格。
    ☑ 在原稿是印在選項的「①/②」之前。⚠️ **未被勾的那個保留字面「□」，被勾的那個沒有字元** ——
    因為 ☑ 是 `w:sym`（沒有 w:t），文字流裡只剩 □。所以 value 照文字流寫（□只出現在未選項），
    被勾的是哪一個記在 answer / _answer / _choices。

# ── 六 品格聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 合作中的信任：溝通與調整
  strategy_type: character_teamwork_trust
  section_label: 品格聚光燈
  section_label_note: ⚠️ 本課型第六大題叫「品格聚光燈」不是「閱讀聚光燈」。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本節 5 個）＋橘色代號（單選題）
  blocks:
    - type: concept_box
      text: 在需要團隊合作的挑戰中，當隊友或組員出錯時，可能有些人會想：「算了，我自己來。」自己獨立完成看起來比較快，也比較能夠掌握，可是真的能解決合作的問題嗎？讓我們看看這個故事中阿澤前後的做法。
    - type: guide
      text: ◎故事回顧與推敲：
    - type: single
      index: 1
      prompt: 1.小宇漏接後，阿澤為什麼只想靠直球三振打者？
      options: {A: 他認為直球一定能三振所有打者, B: 他不想再讓隊友處理打出去的球}
      answer: B
      options_note: 選項代號在原稿是圈框字🄐🄑（U+1F150/U+1F151），此處以 A/B 記錄；答案欄填的是全形Ａ/Ｂ。
    - type: single
      index: 2
      prompt: 2.阿澤當時最接近哪一種想法？
      options: {A: 隊友失誤了，他應該要立刻退出比賽, B: 隊友失誤了，我只能把事情全扛下來}
      answer: B
    - type: guide
      text: →從故事可以看見，阿澤因為不放心，所以想將所有事情抓回自己手中。但阿澤的選擇帶來了好結果嗎？我們來看底下的整理表格。
    - type: table
      columns: [阿澤的做法, 造成的結果]
      rows:
        - [拒絕阿凱的低球配球, 放棄自己原本擅長的方法]
        - [一直想靠直球三振, 心情慌亂，接連投出壞球，差點保送打者]
    - type: single
      prompt: →阿澤想把事情全部扛下來的決定，讓事情（　）。
      options: {1: 更好, 2: 不好}
      answer: 2
      answer_carrier: 紅色 ☑（w:sym），PDF p7 可見
    - type: single
      index: 3
      prompt: 3.阿澤想自己解決，為什麼反而讓情況更加危險？
      options: {A: 他為了不依靠隊友，放棄了原本有效的分工, B: 他看到隊友失誤後，立刻失去了原有的投球能力。}
      answer: A
      options_note: B 選項句末有句號、A 沒有，原稿如此。
    - type: guide
      text: |-
        →由此可知，
        把事情全接過來，也許暫時比較放心，卻不一定真正解決問題。
        那還可以怎麼辦呢？除了獨撐大局，還能怎麼做？
        ❶說清楚疑慮：我真正不放心的是什麼？
        ❷調整合作：分工、做法或時間需要怎麼調整？
        ❸做好本分，準備支援：不把工作全搶走，也不完全放著不管。
    - type: guide
      text: ※我們先來看看故事中的人物怎麼做：
    - type: single
      label: ❶說清楚疑慮
      prompt: ❶說清楚疑慮：阿凱問出阿澤真正不放心的地方：
      options:
        1: 沒辦法相信內野會把打出去的球接起來
        2: 沒辦法相信自己的球可以有效壓制打者
      answer: 1
      answer_carrier: 紅色 ☑（w:sym）
    - type: guide
      text: →不要只說「我自己來」，先說清楚自己擔心什麼。
    - type: fill_table
      label: ❷調整合作
      columns: [人物, 調整]
      answer_carrier: 紅色 ☑（w:sym），本表 2 個
      rows:
        - 人物: 阿澤
          調整: |-
            ①接受阿凱的指示和配球
            ②堅持用直球和打者對決
          調整_options: {1: 接受阿凱的指示和配球, 2: 堅持用直球和打者對決}
          調整_answer: 1
        - 人物: 小宇
          調整: |-
            ①認為失誤沒什麼大不了，下一球努力就好
            ②為自己的失誤道歉，並在下一次調整動作
          調整_options: {1: 認為失誤沒什麼大不了，下一球努力就好, 2: 為自己的失誤道歉，並在下一次調整動作}
          調整_answer: 2
    - type: guide
      text: →問題說清楚後，再調整分工或做法。
    - type: single
      label: ❸做好本分，也準備支援
      prompt: ❸做好本分，也準備支援：從哪裡可以看出來？
      options:
        1: 阿澤照捕手的配球投球，同時往前跨一步，準備補位
        2: 阿澤不再理會守備，只專心站在投手丘上，好好投球
      answer: 1
      answer_carrier: 紅色 ☑（w:sym）
    - type: guide
      text: |-
        →相信隊友會完成他的部分，自己也做好本分，必要時準備支援。
        每個人仍要完成自己的責任，也可以在需要時互相協助。

    - type: guide
      text: ◎換個情境試試看：
    - type: passage
      paragraphs:
        - 下週要進行分組報告。小安負責找圖片，但到了星期五仍然沒有傳給組員。組長小傑擔心來不及，想把小安的工作全部接過來。
    - type: single
      index: 1
      prompt: 1.小傑「全部自己做」可能造成什麼問題？
      options: {A: 小安會更清楚自己的工作哪裡需要改進, B: 小傑負擔變重，小安也失去負責的機會}
      answer: B
    - type: single
      index: 2
      prompt: 2.哪一個做法最符合今天學到的方法？
      options: {A: 問清楚困難，重新確認期限，必要時協助一部分, B: 不詢問進度也不告訴小安，直接把圖片全部找完}
      answer: A
    - type: single
      index: 3
      prompt: 3.小傑可以怎麼說？
      options:
        A: 「我擔心報告來不及。你目前做到哪裡？我們一起確認下一步」
        B: 「這已經是最簡單的工作了，如果你做不到就要提前交代給別人」
      answer: A
    - type: guide
      text: |-
        →隊友沒做好時，把工作全部接過來，也許能暫時完成任務，卻可能讓自己負擔更重，也讓隊友失去負責和改進的機會。
        →先說出疑慮，再調整合作；各自做好本分，也準備在需要時互相支援，才是更好的合作方法。
        →但如果遇到有同學太過被動、不參與，甚至推卸責任，這時候就可以尋求老師的幫忙唷！
      text_note: 這三行印在一個圓角外框裡（PDF p9），是本節的結語框。
    - type: self_check
      label: ◎自我檢核
      instruction: 讀完這一課，我能：
      items:
        - 1.看出阿澤為什麼想把事情全部抓回自己手中。
        - 2.我能說明把事情全部自己做，為什麼沒有真正解決合作問題。
        - 3.我能用「說清楚疑慮、調整合作、做好本分並支援」處理新的情境。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      items_note: 第 1 項沒有「我能」開頭，第 2、3 項有。原稿如此。

# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色代號，PDF p10 可見
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1~5 題都有
  questions:
    - index: 1
      answer: D
      stem: 下列選項中「  」的語詞，何者使用正確？
      options:
        A: 團購飲料時，全班同學都「一意孤行」地選擇了黑糖珍奶
        B: 聽到獲得冠軍的消息，他「奮不顧身」，在現場又跳又叫
        C: 答應的事情，如果經常「仰賴」帶過，很快就會失去信任
        D: 他的神情「篤定」，面對不公不義的事情他決定勇敢面對
      teacher_hint: |-
        (A)「一意孤行」不適用團體共識
        (B)「奮不顧身」是指不顧一切
        (C)「仰賴」是依靠，此處宜用「耍賴」
      teacher_hint_note: 這則藍框印在第七大題標題旁（PDF p10 右上），不在題目旁邊。
    - index: 2
      answer: D
      stem: 根據第六段，教練對阿澤說：「你剛剛反而丟掉了自己最厲害的武器。」這句話的意思是什麼？
      options:
        A: 阿澤沒有繼續使用速度最快的直球
        B: 阿澤沒有發揮自己三振打者的能力
        C: 阿澤因為受到干擾，無法專心觀察打者
        D: 阿澤因不信任守備，放棄了擅長的投法
      teacher_hint: 阿澤決定自己三振選手後，改以直球對決，放棄自己擅長的球路。
    - index: 3
      answer: B
      stem: 文章開頭和後段都出現游擊方向的滾地球，作者這樣安排有什麼作用？
      options:
        A: 說明游擊方向是打者們最常攻擊的位置
        B: 用相似情境對照阿澤和小宇前後的改變
        C: 強調球場上的滾地球非常容易造成失誤
        D: 表示阿澤仍無法克服對守備失誤的擔心
      teacher_hint: 文章開頭，小宇漏接，阿澤因此不再信任守備；後段再次出現游擊方向的滾地球，小宇主動趨前接球，阿澤也選擇相信。相似情境能凸顯兩人前後的改變
    - index: 4
      answer: A
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 隊友失誤後，應說明問題、調整合作，不能只想獨自承擔
        B: 能力較強的人應該承擔更多責任，才能確保團隊獲得成功
        C: 比賽中出現失誤時，球員應該立刻改變原本的戰術
        D: 團隊中的每個人都要避免犯錯，才能獲得彼此的信任
      teacher_hint: 參考品格聚光燈的引導
    - index: 5
      answer: C
      stem: 分組報告時，組員說：「反正你做得最好，全部交給你就好了。」根據本文，最合適的回應是什麼？
      options:
        A: 「既然我能力比較好，這次就由我全部完成。」
        B: 「你們都靠不住，以後我不會再和你們一組。」
        C: 「每個人還是要完成分工，我可以協助你卡住的部分。」
        D: 「為了避免爭吵，我們先不要討論誰應該負責。」
      teacher_hint: 符合說明問題、調整合作、做好本分，準備支援的原則

