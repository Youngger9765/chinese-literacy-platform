    第 4 段 182 字 ＝ 印出的第 7 個數字 182；第 5 段 163 字 → 182＋163＝345 ＝ 末筆。
    （Word 口徑：一串阿拉伯數字算 1 個字，如 2023／323／40。）
    345 這個精準吻合同時證明**第 5 段是一整段**（含「不斷、能見度低，搜救工作十分困難。」）——
    若它另算一段，345 就會落在「加上雷雨」處而不是段末。
    字數欄止於 345 ＝ 第 5 段結束，第 6~9 段沒有標，原稿如此。
  paragraph_number_alignment_note: |-
    ⚠️ **不要照 PDF 上「號碼旁邊那一行」對位**，段號欄整體比實際內容晚一到兩行：
    PDF p2 把「六」印在「不斷、能見度低，搜救工作十分困難。」那行、把「七」印在第 6 段末尾、
    「八」印在第 7 段中間、「九」印在第 8 段末尾。
    真值來自兩個獨立證據，兩個都指向本檔的切法：
    ① DOCX 段號欄是一個儲存格裝九個號碼，去掉續行後鄰欄正好九段；
    ② 學習單自己印的段落索引全部吻合 —— 重點表「飛機失事（段2）／出現希望（段6）／
       孩子求生（段8）／結果（段7）」與聚光燈三、「問題2～3段、外界搜救4～6段、
       孩子自救8段、結果7段」，八個引用逐一對得上。
    ⚠️ 現行 v2 的切法是錯的：它少了第 1 段「這是個真實的故事。」，又把第 5 段拆成兩段，
    於是第 6 段以後全部往前錯一號 —— 正是 #2555 那種「錨點錯位」的形狀。
