# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略──問題—解決—結果找重點
  strategy_type: summary
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        這是一個真實故事，過去，我們已經學會用「問題—解決—結果」整理文章重點：
        1.發生了什麼問題？
        2.誰採取了什麼行動？
        3.行動最後帶來什麼結果？
        這一課再往前一步。〈奇蹟行動〉先寫搜救人員怎麼尋找孩子，寫到孩子獲救後，才回頭說明孩子如何在雨林中活下來。文章中有兩條分散在前後文的行動線，我們要把它們整理起來，才能找出全文重點。
        這一課要練習：
        ❶抓核心問題→❷找出兩條行動線→❸看每條線解決哪一部分問題
        →❹整合結果

    - type: guide
      text: 一、整理「問題—解決—結果」

    - type: guide
      text: 請你用過去學到的方法，整理本課的「問題—解決—結果」，並填入「解決」與「結果」所在的段落。

    - type: sub_block
      label: |-
        問題
        （第2～3段）
      layout_note: |-
        原稿把這四個 sub_block 排成一張兩欄表（欄名「元素(段落)」「重點」）：
        左欄是這裡的 label，右欄是 items。因為右欄裝的是真的選擇題與填空題，
        寫成 fill_table 會把選項壓成純文字，故改用 sub_block 保留可作答結構。
      items:
        - type: single
          prompt: |-
            1.飛機墜毀後，這篇文章最重要的問題是什麼？（單選）
          options:
            1: 四名孩子如何搭乘小飛機前往北方城市？
            2: 四名孩子受困雨林後，能否活下來並被找到？
            3: 搜救人員如何在雨林中學會野外求生？
          answer: 2
          answers_printed: true
          answer_carrier: 紅色 ☑（Wingdings F0FE），文字流以符號字元存在

    - type: sub_block
      label: |-
        解決
        行動線一：外界如何搜救
        （第【　】～【　】段）
      label_blanks: [{answer: "4"}, {answer: "6"}]
      items:
        - type: multi
          prompt: |-
            1.找重要行動
            下列哪些是搜救人員採取的行動？（5選4）
          options:
            1: 軍人帶著搜救犬進入雨林搜索。
            2: 超過200名原住民志工加入行動。
            3: 空投傳單和食物箱，播放祖母錄音。
            4: 根據足印、野果、奶瓶和遮蔽棚追蹤。
            5: 分辨可食用的植物，採集野果充飢。
          answers: [1, 2, 3, 4]
          answers_printed: true
          answer_carrier: 紅色 ☑（Wingdings F0FE）四個，第 5 項為空白 □
        - type: free_text
          prompt: |-
            2.把細節精簡成一句話
            上面的行動很多，請用一句話說出這些行動共同的作用。
            →軍人和原住民志工運用不同方法【　】，並根據孩子留下的【　】繼續追蹤，最後【　】。
          blanks: [{answer: 持續搜索}, {answer: 活動線索}, {answer: 找到四名孩子}]

    - type: sub_block
      label: |-
        解決
        行動線二：孩子如何自救
        （第【　】段）
      label_blanks: [{answer: "8"}]
      items:
        - type: multi
          prompt: |-
            1.找重要行動
            下列哪些是萊絲莉和弟妹採取的自救行動？（5選4）
          options:
            1: 分辨哪些植物可以吃、哪些有毒。
            2: 採集種子、野果和根莖類植物。
            3: 收集雨水，並在樹上搭建小屋。
            4: 照顧年幼的弟妹和小嬰兒。
            5: 空投傳單，播放孩子祖母的錄音。
          answers: [1, 2, 3, 4]
          answers_printed: true
          answer_carrier: 紅色 ☑（Wingdings F0FE）四個，第 5 項為空白 □
        - type: free_text
          prompt: |-
            2.把細節精簡成一句話
            上面行動很多，請用一句話說出這些行動共同的作用。
            →萊絲莉運用【　】，解決食物、飲水、休息和照顧弟妹等問題，讓四名孩子能夠【　】。
          blanks: [{answer: 族人教導的野外求生知識}, {answer: 在雨林中活下來}]
          blanks_note: 第一格原稿印成「族人教導的野 外求生知識」，「野」「外」之間多一個空格。

    - type: sub_block
      label: |-
        結果
        （第【　】段）
      label_blanks: [{answer: "7"}]
      items:
        - type: free_text
          prompt: |-
            1.把兩條行動線接起來
            請根據前面的整理，完成兩條行動線。
            ⑴孩子的自救行動→讓孩子【　】
            ⑵搜救人員持續搜尋→最後【　】
          blanks: [{answer: 撐過40天／活下來}, {answer: 找到孩子}]
        - type: free_text
          prompt: |-
            2.兩條行動線合起來，最後的結果是：
            四名孩子在雨林中撐過40天，最後【　】
          blanks: [{answer: 活著獲救}]

    - type: guide
      text: 二、整合全文重點

    - type: single
      prompt: 根據上面的整理，哪一句最能完整概括全文重點？（單選）
      options:
        1: 孩子運用求生知識撐過40天，顯示野外技能十分重要
        2: 搜救人員克服雨林阻礙持續尋找，最後成功找到四個孩子
        3: 孩子設法活下來，搜救人員持續尋找，兩條行動共同促成孩子獲救
      answer: 3
      answers_printed: true
      answer_carrier: 紅色 ☑（Wingdings F0FE）

    - type: guide
      text: 三、比較段落順序與文章結構

    - type: free_text
      prompt: 上面的表：問題在第【　】段；兩條解決行動線，「外界搜救」在第【　】段，孩子自救在第【　】段；結果在第【　】段。
      blanks: [{answer: 2～3}, {answer: 4～6}, {answer: "8"}, {answer: "7"}]

    - type: guide
      text: |-
        →你發現了嗎？
        文章的段落順序，不一定和「問題—解決—結果」的結構順序相同。
        整理重點時，要判斷各段屬於哪一部分，不能只看出現的先後。

    - type: guide
      label: ◎策略帶著走
      text: |-
        下次讀到同一個問題有不同人物採取行動時，可以問自己：
        1.誰做了什麼？
        2.每一組行動解決了問題的哪一部分？
        3.這些行動如何合起來，造成最後的結果？

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出文章真正要解決的核心問題。
        - 2.我能整理不同人物的行動，說出各自的作用。
        - 3.我能判斷各段屬於問題、解決還是結果，整理出全文重點。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 答案代號印在題號前的（　）內，文字流已含，非圖形層
  questions:
    - index: 1
      answer: B
      stem: 文中說「大家越來越覺得希望渺茫」，這句話最接近什麼意思？
      options:
        A: 大家已經掌握位置，很快就能找到孩子
        B: 孩子是否平安仍難確定，找到的希望很小
        C: 搜救人員決定停止搜索，不願繼續行動
        D: 雨林天氣逐漸轉好，搜索變得十分容易
    - index: 2
      answer: C
      stem: 搜救隊看到足印、被啃過的野果、奶瓶和遮蔽棚後，為什麼重新燃起希望？
      options:
        A: 這些線索證明孩子一直留在墜機現場
        B: 這些物品表示飛機上的物資仍保存完整
        C: 這些線索顯示有人活動，孩子可能還活著
        D: 這些物品讓搜救隊立刻知道孩子的確切位置
      teacher_hint: 足印、被啃過的野果、奶瓶和遮蔽棚，都顯示失事後可能仍有人活動，因此搜救隊相信孩子可能還活著。
    - index: 3
      answer: B
      stem: 哥倫比亞軍方在搜救過程中面臨的主要挑戰是什麼？
      options:
        A: 沒有足夠的人手和裝備
        B: 叢林環境惡劣，能見度低
        C: 當地原住民多數不合作
        D: 合格搜救犬的數量不足
      teacher_hint: (第四段：亞馬遜熱帶雨林植被茂密，巨樹多，密集度難以讓陽光透入，能見度低，這些因素使得搜救行動極為困難。)
    - index: 4
      answer: A
      stem: 下列哪一項最能說明「孩子自救」和「外界搜救」的不同作用？
      options:
        A: 孩子自救使他們活下來，外界搜救使他們被找到
        B: 孩子自救使搜救停止，外界搜救提供所有食物
        C: 孩子自救只是照顧嬰兒，外界搜救負責搭建小屋
        D: 孩子自救讓雨林變安全，外界搜救消除所有危險
      teacher_hint: A完整呈現兩條行動線。其他選項都把人物行動或作用弄錯。
    - index: 5
      answer: B
      stem: 下列哪一項最能概括本文主旨？
      options:
        A: 亞馬遜雨林環境險惡，年幼孩童不適合搭飛機出門
        B: 族人傳承的求生知識與持續搜救，共同促成孩子獲救
        C: 軍方擁有大量人力與設備，是救援成功的唯一原因
        D: 野外求生最重要的是辨識植物，其他方法並不重要
  teacher_hint_carrier: 三則教師註解印在題目右側的小方框內（文字方塊），文字流已含。

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [罹難, 植被, 殘骸, 蚊蚋, 渺茫, 危機四伏, 倖存, 襁褓, 骨瘦如柴, 充飢]
  grid_size: [10, 10]
  grid:
    - 瘦倖幸福岌危機四伏法
    - 骨伏飄氣岌渺小人類秒
    - 如植渺小可罹難充實殺
    - 紙被物然危機萬分蚊子
    - 片危種類充飢餓蚋頭骨
    - 人險大骨殘破不堪渺柴
    - 防殘襁殺瘦充電茫木火
    - 蚊骸強褓四如蚋紋僥存
    - 液骨骸大骨方柴倖免於
    - 體瘦倖存羅難過難起伏
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 危機四伏
      cells: [[1, 6], [1, 7], [1, 8], [1, 9]]
      direction: horizontal
    - word: 植被
      cells: [[3, 2], [4, 2]]
      direction: vertical
    - word: 罹難
      cells: [[3, 6], [3, 7]]
      direction: horizontal
    - word: 蚊蚋
      cells: [[4, 9], [5, 8]]
      direction: diagonal_down_left
    - word: 充飢
      cells: [[5, 5], [5, 6]]
      direction: horizontal
    - word: 骨瘦如柴
      cells: [[6, 4], [7, 5], [8, 6], [9, 7]]
      direction: diagonal_down_right
    - word: 渺茫
      cells: [[6, 9], [7, 8]]
      direction: diagonal_down_left
    - word: 殘骸
      cells: [[7, 2], [8, 2]]
      direction: vertical
    - word: 襁褓
      cells: [[7, 3], [8, 4]]
      direction: diagonal_down_right
    - word: 倖存
      cells: [[10, 3], [10, 4]]
      direction: horizontal
  answer_paths_note: |-
    10 個目標語詞全部圈到，roundRect 圖形也正好 10 個（1 個 7 圈的群組 ＋ 3 個單獨），
    數量相符，不需回頭補格。十條路徑套回 grid 都拼得回目標語詞。
  distractor_note: |-
    格子裡有大量同音／形近誘答：「幸」對「倖」（第 1 列第 3 格、第 9 列第 8 格另有真的「倖」）、
    「羅難」對「罹難」（第 10 列）、「僥存」對「倖存」（第 8 列）、「渺小」兩處對「渺茫」、
    「骨骸」對「殘骸」（第 9 列）。逐格取字確認過，格子本身**沒有印錯字**。

