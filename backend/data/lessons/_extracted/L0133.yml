    - type: single
      prompt: 3.「將瓶頸折斷後靜置，空氣中若有微生物，就會直接落入湯裡」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
      options:
        1: |-
          情境❶-瓶頸彎曲，瓶口保持開放
          ➜
          肉湯沒有腐敗
        2: |-
          情境❷-瓶頸被打斷，瓶口直接外露
          ➜
          肉湯臭了
        3: |-
          情境❸-瓶身傾斜，肉湯流到瓶口
          ➜
          肉湯臭了
      answer: 2
    - type: single
      prompt: 4.「把瓶身傾斜，讓肉湯流到瓶口」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
      options:
        1: |-
          情境❶-瓶頸彎曲，瓶口保持開放
          ➜
          肉湯沒有腐敗
        2: |-
          情境❷-瓶頸被打斷，瓶口直接外露
          ➜
          肉湯臭了
        3: |-
          情境❸-瓶身傾斜，肉湯流到瓶口
          ➜
          肉湯臭了
