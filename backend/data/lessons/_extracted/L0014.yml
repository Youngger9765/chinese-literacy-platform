# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾
    # ⚠️ 本課的 header 句末沒有句號（L0013 有）—— 原稿就是這樣，不要補。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 5
  paragraphs:
    - idx: 1
      text: 每個星期天上午，媽媽會帶我搭區間車從瑞穗回富里阿祖家。有時遇到乘客眾多、沒有座位時，媽媽會要我做一件事：用眼睛觀察車廂上的人們在做些什麼！
    - idx: 2
      text: 因為這項「觀察遊戲」，讓索然無味的火車行程趣味橫生。媽媽提醒，觀察時眼神不可直視或盯著他人看，避免讓人不自在；遇到新奇的事更不能露出吃驚或嘲笑的表情，保持自然和尊重是最關鍵的。我發現，車廂上的人除了睡覺、聊天、吃零食以外，最常見的就是滑手機，不論坐著站著都能滑，好像集體催眠儀式，一進車廂就拿出手機，然後頭也不抬的開始滑，進入網路的世界。但有一次，我發現有個與眾不同的大姊姊，她居然從包包裡拿出書本來閱讀，淺藍色的封面，不知道是什麼書名。她很專心，翻書的樣子很好看，和周圍都在滑手機的人比起來，簡直就像整個車廂裡唯一的主角。
    - idx: 3
      text: 從此，我的「觀察遊戲」就成了「尋找讀書人」。不限車廂，也包括車站、餐館，雖然滑手機者還是遙遙領先，但「讀書人」也偶有所見。瞧！有位背著旅行背包的叔叔在路邊的候車亭等車，他老神在在的拿出一本書看，帥極了。瞧！放學時刻有個小男孩蹲靠在圍牆邊看故事書，大人在一旁嘻嘻哈哈聊天，他完全樂在書中，不為所動。瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。
    - idx: 4
      text: 我問媽媽，為什麼讀書和滑手機會給人這麼不一樣的感覺呢？媽媽說：「我看到一個人在專心閱讀時，也覺得這是一幅令人賞心悅目的畫面，也許是書本只有單純的文字訊息，閱讀過程讓人慢下來、主動思考；而手機裡有太多誘惑性的刺激，為了獲得快感不停滑動，往往只是被動的接收訊息，因此才會帶給旁人不同的感受吧！」
    - idx: 5
      # ⚠️ PDF p2 上這一段跟「二 念順順」的指示語**疊印在一起**（第五段被推到下一頁、
      #    而念順順的文字框位置固定）。兩段文字互相穿插看起來像亂碼，但 document.xml
      #    的順序是乾淨的：第五段屬第一大題，不是念順順的一部分。
      text: 現在，我出門也會在背包裡放一本書，一有空檔就拿出來讀，我猜，現在我也成了別人眼中最美的畫面啦！
  inline_marked_terms: [區間車, 索然無味, 趣味橫生, 集體催眠, 與眾不同, 遙遙領先, 偶有所見, 老神在在, 不為所動, 優雅, 賞心悅目]

