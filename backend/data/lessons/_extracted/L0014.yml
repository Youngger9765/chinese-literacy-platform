# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略──推論文章主旨
  strategy_type: inference
  blocks:
    - type: concept_box
      text: |-
        主旨是作者最想告訴我們的主要想法。
        有些文章會直接把主旨寫出來，有些文章則要從線索來推論。
        找主旨時，可以先從幾個地方找線索：
        題目、開頭、結尾，或文章中的關鍵語句，都可能提醒我們作者想說什麼。
        不過，找到線索後，還要想一想：
        這些線索都在說什麼？作者最想告訴我們什麼？

    # ── 一、先認識主旨線索 ──
    - type: guide
      text: 一、先認識主旨線索
    - type: sub_block
      label: ◆ 題目線索：從文章題目找主旨線索
      instruction: |-
        文章題目常常會提醒我們：這篇文章可能主要在說什麼？
        例如：＜昆蟲的保命妙招＞
      items:
        - type: single
          index: 1
          prompt: 1.看到這個題目，我們可以先猜：這篇文章可能主要在說什麼？
          options: {1: 昆蟲保護自己的方法, 2: 昆蟲遇到哪些危險}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: guide
          text: →所以，題目可以先幫我們抓方向，再讀文章確認。
    - type: sub_block
      label: ◆ 頭尾段線索：從文章的開頭或結尾找主旨
      instruction: |-
        有些文章在開頭或結尾直接說出文章的主旨。
        你可以留意：有沒有一句話，很像文章要提醒我們的重點。
        例如：＜小孩與糖果＞──本文選自伊索寓言
      items:
        - type: passage
          label: 小孩與糖果
          paragraphs:
            - 一個小孩把手伸進裝滿糖果的瓶子中，他想盡可能地抓上一大把。但是當他想要伸出手來時，手卻被瓶口卡住了。他一個糖果也不願意放，因此手緊緊卡住，拔不出來，急得哭了起來。一個路人對他說：「你還是知足點兒吧，只要少拿一半，你的手就不會卡在瓶口了。」人還是要知足，貪多可能危害自己啊。
        - type: single
          index: 1
          prompt: 1.這段故事的結尾，哪一句最像作者想提醒我們的話？
          options:
            1: 他一個糖果也不願意放，因此手緊緊卡住。
            2: 人還是要知足，貪多可能危害自己啊。
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          index: 2
          prompt: 2.我們可以把這句話整理成更簡短的主旨
          options:
            1: 告訴讀者人要知足，不可貪心
            2: 告訴讀者拿糖果時要小心，不要把手卡住。
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: sub_block
      label: ◆ 重要內容線索：從關鍵語句找主旨線索
      instruction: |-
        有些文章不會在題目或結尾直接說出主旨，而是把主旨線索藏在段落中的重要語句裡。讀到重要語句時，可以想一想：作者最想告訴我們什麼？
        例如：＜ＯＯ的重要＞ ──本文修改自國立編譯館
      items:
        - type: passage
          label: ＯＯ的重要
          paragraphs:
            - 小明放學回家，告訴媽媽：「老師說，學校的春季旅行在四月二日上午出發。參加的同學，要準時到校，在操場上集合。」
            - 媽媽問小明說：「老師說幾點要到學校集合？」
            - 小明想了想說：「好像是八點，差不多跟平常一樣時間到校就好了，沒什麼關係吧。」
            - 媽媽說：「不能說『好像是』，也不能『差不多』!守時是很重要的事。不能遲到，讓大家等你一個人。你明天到學校，一定要再問老師。」
            - 小明說：「我知道了，我明天會再問老師。我也一定會守時，請媽媽放心。」
        - type: single
          index: 1
          prompt: 1.媽媽的話中，哪一句最像作者想提醒我們的重點道理？
          options:
            1: 老師說幾點要到學校集合。
            2: 守時是很重要的事。不能遲到，讓大家等你一個人。
            3: 你明天到學校，一定要再問老師。
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: free_text
          index: 2
          prompt: 2. 從這句重要語句，可以推論本文主旨是：【　】。
          answer: 守時很重要

    # ── 二、推論主旨：＜最美的畫面＞ ──
    - type: guide
      text: 二、推論主旨：＜最美的畫面＞
    - type: guide
      text: |-
        （一）找文章主旨線索
        找文章主旨時，可以先從題目、開頭、結尾或重要語句找線索。
        找到線索後，還要想一想：
        這些線索都在說什麼？作者最想告訴我們什麼？
    - type: sub_block
      label: ◆ 題目線索：從文章題目找主旨線索
      items:
        - type: single
          index: 1
          prompt: 1.題目〈最美的畫面〉不能直接看出完整主旨，但它提醒我們注意什麼？
          options: {1: 可能是在說哪一種畫面很美, 2: 可能是在說哪一張照片拍得很美}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: sub_block
      label: ◆ 重要內容線索：從文章內容找主旨線索。(課文第2、3段)
      instruction: 題目是〈最美的畫面〉，所以我們要找：作者覺得什麼畫面很美？
      items:
        - type: passage
          label: （段2）
          paragraphs:
            - 大姊姊很專心，翻書的樣子很好看，和周圍都在滑手機的人比起來，簡直就像整個車廂裡唯一的主角。
        - type: passage
          label: （段3）
          paragraphs:
            - 有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。
        - type: single
          index: 1
          prompt: 1.從2、3段來看，作者眼中「最美的畫面」是？
          options: {1: 專心閱讀的樣子, 2: 搭車聊天的樣子}
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: sub_block
      label: ◆ 結尾線索：從文章結尾找主旨線索
      items:
        - type: passage
          paragraphs:
            - 現在，我出門也會在背包裡放一本書，一有空檔就拿出來讀，我猜，現在我也成了別人眼中最美的畫面啦！
        - type: single
          index: 1
