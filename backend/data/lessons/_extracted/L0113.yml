body:
  lesson_heading: 第16課  我能不能選擇告別方式？
  課文作者: 曾世杰
  學習單: 陳淑麗
  paragraph_count: 9
  paragraph_numbering_note: |-
    段號欄印的是「ㄧ二三四五六七八九」——第一個是**注音符號 ㄧ（U+3127）**不是漢字一（U+4E00）。
    原稿如此，不是我打錯；查全庫時要注意這兩個字元不相等。
  paragraphs:
    - idx: 1
      text: 你有沒有想過：如果一個人每天都痛到睡不著，連呼吸都像被刀割，他還能怎麼活下去？傅達仁，叱吒風雲的籃球國手、家喻戶曉的體育主播，曾主播七屆奧運。2016年確診胰臟癌後，他經歷多次手術、化療，高大帥氣的他變得瘦骨嶙峋、形容枯槁。劇痛像刀子般持續的戳刺、割扯，讓他白天痛苦難當、夜裡無法成眠，只能靠強力止痛藥度過毫無品質的每一天。他想要了結這沒有盡頭的折磨，但沒有合法的管道可以達成。2016年底，他寫信給蔡總統，希望能推動安樂死立法並願做首例；總統府回函表示重視，也請相關單位處理。但這個議題爭議性高，各界難有共識，他一等再等，等不下去了。2018年他在家人陪伴下前往瑞士，6月7日依當地制度以「協助自殺」方式離世。
    - idx: 2
      text: 傅達仁的案例，把沉重的問題推到大家眼前：當生命只剩疼痛，病人能不能決定結束自己的生命？又能由誰提供協助？
    - idx: 3
      text: 「與臨終選擇有關的作法」大致可以分成三種。第一種是「不施行或撤除維持生命的醫療」，例如對病情已不可逆轉的病人不再插管、移除呼吸器、停止營養灌食等無效醫療，讓生命自然走到終點。第二種則是「安樂死」，由醫師依病人明確、持續的意願主動施用藥物，使病人死亡。第三種則是「協助自殺」，就是傅達仁瑞士行的目的：經過嚴謹的評估與確認，由病人在意識清楚、意願堅定時，在醫療人員的協助下，自己按下注射藥劑的開關。臺灣目前已有安寧緩和醫療與《病人自主權利法》，保障符合條件的病人拒絕或撤除特定維持生命治療，讓生命自然走到終點；後兩種在臺灣仍不合法。
      split_note: |-
        🔴 這一段在 DOCX 裡被拆成**兩個 `<w:p>`**，斷點落在句子中間
        （「…拒絕或撤除特」＋「定維持生命治療…」＝「撤除特定維持生命治療」）。
        段號欄只有 9 個號碼、而文字流有 10 個 `<w:p>` —— 靠這個數字對不上才發現。
        本檔按段號欄合成 1 段。⛔ 不合的話後面每一段的段號都會少 1，
        念順順的（五☞）就會指到「反對者則擔心」那段（#2555 那批 bug 的形狀）。
    - idx: 4
      text: 對於是否開放安樂死或協助自殺，常見的討論大致可分為三種主要立場。
    - idx: 5
      text: 支持者最重視「自主」與「尊嚴」，認為末期病人若反覆表達意願，社會應設計嚴格程序，讓病人在法律監督下做選擇。有人主張要有多位醫師評估、冷靜期與完整紀錄，避免草率決定。
      marker_note: ☞ 圖檔（wp:anchor）錨在這一段的段首，PDF p2 上也印在「支持者最重視」之前 —— 與念順順指示語印的「（五）」一致
    - idx: 6
      text: 反對者則擔心，一旦開放，適用的範圍會不會越來越大？更重要的是，弱勢病患可能承受看不見的壓力——他們會擔心醫療費用及照護人力會拖垮家人。病人難免會想「如果我不選擇死亡，我就會給家人帶來麻煩」，壓力不言而喻。也有人從宗教與倫理出發，認為只有上帝或老天才能決定生死，自己、家人及醫師都不該決定病人是否可以結束生命。
    - idx: 7
      text: 還有人採取保留態度，主張先落實臨終照顧：把疼痛控制、心理支持、長照與照顧者喘息服務做得更普及。因為很多「想走」可能只是「太痛、太孤單」。如果資源到位，如果社會能設身處地理解病人與家屬的需求，末期的病人就不會只剩非黑即白的極端選項。
    - idx: 8
      text: 這道難解的問題同時牽涉人權、信仰、風險與制度設計。支持者想把生命的抉擇權交給個人；反對者怕界線一開就覆水難收；保留者提醒照護缺口迫在眉睫。再加上臺灣文化常避談死亡，許多家庭到最後才匆忙決定，「自願」與「被迫」更難分辨。若要開放，如何設計審查、申訴與監督？若不開放，又如何確保病人不被疼痛吞沒？當眾說紛紜、莫衷一是時，這議題就只能原地踏步了。
    - idx: 9
      text: 傅達仁的故事像一面鏡子：它照見痛苦，也照見我們對自由、家庭與社會責任的拉扯。如果有一天，躺在病床上的是你，或站在病床邊的人是你——你希望自己被允許做什麼選擇呢？
  running_char_counts: [28, 57, 82, 109, 136, 165, 195, 224, 234, 261, 290, 320, 349]
  inline_marked_terms: [叱吒風雲, 家喻戶曉, 瘦骨嶙峋, 形容枯槁, 不言而喻, 臨終, 設身處地, 非黑即白, 覆水難收, 迫在眉睫, 眾說紛紜, 莫衷一是]
