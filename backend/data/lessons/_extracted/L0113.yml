    - {index: 2, stem: 報告明天要交，時間（　），我們決定今晚熬夜做報告。, answer: H}
    - {index: 3, stem: 和父母家人意見不同時，我試著（　）理解他們的想法與立場。, answer: F}
    - {index: 4, stem: 他照顧住院的家人好幾週，整個人（　），看起來很累。, answer: C}
    - {index: 5, stem: 事件真相尚未釐清，外界對原因（　），各有各的說法。, answer: I}
    - {index: 6, stem: 這件事還在調查中，別用（　）的想法，過早把人判定成好或壞。, answer: G}
    - {index: 7, stem: 題目做得越多越熟練，練習的重要（　）。, answer: D}
    - {index: 8, stem: 這部動畫在臺灣（　），大家對它的經典情節都能舉出例子。, answer: B}

# ── 五 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE ＋ w:color EE0000）＋橘色手寫填空；兩者都在文字流裡
  blocks:
    - type: concept_box
      text: 本文主要談一個人生重要的議題：能不能選擇告別方式。這種議題文章，就像一場「辯論」，你會看見多元觀點的討論。讀這類文章，重點是：「找到個別的觀點，再比較不同觀點的差異在哪裡？」最後再推論文章想要說什麼（主旨）。

    - type: guide
      text: 一、確定議題
    - type: free_text
      prompt: 1.這篇文章在談「哪個議題／爭議」【　】
      blanks: [{answer: 對安樂死或協助自殺的看法}]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    - type: guide
      text: 二、找觀點
    - type: guide
      text: 議題文章是在「說服」讀者：每一方會先表明立場與主張，再用理由說服。接著請你整理這個議題有哪些立場？每個立場的主張和理由是什麼？
    - type: fill_table
      label: 二、找觀點
      columns: [立場, 觀點要素, 請根據課文內容填答或勾選(單選)]
      rows:
        - 立場: 【　】
          立場_blanks: [{answer: 贊成}]
          觀點要素: 主張
          請根據課文內容填答或勾選(單選): 【　】
          請根據課文內容填答或勾選(單選)_blanks: [{answer: 在法律監督下開放讓病人選擇如何結束自己的生命}]
        - 立場: 【　】
          立場_note: 原稿此格與上一列合併（同一個「贊成」跨三列）
          觀點要素: 主要理由
          請根據課文內容填答或勾選(單選): ''
          請根據課文內容填答或勾選(單選)_options:
            1: 病人意願清楚且堅定時，應尊重其自主與尊嚴，讓他有選擇權。
            2: 病人意願清楚且堅定時，應先把照護資源做足再討論
          請根據課文內容填答或勾選(單選)_answer: 1
        - 立場: 【　】
          立場_note: 原稿此格與上兩列合併（同一個「贊成」跨三列）
          觀點要素: 條件
          請根據課文內容填答或勾選(單選): ''
          請根據課文內容填答或勾選(單選)_options:
            1: 應有多位醫師評估、冷靜期、完整紀錄等程序，避免草率決定。
            2: 先把疼痛控制與長照資源做足，再談是否開放。
          請根據課文內容填答或勾選(單選)_answer: 1
        - 立場: 【　】
          立場_blanks: [{answer: 反對}]
          觀點要素: 主張
          請根據課文內容填答或勾選(單選): 不開放安樂死／協助自殺
          請根據課文內容填答或勾選(單選)_note: 這一格是原稿印好的，不是填空
        - 立場: 【　】
          立場_note: 原稿此格與上一列合併（同一個「反對」跨兩列）
          觀點要素: 主要理由
          請根據課文內容填答或勾選(單選): ''
          請根據課文內容填答或勾選(單選)_options:
            1: 一旦開放且程序夠嚴格，就能避免界線擴大與被迫選擇。
            2: 一旦開放，適用範圍可能擴大；弱勢病患也可能承受壓力而被迫選擇。
          請根據課文內容填答或勾選(單選)_answer: 2
        - 立場: 【　】
          立場_blanks: [{answer: 保留}]
          觀點要素: 主張
          請根據課文內容填答或勾選(單選): 【　】
          請根據課文內容填答或勾選(單選)_blanks:
            - {answer: '先落實臨終照顧：'}
            - {answer: 讓疼痛控制、心理支持、長照與照顧者喘息服務更普及}
        - 立場: 【　】
          立場_note: 原稿此格與上一列合併（同一個「保留」跨兩列）
          觀點要素: 主要理由
          請根據課文內容填答或勾選(單選): ''
          請根據課文內容填答或勾選(單選)_options:
            1: 很多「想走」可能只是太痛太孤單，資源到位選項就不會只有極端選項。
            2: 很多「想走」可能因程序不夠嚴格；所以應先補強審查監督，再討論是否開放。
          請根據課文內容填答或勾選(單選)_answer: 1
      rows_note: |-
        原稿的「立場」欄是跨列合併的儲存格（贊成跨 3 列、反對跨 2 列、保留跨 2 列），
        本檔把它攤平成每列都帶立場，合併關係寫在 `立場_note`。
        三個立場本身是橘色手寫填空（PDF p6 上直排），不是印好的。

    - type: guide
      text: 三、比較觀點差異（用「價值／風險」兩個角度）
    - type: guide
      text: 我們先用「主張＋理由」掌握每一方在說什麼；再追問理由在強調什麼──重視的價值與擔心的風險。用這兩個角度看，就能清楚比較觀點差異。
    - type: fill_table
      label: 三、比較觀點差異
      columns: [立場, 重視的價值（單選）, 擔心的風險（單選）]
      rows:
        - 立場: 贊成
          重視的價值（單選）: ''
          重視的價值（單選）_options: {1: 自主與尊嚴, 2: 保護弱勢、避免被迫}
          重視的價值（單選）_answer: 1
          擔心的風險（單選）: ''
          擔心的風險（單選）_options: {1: 草率決定、意願不清, 2: 界線擴大、範圍越放越寬}
          擔心的風險（單選）_answer: 1
        - 立場: 反對
          重視的價值（單選）: ''
          重視的價值（單選）_options: {1: 自主與尊嚴, 2: 保護弱勢、避免被迫}
          重視的價值（單選）_answer: 2
          擔心的風險（單選）: ''
          擔心的風險（單選）_options: {1: 草率決定、意願不清, 2: 弱勢受壓、被迫選擇死亡}
          擔心的風險（單選）_answer: 2
        - 立場: 保留
          重視的價值（單選）: ''
          重視的價值（單選）_options: {1: 先把照護做到位, 2: 盡快立法開放選擇}
          重視的價值（單選）_answer: 1
          擔心的風險（單選）: ''
          擔心的風險（單選）_options: {1: 照護不足，逼人只剩極端選項, 2: 界線擴大，導致濫用難以收回}
          擔心的風險（單選）_answer: 1
      rows_note: 這張表的「立場」欄是原稿印好的（贊成／反對／保留），不是填空

    - type: free_text
      prompt: ＊歸納觀點差異：贊成者重視【　】；反對者最擔心【　】；保留者強調先【　】。
      blanks:
        - {answer: 自主與尊嚴}
        - {answer: 弱勢受壓、被迫選擇}
        - {answer: 把照護做到位}
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    - type: guide
      text: 四、推論主旨（從「觀點差異」推論整篇重點）
    - type: single
      prompt: 根據你整理的觀點差異（自主尊嚴／弱勢被迫／先補照護），下列哪一項最能概括本文主旨？（單選）
      options:
        1: 說明末期病人的自主選擇，並提醒制度應降低風險、補足照護資源
        2: 透過多元觀點對照，凸顯此議題在權利、風險與照護之間的兩難
      answer: 2

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出本文的多元立場，及各自的主張與理由。
        - 2.我能用「多元觀點對照」推論主旨。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿兩個 □ 都沒有勾

# ── 六 文章重點表 ──────────────────────────────────────────────
keypoints:
  title: 我能不能選擇告別方式？
  layout: list
  answer_carrier: 橘色手寫填空（教師版答案），文字流有此資訊
  rows:
    - label: 案例（段1）
      value: |-
        問題：傅達仁罹癌，他想結束痛苦折磨，但臺灣無合法管道。
        解決：寫信給總統盼【　】，但爭議大、難有共識。
        結果：在家人陪伴下前往瑞士，依當地制度以【　】方式離世。
      blanks: [{answer: 推動立法}, {answer: 協助自殺}]
    - label: 核心議題（段2）
      value: 當生命只剩疼痛，是否能【　】？誰能協助做決定？
      blanks: [{answer: 選擇告別}]
    - label: 三種性質不同的臨終選擇(段3)
      value: |-
        1.【　】：不做無效醫療，讓生命自然走到終點
        2.【　】：他人主動用藥，讓無法自我決定的病人死亡
        3.【　】：在醫療人員的協助下，自己按下注射藥劑的開關，完成最後一步。
      blanks: [{answer: 撤除維生醫療}, {answer: 安樂死}, {answer: 協助自殺}]
    - label: 臺灣現況(段3)
      value: 臺灣目前已有【　】與【　】，主要保障的是第一種；第二、三種仍不合法。
      blanks: [{answer: 安寧緩和醫療}, {answer: 病人自主權利法}]
    - label: 對議題看法：多元觀點(段4-6)
      value: |-
        1.贊成：在【　】下開放讓病人可選擇結束生命。
        2.反對：擔心開放後【　】；也擔心弱勢病患因【　】而被迫選擇死亡。
        3.保留：主張先落實【　】：疼痛控制、心理支持、長照與照顧者喘息更普及。
      blanks: [{answer: 法律監督}, {answer: 適用範圍擴大}, {answer: 費用／照護壓力}, {answer: 臨終照顧}]
    - label: 兩難(段7)
      value: |-
        1.此難題同時牽涉【　】、信仰、風險與【　】。
        2.若開放要設計【　】；若不開放要確保病人不被【　】吞沒、補足【　】。
      blanks: [{answer: 人權}, {answer: 制度設計}, {answer: 審查、申訴與監督}, {answer: 疼痛}, {answer: 照護缺口}]
  rows_note: |-
    ⚠️ 這張表的段號**跟課文段號欄對不上**：表上「多元觀點(段4-6)」對應的是課文的第 5~7 段
    （支持者／反對者／保留者），「兩難(段7)」對應的是課文第 8 段。
    看起來是把第 4 段（「對於是否開放…三種主要立場。」）併進第 3 段來數的。
    ⛔ 我照原稿抄，沒有改成課文的段號 —— 那是替教材做決定；但這一條要讓人知道，
    因為前端若拿這裡的段號去索引課文段落會全部差一號。
    左欄的標籤在原稿分行印（例如「三種性質／不同的／臨終選擇／(段3)」），本檔合成一行；
    括號用字照原稿：「（段1）」「（段2）」是全形、「(段3)」之後是半形。

# ── 七 閱讀理解 ────────────────────────────────────────────────
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號寫在題號前的括號內（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 2、3、4、5 題有，第 1 題沒有
  questions:
    - index: 1
      answer: D
      stem: 第三段指出臺灣已有安寧緩和醫療與《病人自主權利法》，並鼓勵民眾預先決定醫療選擇。作者最想強調的重點是什麼？
      options:
        A: 臺灣已全面讓臨終病人的安樂死與協助自殺合法化
        B: 臺灣目前鼓勵民眾尋求各種醫療方案以延長壽命
        C: 只要臨終病人簽字，就能要求醫師立即結束生命
        D: 臺灣的制度法令尊重臨終病人停止無效醫療的決定
    - index: 2
      answer: C
      stem: 第七段提到「如果資源到位……末期的病人就不會只剩非黑即白的極端選項」，這段話主要在強調什麼？
      options:
        A: 很多求死念頭，可能來自疼痛與孤單等生不如死的處境
        B: 要降低爭議，必須先釐清安樂死與協助自殺的差別
        C: 只要有完善的照護，就能減少因疼痛孤單而求死的情況
        D: 真正想要解決問題，仍需盡快推動法律開放與全面上路
      teacher_hint: 第2題解析：這句話的重點在「如果資源到位」，病人就不會只剩「非黑即白」的極端選項
    - index: 3
      answer: C
      stem: 根據文章內容，下列哪一項最能說明支持者與反對者立場的核心差異？
      options:
        A: 是否相信醫師有能力正確判斷病人的真實意願
        B: 是否贊成參考瑞士的制度來處理臨終病人的選擇
        C: 對「自主與尊嚴」和「開放後風險」的取捨不同
        D: 是否認為只要程序嚴格就能完全避免制度被濫用
      teacher_hint: 第3題解析：支持者重視「自主」與「尊嚴」；反對者則擔心開放後弱勢病患承受壓力等「潛在風險」。差異是對「自主尊嚴」與「風險的權衡」
    - index: 4
      answer: D
      stem: 作者先用傅達仁案例，再進行三種類型的分類，接著呈現三方立場。這種安排最可能是為了什麼？
      options:
        A: 先製造情緒衝突，再讓讀者只接受作者強調的結論
        B: 先描寫人物形象，再把他塑造成唯一正確的選擇榜樣
        C: 先解釋法律條文細節，再用案例補充艱深的專業內容
        D: 先建立共感與問題感，再用概念與觀點整理複雜議題
      teacher_hint: 第4題：「案例→核心問題→概念分類→多方觀點」是典型議題文結構：先讓讀者理解痛苦與情境，再用清楚框架避免討論混亂
    - index: 5
      answer: A
      stem: 下列哪一項最能概括本文主旨？
      options:
        A: 以傅達仁案例，引出安樂死爭議並分析多方立場與制度困境
        B: 批判臺灣政府消極無為，讓末期病人只能出國尋求協助自殺
        C: 介紹傅達仁的生平事蹟，凸顯他對臨終病人生命決定的訴求
        D: 提醒民眾不要害怕談死亡，要早一點做重要決定、預立遺囑
      teacher_hint: 本文核心是用案例引出議題，進一步定義分類、說明臺灣現況、呈現支持/反對/保留三方觀點，最後回到制度設計與價值拉扯
      teacher_hint_note: 這一則解析的藍框沒有寫「第5題」前綴，位置排在第 5 題選項下方（PDF p10 上方）

