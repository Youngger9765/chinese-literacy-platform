vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [推論, 差距, 異議, 差異, 複製, 平均值, 年齡層]
  grid_size: [10, 10]
