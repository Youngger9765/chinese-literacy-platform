  vocabulary_bank: [推論, 差距, 異議, 差異, 複製, 平均值, 年齡層]
  vocabulary_bank_note: 原稿語詞框印成「推論、差距、異議 、 差異、複製、平均值、年齡層。」（「異議」兩側有空格、句末有句號），本欄記為乾淨的語詞清單。
  answer_carrier: 橘色手寫字（PDF p3~p4）；文字層的空格內已填有同樣的答案
  items:
    - {index: 1, word: 差異, definition: "兩件事情不一樣的地方，例如：Ａ班身高平均160cm，B班身高平均150cm，我們會說兩班的身高有「差異」。"}
    - {index: 2, word: 年齡層, definition: 依年齡範圍分成的群體，例如幼兒、青少年、成年人。}
    - {index: 3, word: 複製, definition: 把相同的東西再做一份。}
    - {index: 4, word: 異議, definition: 對原有的說法提出不同意見或質疑。}
    - {index: 5, word: 差距, definition: "兩個數字或情況相差多少，常用來比較成績、能力等。例如：A 班平均 85 分，B 班平均 78 分，兩班的分數差距是85-78＝7分。"}
    - {index: 6, word: 推論, definition: 根據已經知道的事情或線索，想出還不知道的結果或答案。}
    - {index: 7, word: 平均值, definition: "把一組數值加起來，再除以數值的個數，得到的代表性數字。例如：50、60、70 公斤的平均值是 60 公斤。"}
  items_note: 第 1 題的「Ａ班」是全形 Ａ、「B班」是半形 B（原稿如此）。

