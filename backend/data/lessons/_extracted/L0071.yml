            - {answer: 照樣唸一遍 （或依照順序唸一遍）}
        - label: 得分標準
          value: 如果受試者能記住「9個」數字，無法記住10個數字，那麼得分為【　】。
          blanks:
            - {answer: 9}
    - label: 實驗一：老中與老美的數字記憶廣度比較
      items:
        - label: 參與者
          value: 說【　】語與【　】語的兩組大學生。
          blanks:
            - {answer: 漢}
            - {answer: 英}
        - label: 結果
          value: 老中的記憶廣度得分比老美高，可能和漢語數字的發音【　】有關。
          blanks:
            - {answer: 較短}
    - label: 其他科學家的異議
      items:
        - label: 另一種可能
          value: 兩組從小接受的【　】可能不同，因此不能只用發音長度解釋。
          blanks:
