        - {如果你有這些優勢: 5.不怕陌生人，勇於跨出舒適圈交朋友。, 哪一個是你的優勢戰場？_options: {1: 靜態觀察植物生長, 2: 行銷專案業務}, 哪一個是你的優勢戰場？_answer: 2}
