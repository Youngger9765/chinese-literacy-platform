    - {part: 2, index: 9, word: 駕輕就熟, definition: 對一個技能太熟練了，所以做起來很輕鬆。}
    - {part: 2, index: 10, word: 盔甲, definition: 古代人打仗時穿在身上的保護衣，通常是金屬做的。}
