  vocabulary_bank: [血脈賁張, 對峙, 輕舉妄動, 僵持, 叫陣, 身材魁梧, 望而生畏, 不甘示弱, 千古流傳, 毫無勝算, 迅雷不及掩耳, 大驚失色, 堅不可摧, 盔甲, 廝殺, 破綻, 無用武之地, 力大無窮, 羊入虎口, 堅持己見, 挑釁, 孤立無援, 螳臂擋車, 駕輕就熟, 匪夷所思, 舉步維艱, 獨排眾議]
  vocabulary_bank_note: 上面是兩篇合併後的完整清單；篇1 有 13 個、篇2 有 14 個，各自的語詞框分開印
  items:
    - {part: 1, section_no_printed: 三, index: 1, word: 對峙, definition: 雙方面對面僵持著，誰也不讓誰，好像隨時準備交戰。}
    - {part: 1, index: 2, word: 不甘示弱, definition: 不想被別人看扁，積極採取行動，想表現得和對方一樣好，甚至更好。}
    - {part: 1, index: 3, word: 堅不可摧, definition: 非常堅固，無法破壞；也可比喻強大的力量或意志。}
    - {part: 1, index: 4, word: 叫陣, definition: 在對戰前，挑釁對方出戰，大聲嗆聲要對方出來比一比、拼一拼。}
    - {part: 1, index: 5, word: 千古流傳, definition: 故事（或詩文）流傳很久，歷經千年仍被記得。}
    - {part: 1, index: 6, word: 輕舉妄動, definition: 沒有想清楚就亂行動。}
    - {part: 1, index: 7, word: 僵持, definition: 兩邊誰也不讓誰，卡在那裡很久沒結果。}
    - {part: 1, index: 8, word: 身材魁梧, definition: 形容人高大壯碩、體格強健。}
    - {part: 1, index: 9, word: 毫無勝算, definition: 一點贏的機會都沒有。}
    - {part: 1, index: 10, word: 迅雷不及掩耳, definition: 比喻動作或事情發生得太快，根本來不及反應。}
    - {part: 1, index: 11, word: 血脈賁張, definition: 形容情緒非常激動。賁：張大、鼓起、凸起。}
    - {part: 1, index: 12, word: 望而生畏, definition: 光是看到就感到害怕，形容對方氣勢強大或外表嚇人。}
