        ❷找初步答案：作者先給出的答案是什麼？
        ❸整理研究證據：每個研究發現了什麼？支持哪個重點？
        ❹統整結論：這些證據共同指向什麼答案？有沒有例外或限制？

    - type: single
      label: ❶找核心問題
      prompt: 本文想回答的問題是什麼？
      options:
        1: 肯亞為什麼常在馬拉松比賽獲獎？
        2: 高地訓練是否有助於運動表現？
        3: 紅血球太多會不會造成血栓？
        4: 玻利維亞人為什麼住在高地？
      answer: 2

    - type: guide
      text: 重點句：但是，高地訓練真的對每個運動員都有幫助嗎？

    - type: single
      label: ❷找初步答案
      prompt: 作者對這個問題的初步答案是什麼？
      options:
        1: 一定有幫助
        2: 完全沒有幫助
        3: 不一定，因人而異
        4: 只有肯亞選手有幫助
      answer: 3

    - type: guide
      text: 重點句：答案是「不一定」。

    - type: fill_table
      label: ❸整理研究證據
      columns: [研究, 研究發現, 支持的重點]
      rows:
        - 研究: 研究一
          研究發現: 同樣待在高地，有人 EPO 降低，有人升高400%以上
          支持的重點: 人體對高地的生理反應【　】
          支持的重點_blanks: [{answer: 因人而異}]
        - 研究: 研究二
          研究發現: 紅血球增加者長跑成績【　】；紅血球未增加者成績略退步
          研究發現_blanks: [{answer: 進步}]
          支持的重點: 同研究一，高地訓練是否提升成績，也是【　】
          支持的重點_blanks: [{answer: 因人而異}]
        - 研究: 研究三
          研究發現: 玻利維亞人紅血球太多，血液變【　】，可能增加血栓風險
          研究發現_blanks: [{answer: 濃稠}]
          支持的重點: 紅血球不是越多越好，太多也可能有心血管病變的【　】
          支持的重點_blanks: [{answer: 風險}]

    - type: exercise
      label: ❹判斷哪些證據能支持結論
      instruction: 下列哪些證據能支持這個結論？能支持的畫 O，不能支持的畫 X。
      note: 題目上方另印「結論：高地訓練的效果因人而異，訓練要考量個別差異。」
      items:
        - {type: free_text, prompt: 1.同樣在高地，有些人的 EPO 上升，有些人卻下降。, answer: O}
        - {type: free_text, prompt: 2.紅血球增加者回到平地後，5000公尺成績進步。, answer: O}
        - {type: free_text, prompt: 3.紅血球未增加者回到平地後，成績反而略退步。, answer: O}
        - {type: free_text, prompt: 4.基普喬吉小時候住在高海拔地區。, answer: X}
        - {type: free_text, prompt: 5.歷年來馬拉松前十傑中，有七人是肯亞選手。, answer: X}

    - type: self_check
      prompt: ◎自我檢核
      items:
        - 1.我能找出文章提出的核心問題。
        - 2.我能找出作者的初步答案。
        - 3.我能整理每個研究證據支持的重點。
        - 4.我能判斷證據是否能支持結論。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（在文字層），PDF p9 可見
  items:
    - index: 1
      stem: 依文中所述，下列哪一個圖是「血栓」?
      options_are_images: true
      options:
        A: ''
        B: (血管暢通)
        C: (血液流動方向)
        D: (血球)
      options_note: |-
        四個選項是四張圖（w:drawing）。文字層只有「A.」「B.」「C.」「D.」加上教師版的橘色括號註記；
        A 沒有註記。括號裡的字是註記，不是選項內容本身。
      answer: A
      explanation: (血栓為血管堵住，所以為A)
    - index: 2
      stem: 根據課文，運動員接受高地訓練可能有什麼好處？
      options:
        A: 高地稀薄的空氣可以讓血液變得濃稠
        B: 高地訓練可以提升每一位運動員的長跑成績
        C: 高地訓練可以刺激每位運動員體內EPO的生成
        D: 高地稀薄的空氣，可能有助於提升運動員的心肺耐力
      answer: D
      explanation: |-
        A.紅血球太多會使血液變黏稠
        B.因人而異。
        C.不一定。
        D.根據第三段：高地訓練會增進心肺耐力。
      explanation_note: 這一題的解析是逐選項的，印成兩個文字方塊（A~C 一個、D 一個）
    - index: 3
      stem: 紅血球與紅血球生成素的敘述，下列何者錯誤？
      options:
        A: 紅血球太多，容易讓血液變得濃稠
        B: 紅血球太多，不一定能幫助運動員
        C: 紅血球的多寡可能會影響長跑成績
        D: 每個人高地訓練後，紅血球都會增加
      answer: D
      explanation: （A-第七段，紅血球多會造成血液變濃稠。B-第七段，紅血球太多會造成血液太濃稠。C-紅血球增加者，長跑成績會更進步。D-紅血球生成素的濃度因人而異。）
    - index: 4
      stem: 根據本文，下列選項何者最符合作者想傳達的理念？
      options:
        A: 高海拔地區可以產出更多長跑好手
        B: 到高地訓練，容易發生血栓的危險
        C: 高地訓練需考量運動員的個別差異
        D: 運動員體內都有大量攜氧的紅血球
      answer: C
      explanation: （根據總結，高地訓練的效果因人而異，訓練要考量個別差異才行。)
      explanation_note: 這句的括號一邊全形一邊半形（（…)），原稿如此
    - index: 5
      stem: 文章中用三個研究說明高地訓練對運動員的影響，請問這樣的寫作方式目的是什麼？
      options:
        A: 作者想強調自己的勤奮與博學多聞
        B: 用三個研究增強論點的完整性與說服力
        C: 比較三個不同研究的差異之處
        D: 用三個研究增強文章的豐富度
      answer: B
      explanation: （作者先拋出提問高地訓練對運動員均有幫助嗎?答案是不一定。最後用三個研究證明他的論點，加強文章說服力。)

