# ── 三 閱讀聚光燈 ──
spotlight:
  strategy_name: 圖文表整合閱讀策略
  title_note: |-
    橫幅印「圖文表整合閱讀策略」，但第一頁的目標策略框與總表都寫「文圖表整合閱讀策略」。
    兩種寫法在同一份文件並存，各自照印出來的抄。
  blocks:
    - type: concept_box
      text: |-
        這篇文章裡，文字、圖片和表格都提供了重要訊息。閱讀時，不能只看文字，也不能只看圖片或表格，而要先注意文字怎麼提醒你看圖表、怎麼理解圖表的功能，再整合文字、圖片和表格——把相關訊息連起來想。
        這一課我們用下面4個步驟，練習圖文表整合閱讀：
        ❶先文字——找出要看哪一張圖或表，並抓出這段文字的重點
        ❷後圖表——判斷各圖表提供了什麼訊息
        ❸文圖表對照——找出文字與圖表相同或互相補充的訊息
        ❹整合推論——比較、連結各項資訊之間的關係

    - type: guide
      text: 熱身練習：第一段 vs 圖一
    - type: single
      prompt: 1.圖一最主要提供哪一類訊息？（單選）
      options:
        1: 兩種八哥外形相近的整體印象
        2: 兩種八哥近年的族群變化情形
      answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: single
      prompt: 2.讀完第一段後，請你找出和圖一最相關的文字。（單選）
      options:
        1: 白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。
        2: 這兩種八哥外形十分相似，不容易單靠外表一眼分辨。
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）

    - type: guide
      text: 練習一：第二段 vs 表一
    - type: guide
      text: |-
        步驟❶：先文字——抓出這段文字的重點
        小祕訣：當讀到「表一比較了……」時，就要轉去看表一，並問自己：「這段要我從表一找什麼？」
    - type: free_text
      prompt: 1.請把第二段文字中，要你看表的地方畫線或圈起來
      no_correct_answer: true
      answer_carrier: 學生在課文上畫記，原稿無示範答案
    - type: single
      prompt: 2.這段要你從表一看什麼？（單選）
      options:
        1: 八哥的外形習性等特徵
        2: 八哥的數量變化
      answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: guide
      text: |-
