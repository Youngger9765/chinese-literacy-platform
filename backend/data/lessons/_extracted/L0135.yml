        B: 增設更多橋梁與水泥建物，讓牠們改用人工設施繁殖
        C: 在人口密集商圈投放食物，吸引牠們習慣接近人群活動
        D: 讓兩種八哥共享同類巢位，以提高都市區域利用效率
