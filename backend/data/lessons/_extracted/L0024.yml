# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 找出觀點與支持理由
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        上一課，我們學會區分「觀點」和「支持理由」，也會檢查理由能不能支持觀點。再次複習什麼是觀點和支持理由：
        觀    點：作者對事情提出的看法或主張。
        支持理由：用來說明觀點有道理的事實、例子或數據。
        例如：觀點──三軍主要負責打雜。
        支持理由──(1)三軍要負責整理一、二軍的場地
        (2)三軍場地積水時要拿海綿一塊塊吸乾
        這個觀點只有一個重點，只要找出能支持「負責打雜」的理由就可以。有些觀點則同時包含幾個重點，這時，每個重點都要有相對應的支持理由。
        這一課，我們要進一步練習：
        先找出觀點中的不同重點，再分別找出能支持每個重點的理由。
      emphasis_note: 末句「先找出觀點中的不同重點，再分別找出能支持每個重點的理由。」印成粗體；「觀　點」「支持理由」兩個詞加了灰底

    - type: guide
      text: ◎小試身手：

    - type: single
      label: 一、確認觀點
      prompt: 一、確認觀點：本篇文章的主要觀點是下列何者？（單選）
      options:
        1: 進入高苑工商是周思齊第一次感覺到委屈與不甘心
        2: 周思齊曾經不被教練和學長看好，被直言沒有天賦
        3: 真正厲害的人是願意承認自己的不足，然後一步一步追上去
        4: 周思齊帶著熱愛棒球的心加入了職棒，卻面臨了前所未有的威脅和考驗
      answer: 3
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊

    - type: multi
      label: 二、找出觀點中的重點
      prompt: 二、找出觀點中的重點：上面的觀點包含哪兩個重點？（複選）
      options:
        1: 他受到的肯定
        2: 他的天賦
        3: 他一步步努力
        4: 他的委屈和不甘心
        5: 他承認自己不足
        6: 他熱愛棒球的心
        7: 所面臨的威脅考驗
      answers: [3, 5]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊

    - type: concept_box
      label: 《當觀點的重點不只一個…》
      text: |-
        《當觀點的重點不只一個…》
        觀點只有一個重點時：若文字裡只有一個重點，支持理由只要與那個重點有關就可以。
        例如：觀    點：三軍是打雜的。
        支持理由：只需要提到「三軍做了哪些打雜的事」。
        觀點有多個重點時：每個重點都要有相對應的支持理由。
        例如：觀    點：三軍是打雜的，且常被人瞧不起。
        支持理由：則需要提到「三軍做了哪些打雜的事」＋
        「三軍如何被瞧不起」
      source_text: |-
        《當觀點的重點不只一個…》
        觀點只有一個重點時：若文字裡只有一個重點，支持理由只要與那個重點有關就可以。
        例如：觀    點：三軍是打雜的。
        支持理由：只需要提到「三軍做了哪些打雜的事」。
        觀點有多個重點時：每個重點都要有相對應的支持理由。
        每個重點都要有相對應的支持理由。
        例如：觀    點：三軍是打雜的，且常被人瞧不起。
        支持理由：則需要提到「三軍做了哪些打雜的事」＋
        「三軍如何被瞧不起」
      errata_ref: E1

    - type: sub_block
      label: 三、觀點找支持理由
      instruction: 三、觀點找支持理由：根據上題分析，下列哪些事件或細節可以支持文章觀點中的兩個重點？（可複選）
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: multi
          index: 1
          prompt: 1.支持觀點重點：「願意承認自己不足」：
          prompt_marker_note: PDF 上「重點」與冒號之間印有 ❶，該符號不在文字流（Word 圖形/符號物件）
          options:
            1: 周思齊和光復國小的隊友們打出好成績，拿下全國第二名
            2: 周思齊因好友被教練力邀，而一起加入了棒球強隊
            3: 周思齊說：「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」
          answers: [3]
        - type: multi
          index: 2
          prompt: 2.支持觀點重點：「一步步追上去」：
          prompt_marker_note: PDF 上「重點」與冒號之間印有 ❷，該符號不在文字流
          options:
            1: 為了彌補體能，周思齊開始不搭校車，改用跑步當體能訓練
            2: 為了增進技巧，周思齊回到宿舍後也繼續練習揮棒。
            3: 為了增進技巧，宿舍晚上熄燈後周思齊會繼續到頂樓練習。
          answers: [1, 2, 3]

    - type: sub_block
      label: 四、延伸練習
      instruction: 四、延伸練習：根據下列觀點，找出適當的支持理由。
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      items:
        - type: multi
          index: 1
          prompt: 1.觀點：逆境使人成長。
          sub_label: 支持理由：
          options:
            1: 只有在大風大浪裡，才能看出船長的航行技術。
            2: 他靠著助聽器，彌補天生的聽覺障礙。
            3: 因為家裡窮，他比同輩更早開始了解理財知識。
          answers: [3]
        - type: multi
          index: 2
          prompt: 2.觀點：失去後才懂得珍惜。
          sub_label: 支持理由：
          options:
            1: 爺爺過世後，小明的家中再也沒有過年圍爐的笑聲。
            2: 阿芳珍惜畢業前能和同學相處的時光，規劃了許多活動。
            3: 附近的早餐店關門後，大華才發現這間店的口味無可替代。
          answers: [3]

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出觀點包含的不同重點。
        - 2.我能為每個重點找到適合的支持理由。
        - 3.我能排除不能支持觀點的內容。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 雖然無人對他「寄予厚望」，但他靠著努力贏得了教練肯定
        B: 他們的實力有「鴻溝」般的差距，比賽誰輸誰贏難以判斷
        C: 運動後的「懈怠」很重要，才不會讓肌肉處於太緊繃的狀態
        D: 他做事經常「自立自強」，不在乎他人感受，讓人難以認同
      option_notes:
        B: (B)「鴻溝」代表差距很大
        C: (C)宜用「放鬆」
        D: (D)宜用「自私自利」
    - index: 2
      answer: A
      stem: 第四段中「在不服輸前要先懂得認輸」最可能要表達的意思是下列何者？
      options:
        A: 先承認自己的不足，才能找到努力的方向
        B: 只要不服輸，就不需要承認失敗
        C: 認輸等於放棄比賽，不必再努力
        D: 先承認失敗，才能證明別人比自己差
      teacher_note: 根據文章，要先能承認和對手的差距後，再全力以赴努力。
    - index: 3
      answer: B
      stem: 第五段中，周思齊提到「簡單的事情重複做」，從文中內容看，這種訓練態度的最大優點可能是什麼？
      options:
        A: 能避免嘗試新方法帶來的風險
        B: 能在長期積累中不斷打磨基本功
        C: 能減少日常練習的時間與精力
        D: 能讓練習過程更輕鬆無壓力
      teacher_note: 反覆練習基本動作，能在長期累積中把基本功練得更熟練、更穩定，故選(B)
    - index: 4
      answer: C
      stem: 作者先寫周思齊引退賽的榮耀，再回頭敘述他早年不被看好的經歷，主要有什麼作用？
      options:
        A: 先交代引退賽的盛況，再說明職棒生涯最後的結果
        B: 以熱鬧的引退場面，表現球迷對他的支持與喜愛
        C: 以後來的成就對照早年的挫折，凸顯他努力成長的歷程
        D: 以獲得的多項獎項，證明他的成功主要來自天賦
      teacher_note: 透過描述挫敗凸顯他的努力與成長
    - index: 5
      answer: D
      stem: 體育記者對李教練的描述是「他是位看重團隊紀律的教練」，請問底下哪一選項「不能支持」這個觀點？
      options:
        A: 他要求球員晨操絕對準時，不能遲到早退
        B: 出外比賽，嚴格要求每位球員的服裝儀容
        C: 要求球隊自訂球隊公約，及違規的處罰方式
        D: 他依照每位球員的專長，安排適合的守備位置
      teacher_note: (D)是訓練方法「看重團隊紀律」無關

