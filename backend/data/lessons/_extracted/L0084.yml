    - {index: 9, word: 希冀, definition: 希望。}
    - {index: 10, word: 習以為常, definition: 因為習慣而視為平常。}
    - {index: 11, word: 微薄, definition: 微小單薄，形容少量。常用來形容收入、薪資。}
    - {index: 12, word: 熱衷, definition: 十分喜愛、投入。}

