      options:
        1: 從不同方面介紹仙境畫的特色，讓讀者增加更多古畫知識。
        2: 從不同方面共同呈現畫家對自然與理想世界的內心嚮往。
        3: 比較三種表現方式，判斷哪一種最能代表古代仙境畫。
      answer: 2

    - type: guide
      text: 三、前面的說明如何形成全文觀點？

    - type: single
      prompt: 1.最後兩段為什麼要寫現代人欣賞仙境畫時的感受？（單選）
      options:
        1: 補充現代人參觀博物館、欣賞水墨畫時可能出現的情景。
        2: 比較古今對自然的喜愛，說明現代人比古人更嚮往山林。
        3: 把畫家的內心嚮往連到現代人，說明藝術能跨越時空。
      answer: 3

    - type: single
      prompt: 2.下列哪一項最能說明作者如何一步一步形成全文觀點？（單選）
      options:
        1: 先介紹仙境畫的多種特色，再說明古畫能長久保存，讓現代人看見過去的山水。
        2: 先解釋仙境畫如何呈現畫家的嚮往，再連結現代人的相似感受，帶出藝術能連結古今。
        3: 先比較古今對神仙的看法，再指出兩者具有相同信仰，所以欣賞仙境畫時感受相同。
      answer: 2

    - type: guide
      text: |-
        ◎策略帶著走
        讀介紹畫作、建築或文物的文章時，可以問自己：
        1.作者寫了哪些具體內容？
        2.作者怎麼解釋這些內容？
        3.這些解釋最後形成什麼觀點？

