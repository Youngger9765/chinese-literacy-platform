# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: B
      stem: 下列語詞，何者使用正確？
      options:
        A: 近期流感頻傳，病毒透過「口耳相傳」讓人染病
        B: 經過一整天的來回奔波，爸爸到家時已「疲憊不堪」
        C: 啄木鳥正對著樹木「精雕細琢」，從中尋找食物
        D: 最幸福的事莫過於在「浩瀚無垠」的家好好放鬆
      explanation: A.口耳相傳指故事口頭流傳C.指工藝D.家無法浩瀚無垠，宇宙才可以。
      explanation_note: 原稿是一個浮動說明框，印在題號右側，用全形英文字母 Ａ／Ｃ／Ｄ 逐項說明錯在哪
    - index: 2
      answer: B
      stem: 張公洞為什麼常被畫家描繪成通往仙境的入口？
      options:
        A: 張公洞交通方便，古代畫家常前往遊覽寫生
        B: 張公洞幽深奇特的地景，增添了神祕的想像
        C: 古書證實曾有人從張公洞進入仙境生活
        D: 庶民畫家大多住在附近，熟悉洞內的景色
    - index: 3
      answer: C
      stem: 作者把古代仙境畫和現代人的拍照習慣作比較，主要有什麼作用？
      options:
        A: 說明古代繪畫技術不如現代攝影清楚
        B: 介紹古今記錄人物與風景的不同方法
        C: 凸顯人物渺小、山水宏大所表達的意義
        D: 批評現代人拍照時總把自己放在中心
      explanation: (藉由兩者巨大落差，人在大自然面前是如此渺小，更應該懷有謙卑的心。)
      explanation_note: 原稿是一個浮動說明框，印在題幹右側
    - index: 4
      answer: A
      stem: 元明時期，仙境畫開始在民間普及，這一現象反映了什麼文化變遷？
      options:
        A: 仙境畫從宮廷走向民間，投入創作的畫家更多
        B: 元明時期的畫家開始失去皇室的支持
        C: 人們對仙境的信仰開始動搖，反對虛構仙境
        D: 庶民畫家更熱衷於描繪真實的山水，「旅行」到仙境
      explanation: 第4段寫到，越來越多庶民畫家投入仙境畫創作，表示仙境畫已不再只屬於宮廷，而逐漸普及到民間
      explanation_note: 原稿是一個浮動說明框，疊在題幹與選項 A 上方
    - index: 5
      answer: C
      stem: 文末說：「誰說世界沒有神仙呢？」這句話最主要想表達什麼？
      options:
        A: 神仙是真實存在的，只是現代人失去尋找的能力
        B: 神仙居住山林，只有有緣人方能找到心中的神仙
        C: 藝術具有永恆的力量，能讓人在心中產生共鳴
        D: 神仙只是古代藝術作品中的象徵，並無現實意義
      explanation: 文章最後強調人們心中對美好生活與心靈寧靜的追求，這種精神上的「神仙」才是作者真正想表達的含義。
      explanation_note: 原稿是一個浮動說明框，印在選項 D 左側

