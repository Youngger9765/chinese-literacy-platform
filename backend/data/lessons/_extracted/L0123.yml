# ── 一 讀全文-做記號 ──
body:
  title_line: 第3課  爸爸的恩人們
  paragraph_count: 16
  paragraphs_note: |-
    段號欄印 ㄧ 二 三 … 十六 共 16 個（第一個是「ㄧ」U+3117 注音符號，不是漢字「一」，照原稿；
    最後一格「十五十六」兩個號碼擠在同一個儲存格）。第 13 段之後有一張插圖（圖片 127），不佔段號。
  paragraphs:
    - idx: 1
      text: 爸爸九十四歲，臉上雕鏤著歲月，老態龍鍾，記憶也不行了。才洗過澡，半個鐘頭後他會困惑的問：「是不是該洗澡了？」每天都固定去長照中心活動，但出門前幫他穿鞋穿衣時，他總會問：「我們要出去幹嘛？」
    - idx: 2
      text: 媽媽過世一年多了，爸爸卻常常問起：「你媽媽呢？怎麼好久沒看到她？」
    - idx: 3
      text: 「爸，媽媽過世了。」我只能一次次的提醒：「臨終那天您有去急診室向媽告別，出殯及追思會您也都去了。媽媽現在葬在陽明山。」
    - idx: 4
      text: 爸的眼睛瞪大：「怎麼會？什麼時候的事？」
    - idx: 5
      text: 「已經一年多了。」
    - idx: 6
      text: 帕金森症使他整日面無表情，但這樣直白而殘酷的提醒好像可以喚起一絲沉睡的記憶，他會皺眉、低頭，然後舉起右手，開始拍自己的腦袋，好像在說：「怎麼連這個也記不住？」
    - idx: 7
      text: 很多事都記不得了，但是，爸還記得八十年前的舊事。那時候他十四歲，日本統治才結束，大家開始捲著舌頭學說國語。爸想得起來的，都是他的恩人。
    - idx: 8
      text: 「我唸初中的時候，早上7點10分就要到校，整個臺東中學只有我可以遲到。」他說：「我早上四點多就得騎腳踏車去牧場工作，挨家挨戶送牛奶、收回空玻璃瓶。戴校長特別交代教官不要記我遲到。他還邀了主任，訂了我們的牛奶。」爸爸頓了頓，說：「戴校長是我的恩人。」
    - idx: 9
      text: 「池上來的林同學，對我真好，每次大考結束，我打完工，他就會邀我去大同戲院看電影，電影結束，回家前還在對街的大涼冰果室吃冰。我身無分文，從來都是他請客。感謝他沒有嫌棄我這個衣服全是補丁的同學。林同學是我的恩人。」
    - idx: 10
      text: 「還有一位同學，姓蔡，我一進東中，就想加入口琴社，但我哪裡買得起口琴？他居然拿了他家的口琴借我，一借三年。他也是我的恩人。那三年，我最愛吹的曲子就是『甜蜜的家庭』。」說著說著，老人哼起歌來：「我的家庭真可愛……」，歌聲沙啞走調，然後他泫然欲泣：「但我哪裡來的甜蜜的家庭？我從小就無父無母，是阿公阿嬤帶大的！」爸爸的媽媽15歲未婚生子，她18歲時另有婚姻，棄三歲的爸爸而去。
    - idx: 11
      text: 「我最大的恩人就是我的阿公阿嬤。」從小無父無母的他繼續說：「因為我要去臺東讀初中，就說服了老人家賣掉老家的菜園，搬到臺東。菜園賣了一萬五千元，阿公當年笑呵呵，捧著一疊鈔票說，算命先生預言他有一天成為萬元戶，沒想到這麼快就成真了。結果，搬來臺東不久，惡性通貨膨脹，豬肉每斤漲到75,000元，舊臺幣40,000元換新臺幣1元，阿公的15,000元一夕變成廢紙。都是我害的，都是我害的……」
    - idx: 12
      text: 彷彿穿越時空，眼前的爸爸成為那個痛苦自責的少年：「我們窮到沒東西吃，必須去漁港撿拾人家丟掉的魚內臟，那東西腥到難以下嚥。我們一無所有，阿公靠著一把斧頭養家。每天在卑南大溪河畔撿漂流木、劈柴，再挑著柴走回市區販賣。這趟路去一小時，回一小時。平日汗水淋漓，冬天卑南溪的風沙打在臉上，疼得讓人睜不開眼，一直到我從臺東師範學校畢業…」
    - idx: 13
      text: 爸爸九十歲生日那天，我們把當年他阿公用來養家那把鏽跡斑斑的老斧頭裱裝加框，送給爸爸當禮物。斧頭旁的卡片上有爸爸顫巍巍的筆跡：「紀念那個貧無立錐，卻彼此相愛的日子。」
    - idx: 14
      text: 老人已經忘記了許多事情，但只要談起恩人，時隔80年，卻仍歷歷在目。替他繳了三年學費的電氣行李老闆、素昧平生卻在醫院伸出援手幫助他生病的阿嬤的曾護士、在國小服務時竭力為他爭取到宿舍的楊校長、服四個月補充兵役時，每人每月捐助5元，幫他的家庭度過難關的國小同事……說著說著，老人的眼中總泛起淚光。在那個物資極度缺乏、經濟蕭條的時代，任何人給爸爸一點點的協助，爸爸就記了一輩子，視為恩人。
    - idx: 15
      text: 「我有這麼多恩人嗎？」我反問自己。
    - idx: 16
      text: 相較之下，我們這一代成長於物質相對充裕的年代，完全沒有那種走投無路的經驗，雖然生命中仍然有許多值得感謝的人，但可以稱為「恩人」的，好像一位也沒有了。
  inline_marked_terms_note: |-
    課文裡用黑色字元框線（w:bdr color=auto）標出的語詞共 10 個。
    ⚠️ 這些框是 color=auto 的黑框，**不是**「框選語詞」型的答案載體（那種是非 auto 顏色）。
  inline_marked_terms: [雕鏤, 老態龍鍾, 臨終, 泫然欲泣, 通貨膨脹, 鏽跡斑斑, 貧無立錐, 素昧平生, 經濟蕭條, 走投無路]

