# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法——對比：從對比歸納作者意圖
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層，5 個全為紅色）＋ 橘色手寫填空
  shape_note: |-
    🔴 這一節就是缺口清單上「blocks_present_but_none_renderable」的那一節。
    原稿是**三張各 7 列的對比表**（第一組／第二組／第三組），每一張的列都固定是
    對比句型 → 關鍵詞 → 文句內容(A|B) → 落差焦點(打勾) → 凸顯重點(填空) → 回到理解。
    表格型別在前端只把儲存格當純文字畫，選項不能作答，所以這裡：
      · 純資訊的列（對比句型／關鍵詞／文句內容）→ `fill_table`，每列一個陣列，保留印出來的列名
      · 打勾的列（落差焦點）→ `multi`，才作答得了
      · 填空的列（凸顯重點）→ `sub_block` + 【　】 + blanks
      · 敘述的列（回到理解）→ `guide`
    第三組原稿**沒有印「回到理解」那一列**（第一、二組有），所以這裡也不補。
  blocks:
    - type: concept_box
      text: |-
        對比的寫作手法有三個特色：
        把兩種差異超級大的情況放在一起，讓讀者有：「哇嗚，怎麼有這麼大的落差！」的感覺。
        作者用這樣令人驚訝的落差，目的是要強調文章的某一個重點。
        有「對比」時，作者常會用到「但是／卻／相較之下」等轉折詞。
      text_note: |-
        三個特色在原稿是 Word 自動編號的 1./2./3. 清單，編號不在 w:t 文字流裡，所以這裡不寫編號。

    - type: guide
      text: 一、一起來看看本篇文章中的三組對比：
    - type: guide
      text: ◎找出對比的詞或句，並歸納對比想凸顯的重點。

    # ── 第一組 ──
    - type: guide
      text: 第一組(段7)「很多事都記不得了，但是……爸還記得八十年前的舊事……爸想得起來的，都是他的恩人。」
    - type: fill_table
      rows:
        - [對比句型, 【A：記不得】＋【但是】＋【B：仍記得】]
        - [句型關鍵詞, 但是]
      rows_note: 「【A：記不得】＋【但是】＋【B：仍記得】」裡的方括號是句型示意，不是填空
    - type: fill_table
      rows:
        - [文句內容, "A：記不得\n①洗過澡又問要不要洗\n②每次出門前問要去哪裡\n③忘了媽媽過世一年多", "B：仍記得\n①仍記得八十年前舊事，且記得的都是「恩人」"]
    - type: multi
      prompt: 落差焦點(複選)
      options:
        1: 時間落差：近事 vs 舊事
        2: 內容落差：日常小事 vs 恩人恩情
        3: 人物落差：家人的提醒vs 爸爸的反應
      answers: [1, 2]
    - type: sub_block
      label: 凸顯重點(依序將重點填入句中)
      value: 作者用「記不得【　】」對比「仍記得【　】」，想要強調的是：【　】對爸爸的重要性。
      blanks:
        - {answer: 最近發生的事}
        - {answer: 八十年前的恩人}
        - {answer: 恩情／恩人}
      answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
    - type: guide
      text: |-
        回到理解
        作者已經用對比的手法，把「恩人」這個主題顯出來了，再來，我們就可以預期，後面很可能會進一步鋪陳許多恩人的故事。

    # ── 第二組 ──
    - type: guide
      text: 第二組(段10)「（爸爸）說著說著，哼起歌來……泫然欲泣……『我哪裡來的甜蜜的家庭？我從小就無父無母……』」
    - type: fill_table
      rows:
        - [對比句型, 【A：甜蜜意象】VS 【B：落淚情緒】]
        - [關鍵詞, 甜蜜的家庭／無父無母的家庭]
      rows_note: 這一組的列名印「關鍵詞」，第一組印「句型關鍵詞」——原稿就不一致，照抄
    - type: fill_table
      rows:
        - [文句內容, "A：甜蜜意象\n①歌名是「甜蜜的家庭」", "B：落淚情緒\n①爸爸唱著唱著泫然欲泣\n②爸爸說：「我哪裡來的甜蜜的家庭？我從小就無父無母……」"]
    - type: multi
      prompt: 落差焦點(二選一)
      options:
        1: 技巧落差：吹口琴很熟練 vs 歌唱很走音
        2: 情緒落差：甜蜜的家庭 vs 不堪提起的家庭
      answers: [2]
      options_note: 原稿印「(二選一)」但仍用□，所以型別記 multi、答案只有一個
    - type: sub_block
      label: 凸顯重點(依序將重點填入句中)
      value: 作者用「【　】」對比「【　】」，想凸顯的是：爸爸想到自己的【　】，所以情緒才會被放大。
      blanks:
        - {answer: 歌名甜蜜的家庭}
        - {answer: 自己不堪提起的家庭}
        - {answer: 身世缺憾／家庭傷口}
      answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
    - type: guide
      text: |-
        回到理解
        接下來讀例子時，請注意：恩人不只幫忙解決生活問題，也可能在他想起傷口時，仍有人用行動讓他感到溫暖、不孤單。

    # ── 第三組 ──
    - type: guide
      text: |-
        第三組：結尾反思（世代對照）
        「我有這麼多恩人嗎？……相較之下，我們這一代成長於物質相對充裕的年代，幾乎沒有走投無路的經驗……。」
    - type: fill_table
      rows:
        - [對比句型, 【A：上一代的處境】VS【B：我們這代的處境】]
        - [關鍵詞, 相較之下]
    - type: fill_table
      rows:
        - [文句內容, "A：上一代的處境\n①在物資極度缺乏、經濟蕭條的時代，一點點協助就會被記一輩子", "B：我們這代的處境\n①我們這一代物質相對充裕，幾乎沒有走投無路的經驗。\n②生命中仍然有許多值得感謝的人，但可以稱為「恩人」的好像沒有。"]
    - type: multi
      prompt: 落差焦點(複選)
      options:
        1: 地點落差：戰後貧苦的生活 vs 現代物質充裕的生活
        2: 處境落差：匱乏、易陷困境 vs 充裕、較少絕境
        3: 容易把人稱「恩人」vs 較少有「被救一把」感覺
      answers: [2, 3]
    - type: sub_block
      label: 凸顯重點(依序將重點填入句中)
      value: 作者用「【　】」對比「【　】」，想凸顯的是：不是現代人不會感恩，而是因為較少走投無路的經驗，雖然仍有感謝的人，但被稱為【　】的，幾乎已經沒有了。
      blanks:
        - {answer: 上一代匱乏困難}
        - {answer: 我們這代較少絕境}
        - {answer: 恩人}
      answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
    # ── 二、自己找一組 ──
    - type: guide
      text: 二、請試著自己找出下段文字的對比手法，和作者強調的重點：
    - type: passage
      paragraphs:
        - 阿公菜園賣了一萬五千元，阿公當年笑呵呵，捧著一疊鈔票說，算命先生預言他有一天成為萬元戶，沒想到這麼快就成真了。沒想到，搬來台東不久，惡性通膨，舊台幣40,000元換新台幣1元，阿公的15,000元一夕變成廢紙。都是我害的，都是我害的
      paragraphs_note: |-
        這是**改寫過的練習用引文**，跟課文第 11 段不完全相同（台東/臺東、舊台幣/舊臺幣、
        惡性通膨/惡性通貨膨脹、句末無句號、「沒想到」出現兩次）。照原稿抄，不改成課文版。
    - type: sub_block
      label: 對比落差：
      value: 阿公拿著15,000元笑呵呵　vs 【　】
      blanks:
        - {answer: 15,000元一夕變成廢紙}
      answer_carrier: 橘色手寫（C:E97132），文字流有此資訊
    - type: sub_block
      label: 凸顯重點：
      value: 【　】
      blanks:
        - {answer: 對比出阿公的重大損失，以及爸爸強烈的罪惡感}
      answer_carrier: 橘色手寫（C:E97132），文字流有此資訊；原稿這一行只印底線，沒有印【 】

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能找出文中的對比詞或對照句。
        - 2.我能分辨A、B兩邊分別寫什麼。
        - 3.我能說出兩邊的落差焦點。
        - 4.我能根據對比推論作者想強調的重點。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案，印在題號前的括號內），文字流有此資訊
  teacher_notes_note: |-
    第 1、2、3 題右側各有一個深藍色（C:0F4761）的教師解析文字方塊，第 4、5 題沒有。
    PDF 上這些方塊被右邊界裁掉一部分，但 document.xml 的內容完整，這裡以文字層為準。
  questions:
    - index: 1
      answer: C
      stem: （段三、四）作者提醒爸爸「媽媽過世了」後，爸爸「眼睛瞪大」最可能代表什麼？
      options:
        A: 他覺得作者在開玩笑
        B: 他想起往事所以興奮
        C: 他震驚且不敢相信
        D: 他早就知道所以冷淡
      teacher_note: (C)爸爸接著追問「什麼時候的事？」代表他把這件事當成新消息
    - index: 2
      answer: D
      stem: 爸爸唱〈甜蜜的家庭〉時「泫然欲泣」，最可能的原因是什麼？
      options:
        A: 他想起向同學借口琴借太久，很慚愧
        B: 他想起這首歌的歌名與歌詞非常感人
        C: 他突然想起借他口琴的同學，很感恩
        D: 他的心被歌名「甜蜜的家庭」刺痛了
      teacher_note: (D)歌名與歌詞的「甜蜜」反而撞上他的生命經驗（無父無母、缺乏家庭溫暖），因此觸動傷口而想哭
    - index: 3
      answer: A
      stem: 作者為何特別強調阿公賣菜園的15,000元「一夕變成廢紙」？
      options:
        A: 強調他對祖父的損失的罪惡感
        B: 強調惡性通貨膨脹造成的損失
        C: 強調老人家完全沒有理財的觀念
        D: 強調當年菜園若不要賣就好了
      teacher_note: (A) 這段不是在講理財，而是在凸顯「努力與犧牲未必換來保障」，使「恩情」更沉重、更值得記一輩子
    - index: 4
      answer: C
      stem: 作者說「我們這一代好像沒有恩人」，他最可能想要強調什麼？
      options:
        A: 現代人比較自私，因此遇到困難也不太願意幫助別人
        B: 現代人缺乏道德教育，已經不會感謝幫助他的人了
        C: 現代人少有「走投無路」的經驗，所以恩人變少了
        D: 以前的人比較愛把恩情掛嘴邊，所以恩人特別多
    - index: 5
      answer: A
      stem: 作者描寫他們把「鏽跡斑斑的老斧頭」裱裝加框，並題字紀念那個貧無立錐，卻彼此相愛的日子。這手法可以達成哪個目的？
      options:
        A: 以老斧頭象徵當年的艱困與情感，讓意象變得具體可見
        B: 透過描寫用裱框保護斧頭，表示裱框有防鏽的功能
        C: 把斧頭設計成一個伏筆，表示再來的情節會有大的突破
        D: 用裱框展示收藏品味與經濟能力，表示一切都已苦盡甘來

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
