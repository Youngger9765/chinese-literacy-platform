  target_words_note: |-
    灰框列 11 個語詞，比第三大題的「本課語詞」框多一個「嫌棄」（總表也只有 10 個）。
    格子裡確實圈了 11 個，所以是原稿刻意多給，不是抄錯。
  grid_size: [10, 10]
