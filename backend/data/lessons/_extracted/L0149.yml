    原稿是三層表：最左欄是大項（問題與假設／檢驗假設／啟示），
    「檢驗假設」底下再分研究問題／實驗／研究結論三小列。三層攤平成 items（SKILL ⑥.55b）。
  rows:
    - label: 問題與假設
      value: |-
        問題：為什麼阿美族人在部分運動與勞動紀錄中有突出表現？這可能和哪些因素有關？
        假設：88%的阿美族人有米田堡血型，可能具有【　】的呼吸生理優勢。
      blanks: [{answer: 得天獨厚}]
    - label: 檢驗假設
      items:
        - label: 研究問題
          value: 「米田堡血型」和「非米田堡血型」的人們，運動後【　】二氧化碳的效率是否有差異？
          blanks: [{answer: 代謝}]
        - label: 實驗
          value: 對300位成人進行血液、血型的檢測，並要求參與者做3分鐘的踏階運動測驗，比較運動前後的呼吸生理數值差異。
        - label: 研究結論
          value: 在運動之後，有米田堡血型的人體能恢復得較【　】。
          blanks: [{answer: 快}]
    - label: 啟示
      value: |-
        (1)除了努力練習，【　】也可能影響運動表現。
        (2)如果可以【　】，將可以發揮個人最大的優勢。
      blanks: [{answer: 身體素質}, {answer: 因材施教}]

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 圖表繪製與判讀──長條圖與圓形圖
  strategy_type: chart_reading_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: |-
    橘色手寫（會考題答案 A、小試身手的 (50%)），文字流有此資訊。
    本課**沒有任何 ☑**（整份 document.xml 的 w:sym／symEx 都是 0）。
  note: |-
    示範圖 ❶❷❸ 的軸標籤（(%)／(族裔)／阿美族…東北亞人／100- ~ 0-）全部是**文字方塊**，
    在文字層；只有長條與座標線是圖形。所以只把「圖長什麼樣」的描述放進標 image 的
    `diagram` 子節點，其餘照常受逐字門檢查。
  blocks:
    - type: concept_box
      text: 　　你聽過資料視覺化嗎？它是將複雜的資訊以圖或表的方式呈現，讓讀者更容易理解訊息，這一課我們要來學習如何繪製與判讀長條圖及圓形圖。
    - type: guide
      text: 常見的統計圖表：

    # ── 1. 長條圖 ──
    - type: guide
      text: 1.長條圖：把長條繪製在圖形上，每一個長條代表一個類別，長條的高度表示該類別的大小（次數、人數或百分比）。
    - type: guide
      text: 　※以課文的米田堡血型占族裔總人數的比率為例：
    - type: table
      columns: [阿美族, 雅美族, 卑南族, 臺灣人, 東北亞人, 白種人]
      rows:
        - ["88%", "34%", "21%", "5%", "0.006%", "0.002%"]
    - type: guide
      text: ❶畫上兩條互相垂直的直線，橫軸最右邊寫上族裔，縱軸最上方寫上比率（％）。
    - type: guide
      text: ❷分別在橫軸上寫上各族群，在縱軸上寫上單位（%）。
    - type: guide
      text: ❸將各項比率畫成長條圖。
    - type: guide
      text: ❹在正下方寫上圖的標題「米田堡血型占族裔總人數的比率長條圖」。
    - type: figure
      id: 示範圖❶❷❸❹
      referent: 米田堡血型占族裔總人數的比率長條圖
      carrier_note: |-
        軸標籤與族群名都是文字方塊（在文字層）；長條、座標軸線是圖形。
      diagram:
        text_carrier: image
        content: |-
          三張依序完成的示範圖：
          ❶ 只有一組互相垂直的座標軸（縱軸箭頭朝上）。
          ❷ 座標軸加上刻度與六個族群名，但還沒有長條。
          ❸ 完成圖，六根長條由左到右遞減，最左邊「阿美族」那根是藍色（其餘灰色）。
          ❹ 標題排在圖的正下方。
    - type: free_text
      prompt: |-
        ◎小試身手：
        請在圖❸畫出阿美族的比率長條圖。
      answer_carrier: 學生在圖上作畫；教師版的圖❸已經把阿美族那根長條畫成藍色
    - type: guide
      text: 學生版-圖❸藍色長條要去除
      note: |-
        這一行在原稿印成**綠色螢光標記**，看起來是給排版者的內部指示（學生版要把藍色長條移除），
        不是給學生看的教學內容。照原樣抄下來，但不列勘誤 —— 教師版本來就可能夾帶編輯註記，
        我無法判定是否有意保留，交給人決定。

    # ── 2. 圓形圖 ──
    - type: guide
      text: 2.圓形圖：
    - type: guide
      text: 將統計資料用百分率(部分÷全部)表示，每個「扇形」代表某項目在全體中所占的比率，整個圓形是100%，代表全體。
    - type: guide
      text: ※以課文第一段阿美族參與東京奧運國手的比率為例：
    - type: guide
      text: |-
        ❶算出百分比：
        阿美族7位，全部國手68位，7÷68=0.103=10.3%。
    - type: guide
      text: |-
        ❷將圓形分成10份，
        每一等份代表10%。
    - type: guide
      text: ❸從12點鐘方向順時鐘畫，將10.3%填入圓形圖內，再將項目名稱寫上。
    - type: figure
      id: 示範圖（圓形圖）
      referent: 阿美族人占奧運國手人數比率圓形圖
      caption: 阿美族人占奧運國手人數比率圓形圖
      carrier_note: 標題與扇形上的「10.3% 阿美族」都是文字方塊（在文字層）；圓與扇形是圖形。
      diagram:
        text_carrier: image
        content: 一個圓，外緣有等分刻度；從 12 點鐘方向順時鐘切出一小塊扇形。
    - type: guide
      text: ❹在正下方寫上「阿美族人占奧運國手人數比率圓形圖」。
    - type: free_text
      prompt: |-
        ◎小試身手：
        68名奧運國手中，閩南人共34人，先計算出閩南人在奧運國手中佔的百分比，再畫出所占比率。
      answers: ["(50%)"]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊；下方另有一個空的圓形圖與標題「閩南人占奧運國手人數比率圓形圖」讓學生畫

    # ── 3. 小試身手（會考題） ──
    - type: guide
      text: 3.小試身手：
    - type: guide
      text: 106年國中會考國文科第22題
    - type: single
      prompt: (1)周老師在黑板上寫道：「天下所有的人都會羨慕別人，絕大多數的人曾經被別人羨慕。」請問下列哪一張圖表最能表示周老師的這句話?
      options:
        1: (A)
        2: (B)
        3: (C)
        4: (D)
      answer: 1
      answer_carrier: 橘色手寫，原稿印「答案：(   A    )」，文字流有此資訊
      options_note: |-
        四個選項各是一張長條圖，選項本身只印 (A)(B)(C)(D) 與共同軸標「占天下人口百分比(%)」
        （都是文字方塊）；圖上的類別標籤畫在圖片裡，見下一個 figure block。
    - type: figure
      id: 會考題四張長條圖
      referent: 占天下人口百分比(%)
      carrier_note: |-
        🔴 這四張圖的類別標籤是**真的畫在像素裡**：羨慕別人的人／被羨慕的人／
        不羨慕別人的人／不被羨慕的人，四串在 document.xml raw grep 與合併 run 後的 dump
        **都回 0**。共同軸標「占天下人口百分比(%)」與 (A)(B)(C)(D) 則是文字方塊，在文字層。
      diagram:
        text_carrier: image
        content: |-
          四張長條圖，縱軸刻度 0/20/40/60/80/100，各有兩根長條：
          (A) 羨慕別人的人 100、被羨慕的人 約93
          (B) 不羨慕別人的人 約15、不被羨慕的人 約27
          (C) 羨慕別人的人 約99、不被羨慕的人 約65
          (D) 不羨慕別人的人 約5、被羨慕的人 約84
    - type: free_text
      prompt: |-
        (2)根據聯合國《2019年永續發展目標報告》內容：全球曾有過伴侶的15至49歲女性中，其中有18%在過去12個月經歷過來自伴侶的身體或性暴力。
        ❶請就文中敘述的資訊，畫出圓形圖。
      no_correct_answer: true
      answer_carrier: 學生在空白圓形圖上作畫，教師版也沒有畫 —— 原稿無答案
      caption: |-
        標題：全球曾有過伴侶的15-49歲女性，
        在過去一年經歷過伴侶的身體或性暴力。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號印在題號前的（　）裡，文字流有此資訊
  questions:
    - index: 1
      answer: B
      stem: 下列選項的描述，何者出現「過度表徵」的現象？
      options:
        A: 華語人口占世界人口的14.8%，華語是世界排名第一的常用語言
        B: 大安區人口占全台人口的1.2%，但台大有6.9%學生來自大安區
        C: 2023年印度總人口14億2千萬人，是全世界人口數最高的國家
        D: 男生占全臺灣國中生52%，但某國中的男生卻占全校人數的50%
      teacher_note: 有6.9%的台大學生來自大安區，超出了我們對該群體的預期。
    - index: 2
      answer: C
      stem: 根據課文第五段長條圖，以下描述何者是錯誤的？
      options:
        A: 卑南族人口中有米田堡血型的比率是21%
        B: 各個族裔帶有米田堡血型的比率差異很大
        C: 世界上只有這六種族裔具備米田堡血型
        D: 阿美族有米田堡血型的比率遠超過其他族裔
      teacher_note: （選項Ｃ－過度推論，長條圖雖未畫到，但不代表只有這六種族裔具米田堡血型。）
    - index: 3
      answer: D
      stem: 馬偕醫院想知道「米田堡血型的人，運動後代謝二氧化碳能力的強弱」，因而進行了實驗。根據課文對實驗的描述，以下選項何者錯誤？
      options:
        A: 實驗設計對參與者進行運動前測、後測
        B: 實驗設計比較有、無米田堡血型者的代謝效能
        C: 結果發現具有米田堡血型的人，能較快排出二氧化碳
        D: 結果發現運動產生的二氧化碳在體內越久、效能越好
      teacher_note: （D-體內二氧化碳越少，效能越好。）
    - index: 4
      answer: A
      stem: 根據本文結尾，下列何者是本文想要傳達給讀者的理念？
      options:
        A: 選擇職涯可綜合評估天賦及努力
        B: 身體素質是影響運動表現的唯一因素
        C: 後天的努力比先天基因更為重要
        D: 有米田堡血型的人都是運動健將
      teacher_note: （根據總結，努力和先天身體素質都是影響運動關鍵之一，所以依照自己的能力選擇自己的方向，將能事半功倍。）
    - index: 5
      answer: B
      stem: 作者在課文第一、二段用了三個例子描述「阿美族人」在運動與勞動表現上的突出現象，請問這樣的寫作方式目的為何？
      options:
        A: 為了與結尾相互呼應
        B: 用三個例子加強說服力
        C: 方便比較三種例子的差異
        D: 科學問題一定要有三個支持的證據
      teacher_note: (作者用三個例子說明阿美族的特殊之處，加強文章說服力。)

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
  target_words: [過度表徵, 得天獨厚, 代謝, 效率, 水滴石穿, 因材施教, 事半功倍, 職涯]
  grid_size: [10, 10]
  grid:
    - 植職崖懸掛念名符其實
    - 牙業涯生羊過度表徵踐
    - 成法代課頭血流如柱類
    - 效律錦功能事人常於異
    - 果率直代謝之事謝過而
    - 得天獨厚固以以半成人
    - 厚望眼欲水恆因效功因
    - 濃金成滴點累材積日倍
    - 稠厚石點沒線施效度過
    - 稀穿管鐵杵磨教針穿越
  answers_are_graphical: true
  answer_paths:
    - {word: 職涯, cells: [[1, 2], [2, 3]], direction: diagonal_down_right}
    - {word: 過度表徵, cells: [[2, 6], [2, 7], [2, 8], [2, 9]], direction: horizontal}
    - {word: 效率, cells: [[4, 1], [5, 2]], direction: diagonal_down_right}
    - {word: 代謝, cells: [[5, 4], [5, 5]], direction: horizontal}
    - {word: 事半功倍, cells: [[5, 7], [6, 8], [7, 9], [8, 10]], direction: diagonal_down_right}
    - {word: 得天獨厚, cells: [[6, 1], [6, 2], [6, 3], [6, 4]], direction: horizontal}
    - {word: 水滴石穿, cells: [[7, 5], [8, 4], [9, 3], [10, 2]], direction: diagonal_down_left}
    - {word: 因材施教, cells: [[7, 7], [8, 7], [9, 7], [10, 7]], direction: vertical}
  geometry_check: |-
    紙上 roundRect 錨點 5 個（全部在紙內、srgb E97132），**少於** 8 條圈選路徑。
    依 SKILL「少於」這個方向不代表缺陷（圈選常用別種圖形畫），只有「roundRect > 路徑數」才是警報。
    正確性靠座標門把關：8 條路徑逐格套回 grid 都拼得回目標語詞。

