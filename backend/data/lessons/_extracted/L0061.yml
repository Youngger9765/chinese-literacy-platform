# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 寫作手法——用例子說明觀點
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  structure_note: |-
    ⛔ 三張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
    層級關係改用 guide 標題（一、二、三 與 步驟❶❷❸❹）表達。
  blocks:
    - type: concept_box
      text: |-
        有些文章會直接說出作者的觀點，並舉出例子，讓觀點更清楚、更有說服力。讀這種文章時，不能只看懂每個例子，還要看：
        這些例子有什麼共同點？
        它們共同說明了什麼？
        它們如何支持作者提出的觀點？
        這一課，我們要練習：
        【❶找觀點】→【❷找例子】→【❸判斷共同點】→【❹回扣觀點】

    - type: guide
      text: 一、小試身手

    - type: guide
      text: 步驟❶──找觀點

    - type: single
      prompt: 本文的觀點是明說的。作者對「公平」的看法是什麼？
      options:
        1: 公平就是每個人接受完全相同的標準與安排。
        2: 公平不能只看表面是否相同，也要考慮差異與需要。
      answer: 2

    - type: guide
      text: 步驟❷──找例子：整理校園的例子

    - type: single
      prompt: 1.作者一開始寫了三種不同安排。只看表面，這三位同學都像是：
      options:
        1: 得到比其他同學較寬鬆的安排。
        2: 接受和其他同學完全不同的學習內容。
      answer: 1

    - type: fill_table
      prompt: 2.完成表格，看看這些例子有什麼共同點：
      columns: [課文中的安排, 但原來…, 這項調整如何回應需要？]
      answer_carrier: 紅色 ☑（w:sym）；本表在 DOCX→PDF 後被上方文字疊印壓掉，PDF 上完全看不到
      rows:
        - 課文中的安排: 1.延長作答時間
          但原來…: |-
            ①考試時容易緊張，需要更多時間慢慢作答。
            ②有學習障礙，閱讀、寫字困難。
          但原來…_options:
            1: 考試時容易緊張，需要更多時間慢慢作答。
            2: 有學習障礙，閱讀、寫字困難。
          但原來…_answer: 2
