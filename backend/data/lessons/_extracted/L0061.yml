# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: D
      stem: 根據本文第8段，下列哪一項人物特質與孔子的教導配對正確？
      options:
        A: 子路容易猶豫，孔子鼓勵他立刻採取行動
        B: 子路容易衝動，孔子鼓勵他勇敢向前行動
        C: 冉有容易衝動，孔子提醒他先詢問長輩意見
        D: 冉有容易猶豫，孔子鼓勵他果斷採取行動
      stem_note: 題目寫「第8段」，但子路／冉有的個性對照實際印在第 9 段（段號以學習單印的為準）。照原稿記錄，未更動。
    - index: 2
      answer: A
      stem: 本文第3段說：「人又不是工廠生產線上的產品。」這句話主要想表達什麼？
      options:
        A: 每個人的身心、背景與需要不同，不能完全用同一方式看待
        B: 學校不應訂共同規定，應讓每個人自行選擇學習方式
        C: 學生的能力各有高低，資源應優先提供給表現較弱者
        D: 只要學生情況特殊，就可以不必遵守原有規定與要求
      explanation: 工廠產品通常按照相同規格製造，但人差異大，不能只用完全相同的方式衡量
      explanation_note: 原稿是一個浮動說明框，印在正確選項 A 上方
      stem_note: 題目寫「第3段」，該句實際印在第 4 段。照原稿記錄，未更動。
    - index: 3
      answer: C
      stem: 本文第10段說，如果用同樣的爬樹測驗衡量兔子和猴子，「那隻兔子恐怕會一輩子相信自己是個笨蛋」。這句話最可能想提醒什麼？
      options:
        A: 學生可能因此拒絕所有共同評量，認為規則沒有意義
        B: 學生可能只肯學習擅長領域，逃避其他能力的練習
        C: 學生可能把不適合自己的評量，誤認為自己整體能力不足
        D: 學生可能認為老師偏愛強者，開始懷疑所有評量方式
      explanation: 兔子不擅長爬樹，不代表牠沒有其他能力；若只用爬樹衡量，牠可能把單一測驗的失敗，誤認為自己能力不好。
      explanation_note: 原稿是一個浮動說明框，疊在選項 A 上方
      stem_note: 題目寫「第10段」，該句實際印在第 11 段。照原稿記錄，未更動。
    - index: 4
      answer: A
      stem: 本文第8至10段接連使用「韁繩、藥方、合腳的鞋、爬樹測驗」等比喻，主要有什麼作用？
      options:
        A: 把抽象的公平與個別差異，轉成具體而易懂的畫面
        B: 比較不同教學方式的效果，找出最適合所有人的做法
        C: 增加孔子故事的趣味，凸顯古代課堂與現代校園的差別
        D: 說明每個人的能力不同，因此不適合接受共同評量
      explanation: 這些比喻都在幫助讀者理解抽象的公平觀念
      explanation_note: 原稿是一個浮動說明框，印在選項 A、B 右側
    - index: 5
      answer: D
      stem: 下列哪一位老師的做法最符合本文所說的「因材施教」？
      options:
        A: 老師讓程度較好的學生少寫基礎題，卻沒有安排其他挑戰
        B: 老師為了避免爭議，要求全班用同一方法完成相同練習
        C: 老師知道小安個性害羞，便長期免除所有口頭表達任務
        D: 老師依學習程度，給予提示或挑戰，讓每個人都能進步

