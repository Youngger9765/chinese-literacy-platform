    - {index: 8, word: 不偏不倚, definition: 不偏向任何一方，態度公正。}
    - {index: 9, word: 對症下藥, definition: 針對問題，採取適合的解決方法。}
    - {index: 10, word: 木訥, definition: 不善於表達，說話不多，個性較沉默。}

