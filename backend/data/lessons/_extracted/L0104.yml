# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略——用問題-解決-結果找重點
  strategy_type: summarize
  section_title_printed: 閱讀聚光燈
  answer_carrier: |-
    三種載體混用：連連看＝紅色連線（圖形，3 條）；一、找重點的表格＝橘色手寫字；
    二、推論主旨與作者意圖＝紅色 ☑（w:sym Wingdings F0FE，全課僅有的 3 個）。
  structure_note: |-
    ⛔ 兩張表都留在 blocks 最上層、沒有塞進 sub_block ——
    `renderSubBlock` 不依 type 分派，巢狀的表格只會畫出 instruction，
    `columns`/`rows` 會整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: |-
        你以前學過用「問題—解決—結果」抓文章摘要。這篇文章也有相同結構，只是換了比較貼近生活的名稱：
        問題（困擾）→解決（策略）→結果（改變）
        閱讀時，只要掌握這個結構，就可以快速抓到文章的重點，並進一步推論出主旨或作者意圖喔。
      text_note: |-
        這一段裡的箭頭「→」是**真的文字字元**（在 `w:t` 裡），跟 L0103 的 Wingdings 符號不同，
        所以照抄即可。第一行的「問題—解決—結果」用的則是破折號。

    - type: matching
      instruction: 請你先試著連連看，把左邊「元素」和右邊「關鍵概念」連起來。
      left_header: 元素
      right_header: 關鍵概念或提示
      left:
        1: 問題(困擾)
        2: 解決(策略)
        3: 結果(改變)
      right:
        A: |-
          作者提出哪些解決方法？
          （可能出現第一、第二、最後等關鍵詞）
        B: 遇到什麼困擾？（常在開頭段）
        C: |-
          做了之後會出現什麼改變？
          （常在最後段）
      answer: {1: B, 2: A, 3: C}
      answer_carrier: 紅色連線（圖形層的 3 條 `line`，`srgbClr FF0000`）
      answer_note: |-
        🔴 **PDF 上看不到這三條線**（LibreOffice 沒把該群組畫出來），只看 PDF 會判成
        「教師版沒連線、無答案可轉錄」。答案是從 `document.xml` 的線段端點座標解出來的：
        群組「群組 17」內三條 FF0000 的 `line`，縱向範圍 y=23153~1291926 對應三列，
          ・(69147, 23153) → (930118, 581920)：左第 1 列 → 右第 2 列，即 (1) → B
          ・(76177, 616492) → (930060, 23154)（flipV）：左第 2 列 → 右第 1 列，即 (2) → A
          ・(92577, 1291926) → (906514, 1291926)：水平，左第 3 列 → 右第 3 列，即 (3) → C
        三條的語意也各自合理（困擾＝遇到什麼困擾、策略＝提出哪些解決方法、改變＝出現什麼改變）。
      left_note: 左欄每一列在原稿另有一個 (1)(2)(3) 的序號欄，此處以 left 的 key 表示。

    # ── 一、找重點 ──
    - type: guide
      text: 一、找重點：問題（困擾）→解決（策略）→結果（改變）
    - type: guide
      text: 表：本課的結構：困擾→策略→改變
    - type: fill_table
      columns: [元素, 填寫答案]
      column_headers_printed:
        - 元素
        - 根據課文內容，請填寫答案（答案合理即可）
      rows:
        - 元素: ❶困擾
          填寫答案: ❶作者說生活中，你可能會遇到什麼困擾？
          填寫答案_answer: 網路霸凌
        - 元素: |-
            ❷策略
            (段6~8）
          填寫答案: ❷遇到這個困擾，你可以怎麼做？（根據課文寫下具體的作法）
          填寫答案_answer: |-
            1. 不要一個人扛，可以向信任的大人求助
            2.冷處理，不要急著以牙還牙，截圖留下證據
            3.照顧好自己的情緒，找到方法紓壓，需要時求助找人陪伴
        - 元素: ❸改變
          填寫答案: ❸做了之後，會出現什麼改變？
          填寫答案_answer: 好好活著、慢慢走下去，終有撥雲見日的一天
      rows_note: |-
        答案是**開放式**的（表頭就寫「答案合理即可」），教師版填的內容放在 `_answer` 側欄。
        ⚠️ 第 2 列左格的「(段6~8）」左括號半形、右括號全形，原稿如此。
        ⚠️ ❸ 那一列的答案在 PDF 上被分頁切到下一頁（p6 只看得到空格、p7 才有橘字），
        單看 p6 會判成「這一格沒答案」。
      answer_carrier: 橘色手寫字（PDF p6~p7）；文字層裡已有同樣的文字

    # ── 二、推論主旨與作者意圖 ──
    - type: guide
      text: 二、推論主旨與作者意圖
    - type: single
      prompt: 1.根據你找到的重點，這篇文章的主旨是什麼（本文在說什麼）？（單選）
      options:
        1: 安海瑟薇得獎後被討厭，所以名人都很辛苦
        2: 網路霸凌會擴散放大並傷人，作者教你自保並走向復原
        3: 遇到霸凌時，只要退出群組就能立刻解決問題
        4: 網路世界太可怕，所以最好完全不上網
      answer: 2
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
    - type: multi
      prompt: 2.本文作者意圖（作者想影響你什麼？）（4選2）
      options:
        1: 讓你知道「求助不是示弱」，遇到霸凌不要獨自硬撐
        2: 鼓勵你立刻回嗆到底，才不會被看扁
        3: 提醒你先停損、冷處理並蒐證，避免衝突升溫
        4: 要你學會模仿明星受訪的表情管理，避免被剪短片
      answer: [1, 3]
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）兩個
    - type: guide
      text: |-
        ※區分主旨和作者意圖（很重要）
        主旨：這篇「在說什麼重點」
        意圖：作者「希望你怎麼想、怎麼做」
      text_note: 後兩行原稿前面各有一個 ● 項目符號。
    - type: self_check
      label: ◎自我檢核（請打勾）
      items:
        - 1.我能根據文章的結構（困擾、策略、改變）找到文章重點。
        - 2.我能根據文章重點推論出文章主旨和作者意圖。
      items_note: 兩個框在原稿上都是空的（□，沒有 ☑）—— 自我檢核由學生自填。

# ── 六 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: A
      stem: 第四段提及，安海瑟薇「猶豫要不要上台領獎」，最可能的原因是什麼？
      options:
        A: 她怕任何表情都被拿來嘲笑
        B: 她覺得獎項不重要，想低調生活
        C: 她天生很害羞，不喜歡公開場合
        D: 她認為自己不配得獎，想先反省
      explanation: 文中描述她陷入「笑也錯、不笑也錯」：笑被說假掰，不笑被說冷漠。她不是不在乎獎項，而是擔心任何反應都被剪輯嘲弄。
      explanation_note: 原稿是一個浮動說明框，印在選項右側。
    - index: 2
      answer: B
      stem: 本課為什麼要說安海瑟薇的故事？作者最主要的用意是什麼？
      options:
        A: 說明演藝圈比校園更黑暗，別想當明星
        B: 說明連知名人物也會被霸凌，問題很普遍
        C: 強調得獎是引發霸凌的原因，應避免出風頭
        D: 提醒大家不要評論名人，否則會被提告賠錢
      explanation: 名人案例能提高說服力：連好萊塢明星也會受害，表示這不是「你太脆弱」，而是霸凌機制本來就會擴散與貼標籤。
      explanation_note: 原稿是一個浮動說明框，印在選項右側。
    - index: 3
      answer: C
      stem: 第七段提及「你愈用棒子打，牠咬得愈凶」最想提醒讀者什麼？
      options:
        A: 遇到霸凌要更強硬回擊，才不會被看扁
        B: 只要沉默到底，就能證明自己問心無愧、問題會消失
        C: 反擊可能升高衝突、被抓把柄，應先冷處理並保護自己
        D: 霸凌者不可理喻，因此最好的做法是完全切斷所有關係
      answer_note: 原稿的代號印成**全形Ｃ**（其餘題是半形），此處正規化成半形。
    - index: 4
      answer: D
      stem: 下列何者最符合本文主旨？
      options:
        A: 成名後難免被討厭，最好的方法就是習慣網路酸言
        B: 被霸凌多半是誤會，只要有適當的解釋就能讓大家改觀
        C: 演員形象影響工作，因此應該避免在網路上表達任何情緒
        D: 網路霸凌會造成傷害，遭遇時應如何面對、求助、避免受傷
    - index: 5
      answer: D
      stem: 同學在班群被取笑後想立刻回嗆，最符合本文建議的做法是什麼？
      options:
        A: 立刻回嗆到底，才不會被看扁
        B: 發限動公審對方，讓他也難堪
        C: 退出群組就好，不需要留下任何紀錄
        D: 先停損離開現場，截圖蒐證再求助
      explanation: 文章主張「冷處理、不要以牙還牙」並「蒐證」，同時要「不要一個人扛」尋求師長協助。
      explanation_note: 原稿是一個浮動說明框，印在選項右側。

