# ── 五 閱讀聚光燈 ──────────────────────────────────────────────
spotlight:
  strategy_name: 推論策略—找作者觀點與支持理由
  strategy_type: inference
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，文字層有但非 ☑ 字元）
  blocks:
    - type: concept_box
      text: |-
        閱讀說明文或議論文時，讀出「作者的觀點」和「支持觀點的理由」，並推論出隱含的意義，才能更完整理解文章。觀點和支持理由間的關係，就像插圖中的桌子一樣，觀點像桌面，支持理由像桌腳；理由越充分，觀點越站得住腳，越有說服力。
        我們用底下❶～❸的步驟來讀出「作者的觀點、支持理由和隱含的意義」。
        ❶找觀點：作者對議題提出什麼看法或主張？
        ❷找支持理由：作者用哪些事實、數據、例子或說明支持觀點？
        ❸推論隱含意義：把觀點與理由合起來，還能讀出什麼結論？
        接下來，我們來運用這個策略，分析〈塑膠，好用不好甩〉這篇課文的內容。
      figure_note: 說明框中間有一張「桌面＝觀點／桌腳＝支持理由」的插圖，PDF 只渲染出殘缺色塊；圖上沒有文字層可抽

    - type: guide
      text: 一、小試身手（I）：找觀點、支持理由與隱含意義

    - type: guide
      text: 步驟❶找觀點
    - type: concept_box
      text: 祕訣：觀點是作者對議題的主要看法或主張，常出現在標題、開頭、結尾或結論句。可以先看標題與開頭段。
    - type: single
      prompt: 根據〈塑膠，好用不好甩〉的標題和第一段內容判斷，作者主要強調塑膠具備怎樣的特性？（請打勾，單選）
      prompt_prefix: ◎小試身手：
      options: {1: 塑膠進入環境後很難消失, 2: 塑膠玩具可以隨海洋漂流到世界各地}
      answer: 1

    - type: guide
      text: 步驟❷找支持理由
    - type: concept_box
      text: 祕訣：支持理由常是事實、數據、例子或說明，可能出現在觀點之前或之後。
    - type: single
