    - type: concept_box
      text: |-
        每個人的信仰、飲食習慣、節慶和生活方式都可能不同。遇到自己不熟悉的做法時，我們可能會覺得奇怪，但不要急著說「不對」或「太迷信」。先了解對方為什麼這樣做，以及這件事對他有什麼意義，才能做出尊重又合適的回應。
        課文中的陳醫師沒有先否定家屬請乩童、使用符水和香灰的做法，而是看見他們想為病人盡一份心力。在不影響醫療與安全的情況下，他尊重家屬的信仰，也主動向乩童說明病情。接下來，讓我們看看陳醫師是怎麼理解家屬，又怎麼做出尊重的回應。

    - type: guide
      text: 一、看看陳醫師怎麼做

    - type: fill_table
      prompt: 1.請根據課文，勾選合適的答案。
      columns: [事件, 有些醫師可能出現的反應, 陳醫師了解後的尊重做法]
      rows:
        - 事件: 1.家屬想請乩童來看病人
          有些醫師可能出現的反應: |-
            覺得這很
            （☑①迷信　□②合理），
            和醫療無關，因此直接拒絕。
          有些醫師可能出現的反應_options: {1: 迷信, 2: 合理}
          有些醫師可能出現的反應_answer: 1
          陳醫師了解後的尊重做法: |-
            理解家屬想
            （☑①盡一份心力
            □②挑戰醫師）
            ，並確認不影響醫療與安全。
          陳醫師了解後的尊重做法_options: {1: 盡一份心力, 2: 挑戰醫師}
          陳醫師了解後的尊重做法_answer: 1
        - 事件: 2.家屬想讓病人使用廟裡求來的符水、香灰
          有些醫師可能出現的反應: 覺得這些東西不乾淨，可能影響治療。
          陳醫師了解後的尊重做法: |-
            理解這些物品代表家屬的
            （☑①祝福　□②不信任）。
          陳醫師了解後的尊重做法_options: {1: 祝福, 2: 不信任}
          陳醫師了解後的尊重做法_answer: 1
        - 事件: 3.乩童在病房為病人作法
          有些醫師可能出現的反應: |-
            覺得醫院
            （☑①不應　□②可以）
            出現乩童。
          有些醫師可能出現的反應_options: {1: 不應, 2: 可以}
          有些醫師可能出現的反應_answer: 1
          陳醫師了解後的尊重做法: 主動向乩童說明病情，尊重並感謝她對家屬的協助。

    - type: multi
      prompt: 2.陳醫師這麼做，可能帶來哪些好處？（請打勾，複選）
      options:
        1: 讓家屬感受到醫療團隊願意理解自己。
        2: 讓家屬以為醫師認為所有民俗作法都能治病。
        3: 讓家屬更願意和醫療團隊溝通、聽取建議。
        4: 讓家屬有機會表達對病人的關心與不捨。
      answers: [1, 3, 4]

    - type: guide
      text: 二、生活中也會遇到文化差異

    - type: guide
      text: 1.不同的宗教信仰

    - type: passage
      paragraphs:
        - 班上舉行祭拜活動，一位同學因為宗教信仰不同，不參加祭拜。

    - type: single
      prompt: ❶先了解什麼？（單選）
      options:
        1: 他不參加，是因為不尊重班級。
        2: 不同信仰可能有不同的習俗與規定。
      answer: 2

    - type: single
      prompt: ❷怎麼做比較合適？（單選）
      options:
        1: 尊重他的選擇，讓他用其他方式表達對班級的關心。
        2: 要求他和大家做完全一樣的事。
      answer: 1

    - type: guide
      text: 2.不同的飲食文化

    - type: passage
      paragraphs:
        - 新住民同學帶來有家鄉香料味的便當，有人說：「味道好奇怪！」

    - type: single
      prompt: ❶先了解什麼？（單選）
      options:
        1: 他故意帶奇怪的食物來引起注意。
        2: 不同家庭與文化可能有不同的飲食習慣。
      answer: 2

    - type: single
      prompt: ❷怎麼做比較合適？（單選）
      options:
        1: 叫他以後不要再帶家裡準備的食物。
        2: 不嘲笑別人的食物，也可以友善地了解食物的特色。
      answer: 2

    - type: guide
      text: 3.不同族群的重要祭典

    - type: passage
      paragraphs:
        - 一位原住民族同學要參加部落的重要祭典，因此依規定請假。

    - type: single
      prompt: ❶先了解什麼？（單選）
      options:
        1: 祭典對族群的文化傳承可能具有重要意義。
        2: 他只是想找理由不來學校上課。
      answer: 1

    - type: single
      prompt: ❷怎麼做比較合適？（單選）
      options:
        1: 尊重同學參與祭典，也依照學校規定辦理請假。
        2: 所有人都應過完全一樣的節日，這樣才公平。
      answer: 1

    - type: self_check
      label: ◎把理解與尊重帶著走
      instruction: 遇到和自己不同的信仰、習慣或生活方式時，我會提醒自己：
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三格皆為空 □（無 w:sym F0FE）
      items:
        - 1.不急著用自己的標準批評或嘲笑，而是先了解對方的文化、心意或需要。
        - 2.尊重不等於全部同意，還要顧及安全、權利與規定。
        - 3.用不排斥、不傷害別人的方式，找出彼此都能接受的做法。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: B
      stem: 下列語詞何者使用不正確？
      options:
        A: 他「喬裝」成水電工人，以躲避警方的追緝
        B: 最近天氣多變，時常讓人感到胸口「納悶」（鬱悶）
        C: 她扭傷了腳踝，痛到要人「攙扶」著去保健室
        D: 他工作表現十分「稱職」，很受上級的器重
      stem_note: 選項 B 末的「（鬱悶）」是教師在原稿上以橘色標的正解提示，在文字流裡，照原稿保留。
    - index: 2
      answer: A
      stem: 家屬想請乩童進入病房時，陳醫師的做法最能說明哪一種態度？
      options:
        A: 先理解家屬想盡心的需要，再在不妨礙醫療下尊重配合
        B: 為了安撫家屬，放棄醫療判斷，完全照家屬的意思
        C: 認為所有民俗作法都能治病，因此主動請乩童會診
        D: 避免和家屬發生衝突，所以不再說明病情與治療
    - index: 3
      answer: C
      stem: 第十三段，護理師後來轉述說，她向太太說：「我上有老下有小，是放心不下，但是，也不想回來了。」請問句中的「我」指的是誰？
      options:
        A: 醫生
        B: 乩童
        C: 病人
        D: 病人的哥哥
    - index: 4
      answer: D
      stem: 陳醫師在文章裡寫道：「這完全顛覆了我對乩童的刻板印象！」請問下列哪一個選項顛覆了陳醫師對乩童的刻板印象？
      options:
        A: 乩童會在加護病房裡作法
        B: 乩童會代替病人擁抱家屬
        C: 乩童很辛苦，退駕時滿身大汗
        D: 乩童是這個站在床邊的年輕女性
      explanation: (第八段：由上下文推測，陳醫師因為乩童是位年輕女性而吃驚。)
      explanation_note: 原稿是一個浮動說明框，印在選項 A、B 右側
    - index: 5
      answer: C
      stem: 下列哪一項最能表達本文想傳達的道理？
      options:
        A: 醫療專業遇到民俗信仰時，應完全退讓
        B: 只要家屬有心，任何作法都不必考慮安全
        C: 面對不同文化，先了解背後的心意，再找安全、尊重的做法
        D: 醫師應把乩童當成真正醫師，讓她參與所有治療決定
      explanation: 陳醫師先理解家屬請乩童、使用符水背後的心意，再透過溝通與說明病情，在不放棄醫療專業的情況下尊重家屬文化
      explanation_note: 原稿是一個浮動說明框，印在選項 D 下方

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [刻板印象, 觸怒, 不假思索, 不情之請, 預後, 納悶, 喬裝, 會診, 退駕, 攙扶, 稱職, 由衷]
  grid_size: [10, 10]
  grid:
    - 觸怒哈忌憚不情之請睡
    - 癥狀哈氣生刻時鐘眼睛
    - 不態大氣連連板惺惺假
    - 療假笑退駕環忪印陰間
    - 癒人思出駛爆攙扶象棋
    - 新偶考索座喬沉默預懸
    - 陳稱納命惡裝香後防梁
    - 代職豆悶性去蕪存菁刺
    - 謝攫走了循茶餘飯由股
    - 凝視會診環咖啡因衷酌
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 觸怒
      cells: [[1, 1], [1, 2]]
      direction: horizontal
    - word: 不情之請
      cells: [[1, 6], [1, 7], [1, 8], [1, 9]]
      direction: horizontal
    - word: 刻板印象
      cells: [[2, 6], [3, 7], [4, 8], [5, 9]]
      direction: diagonal_down_right
    - word: 不假思索
      cells: [[3, 1], [4, 2], [5, 3], [6, 4]]
      direction: diagonal_down_right
    - word: 退駕
      cells: [[4, 4], [4, 5]]
      direction: horizontal
    - word: 攙扶
      cells: [[5, 7], [5, 8]]
      direction: horizontal
    - word: 預後
      cells: [[6, 9], [7, 8]]
      direction: diagonal_down_left
    - word: 喬裝
      cells: [[6, 6], [7, 6]]
      direction: vertical
    - word: 稱職
      cells: [[7, 2], [8, 2]]
      direction: vertical
    - word: 納悶
      cells: [[7, 3], [8, 4]]
      direction: diagonal_down_right
    - word: 由衷
      cells: [[9, 9], [10, 9]]
      direction: vertical
    - word: 會診
      cells: [[10, 3], [10, 4]]
      direction: horizontal
  answer_paths_note: |-
    12 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。
    幾何交叉驗證（單向警報）：找字表格元素內、扣掉紙外殘留後的 roundRect = **12 個**，
    路徑也是 12 條 → 沒有「紙上 > 路徑」的缺條警報。
    紙外殘留檢查：本課 6 個帶 roundRect 的 anchor 換算成距頁左絕對位置全部 < 頁寬
    （A4 直式 7560310 EMU），**0 個紙外**，所以 12 是實際印得出來的圈數。
    ⚠️ 反向（紙上 < 路徑）不代表缺陷 —— 圈選常用別種圖形畫，roundRect 不是全部。
    主判準仍是下面每一條的 cells 套回 grid 拼字（比內容不比數量）。
    ⚠️ 跨頁：格子第 8~10 列被分到 PDF p10，而「會診」（第 10 列 3~4 欄）的橘框
    整組留在 p9 的格子下方（畫成一個看似空的框）——只看 p10 會判成「會診沒被圈到」。
    「由衷」（9~10 列第 9 欄）的框則落在 p10 上，兩者同一組圖形但分頁位置不同。

