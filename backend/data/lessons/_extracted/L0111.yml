  questions:
    - index: 1
      group: 第一篇 雨林裡的奇蹟藥物
      answer: A
      stem: 科學家回到馬來西亞想採集更多樣本時，為何只找到枯死的樹樁？
      options:
        A: 因為原始雨林已被清除，被改作農地
        B: 因為有人聽說樹能治病，先下手為強
        C: 樹木孕育出愛滋病藥物後，會自然死亡
        D: 因為科學家走錯地點，找錯森林區域
    - index: 2
      group: 第一篇 雨林裡的奇蹟藥物
      answer: C
      stem: 依文章脈絡，作者最可能想影響讀者的想法或態度是什麼？
      options:
        A: 鼓勵多向原住民學習各種雨林草藥的使用方法
        B: 謹慎進行所有醫學研究，因為採集樣本會破壞自然
        C: 重新重視雨林保育，因為雨林可能帶來救命藥物
        D: 呼籲大家，要接近大自然才能找到各種治療方法
      teacher_hint: 全文由「雨林藥物潛力」轉到「雨林消失的代價」，意圖是引導保育意識
    - index: 3
      group: 第二篇  最後一隻旅人鴿
      answer: C
      stem: 第一段大量描寫旅人鴿成群飛過天空、讓日光失色，主要想讓讀者感受到什麼？
      options:
        A: 旅人鴿能長途飛行、耐力驚人，值得研究
        B: 旅人鴿有特別的飛行特色，很容易辨識
        C: 旅人鴿曾經數量驚人，景象非常震撼
        D: 旅人鴿遷徙路線複雜，很難追蹤研究
      teacher_hint: 這段重點在「規模震撼」，其餘選項抓到細節但偏離段落效果
    - index: 4
      group: 第二篇  最後一隻旅人鴿
      answer: A
      stem: 旅人鴿「性情出奇溫馴」在文中最可能用來暗示什麼影響？
      options:
        A: 牠們容易被獵捕，族群更快減少
        B: 牠們更會躲藏，所以不容易被抓到
        C: 牠們更愛獨居，所以不會成群出現
        D: 牠們更能適應環境，所以不怕獵人
      teacher_hint: 第4題解析：文中接著說牠們常棲低枝，獵人很容易打下來。「溫馴」是「容易獵捕」的線索
    - index: 5
      group: 第二篇  最後一隻旅人鴿
      answer: D
      stem: 如果你要用這篇文章設計一則「保育提醒」，最符合文意的主張是？
      options:
        A: 只要禁止所有狩獵活動，就能避免物種走向滅絕
        B: 等數量明顯變少再處理，才不會浪費資源人力
        C: 把動物送進動物園就好，棲地保護不是最重要
        D: 提前保護棲地並限制獵捕，避免物種走向滅絕
      teacher_hint: 第5題解析：文章提供兩條關鍵訊息：棲地破壞與獵殺可能是原因；且當時對復育知識不足，等到只剩動物園個體時已很難挽回。因此最合文意的是「及早保護棲地＋降低人為壓力」

