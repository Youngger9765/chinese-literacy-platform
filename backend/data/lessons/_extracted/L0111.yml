multi_text_parts:
  - part_no: 2
    part_of: 2
    lesson_heading: 第14課   最後一隻旅人鴿
    課文作者: 曾世杰
    學習單: 陳淑麗
    _sections: 三 讀全文／四 閱讀聚光燈

    body:
      instruction: |-
        說明：
        接下來，我們用同一個方法讀一篇新文章，請你先讀一次全文，看看你能不能找出可能讓你卡關的許多專有名詞，略讀之後，照樣抓到全文重點。
      paragraph_count: 3
      paragraphs:
        - idx: 1
          text: 早期的美國拓荒者曾目睹一幕驚人的景象——成群結隊、鋪天蓋地的旅人鴿。牠們體態修長，羽色灰藍，身長約41公分。旅人鴿屬鳩形目，具群聚性與高度社會性；採集性覓食，有典型長距遷徙行為，並在密集的繁殖群中同步築巢。牠們遷徙路線從加拿大一路向南，穿越俄亥俄州、肯塔基州，到達阿肯色州與德州。科學家曾估計：牠們的數量不可勝數，單一群旅人鴿就可能超過十億隻，飛過天空往往持續好幾個小時，讓日光失色。
        - idx: 2
          text: 然而，到了1878年，旅人鴿的群體開始減少。原因不明，但有兩種主流的說法：一是大自然的疾病；二是人類開墾土地、破壞棲地，並大量獵殺旅人鴿。旅人鴿性情出奇溫馴，常棲息在樹的低枝上，獵人或為了食物，或為了娛樂，很容易就能把牠們一隻隻打下來。
        - idx: 3
          text: 最後一隻野生的旅人鴿，在1904年被射殺。當時有些旅人鴿已被送進動物園，但那時人們對如何人工繁殖與復育野生動物所知甚少。世界上最後一隻旅人鴿一直活在辛辛那提動物園，直到1914年老死。一整個物種，就此從地球上消失。
      underlined_terms: [美國, 加拿大, 俄亥俄州, 肯塔基州, 阿肯色州, 德州, 辛辛那提動物園]
      duplicate_copy_note: |-
        第14課的段1 也在檔內出現兩次（三 讀全文版、四 聚光燈引文版），文字相同，
        只有破折號不同：讀全文版是「景象——」（U+2014 ×2），聚光燈版是「景象──」（U+2500 ×2）。
        兩種都是合法的破折號寫法 → 不列勘誤，各處照原樣記錄。

