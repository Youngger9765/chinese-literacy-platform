# ── 一 讀全文（第13課 雨林裡的奇蹟藥物）────────────────────────────
body:
  lesson_heading: 第13課  雨林裡的奇蹟藥物
  課文作者: 曾世杰
  學習單: 陳淑麗
  instruction: |-
    說明：
    閱讀的時候，如果文章出現很多不熟的新詞，越讀越卡時，該怎麼辦？這一課要練一個策略──「跳過卡關、先瀏覽全文」。這就好像吃魚的時候，魚刺很多的地方先跳過，先吃多肉無刺的地方。你繼續往下讀，也許就會發現，那些讓人頭疼的新詞或概念，經常不會影響你的閱讀理解哦。
    底下的課文，就有一些艱深的詞彙，請你先讀一次。記得吃魚的比喻，多刺的地方先不要深究哦。
  paragraph_count: 4
  paragraphs:
    - idx: 1
      text: 亞馬遜雨林的原住民，會用藤蔓中提煉出的「箭毒」製作毒箭。箭毒屬神經肌肉阻斷劑，拮抗乙醯膽鹼受體，它會阻斷神經肌肉傳導，被毒箭射中的動物會全身肌肉鬆弛，最後因呼吸衰竭而死。如今，現代醫院的外科醫師在手術中，卻把箭毒當作救命的藥物來使用，另外還有許多能治療白血病與其他癌症的強效藥物，也同樣來自雨林的植物。這讓科學家在世界各地的雨林中探索，尋找新的「奇蹟」藥物。
      bold_span: 箭毒屬神經肌肉阻斷劑，拮抗乙醯膽鹼受體，它會阻斷神經肌肉傳導，被毒箭射中的動物會全身肌肉鬆弛，最後因呼吸衰竭而死
      bold_span_note: 這段粗體就是第二大題「步驟1 標示卡關點」講的「本課的粗體明示」，教材刻意把難詞加粗當作卡關點
    - idx: 2
      text: 1987年，一位植物學家在馬來西亞雨林採集到一種樹木樣本。美國 國家癌症研究院的研究結果顯示：從這棵樹提取的萃取物，能強力保護人體細胞免受愛滋病病毒的侵害！
    - idx: 3
      text: 科學家立刻趕往馬來西亞，想採集更多樹木樣本。然而不幸的是，那片孕育出可以對抗愛滋病藥物的雨林，早已被清除，改作農地，他們只找到一根根枯死的樹樁。
    - idx: 4
      text: 這些樹樁提醒人們：珍貴的治療方法或藥物，真的可能在一夜間消失。每一年，被破壞的雨林面積相當於四分之三個臺灣那麼大。全球雨林持續遭到破壞，已導致成千上萬種動植物滅絕。
  underlined_terms: [亞馬遜, 馬來西亞, 美國, 國家癌症研究院, 臺灣]
  underlined_terms_note: 專有名詞加底線（PDF p1~p2 可見），不是語詞框；本課沒有語詞框
  duplicate_copy_note: |-
    🔴 第13課的段1 在檔內出現**兩次**（一 讀全文的表格版、二 聚光燈的引文框版），
    兩份文字**不一致**：
      ・讀全文版：「卻把箭毒當作救命的藥物來使用，**另外還有**許多能治療白血病…」
      ・聚光燈版：「卻把箭毒當作救命的藥物來使用，**許多**能治療白血病…」
    兩種寫法都通順、都不是錯字（L0087 同型）→ 不列勘誤、不挑一份當 corrected，
    `body` 取讀全文版（該大題的正本），聚光燈那份原樣記在 spotlight 的 passage block。

# ── 二 閱讀聚光燈（練第13課 段1）──────────────────────────────────
spotlight:
  strategy_name: 閱讀策略——跳過卡關，先瀏覽全文
  strategy_type: reading_strategy
  practises: 第13課 雨林裡的奇蹟藥物
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE ＋ w:color FF0000）＋橘色手寫填空；兩者都在文字流裡
  blocks:
    - type: concept_box
      text: 你剛剛讀過全文，你發現了嗎？第一段出現了許多不容易懂的專有名詞，這時「跳過卡關」的策略就派上用場了——你不必細究，略讀就好，先繼續往下讀，文章經常比你想像的更容易懂。讓我們來練習看看。
    - type: passage
      label: 〈雨林裡的奇蹟藥物〉
      paragraphs:
        - （段1）亞馬遜雨林的原住民，會用藤蔓中提煉出的「箭毒」製作毒箭。箭毒屬神經肌肉阻斷劑，拮抗乙醯膽鹼受體，它會阻斷神經肌肉傳導，被毒箭射中的動物會全身肌肉鬆弛，最後因呼吸衰竭而死。如今，現代醫院的外科醫師在手術中，卻把箭毒當作救命的藥物來使用，許多能治療白血病與其他癌症的強效藥物，也同樣來自雨林的植物。這讓科學家在世界各地的雨林中探索，尋找新的「奇蹟」藥物。
      note: 圓角外框內的引文；粗體範圍與課文相同。與讀全文版差一個「另外還有」，見 body.duplicate_copy_note

    - type: guide
      text: 步驟0：30秒快速瀏覽（先抓方向）
    - type: free_text
      prompt: 1.任務：只抓「第一段大概在講什麼？」（約10–15字）　→我猜這段在講：【　】
      blanks: [{answer: 致命箭毒也可以變成救命良藥}]
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    - type: guide
      text: 步驟1：標示卡關點（本課的粗體明示＋原因判斷）
    - type: single
      prompt: 1.粗體的地方讀起來不容易，你覺得主要原因是什麼？（單選）
      options:
        1: 醫學專有名詞密集，句子又長
        2: 事件跳太快，我很難把前後接起來
      answer: 1

    - type: guide
      text: 步驟2：跳過卡關點、先瀏覽全文（不中斷）
    - type: guide
      text: 1.再讀一次第一段：看到粗體就先快速讀過，不要細究，直接往下讀。
    - type: single
      prompt: 2.自我檢核：我有把第一段讀完（單選）
      options:
        1: 有，我能順順讀完
        2: 沒有，我還是卡在粗體處
      no_correct_answer: true
      answer_carrier: 學生自填，原稿兩個 □ 都沒有勾

    - type: guide
      text: 步驟3：抓重點（重點句＋段意）
    - type: single
      prompt: 1.重點句：第一段最關鍵的一句話？（單選）
      options:
        1: 箭毒會讓動物全身肌肉鬆弛，最後甚至致死
        2: 外科醫師在手術中，卻把箭毒當作救命的藥物
        3: 科學家在世界各地雨林探索，尋找新的奇蹟藥物
      answer: 2
    - type: single
      prompt: 2.段意二選一（單選）
      options:
        1: 雨林的致命箭毒，竟能被醫師用來救命，雨林可能藏著新藥。
        2: 雨林裡的箭毒太可怕，所以大家應該遠離雨林，避免中毒。
