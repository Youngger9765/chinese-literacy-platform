# 🔴 這是**雙文本課**（總表把它拆成 G8-L13 與 G8-L14 兩列，docx 合成一份）。
#    結構是「讀全文→聚光燈」做兩輪，最後才是共用的知識補給站與閱讀理解：
#      一 讀全文（第13課 雨林裡的奇蹟藥物）→ 二 閱讀聚光燈（練第13課的段1）
#      三 讀全文（第14課 最後一隻旅人鴿）→ 四 閱讀聚光燈（練第14課的段1）
#      五 知識補給站（兩篇共用）→ 六 閱讀理解（兩篇合考，分「第一篇／第二篇」）
#    大題號**沒有**重編（不是 L0085 那種「一份檔兩份學習單」），是一路 一~六 連號。
#    裝不下的部分逐項列在下方 `schema_gap`。
#
# ☑ 的載體：全課 15 個 ☑ 全部是 `<w:sym w:font="Wingdings" w:char="F0FE"/>`（字面 ☑ 出現 0 次），
#    每一個都包在 `<w:color w:val="FF0000"/>` 裡 —— 就是 PDF 上看到的紅勾。
#    交叉驗證：F0FE 計數 15 == 本檔記錄的答案數 15（二 聚光燈 7、四 聚光燈 8），
#    與 PDF p2/p3/p5/p6 上紅 ☑ 的位置逐一相符。
#    第三種載體（`<w:bdr>` 框選語詞）：全檔非 auto 顏色的 w:bdr 為 0，本課沒有這種答案。
#
# 🔵 本課**沒有找字遊戲**（沒有第八大題詞語複習）。全檔 roundRect 只有 2 個，
#    是兩篇聚光燈段落引文的圓角外框，不是圈選答案 —— 幾何檢查不適用。
