schema_gap:
  _summary: |-
    現行 schema 的 `body`（讀全文）與 `spotlight`（聚光燈）**各只能裝一份**，
    而這一課兩者都有兩份（第13課一組、第14課一組）。
  _what_fits:
    - 一 讀全文（第13課 雨林裡的奇蹟藥物）→ body ✓
    - 二 閱讀聚光燈（練第13課段1）→ spotlight ✓
    - 五 知識補給站（兩篇共用）→ resources ✓
    - 六 閱讀理解（兩篇合考）→ comprehension ✓
  _what_does_not_fit:
    - 三 讀全文（第14課 最後一隻旅人鴿，全 3 段）
    - 四 閱讀聚光燈（練第14課段1，含 8 個 ☑ 答案）
  _where_i_put_them: |-
    暫存在本檔 top-level 的 `multi_text_parts:`（part_no 2），沿用 L0063／L0029
    這兩課多文本的既有做法。⛔ 這個 key 不在 `scripts/split_lesson_modules.py`
    的 MODULES 對照表裡，所以**第14課的課文與第四大題不會落地到 v3/**。
    這不是抽取漏掉，是沒有欄位可放；已依指示如實記錄，沒有硬塞進不合適的型別。
  _why_not_workaround: |-
    考慮過但不採用的兩條路：
    ① 把兩篇課文串成一個 `body.paragraphs` —— 段號會從 4 段變成 7 段，
       而兩篇聚光燈各自用「該篇自己的段1」當練習材料，串起來之後指涉就錯了
       （#2555 那批 bug 的形狀）。
    ② 把四 聚光燈的 blocks 接在二 聚光燈後面 —— 會把兩篇的練習混成同一大題，
       學生看到的是「步驟0~5 出現兩次」而不知道換文章了。
  _affected_gates_note: |-
    覆蓋率門不會抓到這件事：`coverage_gate.py` 比的是 v2 `body.paragraphs` 對 v3，
    而 v2 本身也只有第一篇（v2 的 body 只有 4 段）。兩版一致 → 門會 PASS。

