    - {index: 4, word: 南轅北轍, definition: 行動方向和原來的目的完全相反；字面意思是原本想去南方卻駕車向北行駛。}
    - {index: 5, word: 前仆後繼, definition: 作戰時前面的人倒下，後面的繼續往前衝。比喻人們接連投入不怕犧牲。}
    - {index: 6, word: 匪夷所思, definition: 不是一般人根據常理所能想像出來的。}
    - {index: 7, word: 衝鋒陷陣, definition: 勇猛奮進，不怕困難。形容面對困難時，所表現出的勇氣和毅力。}
    - {index: 8, word: 罪孽, definition: 罪惡、過失。}
    - {index: 9, word: 傾家蕩產, definition: 為了做某件事，用光了家中全部的財產。}
    - {index: 10, word: 救贖, definition: 使人從罪惡、災難或痛苦中得到拯救。}

