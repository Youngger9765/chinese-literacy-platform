# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  checklist_note: 第 2 條原稿沒有「請在」開頭（與多數課不同），照原稿保留。
  level_label: Level 6・記敘文
  target_strategy_label: 目標策略：比較多元觀點
  paragraph_count: 9
  paragraphs:
    - idx: 1
      text: 「一件八百元？太貴了吧！」「可是那個排汗衫很ㄙㄨㄥˊ吔……」此起彼落的討論聲，打破了班會前的教室寧靜。黑板上寫著大大的「班服投票」，上次班會選出的兩組代表摩拳擦掌，準備為自己的方案進行最後的「政見發表」。
    - idx: 2
      text: 主打「設計美學」的第一組代表率先上台，發言代表龍云迫不及待的秀出設計圖：「這是我們熬夜繪製的潮牌風設計，採用高質感的重磅純棉。班服是我們國中生涯重要的共同印記，就像班級的標誌一樣。穿上它，我們也能在運動會上展現班級的凝聚力！」台下不少追求風格、重視紀念價值的同學聽得津津有味，有幾位也起來發言支持第一組的設計。
    - idx: 3
      text: 此時，一向條理分明的育勤舉手發言，提出了不同的見解：「雖然美感很重要，但八百元對某些家庭來說是沉重的經濟負擔。如果一味追求美感而忽視現實，會不會為難了某些同學？如果不買，會不會又因此感到被排擠？這不是破壞了原本期待的凝聚力嗎？」這番質疑，瞬間讓熱絡的教室安靜了下來，幾位同學點了點頭，陷入深思。
    - idx: 4
      text: 隨後，第二組代表夏恩一個箭步衝上講台，高舉著一件排汗衫樣衣，成功奪回全班的目光。他激昂地陳述：「務實最重要！這種吸濕排汗衫一件只要兩百元，涼快透氣，最適合運動會穿。班服反正只穿幾次，省下來的錢，我們還可以當作園遊會的擺攤基金。美感當然重要，可是荷包也很重要啊！」
    - idx: 5
      text: 面對這番實用論述，班上又是一陣議論。一直沒說話的宜靜舉手，精準的指出另一層盲點：「但我看過樣衣，這種低價排汗衫的版型和剪裁並不理想。如果為了便宜而做出一件大家都不想穿、畢業後很快就被當成抹布的衣服，這難道不是另一種資源的浪費嗎？」
    - idx: 6
      text: 兩組一直無法對班服方案達成共識，台上的氣氛一度顯得有些緊繃。這時，擔任會議主席的班長說話了：「謝謝兩組代表的精采介紹，也謝謝同學們提供了不同方向的分析。我們討論的目的，不是要爭辯出一個人人滿意的『超完美決策』，而是做出班上『比較多人贊同』的決策，也不能只看哪一邊人比較多，重要的是找出多數人能接受、也不讓少數同學為難的方案。剛才大家在意的不只有美感，還包括家庭負擔、舒適和紀念價值。兩組的方案看起來差很多，我們有可能找出一個兼顧這些需求的折衷方案嗎？」
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 7
      text: 主席的話，又引來一陣私下的討論。三分鐘後，夏恩又說話了：「我們也不是死守兩百元底線啦，這樣好了，我覺得我們可以先決定一個大家能接受的價錢，再拜託最有品味的第一組同學設計、詢價，在預算內讓他們做最後的決定好嗎？」他開玩笑的加了一句：「大家有膽的話也可以交給我來決定啦！」全班哄堂大笑，教室裡的氣氛好了起來。第一組也笑著表示可以接受。
    - idx: 8
      text: 「夏恩的話蠻有道理的，那我來提一個中間價錢，二百加八百，除以二，五百元大家可以接受嗎？」負責班費的總務芳綺一提議，大家便七嘴八舌的跟進。黑板上最後留下「450元」和「500元」兩個方案，投票過後，450元方案以三分之二以上的同意票通過。班上也同時約定，班服不強迫購買，若有人有經濟上的困難，可以另外提出來討論，為今天的班會畫下了句點。
    - idx: 9
      text: 這場由同學們共同編織的校園思辨對話，給全班留下最酷的一課：盲目堅持己見，或一味妥協退讓，都無助於團體決策。只有當大家願意聽見彼此的需求與難處，用理性的尺衡量得失，用包容的心接納差異，那些看似衝突的絲線，才可能織成一件真正屬於全班的班服。
