# L0136 / G9-L15《會考圖文題實戰》— LLM 多模態抽取
# 方法：SOT DOCX → PDF → 逐頁讀 3/3 頁（非抽樣）
# 來源：private/curriculum-source/_SOT/9年級/G9-L15會考圖文題實戰（圖文整合閱讀策略）.docx
# 產生：2026-08-18　skill: extract-lesson-multimodal
#
# 🔴 這一課**大部分內容畫在圖片上**，是本批三課裡 text_carrier: image 佔比最高的一課。
#    文字層（document.xml）只有 39 個非空白 w:t run，內容僅：頁首橫幅／課名／
#    說明＋提醒＋四步驟複習／一句作答指示／最後那行答案。
#    **第 2 頁整張圖文（跳水）與第 3 頁的三道會考題（題幹＋選項＋評審分數表）
#    一個字都不在文字層** —— 它們是 image4.png（542KB）與 image5.jpeg（292KB）兩張掃描圖。
#
#    ⚠️ 依 SKILL ⑥.63，標 image 之前先 grep **合併 run 之後的 dump**（不是 raw XML）：
#    12 個關鍵詞（挑戰勇氣的跳水／跳水比賽規則／斯金納／運動大百科／評審一／難度係數／
#    入水時水花／根據圖文／起跳／騰空／評分／入水）在 dump 與 raw XML **都回 0**；
#    同一把 grep 對文字層字串（前面三課／目標策略／會考圖文題實戰／陳淑麗）**都回 1 以上**
#    —— 有這個正向對照才敢說那些字真的在圖上，而不是我的 grep 壞了。
#    圖上的文字仍然**逐字轉錄**下來（多模態讀圖的價值就在這裡），只是標明無法用逐字門驗證。
#
# 🔴 PDF 有嚴重的簡體字代換（本機缺圓體字型）：p1 橫幅印成「会考图文题实战」、
#    說明段印成「前面三课，我们已经学过「图文整合阅读策略」」。
#    **教材本身是正體，document.xml 是乾淨的** —— 本檔所有文字層內容以 XML 為準。
#    圖片上的字不受影響（那是點陣圖，不經字型代換），可照 PDF 轉錄。
#
# 🔵 三種答案載體：
#    ① ☑ 勾選 `w:sym F0FE` → **0 個**（本課答案不是用勾的）
#    ② 找字圈選 `roundRect` → **0 個**
#    ③ 框選語詞 `w:bdr` 非 auto → **0 個**（w:bdr 總數就是 0）
#    ④ 本課的答案載體是**一行橘色文字**：「答：27.(Ａ)、28.(Ｂ)、29.( Ｃ)」，在文字層。

