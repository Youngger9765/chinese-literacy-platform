# ── 一 會考圖文題實戰（前半：策略複習 + 圖文閱讀材料）──
spotlight:
  strategy_name: 圖文整合閱讀策略
  title_line: 第15課  會考圖文題實戰
  blocks:
    - type: concept_box
      label: 說明：
      text: 前面三課，我們已經學過「圖文整合閱讀策略」。這一課不學新的方法，而是用112年國中教育會考的圖文題，試試看你能不能把學過的方法用在真正的考題上。
    - type: concept_box
      label: 提醒：
      text: 圖文題的答案可能藏在文字、圖片或文字框中。作答時，不能只看其中一種訊息，要來回對照，把相關的訊息連起來，再整合判斷。先看文字或先看圖都可以，重點是把需要的訊息找齊、連起來。
    - type: guide
      text: |-
        做題前，快速複習：
        ❶ 看題目──這一題要我找什麼？
        ❷ 找訊息──文字、圖片或文字框提供了哪些線索？
        ❸ 文圖對照──這些線索彼此怎麼對應或補充？
        ❹ 整合判斷──把訊息合起來，選出最合理的答案。
        如果你已經熟悉這些方法，就直接開始挑戰會考題吧！
    - type: guide
      text: 以下是112年國中教育會考國文科第27～29題，請運用學過的策略試著作答。

    # ── 以下整個 block 的文字都畫在 image4.png 上，文字層一個字都沒有 ──
    - type: figure
      referent: 圖文-跳水
      asset: word/media/image4.png
      text_carrier: image
      caption: 以下圖文改寫自亞當‧斯金納《運動大百科》，請閱讀並回答27～29題：
      note: |-
        112 年國中教育會考國文科第 27~29 題的圖文閱讀材料，整張是掃描圖（542KB PNG）。
        版面：上方一段說明文字，中間是跳水動作插圖並配四個灰底說明框
        （起跳／騰空／評分／入水），左下角一個外框列出「跳水比賽規則」五條。
        下面的轉錄是逐字讀圖抄下來的，**無法用逐字門驗證**（文字層沒有這些字）。
      passage_paragraphs:
        - 挑戰勇氣的跳水，是世上最吸睛的運動比賽之一。跳水選手必須體態優美且靈活。他們會從數公尺高的跳臺躍入水中，同時做出大膽的動作。首先，選手必須站上跳臺，以直立或倒立的姿勢起跳。而有些比賽採用跳板起跳，可以輔助跳水者跳得更高、騰空的時間更久。跳水選手會在身體開始下降時，表演一系列抱膝、旋轉、騰翻、轉體與其他大膽精巧的動作，最後盡可能順暢入水。歷史上有紀錄的第一場跳水比賽是在1871年舉行，當時的選手要從倫敦橋跳下泰晤士河。現今的跳水有個人比賽，也有雙人比賽。
      callout_boxes:
        - {name: 起跳, text: 選手由跳臺躍入水中，起跳動作可以是向前、向後或者倒立。}
        - {name: 騰空, text: 起跳後到入水前，選手處於騰空的狀態，此時會開始表演旋轉與轉體一系列的動作。}
        - {name: 評分, text: 評審團針對選手每一次的跳水評分。評審的數量會因比賽的規模而有所差異，以奧運比賽為例，個人賽配置7名評審，雙人跳水則配置11名評審。}
        - {name: 入水, text: 當選手入水的時候，濺起水花能緩和衝擊，但評審想看到的是簡潔流暢的入水，激起太大的水花會遭到扣分。}
      rules_box:
        heading: 跳水比賽規則：
        items:
          - 每位評審各自針對選手的每一次跳水評分，分數的範圍為0分（失敗）到10分（極好）。
          - 滿分為10分，針對起跳、騰空、入水動作，各部分最高可以給3分，剩下的1分則評定整體動作執行的完善程度。
          - 比賽前，選手必須先繳交跳水動作表，設定每一跳的動作難度。比賽時只能依照動作表完成跳水，否則以0分計算。
          - 奧運個人賽計分時，2個最高分與2個最低分不予採計，僅採計中間3名評審的分數後，再乘以動作的難度係數，最後算出該次跳水的得分。
          - 每一跳的得分皆須採計。

# ── 一 會考圖文題實戰（後半：112 年會考國文科第 27~29 題）──
comprehension:
  instruction: 以下是112年國中教育會考國文科第27～29題，請運用學過的策略試著作答。
  source_exam: 112年國中教育會考國文科第27～29題
  answers_printed: true
  answer_line: 答：27.(Ａ)、28.(Ｂ)、29.( Ｃ)
  answer_carrier: 橘色印刷體，印在第 3 頁題目下方（**在文字層**，不是圖）
  option_key_note: |-
    選項用會考原卷的**字母代號 (A)~(D)**，不是 ①②③④。維持字母 key ——
    改成數字會讓「答：27.(Ａ)」這行答案對不到選項。
  items_carrier_note: |-
    題號、題幹、選項、第 29 題的評審分數表**全部畫在 image5.jpeg 上**，文字層完全沒有。
    下面是逐字讀圖轉錄，標 text_carrier: image → 逐字門列為「無法驗證」而不是靜默跳過。
    **答案本身不是讀圖來的**，是文字層那一行橘字，可驗。
  items:
    - index: 27
      text_carrier: image
      stem: 根據圖文，下列關於跳水比賽的敘述，何者最恰當？
      options:
        A: 入水時水花的大小會影響分數高低
        B: 史上第一場跳水比賽是在室內舉行
        C: 奧運比賽的雙人賽必須配置7名評審
        D: 使用跳板起跳就可以獲得比較高的分數
      answer: A
    - index: 28
      text_carrier: image
      stem: 根據圖文，下列關於跳水比賽規則的敘述，何者最恰當？
      options:
        A: 毋須採計每一跳的得分，可擇優計算最後成績
        B: 選手完成一次跳水，每名評審最高只能給10分
        C: 若完成的動作比預定的難度更高，分數也會越高
        D: 選手每一跳須完成的難度係數，由現場抽籤決定
      answer: B
    - index: 29
      text_carrier: image
      stem: 亞當是奧運跳水個人賽選手，他在比賽時某次的動作難度係數是3.0，當他完成後，評審團給的分數表如下：
      stem_table:
        columns: [評審一, 評審二, 評審三, 評審四, 評審五, 評審六, 評審七]
        rows:
          - [7分, 8分, 8分, 7分, 9分, 7分, 9分]
      stem_tail: 根據圖文，亞當此次跳水得分的計算方式應是下列何者？
      options:
        A: ( 7＋7＋7 )×3.0
        B: ( 7＋7＋8 )×3.0
        C: ( 7＋8＋8 )×3.0
        D: ( 8＋7＋9 )×3.0
      answer: C
      answer_reasoning_note: |-
        七位評審給 7、8、8、7、9、7、9。依規則「2個最高分與2個最低分不予採計」→
        去掉兩個 9 與兩個 7，中間三名為 7、8、8 → (7＋8＋8)×3.0 = (C)。
        與文字層印的答案一致，兩邊互相對得上。
