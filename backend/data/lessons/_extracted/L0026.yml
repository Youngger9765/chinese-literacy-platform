    - 段落: 三
      經歷: 猶豫是否該答應
      想法: |-
        1.也許選擇（　），比較不會受傷
        2.不想【　】接受沒有心動的關係
      想法_options: {1: 自己喜歡的人, 2: 喜歡自己的人}
      想法_answer: 2
      想法_blanks: [{answer: 勉強}]
      感受: (勾選，可複選)
