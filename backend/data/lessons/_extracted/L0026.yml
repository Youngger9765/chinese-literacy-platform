  rows:
    - 段落: 一、二
      經歷: 收到同學的告白訊息
      想法: |-
        1.不知該【　】
        2.擔心相處會變得【　】
      想法_blanks: [{answer: 如何回應}, {answer: 尷尬}]
      感受: (勾選，可複選)
