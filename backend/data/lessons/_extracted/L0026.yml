      direction: vertical
    - word: 猶豫
      cells: [[5, 6], [5, 7]]
      direction: horizontal
    - word: 苦腦
      cells: [[5, 9], [6, 9]]
      direction: vertical
    - word: 卸下
      cells: [[6, 10], [7, 10]]
      direction: vertical
