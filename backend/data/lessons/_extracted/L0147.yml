# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 科學推理策略—研究結果支持假說
  blocks:
    - type: concept_box
      text: |-
        有些說明文，就像一則「科學偵探故事」。作者會提出他關切的問題，但不會一開始就給你答案，而是帶你走過一段推理歷程，最後得到結論：
        ❶先提出一個研究問題（這問題太重要或太有趣了，是怎麼回事？）
        ❷再提出一個假設／假說（我推測答案可能是……）
        ❸接著收集證據驗證假說（怎麼查？查到什麼？結果符不符合推測？）
        ❹最後得到結論（證據有沒有支持❷的假設？）
        讀這類文章時，重點是看懂：「證據是否能支持（或推翻）假設。」
        「構樹」這篇文章，正是一段帶領讀者進行科學推理的過程。作者以「南島祖先可能從臺灣出發（出臺灣說）」為假說，透過植物──構樹的 DNA證據，一步步檢驗這個想法是否站得住腳。
        我們要練習用底下的4個步驟，看懂一個科學假說是如何被驗證的。
        【❶找問題】
        【❷提假說】
        【❸看驗證】
        【❹下結論】
      arrow_note: |-
        最後四行在原稿印成**一行**：【❶找問題】→【❷提假說】→【❸看驗證】→【❹下結論】，
        三個「→」是 `w:sym Wingdings F0E0` **符號**（沒有 w:t）。
        依 SKILL 規則，符號箭號前後斷行 → 拆成四行的流程步驟。
    - type: guide
      text: 表：本課的科學討論四步驟：問題→假說→驗證→結論
      arrow_note: |-
        這一行的三個「→」是**字面**字元（U+2192），在句內、**保留原位不斷行** ——
        與上一個 block 的符號箭號是不同東西，PDF 上卻長得一樣。
    - type: fill_table
      columns: [步驟, 關鍵判斷或提示, 根據判斷，勾選最符合的一項]
      rows:
        - 步驟: ❶問題
          關鍵判斷或提示: 文章主要在追問哪一個問題？
          根據判斷，勾選最符合的一項:
            - ①南島語族如果有共同的源頭，這個「共同的故鄉」可能在哪裡？
            - ②南島語族分布在不同島嶼，它們在地球上分布的範圍有多廣？
          根據判斷，勾選最符合的一項_answer: 1
        - 步驟: ❷假說
          關鍵判斷或提示: |-
            推測性的答案、暫時性的答案
            (關鍵詞：可能、推論、會不會)
          根據判斷，勾選最符合的一項:
            - ①南島語族可能最早是從菲律賓出發的
            - ②南島語族可能最早是從臺灣出發的
            - ③南島語族可能最早是從印尼出發的
          根據判斷，勾選最符合的一項_answer: 2
        - 步驟: ❸驗證
          關鍵判斷或提示: 怎麼查？查到什麼？結果符不符合推測？
          根據判斷，勾選最符合的一項:
            - A.方法：怎麼查？
            - ①研究者從多國蒐集早期的構樹文物，抽取DNA來追蹤構樹的「家族旅程」
            - ②從多國蒐集今日活著的構樹，比較葉片、果實和樹皮的外形
            - B.理由：為何這樣查？
            - ①使用早期構樹文物，因為保存時間較久，外觀與形態更完整
            - ②不用今日各島活著的構樹，因為它們可能是近代才被帶去，會造成誤判
            - C.預測：若假說正確，應該看到什麼？
            - ①若構樹由臺灣擴散出去，臺灣的基因型態的多樣性應該最高
            - ②若構樹由臺灣擴散出去，臺灣的基因型態的多樣性應該最低
            - D.結果：科學家找到什麼？
            - ①臺灣的構樹基因多樣性最高；菲律賓、印尼較低；太平洋群島更低
            - ②臺灣的構樹基因多樣性最低；菲律賓、印尼較高；太平洋群島更高
            - E.結果符合假說的預測嗎？
            - ①不相符：證據不支持假說，結果與預測方向相反
            - ②相符：結果符合「出臺灣說」的預測
          根據判斷，勾選最符合的一項_subquestions:
            - {label: A.方法, answer: 1}
            - {label: B.理由, answer: 2}
            - {label: C.預測, answer: 1}
            - {label: D.結果, answer: 1}
            - {label: E.結果符合假說的預測嗎, answer: 2}
        - 步驟: ❹結論
          關鍵判斷或提示: 收集的證據是否支持「出臺灣說」？
          根據判斷，勾選最符合的一項:
            - ①構樹 DNA多樣性的研究結果支持「出臺灣說」，並和語言學、考古學證據相互呼應。
            - ②構樹 DNA多樣性的研究結果不支持「出臺灣說」
          根據判斷，勾選最符合的一項_answer: 1
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）×8
      cell_shape_note: |-
        第 3 欄每格寫成**字串 list**（renderer 的 cellText 支援陣列、以換行排版），
        不接成一句 —— 被勾中的選項前面是 w:sym（沒有 w:t）、沒勾的前面是字面「□」，
        接起來會漏掉中間的 □ 而對不上原稿。
    - type: free_text
      label: ◎自我檢核（請填答和打勾）
      prompt: 1.請依序寫出本課使用的科學探究四步驟
      answer_lines:
        - 【❶找 問題    】
        - 【❷找 假說   】
        - 【❸看 驗證   】
        - 【❹下結論   】
      blanks: [{answer: 問題}, {answer: 假說}, {answer: 驗證}, {answer: 結論}]
      answer_carrier: |-
        四個答案都在文字層，且**四個都靠字元樣式 af（E97132）上色、run 層 w:color 全為 None**。
        🔴 PDF p7 只印得出「假」與「結論」兩個，問題／驗證兩格是空白 ——
        以 document.xml 為準，四個都記。
      arrow_note: 四格之間同樣是三個 F0E0 符號箭號，依規則斷行成四項
    - type: self_check
      items:
        - 2.我能分辨作者提出的假說，並知道它是「需要被驗證的想法」，不是結論。
        - 3.我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿兩個□都沒有勾選
      note: 自我檢核的第 1 項是上面那題填答題，只有第 2、3 項是打勾項

# ── 六 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  option_key_note: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af）
  answers_printed: true
  items:
    - index: 1
      stem: 第四段中，研究者刻意使用「早期構樹文物」，而不使用現生構樹，其主要目的為何？
      options:
        A: 早期文物保存狀況較好，能提高分析準確度
        B: 早期文物數量較多，能蒐集更完整的樣本
        C: 避免近代人為運輸造成來源判斷的誤差
        D: 早期文物比現生構樹更能代表文化用途
      answer: C
    - index: 2
      stem: 第五段中，研究者在進行 DNA 分析前，其實已經隱含一個「可檢驗的預測」。下列哪一項最接近這個預測內容？
      options:
        A: 不同地區的構樹基因型態理論上應該完全相同
        B: 臺灣構樹基因多樣性最高，離臺灣愈遠，多樣性越低
        C: 若構樹與人類遷徙無關，則各地多樣性的分布應隨機
        D: 若構樹用途相同，可推論而知基因型態就會完全一致
      answer: B
    - index: 3
      stem: 作者在開頭列舉「臺灣到紐西蘭約 9000 公里、復活節島到馬達加斯加達 18000 公里」，主要想讓讀者感受到什麼？
      options:
        A: 南島人口必然很多，經濟實力不容忽視，應受看重
        B: 南島天各一方，卻有相似的語言文化，太有趣了
        C: 距離太遠必定隔絕，所以語言和文化不可能相像
        D: 各島分布這麼遠，才能說明科學家的研究有多困難
      answer: B
      teacher_note: 距離數據用來強化「範圍廣闊卻仍相似」的張力，讓「共同源頭在哪」變得更值得追問。
      teacher_note_carrier: 藍框浮動文字方塊，印在該題右側（在文字層）
      note: 題幹引的「18000 公里」沒有千分位逗號，課文第 1 段寫「18,000 公里」，兩處不一致，照各自原樣抄
    - index: 4
      stem: 依文章的推理方式，如果某島的構樹 DNA「基因型態很少」，最可能代表什麼？
      options:
        A: 該島的構樹完全沒有被人類汙染過
        B: 該島樣本蒐集太多，所以型態才變少
        C: 該島一定是構樹最早出現的源頭
        D: 該島可能位在遷徙路徑較末端的位置
      answer: D
      teacher_note: 文章的推理是「源頭最多、往外逐層遞減」，越往外（越末端）多樣性越低。
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 5
      stem: 根據課文第六段，支持「南島語族可能從臺灣出發（出臺灣說）」的「多面向證據」包括哪些？
      options:
        A: 臺灣的地理位置、南島語族的分布範圍，及海洋交通的便利性
        B: 構樹的分布情形、南島語族的文化活動，及島嶼的自然環境
        C: 構樹 DNA 的研究結果、南島語族語言的相似性，及文化證據
        D: 南島語族遷徙的距離、各島嶼的氣候條件，及航海技術的發展
      answer: C

