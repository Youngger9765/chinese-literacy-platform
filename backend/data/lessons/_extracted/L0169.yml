    `內容_source_text` 保留資料流原樣（含原稿的分行）供逐字門比對。
    理由：被勾中的選項前面是 `w:sym`（沒有 w:t）、沒被勾的前面是字面「□」，
    直接接起來會漏掉那個 □；而把 □ 留在顯示版又等於用「哪個沒框」洩漏答案。
    **不是勘誤，是勾選符號的編碼差異。**

# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 身體覺察與照護
  blocks:
    - type: concept_box
      text: 讀完這篇文章，不妨回到自己的日常想想，那我們是身體的「好老闆」嗎？有沒有「顧好身體」呢？在身體覺察與照護上，可以從認識身體的需求開始──身體需要什麼樣的營養、需要多少的水分，這些都是照護身體重要的知識。現在就透過以下資料與練習，成為更優質的老闆吧！
    - type: guide
      text: |-
        ◎ 小試身手：
        練習一：身體照護檢核表──透過營養、水分、休息三個面向來看看自己的身體照護習慣吧！
    - type: fill_table
      label: ＊營養：
      columns: [描述, 經常, 有時, 很少]
      rows:
        - {描述: 我三餐的分量適中，且盡量避免宵夜。}
        - {描述: 我三餐的時間規律，且能夠細嚼慢嚥。}
        - {描述: 我的正餐中都有蔬菜或水果。}
        - {描述: 我會在運動後補充蛋白質和碳水化合物。}
        - {描述: 我外食時會嘗試選擇少油、少炸的食物。}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三欄格子全空
      note: 原稿每列左側另有一個全形數字欄（１~５），此處省略序號欄只留描述與三個勾選欄
    - type: fill_table
      label: ＊水分：
      columns: [描述, 經常, 有時, 很少]
      rows:
        - {描述: 我每天會帶水壺出門或上課。}
        - {描述: 我大多喝白開水，而不是飲料或手搖飲。}
        - {描述: 我會主動喝水，而不是等到口渴才喝。}
        - {描述: 我會注意尿液的顏色，並調整喝水量。}
        - {描述: 運動或天氣熱時，我會主動增加喝水量。}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三欄格子全空
    - type: fill_table
      label: ＊休息：
      columns: [描述, 經常, 有時, 很少]
      rows:
        - {描述: 我平日大約能睡7–8 小時。}
        - {描述: 睡前我會讓自己遠離手機或螢幕。}
        - {描述: 當感到疲累時，我會給自己短暫休息。}
        - {描述: 運動或活動後，我會做收操或伸展放鬆。}
        - {描述: 當身體出現受傷疼痛時，我會盡快冰敷。}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三欄格子全空
      note: 第一列的「7–8」用的是短破折號（EN DASH），不是連字號，照原稿抄
    - type: multi
      prompt: |-
        ＊反思──我發現自己：
        做得不錯的是：
      options: {1: 營養補充, 2: 水分攝取, 3: 休息安排}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: multi
      prompt: 有待加強的是：
      options: {1: 營養補充, 2: 水分攝取, 3: 休息安排}
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
    - type: free_text
      prompt: |-
        練習二：感謝身體
        1.寫下你今天最想感謝的三個身體部位，並在後方寫上原因。
        例1：我想感謝我的(   眼睛  )，(  讓我可以閱讀     ）
        例2：我想感謝我的(   手臂  )，(  幫助我完成體能訓練  ）
        (1)我想感謝我的(          )，(                           ）
        (2)我想感謝我的(          )，(                           ）
        (3)我想感謝我的(          )，(                           ）
      no_correct_answer: true
      answer_carrier: 學生自填，兩個「例」是原稿印好的示範，(1)~(3) 三行空白
      note: 每一行的左括號是半形「(」、右括號是全形「）」，照原稿抄
    - type: multi
      prompt: 2.如果你的身體會說話，你覺得以下哪些句子是他最常說的？(可複選)
      options:
        1: 「我有點累，可以讓我休息一下嗎？」
        2: 「我好渴，請幫我喝點水。」
        3: 「肚子餓了，該補充能量囉！」
        4: 「好緊繃喔，幫我伸展一下吧。」
        5: 「今天太久沒動了，帶我出去走一走！」
        6: 「太久盯著螢幕了，讓眼睛休息一下。」
        7: 「呼吸一下，別那麼趕。」
        8: 「我表現得不錯吧？可以稱讚我一下！」
        9: 「別再勉強我了，我真的需要放慢腳步。」
        10: 其他：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
      no_correct_answer: true
      answer_carrier: 學生自填，原稿十個□都沒有勾選
    - type: free_text
      prompt: |-
        ◎根據你勾選的選項，想一想你可以怎麼用行動回應他？請選一個回應。(例如：十點前就上床睡覺、午休時好好休息)
        你的行動方案：我可以_____________________________________。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿橫線是空的

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  option_key_note: 選項用字母 A~D，答案印在題號前的括號內（橘色，字元樣式 af0）
  answers_printed: true
  items:
    - index: 1
      stem: 下列選項「  」中的語詞，何者使用正確？
      options:
        A: 我寧願花心思修正錯誤，也「不妨」再重頭來過
        B: 面對記者「突如其來」的訪問，他仍能從容回應
        C: 儘管颱風天，爺爺「固然」到農田裡巡視排水系統
        D: 對喜歡穩定的他來說，「照表操課」的安排使他驚慌
      answer: B
      teacher_note: |-
        第1題解析：
        (A)宜用「不願」
        (C)宜用「仍然」
        (D)宜用「突如其來」
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 2
      stem: 根據第二段「如果你這個老闆只顧著提高生產，直到機器冒煙、員工疲倦、倉庫爆滿——最後整座工廠可能陷入罷工危機。」這句話主要是想表達什麼？
      options:
        A: 人體如工廠一般，會因過度操勞而導致病痛
        B: 為了增加產能，工廠經營需要更多人力投入
        C: 從工廠的生產力可以看出，身體的健康狀況
        D: 懂得管理的老闆會重視團隊合作及生產效率
      answer: A
      teacher_note: |-
        第2題解析：
        此處的「罷工」指的是身體生病
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 3
      stem: 根據本文，下列何者正確？
      options:
        A: 只有運動員的身體才是「工廠」
        B: 所有人都是自己身體的「老闆」
        C: 身體就像工廠一樣，會輪班工作
        D: 身體是完成責任，不需要被感謝
      answer: B
      teacher_note: |-
        第3題解析：
        (A)每個人都是自己身體的老闆
        (C)像工廠一樣團結合作
        (D)身體也需要被感謝
      teacher_note_carrier: 藍框浮動文字方塊（在文字層）
    - index: 4
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 人體就像運動員，在適當的壓力下才能激發潛力
        B: 只要有充足的營養與水分，身體就可以持續運作
        C: 人體運作如同工廠合作無間，也需要妥善的照顧
        D: 運動員的訓練辛苦，值得大家更多的尊敬與鼓勵
      answer: C
    - index: 5
      stem: 根據文章與品格聚光燈，下列何者最可能最需要調整生活習慣？
      options:
        A: 志豪會留意自己在三餐中有沒有攝取足夠的蛋白質
        B: 芷涵每天下課都會補充水分，並確認水壺水量充足
        C: 怡文運動完會確實收操，睡前也會做伸展幫助放鬆
        D: 偉翔每天熬夜讀書，常靠能量棒及手搖杯維持精神
      answer: D
      note: 題幹「下列何者最可能**最**需要」重複了「最」字，照原稿抄

