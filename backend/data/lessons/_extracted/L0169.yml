# ── 一 讀全文-做記號 ──
body:
  title_line: 第3課  身體，謝謝你
  byline: 課文/學習單：張筱晴
  paragraph_count: 5
  paragraphs:
    - {idx: 1, text: 人體其實是一座精密的工廠，由206塊骨頭和數百條肌肉構成。清晨，你睜開眼、伸個懶腰，手臂一抬、一呼一吸，身體早已全員上工。你也許沒注意到，這短短幾秒，背後有超過二十條肌肉、十多塊骨頭、還有肺、肋間肌、橫膈膜、心臟一起配合協作──就像一支默契絕佳的工作團隊。每一次呼吸，數百萬個細胞正在同時衰亡與新生。所以，不但平凡的伸懶腰是一場無聲的奇蹟，連運動員在場上的精湛表現，都是這座工廠全力運轉的傑出成果。, errata_ref: E1}
    - {idx: 2, text: 那麼，誰是這座工廠的老闆呢？你就是。如果你這個老闆只顧著提高生產，直到機器冒煙、員工疲倦、倉庫爆滿──最後整座工廠可能陷入罷工危機。但優秀的運動員，會是身體這座工廠的好老闆，他們隨時保養機器，也讓員工有良好訓練和休息──他們知道營養、水分、休息對身體的影響，也知道這些都和紮實嚴格訓練同等重要。}
    - {idx: 3, text: 比賽當下固然令人熱血沸騰，但中場休息的轉播有時也記錄下運動員的祕訣。當鏡頭掃過休息區，有時會看見選手在吃香蕉，或是啃著富含蛋白質的能量棒，有時則會看到一群人圍著大茶桶補水。對許多運動員來說，補充碳水化合物與蛋白質，並不是為了填飽肚子，而是為了幫肌肉修復。而當一般人都認為「口渴再喝水」時，對運動員來說，「口渴」就已經先輸人一截──那代表反應速度和注意力都已經下降。所以下次看轉播時，不妨留意鏡頭特寫──有人的帽子上留著白白的鹽漬，那是身體缺水的痕跡。而如果有一天你發現自己的尿液顏色像烏龍茶，那也是身體在提醒你：該補水了。}
    - {idx: 4, text: 那這一座工廠，只要有充足的能源、物料，就能保持穩定運轉了嗎？別忘了，這座工廠畢竟不是鐵打的，儘管是體能、技術高人一等的國手，都得「放假」。但是對很多人來說，「休息」、「放鬆」似乎和「耍廢」、「擺爛」畫上了等號。其實真正的休息，不是無所事事，運動員在訓練後安排伸展、泡冰水或早點入睡，都是在保養身體。眾多研究顯示，睡眠不足不僅會影響運動表現，還會增加受傷的風險。而賽後的收操則能幫助肌肉放鬆，減少痠痛發生。很多時候，場上的受傷看似突如其來，其實是長期累積疲勞的結果。所以對專業運動員來說，不只訓練需要照表操課，休息也不能馬虎。只有懂得照顧自己，才會有本錢挑戰極限。}
    - {idx: 5, text: 而我想，沒有一個員工在全力以赴付出後，不希望收到老闆的真誠感謝。我們的身體默默支持、陪伴我們完成大大小小的事。失去健康後，即使再輕而易舉的事，也可能變得困難重重。也許，在每天洗澡或睡前、在每次竭盡全力的努力後，我們可以輕聲對身體說聲：「謝謝有你，辛苦了」。}
  inline_marked_terms: [精湛, 紮實, 固然, 祕訣, 碳水化合物, 輸人一截, 不妨, 鹽漬, 突如其來, 照表操課, 馬虎, 本錢]
  inline_marked_note: 課文中加了細方框的本課語詞，十二個全部出現（PDF p1~p2）

