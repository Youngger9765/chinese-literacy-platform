# ── 一 讀全文—做記號 ──
body:
  title_line: 第8課  讓黑猩猩被看見的人
  paragraph_count: 9
  paragraphs_note: |-
    段號欄印 9 個號碼（第 1 個在文字層是注音符號「ㄧ」U+3127，其餘是漢字，原稿如此）。
    四個分節小標不佔段號，另存 inline_headings。第 8 段在 DOCX 裡被版面拆成兩個 <w:p>，本檔併回一段。
  paragraphs:
    - idx: 1
      text: 1960年的某個午後，坦尚尼亞的岡貝森林悶熱異常。26歲的珍古德伏在草叢中，汗如雨下。她屏息以待，目光鎖定在前方的一隻黑猩猩身上——她稱呼牠為「大衛鬍子」。
    - idx: 2
      text: 大衛鬍子正專注地蹲在蟻塚旁，牠撿起一根細長的草桿，先把多餘的葉片一一剝掉，接著將草桿探入蟻洞，像是在「釣魚」一般。幾秒鐘後，牠輕巧一抽，草桿上爬滿了白蟻。大衛鬍子熟練地一抿，把這頓點心送入口中。
    - idx: 3
      text: 這個看似再自然不過的動作，在當時的科學界卻投下了一顆震撼彈。因為那時學者普遍相信：人類是唯一會製造與使用工具的生物。
    - idx: 4
      text: 走進非洲之前，珍古德常被人用懷疑的眼光打量：一個來自英國、沒念過大學的年輕女子，有什麼能力去森林裡做研究？她從小迷戀動物，卻因家裡無法負擔大學學費，只好先去工作維持生活。她做過祕書，也在餐廳當過服務生，一點一滴存下旅費。後來，她在人類學家李奇博士的鼎力相助下，帶著望遠鏡和筆記本，走進岡貝的森林，用最基本、也最費力的方法──長時間守候與觀察，一步步走進黑猩猩的世界。當時許多人對她的計畫嗤之以鼻，認為她撐不了多久，更不可能做出像樣的研究；然而，珍古德把時間交給森林。她一天天蹲守、一頁頁記錄，直到黑猩猩習慣她的存在。幾個月、幾年過去，許多黑猩猩不為人知的細節慢慢浮現。她的筆記越寫越厚，也在不知不覺中改寫了科學界理解黑猩猩的方式。
    - idx: 5
      text: 當時不少學者主張為了保持客觀，應以「編號」記錄動物，認為替動物取名字太感情用事、不夠科學；然而珍古德仍堅持為牠們命名——有溫和的「大衛鬍子」、優雅的「菲菲」，還有脾氣暴躁的「佛羅多」。她透過為個體命名並長期追蹤，更清楚地記錄牠們之間的互動與關係，也更看得見牠們的情緒與選擇。牠們會因失去母親而傷心難過，也會在關鍵時刻守護年幼的同伴。正因如此，她這種在當時引起爭議的做法，反而讓愈來愈多人開始思考：若只重視編號與數據，會不會忽略行為背後的情感、個體差異與關係？
    - idx: 6
      text: 然而，真相並不只有美好的一面。珍古德曾目睹黑猩猩群體為了地盤與資源爆發衝突，甚至出現持續的群體攻擊，殘忍的虐殺敵對陣營的成員。這項被稱為「戰爭」的觀察，使人們重新思考：有組織的群體衝突，是否真是人類獨有的行為？
    - idx: 7
      text: 這些觀察讓人更完整的看見黑猩猩的社會：牠們會使用工具，也能建立親密關係、照顧同伴；但在資源緊張時，同樣可能走向激烈競爭，甚至出現類似戰爭的集體對抗。於是，「工具」、「親情」與「衝突」不再只是用來理解人類社會的概念，也能用來理解黑猩猩的群體生活。而這樣的群體生活，仰賴足夠且連續的森林棲地；一旦森林縮小，牠們的活動空間與社會關係也會被迫改變。
    - idx: 8
      text: 從1960年開始，珍古德長期投入岡貝研究，讓黑猩猩的世界從「被想像」變成「被看見」，她也越來越清楚：人類的開發會快速改變森林樣貌，進而影響黑猩猩的棲地與群體生活。她親眼看見，當地居民生活貧困，為了生計，必須砍樹、開墾農田，樹一倒，森林縮小，黑猩猩的棲地也跟著變小，再這麼下去，任何保育都難以為繼。她體會到，環境、動物與人類是緊密相連的命運共同體，珍古德決定把腳步從研究現場走向更大的世界，開始為生態保護大聲疾呼——她成立珍古德研究院，並推動「根與芽計畫」，吸引更多年輕人投入環境保育行動。她相信，了解不是終點，而是行動的起點。
      split_note: DOCX 把這一段拆成兩個 <w:p>，切在「吸引更多年輕／人投入環境保育行動」中間（版面換行），本檔併回一段
    - idx: 9
      text: 珍古德於2025年以91歲高壽去世，她曾說：「唯有了解，才會關心；唯有關心，才會伸出援手；唯有伸出援手，一切才可能得救。」她用了一輩子實踐這個信念，為世界帶來了希望。
  inline_headings:
    - {after_paragraph: 3, text: 踏入叢林的女孩}
    - {after_paragraph: 4, text: '命名與理解：看見情感與關係'}
    - {after_paragraph: 5, text: '黑猩猩的戰爭課：複雜的真相'}
    - {after_paragraph: 7, text: 把研究帶出森林}
  inline_marked_terms: [屏息以待, 震撼彈, 打量, 鼎力相助, 嗤之以鼻, 改寫, 緊張, 難以為繼, 命運共同體, 大聲疾呼]
  inline_marked_terms_note: 課文中用黑框（w:bdr color=auto）標出的 10 個語詞，與本課語詞框一致

