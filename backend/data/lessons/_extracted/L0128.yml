        - label: '1'
          value: 珍古德看見人類開發影響黑猩猩的【　】，使保育【　】。
          blanks: [{answer: 棲地}, {answer: 難以為繼}]
        - label: '2'
          value: 她成立研究院、推動【　】，號召年輕人投入保育。
          blanks: [{answer: 根與芽計畫}]
    - label: 總結信念（段9）
      value: 【　】帶來關心，關心促成【　】，行動帶來希望。
      blanks: [{answer: 了解}, {answer: 行動}]
  rows_note: 「看見全貌」與「從理解到行動」兩列的段號用全形數字（段６-７／段８），其餘用半形，原稿如此

# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略——從對比推論作者觀點
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）共 17 個，PDF p7~p9 全部可見
  blocks:
    - type: concept_box
      text: |-
        這篇文章透過珍古德的故事，帶你看見作者的想法，作者沒有用一個句子完整說出所有觀點，而是透過多組對比與前後轉變，逐步引導讀者看見黑猩猩的複雜全貌；結尾再以明示的句子收束「理解應走向行動」的觀點。你在閱讀的過程中會慢慢發現：
        「啊！這些對比各自凸顯不同重點，最後共同支持一個主要觀點。」
        「啊！原來作者想透過這些對比，改變我原本的想法。」
        讀這樣的文章，你要先讀出對比，然後一邊讀一邊問自己兩個問題：
        1.這組對比想讓我看見什麼？（重點）
        2.作者透過這些重點想影響我什麼？（作者意圖）

    # ── 一、找對比與歸納重點 ──
    - type: guide
      text: 一、找對比與歸納重點：

    - type: exercise
      label: 向度／對比
      note: 表格兩欄（欄名照原稿）：向度／對比。每個向度先左右兩欄各一題單選，再一題「歸納重點」單選。
      items:
        - type: sub_block
          label: 工具
          note: 對比標題：原來的舊信念 vs 珍古德的新證據
          items:
            - type: single
              prompt: 原來的舊信念
              options:
                1: 人類是唯一會製造與使用工具的生物。
                2: 人類最擅長使用工具，但動物也會用簡單工具。
              answer: 1
            - type: single
              prompt: 珍古德的新證據
              options: {1: 黑猩猩用草桿釣白蟻。, 2: 黑猩猩用樹葉遮雨。}
              answer: 1
            - type: single
              prompt: 歸納重點：
              options:
                1: 用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。
                2: 用黑猩猩的工具行為作例子，證明牠們的智力接近人類。
              answer: 1
        - type: sub_block
          label: 質疑與回應
          note: 對比標題：對珍古德的質疑 vs 珍古德的行動回應
          items:
            - type: single
              prompt: 對珍古德的質疑
              options:
                1: 沒念大學又年輕，珍古德有什麼能力去森林做研究？
                2: 缺少昂貴儀器與團隊，珍古德怎麼可能得到可靠資料？
              answer: 1
            - type: single
              prompt: 珍古德的行動回應
              options:
                1: 她改用更先進的儀器，縮短時間完成研究成果。
                2: 她長期守候記錄，讓黑猩猩習慣她，看見前所未見的細節。
              answer: 2
            - type: single
              prompt: 歸納重點：
              options:
                1: 她用長期投入回應外界質疑，最後因改用先進的儀器而得到肯定。
                2: 她以長期守候、觀察與記錄累積證據，回應外界對她的質疑。
              answer: 2
        - type: sub_block
          label: 研究方法
          note: 對比標題：不帶感情的編號 vs 帶來理解的命名
          items:
            - type: single
              prompt: 不帶感情的編號
              options:
                1: 使用編號避免研究者先入為主，因此個體差異不必列入主要觀察。
                2: 為了保持客觀距離，應該用編號記錄動物，避免感情用事。
              answer: 2
            - type: single
              prompt: 帶來理解的命名
              options:
                1: 她堅持命名，持續辨識、追蹤個體，更清楚看見互動、情緒與關係。
                2: 她堅持命名，才能讓黑猩猩更親近人類，方便接受訓練。
              answer: 1
            - type: single
              prompt: 歸納重點：
              options:
                1: 她用命名來辨識與追蹤互動，讓研究看見黑猩猩的情緒與關係。
                2: 她用命名來拉近與黑猩猩的距離，使牠們更親近人類以便觀察。
              answer: 1
        - type: sub_block
          label: 親密照顧 vs 群體衝突
          note: 對比標題：展現親密關係 vs 爆發戰爭虐殺
          items:
            - type: single
              prompt: 展現親密關係
              options:
                1: 黑猩猩的互助只發生在母子之間，其他個體沒有穩定關係。
                2: 黑猩猩能建立親密關係，也會照顧年幼同伴。
              answer: 2
            - type: single
              prompt: 爆發戰爭虐殺
              options:
                1: 群體衝突主要是偶發的個體爭執，與地盤及資源無關。
                2: 資源緊張時會激烈競爭，甚至出現集體對抗與戰爭虐殺。
              answer: 2
            - type: single
              prompt: 歸納重點：
              options:
                1: 理解黑猩猩要看見「全貌」：牠們既會合作互助，也可能因情緒失控而暴力。
                2: 理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。
              answer: 2
        - type: sub_block
          label: 角色轉變
          note: 對比標題：研究者角色 vs 成為倡議者
          items:
            - type: single
              prompt: 研究者角色
              options:
                1: 留在森林觀察記錄，把成果寫成報告就足夠。
                2: 留在森林長期研究，持續觀察黑猩猩的行為。
              answer: 2
            - type: single
              prompt: 成為倡議者
              options:
                1: 走出森林成立研究院、推動根與芽，號召更多人投入保育。
                2: 走出森林出版傳記上節目，讓自己的故事更受關注。
              answer: 1
            - type: single
              prompt: 歸納重點：
              options:
                1: 她沒有讓理解停在研究成果，而是把理解轉化為保育倡議與行動。
                2: 她把研究帶出森林，走向保育倡議，是為了爭取資源與提高能見度。
              answer: 1

    # ── 二、歸納主要論點/主旨 ──
    - type: guide
      text: 二、歸納主要論點/主旨

    - type: table
      note: 三欄表格：對比歸納的重點／找共同點 看見了……／統整作者觀點。左欄是前面五個「歸納重點」的答案，中欄是跨列合併的共同點。
      rows:
        - [對比歸納的重點, 找共同點 看見了……]
        - [❶用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。, 以長期觀察取得證據與細節]
        - [❷她對黑猩猩長期觀察，得到不為人知的細節，回應了外界的質疑。, 以長期觀察取得證據與細節]
        - [❸她用命名來辨識個體並追蹤互動，讓研究看見黑猩猩的情緒與關係。, 看見黑猩猩個體與群體的複雜全貌]
        - [❹理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。, 看見黑猩猩個體與群體的複雜全貌]
        - [❺她把研究帶出森林，走向保育倡議，讓理解轉成保育行動。, 從理解走向保育行動]

    - type: single
      label: 統整作者觀點 1
      prompt: 1.本文重點是：
      options:
        1: 了解黑猩猩不能依賴舊信念或單一印象，而要根據長期觀察的證據，看見牠們的複雜全貌；真正的理解也應進一步轉化為保育行動。
        2: 本文重點是珍古德克服質疑、追求夢想，鼓勵讀者堅持到底就會成功。
      answer: 1

    - type: single
      label: 統整作者觀點 2
      prompt: 2.作者最可能想改變讀者什麼想法／態度？
      options:
        1: 讓讀者理解黑猩猩也有衝突與競爭，因此應提高警覺、不要太靠近牠們。
        2: 讓讀者用證據與全貌取代刻板印象，並從理解走向關心與保育行動。
      answer: 2

    - type: self_check
      prompt: ◎自我檢核
      items:
        - 1.我能找到文本裡的對比訊息，並歸納出重點。
        - 2.我能根據歸納出的重點，進一步推論出本文的重點和作者觀點。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（在文字層），PDF p11 可見
  items:
    - index: 1
      stem: 為何「黑猩猩用草桿釣白蟻」在當時被形容為投下「震撼彈」？
      options:
        A: 因為它直接挑戰了「只有人類會製造與使用工具」的舊觀念
        B: 因為它顯示黑猩猩具備「教學傳承」能力，會把技巧教給同伴
        C: 因為它讓研究者發現黑猩猩有高度智慧，可能接近人類的思考
        D: 因為它暗示白蟻數量影響族群生存，牽動整個森林的生態平衡
      answer: A
      explanation: 第1題解析：「震撼」是因為當時學界普遍相信：只有人類會製造與使用工具。黑猩猩用草桿釣白蟻，打破這個信念，所以造成巨大衝擊
    - index: 2
      stem: 第四段提到「珍古德把時間交給森林」，最可能想表達什麼？
      options:
        A: 她把研究期限交由森林環境決定，不預先安排觀察方向
        B: 她長時間守候觀察，讓細節慢慢浮現，耐心累積證據成果
        C: 指的是她在森林裡工作了許多年，一直到青春不再、變老
        D: 她把生活移到森林，以親近黑猩猩取代資料記錄
      answer: B
      explanation: 第2題解析：這句是比喻：她願意把大量時間投入現場，靠長期蹲守、記錄，直到看見更多細節。這也是她能「改寫理解」的重要原因。
    - index: 3
      stem: 珍古德觀察到黑猩猩哪些現象，最能說明許多行為並非人類的專利？
      options:
        A: 採集食物、群體合作、扶弱育幼
        B: 命名習性、破壞環境、保持客觀
        C: 使用工具、展現親情、戰爭虐殺
        D: 保護生態、解決問題、同儕競爭
      answer: C
    - index: 4
      stem: 作者同時寫「親情與守護」也寫「戰爭與虐殺」，這樣安排最能凸顯什麼？
      options:
        A: 指出黑猩猩有時溫和有時殘暴，行為模式常讓人難以捉摸
        B: 作者想讓故事更有張力，因此安排對比情節吸引讀者注意
        C: 珍古德太投入牠們的生活，因此記錄難免帶入個人主觀立場
        D: 黑猩猩社會同時包含親密與衝突的複雜樣貌，不只單一面向
      answer: D
    - index: 5
      stem: 下列哪一項最能概括本文想傳達的核心？
      options:
        A: 岡貝森林的生態資源不足，最後導致黑猩猩戰爭
        B: 科學方法太生硬冷漠，只有珍古德願意打破傳統
        C: 珍古德以研究改變理解，並把理解推向保育行動
        D: 黑猩猩仍有許多神秘的習性需要人類去研究了解
      answer: C
      explanation: 第5題解析：文章是用她的研究歷程讓黑猩猩從「被想像」到「被看見」，再推進到棲地危機與保育倡議。最後用名言收束：了解→關心→行動

