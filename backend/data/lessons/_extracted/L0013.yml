# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 找出故事道理
  strategy_type: inference
  blocks:
    - type: concept_box
      text: |-
        讀故事時，我們不只要知道「發生了什麼事」，還要想：
        這些事情想讓我明白什麼？
        這就是故事的道理，也就是這個故事最想告訴我們的想法。
        找故事道理時，可以用四個步驟：
        ❶看狀況：故事一開始主角面對什麼狀況？有什麼願望或困難？
        ❷找關鍵：後來哪件事最重要？這件事產生什麼影響或結果？
        ❸說道理：這件事讓我們明白什麼？
        ❹找證據：故事哪裡可以支持這句道理？回到故事裡，找出支持這句道理的地方。

    # ── 例一：正太與小豬 ──
    - type: guide
      text: 例一：正太與小豬
    - type: sub_block
      label: 例一：正太與小豬
      instruction: 1.正太與小豬這個故事想告訴我們什麼道理？我們用四個步驟來看：
      left_header: 步驟/問題
      right_header: 請根據課文內容勾選正確答案
      items:
        - type: single
          label: ❶看狀況
          prompt: 正太一開始想要什麼？
          options:
            1: 他想離開市集，到寺廟過安靜生活。
            2: 他想學會武功，像武僧一樣變強。
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: ❷找關鍵
          prompt: 後來哪件事最重要？
          options:
            1: 師父沒有直接教武功，卻讓正太每天抱小豬。
            2: 師父先讓正太養小豬，培養他照顧動物的愛心。
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: ❷找關鍵（續）
          prompt: 這件事產生什麼影響？
          options:
            1: 正太和小豬日久生情，也心甘情願抱他了
            2: 小豬越來越重，正太也因為抱牠而越來越強壯
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: ❸說道理
          prompt: 這件事讓我們明白什麼？
          options:
            1: 能力不是一下子練成的，而是每天一點一點累積起來。
            2: 只要願意聽從師父安排，最後就一定會成功。
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: ❹找證據（單選）
          prompt: 故事哪裡可以支持這個道理？
          options:
            1: 正太每天抱小豬移動，三年後正太已經可以抱八十公斤豬。
            2: 正太看見武僧打退兩個惡霸，但是卻不願意一開始就教他武功。
            3: 正太等到自己十四歲了，才到寺廟剃度，接受師父的訓練。
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: guide
      text: |-
        2.你發現了嗎？
        正太每天抱小豬，表面上像是在做雜事，其實是在每天承受一點一點增加的挑戰。這些故事線索可以支持這個道理：
        →能力不是一下子練成的，而是每天一點一點累積起來的。

    # ── 例二：龜兔賽跑 ──
    - type: guide
      text: 例二：龜兔賽跑
    - type: passage
      label: 龜兔賽跑
      paragraphs:
        - 有一天，烏龜和兔子在聊天，不知不覺說到誰跑得比較快，於是兔子便邀約烏龜比賽跑步。一開始，兔子大幅領先烏龜，但不久後，兔子便開始輕敵，認為即使小睡一下，烏龜仍追趕不上牠，便到路邊睡覺。結果烏龜後來趕上，等到兔子醒了時，烏龜已經到達終點了。
    - type: sub_block
      label: 例二：龜兔賽跑
      instruction: 1.龜兔賽跑這個故事想告訴我們什麼道理？我們用四個步驟來看：
      left_header: 步驟/問題
      right_header: 請根據課文內容勾選正確答案
      items:
        - type: single
          label: ❶看狀況
          prompt: 故事一開始，兔子的情況？
          options:
            1: 牠一開始落後，急著追上烏龜。
            2: 牠一開始領先，覺得自己會贏。
          answer: 2
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: single
          label: ❷找關鍵
          prompt: 後來哪件事最重要？產生什麼影響？
          options:
            1: 兔子輕敵去睡覺，烏龜一直走，最後先到終點。
            2: 兔子跑累去休息，烏龜突然加速，最後先到終點。
          answer: 1
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: multi
          label: ❸說道理（3選2）
          prompt: 這件事讓我們明白什麼？
          options:
            1: 跑得慢的人，只要不放棄就有機會贏。
            2: 跑得快的人，就算中途休息也能成功。
            3: 有優勢也不能輕敵，仍要持續努力。
          answers: [1, 3]
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
        - type: multi
          label: ❹找證據（複選）
          prompt: 故事哪裡可以支持這個道理？
          options:
            1: 兔子和烏龜決定比賽跑步。
            2: 兔子一開始領先，輕敵，認為睡一下烏龜也追不上牠。
            3: 兔子在路邊睡覺，烏龜後來趕上，先到終點。
            4: 兔子天生懶惰，平常最愛睡覺。
          answers: [2, 3]
          answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: guide
      text: |-
        2.你發現了嗎？
        故事道理不是只看一件事，而是要把一開始的狀況、關鍵事件和結果連起來看，才能知道故事想告訴我們什麼。

    # ── 例三：破掉的水桶 ──
    - type: guide
      text: 例三：破掉的水桶
    - type: passage
      label: 破掉的水桶
      paragraphs:
        - 一個農夫每天用兩個水桶從河裡取水回家，其中一個水桶有裂縫，每次走回家時，它總是漏掉一半的水，而另一個水桶則能保持完整的水量。
        - 破掉的水桶很自卑，對農夫說：「對不起，我讓你浪費了一半的水。」但農夫笑著回答：「你有沒有注意到，沿路的花都只長在你的那一側？因為你的裂縫讓水滴落在地上，澆灌了這條路旁的花朵，讓我們有了一條美麗的小路！」
    - type: multi
      index: 1
      prompt: 1.「破掉的水桶」這個故事想告訴我們什麼道理？(可複選)
      options:
        1: 人生應該盡量避免失敗，追求完美才能心靈滿足。
        2: 每個人都有自己的價值，不必因為不完美而自卑。
        3: 換個角度，不完美的事物也可能有獨特的貢獻。
        4: 只要你努力達成目標，過程中的小瑕疵並不重要。
      answers: [2, 3]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: single
      index: 2
      prompt: 2.請想想，哪一組線索最能支持你推論出的道理？(單選)
      options:
        1: 破水桶一開始很自卑，覺得自己浪費水、沒有用；後來農夫指出，裂縫滴下的水澆灌了路旁的花。
        2: 破水桶每次回家漏掉一半水；另一個水桶能保持完整水量。
      answer: 1
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    - type: guide
      text: |-
        3.你發現了嗎？
        找故事道理時，要先抓住故事裡最重要的線索，再想：這些線索想讓我明白什麼？

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 下列語詞，何者使用正確?
      options:
        A: 那位保鏢「身材魁梧」，站在門口架勢十足
        B: 炎炎夏日，「金風送爽」，大家熱得滿頭大汗
        C: 他得到第一名，高興得「抱頭鼠竄」，與人分享喜悅
        D: 她突然靈感爆發，「循序漸進」的寫完了一整本小說
      teacher_note: 第1題解析：Ｂ「金風送爽」指涼爽天氣，而非炎炎夏日、Ｃ抱頭鼠竄用於負面情境、Ｄ爆發與循序漸進兩者矛盾。
    - index: 2
      answer: C
      stem: 為什麼正太想進入興福寺學武？
      options:
        A: 他想變得會作戰，變成將軍
        B: 他希望學習佛法，成為高僧
        C: 他想學習武功才能打倒惡霸
        D: 他喜歡寺廟平靜清閒的生活
      teacher_note: （文中第一段）— 原稿印在選項 C 右側
    - index: 3
      answer: B
      stem: 正太剛開始養豬時，對這項任務的想法及態度是什麼？
      options:
        A: 他覺得這是一種特殊的武術訓練，興奮不已
        B: 他不開心，心中無奈，但還是勉強服從
        C: 他認為這是培養耐心的一種方式，欣然接受
        D: 他覺得師父簡直把無聊當有趣，氣憤拒絕
      teacher_note: （第二段。）— 原稿印在選項 A 右側
    - index: 4
      answer: C
      stem: 從全文來看，師父讓正太每天抱小豬，真正的用意最可能是什麼？
      options:
        A: 讓正太學會照顧小豬，培養愛心
        B: 讓正太先做雜事，以後才開始學武功
        C: 用每天增加的重量，慢慢訓練正太的身體
        D: 讓正太知道學武很辛苦，所以不要抱怨
    - index: 5
      answer: D
      stem: 請問本文主旨是什麼？
      options:
        A: 天才出於名門，才能必須由名師傳授
        B: 一個成功的領袖知道如何運用他人的優勢
        C: 工欲善其事，必先利其器
        D: 成功沒有捷徑，需要日積月累的努力
      teacher_note: （從故事可知，正太最後能夠變得身材魁梧，就是因為每天抱豬，長久的鍛鍊日積月累，才能成功。）

