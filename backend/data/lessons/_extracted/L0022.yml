    # ── 二、理解「吃醋」 ──
    - type: guide
      text: 二、理解「吃醋」：吃醋的原因大概可以分為以下四種──
    - type: table
      columns: [成因類型, 說明, 舉例]
      rows:
        - [1.被忽略或被排除的感覺, 覺得自己不再是他的第一順位。, 好友下課沒來找你，卻和其他人一起走。]
        - [2.對關係的不安全感, 擔心朋友或喜歡的人對你的感情改變了。, 他最近常和別人聊天，跟我說話越來越少。]
        - [3.「和別人比較」引起, 覺得他對別人比較好，而你「輸了」。, 朋友在群組只回別人訊息，沒回你。]
        - [4.內心期望沒被滿足, 你希望他主動、靠近你，但他沒那麼做。, 你以為他知道你想一起吃午餐，結果他沒找你。]
    - type: multi
      # self_check 是「我做到了嗎」的檢核清單（items 是一串文字）。
      # 這一塊是「選出你有過的感覺」——沒有標準答案的複選，型別本來就不同。
      # 原稿無勾選（answer_carrier 已載明），所以標 no_correct_answer。
      no_correct_answer: true
      prompt: ※你覺得你自己比較常因為哪些原因吃醋呢？
      options:
        1: 被忽略或被排除的感覺
        2: 對關係的不安全感
        3: 「和別人比較」引起
        4: 內心期望沒被滿足
      answers: null
      answer_carrier: 學生自填，原稿無勾選

    # ── 三、調節情緒：6A 策略 ──
    - type: guide
      text: 三、調節情緒：6A策略──覺察（Aware）、承認（Acknowledge）、允許（Allow）、接納（Accept）、轉化（Action）、欣賞（Appreciate）
    - type: fill_table
      columns: [6A策略, 實際演練]
      rows:
        - 6A策略: 覺察（Aware）
          no_correct_answer: true
          實際演練: 我發現我在吃醋，我感到【　】、【　】、【　】（根據一、辨識「吃醋」練習，寫下你常見的三個情緒）
          實際演練_blanks: [{answer: null}, {answer: null}, {answer: null}]
          note: 三個空格由學生自填，原稿留白
        - 6A策略: 承認（Acknowledge）
          實際演練: 我承認我在吃醋，會有吃醋的心情很正常。
        - 6A策略: 允許（Allow）
          實際演練: 我允許我吃醋，我知道吃醋是因為【　】。（根據二、理解「吃醋」練習，寫下你最常發生的吃醋原因）
          實際演練_blanks: [{answer: null}]
          note: 空格由學生自填，原稿留白
        - 6A策略: 接納（Accept）
          實際演練: 我接納我吃醋，我知道這是因為我也想被放在心上。
        - 6A策略: 轉化（Action）
          實際演練: ◎我可以……（勾選你願意嘗試的，可複選）
          實際演練_options:
            1: 嘗試換個角度，找到不同的解釋
            2: 和朋友好好談談自己的感受
            3: 把感覺寫下來、畫下來
            4: 轉移注意力：先做些讓自己開心的事，轉換情緒
            5: 不要立刻下判斷，先觀察一陣子再說
            6: 告訴自己：這不代表我不夠好
            7: '其他：'
          實際演練_answers: null
          note: 學生自填，原稿無勾選；第 7 項後面是一條手寫底線
        - 6A策略: 欣賞（Appreciate）
          實際演練: 我願意謝謝、欣賞我自己，努力面對、調節這份不舒服的感受，不讓它變成傷人、傷害關係的行為。

    - type: concept_box
      text: 「吃醋」不代表你小氣、不成熟，而是表示你很在乎這份關係。願你學會照顧這些「不太想說出來」的情緒，學會在矛盾裡停下來、承認它、接納它，聽一聽自己的心，也願你在下一次感到「吃醋」的時候，更溫柔的理解自己❤︎

# ── 七 閱讀理解（教材印「六」，見 source_errata E1）──
comprehension:
  section_no_printed: 六
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 下列選項「　」中的語詞，何者使用正確？
      options:
        A: 聽到妹妹出車禍的消息，他內心泛起「漣漪」，不知所措
        B: 他做事常常只顧自己利益，難怪很多同學都說他「靦腆」
        C: 平常冷漠的他，今天竟然「一如往常」的和大家打招呼
        D: 他在面試時強忍著肚子痛，不想讓評審發現他的「異樣」
      teacher_note: (A)漣漪是細微的感受，和句子情境不符 (B)宜改為「自私」(C)宜改為「一反常態」
    - index: 2
      answer: B
      stem: 根據第三段「我又不是那種愛計較的人，這種小事根本不值得放在心上。」這句話最可能代表什麼意思？
      options:
        A: 作者想強調自己一點也不在意他們聊得很開心
        B: 作者想說服自己不要去在意，但其實非常介意
        C: 作者認為只有能夠相互計較的朋友才能夠長久
        D: 作者認為阿葉不值得自己繼續用真心對待來往
      teacher_note: 從前後文可推知作者其實介意，但不願承認，所以選(B)
    - index: 3
      answer: A
      stem: 根據全文，下列哪一個選項最能解釋作者「不想對阿葉擺臭臉，更不想承認自己會因為朋友而吃醋」的原因？
      options:
        A: 作者認為自己不該為了心上人和朋友生氣、冷戰
        B: 作者非常不認同阿葉的行為，認為阿葉不夠義氣
        C: 作者不想讓阿葉看出自己心情，怕被心上人知道
        D: 作者想成全阿葉和自己喜歡的人，默默退出競爭
      teacher_note: 從文章可知作者不希望自己是「小氣」、「愛計較」的。
    - index: 4
      answer: C
      stem: 根據本文內容，關於作者的情緒變化，下列何者正確？
      options:
        A: 期待→失落→難過→驚喜→平靜
        B: 驚喜→失望→生氣→難過→無奈
        C: 驚訝→煩悶→低落→生氣→煩躁
        D: 開心→驚訝→煩躁→低落→平靜
      teacher_note: 第二段「愣了一下」是驚訝、第三段「胸口悶悶的」是煩悶、第四段有提到「低落」、「生氣」、第六段有提到「煩躁」。
    - index: 5
      answer: C
      stem: 根據閱讀聚光燈的練習，下列何者對於「吃醋」的理解較為合適？
      options:
        A: 美美：常常吃醋的人通常個性小氣又愛計較，很難相處
        B: 小綠：和人相處應該保持開放心態，一旦吃醋就要檢討
        C: 大華：吃醋代表對關係的重視和在乎，但也要避免傷人
        D: 阿勇：如果朋友不會吃你的醋，就代表他沒有很重視你
      teacher_note: (A)不一定(B)吃醋是正常的，不需檢討(D)不吃醋不代表不重視。
      answer_carrier: 橘色手寫字（圖形層）；原稿此題答案印的是全形「Ｃ」

