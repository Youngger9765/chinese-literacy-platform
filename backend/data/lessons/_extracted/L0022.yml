# ── 一 讀全文-做記號 ──
body:
  marking_instruction:
    header: ※ 如果你有做到下列事項，請在□內打勾。
    items:
      - 請在不太了解的字、詞或句做記號。
      - 重要的地方、喜歡的語詞、句子或段落做上記號。
  # 段號欄印 ㄧ二三四五六 共 6 個，與右緣「字數」欄的分段一致（每段結束時的累計數：
  # 三=132、四=296、五=517），所以段號與段落是一對一，沒有 L0020 那種漂移。
  paragraph_count: 6
  paragraphs:
    - idx: 1
      text: 今天的心情糟透了。
    - idx: 2
      text: 下課時，我原本打算找朋友阿葉一起去福利社，卻在走廊上看到阿葉和他站在一起，聊得正開心。阿葉的笑聲響亮，他也彎著眼睛回應；他們笑得東倒西歪，阿葉還伸手拍了拍他的手臂，而他則是一臉靦腆，淺笑著搖搖頭。我愣了一下，停下腳步，猶豫要不要走過去。
    - idx: 3
      text: 我盯著他們，心裡有點不是滋味。但這應該很正常吧？他們本來就是小學同學，話題比較多也沒什麼奇怪的……而且，我又不是那種愛計較的人，這種小事根本不值得放在心上。可是，如果真的沒什麼，那為什麼不肯邁開腳步走過去？為什麼胸口悶悶的，好像吞下了一顆沒嚼碎的糖果，卡在喉嚨裡？
      note: 念順順的 ☞ 錨點印在本段首行
    - idx: 4
      text: 我深吸一口氣，轉身走回教室，不想再看下去，假裝自己根本不在意。可是，回到座位後，思緒卻無法停止。阿葉下課沒有找我一起去，或許只是剛好……可如果真的是這樣，為什麼我覺得有點失落？還是其實阿葉也喜歡他？這些念頭讓我的情緒越來越低落，甚至開始有點生氣，生氣他們看起來什麼都能聊、生氣為什麼朋友那麼不貼心、生氣自己為什麼要在意這些事情。
    - idx: 5
      text: 後來阿葉回到教室，一進門就朝我走來。阿葉問我怎麼沒去福利社，聲音一如往常，語氣輕快，像是完全沒察覺我的異樣。我應該要像平常一樣回應他，裝作什麼事都沒有發生，可是——我就是不想開口。我低下頭，假裝在看書，眼神死死盯著書頁上的字，卻完全讀不進去。心裡有個聲音在喊：「你這樣是不是太小氣了？阿葉又沒有做錯什麼……」但另一個聲音又冒出來：「可是他難道不知道我也想一起聊天嗎？」於是，我什麼都沒說，只是默默往旁邊挪了一點，阿葉只說了聲「好吧！」就轉身離開了。
    - idx: 6
      text: 這種感覺好奇怪，說不清、講不明，卻讓我的心情亂成一團。我的指尖不自覺捏緊了衣角，心裡有股莫名的煩躁，但我又不知道該往哪裡發洩。難道這就是吃醋嗎？這個念頭像是狠狠砸進水裡的石頭，激起陣陣漣漪，我不想因為這種小事而生氣，不想對阿葉擺臭臉，更不想承認自己會因為眼前那一幕而吃醋。唉，到底該怎麼辦……
  inline_marked_terms: [靦腆, 愣, 計較, 邁開, 思緒, 一如往常, 異樣, 莫名, 漣漪]
  inline_underlined_terms: [阿葉]

