      prompt: 根據文章，作者看見朋友和喜歡的人聊得很開心後，你覺得哪些行為、情緒、反應是因為吃醋而產生的呢？（可複選，沒有標準答案，請依據你自己的想法、感受判斷）
      options:
        1: 作者愣了一下，停下腳步，猶豫要不要走過去
        2: 作者深吸一口氣，轉身走回教室，假裝自己不在意
        3: 作者覺得胸口悶悶的，好像吞下了一顆沒嚼碎的糖果，卡在喉嚨裡
        4: 作者低下頭，假裝在看書，眼神死死盯著書頁上的字
        5: 作者生氣為什麼朋友那麼不貼心、為什麼自己要在意這些事
