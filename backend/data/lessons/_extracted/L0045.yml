# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 6
  section_headings: [人工噴農藥, 無人機噴農藥, 寄生蜂片, 寄生蜂扭蛋]
  section_headings_note: |-
    這四個小標印在課文中間、外加方框，是段落之間的分節標題，不佔段號
    （段號欄只有「一二三四五六」六個號碼）。⚠️ 但它們**會被算進右緣的累計字數**（見 char_count_note）。
  paragraphs:
    - idx: 1
      text: 秋行軍蟲是一種原產於美洲的飛蛾，翼展約3.5公分，牠繁殖力驚人，母蛾一生可以產下1500到2000顆卵，幼蟲長得像小號的蠶，對玉米、高粱有嚴重的破壞力。2019 年，苗栗發現第一起入侵案例，幾年內秋行軍蟲的危害蔓延到許多地方，農民深受其害。面對這種陌生害蟲，臺灣昆蟲學家不斷的改良防治技術，我們來看看他們曾經嘗試過的方法。
      followed_by_heading: 人工噴農藥
    - idx: 2
      text: 噴灑農藥就可殺死秋行軍蟲，然而要有效防治，必須重複噴藥，平均一週要噴藥一次，持續兩、三週，影響糧食安全和農民的健康。現在天氣愈來愈熱，當種植的面積很大時，人工噴農藥實在太耗工、太辛苦、太危險。如一位農民所說：「要我穿防護衣進田裡去噴，我看會死在田裡。不是被毒死，就是被熱死。」
      followed_by_heading: 無人機噴農藥
    - idx: 3
      text: 人工噴藥既然又辛苦又危險，那用無人機噴可以嗎？大型的無人機低空噴灑一公頃農田，只要約20分鐘，一天可以噴五公頃，而且施作者不必直接接觸農藥，又安全，又省力。但這樣農民就可以一勞永逸了嗎？那可不。若長期反覆使用同一種農藥，害蟲族群中較能耐受藥劑的個體比較容易存活並繁殖。經過幾代後，這類害蟲的比例可能增加，使農藥效果變差，形成抗藥性。
      marker: ☞ 印在本段句首（念順順起點）
      followed_by_heading: 寄生蜂片
    - idx: 4
      text: 昆蟲學家發現，一種只有約1公釐大的「赤眼卵寄生蜂」是秋行軍蟲的剋星。母蜂找到秋行軍蟲的卵後，會把自己的卵產在裡面，寄生蜂幼蟲在裡面長大，這樣，秋行軍蟲的卵就不會孵出幼蟲。為了把寄生蜂帶進玉米田，研究人員把已被寄生的蟲卵黏在小紙卡上，做成「蜂片」。農民用釘書機把蜂片釘在玉米葉背面，寄生蜂長大後就會飛出來，幫忙防治秋行軍蟲。一公頃放121片就可以防治蟲害。但是，釘121片蜂片的工作須耗時2個鐘頭，對年紀大的農民仍然是苦差事。
      structure_note: |-
        DOCX 把這一段切成三個 <w:p>，只有第一個有「　　」首行縮排，後兩個沒有＝續行。
        段號欄只印六個號碼，而累計字數也支持這個切法（見 char_count_note）。
        PDF p2 把「五」「六」印在這一段中間，是轉檔重排的錯位。
      followed_by_heading: 寄生蜂扭蛋
    - idx: 5
      text: 為了解決一片片釘蜂片太花時間的問題，昆蟲學家從扭蛋得到靈感，他們把原本黏在蜂片上的蟲卵放進紙製扭蛋裡。扭蛋上有小孔，寄生蜂長大後就會飛出來。農民只要把扭蛋丟進玉米田裡，就能讓寄生蜂幫忙防治秋行軍蟲。更棒的是，扭蛋還可以用無人機投放，一公頃約20到30分鐘就能完成投放，比人工釘蜂片省時又省力。
    - idx: 6
      text: 昆蟲學家面對秋行軍蟲的來襲，想方設法，以日新月異的科技幫農民解決問題，從噴農藥到生物防治，從純人工到無人機，遇到新的問題，他們就再想新的辦法，真可說是「兵來將擋，水來土掩」啊。
  # 課文右緣印的累計字數（從 ☞ 所在的第三段起算）
  running_char_counts: [27, 56, 86, 115, 145, 165, 169, 196, 226, 254, 281, 311, 339, 367, 377]
  char_count_note: |-
    兩端精準吻合，但要同時用上三條 Word 字數口徑才對得起來：
    ① 一串阿拉伯數字算 1 個字；② **分節小標也被算進去**；③ 起點是 ☞ 所在的第 3 段。
    第 3 段實際 166 字，內含「20」（2→1），Word 算 165 = 印出的第 6 個數字；
    ＋小標「寄生蜂片」4 字 → 169 = 第 7 個數字；
    第 4 段實際 212 字，內含兩個「121」（各 3→1，共少 4），Word 算 208；
    169＋208＝377 = 最後一個數字。
    「小標也算進去」是這批新發現的第三條口徑（前兩條：數字串算 1 字、註腳算進去）。
  inline_marked_terms: [翼展, 蔓延, 防治, 施作, 一勞永逸, 抗藥性, 剋星, 想方設法, 日新月異, "兵來將擋，水來土掩"]
  underlined_terms: [赤眼卵寄生蜂, 秋行軍蟲, 寄生蜂]

