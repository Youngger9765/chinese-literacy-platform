    rows_note: |-
      每個隊伍的三句引言前面各有一個實心圓點（●），那是 Word 的清單符號、不在 w:t 文字流裡，
      故不寫入。表格印在第 2 段與第 3 段之間，不佔段號、也不算進念順順的字數
      （☞ 起點在第 6 段，表格在它之前）。
  inline_marked_terms: [歸咎, 自怨自艾, 回天乏術, 心理韌性, 峰迴路轉, 忐忑難安, 否極泰來, 苛責]
  inline_marked_terms_note: |-
    課文裡被加了字元外框的語詞（PDF 上是方框）。九個語詞中「百折不撓」在課文裡沒有加框
    （第 5 段的「百折不撓」是素面的）。有底線的是專名（塞利格曼／美國／波士頓塞爾提克／
    紐澤西籃網／籃網／塞爾提克），那是強調不是語詞標記。

