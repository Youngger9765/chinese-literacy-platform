# ── 一 讀全文-做記號 ──
body:
  title_line: |-
    第18課 樂觀者勝：
    向NBA球員學習「詮釋失敗」的智慧
  byline: |-
    課文  ：曾世杰
    學習單：陳允捷
  paragraph_count: 10
  paragraphs_note: |-
    段號欄印 一~十 共 10 個。課文儲存格裡實際有 16 個區塊：10 個散文段落（＝這 10 個段號）
    ＋ 表1 的標題與表格（2 個）＋ 三個分節小標（情境一/二/三）＋ 1 個空段。
    表1 與三個小標**不佔段號**。⚠️ PDF 上段號欄整體上移，「九」印在「情境三」那一行、
    「十」印在第 9 段的最後一行 —— 不要照「號碼旁邊那一行」對位，字數欄的累計值才是硬證據
    （見 key_reading.char_marks_note）。
  paragraphs:
    - idx: 1
      text: 在心理學家塞利格曼（M. Seligman）眼中，運動場上決定勝負的不只是技術或體能，還有「心態」——尤其是人們「如何解釋自己的失敗」。他的研究團隊曾經蒐集了美國報紙體育版上一萬多篇NBA的報導，仔細分析球員或教練「在輸球後」的訪談內容，想了解他們「對失敗的詮釋方式」，是否會影響日後的表現。
    - idx: 2
      text: 塞利格曼發現，不同球隊對輸球的看法，透露出兩種完全不同的思考習慣。一種是「悲觀的詮釋」：他們把輸球歸咎於長久的、全面的、難以改變的原因，例如「我們整隊都不行」或「對方實在太強了」。另一種則是「樂觀的詮釋」：他們傾向把失敗視為暫時的、特定的、可以修正的問題，例如「投籃不準，下次要更專心」或「今天太重防守，應該多進攻才是」。表1整理了波士頓塞爾提克與紐澤西籃網兩隊在輸球後的典型詮釋方式，可以看出兩隊詮釋風格的差異。
    - idx: 3
      text: 進一步的問題是，樂觀和悲觀的球隊在輸球後，會不會有不同的表現？結果相當驚人——樂觀詮釋失敗的球隊，往往能在接下來的比賽中有出色的表現；相反地，習慣自怨自艾，做悲觀詮釋的球隊，在接下來的比賽裡通常會繼續陷入低潮。
    - idx: 4
      text: 1985到1986年的球季，塞爾提克在一次輸球後，教練與球員的訪談多屬樂觀型。之後幾場比賽，他們的表現明顯回升，他們像不倒翁一樣，輸球後很快又重新站起來。反觀籃網隊在輸球後的談話多為悲觀語氣，像是「我們爛到回天乏術了」，結果接下來五場比賽輸了四場，接下來仍持續低潮。進一步的統計分析指出，詮釋風格與之後的表現之間有明顯的相關——越樂觀的球隊，越可能在輸球後迅速回到勝利軌道。
    - idx: 5
      text: 塞利格曼認為，這些詮釋並不只是口頭上的情緒用語，而是「一種深層的認知習慣」。它可能影響球員是否能百折不撓，是否能在受挫後繼續努力。
    - idx: 6
      text: 對學生來說也是如此，不管是學習、運動或人際關係，能夠用樂觀語言詮釋挫敗經驗的人，會更有心理韌性，也更能長期維持動力。例如：
    - idx: 7
      text: 你也許會說：「我沒有數學細胞」、「我程度差，做什麼都來不及了」，這是悲觀的詮釋，你可以試著轉念：「我這次太晚開始準備考試，下次要提早一點」、「有些題型我其實懂，只是不夠熟，下次提早複習、再多練幾題」。雖然考不好，你沒有全然否定自己，仍然認為有峰迴路轉的可能。
    - idx: 8
      text: 你難過的想著：「教練一定覺得我爛透了，我根本不是那塊料」，這是悲觀的詮釋，你可以試著轉念：「我今天狀況就是不好，再來要把外線練穩一點」。被換下來，心裡當然忐忑難安，但你相信每個人的表現起起伏伏，總有否極泰來的時候。
    - idx: 9
      text: 「我個性差，討人厭」、「我永遠也交不到朋友」，這是悲觀的詮釋，你可以試著轉念：「也許剛才話講的太硬了，等下氣氛好些時，再去表示善意」、「我的確有些堅持，下次要學著用不同的方式表達」。你仍關心朋友的看法，但不讓自己陷入「被討厭」的猜想裡。
    - idx: 10
      text: 從NBA到校園，關鍵不是輸贏，而是你怎麼看待失敗挫折。研究發現，把輸球、失分、誤會都改成「下次可以怎麼改進」，這樣的樂觀詮釋習慣，能讓人比較快重新站起來。下次遇到挫折，別急著苛責自己，養成一個習慣，告訴自己「逆境只是暫時的、特定的、可改變的遭遇」，日積月累後，心理韌性也會逐漸養成，你也能成為永遠打不倒的不倒翁！
  inline_headings:
    - {after_paragraph: 6, text: 情境一：段考數學不及格}
    - {after_paragraph: 7, text: 情境二：比賽中被換下場}
    - {after_paragraph: 8, text: 情境三：聽到同學說我「難搞」}
  inline_headings_note: |-
    三個小標印在課文中間、不佔段號，但**算進念順順的字數**（各 11／11／14 字，
    三個累計值 72／212／333 都因此對上）。
  inline_table:
    after_paragraph: 2
    title: 表1：塞爾提克隊與籃網隊輸球後的詮釋方式比較
    columns: [球隊, 輸球後球員和教練怎麼說, 詮釋風格, 把輸球詮釋成……]
    rows:
