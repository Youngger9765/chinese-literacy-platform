# ── 六 品格聚光燈 ──
spotlight:
  strategy_name: 正向思考──用樂觀詮釋面對失敗
  strategy_type: character_strength
  section_title_printed: 品格聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）；進階練習的兩句樂觀詮釋是橘色手寫，也在文字層
  blocks:
    - type: concept_box
      text: |-
        　　有時候，我們不是被事情打倒，而是被自己腦袋裡的「小劇場」打敗。朋友沒回訊息、比賽失誤、考試退步，腦中就會冒出：「他一定不想理我」、「我好爛」、「完了，我不行了」的想法，這些想法聽起來像事實，其實只是大腦在「編故事」。
        　　心理學家塞利格曼博士發現：
        　　悲觀的人：「這件事會一直這樣」、「都是我的錯」、「我就是爛」
        　　樂觀的人：「這只是暫時的」、「只是某個部分出錯」、「我還能改變」
        　　而且，樂觀不是天生的，它可以練習。當我們學會用新的角度看失敗，就能讓自己有力量繼續往前。接下來，讓我們一起練習，看怎麼把腦中的負面劇本，改寫成更勇敢、更樂觀的版本。

    # ── 一、自我覺察 ──
    - type: sub_block
      label: 一、自我覺察：你的大腦也在「編劇」嗎？
      instruction: 請閱讀下列情境，勾選出你是否也曾出現這樣的想法。（沒有標準答案喔）
      columns: [情境, 我的想法, 你是否也曾有相同想法？]
      no_correct_answer: true
      answer_carrier: 學生自填，原稿五列都沒有勾選
      items:
        - sub_label: 1.朋友下課沒等我就走了
          value: 他一定在生我的氣
          options: {1: 有, 2: 沒有}
          no_correct_answer: true
        - sub_label: 2.老師上課叫我回答問題，我答錯了。
          value: 大家一定覺得我超笨
          options: {1: 有, 2: 沒有}
          no_correct_answer: true
        - sub_label: 3.比賽失誤被換下場
          value: 教練一定討厭我
          options: {1: 有, 2: 沒有}
          no_correct_answer: true
        - sub_label: 4.這次段考數學沒考好
          value: 我就是沒有數學細胞
          options: {1: 有, 2: 沒有}
          no_correct_answer: true
        - sub_label: 5.媽媽又在提醒我寫功課
          value: 她根本不相信我會自己安排時間
          options: {1: 有, 2: 沒有}
          no_correct_answer: true
    - type: guide
      text: |-
        如果你的答案多是「有」，可能代表你比較容易被大腦的悲觀小劇場帶著走。
        但別擔心，樂觀是可以學習的，我們可以練習用不同角度看事情，就能減少誤會，也更容易冷靜下來解決問題。

    # ── 二、樂觀是可以學習的 ──
    - type: guide
      text: |-
        二、樂觀是可以學習的：
        樂觀不是假裝沒事，而是能換個角度看事情。例如：有人覺得「沒考好＝我很笨」，但也有人會想：「只是這次準備不夠，下次還能更好。」
        你發現了嗎？他們面對同樣的事情，情緒卻完全不同，造成的結果也會不同，這就是「詮釋」的力量。
    - type: sub_block
      label: 1.判斷下列想法是樂觀還是悲觀？(請打勾，單選)
      hint: 提示：樂觀＝暫時、特定、可改變；悲觀＝長久、全面、無法改變。
      columns: [情境, 我的想法, 判斷]
      items:
        - {sub_label: 1.段考退步了, value: 我可能複習太晚，下次要再提早, options: {1: 樂觀, 2: 悲觀}, answer: 1}
        - {sub_label: 2.練球被換下場, value: 我就是沒天分，再怎麼練都沒用, options: {1: 樂觀, 2: 悲觀}, answer: 2}
        - {sub_label: 3.老師提醒我太常講話, value: 我太吵了，老師一定討厭我, options: {1: 樂觀, 2: 悲觀}, answer: 2}
        - {sub_label: 4.作業被退回重寫, value: 原來我漏了重點，改完應該會更好, options: {1: 樂觀, 2: 悲觀}, answer: 1}
        - {sub_label: 5.媽媽每天碎碎念, value: 她根本看不起我，什麼都嫌, options: {1: 樂觀, 2: 悲觀}, answer: 2}
    - type: sub_block
      label: 2.換你試試看：現在我們用第一大題的情境來練習「樂觀詮釋」
      columns: [情境, 我的樂觀詮釋(請打勾，複選)]
      items:
        - sub_label: 朋友下課沒等我就走了。
          options:
            1: 可能他有急事，或沒看到我
            2: 下次我可以主動去找他，一起走就好
            3: 反正我也不需要這個朋友
          answers: [1, 2]
        - sub_label: 老師上課叫我回答問題，我答錯了。
          options:
            1: 至少我敢舉手，下次再確認答案就好
            2: 老師故意刁難我，讓我下不了台
            3: 我可以記住這題，下次再被問就不會錯
          answers: [1, 3]
        - sub_label: 比賽失誤被換下場。
          options:
            1: 我怎麼那麼沒用，真丟臉
            2: 今天表現不好，下次多練幾次就能改善
            3: 被換下來剛好可以觀察隊友的打法，下次更有機會改進
          answers: [2, 3]

    # ── 三、進階練習 ──
    - type: sub_block
      label: 3.進階練習：如果你遇到了以下的壞事，而且有了悲觀的詮釋，請你試著把這些詮釋改成樂觀的詮釋。第❸項請依你自己遭遇過的狀況填寫。
      items:
        - sub_label: ❶今天出門後，發現忘記帶早餐。
          value: |-
            悲觀的詮釋：我真是笨死了，連這種事情也會忘記。
            樂觀的詮釋：還好，我身上有帶錢，可以去合作社買。
          answer_carrier: 「樂觀的詮釋」那一行是橘色手寫（教師版示範答案），文字流有此資訊
        - sub_label: ❷媽媽又在提醒我寫功課。
          value: |-
            悲觀的詮釋：她就是不相信我，老是要管我，真是煩死了。
            樂觀的詮釋：我可以跟她溝通讀書計畫，讓她放心也給我空間。
          answer_carrier: 「樂觀的詮釋」那一行是橘色手寫（教師版示範答案），文字流有此資訊
        - sub_label: ❸我遇到的壞事：
          value: |-
            悲觀的詮釋：
            樂觀的詮釋：
          no_correct_answer: true
          answer_carrier: 三行都是空底線，學生自填
    - type: concept_box
      label: 結語
      text: |-
        結語：面對失敗時，關鍵不在輸贏，而在你怎麼看待它。
        　　　當你能把挫折看成暫時、特定、可改變的挑戰，
        　　　你就不再被失敗擊倒，而是讓自己一步步變得更堅強。
      text_note: 印在一個圓角外框裡（PDF p9 底部），是本大題的收尾框

    - type: self_check
      label: ◎自我檢核
      items:
        - 我能分辨出「樂觀詮釋」與「悲觀詮釋」的差別。
        - 我能為日常挫折找到不同的詮釋方式。
        - 我能嘗試把負面想法轉成「暫時、特定、可改變」的想法。
      no_correct_answer: true
      answer_carrier: 學生自填，原稿無勾選
      reflection: ※如果你三項都打勾，恭喜你！你已經學會用「樂觀的思考方式」來面對挫折，你的心理韌性正在慢慢變強！期待你未來的蛻變。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  questions:
    - index: 1
      answer: A
      stem: 下列哪一句語詞使用錯誤？
      options:
        A: 炎炎夏日，他貪嘴吃了太多冰棒，肚子覺得「忐忑難安」
        B: 即使醫生全力搶救，但病人的狀況太嚴重，已經「回天乏術」
        C: 他雖然家境困苦，仍靠著「百折不撓」的精神完成博士學位
        D: 他因為比賽失誤而一直「自怨自艾」，反而錯過了改進的機會
      explanation: 第1題解析：選項A忐忑難安]形容心情緊張不安、坐立難安的樣子，此為成語誤用。
      explanation_placement_note: |-
        印在題目右側的獨立文字方塊（藍框），是教師版解析。
        「忐忑難安」後面那個半形右中括號是原稿印的（見 source_errata_note ①），照抄。
    - index: 2
      answer: B
      stem: 心理學家塞利格曼（Seligman）和研究團隊為了研究什麼問題，蒐集了一萬多篇NBA的報導？
      options:
        A: 想知道球隊訓練及與媒體的互動是否影響球隊年度總成績
        B: 想了解球隊在輸球後如何詮釋失敗，是否會影響之後的表現
        C: 想比較各家新聞媒體在球隊輸球後，是否公平評論輸球原因
        D: 想分析球迷評論與勝負的關聯，球員是否會受到評論影響
      explanation_absent_note: 本題原稿**沒有**解析框（其餘四題都有）
    - index: 3
      answer: D
      stem: 從文中舉例看，「樂觀詮釋」與「悲觀詮釋」的主要差別在於哪一點？
      options:
        A: 樂觀的人遇到壞事會假裝沒事，悲觀的人則會一直生氣
        B: 樂觀的人遇到壞事容易忘記失敗，悲觀的人記性比較好
        C: 樂觀的人天天開心、保持好心情，悲觀的人每天自怨自艾
        D: 樂觀的人相信問題只是暫時的，悲觀的人覺得問題會一直存在
      explanation: 第3題解析：本文指出樂觀者會把失敗看成「暫時、特定、可以改變的」，悲觀者則認為失敗是「永久、全面、無法改變的」。
      explanation_placement_note: 印在 PDF p10 底部的獨立文字方塊（藍框），版面上落在第 5 題之後、第八大題標題之上
    - index: 4
      answer: C
      stem: 選出以下最符合本文主旨的選項。
      options:
        A: 面對比賽輸贏，球員的表現主要取決於技術與訓練
        B: 成功與失敗是人生的一部分，並不是人能完全掌控的
        C: 面對挫折，以樂觀態度詮釋，較能重新振作並改善表現
        D: 學習心理學的方法，可以幫助球員提升表現與信心
      explanation: 第4題解析：本文核心在於「思考方式會影響行動與結果」，強調以樂觀態度面對挫折能盡速恢復。
      explanation_placement_note: 印在 PDF p10 底部的獨立文字方塊（藍框），與第 3、5 題的解析框疊在一起
    - index: 5
      answer: C
      stem: 若你在運動會接力比賽失誤，以下哪一個選項最能展現「樂觀詮釋」？
      options:
        A: 我害大家輸了，真是沒臉再參加比賽
        B: 今天太熱，我看不論誰來都會跑不好
        C: 我下次先練起跑時機，應該能更穩定接棒
        D: 我可能不適合跑接力，以後還是不要參加這項比賽了
      explanation: 第5題解析：選項C表現「問題可修正」的思考模式，是樂觀詮釋的具體行為。D.是錯誤選項，因為它帶有「永久性」與「不可改變」的悲觀詮釋：把一次失誤擴大成「我不適合接力」，甚至決定「以後都不要參加」。
      explanation_placement_note: |-
        ⚠️ 第 3、4、5 題的解析框在 PDF p10 上**互相疊印、也蓋住第八大題的標題與指示語**，
        看起來像版面壞掉。document.xml 的文字流是完整乾淨的，本欄以文字層為準。

