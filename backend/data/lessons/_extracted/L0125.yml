vocab_definitions:
  vocabulary_bank: [好心沒好報, 不堪設想, 悲痛欲絕, 自告奮勇, 事在人為, 情有可原, 因噎廢食, 提告, 苛責, 感同身受]
  vocabulary_bank_label: 本課語詞
  instruction: |-
    請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
    🅐 從本課語詞框框，找語詞。
