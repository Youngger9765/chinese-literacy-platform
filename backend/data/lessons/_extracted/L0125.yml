# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略——推論人物行為的背後動機
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層，4 個）＋ 橘色手寫填空
  blocks:
    - type: concept_box
      text: |-
        若看到「中學生墜樓輕生」或「國中學長霸凌新生」的新聞，你難免就會想進一步了解「為什麼他（她）會做這件事？」也就是說，人們總是還會想進一步了解行為（如墜樓或霸凌）背後的「動機」。而在文章中，人物的動機可能會「明示（明白的寫出來）」，但也可能「隱含（在情節中）」，例如：
        (1)明示：陳同學基於熱心抱顏同學到地下室上課。
        →陳同學抱顏同學到地下室的動機是熱心助人。
        (2)隱含：❶他上課時偷偷看了好幾次手機上的時間。
        →他急著想處理一些事，想要快點下課。
        ❷同學從他身邊走過，他立刻用身體擋住正在寫的卡片。
        →卡片要寫給誰、裡頭寫了什麼？他不想讓人知道。
        當人物的動機沒有直接寫出時，我們可以根據事情發生的背景、人物當時的處境、言行和反應，以及人物特質，推論他這樣做的原因或目的。
        小叮嚀：隱含動機的答案可能不只一個，但都要有課文線索支持，並符合情節發展，才是合理而有說服力的推論。
      text_note: |-
        原稿在「當人物的動機沒有直接寫出時…」與「小叮嚀…」兩段前面各印一個 ☞ 圖示（圖片 127），
        是圖不是字元，所以不寫進 text。

    - type: guide
      text: ◎ 小試身手：

    # ── 一、明示 ──
    - type: guide
      text: 一、人物動機「明示」在課文內文中
    - type: sub_block
      label: 明示 1
      value: |-
        1.摔倒時，陳同學仍緊抱顏同學，將自己當成肉墊，保護著他。
        →陳同學的動機是想要【　】。
      blanks:
        - {answer: 保護顏同學}
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    - type: single
      prompt: |-
        2.顏同學還告訴校護及導師：「不是陳同學的錯，請不要處罰他。」
        →顏同學的動機是(  )陳同學被學校處罰
      options: {1: 希望, 2: 不希望}
      answer: 2
    - type: sub_block
      label: 明示 3
      value: |-
        3.顏家對陳同學、學校提起民事訴訟。
        →顏家的動機是希望【　】。(課文第五段)
      blanks:
        - {answer: 有人為這件事情負責}
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊

    # ── 二、隱含 ──
    - type: guide
      text: 二、人物動機「隱含」在課文內文中
    - type: single
      prompt: |-
        1.景杰老師沒有直接回答緒恩，反而講述玻璃娃娃事件，並請全班說說對法院判決的想法。
        →根據你的推測，景杰老師這樣做的動機可能是：（單選）
      options:
        1: 希望學生比較三次判決的結果與理由
        2: 希望學生從不同角度思考兩難問題
        3: 希望學生了解助人之前應先衡量能力
      answer: 2
    - type: multi
      prompt: |-
        2.校方與顏家共同成立「顏旭男急難救助獎學金」。
        →根據你的推測，他們成立這項獎學金的動機可能是：（多選）
      options:
        1: 希望繼續向社會大眾募集賠償金
        2: 希望幫助其他遭遇急難的學生
        3: 希望紀念意外身亡的顏同學
        4: 希望證明法院做出了錯誤判決
      answers: [2, 3]

  absent_note: |-
    ⚠️ 本課聚光燈**沒有印「◎自我檢核」那一段**（L0116、L0123 都有）。這是原稿如此，不是漏抽。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案，印在題號前的括號內），文字流有此資訊
  answers_note: 第 1、3 題的代號在原稿印的是全形「Ｄ」「Ｂ」，第 2、4、5 題是半形；這裡一律記半形
  teacher_notes_note: |-
    第 1、3、5 題右側有深藍色（C:0F4761）的教師解析文字方塊；
    第 2、3、4 題另有印在選項行內的括號提示（如「(是學校未提供)」「(文中未提到)」「(第八段末行)」），
    那些是**印在題幹或選項後面的正文**，不是文字方塊，照原樣記在 stem/options 裡。
  questions:
    - index: 1
      answer: D
      stem: 下列選項中，哪個句子中的詞語使用不正確？
      options:
        A: 小明看到同學摔倒，「自告奮勇」的上前幫忙，十分熱心
        B: 只要我們努力準備，相信「事在人為」，一定會有好結果的
        C: 如果火災發生時，消防隊來不及救援，後果將「不堪設想」
        D: 她們倆的交情「情有可原」，兩人從國小時期就是好朋友
      teacher_note: 「情有可原」指在特定情況下，行為或錯誤是可以被理解的，與該詞原意不符。
    - index: 2
      answer: A
      stem: 文章提到二審法官判定陳同學也需賠償顏家，何者是法官做出此判決的原因？(第六段，二審法官的理由)
      options:
        A: 法官認為陳同學雖是好心，也要考量自身能力
        B: 法官認為陳同學已經發揮照顧同學的美德，情有可原
        C: 法官認為陳同學沒有提供無障礙設施給顏同學(是學校未提供)
        D: 法官認為家屬的延誤就醫是導致顏同學死亡的主因
    - index: 3
      answer: B
      stem: 緒恩舉手發問機車騎士扶老爺爺事件時，越說越激動，請你推測一下，讓緒恩情緒激動的背後原因是什麼？
      options:
        A: 他很生氣機車騎士居然不禮讓老人，害人受傷
        B: 他覺得機車騎士好心沒好報，因而忿忿不平
        C: 他認為機車騎士假好心，根本不是真心要幫人
        D: 緒恩以前也遇過類似的經驗，所以非常生氣(文中未提到)
      teacher_note: (B由第一段可知緒恩認為好心沒好報，所以質疑助人為快樂之本不合理。)
    - index: 4
      answer: B
      stem: 第八段第4行，雅柔說：「如果是我，我會先哭死，再氣死。」請問她話中的「我」，指的是誰？(第八段末行)
      options:
        A: 陳同學家人
        B: 顏同學家屬
        C: 陳同學
        D: 顏同學
      options_note: 四個選項印在同一行（A.陳同學家人　B.顏同學家屬　C.陳同學　D.顏同學），不是各佔一行
    - index: 5
      answer: C
      stem: 作者透過這篇文章想要達成什麼目的？請選出最可能的答案。
      options:
        A: 說明法官不太可能處罰熱心助人的行為
        B: 主張最好不要主動幫助別人，以免惹上麻煩
        C: 用爭議事件引發關注，從不同角度深入思考問題
        D: 說明法律可以解決許多糾紛，未來可考慮當法官
      teacher_note: 最末段，世界上常出現兩難的狀況，這些問題必須要透過多方討論及思考才能做出適當的決定。

