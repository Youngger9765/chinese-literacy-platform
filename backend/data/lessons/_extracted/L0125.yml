# ── 一 讀全文-做記號 ──
body:
  title_line: 第5課  好心沒好報的玻璃娃娃爭議事件
  paragraph_count: 11
  paragraphs_note: |-
    段號欄印 一~十一 共 11 個。第 6 段與第 7 段之間插了一張「法院三次判決」表格，
    它不佔段號，另存 inline_table。
  paragraphs:
    - idx: 1
      text: 今天公民課，景杰老師一進教室，緒恩就舉手發問：「老師，大家都說助人為快樂之本，但是前幾天有一位老爺爺自己跌倒，一名路過的機車騎士好心扶他起來，老爺爺根本沒有受到嚴重的傷，沒想到，後來老爺爺卻反告機車騎士撞倒他，要求賠償。」緒恩越說越激動：「還好警方調閱監視器還原了真相。沒想到做好事卻遇到這種人，真是好心沒好報，以後還有誰敢幫助別人呢？」
    - idx: 2
      text: 景杰老師說：「這還算是幸運的！我來講一個真實的案例。大家聽過玻璃娃娃事件嗎？2000年時，就讀臺北市景文高中二年級，患有先天性遺傳疾病的男生顏旭男，在校內跌倒致死。這個案件後來引起了很大的社會爭議。」
    - idx: 3
      text: 這件事的發生經過是這樣的：顏同學患有成骨不全症，這種病的患者骨骼像玻璃一樣脆弱，輕輕摔倒都可能導致骨折，所以，患者經常被稱為玻璃娃娃，他們的生活起居都需要小心照顧，避免與他人碰撞，否則後果不堪設想。
    - idx: 4
      text: 事發當天下雨，顏同學班上的體育課從操場改到了地下室。身體不便的他，只能孤伶伶的在教室休息，同班的陳同學基於熱心，就問顏同學：「要不要抱你到地下室跟大家一起上課，這樣比較熱鬧？」顏同學同意了，因為該校並未設置電梯等無障礙設施，但雨天樓梯濕滑，陳同學抱著顏同學移動時，不慎滑倒，兩人一起摔下樓梯。摔倒時，陳同學仍緊抱顏同學，將自己當成肉墊，保護著他。兩人立即被送至醫護室，顏同學還告訴校護及導師：「不是陳同學的錯，請不要處罰他。」學校立刻通知家長並叫救護車到場協助，當下顏同學看起來並無外傷，意識清楚，顏爸爸說自己10分鐘後可以到校送孩子就醫，無須救護車協助，因此導師就讓救護車離開，但顏爸爸卻在50分鐘後才抵達學校，自行送醫急救。不幸的是，顏同學因顱內大量出血，於同日晚間八點多不治身亡。
    - idx: 5
      text: 顏家悲痛欲絕，他們認為一定要有人為這件事情負責，因此對學校及陳同學提告、要求賠償。爭議點來了，陳同學好心協助玻璃娃娃卻導致意外發生，他需不需要負法律責任？
    - idx: 6
      text: 這件事經過了法院多次審理，每一審都有不同判決，可見就連法官之間的見解也大不相同，下表整理了法院三次判決結果及理由。
    - idx: 7
      text: 景杰老師說完這個故事後，全班安靜了好一陣子，老師才說：「聽了這個故事，大家對法院的判決有什麼想法呢？」
    - idx: 8
      text: 一時之間，同學們的回應此起彼落。雅柔說：「我對顏家的悲傷痛苦可以感同身受，自己的孩子早上好好的去上學，上個體育課就天人永隔了。而一審法官的意思是，這沒辦法，大家都不是故意的，沒有人需要負責。如果是我，我會先哭死，再氣死。」
    - idx: 9
      text: 承熹說：「陳同學自告奮勇幫助同學，如果還被處罰，這樣以後誰還敢去幫助同學？好心沒好報，二審的判決真是讓人氣餒。」
    - idx: 10
      text: 語菲說：「我認為最高法院的判決最有道理，畢竟事在人為，如果學校本來就有提供為顏同學設計的體育課，這件悲劇就不會發生。陳同學熱心助人，卻造成不幸的結果，法官認為情有可原，不必負過失責任，也可以避免因噎廢食，讓整個社會大眾以後都不敢主動幫助別人了。」
    - idx: 11
      text: 景杰老師說：「哇嗚，沒想到年紀輕輕的你們都這麼有想法，以後可以考慮當法官了。是的，這世界經常出現這種兩難、沒有簡單答案的問題，但今天在這裡，我們聽到了大家不同的意見，這樣我們才會有機會做出最適當的決定。今天的討論真精采，我對下一次上課充滿期待哦。」
  inline_table:
    attached_to: 第 6 段與第 7 段之間
    columns: ['', 地方法院一審, 高等法院二審, 最高法院判決]
    rows:
      - ['判決結果', '陳同學、學校無故意過失，均不負損害賠償責任。', '學校與陳同學須共同賠償顏家333萬元。', '陳同學無賠償責任、學校賠償172萬元給顏家。']
      - ['理由', "1.陳同學發揮同學彼此之間照顧的美德，且顏同學明確表示不怪陳同學，故陳同學無故意或過失。\n2.當天家長通知校方暫不送醫，家長的延誤可能是導致顏同學離世的原因，故學校無故意或過失。", "1.陳同學的確是好心協助，但是助人時應先考量自己的能力，因為自己的疏忽導致顏同學不幸離世，須負過失責任。\n2.學校未提供無障礙設施及個別化體育教學給顏同學，導致意外發生，須負過失責任。", "1.陳同學只有16歲，經驗有限，意外發生的當下已盡了最大努力保護顏同學，不應苛責。\n2.學校未提供無障礙設施及個別化體育教學給顏同學，導致意外發生，須負80%過失責任。\n3.顏爸爸延誤就醫，導致顏同學死亡，應自負20%過失責任。"]
      - ['結局', '顏家再上訴高等法院', '陳同學、學校再上訴最高法院。', '雙方接受判決。校方與家屬成立顏旭男急難救助獎學金。']
  inline_marked_terms_note: |-
    課文裡用黑色字元框線（w:bdr color=auto）標出的語詞。
    ⚠️ 這些框是 color=auto 的黑框，**不是**「框選語詞」型的答案載體（那種是非 auto 顏色）。
  inline_marked_terms: [好心沒好報, 不堪設想, 悲痛欲絕, 提告, 感同身受, 自告奮勇, 事在人為, 情有可原, 因噎廢食, 苛責]

