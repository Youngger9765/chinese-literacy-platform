  vocabulary_bank_note: 原稿語詞框分四行印，順序即上列；本大題只用到其中 9 個裡的 9 個（全用到）
  answer_carrier: 橘色手寫字（PDF p3）；文字層的空格內已填有同樣的答案
  items:
    - {index: 1, word: 去蕪存菁, definition: 去掉雜亂或不重要的部分，留下精華。}
    - {index: 2, word: 流連忘返, definition: 留戀某個地方或事物，捨不得離開，甚至忘了回去。}
    - {index: 3, word: 得不償失, definition: 得到的好處，不足以彌補遭受的損失。}
    - {index: 4, word: 惡性循環, definition: 一個壞結果又造成下一個問題，使情況變得更糟。}
    - {index: 5, word: 小酌, definition: 指少量喝酒。}
    - {index: 6, word: 懸梁刺股, definition: 古人為了不打瞌睡，用疼痛讓自己保持清醒的故事；比喻刻苦讀書。}
    - {index: 7, word: 睡眼惺忪, definition: 剛睡醒，眼睛半開，還很迷糊的樣子。}
    - {index: 8, word: 代謝, definition: 身體把養分轉成能量，並產生、排出廢物的過程。}
    - {index: 9, word: 生理時鐘, definition: 身體內控制睡眠、清醒、飢餓等規律的「時鐘」。例如，到了固定時間就會想睡或肚子餓。}

