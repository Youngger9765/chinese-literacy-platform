# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 摘要策略─從主題句找小主題
  strategy_type: summarize
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  blocks:
    - type: concept_box
      text: |-
        本文是一篇說明文，介紹和睡眠有關的知識。文章在「睡眠」的大主題下，分成幾個小主題，每個小主題下，再用重要的細節說明。
        上一課，我們利用段落前的小標題，快速找到小主題。這一課沒有段落小標題，要從段落內容找出小主題。
        有些段落會用一句話，先說出或最後總結整段的主要內容。這一句叫作主題句。其他句子通常會解釋、舉例或補充主題句。我們可以用三個步驟找出小主題：
        (一)讀整段→(二)找主題句→(三)確認小主題

    - type: guide
      text: 一、找小主題：第五段

    - type: passage
      paragraphs:
        - ❶睡眠還能讓你學得更好。❷研究顯示，大腦在睡眠過程中會整理記憶，把白天接收的訊息去蕪存菁，保留重要部分，進一步形成長期記憶。❸睡眠不足時，大腦會較難吸收新知、回想細節，反應也會變慢，出錯率提高。❹古人有「懸梁刺股」的故事，其中「懸梁」是讀書時把頭髮用絲線綁在橫樑上，一打瞌睡，頭皮就會被拉扯而痛醒。❺你覺得這樣會有好的學習效果嗎？

    - type: guide
      text: （一）讀整段

    - type: single
      prompt: |-
        想一想：這一段主要在談什麼？
        「整理記憶、吸收新知、回想細節、學習效果」都和什麼有關？
      options:
        1: 身體健康
        2: 學習
      answer: 2

    - type: guide
      text: →所以，這一段大概是在說明睡眠和學習的關係。

    - type: guide
      text: （二）找主題句

    - type: single
      prompt: 有沒有哪一句能說出整段的主要內容？(單選)
      options:
        1: 句❶
        2: 句❷
        3: 句❸
        4: 句❹
        5: 句❺
      answer: 1

    - type: guide
      text: （三）確認小主題

    - type: single
      prompt: 1.用其他句子檢查句❷到句❺是不是都在說明、舉例或補充句❶？
      options:
        1: 是
        2: 不是
      answer: 1

    - type: guide
      text: |-
        句❷說明睡眠如何幫助學習。 句❸說明睡不夠對學習的影響。句❹、句❺用故事和
        問題補充說明。→因此，句❶是本段的主題句，最能說出整段的主要內容。

    - type: free_text
      prompt: |-
        2.把主題句改成簡短的小主題：
        主題句：睡眠還能讓你學得更好。
        本段小主題是：【　】（答案合理即可）
      blanks:
        - {answer: 睡眠對學習的影響}

    - type: guide
      text: 二、找小主題：第六段

    - type: passage
      paragraphs:
        - ❶雖然睡眠的重要性已廣為人知，仍有一些似是而非的觀念讓人混淆。❷有人說：「平日熬夜沒關係，假日再補眠就好。」❸但是，假日補眠不能代替平日充足、規律的睡眠；睡覺時間忽早忽晚，也會打亂生理時鐘。❹也有人認為：「睡前喝酒能幫助入眠。」❺喝酒後雖然可能較快入睡，卻容易在夜裡醒來，整體睡眠品質反而下降。❻因此，酒精不是睡眠的好朋友；睡前小酌，反而可能讓人睡得更不安穩。
      paragraphs_note: 這是課文第 6 段的**節錄改寫版**（原段有「睡眠時數忽長忽短」「想像身體裡有一個看不見的時鐘…」「第二天更加疲倦」等句，此處刪去），原稿如此，非抽漏。

    - type: guide
      text: （一）讀整段

    - type: multi
      prompt: 想一想：這一段提到哪兩種睡眠觀念？
      options:
        1: 假日補眠
        2: 睡前喝酒
        3: 早睡早起
      answers: [1, 2]

    - type: guide
      text: →所以，這一段大概是在說明和睡眠有關的觀念。

    - type: guide
      text: （二）找主題句

    - type: single
      prompt: 哪一句能說出整段的主要內容？
      options:
        1: 句❶
        2: 句❷
        3: 句❸
        4: 句❹
        5: 句❺
        6: 句❻
      answer: 1

    - type: guide
      text: →因此，句❶是本段的主題句。

    - type: guide
      text: （三）確認小主題

    - type: single
      prompt: 句❷到句❻主要在做什麼？
      options:
        1: 舉出兩種睡眠迷思，並說明它們為什麼不正確。
        2: 提出兩種幫助睡眠的方法
      answer: 1

    - type: free_text
      prompt: →因此，本段小主題是：【　】（答案合理即可）
      blanks:
        - {answer: 常見的睡眠迷思}

    - type: guide
      text: 三、找小主題，換你自己寫：第四段

    - type: passage
      paragraphs:
        - 好好睡一覺，好處多多。當你以為身體在休息時，睡眠其實正幫助身體默默進行修復與調整：修復勞累一天的肌肉、調整各部分的運作，並清除代謝產生的廢物。如果老是睡不夠，身體恢復與修復的時間就會減少。長期下來，可能增加肥胖、糖尿病、心血管疾病及憂鬱等健康風險。
      paragraphs_note: 本段沒有 ❶❷❸ 句號標記（前兩段有），原稿如此

    - type: free_text
      prompt: |-
        請運用前面學到的方法，寫出本段簡短的小主題。
        本段小主題是：【　】（答案合理即可）
      blanks:
        - {answer: 睡眠對身體健康的影響}

    - type: guide
      text: 四、找小主題：第三段

    - type: passage
      paragraphs:
        - ❶事實上，睡眠和健康關係密切，對成長中的國中生尤其重要。❷美國疾病管制與預防中心建議，青少年每天應睡8到10小時。❸換句話說，如果你預計早上6點半起床，想睡足8小時，最晚晚上10點半前就要準備入睡啦！

    - type: guide
      text: （一）讀整段，找共同內容

    - type: single
      prompt: 想一想：這一段主要在說明什麼？
      options:
        1: 青少年每天需要睡多久
        2: 睡眠和健康的各種關係
      answer: 1

    - type: guide
      text: （二）找主題句

    - type: single
      prompt: 有沒有哪一句能說出整段的主要內容？
      options:
        1: 句❶
        2: 句❷
        3: 句❸
      answer: 2

    - type: guide
      text: （三）看句子關係

    - type: single
      prompt: 句❸用「早上6點半起床」的情況，主要是要做什麼？
      options:
        1: 舉例補充說明句❷的睡眠時間。
        2: 提出另一個睡眠主題
      answer: 1

    - type: guide
      text: （四）確認小主題：把主題句改成簡短的小主題

    - type: free_text
      prompt: 本段小主題是：【　】（答案合理即可）
      blanks:
        - {answer: 青少年需要的睡眠時間}

    - type: guide
      text: |-
        →你發現了嗎？
        主題句常在段落開頭或結尾，也可能在中間。找主題句時，要看：
        哪一句最能說出整段重點？其他句子是不是都在說明、舉例或補充它？

    - type: self_check
      label: ◎自我檢核
      items:
        - 1.我能判斷哪一句是主題句。
        - 2.我能把主題句改成簡短的小主題。

# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p8~p9）；文字層的（　）內已填有同樣的代號
  questions:
    - index: 1
      answer: A
      stem: 下列語詞何者使用不正確？
      options:
        A: 他昨晚睡得充足，早上精神飽滿，仍然「睡眼惺忪」
        B: 為了玩手機而熬夜，隔天整天沒精神，真是「得不償失」
        C: 整理報告時，他刪去重複內容，使文章更加「去蕪存菁」
        D: 遊客被湖邊美景吸引，逛得「流連忘返」，直到傍晚才離開。
      explanation: A睡得充足、精神飽滿，不符合「睡眼惺忪」
      explanation_note: 原稿是一個浮動說明框，印在題幹右側
    - index: 2
      answer: D
      stem: 根據課文，有關睡眠的敘述，何者不正確？
      options:
        A: 大腦在睡眠時會修復疲勞的肌肉
        B: 好的睡眠可降低疾病發生的風險
        C: 睡眠時可重組記憶，有助於學習
        D: 不論老小，每個人每天都需要睡滿八小時
      explanation: 生長各階段會有不同的睡眠長度。
      explanation_note: 原稿是一個浮動說明框，印在選項 B、C 右側
    - index: 3
      answer: A
      stem: 根據課文，為什麼睡前喝酒不能幫助入眠？
      options:
        A: 酒精會使人睡不安穩
        B: 酒精會使人上癮、喝多易作夢
        C: 酒精會讓大腦分泌過多荷爾蒙
        D: 酒精易讓人產生「睡前拖延症」
      explanation: 第六段：酒精會使人頻繁醒來，無法熟睡。
      explanation_note: 原稿是一個浮動說明框，印在選項 A、B 右側
    - index: 4
      answer: B
      stem: 造成現代人有「睡前拖延」最主要的原因為何？
      options:
        A: 失眠導致晚上無法入睡
        B: 睡前被3C內容吸引，停不下來
        C: 大腦有其他的睡眠障礙
        D: 大腦高速運轉不想入睡
      explanation_absent_note: 本題原稿沒有浮動說明框（其餘四題都有）
    - index: 5
      answer: B
      stem: |-
        請閱讀下面的段落，哪一個小主題最適合這段文字？
        上課前沒有吃早餐，容易感到疲倦，也較難集中注意力。早餐能補充一上午所需的能量，讓大腦保持清醒。因此，吃早餐有助於維持上午的精神與專注力。
      options:
        A: 早餐食物的不同種類
        B: 吃早餐帶來的好處
        C: 上午課程的安排方式
        D: 大腦產生能量的過程
      explanation: 最後一句是整段的關鍵句，概括吃早餐能維持精神與專注力，因此B最適合。
      explanation_note: 原稿是一個浮動說明框，印在選項右側
      options_note: PDF p9 上選項 D 被中間一個裝飾圖框擠到下方，看起來像脫隊；文字層順序正常

# ── 八 詞語複習 ──
vocab_review:
  type: word_search
  instruction: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  target_words: [睡眼惺忪, 流連忘返, 代謝, 小酌, 去蕪存菁, 懸梁刺股, 生理時鐘, 惡性循環, 得不償失]
  grid_size: [10, 10]
  grid:
    - 凝視哈欠連連一尚得保
    - 鐵鏈手無寸鐵息存不持
    - 去結甦小酌然譁片償沉
    - 喝蕪醒譁冒惡性腫失默
    - 哈難存然犯性睡眼惺忪
    - 餘欠以菁流循眠睛新懸
    - 飯係連舉連環叫陳世梁
    - 後關果連忘狀代開代刺
    - 走出陰霾返謝顧門黃股
    - 生理時鐘有所忌憚色腔
  answers_are_graphical: true
  answers_printed: true
  answer_paths:
    - word: 得不償失
      cells: [[1, 9], [2, 9], [3, 9], [4, 9]]
      direction: vertical
    - word: 小酌
      cells: [[3, 4], [3, 5]]
      direction: horizontal
    - word: 去蕪存菁
      cells: [[3, 1], [4, 2], [5, 3], [6, 4]]
      direction: diagonal_down_right
    - word: 惡性循環
      cells: [[4, 6], [5, 6], [6, 6], [7, 6]]
      direction: vertical
    - word: 睡眼惺忪
      cells: [[5, 7], [5, 8], [5, 9], [5, 10]]
      direction: horizontal
    - word: 流連忘返
      cells: [[6, 5], [7, 5], [8, 5], [9, 5]]
      direction: vertical
    - word: 懸梁刺股
      cells: [[6, 10], [7, 10], [8, 10], [9, 10]]
      direction: vertical
    - word: 代謝
      cells: [[8, 7], [9, 6]]
      direction: diagonal_down_left
    - word: 生理時鐘
      cells: [[10, 1], [10, 2], [10, 3], [10, 4]]
      direction: horizontal
  answer_paths_note: |-
    9 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。
    **PDF 只印得出 2 條**（流連忘返 p9、代謝 p10）—— 另外 7 個 roundRect 在一個
    垂直被拉伸 4.07 倍的 wpg 群組裡，LibreOffice 整組沒輸出。9 個圈的中心座標
    換算回格子後與 9 個語詞一一對應、無剩無缺（換算過程見檔頭）。

