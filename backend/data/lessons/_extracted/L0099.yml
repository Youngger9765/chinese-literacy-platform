  intended_word_note: |-
    「轉眼瞬間」那一條的目標語詞是「轉瞬之間」——格子第3列第4欄印成「眼」、第4列第5欄印成「瞬」
    （見 source_errata E1、E2）。word 必須跟格子實際拼得出來的字一致，否則座標門會判 FAIL。
    ⚠️ 這個註記要放在 `vocab_review` 這一層，不能塞進 `answer_paths` 的條目裡 ——
    `normalize_word_search.py --write` 只保留 word/cells/direction 三個鍵，塞在條目裡會被刪掉。
  answer_paths_note: |-
    10 條路徑，10 個目標語詞。逐格取字全部拼得回，**除了「轉瞬之間」——它在格子裡根本拼不出來**
    （見 source_errata E1、E2；那條斜線實際是「轉眼瞬間」）。
    驗法：對 10×10 格做八方向窮舉，9 個目標語詞各只命中 1 個位置（唯一解，不必猜），
    「轉瞬之間」命中 0 個；「磨合」有 2 個候選（[4,8][5,8] 直向與 [6,9][5,8] 斜向），
    取直向那個，因為斜向的 [6,9] 已被「磨難」佔用，且 PDF p10 上的橘框是直的。
    幾何交叉驗證（單向警報）：全文 roundRect = **10 個**，路徑 10 條 →
    沒有「紙上 > 路徑」的缺條警報。
    ⚠️ **紙外殘留：未驗**（`posOffset` 判準只認錨點型溢出，對「掛在儲存格裡被排版推出去」零命中，
    2026-08-18 更正）；扣掉未偵測的殘留只會讓紙上數更少，不會讓警報成立。

