    - {index: 5, stem: 有些人對精神疾病缺乏了解，常以負面言詞（　）患者，這會讓患者更不敢尋求幫助。, answer: A}
    - {index: 6, stem: 他將自己整理的（　）上傳網路，吸引了許多同好前來交流遊戲心得。, answer: G}
    - {index: 7, stem: 新成員加入團隊後，大家花了幾週時間（　），才逐漸找到最佳的合作默契。, answer: F}
    - {index: 8, stem: 這部電影讓我產生了（　），因為我也曾經經歷過類似的事情。, answer: C}

# ── 五 閱讀聚光燈 ──
spotlight:
  strategy_name: 推論策略──找觀點與理由，推論隱含意義
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  section_no_note: 🔴 本課聚光燈是**第五**大題（沒有文章重點表），不是慣例的第六。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），全課 13 個都在本節，PDF p5~p8 可見
  structure_note: |-
    ⛔ 小試身手那張表刻意留在 blocks 最上層、沒有塞進 sub_block ——
    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table
    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。
  blocks:
    - type: concept_box
      text: 上一課我們學過，閱讀說明文或議論文時，要找出「作者的觀點」和「支持觀點的理由」，再進一步推論觀點與理由共同顯示的隱含意義，才能更完整理解文章。觀點和支持理由間的關係，就像插圖中的桌子一樣，觀點像桌面，支持理由像桌腳；理由越充分，觀點越站得住腳，越有說服力。

    - type: figure
      referent: 桌子比喻圖（棕色桌面標「觀點」，四支桌腳各標「支持理由」，配兩個對話框）
      text_carrier: image
      caption_lines:
        - 觀點：就是對事情的看法、意見。
        - 可以支持觀點的「證據（事實）」
      figure_note: |-
        圖上的字畫在圖片像素裡，document.xml 的文字流一個字都沒有 —— 標 text_carrier: image
        讓逐字門列進「無法驗證」而不是靜默跳過。內容照 PDF p5 轉錄。
        ⚠️ 同一張圖也出現在 L0023（同一個策略家族），該課的對話框寫「可以說服別人接受觀點的」，
        本課寫「可以支持觀點的」，兩處用字不同，各自照原樣記錄。

    - type: concept_box
      text: |-
        這次，我們再練習用❶～❸的步驟來讀出「觀點、支持理由和隱含的意義」。
        ❶找觀點：作者對議題提出什麼判斷或主張？
        ❷找支持理由：作者用哪些事實、數據、例子或說明支持觀點？
        ❸推論隱含意義：把觀點與理由合起來，還能讀出什麼結論？
        接下來，我們來運用這個策略，分析這篇關於AI與學習的課文。

    - type: guide
      text: 一、作者在第一段提出了什麼「問題」？

    - type: single
      prompt: 先看第一段：根據開頭「公民課月經討論」的情境，作者想讓讀者思考的問題是什麼？（請打勾，單選）
      options:
        1: 月經之所以被汙名化的原因是什麼？
        2: AI功能越來越強，我們是否仍有學習的必要？
        3: AI提供的所有資料是否都正確可靠？
      answer: 2

    - type: guide
      text: 二、作者的回答：從各段標題找作者觀點、支持理由與隱含意義

    - type: guide
      text: 步驟❶找作者觀點

    - type: single
      prompt: 請你看四、五段，作者的觀點是什麼？（請打勾，單選）
      options:
        1: AI能快速回答問題，但真正的學習仍需要人主動提出值得追問的問題。
        2: AI能在短時間提供各種資料，因此只要學會下指令就能完成學習。
        3: AI能自行判斷哪一個問題最重要，不需要使用者再深入思考。
      answer: 1

    - type: guide
      text: 步驟❷找支持理由

    - type: concept_box
      text: 祕訣：支持理由常是事實、研究、例子或說明，可能出現在觀點之前或之後。

    - type: single
      prompt: 找一找，第四、五段作者提出「AI不懂發問」的觀點，底下哪一選項是作者提出的支持理由？（請打勾，單選）
      options:
        1: AI能在很短的時間蒐集到大量資料，並列表整理出影響「月經汙名化」的各種歷史與文化的原因。
        2: AI能協助使用者快速完成「月經汙名化」報告與分析，並提供使用者它最推薦的說法，及進一步的搜尋建議。
        3: 作者舉例，AI雖能列出「月經汙名化」的原因，但無法提出「生活中還有類似偏見嗎？」這類重要的問題。
      answer: 3

    - type: guide
      text: 步驟❸推論隱含意義

    - type: concept_box
      text: 祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）

    - type: guide
      text: |-
        ⑴觀點：「AI時代，人類更要會發問。」
        ⑵理由：學習者需要主動判斷什麼值得繼續追問，才能深入思考與理解。

    - type: single
      prompt: ⑶我讀到的結論是什麼？（請打勾，單選）
      options:
        1: 學習最重要的是避免接觸AI的錯誤資訊。
        2: 學習的價值不只在取得答案，而在能主動思考與提出問題。
        3: 只要AI再進步一點，就能替人決定所有值得追問的問題。
      answer: 2

    - type: guide
      text: 三、小試身手

    - type: fill_table
      prompt: 上面我們用「三步驟」練習了一個觀點，在這篇文章中，作者還提出其他重要觀點。接下來請你用同樣的三步驟（找觀點→找支持理由→推論隱含意義；從左欄到右欄），找出本文其他觀點。請在勾選□適合的答案。
      columns: [（段落）觀點, 支持理由, 推論隱含意義（我讀到的結論）]
      header_note: 表格最上方另有一列「作者的疑問｜AI的功能越來越強，讓人懷疑學習是否還有必要?」，左欄再往下是合併的「作者的回答」。
      answer_carrier: 紅色 ☑（w:sym Wingdings F0FE），PDF p7~p8 可見
      rows:
        - （段落）觀點: |-
            （4~5）
            AI時代，人類更要會發問。
          支持理由: AI能列出月經汙名化的多項原因，但「為什麼觀念持續存在」「生活中有沒有類似偏見」仍需要學習者主動追問。
          推論隱含意義（我讀到的結論）: 學習的價值不在記住答案，而在能主動思考、提出問題。
          row_note: 第一列是原稿已填好的示範（三欄都印好了，沒有勾選框）。
        - （段落）觀點: |-
            （6~7）
            □①終有一天，AI也能像人一樣感受情緒與共鳴。
            ☑②AI雖能生成文字、分析資料，但無法取代人類真實的生活經驗與情感體驗。
          （段落）觀點_options: {1: 終有一天，AI也能像人一樣感受情緒與共鳴。, 2: AI雖能生成文字、分析資料，但無法取代人類真實的生活經驗與情感體驗。}
          （段落）觀點_answer: 2
          支持理由: |-
            ☑①研究指出，讀者較容易對人類作者的故事產生情感共鳴。
            ☑②AI可以分析戰術、提供攻略，卻不能代替人親自練習、和隊友磨合，或感受突破難關的成就。
            □③AI生成的作文語句流暢，學生可直接交出，不必再判斷或修改。
          支持理由_options: {1: 研究指出，讀者較容易對人類作者的故事產生情感共鳴。, 2: AI可以分析戰術、提供攻略，卻不能代替人親自練習、和隊友磨合，或感受突破難關的成就。, 3: AI生成的作文語句流暢，學生可直接交出，不必再判斷或修改。}
          支持理由_answers: [1, 2]
          推論隱含意義（我讀到的結論）: |-
            □①只要AI把故事寫得更像真人，人類就不必再親自體驗。
            ☑②AI時代更要重視親身參與和情感連結，因為真正的體驗無法由AI代替。
          推論隱含意義（我讀到的結論）_options: {1: 只要AI把故事寫得更像真人，人類就不必再親自體驗。, 2: AI時代更要重視親身參與和情感連結，因為真正的體驗無法由AI代替。}
          推論隱含意義（我讀到的結論）_answer: 2
        - （段落）觀點: |-
            （8~9）
            ☑①AI時代，要更會判斷
            □②只要AI能快速完成作文，就代表學習更有效率。
          （段落）觀點_options: {1: AI時代，要更會判斷, 2: 只要AI能快速完成作文，就代表學習更有效率。}
          （段落）觀點_answer: 1
          支持理由: |-
            ☑①「我的夢想」作文例子中，學生沒有照抄AI，而是用自己的想法改寫成真實經驗。
            □②AI能提供創作靈感，是人類的最佳夥伴。
          支持理由_options: {1: 「我的夢想」作文例子中，學生沒有照抄AI，而是用自己的想法改寫成真實經驗。, 2: AI能提供創作靈感，是人類的最佳夥伴。}
          支持理由_answer: 1
          推論隱含意義（我讀到的結論）: |-
            □①AI永遠比人類聰明，所以學生的負擔大為減輕。
            ☑②聰明的學習者會駕馭AI：吸收建議、保留判斷、創造自己的作品。
          推論隱含意義（我讀到的結論）_options: {1: AI永遠比人類聰明，所以學生的負擔大為減輕。, 2: 聰明的學習者會駕馭AI：吸收建議、保留判斷、創造自己的作品。}
          推論隱含意義（我讀到的結論）_answer: 2

    - type: guide
      text: 四、推論主旨與寫作目的

    - type: guide
      text: 本文的觀點鋪陳：作者先以「AI回答月經問題」開場，指出AI的能力令人驚嘆，卻也引發「我們還需要學習嗎？」的思考。接著從三個面向說明——發問、體驗、判斷——來強調人類學習的價值。最後呼應開頭，指出「學習」仍是人類探索與成長的起點。

    - type: single
      prompt: 根據以上鋪陳，請你做適當推論，並在底下選出本文主旨。（單選）
      options:
        1: AI越進步，人類的學習重點仍然不會有所變。
        2: AI時代裡，人類的發問、體驗與判斷能力更為重要。
        3: 學習的主要目的，是學會如何使用AI來節省時間。
      answer: 2

    - type: single
      prompt: 推論作者寫作目的：作者希望我們未來可以怎麼做？（單選）
      options:
        1: 善用AI協助學習，並保有自己的思考與創造。
        2: 把所有作業交給AI處理，節省時間。
        3: 不再使用AI，完全回到傳統學習方式。
      answer: 1

    - type: self_check
      label: ◎自我檢核
      no_correct_answer: true
      answer_carrier: 學生自填，原稿三格皆為空 □（無 w:sym F0FE）
      items:
        - 1.我能找到作者的觀點。
        - 2.我能找到支持作者觀點的理由或證據。
        - 3.我能根據觀點和支持理由，進一步歸納出結論（隱含意義）。

    - type: guide
      text: ※如果你三項都打勾，恭喜你，表示你已經學會用 3 步驟「找到作者觀點與支持理由，並能推論出隱含意義」，你超厲害的！

# ── 六 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p9）；文字層的（　）內已填有同樣的代號
  items:
    - index: 1
      answer: A
      stem: 請問下列語詞，何者使用正確？
      options:
        A: 只要學會方法，就能輕鬆「駕馭」這套新軟體
        B: 媽媽罵我之後，我花了一點時間「磨合」自己的情緒
        C: 他唱歌太大聲，讓整個教室都產生了「情感共鳴」
        D: 我昨天「構思」好了一篇作文，交給老師批改
      explanation: 第1題解析：選項Ｂ「磨合」引申為人與人、團隊之間互相適應、調整以達成默契，不能用在情緒上。選項Ｃ「共鳴」指的是因為別人的感受、經驗、想法與自己相似，而產生情感上的呼應與理解。選項Ｄ「構思」是準備、想法階段，還沒真正寫完。
      explanation_note: 原稿是一個浮動說明框，印在題目右上方；選項代號用全形。
    - index: 2
      answer: B
      stem: 作者最後如何回答「AI什麼都會，我們還需要學習嗎？」
      options:
        A: 不需要，因為AI足以取代所有的學習過程
        B: 需要，AI越聰明，人類更需要學會駕馭AI
        C: 視情況而定，只要AI使用能力好，就不必再學習
        D: 需要，但學會使用AI就夠了，其他能力不再重要
      explanation: 作者強調的是人類思考與體驗的不可取代性，而不是條件式或部分需要的說法。
      explanation_note: |-
        原稿是一個浮動說明框，印在本題右側。⚠️ 它的內容與第 3 題的說明框**一模一樣**，
        只差第 3 題那個有「第3題解析：」前綴 —— 研判是重複貼上；兩個都照原樣保留。
    - index: 3
      answer: B
      stem: 「學習的重點，也許不再是誰記得多、誰算得快」，這句話隱含的意思是什麼？
      options:
        A: 學校應該取消考試制度與評量方法
        B: 學習應更加重視「發問、體驗與判斷」
        C: AI可以回答問題，因此學生可以減少思考
        D: 擔憂AI出現後，學生記憶力、計算力下降
      explanation: 第3題解析：作者強調的是人類思考與體驗的不可取代性，而不是條件式或部分需要的說法。
      explanation_note: 與第 2 題的說明框內容重複（見該題註）。
    - index: 4
      answer: D
      stem: 作者以「月經汙名化」作為開頭例子，其作用最可能是什麼？
      options:
        A: 強調長久以來女性在生理議題上的委屈與不被理解
        B: 點出學生太依賴AI搜尋資料，缺乏自主思考能力
        C: 說明AI能解決社會性別平等問題，展現科技的進步
        D: 用生活化情境引出使用AI與人類學習的核心問題
      explanation: 第4題解析-「月經汙名化」只是導入情境，作者藉此帶出：「AI能快速回答問題，但我們是否因此不再需要學習？」這是全文的核心問題。
      explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在第 3 題的選項之前，本檔歸位到本題。
    - index: 5
      answer: C
      stem: 下列哪一種做法最符合本課作者對學生使用AI的主張？
      options:
        A: 學生用AI找到課文的重點，然後背誦這些重點
        B: 學生用 AI 分析自己的學習，並照AI的建議行動
        C: 學生利用AI查資料後，自己整理出觀點與問題
        D: 學生把報告交給 AI 完成，最後加上一句自己的心得
      explanation: 第5題解析：A、B、D是錯誤選項，它們的共同問題是：缺乏自主思考。A-看似合理（有整理重點），但缺乏「自己詮釋」。B-看似幫助學習，但學生仍是被動接受。D-看似有成果，但學生沒有參與思考過程。
      explanation_note: 原稿是一個浮動說明框，印在題目下方

