            B: 說法大致合理，只要設備進步，選手原有的身體條件就不再那麼重要。
            C: 說法不夠完整，新設備能提供協助，但訓練與適合專項的條件仍很重要。
            D: 說法不太合理，新設備主要改善比賽環境，對選手實際成績的幫助有限。
          answer: C
    reading_relay:
      section_name_printed: 閱讀接力
      subtitle: 從科技影響成績，到科技使用的公平問題
      items:
        - type: single
          label: ❶把前兩篇接起來 1
          prompt: 前一篇提到，基普喬吉使用雷射配速與高科技跑鞋。第二篇又介紹起跑架、釘鞋、PU跑道、泳衣和自行車等。這一篇如何接續前一篇的「科技」線索？（單選）
          options:
            1: 說明各項運動只要使用高科技器材，就能像基普喬吉一樣打破紀錄。
            2: 從基普喬吉使用的科技，進一步看見科技也會改變多項運動的競賽條件與表現。
            3: 比較各種運動科技的效果，找出最能幫助選手提升成績的設備。
          answer: 2
        - type: single
          label: ❶把前兩篇接起來 2
          prompt: 第二篇除了延伸「科技」這條線索，還補充了哪一項因素？（單選）
          options:
            1: 選手成長的自然環境
            2: 教練與隊友的團隊合作
            3: 依運動需求進行專項選才
          answer: 3
        - type: guide
          label: →你發現了嗎？
          text: |-
            前一篇從基普喬吉看見一位選手創造紀錄的多種因素；這一篇進一步說明，科技會影響多項運動的紀錄，也補充了專項選才這項因素，訓練仍不可少。
            一位選手創造紀錄的條件 → 多項運動紀錄進步的因素
        - type: guide
          label: ❷帶著問題讀下一篇
          text: |-
            前兩篇都讓我們看見，科技可能幫助選手提升成績。但科技帶來優勢後，又會出現新的問題。
            閱讀下一篇時，請帶著這個問題：
            →「科技能提升成績，怎麼使用才公平？」

  - part_note: 篇3（第25課）
    part_badge: 篇次3/3-(新聞短文)
    title_line: 第25課　靠跑鞋破紀錄，合理嗎？
    課文作者: 曾世杰
    學習單: 巫怡蓉/陳淑麗
    reading_prompt: ◎閱讀時想一想：科技能提升成績，怎麼使用才公平？
    body:
      paragraph_count: 5
      paragraphs_note: 段號欄印 一~五，沒有分節小標
      paragraphs:
        - idx: 1
          text: 當代馬拉松名將基普喬吉，2019年「跑出歷史」，成為史上首位在兩小時內跑完馬拉松的人。這次挑戰雖然不是正式比賽，成績也不列入世界紀錄，仍震撼全世界。然而，歡呼聲還沒散去，質疑聲就追了上來：他腳上穿的，是一雙尚未公開販售的高科技原型跑鞋。這場突破，靠的是人的極限，還是鞋子的力量？
        - idx: 2
          text: 這款跑鞋最大的賣點是「極輕」及「高回彈」。鞋子雖然增加了15％的特製泡棉，但總重量不變。跑鞋鞋面的特殊材料不容易吸收汗水和雨水，讓鞋子在跑步過程中較能保持乾爽。此外，前後腳掌的高低差也降低了0.3公分，這項微調讓腳掌在跑步時感覺更為穩定。
        - idx: 3
          text: 同一時期，多位跑者穿著同類型的高科技跑鞋，在正式比賽中屢屢打破馬拉松世界紀錄。高科技跑鞋是否讓比賽失去公平，成了爭議焦點。有人認為，鞋子再厲害，仍得靠選手長年苦練，科技只是從旁幫忙；質疑者卻擔心，當跑鞋能讓跑者更省力，甚至拉開成績差距，勝負比的就不只是選手的實力，還有腳上的裝備。
        - idx: 4
          text: 2020年1月，世界田徑總會對此爭議作出回應：沒有全面禁止高科技跑鞋，而是畫下界線。參賽鞋款必須先公開販售至少四個月，讓其他選手也有機會取得；鞋底厚度等規格，也必須符合規定。
        - idx: 5
          text: 規則畫下了界線，卻沒有讓爭議停下來。當一雙跑鞋也能拉開幾秒的差距，該怎麼做，才能讓科技幫助選手突破極限，又不讓裝備左右勝負？
      inline_marked_terms: [原型, 屢屢, 界線, 左右]
      inline_marked_terms_note: 課文加框的是「原型」「屢屢」「界線」「左右」四處，語詞框裡收的是「屢屢／界線／左右勝負」
    vocab_definitions:
      vocabulary_bank: [屢屢, 界線, 左右勝負]
      vocabulary_bank_label: 本課語詞
      instruction: 請在空格內填入本課語詞，若有困難，你可以試試回到課文讀讀看，這個解釋可能是哪個語詞的意思。
      instruction_note: 篇3 的指示語比前兩篇短（沒有 🅐🅑🅒 三個方法），原稿如此
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
      items:
        - {index: 1, word: 屢屢, definition: 一次又一次，表示同樣的事情多次發生。}
        - {index: 2, word: 左右勝負, definition: 影響甚至決定比賽的結果。「左右」在這裡不是方向，而是「影響」的意思。}
        - {index: 3, word: 界線, definition: 用來分清楚哪些可以、哪些不可以的範圍或標準。}
    keypoints:
      section_name_printed: 文章重點表
      section_name_note: 篇3 印「文章重點表」，前兩篇印「文章重點整理」
      instruction: 請根據課文內容，完成底下表格。
      title: 靠跑鞋破紀錄，合理嗎?
      title_note: 表頭的問號是半形「?」（內頁大標是全形「？」），原稿如此
      layout: list
      answer_carrier: 橘色手寫（在文字層），PDF p13 可見
      rows:
        - label: 主要爭議（第1段）
          value: 2019年，基普喬吉穿著尚未公開販售的高科技【　】，在兩小時內跑完馬拉松，但成績不列入【　】。
          blanks: [{answer: 原型跑鞋}, {answer: 世界紀錄}]
        - label: 跑鞋的特色（第2段）
          value: 這款跑鞋「極輕」又【　】，鞋面不容易吸收汗水和雨水，腳掌跑步時也更【　】。
          blanks: [{answer: 高回彈}, {answer: 穩定}]
        - label: 公平爭議（第3段）
          value: 有人認為，選手仍須長年【　】；質疑者擔心，跑鞋可能讓裝備影響【　】。
          blanks: [{answer: 苦練}, {answer: 勝負}]
        - label: 規則界線（第4段）
          value: 參賽鞋款必須先公開販售至少【　】，鞋底厚度等規格也要符合【　】。
          blanks: [{answer: 四個月}, {answer: 規定}]
        - label: 尚未解決的 問題（第5段）
          value: 如何讓科技幫助選手【　】，又不讓裝備【　】？
          blanks: [{answer: 突破極限}, {answer: 左右勝負}]
          label_note: 這一列的標籤原稿印成「尚未解決的 問題」，中間有一個空格
    comprehension:
      instruction: 請根據課文內容，選出正確答案
      instruction_note: 篇3 的指示語與前兩篇不同，且句末沒有句號，原稿如此
      answer_carrier: 橘色手寫代號（在文字層），PDF p14 可見
      items:
        - index: 1
          stem: 對高科技跑鞋的公平問題，支持者與質疑者主要看法有什麼不同？
          options:
            A: 支持者認為公開販售就算公平；質疑者在意鞋底規格是否一致。
            B: 支持者強調長期苦練仍是關鍵；質疑者擔心裝備優勢影響勝負。
            C: 支持者認為跑鞋是破紀錄關鍵；質疑者認為科技幫助有限。
            D: 支持者重視其他選手能否取得；質疑者重視跑鞋是否符合規定。
          answer: B
        - index: 2
          stem: 世界田徑總會沒有全面禁止高科技跑鞋，而是要求鞋款公開販售並限制鞋底規格。這樣的做法最能說明什麼？
          options:
            A: 允許科技繼續使用，但以取得機會與規格限制畫出公平界線
            B: 只要鞋款已經公開販售，科技帶來多少優勢都不會影響公平
            C: 先停止使用新的跑鞋科技，等確認完全不影響成績後再開放
            D: 要求所有參賽選手使用相同的鞋款，減少裝備造成的成績差異
          answer: A
        - index: 3
          stem: 作者在結尾提出：「該怎麼做，才能讓科技幫助選手突破極限，又不讓裝備左右勝負？」主要有什麼作用？
          options:
            A: 質疑世界田徑總會訂出的規則，暗示這些規定沒有實際作用
            B: 把問題推向如何兼顧科技進步與競賽公平，留下值得思考的界線
            C: 強調只要限制鞋底厚度，科技帶來的公平問題就能逐漸解決
            D: 表明作者較支持限制科技，避免高科技裝備影響選手的比賽結果
          answer: B
    reading_relay:
      section_name_printed: 閱讀接力
      subtitle: 從突破紀錄到公平界線
      items:
        - type: single
          label: ❶先整理這一篇
          prompt: 讀完〈靠跑鞋破紀錄，合理嗎？〉，哪一項最完整地整理了本文內容？（單選）
          options:
            1: 高科技跑鞋能協助選手提升成績；只要選手仍然努力訓練，使用這類跑鞋就不會影響公平。
            2: 高科技跑鞋能協助選手提升成績，也可能影響公平；世界田徑總會以公開販售和規格限制畫出界線，但爭議仍未停止。
            3: 高科技跑鞋引發爭議，主要是因為原型鞋尚未公開販售，和跑鞋是否影響成績沒有太大關係。
          answer: 2
        - type: single
          label: ❷第三篇把問題往前推了一步
          prompt: 前兩篇都讓我們看見：科技可能幫助選手提升成績。第三篇進一步追問什麼？（單選）
          options:
            1: 高科技跑鞋怎麼設計，跑起來才能更輕、更穩？
            2: 科技既然能影響成績，怎麼使用才符合競賽公平？
            3: 不同運動使用的科技中，哪一種最能幫助選手破紀錄？
          answer: 2

