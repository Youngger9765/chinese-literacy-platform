#    ⚠️ 大題序號後面都跟著一個星號（「二*語詞我最棒」），三篇皆然，原稿如此。
#
# 🔵 三種答案載體都查過：
#    ① ☑ 勾選 `w:sym Wingdings F0FE` → 12 個，全在文字層，與 PDF 逐一相符。
