# ── 篇2、篇3（schema 的 body/keypoints/comprehension 只吃一篇，其餘放這裡） ──
multi_text_parts:
  - part_note: 篇2（第24課）
    part_badge: 篇次2/3
    title_line: |-
      第24課　不只靠苦練：
      運動紀錄為何不斷進步？
    課文作者: 曾世杰
    學習單: 張明珠/陳淑麗
    reading_prompt: ◎閱讀時想一想：近百年來，各項運動紀錄為什麼不斷進步？
    body:
      paragraph_count: 9
      paragraphs_note: 段號欄印 一~九；兩個分節小標（科技進步／專項選才）不佔段號
      paragraphs:
        - idx: 1
          text: 1936年美國選手歐文斯（J. Owens）在奧運百公尺短跑創下10.2秒的世界紀錄，他如果來參加2013年的奧運百公尺決賽，當牙買加選手博爾特（U. Bolt）以9.77秒的速度壓線時，歐文斯距離終點還有4.3公尺遠，更不幸的是，他是九名決賽選手中的最後一名。不只是短跑，幾乎每一項競技運動的世界紀錄，包括跳高、跳遠、游泳、自行車和馬拉松，在一個世紀內都有讓人瞠目結舌的進步。
        - idx: 2
          text: 從生物演化的角度，人類絕對不可能在短短的一百年間，就突然演化得更會跑、更會跳。問題來了，是什麼原因，讓各項運動的世界紀錄有這麼大的進步呢？美國的運動研究專家艾普斯坦（D. Epstein）分析了許多資料後，提出了「科技進步」和「專項選才」兩個面向的解釋：
        - idx: 3
          text: 讓我們看看歐文斯和博爾特這兩位歷史上最有名的短跑運動員，面對的比賽條件有什麼差異。博爾特起跑時，腳下有起跑架，他雙腳向前大步邁開時，又輕又合腳的釘鞋踩在鋪著彩色PU塑膠粒的特製跑道上，起跑架、釘鞋和跑道的設計，能幫助他把腳部力量完整爆發出來，化成往前衝刺的力量。反觀1936年的歐文斯，跑道由煤渣和木頭焚燒後的灰渣鋪成，他一腳跨出，鬆軟的跑道就吞噬了他腿上的力氣。研究指出，和PU跑道相比，煤渣跑道會多耗費選手1.5%的力氣。此外，他沒有起跑架，自己帶著一把種花用的小鏟子，在起跑線挖腳踏洞助跑；而且，他穿的釘鞋是8年前才發明的，又重又容易變形。八十幾年之後，這些拖慢速度的因素全部都被科技產品一一改善了，怪不得現代奧運百公尺決賽的每位選手，成績都能領先當年的歐文斯。
        - idx: 4
          text: 除了短跑之外，低阻力鯊魚泳衣、低風阻的輕量自行車及NIKE的高科技長跑鞋，也大幅提升了游泳、自行車和馬拉松競賽的世界紀錄。不過，科技並不是讓人類運動成績進步的唯一因素，另一因素是「選才」。
        - idx: 5
          text: 二十世紀的前半葉，教練們相信中等身高、中等體重的身材，是最適合各種運動項目的體型。但後來運動科學家和教練發現，不同的運動類型，需要不同體型的運動員。
        - idx: 6
          text: 例如，1920年代，跳高優秀選手和鉛球優秀選手的平均身材幾乎沒有差別；但100年後的現在，世界頂尖的跳高選手都是高瘦型，平均身高有190公分，高於頂尖鉛球選手的平均身高約6公分，但平均體重卻只有73公斤，比鉛球選手少了將近50公斤。
        - idx: 7
          text: 再以體操和籃球選手為例，體操選手個子要夠小，翻滾時才能靈動。近三十年，頂尖女子體操選手的平均身高從160公分降到150公分。而美國職業籃球NBA於1946年創立時，職業球員平均身高是188公分，都是長人沒錯，但現在的平均則是200公分，都是巨人了。
        - idx: 8
          text: 教練的選才，不但讓選手們該高大的愈來愈高大，該小巧的愈來愈小巧，連比例古怪的，也愈來愈古怪。例如，游泳選手需要長而有力的雙臂，下半身短一點較好；跑步選手剛好顛倒，最好腿長一點，上半身短一點。全世界最厲害的游泳選手費爾普斯（M. Phelps）身高193公分，全世界最厲害的中長跑選手奎羅依（H. Guerrouj）身高175公分，兩人身高差了18公分，但是他們的腿長卻差不多，居然能穿同號的長褲。另外，NBA球員的比例也和常人迥異，他們的雙臂特別長，一般人的臂展（就是把雙臂平舉展開，從指尖到指尖的距離）差不多和身高相同，但是平均身高200公分的NBA球員，平均臂展卻是213公分。
        - idx: 9
          text: 不管哪一種運動項目，每位選手想取得奧運門票，一定得經過千錘百鍊的訓練和比賽。但這篇文章告訴我們，除了訓練之外，原來科技的運用和針對專項需求的選才，也是影響運動成績的重要因素哦。
      inline_headings:
        - {after_paragraph: 2, text: 科技進步}
        - {after_paragraph: 4, text: 專項選才}
      inline_marked_terms: [壓線, 瞠目結舌, 吞噬, 迥異, 千錘百鍊]
    vocab_definitions:
      vocabulary_bank: [瞠目結舌, 吞噬, 迥異, 千錘百鍊, 演化]
      vocabulary_bank_label: 本課語詞
      answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
      items:
        - {index: 1, word: 瞠目結舌, definition: 形容非常驚訝，睜大眼睛說不出話。}
        - {index: 2, word: 演化, definition: 生物經過許多世代，身體或特徵逐漸改變的過程。}
        - {index: 3, word: 迥異, definition: 兩者差異很大，明顯不同。}
        - {index: 4, word: 千錘百鍊, definition: 形容人的意志、技藝經過多次磨練之後變得非常出色。}
        - {index: 5, word: 吞噬, definition: 原指吞食。本文比喻鬆軟的跑道消耗了選手的腿部力量。}
    keypoints:
      section_name_printed: 文章重點整理
      instruction: 請根據課文內容，整理作者如何回答「近百年運動紀錄為什麼大幅進步」。
