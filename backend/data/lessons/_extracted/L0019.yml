# ── 七 閱讀理解 ──
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: C
      answer_printed_as: c      # 原稿印小寫，其餘四題大寫
      stem: 請問第二段提到：「每一項獨立出來都是很不錯的徒手訓練運動」，句中『徒手』下列哪一句使用不當?
      options:
        A: 爸爸徒手搬開倒下的樹木
        B: 哥哥徒手接住飛來的棒球
        C: 媽媽徒手煮出一鍋熱湯
        D: 員警徒手制服了歹徒
      option_notes: {C: （炒菜需要工具，無法空手進行。）}
    - index: 2
      answer: B
      stem: 請問蒼藍鴿認為埼玉老師的訓練菜單的看法，最接近哪一項？
      options:
        A: 完全有效，只要照做就能成為高手
        B: 部分動作有用，但整體安排不夠妥當有效
        C: 完全無效，所有徒手運動都沒有幫助
        D: 只對記者有效，其他人都不可能進步
    - index: 3
      answer: A
      stem: 運動科學對體育選手最主要的幫助是什麼？
      options:
        A: 幫助選手了解自身的問題，進而改善
        B: 實際測量選手的身形，紀錄體重變化
        C: 幫忙選手統計專項運動需要做的次數
        D: 目前只在羽球及馬拉松領域有所成效
      option_notes: {A: （第四段）}
    - index: 4
      answer: D
      stem: 有關運動科學的敘述，下列何者正確？
      options:
        A: 運動科學是只限定體育選手專用
        B: 運動科學只能在實驗室完成測量
        C: 每個人都可以成為專業的運動選手
        D: 運動科學能幫助人更有效、更健康地運動
      teacher_note: （Ａ：第五段:運動科學不專屬於體育選手、Ｂ第三段：研究人員跟隨選手實地的測量記錄。Ｃ、第五段：不一定可以成為運動選手）
    - index: 5
      answer: C
      stem: 透過運動科學，下列哪幾種方式能有效協助短跑選手跑得更快？
      statements:
        甲: 紀錄每一次衝刺的秒數，方便前後對照。
        乙: 了解自身的弱點，多做一些強化的訓練。
        丙: 不斷的安排跟別人比賽的機會，以強調競爭。
        丁: 觀看練習時的錄影，請教練調整其姿勢。
      options:
        A: 甲乙丙
        B: 乙丙丁
        C: 甲乙丁
        D: 甲丙丁

