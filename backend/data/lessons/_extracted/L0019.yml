# ── 六 閱讀聚光燈 ──
spotlight:
  strategy_name: 條件複句
  strategy_type: syntax
  section_title_printed: 閱讀聚光燈
  blocks:
    - type: concept_box
      text: |-
        「只要獲得獎牌，就有保送升學的機會。」在這個句子裡，前句是「條件」，後句是「結果」，像這樣用條件引出結果的句子，就是條件複句。
        常見的句型有：「只要……就……」、「只有……才……」、「如果……就……」、「無論／不管……都……」、「除非……否則……」、「沒有……就……」。
        讀到條件複句，可以這樣讀懂句子的關係：
        ①先圈出關聯詞。
        ②找出「要先發生或做到的事」（條件）。
        ③找出「接著會出現的結果」（結果）。
        ④用「條件 → 結果」說出句子的意思。

    - type: matching
      label: 1.連連看
      instruction: 1.連連看，先圈出關聯詞，再將相關的句子連起來。
      left_header: 條件
      right_header: 產生結果
      left:
        1: 只要遵照訓練菜單，
        2: 你沒有看重睡眠，
        3: 不管你再怎麼辯解，
        4: 哥哥只要通過體能測驗，
        5: 除非把功課寫完，
      right:
        A: 就可以加入籃球隊。
        B: 就有機會打敗敵人。
        C: 隔天就無精打采。
        D: 都改變不了既定的事實。
        E: 否則你不能出去玩。
      answer: {1: B, 2: C, 3: D, 4: A, 5: E}
      answer_carrier: 手繪連線（1 條黑線、4 條紅線）為圖形，文字流無此資訊
      circled_connectives:
        left: {1: 只要, 2: 沒有, 3: 不管, 4: 只要, 5: 除非}
        right: {A: 就, B: 就, C: 就, D: 都, E: 否則}
      circle_position_note: |-
        第 4 列的橘框在 PDF 上落在「體能測驗」而不是「只要」。該列是這張表唯一換行的一列，
        換行後整列被左右對齊拉開字距，而框是絕對定位、不隨文字重排 —— 據此判定它原本圈的是
        「只要」。這一格是推論，不是直接讀到的；其餘四列的框都直接落在關聯詞上。

    - type: fill_table
      label: 2.辨別句子的意思
      instruction: 2.辨別句子的意思，選出適當的分句，在□打勾。(單選)
      columns: [條件, 結果]
      answer_carrier: 紅色 ☑（圖形），文字流無此資訊
      rows:
        - label: 例
          條件: 只要獲得獎牌，
          結果_options: {1: 就有保送升學的機會。, 2: 就想回家。}
          結果_answer: 1
        - label: (1)
          條件: 只要妹妹想畫畫，
          結果_options: {1: 就會拿起彩色筆。, 2: 就會穿上游泳衣。}
          結果_answer: 1
        - label: (2)
          條件: 只要
          條件_options: {1: 放暑假，, 2: 開學，}
          條件_answer: 1
          結果: 就會有很多人出國去玩。
          note: 本列的選項印在「條件」欄（其餘三列印在「結果」欄）
        - label: (3)
