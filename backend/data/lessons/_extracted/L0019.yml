# ── 一 讀全文-做記號 ──
body:
  checklist_instruction: ※ 如果你有做到下列事項，請在□內打勾。
  checklist:
    - 請在不太了解的字、詞或句做記號。
    - 重要的地方、喜歡的語詞、句子或段落做上記號。
  paragraph_count: 6
  paragraphs:
    - idx: 1
      text: 漫畫《一拳超人》中的埼玉老師堅持了三年，每天做一百次的伏地挺身、一百次的仰臥起坐、一百次的深蹲、十公里的長跑，終於擁有一拳就能打倒所有敵人的實力。許多人看完漫畫後，紛紛效法實施「一拳超人訓練菜單」。臺灣有一位記者實施後分享成果，身材明顯的改善、體重也有變化；國外也有人拍攝大同小異的影片，表示自己訓練後看見成效。但是事情有這麼簡單嗎？
    - idx: 2
      text: 蒼藍鴿醫師（本名吳其穎）從運動科學的角度，在影片中提醒大家：埼玉老師的訓練菜單不宜直接照單全收。長跑屬於有氧運動，伏地挺身、深蹲則偏向肌力訓練；如果把大量長跑和肌力訓練都排在同一天，又沒有足夠休息，效果可能會相互抵消。也有研究指出，依照訓練目標，把有氧運動和肌力訓練分開安排，或保留足夠間隔，結果通常比較理想。不但如此，近年來，體育界也已不推薦仰臥起坐，因為仰臥起坐對腰部容易造成很大的壓力，容易傷到腰椎，留下後遺症。雖然一拳超人的訓練菜單中，伏地挺身、深蹲都是很不錯的徒手訓練，但這份菜單偏重胸部和腿部，背部與肩膀後側訓練不足，反而可能使身體呈現圓肩駝背的狀態。
    - idx: 3
      text: 蒼藍鴿根據科學證據來分析運動訓練，這種方法就是所謂的「運動科學」。運動科學是對體育活動進行科學分析的一個綜合性學科，科學家們了解了人體的特質及各項運動的原理，累積各種知識之後，才能知道如何有效的進行體育訓練。
    - idx: 4
      text: 運動科學結合現代科技後，在競技運動上有了突破性的發展，教練開始透過精準的測量，幫助運動者在安全的狀況下達到更快、更高、更遠的目標。競技場上，失之毫釐，差之千里，即使是一點點差距，都可能會影響選手的勝敗，有了運動科技加持，教練團可用各種設備測量記錄選手的表現，讓選手看到自己、甚至是對手數據或動作的變化，讓選手明白問題，進而透過加強訓練，改善問題，才能爭取更佳成績。
      marker: ☞ 印在本段句首（念順順起點）
    - idx: 5
      text: 以味全龍職棒隊投手林逸達為例，他高中時球速就可以到達147公里，但進職棒後一度失速，最多只能投出129到132公里，他非常沮喪，向運動科學專長的張立帆教練求助。張立帆在分析過高速錄影之後，指出林逸達揮臂沒辦法完全發力，他從運動科學的角度重新設計了林逸達的投球動作，建議他改變揮臂長度，讓手早點到正確的位置，並且要他的跨步再加長一點，修正下盤的發力機制。結果，成效斐然，林逸達的球速在很短的時間內恢復過來，他受訪時表示：「本來手會不舒服，改變機制後，現在速度比較穩定……這樣投會比較輕鬆，對手臂的負擔不會太大。」這就是運動科學的應用實例。
    - idx: 6
      text: 最後，運動科學並不專屬於體育選手，很多人都對運動有興趣，但不一定可以成為選手，而運動科學的目標則是讓每個人都有機會參與，讓自己知道如何運動能更有效、更健康，更能享受運動的快樂！
  # 課文右緣印的累計字數（從 ☞ 所在的第四段起算）
  # 對帳：182 = 第 4 段字數（完全相符）。末筆 443 落在第 5 段倒數第二行末（「…這就是」），
  #      該段最後 10 字「運動科學的應用實例。」換行後與段號「六」同列、未再印數字，
  #      故 443 少算了段尾；第 4+5 段實際 452 字。
  running_char_counts: [28, 57, 87, 117, 146, 176, 182, 209, 236, 265, 295, 325, 354, 384, 414, 443]
  inline_marked_terms: [大同小異, 抵消, 徒手訓練, 累積, 精準, "失之毫釐，差之千里", 加持, 數據, 沮喪, 成效斐然, 負擔]
  underlined_terms: [臺灣, 蒼藍鴿, 吳其穎, 埼玉老師, 味全龍職棒隊, 林逸達, 張立帆]
  paragraph_boundary_note: |-
    PDF p2 把段號「六」印在「運動科學的應用實例。」那一行，但那是第 5 段的最後一句
