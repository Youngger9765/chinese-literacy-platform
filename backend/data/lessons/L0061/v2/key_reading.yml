passage: 這句話大概是國中校園裡，出現頻率最高的抱怨之一。你發現，班上那位安靜少話的同學，期中考時學校為他另闢考場，而且每一科都延長作答時間，你覺得這明明就是特權；體育課測驗一千公尺，老師要求田徑隊的同學三分半鐘內跑完，卻對另一位女同學說：「只要堅持走完就給你及格」，你覺得這是雙重標準；座位隔兩排的同學早上趴著睡了兩節，老師還示意叫大家不要吵她，而你只是和同學講了幾次話，就被叫起來罰站。你心裡那把「公平」的尺，氣到差點當場斷裂。
