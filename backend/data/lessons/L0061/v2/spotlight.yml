spotlight:
  lesson: G6-L20
  strategy_name: 寫作手法-用例子說明觀點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: 步驟❶──找觀點
  - type: single
    prompt: 本文的觀點是明說的。作者對「公平」的看法是什麼？
    options:
    - 公平就是每個人接受完全相同的標準與安排。
    - 公平不能只看表面是否相同，也要考慮差異與需要。
    answer: 公平不能只看表面是否相同，也要考慮差異與需要。
  - type: guide
    text: 步驟❷──找例子：整理校園的例子
  - type: single
    prompt: 1.作者一開始寫了三種不同安排。只看表面，這三位同學都像是：
    options:
    - 得到比其他同學較寬鬆的安排。
    - 接受和其他同學完全不同的學習內容。
    answer: 得到比其他同學較寬鬆的安排。
  - type: free_text
    prompt: 2.完成表格，看看這些例子有什麼共同點：
  - type: table
    rows:
    - - 課文中的 安排
      - 但原來…
      - 這項調整如何回應需要？
    - - 1.延長作答時間
      - '□①考試時容易緊張，需要更多時間慢慢作答。

        ②有學習障礙，閱讀、寫字困難。'
      - '①減少閱讀、寫字較慢造成的不利

        □②讓他有更多時間思考答案。'
    - - 2.走完一千公尺就及格
      - '①上次氣喘發作，差點喘不過氣來。

        □②平時較少運動，跑步速度較慢。'
      - '□①讓她可以少做體育訓練。

        ②避免劇烈運動危及健康。'
    - - 3.上課趴著睡，老師沒有叫醒
      - '□①前晚熬夜準備考試，早上精神不濟。

        ②家中發生衝突，整夜沒有休息'
      - '①讓她暫時休息，照顧當下的困境。

        □②允許她上課時自由休息。'
  - type: guide
    text: 步驟❸──判斷共同點
  - type: free_text
    prompt: 1.整合出三個校園例子的共同點
  - type: guide
    text: （選一格詞填入：不公平、不同的安排、困難與需要、不同的調整）
  - type: guide
    text: 只看表面，三位同學得到【 不同的安排    】
  - type: guide
    text: →看起來好像【  不公平   】
  - type: guide
    text: →知道背後情況後，才發現他們有不同的【  困難與需要      】
  - type: guide
    text: →學校或老師因此依照需要，作出【 不同的調整      】
  - type: guide
    text: 步驟❹──回扣觀點
  - type: single
    prompt: 這些例子如何支持作者對「公平」的看法？
    options:
    - 公平就是不論每個人的情況，都接受完全相同的安排。
    - 公平不能只看表面是否一樣，也要依不同需要作出調整。
    answer: 公平不能只看表面是否一樣，也要依不同需要作出調整。
  - type: guide
    text: 二、再練一次：整理孔子的例子
  - type: guide
    text: 步驟❷──找例子
  - type: free_text
    prompt: 1.子路和冉有問同一個問題，卻得到不同回答。
  - type: guide
    text: 只看表面，孔子的做法好像：
  - type: single
    prompt: 請選擇
    options:
    - 對同一個問題，給出不同的答案，看起來像是雙重標準。
    - 先了解兩人的情況，再給適合的提醒。
    answer: 對同一個問題，給出不同的答案，看起來像是雙重標準。
  - type: free_text
    prompt: 2.請完成表格，找出孔子回答不同的原因，以及若給兩人相同回答，可能造成的結果。
  - type: table
    rows:
    - - 孔子給的回答
      - 但原來……
      - '如果提醒沒有對準他的需要，

        可能會……'
    - - '1.告誡子路先問父兄長輩

        ，不要立刻行動'
      - '子路個性

        【】'
      - '①若沒有提醒他謹慎，可能因衝動而闖禍。

        □②若沒有鼓勵他行動，可能因猶豫而錯失機會。'
    - - 2.鼓勵冉有不要遲疑，立刻去做
      - '冉有個性

        【】'
      - '□①若沒有提醒他謹慎，可能因衝動而闖禍。

        ②若沒有鼓勵他行動，可能因猶豫而錯失機會。'
    answers:
    - 衝動急躁
    - 猶豫不決
  - type: guide
    text: 步驟❸──判斷共同點
  - type: single
    prompt: 把子路和冉有的情況合起來看，它們共同說明什麼？（單選）
    options:
    - 兩人問相同問題，孔子卻給不同答案，表示孔子標準前後不一。
    - 兩人個性不同，孔子便讓他們各自決定，不必接受共同規範。
    - 兩人問相同問題，但特質與需要不同，因此孔子給予不同提醒。
    answer: 兩人問相同問題，但特質與需要不同，因此孔子給予不同提醒。
  - type: guide
    text: →這就是「因材施教」：依學生不同的特質與需要，採取適合的教導方式。
  - type: guide
    text: 三、步驟❹──扣回觀點：判斷例子的作用
  - type: free_text
    prompt: 1.請判斷前面的兩組例子，分別支持主要觀點的哪一個面向。
  - type: table
    rows:
    - - 故事/例子
      - 它怎麼支持主要觀點？
    - - ⑴校園的三個例子
      - '①說明不同安排可能是在回應學生個別的困難與需要。

        □②說明學生只要遇到困難，就可以免除原有規定。'
    - - ⑵孔子教導子路和冉有
      - '□①說明同一個問題沒有固定答案，老師可依情況改變說法。

        ②說明因材施教要依學生的特質與需要，給予適合的教導。'
  - type: single
    prompt: 2.把兩組例子合起來看，它們共同支持作者哪一個觀點？（單選）
    options:
    - 為了避免爭議，公平就是對每個人採取完全相同的做法。
    - 真正的公平不是齊頭式平等，而是看見差異，依需要給予適合的安排或教導。
    answer: 真正的公平不是齊頭式平等，而是看見差異，依需要給予適合的安排或教導。
  - type: fill_table
  - type: self_check
    items:
    - 我能判斷例子是如何支持作者的觀點。
    - 我能把多個例子合起來看，說出它們共同支持的觀點。
    - 下次讀到「用例子說明觀點」的文章時，我會問自己：這些例子有什麼共同點？怎麼支持作者的觀點？
