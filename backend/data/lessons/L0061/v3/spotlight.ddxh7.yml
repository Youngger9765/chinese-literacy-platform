lesson_uid: L0061
version_id: v3
section_no: 五
spotlight:
  strategy_name: 寫作手法——用例子說明觀點
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  structure_note: '⛔ 三張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。

    層級關係改用 guide 標題（一、二、三 與 步驟❶❷❸❹）表達。'
  blocks:
  - type: concept_box
    text: '有些文章會直接說出作者的觀點，並舉出例子，讓觀點更清楚、更有說服力。讀這種文章時，不能只看懂每個例子，還要看：

      這些例子有什麼共同點？

      它們共同說明了什麼？

      它們如何支持作者提出的觀點？

      這一課，我們要練習：

      【❶找觀點】→【❷找例子】→【❸判斷共同點】→【❹回扣觀點】'
  - type: guide
    text: 一、小試身手
  - type: guide
    text: 步驟❶──找觀點
  - type: single
    prompt: 本文的觀點是明說的。作者對「公平」的看法是什麼？
    options:
      1: 公平就是每個人接受完全相同的標準與安排。
      2: 公平不能只看表面是否相同，也要考慮差異與需要。
    answer: 2
  - type: guide
    text: 步驟❷──找例子：整理校園的例子
  - type: single
    prompt: 1.作者一開始寫了三種不同安排。只看表面，這三位同學都像是：
    options:
      1: 得到比其他同學較寬鬆的安排。
      2: 接受和其他同學完全不同的學習內容。
    answer: 1
  - type: fill_table
    prompt: 2.完成表格，看看這些例子有什麼共同點：
    columns:
    - 課文中的安排
    - 但原來…
    - 這項調整如何回應需要？
    answer_carrier: 紅色 ☑（w:sym）；本表在 DOCX→PDF 後被上方文字疊印壓掉，PDF 上完全看不到
    rows:
    - 課文中的安排: 1.延長作答時間
      但原來…: '①考試時容易緊張，需要更多時間慢慢作答。

        ②有學習障礙，閱讀、寫字困難。'
      但原來…_options:
        1: 考試時容易緊張，需要更多時間慢慢作答。
        2: 有學習障礙，閱讀、寫字困難。
      但原來…_answer: 2
      這項調整如何回應需要？: '①減少閱讀、寫字較慢造成的不利

        ②讓他有更多時間思考答案。'
      這項調整如何回應需要？_options:
        1: 減少閱讀、寫字較慢造成的不利
        2: 讓他有更多時間思考答案。
      這項調整如何回應需要？_answer: 1
    - 課文中的安排: 2.走完一千公尺就及格
      但原來…: '①上次氣喘發作，差點喘不過氣來。

        ②平時較少運動，跑步速度較慢。'
      但原來…_options:
        1: 上次氣喘發作，差點喘不過氣來。
        2: 平時較少運動，跑步速度較慢。
      但原來…_answer: 1
      這項調整如何回應需要？: '①讓她可以少做體育訓練。

        ②避免劇烈運動危及健康。'
      這項調整如何回應需要？_options:
        1: 讓她可以少做體育訓練。
        2: 避免劇烈運動危及健康。
      這項調整如何回應需要？_answer: 2
    - 課文中的安排: 3.上課趴著睡，老師沒有叫醒
      但原來…: '①前晚熬夜準備考試，早上精神不濟。

        ②家中發生衝突，整夜沒有休息'
      但原來…_options:
        1: 前晚熬夜準備考試，早上精神不濟。
        2: 家中發生衝突，整夜沒有休息
      但原來…_answer: 2
      這項調整如何回應需要？: '①讓她暫時休息，照顧當下的困境。

        ②允許她上課時自由休息。'
      這項調整如何回應需要？_options:
        1: 讓她暫時休息，照顧當下的困境。
        2: 允許她上課時自由休息。
      這項調整如何回應需要？_answer: 1
  - type: guide
    text: 步驟❸──判斷共同點
  - type: free_text
    prompt: '1.整合出三個校園例子的共同點

      （選一格詞填入：不公平、不同的安排、困難與需要、不同的調整）

      只看表面，三位同學得到【　】

      →看起來好像【　】

      →知道背後情況後，才發現他們有不同的【　】

      →學校或老師因此依照需要，作出【　】'
    blanks:
    - answer: 不同的安排
    - answer: 不公平
    - answer: 困難與需要
    - answer: 不同的調整
  - type: guide
    text: 步驟❹──回扣觀點
  - type: single
    prompt: 這些例子如何支持作者對「公平」的看法？
    options:
      1: 公平就是不論每個人的情況，都接受完全相同的安排。
      2: 公平不能只看表面是否一樣，也要依不同需要作出調整。
    answer: 2
  - type: guide
    text: 二、再練一次：整理孔子的例子
  - type: guide
    text: 步驟❷──找例子
  - type: single
    prompt: '1.子路和冉有問同一個問題，卻得到不同回答。

      只看表面，孔子的做法好像：'
    options:
      1: 對同一個問題，給出不同的答案，看起來像是雙重標準。
      2: 先了解兩人的情況，再給適合的提醒。
    answer: 1
  - type: fill_table
    prompt: 2.請完成表格，找出孔子回答不同的原因，以及若給兩人相同回答，可能造成的結果。
    columns:
    - 孔子給的回答
    - 但原來……
    - 如果提醒沒有對準他的需要，可能會……
    answer_carrier: 紅色 ☑（w:sym）與橘色手寫字，PDF p6 可見
    rows:
    - 孔子給的回答: 1.告誡子路先問父兄長輩，不要立刻行動
      但原來……: '子路個性

        【　】'
      blanks:
      - answer: 衝動急躁
      如果提醒沒有對準他的需要，可能會……: '①若沒有提醒他謹慎，可能因衝動而闖禍。

        ②若沒有鼓勵他行動，可能因猶豫而錯失機會。'
      如果提醒沒有對準他的需要，可能會……_options:
        1: 若沒有提醒他謹慎，可能因衝動而闖禍。
        2: 若沒有鼓勵他行動，可能因猶豫而錯失機會。
      如果提醒沒有對準他的需要，可能會……_answer: 1
    - 孔子給的回答: 2.鼓勵冉有不要遲疑，立刻去做
      但原來……: '冉有個性

        【　】'
      blanks:
      - answer: 猶豫不決
      如果提醒沒有對準他的需要，可能會……: '①若沒有提醒他謹慎，可能因衝動而闖禍。

        ②若沒有鼓勵他行動，可能因猶豫而錯失機會。'
      如果提醒沒有對準他的需要，可能會……_options:
        1: 若沒有提醒他謹慎，可能因衝動而闖禍。
        2: 若沒有鼓勵他行動，可能因猶豫而錯失機會。
      如果提醒沒有對準他的需要，可能會……_answer: 2
  - type: guide
    text: 步驟❸──判斷共同點
  - type: single
    prompt: 把子路和冉有的情況合起來看，它們共同說明什麼？（單選）
    options:
      1: 兩人問相同問題，孔子卻給不同答案，表示孔子標準前後不一。
      2: 兩人個性不同，孔子便讓他們各自決定，不必接受共同規範。
      3: 兩人問相同問題，但特質與需要不同，因此孔子給予不同提醒。
    answer: 3
  - type: guide
    text: →這就是「因材施教」：依學生不同的特質與需要，採取適合的教導方式。
  - type: guide
    text: 三、步驟❹──扣回觀點：判斷例子的作用
  - type: fill_table
    prompt: 1.請判斷前面的兩組例子，分別支持主要觀點的哪一個面向。
    columns:
    - 故事/例子
    - 它怎麼支持主要觀點？
    answer_carrier: 紅色 ☑（w:sym），PDF p7 可見
    rows:
    - 故事/例子: ⑴校園的三個例子
      它怎麼支持主要觀點？: '①說明不同安排可能是在回應學生個別的困難與需要。

        ②說明學生只要遇到困難，就可以免除原有規定。'
      它怎麼支持主要觀點？_options:
        1: 說明不同安排可能是在回應學生個別的困難與需要。
        2: 說明學生只要遇到困難，就可以免除原有規定。
      它怎麼支持主要觀點？_answer: 1
    - 故事/例子: ⑵孔子教導子路和冉有
      它怎麼支持主要觀點？: '①說明同一個問題沒有固定答案，老師可依情況改變說法。

        ②說明因材施教要依學生的特質與需要，給予適合的教導。'
      它怎麼支持主要觀點？_options:
        1: 說明同一個問題沒有固定答案，老師可依情況改變說法。
        2: 說明因材施教要依學生的特質與需要，給予適合的教導。
      它怎麼支持主要觀點？_answer: 2
  - type: single
    prompt: 2.把兩組例子合起來看，它們共同支持作者哪一個觀點？（單選）
    options:
      1: 為了避免爭議，公平就是對每個人採取完全相同的做法。
      2: 真正的公平不是齊頭式平等，而是看見差異，依需要給予適合的安排或教導。
    answer: 2
  - type: self_check
    label: ◎自我檢核
    instruction: 如果你有做到，請在□中打勾。
    items:
    - 1.我能判斷例子是如何支持作者的觀點。
    - 2.我能把多個例子合起來看，說出它們共同支持的觀點。
    - 3.下次讀到「用例子說明觀點」的文章時，我會問自己：這些例子有什麼共同點？怎麼支持作者的觀點？
  slug: ddxh7
