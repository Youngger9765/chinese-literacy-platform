lesson_uid: L0061
version_id: v3
section_no: 六
keypoints:
  title: 因人而異，才有真正的公平
  layout: list
  answer_carrier: 橘色手寫字（PDF p7~p8）；文字層的【　】內已填有同樣的答案
  rows:
  - label: 校園中的公平爭議（第1～3段）
    value: '1.三位同學分別獲得延長作答、調整體育標準與暫時休息等【　】，表面看來好像不公平；知道背後的困難後，才發現這些安排是在回應不同【　】。

      2.公平是否就是每個人都接受【　】的標準與安排？'
    blanks:
    - answer: 差別待遇
    - answer: 需要
    - answer: 一模一樣
  - label: 孔子的不同教導（第4～8段）
    value: '1.子路和冉有問孔子【　】，孔子卻給出不同回答。

      2.子路衝動急躁，孔子提醒他先問長輩，學會【　】。

      3.冉有猶豫不決，孔子鼓勵他立刻行動，學會【　】。'
    blanks:
    - answer: 同一個問題
    - answer: 謹慎
    - answer: 果斷
  - label: 因材施教與公平（第9～10段）
    value: '1.孔子依兩人的特質與需要給予不同提醒，這就是【　】。

      2.若給兩人同一種做法，子路可能因衝動闖禍，冉有可能因觀望而【　】。

      3.真正的公平不是給每個人一模一樣的鞋，而是依尺寸與需要，給一雙【　】的鞋。'
    blanks:
    - answer: 因材施教
    - answer: 錯失機會
    - answer: 合腳
  - label: 作者提醒（第11段）
    value: 每個人的天賦、能力、特質與成長背景不同。判斷公平時，不能只看大家是否接受【　】的安排，還要看不同安排是否回應個別需要。
    blanks:
    - answer: 相同
