section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框中找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 一視同仁
  - 韁繩
  - 經典
  - 怯生生
  - 劍及履及
  - 目睹
  - 因材施教
  - 不偏不倚
  - 木訥
  - 對症下藥
  items:
  - index: 1
    word: 經典
    definition: 經過時間考驗，仍具有重要價值或代表性的作品或事物。
  - index: 2
    word: 一視同仁
    definition: 對每個人都用相同的態度或方式，不偏向任何人。
  - index: 3
    word: 劍及履及
    definition: 形容行動迅速，立刻去做。
  - index: 4
    word: 怯生生
    definition: 因害怕或不自在，說話、動作顯得小心膽怯。
  - index: 5
    word: 目睹
    definition: 親眼看見事情發生。
  - index: 6
    word: 因材施教
    definition: 依照學生不同的能力、特質與需要，採取適合的教導方式。
  - index: 7
    word: 韁繩
    definition: 繫在馬頭上，用來控制方向和速度的繩子。
  - index: 8
    word: 不偏不倚
    definition: 不偏向任何一方，態度公正。
  - index: 9
    word: 對症下藥
    definition: 針對問題，採取適合的解決方法。
  - index: 10
    word: 木訥
    definition: 不善於表達，說話不多，個性較沉默。
