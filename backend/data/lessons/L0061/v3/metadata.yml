_總表_對照note: '🔴 總表這一列的語詞 10 個與學習單的 10 個**完全不重疊**，不是漏一兩個而是整組不同：

  ・總表：直率、謙和、普及、遲疑、果斷、學問淵博、富可敵國、名符其實、應對如流、朽木不可雕也

  ・學習單：一視同仁、韁繩、經典、怯生生、劍及履及、目睹、因材施教、不偏不倚、木訥、對症下藥

  學習單自己的四處（語詞框／第三大題 10 題／第四大題代號表 10 個／第八大題找字灰框 10 個）

  內容一致，所以是**總表這一列沒跟上改稿**，不是抽取錯。

  佐證：總表那組語詞（學問淵博／富可敵國／應對如流／朽木不可雕也）講的是孔子門生的人物特寫，

  與本課「用例子說明觀點」的議論文主題對不上。

  ⛔ 未自行以學習單覆蓋總表 —— 那要改的是 xlsx，不是這份抽取。'
