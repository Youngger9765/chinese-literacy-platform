  passage: 這句話大概是國中校園裡，出現頻率最高的抱怨之一。你發現，班上那位安靜少話的同學，期中考時學校為他另闢考場，而且每一科都延長作答時間，你覺得這明明就是特權；體育課測驗一千公尺，老師要求田徑隊的同學三分半鐘內跑完，卻對另一位女同學說：「只要堅持走完就給你及格」，你覺得這是雙重標準；座位隔兩排的同學早上趴著睡了兩節，老師還示意叫大家不要吵她，而你只是和同學講了幾次話，就被叫起來罰站。你心裡那把「公平」的尺，氣到差點當場斷裂。但你不知道的是，那位延長作答的同學有學習障礙，雖然智力正常，但閱讀、寫字從小就有嚴重的困難；那位走完千公尺就及格的女同學，上次氣喘發作，差點喘不過氣來；而那位趴著睡的同學，爸媽鬧離婚，昨夜吵得厲害，警察都來了，她哭了一晚，整夜沒閤眼。我們常把「齊頭式平等」當成公平的鐵律，認為每個人拿到的考卷、適用的標準、得到的獎懲，都必須一模一樣。但是，人又不是工廠生產線上的產品，每個人的身心、背景各不相同，那些看似標準不一的差別待遇，真的是不公平，還是另有深意？
  start_text: 這句話大概是國中校園裡，出現頻率最高的抱怨之一。
