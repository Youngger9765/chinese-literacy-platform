lesson_uid: L0136
version_id: v3
section_no: 六
spotlight:
  strategy_name: 圖文整合閱讀策略
  title_line: 第15課  會考圖文題實戰
  blocks:
  - type: concept_box
    label: 說明：
    text: 前面三課，我們已經學過「圖文整合閱讀策略」。這一課不學新的方法，而是用112年國中教育會考的圖文題，試試看你能不能把學過的方法用在真正的考題上。
  - type: concept_box
    label: 提醒：
    text: 圖文題的答案可能藏在文字、圖片或文字框中。作答時，不能只看其中一種訊息，要來回對照，把相關的訊息連起來，再整合判斷。先看文字或先看圖都可以，重點是把需要的訊息找齊、連起來。
  - type: guide
    text: '做題前，快速複習：

      ❶ 看題目──這一題要我找什麼？

      ❷ 找訊息──文字、圖片或文字框提供了哪些線索？

      ❸ 文圖對照──這些線索彼此怎麼對應或補充？

      ❹ 整合判斷──把訊息合起來，選出最合理的答案。

      如果你已經熟悉這些方法，就直接開始挑戰會考題吧！'
  - type: guide
    text: 以下是112年國中教育會考國文科第27～29題，請運用學過的策略試著作答。
  - type: figure
    referent: 圖文-跳水
    asset: word/media/image4.png
    text_carrier: image
    caption: 以下圖文改寫自亞當‧斯金納《運動大百科》，請閱讀並回答27～29題：
    note: '112 年國中教育會考國文科第 27~29 題的圖文閱讀材料，整張是掃描圖（542KB PNG）。

      版面：上方一段說明文字，中間是跳水動作插圖並配四個灰底說明框

      （起跳／騰空／評分／入水），左下角一個外框列出「跳水比賽規則」五條。

      下面的轉錄是逐字讀圖抄下來的，**無法用逐字門驗證**（文字層沒有這些字）。'
    passage_paragraphs:
    - 挑戰勇氣的跳水，是世上最吸睛的運動比賽之一。跳水選手必須體態優美且靈活。他們會從數公尺高的跳臺躍入水中，同時做出大膽的動作。首先，選手必須站上跳臺，以直立或倒立的姿勢起跳。而有些比賽採用跳板起跳，可以輔助跳水者跳得更高、騰空的時間更久。跳水選手會在身體開始下降時，表演一系列抱膝、旋轉、騰翻、轉體與其他大膽精巧的動作，最後盡可能順暢入水。歷史上有紀錄的第一場跳水比賽是在1871年舉行，當時的選手要從倫敦橋跳下泰晤士河。現今的跳水有個人比賽，也有雙人比賽。
    callout_boxes:
    - name: 起跳
      text: 選手由跳臺躍入水中，起跳動作可以是向前、向後或者倒立。
    - name: 騰空
      text: 起跳後到入水前，選手處於騰空的狀態，此時會開始表演旋轉與轉體一系列的動作。
    - name: 評分
      text: 評審團針對選手每一次的跳水評分。評審的數量會因比賽的規模而有所差異，以奧運比賽為例，個人賽配置7名評審，雙人跳水則配置11名評審。
    - name: 入水
      text: 當選手入水的時候，濺起水花能緩和衝擊，但評審想看到的是簡潔流暢的入水，激起太大的水花會遭到扣分。
    rules_box:
      heading: 跳水比賽規則：
      items:
      - 每位評審各自針對選手的每一次跳水評分，分數的範圍為0分（失敗）到10分（極好）。
      - 滿分為10分，針對起跳、騰空、入水動作，各部分最高可以給3分，剩下的1分則評定整體動作執行的完善程度。
      - 比賽前，選手必須先繳交跳水動作表，設定每一跳的動作難度。比賽時只能依照動作表完成跳水，否則以0分計算。
      - 奧運個人賽計分時，2個最高分與2個最低分不予採計，僅採計中間3名評審的分數後，再乘以動作的難度係數，最後算出該次跳水的得分。
      - 每一跳的得分皆須採計。
