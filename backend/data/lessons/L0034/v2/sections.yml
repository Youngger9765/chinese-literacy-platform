  - index: 5
    answer: B
    stem: 小涵很想在星期日和朋友出去玩，但星期一有篇報告要交。如果她想遵循泰戈爾說的：「頂不住眼前的誘惑，就會失去未來的幸福」，請問小涵接下來會怎麼做？
