passage: 漸漸的，小睿每天沉迷於手機的時間變少，他有多出來的時間打球、看課外書或和同學聊天，生活變得更充實了。不但如此，他的小考成績也漸有起色，連數學都能考到70分以上了。詩人泰戈爾曾經說過：「頂不住眼前的誘惑，就會失去未來的幸福。」透過多方面的努力和支持，小睿頂住了指尖上的誘惑，成為手機的主人。
