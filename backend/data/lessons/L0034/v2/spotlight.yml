  - type: passage
    source: unknown
    paragraphs:
    - 阿傑是一個設計師，最近收到大型品牌邀請，希望他設計出一款功能獨特的球鞋。為了趕上進度，他連續幾週（ B ），不斷修改樣式與功能，也改善了之前發現有問題的地方，避免（
      G ）。
    - 新球鞋得到消費者的肯定，而且引發許多網路上的討論。球鞋的銷售不但漸漸有了（ D ），在半年後，還（ A ）了全台灣。
