    text: 六品格聚光燈建立好習慣六品格聚光燈建立好習慣
  - type: guide
    text: ◎小試身手：
  - type: free_text
    prompt: 1.情境：我在房間裡寫作業時會分心。
  - type: guide
    text: 解決：以下是解決寫作業分心的「策略」與「具體做法」，請連線配對。
  - type: guide
    text: 2.進階挑戰：小芸常常上學遲到，想培養「準時起床」的好習慣。請在每一欄勾選最符合該策略的做法。（勾選題，單選）
  - type: table
    rows:
    - - 策略
      - 改變環境
      - 設定規範
      - 自我提醒
    - - 目的
      - 減少外在的誘惑
      - 事前訂出規則讓自己遵守
      - 用聲音、動作、口令，拉回專注力
    - - 具體作法
      - □①早上起床喝一杯水，提神醒腦□②把鬧鐘放到房間另一側，無法用手摸到鬧鐘
      - □①事前調整房間的溫度□②規定自己晚上十點半前一定上床睡覺
      - □①聽到鬧鐘響，在心中倒數五秒默念：「快起床，早餐等你！」□②睡前請家人明早叫我起床
    - - 挑戰題：你有沒有更好的方法？請填入表格內。
      - 把窗簾半開，讓晨光喚醒自己
      - 規定自己鬧鐘一響，就一定要離開床。
      - 聽到鬧鐘時，立刻坐起來，並說：「該起床了」。
  - type: free_text
    prompt: ３.自我省思：你是否有想改掉的壞習慣？試著運用本文介紹的三大策略──「改變環境」「設定規範」「自我提醒」。請先寫下你想改變的壞習慣，再從三種策略中勾選一項或多項，並思考具體做法，填入下列表格。
  - type: free_text
    prompt: 4.分享與回饋：和同學交換學習單，分享你的心得，也請同學寫下回饋。
