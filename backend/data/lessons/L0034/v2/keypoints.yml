  - label: 背景
    value: '1.短影音自 2018 年開始__全球。

      2.臺灣青少年平均每天觀看1.5小時，遠超過閱讀紙本書的時間。

      3.短影音會按照使用者喜好推薦影片，讓人停不下來。'
    blanks:
    - answer: 風靡
      hint: ''
  - label: 問題
    value: 小睿每天__，無法自拔，陷入惡性循環。
    blanks:
    - answer: 沉迷手機
      hint: ''
  - label: 解決
    value: '1.找老師求助。

      2.老師、家長和同學一起協助小睿採取具體作法：

      (1)改變環境：

      ❶參加班級__，每天晚上專心閱讀及做功課。

      ❷與同學約__，減少宅在家滑手機的機會。

      (2)設定手機使用規範：

      ❶手機安裝__App，每天限用 30 分鐘。

      ❷與同儕組成「脫癮小組」，互相__手機使用時長。

      (3)自我提醒：

      手腕掛橡皮筋，想滑手機時立即彈一下並大聲說「停！」'
    blanks:
    - answer: 晚自習
      hint: ''
    - answer: 戶外活動
      hint: ''
    - answer: 時間管理
      hint: ''
    - answer: 監督
      hint: ''
  - label: 結果
    value: '小睿使用手機的時間  □①上升  ②下降，

      他的生活品質與成績  ①上升  □②下降，

      最後頂住指尖的誘惑，成為「手機的主人」。'
    blanks: []
  title: 抗拒指尖上的誘惑
