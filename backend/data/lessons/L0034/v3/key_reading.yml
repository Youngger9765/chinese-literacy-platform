  passage: 在洪老師的指導下，小睿及同學們採取了多方面的行動：首先，班級的晚自習開始了，小睿報了名，確保週一到週五每天晚上有兩小時專心閱讀及做功課的時間；其次，爸媽在小睿的手機上安裝了時間管理的App，從此，上網的時間每天只剩30分鐘，其它時間手機自動上鎖。此外，小睿和三位有同樣困擾的同學組成「脫癮小組」，大家每天見面就拿出手機，看看彼此前一天的使用情況，誰違規超時就要請喝飲料；週末時，四個人也開始安排一起念書、打球或爬山等戶外活動，以減少獨自滑手機的機會。至於獨處的時候，小睿學會一招，每當腦中玩手機的念頭蠢蠢欲動時，他會把掛在腕上的橡皮筋拉得高高的，皺眉閉眼咬牙，對自己大喊一聲「停！」同時放手彈自己一下。說也奇怪，這招還真能有效阻斷那些壞念頭呢。漸漸的，小睿每天沉迷於手機的時間變少，他有多出來的時間打球、看課外書或和同學聊天，生活變得更充實了。不但如此，他的小考成績也漸有起色，連數學都能考到70分以上了。詩人泰戈爾曾經說過：「頂不住眼前的誘惑，就會失去未來的幸福。」透過多方面的努力和支持，小睿頂住了指尖上的誘惑，成為手機的主人。
  start_text: 在洪老師的指導下，小睿及同學們採取了多方面的行動
