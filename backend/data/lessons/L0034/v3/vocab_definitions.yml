lesson_uid: L0034
version_id: v3
section_no: 三
vocab_definitions:
  vocabulary_bank:
  - 風靡
  - 沉浸
  - 廢寢忘食
  - 迫不及待
  - 菁華
  - 天人交戰
  - 悄然流逝
  - 起色
  - 渾然不覺
  - 重蹈覆轍
  - 惡性循環
  - 蠢蠢欲動
  items:
  - index: 1
    word: 菁華
    definition: 指事物最有價值、最重要的部分。
  - index: 2
    word: 天人交戰
    definition: 形容心裡非常矛盾，難以做決定。
  - index: 3
    word: 沉浸
    definition: 完全投入在某種情境、情緒或活動中。
  - index: 4
    word: 渾然不覺
    definition: 完全沒有察覺到。
  - index: 5
    word: 悄然流逝
    definition: 形容時間默默的、一點一點的消失。
  - index: 6
    word: 起色
    definition: 事情開始好轉。
  - index: 7
    word: 迫不及待
    definition: 形容非常期待，等不及要去做某件事。
  - index: 8
    word: 廢寢忘食
    definition: 形容非常專注或努力投入一件事，連睡覺吃飯都會忘記。
  - index: 9
    word: 重蹈覆轍
    definition: 再次犯下以前曾犯過的錯誤。
  - index: 10
    word: 風靡
    definition: 非常流行、非常受歡迎。例如，風靡全球，就是在全世界各地流行起來。
  - index: 11
    word: 蠢蠢欲動
    definition: 形容想要開始行動，多用在不好的念頭或行動。
  - index: 12
    word: 惡性循環
    definition: 壞的情況反覆發生，越來越糟。
