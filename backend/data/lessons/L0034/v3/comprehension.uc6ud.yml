lesson_uid: L0034
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列語詞，何者使用錯誤？
    options:
      A: 小美準備充分，考試又「重蹈覆轍」，再次高分順利通過
      B: 經過治療後，奶奶的病情終於有了「起色」，精神也好多了
      C: 珍珠奶茶在國際媒體報導後，迅速「風靡全球」
      D: 因錯誤的決策導致破產，他長時間「沉浸」在懊悔之中
    teacher_note: A-重複走上別人或自己過去失敗的老路，比喻再犯同樣的錯誤。
  - index: 2
    answer: D
    stem: 小睿願意把不敢告訴爸媽的困擾告訴洪老師，洪老師也安排方法協助他。兩人的互動最接近下列何者？
    options:
      A: 彼此無話不談，常分享所有心事
      B: 彼此像手足一樣，關係非常親近
      C: 小睿十分崇拜，完全聽從老師安排
      D: 小睿信任老師，老師也給予支持
  - index: 3
    answer: C
    stem: 下列哪一選項是本文主要想傳達的訊息？
    options:
      A: 短影音精彩引人，而且會照使用者的喜好推薦影片
      B: 要改掉手機成癮，必須靠自己堅強的意志力
      C: 面對手機誘惑要自制，並善用多種輔助策略
      D: 青少年容易沉迷於短影音，必須謹慎使用
  - index: 4
    answer: B
    stem: 小睿改善手機使用習慣後，生活出現了哪些正向改變？
    options:
      A: 他成為學校裡手機使用時間最短的學生
      B: 他有更多時間運動、閱讀，成績也進步
      C: 他從此再也不碰手機遊戲及短影音了
      D: 他可以擺脫網路社群上緊張的人際關係
    teacher_note: 文中結尾提到，小睿生活變得充實。
  - index: 5
    answer: B
    stem: 小涵很想在星期日和朋友出去玩，但星期一有篇報告要交。如果她想遵循泰戈爾說的：「頂不住眼前的誘惑，就會失去未來的幸福」，請問小涵接下來會怎麼做？
    options:
      A: 先出門玩到開心，再熬夜趕報告
      B: 無論如何週六完成報告，再出去玩
      C: 船到橋頭自然直，等到時候再說
      D: 報告不要求完美，簡單完成即可
    teacher_note: 控制當下玩樂的誘惑，優先完成重要任務，才能真正掌握未來的成果，呼應名言精神。
