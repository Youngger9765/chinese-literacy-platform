lesson_uid: L0034
version_id: v3
section_no: 六
spotlight:
  strategy_name: 品格力──建立好習慣
  strategy_type: sel_character
  blocks:
  - type: concept_box
    text: 小睿因為手機使用過度，陷入了「玩手機→懊惱愧疚→發誓戒手機→隔天又再玩手機」的惡性循環。然而，他在向老師求助後，採取了幾項改變的方法：
  - type: fill_table
    columns:
    - 策略
    - 改變環境
    - 設定規範
    - 自我提醒
    rows:
    - 列: 目的
      改變環境: 調整周遭環境，減少誘惑
      設定規範: 事前訂出明確規則，幫助自己遵守
      自我提醒: 用聲音、動作、口令，拉回專注力
    - 列: 具體作法（請打勾）
      改變環境:
        1: 參加班級晚自習。
        2: 安排念書、打球或爬山等活動。
        3: 把手機放在書桌旁，方便隨時查看。
      改變環境_answer:
      - 1
      - 3
      設定規範:
        1: 使用時間管理App，每天限定上網的時數。
        2: 等到想滑手機時，再決定要玩多久
        3: 和同儕組成「脫癮小組」，約定互相查看使用時間。
      設定規範_answer:
      - 1
      - 3
      自我提醒:
        1: 想滑手機時，先對自己說一聲「停！」
        2: 看提醒貼、深呼吸，再把手機放回書包。
      自我提醒_answer:
      - 1
      - 2
    reflection: 你發現了嗎？從這個表格中可以看出，小睿透過「改變環境」「設定手機使用規範」「自我提醒」三種策略，逐步減少滑手機，建立更好的生活習慣。這三種方法也能用在其他想改變的習慣上。
  - type: guide
    text: ◎小試身手：
  - type: matching
    index: 1
    情境: 我在房間裡寫作業時會分心。
    instruction: 解決：以下是解決寫作業分心的「策略」與「具體做法」，請連線配對。
    left_header: 策略
    right_header: 具體作法
    left:
      1: 改變環境
      2: 設定規範
      3: 自我提醒
    right:
      A: 設定計時器，規定自己專心寫25分鐘
      B: 將桌面雜物清空
      C: 在桌上貼「先寫完再休息」提醒卡
      D: 精神喊話：「我做得到！」
      E: 到圖書館或自習室完成功課
      F: 完成一科作業後休息5分鐘
    answer:
      1:
      - B
      - E
      2:
      - A
      - F
      3:
      - C
      - D
    answer_carrier: 紅色連線（圖形），文字流無此資訊
  - type: fill_table
    index: 2
    label: 進階挑戰
    instruction: 小芸常常上學遲到，想培養「準時起床」的好習慣。請在每一欄勾選最符合該策略的做法。（勾選題，單選）
    columns:
    - 策略
    - 改變環境
    - 設定規範
    - 自我提醒
    rows:
    - 列: 目的
      改變環境: 減少外在的誘惑
      設定規範: 事前訂出規則讓自己遵守
      自我提醒: 用聲音、動作、口令，拉回專注力
    - 列: 具體作法
      改變環境:
        1: 早上起床喝一杯水，提神醒腦
        2: 把鬧鐘放到房間另一側，無法用手摸到鬧鐘
      改變環境_answer: 2
      設定規範:
        1: 事前調整房間的溫度
        2: 規定自己晚上十點半前一定上床睡覺
      設定規範_answer: 2
      自我提醒:
        1: 聽到鬧鐘響，在心中倒數五秒默念：「快起床，早餐等你！」
        2: 睡前請家人明早叫我起床
      自我提醒_answer: 1
    - 列: 挑戰題：你有沒有更好的方法？請填入表格內。
      改變環境: 把窗簾半開，讓晨光喚醒自己
      設定規範: 規定自己鬧鐘一響，就一定要離開床。
      自我提醒: 聽到鬧鐘時，立刻坐起來，並說：「該起床了」。
  - type: free_text
    index: 3
    label: 自我省思
    prompt: 自我省思：你是否有想改掉的壞習慣？
    instruction: 你是否有想改掉的壞習慣？試著運用本文介紹的三大策略──「改變環境」「設定規範」「自我提醒」。請先寫下你想改變的壞習慣，再從三種策略中勾選一項或多項，並思考具體做法，填入下列表格。
    table:
      rows:
      - 想改變的壞習慣
      - 策略
      - 具體作法
      策略_options:
      - 改變環境
      - 設定規範
      - 自我提醒
    student_filled: true
  - type: free_text
    index: 4
    label: 分享與回饋
    prompt: 分享與回饋：和同學交換學習單，分享你的心得，也請同學寫下回饋。
    instruction: 和同學交換學習單，分享你的心得，也請同學寫下回饋。
    fields:
    - 同學回饋
    - 簽名
    student_filled: true
