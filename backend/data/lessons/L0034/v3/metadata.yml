intro: 這篇文章探討了現代青少年沉迷短影音和手機的現象。故事透過小睿的經歷，描寫了他如何被手機的吸引力困住，陷入不斷玩手機、懊惱、發誓戒除卻又故態復萌的惡性循環。面對這個困擾，小睿向老師求助，並與同學一起尋找解決方法。文章接著介紹了他們採取的各種策略，例如利用團體約束、安裝時間管理App、組成互助小組，以及學習自我控制的技巧。透過這些努力，小睿逐漸找回對時間的掌控權，讓生活變得更充實，學習也因此有了進步。
