lesson_uid: L0177
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列選項中「  」的語詞，何者使用正確？
    options:
      A: 他這場演講重點筆記很精采，把所有精華都「混為一談」
      B: 每個人眼光不同，你認為「一文不值」，也有人視為珍寶
      C: 他比較了三個建議後，只「照單全收」其中最有用的一項
      D: 面對他沒有興趣的活動，他常常直接拒絕並「揮之不去」
    teacher_note: 第1題解析：(A)「混為一談」是負面用法；(C)「照單全收」是針對意見、評價；(D)「揮之不去」是指無法消去
  - index: 2
    answer: C
    stem: 根據第五段，作者提出「他掌握的是事情的全貌，還是只有其中一小段？」這個問題，主要是要避免哪一種錯誤？
    options:
      A: 因為一個人的身分，就認定他的話一定不會錯
      B: 因為別人的語氣不好，就完全不考慮他的意見
      C: 用局部資訊做出對整件事或整個人的全面判斷
      D: 因為大多數人意見相同，就跟著改變自己想法
    teacher_note: 避免以偏概全，只知道部分就做出的判斷不一定貼近事實。
  - index: 3
    answer: A
    stem: 根據第八段「拉開距離，不是逃避，而是替自己留一點整理心情的空間。」這句話最適合怎麼理解？
    options:
      A: 面對持續的惡意攻擊時，暫時離開也是保護自己的方法
      B: 只要別人的話讓自己感覺不適，就不需要再聽任何意見
      C: 遇到網路批評時，先停止使用社群網站才是最好的方式
      D: 不回應別人的評論，可以讓對方知道自己的態度更堅定
  - index: 4
    answer: C
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 面對網路留言時，最好相信熟悉自己的人，不要相信陌生人
      B: 別人的批評常會傷害自信，應該減少在網路上分享自己的生活
      C: 面對評價應先判斷內容是否有幫助，不要讓一句話否定自己
      D: 每個人的喜好都不同，面對不同意見不需要和別人爭論對錯
  - index: 5
    answer: D
    stem: 小妤要驗收運動會進場的舞蹈，阿青說：「你有兩個動作常比音樂慢半拍，可以先把那八拍單獨練熟。」燕燕則說：「你跳舞看起來很沒天分。」依照本文，小妤最適合怎麼想？
    options:
      A: 兩個人都覺得她跳不好，所以她可能真的不適合跳舞
      B: 兩句都是負面的評價，為了維持信心，都先不要接受
      C: 阿青說得比較客氣，應該接受；燕燕說得難聽，所以不用理
      D: 阿青提出可以改進之處值得參考；燕燕整體否定，不必收下
