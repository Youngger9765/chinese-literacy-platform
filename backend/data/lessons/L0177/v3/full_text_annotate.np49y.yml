full_text_annotate:
  lesson_heading: 第13課  別讓一句話決定你是誰
  paragraph_count: 9
  paragraphs:
  - idx: 1
    text: 比賽結束後，球隊的社群帳號陸續放上短影音。有人敲出長打，有人飛身接球，每個隊友的影片都帥氣又熱血。只有阿哲的影片不一樣：他追接飛球時腳下一滑，跌坐在地上，畫面還被配上搞笑音效。隨著影片的轉傳數飆升，底下的留言也愈來愈多。
  - idx: 2
    text: 「這也能當先發？」「教練為什麼讓他上場？」「根本是來搞笑的吧！」
  - idx: 3
    text: 阿哲知道，那只是一次失誤。可是，他還是忍不住一看再看。原本只是懊惱那一球，後來卻慢慢變成另一個念頭：我真的有資格上場嗎？一次失誤和有沒有資格上場，看似是兩回事，可是別人的評價，常讓人不知不覺把兩者混為一談。
  - idx: 4
    text: 當你興奮分享最近喜歡的偶像相片，朋友隨口說：「這個長相你覺得好看哦？」當你花很多時間完成一幅拼圖，開心和同學分享，對方只淡淡回一句：「你時間很多哦？怎麼這麼無聊？」或許說話的人沒有惡意，甚至說完就忘了，那句話卻可能在聽的人心中揮之不去。
  - idx: 5
    text: 我想我們都知道不要過度在意別人看法，但聽到評價而受到影響，也不是一件丟臉的事。只是，聽見一個評價時，我們不一定要立刻相信，也不必逼自己不要在乎。可以先讓自己停一下，問自己：❶對方說的是一個具體問題，還是只是他的個人感覺？❷他掌握的是事情的全貌，還是只有其中一小段？❸這個評價能不能幫助我做得更好？
  - idx: 6
    text: 2024年世界棒球12強賽前，中華隊曾被外界批評「星光黯淡」，球員潘傑楷也因為幾次失誤，受到不少質疑。總教練曾豪駒沒有假裝那些失誤不存在，卻提醒潘傑楷，他曾經是最佳三壘手，不該因為幾次失常，就否定自己原本擁有的能力。他也告訴球員：「別人可以看不起你，但是你不可以看不起你自己。」這並不是要大家拒絕所有批評，而是在提醒：一次失誤、幾句留言，不能否定一個人一路以來的努力，也不能用幾次失誤概括一個人的全部的表現。
  - idx: 7
    text: 有些話雖然不好聽，卻指出了具體問題，其中可能有值得採納的地方。像是阿哲可以請教練看看，那一球是不是起步真的慢了一些。把能幫助自己進步的部分留下，但那些嘲笑和否定，不必一起收下。
  - idx: 8
    text: 而有些話則只是個人喜好。朋友不喜歡你欣賞的偶像，不表示那位偶像就不好；別人覺得無聊，也不代表你的興趣沒有價值。遇到這些話，不妨先放一放，不必因此迎合別人的看法，也不一定要和對方爭出一個答案。如果留言只剩下反覆嘲笑、辱罵或人身攻擊，也可以停止繼續看，暫時離開，必要時封鎖帳號、截圖保存，也可以找你信任的大人幫忙。拉開距離，不是逃避，而是替自己留一點整理心情的空間。
  - idx: 9
    text: 有時候，即使知道那些話不正確，心裡還是會難過，這也沒有關係。受傷不代表你太脆弱，有時也你曾經認真投入、希望自己的努力能被看見有關。請不要急著因為幾句話，就把自己貶得一文不值。別人說一句話很容易，但你不必每一句都照單全收。把能幫助自己的部分留起來，把嘲笑、偏見和毫無根據的否定放下。儘管別人的話也許會讓你一時懷疑自己，但最後，你仍可以選擇相信那個一路努力、走到今天的自己。
