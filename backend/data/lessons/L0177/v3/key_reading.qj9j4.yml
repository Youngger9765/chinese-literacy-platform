  passage: 有些話雖然不好聽，卻指出了具體問題，其中可能有值得採納的地方。像是阿哲可以請教練看看，那一球是不是起步真的慢了一些。把能幫助自己進步的部分留下，但那些嘲笑和否定，不必一起收下。而有些話則只是個人喜好。朋友不喜歡你欣賞的偶像，不表示那位偶像就不好；別人覺得無聊，也不代表你的興趣沒有價值。遇到這些話，不妨先放一放，不必因此迎合別人的看法，也不一定要和對方爭出一個答案。如果留言只剩下反覆嘲笑、辱罵或人身攻擊，也可以停止繼續看，暫時離開，必要時封鎖帳號、截圖保存，也可以找你信任的大人幫忙。拉開距離，不是逃避，而是替自己留一點整理心情的空間。有時候，即使知道那些話不正確，心裡還是會難過，這也沒有關係。受傷不代表你太脆弱，有時也你曾經認真投入、希望自己的努力能被看見有關。請不要急著因為幾句話，就把自己貶得一文不值。別人說一句話很容易，但你不必每一句都照單全收。把能幫助自己的部分留起來，把嘲笑、偏見和毫無根據的否定放下。儘管別人的話也許會讓你一時懷疑自己，但最後，你仍可以選擇相信那個一路努力、走到今天的自己。
