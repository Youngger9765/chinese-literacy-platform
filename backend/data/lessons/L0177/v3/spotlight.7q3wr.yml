lesson_uid: L0177
version_id: v3
section_no: 六
spotlight:
  strategy_name: 面對評價的方法
  blocks:
  - type: concept_box
    text: 別人對我們的表現、外表或喜好，常常會有不同的看法。有些話能讓我們知道哪裡可以做得更好；有些只是對方的個人喜好；還有些只是嘲笑或否定。聽到評價時，不必急著相信，也不必每一句都拒絕。先學會分辨這是什麼樣的評價，再決定要不要接受。判斷時還要注意：對方看到的是完整情況，還是只看了一小部分，就對整件事下了結論。
  - type: guide
    text: ◎情境舉例：小晴拍了一張照片，傳給三位朋友看。
  - type: table
    headers:
    - 朋友
    - 說的話
    rows:
    - - A.芳芳
      - 「人物有點暗，如果站到亮一點的地方拍，臉會更清楚。」
    - - B.小萱
      - 「我比較不喜歡這種拍照風格，我喜歡自然一點的。」
    - - C.阿玖
      - 「這樣拍也太醜了吧！」
  - type: single
    prompt: 1.誰的回應是提出怎麼做會更好？
    options:
    - 芳芳
    - 小萱
    - 阿玖
    answer: 1
  - type: single
    prompt: 2.誰的回應主要是在說自己的喜好？
    options:
    - 芳芳
    - 小萱
    - 阿玖
    answer: 2
  - type: single
    prompt: 3.誰的回應只是批評，沒有幫助？
    options:
    - 芳芳
    - 小萱
    - 阿玖
    answer: 3
  - type: guide
    text: ◎認識不同的評價類型：
  - type: table
    headers:
    - 評價類型
    - 怎麼判斷
    - 例子
    rows:
    - - 具體回饋
      - 指出可以檢查的具體問題，有時也會提出可以怎麼改。但還要看看這個說法有沒有道理、對方掌握的資訊是否完整。
      - 「你講得有點快，重要的地方如果停一下，大家會比較容易聽懂。」
    - - 個人喜好
      - 說的是自己喜歡或不喜歡什麼，不一定代表事情本身好或不好。
      - 「我比較喜歡深色的衣服。」
    - - 無效批評
      - 只有嘲笑、辱罵或否定，或只憑一小部分就否定整體，沒有提供能幫助改進的資訊。
      - 「你的報告有夠爛。」
  - type: guide
    text: '判斷練習：請判斷下面每一句話比較接近哪一種評價。

      A.具體回饋　　B.個人喜好　　C.無效批評'
  - type: exercise
    option_bank:
      A: 具體回饋
      B: 個人喜好
      C: 無效批評
    items:
    - index: 1
      stem: 「你的簡報字有點小，如果再放大一些，坐在後面的同學也看得到。」
      answer: A
    - index: 2
      stem: 「我比較不喜歡這首歌，我平常比較常聽節奏快一點的。」
      answer: B
    - index: 3
      stem: 「你到底會不會畫畫？這張圖醜死了。」
      answer: C
    - index: 4
      stem: 「我覺得你上次那個髮型比較好看，我比較喜歡長一點的。」
      answer: B
    - index: 5
      stem: 「我看了你今天最後一次打擊，你完全不會打球。」
      answer: C
    - index: 6
      stem: 「你剛剛說話有點太衝了，可能會嚇到同學，下次可以等情緒穩定一點再說。」
      answer: A
    - index: 7
      stem: 「照片裡的人物有點暗，如果拍攝時面向窗戶，臉可能會更清楚。」
      answer: A
    - index: 8
      stem: 「我覺得這本小說有點無聊，我比較喜歡節奏快一點的故事。」
      answer: B
    - index: 9
      stem: 「你跑步的時候前面衝得太快，後半段才會沒力，下次可以試著把速度分配平均一點。」
      answer: A
    - index: 10
      stem: 「連這麼簡單的題目都不會，你真的很笨耶！」
      answer: C
  - type: guide
    text: '→不同的評價，可以有不同的處理方式

      1.如果是「具體回饋」：先看看有沒有道理、資訊是否完整，有幫助的部分，可以留下來試一試。

      2.如果是「個人喜好」：可以聽，但不用把別人的喜好當成標準。

      3.如果是「無效批評」：如果是反覆嘲笑、辱罵或網路攻擊，可以少看、離開、封鎖；需要時，截圖保存證據，並找信任的大人幫忙。'
  - type: guide
    text: '◎收到評價可以這麼想：

      請根據上述分類和建議，選出比較適合的想法。'
  - type: single
    prompt: 1.你參加班級海報比賽，同學說：「標題和背景的顏色太接近，遠一點看不太清楚。」你可以想：
    options:
    - 他一定覺得我的海報很醜
    - 這評價是可以檢查的，我試著站遠一點看看
    - 先不理他了，我哪有力氣去管每個人的意見？
    - 既然有人給了負評，整張海報還是重做好了
    answer: 2
  - type: single
    prompt: 2.朋友說：「我真的不懂你為什麼喜歡這個偶像，我覺得他很普通。」你可以想：
    options:
    - 他不喜歡，表示我眼光真的很差
    - 好朋友說這種話，表示他很不尊重我
    - 這是個人喜好，我和他的看法可以不一樣
    - 我要找更多理由證明我的眼光比他好
    answer: 3
  - type: single
    prompt: 3.你在社群網站分享自己的作品，有人留言：「做這麼爛還敢貼出來，笑死人了。」你可以想：
    options:
    - 他講得這麼直接，應該是真的很差
    - 我要馬上回罵，讓他知道我也不好惹
    - 只要有人不喜歡，以後就不要再分享作品
    - 這句話只有嘲笑，沒有有用的建議，我不必照單全收
    answer: 4
  - type: guide
    text: →當我們成為給意見的人，請「用愛心說真話」，不是什麼都只說好聽的，也不是想到什麼就直接批評；要讓自己的話有幫助：說具體、說清楚，不用嘲笑，也不要因為一次表現就否定整個人。
  - type: self_check
    instruction: 如果你做得到，請在□打勾。
    items:
    - 1.我能分辨一句評價是具體回饋、個人喜好，還是無效批評。
    - 2.我能想想評價有沒有根據、是否只看片段，能不能幫助自己，再決定要不要接受。
    - 3.面對無效批評時，我知道可以拉開距離、保護自己或尋求幫助。
    - 4.當我要給別人意見時，我能試著指出具體的地方，讓自己的話更有幫助。
