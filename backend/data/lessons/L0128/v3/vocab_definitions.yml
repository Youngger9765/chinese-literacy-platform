section_no: 三
vocab_definitions:
  vocabulary_bank:
  - 屏息以待
  - 震撼彈
  - 打量
  - 鼎力相助
  - 嗤之以鼻
  - 改寫
  - 緊張
  - 難以為繼
  - 命運共同體
  - 大聲疾呼
  vocabulary_bank_label: 本課語詞
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  items:
  - index: 1
    word: 震撼彈
    definition: 比喻讓人非常震驚、造成很大影響的消息或事件。
  - index: 2
    word: 難以為繼
    definition: 很難再繼續撐下去或維持下去。
  - index: 3
    word: 命運共同體
    definition: 彼此緊緊連在一起，一方出事或改變，其他也會受影響。
  - index: 4
    word: 鼎力相助
    definition: 很用力、很認真的幫忙。
  - index: 5
    word: 屏息以待
    definition: 形容大家因為期待或緊張而「安靜的等著結果」，連呼吸都放輕。
  - index: 6
    word: 改寫
    definition: 改變原有的內容；也可比喻大幅改變結果、紀錄或發展走向。
  - index: 7
    word: 緊張
    definition: 本課指資源不夠用或分配壓力變大的狀態。
  - index: 8
    word: 大聲疾呼
    definition: 用很強烈、急迫的態度公開呼籲，希望大家重視某件事。
  - index: 9
    word: 打量
    definition: 仔細察看人或事物，帶有評估、判斷的意味。
  - index: 10
    word: 嗤之以鼻
    definition: 用鼻子發出冷笑，表示輕視或不屑。
  notes:
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
