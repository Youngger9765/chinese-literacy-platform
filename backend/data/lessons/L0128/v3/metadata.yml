strategy_explained: 這一課我們要練習的是「比較異同來找出作者的想法」，這篇文章透過描述珍古德博士觀察黑猩猩的各種行為，像是使用工具、有情感，以及牠們與人類活動造成的衝突，讓你理解她是如何一步步改變我們對黑猩猩的看法，所以讀的時候，可以試著想想，作者透過對比黑猩猩的行為與人們過去的認知，想讓我們明白什麼**
