intro: 這篇文章介紹了珍古德博士如何透過長期的觀察與研究，改變了人們對黑猩猩的認識。文章描述了她如何克服困難，進入非洲叢林，細膩地記錄黑猩猩的行為，例如牠們會使用工具、建立親密關係，甚至也會有群體衝突。透過為黑猩猩命名，珍古德博士讓我們看見牠們獨特的個體與情感。此外，文章也探討了人類活動對黑猩猩棲地的影響，以及珍古德博士如何從研究者轉變為環境保育的推動者，呼籲大家一同關心生態。
