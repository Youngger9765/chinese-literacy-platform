lesson_uid: L0128
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    stem: 為何「黑猩猩用草桿釣白蟻」在當時被形容為投下「震撼彈」？
    options:
      A: 因為它直接挑戰了「只有人類會製造與使用工具」的舊觀念
      B: 因為它顯示黑猩猩具備「教學傳承」能力，會把技巧教給同伴
      C: 因為它讓研究者發現黑猩猩有高度智慧，可能接近人類的思考
      D: 因為它暗示白蟻數量影響族群生存，牽動整個森林的生態平衡
    answer: A
    explanation: 第1題解析：「震撼」是因為當時學界普遍相信：只有人類會製造與使用工具。黑猩猩用草桿釣白蟻，打破這個信念，所以造成巨大衝擊
    teacher_note: 「震撼」是因為當時學界普遍相信：只有人類會製造與使用工具。黑猩猩用草桿釣白蟻，打破這個信念，所以造成巨大衝擊
  - index: 2
    stem: 第四段提到「珍古德把時間交給森林」，最可能想表達什麼？
    options:
      A: 她把研究期限交由森林環境決定，不預先安排觀察方向
      B: 她長時間守候觀察，讓細節慢慢浮現，耐心累積證據成果
      C: 指的是她在森林裡工作了許多年，一直到青春不再、變老
      D: 她把生活移到森林，以親近黑猩猩取代資料記錄
    answer: B
    explanation: 第2題解析：這句是比喻：她願意把大量時間投入現場，靠長期蹲守、記錄，直到看見更多細節。這也是她能「改寫理解」的重要原因。
    teacher_note: 這句是比喻：她願意把大量時間投入現場，靠長期蹲守、記錄，直到看見更多細節。這也是她能「改寫理解」的重要原因。
  - index: 3
    stem: 珍古德觀察到黑猩猩哪些現象，最能說明許多行為並非人類的專利？
    options:
      A: 採集食物、群體合作、扶弱育幼
      B: 命名習性、破壞環境、保持客觀
      C: 使用工具、展現親情、戰爭虐殺
      D: 保護生態、解決問題、同儕競爭
    answer: C
  - index: 4
    stem: 作者同時寫「親情與守護」也寫「戰爭與虐殺」，這樣安排最能凸顯什麼？
    options:
      A: 指出黑猩猩有時溫和有時殘暴，行為模式常讓人難以捉摸
      B: 作者想讓故事更有張力，因此安排對比情節吸引讀者注意
      C: 珍古德太投入牠們的生活，因此記錄難免帶入個人主觀立場
      D: 黑猩猩社會同時包含親密與衝突的複雜樣貌，不只單一面向
    answer: D
  - index: 5
    stem: 下列哪一項最能概括本文想傳達的核心？
    options:
      A: 岡貝森林的生態資源不足，最後導致黑猩猩戰爭
      B: 科學方法太生硬冷漠，只有珍古德願意打破傳統
      C: 珍古德以研究改變理解，並把理解推向保育行動
      D: 黑猩猩仍有許多神秘的習性需要人類去研究了解
    answer: C
    explanation: 第5題解析：文章是用她的研究歷程讓黑猩猩從「被想像」到「被看見」，再推進到棲地危機與保育倡議。最後用名言收束：了解→關心→行動
    teacher_note: 文章是用她的研究歷程讓黑猩猩從「被想像」到「被看見」，再推進到棲地危機與保育倡議。最後用名言收束：了解→關心→行動
