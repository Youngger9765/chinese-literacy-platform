lesson_uid: L0128
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略——從對比推論作者觀點
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）共 17 個，PDF p7~p9 全部可見
  blocks:
  - type: concept_box
    text: '這篇文章透過珍古德的故事，帶你看見作者的想法，作者沒有用一個句子完整說出所有觀點，而是透過多組對比與前後轉變，逐步引導讀者看見黑猩猩的複雜全貌；結尾再以明示的句子收束「理解應走向行動」的觀點。你在閱讀的過程中會慢慢發現：

      「啊！這些對比各自凸顯不同重點，最後共同支持一個主要觀點。」

      「啊！原來作者想透過這些對比，改變我原本的想法。」

      讀這樣的文章，你要先讀出對比，然後一邊讀一邊問自己兩個問題：

      1.這組對比想讓我看見什麼？（重點）

      2.作者透過這些重點想影響我什麼？（作者意圖）'
  - type: guide
    text: 一、找對比與歸納重點：
  - type: exercise
    label: 向度／對比
    note: 表格兩欄（欄名照原稿）：向度／對比。每個向度先左右兩欄各一題單選，再一題「歸納重點」單選。
    items:
    - type: sub_block
      label: 工具
      note: 對比標題：原來的舊信念 vs 珍古德的新證據
      items:
      - type: single
        prompt: 原來的舊信念
        options:
          1: 人類是唯一會製造與使用工具的生物。
          2: 人類最擅長使用工具，但動物也會用簡單工具。
        answer: 1
      - type: single
        prompt: 珍古德的新證據
        options:
          1: 黑猩猩用草桿釣白蟻。
          2: 黑猩猩用樹葉遮雨。
        answer: 1
      - type: single
        prompt: 歸納重點：
        options:
          1: 用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。
          2: 用黑猩猩的工具行為作例子，證明牠們的智力接近人類。
        answer: 1
    - type: sub_block
      label: 質疑與回應
      note: 對比標題：對珍古德的質疑 vs 珍古德的行動回應
      items:
      - type: single
        prompt: 對珍古德的質疑
        options:
          1: 沒念大學又年輕，珍古德有什麼能力去森林做研究？
          2: 缺少昂貴儀器與團隊，珍古德怎麼可能得到可靠資料？
        answer: 1
      - type: single
        prompt: 珍古德的行動回應
        options:
          1: 她改用更先進的儀器，縮短時間完成研究成果。
          2: 她長期守候記錄，讓黑猩猩習慣她，看見前所未見的細節。
        answer: 2
      - type: single
        prompt: 歸納重點：
        options:
          1: 她用長期投入回應外界質疑，最後因改用先進的儀器而得到肯定。
          2: 她以長期守候、觀察與記錄累積證據，回應外界對她的質疑。
        answer: 2
    - type: sub_block
      label: 研究方法
      note: 對比標題：不帶感情的編號 vs 帶來理解的命名
      items:
      - type: single
        prompt: 不帶感情的編號
        options:
          1: 使用編號避免研究者先入為主，因此個體差異不必列入主要觀察。
          2: 為了保持客觀距離，應該用編號記錄動物，避免感情用事。
        answer: 2
      - type: single
        prompt: 帶來理解的命名
        options:
          1: 她堅持命名，持續辨識、追蹤個體，更清楚看見互動、情緒與關係。
          2: 她堅持命名，才能讓黑猩猩更親近人類，方便接受訓練。
        answer: 1
      - type: single
        prompt: 歸納重點：
        options:
          1: 她用命名來辨識與追蹤互動，讓研究看見黑猩猩的情緒與關係。
          2: 她用命名來拉近與黑猩猩的距離，使牠們更親近人類以便觀察。
        answer: 1
    - type: sub_block
      label: 親密照顧 vs 群體衝突
      note: 對比標題：展現親密關係 vs 爆發戰爭虐殺
      items:
      - type: single
        prompt: 展現親密關係
        options:
          1: 黑猩猩的互助只發生在母子之間，其他個體沒有穩定關係。
          2: 黑猩猩能建立親密關係，也會照顧年幼同伴。
        answer: 2
      - type: single
        prompt: 爆發戰爭虐殺
        options:
          1: 群體衝突主要是偶發的個體爭執，與地盤及資源無關。
          2: 資源緊張時會激烈競爭，甚至出現集體對抗與戰爭虐殺。
        answer: 2
      - type: single
        prompt: 歸納重點：
        options:
          1: 理解黑猩猩要看見「全貌」：牠們既會合作互助，也可能因情緒失控而暴力。
          2: 理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。
        answer: 2
    - type: sub_block
      label: 角色轉變
      note: 對比標題：研究者角色 vs 成為倡議者
      items:
      - type: single
        prompt: 研究者角色
        options:
          1: 留在森林觀察記錄，把成果寫成報告就足夠。
          2: 留在森林長期研究，持續觀察黑猩猩的行為。
        answer: 2
      - type: single
        prompt: 成為倡議者
        options:
          1: 走出森林成立研究院、推動根與芽，號召更多人投入保育。
          2: 走出森林出版傳記上節目，讓自己的故事更受關注。
        answer: 1
      - type: single
        prompt: 歸納重點：
        options:
          1: 她沒有讓理解停在研究成果，而是把理解轉化為保育倡議與行動。
          2: 她把研究帶出森林，走向保育倡議，是為了爭取資源與提高能見度。
        answer: 1
  - type: guide
    text: 二、歸納主要論點/主旨
  - type: table
    note: 三欄表格：對比歸納的重點／找共同點 看見了……／統整作者觀點。左欄是前面五個「歸納重點」的答案，中欄是跨列合併的共同點。
    rows:
    - - 對比歸納的重點
      - 找共同點 看見了……
    - - ❶用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。
      - 以長期觀察取得證據與細節
    - - ❷她對黑猩猩長期觀察，得到不為人知的細節，回應了外界的質疑。
      - 以長期觀察取得證據與細節
    - - ❸她用命名來辨識個體並追蹤互動，讓研究看見黑猩猩的情緒與關係。
      - 看見黑猩猩個體與群體的複雜全貌
    - - ❹理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。
      - 看見黑猩猩個體與群體的複雜全貌
    - - ❺她把研究帶出森林，走向保育倡議，讓理解轉成保育行動。
      - 從理解走向保育行動
  - type: single
    label: 統整作者觀點 1
    prompt: 1.本文重點是：
    options:
      1: 了解黑猩猩不能依賴舊信念或單一印象，而要根據長期觀察的證據，看見牠們的複雜全貌；真正的理解也應進一步轉化為保育行動。
      2: 本文重點是珍古德克服質疑、追求夢想，鼓勵讀者堅持到底就會成功。
    answer: 1
  - type: single
    label: 統整作者觀點 2
    prompt: 2.作者最可能想改變讀者什麼想法／態度？
    options:
      1: 讓讀者理解黑猩猩也有衝突與競爭，因此應提高警覺、不要太靠近牠們。
      2: 讓讀者用證據與全貌取代刻板印象，並從理解走向關心與保育行動。
    answer: 2
  - type: self_check
    prompt: ◎自我檢核
    items:
    - 1.我能找到文本裡的對比訊息，並歸納出重點。
    - 2.我能根據歸納出的重點，進一步推論出本文的重點和作者觀點。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
