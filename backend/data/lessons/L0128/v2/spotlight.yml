    source: unknown
    paragraphs:
    - 「震撼」是因為當時學界普遍相信：只有人類會製造與使用工具。黑猩猩用草桿釣白蟻，打破這個信念，所以造成巨大衝擊「震撼」是因為當時學界普遍相信：只有人類會製造與使用工具。黑猩猩用草桿釣白蟻，打破這個信念，所以造成巨大衝擊請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
