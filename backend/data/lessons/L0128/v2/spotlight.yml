spotlight:
  lesson: G8-L8
  strategy_name: 推論策略-從對比推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 這篇文章透過珍古德的故事，帶你看見作者的想法，作者沒有用一個句子完整說出所有觀點，而是透過多組對比與前後轉變，逐步引導讀者看見黑猩猩的複雜全貌；結尾再以明示的句子收束「理解應走向行動」的觀點。你在閱讀的過程中會慢慢發現：「啊！這些對比各自凸顯不同重點，最後共同支持一個主要觀點。」「啊！原來作者想透過這些對比，改變我原本的想法。」讀這樣的文章，你要先讀出對比，然後一邊讀一邊問自己兩個問題：   1.這組對比想讓我看見什麼？（重點）2.作者透過這些重點想影響我什麼？（作者意圖）
  - type: guide
    text: 一、找對比與歸納重點：
  - type: table
    rows:
    - - 向度
      - 對比
    - - 工具
      - 原來的舊信念 vs 珍古德的新證據
    - - 工具
      - □①人類是唯一會製造與使用工具的生物。□②人類最擅長使用工具，但動物也會用簡單工具。
      - □①黑猩猩用草桿釣白蟻。□②黑猩猩用樹葉遮雨。
    - - 工具
      - 歸納重點：□①用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。□②用黑猩猩的工具行為作例子，證明牠們的智力接近人類。
    - - 質疑與回應
      - 對珍古德的質疑 vs 珍古德的行動回應
    - - 質疑與回應
      - □①沒念大學又年輕，珍古德有什麼能力去森林做研究？□②缺少昂貴儀器與團隊，珍古德怎麼可能得到可靠資料？
      - □①她改用更先進的儀器，縮短時間完成研究成果。□②她長期守候記錄，讓黑猩猩習慣她，看見前所未見的細節。
    - - 質疑與回應
      - 歸納重點： □①她用長期投入回應外界質疑，最後因改用先進的儀器而得到肯定。□②她以長期守候、觀察與記錄累積證據，回應外界對她的質疑。
    - - 研究方法
      - 不帶感情的編號 vs 帶來理解的命名
    - - 研究方法
      - □①使用編號避免研究者先入為主，因此個體差異不必列入主要觀察。□②為了保持客觀距離，應該用編號記錄動物，避免感情用事。
      - □①她堅持命名，持續辨識、追蹤個體，更清楚看見互動、情緒與關係。□②她堅持命名，才能讓黑猩猩更親近人類，方便接受訓練。
    - - 研究方法
      - 歸納重點：□①她用命名來辨識與追蹤互動，讓研究看見黑猩猩的情緒與關係。□②她用命名來拉近與黑猩猩的距離，使牠們更親近人類以便觀察。
    - - 親密照顧 vs 群體衝突
      - 展現親密關係 vs 爆發戰爭虐殺
    - - 親密照顧 vs 群體衝突
      - □①黑猩猩的互助只發生在母子之間，其他個體沒有穩定關係。□②黑猩猩能建立親密關係，也會照顧年幼同伴。
      - □①群體衝突主要是偶發的個體爭執，與地盤及資源無關。□②資源緊張時會激烈競爭，甚至出現集體對抗與戰爭虐殺。
    - - 親密照顧 vs 群體衝突
      - 歸納重點：□①理解黑猩猩要看見「全貌」：牠們既會合作互助，也可能因情緒失控而暴力。□②理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。
    - - 角色轉變
      - 研究者角色 vs 成為倡議者
    - - 角色轉變
      - □①留在森林觀察記錄，把成果寫成報告就足夠。□②留在森林長期研究，持續觀察黑猩猩的行為。
      - □①走出森林成立研究院、推動根與芽，號召更多人投入保育。□②走出森林出版傳記上節目，讓自己的故事更受關注。
    - - 角色轉變
      - 歸納重點：□①她沒有讓理解停在研究成果，而是把理解轉化為保育倡議與行動。□②她把研究帶出森林，走向保育倡議，是為了爭取資源與提高能見度。
  - type: guide
    text: 二、歸納主要論點/主旨
  - type: table
    rows:
    - - 對比歸納的重點
      - 找共同點看見了……
      - 統整作者觀點
    - - ❶用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。
      - 以長期觀察取得證據與細節
      - 1.本文重點是：□①了解黑猩猩不能依賴舊信念或單一印象，而要根據長期觀察的證據，看見牠們的複雜全貌；真正的理解也應進一步轉化為保育行動。□②本文重點是珍古德克服質疑、追求夢想，鼓勵讀者堅持到底就會成功。2.作者最可能想改變讀者什麼想法／態度？□①讓讀者理解黑猩猩也有衝突與競爭，因此應提高警覺、不要太靠近牠們。□②讓讀者用證據與全貌取代刻板印象，並從理解走向關心與保育行動。
    - - ❷她對黑猩猩長期觀察，得到不為人知的細節，回應了外界的質疑。
