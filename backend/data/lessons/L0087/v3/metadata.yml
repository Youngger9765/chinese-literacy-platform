intro: 這篇文章透過作者小時候與姊姊分餅的經驗，引導讀者思考，為什麼我們常常覺得別人的東西比自己的好？文章接著舉出生活中許多類似的例子，像是覺得別人的功課比較輕鬆、別人的書比較有趣，甚至別人的餐點也比自己的美味。直到讀到馬克‧吐溫《湯姆歷險記》裡，湯姆如何運用創意將刷油漆變成一件有趣的事，並以此換取別人的零食和玩具，作者才恍然大悟。文章最後分享了作者如何運用這個領悟，改變看待生活的方式，即使遇到不順遂，也能用積極的態度去面對。
