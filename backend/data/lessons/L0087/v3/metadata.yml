strategy_explained: 這一課我們要練習的是「換個角度看事情」的本事，這篇文章用小時候分餅、還有覺得別人功課或食物都比較好的例子，讓我們想想為什麼會這樣；讀的時候，可以試著想想，如果你是湯姆，遇到刷油漆這種無聊的事，你會怎麼把它變得有趣，換取好處呢
