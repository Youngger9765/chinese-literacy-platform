  passage: 看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒賴一下，就可以把餅換回來。真的換回來後，我就開始吃了。我狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？類似的情況在生活中層出不窮。分組任務時，總是認為別人的任務比較輕鬆，自己的任務則是難如登天；我和同學都在看繪本，但別人手裡的書，看起來似乎比我的有趣多了；點餐，菜一上桌，才發現隔壁桌點的脆皮炸雞似乎比我的麥香雞好吃；而且同學的家庭都特別溫暖，孩子不用做家事，就我的命最苦，每天都要洗衣服、洗碗、拖地。我總是邊做邊自怨自艾。
  start_text: 看在眼裡，我突然覺得自己「受騙」了，一定是她拿到
