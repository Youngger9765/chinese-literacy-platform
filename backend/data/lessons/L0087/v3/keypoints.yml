lesson_uid: L0087
version_id: v3
section_no: 五
keypoints:
  title: 把手上的餅吃香一點！
  layout: list
  answer_carrier: 橘色手寫字（PDF p12）；文字層的【　】內已填有同樣的答案
  rows:
  - label: 問題
    value: '1.作者百思不解的問題是：

      小時候大人分餅，為什麼每次總覺得【　】？

      2.類似的狀況在生活中層出不窮：

      (1)分組任務時，覺得別人的任務比較【　】。

      (2)看書時，覺得別人手裡的書比較有趣。

      (3)點餐時，覺得別人的餐點比較好吃。

      (4)看同學的家庭，覺得別人的家庭比較【　】。

      →作者遇到的問題是：無論在任何情況中，為什麼別人都比較【　】？'
    blanks:
    - answer: 姊姊的餅比較大
    - answer: 輕鬆
    - answer: 溫暖
    - answer: 好/幸運
  - label: 轉念契機
    value: '1.作者讀到【　】中刷籬笆的故事，解決了他的問題。

      2.湯姆的姨媽要他去【　】，一開始他刷得【　】。後來他把自己想成正在創作偉大壁畫的藝術家，全神投入。'
    blanks:
    - answer: 湯姆歷險記
    - answer: 刷籬笆
    - answer: 不甘願
  - label: 領悟
    value: 原來問題不在於【　】，而在怎麼把手上的餅【　】。
    blanks:
    - answer: 餅的大小
    - answer: 吃香一點
  - label: 後來做法
    value: 作者遇到不順利的事時，會試著換個角度看，用【　】的方式面對。
    blanks:
    - answer: 幽默
  blanks_note: 第一列末的「好/幸運」在原稿就是用斜線並列兩個可接受答案，照原稿保留。
