  duplicate_copy_note: "\U0001F534 課文全文在檔內出現兩次（前半聚光燈表格版帶「（段N）」前綴、後半讀全文版不帶），\n而且**兩份的文字不一樣**。逐段比對後有七處差異（本欄取後半「讀全文」版）：\n  段1  聚光燈「我可不是孔融(註)」          ／讀全文「我可不是孔融」＋真正的頁尾註腳\n  段1  聚光燈「尤其是**在**計較大小」       ／讀全文「尤其是**要**計較大小」\n  段3  聚光燈「真的換回來後，我**立刻**狼吞虎嚥」\n       ／讀全文「真的換回來後，我**就開始吃了。我**狼吞虎嚥」\n  段4  聚光燈「菜一上桌，**我**才發現」     ／讀全文「菜一上桌，才發現」\n  段8  聚光燈「成功**的**讓幾個小朋友上鉤」 ／讀全文「成功讓幾個小朋友上鉤」\n  段8  聚光燈「不但**在**一個下午」         ／讀全文「不但一個下午」\n  段9  聚光燈「而在怎麼把手上的餅」         ／讀全文「而在怎麼**樣**把手上的餅」\n另外「孔融」的註解內容兩邊也不同：聚光燈版在右欄寫「註：孔融是知名的東漢文學家，\n他小時候就會把食物讓給他的哥哥，得到眾人的稱讚。」；讀全文版是頁尾註腳\n「某次，父親帶回幾顆梨讓家中小孩分享，孔融立刻選擇最小的梨，將大的梨留給哥哥。」\n⚠️ 對照組：L0085 的兩份課文**完全相同**、L0086 只差第 1 段一個空格 ——\n所以「兩份不一致」是這一課特有的，不是這批教材的通例。"
  paragraphs:
  - idx: 1
    text: 小時候我有一個百思不解的問題。故事發生在物質缺乏的花蓮鄉下，小孩子很少有機會吃糖，見到糖果、餅乾都非常「餓鬼」（臺語「嘴饞」的意思），偏偏大人給糖時，都要我們小孩「公家吃」（臺語「一起吃」的意思），我可不是孔融，公家吃是一件痛苦的事，尤其是要計較大小、多少的時候。
    footnote: 某次，父親帶回幾顆梨讓家中小孩分享，孔融立刻選擇最小的梨，將大的梨留給哥哥。
    footnote_note: '這是真正的 Word 頁尾註腳（住在 `word/footnotes.xml`，不在 document.xml），

      掛在「孔融」後面，PDF p8 底部印出來。逐字門會讀 footnotes.xml，所以它比得到。'
  - idx: 2
    text: 姊姊大我三歲，我常常被迫和她分享同一個餅。因為我年紀小，大的要讓小的，所以祖母說：「姊姊你來分，弟弟先選。」等姊姊小心的把餅分成兩半以後，我就要更小心的選出比較大的那一半來。好不容易選好了，我和姊姊各持半邊餅，她捨不得馬上吃，寶貝似的捧在手上，一副心滿意足的樣子。
  - idx: 3
    text: 看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒賴一下，就可以把餅換回來。真的換回來後，我就開始吃了。我狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 4
    text: 類似的情況在生活中層出不窮。分組任務時，總是認為別人的任務比較輕鬆，自己的任務則是難如登天；我和同學都在看繪本，但別人手裡的書，看起來似乎比我的有趣多了；點餐，菜一上桌，才發現隔壁桌點的脆皮炸雞似乎比我的麥香雞好吃；而且同學的家庭都特別溫暖，孩子不用做家事，就我的命最苦，每天都要洗衣服、洗碗、拖地。我總是邊做邊自怨自艾。
  - idx: 5
    text: 沒想到，是馬克‧吐溫幫我解決了這個問題。我在他的《湯姆歷險記》中，居然讀到這麼一段讓人醍醐灌頂的小故事。
  - idx: 6
    text: 湯姆的姨媽叫他去把籬笆刷上油漆，「大太陽下揮汗刷油漆？」湯姆嘴裡嘀咕，心中滿是怨懟，刷得不甘不願。後來他靈機一動，把自己當作正在創作偉大壁畫的藝術家。他刷了幾下，就退後幾步，雙手的拇指和食指圍出一個正方形，瞇起眼睛，透過正方形欣賞自己的傑作，然後再上前刷幾筆。他全神投入，儼然是一位藝壇大師。果不其然，這種迷人的模樣，吸引了一位跟我有同樣毛病的小朋友，他認為湯姆的刷油漆工作，比他正在吃的蘋果有趣多了，就問：「湯姆，可不可以借我刷一下？」
  - idx: 7
    text: 「呃……可是我非常享受我的藝術創作呢。」湯姆連看都不看他一眼。「湯姆，拜託啦！要不然，這個蘋果給你，你借我刷一下好嗎？」小朋友一邊說，一邊把香氣逼人的大蘋果遞了過來。
  - idx: 8
    text: 湯姆終於同意小朋友用他的蘋果換了刷油漆的「權利」。然後，湯姆一再故技重施，成功讓幾個小朋友上鉤，不但一個下午就把籬笆的油漆刷完，手裡還多了一些彈珠和其他玩具。
  - idx: 9
    text: 啊哈，原來問題不在餅的大小，而在怎麼樣把手上的餅吃香一點。
  - idx: 10
    text: 現在朋友問我過得好不好，我的回答總是：「喔，超讚的！」犯小人，我說：「太精采了，這種經驗一百萬也買不到。」出國，回程飛機延誤，我說：「太棒了，還可以在國外多玩一天。」感染新冠病毒，我會說：「害我不能去工作，但在家裡看電視還能領薪水，我也很『困擾』啊！」呵呵，我猜別人都以為我拿到比較大塊的餅呢！
