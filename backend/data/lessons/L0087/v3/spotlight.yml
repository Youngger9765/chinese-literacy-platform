  section_subtitle_printed: 自我提問策略3--問好問題
  section_no_printed: 一
  section_no_note: 這個大題印的是「一」且排在最前面，後面的「讀全文-做記號」才又從「一」開始。見 sections_note。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，10 個）與橘色手寫的①②③代號
  structure_note: '⛔ 所有表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '自我提問策略：一邊讀、一邊問自己的讀書方法

      閱讀高手，讀書時不是一直往下讀；高手會在關鍵處停一下，問自己問題，並且回到文章中找線索檢查自己的理解。

      前兩課，我們已經練習過：讀完一小段，要停一下，問自己「這段主要在說什麼？」也練習過如何找出前後段落文字之間的關係。

      這一課，我們要再往前一步：閱讀時，不是每個地方都問同一個問題，而是要判斷自己需要理解什麼，再問自己一個最有幫助的問題。

      這一課，我們練習三個常用的自我提問。'
  - type: table
    prompt: 這一課，我們練習三個常用的自我提問。
    columns:
    - 常用的自我提問問題
    - 這樣問可以……
    - 卡住時，可以怎麼做？
    rows:
    - - ①這段主要在說什麼？
      - 確認我有沒有抓到重點
      - 圈出找能回答問題的關鍵詞句。
    - - ②這段和前面內容有什麼關係？
      - 有沒有把前後文連起來
      - 回看前面內容，找前後反差、接續發展、結果或疑問的回答。
    - - ③作者真正想告訴我們什麼？
      - 讀出作者想法或文章主旨
      - 回看標題、開頭、結尾，把幾段重點合起來想
    table_note: 這張三問對照表原稿印在概念框**裡面**（巢狀表格），此處拉到 blocks 最上層以免整片畫不出來。
  - type: guide
    text: 本課口訣：先抓主要內容→再串連前後文→最後讀出作者想法
  - type: guide
    text: 一、一邊讀，一邊問自己好問題
  - type: guide
    text: '右欄提問是提醒你，閱讀到關鍵處時，先停下來想一想。看到問題時，請做兩件事：

      ❶先在心裡回答這個問題。

      ❷在課文中，圈出可以支持你回答的句子或關鍵詞。'
  - type: fill_table
    prompt: 一、一邊讀，一邊問自己好問題
    columns:
    - 把手上的餅吃香一點
    - 自我提問
    table_note: '課文全文在這張表裡再印一次（帶「（段N）」前綴）。⚠️ 這一份與後半「讀全文-做記號」

      那一份**文字不完全相同**（七處差異，見 body.duplicate_copy_note）；本表照前半原樣抄。

      右欄的提問依版面對齊到左欄的段落群；最後一列「段10 第②問」在原稿是重複出現的

      （段9～10 已經問過第③問），照原稿保留。'
    rows:
    - 把手上的餅吃香一點: '（段1）小時候我有一個百思不解的問題。故事發生在物質缺乏的花蓮鄉下，小孩子很少有機會吃糖，見到糖果、餅乾都非常「餓鬼」（臺語「嘴饞」的意思），偏偏大人給糖時，都要我們小孩「公家吃」（臺語「一起吃」的意思），我可不是孔融(註)，公家吃是一件痛苦的事，尤其是在計較大小、多少的時候。

        （段2）姊姊大我三歲，我常常被迫和她分享同一個餅。因為我年紀小，大的要讓小的，所以祖母說：「姊姊你來分，弟弟先選。」等姊姊小心的把餅分成兩半以後，我就要更小心的選出比較大的那一半來。好不容易選好了，我和姊姊各持半邊餅，她捨不得馬上吃，寶貝似的捧在手上，一副心滿意足的樣子。

        （段3）看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒賴一下，就可以把餅換回來。真的換回來後，我立刻狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？'
      自我提問: '段1～3

        ①作者「百思不解的問題」是什麼？

        註：孔融是知名的東漢文學家，他小時候就會把食物讓給他的哥哥，得到眾人的稱讚。'
    - 把手上的餅吃香一點: （段4）類似的情況在生活中層出不窮。分組任務時，總是認為別人的任務比較輕鬆，自己的任務則是難如登天；我和同學都在看繪本，但別人手裡的書，看起來似乎比我的有趣多了；點餐，菜一上桌，我才發現隔壁桌點的脆皮炸雞似乎比我的麥香雞好吃；而且同學的家庭都特別溫暖，孩子不用做家事，就我的命最苦，每天都要洗衣服、洗碗、拖地。我總是邊做邊自怨自艾。
      自我提問: '段4

        ②這段和前面分餅的經驗有什麼關係？'
    - 把手上的餅吃香一點: '（段5）沒想到，是馬克‧吐溫幫我解決了這個問題。我在他的《湯姆歷險記》中，居然讀到這麼一段讓人醍醐灌頂的小故事。

        （段6）湯姆的姨媽叫他去把籬笆刷上油漆，「大太陽下揮汗刷油漆？」湯姆嘴裡嘀咕，心中滿是怨懟，刷得不甘不願。後來他靈機一動，把自己當作正在創作偉大壁畫的藝術家。他刷了幾下，就退後幾步，雙手的拇指和食指圍出一個正方形，瞇起眼睛，透過正方形欣賞自己的傑作，然後再上前刷幾筆。他全神投入，儼然是一位藝壇大師。果不其然，這種迷人的模樣，吸引了一位跟我有同樣毛病的小朋友，他認為湯姆的刷油漆工作，比他正在吃的蘋果有趣多了，就問：「湯姆，可不可以借我刷一下？」

        （段7）「呃……可是我非常享受我的藝術創作呢。」湯姆連看都不看他一眼。「湯姆，拜託啦！要不然，這個蘋果給你，你借我刷一下好嗎？」小朋友一邊說，一邊把香氣逼人的大蘋果遞了過來。

        （段8）湯姆終於同意小朋友用他的蘋果換了刷油漆的「權利」。然後，湯姆一再故技重施，成功的讓幾個小朋友上鉤，不但在一個下午就把籬笆的油漆刷完，手裡還多了一些彈珠和其他玩具。'
      自我提問: '段5～8

        第①問：這個故事在說什麼？

        第②問：這個故事和前面的問題有什麼關係？'
    - 把手上的餅吃香一點: '（段9）啊哈，原來問題不在餅的大小，而在怎麼把手上的餅吃香一點。

        （段10）現在朋友問我過得好不好，我的回答總是：「喔，超讚的！」犯小人，我說：「太精采了，這種經驗一百萬也買不到。」出國，回程飛機延誤，我說：「太棒了，還可以在國外多玩一天。」感染新冠病毒，我會說：「害我不能去工作，但在家裡看電視還能領薪水，我也很『困擾』啊！」呵呵，我猜別人都以為我拿到比較大塊的餅呢！'
      自我提問: '段9～10

        第③問：作者真正想告訴我們什麼？

        段10

        第②問：這個故事和前面的問題有什麼關係？'
