      - 湯姆很聰明，靠著「我享受刷籬笆的藝術」這招，不但讓別人為他刷籬笆，還換到蘋果和一些玩具。
    - - ②連回全文來看
      - 湯姆的故事讓作者發現：你若能珍惜、享受現狀，旁人會投來羨慕的眼光，你的生活滿意度也會因而提高。
  - type: single
