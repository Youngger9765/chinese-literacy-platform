spotlight:
  lesson: G7-L19
  strategy_name: 自我提問策略3-問好問題
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: '自我提問策略：一邊讀、一邊問自己的讀書方法

      閱讀高手，讀書時不是一直往下讀；高手會在關鍵處停一下，問自己問題，並且回到文章中找線索檢查自己的理解。

      前兩課，我們已經練習過：讀完一小段，要停一下，問自己「這段主要在說什麼？」也練習過如何找出前後段落文字之間的關係。

      這一課，我們要再往前一步：閱讀時，不是每個地方都問同一個問題，而是要判斷自己需要理解什麼，再問自己一個最有幫助的問題。

      這一課，我們練習三個常用的自我提問。

      本課口訣：先抓主要內容→再串連前後文→最後讀出作者想法'
  - type: guide
    text: 一、一邊讀，一邊問自己好問題
  - type: guide
    text: 右欄提問是提醒你，閱讀到關鍵處時，先停下來想一想。看到問題時，請做兩件事：
  - type: free_text
    prompt: ❶先在心裡回答這個問題。
  - type: free_text
    prompt: ❷在課文中，圈出可以支持你回答的句子或關鍵詞。
  - type: table
    rows:
    - - 把手上的餅吃香一點
      - 自我提問
    - - '（段1）小時候我有一個百思不解的問題。故事發生在物質缺乏的花蓮鄉下，小孩子很少有機會吃糖，見到糖果、餅乾都非常「餓鬼」（臺語「嘴饞」的意思），偏偏大人給糖時，都要我們小孩「公家吃」（臺語「一起吃」的意思），我可不是孔融(註)，公家吃是一件痛苦的事，尤其是在計較大小、多少的時候。

        （段2）姊姊大我三歲，我常常被迫和她分享同一個餅。因為我年紀小，大的要讓小的，所以祖母說：「姊姊你來分，弟弟先選。」等姊姊小心的把餅分成兩半以後，我就要更小心的選出比較大的那一半來。好不容易選好了，我和姊姊各持半邊餅，她捨不得馬上吃，寶貝似的捧在手上，一副心滿意足的樣子。

        （段3）看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒󠇡賴一下，就可以把餅換回來。真的換回來後，我立刻狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？

        （段4）類似的情況在生活中層出不窮。分組任務時，總是認為別人的任務比較輕鬆，自己的任務則是難如登天；我和同學都在看繪本，但別人手裡的書，看起來似乎比我的有趣多了；點餐，菜一上桌，我才發現隔壁桌點的脆皮炸雞似乎比我的麥香雞好吃；而且同學的家庭都特別溫暖，孩子不用做家事，就我的命最苦，每天都要洗衣服、洗碗、拖地。我總是邊做邊自怨自艾󠇡。

        （段5）沒想到，是馬克‧吐溫幫我解決了這個問題。我在他的《湯姆歷險記》中，居然讀到這麼一段讓人醍醐灌頂的小故事。

        （段6）湯姆的姨媽叫他去把籬笆刷上油漆，「大太陽下揮汗刷油漆？」湯姆嘴裡嘀咕，心中滿是怨懟，刷得不甘不願。後來他靈機一動，把自己當作正在創作偉大壁畫的藝術家。他刷了幾下，就退後幾步，雙手的拇指和食指圍出一個正方形，瞇起眼睛，透過正方形欣賞自己的傑作，然後再上前刷幾筆。他全神投入，儼然是一位藝壇大師。果不其然，這種迷人的模樣，吸引了一位跟我有同樣毛病的小朋友，他認為湯姆的刷油漆工作，比他正在吃的蘋果有趣多了，就問：「湯姆，可不可以借我刷一下？」

        （段7）「呃……可是我非常享受我的藝術創作呢。」湯姆連看都不看他一眼。「湯姆，拜託啦！要不然，這個蘋果給你，你借我刷一下好嗎？」小朋友一邊說，一邊把香氣逼人的大蘋果遞了過來。

        （段8）湯姆終於同意小朋友用他的蘋果換了刷油漆的「權利」。然後，湯姆一再故技重󠇡施，成功的讓幾個小朋友上鉤，不但在一個下午就把籬笆的油漆刷完，手裡還多了一些彈珠和其他玩具。

        （段9）啊哈，原來問題不在餅的大小，而在怎麼把手上的餅吃香一點。

        （段10）現在朋友問我過得好不好，我的回答總是：「喔，超讚的！」犯小人，我說：「太精采了，這種經驗一百萬也買不到。」出國，回程飛機延誤，我說：「太棒了，還可以在國外多玩一天。」感染新冠病毒，我會說：「害我不能去工作，但在家裡看電視還能領薪水，我也很『困擾』啊！」呵呵，我猜別人都以為我拿到比較大塊的餅呢！'
      - '段1～3

        ①作者「百思不解的問題」是什麼？


        註：孔融是知名的東漢文學家，他小時候就會把食物讓給他的哥哥，得到眾人的稱讚。









        段4

        ②這段和前面分餅的經驗有什麼關係？





        段5～8

        第①問：這個故事在說什麼？

        第②問：這個故事和前面的問題有什麼關係？















        段9～10

        第③問：作者真正想告訴我們什麼？

        段10

        第②問：這個故事和前面的問題有什麼關係？'
  - type: guide
    text: 提醒：只看問題不算完成自我提問；能找出文章線索，並回答問題，才表示你真的讀懂了
  - type: guide
    text: 二、先判斷：現在需要問哪一個問題
  - type: guide
    text: 閱讀時，先判斷閱讀任務，再選出最適合的自我提問。請把①②③填入【 】中。
  - type: single
    prompt: 自我提問小卡：①這裡主要在說什麼？
    options:
    - 這段和前面內容有什麼關係？
    - 作者真正想告訴我們什麼？
    answer: 這段和前面內容有什麼關係？
  - type: table
    rows:
    - - 閱讀任務
      - 我可以問自己①、②或③
    - - A.我讀完一段，細節很多，不知道哪一點最重要。
      - 【】
    - - B.我讀到「原來是」，想知道「原來是」之前和之後的文字有什麼關係。
      - 【】
    - - C.我讀完整篇文章，想知道作者為什麼寫這篇文章。
      - 【】
    answers:
    - ①
    - ②
    - ③
  - type: guide
    text: 三、比較看看：自我提問後，理解有什麼不同？
  - type: guide
    text: 請看第5–8段，作者寫湯姆刷油漆的故事。這段可以讀出兩層意思：
  - type: table
    rows:
    - - 理解層次
      - 可能讀出的意思
    - - ①只看故事本身
      - 湯姆很聰明，靠著「我享受刷籬笆的藝術」這招，不但讓別人為他刷籬笆，還換到蘋果和一些玩具。
    - - ②連回全文來看
      - 湯姆的故事讓作者發現：你若能珍惜、享受現狀，旁人會投來羨慕的眼光，你的生活滿意度也會因而提高。
  - type: single
    prompt: 1.你覺得課文的作者，希望告訴讀者的是哪一個層次呢？  □ ①     ②
    options:
    - 你覺得課文的作者，希望告訴讀者的是哪一個層次呢？
    - ①     ②
    answer: 你覺得課文的作者，希望告訴讀者的是哪一個層次呢？
  - type: single
    prompt: 2.對湯姆的故事，如果我的理解要從①提升到②，最需要問自己哪一個問題？
    options:
    - 這段主要在說什麼？
    - 這段（湯姆的故事）和前面內容有什麼關係？
    - 這段故事最有趣的地方是什麼？
    answer: 這段（湯姆的故事）和前面內容有什麼關係？
  - type: guide
    text: 四、小試身手：在關鍵處依需求問自己一個好問題
  - type: guide
    text: 步驟一：請照下表最左兩欄的說明，回頭再讀一次課文
  - type: guide
    text: 步驟二：在第三欄選一個最能說明該段文字的選項
  - type: guide
    text: 步驟三：在最右欄填上該段文字最適用的自我提問好問題（請填入①②③）
  - type: single
    prompt: 自我提問小卡：①這裡主要在說什麼？
    options:
    - 這段和前面內容有什麼關係？
    - 作者真正想告訴我們什麼？
    answer: 這段和前面內容有什麼關係？
  - type: fill_table
  - type: guide
    text: 五、換我試試看：少一點提示
  - type: guide
    text: 剛剛已經練習過，怎麼用自我提問讀出理解。現在提示變少了，請你自己判斷：讀到這裡時，哪一個自我提問的問題最能幫助理解？選完後，再勾選這個問題幫你做了什麼。（請參考自我提問小卡）
  - type: guide
    text: 六、我的發現與自我檢核
  - type: free_text
    prompt: 1.我的發現：
  - type: guide
    text: 做完上面的練習後，請選出「自我提問策略」的功能：
  - type: single
    prompt: 請選擇
    options:
    - 自我提問是在讀不懂時使用；如果看懂文字，就不用再問。
    - 自我提問可以幫自己抓段落內容、連結前後文，讀出作者想法。
    answer: 自我提問是在讀不懂時使用；如果看懂文字，就不用再問。
  - type: free_text
    prompt: 2.自我檢核
  - type: multi
    prompt: 請選擇
    options:
    - 我知道自我提問不是每一句都問，而是在重要地方停一下問自己。
    - 我會依照閱讀任務，選出適合的問題問自己。
    - 我會用自我提問幫自己抓住主要內容、連結前後文，或讀出作者想法。
    - 當我答不出來時，我會回到文章找線索，而不是直接猜答案。
    - 我以後閱讀時，會想要試著使用自我提問的策略。
    answer:
    - 我知道自我提問不是每一句都問，而是在重要地方停一下問自己。
    - 我會依照閱讀任務，選出適合的問題問自己。
    - 我會用自我提問幫自己抓住主要內容、連結前後文，或讀出作者想法。
    - 當我答不出來時，我會回到文章找線索，而不是直接猜答案。
    - 我以後閱讀時，會想要試著使用自我提問的策略。
  - type: guide
    text: 接下來做什麼？
  - type: guide
    text: 恭喜你完成「自我提問策略」的練習了。
  - type: single
    prompt: 請選擇
    options:
    - 已經學過這篇課文：可以跳過後面的學習單，進入下一課。
    - 沒學過這篇課文：請繼續做後面的學習單，從「讀全文－做記號」開始。
    answer: 已經學過這篇課文：可以跳過後面的學習單，進入下一課。
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：自我提問策略3
  - type: guide
    text: ◎ 我的表現
  - type: free_text
    prompt: (1)    難如登天    ：形容非常困難，像登天一樣困難。
  - type: free_text
    prompt: (2)    嘀咕        ：小聲說話，常帶有抱怨、不滿或懷疑的語氣。
  - type: free_text
    prompt: (3)    怨懟        ：心裡怨恨、不滿。
  - type: free_text
    prompt: (4)    慢條斯理    ：形容說話或做事從容緩慢、不慌不忙。
  - type: free_text
    prompt: (5)    自怨自艾    ：因為事情不順利而埋怨、責備自己，心情低落。
  - type: free_text
    prompt: (6)    儼然        ：好像、很像。
  - type: free_text
    prompt: (7)   嘴饞         ：看到或想到好吃的東西，就很想吃。
  - type: free_text
    prompt: (8)   撒賴          ：賴皮、不講道理。
  - type: free_text
    prompt: (9)    醍醐灌頂     ：受到很大的啟發，突然明白重要的道理。「醍醐」原指從牛奶提煉出的精華，佛教用來比喻智慧。
  - type: free_text
    prompt: (10)    故技重施    ：再次使用以前用過的同一種手段或方法。
  - type: free_text
    prompt: (11)    層出不窮    ：接連不斷的出現，好像沒有盡頭。「窮」是盡頭的意思。
  - type: free_text
    prompt: (12)    百思不解    ：經過反覆思考，還是不能了解。
  - type: free_text
    prompt: (13)   犯小人       ：遇到故意要害你的人。
  - type: free_text
    prompt: (1)教練要小夫每天多練習半小時，小夫不滿的(  Ｂ  )幾句，讓教練大發雷霆。
  - type: free_text
    prompt: (2)他向來小氣，你想要他請你吃東西，簡直就(  Ｄ  )。
  - type: free_text
    prompt: (3)詐騙集團騙人的手法不斷更新，被騙的案例(  Ｃ  )，大家應該多加小心。
  - type: free_text
    prompt: (4)她總是認為自己受到了不公平的對待，因此內心充滿了 (  Ｆ  )。
  - type: free_text
    prompt: (5)集合時間快要到了，同組的同學們還(  Ｈ  )的收拾行李，讓我好著急。
  - type: free_text
    prompt: (6)胖虎站在新歌發表會的舞台上，表情十分自信，(  Ｇ  )就是一位大歌星。
  - type: free_text
    prompt: (7) 輸球後，他一直(  Ｅ  )，責怪自己當天出現大失誤，因而與冠軍擦肩而過。
  - type: free_text
    prompt: (8)我們本來是無話不談的好朋友，為什麼她突然變得冷淡，這讓我(  Ａ  )。
  - type: fill_table
