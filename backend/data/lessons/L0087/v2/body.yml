source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 閱讀高手，讀書時不是一直往下讀；高手會在關鍵處停一下，問自己問題，並且回到文章中找線索檢查自己的理解。
- 前兩課，我們已經練習過：讀完一小段，要停一下，問自己「這段主要在說什麼？」也練習過如何找出前後段落文字之間的關係。
- 這一課，我們要再往前一步：閱讀時，不是每個地方都問同一個問題，而是要判斷自己需要理解什麼，再問自己一個最有幫助的問題。
- （段1）小時候我有一個百思不解的問題。故事發生在物質缺乏的花蓮鄉下，小孩子很少有機會吃糖，見到糖果、餅乾都非常「餓鬼」（臺語「嘴饞」的意思），偏偏大人給糖時，都要我們小孩「公家吃」（臺語「一起吃」的意思），我可不是孔融(註)，公家吃是一件痛苦的事，尤其是在計較大小、多少的時候。
- （段2）姊姊大我三歲，我常常被迫和她分享同一個餅。因為我年紀小，大的要讓小的，所以祖母說：「姊姊你來分，弟弟先選。」等姊姊小心的把餅分成兩半以後，我就要更小心的選出比較大的那一半來。好不容易選好了，我和姊姊各持半邊餅，她捨不得馬上吃，寶貝似的捧在手上，一副心滿意足的樣子。
- （段3）看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒󠇡賴一下，就可以把餅換回來。真的換回來後，我立刻狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？
- （段4）類似的情況在生活中層出不窮。分組任務時，總是認為別人的任務比較輕鬆，自己的任務則是難如登天；我和同學都在看繪本，但別人手裡的書，看起來似乎比我的有趣多了；點餐，菜一上桌，我才發現隔壁桌點的脆皮炸雞似乎比我的麥香雞好吃；而且同學的家庭都特別溫暖，孩子不用做家事，就我的命最苦，每天都要洗衣服、洗碗、拖地。我總是邊做邊自怨自艾󠇡。
- （段5）沒想到，是馬克‧吐溫幫我解決了這個問題。我在他的《湯姆歷險記》中，居然讀到這麼一段讓人醍醐灌頂的小故事。
- （段6）湯姆的姨媽叫他去把籬笆刷上油漆，「大太陽下揮汗刷油漆？」湯姆嘴裡嘀咕，心中滿是怨懟，刷得不甘不願。後來他靈機一動，把自己當作正在創作偉大壁畫的藝術家。他刷了幾下，就退後幾步，雙手的拇指和食指圍出一個正方形，瞇起眼睛，透過正方形欣賞自己的傑作，然後再上前刷幾筆。他全神投入，儼然是一位藝壇大師。果不其然，這種迷人的模樣，吸引了一位跟我有同樣毛病的小朋友，他認為湯姆的刷油漆工作，比他正在吃的蘋果有趣多了，就問：「湯姆，可不可以借我刷一下？」
- （段7）「呃……可是我非常享受我的藝術創作呢。」湯姆連看都不看他一眼。「湯姆，拜託啦！要不然，這個蘋果給你，你借我刷一下好嗎？」小朋友一邊說，一邊把香氣逼人的大蘋果遞了過來。
- （段8）湯姆終於同意小朋友用他的蘋果換了刷油漆的「權利」。然後，湯姆一再故技重󠇡施，成功的讓幾個小朋友上鉤，不但在一個下午就把籬笆的油漆刷完，手裡還多了一些彈珠和其他玩具。
- （段10）現在朋友問我過得好不好，我的回答總是：「喔，超讚的！」犯小人，我說：「太精采了，這種經驗一百萬也買不到。」出國，回程飛機延誤，我說：「太棒了，還可以在國外多玩一天。」感染新冠病毒，我會說：「害我不能去工作，但在家裡看電視還能領薪水，我也很『困擾』啊！」呵呵，我猜別人都以為我拿到比較大塊的餅呢！
- 湯姆的故事讓作者發現：你若能珍惜、享受現狀，旁人會投來羨慕的眼光，你的生活滿意度也會因而提高。
- 剛剛已經練習過，怎麼用自我提問讀出理解。現在提示變少了，請你自己判斷：讀到這裡時，哪一個自我提問的問題最能幫助理解？選完後，再勾選這個問題幫你做了什麼。（請參考自我提問小卡）
