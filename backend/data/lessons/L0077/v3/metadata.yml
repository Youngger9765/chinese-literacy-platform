_總表_對照note: '🔴 總表列了 13 個語詞，但**學習單上沒有任何語詞大題**（沒有語詞框、沒有第三/四/八大題）。

  那 13 個詞全部出現在課文正文裡（敢怒不敢言、剃度、抱頭鼠竄、囑咐、萬紫千紅、暑氣蒸人、

  金風送爽、寒氣逼人、滴水穿石、循序漸進、身材魁梧、帥氣挺拔、惡言相向 —— 逐一核對過），

  但**沒有被做成練習**。這是「來源缺料」不是「有料沒抽到」：教材本身就沒印那幾節。

  同一課名在總表出現 6 次（4年級L2、5/6/7/8/9年級的 L0），第六大題標題只有 4年級L2 那列有值

  （找出故事道理）；G7-L0 這列是空白，故 `_總表_第六大題標題: null`。'
