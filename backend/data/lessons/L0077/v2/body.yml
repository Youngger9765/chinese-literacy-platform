source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 大約在兩百年前，日本 奈良有一個叫正太的男孩，在市集裡幫媽媽賣菜。有兩個腰間掛著長刀的惡霸，經常來這裡欺負農民，跟小攤子收保護費。交不出錢來，就翻人家的菜攤，農民們都敢怒不敢言。有一天，來了一個僧人，身材瘦削󠇡的他，居然敢為農民們打抱不平。兩惡霸不但惡言相向，講沒兩句，居然動起手來。但這位僧人是興福寺裡的武僧，功夫了󠇡得，他以一敵二，兩三下就把帶著武器的惡霸打得抱頭鼠竄。旁觀的正太又是害怕，又是佩服，心想：「有一天，我也要去以武術聞名的興福寺學武功。」
- 正太十四歲時終於進到興福寺，剃度成為小和尚。可是負責教他的師父並沒有教他武功，只是給他一頭小豬，比貓還要小，囑咐他說：「這是你的小豬，養在菜園後面的豬圈󠇡。每天三餐之後，你要把這隻小豬從菜園抱到廚房，餵牠吃廚餘。吃飽了，你再把牠抱回豬圈，這樣明白了嗎？」
- 但他心裡不高興，私下嘀咕著說：「不教我武功就算了，還要叫我養豬？要從平地的豬圈走到半山腰的廚房？」可是他也沒辦法，誰叫他是全寺最菜的人呢，只好照做了。
- 從此，每天三次，正太要去豬圈抱小豬，走到廚房要經過200級的階梯，再跨過20道很高的門檻，等豬吃飽了，他再抱著豬走回去。
- 經過了萬紫千紅的春天，暑氣蒸人的夏天，金風送爽的秋天，寒氣逼人的冬天。正太每天抱著豬上上下下。一天又一天，一年又一年，小豬慢慢長大，小豬變中豬，中豬變大豬了。
- 這時正太也長大了，他變得非常強壯，每天抱著這80公斤的大豬，上下200級階梯，來回20道門檻，一點都不成問題。
