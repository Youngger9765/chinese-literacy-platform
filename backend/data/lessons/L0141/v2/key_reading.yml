passage: 福衛八號是一套由8顆光學遙測衛星組成的「衛星星系」，從2025年起逐年發射，到2031年全部就位，形成一套縝密周延的觀測系統。這些衛星會在地球上空約561公里的太陽同步軌道運行，彼此分工合作、相互接力，就像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區的上空拍攝。
