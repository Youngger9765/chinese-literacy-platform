passage: '福衛八號是一套由8顆光學遙測衛星組成的「衛星星系」，從2025年起逐年發射，到2031年全部就位，形成一套縝密周延的觀測系統。這些衛星會在地球上空約561公里的太陽同步軌道運行，彼此分工合作、相互接力，就像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區的上空拍攝。

  它們的速度比子彈快，一秒鐘可以跑7.5公里，比方程式賽車快73倍，即使如此，仍需90到100分鐘才能繞過臺灣上空一次。只有一顆衛星時，如果發生重大災難（如2025年花蓮馬太鞍溪堰塞湖潰決造成光復鄉災情），要再次拍到同一地點，仍必須等待好一段時間；星系完成後，觀測間隔將大幅縮短，能更快取得影像。不僅如此，它們的「視力」也大幅提升，拍攝影像的解析度比以往的衛星更高，可以清楚看見災區地形、道路、建築、農田等地表細節，'
