  - label: 衛星任務首部曲(段1～2)
    value: 「福衛八號」計畫的首顆衛星-__成功抵達外太空，且回傳了訊息。
    blanks:
    - answer: 齊柏林號
      hint: ''
  - label: 太空中的巡邏隊(段3～4)
    value: '1.福衛八號是一套由__光學遙測衛星組成的「衛星星系」。輪流飛過臺灣和周邊地區拍攝。

      2.飛行速度很__。

      3.星系完成後__大幅縮短，能更快取得影像。

      4.__提升，能看清災區地形、道路、建築、農田等細節。'
    blanks:
    - answer: 8顆
      hint: ''
    - answer: 快
      hint: ''
    - answer: 觀測間隔
      hint: ''
    - answer: 解析度
      hint: ''
  - label: 沒有重來的按鈕(段5～6)
    value: '1.送衛星上天挑戰大，一旦__，沒有第二次機會。

      2.太空環境非常__，因此，衛星發射前，必須先在地面做無數次的__。'
    blanks:
    - answer: 失誤
      hint: ''
    - answer: 嚴酷
      hint: ''
    - answer: 模擬測試
      hint: ''
  - label: 星光背後的二十年(段7)
    value: '1.福衛八號有許多關鍵__，由臺灣團隊研發製造。

      2.二十年的累積，臺灣終於能自己製造衛星。'
    blanks:
    - answer: 零件
      hint: ''
  - label: 齊柏林衛星守望臺灣(段8)
    value: 齊柏林導演生前透過空拍鏡頭，拍下了《看見台灣》。這顆衛星繼承齊柏林的眼睛，讓__的精神在高空延續。
    blanks:
    - answer: 守望臺灣
      hint: ''
  - label: 一起守護家園(段9)
    value: 衛星為我們守望家園，你可以成為那個__的人。
    blanks:
    - answer: 看見臺灣、珍惜臺灣
      hint: ''
  title: 臺灣的太空之眼
