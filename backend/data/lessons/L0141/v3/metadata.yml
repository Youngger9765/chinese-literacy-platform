strategy_explained: '這一課要練習的，是怎麼從課文裡面的小標題，快速抓到它想講的重要細節

  這篇介紹台灣太空科技，像是「福衛八號」衛星計畫，內容很多，但裡面有小標題，就像是文章的指引，可以幫你快速找到關於衛星發射、觀測能力，還有台灣自主研發技術的關鍵資訊

  讀的時候，你可以試著先看小標題，然後再讀它下面那段內容，看看小標題是不是真的能幫助你理解這段在說什麼重點喔'
