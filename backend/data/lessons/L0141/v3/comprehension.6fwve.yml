section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 本文第三段：衛星「像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區拍攝」，主要想強調什麼？
    options:
      A: 衛星會像警車一樣巡邏，監控違法人車
      B: 衛星輪班接力，能快速、持續提供觀測
      C: 衛星能夠合作拍攝廣大的地球表面區域
      D: 衛星日夜不休，需設法提供休息的時間
    explanation_absent_note: 本題原稿沒有解析框（其餘四題都有）
  - index: 2
    answer: C
    answer_printed_form_note: 原稿印全形Ｃ
    stem: 課文第七段：「衛星關鍵零件，是臺灣團隊研發製造的，代表我們不必仰人鼻息。」這段最想強調什麼？
    options:
      A: 零件自己做，維修與替換更快，災害來時更能即時應變
      B: 零件自己做，系統更穩更精準，因此影像解析度會提升
      C: 關鍵技術自主程度提高，不必完全受制於其他國家
      D: 零件自己做，成本下降，未來發射衛星就可以更省錢
    explanation: 「不必仰人鼻息」指的是主導權與自主性：不必看別人臉色、受他人限制。
    explanation_placement_note: 印在題目左側的獨立文字方塊（藍框），是教師版解析
  - index: 3
    answer: B
    answer_printed_form_note: 原稿印全形Ｂ
    stem: 如果要把第三段「太空中的巡邏隊」的內容，整理成一條清楚的因果鏈，下列哪一個最符合？
    options:
      A: 衛星速度很快→很快回到同地點→單顆就能即時掌握災情
      B: 多顆衛星接力→觀測間隔縮短→影像更快取得，有助於救災
      C: 解析度大幅提升→觀測間隔縮短→能用更少的經費攝影
      D: 關鍵零件在地製造→衛星更耐輻射震動→遇到隕石也不怕
    options_note: 四個選項裡的「→」是一般文字字元（不是 Wingdings 符號），照原樣保留
    explanation: 課文重點是「多顆星系接力」帶來「觀測更頻繁、影像取得更快」，並能支援災害監測與掌握。
    explanation_placement_note: 印在題目左側的獨立文字方塊（藍框），是教師版解析
  - index: 4
    answer: B
    answer_printed_form_note: 原稿印全形Ｂ
    stem: 本文把衛星說成「巡邏隊」「千里眼」，又說「繼承了他的眼睛」，這些寫作手法最主要的作用是什麼？
    options:
      A: 用誇張比喻製造緊張氣氛，讓讀者覺得太空很可怕
      B: 用具體比喻解說科技，凸顯「看見／守望」的主題
      C: 用擬人法強調衛星像人一樣有感情，會主動做判斷
      D: 用各種比喻說明現代科技已經複製了齊導演的眼力
    explanation: 這些都是比喻與意象。作者用熟悉的形象（巡邏、眼睛、千里眼）把抽象的「觀測系統、解析度、守望」轉為可想像的畫面，降低理解門檻，並強化「看見臺灣」的主軸。
    explanation_placement_note: 印在題目右側的獨立文字方塊（藍框），是教師版解析
  - index: 5
    answer: B
    stem: 這篇文章最主要想表達的核心主旨是什麼？
    options:
      A: 即使臺灣可自製人造衛星，仍需仰賴SpaceX的火箭技術
      B: 高自製率的福衛八號星系功能提升，更能以太空科技守望家園
      C: 衛星上的工作，一出錯就覆水難收，需要縝密周延的規劃
      D: 齊柏林導演的生前作品很感人，應該用人造衛星紀念他
    explanation: (全文從發射現場切入，介紹星系運作與提升，再談太空任務的難度、臺灣災害背景，最後連到「看見臺灣、珍惜臺灣」。重點是「衛星星系的公共價值」與「守護家園的意義」，不是在歌頌火箭公司或只談齊柏林作品。
    explanation_note: 這個解析框只有開括號沒有關括號，原稿如此
    explanation_placement_note: '⚠️ 印在 PDF p9 的獨立文字方塊（藍框），與選項 D、第八大題的標題疊印在一起，

      看起來像版面壞掉。document.xml 的文字流是完整乾淨的，本欄以文字層為準。'
