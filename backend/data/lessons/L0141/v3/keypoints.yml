lesson_uid: L0141
version_id: v3
section_no: 六
keypoints:
  title: 臺灣的太空之眼
  layout: list
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  layout_note: '六列都是「左標題 + 右內容」，沒有欄位表頭 → list。

    左欄是課文的五個小標題（第一列另立「衛星任務首部曲」，那是重點表自己加的，

    課文沒有這個小標），每個標題底下另起一行印段落範圍。'
  rows:
  - label: '衛星任務首部曲

      (段1～2)'
    value: 「福衛八號」計畫的首顆衛星-【　】成功抵達外太空，且回傳了訊息。
    blanks:
    - answer: 齊柏林號
  - label: '太空中的巡邏隊

      (段3～4)'
    value: '1.福衛八號是一套由【　】光學遙測衛星組成的「衛星星系」。輪流飛過臺灣和周邊地區拍攝。

      2.飛行速度很【　】。

      3.星系完成後【　】大幅縮短，能更快取得影像。

      4.【　】提升，能看清災區地形、道路、建築、農田等細節。'
    blanks:
    - answer: 8顆
    - answer: 快
    - answer: 觀測間隔
    - answer: 解析度
  - label: '沒有重來的按鈕

      (段5～6)'
    value: '1.送衛星上天挑戰大，一旦【　】，沒有第二次機會。

      2.太空環境非常【　】，因此，衛星發射前，必須先在地面做無數次的【　】。'
    blanks:
    - answer: 失誤
    - answer: 嚴酷
    - answer: 模擬測試
    label_note: 重點表寫「沒有重來的按鈕」，課文小標是「沒有「重來」的按鈕」（帶引號）—— 照各自原樣
  - label: '星光背後的二十年

      (段7)'
    value: '1.福衛八號有許多關鍵【　】，由臺灣團隊研發製造。

      2.二十年的累積，臺灣終於能自己製造衛星。'
    blanks:
    - answer: 零件
  - label: '齊柏林衛星守望臺灣

      (段8)'
    value: 齊柏林導演生前透過空拍鏡頭，拍下了《看見台灣》。這顆衛星繼承齊柏林的眼睛，讓【　】的精神在高空延續。
    blanks:
    - answer: 守望臺灣
  - label: '一起守護家園

      (段9)'
    value: 衛星為我們守望家園，你可以成為那個【　】的人。
    blanks:
    - answer: 看見臺灣、珍惜臺灣
    label_note: 重點表寫「一起守護家園」，課文小標是「守護家園，也有你一份」—— 照各自原樣
