  - after_paragraph: 7
    text: 齊柏林衛星守望臺灣
  - after_paragraph: 8
    text: 守護家園，也有你一份
  footnotes:
  - index: 1
    text: 臺灣雖然可以自製衛星，但仍需向美國購買SpaceX的火箭服務，把衛星送上太空。
    attached_to_paragraph: 2
