passage: '構樹葉片像手掌，果實橘紅，樹皮纖維可拉成長絲。在許多臺灣原住民族文化中，構樹樹皮布是重要的衣物與儀式材料，木材可製作工具，枝葉也可能在祭典中扮演要角。更耐人尋味的是，人類學者發現：在許多南島語族的社群中，都能看到構樹的身影——有人用它製作樹皮布，有人用來綁繩、包覆器具，而且構樹製品在祭儀中往往舉足輕重。這讓研究者追問：若南島語族真的是從臺灣出發，各島上的構樹會不會也是祖先一路帶出去的？

  為了追查這個可能性，人類學家找來植物學家合作，展開一項像「科學偵探」的研究：從多國蒐集南島語族早期的構樹歷史樣本與文物纖維，如博物館裡數百年前的樹皮布、繩索與工藝品纖維，抽取DNA來追蹤構樹的「家族旅程」。他們特別使用古老文物，是因為今日各島活著的構樹可能是近代才隨船隻或飛機被帶去的，若直接拿來當證據，可能造成誤判。'
