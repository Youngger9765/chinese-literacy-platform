passage: 研究背後的推理很簡單：若構樹由臺灣向外擴散，臺灣的「基因型態」種類應該最多。第一批祖先帶著構樹從臺灣航向A島時，只能帶出少數的基因型態；在A島生活一段時間後，又有人移居到B島，所帶走的構樹基因型態更少。換句話說，基因多樣性會呈現「源頭最多、往外逐層遞減」的現象。這就像笑話從A傳給B，再傳給C、D：A的笑話版本一定最完整，傳到Ｄ時，往往就掛一漏萬、支離破碎了。生物遷移時，基因多樣性也會出現類似現象——源頭基因多樣性最高，越末端基因多樣性就會越單純。
