spotlight:
  lesson: G9-L4
  strategy_name: 科學推理策略-研究結果支持假說嗎？
  strategy_type: unknown
  blocks:
  - type: guide
    text: 有些說明文，就像一則「科學偵探故事」。作者會提出他關切的問題，但不會一開始就給你答案，而是帶你走過一段推理歷程，最後得到結論：
  - type: free_text
    prompt: ❶先提出一個研究問題（這問題太重要或太有趣了，是怎麼回事？
  - type: guide
    text: ❷再提出一個假設／假說（我推測答案可能是……）
  - type: free_text
    prompt: ❸接著收集證據驗證假說（怎麼查？
  - type: guide
    text: '❹最後得到結論（證據有沒有支持❷的假設？）

      讀這類文章時，重點是看懂：「證據是否能支持（或推翻）假設。」

      「構樹」這篇文章，正是一段帶領讀者進行科學推理的過程。作者以「南島祖先可能從臺灣出發（出臺灣說）」為假說，透過植物──構樹的 DNA證據，一步步檢驗這個想法是否站得住腳。

      我們要練習用底下的4個步驟，看懂一個科學假說是如何被驗證的。

      【❶找問題】【❷提假說】【❸看驗證】【❹下結論】'
  - type: guide
    text: 表：本課的科學討論四步驟：問題→假說→驗證→結論
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 1.請依序寫出本課使用的科學探究四步驟
  - type: passage
    source: unknown
    paragraphs:
    - 【❶找 問題    】【❷找 假說   】【❸看 驗證   】【❹下結論   】
  - type: self_check
    items:
    - 我能分辨作者提出的假說，並知道它是「需要被驗證的想法」，不是結論。
    - 我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
