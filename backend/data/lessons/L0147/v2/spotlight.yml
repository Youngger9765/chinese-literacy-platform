spotlight:
  lesson: G9-L4
  strategy_name: 科學推理策略-研究結果支持假說嗎？
  strategy_type: unknown
  blocks:
  - type: guide
    text: 有些說明文，就像一則「科學偵探故事」。作者會提出他關切的問題，但不會一開始就給你答案，而是帶你走過一段推理歷程，最後得到結論：
  - type: free_text
    prompt: ❶先提出一個研究問題（這問題太重要或太有趣了，是怎麼回事？
  - type: guide
    text: ❷再提出一個假設／假說（我推測答案可能是……）
  - type: free_text
    prompt: ❸接著收集證據驗證假說（怎麼查？
  - type: guide
    text: '❹最後得到結論（證據有沒有支持❷的假設？）

      讀這類文章時，重點是看懂：「證據是否能支持（或推翻）假設。」

      「構樹」這篇文章，正是一段帶領讀者進行科學推理的過程。作者以「南島祖先可能從臺灣出發（出臺灣說）」為假說，透過植物──構樹的 DNA證據，一步步檢驗這個想法是否站得住腳。

      我們要練習用底下的4個步驟，看懂一個科學假說是如何被驗證的。

      【❶找問題】【❷提假說】【❸看驗證】【❹下結論】'
  - type: guide
    text: 表：本課的科學討論四步驟：問題→假說→驗證→結論
  - type: table
    rows:
    - - 步驟
      - 關鍵判斷或提示
      - 根據判斷，勾選最符合的一項
    - - '❶

        問題'
      - 文章主要在追問哪一個問題？
      - '①南島語族如果有共同的源頭，這個「共同的故鄉」可能在哪裡？

        □②南島語族分布在不同島嶼，它們在地球上分布的範圍有多廣？'
    - - '❷

        假說'
      - '推測性的答案、暫時性的答案

        (關鍵詞：可能、推論、會不會)'
      - '□①南島語族可能最早是從菲律賓出發的

        ②南島語族可能最早是從臺灣出發的

        □③南島語族可能最早是從印尼出發的'
    - - '❸

        驗證'
      - 怎麼查？查到什麼？結果符不符合推測？
      - 'A.方法：怎麼查？

        ①研究者從多國蒐集早期的構樹文物，抽取DNA來追蹤構樹的「家族旅程」

        □②從多國蒐集今日活著的構樹，比較葉片、果實和樹皮的外形

        B.理由：為何這樣查？

        □①使用早期構樹文物，因為保存時間較久，外觀與形態更完整

        ②不用今日各島活著的構樹，因為它們可能是近代才被帶去，會造成誤判

        C.預測：若假說正確，應該看到什麼？

        ①若構樹由臺灣擴散出去，臺灣的基因型態的多樣性應該最高

        □②若構樹由臺灣擴散出去，臺灣的基因型態的多樣性應該最低

        D.結果：科學家找到什麼？

        ①臺灣的構樹基因多樣性最高；菲律賓、印尼較低；太平洋群島更低

        □②臺灣的構樹基因多樣性最低；菲律賓、印尼較高；太平洋群島更高

        E.結果符合假說的預測嗎？

        □①不相符：證據不支持假說，結果與預測方向相反

        ②相符：結果符合「出臺灣說」的預測'
    - - '❹

        結論'
      - 收集的證據是否支持「出臺灣說」？
      - '①構樹 DNA多樣性的研究結果支持「出臺灣說」，並和語言學、考古學證據相互呼應。

        □②構樹 DNA多樣性的研究結果不支持「出臺灣說」'
  - type: free_text
    prompt: 1.請依序寫出本課使用的科學探究四步驟
  - type: passage
    source: unknown
    paragraphs:
    - 【❶找 問題    】【❷找 假說   】【❸看 驗證   】【❹下結論   】
  - type: self_check
    items:
    - 我能分辨作者提出的假說，並知道它是「需要被驗證的想法」，不是結論。
    - 我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
