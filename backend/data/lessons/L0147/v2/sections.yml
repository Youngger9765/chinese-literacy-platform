comprehension:
  questions:
  - index: 2
    answer: B
    stem: 第五段中，研究者在進行 DNA 分析前，其實已經隱含一個「可檢驗的預測」。下列哪一項最接近這個預測內容？
    options:
      A: 南島人口必然很多，經濟實力不容忽視，應受看重
      B: 南島天各一方，卻有相似的語言文化，太有趣了
      C: 距離太遠必定隔絕，所以語言和文化不可能相像
      D: 各島分布這麼遠，才能說明科學家的研究有多困難
    rationale: 距離數據用來強化「範圍廣闊卻仍相似」的張力，讓「共同源頭在哪」變得更值得追問。
  - index: 4
    answer: D
    stem: 依文章的推理方式，如果某島的構樹 DNA「基因型態很少」，最可能代表什麼？
    options:
      A: 該島的構樹完全沒有被人類汙染過
      C: 該島一定是構樹最早出現的源頭
      D: 該島可能位在遷徙路徑較末端的位置
    rationale: 文章的推理是「源頭最多、往外逐層遞減」，越往外（越末端）多樣性越低。
  - index: 5
    answer: C
    stem: 根據課文第六段，支持「南島語族可能從臺灣出發（出臺灣說）」的「多面向證據」包括哪些？
    options:
      A: 臺灣的地理位置、南島語族的分布範圍，及海洋交通的便利性
      B: 構樹的分布情形、南島語族的文化活動，及島嶼的自然環境
      C: 構樹 DNA 的研究結果、南島語族語言的相似性，及文化證據
      D: 南島語族遷徙的距離、各島嶼的氣候條件，及航海技術的發展
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 0
    verdict: ok
