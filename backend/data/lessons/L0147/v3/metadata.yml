strategy_explained: 這一課我們一起練習「從課文裡找線索，推理背後的故事」的能力，這篇文章透過構樹這種植物，說明了南島語族怎麼從臺灣遷徙出去，就像在玩偵探遊戲，我們要看看作者怎麼用構樹的
  DNA 證據，一步步證明「出臺灣說」不是隨便說說，閱讀時可以試著找出作者提出哪些「物證」，以及這些證物跟「出臺灣說」之間的關聯是什麼
