intro: 這篇文章介紹了南島語族廣泛的分布範圍，以及科學家推測他們可能源自共同祖先，並透過航海技術遷徙到世界各地。其中，「出臺灣說」是關於南島語族起源的代表性假說。過去，此假說主要依賴語言和文化的相似性，近年來，研究者發現了意想不到的「植物證據」，也就是隨處可見的構樹。文章探討了構樹在南島語族文化中的重要性，以及透過DNA分析構樹的基因多樣性，如何支持南島語族起源於臺灣的說法，並與其他學術研究相互印證。
notes:
