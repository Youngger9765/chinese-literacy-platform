section_no: 五
spotlight:
  strategy_name: 科學推理策略—研究結果支持假說
  blocks:
  - type: concept_box
    text: '有些說明文，就像一則「科學偵探故事」。作者會提出他關切的問題，但不會一開始就給你答案，而是帶你走過一段推理歷程，最後得到結論：

      ❶先提出一個研究問題（這問題太重要或太有趣了，是怎麼回事？）

      ❷再提出一個假設／假說（我推測答案可能是……）

      ❸接著收集證據驗證假說（怎麼查？查到什麼？結果符不符合推測？）

      ❹最後得到結論（證據有沒有支持❷的假設？）

      讀這類文章時，重點是看懂：「證據是否能支持（或推翻）假設。」

      「構樹」這篇文章，正是一段帶領讀者進行科學推理的過程。作者以「南島祖先可能從臺灣出發（出臺灣說）」為假說，透過植物──構樹的 DNA證據，一步步檢驗這個想法是否站得住腳。

      我們要練習用底下的4個步驟，看懂一個科學假說是如何被驗證的。

      【❶找問題】

      【❷提假說】

      【❸看驗證】

      【❹下結論】'
    arrow_note: '最後四行在原稿印成**一行**：【❶找問題】→【❷提假說】→【❸看驗證】→【❹下結論】，

      三個「→」是 `w:sym Wingdings F0E0` **符號**（沒有 w:t）。

      依 SKILL 規則，符號箭號前後斷行 → 拆成四行的流程步驟。'
  - type: guide
    text: 表：本課的科學討論四步驟：問題→假說→驗證→結論
    arrow_note: '這一行的三個「→」是**字面**字元（U+2192），在句內、**保留原位不斷行** ——

      與上一個 block 的符號箭號是不同東西，PDF 上卻長得一樣。'
  - type: fill_table
    columns:
    - 步驟
    - 關鍵判斷或提示
    - 根據判斷，勾選最符合的一項
    rows:
    - 步驟: ❶問題
      關鍵判斷或提示: 文章主要在追問哪一個問題？
      根據判斷，勾選最符合的一項:
      - ①南島語族如果有共同的源頭，這個「共同的故鄉」可能在哪裡？
      - ②南島語族分布在不同島嶼，它們在地球上分布的範圍有多廣？
      根據判斷，勾選最符合的一項_answer: 1
    - 步驟: ❷假說
      關鍵判斷或提示: '推測性的答案、暫時性的答案

        (關鍵詞：可能、推論、會不會)'
      根據判斷，勾選最符合的一項:
      - ①南島語族可能最早是從菲律賓出發的
      - ②南島語族可能最早是從臺灣出發的
      - ③南島語族可能最早是從印尼出發的
      根據判斷，勾選最符合的一項_answer: 2
    - 步驟: ❸驗證
      關鍵判斷或提示: 怎麼查？查到什麼？結果符不符合推測？
      根據判斷，勾選最符合的一項:
      - A.方法：怎麼查？
      - ①研究者從多國蒐集早期的構樹文物，抽取DNA來追蹤構樹的「家族旅程」
      - ②從多國蒐集今日活著的構樹，比較葉片、果實和樹皮的外形
      - B.理由：為何這樣查？
      - ①使用早期構樹文物，因為保存時間較久，外觀與形態更完整
      - ②不用今日各島活著的構樹，因為它們可能是近代才被帶去，會造成誤判
      - C.預測：若假說正確，應該看到什麼？
      - ①若構樹由臺灣擴散出去，臺灣的基因型態的多樣性應該最高
      - ②若構樹由臺灣擴散出去，臺灣的基因型態的多樣性應該最低
      - D.結果：科學家找到什麼？
      - ①臺灣的構樹基因多樣性最高；菲律賓、印尼較低；太平洋群島更低
      - ②臺灣的構樹基因多樣性最低；菲律賓、印尼較高；太平洋群島更高
      - E.結果符合假說的預測嗎？
      - ①不相符：證據不支持假說，結果與預測方向相反
      - ②相符：結果符合「出臺灣說」的預測
      根據判斷，勾選最符合的一項_subquestions:
      - label: A.方法
        answer: 1
      - label: B.理由
        answer: 2
      - label: C.預測
        answer: 1
      - label: D.結果
        answer: 1
      - label: E.結果符合假說的預測嗎
        answer: 2
    - 步驟: ❹結論
      關鍵判斷或提示: 收集的證據是否支持「出臺灣說」？
      根據判斷，勾選最符合的一項:
      - ①構樹 DNA多樣性的研究結果支持「出臺灣說」，並和語言學、考古學證據相互呼應。
      - ②構樹 DNA多樣性的研究結果不支持「出臺灣說」
      根據判斷，勾選最符合的一項_answer: 1
