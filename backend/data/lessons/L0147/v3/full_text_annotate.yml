full_text_annotate:
  title_line: '第4課 構樹：南島祖先

    「出臺灣說」的植物證據'
  byline_課文: 曾世杰
  byline_學習單: 陳淑麗
  paragraph_count: 7
  paragraphs_note: '段號欄印 一~七 共 7 個。文字流裡第 2 段與第 6 段各被分頁切成兩段

    （「…但近年又出現一項意」＋「想不到的…」、「…讓「出臺灣」＋「說」得到…」），

    此處各自接回成一段，與印出來的段號數一致。'
  paragraphs:
  - idx: 1
    text: 南島語族分布在太平洋與印度洋的眾多島嶼，活動範圍廣闊無垠，如地圖中由虛線框起的區域：從最北的臺灣到最南的紐西蘭，相距約9000公里；從最東的復活節島到最西的馬達加斯加，更達18,000公里。島嶼雖然天各一方，他們的語言卻保留不少相近詞彙，文化裡也常見類似的航海技術、織布方式與祭儀習俗。於是科學家推論：南島語族可能來自共同源頭，數千年前憑藉精湛的航海能力展開逐島移民，經過綿延千年的遷徙後，才形成今日星羅棋布的南島世界。
  - idx: 2
    text: 如果真有共同的源頭，那麼這個「共同的故鄉」在哪裡？語言學、考古學與人類學長年合作，提出多種假說，其中最具代表性的是「出臺灣說」——南島語族可能最早是從臺灣出發的。過去支持這個假說的證據多來自語言與文化的相似性，但近年又出現一項意想不到的「植物證據」：線索竟然來自臺灣路邊隨處可見的構樹。
  - idx: 3
    text: 構樹葉片像手掌，果實橘紅，樹皮纖維可拉成長絲。在許多臺灣原住民族文化中，構樹樹皮布是重要的衣物與儀式材料，木材可製作工具，枝葉也可能在祭典中扮演要角。更耐人尋味的是，人類學者發現：在許多南島語族的社群中，都能看到構樹的身影——有人用它製作樹皮布，有人用來綁繩、包覆器具，而且構樹製品在祭儀中往往舉足輕重。這讓研究者追問：若南島語族真的是從臺灣出發，各島上的構樹會不會也是祖先一路帶出去的？
  - idx: 4
    text: 為了追查這個可能性，人類學家找來植物學家合作，展開一項像「科學偵探」的研究：從多國蒐集南島語族早期的構樹歷史樣本與文物纖維，如博物館裡數百年前的樹皮布、繩索與工藝品纖維，抽取DNA來追蹤構樹的「家族旅程」。他們特別使用古老文物，是因為今日各島活著的構樹可能是近代才隨船隻或飛機被帶去的，若直接拿來當證據，可能造成誤判。
  - idx: 5
    text: 研究背後的推理很簡單：若構樹由臺灣向外擴散，臺灣的「基因型態」種類應該最多。第一批祖先帶著構樹從臺灣航向A島時，只能帶出少數的基因型態；在A島生活一段時間後，又有人移居到B島，所帶走的構樹基因型態更少。換句話說，基因多樣性會呈現「源頭最多、往外逐層遞減」的現象。這就像笑話從A傳給B，再傳給C、D：A的笑話版本一定最完整，傳到Ｄ時，往往就掛一漏萬、支離破碎了。生物遷移時，基因多樣性也會出現類似現象——源頭基因多樣性最高，越末端基因多樣性就會越單純。
    text_note: 句中「傳到Ｄ時」的 Ｄ 是全形，同段其他 A/B/C/D 都是半形，照原稿抄
  - idx: 6
    text: 植物學家分析臺灣、東南亞與多個太平洋島嶼的六百多件構樹文物樣本後，結果一目了然：臺灣的構樹基因多樣性最高；菲律賓、印尼較低；太平洋群島更低。這種由「多」到「少」的分布，正好與「從臺灣出發、向南向東遷徙」的路徑不謀而合。更重要的是，它也和語言學、考古學的結論彼此呼應：語言學家指出最接近「祖語」的語言群集中在臺灣；考古學也發現某些典型陶器與農作技術最早出現在臺灣，之後才向外擴散。如今構樹DNA加入拼圖，讓「出臺灣說」得到更充足的科學支撐。
  - idx: 7
    text: 原來，我們路邊司空見慣的構樹，不只是一棵普通植物。它可能曾陪著航海者跨越海洋，也在不知不覺間記錄了南島語族的遷移故事。構樹的DNA像一封來自千年前的訊息，提醒我們：臺灣，或許正是那場偉大航海故事的起點。
