  passage: 研究背後的推理很簡單：若構樹由臺灣向外擴散，臺灣的「基因型態」種類應該最多。第一批祖先帶著構樹從臺灣航向A島時，只能帶出少數的基因型態；在A島生活一段時間後，又有人移居到B島，所帶走的構樹基因型態更少。換句話說，基因多樣性會呈現「源頭最多、往外逐層遞減」的現象。這就像笑話從A傳給B，再傳給C、D：A的笑話版本一定最完整，傳到Ｄ時，往往就掛一漏萬、支離破碎了。生物遷移時，基因多樣性也會出現類似現象——源頭基因多樣性最高，越末端基因多樣性就會越單純。植物學家分析臺灣、東南亞與多個太平洋島嶼的六百多件構樹文物樣本後，結果一目了然：臺灣的構樹基因多樣性最高；菲律賓、印尼較低；太平洋群島更低。這種由「多」到「少」的分布，正好與「從臺灣出發、向南向東遷徙」的路徑不謀而合。更重要的是，它也和語言學、考古學的結論彼此呼應：語言學家指出最接近「祖語」的語言群集中在臺灣；考古學也發現某些典型陶器與農作技術最早出現在臺灣，之後才向外擴散。如今構樹DNA加入拼圖，讓「出臺灣說」得到更充足的科學支撐。
