version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 既然此事「刻不容緩」，明天再處理就好了
      B: 這場脫口秀實在太好笑了，「效能」超級讚
      C: 近年來，網路謠言「層出不窮」，必須提高警覺
      D: 籃球校隊在跨校聯賽裡連三敗，「成效斐然」（前後邏輯錯誤）
    teacher_note: A誤用，刻不容緩指的是緊急的事；B誤用，效能指的是效率和能力
  - index: 2
    answer: D
    stem: 根據課文，哪一選項不是地雷對於戰爭結束後的影響？
    options:
      A: 戰爭結束數十年後，地雷仍可能造成危險
      B: 讓許多人在行動交通時，提心吊膽
      C: 使大片的土地無法被開發利用
      D: 讓土地裡有許多廢棄金屬，可以回收利用
    answer_carrier: 原稿此題答案印的是全形「Ｄ」
  - index: 3
    answer: B
    stem: 根據表1，使用巨鼠掃雷的優勢不包括哪一項？
    options:
      A: 較不容易受到鋁罐、瓶蓋等廢金屬干擾
      B: 可以直接引爆地雷，減少人力需求
      C: 訓練和飼養成本比金屬探測器低
      D: 在雜草叢生的環境中仍能有效工作
  - index: 4
    answer: C
    stem: 巨鼠掃雷時為什麼不容易引爆地雷？
    options:
      A: 因為巨鼠受過專業訓練
      B: 因為巨鼠嗅覺很靈敏
      C: 因為巨鼠體重很輕
      D: 因為巨鼠不會踩在地雷上
  - index: 5
    answer: A
    stem: 文章提到，巨鼠的形象發生了什麼變化？
    options:
      A: 牠們從讓農民頭痛的害鼠，轉變為掃雷英雄
      B: 牠們從被當作實驗動物，變成受保護的瀕危物種
      C: 牠們從被當作寵物飼養，轉變為軍用動物
      D: 牠們從森林動物，變成都市中常見的寵物
