strategy_explained: 這一課我們要練習的是「用表格整理訊息」這個本領，因為「掃雷英雄馬嘎瓦」這篇文章裡，把馬嘎瓦怎麼找到地雷、地雷有多危險、還有牠的優點這些很多訊息都寫得很清楚，就像一張豐富的藏寶圖，我們先把牠們好好地「收納」到表格裡，就能輕鬆找出重要的線索，了解馬嘎瓦有多厲害，牠又怎麼幫助大家呢
