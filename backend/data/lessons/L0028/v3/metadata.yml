intro: 這篇文章介紹了非洲巨鼠馬嘎瓦，牠如何利用靈敏的嗅覺，協助人類偵測並清除埋藏在地下的危險地雷。文章說明了地雷的危害，以及傳統掃雷方式的困難與危險。接著，詳細描述了巨鼠掃雷的原理與優勢，例如牠們能快速準確地找到地雷，大大提升了掃雷的效率與安全性。透過馬嘎瓦的實際貢獻，我們可以看到動物如何成為人類的好幫手，為世界和平與安全盡一份力。
