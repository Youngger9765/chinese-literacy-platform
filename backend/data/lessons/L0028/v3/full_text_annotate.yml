    rows:
    - - 1.安全性
      - 掃雷人員常被地雷炸傷
      - 不會引爆地雷
    - - 2.效能
      - 對所有金屬(如鋁罐、瓶蓋)發出警報，須逐一確認
      - 只對TNT炸藥發出警報
    - - 3.成本
      - 購買、維護金屬探測器很貴
      - 飼養和訓練便宜很多
    - - 4.方便性
      - 在泥濘、雜草叢生處無法工作
      - 在泥濘、雜草叢生處仍可工作
