passage: '地雷是一種埋在土裡的炸彈，人員或車輛壓過時，只要重量超過6公斤，就會爆炸，殺傷敵人。地雷製造容易，成本低廉，戰爭時，軍人經常在重要的地點埋設地雷，好讓敵人無法通過。最糟糕的是，雖然地雷是為了殺傷敵對陣營的武裝人員而設置的，但是地雷殺傷的平民更多。即使戰事已經結束幾十年，被地下的地雷殺傷的情況仍然層出不窮，造成人們行動時的害怕與不便。聯合國估計，2015年全世界約有6,500人因地雷而死亡或受傷，大多數受害者是平民，其中三分之一是兒童。因此，偵測和掃除地雷成為刻不容緩的工作。

  傳統上，軍隊的掃雷人員要手持金屬探測器，像除草機一樣左右扇形擺動，如果探測器嗶嗶作響，就表示地下有金屬，掃雷人員就會停下來，小心翼翼的用小鏟子挖掘，確定是地雷後，再遠距引爆。若使用馬嘎瓦掃雷，牠靠「嗅覺」偵測地雷，只要聞到地雷裡的TNT炸藥，馬嘎瓦就會原地不動，用爪子刨󠇡地，工作人員會立刻在這個地點插上小旗子，確認是地雷後，再遠距引爆。表１整理了使用巨鼠掃雷的許多優點。'
