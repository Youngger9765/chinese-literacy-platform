spotlight:
  lesson: G5-L16
  strategy_name: 用表格整理訊息-閱讀表格策略
  strategy_type: info_organization
  blocks:
  - type: guide
    text: 本課閱讀策略：用表格整理訊息-閱讀表格策略
  - type: multi
    prompt: 請選擇
    options:
    - '打勾。(單選）

      「第一列」寫的是什麼？ ①比較的對象'
    - '比較的項目

      「第一欄」寫的是什麼？'
    - '比較的對象  ②比較的項目



      步驟三：閱讀表格裡的內容

      請仔細閱讀下面(1)的範例說明，並以同樣的方法，回答(2)~(4)題，在正確的'
    - '打勾。(單選）

      (1)範例「只對TNT炸藥發出警報」是在表達什麼？'
    - 金屬探測器的效能 非洲巨鼠的效能
    - '非洲巨鼠的安全性

      說明：a.先找到「只對TNT炸藥發出警報」的格子；b.往第一列看，就是「非洲巨鼠」;往第一欄看是「效能」，所以題目「 」裡講的是「非洲巨鼠的效能」。

      再來，請你看著表1，回答底下的單選題

      (2)「掃雷人員常被地雷炸傷」是在表達什麼？'
    - 金屬探測器的效能
    - "非洲巨鼠的安全性 \n③金屬探測器的安全性\n(3)「飼養和訓練便宜很多」是在表達什麼？"
    - 金屬探測器的成本  ②非洲巨鼠的成本
    - '金屬探測器的方便性

      (4)「在泥濘、雜草叢生處無法工作」是在表達什麼？

      ①金屬探測器的方便性'
    - 非洲巨鼠的安全性
    - '非洲巨鼠的方便性



      步驟四：讀出重點：問自己，這個表在表達什麼？

      例如：不斷的問自己：「兩種掃雷方式，哪一種成本比較便宜？」你帶著這個疑問，在讀表１時，很容易就看到「3.成本」那列，你就會讀到，使用巨鼠掃雷便宜很多。

      小挑戰：請你看著表1，問自己底下的問題，並勾選出正確的選項。

      (1)哪一種掃雷方式比較安全？'
    - '金屬探測器   ②非洲巨鼠

      (2)哪一種掃雷方式效能比較好？'
    - '金屬探測器   ②非洲巨鼠

      (3)哪一種掃雷方式比較不方便？ ①金屬探測器'
    - '非洲巨鼠


      步驟五：在文章裡找到這個表格的結論

      作者呈現表格之後，通常會在文字段落裡，做一個結論—簡單的寫出這個表格最重要的訊息。你閱讀文章第五段，判斷哪一句是這個表格的結論呢？

      簡單的說，以巨鼠掃雷相對安全、有效能、便宜而且方便。例如，馬嘎瓦可在30分鐘內掃描完一個網球場大小的區域，而人類使用金屬探測器則需要1至4天才能完成相同的任務。

      ①以巨鼠掃雷相對安全、有效能、便宜而且方便性高'
    - 巨鼠已經幫助清理2,300萬平方公尺的土地
    - '巨鼠得到英國頒發的動物勇氣金牌獎


      ◎自我評估：

      「利用這五個步驟，我學會怎樣讀表格了嗎？」'
    - 1.我學會了
    - 2.我還沒學會
