lesson_uid: L0131
version_id: v3
section_no: 六
spotlight:
  strategy_name: 議論文結構──用論據支持論點
  strategy_type: text_structure
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層），共 13 個
  blocks:
  - type: concept_box
    text: '議論文通常包含四個要素：論點、支持理由、論據和結論。在議論文中，「論點」是作者的觀點，「支持理由」則是作者支持此觀點的原因，「論據」是作者舉出的事實、例子、數據、研究結果或生活經驗，用來支持理由，增加說服力，最後，作者再根據前面的內容得出「結論」。掌握這些部分，可以幫助我們清楚了解作者的立場和說理方式。

      接下來，我們聚焦在「支持理由」和「論據」。練習判斷作者舉出的內容，是否適合用來支持理由。'
  - type: sub_block
    label: 一、本文的論點、支持理由和論據
    instruction: 以下整理本文的論點、支持理由和論據。請勾選正確答案。
    columns_note: 表格印三列：論點／支持理由／論據。前兩列各是一題單選（各一個紅色 ☑），第三列是資訊列。
    items:
    - label: 論點
      options:
        1: 國高中生學數學可以使用計算機，以提升學習效能。
        2: 國高中生學數學應加強手算練習，以深化數學理解。
      answer: 1
    - label: 支持理由
      options:
        1: 反覆練習繁複的計算，可以增強學生的計算能力、深化數學理解。
        2: 運用工具可以把能力、經驗或知識外化，擴充人的能力、提升效能。
      answer: 2
    - label: 論據
      value: '紙筆

        計算機

        長竿與石子

        語言

        文字

        圖書館

        網路'
      value_note: '這一列在原稿是**七個並排的儲存格**，沒有題目也沒有勾選，是把本文用到的論據列出來。

        這裡一列一個詞（原稿的儲存格界線＝這裡的換行），不加分隔符號 ——

        寫成「紙筆／計算機／…」會被逐字門判 FAIL，而且它判得對：那些「／」原稿沒有。'
      argument_evidence:
      - 紙筆
      - 計算機
      - 長竿與石子
      - 語言
      - 文字
      - 圖書館
      - 網路
  - type: guide
    text: 二、檢查例子是否適合作為論據
  - type: guide
    text: '支持理由：運用工具可以把能力、經驗或知識外化，擴充人的能力、提升效能。

      論據檢核：論據要能支持理由，才能讓論點更有說服力，請判斷下列課文內容能不能支持這個理由。'
  - type: sub_block
    label: 論據檢核
    columns:
    - 課文內容（論據舉例）
    - 能支持理由嗎？
    items:
    - label: 例一
      value: 紙筆幫助人完成二位數乘法
      options:
        1: 是
        2: 否
      answer: 1
    - label: 例二
      value: 計算機協助處理繁複的計算
      options:
        1: 是
        2: 否
      answer: 1
    - label: 例三
      value: 國小階段要熟練基礎計算
      options:
        1: 是
        2: 否
      answer: 2
  - type: guide
    text: '◎小試身手：

      請根據論點和支持理由，判斷下列例子是否適合作為論據，並在□打勾。'
  - type: sub_block
    label: 練習一
    columns:
    - 論據舉例
    - 檢核提問
    - 檢核結果
    columns_note: '表頭印的是「檢核提問: / 這個例子能說明手機容易使學生分心嗎？」與

      「檢核結果： / 是否適合作為論據？」，兩欄各自是一題單選，所以每個例子有兩個 ☑。'
    items:
    - label: 論點
      value: 學校應該統一管理手機。
    - label: 支持理由
      value: 在校期間，手機放在身旁容易使學生分心。
    - label: 檢核提問
      value: 這個例子能說明手機容易使學生分心嗎？
    - label: 檢核結果
      value: 是否適合作為論據？
    - label: 例一
      value: 小明常在上課看手機，沒有聽到上課重點。
      options:
        1: 是
        2: 否
      answer: 1
      second_question_answer: 1
      second_question_note: 「檢核提問」與「檢核結果」兩欄各勾一次，本例兩欄都勾①是
    - label: 例二
      value: 小美在放學時會和同學分享手機照片。
      options:
        1: 是
        2: 否
      answer: 2
      second_question_answer: 2
      second_question_note: 兩欄都勾②否
  - type: sub_block
    label: 練習二
    columns:
    - 論據舉例
    - 檢核提問
    - 檢核結果
    items:
    - label: 論點
      value: 早自習應該開放學生到操場運動。
    - label: 支持理由
      value: 運動能提升學習專注力。
    - label: 檢核提問
      value: 這個例子能說明運動可以提升學習專注力嗎？
    - label: 檢核結果
      value: 是否適合作為論據？
    - label: 例一
      value: 研究顯示，每天運動30分鐘的學生，專注力比不運動的學生提高20%。
      options:
        1: 是
        2: 否
      answer: 1
      second_question_answer: 1
      second_question_note: 兩欄都勾①是
    - label: 例二
      value: 小華打籃球時總是能付出全力、聚精會神。
      options:
        1: 是
        2: 否
      answer: 2
      second_question_answer: 2
      second_question_note: 兩欄都勾②否
