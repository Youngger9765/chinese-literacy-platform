intro: 這篇文章探討國高中數學學習中，是否應該使用計算機的議題。作者認為，雖然國小階段著重基礎計算能力，但進入國高中後，計算機可以作為「大腦工具」，幫助學生將複雜的計算「外化」，進而減輕大腦負擔，讓學生能更專注於數學概念的理解、推理和問題解決。文章透過舉例說明，強調計算機的輔助能提升學習效能，並將此觀點連結到人類文明將能力、經驗與知識「外化」的歷史發展，主張數學教育應與時俱進，善用計算機來促進國高中生的數學學習。
