strategy_explained: '這一課我們要練習的是，怎麼找出一個主張（或稱「論點」），然後看看作者是用什麼「證明」這個主張的（也就是「論據」），並且要練習自己也能這樣寫

  你可能會好奇，為什麼要用這篇談計算機的來練這個呢？因為作者就是用「計算機可以幫助學習」這個主張，再舉出「減輕大腦負擔」「專注概念理解」這些例子來支持，這樣你就能清楚看到「主張」跟「證明」是怎麼結合在一起的

  讀的時候，你可以試著問自己：作者最想說服我的是什麼，然後作者又用了哪些理由或例子來讓我相信他呢'
