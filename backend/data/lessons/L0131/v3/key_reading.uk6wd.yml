  passage: 其實，人類的文明發展，就是一部把能力、經驗與知識「外化」的歷史。當人類祖先執起長竿打落樹上的果實，或撿起石子丟向獵物時，他異於禽獸之處，在於把自身的力量外化到長竿和石子上了；當最早使用語言的祖先，大喊：「有蛇！」以警告旁人時，他異於禽獸之處，在於把感官經驗外化成語言，將攸關生命的警報分享給同伴。六千年前，語言被外化成書面文字，知識得以有系統的被保存，讓今人仍然可知二千五百年前孔子講了什麼，人類的溝通因此得以跨越時空。二十世紀的圖書資訊專業，將數千年來累積的知識從書籍外化到圖書館；而二十一世紀電腦、網路及行動裝置的興起，又把圖書館外化到網路上。也就是說，當前的世界已經把大量極為複雜的知識及計算外化，我們國家的數學教育當然也要有前瞻性，讓國高中生學習時部分的心智歷程外化，使用計算機讓數學學習更有效能，如果此時我們還規定國高中數學課不能使用計算機，那實在太不可思議了。
  start_text: 其實，人類的文明發展，就是一部把能力、經驗與知識
