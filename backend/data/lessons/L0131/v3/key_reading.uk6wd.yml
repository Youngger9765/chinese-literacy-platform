  char_marks_note: '兩個段界值都精準吻合，而且**一條口徑都不必套**（同 L0087 那種）：

    第 5 段裸算 274 字 = 第 10 個數字；第 6 段裸算 112 字，274+112 = 386 = 最後一個數字。

    這一段沒有阿拉伯數字也沒有拉丁字母（「六千年前」「二千五百年」「二十世紀」都是中文數字），

    所以 SKILL ⑥.7 第 1 條無從套起；footnotes.xml 空的（第 2 條不適用）；

    課文沒有分節小標（第 3 條不適用）；濾掉 variation selector 前後字數相同（第 4 條不適用）。

    → 先直接算就對上了，不要因為「別課要套規則」就硬套。'
