passage: 「透過計算來深化數學理解」的說法，在這裡顯然是不適用的。學生測量得到的三個長度，可能都不是整數，計算起來容易出錯，這時候使用計算機，會幫助學生節省心力，更專注於數學概念的理解。把繁複的計算交給計算機後，學生的大腦可以騰出空間來做更重要的理解、推理和問題解決，才更可能享受數學的實用與美麗。
