comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列「」的詞語，何者替換後文意改變？
    options:
      A: 計算機幫助學生「騰出」更多心力專注於思考—空出
      B: 關於這則訊息的真實性仍有待「商榷」，不可輕易相信—討論
      C: 體育館興建後，雨天訓練的難題也變得「迎刃而解」—困難重重(意思不同)
      D: 在嚴格訓練之下，球隊實力迅速「躍升」，成為聯賽黑馬—提升
    rationale: null
  - index: 2
    answer: D
    stem: 第三段最後兩行，作者問道：「以上的教學活動中，哪一個步驟是國中生數學學習的重點？我想應該不會有人說是乘除計算的正確與速度。」請問作者認為文中教師的教學活動其學習重點為何？
    options:
      B: 用筆記本寫下未完成的重要事項
      C: 能夠熟記畢氏定理「a2+b2＝c2」公式
      D: 將課堂所學重點打在電腦上
      A: 用手機行事曆提醒自己買牛奶
    rationale: 教師檢核學生是否理解「畢氏定理是否放諸四海皆準，適用於每一個不同的直角三角形」。
  - index: 4
    answer: B
    stem: 根據本文，關於數學學習中使用計算機的敘述，下列何者正確？
    options:
      A: 手動計算能幫助學生增加理解數學概念，但容易出錯
      B: 計算機可以節省心力，讓大腦資源用於更重要的學習
      C: 手動計算能增加學生對數學的興趣，也能深化數學的理解
      D: 計算機能減少計算錯誤，但可能會讓學生不思考解題過程
    rationale: null
  - index: 5
    answer: D
    stem: 請問以下選項，何者最能說明作者第五、六段的「寫作目的」？
    options:
      B: 舉各種例子，說明人類的溝通可以跨越時間與空間
      C: 講述電腦、網路及行動裝置的興起對書藉與圖書館的衝擊
      D: 說明心智外化是世界趨勢，不必排斥在課堂上用計算機
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
