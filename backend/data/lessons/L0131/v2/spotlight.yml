spotlight:
  lesson: G9-L10
  strategy_name: 議論文結構-用論據支持論點
  strategy_type: express_opinion
  blocks:
  - type: guide
    text: ◎ 小試身手：請根據論點和支持理由，判斷下列例子是否適合作為論據，並在□打勾。
  - type: guide
    text: 練習一
  - type: table
    rows:
    - - 論點
      - 學校應該統一管理手機。
    - - 支持理由
      - 在校期間，手機放在身旁容易使學生分心。
    - - 論據檢核
    - - 論據舉例
      - 檢核提問:這個例子能說明手機容易使學生分心嗎？
      - 檢核結果：是否適合作為論據？
    - - 例一
      - 小明常在上課看手機，沒有聽到上課重點。
      - □①是   □②否
      - □①是   □②否
    - - 例二
      - 小美在放學時會和同學分享手機照片。
      - □①是   □②否
      - □①是   □②否
  - type: guide
    text: 練習二
  - type: table
    rows:
    - - 論點
      - 早自習應該開放學生到操場運動。
    - - 支持理由
      - 運動能提升學習專注力。
    - - 論據檢核
    - - 論據舉例
      - 檢核提問:這個例子能說明運動可以提升學習專注力嗎？
      - 檢核結果：是否適合作為論據？
    - - 例一
      - 研究顯示，每天運動30分鐘的學生，專注力比不運動的學生提高20%。
      - □①是   □②否
      - □①是   □②否
    - - 例二
      - 小華打籃球時總是能付出全力、聚精會神。
      - □①是   □②否
      - □①是   □②否
