strategy_explained: '這一課，我們要練習的是「先跳過去，看看就好」的閱讀技巧

  這篇講雨林裡神奇的藥物，內容會包含很多科學發現和故事，如果一開始就鑽牛角尖，可能會覺得有點難，所以先快速瀏覽一遍，大致了解文章在講什麼，像是雨林有哪些植物、能做成什麼藥、又面臨什麼危機，這樣你會更容易抓到重點，讀起來也比較順利'
