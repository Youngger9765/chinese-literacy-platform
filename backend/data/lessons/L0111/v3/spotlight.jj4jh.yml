version_id: v3
section_no: 二
spotlight:
  strategy_name: 閱讀策略——跳過卡關，先瀏覽全文
  strategy_type: reading_strategy
  practises: 第14課 最後一隻旅人鴿
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE ＋ w:color FF0000）＋橘色手寫填空
  blocks:
  - type: guide
    text: 我們再用底下這篇文章做練習。這次仍然請你先快速閱讀一遍，標出讀不懂或讀不順的地方，再練習一次「跳過卡關、先瀏覽全文」策略。
  - type: passage
    label: 〈最後一隻旅人鴿〉
    paragraphs:
    - （段1）早期的美國拓荒者曾目睹一幕驚人的景象──成群結隊、鋪天蓋地的旅人鴿。牠們體態修長，羽色灰藍，身長約41公分。旅人鴿屬鳩形目，具群聚性與高度社會性；採集性覓食，有典型長距遷徙行為，並在密集的繁殖群中同步築巢。牠們遷徙路線從加拿大一路向南，穿越俄亥俄州、肯塔基州，到達阿肯色州與德州。科學家曾估計：牠們的數量不可勝數，單一群旅人鴿就可能超過十億隻，飛過天空往往持續好幾個小時，讓日光失色。
    note: 圓角外框內的引文。與第一篇不同，這篇**沒有預先加粗**卡關點，改由學生自己圈（見步驟1）
  - type: guide
    text: 步驟0：30秒快速瀏覽（先抓方向）
  - type: free_text
    prompt: 1.任務：只抓「這一段大概在講什麼？」（約10–15字）　→我猜這段在講：【　】
    blanks:
    - answer: 早期旅人鴿的數量很多
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 步驟1：標示卡關點＋原因判斷
  - type: free_text
    prompt: 1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。
    no_correct_answer: true
    answer_carrier: 學生在上面的引文框內自己圈／畫線，原稿沒有畫任何線
  - type: single
    prompt: 2.你覺得你卡住的主要原因是什麼？（單選）
    options:
      1: 專有名詞多，我看不懂「分類、習性、地名」這類詞
      2: 句子太長、資訊太多，我抓不到重點
    answer: 1
  - type: guide
    text: 步驟2：忽略卡關點再讀一次（不中斷）
  - type: guide
    text: 1.再讀一次卡關點：先跳過你圈起來的地方，直接往下讀，不要停。
  - type: single
    prompt: 2.自我檢核：我有把卡關那一段讀完（單選）
    options:
      1: 有，我能順順讀完
      2: 沒有，我還是卡在自己圈起來的地方
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩個 □ 都沒有勾
  - type: guide
    text: 步驟3：抓重點（重點句＋段意）
  - type: single
    prompt: 1.重點句：第一段最關鍵的一句話？（單選）
    options:
      1: 牠們體態修長，羽色藍灰，身長約41公分
      2: 單一群旅人鴿可能超過十億隻，飛過天空要好幾個小時
    answer: 2
    options_note: '選項①印「羽色藍灰」，但課文寫的是「羽色灰藍」。兩處都是原稿印的，

      這是干擾選項的一部分還是筆誤無從判斷（也可能是刻意讓學生比對），

      故照原樣記錄、不列勘誤。'
  - type: single
    prompt: 2.段意二選一（單選）
    options:
      1: 旅人鴿的分類與遷徙路線很複雜，所以研究非常困難
      2: 旅人鴿曾經數量驚人，成群飛過天空的景象非常震撼
    answer: 2
  - type: guide
    text: 步驟4：驗證：我真的懂了嗎？（不用看你圈起來的地方）
  - type: single
    prompt: 1.作者寫「超過十億隻、飛過天空要好幾個小時、讓日光失色」主要想讓讀者產生什麼感覺？（單選）
    options:
      1: 覺得旅人鴿的數量大得難以想像，畫面非常震撼
      2: 覺得旅人鴿的外觀很特別，適合做物種辨識
      3: 覺得旅人鴿飛行耐力很強，適合研究運動表現
    answer: 1
  - type: guide
    text: 步驟5：覺察與回顧（把方法說出來，才能遷移）
  - type: single
    prompt: 1.你是否發現：就算你圈起來的地方先暫時跳過，仍能抓到重點？（單選）
    options:
      1: 有，我更能抓到重點句與段意
      2: 沒有，只要有地方不懂，就覺得沒讀懂
    answer: 1
  - type: single
    prompt: 2.為什麼圈起來的地方跳過沒關係？（單選）
    options:
      1: 它是補充「習性與遷徙路線」的細節，先抓「數量很驚人」的主畫面比較重要
      2: 那些名詞只是用來增加篇幅，不讀也完全不會影響任何理解
    answer: 1
  - type: multi
    prompt: 3.這次練習，你最重要的學習是什麼？（方法回顧）
    options:
      1: 我能標出自己卡關的地方，並判斷先跳過會不會影響重點
      2: 我知道遇到資訊很多或有不熟詞的段落，也能先抓重點句再理解內容
    answers:
    - 1
    - 2
    note: '這一題原稿印「（方法回顧）」沒有標「單選」，而**兩個選項都打了紅 ☑**

      （這一節其他題都只勾一個），所以判為複選。

      對照：全課 15 個 F0FE，如果這題只算一個答案就只剩 14 個，對不上。'
