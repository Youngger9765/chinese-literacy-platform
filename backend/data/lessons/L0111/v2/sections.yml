    stem: 科學家回到馬來西亞想採集更多樣本時，為何只找到枯死的樹樁？
    options:
      A: 因為原始雨林已被清除，被改作農地
      B: 因為有人聽說樹能治病，先下手為強
      C: 樹木孕育出愛滋病藥物後，會自然死亡
      D: 因為科學家走錯地點，找錯森林區域
    rationale: null
  - index: 2
    answer: C
    stem: 依文章脈絡，作者最可能想影響讀者的想法或態度是什麼？
    options:
      B: 謹慎進行所有醫學研究，因為採集樣本會破壞自然
      C: 旅人鴿曾經數量驚人，景象非常震撼
      D: 旅人鴿遷徙路線複雜，很難追蹤研究
      A: 旅人鴿能長途飛行、耐力驚人，值得研究
    rationale: 全文由「雨林藥物潛力」轉到「雨林消失的代價」，意圖是引導保育意識
