  - type: free_text
    prompt: 1.任務：只抓「這一段大概在講什麼？」（約10–15字）
  - type: guide
    text: →我猜這段在講：  早期旅人鴿的數量很多
  - type: guide
    text: 步驟1：標示卡關點＋原因判斷
  - type: free_text
    prompt: 1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。
  - type: single
    prompt: 2.你覺得你卡住的主要原因是什麼？（單選）
    options:
    - 專有名詞多，我看不懂「分類、習性、地名」這類詞
    - 句子太長、資訊太多，我抓不到重點
    answer: 專有名詞多，我看不懂「分類、習性、地名」這類詞
  - type: guide
    text: 步驟2：忽略卡關點再讀一次（不中斷）
  - type: free_text
    prompt: 1.再讀一次卡關點：先跳過你圈起來的地方，直接往下讀，不要停。
  - type: single
    prompt: 2.自我檢核：我有把卡關那一段讀完（單選）
    options:
    - 有，我能順順讀完
    - 沒有，我還是卡在自己圈起來的地方
    answer: 有，我能順順讀完
  - type: guide
    text: 步驟3：抓重點（重點句＋段意）
  - type: single
    prompt: 1.重點句：第一段最關鍵的一句話？（單選）
    options:
    - 牠們體態修長，羽色藍灰，身長約41公分
    - 單一群旅人鴿可能超過十億隻，飛過天空要好幾個小時
    answer: 牠們體態修長，羽色藍灰，身長約41公分
  - type: single
    prompt: 2.段意二選一（單選）
    options:
    - 旅人鴿的分類與遷徙路線很複雜，所以研究非常困難
    - 旅人鴿曾經數量驚人，成群飛過天空的景象非常震撼
    answer: 旅人鴿的分類與遷徙路線很複雜，所以研究非常困難
  - type: guide
    text: 步驟4：驗證：我真的懂了嗎？（不用看你圈起來的地方）
  - type: single
    prompt: 1.作者寫「超過十億隻、飛過天空要好幾個小時、讓日光失色」主要想讓讀者產生什麼感覺？（單選）
    options:
    - 覺得旅人鴿的數量大得難以想像，畫面非常震撼
    - 覺得旅人鴿的外觀很特別，適合做物種辨識
    - 覺得旅人鴿飛行耐力很強，適合研究運動表現
    answer: 覺得旅人鴿的數量大得難以想像，畫面非常震撼
  - type: guide
    text: 步驟5：覺察與回顧（把方法說出來，才能遷移）
  - type: free_text
    prompt: 1.你是否發現：就算你圈起來的地方先暫時跳過，仍能抓到重點？
  - type: single
    prompt: （單選）
    options:
    - 有，我更能抓到重點句與段意
    - 沒有，只要有地方不懂，就覺得沒讀懂
    answer: 有，我更能抓到重點句與段意
  - type: single
    prompt: 2.為什麼圈起來的地方跳過沒關係？（單選）
    options:
    - 它是補充「習性與遷徙路線」的細節，先抓「數量很驚人」的主畫面比較重要
    - 那些名詞只是用來增加篇幅，不讀也完全不會影響任何理解
    answer: 它是補充「習性與遷徙路線」的細節，先抓「數量很驚人」的主畫面比較重要
  - type: single
    prompt: 3.這次練習，你最重要的學習是什麼？（方法回顧）
    options:
    - 我能標出自己卡關的地方，並判斷先跳過會不會影響重點
    - 我知道遇到資訊很多或有不熟詞的段落，也能先抓重點句再理解內容
    answer: 我能標出自己卡關的地方，並判斷先跳過會不會影響重點
