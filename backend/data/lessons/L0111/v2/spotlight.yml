spotlight:
  lesson: G8-L13
  strategy_name: 閱讀策略-跳過卡關，先瀏覽全文
  strategy_type: inference
  blocks:
  - type: guide
    text: 說明：閱讀的時候，如果文章出現很多不熟的新詞，越讀越卡時，該怎麼辦？這一課要練一個策略──「跳過卡關、先瀏覽全文」。這就好像吃魚的時候，魚刺很多的地方先跳過，先吃多肉無刺的地方。你繼續往下讀，也許就會發現，那些讓人頭疼的新詞或概念，經常不會影響你的閱讀理解哦。底下的課文，就有一些艱深的詞彙，請你先讀一次。記得吃魚的比喻，多刺的地方先不要深究哦。
  - type: table
    rows:
    - - 第13課  雨林裡的奇蹟藥物
      - 課  文：曾世杰 學習單：陳淑麗
    - - 一二三四
      - 亞馬遜雨林的原住民，會用藤蔓中提煉出的「箭毒」製作毒箭。箭毒屬神經肌肉阻斷劑，拮抗乙醯膽鹼受體，它會阻斷神經肌肉傳導，被毒箭射中的動物會全身肌肉鬆弛，最後因呼吸衰竭而死。如今，現代醫院的外科醫師在手術中，卻把箭毒當作救命的藥物來使用，另外還有許多能治療白血病與其他癌症的強效藥物，也同樣來自雨林的植物。這讓科學家在世界各地的雨林中探索，尋找新的「奇蹟」藥物。1987年，一位植物學家在馬來西亞雨林採集到一種樹木樣本。美國
        國家癌症研究院的研究結果顯示：從這棵樹提取的萃取物，能強力保護人體細胞免受愛滋病病毒的侵害！科學家立刻趕往馬來西亞，想採集更多樹木樣本。然而不幸的是，那片孕育出可以對抗愛滋病藥物的雨林，早已被清除，改作農地，他們只找到一根根枯死的樹樁。這些樹樁提醒人們：珍貴的治療方法或藥物，真的可能在一夜間消失。每一年，被破壞的雨林面積相當於四分之三個臺灣那麼大。全球雨林持續遭到破壞，已導致成千上萬種動植物滅絕。
  - type: passage
    source: unknown
    paragraphs:
