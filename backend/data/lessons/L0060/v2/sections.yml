vocab_definitions:
  items:
  - index: 1
    word: 輾轉反側
    definition: 因為心事而翻來覆去睡不著覺。
  - index: 2
    word: 一蹶不振
    definition: 跌了一跤就不敢再走路，後來比喻遭遇挫折或失敗就無法振作。
  - index: 3
    word: 豁達
    definition: 指心胸開闊，性格開朗，能瀟灑地看待事物，從容的面對。
  - index: 4
    word: 無妄之災
    definition: 意外的災禍。無妄，意外的意思。
  - index: 5
    word: 反芻
    definition: 原指牛羊將胃中食物送至口中重複咀嚼。後來比喻人一次又一次仔細的思考。
  - index: 6
    word: 半身不遂
    definition: 身體因中風或是脊椎受損，導致一邊麻痺無法移動。
  - index: 7
    word: 三頭六臂
    definition: 原本指某一種天神的長相，後來比喻人很有本事，能力很強，能同時做許多事。
  - index: 8
    word: 茶飯不思
    definition: 因內心焦慮、苦惱，連吃飯、喝水的心情都沒有。
  - index: 9
    word: 萬丈深淵
    definition: 非常深的地方。本文指情緒非常低落的意思。
  - index: 10
    word: 鴉雀無聲
    definition: 形容非常安靜。
  - index: 11
    word: 倒楣
    definition: 運氣不好，事情發展不順利。楣，門框上方的橫木。
  - index: 12
    word: 潸然淚下
    definition: 傷心落淚。潸然，流淚的樣子。
