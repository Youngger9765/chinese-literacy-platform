  questions:
  - index: 1
    answer: C
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 他因為酒駕撞到行道樹而受重傷，真是「無妄之災」
      B: 便利商店裡的熱狗，在架子上「輾轉反側」轉個不停
      C: 他因為一次考試失敗就「一蹶不振」，從此放棄學習
      D: 小明睡覺姿勢不良，起床右半邊都麻痺，「半身不遂」
    rationale: null
  - index: 2
    answer: D
    stem: 根據故事一的內容，為什麼阿堅會偷竊、打架，甚至進少年觀護所呢？
    options:
      A: 因為他的家庭失能，沒有任何的溫暖
      B: 因為他的姊姊很優秀，讓他很有壓力
      C: 因為他需要錢，改善家裡的經濟狀況
      D: 因為他覺得家庭很糟，所以自我放棄
    rationale: null
  - index: 3
    answer: A
    stem: 故事二的鄧小姐要一輩子吃藥的事實並沒有改變，為什麼她突然不憂鬱了呢？
    options:
      A: 她改變了自己對壞事的看法
      B: 她四處求醫，還找到了名醫
      C: 她在沒症狀時，就發現高血壓
      D: 本來吃很多藥，後來只吃一顆
    rationale: null
  - index: 4
    answer: B
    stem: 在黃美廉的故事中，學生問她：「你從小就長成這樣，怎麼還快樂得起來呢？」請根據故事三內容，推論黃美廉在黑板上寫下的結論可能是什麼？
    options:
      A: 因為我從小就這樣，所以更要讓自己快樂起來。
      B: 我擁有這麼多，為什麼你只看我所沒有的呢？
      C: 我遇到這麼多挫折跟痛苦，才需要更堅強呀！
      D: 雖然我長得不好看，但是我有一隻可愛的貓。
    rationale: null
  - index: 5
    answer: D
    stem: 根據本文，作者想強調影響心理狀態的重要因素是什麼？
    options:
      A: 家庭貧窮或失能
      B: 惡劣的童年經驗
      C: 學業或情感失敗
      D: 人對壞事的看法
