passage: 鄧小姐憂鬱起來，她日間茶飯不思，夜裡輾轉反側，心裡不斷反芻：「為什麼是我？我那麼年輕，看重飲食和運動，又沒有過重，無妄之災啊，我為什麼那麼倒楣？」
