spotlight:
  lesson: G6-L1
  strategy_name: 推論策略-推論故事主旨
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: '這一課是議論文，作者想表達一個觀點。文章一開始先問：

      心理出狀況，是壞事導致的嗎？

      接著，作者用三個故事回答問題，最後一段明白說出自己的看法。

      不過，每個故事想說明什麼，文章沒有直接告訴我們，需要從故事線索來推論。這一課，我們就來學習：如何推論故事的主旨。並看看，三個故事如何支撐作者的觀點。

      推論故事主旨，可以用四個步驟：

      ❶看處境：主角遇到什麼壞事或困難？

      ❷找看法：主角怎麼看這件事？

      ❸看結果：這種看法帶來什麼情緒、行動或結果？

      ❹推主旨：這個故事想說明作者的哪一個想法？'
  - type: guide
    text: 一、找作者觀點
  - type: single
    prompt: 這篇文章一開始問：「心理出狀況，是壞事導致的嗎？」最後一段已經明白說出作者的看法。請根據最後一段，勾選最符合作者觀點的一句。
    options:
    - 心理出狀況，主要是壞事本身造成的。
    - 心理出狀況，和壞事本身完全沒有關係。
    - 心理狀況不只受到壞事影響，也和一個人怎麼看待壞事有關。
    answer: 心理狀況不只受到壞事影響，也和一個人怎麼看待壞事有關。
  - type: guide
    text: 接下來，我們要看看三個故事各自想說明什麼，怎麼支持作者的觀點。
  - type: guide
    text: 二、推論故事主旨
  - type: guide
    text: （1）故事一──阿堅和小芸
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：推論策略──
  - type: free_text
    prompt: (2) 故事二：鄧小姐
  - type: free_text
    prompt: (3) 故事三：黃美廉
  - type: guide
    text: 三、三個故事怎麼支撐作者觀點？
  - type: free_text
    prompt: 1.三個故事中，主角都遇到不能控制或很難改變的困境。
  - type: single
    prompt: 請想一想：困境本身有改變嗎？
    options:
    - 有，主角努力後，困境都被解決了。
    - 沒有，困境沒有改變，改變的是人的看法。
    answer: 沒有，困境沒有改變，改變的是人的看法。
  - type: single
    prompt: 2.這三個故事共同說明什麼？
    options:
    - 困境會影響人，所以心理狀況主要由壞事決定。
    - 困境不一定能改變，但看法會影響情緒、行動或結果。
    - 只要換個想法，就能解決所面臨的困境。
    answer: 困境不一定能改變，但看法會影響情緒、行動或結果。
  - type: guide
    text: ◎你發現了嗎？
  - type: guide
    text: 有些故事的主旨，藏在「主角遇到什麼、怎麼看這件事、後來有什麼結果」之間。把這些線索連起來，就能看出：這個故事想說明什麼。
