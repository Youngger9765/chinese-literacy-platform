      故事三：黃美廉
  - type: guide
    text: 三、三個故事怎麼支撐作者觀點？
  - type: free_text
    prompt: 1.三個故事中，主角都遇到不能控制或很難改變的困境。
  - type: single
    prompt: 請想一想：困境本身有改變嗎？
    options:
    - 有，主角努力後，困境都被解決了。
    - 沒有，困境沒有改變，改變的是人的看法。
    answer: 有，主角努力後，困境都被解決了。
  - type: single
    prompt: 2.這三個故事共同說明什麼？
    options:
    - 困境會影響人，所以心理狀況主要由壞事決定。
    - 困境不一定能改變，但看法會影響情緒、行動或結果。
    - 只要換個想法，就能解決所面臨的困境。
    answer: 困境會影響人，所以心理狀況主要由壞事決定。
  - type: guide
    text: ◎你發現了嗎？
  - type: guide
    text: 有些故事的主旨，藏在「主角遇到什麼、怎麼看這件事、後來有什麼結果」之間。把這些線索連起來，就能看出：這個故事想說明什麼。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
