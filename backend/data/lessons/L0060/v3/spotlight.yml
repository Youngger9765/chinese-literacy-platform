lesson_uid: L0060
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略──推論故事主旨
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  overlap_note: '三張流程圖上的「❹推主旨」「❶看處境」「❷找看法」標籤，與灰色箭頭上的

    「故事主旨」四字在原稿裡是互相重疊的兩個文字方塊，所以文字流會出現

    「❹推主旨事主旨」「❶看處境事主旨」「❷找看法事主旨」這種黏字。本檔記乾淨的標籤。'
  structure_note: '三張流程圖刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 table/fill_table

    只會畫出 instruction，columns/rows 整片消失而且不報錯（L0061 的教訓）。'
  blocks:
  - type: concept_box
    text: '這一課是議論文，作者想表達一個觀點。文章一開始先問：

      心理出狀況，是壞事導致的嗎？

      接著，作者用三個故事回答問題，最後一段明白說出自己的看法。

      不過，每個故事想說明什麼，文章沒有直接告訴我們，需要從故事線索來推論。這一課，我們就來學習：如何推論故事的主旨。並看看，三個故事如何支撐作者的觀點。

      推論故事主旨，可以用四個步驟：

      ❶看處境：主角遇到什麼壞事或困難？

      ❷找看法：主角怎麼看這件事？

      ❸看結果：這種看法帶來什麼情緒、行動或結果？

      ❹推主旨：這個故事想說明作者的哪一個想法？'
  - type: guide
    text: 一、找作者觀點
  - type: single
    prompt: 這篇文章一開始問：「心理出狀況，是壞事導致的嗎？」最後一段已經明白說出作者的看法。請根據最後一段，勾選最符合作者觀點的一句。
    options:
      1: 心理出狀況，主要是壞事本身造成的。
      2: 心理出狀況，和壞事本身完全沒有關係。
      3: 心理狀況不只受到壞事影響，也和一個人怎麼看待壞事有關。
    answer: 3
  - type: guide
    text: 接下來，我們要看看三個故事各自想說明什麼，怎麼支持作者的觀點。
  - type: guide
    text: 二、推論故事主旨
  - type: guide
    text: （1）故事一──阿堅和小芸
  - type: table
    note: 故事一的線索流程圖；原稿已填好，沒有空格
    columns:
    - ❶看處境
    - ❷找看法
    - ❸看結果
    rows:
    - - '遇到的壞事

        爸爸酗酒，從小媽媽就跑掉了，有不好的家庭。'
      - '阿堅想法

        有這種家庭，我能怎樣？'
      - '因此阿堅……

        偷竊、打架、進少年觀護所。'
    - - ''
      - '小芸想法

        我家這樣，我不努力一點行嗎？'
      - '因此小芸……

        國立大學高材生，還能照顧全家。'
    rows_note: 「遇到的壞事」那一格在原稿是一個大方框，用箭頭同時指向阿堅、小芸兩列
  - type: single
    label: ❹推主旨 → 故事主旨
    prompt: 把線索連起來：這個故事想說明什麼？
    options:
      1: 家庭困境容易影響孩子的發展。
      2: 同樣遇到困境，怎麼看這件事，會影響行動和結果。
    answer: 2
    answer_carrier: 紅色 ☑（w:sym）；⚠️ PDF p8 上這一題**連 □ 帶勾都沒印出來**，只有文字層有
  - type: guide
    text: (2) 故事二：鄧小姐
  - type: fill_table
    note: 故事二的線索流程圖
    columns:
    - ❶看處境
    - ❷找看法
    - ❸看結果
    rows:
    - ❶看處境: '遇到的壞事

        有【　】，需要一輩子服藥。'
      ❶看處境_blanks:
      - answer: 先天性高血壓
      ❷找看法: '剛開始想法

        我為什麼這麼【　】？'
      ❷找看法_blanks:
      - answer: 倒楣
      ❸看結果: '心情、狀態

        感到【　】，吃不好也睡不好。'
      ❸看結果_blanks:
      - answer: 憂鬱
    - ❶看處境: ''
      ❷找看法: '後來想法

        我運氣【　】'
      ❷找看法_blanks:
      - answer: 不錯
      ❸看結果: '心情、狀態

        重新快樂起來，能吃能睡。'
    rows_note: 「遇到的壞事」那一格在原稿是一個大方框，用箭頭同時指向兩列
  - type: single
    label: ❹推主旨 → 故事主旨
    prompt: 把線索連起來：這個故事想說明什麼？
    options:
      1: 同一件事沒有改變，換個看法會影響情緒。
      2: 身體疾病及早發現，心情就會自然好轉。
    answer: 1
  - type: guide
    text: (3) 故事三：黃美廉
  - type: fill_table
    note: 故事三的線索流程圖；本張沒有 ❸看結果 欄
    columns:
    - ❶看處境
    - ❷找看法
    rows:
    - ❶看處境: '遇到的壞事

        患有【　】，走路東倒西歪，無法說話。'
      ❶看處境_blanks:
      - answer: 腦性麻痺
      ❷找看法: '學生想法

        你從小就長這樣，怎麼快樂得起來？'
    - ❶看處境: ''
      ❷找看法: '黃美廉想法

        我擁有【　】，為什麼你只看我【　】'
      ❷找看法_blanks:
      - answer: 這麼多
      - answer: 沒有的呢？
  - type: single
    label: ❹推主旨 → 故事主旨
    prompt: 把線索連起來：這個故事想說明什麼？
    options:
      1: 身體有困難，只要準備充分，也能完成演講。
      2: 面對不能改變的困難，看到自己擁有的，也能保持樂觀。
    answer: 2
  - type: guide
    text: 三、三個故事怎麼支撐作者觀點？
  - type: single
    prompt: '1.三個故事中，主角都遇到不能控制或很難改變的困境。

      請想一想：困境本身有改變嗎？'
    options:
      1: 有，主角努力後，困境都被解決了。
      2: 沒有，困境沒有改變，改變的是人的看法。
    answer: 2
  - type: single
    prompt: 2.這三個故事共同說明什麼？
    options:
      1: 困境會影響人，所以心理狀況主要由壞事決定。
      2: 困境不一定能改變，但看法會影響情緒、行動或結果。
      3: 只要換個想法，就能解決所面臨的困境。
    answer: 2
  - type: guide
    text: '◎你發現了嗎？

      有些故事的主旨，藏在「主角遇到什麼、怎麼看這件事、後來有什麼結果」之間。把這些線索連起來，就能看出：這個故事想說明什麼。'
