intro: 我們常認為遇到壞事，像是家庭破碎、生病或身體有缺陷，就會讓心情變差、心理生病。但真的是這樣嗎？這篇文章透過三個故事，像是有一對姊弟面對家中困境卻有不同的人生態度，一位小姐發現自己罹患疾病後，如何從憂鬱轉為積極，以及一位身心障礙者如何樂觀面對人生。這些故事都帶我們思考，當我們遇到無法控制的「壞事」時，究竟是什麼影響了我們的心情？是事情本身，還是我們看待事情的方式呢？
