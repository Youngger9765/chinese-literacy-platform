strategy_explained: '這一課我們要練習的是「推敲作者的想法」，就像偵探一樣，去找出作者真正想告訴我們什麼

  透過文章裡三段故事，像是面對家庭困難的姊弟、生病後轉變的小姐，還有身心障礙者，讓我們一起想想，是什麼決定了我們的心情，是發生的「壞事」還是我們怎麼「想」這件事

  讀的時候，試著在心裡問問自己，作者為什麼要講這些故事，他們想讓我們學到什麼'
