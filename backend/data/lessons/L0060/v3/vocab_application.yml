  items:
  - index: 1
    stem: 我只是走在路上，沒想到卻被飛來的磚頭砸到進醫院，簡直是（　）。
    answer: D
  - index: 2
    stem: 自從他上次比賽慘敗，從此就（　），連平日的練習都不參加了。
    answer: A
  - index: 3
    stem: 每次比賽過後，他總會不斷（　）跑步中的每個動作，期待下次能有更好的表現。
    answer: F
  - index: 4
    stem: 這個廚師彷彿有（　），居然能一手炒菜，一手煮湯，還能同時完成擺盤，真是太厲害了！
    answer: B
  - index: 5
    stem: 他不僅被騙光積蓄，還被裁員，情緒一下子跌入（　）。
    answer: H
  - index: 6
    stem: 他想到因腳傷，運動生涯就此結束，不禁（　）。
    answer: E
  - index: 7
    stem: 原本吵鬧的教室，在老師進門後，瞬間變得（　）。
    answer: G
  - index: 8
    stem: 自從心愛的寵物走丟後，他每天（　），不斷尋找丟失的寵物。
    answer: C
  notes:
