vocab_definitions:
  items:
  - index: 1
    word: 素昧平生
    definition: 從來沒有見過面，也不認識。
  - index: 2
    word: 抽象概念
    definition: 指看不見、摸不到，但人可以理解和討論的想法，例如自由、正義、國家。
  - index: 3
    word: 共同編織
    definition: 比喻大家一起建立或完成某件事。本文是指大家一起形成並相信某種故事、信念或規則。
  - index: 4
    word: 物種
    definition: 指生物的種類，例如人類、老虎、麻雀是不同物種。
  - index: 5
    word: 制度
    definition: 大家共同遵守的規定和做事方法，例如學校制度、法律制度。
  - index: 6
    word: 虛構
    definition: 由人想像、創造出來的概念，不一定是自然界本來就存在的東西，也不等於騙人。
  - index: 7
    word: 法人
    definition: 指被法律承認的組織，例如公司、基金會、協會；它可以簽約、擁有財產，也要負責任。
  - index: 8
    word: 約定俗成
    definition: 大家長久以來都這樣做，慢慢形成大家都認同的習慣或規則。
