passage: 歷史學家哈拉瑞在《人類大歷史》中提出一個很奇妙的觀點：智人之所以能成為地球上最有影響力的物種，不是因為我們跑得最快、力氣最大、牙齒最尖，而是因為我們會相信「共同的故事」。這裡說的「故事」，不是一般小說裡的情節，而是人類共同創造、共同相信的概念和規則。它看不見、摸不著，卻能組織眾人，產生巨大的力量。
