keypoints:
  lesson: G9-L2
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 觀點（段1-2）
    value: '1.智人能讓千千萬萬__的人，為了同一個目標一起工作。

      2.智人能成為有影響力的物種，不是因為身體最強，而是因為會相信__；這些故事看不見，卻能組織眾人，產生__。'
    blanks:
    - answer: 素昧平生
      hint: ''
    - answer: 共同的故事
      hint: ''
    - answer: 巨大的力量
      hint: ''
  - label: 主要例子(段3-5)
    value: '1.錢：千元鈔只是一張__，卻能夠交易；錢的力量在大家共同__的故事裡。

      2.交通規則：紅綠燈本身沒有力量讓人停下或前進；大家相信並遵行__的規則，才不會撞成一團。

      3.公司：公司不是一個人，也不是一棟大樓；力量來自法律和大家承認它是一個__。

      4.國家：我們看不見__這個抽象概念；國家的力量來自許多人相信「我們屬於同一個國家」。'
    blanks:
    - answer: 紙
      hint: ''
    - answer: 相信
      hint: ''
    - answer: 紅燈停，綠燈行
      hint: ''
    - answer: 法人
      hint: ''
    - answer: 國家
      hint: ''
  - label: 補充延伸(段6)
    value: 這裡的「虛構」不是__，而是人類共同創造、共同相信的__。例如冠軍、正義、民主、自由、人權等，雖然看不見，卻能影響人的行動。
    blanks:
    - answer: 騙人
      hint: ''
    - answer: 概念
      hint: ''
  - label: 結論(段7～8)
    value: '1.其他動物多靠血緣、氣味、熟悉聲音或本能合作；智人能把__，把__ ，把__。

      2.人類統治世界，靠的不是爪子，而是__；世界上強大的力量，常常是許多人同時相信的故事。'
    blanks:
    - answer: 想像變成秩序
      hint: ''
    - answer: 故事變成制度
      hint: ''
    - answer: 陌生人變成同伴
      hint: ''
    - answer: 想像力
      hint: ''
  title: 看不見的故事，推動看得見的世界
