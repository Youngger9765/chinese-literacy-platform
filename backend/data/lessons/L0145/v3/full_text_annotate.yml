full_text_annotate:
  title_line: 第2課  看不見的故事，推動看得見的世界
  byline_課文: 曾世杰
  byline_學習單: 陳淑麗
  paragraph_count: 8
  paragraphs:
  - idx: 1
    text: 如果一隻黑猩猩想搬一塊大石頭，牠可以找幾隻熟悉的同伴幫忙；如果一群螞蟻要築巢，牠們也能分工合作。可是，世界上只有一種動物，能讓千千萬萬素昧平生的人，為了同一個目標一起工作。這種動物，就是智人，也就是我們。
    errata_ref: E1
  - idx: 2
    text: 歷史學家哈拉瑞在《人類大歷史》中提出一個很奇妙的觀點：智人之所以能成為地球上最有影響力的物種，不是因為我們跑得最快、力氣最大、牙齒最尖，而是因為我們會相信「共同的故事」。這裡說的「故事」，不是一般小說裡的情節，而是人類共同創造、共同相信的概念和規則。它看不見、摸不著，卻能組織眾人，產生巨大的力量。
  - idx: 3
    text: 錢，就是一個虛構的故事。一張一千元鈔票只是一張印了圖案的紙，不能吃，不能穿，也不能蓋房子。可是只要大家都相信它「值一千元」，你就可以用它買書、買便當、搭捷運。假如全世界的人明天突然不相信錢了，銀行、商店、薪水、網路購物都會立刻陷入混亂。錢的力量不在紙上，而在大家共同相信的故事裡。交通規則也是如此，紅燈本身沒有力量阻擋人車，綠燈也不會真的推你前行。但因為大家相信並遵行「紅燈停，綠燈行」這套約定俗成的規則，馬路上數百萬個互不相識的人，才能避免每天撞成一團。這個規則雖然是人訂的，效果卻非常真實。
  - idx: 4
    text: 「公司」也是人類想像力的驚人成果。比如，一家科技公司並不是某一個人，也不是某一棟大樓。大樓可以拆掉，員工可以離職，老闆也可能更換，但公司仍然存在。因為法律承認它，銀行替它開戶，顧客購買它的產品，員工相信自己在為它工作。這樣一個看不見的「法人」，也就是法律承認的組織單位，竟然能雇用幾萬人、製造手機、發射火箭，甚至改變世界。
  - idx: 5
    text: 國家更是如此。你看得見土地、人民、國旗、護照和政府大樓，卻看不見「國家」。但因為許多人相信「我們屬於同一個國家」，所以有人願意繳稅，有人願意服兵役，有人願意遵守法律，也有人會在國際比賽中為同一面旗幟歡呼。國家這個虛構的故事，像一張巨大的網，把無數陌生人連接在一起，為它奮鬥、努力。
  - idx: 6
    text: 這裡的「虛構」並不是「騙人」。哈拉瑞說的故事，指的是人類共同創造、共同相信的概念。更奇妙的是，人類會為故事付出巨大的努力。有人為了「冠軍」每天練球；有人為了「夢想的大學」熬夜讀書；有人為了「正義」站上法庭；有人為了「民主、自由、人權」走上街頭。冠軍、夢想、正義、民主、自由、人權都不是石頭或蘋果，它們是抽象概念，無法秤斤論兩，但它們能讓人流汗、流淚、合作、爭辯，甚至改變歷史。所以，當你走進商店，用一張紙換到飲料；當你在運動會為班級榮譽吶喊；當你站在街頭，為支持政黨的勝選而歡喜，或為它落敗而流淚，你其實都生活在人類共同編織的故事裡。這些故事看不見，卻像空氣一樣包圍著我們。
  - idx: 7
    text: 其他動物也會合作，但牠們多半靠血緣、氣味、熟悉的聲音或本能。狼群可以一起狩獵，蜜蜂可以建造蜂巢，黑猩猩可以結盟打架，卻很難讓一百萬隻彼此陌生的黑猩猩，因為相信同一張紙、同一面旗、同一條法律而合作。智人的特別之處，就是能把想像變成秩序，把故事變成制度，把陌生人變成同伴。
  - idx: 8
    text: 也許這就是《人類大歷史》最令人驚訝的地方：人類統治世界，靠的不是爪子，而是想像力。世界上最強大的力量，常常不是刀劍、機器或城牆，而是許多人同時相信的故事。想一想，這不是很奇妙嗎？
