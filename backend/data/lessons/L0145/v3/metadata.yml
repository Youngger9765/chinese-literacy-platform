strategy_explained: '這一課我們要練習的，是怎麼用具體的例子，來讓人了解一個抽象的道理

  你看這篇文章，就用金錢、公司、國家這些我們生活周遭看得見的東西，來解釋「故事」這個看不見的概念，怎麼推動世界

  所以你讀的時候，可以試著找找看，作者是怎麼把一個大道理，分解成一個個小例子來說明的，然後想想看，這些例子是不是真的讓那個大道理更容易懂了'
