  passage: 歷史學家哈拉瑞在《人類大歷史》中提出一個很奇妙的觀點：智人之所以能成為地球上最有影響力的物種，不是因為我們跑得最快、力氣最大、牙齒最尖，而是因為我們會相信「共同的故事」。這裡說的「故事」，不是一般小說裡的情節，而是人類共同創造、共同相信的概念和規則。它看不見、摸不著，卻能組織眾人，產生巨大的力量。錢，就是一個虛構的故事。一張一千元鈔票只是一張印了圖案的紙，不能吃，不能穿，也不能蓋房子。可是只要大家都相信它「值一千元」，你就可以用它買書、買便當、搭捷運。假如全世界的人明天突然不相信錢了，銀行、商店、薪水、網路購物都會立刻陷入混亂。錢的力量不在紙上，而在大家共同相信的故事裡。交通規則也是如此，紅燈本身沒有力量阻擋人車，綠燈也不會真的推你前行。但因為大家相信並遵行「紅燈停，綠燈行」這套約定俗成的規則，馬路上數百萬個互不相識的人，才能避免每天撞成一團。這個規則雖然是人訂的，效果卻非常真實。
