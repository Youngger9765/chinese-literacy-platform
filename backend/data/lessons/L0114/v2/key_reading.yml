passage: '於是，一個爭議的問題浮上檯面：如果石虎在原棲息地裡越來越難存活，我們該不該「幫牠換個地方」呢？保育界對這個「物種遷移」的議題有非常不一樣的想法。

  反對遷移的學者認為，把野生動物「搬家」，看似積極，卻可能引發難以預料的新風險，因此主張先把原棲地變得更安全。他們的理由不只是不捨「干預自然」，也包括法規、倫理與生態後果。首先，

  他們相信「生命自有出口」，認為野生動物有自主生存的韌性，可能自行克服障礙，找到出路。此地不適合生存，石虎自然會尋找別處；相反地，若人為將牠們遷移到「我們覺得安全」的區域，食物可能不足、地形與植被不符合狩獵需求、新地有其他掠食者與競爭者，甚至讓牠們遭遇新的疾病及人為風險。這一派提出的解方是：與其花大錢移走石虎，不如把資源用在「讓原地變得安全」，例如把破碎棲地用動物廊道重新連接、設減速設施、犬隻管理、改良雞舍、友善農法與補償機制。因為真正要解決的，是人與自然的相處方式，而不是把動物送到看不見的地方。'
