spotlight:
  lesson: G8-L17
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  blocks:
  - type: guide
    text: 上一課我們以安樂死為主題，學習「比較多元觀點」的閱讀策略。這一課要再進一步：「先找到兩派個別的觀點，再比較他們的異同。」最後再推論文章想要說什麼（主旨）。
  - type: guide
    text: 一、確定議題（提示：可能出現「爭議」、「該不該」、「是否」等關鍵詞）
  - type: guide
    text: 請在以上空格填寫這篇文章在談「哪個議題／爭議」
  - type: guide
    text: 是否應把石虎「遷移」到較安全的地方
  - type: guide
    text: 二、找觀點
  - type: passage
    source: unknown
    paragraphs:
    - 議題文章常會呈現不同立場：各有各的主張或觀點，並提出有說服力的理由與作法。底下請你整理對這個議題的不同立場／觀點，每個觀點的核心想法與理由、作法是什麼？
  - type: table
    rows:
    - - 立場
      - 觀點要素
      - 請根據課文內容填答或勾選
    - - 反對遷移
      - 主張
      - 遷移可能造成新風險，先讓原棲地變安全
    - - 反對遷移
      - 理由(複選)
      - □①遷移可能花費大量資源，卻沒有改善原棲地的人為衝突。□②新地區可能有食物、植被、競爭、疾病或人為干擾等風險。□③石虎只要留在原地，就一定能自行找到安全的生存方式。
    - - 反對遷移
      - 主要作法(單選)
      - □①讓原地變得安全：建廊道、車輛減速、犬隻管理、補償與雞舍防護等。□②加強石虎野放前的訓練與追蹤監測，讓牠更會避開危險、提高存活率。
    - - 支持   遷移
      - 主張
      - 先把死亡風險降到最低       （先救命、爭取時間）
    - - 支持   遷移
      - 理由(複選)
      - □①棲地已被切割成孤島，石虎移動有危險。□②危險來自人類活動，人類有責任先把風險降到最低。□③只要遷移，原棲地的路殺、犬殺和雞舍問題便可暫不處理。
    - - 支持   遷移
      - 主要作法(單選)
      - □①先在原棲地加強巡護與宣導，降低人為干擾，讓石虎自然擴散就好。□②把石虎移到較安全、人為干擾較少、管制更嚴格的區域。
  - type: guide
    text: 三、比較觀點異同（從「優先順序／介入焦點／判斷原則」三個角度）
  - type: guide
    text: 上表我們已經掌握每一方在說什麼；接著請做兩方觀點的比較。
  - type: table
    rows:
    - - 比較角度
      - 反對遷移
      - 支持遷移
    - - 相異
      - 優先順序（單選）
      - □①先移到安全處　□②先讓原棲地變安全
      - □①先移到安全處　□②先讓原棲地變安全
    - - 相異
      - 介入焦點（單選）
      - □①動物搬家□②原地環境改善
      - □①動物搬家□②原地環境改善
    - - 相異
      - 判斷準則（單選）
      - □①怕做錯更危險　□②怕不做來不及
      - □①怕做錯更危險　□②怕不做來不及
    - - 相同
      - 兩派都想降低死亡風險、讓族群更穩定，也都想改善原棲地
  - type: guide
    text: ＊歸納觀點差異：
  - type: passage
    source: unknown
    paragraphs:
    - 兩派都看重石虎的安全，但是反對派先做          原地環境改善     ；支持派先做       移動到安全處     。
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: single
    prompt: 根據你整理的「共同點＋差異」，下列何者最能概括本文主旨？（單選）
    options:
    - 介紹石虎的生活習性與野放過程，證明野放一定會失敗
    - 比較遷移與不遷移兩派觀點，凸顯保育決策的兩難與取捨
    - 呼籲政府立刻把所有石虎移到保護區，避免再發生路殺犬殺
    answer: 介紹石虎的生活習性與野放過程，證明野放一定會失敗
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: fill_table
  - type: passage
    source: unknown
    paragraphs:
    - 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
    - 本文提到路殺、犬殺、雞舍衝突捕殺、毒鼠造成間接毒殺等人為相關威脅；並未提到寵物犬貓的問題本文提到路殺、犬殺、雞舍衝突捕殺、毒鼠造成間接毒殺等人為相關威脅；並未提到寵物犬貓的問題（
      C ）1. 文章列舉的威脅中，下列何者「不是」文中提到石虎常見的生存危險？
  - type: guide
    text: A.被疾駛的車輛撞擊，發生路殺
  - type: guide
    text: B.大量遊蕩犬追逐攻擊，造成犬殺
  - type: guide
    text: C.大量寵物犬貓移入，導致獵食困難
  - type: guide
    text: D.誤食被毒死的老鼠，造成間接毒殺
  - type: passage
    source: unknown
    paragraphs:
    - 支持派把遷移視為短期降低死亡風險的措施，並不否認原棲地修復、廊道建置、社區友善等長期工作仍要做。支持派把遷移視為短期降低死亡風險的措施，並不否認原棲地修復、廊道建置、社區友善等長期工作仍要做。（
      B ）2. 第五段支持遷移者說：「遷移不是放棄原棲地，而是爭取時間」，這句話最可能想表達的是什麼？
  - type: guide
    text: A.遷移優先，原棲地修復先暫緩，等族群穩定再做
  - type: guide
    text: B.先遷移以降石虎死亡風險，同步修復原地並推友善措施
  - type: guide
    text: C.遷移就是打算永久搬離，未來不再考慮回到原棲地
  - type: guide
    text: D.遷移後威脅自然降低，交通、犬隻、雞舍等配套可不做
  - type: self_check
    items:
    - 我能說出文章討論的核心議題。
    - 我能找出不同立場的主張、理由與作法。
    - 我能找出兩派的共同目標。
    - 我能比較兩派的優先順序與風險考量。
    - 我能根據觀點異同統整文章主旨。
