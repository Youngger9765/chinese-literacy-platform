comprehension:
  questions:
  - index: 3
    answer: A
    stem: 對「風險排序」不同的兩派主張，本文作者的態度為何？
    options:
      A: 先設警示牌與夜間限速加強宣導，暫不做犬隻管控與雞舍改善
      B: 優先做動物廊道與減速設施，先改善原地，再評估是否遷移
      C: 僅做必要監測通報，盡量不介入，讓石虎自行尋找出路與棲地
      D: 先移到管制嚴、干擾少的區域降風險，同步改善原棲地環境
    rationale: 作者把議題提升到「社會選擇」，意在引導讀者思考：人類願意做哪些改變、投入哪些制度與配套，而非把保育當成單純生物學問題。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 0
    verdict: ok
