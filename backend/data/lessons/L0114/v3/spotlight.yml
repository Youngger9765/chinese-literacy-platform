lesson_uid: L0114
version_id: v3
section_no: 五
spotlight:
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE ＋ w:color EE0000）＋橘色手寫填空；兩者都在文字流裡
  blocks:
  - type: concept_box
    text: 上一課我們以安樂死為主題，學習「比較多元觀點」的閱讀策略。這一課要再進一步：「先找到兩派個別的觀點，再比較他們的異同。」最後再推論文章想要說什麼（主旨）。
  - type: guide
    text: 一、確定議題（提示：可能出現「爭議」、「該不該」、「是否」等關鍵詞）
  - type: free_text
    prompt: 請在以上空格填寫這篇文章在談「哪個議題／爭議」【　】
    blanks:
    - answer: 是否應把石虎「遷移」到較安全的地方
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 二、找觀點
  - type: guide
    text: 議題文章常會呈現不同立場：各有各的主張或觀點，並提出有說服力的理由與作法。底下請你整理對這個議題的不同立場／觀點，每個觀點的核心想法與理由、作法是什麼？
  - type: fill_table
    label: 二、找觀點
    columns:
    - 立場
    - 觀點要素
    - 請根據課文內容填答或勾選
    rows:
    - 立場: 反對遷移
      觀點要素: 主張
      請根據課文內容填答或勾選: 【　】
      請根據課文內容填答或勾選_blanks:
      - answer: 遷移可能造成新風險，先讓原棲地變安全
    - 立場: 反對遷移
      立場_note: 原稿此格與上一列合併（同一個「反對遷移」跨三列）
      觀點要素: 理由(複選)
      請根據課文內容填答或勾選: ''
      請根據課文內容填答或勾選_options:
        1: 遷移可能花費大量資源，卻沒有改善原棲地的人為衝突。
        2: 新地區可能有食物、植被、競爭、疾病或人為干擾等風險。
        3: 石虎只要留在原地，就一定能自行找到安全的生存方式。
      請根據課文內容填答或勾選_answers:
      - 1
      - 2
    - 立場: 反對遷移
      立場_note: 原稿此格與上兩列合併
      觀點要素: 主要作法(單選)
      請根據課文內容填答或勾選: ''
      請根據課文內容填答或勾選_options:
        1: 讓原地變得安全：建廊道、車輛減速、犬隻管理、補償與雞舍防護等。
        2: 加強石虎野放前的訓練與追蹤監測，讓牠更會避開危險、提高存活率。
      請根據課文內容填答或勾選_answer: 1
    - 立場: 支持遷移
      立場_note: 「支持遷移」四個字在原稿是橘色手寫（PDF p6 上直排），不是印好的
      立場_blanks:
      - answer: 支持遷移
      觀點要素: 主張
      請根據課文內容填答或勾選: 【　】（先救命、爭取時間）
      請根據課文內容填答或勾選_blanks:
      - answer: 先把死亡風險降到最低
      請根據課文內容填答或勾選_note: 「（先救命、爭取時間）」是原稿印好的黑字，不是填空
    - 立場: 支持遷移
      立場_note: 原稿此格與上一列合併
      觀點要素: 理由(複選)
      請根據課文內容填答或勾選: ''
      請根據課文內容填答或勾選_options:
        1: 棲地已被切割成孤島，石虎移動有危險。
        2: 危險來自人類活動，人類有責任先把風險降到最低。
        3: 只要遷移，原棲地的路殺、犬殺和雞舍問題便可暫不處理。
      請根據課文內容填答或勾選_answers:
      - 1
      - 2
    - 立場: 支持遷移
      立場_note: 原稿此格與上兩列合併
      觀點要素: 主要作法(單選)
      請根據課文內容填答或勾選: ''
      請根據課文內容填答或勾選_options:
        1: 先在原棲地加強巡護與宣導，降低人為干擾，讓石虎自然擴散就好。
        2: 把石虎移到較安全、人為干擾較少、管制更嚴格的區域。
      請根據課文內容填答或勾選_answer: 2
    rows_note: '原稿的「立場」欄是跨列合併的儲存格（反對遷移跨 3 列、支持遷移跨 3 列），

      本檔攤平成每列都帶立場，合併關係寫在 `立場_note`。

      ⚠️ 兩邊的填寫方式不同：「反對遷移」是印好的黑字，「支持遷移」是橘色手寫填空。'
  - type: guide
    text: 三、比較觀點異同（從「優先順序／介入焦點／判斷原則」三個角度）
  - type: guide
    text: 上表我們已經掌握每一方在說什麼；接著請做兩方觀點的比較。
  - type: fill_table
    label: 三、比較觀點異同
    columns:
    - 比較角度
    - 反對遷移
    - 支持遷移
    rows:
    - 比較角度: 優先順序（單選）
      比較角度_group: 相異
      反對遷移: ''
      反對遷移_options:
        1: 先移到安全處
        2: 先讓原棲地變安全
      反對遷移_answer: 2
      支持遷移: ''
      支持遷移_options:
        1: 先移到安全處
        2: 先讓原棲地變安全
      支持遷移_answer: 1
    - 比較角度: 介入焦點（單選）
      比較角度_group: 相異
      反對遷移: ''
      反對遷移_options:
        1: 動物搬家
        2: 原地環境改善
      反對遷移_answer: 2
      支持遷移: ''
      支持遷移_options:
        1: 動物搬家
        2: 原地環境改善
      支持遷移_answer: 1
    - 比較角度: 判斷準則（單選）
      比較角度_group: 相異
      反對遷移: ''
      反對遷移_options:
        1: 怕做錯更危險
        2: 怕不做來不及
      反對遷移_answer: 1
      支持遷移: ''
      支持遷移_options:
        1: 怕做錯更危險
        2: 怕不做來不及
      支持遷移_answer: 2
    - 比較角度: 相同
      比較角度_group: 相同
      反對遷移: 【　】
      反對遷移_blanks:
      - answer: 兩派都想降低死亡風險、讓族群更穩定，也都想改善原棲地
      反對遷移_note: 這一列在原稿是跨「反對遷移／支持遷移」兩欄合併的一個儲存格，內容是橘色手寫填空
      支持遷移: ''
    rows_note: '原稿最左欄還有一個跨列合併的「相異／相同」分組欄（相異跨 3 列），

      本檔把它記在 `比較角度_group`，沒有另開一欄 —— 那會讓 columns 與 row key 對不上。'
  - type: free_text
    prompt: ＊歸納觀點差異：兩派都看重石虎的安全，但是反對派先做【　】；支持派先做【　】。
    blanks:
    - answer: 原地環境改善
    - answer: 移動到安全處
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: single
    prompt: 根據你整理的「共同點＋差異」，下列何者最能概括本文主旨？（單選）
    options:
      1: 介紹石虎的生活習性與野放過程，證明野放一定會失敗
      2: 比較遷移與不遷移兩派觀點，凸顯保育決策的兩難與取捨
      3: 呼籲政府立刻把所有石虎移到保護區，避免再發生路殺犬殺
    answer: 2
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能說出文章討論的核心議題。
    - 2.我能找出不同立場的主張、理由與作法。
    - 3.我能找出兩派的共同目標。
    - 4.我能比較兩派的優先順序與風險考量。
    - 5.我能根據觀點異同統整文章主旨。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿五個 □ 都沒有勾
