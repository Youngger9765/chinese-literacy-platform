lesson_uid: L0114
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號寫在題號前的括號內（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1、2、4、5 題有，第 3 題沒有
  questions:
  - index: 1
    answer: C
    stem: 文章列舉的威脅中，下列何者「不是」文中提到石虎常見的生存危險？
    options:
      A: 被疾駛的車輛撞擊，發生路殺
      B: 大量遊蕩犬追逐攻擊，造成犬殺
      C: 大量寵物犬貓移入，導致獵食困難
      D: 誤食被毒死的老鼠，造成間接毒殺
    teacher_hint: 本文提到路殺、犬殺、雞舍衝突捕殺、毒鼠造成間接毒殺等人為相關威脅；並未提到寵物犬貓的問題
  - index: 2
    answer: B
    stem: 第五段支持遷移者說：「遷移不是放棄原棲地，而是爭取時間」，這句話最可能想表達的是什麼？
    options:
      A: 遷移優先，原棲地修復先暫緩，等族群穩定再做
      B: 先遷移以降石虎死亡風險，同步修復原地並推友善措施
      C: 遷移就是打算永久搬離，未來不再考慮回到原棲地
      D: 遷移後威脅自然降低，交通、犬隻、雞舍等配套可不做
    teacher_hint: 支持派把遷移視為短期降低死亡風險的措施，並不否認原棲地修復、廊道建置、社區友善等長期工作仍要做。
  - index: 3
    answer: A
    stem: 對「風險排序」不同的兩派主張，本文作者的態度為何？
    options:
      A: 作者說明兩派主張給讀者判斷，並未表明自己的立場
      B: 偏向「反對石虎遷移」的主張，因為遷移可能帶來新危機
      C: 偏向「贊成石虎遷移」的主張，因為改善原棲地緩不濟急
      D: 作者認為只要不原地踏步，任一種做法都比不做好
  - index: 4
    answer: A
    stem: 作者在文末寫道「石虎的未來……也是一個社會選擇」，最可能想提醒讀者什麼？
    options:
      A: 保育不只靠生物學，還牽涉人類生活方式與公共決策
      B: 只要把石虎搬到保護區，社會就能完全避免所有衝突
      C: 石虎能否存活主要看天意，人類努力其實影響不大
      D: 保育的正確答案只有一個，應由專家直接替大眾決定
    teacher_hint: 作者把議題提升到「社會選擇」，意在引導讀者思考：人類願意做哪些改變、投入哪些制度與配套，而非把保育當成單純生物學問題。
  - index: 5
    answer: D
    stem: 某地石虎棲地被道路切割，且常見遊蕩犬出沒；若想做「最有立即效果」的措施。下列哪一組最符合支持遷移者的思路？
    options:
      A: 先設警示牌與夜間限速加強宣導，暫不做犬隻管控與雞舍改善
      B: 優先做動物廊道與減速設施，先改善原地，再評估是否遷移
      C: 僅做必要監測通報，盡量不介入，讓石虎自行尋找出路與棲地
      D: 先移到管制嚴、干擾少的區域降風險，同步改善原棲地環境
    teacher_hint: 支持遷移者強調「緩不濟急」時先降立即風險（先救命），並把遷移視為「爭取時間」，同時推進原棲地修復。
