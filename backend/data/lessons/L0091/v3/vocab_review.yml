    instruction: 大題標題下印「長框」，格子上方的重複指示語印的是「灰框內的語詞刪除」，兩句原稿都在，本欄採大題標題下那一句
    answer_paths: '10 個目標語詞全部圈到，逐格取字皆能拼回，格子無錯字。

      幾何交叉驗證吻合：roundRect 10 個、紙外殘留 0（像素掃描全頁橘色未觸紙緣）

      → 紙上 10 ＝ 路徑 10，不觸發「紙上 > 路徑」警報。

      ⚠️ 橘色連通元件只數到 9 個，那是因為「眾所矚目」與「負成長」兩個框在 目(3,6)／負(4,6)

      上下相鄰而黏成一塊 —— 元件數是下限不是真值，逐格取字才是判準。'
