  破折號: 總表寫「圖表繪製與判讀──折線圖」（雙破折號），學習單第一頁與第六大題標題印的是「─」（單線）。本檔各依各自來源照抄。
strategy_explained: 這篇文章讓你練習看懂圖表裡藏著的訊息，因為它用很多數字和圖示來告訴你臺灣人口越來越少的情況有多嚴重，讀的時候，你可以試著找出圖表裡數字變高或變低的趨勢，想想這些趨勢分別代表什麼意思，這樣就能更了解人口負成長對我們生活的影響了
