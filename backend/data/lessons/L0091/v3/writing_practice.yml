lesson_uid: L0091
version_id: v3
writing_practice:
  label: 難字挑戰
  instruction: '1.仔細看左邊的字詞，記住字形。

    2.把左邊的字詞蓋起來寫3次；寫完一次，就打開檢查，如果寫錯了，看清楚再重寫。

    3.時間不夠時，只寫框框裡的字。'
  columns:
  - 字詞
  - 蓋起來考自己
  words:
  - 未雨綢繆
  - 蹂躪
  - 不容小覷
  boxed_chars:
  - 綢繆
  - 蹂躪
  - 覷
  notes:
    boxed_chars: 「框框裡的字」＝原稿在該字上加了黑色 w:bdr 框線的難字，時間不夠時只寫這幾個
    answer_carrier: 空白待學生書寫，三列各三格皆空
