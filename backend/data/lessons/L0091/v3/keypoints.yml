  - label: 段４~5 圖1、２:臺灣婦女總生育率與人口負成長趨勢
    value: '1.臺灣自1951年以來婦女總生育率【　】。

      2.2011年至2023年，臺灣出生人數逐年【　】，死亡人數逐年【　】。

      3.2020年開始，死亡人數【　】出生人數，臺灣出現人口負成長。'
