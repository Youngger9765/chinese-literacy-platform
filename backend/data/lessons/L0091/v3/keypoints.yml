    value: '1.缺點：工作年齡人口扶養壓力加重，每人平均要負擔的扶養人數【　】。

      2.可能的正面影響：(1)老年人多，會帶動消費經濟。

      (2)減少資源消耗和污染，對環境更【　】。'
