  sidebars:
  - label: 灰犀牛是什麼意思?
    text: '(1)非洲大草原上的灰犀牛，看起來笨重無害，即使走近，大家也認為牠是吃素的，沒有危險。但只要牠生起氣來，卻會造成很大的傷害。

      (2)後來灰犀牛被引申為：一定會發生重大負面影響、卻因發展緩慢，長年被社會忽視的事件。'
