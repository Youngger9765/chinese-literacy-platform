vocab_definitions:
  items:
  - index: 1
    word: 不可逆
    definition: 一旦發生了，就無法恢復原來的狀態。
  - index: 2
    word: 每況愈下
    definition: 情況變得越來越糟糕。
  - index: 3
    word: 蹂躪
    definition: 任意踐踏或嚴重破壞，使事物受到傷害。
  - index: 4
    word: 負成長
    definition: 表示經濟或某個指標的成長率為負數，代表該項目在一段時間內數量減少了。
  - index: 5
    word: 不容小覷
    definition: 不能輕視或低估。
  - index: 6
    word: 長此以往
    definition: 長久像這樣持續下去，通常用來說明可能造成不好的結果。
  - index: 7
    word: 首當其衝
    definition: 最先受到影響或承受衝擊。
  - index: 8
    word: 未雨綢繆
    definition: 趁著天還沒下雨，先把門窗綁牢，比喻事先做好準備工作，以防範未然。
  - index: 9
    word: 視而不見
    definition: 明明知道有事情發生，但卻故意不去注意或不去關心。
