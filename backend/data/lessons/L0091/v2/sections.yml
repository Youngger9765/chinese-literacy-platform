comprehension:
  questions:
  - index: 3
    answer: A
    stem: 臺灣2020年後開始人口負成長，造成重大衝擊，請問人口負成長所帶來的影響為何？
    options:
      A: 未來工作年齡人口的比率下降
      B: 青壯年人口的經濟負擔減輕（加重，因為扶養的人變多了)
      C: 育齡婦女不婚人數增多（此為人口負成長的原因)
      D: 老年人口壽命延長（與人口負成長無關)
    rationale: null
  - index: 4
    answer: B
    stem: 臺灣的少子化已經造成許多衝擊，有專家學者認為或許可以透過國家邊境開放政策，讓國民人數增加。請問根據上述的內容判斷，下列哪一個對策與專家的意見最相符？（改寫112年社會科會考題）
    options:
      A: 提高外籍移工的雇用人數（雇用仍是非本國民，無法增加國民人數)
      C: 推動老人長期照顧政策
      D: 增加公立幼兒托育中心
      B: 由國家邊境開放政策可知，是讓外來的人口移民臺灣，以增加人口數，故答案為Ｂ
    rationale: 由國家邊境開放政策可知，是讓外來的人口移民臺灣，以增加人口數，故答案為Ｂ
    is_rationale: true
  - index: 5
    answer: B
    stem: 作者把「人口負成長」比作「灰犀牛」，主要想表達什麼？
    options:
      A: 人口負成長突然發生，社會幾乎無法事先預防
      B: 人口負成長跡象明顯、影響重大，卻容易長期被忽視
      C: 人口負成長只會造成經濟衰退與環境持續惡化
      D: 人口負成長就是像犀牛一樣，造成重量級的衝擊
