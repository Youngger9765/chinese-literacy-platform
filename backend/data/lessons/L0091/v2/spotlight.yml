spotlight:
  lesson: G7-L22
  strategy_name: 圖表繪製與判讀-折線圖
  strategy_type: image_text
  blocks:
  - type: guide
    text: ◎小試身手：看圖回答問題：
  - type: free_text
    prompt: '1.圖一是某天上午九點到下午五點的溫度折線圖:'
  - type: free_text
    prompt: (1)最高溫是（22 　）度，出現在（　13 　）點，最低溫為（　12 　）度，出現在（　17 　）點。
  - type: free_text
    prompt: (2)從（　15 　）點開始，溫度越來越低。
  - type: free_text
    prompt: 2.圖二是Ａ牌奶粉近幾年來市場占有率的折線圖，請問：
  - type: free_text
    prompt: (1)2018年的市場占有率是（　12 　）%。
  - type: free_text
    prompt: (2)2020年的市場占有率是（　20 　）%。
  - type: free_text
    prompt: (3)2019~2020年的市場占有率成長了（　6 　）%。
  - type: free_text
    prompt: (4)圖二告訴我們「Ａ牌奶粉在市場的佔有率」和「年份」有什麼關係？
  - type: guide
    text: 答： Ａ牌奶粉在市場的佔有率呈現逐年成長的趨勢
  - type: free_text
    prompt: 3.下面是小倫4-10歲的體重紀錄表
  - type: free_text
    prompt: (1)根據資料繪製右方折線圖和寫標題。
  - type: free_text
    prompt: (2)請問幾歲到幾歲小倫的體重有下降
  - type: guide
    text: （　7 ）歲～（　8 　）歲，
  - type: guide
    text: 下降了幾公斤？ （　2 ）公斤。
  - type: free_text
    prompt: (3)小倫體重最重和最輕相差多少公斤？
  - type: guide
    text: （　16 ）公斤。
