  items:
  - index: 1
    word: 融為一體
    definition: 不同的事物融合在一起，形成一個整體。
  - index: 2
    word: 掠食者
    definition: 掠：奪取、捕捉；食：吃；指會捕捉其他動物來吃的動物。
  - index: 3
    word: 偽裝
    definition: 裝成別的樣子，讓別人不容易發現。
  - index: 4
    word: 一模一樣
    definition: 完全相同，看不出差別。
  - index: 5
    word: 枯萎
    definition: 枯：乾枯；萎：下垂；指植物失去水分，變乾、變黃、下垂。
  - index: 6
    word: 威嚇
    definition: 用可怕的樣子或動作讓對方害怕。
  - index: 7
    word: 活靈活現
    definition: 模仿、描寫或表演得很生動，像真的一樣。
  - index: 8
    word: 銅牆鐵壁
    definition: 像銅和鐵做的牆一樣堅固；比喻非常堅固，很難攻破。
  - index: 9
    word: 讚嘆
    definition: 覺得很厲害或很美好，而佩服、稱讚。
  - index: 10
    word: 弱肉強食
    definition: 在自然界中，弱小的動物容易被強大的動物吃掉；也可形容競爭很殘酷。
