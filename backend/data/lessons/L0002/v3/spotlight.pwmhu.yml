lesson_uid: L0002
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略──找小主題和重要細節
  strategy_type: summary
  blocks:
  - type: concept_box
    text: '這是一篇說明文，介紹動物五種生存妙招。每一種妙招下，都舉了動物例子，說明牠們用什麼方法，以及這一招怎麼幫助牠們生存。

      閱讀這類文章時，可以先找出文章的大主題，再找作者列舉的小主題，接著看看每個小主題舉了哪些例子、哪些重要細節。這樣就能抓住文章的重點嘍！'
  - type: figure
    id: 三層階梯圖
    referent: diagram
    text_carrier: image
    steps:
    - 'no': 1
      label: 先找主題
      hint: 常可在文章名稱找到，或想想文章主要在介紹誰。
    - 'no': 2
      label: 再找小主題
      hint: 常可在段落前的小標題找到，或想想這個段落主要在講什麼。
    - 'no': 3
      label: 補充細節
      hint: 可以說明小主題的重要細節或舉例。
  - type: guide
    text: 一、找大主題與小主題
  - type: sub_block
    label: （一）大主題
    stem: 大主題就是整篇文章主要在說什麼。文章標題常能幫助我們找到大主題。這篇文章的大主題是：【　】。
    blank:
      answer: 動物的生存妙招
  - type: sub_block
    label: （二）找小主題
    intro: '1.說明文有時會在段落開頭，直接說出這一段在介紹什麼。這就是小主題。

      2.本文用「第一招是…」「第二招是…」列出五種生存妙招。請勾選本文的小主題。（複選）'
    options:
      1: 保護色
      2: 竹節蟲
      3: 偽裝
      4: 皇蛾
      5: 化學武器
      6: 堅殼硬甲
      7: 臺灣獼猴
      8: 互助合作
    answer:
    - 1
    - 3
    - 5
    - 6
    - 8
    reflection: '→你發現了嗎？

      「保護色、偽裝……」是文章的小主題；「竹節蟲、皇蛾……」是作者用來說明小主題的動物例子。'
  - type: guide
    text: 二、一起試試看：找動物例子和重要細節
    hint: '找到小主題後，再從段落中找出：＊作者舉了哪些動物？

      ＊這些動物怎麼保護自己？

      ＊這一招有什麼作用？'
  - type: sub_block
    label: ◎小試身手：堅殼硬甲
    passage: 有些動物沒有尖牙利爪、沒有毒，連跑都跑不快，但是牠們有堅硬的外殼。柴棺龜和食蛇龜遇到危險時，會把頭和四肢縮進龜殼裡；穿山甲則會把身體捲成一個圓球，用身上的硬鱗片保護自己。牠們一縮、一捲，就像躲進銅牆鐵壁般的小房子，也像穿上厚厚的裝甲，可以抵擋敵人的攻擊。
    items:
    - index: 1
      label: 找例子
      stem: 這一段舉哪些動物的例子？
      options:
        1: 柴棺龜
        2: 食蛇龜
        3: 穿山甲
        4: 枯葉蝶
      answer:
      - 1
      - 2
      - 3
    - index: 2
      label: 找重要細節
      stem: 請從課文找出重要細節，完成表格。
      table:
        columns:
        - 動物例子
        - 重要細節
        rows:
        - 動物例子: 柴棺龜、食蛇龜
          重要細節: 把頭和四肢【　】
          answer: 縮進龜殼
        - 動物例子: 穿山甲
          重要細節: 把身體捲成圓球，用【　】保護自己
          answer: 硬鱗片
        - 動物例子: 共同作用
          重要細節: 抵擋敵人的【　】
          answer: 攻擊
    - index: 3
      label: 精簡成段落重點
      stem: 哪一句最適合做為這一段的摘要？（單選）
      options:
        1: 柴棺龜和食蛇龜會縮進龜殼，穿山甲會把身體捲成圓球
        2: 動物利用堅硬的外殼或硬鱗片，抵擋敵人的攻擊。
      answer: 2
      hint: →小提醒：整理段落重點時，可以把多個動物例子合起來，保留共同的生存方式和作用。
      formula: →動物＋共同的生存方式＋作用
  - type: guide
    text: 三、換你試試看：整理五種生存妙招
  - type: fill_table
    instruction: 請根據課文完成表格。勾選或填空。
    columns:
    - 小主題（生存妙招）
    - 動物例子
    - 重要細節：這一招怎麼幫助生存？
    rows:
    - 小主題: 1.保護色
      動物例子:
        1: 竹節蟲
        2: 石虎
        3: 枯葉蝶
      動物例子_answer:
      - 1
      - 2
      重要細節: 身體顏色【　】，不容易被【　】
      blanks:
      - answer: 接近四周環境
      - answer: 敵人發現
    - 小主題: 2.偽裝
      動物例子:
        1: 枯葉蝶
        2: 皇蛾
        3: 穿山甲
      動物例子_answer:
      - 1
      - 2
      重要細節_options:
        1: 外形或花紋像其他東西或動物，使天敵認不出牠，或被嚇跑。
        2: 身體顏色接近周圍環境，讓敵人不容易發現。
      重要細節_answer: 1
    - 小主題: 3.化學武器
      動物例子:
        1: 眼鏡蛇
        2: 白鼻心
        3: 黑眶蟾蜍
      動物例子_answer:
      - 1
      - 2
      - 3
      重要細節: 用【　】或難聞的【　】，使敵人難受，不敢靠近。
      blanks:
      - answer: 毒液
      - answer: 氣味
    - 小主題: 4.堅殼硬甲
      動物例子: 柴棺龜、食蛇龜、穿山甲
      重要細節: 用堅硬的外殼或硬鱗片，抵擋敵人的攻擊
    - 小主題: 5.互助合作
      動物例子: 臺灣獼猴
      重要細節: 請用提示詞整理成一句話：警戒、照顧小猴、容易生存
      blanks:
      - answer: 臺灣獼猴會分工警戒、互相照顧小猴，讓猴群更容易生存
    reflection: '→你發現了嗎？

      ・小主題：作者列舉哪一種生存妙招。

      ・動物例子：哪些動物使用這一招。

      ・重要細節：動物怎麼做，以及這一招有什麼作用。'
  - type: guide
    text: 四、整合全文摘要
  - type: sub_block
    items:
    - index: 1
      stem: 五種生存妙招雖然不同，共同目的都是什麼？（單選）
      options:
        1: 讓各種動物擁有不同的外形和生活習慣。
        2: 讓動物能在危險發生時打敗所有掠食者。
        3: 提高自己、同伴和下一代的存活機會。
      answer: 3
    - index: 2
      stem: 再把五種方法和共同目的合起來。哪一項最能概括全文？（單選）
      options:
        1: 動物會運用保護色、偽裝、化學武器、堅殼硬甲和互助合作等方法，提高自己、同伴和下一代的存活機會。
        2: 動物的生存妙招包括保護色、偽裝、化學武器、堅殼硬甲和互助合作。
      answer: 1
  - type: self_check
    title: ◎自我檢核
    instruction: 如果有做到，請在□內打勾。
    items:
    - 1.我能找出文章的大主題，以及作者列舉的五個小主題。
    - 2.我能找出動物例子和重要細節。
    - 3.我能整合成全文摘要。
  slug: pwmhu
  text_ref: wfrxc
