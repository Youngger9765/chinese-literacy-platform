  passage: 第一招是保護色。有些動物的身體顏色和周圍的環境很像，所以敵人不容易發現牠們。例如，竹節蟲的身體呈褐色或綠色，停在枝葉間時，身體顏色和周圍環境十分接近；石虎有淺黃色的毛皮，上面還有黑色斑點，能和淺山的草叢、枯葉堆融為一體，很難被敵人看見。第二招是偽裝。偽裝是指「把自己裝扮成另一種樣子」。枯葉蝶就是偽裝高手，牠停在樹上時，整體看起來就像一片枯萎的黃葉（如圖1），連葉脈、破洞都和真的枯葉一模一樣。此外，臺灣最大的蛾──皇蛾，翅膀前端有像蛇頭的花紋。當牠擺動翅膀時，蛇頭圖案顯得活靈活現，像眼鏡蛇正在威嚇敵人（如圖2），常能把天敵嚇跑。第三招是化學武器。有些動物雖然跑不快，卻能用毒液或難聞的氣味保護自己。眼鏡蛇遇到危險時，會張開脖子，準備用毒牙攻擊敵人。白鼻心受到驚嚇時，會分泌很臭的液體，黑眶蟾蜍的皮膚也會分泌毒液，讓敵人難受，不敢靠近，任何天敵都不會想吃這麼噁心的食物。第四招是堅殼硬甲。有些動物沒有尖牙利爪、沒有毒，連跑都跑不快，但是牠們有堅硬的外殼。柴棺龜和食蛇龜遇到危險時，會把頭和四肢縮進龜殼裡；穿山甲則會把身體捲成一個圓球，用身上的硬鱗片保護自己。牠們一縮、一捲，就像躲進銅牆鐵壁般的小房子，也像穿上厚厚的裝甲，可以抵擋敵人的攻擊。第五招是互助合作。對許多動物來說，大家一起合作，比單獨面對危險更安全。臺灣獼猴平常成群生活。當猴群在樹林裡找食物時，常會有幾隻猴子站在高處，注意四周，擔任警戒的工作。如果發現老鷹或其他危險，牠們就會大聲叫，提醒大家趕快逃走。猴媽媽們也會互相幫忙照顧小猴，讓牠們平安長大。大家互相幫忙，猴群就更容易生存。動物使用的方法雖然不同，目的卻一樣──都是為了讓自己、同伴和下一代，在弱肉強食的自然競技場裡，有更高的存活機會。這些有趣的生存妙招，讓我們看見大自然令人讚嘆的智慧與奧妙，也讓我們更懂得珍惜這個豐富多彩的世界。
