  passage: 第一招是保護色。有些動物的身體顏色和周圍的環境很像，所以敵人不容易發現牠們。例如，竹節蟲的身體呈褐色或綠色，停在枝葉間時，身體顏色和周圍環境十分接近；石虎有淺黃色的毛皮，上面還有黑色斑點，能和淺山的草叢、枯葉堆融為一體，很難被敵人看見。第二招是偽裝。偽裝是指「把自己裝扮成另一種樣子」。枯葉蝶就是偽裝高手，牠停在樹上時，整體看起來就像一片枯萎的黃葉（如圖1），連葉脈、破洞都和真的枯葉一模一樣。此外，臺灣最大的蛾──皇蛾，翅膀前端有像蛇頭的花紋。當牠擺動翅膀時，蛇頭圖案顯得活靈活現，像眼鏡蛇正在威嚇敵人（如圖2），常能把天敵嚇跑。第三招是化學武器。有些動物雖然跑不快，卻能用毒液或難聞的氣味保護自己。眼鏡蛇遇到危險時，會張開脖子，準備用毒牙攻擊敵人。白鼻心受到驚嚇時，會分泌很臭的液體，黑眶蟾蜍的皮膚也會分泌毒液，讓敵人難受，不敢靠近，任何天敵都不會想吃這麼噁心的食物。
