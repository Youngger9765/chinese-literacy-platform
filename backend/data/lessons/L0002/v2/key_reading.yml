passage: '第一招是保護色。有些動物的身體顏色和周圍的環境很像，所以敵人不容易發現牠們。例如，竹節蟲的身體呈褐色或綠色，停在枝葉間時，身體顏色和周圍環境十分接近；石虎有淺黃色的毛皮，上面還有黑色斑點，能和淺山的草叢、枯葉堆融為一體，很難被敵人看見。

  第三招是化學武器。有些動物雖然跑不快，卻能用毒液或難聞的氣味保護自己。眼鏡蛇遇到危險時，會張開脖子，準備用毒牙攻擊敵人。白鼻心受到驚嚇時，會分泌很臭的液體，黑眶蟾蜍的皮膚也會分泌毒液，讓敵人難受，不敢靠近，任何天敵都不會想吃這麼噁心的食物。

  第四招是堅殼硬甲。有些動物沒有尖牙利爪、沒有毒，連跑都跑不快，但是牠們有堅硬的外殼。柴棺龜和食蛇龜遇到危險時，會把頭和四肢縮進龜殼裡；穿山甲則會把身體捲成一個圓球，用身上的硬鱗片保護自己。牠們一縮、一捲，就像躲進銅牆鐵壁般的小房子，也像穿上厚厚的裝甲，可以抵擋敵人的攻擊。'
