passage: 第一招是保護色。有些動物的身體顏色和周圍的環境很像，所以敵人不容易發現牠們。例如，竹節蟲的身體呈褐色或綠色，停在枝葉間時，身體顏色和周圍環境十分接近；石虎有淺黃色的毛皮，上面還有黑色斑點，能和淺山的草叢、枯葉堆融為一體，很難被敵人看見。
