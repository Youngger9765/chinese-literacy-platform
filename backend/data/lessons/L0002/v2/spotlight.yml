spotlight:
  lesson: G4-L11
  strategy_name: 摘要策略-找小主題與重要細節
  strategy_type: summary
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：摘要策略──
  - type: guide
    text: 一、找大主題與小主題
  - type: guide
    text: （一）大主題
  - type: passage
    source: unknown
    paragraphs:
    - 大主題就是整篇文章主要在說什麼。文章標題常能幫助我們找到大主題。這篇文章的大主題是：【  動物的生存妙招           】。
  - type: guide
    text: （二）找小主題
  - type: free_text
    prompt: 1.說明文有時會在段落開頭，直接說出這一段在介紹什麼。這就是小主題。
  - type: single
    prompt: 2.本文用「第一招是…」「第二招是…」列出五種生存妙招。請勾選本文的小主題。（複選）
    options:
    - 竹節蟲     ③偽裝
    - 皇蛾
    - 化學武器   ⑥堅殼硬甲
    - ⑦臺灣獼猴   ⑧互助合作
    answer: 化學武器   ⑥堅殼硬甲
  - type: guide
    text: →你發現了嗎？
  - type: passage
    source: unknown
    paragraphs:
    - 「保護色、偽裝……」是文章的小主題；「竹節蟲、皇蛾……」是作者用來說明小主題的動物例子。
  - type: guide
    text: 二、一起試試看：找動物例子和重要細節
  - type: guide
    text: 找到小主題後，再從段落中找出：＊作者舉了哪些動物？
  - type: guide
    text: ＊這些動物怎麼保護自己？
  - type: guide
    text: ＊這一招有什麼作用？
  - type: guide
    text: 小試身手：堅殼硬甲
  - type: passage
    source: lesson_text
    paragraphs:
    - 有些動物沒有尖牙利爪、沒有毒，連跑都跑不快，但是牠們有堅硬的外殼。柴棺龜和食蛇龜遇到危險時，會把頭和四肢縮進龜殼裡；穿山甲則會把身體捲成一個圓球，用身上的硬鱗片保護自己。牠們一縮、一捲，就像躲進銅牆鐵壁般的小房子，也像穿上厚厚的裝甲，可以抵擋敵人的攻擊。
  - type: free_text
    prompt: ❶找例子：
  - type: single
    prompt: 這一段舉哪些動物的例子？
    options:
    - 柴棺龜   ②食蛇龜   ③穿山甲
    - 枯葉蝶
    answer: 柴棺龜   ②食蛇龜   ③穿山甲
  - type: free_text
    prompt: ❷找重要細節
  - type: guide
    text: 請從課文找出重要細節，完成表格。
  - type: table
    rows:
    - - 動物例子
      - 重要細節
    - - 柴棺龜、食蛇龜
      - 把頭和四肢【】
    - - 穿山甲
      - 把身體捲成圓球，用【】保護自己
    - - 共同作用
      - 抵擋敵人的【】
    answers:
    - 縮進龜殼
    - 硬鱗片
    - 攻擊
  - type: free_text
    prompt: ❸精簡成段落重點：
  - type: single
    prompt: 哪一句最適合做為這一段的摘要？（單選）
    options:
    - 柴棺龜和食蛇龜會縮進龜殼，穿山甲會把身體捲成圓球
    - 動物利用堅硬的外殼或硬鱗片，抵擋敵人的攻擊。
    answer: 動物利用堅硬的外殼或硬鱗片，抵擋敵人的攻擊。
  - type: guide
    text: →小提醒：整理段落重點時，可以把多個動物例子合起來，保留共同的生存方式和作用。
  - type: guide
    text: 動物＋共同的生存方式＋作用
  - type: guide
    text: 三、換你試試看：整理五種生存妙招
  - type: guide
    text: 請根據課文完成表格。勾選或填空。
  - type: table
    rows:
    - - 小主題
      - 舉例 和 重要細節
    - - 生存妙招
      - 動物例子
      - 重要細節：這一招怎麼幫助生存？
    - - 1.保護色
      - '①竹節蟲

        ②石虎

        □③枯葉蝶'
      - '身體顏色【】，

        不容易被【】'
    - - 2.偽裝
      - '①枯葉蝶

        ②皇蛾

        □③穿山甲'
      - '①外形或花紋像其他東西或動物，使天敵認不出牠，或被嚇跑。

        □②身體顏色接近周圍環境，讓敵人不容易發現。'
    - - 3.化學武器
      - '①眼鏡蛇

        ②白鼻心

        ③黑眶蟾蜍'
      - '用【】或難聞的【】，

        使敵人難受，不敢靠近。'
    - - 4.堅殼硬甲
      - 柴棺龜、食蛇龜、穿山甲
      - 用堅硬的外殼或硬鱗片，抵擋敵人的攻擊
    - - 5.互助合作
      - 臺灣獼猴
      - '請用提示詞整理成一句話：

        警戒、照顧小猴、容易生存

        【】'
    answers:
    - 接近四周環境
    - 敵人發現
    - 毒液
    - 氣味
    - '臺灣獼猴會分工警戒、互相照顧小猴，讓猴

      群更容易生存'
  - type: guide
    text: →你發現了嗎？
  - type: guide
    text: 小主題：作者列舉哪一種生存妙招。
  - type: guide
    text: 動物例子：哪些動物使用這一招。
  - type: guide
    text: 重要細節：動物怎麼做，以及這一招有什麼作用。
  - type: guide
    text: 四、整合全文摘要
  - type: single
    prompt: 1.五種生存妙招雖然不同，共同目的都是什麼？（單選）
    options:
    - 讓各種動物擁有不同的外形和生活習慣。
    - 讓動物能在危險發生時打敗所有掠食者。
    - 提高自己、同伴和下一代的存活機會。
    answer: 提高自己、同伴和下一代的存活機會。
  - type: single
    prompt: 2.再把五種方法和共同目的合起來。哪一項最能概括全文？（單選）
    options:
    - 動物會運用保護色、偽裝、化學武器、堅殼硬甲和互助合作等方法，提高自己、同伴和下一代的存活機會。
    - 動物的生存妙招包括保護色、偽裝、化學武器、堅殼硬甲和互助合作。
    answer: 動物會運用保護色、偽裝、化學武器、堅殼硬甲和互助合作等方法，提高自己、同伴和下一代的存活機會。
  - type: table
    rows:
    - - 文章內容
      - 重點
    - - 大主題
      - 動物的生存妙招
    - - '五種

        生存妙招'
      - 【】、【】、【】、【】和【】。
    - - 共同目的
      - 提高自己、【】和下一代的【】。
    answers:
    - 保護色
    - 偽裝
    - 化學武器
    - 堅殼硬甲
    - 互助合作
    - 同伴
    - 存活機會
  - type: self_check
    items:
    - 我能找出文章的大主題，以及作者列舉的五個小主題。
    - 我能找出動物例子和重要細節。
    - 我能整合成全文摘要。
