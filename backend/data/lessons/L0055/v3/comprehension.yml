lesson_uid: L0055
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    answer: C
    stem: 下列語詞，何者使用錯誤？
    options:
      A: 他雖然年輕，卻能「審時度勢」，做出最正確的決定
      B: 兩位選手的實力「相去無幾」，比賽過程十分激烈
      C: 他的成績進步很快，一路「飛簷走壁」升到前十名
      D: 他總是「自命不凡」，覺得自己足以勝任任何挑戰
    option_notes:
      C: (飛簷走壁必須用來形容身手矯健的情況。)
    note_placement: 藍色說明框印在題幹右側。
  - index: 2
    answer: Ｄ
    answer_note: 這一題的答案代號在原稿是**全形**「Ｄ」，其餘各題為半形。
    stem: 根據課文，成年後的公猴比例下降的原因不包括何者？
    options:
      A: 雄性哺乳動物普遍喜歡冒險
      B: 公猴比較喜歡做危險的動作
      C: 母猴比較會評估當下的局勢
      D: 公母猴出生時的比例很懸殊
    option_notes:
      D: (第二段指出公母猴出生時比例為5:5。)
    note_placement: 藍色說明框印在選項 C 那一行的右側，但內容說明的是選項 D。
  - index: 3
    answer: A
    stem: 心理學實驗中，男生在有旁觀者時，為什麼會選擇站得更遠投圈圈？
    options:
      A: 想向他人展示自己很厲害
      B: 他覺得站著越遠容易瞄準
      C: 研究者要求他站後面一點
      D: 男生想要和旁觀者競爭
    option_notes:
      A: (第八段，當有旁觀者時，男生會選擇站得更遠來投圈圈，這種行為反映了男性傾向展示自己的能力，希望獲得他人認可或尊重。)
    note_placement: 藍色說明框印在選項 A 那一行的右側。
  - index: 4
    answer: Ｂ
    answer_note: 這一題的答案代號在原稿是**全形**「Ｂ」。
    stem: 請問下方文章的主題句是哪句話呢？
    passage: 英國首相威爾遜正在演講，台下突然有個異議分子高聲打斷了他：「狗屎！垃圾！」威爾遜雖然受到了干擾，但他不慌不忙的說：「這位先生，請稍安勿躁，我馬上就會講到你所提出的關於環保的問題。」威爾遜以幽默化解危機，值得大家學習。
    options:
      A: 這位先生，請稍安勿躁，我馬上就會講到你所提出的關於環保的問題
      B: 威爾遜以幽默化解危機，值得大家學習
      C: 英國首相威爾遜的演講進行到一半時被打斷了
      D: 台下突然有個異議分子高聲打斷了他：「狗屎！垃圾！」
  - index: 5
    answer: A
    stem: 心理學實驗通常用來回答研究問題。課文中的實驗一和實驗二主要想回答哪一個問題？
    options:
      A: 誰比較容易受到旁觀者的影響？男生還是女生？
      B: 誰能把圈圈丟的比較遠？男生還是女生？
      C: 誰能把圈圈丟的比較準？男生還是女生？
      D: 誰比較能和旁觀者合作？男生還是女生？
    printed_note: (第二段中的「公猴」案例展示了雄性動物普遍具有更高的冒險傾向，這種特性導致雄性在成長過程中面臨更大的生存風險。)
    note_placement: 藍色說明框印在選項 A 那一行的右側。
    note_mismatch: '⚠️ 這個說明框講的是課文第 3 段的公猴案例，跟本題（套圈圈實驗一／二想回答什麼）

      對不上，也解釋不了正解 A。看起來是別題的說明被放到這裡，或是原本要寫的沒寫。

      ⛔ 沒有列入 source_errata，因為勘誤要能寫出「應該是什麼」，而這裡無從得知 ——

      猜一個出來就是編造。照原樣保留，交給人決定。'
  notes:
    answer_carrier: 括號內的答案代號為橘色手寫字（圖形字型），文字流已含此資訊
