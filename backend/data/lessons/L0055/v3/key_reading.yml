  passage: 最近流行跑酷的影音短片，跑酷者幾乎清一色是男生。他們有的徒手飛簷走壁、攀越高牆和欄杆，從高處躍下、翻滾落地；有的騎著登山腳踏車衝上坡道，連人帶車騰空向後翻轉。表演者不知付出多少受傷的代價，才能得到這些看起來英姿煥發的片段。2024年10月，臺中一位高中生因練習跑酷，從二樓跳下而受傷昏迷，這只是眾多傷害事例中的一個。其實不只是人類，許多雄性哺乳類動物也較常做出冒險行為。有兩位人類學家研究日本的短尾猴二十幾年。他們發現，剛出生時，公猴和母猴的比例大約是5：5，但因為大量的公猴在青少年期就死亡，到了成年時，比例便下降到1：5──一隻公猴：五隻母猴。人類學家仔細檢視21年的觀察資料後發現，公猴比較喜歡做危險的動作。例如，從這棵樹跳到那棵樹，母猴總是小心翼翼，寧願爬下樹、走到另一棵樹、再爬上去；公猴總是自命不凡，認為這點距離易如反掌，奮力一跳的結果是……摔死了。公猴也比較不會審時度勢，喜歡冒險穿越附近的公路，結果常常被高速行駛的車輛撞上，一命嗚呼。
  start_text: 最近流行跑酷的影音短片，跑酷者幾乎清一色是男生。
