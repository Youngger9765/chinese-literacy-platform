  section_headings:
  - 愛冒險的男生與公猴
  - 愛逞強的男生
  paragraphs:
  - idx: 1
    text: 　　根據衛福部2023年的統計資料，臺灣15到24歲年齡層的國民，因「事故傷害」死亡的男性人數是女性的3倍以上。事故傷害包括車禍、摔倒、溺水等等。但為什麼男生出意外的機會遠高於女生呢？科學研究指出，可能的原因有二：一、男生比較喜歡冒險；二、男生比較喜歡在別人面前逞強。
    followed_by_heading: 愛冒險的男生與公猴
  - idx: 2
    text: 　　最近流行跑酷的影音短片，跑酷者幾乎清一色是男生。他們有的徒手飛簷走壁、攀越高牆和欄杆，從高處躍下、翻滾落地；有的騎著登山腳踏車衝上坡道，連人帶車騰空向後翻轉。表演者不知付出多少受傷的代價，才能得到這些看起來英姿煥發的片段。2024年10月，臺中一位高中生因練習跑酷，從二樓跳下而受傷昏迷，這只是眾多傷害事例中的一個。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 3
    text: 其實不只是人類，許多雄性哺乳類動物也較常做出冒險行為。有兩位人類學家研究日本的短尾猴二十幾年。他們發現，剛出生時，公猴和母猴的比例大約是5：5，但因為大量的公猴在青少年期就死亡，到了成年時，比例便下降到1：5──一隻公猴：五隻母猴。人類學家仔細檢視21年的觀察資料後發現，公猴比較喜歡做危險的動作。例如，從這棵樹跳到那棵樹，母猴總是小心翼翼，寧願爬下樹、走到另一棵樹、再爬上去；公猴總是自命不凡，認為這點距離易如反掌，奮力一跳的結果是……摔死了。公猴也比較不會審時度勢，喜歡冒險穿越附近的公路，結果常常被高速行駛的車輛撞上，一命嗚呼。
    followed_by_heading: 愛逞強的男生
  - idx: 4
    text: 　　有一個心理學的實驗是這樣進行的。研究者準備了兩個相同的房間。房間的地板上都立著一根大約到膝蓋高度的桿子，桿子前面有一道道綠色膠帶貼出來的橫線，上面標示著1呎、2呎、5呎、10呎、15呎、20呎。學生先被帶進第一個房間。一位研究助理把6個塑膠圈交給參與的學生，指著立桿說：「這是第一個實驗，要請你把圈圈丟過去，套在立桿上。」
  - idx: 5
    text: 　　「我要站哪裡？」學生問。
  - idx: 6
    text: 　　「隨便你，站哪裡都可以。」助理說：「也沒有限定要套進幾個圈圈，我先離開，你丟完圈圈後，我再帶你去做另一個實驗。」說完他就離開了。
  - idx: 7
    text: 　　其實，在實驗一裡，研究者真正想知道的是：學生在「獨自一人的情況」，會選擇站在多遠的地方投圈圈。
  - idx: 8
    text: 幾分鐘後，助理帶學生到另一個房間進行實驗二。任務仍然是套圈圈，唯一不同的是，這次房間裡多了兩位同性別的旁觀者。如果你是女生，就有兩個女生坐在椅子上看你投；如果你是男生，就有兩個男生看你投。
  - idx: 9
    text: 　　研究結果發現，男生在別人面前特別會逞英雄。大部分的女生，不管有沒有旁觀者，她們在實驗一和實驗二所站的位置都相去無幾。但男生就不同了，有人旁觀時，他投圈圈就會刻意站遠一點。例如，沒人觀看時，甲男站在2呎遠處投，但有人觀看時，他會退到5呎遠；乙男的表現更是有過之而無不及，沒人觀看時，他站在5呎遠處投，但旁邊有人時，他居然退到10呎遠。
  - idx: 10
    text: 　　2023年有一部爆紅的影片《山道猴子的一生》，劇中描述一群年輕人揪團騎重機跑山，不惜借高利貸借錢買車、改車。主角最後在山路飆速過程中命喪輪底。
  trailing: 　　你來猜猜看，影片的主角是男的還是女的？
