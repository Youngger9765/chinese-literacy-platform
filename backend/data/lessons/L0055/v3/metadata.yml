  總表_對照: '總表列 9 個語詞，學習單只有 8 個 —— 多出來的是「驟降」。

    「驟降」在學習單的三處（第三大題語詞框、第四大題選項 A~H、第八大題找字框與灰框）

    **都沒有出現**，課文本身也沒有這個詞（課文寫的是「比例便下降到1：5」）。

    學習單自己的三處內容一致（同樣 8 個語詞、同樣的順序群組），所以判定是總表多列。'
strategy_explained: 這一課我們要練習的，是從每一段話裡找出最重要的「一句話」，也就是這段話想告訴你的重點是什麼，這篇文章特別適合練習，因為它用跑酷、猴子和實驗來說明男性愛冒險的原因，每個例子都像在告訴你一個小故事，你可以試著讀一段，然後問自己：「這段話最想告訴我什麼」，把那個重點找出來
