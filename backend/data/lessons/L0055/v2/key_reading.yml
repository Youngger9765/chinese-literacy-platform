passage: 最近流行跑酷的影音短片，跑酷者幾乎清一󠇡色是男生。他們有的徒手飛簷走壁、攀越高牆和欄杆，從高處躍下、翻滾落地；有的騎著登山腳踏車衝上坡道，連人帶車騰空向後翻轉。表演者不知付出多少受傷的代價，才能得到這些看起來英姿煥發的片段。2024年10月，臺中一位高中生因練習跑酷，從二樓跳下而受傷昏迷，這只是眾多傷害事例中的一個。
