spotlight:
  lesson: G6-L15
  strategy_name: 摘要策略-從段落找主題句
  strategy_type: summary
  blocks:
  - type: guide
    text: '主題句是段落中最能說出主要內容的句子。其他句子通常會說明、舉例或補充它。

      有些段落的主題句在開頭，有些在中間或結尾。找主題句時，不能只看句子的位置，還要判斷：

      哪一句最能說出整段的主要內容？

      其他句子是不是在說明、舉例或補充它？

      找主題句可以用兩個步驟：

      一、分句子：找出句號、問號和驚嘆號，把段落分成幾句，依序標上號碼。

      二、找主題句：找出最能說明整段主要內容的句子，再用其他句子檢查答案。

      例如：〈如何製作好喝的烏龍茶？〉

      第一步：分句子：把段落裡的句子分出來'
  - type: guide
    text: '❶製作好喝的烏龍茶，要經過幾個重要步驟。／❷師傅們先將剛摘下來的茶葉曬過，以減少水分。／❸接著讓茶葉發酵，再用高溫處理，保留茶葉的香氣。／❹最後，將茶葉乾燥、烘焙為好喝又清香的烏龍茶。／

      →我總共分出（　4　）句。

      第二步：找主題句：找出最能說明整段主要內容的句子

      (1)想想句子的關係

      第❶句先說出整段的主要內容：製作烏龍茶要經過幾個重要步驟；第❷～❹句再依序說明製作步驟。

      (2)所以第（ １ ）句是主題句。'
  - type: guide
    text: ◎小試身手一：〈咦，北極熊的毛是什麼顏色？〉
  - type: guide
    text: 很多人誤以為白色的北極熊有一身雪白光亮的毛。/事實上，北極熊的毛根本不是白色的，而是透明的！/我們現在看到的白色，是因為透明中空的毛髮經過光線反射，才會讓我們覺得北極熊的毛是雪白色的。/
  - type: passage
    source: unknown
    paragraphs:
    - 第一步：分句子（把段落裡的句子區分出來）
    - →我總共分出（　３　）句。
    - 第二步：找主題句（最能說明段落重點的句子）
  - type: free_text
    prompt: (1)想想句子的關係，第❶句說出人們對北極熊的誤解；第❷句說明北極熊的毛其實是透明的；第❸句是補充說明透明的毛為什麼看起來像是白色的。
  - type: free_text
    prompt: (2)所以哪一句是主題句？→段落重點應該是呼應標題說明「北極熊的毛是什麼顏色？」，所以第（　2　）句為主題句。
  - type: guide
    text: ◎小試身手二：〈愛冒險的公猴〉
  - type: free_text
    prompt: ❶其實不只是人類，日本短尾猴的公猴也比母猴更常做出冒險行為。/❷有兩位人類學家研究日本的短尾猴二十幾年。/❸他們發現，剛出生時，公猴和母猴的比例大約是5：5，但因為大量的公猴在青少年期就死亡，到了成年時，比例便下降到1：5──一隻公猴：五隻母猴。/❹人類學家仔細檢視21年的觀察資料後發現，公猴比較喜歡做危險的動作。/❺例如，從這棵樹跳到那棵樹，母猴總是小心翼翼，寧願爬下樹、走到另一棵樹、再爬上去；公猴總是自命不凡，認為這點距離易如反掌，奮力一跳的結果是……摔死了。/❻公猴也比較不會審時度勢，喜歡冒險穿越附近的公路，結果常常被高速行駛的車輛撞上，一命嗚呼。/
  - type: passage
    source: unknown
    paragraphs:
    - 第一步：分句子（把段落裡的句子區分出來）
    - →我總共分出（６ ）句。
    - 第二步：找主題句（最能說明段落重點的句子）
  - type: free_text
    prompt: (1)想想句子的關係，
  - type: passage
    source: unknown
    paragraphs:
    - 第（ １ ）句說出日本短尾猴的公猴也比母猴更常做出冒險行為。
    - 第（ 2  ）～（ 6  ）句用研究資料和具體例子加以說明。
  - type: free_text
    prompt: (2)所以第（１）句是主題句。
  - type: guide
    text: ◎小試身手三：〈套圈圈實驗的結果〉
  - type: free_text
    prompt: ❶研究結果發現，男生在別人面前特別會逞英雄。/❷大部分的女生，不管有沒有旁觀者，她們在實驗一和實驗二所站的位置都相去無幾。/❸但男生就不同了，有人旁觀時，他投圈圈時就會刻意站遠一點。/❹例如，沒人觀看時，甲男站在2呎遠處投，但有人觀看時，他會退到5呎遠；乙男的表現更是有過之而無不及，沒人觀看時，他站在5呎遠處投，但旁邊有人時，他居然退到10呎遠。/
  - type: free_text
    prompt: 1.請用前面的兩個步驟判斷這段主題句是哪一句。
  - type: free_text
    prompt: 2.這段的主題句是：第（ 1  ）句
  - type: guide
    text: ◎小試身手四：〈運動前的準備〉
  - type: free_text
    prompt: ❶阿哲跑步前，先活動肩膀、手臂和腿部。/❷接著，他慢跑幾分鐘，讓身體慢慢暖起來。/❸過了一會兒，他的身體暖了，手腳也活動開了。/❹所以，運動前做好熱身十分重要。/
  - type: free_text
    prompt: 1.請用前面的兩個步驟判斷這段主題句是哪一句。
  - type: free_text
    prompt: 2.這段的主題句是：第（ 4  ）句
  - type: passage
    source: unknown
    paragraphs:
    - →你發現了嗎？
    - 主題句不一定在第一句，也可能出現在段落中間或結尾。
    - 找主題句時最重要的是判斷：
    - '這一句能不能說出整段的主要內容？

      其他句子是不是在說明、舉例或補充它？'
    - 如果你做到了，請在□內打勾。
  - type: self_check
    items:
    - 我能根據句號、問號和驚嘆號，把段落分成幾句。
    - 我能找出最能說明整段主要內容的句子。
    - 我能用其他句子檢查，它們是不是在說明、舉例或補充主題句。
