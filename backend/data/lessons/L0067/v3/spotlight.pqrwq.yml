lesson_uid: L0067
version_id: v3
section_no: 一
spotlight:
  strategy_name: 自我提問策略1──跟著人物故事線問問題
  strategy_type: self_questioning
  section_title_printed: 閱讀聚光燈-自我提問策略1──跟著人物故事線問問題
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）與橘色手寫字
  structure_note: '⛔ 原稿第 3～8 段是「左欄課文／右欄自我提問」的兩欄表格，本檔把它攤平成

    passage → 檢查題 → passage → 檢查題 的線性順序（依實際閱讀動線：先讀 3～5 段，

    停下來檢查，再讀 6～7 段）。不塞進巢狀 —— `BlockSequenceRenderer` 的

    `renderSubBlock` 不依 type 分派，巢狀的選項會整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '自我提問策略：一邊讀、一邊問自己

      你閱讀時，會不會一邊讀，一邊在心裡問自己問題？例如「主角想做什麼？」「我能回答剛才的問題嗎？」這種一邊讀、一邊問自己的方法，叫做自我提問策略。

      這篇文章寫賴桑如何實現種樹志願。很多寫人物努力完成一件事的文章，常沿著一條故事線發展：

      想做什麼→遇到困難，怎麼繼續做→最後有什麼成果與改變

      閱讀時，可以跟著故事發展，選一個問題問自己。讀完後，再檢查：我能完整回答，也找得到課文線索嗎？

      先跟著老師一起做，再換你自己試試看。'
  - type: guide
    text: 一、認識人物故事線
  - type: single
    prompt: 很多寫人物努力完成一件事的文章，常沿著哪一條故事線發展？
    options:
      1: 人物長什麼樣子→喜歡什麼→認識哪些朋友
      2: 想做什麼→怎麼繼續做→帶來什麼改變
      3: 提出不同意見→比較各方理由→表明立場
    answer: 2
  - type: guide
    text: 1.自我提問小卡
  - type: table
    columns:
    - 人物故事線
    - 我可以問自己
    rows:
    - - ①想做什麼
      - ①他想做什麼？為什麼想做？
    - - ②怎麼繼續做
      - ②他遇到什麼困難？怎麼繼續下去？
    - - ③帶來什麼改變
      - ③最後有什麼成果？帶來哪些改變？
  - type: guide
    text: →閱讀時，先看故事發展到哪裡，再選一個適合的問題問自己。
  - type: guide
    text: '2.我的閱讀檢查小卡

      讀完一部分後，檢查：我能完整回答，也找得到課文線索嗎？'
  - type: table
    columns:
    - 我的閱讀情況
    - 接下來怎麼做
    rows:
    - - ①我只能回答一部分，或找不到線索
      - ①回頭找線索
    - - ②我能完整回答，也找得到線索
      - ②換下一個問題
  - type: guide
    text: 二、一起做：先問再讀，閱讀比較有方向
  - type: guide
    text: ❶先問，再讀
  - type: single
    prompt: 1.這篇文章寫賴桑的故事，讀故事開頭時，我們先看看：現在最適合帶著哪個問題讀？
    options:
      1: 他想做什麼？為什麼想做？
      2: 他遇到什麼困難？怎麼繼續下去？
      3: 最後有什麼成果？帶來哪些改變？
    answer: 1
  - type: guide
    text: →先選①。接下來，就帶著這個問題讀第1段。
  - type: guide
    text: '❷帶著問題讀

      第1段的訊息很多，有些是在介紹賴桑，有些能幫助我們回答問題。

      第1段，把能回答「他想做什麼？為什麼想做？」的句子畫線作記號。'
  - type: passage
    label: 森林大軍的守護者
    paragraphs:
    - （段1）臺灣有個種樹達人，名叫賴倍元，大家都稱他為賴桑。童年時期的賴桑，喜歡到溪邊抓泥鰍、到樹上摘果實，整天與大自然為伍。十四歲開始，他跟著父親經營家族的運輸事業，工作之餘，就會騎著機車上山看神木。他常仰望著三千多歲的神木，呼吸著森林裡獨特的沁涼空氣，感受到自己生命的短暫與大自然的永恆，所有的煩惱也消失殆盡。他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。
    - （段2）心志定了，接下來就是實際行動。
    paragraphs_note: 段首的（段1）（段2）是原稿印的，照抄保留；段序即 body.paragraphs 的 1、2
  - type: guide
    text: ❸一起找線索
  - type: multi
    prompt: ①賴桑想做什麼？
    options:
      1: 他想經營一個不會被時間淘汰的事業，決定開始種樹。
    answers:
    - 1
    option_count_note: '原稿這一題只印**一個**紅色 ☑ 方框（教師版已勾），不是三選一。

      紙面上的作答動作是「勾一個方框」，所以不能改成 free_text（那會變成要學生用寫的）；

      `single` 契約要求 ≥2 個選項所以也不成立。`multi` 是唯一同時符合三件事的型別：

      作答動作是勾選、契約不限選項數、答案 `answers: [1]` 保得住教師版的 ☑。

      同課「❹再停一下，檢查理解」也是一個選項的 multi，形狀一致。'
  - type: multi
    prompt: '②他為什麼想做？

      看神木 → 感受到生命短暫、自然永恆 → 思考生命的意義'
    options:
      1: 看神木的經驗，讓他慢慢形成種樹的願望
    answers:
    - 1
    option_count_note: 題幹第二行的箭頭鏈是原稿印的思考鷹架（沒有方框），下面那一行才是唯一的 ☑ 方框；型別理由同上一題
  - type: guide
    text: →找線索時，要找和問題最直接相關的內容。
  - type: self_check
    label: ❹停一下，檢查理解
    instruction: 讀完第1段，檢查剛才的問題：
    items:
    - ①我能說出賴桑想做什麼。
    - ②我能說出賴桑為什麼產生種樹的想法。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩格都是空的 □
  - type: guide
    text: '有一項還說不清楚，就依「閱讀檢查小卡」，回到第1段再找線索。

      →你發現了嗎？先帶著問題讀，可以從許多訊息中，找到能回答問題的重要線索。'
  - type: guide
    text: 三、換你試試看：跟著故事線選問題
  - type: guide
    text: 1.第1段已經知道賴桑想做什麼，第2段說：「接下來就是實際行動。」表示故事要往下一步發展了。
  - type: single
    prompt: ❶接下來最適合問哪一個選項裡的問題？
    options:
      1: 他想做什麼？為什麼？
      2: 他遇到什麼困難？怎麼繼續下去？
      3: 最後有什麼成果？帶來什麼改變？
    answer: 2
  - type: guide
    text: '❷帶著問題讀

      請帶著問題②閱讀第3～7段。內容比較長，我們分兩次讀。

      先讀3～5段，停下來檢查一次，再繼續讀第6～7段。'
  - type: passage
    label: 森林大軍的守護者
    paragraphs:
    - （段3）二十九歲那年，他花了三千萬元買下第一座山。卻發現整座山布滿垃圾和廢棄物，蒼蠅嗡嗡嗡的飛來飛去，根本沒什麼價值。原來，這裡曾是果園，因為長年無人管理，遭人偷偷倒了大量垃圾。他被眼前的景象震懾住了，但隨即轉變念頭，告訴自己：「沒關係！最壞的都留給我吧！」
    - （段4）他開著卡車上山清運垃圾，花了好幾個月，來來回回跑了兩千多趟，才把垃圾清光。親友們都認為賴桑若不是瘋了，就是很笨。但是他不以為意，還將貨運行交給妻子管理，就這樣一個人上山去種樹。
    - （段5）但要種什麼樹呢？他諮詢了許多木材行老闆，大家都告訴他要種肖楠。肖楠是臺灣特有種，適合種在海拔一千多公尺的山區，樹高可達五十公尺。於是他買了數千株樹苗，準備種樹。但這裡過去是廢棄的果園，長期使用除草劑，不但破壞了土質，也使土壤失去涵養水分的功能。為了讓樹苗順利長大，賴桑決定不使用化學肥料和除草劑。他不畏懼挑戰，改以人工除草，又鋪設了四十多公里的水管，定時澆灌剛種下的小樹苗。這可是一項耗時費力的浩大工程。辛苦歸辛苦，但賴桑說：「我的信仰就是種樹，人類過去砍了太多樹，我要把它們種回來！」三十年來，他已經在大雪山種了三十多萬棵珍貴樹木。賴桑的夢想，是在有生之年種下五十萬棵臺灣珍貴樹木，包括肖楠、牛樟、松樹、柏樹等。
    paragraphs_note: '原稿印（段3）（段4）（段5）。第 3 段這裡印「買下第一座山。卻發現」（句號），

      與「二 讀全文」的同一段（逗號）不一致 —— 兩處都照原樣，未統一。'
  - type: guide
    text: ❶停一下，檢查理解 (請看右欄❸)
    note: '原稿兩欄表格「左欄課文」末尾的指標，指向右欄的 ❸。本檔攤平成線性後，

      它指的就是緊接在下面的那一題。照原稿字句保留，不改寫成「請看下方」。'
  - type: multi
    prompt: '❸停一下，檢查理解

      讀完3～5段，哪些內容已經可以回答？(勾選)'
    options:
      1: 賴桑遇到哪些困難。
      2: 賴桑自己怎麼克服困難。
    answers:
    - 1
    - 2
  - type: guide
    text: '有一項說不清楚

      請依「閱讀檢查小卡」→回到第3～5段再找線索。'
  - type: passage
    label: 森林大軍的守護者
    paragraphs:
    - （段6）買地要錢、買樹苗要錢、僱工種樹要錢、鋪設水管要錢，每一樣都要錢。賴桑哪裡來的錢呢？這就要說到一路支持他的家人。
    - （段7）在賴桑專心上山種樹後，賴太太扛起家庭與公司的一切責任，生活非常辛苦，常常躲起來哭泣。但她擦乾眼淚後，總會想辦法幫先生籌措一筆又一筆的錢，讓他買下一座又一座的山，種下一棵又一棵的樹。賴桑的兩個兒子看見媽媽如此辛苦，起初很不能諒解父親的作為，覺得爸爸拋家棄子、不負責任；但隨著地球暖化日益嚴重，愈來愈多人注意到他所做的事，連總統也到山上感謝賴桑的付出。兒子們才漸漸理解，父親做的是真正重要、能造福子子孫孫的事。看到爸爸種樹有成，兒子們也開始在樹蔭下種植不太需要陽光直射、又有經濟價值的咖啡樹，再將販售所得投入父親的種樹志業。
    paragraphs_note: 原稿印（段6）（段7）
  - type: guide
    text: ❶停一下，檢查理解 (請看右欄❹)
    note: 同上，原稿左欄末尾指向右欄 ❹ 的指標；攤平後指的是緊接在下面的那一題
  - type: multi
    prompt: '❹再停一下，檢查理解

      讀完第6～7段，又可以回答哪一部分？(勾選)'
    options:
      1: 家人怎麼幫助種樹行動繼續。
    answers:
    - 1
    option_count_note: 原稿右欄這一題只印一個選項（第二次要回答的只剩一項），非漏抄
  - type: guide
    text: '還說不清楚。就回到第6-7段再找線索。

      →前後合起來，問題②就完整回答了。'
  - type: guide
    text: '◎再問一句：讀懂兒子的改變

      讀完第7段，我們已經知道

      →起初：兒子不能諒解父親；後來：兒子用行動支持父親。

      但兒子為什麼改變，還不清楚。'
  - type: single
    prompt: '❶問自己什麼？

      要讀懂兒子前後的變化，最適合問哪一個問題？'
    options:
      1: 兒子後來用什麼方法支持父親？
      2: 什麼事情使兒子改變原來的看法？
    answer: 2
  - type: guide
    text: '❷帶著問題，回讀第7段

      請畫出能回答問題的線索。'
  - type: free_text
    prompt: '❸兒子為什麼改變？

      兒子看見種樹已有【　】，也明白父親做的是能【　】的事，因此由不能諒解轉為支持。'
    blanks:
    - answer: 成果
    - answer: 造福子孫
    answer_carrier: 橘色手寫字（PDF p5）；文字層的【　】內已填有同樣的答案
  - type: guide
    text: →人物的行為或態度前後明顯不同時，可以問自己：什麼事情使他改變？
  - type: passage
    label: 森林大軍的守護者
    paragraphs:
    - （段8）經過數十年的用心經營，現在走進大雪山林場，從山坡上往下看，一棵棵站得挺直的大樹，像極了精神抖擻的森林大軍。森林裡的生態豐富而多元，小動物、小昆蟲處處可見，鳥聲蟲鳴時時入耳；大冠鷲盤旋天空的景致，更是迷人！這樣的美景感動了一批又一批的登山者，在眾人口耳相傳、媒體爭相報導後，愈來愈多人認同賴桑的理念，一起加入種樹的行列。賴桑認為，推廣種樹和種樹一樣重要，他希望影響更多人，一起為下一代留下美麗的森林寶藏。
    paragraphs_note: 原稿印（段8）
  - type: single
    prompt: '❶停一下，換下一個問題

      問題②已經回答了。接下來最適合問哪一題？'
    options:
      1: 他想做什麼？為什麼？
      2: 他遇到什麼困難？怎麼繼續做？
      3: 最後有什麼成果？帶來哪些改變？
    answer: 3
  - type: guide
    text: 請帶著問題讀第8段，畫出能回答問題的線索。
  - type: multi
    prompt: ❷讀完，檢查理解
    options:
      1: 種樹有什麼成果。
      2: 成果帶來什麼影響。
    answers:
    - 1
    - 2
  - type: guide
    text: 有一項說不清楚，就回第8段再找線索。
  - type: guide
    text: 四、把三個問題合起來，看懂全文
  - type: single
    prompt: 1.下列哪一項最能說明全文的發展？（單選）
    options:
      1: 賴桑看神木後產生種樹的想法，後來種下許多珍貴樹木。
      2: 賴桑看神木後產生種樹的想法，開始行動，克服困難、得到家人支持，最後影響更多人種樹。
    answer: 2
  - type: guide
    text: 五、我的發現與自我檢核
  - type: single
    prompt: '1.我的發現：

      哪一項最能說明這一課學到的方法？（單選）'
    options:
      1: 跟著每一句提出新問題，才能記住文章所有細節。
      2: 跟著故事線選問題，能找重要內容；回答不完整時，我會回頭找線索。
    answer: 2
  - type: self_check
    label: 2.自我檢核
    instruction: 如果你有做到，請在□打勾。
    items:
    - ①我能根據人物故事發展，選出現在最適合問自己的問題。
    - ②我會帶著問題找線索；回答不完整時，會回頭再讀。
    - ③我能把三個問題的答案合起來，看懂全文發展。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三格都是空的 □
  slug: pqrwq
  text_ref: dhqrv
