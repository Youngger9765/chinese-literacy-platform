vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 與…為伍
  - 仰望
  - 沁涼
  - 殆盡
  - 震懾
  - 畏懼
  - 有生之年
  - 籌措
  - 諮詢
  - 拋家棄子
