  items:
  - index: 1
    word: 沁涼
    definition: 形容涼爽、清涼。
  - index: 2
    word: 仰望
    definition: 抬頭向上看。
  - index: 3
    word: 殆盡
    definition: 幾乎全部消失或用完。
  - index: 4
    word: 諮詢
    definition: 詢問、徵求意見。
  - index: 5
    word: 精神抖擻
    definition: 非常有精神的樣子。
  - index: 6
    word: 震懾
    definition: 受到強烈的力量或景象影響，感到震驚、害怕。
  - index: 7
    word: 畏懼
    definition: 害怕，恐懼。
  - index: 8
    word: 與…為伍
    definition: 和……相處、作伴。
  - index: 9
    word: 有生之年
    definition: 人還活在世上的時間。
  - index: 10
    word: 拋家棄子
    definition: 離開家庭，不管孩子。
  - index: 11
    word: 籌措
    definition: 想辦法準備或募集所需的資金、物資。
