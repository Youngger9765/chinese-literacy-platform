strategy_explained: 這一課我們要練習的是「自己問自己問題」的小技巧，就像賴桑自己常常問自己「這樣做對不對」，我們也要對文章中的情節感到好奇，問出「為什麼他要這樣做」「他怎麼辦到的」這樣的問題，這樣才能更深入了解賴桑如何堅持種樹，把荒山變森林，感受他的堅毅品格喔
