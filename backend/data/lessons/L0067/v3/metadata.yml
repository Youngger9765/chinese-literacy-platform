intro: 這篇文章介紹了臺灣一位名叫賴倍元的種樹達人，大家稱他為賴桑。賴桑年輕時就熱愛大自然，後來他決定投入種樹事業，希望能為環境盡一份心力。文章描述了他如何買下荒廢的山林，親手清理垃圾，並克服種種困難，堅持不使用化學藥劑，用心栽種樹木。過程中，他也得到了家人的支持與理解。經過數十年的努力，賴桑成功將荒山變成了生機盎然的森林，吸引了許多人認同他的理念，並加入種樹的行列。
