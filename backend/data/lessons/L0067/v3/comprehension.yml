lesson_uid: L0067
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列「　」中的語詞，哪一項使用不恰當？
    options:
      A: 他們歷經千辛萬苦，終於「籌措」到開店所需的資金
      B: 眼前如詩如畫的景象，深深「震懾」了所有在場的人
      C: 一場無情大火，把他們辛苦建立的家園燒得「殆盡」
      D: 走進山林，迎面而來的「沁涼」空氣令人神清氣爽
    explanation: 語詞誤用，震懾是指受到強烈的驚嚇恐懼，不能用於美景。
    explanation_note: 原稿是一個浮動說明框，印在題幹右側
  - index: 2
    answer: D
    stem: 下列對賴桑人物特質與課文證據的配對，哪一項最不合理？
    options:
      A: 熱愛自然——從小與大自然為伍，工作之餘常上山看神木
      B: 堅持理想——面對親友的不理解，仍持續種樹三十多年
      C: 勇於行動——清運垃圾、人工除草，並鋪設水管照顧樹苗
      D: 重視名聲——愈來愈多人注意他的事，連總統也上山感謝他
  - index: 3
    answer: B
    stem: 賴桑為什麼不用化學肥料和除草劑，改以人工除草？
    options:
      A: 為了保留雜草覆蓋土壤，避免水分太快流失
      B: 為了避免繼續破壞土質，讓樹苗順利長大
      C: 為了減少種樹花費，把經費留給購買樹苗
      D: 為了提高除草效率，加快完成種樹的速度
    explanation: (第五段：為了讓樹苗能夠順利長大，賴桑決定不使用化學肥料和除草劑，改以人工除草。
    explanation_note: 原稿是一個浮動說明框；左括號沒有對應的右括號，照原樣未補
  - index: 4
    answer: A
    stem: 根據第7段，哪一項最能說明賴太太如何支持賴桑種樹？
    options:
      A: 扛起家庭與公司的責任，並持續籌措種樹資金。
      B: 先反對丈夫上山種樹，後來才逐漸接受他的選擇。
      C: 把家庭與公司交給兒子，自己上山協助種植樹苗。
      D: 等待森林已有成果後，才開始提供種樹所需經費。
    explanation: 第4題解析：第七段：賴桑妻子理解並支援他的種樹行動，承擔起家庭和公司的重擔，並多次幫助籌措資金，支援丈夫的事業。
    explanation_note: 原稿是一個浮動說明框，印在第 5 題選項下方（第 4、5 題的解析並排在同一個框裡）
    teacher_note: 第七段：賴桑妻子理解並支援他的種樹行動，承擔起家庭和公司的重擔，並多次幫助籌措資金，支援丈夫的事業。
  - index: 5
    answer: C
    stem: 下列哪一項不是賴桑種樹或推廣種樹想達成的目標？
    options:
      A: 在有生之年種下五十萬棵臺灣珍貴樹木
      B: 影響更多人一起加入種樹與守護山林的行列
      C: 透過名人和媒體宣傳，打造自己的品牌形象
      D: 為下一代留下美麗而珍貴的森林寶藏。
    explanation: 第5題解析：文章最後寫到：賴桑認為，推廣種樹和種樹一樣重要，他希望影響更多人，一起為下一代留下美麗的森林寶藏。
    explanation_note: 原稿是一個浮動說明框，與第 4 題解析並排
    teacher_note: 文章最後寫到：賴桑認為，推廣種樹和種樹一樣重要，他希望影響更多人，一起為下一代留下美麗的森林寶藏。
  notes:
    answer_carrier: 橘色手寫代號（PDF p11~p12）；文字層的（　）內已填有同樣的代號
