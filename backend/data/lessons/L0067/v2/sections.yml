      C: 透過名人和媒體宣傳，打造自己的品牌形象
      D: 為下一代留下美麗而珍貴的森林寶藏。
    rationale: 第4題解析：第七段：賴桑妻子理解並支援他的種樹行動，承擔起家庭和公司的重擔，並多次幫助籌措資金，支援丈夫的事業。
