passage: '你閱讀時，會不會一邊讀，一邊在心裡問自己問題？例如「主角想做什麼？」「我能回答剛才的問題嗎？」這種一邊讀、一邊問自己的方法，叫做自我提問策略。

  這篇文章寫賴桑如何實現種樹志願。很多寫人物努力完成一件事的文章，常沿著一條故事線發展：

  想做什麼→遇到困難，怎麼繼續做→最後有什麼成果與改變

  閱讀時，可以跟著故事發展，選一個問題問自己。讀完後，再檢查：我能完整回答，也找得到課文線索嗎？

  先跟著老師一起做，再換你自己試試看。

  （段1）臺灣有個種樹達人，名叫賴倍元，大家都稱他為賴桑。童年時期的賴桑，喜歡到溪邊抓泥鰍、到樹上摘果實，整天與大自然為伍。十四歲開始，他跟著父親經營家族的運輸事業，工作之餘，就會騎著機車上山看神木。他常仰望著三千多歲的神木，呼吸著森林裡獨特的沁涼空氣，感受到自己生命的短暫與大自然的永恆，所有的煩惱也消失殆盡。他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。'
