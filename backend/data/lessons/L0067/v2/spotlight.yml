spotlight:
  lesson: G6-L28
  strategy_name: 自我提問策略1-跟著人物故事線問問題
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: "自我提問策略：一邊讀、一邊問自己\n你閱讀時，會不會一邊讀，一邊在心裡問自己問題？例如「主角想做什麼？」「我能回答剛才的問題嗎？」這種一邊讀、一邊問自己的方法，叫做自我提問策略。\n\
      這篇文章寫賴桑如何實現種樹志願。很多寫人物努力完成一件事的文章，常沿著一條故事線發展： \n  想做什麼→遇到困難，怎麼繼續做→最後有什麼成果與改變\n\
      閱讀時，可以跟著故事發展，選一個問題問自己。讀完後，再檢查：我能完整回答，也找得到課文線索嗎？\n先跟著老師一起做，再換你自己試試看。"
  - type: guide
    text: 一、認識人物故事線
  - type: single
    prompt: 很多寫人物努力完成一件事的文章，常沿著哪一條故事線發展？
    options:
    - 人物長什麼樣子→喜歡什麼→認識哪些朋友
    - 想做什麼→怎麼繼續做→帶來什麼改變
    - 提出不同意見→比較各方理由→表明立場
    answer: 想做什麼→怎麼繼續做→帶來什麼改變
  - type: free_text
    prompt: 1.自我提問小卡
  - type: table
    rows:
    - - 人物故事線
      - 我可以問自己
    - - ①想做什麼
      - ①他想做什麼？為什麼想做？
    - - ②怎麼繼續做
      - ②他遇到什麼困難？怎麼繼續下去？
    - - ③帶來什麼改變
      - ③最後有什麼成果？帶來哪些改變？
  - type: guide
    text: →閱讀時，先看故事發展到哪裡，再選一個適合的問題問自己。
  - type: free_text
    prompt: 2.我的閱讀檢查小卡
  - type: guide
    text: 讀完一部分後，檢查：我能完整回答，也找得到課文線索嗎？
  - type: table
    rows:
    - - 我的閱讀情況
      - 接下來怎麼做
    - - ①我只能回答一部分，或找不到線索
      - ①回頭找線索
    - - ②我能完整回答，也找得到線索
      - ②換下一個問題
  - type: guide
    text: 二、一起做：先問再讀，閱讀比較有方向
  - type: free_text
    prompt: ❶先問，再讀
  - type: single
    prompt: 1.這篇文章寫賴桑的故事，讀故事開頭時，我們先看看：現在最適合帶著哪個問題讀？
    options:
    - 他想做什麼？為什麼想做？
    - 他遇到什麼困難？怎麼繼續下去？
    - 最後有什麼成果？帶來哪些改變？
    answer: 他想做什麼？為什麼想做？
  - type: guide
    text: →先選①。接下來，就帶著這個問題讀第1段。
  - type: free_text
    prompt: ❷帶著問題讀
  - type: guide
    text: 第1段的訊息很多，有些是在介紹賴桑，有些能幫助我們回答問題。
  - type: guide
    text: 第1段，把能回答「他想做什麼？為什麼想做？」的句子畫線作記號。
  - type: guide
    text: 森林大軍的守護者
  - type: guide
    text: （段1）臺灣有個種樹達人，名叫賴倍元，大家都稱他為賴桑。童年時期的賴桑，喜歡到溪邊抓泥鰍、到樹上摘果實，整天與大自然為伍。十四歲開始，他跟著父親經營家族的運輸事業，工作之餘，就會騎著機車上山看神木。他常仰望著三千多歲的神木，呼吸著森林裡獨特的沁涼空氣，感受到自己生命的短暫與大自然的永恆，所有的煩惱也消失殆盡。他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。
  - type: guide
    text: （段2）心志定了，接下來就是實際行動。
  - type: guide
    text: ①賴桑想做什麼？
  - type: guide
    text: 他想經營一個不會被時間淘汰的事業，決定開始種樹。
  - type: guide
    text: ②他為什麼想做？
  - type: guide
    text: 看神木 → 感受到生命短暫、自然永恆 → 思考生命的意義
  - type: guide
    text: 看神木的經驗，讓他慢慢形成種樹的願望
  - type: guide
    text: →找線索時，要找和問題最直接相關的內容。
  - type: free_text
    prompt: ❹停一下，檢查理解
  - type: guide
    text: 讀完第1段，檢查剛才的問題：
  - type: single
    prompt: 請選擇
    options:
    - 我能說出賴桑想做什麼。
    - 我能說出賴桑為什麼產生種樹的想法。
    answer: 我能說出賴桑想做什麼。
  - type: guide
    text: 有一項還說不清楚，就依「閱讀檢查小卡」，回到第1段再找線索。
  - type: guide
    text: →你發現了嗎？先帶著問題讀，可以從許多訊息中，找到能回答問題的重要線索。
  - type: guide
    text: 三、換你試試看：跟著故事線選問題
  - type: free_text
    prompt: 1.第1段已經知道賴桑想做什麼，第2段說：「接下來就是實際行動。」表示故事要往下一步發展了。
  - type: single
    prompt: ❶接下來最適合問哪一個選項裡的問題？
    options:
    - 他想做什麼？為什麼？
    - 他遇到什麼困難？怎麼繼續下去？
    - 最後有什麼成果？帶來什麼改變？
    answer: 他遇到什麼困難？怎麼繼續下去？
  - type: free_text
    prompt: ❷帶著問題讀
  - type: guide
    text: 請帶著問題②閱讀第3～7段。內容比較長，我們分兩次讀。
  - type: guide
    text: 先讀3～5段，停下來檢查一次，再繼續讀第6～7段。
  - type: fill_table
  - type: guide
    text: 四、把三個問題合起來，看懂全文
  - type: single
    prompt: 1.下列哪一項最能說明全文的發展？（單選）
    options:
    - 賴桑看神木後產生種樹的想法，後來種下許多珍貴樹木。
    - 賴桑看神木後產生種樹的想法，開始行動，克服困難、得到家人支持，最後影響更多人種樹。
    answer: 賴桑看神木後產生種樹的想法，開始行動，克服困難、得到家人支持，最後影響更多人種樹。
  - type: guide
    text: 五、我的發現與自我檢核
  - type: free_text
    prompt: 1.我的發現：
  - type: single
    prompt: 哪一項最能說明這一課學到的方法？（單選）
    options:
    - 跟著每一句提出新問題，才能記住文章所有細節。
    - 跟著故事線選問題，能找重要內容；回答不完整時，我會回頭找線索。
    answer: 跟著故事線選問題，能找重要內容；回答不完整時，我會回頭找線索。
  - type: free_text
    prompt: 2.自我檢核
  - type: multi
    prompt: 請選擇
    options:
    - 我能根據人物故事發展，選出現在最適合問自己的問題。
    - 我會帶著問題找線索；回答不完整時，會回頭再讀。
    - 我能把三個問題的答案合起來，看懂全文發展。
    answer:
    - 我能根據人物故事發展，選出現在最適合問自己的問題。
    - 我會帶著問題找線索；回答不完整時，會回頭再讀。
    - 我能把三個問題的答案合起來，看懂全文發展。
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 二
  - type: guide
    text: ◎ 我的表現
  - type: free_text
    prompt: (1)    沁涼     ：形容涼爽、清涼。
  - type: free_text
    prompt: (2)    仰望     ：抬頭向上看。
  - type: free_text
    prompt: (3)    殆盡     ：幾乎全部消失或用完。
  - type: free_text
    prompt: (4)    諮詢     ：詢問、徵求意見。
  - type: free_text
    prompt: (5)   精神抖擻    ：非常有精神的樣子。
  - type: free_text
    prompt: (6)   震懾       ：受到強烈的力量或景象影響，感到震驚、害怕。
  - type: free_text
    prompt: (7)   畏懼         ：害怕，恐懼。
  - type: free_text
    prompt: (8)   與…為伍      ：和……相處、作伴。
  - type: free_text
    prompt: (9)   有生之年      ：人還活在世上的時間。
  - type: free_text
    prompt: (10)   拋家棄子     ：離開家庭，不管孩子。
  - type: free_text
    prompt: (11)   籌措        ：想辦法準備或募集所需的資金、物資。
  - type: free_text
    prompt: (1)我們站在山腳下(  E  )高聳的山峰，感受到大自然的壯麗。
  - type: free_text
    prompt: (2)面對強大的對手，他心中雖有些(  D  )，仍然勇敢上場。
  - type: free_text
    prompt: (3)他多年不回家，也不照顧孩子，親友都批評他 (  Ａ  )。
  - type: free_text
    prompt: (4)在這個偏遠山村裡，村民遇到問題時，常向村長(  G  )。
  - type: free_text
    prompt: (5)當山崩發生時，所有人看到土石滑落的景象，都被(  C  )住了。
  - type: free_text
    prompt: (6)為了完成這個工程，我們需要(  B  )大量資金。
  - type: free_text
    prompt: (7)爺爺都已經80歲了，看起來仍然（ Ｈ ），元氣十足。
  - type: free_text
    prompt: (8)因為一再失敗，我們原來的雄心壯志已經消磨（ Ｉ ）。
  - type: table
    rows:
    - - 森林大軍的守護者-賴倍元
    - - '人物

        故事線'
      - 文章重點
    - - '想

        做什麼'
      - '1.賴桑童年時期整天與【】為伍。

        2.他上山看神木，感受到自己生命的短暫與大自然的永恆，決定開始【】。'
    - - '怎麼

        繼續做'
      - '1.困難：買下的山布滿【】，長期使用除草劑破壞了【】，也使土壤失去涵養水分的功能。

        2.做法：清運垃圾、人工【】、鋪設水管，持續種樹。

        3.家人支持：賴太太扛起家庭與公司，並為種樹【】；兒子種植咖啡，將販售所得投入種樹志業。'
    - - 帶來什麼改變
      - '1.三十年來，賴桑在大雪山種下三十多萬棵珍貴樹木。

        2.大雪山林場的【】豐富而多元。

        3.愈來愈多的人認同賴桑的理念，並【】。'
    answers:
    - 大自然
    - 種樹
    - 垃圾
    - 土質
    - 除草
    - 籌措資金
    - 生態
    - 加入種樹的行列
