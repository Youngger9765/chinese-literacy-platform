  steps:
  - prompt: '一、推論情緒和感受有方法-換位思考

      (一)理解現場情境

      小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。可以試著「換位思考」—就是試著站在人物的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？

      ❶ 找情境：故事一開始，老爺爺上車後發生了什麼情況？'
    type: select
    options:
    - 車上沒有空位，卻有一位年輕人坐在博愛座上看書。
    - 年輕人主動起身讓座，老爺爺順利坐下休息。
    answer: 0
    reasoning: 根據原文「博愛座上坐著一個年輕人，動也不動，正埋頭看書。」，第一選項描述了故事開頭的實際情況。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: ❷ 推情緒：看到這種情況，你猜作者（我）的心情是什麼？為什麼？
    type: select
    options:
    - 開心，因為他看到年輕人坐車還在看書，值得讚賞
    - 不高興，因為他認為年輕人沒有讓座給老人家。
    answer: 1
    reasoning: 原文明確指出「我就在旁邊，看了這一幕，心裡有點不高興」，因此作者的心情是不高興。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: ❸ 換位思考：如果是你，看見需要幫助的老人沒有座位，心裡會有什麼感受呢？
    type: free_text
    reasoning: 此題旨在鼓勵學生進行換位思考，從自身角度體驗角色可能的情緒，加深對情境的理解。原文提供了一個範例答案，但本題為開放性問題，鼓勵學生自由作答。
  - prompt: '（二）觀察角色言行

      小祕訣：角色「說話內容、語氣、動作、表情」常常透露出他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。

      ❶ 觀察言行：(第三段) 我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。

      ❷ 找情緒：請找出這一段作者明白寫出來的情緒或感受，並列出它們：'
    type: free_text
    reasoning: 此題要求學生從原文中明確找出作者的情緒詞彙，強化對角色言行線索的觀察。原文標示「不高興」和「糾結、猶豫」為正確答案，因JSON schema不支援複選，故設計為開放題。
  - prompt: '二、從故事發展，推論「作者」（我）的情緒或感受變化

      事件: 看到老人站在博愛座旁，年輕人低頭看書

      關鍵線索: 心裡不高興：「老人家站在博愛座前，怎麼無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫..。

      請推論「作者」（我）的情緒或感受：'
    type: select
    options:
    - 不高興、糾結
    - 輕鬆、無所謂
    answer: 0
    reasoning: 關鍵線索中明確提到「心裡不高興」和「心裡很糾結，猶豫」，與選項「不高興、糾結」相符。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: '事件: 公車急煞車，差點跌倒，大聲說話

      關鍵線索: 心頭一緊，看不下去了，大聲對著年輕人說說：「這裡是博愛座耶！你沒看見老人家站在你面前嗎？」

      請推論「作者」（我）的情緒或感受：'
    type: select
    options:
    - 緊張、憂慮
    - 憤怒、正義
    answer: 1
    reasoning: 作者「大聲對著年輕人說」並指責其行為，顯示出憤怒和認為年輕人行為不公的正義感。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: '事件: 看到年輕人拿出拐杖、行動困難

      關鍵線索: 「年輕人手裡拿著..拐杖。他的右腿瘦弱而變形…他每經過每一個人，那一個人的頭就低了下來。」

      請推論「作者」（我）的情緒或感受：'
    type: select
    options:
    - 驚訝、羞愧
    - 理所當然
    answer: 0
    reasoning: 在指責年輕人後發現其殘疾，作者會因誤解而感到驚訝和羞愧。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: '事件: 說出「對不起，我誤會您了」

      關鍵線索: 這回換我臉紅了，我快步走向車門，低聲的向他說：「對不起，我誤會您了。」

      請推論「作者」（我）的情緒或感受：'
    type: select
    options:
    - 不在意、禮貌說說
    - 自責、懊悔
    answer: 1
    reasoning: 作者「臉紅了」、「快步走向車門」、「低聲道歉」等行為，都強烈表達了自責和懊悔的心情。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: '事件: 聽到「我習慣了」

      關鍵線索: 「我心裡反芻著那句『我習慣了』，原來我是無數加害者之一。」

      請推論「作者」（我）的情緒或感受：'
    type: select
    options:
    - 釋懷
    - 慚愧
    answer: 1
    reasoning: 作者自省「原來我是無數加害者之一」，直接表達了慚愧的情緒。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
  - prompt: '三、推論主旨或目的

      從作者的說話、語氣、動作，我們可以看到，老爺爺差點跌倒後，作者開始指責年輕人，表現出「生氣」的情緒；後來當他發現真相後，不但臉紅、快步追上對方，還低聲道歉，顯現出「慚愧、懊悔」的心情。最後，讓我們來想想，透過作者的情緒和行為變化，這個故事想要告訴我們什麼？（請列出所有你認為正確的選項）

      選項：

      1. 「對事情的理解程度」會能改變一個人的情緒和態度。

      2. 遇到自己被誤會時，要勇敢站出來把真相說清楚。

      3. 勇敢承認自己的錯誤，也是一種重要的勇氣。'
    type: free_text
    reasoning: 此題旨在引導學生從作者的情緒轉變中歸納故事的主旨或寓意。原文有兩個正確答案（選項1和3），因JSON schema不支援複選，故設計為開放題，並將選項列於提示中供學生參考。
  - prompt: '◎換你試試看-年輕人視角

      一、請推論寫下「持拐杖那位年輕人」的情緒或感受（答案合理即可）

      事件: 被指責不讓位

      關鍵線索: 年輕人的臉一下子變得通紅，他不敢抬頭

      請推論「年輕人」的情緒或感受：'
    type: free_text
    reasoning: 此題要求學生從年輕人的言行線索推論其情緒，培養換位思考能力。原文提供了「難堪、委屈」作為參考答案，本題為開放性問題。
  - prompt: '事件: 決定站起、下車

      關鍵線索: 按了下車鈴，使勁站了起來

      請推論「年輕人」的情緒或感受：'
    type: free_text
    reasoning: 此題要求學生從年輕人的行動推論其情緒，理解其在被誤解情境下的選擇。原文提供了「接受、忍耐、委屈、沉重」作為參考答案，本題為開放性問題。
  - prompt: '事件: 最後那句「我習慣了」

      關鍵線索: 輕輕笑了笑，說：「沒關係！我習慣了。

      請推論「年輕人」的情緒或感受：'
    type: free_text
    reasoning: 此題聚焦於年輕人的關鍵話語，引導學生推論其背後深層的情緒，如無奈、心酸。原文提供了「心酸、無奈」作為參考答案，本題為開放性問題。
  - prompt: '二、請推論寫作意圖

      年輕人從頭到尾沒有為自己解釋，最後只說：「我習慣了。」你覺得，作者寫出這樣的角色，想提醒我們什麼？（單選）'
    type: select
    options:
    - 身心障礙者經常被誤解的無奈與委屈。
    - 忍讓是最好的處理方式，不需要解釋。
    answer: 0
    reasoning: 年輕人「習慣了」被誤解，且沒有解釋，凸顯了身心障礙者在社會中常面臨的無奈與委屈，這是作者透過此角色想傳達的核心訊息。原文格式中，正確答案旁沒有方框，而錯誤答案旁有方框。
