- question: 3. 作者（我）最後說：「原來我是無數加害者之一。」，他最可能的情緒是什麼？
  options:
  - 愧疚自責，因為自己也曾誤會並傷害過對方
  - 緊張不安，擔心對方會因此記恨自己
  - 生氣難過，無法接受自己竟然做錯了事情
  - 沮喪放棄，覺得自己再怎麼補救也沒有用
  answer: A
- question: 4. 年輕人說「我習慣了」，他想表達的最可能是哪一選項？
  options:
  - 他很習慣把自己的座位讓給老人家
  - 經常有人誤會他、要求他離開博愛座
  - 他很習慣在與人發生衝突時離開現場
  - 他習慣自己的身心障礙，已經不在意了
  answer: B
- question: 5. 這篇故事主要想表達什麼？
  options:
  - 做錯事情時要負起責任，勇敢面對錯誤與後果
  - 年輕人搭車時應有禮讓心，主動讓座是基本禮貌
  - 評斷他人前應了解真相，避免因誤會造成傷害
  - 面對身體不便應開口說明，減少他人無端誤解
  answer: C
