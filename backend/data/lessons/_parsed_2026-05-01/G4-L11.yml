vocabulary:
- word: 力不從心
  definition: 想做某件事，但能力或體力不夠，做不到。
- word: 左顧右盼
  definition: 向左右看看，形容東張西望。常用來表示猶豫、不專心或觀望。
- word: 無動於衷
  definition: 形容對事情冷漠、不關心、不在乎。
- word: 糾結
  definition: 心裡有兩個想法拉來拉去，拿不定主意，覺得很難選擇。
- word: 猶豫
  definition: 拿不定主意，不知道該不該做。
- word: 仆倒
  definition: 向前倒下，通常是突然失去平衡或跌倒。
- word: 圍剿
  definition: 包圍起來加以攻擊或批評。常用於軍事情況。
- word: 停滯
  definition: 事情停止發展，無法前進或進步。
- word: 反芻
  definition: 原指動物把吃進肚子的食物吐出來再咀嚼；比喻反覆回想某件事。
