multiple_choice:
- question: 1. 下列哪一個句子，「」中的語詞使用錯誤？
  options:
  - 面對好友的邀約，他內心十分「糾結」，不知道該怎麼選擇
  - 看見受傷的狗，他「無動於衷」地送去醫院，焦急等待醫生
  - 阿公老了，爬樓梯時常覺得「力不從心」，得慢慢走才不會喘
  - 她習慣睡前「反芻」當天發生過的事情，從中學習寶貴經驗
  answer: B
- question: 2. 「他每經過每一個人，那一個人的頭就低了下來。」請從前後文推論乘客們為什麼要低頭，並選出最可能的答案。
  options:
  - 他們覺得無聊，低頭只是繼續做自己的事情
  - 他們很生氣，覺得年輕人太麻煩所以不想看他
  - 他們不敢直視年輕人，可能是因為害怕他報復
  - 他們為剛才誤會感到慚愧，低頭不好意思看他
  answer: D
- question: 3. 作者（我）最後說：「原來我是無數加害者之一。」，他最可能的情緒是什麼？
  options:
  - 愧疚自責，因為自己也曾誤會並傷害過對方
  - 緊張不安，擔心對方會因此記恨自己
  - 生氣難過，無法接受自己竟然做錯了事情
  - 沮喪放棄，覺得自己再怎麼補救也沒有用
  answer: A
- question: 4. 年輕人說「我習慣了」，他想表達的最可能是哪一選項？
  options:
  - 他很習慣把自己的座位讓給老人家
  - 經常有人誤會他、要求他離開博愛座
  - 他很習慣在與人發生衝突時離開現場
  - 他習慣自己的身心障礙，已經不在意了
  answer: B
- question: 5. 這篇故事主要想表達什麼？
  options:
  - 做錯事情時要負起責任，勇敢面對錯誤與後果
  - 年輕人搭車時應有禮讓心，主動讓座是基本禮貌
  - 評斷他人前應了解真相，避免因誤會造成傷害
  - 面對身體不便應開口說明，減少他人無端誤解
  answer: C
