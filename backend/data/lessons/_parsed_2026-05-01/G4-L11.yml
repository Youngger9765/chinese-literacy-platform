spotlight_raw_text: "閱讀聚光燈\n推論策略—推論情緒和感受\n　　上一課我們已經學過怎麼透過「理解現場情境」與「觀察角色言行」的策略，來推敲人物內心的情緒與感受。這篇故事的情境，延續上一課公車博愛座的議題，各角色也有豐富的情緒變化，接下來，我們繼續來練習推論文章中角色的情緒和感受，並進一步體會故事傳達的意義。\n一、推論情緒和感受有方法-換位思考\n　(一)理解現場情境\n小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。可以試著「換位思考」—就是試著站在人物的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？\n❶ 找情境：故事一開始，老爺爺上車後發生了什麼情況？（請在□打勾）\n車上沒有空位，卻有一位年輕人坐在博愛座上看書。\n□年輕人主動起身讓座，老爺爺順利坐下休息。\n❷ 推情緒：看到這種情況，你猜作者（我）的心情是什麼？為什麼？（請在□打勾）\n□開心，因為他看到年輕人坐車還在看書，值得讚賞\n不高興，因為他認為年輕人沒有讓座給老人家。\n❸ 換位思考：如果是你，看見需要幫助的老人沒有座位，心裡會有什麼感受呢？ 【　　我會覺得生氣，年輕人怎麼可以坐博愛座　】\n小撇步\n  推論情緒或感受，也可以用身歷其境的方法換位思考，想一想，「如果是你呢？你會有什麼感受？」這個方法，會讓你更容易體會角色的情緒與感受喔！\n\nright-110807500\n（二）觀察角色言行\n小祕訣：角色「說話內容、語氣、動作、表情」常常透露出他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。\n❶ 觀察言行：(第三段) 我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。\n❷ 找情緒：請找出這一段作者明白寫出來的情緒或感受？（複選）\n   【不高興　　糾結、猶豫　　□懷疑　　】\n◎你發現了嗎，角色的情緒或感受，也有可能明白寫在文中喔！但角色的情緒或感受，如果沒有明白寫出來，你就需要進一步根據線索做推論喔。\n二、從故事發展，推論「作者」（我）的情緒或感受變化\n事件\n關鍵線索\n「作者」（我）的情緒或感受\n1.看到老人站在博愛座旁，年輕人低頭看書 \n心裡不高興：「老人家站在博愛座前，怎麼無動於衷？」\n我的眉頭皺了起來，心裡很糾結，猶豫..。 \n不高興、糾結 \n□輕鬆、無所謂           \n2.公車急煞車，差點跌倒，大聲說話\n心頭一緊，看不下去了，大聲對著年輕人說說：「這裡是博愛座耶！你沒看見老人家站在你面前嗎？」\n□緊張、憂慮\n憤怒、正義\n3.看到年輕人拿出拐杖、行動困難\n「年輕人手裡拿著..拐杖。他的右腿瘦弱而變形…他每經過每一個人，那一個人的頭就低了下來。」\n驚訝、羞愧 \n□理所當然      \n4.說出「對不起，我誤會您了」\n這回換我臉紅了，我快步走向車門，低聲的向他說：「對不起，我誤會您了。」\n□不在意、禮貌說說\n自責、懊悔          \n5.聽到「我習慣了」\n「我心裡反芻著那句『我習慣了』，原來我是無數加害者之一。」\n□釋懷  \n慚愧\n三、推論主旨或目的\n　　從作者的說話、語氣、動作，我們可以看到，老爺爺差點跌倒後，作者開始指責年輕人，表現出「生氣」的情緒；後來當他發現真相後，不但臉紅、快步追上對方，還低聲道歉，顯現出「慚愧、懊悔」的心情。最後，讓我們來想想，透過作者的情緒和行為變化，這個故事想要告訴我們什麼？（請在□打勾，複選）\n「對事情的理解程度」會能改變一個人的情緒和態度。\n□遇到自己被誤會時，要勇敢站出來把真相說清楚。\n勇敢承認自己的錯誤，也是一種重要的勇氣。\n◎換你試試看-年輕人視角\n一、請推論寫下「持拐杖那位年輕人」的情緒或感受（答案合理即可）\n　事件\n關鍵線索\n「年輕人」的情緒或感受\n1.被指責不讓位\n年輕人的臉一下子變得通紅，他不敢抬頭\n難堪、委屈\n2.決定站起、下車\n按了下車鈴，使勁站了起來\n接受、忍耐、委屈、沉重\n3.最後那句「我習慣了」\n輕輕笑了笑，說：「沒關係！我習慣了。\n 心酸、無奈\n二、請推論寫作意圖\n年輕人從頭到尾沒有為自己解釋，最後只說：「我習慣了。」你覺得，作者寫出這樣的角色，想提醒我們什麼？（單選）\n     身心障礙者經常被誤解的無奈與委屈。\n□忍讓是最好的處理方式，不需要解釋。\n◎"
