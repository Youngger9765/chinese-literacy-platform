title: 誤會
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  公車慢慢地停在站牌旁，一位白髮蒼蒼的老爺爺上了車，從他登階時的緩慢動作可以看出他的力不從心。車上已經擠滿了人，大家稍微讓開一條小路，讓老爺爺進入走道中間。老爺爺左顧右盼，可惜已經滿座，他只好站在博愛座旁的空間，拉著吊環，隨著晃動的公車搖搖擺擺，就像風中抖動的燭光。 博愛座上坐著一個年輕人，動也不動，正埋頭看書。他看得那麼專心，似乎完全沒有注意到眼前站著一位老爺爺。 我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。 這時，突然一個煞車，乘客都猛然向前方傾倒，老爺爺更是差點仆倒在地。我心頭一緊，實在看不下去了，大聲對著年輕人說：「這裡是博愛座耶！你沒看見老人家站在你面前嗎？」大家也七嘴八舌的加入圍剿：「還假裝看書呢！」「這麼沒教養！」「有沒有上過公民課啊？」 年輕人的臉一下子變得通紅，他不敢抬頭，但眼神停滯了幾秒，然後，好像下定了決心，開始把書放進書包裡，按了下車鈴，使勁站了起來。他走出座位時，整台車子突然安靜下來了。 年輕人手裡拿著一支原本被書包和外套擋住的拐杖。 他的右腿瘦弱而變形，他小心的站穩，扶著每一排座位的椅背，吃力地往車門口移動。他每經過一個人，那一個人的頭就低了下來。 這回換我臉紅了，我快步走向車門，低聲的向他說：「對不起，我誤會您了。」年輕人回頭，輕輕笑了笑，說：「沒關係！我習慣了。」然後，慢慢的下了車。 我望著他的背影，淚水在眼眶裡打轉，心裡反芻著那句「我習慣了」，原來我是無數加害者之一。回頭一看，有人已經讓位給老人家了，剛才的那個位置，還空著呢！
