multiple_choice:
- question: 1. 下列哪個詞語使用正確?
  options:
  - 小原大字不識幾個，真可謂是「學問淵博」
  - 他偷搶拐騙，無惡不作，真是「名符其實」的大善人
  - 「富可敵國」的他，沒辦法再供應小孩的學費
  - 曾教授的口才很好，任何問題都能「應對如流」
  answer: D
- question: 2. 第十九段，學生跟著孔子後面抿嘴偷笑，請問下列何種成語最符合學生的反應？
  options:
  - 幸災樂禍 B悲傷難受
  - 敬佩不已 D.慈祥和藹
  answer: A
- question: 3. 譬喻是利用二件事物的相似點，用具體來形容抽象。例如：「孔子的眼睛瞪得像銅鈴一樣大」用銅鈴大的眼睛比喻孔子吃驚的樣子。請問下列何者誰也使用了相同的手法？
  options:
  - 學生表現好，他不吝讚美；學生犯了錯，他會嚴加責備
  - 孔子氣得火冒三丈，掉頭就走（誇飾）
  - 周天成開發身體沉睡已久的肌肉(轉化－擬人）
  - 我的拳擊生涯如同雲霄飛車
  answer: D
- question: 4. 子路與冉有問同一個問題，孔子回答截然不同，原因為何？
  options:
  - 孔子的教育理念是有教無類
  - 孔子懂得因應學生特質給予建議
  - 孔子喜歡用問與答的方式與學生溝通
  - 孔子善惡分明，不吝獎賞或懲罰
  answer: B
- question: 5. 根據這篇文章，下列敘述何者不正確？
  options:
  - 孔子了解每個學生的個性及短處
  - 孔子鼓勵學生勇於發言、敢辯論
  - 孔子每天都被學生氣得火冒三丈
  - 可透過論語了解孔子的為人處事
  answer: C
