vocabulary:
- word: 直率
  definition: 性情直爽不虛偽。
- word: 普及
  definition: 普遍推行。
- word: 遲疑
  definition: 猶豫難以決定。
- word: 富可敵國
  definition: 個人擁有的財富可與國家財富相比。
- word: 謙和
  definition: 謙恭和藹。
- word: 果斷
  definition: 下決定很快。
- word: 學問淵博
  definition: 學識豐富。
- word: 應󠇡對如流
  definition: 思考敏捷、對答順暢流利。
- word: 朽木不可雕也
  definition: 腐朽的木頭不能雕刻。比喻一個人資質不好，不能培養成人才。
- word: 名符其實
  definition: 名聲與實際相符合。
