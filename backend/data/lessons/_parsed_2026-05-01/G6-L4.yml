discussion_content:
- 小美喜歡畫畫，老師教她用圖像記憶學習注音符號。
- □小明做事很急躁，老師請他操作精密的實驗儀器。
- □大華專注力不足，老師請他一次背完一篇課文
- 先猜測標題想要傳達的重點。
- 猜測：這篇可能是在講 一位流傳已久的老師 的故事
- ２.從首尾段找主題句：主旨可能在文章中的第一段或最後一段。
- 主題句在第一段：有些作者會使用「開門見山法」，直接一開始講出文章重點，讀第一段能輕易找出主旨。（範文擷取自梁實秋－我愛鳥）
- →從首段推論主旨：這是一篇寫有關作者 愛鳥 的文章。
- 主題句在最後一段：有些作者會把重要的觀念放在最後一段，再次強調或總結重點，讓人印象深刻。（範文擷取自馮驥才－珍珠鳥）
- →從末段推論主旨：這是一篇寫有關作者想傳遞人與鳥互相 信賴 的文章。
