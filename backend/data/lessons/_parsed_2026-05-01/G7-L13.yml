multiple_choice:
- question: 1. 下列語詞何者使用正確?
  options:
  - 在車禍現場，他大聲「呼籲」旁人請救護車前來救援
  - 班長又嘮叨了，他「諷刺」的說，妳讓我想起我阿嬤對我的關愛
  - 這位運動員有非常優秀的心理素質，真是讓人「憂心忡忡」
  - 為掩飾真相而「亂竄」歷史，必定使後人唾棄
  answer: B
- question: 2. 第一段提到：「在這場強調為愛而跑的比賽中，看起來格外諷刺。」請問這句話的真正意思為何?
  options:
  - 強調「為愛而跑」，但卻造成汙染，根本不愛地球
  - 路跑不是為愛舉辦，而是為了大眾利益才辦
  - 看到這麼多人為製造的垃圾，令人憂心忡忡
  - 呼籲大眾不要把快樂帶走，把悲傷留給地球
  answer: A
- question: 3.下列何者不是舉辦「綠色賽事」的主要用意？
  options:
  - 希望能讓地球能永續發展
  - 減少賽事製造的人為垃圾
  - 喚醒大眾的環境保護意識
  - 可讓大眾獲得更多紀念品
  answer: D
- question: 4. 這篇課文主要的目的是說明和說服，請問作者在第一段用了哪一種寫作手法吸引讀者聚焦在作者想強調的議題？
  options: []
  answer: A
- question: 5. 如果看到今年元宵活動一團糟，哪一個選項是「諷刺」的評論？
  options:
  - 「天哪，我今晚的時間都耗在這個爛活動裡了！」
  - 「浪費民脂民膏，主辦單位應該要好好檢討！」
  - 「設計規劃的人到底有沒有腦筋？」
  - 「這真是天下最有『創意』的設計！」
  answer: D
