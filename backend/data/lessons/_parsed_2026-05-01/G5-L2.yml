multiple_choice:
- question: （ Ｂ ）1. 請問哪一個句子使用語詞正確？
  options:
  - 美術比賽競爭激烈，參賽者精心準備，現場氣氛「險象環生」
  - 考試前夕，失敗的可能在腦海中「盤旋」不去，讓我失眠了
  - 我「引領」著我家的寵物貓和狗去公園散步
  - 他對數學的興趣「廣闊無垠」，總是喜歡研究各種題目蔓延
  answer: B
- question: （ Ｂ ）3. 本課是說明文，作者用了哪一種寫作手法說明「仿生學」的這個主題概念？
  options:
  - 比較說明─透過科技產品的比較來說明仿生學
  - 舉例說明─透過列舉具體事例讓讀者理解仿生學
  - 定義說明─直接解釋各種科技品概念和用途
  - 過程說明─詳細描述仿生學是如何逐步發明出來的
  answer: B
- question: 4. 有許多語詞，可以用「拆詞釋義」的方式猜出它的意思，例如，防腐劑、危機四伏。請問底下選項中，哪一個語詞無法用「拆詞釋義」的策略來猜出它的意思？
  options:
  - 一目十行 B.日新月異 C.火上加油 D.馬馬虎虎。
  answer: D
- question: 5. 課文末段說明了什麼是「仿生學」，請問底下選項中哪一個是「仿生學」的例子？
  options:
  - 把速度最快的游泳選手取一個叫飛魚的綽號
  - 把河馬張開大嘴的相片貼在大胃王餐廳的招牌上
  - 模仿荷葉不沾水、不會弄髒的特性，設計一甩就乾的雨傘
  - 把虎豹的斑紋印在布料上，做成服飾，以吸引人注意
  answer: C
