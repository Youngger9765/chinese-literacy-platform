vocabulary:
- word: 仿生學
  definition: 是模仿生物特殊本領的一門科學。
- word: 廣闊無垠
  definition: 形容廣大、寬闊，沒有邊界。
- word: 盤旋
  definition: 在空中環繞、旋轉；也可以形容在心裡一直存在的心事。例如，分手的痛苦一直在心中盤旋不去。
- word: 危機四伏
  definition: 到處隱藏著危險。
- word: 險象環生
  definition: 危險的狀況一直出現。
- word: 向陽性
  definition: 植物總是面向太陽轉動的特性。
- word: 引領
  definition: 引導帶領。
- word: 探測車
  definition: 是一種機器人車輛，用在惡劣或人類難以到達的環境，進行探索和科學研究。
- word: 內建
  definition: 機器或系統中安裝某種配件或功能。
- word: 追逐
  definition: 從後面追趕。
- word: 垂直起降
  definition: 垂直起飛和降落。
