multiple_choice:
- question: 1. 下列語詞，何者使用錯誤?
  options:
  - 模範生的她偶爾犯錯，被老師罵的場景「屢見不鮮」
  - 他偶爾說話失禮，大家都覺得「無傷大雅」，沒必要太過在意
  - 她靠著「日積月累」的練習，終於在舉重比賽中獲勝
  - 雖然學習很艱辛，但他相信「滴水穿石」，總有一天會成功
  answer: A
- question: 2. 為什麼文章中提到的「學務處老師讓體育班學生搬桌椅」的行為是微歧視?
  options:
  - 因為老師忽略了其他學生也可以搬桌椅的能力
  - 因為老師認為體育班學生最適合體力勞動
  - 因為體育班學生喝飲料才願意幫忙老師做事
  - 因為老師不喜歡體育班的學生，故意使喚他們
  answer: B
- question: 3. 下列選項何者最能表達本文的主旨？
  options:
  - 微歧視看似事小，實則影響深遠，應小心用詞
  - 微歧視是一種社會問題，應立法制止此類行為
  - 弱勢群體需要被大家保護，讓他們不再被歧視
  - 大眾應多關注社會問題，並尋求公平解決方案
  answer: A
- question: 4. 要破除微歧視，何者不是正確的方法？
  options:
  - 時常反思自己的言行。
  - 避免簡化的思維模式。
  - 消除刻板印象與偏見。
  - 可減少與他人的交談。
  answer: D
- question: 5. 下列情境敘述中，哪一項符合「微歧視」現象？
  options:
  - 在公司裡，所有員工都必須參加安全培訓，無論其背景如何
  - 每年學校都會舉辦運動會，鼓勵所有學生參與各項比賽
  - 對轉學生說：「你從臺東來的，你們真的騎野豬上學嗎？」
  - 老師在課堂上鼓勵學生提出不同的意見和觀點
  answer: C
