vocabulary:
- word: 開場白
  definition: 指對話或演講開始時所說的話。
- word: 滴水穿石
  definition: 水滴不斷的滴落，久了之後可將石頭穿透。比喻雖然微小的力量，只要持之以恆，最終也能達到目標。
- word: 隱蔽
  definition: 不易被發現或察覺。
- word: 屢見不鮮
  definition: 經常看到，並不新奇。
- word: 刻板印象
  definition: 指因為固有的觀念或經驗，形成的片面固執的印象。例如：男主內女主外。
- word: 日積月累
  definition: 隨著時間一天天過去，經歷長時間的累積。
- word: 無傷大雅
  definition: 指事情雖有些錯誤或不完美，但並不影響整體。
- word: 憐憫
  definition: 對弱小或不幸的人表現出同情。
- word: 滲透
  definition: 液體在物體中慢慢穿透的現象，用以比喻思想或勢力逐漸侵入或影響其他領域。
- word: 內化
  definition: 將外界的觀念逐漸吸收並轉變成自己的想法和態度。
