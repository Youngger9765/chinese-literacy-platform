discussion_content:
- 1.請判斷下列情況是否為微歧視，是微歧視的打Ｖ。
- 小叮嚀：刻板印象或對某族群體偏見，很可能就是微歧視。
- 2.面對微歧視時，可以怎麼反應？可以的打Ｖ。
- 小叮嚀：如果別人說的話讓你覺得有點怪怪、不舒服，都可以溫和的提出看法，調整成彼此最舒服的溝通方式。
- 3.想拉近與新朋友的距離，但又害怕自己說的話讓對方感受到不舒服，不妨試著用「安全的話題」以及「請對方分享的方式」開啟友善對話，下面就讓我們一起練習看看開啟新話題的問句吧！
- (1)由安全話題開啟對話，不踩雷。例如：食物、天氣、運動、最近的時事。
- →麟洋配又得一次奧運金牌，超感動的！你有看轉播嗎？
- →學校旁邊開了一家賣滷肉飯的店，聽說便宜又好吃，你有吃過嗎？
- (2)真心讚賞對方出色之處，聚焦在對方專長和興趣，讓對方願意分享。
- →你讀好多書喔，最近讀的哪一本好看？有推薦的嗎？
- →你同時可以做好多件事，有什麼時間管理的祕訣嗎？
- 小叮嚀：當我們與人相處時，可以從不會踩雷的話題開始，避免刻板印象，才能建立平等信任的關係。
- （ A ）1. 下列語詞，何者使用錯誤?
- A.模範生的她偶爾犯錯，被老師罵的場景「屢見不鮮」
- B.他偶爾說話失禮，大家都覺得「無傷大雅」，沒必要太過在意
- C.她靠著「日積月累」的練習，終於在舉重比賽中獲勝
- D.雖然學習很艱辛，但他相信「滴水穿石」，總有一天會成功
- （ B ）2. 為什麼文章中提到的「學務處老師讓體育班學生搬桌椅」的行為是微歧視?
- A.因為老師忽略了其他學生也可以搬桌椅的能力
- B.因為老師認為體育班學生最適合體力勞動
- C.因為體育班學生喝飲料才願意幫忙老師做事
- D.因為老師不喜歡體育班的學生，故意使喚他們
- （ A ）3. 下列選項何者最能表達本文的主旨？
- A.微歧視看似事小，實則影響深遠，應小心用詞
- B.微歧視是一種社會問題，應立法制止此類行為
- C.弱勢群體需要被大家保護，讓他們不再被歧視
- D.大眾應多關注社會問題，並尋求公平解決方案
- （ D ）4. 要破除微歧視，何者不是正確的方法？
- A.時常反思自己的言行。
- B.避免簡化的思維模式。
- C.消除刻板印象與偏見。
- D.可減少與他人的交談。
- （ C ）5. 下列情境敘述中，哪一項符合「微歧視」現象？
- A.在公司裡，所有員工都必須參加安全培訓，無論其背景如何
- B.每年學校都會舉辦運動會，鼓勵所有學生參與各項比賽
