genre: 說明文
title: 隱藏在日常對話中的微歧視
authors: 課文 ：林玫伶 學習單：張明珠
story_text: 亞倫是原住民，每當進入一個新環境時，別人最常用來跟他打招呼的話是：「你酒量很好吧！你皮膚怎麼那麼白？」 下週是學校舉辦的社區服務日，育仁因為肢體障礙，好朋友對他說：「你不方便，不用來沒關係，老師一定會體諒的。」 星期六園遊會，學務處老師請體育班同學幫忙：「跟上次運動會一樣，這次整個會場的桌椅就交給你們了，搬完我請你們喝飲料。」 上述場景在我們的生活中屢見不鮮，很多人聽到這樣的話也不會有特別的感覺。即使感覺到些許不對勁，也往往認為對方「沒有惡意」、「沒那麼嚴重」或「無傷大雅」。 那麼，讓我們再仔細想想。 與原住民朋友互動時，總是用酒量和膚色作為開場白，暗示原住民「應該」會喝酒，或「應該」有較深的膚色，這樣才符合「典型的原住民」形象。這類話語顯示了社會對原住民族群的理解不足，無形中也加深了刻板印象和偏見。 至於育仁的例子，朋友本意是體諒他的不便，但這句話卻隱含了對身障者的「低期望」和「過度保護」。預設育仁無法像其他同學一樣參與社區服務，甚至剝奪了他自行決定是否參加的權利，讓他感覺自己被「特別對待」了。 而學務處老師每次都請體育班的學生負責搬運桌椅，則流露出對體育班學生的單一印象，認為他們適合做體力勞動工作，對他們並不公平，也忽視了體育班學生在其他領域的才能。 這些看似平常的小事，就是「微歧視」。微歧視的「微」指的是這些歧視行為往往很微小、隱蔽而不易察覺，且多半是無意的。儘管這些行為看起來無傷大雅，但它們對我們的社會及特定群體造成的影響卻很深遠。例如，特別強調某些群體的特性，或對弱勢群體表現出過度的憐憫，日積月累󠇡，滴水穿石後，這些說法逐漸滲透到每一個人的價值觀中，不但說話的人無感，甚至連長期受到微歧視的群體，也可能漸漸內化這些偏見，進而對自己產生負面的觀感。 明顯的歧視言論容易引發注意，但微歧視的「隱蔽」特性，讓它很難被發現。要破除微歧視，最重要的是時常反思自己的言行，避免依賴簡化的思維模式隨意形容某個群體，例如，原住民就應該能歌善舞、體育班學生就應該身強體壯、不必對身心障礙朋友抱有太高期待等等。同時，我們也要意識到自己也可能無意中表現出微歧視，在與人交談時更要謹慎選擇用詞，因為我們的話語不僅反映了我們對世界的看法，也是一面鏡子，照出我們在面對多元文化時，是否真正具備尊重與包容的態度。
