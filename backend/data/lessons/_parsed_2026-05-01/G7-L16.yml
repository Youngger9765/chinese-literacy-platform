multiple_choice:
- question: 1. 「如果自己能像阿嬤那樣將它們熬煮成果醬，豈不是『兩全其美』嗎？」這裡的『兩全其美』指的是哪兩件事呢？
  options:
  - 能解決外型不好的水果被棄置的問題，也可以用做果醬來懷念阿嬤
  - 製作果醬能夠精進自己的廚藝，也可以解決自己找不到工作的困境
  - 能解決找不到工作的困境，也能解決外型不好的水果被丟棄的問題
  - 能解決找不到工作的困境，還能出國參加比賽為國爭光
  answer: C
- question: 2. 林韡勳在「研發與銷售」自己的果醬時遇到了許多挑戰，請問下面哪個選項不是他遇到的困難？
  options:
  - 缺乏旅費，不能去英國參加國際比賽
  - 沒有製作果醬的專業背景，導致製作頻頻失敗
  - 追求果醬品質導致果醬售價太高，賣不出去
  - 研發果醬的過程失敗太多次，浪費了許多食材
  answer: A
- question: 3. 下面哪個事件讓林韡勳的果醬事業迎來轉機？
  options:
  - 林韡勳不想浪費食物，所以把做失敗的果醬拿去餵蜜蜂
  - 林韡勳沒有果醬專業背景，仍堅持不斷研究並製作果醬
  - 林韡勳將自己的果醬分送給親友，並且常常到市集擺攤
  - 林韡勳接受英國籍客人的建議，去參加英國的果醬比賽
  answer: D
- question: 4. 果醬男孩有哪些特質可以幫助他取得事業上的成就？
  options: []
  answer: B
- question: |-
    5. 小美早上老是爬不起來，無法趕上晨練，她想運用問題解決流程來克服自己的困難，目前進行到第三步驟的思考解決方案，以下是她想到的解決方案，下面哪些解決方案可能可行而且有效？
  options: []
  answer: C
