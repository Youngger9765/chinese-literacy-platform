  definition: 做事考慮周全，讓兩方面都能獲益。
- word: 脫穎而出
  definition: 才華顯露出來，超越其他人。
- word: 籌措
  definition: 想辦法去準備。
- word: 大為嘆服
  definition: 很讚嘆、佩服。
- word: 口碑
  definition: 眾人口耳相傳的評價。
- word: 靈機一動
  definition: 突然想到了解決問題的方法。
- word: 虜獲
  definition: 抓住、獲得。
- word: 雲集
  definition: 許多高手為特定的目的聚集。
- word: 桂冠
  definition: 用月桂葉編成的皇冠形帽子，古希臘人把它送給優秀的詩人或比賽勝利的人，後來桂冠成為光榮的象徵。
