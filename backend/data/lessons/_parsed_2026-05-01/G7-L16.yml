title: 果醬男孩
authors: 課文/學習單：王淑瑱
story_text: 2023年3月，含金量最高的世界柑橘類果醬大賽在英國的一個小城市舉行。來自世界各國的參賽選手帶著他們得意的作品雲集在這裡，經過重重考驗，一位出身臺南柳營山村的年輕人脫穎而出，虜獲評審的味蕾，最終拿下了一金二銅的成績。 這位山村來的年輕人是怎麼辦到的呢？ 其實多年前，林韡勳對製作果醬是門外漢。因為喜歡動物，林 韡勳大學讀了畜產系，沒想到因為過敏的緣故，他只做了短期的動物相關工作就無法繼續了，偏偏在臺南鄉間，工作機會又少，坐困愁城的他不禁懷念起小時候阿嬤做的桑椹醬，那甜蜜、芳香的記憶撫慰他疲憊的心，突然，他靈機一動——「何不來做果醬呢？」 他想到之前在農場打工時發現，那些漂亮、碩大的水果會被賣出，而那些小小的、酸酸的、醜醜的水果只能丟棄，實在非常可惜，如果自己能像阿嬤那樣將它們熬煮成果醬，豈不是兩全其美嗎？ 有了想法就去行動。沒有專業背景的他開始自學。他先花費半年時間研究國內外許多食譜，自認「沒問題」後才開始熬煮果醬，結果還是太天真了，辛苦製做的香蕉果醬又糊又黑，其他果醬不是太甜，就是燒焦，做越多，發現的問題就越多：水果本身的水份、甜份、熟度、切的形狀、火候、熬煮時間…等，全都會影響果醬製作是否成功，問題真的很多，夢想，好像遙不可及的幻影。 花光了之前打工存的錢，他就再去打工賺錢，然後買水果、處理水果、煮果醬、失敗、倒掉、再買水果…，這種循環的惡夢持續了整整兩年。林韡勳說，做失敗的果醬，因為怕被家人知道，起初只能偷偷倒在自家後院，後來倒垃圾車的廚餘桶，一直倒到垃圾車清潔隊員告訴他：「你別再來了啦！」幸好，林家也養蜜蜂，他最後想到把這些失敗品都拿去餵蜜蜂，才解決「浪費食物」的問題。 研發果醬兩年，他終於製作出滿意的作品，可是又面臨一個窘境──成本太高、單價無法壓低。村裡的人說：「這果醬這麼貴，都可以買三、四個便當了！誰要買啊？」無奈之下，他只好分送親友試吃，也常到市集擺攤，漸漸地村民都知道村子裡有一位「果醬男孩」，他也慢慢建立起口碑。 一次，一位英國籍的客人在市集上品嚐到他的果醬後讚不絕口，鼓勵他去參加英國的果醬比賽，畢竟，英國食用果醬的文化悠久，舉辦的比賽又極具公信力。聽了客人的建議，林韡勳積極存錢籌措旅費，並連年參賽，終於在第四年獲得最高榮譽的桂冠。 林韡勳看重每個細節，不辭辛勞走遍全臺，只為尋找香氣、味道都深具個性的水果；他也看重創意，居然想到把紅玉紅茶、威士忌和柑橘混在一起做出「茶金」果醬；茶金果醬本來茶味不足，他卻能開發新的技術──將切得極碎的茶葉以威士忌冰釀一晚，終於逼出讓英國大賽評審長大為嘆服的濃郁茶香。 既不浪費食材，還成就了夢想，留住當季水果的滋味，這一路， 林韡勳走得又苦又甜。未來，他期許能把臺灣水果製成的果醬行銷到世界，讓更多人都能品嘗到臺灣果醬的滋味。
