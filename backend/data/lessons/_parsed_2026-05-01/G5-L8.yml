multiple_choice:
- question: 1. 請問第三段中寫到「注重」，最可能的解釋為何?
  options:
  - 注意、重視（注重）
  - 將視線注意在一點上（注目）
  - 集中注意力，精神專注（全神貫注）
  - 上天早已決定，非人力所能改變（注定）
  answer: A
- question: 2. 楊勇緯能擊敗哥哥的關鍵原因是什麼呢?
  options:
  - 哥哥在比賽中禮讓弟弟
  - 楊勇緯天生比哥哥厲害
  - 楊勇緯三年級就學柔道
  - 楊勇緯不斷的精進自己（第二段）
  answer: D
- question: 3. 楊勇緯說「我的目標是金牌！」，你認為他說這句話的心情是什麼？
  options:
  - 憤怒，因為被判犯規輸給對手
  - 不甘心，因為沒為臺灣拿到金牌
  - 驕傲，獲得臺灣柔道奧運銀牌
  - 恐懼，因為達不成人民的期望
  answer: B
- question: 4. 在比賽中，若遇到外在干擾，文中提到可以用哪些步驟專注於比賽中？
  options:
  - 遇到挫折思考意義幫助成長
  - 提早到校勤於練習精益求精
  - 深深呼吸調整心情重新思考
  - 雙手緊握仔細觀察壓制對手
  answer: C
- question: 5. 根據作者觀點，下列選項何者最適合作為本文的結語？
  options:
  - 思考會讓你的思想更強大
  - 不怕你犯錯，只要你改過
  - 人生要學習放慢腳步，才能欣賞沿途的美景
  - 走過的路不會白費，每一次的失敗都有獲得
  answer: D
