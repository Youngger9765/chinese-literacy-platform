spotlight_raw_text: '閱讀聚光燈的練習，下列何者對於「吃醋」的理解較為合適？

  A.美美：常常吃醋的人通常個性小氣又愛計較，很難相處

  B.小綠：和人相處應該保持開放心態，一旦吃醋就要檢討

  1243330195580

  (A)不一定(B)吃醋是正常的，不需檢討(D)不吃醋不代表不重視。00

  (A)不一定(B)吃醋是正常的，不需檢討(D)不吃醋不代表不重視。C.大華：吃醋代表對關係的重視和在乎，但也要避免傷人

  D.阿勇：如果朋友不會吃你的醋，就代表他沒有很重視你

  75517573405'
