  strategy_name: 閱讀聚光燈
  instruction: 請根據課文內容，判斷對於「吃醋」此情感的理解，何者較為合適。
  reasoning: 此練習屬於「閱讀聚光燈」策略，旨在引導學生深入理解課文中主角所經歷的「吃醋」情感。透過評估不同觀點，學生需結合文本情境，辨識出對該情感最貼切、最全面的詮釋，以提升對文本情感細節的捕捉與分析能力。題目原文中，選項C被重複且完整地列出，暗示其為正確答案。
  steps:
  - prompt: 下列何者對於「吃醋」的理解較為合適？
    type: select
    options:
    - 美美：常常吃醋的人通常個性小氣又愛計較，很難相處
    - 小綠：和人相處應該保持開放心態，一旦吃醋就要檢討
    - 大華：吃醋代表對關係的重視和在乎，但也要避免傷人
    - 阿勇：如果朋友不會吃你的醋，就代表他沒有很重視你
    answer: 2
    reasoning: 課文摘要中，主角因朋友與他人互動而感到「不是滋味」、「失落」、「生氣」，這些情緒源於對友誼的「重視」和「在乎」。主角雖然感到不適，但也試圖壓抑或理解，避免直接衝突，這暗示了「避免傷人」的考量。選項C「吃醋代表對關係的重視和在乎，但也要避免傷人」最能貼切地描述課文中主角的內心掙扎與情感來源，既肯定了情感的正面根源，也提醒了處理方式的謹慎。其他選項則過於偏頗或未能全面反映課文情境。此外，題目原文中選項C被重複且完整地列出，暗示其為正確答案。
