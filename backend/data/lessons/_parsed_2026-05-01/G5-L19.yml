vocabulary:
- word: 思緒
  definition: 內心的想法、思考的歷程。
- word: 邁開
  definition: 跨步向前。
- word: 計較
  definition: 計算、比較，通常用於在意細節或小事。
- word: 莫名
  definition: 說不出原因、無法解釋的感覺。
- word: 漣漪
  definition: 水面上微小的波紋，也可比喻內心的細微感受或變化。
- word: 異樣
  definition: 不一樣、和平常不同。
- word: 靦腆
  definition: 不好意思、害羞的樣子。
- word: 一如往常
  definition: 和以前一樣，沒有改變。
- word: 愣
  definition: 因為驚訝、害怕或一時反應不過來，而短暫的停住或不說話、不動作。
