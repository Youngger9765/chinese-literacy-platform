- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options: []
  answer: D
- question: 2. 根據第三段「我又不是那種愛計較的人，這種小事根本不值得放在心上。」這句話最可能代表什麼意思？
  options:
  - 作者想強調自己一點也不在意他們聊得很開心
  - 作者想說服自己不要去在意，但其實非常介意
  - 作者認為只有能夠相互計較的朋友才能夠長久
  - 作者認為阿葉不值得自己繼續用真心對待來往
  answer: B
- question: 3. 根據全文，下列哪一個選項最能解釋作者「不想對阿葉擺臭臉，更不想承認自己會因為朋友而吃醋」的原因？
  options:
  - 作者認為自己不該為了心上人和朋友生氣、冷戰
  - 作者非常不認同阿葉的行為，認為阿葉不夠義氣
  - 作者不想讓阿葉看出自己心情，怕被心上人知道
  - 作者想成全阿葉和自己喜歡的人，默默退出競爭
  answer: A
- question: 4. 根據本文內容，關於作者的情緒變化，下列何者正確？
  options:
  - 期待→失落→難過→驚喜→平靜
  - 驚喜→失望→生氣→難過→無奈
  - 驚訝→煩悶→低落→生氣→煩躁
  - 開心→驚訝→煩燥→低落→平靜
  answer: C
