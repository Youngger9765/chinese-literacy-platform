title: 把球打好，就夠了嗎？ ──阿耀與健豪學長的通信（一）
authors: 課文 ：許元耕 學習單：張明珠
story_text: 寄件人：阿耀 收件人：健豪學長 主旨：請教：棒球隊學生需要讀書嗎？ 健豪學長，您好： 我叫阿耀，是您母校棒球隊的學弟，現在八年級，擔任投手兼外野手。最近我有個煩惱，在腦袋裡揮之不去，想請教您。 升上八年級後，我被排進先發名單，除了大隊訓練和晨操，我晚上還會自己加練。雖然很累很操，但我真的喜歡棒球，而且不少學長都告訴我們：「球打得好，以後就有高中、大學可讀；更強的話，高中就能直接進職棒！」我總是夢想有朝一日能像您一樣進職棒。 但老師又會勸誡我們：「打球雖然重要，但書還是要讀。」我知道這是為我們好，可是訓練後真的累癱了，一聽到這些話就覺得煩，甚至有點想逃避。我總是在想：一定要讀書嗎？未來真的不能只靠打球嗎？ 您是我最崇拜的學長，也是真正走過這條路的人，想聽聽您的看法。謝謝您！ 阿耀 敬上 寄件人：健豪學長 收件人：阿耀 主旨：RE:請教：棒球隊學生需要讀書嗎？ 阿耀，你好： 謝謝你的來信，很開心看到你對棒球這麼熱愛。我當年和你一樣，天天拚命練球，心裡只想著怎麼打得更好。 說實話，我以前也覺得只要球打得好，就能進職棒、獲得豐厚報酬。但等我真的進了職棒，我才發現：成功，不只要努力，還要「運氣站在你這邊」。 怎麼說呢？就算你再怎麼拚，還是可能遇到以下這些情況： 同年選秀剛好出現一堆「怪物級」選手，你就算很強，也未必雀屏中選。 長時間比賽、過度疲憊，身體很容易受傷，萬一需要休息，就可能和機會擦身而過。 守備的位置有太多人爭取，即使你實力不錯，也可能沒機會上場。 這些都不是你能控制的。所以我想跟你說：「打球很重要，但如果你孤注一擲，只有這一條路可走，真的太冒險了。」 讀書，不是要你考高分，而是讓你多一條路。當棒球這條路卡住的時候，你還有別的方向可以走。就像比賽不能只練一招，人生也不能只靠一種能力。你準備得越多，選擇就越多喔！祝福你。 健豪學長
