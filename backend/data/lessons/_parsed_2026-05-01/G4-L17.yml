discussion_content:
- 情境一：運動員的退路
- 智凱是學校羽球隊的王牌，他的夢想是打進國家代表隊。教練提醒他：「如果哪天受傷不能打球，你還有別的計畫嗎？」智凱開始想，如果不能當選手，也許他可以當體能教練或裁判、體育主播。這麼一想，他突然覺得自己該好好讀書了。
- 1.你覺得智凱為什麼開始想「讀書」？（單選）
- 想讓自己有退路 □想比同學更厲害 □想改變夢想
- 2.以下哪些能力對智凱的未來有幫助？（複選）
- 英文：出國比賽、與外隊交流 溝通表達：接受訪問、與隊友合作
- 醫學與運動防護：預防受傷 分析能力：能分析不同戰術
- 3.承第2題，智凱如何學會上述的能力呢？請連連看。
- 4.從智凱的例子可以學到：
- 讀書不是放棄打球，而是讓他擁有【多 □少】一條能走的路。
- 情境二：讓作品更有內容
- 宥蓁喜歡拍短影片，常常上傳搞笑的片段。但她發現，只靠搞笑，大家看幾次就不想看了。後來，她開始學著寫腳本、學著拍攝並剪輯更精緻的畫面、學著構思主題，她的影片變得更有故事性，也有越來越多人喜歡看。
- 1.宥蓁開始「學更多」後，有什麼好處?（複選）
- ①讓作品更有內容 ②讓興趣變成能力
- □③全心投入拍片，不管課業
- 2.根據情境描述，以下哪些能力對宥蓁的未來有幫助？（複選）
- ①寫作能力：能想出好看的內容 □②唱跳能力：才能吸引粉絲
- ③觀察能力：能找到有趣的主題 ④攝影能力：能拍出流暢的畫面
- 3.承第2題，宥蓁如何學會上述的能力呢？請連連看。
- 4.從宥蓁的例子可以學到：
- 讀書不是放棄興趣，而是讓她【用興趣做更多事／擁有更多能力】。
- 情境三：學會為自己多準備
- 庭萱很喜歡玩遊戲。有一天，她看到有人能自己設計地圖和角色，就很好奇：「如果我也會做這些，應該會更好玩吧！」於是，她上網查資料，學習簡單的指令，慢慢做出自己的遊戲關卡，還獲得許多網友的支持。
- 1.你覺得庭萱為什麼會想學新的東西？想要試試看自己是不是可以設計出遊戲/看見別人做得到，也想挑戰看看 (參考答案)
- 2.庭萱學會英文和電腦的基礎知識，這對她有什麼幫助？能看懂國外教學影片，學更多遊戲設計技巧/能自己設計地圖和角色(參考答案)
- 結語：有時候我們不會馬上知道學的東西有什麼用，但當機會來臨時，那些你以為沒用的知識，可能正好幫你打開一扇新的門。
- （ Ｄ ）1.下列的語詞，何者使用錯誤？
- A.他憑著流利的英文，從眾多應徵者中「雀屏中選」，得到工作
- B.他與夢想的大學「擦肩而過」，只差一分沒錄取
- C.那次比賽失誤的畫面，讓他心中「揮之不去」
- D.這部電影富含教育意義，小明「勸誡」我去看那部電影
- （ B ）2. 信中提到「成功，不只要努力，還要『運氣站在你這邊』」，這句話主要想表達什麼？
- A.努力很重要，但運氣比努力更重要
- B.成功需要努力，也會受到運氣影響
- C.相信自己、持續努力，必能成功
- D.其實，成功的人不需要努力
- （ C ）3. 健豪學長列出「遇到怪物級選手」「身體受傷」「沒機會上場」等例子，主要想說明什麼？
- A.打球時要小心身體健康，避免受傷
- B.只有最強的人才能在職棒中生存
- C.有些不可預測的因素會影響成功機會
- D.運氣不好就不要打球，以免白費心力
- （ A ）4. 從兩封信的內容推論，阿耀最可能是哪一種學生？
- A.不愛讀書但對打球很有熱情 B.除了練球，也熱愛學新知識 C.只在意分數 D.等別人幫忙安排人生
- （ B ）5. 健豪學長在回信中，用了哪一種方法，讓阿耀更明白「讀書能讓人多一條路」？
- A.他用很多難詞和成語，讓文章更有氣勢
- B.他舉出不同的例子，證明只靠打球太危險
- C.他用誇張的說法，讓故事更精采
- D.他請阿耀自己去體會，不直接告訴他
