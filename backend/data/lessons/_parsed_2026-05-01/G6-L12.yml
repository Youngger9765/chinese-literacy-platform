spotlight_raw_text: "閱讀聚光燈2598420318893\n摘要策略──從段落找主題句0\n摘要策略──從段落找主題句\n    主題句指的是段落中最重要的句子，能夠簡單的說明整段的意思。有的作者在寫作時，會有清楚的主題句，我們在閱讀時，如果可以找出各段落的主題句，就能快速掌握文章要傳達的重點。底下是找出主題句的兩個步驟：\n一、切句子：找出段落中的句號、驚嘆號、分號與問號，運用這些標點符號，將一個段落分成幾個句子。\n二、找主題句：找出最能說明段落重點的句子，這個句子通常會和文章主題相互呼應。\n例如：&lt;如何製作好喝的烏龍茶?&gt;\n第一步：切句子（把段落裡的句子區分出來）\n❶我們今天去參觀烏龍茶的製作過程。／❷師傅們先將剛摘下來的茶葉曬過，以減少水分；／❸接著讓茶葉發酵，高溫處理，保留茶葉的香氣；／❹最後，將茶葉乾燥、烘焙為好喝又清香的烏龍茶。\n→我總共分出（　4　）句。\n第二步：找主題句（最能說明段落重點的句子）\n(1)想想句子的關係，第❶句先告訴讀者今天參觀烏龍茶的製作過程，第❷、❸、❹句再仔細解釋製作的過程。\n(2)哪一個句子最能說明段落的重點？→因為我發現第❶句已包含第❷、❸、❹的內容，所以第（　１　）句為主題句。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 摘要策略──從段落找主題句
  instruction: 本練習將引導你學習如何找出段落中的主題句，這是快速掌握文章重點的關鍵策略。我們將透過「切句子」與「找主題句」兩個步驟來練習。
  reasoning: 此練習旨在引導學生理解並應用「摘要策略──從段落找主題句」。透過定義解釋、步驟拆解及實例演練，幫助學生掌握找出段落主題句的方法。
  steps:
  - prompt: 根據說明，主題句指的是什麼？
    type: select
    options:
    - 段落中最長的句子
    - 段落中最重要的句子，能簡單說明整段意思
    - 段落中包含最多標點符號的句子
    - 段落中作者最喜歡的句子
    answer: 1
    reasoning: 原文開頭即說明：「主題句指的是段落中最重要的句子，能夠簡單的說明整段的意思。」
  - prompt: 找出主題句的第一個步驟是什麼？
    type: select
    options:
    - 找主題句
    - 切句子
    - 數句子
    - 寫摘要
    answer: 1
    reasoning: 原文「一、切句子」明確指出第一個步驟。
  - prompt: 找出主題句的第二個步驟是什麼？
    type: select
    options:
    - 切句子
    - 找主題句
    - 數句子
    - 寫摘要
    answer: 1
    reasoning: 原文「二、找主題句」明確指出第二個步驟。
  - prompt: '請閱讀以下段落，並判斷它總共可以切分成幾句？

      段落：我們今天去參觀烏龍茶的製作過程。／師傅們先將剛摘下來的茶葉曬過，以減少水分；／接著讓茶葉發酵，高溫處理，保留茶葉的香氣；／最後，將茶葉乾燥、烘焙為好喝又清香的烏龍茶。'
    type: select
    options:
    - 1句
    - 2句
    - 3句
    - 4句
    answer: 3
    reasoning: 原文範例明確指出該段落共分出4句（❶、❷、❸、❹）。
  - prompt: '根據上述烏龍茶製作過程的段落，哪一句最能說明段落的重點？

      選項：

      ❶我們今天去參觀烏龍茶的製作過程。

      ❷師傅們先將剛摘下來的茶葉曬過，以減少水分；

      ❸接著讓茶葉發酵，高溫處理，保留茶葉的香氣；

      ❹最後，將茶葉乾燥、烘焙為好喝又清香的烏龍茶。'
    type: select
    options:
    - 第❶句
    - 第❷句
    - 第❸句
    - 第❹句
    answer: 0
    reasoning: 原文範例明確說明：「因為我發現第❶句已包含第❷、❸、❹的內容，所以第（　１　）句為主題句。」
