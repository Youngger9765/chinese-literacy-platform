vocabulary:
- word: 英姿煥發
  definition: 形容外表英俊，十分有精神、光彩照人。
- word: 清一色
  definition: 比喻成員或事物全部由同一種成分構成，例如：清一色男生、清一色蔬菜。
- word: 相去無幾
  definition: 事物之間的差距不大，幾乎相同。
- word: 飛簷走壁
  definition: 比喻輕巧的在屋簷牆壁間穿梭，形容身手敏捷，身輕如燕。
- word: 有過之而無不及
  definition: 指互相比較後，不但沒有落後，反而超越對方。
- word: 逞強
  definition: 為了顯示自己厲害而勉強做一些超過能力的事。
- word: 審時度󠇡勢
  definition: 能仔細研究事情的背景和發生的條件，以做出最好的決定。
- word: 自命不凡
  definition: 自以為聰明、不平凡，常表現出高傲自負的態度。
