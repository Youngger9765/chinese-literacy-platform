discussion_content:
- 很多人誤以為白色的北極熊有一身雪白光亮的毛。／事實上，北極熊的毛根本不是白色的，而是透明的！／我們現在看到的白色，是因為透明中空的毛髮經過光線反射，才會讓我們覺得北極熊的毛是雪白色的。／
- 第一步：切句子（把段落裡的句子區分出來）
- →我總共分出（ ３ ）句。
- 第二步：找主題句（最能說明段落重點的句子）
- (1)想想句子的關係，第❶句說出人們對北極熊既定的印象，第❷句說明北極熊的毛其實是透明的，第❸句是補充說明北極熊的毛為什麼是透明的原因。
- (2)所以哪一句是主題句？→我發現段落重點應該是呼應標題說明「北極熊是什麼顏色？」，所以第（ 2 ）句為主題句。
