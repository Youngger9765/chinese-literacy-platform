discussion_content:
- 深夜，一場猛烈的火災吞噬了整棟大樓，濃煙不斷從建築物內竄出，現場瀰漫著焦味。驚慌的居民受困其中，消防員立刻趕赴現場，全力( E )受困者。
- |-
  要( G ) 艱難危險的救援任務，消防員必須具備專業的( A )，熟練操作各種滅火與救援設備。在看不清楚方向的火場中，他們的感官變得異常( B )，能迅速發現濃煙中的求救信號，及時搶救( D )者。
- 1.現在讓我們找出每一題比較的重點
- (1)此外，巨鼠體型小，狗無法通過的瓦礫縫󠇡隙，巨鼠卻可以輕而易舉的鑽過。
- ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
- 巨鼠的體型比狗【□大 小】，可以【輕易 □無法】鑽過瓦礫縫。
- ❷這句話比較的重點是什麼？□訓練員數量 體型 □成本。
- (2)飼養和訓練巨鼠的成本比較低，不必花很多錢，只要有老鼠飼料和香蕉作為獎勵就可以了。
- ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
- 巨鼠訓練時需要的食物獎勵是【□昂貴的專業食品 簡單的飼料和香蕉】，所以巨鼠的訓練成本比狗【□高 低】。
- ❷這句話比較的重點是什麼？ 訓練成本
- 2.請將比較重點與比較的訊息填入表格內(請打勾，單選)
- 3.想一想這些重點可以告訴我們什麼？
- ❶誰可以跟多位訓練員合作？ 巨鼠 □狗
- ❷誰可以鑽過瓦礫縫隙？ 巨鼠 □狗
- ❸誰的訓練成本比較低？ 巨鼠 □狗
- ❹作者認為訓練誰當救援幫手對人類比較有利? 巨鼠 □狗
- 4.總結：由上表可知，哪一句最能代表這篇文章的主旨？
- □巨鼠和狗比起來有很多不同的地方。
- 訓練巨鼠也能像狗一樣參與救援，對人類有幫助。
- （ C ）1. 下列語詞何者使用不正確？
- A.地震後，建築物倒塌，滿地都是「瓦礫」
- B.這隻警犬的嗅覺十分「靈敏」，能迅速偵測危險物品
- C.她很節省，把所有打工賺的錢都「倖存」在郵局裡
- D.她經過多年努力，終於「勝任」了老師的工作
- （ B ）2. 為什麼科學家認為使用非洲巨鼠進行救援更有優勢？
- A.它們能夠幫助人類在廢墟中挖掘瓦礫
- B.它們訓練成本低、體型小、更能和人合作
- C.它們在野外比一般動物更容易生存
- D.它們可以配備麥克風、攝影機和定位追蹤器
- （ A ）3. 請問本課文章的主旨是什麼？
- A.非洲巨鼠可以成為救援動物，拯救受困者
- B.地震發生時，狗可以幫助救援隊找到倖存者
- C.強調動物與科技結合的重要性
- D.地震發生時，所有動物都能成為救援隊的一員
- （ B ）4. 為什麼科學家需要透過媒體宣傳非洲巨鼠的救援能力？
- A.讓更多人知道非洲巨鼠的救援能力，牠們應該受到保護
- B.希望減少大家對巨鼠的排斥，看到巨鼠來救援時不要害怕
- C.希望大眾捐款，讓科學家可以做更多的巨鼠物訓練
- D.希望說服更多的團體使用非洲巨鼠來取代搜救犬
- （ D ）5. 末段提到要用巨鼠背上的揚聲器持續播放音訊。以下選項中，哪一項最可能是揚聲器播放的內容？
- A.讓受難者可以感到安全、放鬆的古典或流行音樂
- B.請受難者家屬錄下來的呼喊聲「ＯＯＯ，你在哪裡？」
- C.廣播電台或電視台新聞報導節目的當天新聞
- D.語音：「這隻老鼠是救援大隊的幫手，我們來救你了。」
