discussion_content:
- 深夜，一場猛烈的火災吞噬了整棟大樓，濃煙不斷從建築物內竄出，現場瀰漫著焦味。驚慌的居民受困其中，消防員立刻趕赴現場，全力( E )受困者。
- 要( G ) 艱難危險的救援任務，消防員必須具備專業的( A )，熟練操作各種滅火與救援設備。在看不清楚方向的火場中，他們的感官變得異常( B )，能迅速發現濃煙中的求救信號，及時搶救( D )者。
- 1.現在讓我們找出每一題比較的重點
- (1)此外，巨鼠體型小，狗無法通過的瓦礫縫󠇡隙，巨鼠卻可以輕而易舉的鑽過。
- ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
- 巨鼠的體型比狗【□大 小】，可以【輕易 □無法】鑽過瓦礫縫。
- ❷這句話比較的重點是什麼？□訓練員數量 體型 □成本。
- (2)飼養和訓練巨鼠的成本比較低，不必花很多錢，只要有老鼠飼料和香蕉作為獎勵就可以了。
- ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
- 巨鼠訓練時需要的食物獎勵是【□昂貴的專業食品 簡單的飼料和香蕉】，所以巨鼠的訓練成本比狗【□高 低】。
- ❷這句話比較的重點是什麼？ 訓練成本
- 2.請將比較重點與比較的訊息填入表格內(請打勾，單選)
- 3.想一想這些重點可以告訴我們什麼？
- ❶誰可以跟多位訓練員合作？ 巨鼠 □狗
- ❷誰可以鑽過瓦礫縫隙？ 巨鼠 □狗
- ❸誰的訓練成本比較低？ 巨鼠 □狗
- ❹作者認為訓練誰當救援幫手對人類比較有利? 巨鼠 □狗
- 4.總結：由上表可知，哪一句最能代表這篇文章的主旨？
- □巨鼠和狗比起來有很多不同的地方。
- 訓練巨鼠也能像狗一樣參與救援，對人類有幫助。
