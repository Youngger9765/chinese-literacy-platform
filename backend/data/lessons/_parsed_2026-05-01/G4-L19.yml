multiple_choice:
- question: 1. 下列語詞何者使用不正確？
  options:
  - 地震後，建築物倒塌，滿地都是「瓦礫」
  - 這隻警犬的嗅覺十分「靈敏」，能迅速偵測危險物品
  - 她很節省，把所有打工賺的錢都「倖存」在郵局裡
  - 她經過多年努力，終於「勝任」了老師的工作
  answer: C
- question: 2. 為什麼科學家認為使用非洲巨鼠進行救援更有優勢？
  options:
  - 它們能夠幫助人類在廢墟中挖掘瓦礫
  - 它們訓練成本低、體型小、更能和人合作
  - 它們在野外比一般動物更容易生存
  - 它們可以配備麥克風、攝影機和定位追蹤器
  answer: B
- question: 3. 請問本課文章的主旨是什麼？
  options:
  - 非洲巨鼠可以成為救援動物，拯救受困者
  - 地震發生時，狗可以幫助救援隊找到倖存者
  - 強調動物與科技結合的重要性
  - 地震發生時，所有動物都能成為救援隊的一員
  answer: A
- question: 4. 為什麼科學家需要透過媒體宣傳非洲巨鼠的救援能力？
  options:
  - 讓更多人知道非洲巨鼠的救援能力，牠們應該受到保護
  - 希望減少大家對巨鼠的排斥，看到巨鼠來救援時不要害怕
  - 希望大眾捐款，讓科學家可以做更多的巨鼠物訓練
  - 希望說服更多的團體使用非洲巨鼠來取代搜救犬
  answer: B
- question: 5. 末段提到要用巨鼠背上的揚聲器持續播放音訊。以下選項中，哪一項最可能是揚聲器播放的內容？
  options:
  - 讓受難者可以感到安全、放鬆的古典或流行音樂
  - 請受難者家屬錄下來的呼喊聲「ＯＯＯ，你在哪裡？」
  - 廣播電台或電視台新聞報導節目的當天新聞
  - 語音：「這隻老鼠是救援大隊的幫手，我們來救你了。」
  answer: D
