vocabulary:
- word: 瓦礫
  definition: 建築物倒塌後留下的碎石或磚塊。
- word: 倖存
  definition: 在災難或危險中幸運的活下來。
- word: 輕而易舉
  definition: 形容做事情非常容易。
- word: 訓練有素
  definition: 經過充分的訓練，表現出高水準的能力。
- word: 靈敏
  definition: 動作反應迅速，或是感覺特別敏銳，能夠察覺到一般人可能忽略的細節。
- word: 勝󠇡任
  definition: 有能力完成工作或任務。
- word: 縫󠇡隙
  definition: 物體之間的細小空間或裂縫。
- word: 拯救
  definition: 將人或動物從危險或困境中救出來。
- word: 廢墟
  definition: 無人居住、廢棄不用的建築物。
- word: 救援
  definition: 採取行動，幫助災難受困者，讓他們脫離危險。
- word: 本領
  definition: 技術或能力。
- word: 成本
  definition: 為了完成某件事所需要付出的代價。例如：開飲料店需要材料費、店租、水電費和店員薪水，這些都是開店的「成本」。
