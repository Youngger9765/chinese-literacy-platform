spotlight_raw_text: "閱讀聚光燈\n用表格整理訊息\n    當文章的內容讓人看得眼花撩亂時，讀者可以試著用表格整理訊息。這樣做不但可以幫助我們掌握重點，還可以培養訊息整理的能力。在本課提到，救援行動中使用巨鼠好處多多，這時，我們就可以把狗與巨鼠放在一起進行比較，做成表格，就可以讓人一目了然兩者的差異囉。\n整理表格步驟：\nA.請在表格的「第一列」先寫出比較的對象：巨鼠與狗\nB.找出比較的重點，當文章中出現像是「但是」、「不同」、\n「比較」這些語詞時，就表示作者可能正在拿兩件事來比較喔！\n　範例：訓練有素的巨鼠可以跟多位訓練員合作，\n        但狗通常只接受一位訓練員的指導。\n❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）\n  巨鼠可以跟　多位　□一位　訓練員合作，\n　狗只接受　　□多位　一位　訓練員指導。\n❷這句話比較的重點是什麼？\n　可合作訓練員數量　　□嗅覺能力　\nC.將比較重點：「可合作訓練員數量」填入「第一欄」\nD.在空白格子內填入比較的結果\n846455287020\n第一欄00\n第一欄276987131115100     巨鼠可合作訓練員數量多位，狗可合作訓練員數量只有一位。\n\t\n5029835309880\n第一列00\n第一列　　\n-577851333500\n對象1：巨鼠\n對象2：狗\n94615-170116500重點1：\n可合作訓練員數量\n多位\n一位\n重點2：嗅覺能力\n\n總結：根據這個表格進行分析，提出結論。\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 用表格整理訊息
  instruction: 當文章內容令人眼花撩亂時，試著用表格整理訊息，幫助掌握重點並培養整理能力。本練習將以巨鼠與狗的比較為例，學習如何整理表格。
  reasoning: 此JSON旨在將「閱讀聚光燈」中的「用表格整理訊息」策略練習結構化。根據原文的引導、範例和問題，將其拆解為多個步驟。原文中的步驟A、B、C、D為策略說明，不直接轉換為題目，而是作為題目背景。題目❶和❷為單選題，答案依據原文中「沒 □ = 正確」的規則判斷。最後的「總結」則轉換為開放題，鼓勵學生進行分析。
  steps:
  - prompt: 現在我們來看這句話：「訓練有素的巨鼠可以跟多位訓練員合作，但狗通常只接受一位訓練員的指導。」請你找出巨鼠與狗不同的地方。
    type: select
    options:
    - 巨鼠可以跟多位訓練員合作，狗只接受一位訓練員指導。
    - 巨鼠可以跟一位訓練員合作，狗只接受一位訓練員指導。
    - 巨鼠可以跟多位訓練員合作，狗只接受多位訓練員指導。
    - 巨鼠可以跟一位訓練員合作，狗只接受多位訓練員指導。
    answer: 0
    reasoning: 題目要求找出巨鼠與狗的不同之處。根據原文範例「巨鼠可以跟　多位　□一位　訓練員合作，狗只接受　　□多位　一位　訓練員指導。」，沒有打勾的選項為正確答案。因此，巨鼠的正確描述是「多位」，狗的正確描述是「一位」。選項0正確結合了這兩點。
  - prompt: 這句話比較的重點是什麼？
    type: select
    options:
    - 可合作訓練員數量
    - 嗅覺能力
    answer: 0
    reasoning: 根據原文「可合作訓練員數量　　□嗅覺能力」，沒有打勾的選項為正確答案，因此比較的重點是「可合作訓練員數量」。
  - prompt: 根據這個表格進行分析，提出結論。
    type: free_text
    reasoning: 此為開放題，旨在引導學生根據前述表格整理的資訊進行分析和歸納，培養總結能力。
