spotlight_raw_text: "閱讀聚光燈\n表達看法—4F思考法\n    反思的能力很重要，它能幫助我們發現自己的問題，進而思考：我可以怎麼做？\n    作者看到吐瓦魯的報導也進行了反思，他想到臺灣也受到全球暖化的威脅，認為對抗全球暖化是全人類的共同議題。\n    反思很重要，但該怎麼做呢？反思也可以透過步驟來練習喔！接下來我們要介紹「4F反思法」。\n1.事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。\n2.感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？\n3.發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？\n4.未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 表達看法—4F思考法
  instruction: 「4F反思法」是一種結構化的反思工具，能幫助我們深入思考事件。請依照以下步驟練習，對所閱讀的內容進行反思。
  reasoning: 此練習旨在引導學生透過「4F反思法」的四個步驟（事實、感受、發現、未來）來結構化地進行反思，提升其表達看法及批判性思考的能力。每個步驟都設計為開放性問題，鼓勵學生根據閱讀內容或自身經驗進行深入思考。
  steps:
  - prompt: 事實（Facts）：看見了什麼事實？可以透過不同角度來描述這個事件。
    type: free_text
    reasoning: 此題引導學生客觀陳述事件的關鍵資訊，練習從不同角度觀察事實，為後續的反思奠定基礎。
  - prompt: 感受（Feeling）：對於你所看見的事實，你有什麼樣的感受？
    type: free_text
    reasoning: 此題旨在引導學生連結事件與自身情感，練習表達個人感受，培養情感覺察能力。
  - prompt: 發現（Finding）：做更深入的思考，有新的發現。像是為什麼這件事會發生？從這個事件你學到什麼？過去生活中有沒有發生類似的事件？
    type: free_text
    reasoning: 此題鼓勵學生進行深層次思考，探究事件背後的原因、學習到的教訓，並連結個人經驗，培養歸納、分析與類比能力。
  - prompt: 未來（Future）：將前面的思考應用在未來的生活中。這個事件對你的未來有什麼影響？你可以有哪些行動來預防不好的結果？或是有哪些行動可以複製他人的成功？
    type: free_text
    reasoning: 此題引導學生將反思結果應用於未來行動，思考如何預防問題或複製成功經驗，培養解決問題、規劃未來及實踐的能力。
