- 陳芝瑄／臺北報導(2024/6/20)
- |-
  世界展望會六月發布的「缺糧」報告指出，在六個亟需協助的國家中，許多家庭每天只能吃一頓飯；每三名受訪者中有兩人因沒東西吃而必須餓肚子入睡；更有46%的家庭一整天沒進食。此外，救援工作者觀察到，兒童淪為童婚、性暴力和兒童販運的風險大幅增加。
- |-
  報告指出，兒童遭受更多暴力、忽視或虐待；烏干達一個地區有75%的難民，家中有懷孕的未成年女兒，因為她們被迫童婚，或從事性交易以換取食物；阿富汗更有97%的父母因糧食不足，只好提前把養不起的女兒嫁掉。在烏干達，有些父母因為孩子沒東西吃，壓力過大而輕生。
- |-
  世界展望會「全球飢餓回應方案」總監指出，氣候變遷、衝突和新冠疫情，讓3800萬人距離餓死僅剩一步之遙，其中1900萬是兒童，被送去工作或結婚，甚至不堪缺糧之苦而想結束生命，人道救援正努力遏止悲劇發生。
