vocabulary:
- word: 鳥瞰
  definition: 從高處往下看。
- word: 臨界點
  definition: 指事物或狀態改變的關鍵時刻。本文指島嶼即將被淹沒的關鍵時刻。
- word: 流離失所
  definition: 失去原本的住所，到處流亡、分散到各地。
- word: 首當其衝
  definition: 最先遭遇災難或是最先受到衝擊。
- word: 沒有人是局外人
  definition: 此事和大家都息息相關。局外人，與某件事不相關的人。
- word: 岌岌可危
  definition: 形容非常危險。岌岌，山勢陡峭或危險的樣子。
- word: 溫室氣體
  definition: 容易吸收太陽熱能的氣體，如果大幅增加，會造成地球暖化。
- word: 池魚之殃
  definition: 無緣無故受到災害連累。
- word: 先例
  definition: 以前發生過的事例，這些事後來可成為參考的依據。
- word: 雲端
  definition: 一種透過網路運作的方式，可以共享軟體和資訊。
- word: 氣候難民
  definition: 因為居住環境氣候的劇烈改變，導致被迫離開家園的人。
