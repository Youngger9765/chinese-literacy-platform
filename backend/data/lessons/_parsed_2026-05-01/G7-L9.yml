multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 烏俄戰爭持續不斷，讓許多人「流離失所」，甚至失去性命
  - 妹妹從山腳下「鳥瞰」山上的樹林，覺得風景真是美麗極了
  - 運動鞋特賣會開始了，小翔「首當其衝」，第一個衝進會場
  - 大雄因作業沒完成而被老師處罰，遭受「池魚之殃」，真倒楣
  answer: A
- question: 2. 根據課文第四段，吐瓦魯部長柯飛說：「我們要將它們移到雲端！」這裡的它們指的是什麼呢?
  options:
  - 吐瓦魯的祖先、人民和家園
  - 吐瓦魯的土地、海洋和文化
  - 吐瓦魯的領土、人民和政府
  - 吐瓦魯的地標、家園和小島
  answer: B
- question: 3. 文章主題是登入元宇宙的吐瓦魯，為什麼第七段要特別提到臺灣呢？
  options:
  - 因為作者想讓臺灣的讀者感同身受，不要當局外人
  - 因為臺灣是作者的國家，他也想要讓讀者認識他的家園
  - 因為臺灣數位科技發達，要登入元宇宙特別容易
  - 因為臺灣也想要獲得國際承認，並持續擁有海域邊界與資源
  answer: A
- question: 4. 整篇文章讀下來，你認為什麼是「元宇宙」呢？
  options:
  - 它是人類為了離開小島，而在大陸設置的生活空間
  - 它是一個人類在外太空建立的網路新世界
  - 它是人們可以透過網路在裡頭生活的虛擬世界
  - 它是為了避難，人類創立的超大型庇護所
  answer: C
- question: 5. 作者寫這篇文章的目的是什麼呢？
  options:
  - 想要支持吐瓦魯建立元宇宙國家
  - 希望讀者能更了解吐瓦魯的處境
  - 想要臺灣搶先一步建立虛擬國家
  - 希望大家能正視全球暖化的問題
  answer: D
