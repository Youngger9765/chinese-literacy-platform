title: 焚而不毀的倫敦
authors: 課文 ：曾世杰 學習單：張明珠
story_text: 1940年秋天。倫敦的空襲警報嗚嗚響起，「德國轟炸機又來了!」倫敦人一邊嘀咕著，一邊迅速關上窗、拉上窗簾、背起逃生行李，蜂擁奔向地鐵站，整個城市很快就陷入黑暗。20分鐘後，夜空開始傳來各種令人心神不寧的噪音，那是幾百架德國轟炸機逼近的轟鳴、是城市各角落高射炮的砰砰響聲、是此起彼落的轟隆轟隆的爆炸聲。德軍對英國發動了連續57晚的轟炸之後，零星的攻擊又持續了六個月。轟炸時，夜空被炮火、探照燈點亮、社區化為火海；天亮後，倫敦滿目瘡痍、焦土遍野，建築像被巨手壓扁的紙盒，街道上滿是殘垣敗瓦、玻璃與血，空氣中瀰漫著煙塵與燒焦的氣味。 這段史稱「英 倫大轟炸」的日子，英國的死亡人數超過四萬，傷殘人數十四萬。 納粹德國的元首希特勒相信，這種「恐怖空襲」不但有實質的殺傷和破壞力，更是一種「心理戰」。他不只想摧毀城市，更想摧毀人心。用高爆彈和燃燒彈讓英國社會中的恐懼像瘟疫一樣蔓延之後，英國政府和人民抵抗的意志就會崩潰，最後舉白旗投降。連英國的心理學家戰前也有類似的預測，若遭受持續空襲，人心及社會秩序瓦解，政府會隨之失控。英國甚至祕密準備了大量的棺木與精神病床，等待那場「無可避免的恐慌」。 然而，出人意料之外——那場恐慌從未降臨。 當街區陷入火海時，消防員衝進濃煙裡滅火，但更多來幫忙的，是臨時組成的救火隊——他們是鄰居、店員、郵差、老師。他們頭戴鋼盔，拿著水桶、鏟子、簡陋的擔架，在瓦礫中尋找受困的人。有些人冒著餘燼進入半塌的屋子，把老人背出來；有些婦女把自己的家改成臨時避難所，燒開水、分送熱茶給受驚的小孩與救火隊。街角的麵包店雖然玻璃全碎，老闆仍堅持烤麵包，說：「大家還得吃早飯。」 起初倫敦地鐵只是臨時的避難所，但很快的，人們自己組織起來：有人分派位置、有教師為孩子講故事、有人吹口琴、唱歌安撫小孩，婦女組成炊事隊分送茶與餅乾，甚至有醫生護士來回巡診。城市的夜空在燃燒，地鐵裡的倫敦人依然打毛線、講笑話、談戀愛、開書報攤，牆上有小朋友畫的小熊維尼。 當警報解除、太陽升起，城市滿血復活。大夥兒開始清除瓦礫、拉起臨時電線、修復炸斷的水電管路，郵差照常送信，主婦上街買菜，一家商店的櫥窗貼出「挨炸卻打不倒」的標語。 一名女子從倫敦地鐵避難所回家，裙腳還沾著灰塵。她家那條街已成廢墟，但她受訪時並未呼天搶地，只平靜幽默的說：「炸得還可以，沒打破我的茶壺。」當時英國人用「克制的上唇（stiff upper lip）」來形容這種面不改色的心理靱性。隨著大眾媒體的報導，「克制的上唇」成了英國的文化象徵，成了對恐懼集體免疫的預防針，更成了「我們撐得下去」的證據。 英國首相丘吉爾多次巡視災區，和居民握手、為他們掉淚，也再三承諾，他一定會對德國「加倍奉還」。他發現，人們看見的不是百廢待舉的殘破，反而是一種同舟共濟、生死與共的樣貌。丘吉爾在對全國廣播時，說出他所看見的：「斷水斷電……但我們的人民從一開始就展現出無比的勇氣、堅韌與耐力。」「轟炸點燃了英國人心中的火焰。」 戰後，心理學家調查發現，大轟炸後，幸運存活者非但沒有嚇壞，反而產生了強烈的自信與平靜，這現象被稱為「倖存者的鎮定」。心理學家把群眾分為三類，第一類是非死即傷的「直接受害者」；第二類是目睹傷亡破壞的「間接受害者」；第三類是住得遠、但每天聽得到警報的「未受波及者」。出乎意料的是，最恐懼的不是前兩類，而是第三類人，他們遠離災區，只能靠想像理解戰爭，他們的恐懼反而沒有出口；而身在重災區的人，因為能「親身體驗」，能「參與救災」，因此獲得掌控感，可以幫自己把紛亂的心緒重新找回秩序與平衡。 原來，人類的恐懼，不是對危險本身的反應，而是對未知的想像；原來，當人們真正面對恐懼，恐懼就沒那麼可怕；原來，當危險變成日常，人們反而會見怪不怪，處變不驚。 希特勒以為「恐懼」會像瘟疫般擴散，卻沒料到「勇氣」也能，而且感染力更強。 或許這才是倫敦大轟炸給人類最意想不到的遺產。大轟炸帶來的，不是以死傷、破壞與恐懼為表象的暗黑勢力，而是勇氣、團結、互助的希望防線——一種名為「心理靭性」的力量。
