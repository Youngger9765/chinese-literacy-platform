multiple_choice:
- question: 1. 下列語詞何者使用錯誤？
  options:
  - 失去兒子的婦人跪在地上「呼天搶地」，令人心酸不已
  - 在疫情期間，醫護人員與民眾「同舟共濟」，齊心對抗病毒
  - 段考過後，同學都無心上課，一片寂靜，真是「百廢待舉」
  - 火警發生時，班長「處變不驚」，冷靜指揮同學依序疏散
  answer: C
- question: 2. 第十段提到：「轟炸點燃了英國人心中的火焰。」這句話的「火焰」指的是什麼？
  options:
  - 人心被點燃的勇氣決心
  - 建築燃起的真實大火
  - 對敵產生的仇恨衝動
  - 面對戰爭的興奮期待
  answer: A
- question: 3. 那位婦人說：「炸得還可以，沒打破我的茶壺。」從這句話中，可以推論出這位婦人當時的心情或態度是什麼？
  options:
  - 她對轟炸非常憤怒，想諷刺德國，表達不滿
  - 她有心理靭性，用幽默的口吻面對災難的發生
  - 她比較不在乎房子被炸，只在意茶壺是否完好 D.她想要安慰別人，假裝沒事，但其實很害怕
  answer: B
- question: 4. 本文的主旨是什麼？
  options:
  - 災難讓人類看見戰爭的殘酷與敵國的無情
  - 恐懼是一種人性本能，並不是人所能控制的
  - 勇氣與團結讓人們在危難中浴火重生
  - 英 倫大轟炸揭露了德國想併吞英國的陰謀
  answer: C
- question: 5. 作者在文中引用「死亡與傷殘人數」以及「心理學家的調查結果」，這樣的寫法主要有什麼作用？
  options:
  - 讓讀者更有現場感，感受當時倫敦的慘況
  - 用來增加文章的情緒張力，讓內容更戲劇化
  - 透過數據製造震撼效果，吸引讀者注意力
  - 結合事證與研究，強化文章的可信度與說服力
  answer: D
