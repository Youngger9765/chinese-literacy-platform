vocabulary:
- word: 質疑
  definition: 對某件事情或說法有所懷疑。
- word: 容納
  definition: 指的是在固定的空間範圍裡，能裝進多少物品或裝載多少人。例如，一個電梯可以容納800公斤的重量。
- word: 負荷
  definition: 人能夠承受的量。例如，一個人每天工作18小時，我們會說他工作負荷太重了。
- word: 遷移
  definition: 從一個地方轉移到另一個地方。例如，學會騎踏車，在車上平衡不跌倒的能力，也會遷移到騎機車上。它的近義詞是「遷徙」，但遷徙只能用在地理上的移動。
- word: 工作記憶
  definition: 記憶系統中的一部分，它的容量有限，用來暫時保存與處理訊息。
