multiple_choice:
- question: 1. 這篇文章講到「柳丁」和「文旦」和籃子的比喻，主要是在談它們哪一樣特質的差異？這特質會造成什麼影響?
  options:
  - 顏色/ 容不容易辨別、分類 B.體積/ 容不容易儲存、處理
  - 水果/ 容不容易酸敗、腐壞 D.價錢/ 容不容易銷售、運輸
  answer: B
- question: 2. 根據課文內容，以下對「重複朗讀」的描述，哪一項是錯誤的?
  options:
  - 重複朗讀一至五課，對第六課的朗讀速度沒有影響
  - 重複朗讀的練習效果，也能提升新文章的閱讀速度與理解
  - 重複朗讀會讓訊息更容易記憶與處理
  - 重複朗讀的練習，有助於會考時的閱讀表現
  answer: A
- question: 3. 根據課文，若要提升小歐的閱讀表現，你會給什麼建議？請選出正確的選項。
  options:
  - 閱讀速度本來就有的人快、有的人慢，順其自然就好
  - 國中會考和國文課課文完全不同，大量課外閱讀最重要
  - 經常找文章做重複的計時朗讀，訓練自己讀得快一點
  - 可以多讀幾篇容易的文章，好讓自己養成讀得快一點的習慣
  answer: C
- question: 4. 請問哪一個句子使用了譬喻法？
  options:
  - 蝴蝶和蜜蜂們帶著花朵的蜜糖回家了（擬人）
  - 經過半睡眠的山崗，去探初醒的海洋（擬人）
  - 淺灘上，老是棲息著五色的魚群（視覺摹寫）
  - 這個人瘦得像一支竹竿，頭髮亂得像一個鳥巢
  answer: D
- question: 5. 作者寫這篇文章，最主要的目的是什麼?
  options:
  - 以文旦、柳丁、籃子教導讀者譬喻的寫作手法
  - 教導讀者認識什麼是工作記憶，及其功能與特性
  - 告訴讀者，重複朗讀可以提升閱讀速度與理解能力
  - 教導讀者重複朗讀的訓練方法
  answer: C
