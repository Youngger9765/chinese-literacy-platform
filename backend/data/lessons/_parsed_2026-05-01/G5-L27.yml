spotlight_raw_text: "閱讀聚光燈\n譬喻法\n\n　　譬喻法是一種寫作手法，就是用大家熟悉的事物去說明另一件事（Ａ比喻Ｂ），例如：我家的貓，像精明幹練的警察，緊盯著老鼠的腳步。把「貓」比喻成「警察」，就是譬喻的寫作手法，它會使文章變得更生動，更容易理解。\n　　使用譬喻法時，句子裡常會出現「好像」、「像」、「似的」、「如同」、「一樣」、「A（像）是B」。例如：（1）「工作記憶」好像大腦裡的「籃子」。（2）小歐讀得慢，工作記憶裡裝的是「文旦」。\n注意：如果沒有把Ａ比喻成Ｂ的話，即使句子裡有「好像」，也不能算喻句。\n例如：（Ｏ）夜空裡的星星好像寶石一樣，閃閃發亮。\t\n（Ｘ）小寶寶哭個不停，好像肚子餓了。  \n（Ｘ）小峻長得好像他爸爸。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 譬喻法
  instruction: 請閱讀以下關於譬喻法的說明，並練習辨識譬喻句。
  reasoning: 此練習旨在引導學生理解譬喻法的定義、常見標誌詞，並透過正反範例學習如何正確辨識譬喻句，以提升其閱讀理解與寫作分析能力。
  steps:
  - prompt: 請用自己的話解釋什麼是「譬喻法」，並說明它在文章中的作用。
    type: free_text
    reasoning: 此題旨在讓學生理解並內化譬喻法的定義及其功能，確保他們掌握策略的核心概念。
  - prompt: '判斷以下句子是否為譬喻句：

      夜空裡的星星好像寶石一樣，閃閃發亮。'
    type: select
    options:
    - 是譬喻句
    - 不是譬喻句
    answer: 0
    reasoning: 原文標示為（Ｏ），因為將「星星」比喻成「寶石」，符合譬喻法的定義（A比喻B），且有「好像...一樣」的連結詞。
  - prompt: '判斷以下句子是否為譬喻句：

      小寶寶哭個不停，好像肚子餓了。'
    type: select
    options:
    - 是譬喻句
    - 不是譬喻句
