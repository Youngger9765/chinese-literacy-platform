multiple_choice:
- question: （ Ｃ ）1.第五段中，研究者刻意使用「早期構樹文物」，而不使用現生構樹，其主要目的為何？
  options:
  - 早期文物保存狀況較好，能提高分析準確度
  - 早期文物數量較多，能蒐集更完整的樣本
  - 避免近代人為運輸造成來源判斷的誤差
  - 早期文物比現生構樹更能代表文化用途
  answer: C
- question: ２.第五段中，研究者在進行 DNA 分析前，其實已經隱含一個「可檢驗的預測」。下列哪一項最接近這個預測內容？
  options:
  - 不同地區的構樹基因型態應完全相同
  - 若構樹來自同一源頭，基因型態會隨距離改變
  - 若構樹與人類遷徙無關，各地分布應隨機
  - 若構樹用途相同，基因型態就會完全一致
  answer: B
- question: ３.作者在開頭列舉「臺灣到紐西蘭約 9000 公里、復活節島到馬達加斯加達 18000 公里」，主要想讓讀者感受到什麼？
  options:
  - 南島人口必然很多，經濟實力不容忽視，應受看重
  - 南島天各一方，卻有相似的語言文化，太有趣了
  - 距離太遠必定隔絕，所以語言和文化不可能相像
  - 各島分布這麼遠，才能說明科學家的研究有多困難
  answer: B
- question: ４.依文章的推理方式，如果某島的構樹 DNA「基因型態很少」，最可能代表什麼？
  options:
  - 該島的構樹完全沒有被人類汙染過 B.該島樣本蒐集太多，所以型態才變少 C.該島一定是構樹最早出現的源頭 D.該島可能位在遷徙路徑較的末端
  answer: D
- question: ５.根據課文第六段，支持「南島語族可能從臺灣出發（出臺灣說）」的「多面向證據」包括哪些？
  options:
  - 臺灣的地理位置、南島語族的分布範圍，及海洋交通的便利性
  - 構樹在的分布情形、南島語族的文化活動，及島嶼的自然環境
  - 構樹 DNA 的研究結果、南島語族語言的相似性，及文化證據
  - 南島語族遷徙的距離、各島嶼的氣候條件，及航海技術的發展
  answer: C
