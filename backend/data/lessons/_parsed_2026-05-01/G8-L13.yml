vocabulary:
- word: 廣闊無垠
  definition: 範圍非常大，廣大到沒有邊界。
- word: 天各一󠇢方
  definition: 形容彼此距離非常遙遠，各自在不同地方，很難相見。
- word: 精湛
  definition: 形容技術或能力非常高明，做得又好又準。
- word: 綿延
  definition: 形容事物連續不斷的延伸，很長、很久都沒有中斷；常用來描述長度或時間。
- word: 星羅棋布
  definition: 形容事物分散在各處，數量很多，到處都有。
- word: 舉足輕重
  definition: 形容某件事或某個角色非常重要，一個小動作就會影響整個情況。
- word: 掛一漏萬
  definition: 漏：遺漏。形容只提到一小部分，卻遺漏了非常多重要內容。
- word: 支離破碎
  definition: 零散又破裂。形容內容零散、不完整，前後連不起來。
- word: 一󠇡目了󠇡然
  definition: 目：眼睛；了然：清楚明白。形容事情或結果非常清楚，看一眼就懂，不需要再解釋。
