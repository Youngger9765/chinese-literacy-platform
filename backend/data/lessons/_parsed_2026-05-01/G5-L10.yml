strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  reasoning: 此練習旨在引導學生透過閱讀文本中的言行，推論人物特質，並理解作者的觀點。題目類型包含單選題與開放題，其中原文的填空題因JSON schema限制，已轉換為開放題。
  steps:
  - prompt: 從以下哪一句話，你推論小花是一個聰明的人，因為她做事情有方法，介紹同學離鄉補習，會考慮與解決同學的需求？
    type: select
    options:
    - 「我考上了，是有公費的師範學院，謝謝你，謝謝你。」
    - 「為了要活下去，我必須要有策略。我打電話給同學時，很誠懇的介紹補習的優點，考慮同學們離家背井的各種需求，有時還幫忙他們找租屋。」
    answer: 1
    reasoning: 題目明確指出小花「做事情有方法，介紹同學離鄉補習，會考慮與解決同學的需求」，這與第二句話中「為了要活下去，我必須要有策略」及後續的具體行動描述相符，顯示其聰明特質。
  - prompt: 從以下哪一句話，你覺得她是一個懂得感恩的人，因為她考上公費生，第一時間打電話給妹妹，感謝妹妹的幫助？
    type: select
    options:
    - 「我考上了，是有公費的師範學院，謝謝你，謝謝你。」
    - 「為了要活下去，我必須要有策略。我打電話給同學時，很誠懇的介紹補習的優點，考慮同學們離家背井的各種需求，有時還幫忙他們找租屋。」
    answer: 0
    reasoning: 題目明確指出小花「考上公費生，第一時間打電話給妹妹，感謝妹妹的幫助」，這與第一句話中「我考上了，是有公費的師範學院，謝謝你，謝謝你。」的內容直接呼應，顯示其感恩特質。
  - prompt: 從文章中，小花做了哪些行為，讓你覺得她是一個努力的人，因為她花了很多時間打工賺錢，都不休息？請列出至少三項行為。
    type: free_text
    reasoning: 此題旨在讓學生從文章中找出支持「努力」特質的具體行為。原文為填空題，但因JSON schema限制，改為開放題。參考答案為：放學後、寒暑假時為了多賺點錢，小花練就了一身俐落的身手；在補習班打工時，她用很短的時間成為了業績第一名的工讀生；在大學期間，她除了讀書，也繼續打工、接家教。
  - prompt: 從文章中，小花做了哪些行為，讓你覺得她是一個勇敢的人，因為她不甘於現狀，願意去爭取自己的權益？請列出至少兩項行為。
    type: free_text
    reasoning: 此題旨在讓學生從文章中找出支持「勇敢」特質的具體行為。原文為填空題，但因JSON schema限制，改為開放題。參考答案為：小花窮怕了，她跟媽媽爭取，希望再給一次機會，靠著教育翻身；不知道哪裡來的勇氣，她到一家婦產科診所應徵成黑牌護士。
  - prompt: 文章最後一段提到：「小花和姊姊都努力過人，但是教育決定了他們人生進路的差異。」請問作者對於「教育」抱持著怎樣的信念或想法？
    type: select
    options:
    - 教育可以脫離貧窮
    - 努力是教育的開始
    - 教育帶來改變的希望。
    answer: 2
    reasoning: 根據原文，選項「努力是教育的開始」前有『□』符號，表示其非正確答案。故事中，小花透過教育改變貧困處境，因此「教育帶來改變的希望」是作者對教育的核心信念，涵蓋了脫離貧窮的意義，且更符合「教育決定了他們人生進路的差異」這句話的深層含義。
