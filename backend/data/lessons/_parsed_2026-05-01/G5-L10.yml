multiple_choice:
- question: 1. 下列語詞何者使用正確?
  options:
  - 他家境貧窮，許多衣服都「嗷嗷待哺」
  - 小青是大學教授，學問淵博、「目不識丁」（前後邏輯錯誤）
  - 連日的加班使他「積勞成疾」，只能請假在家休養
  - 他「身手俐落」，一天摔破了好幾個碗盤（前後邏輯錯誤）
  answer: C
- question: 2. 文中第一段提到：「遠足時，她眼睜睜的看著同學啃著紅艷的大蘋果，只能撇開目光，嚥下自己的口水。」請問小花撇開目光的原因為何？
  options:
  - 想要卻得不到，只能假裝沒看到，以免自己難受
  - 她不喜歡同學吃的那種大蘋果，看了就不舒服
  - 她更看重遠足時的學習，而不是吃喝玩樂
  - 蘋果的顏色和反光刺痛了小花的眼睛
  answer: A
- question: 3. 第一段寫道，小花把糖果留到睡前，含在嘴裡再慢慢睡去，她「以為這樣才可以吃一整夜……這天真的代價可真不小啊。」請問這「天真的代價」指的可能是什麼？
  options:
  - 夢到一整個晚上都在吃糖 B.含著糖睡導致蛀牙
  - 熟睡張口後引來蟑螂吃糖 D.嘴裡整夜都有甜蜜的滋味
  answer: B
- question: 4. 文章最後一段提到：「小花與姊姊們都努力過人，但是，教育決定他們人生的進路的差異。」請問作者認為小花成功最可能的原因為何？
  options:
  - 姊姊們沒有像小花一樣努力
  - 小花比姐姐好運才能夠成功
  - 姊姊們的頭腦不如小花聰明
  - 小花一直不放棄受教育的機會
  answer: D
- question: 5. 請問底下哪一個選項不是本文作者的用意？
  options:
  - 提供一個在逆境中成長的案例
  - 說明除了努力之外，也要感恩幫助自己的人
  - 說明順境使人好逸惡勞，不知上進（作者未提到任何順境。）
  - 強調教育是翻轉人生的關鍵力量
  answer: C
