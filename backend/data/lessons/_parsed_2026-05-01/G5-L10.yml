vocabulary:
- word: 彌漫
  definition: 遍布、充滿。
- word: 積勞成疾
  definition: 長期勞累因而生病。
- word: 嗷嗷待哺
  definition: 形容飢餓哀號󠇡，等待餵食或救濟。
- word: 俐落
  definition: 做事明快，不拖泥帶水。
- word: 著落
  definition: 表示下落、結果。
- word: 庇蔭
  definition: 對子孫或弟妹的保護。
- word: 貼補
  definition: 填補不足的部分。
- word: 按件計酬
  definition: 按照完成的工作件數，計算工資。
- word: 餘悸猶存
  definition: 形容驚嚇、懼怕的心情，還沒平復過來。
- word: 目不識丁
  definition: 不識字或未受教育。
- word: 食指浩繁
  definition: 家裡要餵養的人數很多。
