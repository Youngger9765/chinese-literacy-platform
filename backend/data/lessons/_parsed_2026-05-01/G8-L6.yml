multiple_choice:
- question: 1. 下列語詞何者使用不正確?Ａ－蜂擁而至指的是大家前來，語意錯誤
  options:
  - 一聽到警報聲，大家「蜂擁而至」的逃出教室
  - 這座城市因觀光業「崛起」，變得越來越繁榮
  - 颱風來襲前，民眾「倉皇」搶購物資
  - 他講稿沒準備好，上場時顯得非常「狼狽」
  answer: A
- question: 2. 作者提到戲院是她的家，但為什麼她說「這個家讓人不安心」？
  options:
  - 因為戲院經常斷電停水
  - 戲院裡常發生混亂與危險事件
  - 作者和家人關係不好
  - 作者常需要在戲院旁顧攤而遇到同學
  answer: B
- question: 3. 文章中提到作者用「黑色十字繡罩在燈上，在縫隙滲出的微光下解題」，這段文字作者主要想凸顯什麼？
  options:
  - 她熱愛刺繡工藝
  - 奶奶不疼愛她，嫌棄她是女生
  - 她不喜歡在那麼亮的燈光下學習
  - 她在艱困中仍舊堅持學習
  answer: D
- question: 4. 這篇文章最主要想要表達的核心思想是什麼？
  options:
  - 社會亂象無處不在，要小心保護自己
  - 家庭是你永遠避風的港灣
  - 堅持努力就能在逆境中改變命運
  - 不要對人性失去信心，社會處處都有好人
  answer: C
- question: 5. 作者描寫戲院中發生的各種事件，如賭博、吸膠、性騷擾，這樣的描寫目的為何？
  options:
  - 最大化的展現父親管理戲院的混亂
  - 豐富文章情節，使文章更具有可看性
  - 用童年所處的艱難環境，襯托她仍能努力讀書的可貴
  - 呈現早期鄉鎮戲院的治安隱憂，提醒觀眾自我保護
  answer: C
