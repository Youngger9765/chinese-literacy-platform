spotlight_raw_text: "閱讀聚光燈\n    讀故事，不能只看角色「做了什麼」，還要思考角色「為何會這麼做」。唯有深入探索人物內心，推敲他的動機、情緒與想法，我們才能真正讀懂情節和作者的用心。現在就讓我們練習看看。\n　　1.推測人物的動機：在文章中，人物的動機可能會「明示」，但也可能「隱含在情節中」。例如：第九段\n(1)明示──文章直接說明原因\n   例如：奶奶嫌電費貴，不准我開燈。\n　　　奶奶不准我開燈的動機是【　　怕電費太貴　　　】。\n(2)隱含──原因沒寫明，要根據上下文情節推論\n例如：導師了解我的處境，每學期都會悄悄送我參考書。\n請推測導師這樣做的動機是什麼？（請打勾，單選）\n知道作者家裡沒有錢，希望作者不用花太多錢買書\n□想提升班級整體成績，以獲得優良導師獎\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈
  instruction: 閱讀故事時，除了角色行為，更要深入探索人物內心，推敲其動機、情緒與想法，才能真正讀懂情節與作者用心。
  reasoning: 此練習旨在引導學生學習「閱讀聚光燈」策略中的「推測人物動機」。透過明示與隱含兩種情境的範例，讓學生理解如何從文本中直接擷取或根據上下文線索推論人物行為背後的原因，以深入理解情節和作者意圖。
  steps:
  - prompt: 閱讀以下句子，判斷奶奶不准我開燈的動機：奶奶嫌電費貴，不准我開燈。
    type: select
    options:
    - 怕電費太貴
    - 不喜歡光線
    - 想讓我早點睡覺
    - 擔心燈泡燒壞
    answer: 0
    reasoning: 原文「奶奶嫌電費貴」直接說明了奶奶不准開燈的原因，屬於動機明示的情況，因此正確答案為「怕電費太貴」。
  - prompt: 閱讀以下句子，推測導師這樣做的動機是什麼？導師了解我的處境，每學期都會悄悄送我參考書。
    type: select
    options:
    - 知道作者家裡沒有錢，希望作者不用花太多錢買書
    - 想提升班級整體成績，以獲得優良導師獎
    - 導師喜歡送禮物給學生
    - 導師認為參考書對學習很重要
    answer: 0
    reasoning: 根據「導師了解我的處境」以及「悄悄送我參考書」的行為，可推論導師是體恤作者家境困難，希望減輕其購買參考書的經濟負擔，此為動機隱含需推論的情況。選項「知道作者家裡沒有錢，希望作者不用花太多錢買書」最符合此推論。
