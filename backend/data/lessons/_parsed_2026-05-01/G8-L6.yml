title: 戲院、賭場、檳榔攤：在時代夾縫中成長的我
authors: 課文 ：林玫伶 學習單：張明珠
story_text: 在電視尚未普及的年代，爸爸與伯父在南部各縣市巡迴放映電影，貨車載著放映機、膠卷與銀幕，深入鄉間。當時鄉下娛樂設施少，人們熱切期盼「流動電影院」的到來。雖然收入不錯，但四處漂泊十分辛苦，幾年後，他們決定在高雄 美濃定居，集資興建「第一戲院」，而我也在這時出生。 1969年戲院落成，開幕時熱鬧風光，大人們滿懷希望，以為觀眾會如往昔般蜂擁而至。然而短短幾年，電視與錄影帶迅速崛起，取代電影院，加上鄉村人口外移，戲院常常空空蕩蕩，沒幾個客人。 上小學後，同學羨慕我能天天免費看電影，但我卻開心不起來。爸爸的帳本顯示，有時一天收入僅幾百元，根本撐不起戲院的開支。爸爸與伯父常愁眉不展，到處借錢，挖東牆補西牆；後來他們甚至到賭場碰運氣，妄想一夜致富。有次放學路上，我看見爸爸和一群人在社區活動中心聚賭，他神色木然，我則漲紅了臉快步離開，像逃離一場不願面對的夢。 為了填補戲院虧損，爸爸在戲院一旁搭鐵皮屋賣香菸、檳榔和零食。放學後我會接替母親顧攤，也學會切檳榔、抹紅灰、包荖花，將檳榔一包包整齊排進冷藏箱。同樣的檳榔若能在賭場賣，售價可以翻倍。有次爸媽帶我去賭場做生意，昏暗的農舍裡燈光慘白，賭客在草蓆上或坐或蹲，我捧著用籃子盛著的檳榔，媽媽收錢找錢，爸爸則忙著賭場事務。後來他們意識到我年紀太小，便不再帶我去。但某個深夜，他倆一身泥巴回到家，我在床上瞇著眼偷聽，才知道警察突襲抓賭，爸媽和賭客們倉皇逃進剛灌溉過的香蕉園，才會如此狼狽。從那天起，每晚我總要等到他們平安進門，才能安心睡著。 戲院是我們的家，但這個家讓人不安心。 偶爾會有看霸王戲的人，不買票卻強行闖入，原本沉浸在故事中的觀眾，被這突如其來的騷動拉回現實，氣氛瞬間緊張起來。有時「霸王」被順利請出，有時爭執起來。戲還在演，但舞台卻分成了兩個：一個在銀幕，一個在走道。 意外的生活戲碼，經常發生。黝黑的空間裡，有時藏著不懷好意的鹹豬手，趁機騷擾鄰座，我自己遇過幾次，常嚇得起身就跑，不敢回頭。散場後，兄弟姊妹一起打掃，有時會在椅座下發現裝著黃色黏液的袋子，那是有人偷偷吸食強力膠留下的，帶著一股刺鼻的化學氣味。 有次事件最令人驚心動魄。那晚，戲院前的廣場傳來一陣喧嘩，一名男子手持武士刀追逐另一人，朝著我家的方向奔來。被追上的人情急下抓起戲院門口的鐵椅擋刀，刀鋒削進椅腳，紛亂中持刀人被制伏。整個過程僅數分鐘，但別說小孩，連大人都驚駭不已。 那年我已升上國中，戲院更加蕭條。導師了解我的處境，每學期都會悄悄送我參考書；理化老師讓我晚上到他空著的宿舍自習，雖然只去幾次，卻讓我倍感溫暖。在紛亂的生活中，我逐漸摸索出讀書的時機與訣竅。顧檳榔攤時最怕遇見同學，我乾脆埋頭寫練習卷避開尷尬，客人見我用功，先是驚訝，接著還會讚賞我一番。電影放映時，我在戲院入口看門或顧車，沒有桌子，我便拿著需要記誦的課本，一邊背一邊來回踱步，即使耳邊傳來銀幕上忽大忽小的對白聲，也絲毫不影響我的專心。需要計算的科目則留到打烊後，奶奶嫌電費貴，不准我開燈，我便等她熟睡後，再打開桌上小檯燈，把家政課做的黑色十字繡罩在燈上，在縫隙滲出的微光下解題。 就這樣，我順利考上臺南女中和臺南師專，美濃鎮上到處張貼大紅賀榜，爸媽只是淺笑，我知道他們既驕傲又欣慰。 後來，我當了老師、校長，還成了一位作家。回顧年少時的點滴，至今歷歷在目。我曾埋怨家庭的動盪不安，生氣爸媽的工作讓我難堪，但我也漸漸體會他們在時代巨浪下的掙扎，心疼他們的無奈。更難忘學校老師的關愛，穩住了當時徬徨無助的我，讓我相信自己擁有改變命運的力量。
