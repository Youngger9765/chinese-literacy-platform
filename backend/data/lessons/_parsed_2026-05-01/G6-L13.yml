- 1.判斷題：請問這些問題是否符合檢核表的3項要素？符合畫，不符合畫
- （ ）(1)作者想要藉由這篇文章告訴我們什麼道理？
- （ ）(2)賴桑的家人從不支持轉變為支持。(沒有問號)
- （ ）(3)最後的結果呢？(語意不完整)
- （ ）(4)賴桑的親友為什麼要嘲笑他？
- （ ）(5)作者為什麼將標題取名為「森林大軍的守護者」？
