  definition: 形容涼爽、清涼。
- word: 仰望
  definition: 抬頭向上看。
- word: 殆盡
  definition: 幾乎全部消失或用完。
- word: 諮詢
  definition: 詢問、徵求意見。
- word: 精神抖擻
  definition: 非常有精神的樣子。
- word: 震懾
  definition: 受到強烈的驚嚇恐懼。
- word: 畏懼
  definition: 害怕，恐懼。
- word: 與…為伍
  definition: 和…同夥、做伙伴。
- word: 拋家棄子
  definition: 離開家庭，不管孩子。
- word: 籌措
  definition: 想辦法弄到（資金或物資）。
