spotlight_raw_text: "閱讀聚光燈\n自我提問\n    閱讀時，如果你能能夠持續的問自己問題，例如「他為什麼會這樣？」「不可思議，這是真的嗎？」「作者為什麼要寫這篇文章？」，你的閱讀就會變得更主動，你會注意到別人看不到的重點或細節，也會學得更好。這種問自己問題的閱讀策略，叫做「自我提問」。\n    要讀得好，閱讀時經常對自己提出問題，是很有效的方法喔！但不是每一個問題，都有助於文章的理解，所以底下我們要來學習怎麼問出好問題。\n1.自我提問，是有方法的，我們將會學自我提問的兩種類型：\n1-1對自己好奇疑惑的地方提出問題。（本課學習目標）\n1-2對文章的重點提出問題。（下一課學習目標）\n265430120650\n重要\n問問題\n好奇、疑惑\n閱讀時覺得好奇、疑惑的地方。\n文章的重點\n例如故事體：故事情節的發展、人物特質。00\n重要\n問問題\n好奇、疑惑\n閱讀時覺得好奇、疑惑的地方。\n文章的重點\n例如故事體：故事情節的發展、人物特質。2.對自己好奇疑惑的地方提出問題，步驟如下： \n(1)先讀完課文，將自己好奇、疑問的地方用螢光筆畫標記。\n(2)把(1)紀錄的內容轉成問題。\n(3)確認自己提出來的，是不是「完整的問題」。完整的問題可以下面的檢核表幫忙確認。\n「完整的問題」檢核表\n□A.有問號？\n□B.有疑問詞，如：「為什麼、什麼、怎麼樣、如何、為何」。\n□C.問題清楚，語意完整。\n以本課第一段為例：\n(1)將自己好奇、疑問的地方用螢光筆畫標記。\n322580317500他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。\n(2)把(1)紀錄的內容轉成問題：  賴桑為什麼要種樹？ 　\n(3)檢核：\nA.有問號？\nB.有疑問詞，如：「為什麼、什麼、怎麼樣、如何、為何」。\nC.問題楚，語意完整。\n\n 3.給學生的資料庫（疑問詞）\n想得到的答案\n使用的疑問詞\n例如，你可以一邊讀一邊問自己…\n人物\n誰、什麼人\n故事的主角是誰？\n地方\n哪裡、什麼地方\n故事是在哪裡發生的?\n時間\n何時、什麼時候、幾點\n故事是在什麼時候發生?\n事物\n什麼、怎麼樣\n主角遇到什麼問題？\n原因\n為什麼、原因是什麼\n主角為什麼想做這件事？\n做法\n怎麼(做)、如何(做)\n主角如何解決問題？\n結果\n怎麼樣、如何\n最後結果怎麼樣了？\n支持理由、\n例子\n從哪裡(知道)、怎麼(知道)、從哪些線索(知道)\n主角是什麼樣的人?\n你從哪裡知道?\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 自我提問
  instruction: 閱讀時，持續問自己問題，能幫助你更主動地理解文章，並注意到重要細節。
  reasoning: 根據原文「閱讀聚光燈」中「自我提問」策略的說明，將其拆解為策略介紹、提問類型、提問步驟、檢核表應用及疑問詞資料庫等部分。其中，檢核表和疑問詞資料庫的部分，依據其結構轉換為選擇題，以符合前端期待的格式。範例部分也依規則轉換為選擇題。
  steps:
  - prompt: 根據「自我提問」策略的說明，本課主要學習哪一種提問類型？
    type: select
    options:
    - 對自己好奇疑惑的地方提出問題
    - 對文章的重點提出問題
    - 對作者的寫作意圖提出問題
    answer: 0
    reasoning: 原文明確指出「1-1對自己好奇疑惑的地方提出問題」是本課學習目標。
  - prompt: 在進行「自我提問」時，我們可以針對哪些方面提出問題？
    type: select
    options:
    - 閱讀時覺得好奇、疑惑的地方
    - 文章的重點（例如故事情節、人物特質）
    - 以上皆是
    answer: 2
    reasoning: 原文「重要」段落中列出了「好奇、疑惑」和「文章的重點」作為提問的對象。
  - prompt: 根據「對自己好奇疑惑的地方提出問題」的步驟，第一步應該做什麼？
    type: select
    options:
    - 將好奇、疑問的地方轉成問題
    - 確認問題是否完整
    - 先讀完課文並標記好奇、疑問的地方
    answer: 2
    reasoning: 原文步驟(1)明確指出「先讀完課文，將自己好奇、疑問的地方用螢光筆畫標記」是第一步。
  - prompt: 根據「完整的問題」檢核表，一個完整的問題應該具備哪些條件？
    type: select
    options:
    - 必須有問號
    - 必須包含疑問詞
    - 問題語意必須清楚完整
    - 以上皆是
    answer: 3
    reasoning: 檢核表A、B、C三項皆為完整問題的條件，故選「以上皆是」。
  - prompt: 根據範例，將課文內容「他決定開始種樹」轉化為問題後，最符合「完整的問題」檢核表的是哪一個？
    type: select
    options:
    - 賴桑為什麼要種樹？
    - 他為什麼要種樹？
    - 種樹？
    answer: 0
    reasoning: 原文範例中，將標記內容轉成的問題是「賴桑為什麼要種樹？」，且該問題符合檢核表的所有條件。
  - prompt: 如果你想知道故事中的「人物」是誰，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 誰
    - 哪裡
    - 何時
    answer: 0
    reasoning: 根據疑問詞資料庫，想知道「人物」時，應使用「誰」或「什麼人」。
  - prompt: 如果你想知道故事發生的「地方」，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 何時
    - 哪裡
    - 為什麼
    answer: 1
    reasoning: 根據疑問詞資料庫，想知道「地方」時，應使用「哪裡」或「什麼地方」。
  - prompt: 如果你想知道故事發生的「時間」，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 什麼
    - 怎麼(做)
    - 何時
    answer: 2
    reasoning: 根據疑問詞資料庫，想知道「時間」時，應使用「何時」或「什麼時候」。
  - prompt: 如果你想知道故事中發生了什麼「事物」或主角遇到了什麼問題，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 為什麼
    - 什麼
    - 如何
    answer: 1
    reasoning: 根據疑問詞資料庫，想知道「事物」時，應使用「什麼」或「怎麼樣」。
  - prompt: 如果你想知道某件事發生的「原因」，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 為什麼
    - 怎麼樣
    - 從哪裡(知道)
    answer: 0
    reasoning: 根據疑問詞資料庫，想知道「原因」時，應使用「為什麼」或「原因是什麼」。
  - prompt: 如果你想知道主角解決問題的「做法」，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 誰
    - 怎麼(做)
    - 什麼
    answer: 1
    reasoning: 根據疑問詞資料庫，想知道「做法」時，應使用「怎麼(做)」或「如何(做)」。
  - prompt: 如果你想知道事件的「結果」，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 何時
    - 為什麼
    - 怎麼樣
    answer: 2
    reasoning: 根據疑問詞資料庫，想知道「結果」時，應使用「怎麼樣」或「如何」。
  - prompt: 如果你想知道支持某個判斷的「理由或例子」，你會使用哪個疑問詞來提問？
    type: select
    options:
    - 從哪裡(知道)
    - 什麼
    - 誰
    answer: 0
    reasoning: 根據疑問詞資料庫，想知道「支持理由、例子」時，應使用「從哪裡(知道)」或「從哪些線索(知道)」。
