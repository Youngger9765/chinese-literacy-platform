multiple_choice:
- question: 1. 請問哪一個句子使用語詞有誤？
  options:
  - 他們經歷千辛萬苦，終於「籌措」到開設新店所需的資金
  - 眼前如詩如畫的景象，「震懾」了所有在場的人
  - 一把無情大火，把他們辛苦建立的家園燃燒「殆盡」
  - 在山林中呼吸著「沁涼」的空氣，讓人感到十分清爽
  answer: B
- question: 2. 從賴桑做的事，說的話，你覺得賴桑是一個怎麼樣的人？以下何者最不合理？
  options:
  - 熱愛山林與大自然的人──整天與大自然為伍
  - 不放棄的人──為了貢獻自己的力量，保護環境
  - 環保的人──為了實踐自己生命的意義
  - 喜歡出名的人──他吸引記者的注意，連總統都去看他
  answer: D
- question: 3. 賴桑決定不使用化學肥料及除草劑的原因是什麼？
  options:
  - 為了讓草可以覆蓋土地
  - 為了減少對環境的破壞
  - 為了降低種樹成本
  - 為了提升樹的價植
  answer: B
- question: 4. 賴桑妻子對賴桑種樹行為的態度是什麼？
  options:
  - 充分理解並全力支援
  - 不諒解，但後來接納
  - 中立觀望，不干涉對方
  - 起初支援，但後來失去信心
  answer: A
- question: 5. 賴桑種樹，希望能達成許多目標，請問下列選項何者為非？
  options:
  - 在有生之年種植50萬棵樹木
  - 讓更多人參與到種樹行列
  - 吸引總統等名人，創造品牌形象
  - 留下森林造福下一代子孫
  answer: C
