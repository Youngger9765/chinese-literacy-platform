genre: 說明文
title: 臺灣學生的閱讀力：美麗與哀愁
authors: 課文 ：陳淑麗 學習單：陳允捷
story_text: |-
  閱讀是最重要的能力，因為它是所有學校學習的基礎。閱讀能力越強，越有能力處理複雜的資訊，各領域的學習都會如魚得水。但只要不會讀、讀不懂，甚至讀得慢，都會造成學習的全面挫敗。在生活與未來職場上，閱讀也是確保一個人具備終身學習能力的根本，也是適應現在生活及面對未來挑戰的關鍵。 閱讀能力這麼重要，那麼臺灣學生的閱讀力如何呢？臺灣每三年參與一次國際學生能力評量計畫（PISA），這個計畫評估各國15歲學生數學、閱讀、科學三大領域的學習表現。PISA的評量方式，從2015年由紙本改換為數位化評量，以下我們將只聚焦在閱讀，來看看2015、2018和2022年臺灣學生閱讀力的變化。 圖1是臺灣學生歷年的閱讀成績。從圖1可知，臺灣學生的閱讀分數呈現上升的趨勢，參加國（指全部參加的國家）及OECD（單指歐盟國家）的分數則呈現下降的趨勢，2022的分數和2018比較，臺灣進步12分，但參加國卻退步了18分，OECD退步了11分；再看閱讀力的世界排名，從圖2可知，臺灣學生的閱讀力排名從2015年的23名，進步到2018年的17名，2022年更躍升到世界排名第五。亦即，臺灣學生的閱讀力在近10年有明顯的進步，特別是2022年表現最為突出。2022年為何全球閱讀力表現下滑，臺灣卻逆勢推升呢？臺灣PISA國家計畫主持人蔡今中教授認為，2022年是新冠疫情之後實施測驗，相對其他國家，臺灣學校停課時間較短，即使學校停課，臺灣老師反應極快，能有效實施遠距教學，達成「停課不停學」的目標。另外，108課綱重視核心素養及鼓勵自主學習，這都讓學生在疫情期間仍能持續學習。 臺灣學生的閱讀表現雖然相當不錯，但城鄉差距仍然明顯，以2022年的PISA資料為例，偏遠地區的分數落後於都會區43分，PISA評量20分大概就等於一個學年的學習，43分的意思是差距超過兩個年級。有許多研究指出，偏鄉學生不只是「閱讀力」落後，在更基礎的「識字能力」上，也出現遙遙落後的現象。表1呈現了花東地區國中學生識字能力和全國平均值的差異，不論是全體學生或低成就學生，偏鄉程度較高的花東地區，學生的識字能力，是相對落後的。 表1：國中學生全國與花東識字量的平均值與差異分數 透過這些數據，我們知道臺灣國中學生的閱讀能力在全世界七、八十個國家裡名列前茅，在疫情的年代，這可能是臺灣教育界因應疫情的能力優於大多數國家。但資料也顯示臺灣的一個弱項──偏鄉地區學生閱讀力有待加強。 如果你是偏鄉國中的校長，讀了這篇文章之後，你覺得該怎麼做才能提升偏鄉國中生的閱讀力呢？
