multiple_choice:
- question: 1. 根據本文，請問下列關於閱讀的敘述何者正確?
  options:
  - 閱讀是天生的能力，不需學習
  - 閱讀能力越強，人際關係越好
  - 讀得慢，會讓閱讀成效變更好
  - 閱讀可以提升認知與學習能力
  answer: D
- question: 2. 臺灣在2022年PISA閱讀成績不減反增，請問可能的原因何者不正確？
  options:
  - 臺灣學校的停課時間相較他國更短
  - 全國實施遠距教學，讓學習不間斷
  - 臺灣的國家課綱看重學生自主學習
  - 其他國家的學生素質較臺灣低落
  answer: D
- question: 3. 根據本文的PISA資料，以下敘述何者正確？
  options:
  - 圖1資料顯示，臺灣歷年閱讀分數的平均都低於參加國
  - 臺灣城鄉學生的閱讀能力，有明顯的差距
  - 圖1顯示，參加國的閱讀成績越來越高，臺灣卻越來越低
  - 圖2資料顯示，臺灣學生的閱讀分數排名越來越差
  answer: B
- question: 4. 請由下表研判，臺灣學生的表現何者錯誤？
  options:
  - 臺灣學生閱讀能力，和參與國比較，越來越好
  - 閱讀、數學和科學三個領域相較，閱讀的表現最好
  - 臺灣學生的數學能力，和參與國比較，一直都是前五名
  - 臺灣學生的科學能力，和參與國比較，表現起伏不定
  answer: B
