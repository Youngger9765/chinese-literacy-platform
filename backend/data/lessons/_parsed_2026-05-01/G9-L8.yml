strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈
  instruction: 本練習將引導你運用閱讀聚光燈策略，逐步分析圖表資訊。
  reasoning: 此JSON旨在將「閱讀聚光燈」策略的練習內容結構化，以便前端應用程式能逐步引導學生進行圖表閱讀與理解。每個步驟都對應原文中的一個分析環節或問題。
  steps:
  - prompt: 請觀察圖一「臺灣新生兒及全國性別比變化圖」的圖表類型，並填寫答案。
    type: free_text
    reasoning: 練習辨識圖表類型。原文已提供答案「折線圖」。
  - prompt: 請閱讀圖一的標題，並填寫答案。
    type: free_text
    reasoning: 練習辨識圖表標題。原文已提供答案「臺灣新生兒及全國性別比變化圖」。
  - prompt: 請閱讀圖一的橫軸與縱軸名稱，並填寫答案。橫軸為？縱軸為？
    type: free_text
