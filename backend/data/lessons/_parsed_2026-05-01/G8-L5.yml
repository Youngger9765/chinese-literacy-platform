spotlight_raw_text: "閱讀聚光燈\n    你若在新聞裡看到「中學生墜樓輕生」或「國中學長霸凌新生」的標題，你難免就會想進一步了解「為什麼他（她）會做這件事？」也就是說，人們總是還會想進一步了解行為（如墜樓或霸凌）背後的「動機」。而在文章中，人物的動機可能會「明白的寫在文句裡（明示）」，但也可能「隱含在情節中」，要讀者自己推敲出來，例如：\n(1)明示：陳同學基於熱心抱顏同學到地下室上課。\n　　　　→陳同學抱顏同學到地下室的動機是熱心助人。\n(2)隱含：❶每當入秋，媽媽總是會在我出門前給我一件外套。\n　　　　→媽媽的動機：擔心我會冷。\n       ❷他今天帶了一把傘出門。\n　　　　→他的動機：擔心今天會下雨。／想拿傘遮擋陽光。\n2184404381500　　小叮嚀：隱含動機的答案可能不只一個，但要符合邏輯，合理推論，才能令人信服。\n    因此，推測行為背後的動機時，我們需要掌握故事背景、人物間的關係和人物的特質，才能做出合理的推論，這可以讓我們更了解文章內容喔！\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈
  instruction: 本練習將引導你學習如何推測文章中人物行為背後的動機，包含明示與隱含的動機。
  reasoning: 此練習旨在引導學生理解並應用「閱讀聚光燈」策略，辨識人物行為的動機。根據原文，動機分為「明示」與「隱含」兩種。練習題設計涵蓋這兩種情況，並特別針對隱含動機的多元可能性，提供開放式作答機會，以符合原文「小叮嚀」的提示。
  steps:
  - prompt: 根據原文，陳同學抱顏同學到地下室上課的動機是什麼？
    type: select
    options:
    - 熱心助人
    - 想和顏同學聊天
    - 遵守老師的指示
    - 展現自己的力氣
    answer: 0
    reasoning: 原文明確指出「陳同學基於熱心抱顏同學到地下室上課」，因此動機是熱心助人，屬於明示動機。
  - prompt: 每當入秋，媽媽總是會在我出門前給我一件外套。根據此行為，媽媽的動機最可能是什麼？
    type: select
    options:
    - 擔心我會冷
    - 想讓我穿得好看
    - 提醒我季節變化
    - 希望我多帶東西
    answer: 0
    reasoning: 此為隱含動機。根據常理判斷，入秋天氣轉涼，媽媽給外套最合理的動機是擔心孩子受涼。原文也直接給出此答案作為範例。
  - prompt: 他今天帶了一把傘出門。請推測他帶傘的動機，並說明你的理由。請注意，答案可能不只一個，但需符合邏輯。
    type: free_text
    reasoning: 此題旨在訓練學生推測隱含動機的能力。原文特別指出隱含動機的答案可能不只一個，因此設計為開放題，鼓勵學生進行合理推論，例如「擔心今天會下雨」或「想拿傘遮擋陽光」等，並要求學生說明推論依據。
