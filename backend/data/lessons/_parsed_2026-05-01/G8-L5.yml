- question: （ Ｄ ）1. 下列選項中，哪個句子中的詞語使用不正確？
  options:
  - 小明看到同學摔倒，「自告奮勇」的上前幫忙，十分熱心
  - 只要我們努力準備，相信「事在人為」，一定會有好結果的
  - 如果火災發生時，消防隊來不及救援，後果將「不堪設想」
  - 她們倆的交情「情有可原」，兩人從國小時期就是好朋友
  answer: D
- question: 2. 文章提到二審法官判與陳同學也需賠償顏家，何者是法官做出此判決的原因？(第六段，二審法官的理由)
  options:
  - 法官認為陳同學雖是好心，也要考量自身能力
  - 法官認為陳同學已經發揮照顧同學的美德，情有可原
  - 法官認為陳同學沒有提供無障礙設施給顏同學(是學校未提供)
  - 法官認為家屬的延誤就醫是導致顏同學死亡的主因
  answer: A
- question: 4. 第八段第4行，雅柔說：「如果是我，我會先哭死，再氣死。」請問她話中的「我」，指的是誰？(第八段末行)
  options:
  - 陳同學家人 B.顏同學家人 C.陳同學 D.顏同學
  answer: B
- question: 5. 作者透過這篇文章想要達成什麼目的？請選出最可能的答案。
  options:
  - 說明法官不太可能處罰熱心助人的行為
  - 提醒讀者，助人前要考量自己的能力，不要害人害己
  - 用爭議事件引發關注，從不同角度深入思考問題
  - 說明法律可以解決許多糾紛，未來可考慮當法官
  answer: C
