vocabulary:
- word: 自告奮勇
  definition: 自己主動要求接受沒人要的任務。
- word: 好心沒好報
  definition: 形容做好事卻沒有得到應有的回報，甚至受到誤解或損害。
- word: 事在人為
  definition: 表示事情能否成功取決於人的努力。
- word: 不堪設想
  definition: 形容事情發展到很糟糕的地步，令人不敢想像後果。
- word: 悲痛欲絕
  definition: 形容極度悲傷，傷心到無法承受的地步。
- word: 苛責
  definition: 嚴厲的責備或要求。
- word: 提告
  definition: 向警局或法院提出爭議或犯罪的事實，請求司法處理解決。
- word: 情有可原
  definition: 指某人的過錯從情理上來衡量，是可以被理解或原諒的。
- word: 因噎廢食
  definition: 因為怕噎著，而不吃東西。比喻因過去的挫折或失敗而放棄所有有關的事情。
- word: 感同身受
  definition: 心裡的感覺好像親身經歷一般。
