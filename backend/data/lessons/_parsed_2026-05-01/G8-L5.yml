discussion_content:
- 一、人物動機「明示」在課文內文中
- 1.摔倒時，陳同學仍緊抱顏同學，將自己當成肉墊，保護著他。
- →陳同學的動機是想要【 保護顏同學 】。
- 2.顏同學還告訴校護及導師：「不是陳同學的錯，請不要處罰他。」
- →顏同學的動機是 □希望 不希望 陳同學被學校處罰。
- 二、人物動機「隱含」在課文內文中
- 1.顏家對陳同學、學校提起民事訴訟。
- →顏家的動機是希望 有人為這件事情負責 。(課文第五段)
- 2.顏家決定將拿到的賠償金，成立顏旭男基金會。
- →根據你的推測，顏家成立基金會的動機可能是：(多選)
- □希望可以繼續跟社會大眾募款。 希望幫助其他身心障礙者。
- 洗刷社會大眾對顏家要錢的偏見。 □希望為顏同學討回公道。
- （ Ｄ ）1. 下列選項中，哪個句子中的詞語使用不正確？
- A.小明看到同學摔倒，「自告奮勇」的上前幫忙，十分熱心
- B.只要我們努力準備，相信「事在人為」，一定會有好結果的
- C.如果火災發生時，消防隊來不及救援，後果將「不堪設想」
- D.她們倆的交情「情有可原」，兩人從國小時期就是好朋友
- （ A ）2. 文章提到二審法官判與陳同學也需賠償顏家，何者是法官做出此判決的原因？(第六段，二審法官的理由)
- A.法官認為陳同學雖是好心，也要考量自身能力
- B.法官認為陳同學已經發揮照顧同學的美德，情有可原
- C.法官認為陳同學沒有提供無障礙設施給顏同學(是學校未提供)
- D.法官認為家屬的延誤就醫是導致顏同學死亡的主因
- （ Ｂ ）3. 緒恩舉手發問機車騎士扶老爺爺事件時，越說越激動，請你推測一下，讓緒恩情緒激動的背後原因是什麼？
- A.他很生氣機車騎士居然不禮讓老人，害人受傷
- B.他覺得機車騎士好心沒好報，因而忿忿不平
- C.他認為機車騎士假好心，根本不是真心要幫人
- D.緒恩以前也遇過類似的經驗，所以非常生氣(文中未提到)
- （ B ）4. 第八段第4行，雅柔說：「如果是我，我會先哭死，再氣死。」請問她話中的「我」，指的是誰？(第八段末行)
- A.陳同學家人 B.顏同學家人 C.陳同學 D.顏同學
- （ C ）5. 作者透過這篇文章想要達成什麼目的？請選出最可能的答案。
- A.說明法官不太可能處罰熱心助人的行為
- B.提醒讀者，助人前要考量自己的能力，不要害人害己
