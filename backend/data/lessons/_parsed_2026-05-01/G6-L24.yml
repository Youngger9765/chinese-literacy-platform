vocabulary:
- word: 束手無策
  definition: 束手是「手被綁起來」，無策是「沒有辦法」。束手無策是形容完全沒有辦法解決問題。
- word: 凜冽
  definition: 形容天氣非常寒冷。
- word: 屏氣凝神
  definition: 摒住呼吸，專注精神，形容高度集中注意力的樣子。
- word: 僧多粥少
  definition: 比喻資源有限，需求的人太多，無法滿足每個人。
- word: 筋疲力竭
  definition: 形容非常疲累，一點力氣也沒有了。
- word: 翻騰
  definition: 液體或情緒激烈翻動，本課用來形容海水上下滾動，也可用來形容不平靜的情緒。
- word: 窒息
  definition: 無法呼吸，常用來比喻壓力很大。
- word: 緩不濟急
  definition: 行動太慢，無法應付迫切的需要。
- word: 徒勞無功
  definition: 努力想做某件事，卻沒達成目標，白費力氣。
