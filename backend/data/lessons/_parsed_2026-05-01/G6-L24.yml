multiple_choice:
- question: 1. 文中第三段提到「資源僧多粥少」，根據上下文，「僧多粥少」最可能的意思是：
  options:
  - 投入救援的資源遠不及白鯨龐大的需求，顯得非常不足
  - 救援人員人數眾多，救援的物資不夠村民和船員使用
  - 救援人員人數眾多，但實際受困的白鯨數量卻很少
  - 雖投入不少資源，但救援工作幾乎沒有成果，徒勞無功
  answer: A
- question: '2. 文章描述白鯨初見破冰船「又驚又怕，根本不敢靠近」。造成牠們恐懼的原因可能是:'
  options:
  - 破冰船攜帶的燈光 B.船體顏色過於鮮豔
  - 巨大體積與噪音 D.船員朝海面投擲魚餌
  answer: C
- question: '3. 援人員發現白鯨對古典音樂反應最為明顯。根據本文，古典音樂之所以能成功引導白鯨，可能是因為:'
  options:
  - 柔和的古典音樂不像軍樂和流行音樂那麼吵雜，特別適合寒風凜冽的氣候
  - 這些白鯨曾經受過訓練，習慣聽從古典音樂的指揮來行動
  - 古典樂舒緩柔美，蓋過了破冰船的噪音，也對白鯨產生安撫和引導的作用
  - 古典樂的聲波頻率恰好接近白鯨的叫聲，使牠們誤以為是同伴在前方引導
  answer: C
- question: 4. 作者以「協奏曲」作為本文副標題，比喻這場救援行動，有何用意？
  options:
  - 增加文章的文藝色彩，以優美的音樂意象結合救援故事，提升故事的趣味性
  - 暗示參與救援的人數眾多、分工細密，如同一場盛大的音樂會需要各方協調配合
  - 顯現出作者對音樂的素養與對俄羅斯作曲家柴可夫斯基的景仰
  - 強調人類與野生動物共同譜出和諧樂章，也點出音樂在救援中的角色
  answer: D
- question: 5. 本文的主旨是什麼？
  options:
  - 描述一群人以人力、機械及音樂救援野生動物，展現人與自然和諧共存的希望
  - 強調北極嚴寒氣候讓白鯨陷入生存危機，凸顯惡劣環境對野生動物的威脅
  - 介紹破冰船的構造與功能，以及其在極地環境中執行救援任務的重要性
  - 描述白鯨對古典音樂產生特殊反應的奇聞，說明音樂可以用來影響動物的行為
  answer: A
