title: 動物談情說愛的方式
authors: 課文 ：葉馨蓮 學習單：唐儀庭
story_text: |-
  每一種動物，都需要繁衍後代。但是在大自然遼闊的空間裡，動物有哪些方式可以傳遞出「我在這裡！」「我準備好了！」的訊息，讓愛的伴侶可以「月上柳梢頭，人約黃昏後」呢？ 用歌聲求偶 潮濕溫暖的夏夜，嘓嘓嘓、嘓嘓嘓，雄蛙奮力的在池塘裡展現歌喉，只為求得雌蛙的青睞，以完成繁衍的天職。雄蛙求偶的鳴叫聲響遍池畔，也引來競爭對手的爭強鬥勝。是否能順利成為心儀對象的「青蛙王子」？雄蛙們可要各憑本事才行。 春天來臨，住在枯木洞裡的五色鳥，開始粉墨登場，準備在演唱會一展歌喉。牠身穿綠衣裳，頭戴彩色帽，站在茂密枝葉搭起的舞台上，揭開演唱會的序幕。五色鳥發出喀、喀、喀喀喀喀……的求偶叫聲，盡情的歌唱。牠獨特的聲音，吸引愛慕者，為延續下一代而準備。 用舞姿吸引仰慕者 頭形像馬，長相特殊的海馬是海底世界的嬌客，到了繁殖期，雄海馬以忽明忽暗的體色和已經轉淡的孵卵囊，舞出曼妙的姿勢吸引仰慕者；等到互許終身時，雙雙以腹部相對，上下漂浮、嬉戲於水中；翻滾的海水是結婚進行曲，一對佳偶在浪漫的旋律下，跳著雙人舞進入洞房。 每年的三至九月，鴕鳥有熱鬧非凡、令人耳目一新的招親活動。平常沉默的雄鳥，卻在活動期間大展身手，一方面發出低沉的叫聲，呼喚著雌鳥；一方面將翅膀尖端的白色羽毛，有節奏的開展和收合，圍繞在雌鳥身旁，瘋狂跳起獨特的求偶舞。 以氣味傳達真情意 花園裡，田野間，同樣的翩翩飛舞，飛蛾卻沒有蝴蝶那樣的漂亮迷人；牠們生命雖然短暫，總能圓滿完成繁殖後代的重責大任。雌蛾能分泌一種特別的氣味，利用空氣擴散傳布，讓在遠方的雄蛾，感受到她真摯的情意，願意千里迢迢的飛奔前來相會，完成終身大事。 以武力展示的方式求偶 為了避免敵人的攻擊，也為了防止陽光的烤曬，招潮蟹選擇在地洞裡設置結婚新房。在求偶季節，雄蟹頂著兩根像火柴頭的眼睛，四處尋找母蟹的芳蹤。當你看見牠快速的揮動大螯，雄赳赳，氣昂昂的橫著走路，表示已經覓得如意佳人，正發出求婚訊息，似乎也向心上人宣示：我的螯是保衛家園的最佳利器，我有能力保護妳及我們的下一代，請妳放心的嫁給我吧！ 春暖花開的季節，大部分的蛇結束冬眠，出洞尋覓佳人。母蛇釋放出特殊的氣味，代表牠已成熟，能生兒育女了；眾多公蛇沿著氣味尾隨而至展開追求。母蛇身負香火的傳承，公蛇們得經歷多次的搏鬥，才能脫穎而出，成為幸運的新郎。公蛇的競爭，熱鬧了山林野地；母蛇的香火，則豐富了生命傳承。 動物透過多采多姿的求偶方式，延續物種，達成傳宗接代的目的。除了傳承生命，牠們的求偶方式帶來了美妙的音樂、舞蹈，也豐富了大自然的萬千丰采。
