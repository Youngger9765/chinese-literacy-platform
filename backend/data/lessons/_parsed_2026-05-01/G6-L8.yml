multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確?
  options:
  - 小狗一直追著自己的尾巴跑，「尾隨而至」的模樣，真是可愛極了
  - 家裡換了新的窗簾和新的沙發後，整個環境令全家人「耳目一新」
  - 王阿姨的兒子小時候不小心走失了，於是她上網「招親」找兒子
  - 姊姊參加繪畫比賽，帶著常用畫具和粉彩筆，準備「粉墨登場」
  answer: B
- question: 2. 根據本文，下列關於動物求偶的敘述，何者不恰當?
  options:
  - 求偶的方式十分多元
  - 求偶的時間各不相同
  - 求偶目的為繁衍後代
  - 不同動物求偶地點皆相同
  answer: D
- question: 3. 請問本文主旨為何？
  options:
  - 作者對大自然被破壞感到憂心，希望大家能盡可能地愛護動物
  - 作者非常喜愛動物，希望動物能多多繁衍，豐富大自然的風采
  - 動物求偶的方式不一，目的都在繁衍後代，同時也讓自然更豐富
  - 動物要足夠強大，才能在險惡的自然環境中繁衍後代，不被淘汰
  answer: C
- question: 4. 小華閱讀了<口腔保健>一文，文章內有多個小標題，請問下列何者較不可能是它的小標題？
  options:
  - 裝飾牙齒的方法
  - 牙齒疾病形成原因
  - 潔牙方式與步驟
  - 牙齒的功能與分類
  answer: A
- question: 5. 大雄這週作文題目是<動物界的奶爸>，其中一個小主題想要寫「海馬」，於是上網查了資料，下面哪段文字最適合放進小主題裡呢？
  options:
  - 雄海馬提供脂肪及鈣質，幫小海馬長出骨骼
  - 生下小海馬之前，雄海馬有複雜的求偶儀式
  - 海馬喜歡生活在有珊瑚、海草的海洋環境中
  - 研究發現母海馬會提供充分的營養給小海馬
  answer: A
