vocabulary:
- word: 飆漲
  definition: 快速且大幅度的上漲。
- word: 人滿為患
  definition: 形容人多到造成困擾或不便。
- word: 崩跌
  definition: 價格、數值等迅速大幅下降。
- word: 稀奇
  definition: 少見或不尋常的事物。
- word: 波動
  definition: 上下起伏的變化，通常指物價不穩定，有漲有跌。
- word: 遭殃
  definition: 遇到災禍或麻煩。
- word: 物以稀為貴
  definition: 因為稀少，所以物品的價值會提高。
- word: 奇貨可居
  definition: 把市場上稀有的貨品收藏聚集起來，等待時機高價售出。
- word: 高朋滿座
  definition: 形容賓客很多。
- word: 供給
  definition: 市場上提供的商品或服務。
- word: 來襲
  definition: 指災害、敵人等突然侵襲或來到。
- word: 義憤填膺
  definition: 對不公正、不道德的事情，感到強烈的憤怒。
- word: 賑災
  definition: 指政府或社會團體對災區提供救援和物資援助。
- word: 料事如神
  definition: 形容預測事情的發展像神一樣非常準確。
- word: 應接不暇
  definition: 形容來的人或事情太多，忙不過來。
- word: 離鄉背井
  definition: 指離開家鄉，在外地生活或工作。
- word: 誘因
  definition: 能吸引人做某事的原因或條件，例如洗完碗就能打電動，打電動就是誘因。
- word: 趁火打劫
  definition: 比喻趁著別人有危難時，從中獲取利益或損害他人。
- word: 頒布
  definition: 正式公布法令、規章等。
- word: 望穿秋水
  definition: 形容盼望的心情非常迫切。
- word: 干預
  definition: 干涉、過問，此指政府插手管民間的物價。
- word: 比比皆是
  definition: 到處都是，隨處可見。
- word: 多年媳婦熬成婆
  definition: 原指媳婦地位低下，經多年等待或磨練後，變成可以主導事務的婆婆。現在多用於工作，經過一段時間後，終於取得某種資格或地位，成為重要的領導者。
- word: 精益求精
  definition: 好還要再更好。
- word: 兢兢業業
  definition: 小心謹慎的樣子。
- word: 指引
  definition: 指示、引導。
- word: 水漲船高
  definition: 比喻人或事物隨著外在事物增長而提升價值。例如：他因為這部偶像劇爆紅，人氣水漲船高。
- word: 龐然大物
  definition: 形容體積大而笨重的物品。龐然：巨大的樣子。
- word: 接駁
  definition: 用交通工具把人或物品從一個地方運送到另一個地方。
- word: 無人能及
  definition: 指沒有人能比得上，形容在某方面特別優秀、出眾。
