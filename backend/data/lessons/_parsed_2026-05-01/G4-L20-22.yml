spotlight_raw_text: "閱讀聚光燈\n以不同角度的例子說明概念\n\n　　你發現了嗎？這三篇都是說明文，說明文是以「說明、解釋」為主的文章，例如說明主題或事物的特徵、性質或原理原則……等，好讓讀者對這些主題或事物有清楚的認識。\n　　問題來了，「物以稀為貴」是一個抽象的概念，並不容易解釋清楚。作者很聰明，這三篇文章都用了相同的寫作方式來幫助讀者理解主題：\n提出待說明的概念 \n                         ⇧           ⇨  下結論\n 舉例：提出不同角度的例子解釋說明  \n　\n    我們用第一、三篇課文來看看作者的寫作方式：\n\n提出待說明的概念\n提出不同角度的例子\n說明主題概念\n下結論(最末段)\n\n判斷以下舉例的角度（單選）\n\n第一篇\n物以稀為貴\n\n什麼因素決定了商品的價格？\n需求＞供給\n⃞需求＜供給\n颱風來，大量青菜被風雨打壞了，青菜價格變貴。\n⃞需求＞供給\n需求＜供給\n農民搶種高麗菜，市場湧入大量高麗菜，高麗菜價格變便宜。\n價格是由市場的供給和需求決定的。\n第三篇\n\n如何在職場拿高薪？\n需求＞供給\n⃞需求＜供給\n工作技術門檻高：引水人，市場稀缺性高，薪水高。\n⃞需求＞供給\n需求＜供給\n工作技術門檻低：一般工作。市場稀缺性低，薪水低。\n下定決心終身學習，做一個人力市場上的稀缺人材。\n　　\n　　這樣的寫作方式，幫助讀者更容易理解「物以稀為貴」這個抽象的道理。現在我們就來練習看看吧！\n\n533402971800◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 以不同角度的例子說明概念
  instruction: 請判斷以下各情境所舉例的角度。
  reasoning: 原文說明了「閱讀聚光燈」策略中「以不同角度的例子說明概念」的寫作方式，並提供了兩篇課文（第一篇和第三篇）作為範例。每篇課文都包含兩個具體的例子，每個例子都需判斷其所屬的供需角度。因此，將每個具體例子轉換為一個單選題，讓學生練習判斷。
  steps:
  - prompt: 第一篇：颱風來，大量青菜被風雨打壞了，青菜價格變貴。判斷此舉例的角度：
    type: select
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 1
    reasoning: 原文中「⃞需求＜供給」被標示，表示此情境下供給減少，導致需求大於供給，價格上漲。
  - prompt: 第一篇：農民搶種高麗菜，市場湧入大量高麗菜，高麗菜價格變便宜。判斷此舉例的角度：
    type: select
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 0
    reasoning: 原文中「⃞需求＞供給」被標示，表示此情境下供給增加，導致供給大於需求，價格下跌。
  - prompt: 第三篇：工作技術門檻高：引水人，市場稀缺性高，薪水高。判斷此舉例的角度：
    type: select
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 1
    reasoning: 原文中「⃞需求＜供給」被標示，表示此情境下技術門檻高導致供給稀缺，需求大於供給，薪水高。
  - prompt: 第三篇：工作技術門檻低：一般工作。市場稀缺性低，薪水低。判斷此舉例的角度：
    type: select
    options:
    - 需求＞供給
    - 需求＜供給
    answer: 0
    reasoning: 原文中「⃞需求＞供給」被標示，表示此情境下技術門檻低導致供給充足，供給大於需求，薪水低。
