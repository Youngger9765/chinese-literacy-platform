discussion_content:
- 「天才」是練出來的！
- 很多人認為這世界是有天才的，像是圍棋天才、小提琴天才或羽球天才，他們的厲害，是天生的。但，艾瑞克森（A. Ericsson）的研究指出，❶其實這些厲害的技能並不是天生的，而是經過長時間的練習和專業的指導，慢慢學會的。
- 比如，❷全世界最厲害的網球選手費德勒和小提琴家海菲茲，都曾說過自己並不是天才，而是在教練的指導下，日以繼夜、一步一步的苦練才變得那麼厲害。他們的成功並非偶然，是淚水與汗水換來的。
- 莫札特7歲的時候，聽到各種樂器的聲音，能馬上在鋼琴上找到正確的音符。這種絶對音感，一萬個人才有一個，他這麼小就能辦到，所以大家認為這種才能一定是天生的。❸但，日本曾經做過一個實驗，給21位小孩一段時間的訓練，結果每一個孩子都能像莫札特一樣，具有絶對音感。這個實驗指出，經過適當的教導和練習，每個人都能學會很特別的技能。
- 總之，厲害的技能並不是天生的，而是在指導下，長期苦練後學來的。不管是運動、音樂，還是其他技能，❹只要我們願意努力，認真練習，就能成為很厲害的人。天才其實是練出來的！
