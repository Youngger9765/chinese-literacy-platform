- C.隨著公司的營收提升，員工薪資也跟著「水漲船高」
- D.坐在火車上觀光，沿途美景令人「望穿秋水」
- （ A ）2. 三篇文章都提到了一個經濟學的核心原則，這個原則是什麼？
- A.供給需求法則 B.比較利益法則
- C.分散風險原則 D.機會成本原則
- （ B ）3. 依據圖片，請問該項商品最後在市場上出現了什麼狀況？
- A.供需均衡 B.供過於求 C.供不應求 D.飢餓行銷
- （ D ）4. 以下哪一種情境最符合「物以稀為貴」的道理？
- A.超商推出夜間打折活動，珍愛剩食
- B.風調雨順大豐收，蔬菜水果供應量充足
- C.大街上一人一手機，手機的需求穩定
- D.工廠高薪聘請AI技術進階研發人員
- （ B ）5. 基於三篇文章內容，作者最可能支持以下哪一種觀點？
- A.政府應全面主導市場價格，以防商品價格波動對人民生活產生影響
- B.商品價格應由市場供需關係決定，人為過度干預可能導致資源配置失衡
- C.政府應通過法令創造更多高薪職業，解決收入不平等的問題
- D.市場通常能依靠供需調節價格，但在特殊情況下可能需要適度的政府干預
