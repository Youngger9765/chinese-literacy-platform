genre: 說明文
title: 物以稀為貴： 從「供給」和「需求」談物價波動
authors: 課文 ：曾世杰 學習單：張明珠
story_text: 市場上，不同的商品都有不同的價格。奇異果貴，柳丁便宜；包子貴，饅頭便宜；黃金貴，石頭便宜。你也許會說，這有什麼稀奇？不同的東西，本來就會有不同的價格啊。但，即使是相同的商品，在不同時間也會有不同的價格。例如高麗菜，便宜的時候一顆10元，貴的時候一顆200元。你會好奇是什麼因素決定了各種商品的價格嗎？ 決定商品價格的經濟學的原理叫做「物以稀為貴」，意思是消費者有「需求」，但市場上「供給󠇡」卻很少時，商品的價格就變貴了。 舉個例子，颱風來襲，電視一定會有「菜價飆漲！」的新聞。強風豪雨會把農田裡許多蔬菜吹倒或泡爛了，農民能夠送到市場的蔬菜大量變少，也就是「供給」減少，但是，每個家庭對蔬菜的「需求」卻沒有改變，大家買不到蔬菜，這時，菜價就會飆漲。 「等一下！颱風前兩天，農民的供給都還沒有改變，菜價就變貴了，這又怎麼解釋？」也許會有人問。 是這樣的，颱風前，新聞一直預報會有強風豪雨，消費者預期颱風後菜價會漲，大家都想：「先下手為強，後下手遭殃，趁現在還買得到青菜……」，於是颱風來襲前兩天，菜市場人滿為患，大家搶買青菜。這時，「供給」雖然沒有改變，但市場「需求」大幅增高，市場裡青菜奇貨可居，根本不夠賣，價格就開始漲了，一把小白菜賣到80塊都不稀奇。 同樣的供需因素，也可以解釋商品價格為什麼下滑。2016年11月，秋風吹起，天氣轉涼，薑母鴨、火鍋店高朋滿座，高麗菜的需求大增，批發價漲到每公斤45元。一公頃的高麗菜就可以讓農民賺270萬元。其他的農民眼紅了：「我也要種高麗菜！」大批的農民於是放棄了自己的農作物，搶種高麗菜。80天後，搶種的高麗菜收成了，市場上湧進大量的高麗菜，價格開始崩跌，到後來每公斤5元都賣不出去，一車一車被倒在野地。 總之，商品價格的波動是「供給」和「需求」決定的。大家都想要的東西，價格就上揚；供給超過需求，價格就下滑。這就是「物以稀為貴」的道理。
