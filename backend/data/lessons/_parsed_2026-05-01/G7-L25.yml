genre: 說明文
title: 當全世界都在笑你，你可以怎麼做？
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  想像一下：你只是照自己的步調做事，卻在群組裡被起綽號、被截圖轉傳；有人故意已讀不回，有人在背後冷嘲熱諷，說「大家都說你是討厭鬼」。網路霸凌最傷人的，往往不是一句話，而是那句話被一傳十、十傳百，再被添油加醋，弄到你開始自我懷疑：是不是我真的哪裡不對？ 美國演員安海瑟薇（Anne Hathaway）就曾在這樣的漩渦裡，成了眾矢之的。2013年她以《悲慘世界》拿下奧斯卡後，網路上卻冒出「討厭安海瑟薇」的風潮，成千上萬的酸民跟風起鬨，用各種標籤嘲弄她。很多攻擊並不是就事論事，她認真的態度被罵「做作」，太客氣被罵「假掰」，連受訪時笑一下、停頓一下，都可能被剪成短片嘲笑。她後來形容，那些惡意像把她心裡最脆弱的地方放大播放，彷彿全世界都在指指點點。 雪上加霜的是，有些負面聲量你根本躲不掉。她曾提到，自己只是上網搜尋資料，卻突然看到「為什麼全世界都討厭安海瑟薇」的標題，心裡一沉，像被當眾羞辱一樣難堪。那段時間她為角色減重、剪髮，本就身心俱疲；偏偏嘲笑又連續發酵，讓人不堪其擾。你可以想像那種狀態：每天醒來都怕手機一亮又有新嘲諷，整個人如坐針氈，連呼吸都不自在。 她後來坦白，那些年她有幾次得獎，但她總猶豫著要不要站上舞台領獎。在那種場合，她必須強顏歡笑，卻又擔心被說成「又在裝了」。於是她進退維谷：笑，被說假掰；不笑，被說冷漠。怎麼做都錯，這讓她心灰意冷，想把自己躲起來。 網路上的風向，還帶來真實的後果。她說，曾有一陣子影視公司擔心她的「有毒的」形象，因此不敢找她合作——這真是無妄之災。還好，有位導演在她低潮時雪中送炭，請她演出《星際效應》，她才能慢慢重整旗鼓。她告訴自己：羞辱很可怕，但我決定不讓它困住，我要把自我價值從留言區找回來，因此開始受訪談論自己被霸凌的經驗。她特別同理有相似經驗的青少年：「這不是無病呻吟，你的痛感是真實的。」 根據她的經驗，如果你正在經歷網路或關係霸凌，第一步是「不要一個人扛」，求助不是示弱，逞強硬撐只會使自己孤立無援。這不是玻璃心，是你在被傷害。把你的委屈說給信任的大人聽——導師、家長、輔導老師都可以。你願意開口，就是在黑暗裡點一盞燈，有人能陪你一起解決問題，終有撥雲見日的一天。 第二是「冷處理，不要急著以牙還牙」。瘋狗在咆哮撕咬時，你愈用棒子打，牠咬得愈凶。你在網路上的反擊往往得不償失，還可能被對方抓到把柄再反咬一口。你可以簡短表明立場後離開霸凌現場，也可以藉著調整隱私、封鎖、檢舉，讓對方看不到你。先停損，才不必讓自己陷入無休止的口水戰；記得把留言、私訊、群組對話截圖，記下時間與帳號，後續處理時才能有憑有據。 最後，請把照顧自己的情緒當成大事。霸凌的語言雖然可能很刺耳，但那不能定義你是誰；真正該被停止的是傷害，而不是你的存在。你可以用運動、寫日記、和支持你的朋友聊天等方式來紓壓，暫時遠離讓你焦慮的念頭；如果你開始失眠、害怕上學、一直想哭或情緒崩潰，就更要尋求協助，讓專業的人陪你走一段。 連好萊塢的大明星都會遭到網路霸凌，可見這問題無所不在。如果你正在被霸凌，安海瑟薇的故事要告訴你，我們不必為迎合網路的意見而活著，只要你自己願意好好活著、慢慢走下去，這段可怕的記憶終會變小、消失，你終有撥雲見日的一天。
