multiple_choice:
- question: 1. 第四段提及，安海瑟薇「猶豫要不要上台領獎」最可能的原因是？
  options:
  - 她怕任何表情都被拿來嘲笑
  - 她覺得獎項不重要，想低調生活
  - 她天生很害羞，不喜歡公開場合
  - 她認為自己不配得獎，想先反省
  answer: A
- question: 2. 作者用安海瑟薇的故事作為例證，最主要的用意是？
  options:
  - 說明演藝圈比校園更黑暗，別想當明星
  - 說明連知名人物也會被霸凌，問題很普遍
  - 強調得獎是引發霸凌的原因，應避免出風頭
  - 提醒大家不要評論名人，否則會被提告賠錢
  answer: B
- question: 3. 第七段提及「你愈用棒子打，牠咬得愈凶」最想提醒讀者什麼？
  options:
  - 遇到霸凌要更強硬回擊，才不會被看扁
  - 反擊可能升高衝突、被抓把柄，應先冷處理並保護自己
  - 只要沉默到底，就能證明自己問心無愧、問題會消失
  - 霸凌者不可理喻，因此最好的做法是完全切斷所有關係
  answer: B
- question: 4. 下列何者最符合本文主旨？
  options:
  - 成名後難免被討厭，最好的方法就是習慣網路酸言
  - 被霸凌多半是誤會，只要解釋清楚就能讓大家改觀
  - 演員形象影響工作，因此不該在網路上表達任何情緒
  - 網路霸凌會擴散並造成傷害，面對時要自保並找回價值
  answer: D
- question: 5. 同學在班群被取笑後想立刻回嗆，最符合本文建議的做法是？
  options:
  - 立刻回嗆到底，才不會被看扁
  - 發限動公審對方，讓他也難堪
  - 退出群組就好，不需要留下任何紀錄
  - 先停損離開現場，截圖蒐證再求助
  answer: D
