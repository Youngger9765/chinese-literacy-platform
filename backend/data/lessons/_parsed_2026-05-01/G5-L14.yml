spotlight_raw_text: "閱讀聚光燈\n摘要策略—刪除法找重點\n本課是一個說明文，為了讓讀者更容易理解文章，說明文的作者常會加入許多細節作為補充說明。然而，這可能使重點變得不明顯。因此，我們可以運用刪除法把不重要的訊息刪除，留下文章段落的重點。\n哪些細節可以刪除呢？首先可以刪的，就是「舉例」的文字。\n作者舉例時，經常會用「舉例」、「例如」、「如」、「像」這樣的關鍵詞。\n來看看下面這段文字，我們可以用❶❷❸的步驟，刪除舉例的文字：\n1843764236500臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。\n❶我們可以刪除「如」後面的文字，因為鹿野高台、池上伯朗大道都是「舉例」說明臺東有哪些風景區。注意，這些補充說明的文字，刪除後，也必須保留原文的意思，不能改變。\n1843773914300臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。\n❷留下段落重點臺東有名的風景區都是遊客們流連忘返的地方。     \n❸判斷❷留下的重點，它主要的意思是否和原文相同？（打勾）\n是，留下的重點，主要的意思和原文相同。\n□否，留下的重點，主要的意思和原文不同。\n　　你發現了嗎，文章段落經過刪除法後，就可以更快找到重點，接下來就讓我們來練習看看吧！\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 摘要策略—刪除法找重點
  instruction: 運用刪除法，將說明文中不重要的訊息（特別是舉例的文字）刪除，留下文章段落的重點。
  reasoning: 此練習旨在引導學生學習說明文中的刪除法，特別是針對舉例內容的刪除，以找出文章重點。透過具體範例，讓學生辨識可刪除的細節，並判斷刪除後是否保留原文主要意思。
  steps:
  - prompt: '請根據刪除法，從下列選項中選出將「舉例」文字刪除後，最能保留原文主要意思的段落重點。


      原文：臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。'
    type: select
    options:
    - 臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。
    - 臺東有名的風景區都是遊客們流連忘返的地方。
    - 鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方。
    answer: 1
    reasoning: 原文說明刪除法應刪除「如」後面的舉例文字。選項2「臺東有名的風景區都是遊客們流連忘返的地方」正確刪除了「如鹿野高台、池上伯朗大道等」這些舉例內容，且保留了原文的核心意思。選項1是原文，選項3刪除了過多的資訊，改變了原文主旨。
  - prompt: 判斷上一步驟留下的重點「臺東有名的風景區都是遊客們流連忘返的地方」，它主要的意思是否和原文「臺東有名的風景區，如鹿野高台、池上伯朗大道等，都是遊客們流連忘返的地方」相同？
    type: select
    options:
    - 是
    - 否
    answer: 0
    reasoning: 刪除舉例文字的目的是為了找出重點，同時不能改變原文的主要意思。此處刪除的內容僅為補充說明，不影響原文「臺東有名的風景區都是遊客們流連忘返的地方」這個核心概念，故主要意思相同。原文中「是，留下的重點，主要的意思和原文相同。」沒有方框，表示為正確答案。
