discussion_content:
- （一）請判斷下列情況是否為性騷擾，是性騷擾的打，不是性騷擾的打。
- （ ）1.游泳時，教練要求學生穿著緊身泳衣，減少游泳的阻力。
- （ ）2.看診時，醫生要求病人脫衣服檢查。
- （ ）3.瑪麗穿了新衣，旁人出口頭評論她的「身材」。
- （ ）4.安妮的皮膚太細嫩漂亮了，約翰忍不住觸摸了她的後脖子。
- （ ）5.有人溺水，救生員救援時碰到對方的身體。
- （二）下列哪些方法可以保護自己遠離性騷擾？可以的打Ｖ。
- （ Ｖ ）1.避免單獨與異性在密閉空間相處。
- （ Ｖ ）2.進入隱密空間時，盡量打開門窗，讓別人可以看到裡面。
- （ ）3.在社群網站上用性感的貼圖留言。
- （ Ｖ ）4.有人講黃色笑話讓你不舒服，說：「我不喜歡。可以停止了嗎？」
- （ Ｖ ）5.如果對方用權力或利益威脅你時，請勇敢說「不」，並向外求援。
- 小叮嚀：只要覺得有不舒服，心中有懷疑，就要明確的提出來，要求對方立刻停止他不當的行為。
- （三）性騷擾加害者，在當事人表明不舒服後，常常會用一些似是而非的話語為自己脫罪。請判斷下列句子哪些可能是脫罪之詞，是的請打Ｖ。
- （ Ｖ ）1.我只是在開玩笑~你幹嘛這麼認真。
- （ Ｖ ）2.唉唷，摸一下又不會少塊肉~
- （ Ｖ ）3.放輕鬆點，不小心看到的，我覺得你想太多了。
- （ ）4.對不起，我不是故意的！
- （ Ｖ ）5.這哪是性騷擾，我沒惡意啦，你太嚴肅了。
- 小叮嚀：加害人常常用避重就輕、模糊焦點的話，來誤導被害人，想要大事化小，避免罪責，千萬不要被這些話影響了。
