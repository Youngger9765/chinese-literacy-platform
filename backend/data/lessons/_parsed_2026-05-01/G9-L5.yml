  - 說話的人地位較高，聽話的人地位較低
  - 被害人不敢講，但說話的人鼓勵被害人面對問題，追究到底
  - 說話的人在告訴加害者，這樣下去可不行
  answer: C
- question: 5. 下列何者為本文作者的寫作意圖？
