spotlight_raw_text: "閱讀聚光燈\n推論策略—整理重點、推論作者觀點\n這是一篇說明文，說明文作者通常會在第一段和最後一段，把文章重點講出來，如本文第一段強調的祝福和連結。但如果作者一開始沒有說出重點，或重點不夠完整，閱讀時，讀者就可以先找出各段重點，再把重點整理起來，最後推論作者想表達的觀點。本課第一段，並沒有把重點說完整，所以，這個聚光燈，我們要來學習整理各段的重點，再推論作者想強調的重點哦。\n\n一、找段落重點\n請先判斷這段主要在說什麼，再找出文中支持這個重點的內容。\n段/焦點\n這段重點（單選）\n支持這個重點的線索（複選）\n段1/\n小米酒的文化意義\n①小米酒在原住民族文化中象徵祝福與連結 　\n□②小米酒主要只是部落用來招待客人的飲品\n①小米酒出現在播種、收穫、婚禮與祭典等重要場合 　\n②對族人而言，小米酒是連結祖靈、土地與族人的重要媒介\n□③小米酒只在祭典或婚禮等隆重場合才會出現\n段2/\n小米酒的\n釀造方式\n□①釀造小米酒的步驟十分繁複，因此更能看出部落女性的技術　\n②釀造小米酒的過程十分講究，表現出對祖靈與族人的禮敬\n□①許多部落由女性負責釀酒\n②釀酒時手要乾淨、心要平靜，不能罵人或帶怒氣 　\n③挑最好的小米，蒸熟後慢慢放涼，與酒麴混合後放進陶甕發酵 \n段4/\n小米酒在儀式中的意義\n□①不同族群雖然都使用小米酒，但彼此的意義並不相同　\n②不同族群在不同儀式使用小米酒，意義都是祝福與連結\n①排灣、阿美、魯凱、卑南、鄒族都在儀式中使用小米酒　\n②這些儀式都指向同一件事：小米酒是一種連結\n□③不同族群儀式的動作與細節彼此完全相同\n段5/\n小米酒在生活中的意義\n□①部落日常生活裡，小米酒只是招待客人的一般飲料\n②部落日常生活裡，以小米酒招待客人象徵分享珍貴之物與接納對方\n\n二、統整文化意義\n   把前面找到的段落重點放在一起想一想：每一段主要表現出小米酒的哪些文化意義？再看看整篇文章合起來，小米酒有哪些文化意義。\n段落\n文化意義（可複選）\n段1: \n 小米酒的象徵意義\n①祝福 □②敬意 ③連結 □④分享與接納\n段2:\n 釀造時的講究與禁忌\n□①祝福 ②敬意 □③連結 □④分享與接納\n段4:\n 小米酒在儀式中的使用\n①祝福 □②敬意 ③連結 □④分享與接納\n段5:\n 在日常生活中的意義\n□①祝福 □②敬意 □③連結 ④分享與接納\n段1～5合在一起\n①祝福 ②敬意 ③連結 ④分享與接納\n\n三、推論作者觀點（單選）\n前面我們已經找出各段的重點和文化意義，現在把它們合起來想一想：作者真正想表達的是什麼？\n1.根據前面整理出的段落重點和文化意義，最符合作者觀點的是哪一項\n①小米酒在原住民族文化中，不只是酒，更承載著祝福、敬意、連結，以及分享與接納的意義。\n□②小米酒因為常出現在重要場合，所以是原住民族生活中受重視的傳統飲品。\n\n◎"
