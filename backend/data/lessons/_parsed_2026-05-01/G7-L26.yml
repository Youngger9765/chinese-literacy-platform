title: 小米酒的祝福
authors: ''
story_text: 許多原住民族的文化裡，小米酒是一種祝福的象徵。它可能出現在播種之前、在收穫之後、在婚禮現場或祭典的中央，也可能在迎接外地朋友時，成為主人最珍重的招待。對族人而言，小米酒是連結祖靈、土地與族人的重要媒介。 釀小米酒的過程十分講究。許多部落由女性負責釀酒，她們挑最好的小米，蒸熟後慢慢攤開放涼，讓米的香氣自然散開。等到溫度適中，再與酒麴混在一起，放進陶甕裡靜置，等待發酵。釀酒的過程裡，族人遵守各種禁忌：手要乾淨，心要平靜，不可以罵人，也不能帶著怒氣……。因為這甕酒不是一般的飲品，而是要獻給祖靈、或與族人分享的。如果心不淨，酒就不會順；如果語氣不敬，酒也不會香。釀酒的每個步驟都莊嚴以對，充滿對天地、祖靈與族人的禮敬。 小米酒的意義，從它被舉起的那些場合展現無遺。 排灣族在農作的重要時刻，會以小米酒灑地，向百穀神與祖靈祈求平安與豐收；阿美族青年在成年禮通過試煉後會飲下小米酒，象徵他們正式獲得成年身分，能承擔保護部落的責任；魯凱族新人在婚禮上舉起小米酒，象徵家族的連結，也向祖靈致敬；在卑南族與阿美族的豐年祭裡，小米酒常被用來敬天、敬地，也獻給祖靈，感謝這一年大地的給予；而鄒族的祖靈祭中，小米酒會獻給戰神廟或神木，象徵敬意與感恩。這些儀式的動作與細節或許各有千秋，但它們的意義殊途同歸：小米酒是一種連結，連結人與天地，也連結人與族人。 在部落的日常生活裡，小米酒同樣具有重要的象徵。如果你聽到有人說：「來我們部落，請你喝小米酒。」那不只是招待「飲料」，更不是「想喝就喝」的飲品，而是代表主人願意把珍貴的東西與你分享，把你當成朋友，甚至是家人。 然而，社會上仍有人把「小米酒」與「愛喝酒」畫上等號，這樣的刻板印象忽略了小米酒在文化中的地位，甚至傷害了以傳統為榮的族人。小米酒出現在需要敬意的時刻，有分寸、有節制、有規矩；若有人發生失序飲酒，也會受到部落長輩的責備。 雖然現在的小米酒常被做成伴手禮，在商店裡整齊擺放，看起來和一般商品沒有什麼不同，但對許多族人來說，它真正的價值不是瓶子的設計或包裝，而在背後那份「敬天、敬地、敬祖靈」的心意。只要知道它在儀典中所承載的祝福、在分享時所代表的情誼，我們就不會只從「酒」的角度去看它，而能看見其中深厚的文化與感情。
