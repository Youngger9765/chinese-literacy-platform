multiple_choice:
- question: 1.請問下列語詞，何者使用錯誤？
  options:
  - 她臉上的表情，已將內心的緊張「展現無遺」
  - 每一次挫折都是人生給我們的「試煉」，讓我們變得更成熟
  - 他今天心情很好，在課堂中搞笑，是大家快樂的「媒介」
  - 老師提醒同學玩笑可以開，但要有「分寸」，不能過頭
  answer: C
- question: 2. 文中提到釀造小米酒時，族人必須遵守一項共同原則，下列哪一項是文章中明確提到的？
  options:
  - 在晚上進行，避免受到陽光影響
  - 由部落中年紀最大的長者主持
  - 手要乾淨、心要平靜、不得帶著怒氣
  - 按照祖先留下的配方釀造，才夠純淨
  answer: C
- question: 3. 第三段列出小米酒在排灣、阿美、魯凱等族群的使用方式，其共同意義最可能是什麼？
  options:
  - 顯示不同族群之間的文化差異
  - 小米酒都象徵重要的連結與祝福
  - 不同族群的小米酒口味差異很大
  - 比較各族群之間小米酒釀法的不同
  answer: B
- question: 4. 第五段提到「這樣的刻板印象會造成傷害」，此處的「傷害」最可能指什麼？
  options:
  - 忽略小米酒在文化中的地位，使族人感到不被尊重
  - 原住民大量購買小米酒，降低部落居民的生產力
  - 會讓一般民眾誤以為小米酒是原住民的唯一文化
  - 飲酒會造成許多身體的疾病，讓人身體不適
  answer: A
- question: 5. 作者認為小米酒承載深厚文化意義，不應以偏見看待，下列哪一種做法最符合文意？
  options:
  - 挑選最受歡迎的小米酒款式加以宣傳，讓更多人認識小米酒
  - 推廣小米酒對原住民的意義，鼓勵大家多飲用小米酒
  - 小米酒很適合用來當伴手禮，送禮自用兩相宜
  - 了解小米酒的象徵與脈絡，用尊重的態度看待原住民文化
  answer: D
