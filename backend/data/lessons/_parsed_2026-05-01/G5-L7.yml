    - 周思齊是一個在職棒生涯中運氣不佳的球員。
    - 周思齊是一個容易妥協以求自保的球員。
    answer: 1
    reasoning: 課文摘要中，周思齊在面對黑道威脅打假球時，「但他沒有妥協，也不願違背自己的良心，不願辜負他最愛的棒球和支持他的球迷。」這段文字強烈支持了「不畏強權、堅持原則」的觀點。其他選項雖有部分提及，但並非作者主要傳達的人格特質觀點。
  - prompt: 承上題，請從課文中找出至少兩個支持「周思齊是一個不畏強權、堅持原則的職棒選手」這個觀點的具體理由。
    type: free_text
    reasoning: 此題旨在訓練學生從文本中提取具體證據來支持一個既定觀點的能力，直接對應「觀點找支持理由」策略中的「支持理由」部分。學生需回顧課文摘要中周思齊面對黑道威脅時的行為，例如躲藏、逃跑、不妥協等，作為支持理由。
