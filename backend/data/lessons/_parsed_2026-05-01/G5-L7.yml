- □他的球迷 他沒有走錯方向 □他比賽住進的飯店
- □他當上先發球員的經歷
- 三、從觀點找支持理由：根據上題分析，下列哪些事件或細節可以支持文章觀點中的兩個重點？（可複選）
- 1.支持觀點重點1：「他有信念和堅持」
- (1)沒有違背自己的良心和辜負他最愛的棒球、支持他的球迷 (2)「每場比賽我都是全力以赴」的自我要求 □(3)高中時英文畢業考只考 26 個英文字母的大、小寫
- 2.支持觀點重點2：「他沒有走錯方向」
- (1)拒絕黑道提出的五、六百萬簽約金與打假球的要求
- (2)在假球案中成為唯三沒有嫌疑的人之一
- □(3)考上師大臺灣史研究所，並創辦基金會
- 四、組合應用：確認完文章的觀點與支持理由後，可以用以下的結構整理作者想法。閱讀以下選項與結構，並根據文意填入A, B, C, D。
- (A)他拒絕黑道巨額誘惑，在假球案中保持清白
- (B)信念和堅持能幫助我們不走錯方向
- (C)他不違背良心，在每場比賽全力以赴，並獲得肯定
- (D)持續努力並堅守信念，才能走完長久的職業生涯
