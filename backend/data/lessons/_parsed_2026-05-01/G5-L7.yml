  answer: A
- question: 4.下列何者最符合本文主旨？ A.周思齊的成功完全依靠天賦與運氣來取得成就 B.堅守信念並持續努力才能夠走過困境達成目標 C.棒球員應避免參加職業比賽以免捲入假球事件 D.棒球生涯若想要長久必須選擇收入較高的球隊
  options: []
  answer: B
- question: 5.第七段中描述了周思齊在自傳照片中的那雙手，請問這段描述也可以作為下列哪個觀點的支持理由？
