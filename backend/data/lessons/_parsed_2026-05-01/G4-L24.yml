discussion_content:
- 練習一：身體有些小習慣、小動作是我們平常沒有發覺的，請根據題目觀察看看，並記錄下來。
- 雙手交叉放在胸前，哪一隻手臂在外側？ □右手 □左手
- 翹腳坐著，通常是哪一腳在上方？ □右腳 □左腳
- 聳肩時，哪邊比較容易抬高？□右肩 □左肩 □一樣容易
- 輕輕轉頭看右邊、再看左邊，哪一邊轉得比較順？ □右邊 □左邊 □一樣順
- 雙腳自然放地面，感覺哪一隻腳踩得比較實？ □右腳 □左腳 □一樣踏實
- 感受一下臀部與椅子接觸的感覺，觀察身體重量放在哪一邊比較多？ □右半邊 □左半邊 □一樣多
