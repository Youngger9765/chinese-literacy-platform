- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 這枚戒指也許對其他人來說「微不足道」，卻是他的傳家之寶
  - 她第一次擔任幹部，對她來說要管理同學是「家常便飯」
  - 他說話「一針見血」，常常讓人聽完後還是摸不著頭緒
  - 他這次比賽的表現「乏善可陳」，最後獲得了最佳投手獎
  answer: A
- question: 2. 根據第四段「我像瞬間被戳破的氣球，洩氣地搖搖頭」這句話主要是想表達什麼？
  options:
  - 主角對教練的責備感到生氣和懊惱
  - 主角被教練說中，心裡也感到沮喪
  - 主角面對錯誤不想面對，只想逃避
  - 主角心中因此產生退出球隊的念頭
  answer: B
- question: 3. 根據本文，關於主角的情緒推論，下列何者正確？
  options:
  - 被換下場，心想「唉，又搞砸了！」──慶幸
  - 被隊長拍拍肩膀打氣、被邀請去找教練──自責
  - 聽完隊長的話，反思自己的身體狀況──困惑
  - 被教練發現自己沒有好好休息──生氣
  answer: C
- question: 4. 根據本文，下列何者最符合文章想傳達的重點？
  options:
  - 求表現應該是運動員的首要責任和目標
  - 等到身體出狀況才休息會讓身體更強壯
  - 運動員應該懂得平衡訓練與身體照顧
  - 教練透過挑剔球員來讓球員繼續進步
  answer: C
- question: 5. 下列哪一項行為最符合「把身體當作夥伴」的態度？
  options:
  - 練球時為了有好表現，即使肌肉拉傷也硬撐到底
  - 回家後先好好放鬆滑手機，之後再熬夜把作業寫完
  - 儘管身體還發著燒，但不想錯過比賽，決定帶病上場
  - 練球後覺得身體疲憊，主動伸展放鬆並增加睡眠時間
  answer: D
