spotlight_raw_text: "閱讀聚光燈\n寫作手法——對比\n對比的寫作手法有三個特色：\n把兩種差異超級大的情況放在一起，讓讀者有：「哇嗚，怎麼有這麼大的落差！」的感覺。\n作者用這樣令人驚訝的落差，目的是要強調文章的某一個重點。\n有「對比」時，作者常會用到「但是／卻／相較之下」等轉折詞。\n一、一起來看看本篇文章中的三組對比：\n※判讀方式：找出對比處，並歸納對比想凸顯的重點。\n(段3：轉折)「很多事都記不得了，但是……爸還記得八十年前的舊事……爸想得起來的，都是他的恩人。」\n對比句型\n【A：記不得】＋【但是】＋【B：仍記得】\n句型關鍵詞\n但是\n文句內容\n eq \\o\\ac(○,1)洗過澡又問要不要洗\n eq \\o\\ac(○,2)每次出門前問要去哪裡\n③忘了媽媽過世一年多\n eq \\o\\ac(○,1)仍記得八十年前舊事，且記得的都是「恩人」\n落差焦點\n(複選)\n1.時間落差：近事 vs 舊事\n2.內容落差：日常小事 vs 恩人恩情\n□3.人物落差：家人的提醒vs 爸爸的反應 \n凸顯重點\n(依序將重點填入句中)\n作者用「記不得最近發生的事    」對比「仍記得八十年前的恩人   」，想要強調的是的【恩情／恩人  】對爸爸的重要性。 \n回到理解\n作者已經用對比的手法，把「恩人」這個主題顯出來了，再來，我們就可以預期，後面一定跟著許多恩人的故事。\n\n(段6)「（爸爸）說著說著，哼起歌來……泫然欲泣……『我哪裡來的甜蜜的家庭？我從小就無父無母……』」\n\n對比句型\n【A：甜蜜意象】VS 【B：落淚情緒】\n關鍵詞\n甜蜜的家庭／無父無母的家庭\n文句內容\n eq \\o\\ac(○,1)歌名是「甜蜜的家庭」\n eq \\o\\ac(○,1)爸爸唱著唱著泫然欲泣\n eq \\o\\ac(○,2)爸爸說：「我哪裡來的甜蜜的家庭？我從小就無父無母……」\n落差焦點\n(二選一)\n□1.技巧落差：吹口琴很熟練 vs 歌唱很走音 \n2.情緒落差：甜蜜的家庭 vs 不堪提起的家庭\n凸顯重點\n(依序將重點填入句中)\n作者用「  歌名甜蜜的家庭  」對比「 自己不堪提起的家庭   」，想凸顯的是：爸爸想到自己的【   身世缺憾／家庭傷口   】，所以情緒才會被放大。\n回到理解\n接下來讀例子時，請注意：恩人不只幫忙解決生活問題，也可能在他想起傷口時，仍有人用行動讓他感到溫暖、不孤單。\n\n(段11)：結尾反思（世代對照）\n「我有這麼多恩人嗎？……相較之下，我們這一代成長於物質相對充裕的年代，幾乎沒有走投無路的經驗……」。\n\n對比句型\n【A：上一代的處境】VS【B：我們這代的處境】\n關鍵詞\n相較之下\n文句內容\n eq \\o\\ac(○,1)在物資極度缺乏、經濟蕭條的時代，一點點協助就會被記一輩子\n eq \\o\\ac(○,1)我們這一代物質相對充裕，幾乎沒有走投無路的經驗。\n②生命中仍然有許多值得感謝的人，但可以稱為「恩人」的好像沒有。\n落差焦點\n(複選)\n□1.地點落差：鄉下生活 vs 城市生活 \n2.處境落差：匱乏、易陷困境 vs 充裕、較少絕境\n3.容易把人稱「恩人」vs 較少有「被救一把」感覺\n凸顯重點\n(依序將重點填入句中)\n作者用「【 上一代匱乏困難       】」對比「【    我們這代較少絕境       】」，想凸顯的是：不是現代人不會感恩，而是因為較少走投無路的經驗，雖然仍有感謝的人，但被稱為【   恩人 】的，幾乎已經沒有了。\n\n二、請試著自己找出下段文字的對比手法，和作者強調的重點：\n阿公菜園賣了一萬五千元，阿公當年笑呵呵，捧著一疊鈔票說，算命先生預言他有一天成為萬元戶，沒想到這麼快就成真了。沒想到，搬來台東不久，惡性通膨，舊台幣40,000元換新台幣1元，阿公的15,000元一夕變成廢紙。都是我害的，都是我害的\n對比落差：\n阿公拿著15,000元笑呵呵　vs 【　15,000元一夕變成廢紙　　】\n凸顯重點：　對比出阿公的重大損失，以及爸爸強烈的罪惡感　　　　\n71252760021\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。70841168015\n七"
