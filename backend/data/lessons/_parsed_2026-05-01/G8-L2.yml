multiple_choice:
- question: 1. （段三、四）作者提醒爸爸「媽媽過世了」後，爸爸「眼睛瞪大」最可能代表什麼？
  options:
  - 他覺得作者在開玩笑
  - 他想起往事所以興奮
  - 他震驚且不敢相信
  - 他早就知道所以冷淡
  answer: C
- question: 2. 爸爸唱〈甜蜜的家庭〉時「泫然欲泣」，最可能的原因是什麼？
  options:
  - 他想起向同學借口琴借太久，很慚愧
  - 他想起這首歌的歌名與歌詞非常感人
  - 他突然想起借他口琴的同學，很感恩
  - 他的心被歌名「甜蜜的家庭」刺痛了
  answer: D
- question: 3. 作者為何特別強調阿公賣菜園的15,000元「一夕變成廢紙」？
  options:
  - 強調他對祖父的損失的罪惡感
  - 強調惡性通貨膨脹造成的損失
  - 強調老人家完全沒有理財的觀念
  - 強調當年菜園若不要賣就好了
  answer: A
- question: 4. 作者說「我們這一代好像沒有恩人」，他最可能想要強調什麼？
  options:
  - 現代人比較自私，因此遇到困難也不太願意幫助別人
  - 現代人缺乏道德教育，已經不會感謝幫助他的人了
  - 現代人少有「走投無路」的經驗，所以恩人變少了
  - 以前的人比較愛把恩情掛嘴邊，所以恩人特別多
  answer: C
- question: 5. 作者描寫把他們把「鏽跡斑斑的老斧頭」裱裝加框，並題字紀念那個貧無立錐，卻彼此相愛的日子。這手法可以達成哪個目的？
  options:
  - 以老斧頭象徵當年的艱困與情感，讓意像變得具體可見
  - 透過描寫用裱框保護斧頭，表示裱框有防鏽的功能
  - 把斧頭設計成一個伏筆，表示再來的情節會有大的突破
  - 用裱框展示收藏品味與經濟能力，表示一切都已苦盡甘來
  answer: A
