  - 印加人不敢對抗強大的神明
  answer: B
- question: 4. 印加人在祈求神明驅除瘟疫時，卻發現西班牙人似乎不受病菌影響，所以大量的印加人改信天主教。根據這個結果，印加人最不可能產生什麼樣的想法？
  options:
  - 開始懷疑自己的信仰是否可靠
  - 認為自己的神明失靈，轉而改信天主教
  - 認為神明不滿意祭典儀式，需舉辦更盛大的祭典
  - 對西班牙人產生敬畏感，覺得他們受到神保護
  answer: C
- question: 5. 作者在開頭描寫168人對抗8萬人的場景，這樣的寫作手法可以達成什麼目的？
  options:
