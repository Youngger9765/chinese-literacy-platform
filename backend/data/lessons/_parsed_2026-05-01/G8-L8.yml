spotlight_raw_text: "閱讀聚光燈\n一連串因果\n    你有沒有想過，有些事情不是突然發生的，而是一件事接著一件事，像骨牌一樣推下去？我們讀的這篇課文〈隱形的征服者〉，就是這樣。    西班牙人只有168人，怎麼可能打敗8萬印加軍？答案不是因為他們比較厲害，而是印加帝國早就被其他事情打垮了。\n    這些事情不是同時發生的，而是一件接著一件來，形成「一連串因果關係」。\n　　在前一課：「讓你口中的甜蜜成為遠方農民的希望」我們學到了如何找出「一連串因果」，可以用❶～❹四個步驟，幫助你把文章裡的前因後果看得更清楚。現在我們再來練習看看吧！\n16395707620000\n\n推論本文的因果關係\n步驟❶──找事件\n1.問自己：這段文字提到的重要事件或現象？\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 一連串因果
  instruction: 本練習將引導你運用四個步驟，找出文章中的一連串因果關係，讓前因後果更清晰。
  reasoning: 此練習旨在引導學生透過步驟式提問，從課文〈隱形的征服者〉中識別並分析事件間的因果鏈。原文強調事件並非獨立發生，而是像骨牌效應般相互影響，因此透過「找事件」等步驟，能幫助學生理解複雜的歷史事件背後的深層原因。
  steps:
  - prompt: 問自己：這段文字提到的重要事件或現象？
    type: free_text
    reasoning: 此步驟旨在引導學生從課文摘要中提取關鍵事件或現象，這是建立因果鏈的第一步。學生需從西班牙人與印加帝國的對峙、印加帝國的崩潰、以及賈德•戴蒙提出的病菌傳播等資訊中，找出核心事件。
