discussion_content:
- 找出可能造成印加帝國衰敗的每一個事件，不管這些事件發生的順序，我們通通先找出來！(請在□中打勾，複選，有四個答案）
- 天花病菌傳入印加 繼承人爭奪王位，引發內戰
- □人民改說西班牙語 多年戰亂，政治經濟崩潰
- 印加皇帝染疫過世 □皮薩羅帶著168名士兵準備偷襲
- 步驟❷──找因果線索
- 1.問自己：文章中哪些地方透露出「原因結果」的線索？有哪些語句在說明事情發生的原因或帶來的後果？
- 2.祕訣：
- A.「有關鍵詞」的文句：
- B.「沒有關鍵詞」的文句：
- 判斷策略：加因果關鍵詞，判斷是否為因果句。
- 例如：「皇帝死了，內戰爆發。」
- 加入關鍵詞「因為皇帝死了，所以內戰爆發。」
- 步驟❸──判斷因果，畫箭頭
- 1.問自己：在找到的因果語句中，「原因」是哪一部分？「結果」是哪一部分？兩者之間如何連接？
- 2.祕訣：畫一個箭頭「→」從原因指向結果，就一目了然了！
- 根據上表，請判斷誰是因？誰是果？並畫正確箭頭方向
- 步驟❹──連成一連串因果
- A.以本文為例，隱含著一條重要的因果鏈。上表我們已經找到4個因果關係，接下來我們再看看它們之間的關係，請排序畫出一條因果鏈。
- ①天花病菌傳入印加地區 ②帝國虛弱不堪，不堪一擊
- ③皇帝染病死亡 ④帝國政治經濟瓦解
- ⑤帝國持續內戰與分裂
- B.一連串因果（可以寫編號或寫自己看得懂的關鍵詞）
- ①天花病菌傳入印加 ③皇帝染病死亡 ⑤帝國持續內戰與分裂 ④帝國政治經濟瓦解 ②帝國衰弱，不堪一擊
- |-
  C.這條因果鏈告訴我們：印加帝國在還沒跟西班牙人真正交戰之前，早就因為天花的傳入、皇帝病死、內戰分裂等問題，變得非常虛弱、不堪一擊。如此一來，他們在戰爭中會失敗，也就不奇怪了。
- （ C ）1. 請問哪一個句子的語詞使用正確?
- A.我今天和面試官「對峙」了十五分鐘，終於面試成功
- B.最近校園裡的戀愛傳聞「肆虐」，讓大家沒辦法專心上課
- C.期末考太難，班上「哀鴻遍野」，很多同學更是滿臉愁容
- D.老師在台上「撕心裂肺」的講解題目，台下同學仍是聽不懂
