title: 隱形的征服者
authors: 課文 ：曾世杰 學習單：張明珠
story_text: '公元1532年11月的一個夜晚，南美洲 安第斯山區的卡哈馬卡谷地（在現在的秘魯北部）寒風陣陣。西班牙探險隊遠渡重洋而來，領隊皮薩羅帶著168名士兵，躲在山坡的陰影中悄悄觀察著山下的印加帝國大軍。士兵們的臉上浮現出一絲恐懼——山谷間的火光綿延數公里，八萬名印加士兵的營帳像繁星般密布，場景既壯觀又令人膽寒。第二天，就是印加和西班牙軍隊的第一次接觸。西班牙士兵在日記裡這樣形容：「我們彷彿面對的是一座從未見過的巨大城市，我們人數太少，完全無法抵擋……」。

  先講歷史的結局。當時西班牙只有區區168人，印加帝國軍隊多達8萬人，這是一場力量懸殊的對峙。但到後來，印加的社會、經濟、軍事、政治全盤崩潰，他們甚至放棄了自己的信仰、語言，改信天主教。直到五百年後的今天，南美洲的主流語言仍然是西班牙語，到處都是天主教堂。你會不會好奇，當年歐洲人遠渡重洋到南美洲，勢單力薄，卻能在短時間內征服人口龐大、歷史悠久的印加帝國？他們靠的是什麼？

  科學家賈德•戴蒙的研究指出，是西班牙人從歐洲帶過去的病菌。

  那時是1532年，但早在8年前（1524年），致命的傳染病——天花，透過少數的歐洲手水和士兵，已經先一步傳入美洲。大瘟疫迅速蔓延，印加人民從未接觸過天花病毒，身體毫無抵抗力，大多數人染病即亡。這場疫情造成了毀滅性的衝擊。歷史學家估計，8年內，印加帝國的人口從1200萬，減少到600萬。

  病菌肆虐後４年，也就是1528年，印加皇帝也染疫去世，兩位繼承人爆發激烈的內戰，帝國分裂，造成長達數年的戰亂，曾經繁榮強大的帝國政治經濟瓦解，變得不堪一擊。皮薩羅抵達時，雖然印加帝國表面上依舊強大，但實際上已被病菌嚴重削弱。歐洲來的天花等疾病（還有傷寒、霍亂、麻疹）就像無形的殺手，提前為西班牙人掃除了大量的敵人。

  你可能會好奇，為什麼歐洲人攜帶這麼多致命的病菌，自己卻不會生病？

  戴蒙指出，這是因為這些疾病在歐洲已經肆虐了一千多年，在多次的大瘟疫之後，歐洲人身上已經產生抗體，逐漸適應並能抵擋這些病菌的侵襲。相反的，美洲隔著大西洋，當地的原住民從未暴露在這些病菌中，疫情一起，才會出現哀鴻遍野的慘狀。而疾病造成人口崩潰，使原本繁榮穩定的社會迅速瓦解。

  此外，為了驅除疫病，降災祈福，印加社會舉辦了許多大規模的宗教祭典，但每一個家庭仍然傳出撕心裂肺的嚎哭聲。相反的，印加人發現信仰天主教的西班牙人，居然是不會生病的。在巨大的反差下，印加人開始認為：「他們的神才是真神」。

  回到1532年11月，印加和西班牙兩方軍隊第一次對峙的那天。其實，當時印加帝國在實力上和心理上都早被削弱，這是讓西班牙人能以少數部隊贏得壓倒性勝利的根本原因。

  試想，如果西班牙沒有病菌這個隱形的盟友，歷史會怎樣發展？如果天花大瘟疫從未發生，印加帝國仍是完整且強盛的狀態，皮薩羅和他的小小的隊伍還能輕易的贏下卡哈馬卡的那場戰役嗎？答案或許是否定的。

  看不見的病菌居然成為歷史的重要推手，改變了美洲，甚至全世界的命運。'
