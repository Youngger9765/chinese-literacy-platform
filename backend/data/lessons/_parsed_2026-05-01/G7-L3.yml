  strategy_name: 閱讀聚光燈-用表格整理訊息
  instruction: 請依照以下步驟，學習如何將文章內容整理成表格，以幫助你更有效率地理解與記憶資訊。
  reasoning: 此練習旨在引導學生學習「用表格整理訊息」的閱讀策略。透過拆解整理表格的五個步驟，並結合課文摘要的內容，設計選擇題讓學生實際應用這些步驟，從而鞏固其對策略的理解與應用能力。每個題目都對應一個整理表格的關鍵步驟。
  steps:
  - prompt: 根據課文摘要，這篇文章主要在比較哪兩個對象？
    type: select
    options:
    - 阿姆斯壯和嫦娥
    - 阿波羅計畫和阿提米絲計畫
    - 月球和地球
    - 男性太空人和女性太空人
    answer: 1
    reasoning: 課文摘要中明確提到「阿波羅太空計畫」和「阿提米絲計畫」是兩個主要的登月計畫，並對其進行了比較（例如年代、太空人性別等）。
  - prompt: 在整理比較表格時，尋找重點句的目的是什麼？
    type: select
    options:
    - 快速瀏覽文章
    - 找出文章中所有不認識的字詞
    - 辨識出可用於比較的資訊
    - 練習畫線技巧
    answer: 2
    reasoning: 策略步驟(2)說明「找重點：先用鉛筆將每段可能的『重點句』畫起來。」其目的是為了從中判斷出可用於比較的資訊，以便後續歸納主題。
  - prompt: 根據課文摘要中「阿波羅計畫從1969年~1972年」和「2022年NASA重啟阿提米絲登月計畫」這兩段資訊，最適合的主題名稱是什麼？
    type: select
    options:
    - 計畫名稱
    - 執行單位
    - 年代
    - 太空人
    answer: 2
    reasoning: 策略步驟(3)的範例明確指出，針對「1969年~1972年」和「2022年」這類時間資訊，主題名稱可以命名為「年代」。
  - prompt: 在比較表格中，我們應該將判斷出的「主題名稱」寫在哪個位置？
    type: select
    options:
    - 表格最上方
    - 表格最右方
    - 表格左欄
    - 表格下方
    answer: 2
    reasoning: 策略步驟(4)明確指示「將主題寫在項目欄內：將『主題』寫在表格左欄。」
  - prompt: 完成表格的最後一步是將什麼內容填入細格中？
    type: select
    options:
    - 文章的標題
    - 文章的作者
    - 文章的細節資訊
    - 自己的感想
    answer: 2
    reasoning: 策略步驟(5)明確指示「將文章細節填入細格。」這表示要將從文章中提取的具體資訊填入表格中對應的欄位。
