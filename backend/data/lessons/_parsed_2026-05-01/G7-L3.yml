multiple_choice:
- question: 1. 下列語詞何者用法使用正確？ (邏輯錯誤）
  options:
  - 老師上課時，說了一段「意味深長」的話，逗得大家哈哈大笑
  - 她喜歡登上高山「仰望」山谷中的清幽景致(由高往低看是「俯視」）
  - 這個任務非常「艱鉅」，必須花五分鐘才能解決(前後句矛盾）
  - 臺灣文化發展蓬勃，慶祝各種節慶的方式也十分「多元」
  answer: D
- question: 2. 阿姆斯壯說：「這是個人的一小步，卻是人類的一大步。」此句話將兩種不同的，特別是相反的觀念或事實，並列起來做比較，使語氣增強，意義明顯的修辭法，叫做「映襯」。下列文句，何者也使用這樣的寫作技巧？(以下選項歌詞都來自五月天)
  options:
  - 你就像天使一樣，給我依賴，給我力量(天使)
  - 這一生志願只要平凡快樂 誰說這樣不偉大呢(笑忘歌)
  - 多遙遠，多糾結，多想念，多無法描寫，你都無法看見(倉頡)
  - 有一天，世界真的有終點，也要和你舉起回憶釀的甜(乾杯)
  answer: B
- question: 3. NASA 2022年的登月計畫命名為「阿提米絲」，請問最可能代表的意義是什麼？
  options:
  - 阿提米絲是月亮的守護之神
  - 代表人類再度登往月球，恢復往日榮光
  - 用女性的名字傳達性別平等的時代來臨
  - 之前已使用「阿波羅」，現在接著用他姐姐的名稱
  answer: C
- question: 4. 根據本文的敘述，你認為下列何種情況可能會在2025年美國國家航空暨太空總署（NASA）登月計畫內發生？
  options:
  - 有色族裔的人種數量比白種人更多
  - 強壯的白人男性更適合出任太空人
  - 女性擔任太空人數遠超過男性人數
  - 太空人補給用品包含女性生理用品
  answer: D
- question: 5. 以下是2022年發射的阿提米絲１號的說明，何者有誤？
  options:
  - 發射目的是為了獲得更多數女性太空人數據
  - 內部裝置設計可防範女太空人可能遇到的危機（文中並未提到）
  - 內含假人模型，模仿成年女性的骨骼、肌肉器官
  - 使用兩具假人的目的是為了對比背心的防護效果
  answer: B
