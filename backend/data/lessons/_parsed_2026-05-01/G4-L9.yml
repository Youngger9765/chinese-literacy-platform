multiple_choice:
- question: 1. 下列語詞，何者使用正確？
  options:
  - 他「坐立不安」在沙發上閱讀，十分投入
  - 我想「明察秋毫」一下這杯飲料的味道
  - 小樹「纖細」的枝芽，禁不起風吹雨打
  - 我「即將」在昨天看一場精采的電影
  answer: C
- question: 2. 根據文章，下列哪一項動物行為可能預示「快要下雨」？
  options:
  - 蜘蛛結大網
  - 狗狗不停地搖尾巴走動
  - 蟋蟀叫聲速度變慢
  - 鳥類在空中不停盤旋
  answer: B
- question: 3. 文章中提到：「你皺起眉頭，拿起掃把想把牠揮掉。且慢！」這段話中的「且慢」最可能代表什麼意思？
  options:
  - 作者要呼喚他人幫忙處理蜘蛛
  - 提醒主角先停下來、仔細觀察
  - 作者想用宏亮的聲音嚇退蜘蛛
  - 作者流露出對蜘蛛的強烈憤怒
  answer: B
- question: 4. 依據本文，當家裡的狗狗坐立難安、貓咪亂躲藏時，你外出時可能需要準備什麼？
  options:
  - 手電筒 B.毛帽 C.太陽眼鏡 D.雨具
  answer: D
- question: 5. 本文透過蜘蛛、蟋蟀、狗、貓行為與天空現象等例子進行說明。作者最想傳達的核心觀念是下列何者？
  options:
  - 多觀察自然中的蛛絲馬跡，就能提前掌握天氣變化
  - 借助高科技儀器才能精準預測天氣
  - 動物與天氣無關，真正可靠的是氣象局資料
  - 古代諺語早已精準掌握天氣預測法
  answer: A
