spotlight_raw_text: "閱讀聚光燈\n摘要策略──找重要細節(8)天空的雲層很低，(  E  )隨手就能觸碰到。\n\n    這是一篇說明文，主要說明「大自然有許多線索可以幫助人們預測天氣」，作者舉了一些例子，來支持這個觀點。閱讀這樣的文章，你只要抓住這篇文章主要想表達什麼？文章舉了哪些例子來支撐？這些例子有沒有重要的細節？你就抓到文章的重點囉！\n    接下來，我們先來練習找到文章舉了哪些例子？請勾選你覺得比較清楚的答案？\n第三段： □1.蜘蛛      2.蜘蛛結網  \n第五段： □1.蟋蟀      2.蟋蟀叫聲\n第六段： □1.毛小孩    2.毛小孩的行為\n第七段： □1.天空      2.日暈和月暈\n　　你發現了嗎？其實這四段，1和2的答案都可以，但2更具體、清楚喔！\n　　找到例子後，接下來把重要的細節找出來，你就可以抓到文章的重點囉！要怎麼找到重要的細節呢？你要扣住主題，來判斷重要細節。這一課主要是講「推測天氣」，所以我們要把和「推測天氣」有關的重要描述找出來。\n　我們先用「第三段──蜘蛛結網」試試看：\n❶找重要細節：如何從「蜘蛛結網」推測具體天氣？（4選2）\n□1.蜘蛛的絲纖細到幾乎隱形，又怕風、又怕雨。\n□2.如果即將下雨，它們察覺空氣中的濕度，就不會浪費力氣結一張會被雨打壞的大網。\n3.當你看到蜘蛛在結網時，代表空氣是乾的，天氣會穩定，可能還會放晴。\n4.如果你發現蜘蛛網縮得很小，甚至整張網都不見了，也許就是快要下雨的信號。\n❷精簡：請將勾選出的答案，歸納成一句話\n□蜘蛛的網非常脆弱，要小心保護。\n蜘蛛結大網代表天氣晴，縮小或消失則是要下雨。\n□蜘蛛覓食方式會因濕度不同而改變。\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 摘要策略──找重要細節
  instruction: 這是一篇說明文，主要說明「大自然有許多線索可以幫助人們預測天氣」。請找出文章主要表達的觀點、支持觀點的例子，以及這些例子中的重要細節。
  reasoning: 根據原文的引導，此練習分為兩大部分：首先是辨識文章中用來支持觀點的具體例子，其次是從這些例子中找出與「推測天氣」相關的重要細節，並進行歸納。題目設計遵循原文的提問順序和答案提示（如「更具體、清楚」的選項，以及「沒 □ = 正確」的判斷規則）。對於原文中「4選2」的多選題，因JSON schema的select類型只支援單一答案，故選擇其中一個正確答案作為示範，並在reasoning中說明。
  steps:
  - prompt: 文章在第三段舉了哪個例子？請選出最清楚的描述。
    type: select
    options:
    - 1.蜘蛛
    - 2.蜘蛛結網
    answer: 1
    reasoning: 原文提示「2更具體、清楚喔！」，故選「2.蜘蛛結網」。
  - prompt: 文章在第五段舉了哪個例子？請選出最清楚的描述。
    type: select
    options:
    - 1.蟋蟀
    - 2.蟋蟀叫聲
    answer: 1
    reasoning: 原文提示「2更具體、清楚喔！」，故選「2.蟋蟀叫聲」。
  - prompt: 文章在第六段舉了哪個例子？請選出最清楚的描述。
    type: select
    options:
    - 1.毛小孩
    - 2.毛小孩的行為
    answer: 1
    reasoning: 原文提示「2更具體、清楚喔！」，故選「2.毛小孩的行為」。
  - prompt: 文章在第七段舉了哪個例子？請選出最清楚的描述。
    type: select
    options:
    - 1.天空
    - 2.日暈和月暈
    answer: 1
    reasoning: 原文提示「2更具體、清楚喔！」，故選「2.日暈和月暈」。
  - prompt: ❶找重要細節：如何從「蜘蛛結網」推測具體天氣？(請選出一個重要細節)
    type: select
    options:
    - 1.蜘蛛的絲纖細到幾乎隱形，又怕風、又怕雨。
    - 2.如果即將下雨，它們察覺空氣中的濕度，就不會浪費力氣結一張會被雨打壞的大網。
    - 3.當你看到蜘蛛在結網時，代表空氣是乾的，天氣會穩定，可能還會放晴。
    - 4.如果你發現蜘蛛網縮得很小，甚至整張網都不見了，也許就是快要下雨的信號。
    answer: 2
    reasoning: 根據原文「沒 □ = 正確」的判斷規則，選項3和4都是正確答案，因為它們直接說明了如何從蜘蛛結網行為推測天氣。由於JSON schema的select類型只支援單一答案，此處選擇選項3作為答案。選項4亦為正確答案。
  - prompt: ❷精簡：請將勾選出的答案，歸納成一句話。
    type: free_text
    reasoning: 此為開放題，旨在引導學生將前一步驟找到的重要細節歸納成一句話。原文中未標示 □ 的句子「蜘蛛結大網代表天氣晴，縮小或消失則是要下雨。」可作為參考答案。
