vocabulary:
- word: 纖細
  definition: 細小、細緻。
- word: 明察秋毫
  definition: 形容人觀察事物仔細，就像能看見秋天鳥獸新長的細毛。
- word: 徵兆、前兆
  definition: 指事情發生前所出現的跡象。（提示：有兩個詞）
- word: 遠山如洗
  definition: 形容遠處山景在雨後清晰明亮，像被清洗過。
- word: 彷彿
  definition: 好像。
- word: 即將
  definition: 表示事情快要發生。
- word: 坐立難安
  definition: 形容人心情焦躁、不安穩，坐也不是、站也不是。
- word: 焦躁不安
  definition: 焦急不耐煩的樣子。
- word: 歷歷在目
  definition: 通常形容記憶中的畫面清楚的在眼前。本文則指畫面很清楚。
- word: 頻率
  definition: 指在一段時間內同一件事情發生的次數。發生次數越多，頻率就越高。
