discussion_content:
- 1.第四段──蟋蟀叫聲
- ❶找重要細節：如何從「蟋蟀叫聲」推測具體天氣？（3選1）
- □1.有位農夫宣稱，他可以從蟋蟀叫聲的頻率，判斷現在的氣溫大概幾度。
- □2.科學家的確發現氣溫越高，蟋蟀叫得越快。
- 3.如果錄下草叢裡蟋蟀的叫聲，看看15秒可以叫幾聲，把這個數字加5，再除以2，大概就是現在的氣溫。
- 小提醒：
- 這三個句子看起來都和推測天氣有關，但是如果要推測具體天氣的話，第三句比較合適。
- ❷精簡：請將勾選的答案，再精簡。
- □記下蟋蟀叫聲就能知道明天會不會下雨。
- □蟋蟀叫聲快慢只和牠心情好壞有關。
- 數蟋蟀 15 秒內的叫聲，加 5 再除 2，就能估算當前氣溫。
- 2.第七段──天空
- ❶找重要細節：如何從「日暈、月暈」推測具體天氣？（3選1）
- 1.看到日暈表示夜裡會下雨，看到月暈白天就會起風。
- □2.我們偶爾會覺得今天的星星或遠山好像變近了，歷歷在目。
- □3.所謂「暈ㄩㄣˋ」就是圍繞著太陽或月亮的光環。
- ❷精簡：請將勾選的答案，再精簡。
- 日暈夜雨，月暈日風。
- □天空出現光環代表天氣長期穩定。
- □看到月亮有暈就一定會下一整天的大雨。
- 恭喜你，你已經完成任務了，以後看到長篇文字時，先找出主題，再找出重要的細節，最後用一句話精簡內容，你就能很快抓住文章重點囉。
- （ C ）1. 下列語詞，何者使用正確？
- A.他「坐立不安」在沙發上閱讀，十分投入
- B.我想「明察秋毫」一下這杯飲料的味道
- C.小樹「纖細」的枝芽，禁不起風吹雨打
- D.我「即將」在昨天看一場精采的電影
- （ B ）2. 根據文章，下列哪一項動物行為可能預示「快要下雨」？
- A.蜘蛛結大網
- B.狗狗不停地搖尾巴走動
- C.蟋蟀叫聲速度變慢
- D.鳥類在空中不停盤旋
- （ B ）3. 文章中提到：「你皺起眉頭，拿起掃把想把牠揮掉。且慢！」這段話中的「且慢」最可能代表什麼意思？
- A.作者要呼喚他人幫忙處理蜘蛛
- B.提醒主角先停下來、仔細觀察
- C.作者想用宏亮的聲音嚇退蜘蛛
- D.作者流露出對蜘蛛的強烈憤怒
- （ D ）4. 依據本文，當家裡的狗狗坐立難安、貓咪亂躲藏時，你外出時可能需要準備什麼？
- A.手電筒 B.毛帽 C.太陽眼鏡 D.雨具
- （ A ）5. 本文透過蜘蛛、蟋蟀、狗、貓行為與天空現象等例子進行說明。作者最想傳達的核心觀念是下列何者？
- A.多觀察自然中的蛛絲馬跡，就能提前掌握天氣變化
- B.借助高科技儀器才能精準預測天氣
- C.動物與天氣無關，真正可靠的是氣象局資料
- D.古代諺語早已精準掌握天氣預測法
