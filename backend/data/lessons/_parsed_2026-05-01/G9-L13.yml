multiple_choice:
- question: 1. 下列語詞何者使用「錯誤」？
  options:
  - 炎炎夏日，他貪嘴吃了太多冰棒，肚子覺得「忐忑難安」
  - 即使醫生全力搶救，但病人的狀況太嚴重，已經「回天乏術」
  - 他雖然家境困苦，仍靠著「百折不撓」的精神完成博士學位
  - 他因為比賽失誤而一直「自怨自艾」，反而錯過了改進的機會
  answer: A
- question: 2. 心理學家塞利格曼（Seligman）和研究團隊為了研究什麼問題，蒐集了一萬多篇NBA的報導？
  options:
  - 想知道球隊訓練及與媒體的互動是否影響球隊年度總成績
  - 想了解球隊在輸球後如何詮釋失敗，是否會影響之後的表現
  - 想比較各家新聞媒體在球隊輸球後，是否公平評論輸球原因
  - 想分析球迷評論與勝負的關聯，球員是否會受到評論影響
  answer: B
- question: 3. 從文中舉例看，「樂觀詮釋」與「悲觀詮釋」的主要差別在於哪一點？
  options:
  - 樂觀的人遇到壞事會假裝沒事，悲觀的人則會一直生氣
  - 樂觀的人遇到壞事容易忘記失敗，悲觀的人記性比較好
  - 樂觀的人天天開心、保持好心情，悲觀的人每天自怨自艾 D.樂觀的人相信問題只是暫時的，悲觀的人覺得問題會一直存在
  answer: D
- question: 4. 選出以下最符合本文主旨的選項。
  options:
  - 面對比賽輸贏，球員的表現主要取決於技術與訓練
  - 成功與失敗是人生的一部分，並不是人能完全掌控的
  - 面對挫折，以樂觀態度詮釋，會提高後續的成功機會
  - 學習心理學的方法，可以幫助球員提升表現與信心
  answer: C
- question: 5. 若你在運動會接力比賽失誤，以下哪一個選項最能展現「樂觀詮釋」？
  options:
  - 我害大家輸了，真是沒臉再參加比賽
  - 今天太熱，我看不論誰來都會跑不好
  - 我下次先練起跑時機，應該能更穩定接棒
  - 我可能不適合跑接力，以後還是不要參加這項比賽了
  answer: C
