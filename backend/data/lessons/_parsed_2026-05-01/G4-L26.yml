discussion_content:
- 練習一：從文章中，主角對事情的反應、內心冒出的念頭，判斷他陷入了哪一個思考模式。
- |-
  練習二：這是一個心理測驗。以以下有三個生活中常見的情境。請在每一題中，選出一個「最像你當下會冒出的想法」。沒有對錯，只是看看你在壓力來時，腦袋比較常用哪一種方式說話。
- 1.你花了很多時間準備，結果成績或表現卻不理想。你腦中出現的話最接近下列哪一句？
- □（Ａ）「我就是那種怎麼努力都沒有用的人。」
- □（Ｂ）「同學會笑我，老師一定對我很失望。」
- □（Ｃ）「都是我，全班的平均分數就是被我拉低的。」
- 2.你和朋友們聊天時，你說了一句話後，大家瞬間安靜，但沒有人回應你，而是繼續其他話題。你腦中出現的話最接近下列哪一句？
- □（Ａ）「我好不會說話，我看我還是別跟別人聊天。」
- □（Ｂ）「他們是不是覺得我很奇怪或是不想理我。」
- □（Ｃ）「看吧，只要有我在的地方就會很尷尬。」
- 3.你在報告、比賽或重要時刻前很緊張。你腦中出現的話最接近下列哪一句？
- □（Ａ）「如果我失誤，一切努力就都白費了。」
- □（Ｂ）「如果我沒有表現好，就會失去大家的信任。」
- □（Ｃ）「怎麼辦，我會不會毀了大家的心血。」
