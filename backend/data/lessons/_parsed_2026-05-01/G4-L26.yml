  - 主角一次次的失誤，使他內心產生巨大自責
  - 主角認為朋友的關心只是風涼話，沒有幫助
  - 主角的內在批評都是事實，只是他不敢面對
  - 主角在隊友的打氣之後隨即振作，全力以赴
  answer: A
- question: 4. 根據本文，下列何者最符合文章主旨？
  options:
  - 挫折來自能力不足，應加強訓練避免失誤
  - 面對批評時應學會反擊，證明自己的價值
  - 球員需要壓抑情緒才能在比賽中有好表現
  - 專注當下的行動，有助於調整情緒與狀態
  answer: D
- question: 5. 根據品格聚光燈，下列哪一種想法最能降低內在批評的影響？
