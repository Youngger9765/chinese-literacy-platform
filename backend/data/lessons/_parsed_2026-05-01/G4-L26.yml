  - 已經二連霸的隊伍，今年再度「扳回一城」拿下冠軍
  - 感謝祖靈的「作祟」，讓我們今年穀物豐收，家畜平安
  - 一聲尖叫「瀰漫」寧靜的夜晚，附近聽到的人都很不安
  answer: A
- question: 2. 根據第二段「下一秒，腦內的毒舌球評開始廣播：『你真是爛透了！』、『都是你害的！』」這句話主要是想表達什麼？
  options:
  - 球場上出現的轉播聲音太吵雜
  - 大腦扭曲了教練和隊友的建議
  - 主角內心充滿自我批評的聲音
  - 主角模仿球評播報比賽的語氣
  answer: C
- question: 3. 根據本文，下列敘述何者正確？
  options:
  - 主角一次次的失誤，使他內心產生巨大自責
  - 主角認為朋友的關心只是風涼話，沒有幫助
  - 主角的內在批評都是事實，只是他不敢面對
  - 主角在隊友的打氣之後隨即振作，全力以赴
  answer: A
- question: 4. 根據本文，下列何者最符合文章主旨？
  options:
  - 挫折來自能力不足，應加強訓練避免失誤
  - 面對批評時應學會反擊，證明自己的價值
  - 球員需要壓抑情緒才能在比賽中有好表現
  - 專注當下的行動，有助於調整情緒與狀態
  answer: D
- question: 5. 根據品格聚光燈，下列哪一種想法最能降低內在批評的影響？
  options:
  - 「我就是爛，做什麼都會失敗」
  - 「他們是不是不喜歡我？但也可能我誤會了」
  - 「不管我有沒有努力，結果都沒差」
  - 「只要有我參與的比賽，就一定會輸」
  answer: B
