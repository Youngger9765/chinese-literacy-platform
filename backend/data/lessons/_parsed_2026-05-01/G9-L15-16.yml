multiple_choice:
- question: （ Ｄ ）1. 下列選項中，哪個句子中的詞語使用正確？
  options:
  - 臺北一零一大樓在市中心「艱鉅」，格外引人注目
  - 這條山路狹窄，路面「矗立」不平，實在是難以行走
  - 開採金礦，這項「崎嶇」的工作並非一人之力可以單獨完成
  - 中央氣象署根據氣象「觀測」資料，提供民眾每日天氣預報
  answer: D
- question: 2. 關於「巨石陣」一文中，何者敘述正確？
  options:
  - 科學家已經確定巨石陣的建造目的（未被證實）
  - 巨石陣是由英國船長在航海中發現（神父散步發現）
  - 巨石陣為環狀組成，像圓形的石林（文中第一段）
  - 巨石陣的石頭都是一根一根直立柱（第一段，橫放的巨石）
  answer: C
- question: 4. 請問巨石陣與摩艾走路這兩篇文章，其共同的未解之謎為何？
  options:
  - 兩者名稱的由來眾說紛紜
  - 巨石的來源地在哪
  - 建造它們的工具有何不同
  - 石頭巨大，如何搬運移動
  answer: D
