discussion_content:
- （ Ｄ ）1. 下列選項中，哪個句子中的詞語使用正確？
- A.臺北一零一大樓在市中心「艱鉅」，格外引人注目
- B.這條山路狹窄，路面「矗立」不平，實在是難以行走
- C.開採金礦，這項「崎嶇」的工作並非一人之力可以單獨完成
- D.中央氣象署根據氣象「觀測」資料，提供民眾每日天氣預報
- （ C ）2. 關於「巨石陣」一文中，何者敘述正確？
- A.科學家已經確定巨石陣的建造目的（未被證實）
- B.巨石陣是由英國船長在航海中發現（神父散步發現）
- C.巨石陣為環狀組成，像圓形的石林（文中第一段）
- D.巨石陣的石頭都是一根一根直立柱（第一段，橫放的巨石）
- （ Ｂ ）3. 關於「摩艾走路」一文中，何者敘述不正確？
- A.距離復活節島最近的陸地為智利海岸
- B.一個摩艾石像是由多塊石頭拼湊而成
- C.從山上到海邊石像的道路，大多崎嶇不平
- D.現代的起重機要豎立石像仍然極不容易（文中第三段）
- （ D ）4. 請問巨石陣與摩艾走路這兩篇文章，其共同的未解之謎為何？
- A.兩者名稱的由來眾說紛紜
- B.巨石的來源地在哪
- C.建造它們的工具有何不同
- D.石頭巨大，如何搬運移動
- （ Ａ ）5. 根據這兩篇文章，作者使用了相同的寫作手法，請問寫作順序為何？
- A.發現由來→令人好奇的問題→三個假設→未解之謎
- B.發現由來→未解之謎→三個假設→令人好奇的問題
- C.三個假設→發現由來→令人好奇的問題→未解之謎
- D.未解之謎→發現由來→三個假設→令人好奇的問題
