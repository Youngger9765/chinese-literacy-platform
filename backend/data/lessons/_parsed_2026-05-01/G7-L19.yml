- （ A.B ）2. 比較「背影」中兒子對父親的態度和第十二段同學們分享的自身經驗，有哪兩項相似之處？（多選）
- A.孩子都不喜歡長輩把自己當作媽寶
- B.都在事後察覺長輩的用心，並感到歉疚
- C.都期待長輩能給自己更多的協助
- D.都描述出長輩舉止的笨拙和不合時宜
- （ A ）3. 根據本文，背影的作者（朱自清）在看見父親背影前和看見背影後的感受，有什麼變化？
- A.從厭煩到感動 B.從失望到輕蔑
- C.從冷漠到熱情 D.從快樂到哀愁
