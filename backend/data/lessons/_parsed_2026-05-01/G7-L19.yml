discussion_content:
- (一)問題分辨挑戰：下列問題有的是問寫作目的，有的是問寫作手法；請將問寫作目的󠇢的寫A，問寫作手法的寫B。
- ( B )1.作者（朱自清）為什麼選擇用第一人稱的視角來敘述？
- ( A )2.作者讓文中學生分享自身與父母相關經驗的目的是什麼？
- ( B )3.作者為什麼在文章中大量的運用對話呢？
- ( B )4.作者（朱自清）刻畫父親形象，用了哪些細節？這些細節有何作用？
- ( A )5.作者想透過這篇文章表達什麼？
- ( B )6.本篇文章中為什麼作者沒有讓老師分享自己的看法？
- (二)進階題：讀完本文後，請你也試著詰問作者，問作者(朱自清或本文作者都可)一個與課文相關並且是你想問的問題吧！
- 例：為什麼朱自清的描寫地點要選擇在車站呢？
- 我想問：為什麼作者要選擇「朱自清描寫背影的理由」來作為讀書會討論的重點呢 (參考答案) ？
- (三)挑戰題：讀完下列文章，請你試著詰問作者，問你想問的問題吧！
- 差不多先生的相貌，和你和我都差不多。他常常說：「凡事只要差不多就好了。何必太精明呢？」有一天，他忽然得一急病，趕快叫家人去請東街的汪先生。那家人急急忙忙地跑過去，一時尋不著東街的汪大夫，卻把西街的牛醫王大夫請來了。差不多先生病在床上，知道尋錯了人，但病急了，身上痛苦，心裡焦急，等不得了，心裡想道：「好在王大夫同汪大夫也差不多，讓他試試看罷。」於是這位牛醫王大夫走近床前，用醫牛的法子給差不多先生治病。不上一點鐘，差不多先生就一命嗚呼了。差不多先生差不多要死的時候，一口氣斷斷續續地說道：「活人同死人也差……差…… 差……不多，……何……必……太……太認真呢？」他說完了這句格言，就絕了氣。
- 我想問：【 為什麼作者要寫這個故事呢？這個故事想告訴我們什麼事情呢 (參考答案) ？
