spotlight_raw_text: "閱讀聚光燈\n詰問作者\n    本課讀書會討論的主題是「作者(朱自清)為什麼選擇寫背影?」文中的老師、同學針對這個問題，不斷的深入討論，像這樣對作者的「寫作目的」、「寫作手法」以及「文章內容」提出問題，這個策略就是「詰問作者」。\n　　詰問作者就是向作者提問。不停的向作者提問能讓我們在閱讀文章時，不再只是被動的接收訊息，而是有意識的主動思考，進而幫助我們更加深入的理解文章。\n　　那麼詰問作者該怎麼做呢？可以參考本課讀書會的作法：\n1.仔細閱讀文章：可特別注意文中的人物、情節、背景和文字運用。\n2.提出問題：比如問作者寫作目的或作者的寫作手法，以本課讀書會為例，作者是林玫伶喔。\n(1)作者寫作目的：詢問作者這段文字或文章「這樣子寫的目的或理由是什麼」，像是：\n⚫作者寫「讀書會」這篇文章的目的是什麼？\n(2)作者寫作手法：詢問作者如何安排情節、使用修辭或描寫方式等問題，像是：\n⚫作者詳細寫出學生對話的理由是什麼？\n⚫作者為什麼要對讀書會討論過程做這麼詳細的描寫呢？(描寫方式)\n3.尋找答案：從文章中尋找答案，也可以查詢相關資料，或與他人討論。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 詰問作者
  instruction: 「詰問作者」是一種主動思考的閱讀策略，透過向作者提問，幫助我們更深入理解文章的寫作目的、手法與內容。
  reasoning: 根據原文，此策略旨在引導讀者主動思考作者的寫作意圖、技巧和內容，而非被動接收資訊。JSON結構遵循原文提供的三個主要步驟，並將其中包含的範例轉化為選擇題，以加強對策略核心概念的理解。
  steps:
  - prompt: 第一步：仔細閱讀文章。在閱讀時，請特別注意文中的人物、情節、背景和文字運用。
    type: free_text
    reasoning: 此步驟為策略的第一個指引，旨在提醒讀者閱讀時的重點，原文無選項，故設為開放題型。
  - prompt: 第二步：提出問題。當我們詰問作者的寫作目的時，會提出像「作者寫『讀書會』這篇文章的目的是什麼？」這類問題。請問，這類問題主要關注的是什麼？
    type: select
    options:
    - 文章的中心思想
    - 作者的寫作意圖或理由
    - 文章的修辭技巧
    answer: 1
    reasoning: 此題旨在引導讀者理解「詰問作者」策略中「寫作目的」的提問方向，原文明確指出是詢問「目的或理由」。
  - prompt: 第二步：提出問題。當我們詰問作者的寫作手法時，會提出像「作者詳細寫出學生對話的理由是什麼？」這類問題。請問，這類問題主要關注的是什麼？
    type: select
    options:
    - 文章的故事情節
    - 作者如何運用寫作技巧
    - 文章傳達的訊息
    answer: 1
    reasoning: 此題旨在引導讀者理解「詰問作者」策略中「寫作手法」的提問方向，原文明確指出是詢問「如何安排情節、使用修辭或描寫方式」。
  - prompt: 第三步：尋找答案。你可以從文章中尋找線索，也可以查詢相關資料，或與他人討論來獲得解答。
    type: free_text
    reasoning: 此步驟為策略的第三個指引，旨在說明尋找問題答案的方法，原文無選項，故設為開放題型。
