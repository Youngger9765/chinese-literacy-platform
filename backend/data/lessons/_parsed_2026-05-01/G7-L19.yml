vocabulary:
- word: 囑託
  definition: 吩咐、託付。
- word: 輕蔑
  definition: 看不起、輕視。
- word: 鉅細靡遺
  definition: 重要或不重要的都不遺漏，比喻做事仔細。
- word: 老邁
  definition: 年老體能衰弱。
- word: 定格
  definition: 攝影者刻意安排使放映中的畫面突然靜止不動，用以吸引觀眾注意。
- word: 敏捷
  definition: 反應迅速敏捷。
- word: 凝住
  definition: 形容像水凝固成冰一樣，表示停頓或靜止。
- word: 經典之作
  definition: 製作精美，能夠流傳久遠，成為後世典範的作品。
- word: 笨拙
  definition: 不聰明、不靈巧。
- word: 不置可否
  definition: 不表示任何意見。
- word: 獨白
  definition: 戲劇、電影或小說中，角色獨自說出內心的感受或想法的一段話。
