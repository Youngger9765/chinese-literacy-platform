multiple_choice:
- question: 1. 請問哪一個句子使用語詞正確？
  options:
  - 在山頂欣賞夜景，城市「烽火漫天」，給人寧靜祥和之感
  - 這所醫院戒備「森嚴」，任何人隨時都可以進入病房探病
  - 他上學遲到，老師很生氣，結果「殃及池魚」，連無辜同學也受罰
  - 他總是在最後時刻才完成報告，真是「未雨綢繆」
  answer: C
- question: 2. 根據文章，何者不是建造末日種子庫的原因？
  options:
  - 因應大規模災害，預先儲備種子
  - 若遇氣候變遷，有些基因會消失
  - 全球戰爭發生，農作物容易滅絕
  - 有恐怖攻擊時，可解決糧食短缺
  answer: D
- question: 3. 根據本文，關於末日種子庫的說明何者正確？
  options:
  - 種子所有權為挪威政府(所有權為儲存國)
  - 低溫環境適合保存種子
  - 目前還未有人取用種子(中東國家已取用)
  - 地理位置有利於取用種子(地理位置偏遠，位於北極圈)
  answer: B
- question: 4. 為什麼作者最後說：「要祈禱斯瓦爾巴種子庫永遠沒有需要使用！」
  options:
  - 斯瓦爾巴種子庫地處偏遠北極，不方便人們使用
  - 因為種子庫的成本太高，取用種子會耗費大量金錢
  - 需要取用的話，就是代表世界已經發生大的災難
  - 氣候變遷太快，可能種子庫到時已消失不見
  answer: C
- question: 5. 下列選項，何者是文章的主旨？
  options:
  - 臺灣重視農業，願意與國際組織來合作
  - 全球戰爭頻傳，導致農作物快速的滅絕
  - 斯瓦爾巴群島是最適合儲存種子的地方
  - 用種子庫來提醒人們保護生態的重要性
  answer: D
