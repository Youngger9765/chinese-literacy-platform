vocabulary:
- word: 對峙
  definition: 兩邊的人面對面站著，誰也不讓誰，好像準備要爭吵的樣子。
- word: 不甘示弱
  definition: 不想被別人看扁，積極採取行動，想表現得和對方一樣好，甚至更好。
- word: 堅不可催
  definition: 堅固得無法摧毀，比喻強大牢不可破的力量或意志。
- word: 叫陣
  definition: 在對戰前，挑釁對方出戰，大聲嗆聲要對方出來比一比、拼一拼。
- word: 千古流傳
  definition: 故事（或詩文）流傳很久，歷經千年仍被記得。
- word: 輕舉妄動
  definition: 沒有想清楚就亂行動。
- word: 僵持
  definition: 兩邊誰也不讓誰，卡在那裡很久沒結果。
- word: 身材魁梧
  definition: 形容人高大壯碩、體格強健。
- word: 毫無勝算
  definition: 一點贏的機會都沒有。
- word: 迅雷不及掩耳
  definition: 比喻動作或事情發生得太快，根本來不及反應。
- word: 血脈賁張
  definition: 形容因為生氣或激動，使血管膨脹，全身緊繃，臉色通紅。賁：張大、鼓起、凸起。
- word: 望而生畏
  definition: 光是看到就感到害怕，形容對方氣勢強大或外表嚇人。
- word: 大驚失色
  definition: 形容因驚嚇而臉色大變。
- word: 力大無窮
  definition: 力氣非常大，好像用不完一樣。
- word: 破綻
  definition: 形容論述或計畫，出現了小漏洞或錯誤。
- word: 挑釁
  definition: 故意用言語或動作刺激對方，想讓對方生氣或反應。
- word: 無用武之地
  definition: 沒有機會發揮一個人的本領，或一件物品的功能。
- word: 螳臂擋車
  definition: 一隻小螳螂舉起牠的手臂，想要擋住車輛。形容想用很小的力量去阻擋很強大的事物，結果根本就擋不住。
- word: 廝殺
  definition: 打仗或打架時激烈的互相攻擊，試圖殺死對方。
- word: 匪夷所思
  definition: 事情太奇怪或太特別，讓人想不通。
- word: 堅持己見
  definition: 堅決相信自己的想法，不願改變。
- word: 駕輕就熟
  definition: 對一個技能太熟練了，所以做起來很輕鬆。
- word: 盔甲
  definition: 古代人打仗時穿在身上的保護衣，通常是金屬做的。
- word: 獨排眾議
  definition: 堅持自己的想法，不管別人怎麼說，都不輕易改變。
- word: 孤立無援
  definition: 形容一個某人陷在困難或危機中，卻無人伸出援手。
- word: 舉步維艱
  definition: 連走一步都很困難，比喻情況非常難處理。
- word: 羊入虎口
  definition: 弱小的羊進入兇猛老虎的嘴巴，完全沒有逃脫的機會，用來比喻弱者陷入極大的危險，幾乎無法脫身。
