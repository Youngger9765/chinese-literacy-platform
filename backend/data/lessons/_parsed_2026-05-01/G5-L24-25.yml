multiple_choice:
- question: 1. 下列語詞，何者使用錯誤？
  options:
  - 他到底是怎麼答對的？真令人「匪夷所思」
  - 彈鋼琴對他來說已是「駕輕就熟」，就像喝水一樣簡單
  - 看著百貨公司琳瑯滿目的商品，我真是「舉步維艱」
  - 小偉說的話「破綻百出」，立刻被老師抓包
  answer: C
- question: 2. 根據兩篇文章，歌利亞連日叫陣，以色列卻無人應戰，推論當時以色列軍隊的狀態最不可能是什麼？
  options:
  - 漠不關心
  - 擔憂氣餒
  - 士氣低落
  - 畏縮不前
  answer: A
- question: 3. 如果大衛改用歌利亞那把又長又重的長矛，並採取近身肉搏，最可能發生的情況是什麼？
  options:
  - 長矛夠長，他仍能維持安全距離，刺中歌利亞更容易
  - 他拿不動沉重武器，揮舞遲緩，讓歌利亞勝算大增
  - 兩人力量瞬間拉平，戰鬥拖成持久戰，最後平手收場
  - 近身長矛配上他的靈活步伐，攻擊速度比投石器更快
  answer: B
- question: 4. 兩篇文章都想要表達什麼訊息？
  options:
  - 物質資源愈多愈容易取勝 B.面臨強敵，先求同伴協助
  - 懷有內心信仰便能戰勝一切 D.善用自身優勢即可扭轉劣勢
  answer: D
- question: 5. 假設某位同學同時具備「統整大量數據」與「版面視覺設計」兩項長處。根據「選對戰場、發揮長處」的原則，下列哪一個任務最能同時放大這兩項優勢？
  options:
  - 為校刊撰寫 3000 字的人物專訪，專注採訪內容與文字表達
  - 在校慶園遊會擔任攤位主持人，隨機即席推銷商品
  - 統計並製作全校「課後社團意向」問卷的結果海報看板
  - 負責紀錄每次田徑隊練習的秒數並口頭提醒隊友衝刺
  answer: C
