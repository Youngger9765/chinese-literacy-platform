- 2.可能的劣勢：
- 3.換位思考──可能的優勢：
- 結語：大衛沒有盲目聽從「穿盔甲」的建議，而是看見自己的長處、挑對戰場，終於擊倒巨人。希望你也能像他一樣：先認識自己，然後勇敢選擇最能讓你發光的舞台。
- 加油，相信你可以做得到！
