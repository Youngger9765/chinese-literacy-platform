title: 牧羊少年的逆轉勝
authors: 課文 ：曾世杰 學習單：陳允捷
story_text: |-
  基督教的《聖經》裡記載著一個以小勝大的故事。故事讀來令人血脈賁張，時隔三千多年，仍然讓今天的讀者備受激勵。 西元前1100年，非利士人和以色列人正在打仗，兩軍隔著一個山谷對峙，兩軍都不敢輕舉妄動，戰況已經僵持了好幾個月。 古代的戰爭，兩軍常常派出最厲害的戰士單挑，贏的一方就算獲勝。這天，非利士人有位叫歌利亞的巨人出來叫陣單挑了。他對以色列人喊叫：「派一個人來和我單挑！如果他打敗我，我們就做你們的僕人；但如果我贏了，你們要做我們的僕人！」歌利亞身材魁梧，身高超過200公分，穿著厚重的盔甲，拿著大矛和大刀，站在一般士兵面前就如一座小山，令人望而生畏。因此，歌利亞喊了好幾天，以色列的軍隊都沒有人敢出來應戰，全軍士氣低落。 這時，故事的男主角出場了。15歲的大衛，牧羊人，因為要送飯給軍隊裡的哥哥們，來到了戰場。當他聽說以色列軍隊沒有人敢出面迎戰歌利亞時，他不知哪裡來的膽氣，說道：「我去！」 以色列的國王掃羅一開始不答應：「你年紀太輕了，對方可是從小就打仗的戰士。」但大衛很堅持，他說：「我在放羊時，遇過獅子和熊，牠們搶走小羊，我都追上去把羊救回來，還打死過牠們。我相信，我也能打敗這個巨人！」掃羅終於被少年說服，就幫大衛穿上自己的沉重的盔甲，但少年太瘦小，穿上後根本走不動，只好脫下來，拿了牧羊的杖，又在溪邊挑選了五塊光滑的石子，放在袋裡，帶著甩石的機弦，走下山谷，迎向巨人。 歌利亞看到瘦小的大衛，哈哈大笑，喊道：「你拿根木棍就來打我？把我當狗嗎？」又恐嚇他：「來吧！我將你的肉給空中的飛鳥、田野的走獸吃。」大衛不甘示弱，也大喊：「我必殺你，斬你的頭。」一陣喊話之後，戰鬥開始了。巨人迎著大衛大步走來，大衛也向著巨人跑過去。 接下來發生的事，就是千古流傳的傳奇了。 大衛從袋中掏出一塊石子，把它裝入投石器的皮囊裡，石子甩射出去，準確擊中巨人銅盔未能防護到的額頭，歌利亞面朝下仆倒在地。大衛沒有帶刀，他跑過去，將巨人的刀拔出來，殺死他，並割下他的頭。預期中毫無勝算的少年，居然使用令人意想不到一塊不值錢的小石子，以迅雷不及掩耳的速度結束了這場戰鬥。看到自己的英雄倒下，非利士人大驚失色，四散逃跑。以色列軍隊大聲歡呼，追擊敵人，贏得了戰爭的勝利！ 在一對一的肉搏戰裡，少年絶對不可能擊敗巨人。但只要有勇氣，用了正確的方法，巨人並沒有想像中的那樣堅不可催。我們的生活中，難免遇上像巨人般可怕的挑戰與困難，這時，不妨想起那個勇敢牧羊少年，勇敢面對，發揮自己的長處，就會有機會戰勝困難，把危機變成轉機！
