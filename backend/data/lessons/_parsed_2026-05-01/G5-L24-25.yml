discussion_content:
- 一、找出自己的優勢，選對戰場：如果你有下列優勢，請你選出適合你的優勢戰場。（請勾選，單選）
- |-
  二、大衛不但善用自己的優勢（甩石），還把自己的劣勢也變成了優勢（矮小⭢靈活），上面的練習幫助我們覺察優勢能力，接下來，我們來練習怎麼樣換位思考，把「劣勢」轉為「優勢」。
- 三、換你試試看：請你想一想自己的特質，原本可能會有的劣勢，但換位思考後，他或許可能變成你的優勢呢！
