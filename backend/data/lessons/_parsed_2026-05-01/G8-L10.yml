multiple_choice:
- question: 1.文中「按讚…正悄悄左右我們的心緒」的「左右」最接近何意？
  options:
  - 來回擺動
  - 左右兩邊
  - 暗中影響著（此處「左右」是動詞，指「影響、牽動」）
  - 分成兩部分
  answer: C
- question: 2.作者舉「網紅艾絲娜」與「11歲瑟琳娜」的例子，最主要要說明什麼？
  options:
  - 讚數會傷心理健康
  - 網紅都愛演戲賣慘
  - 年紀小就不該上網
  - 向平台提告效果好
  answer: A
- question: 3.綜合全文，作者對「按讚」的立場最接近下列何者？
  options:
  - 按讚應被禁止，因為危害太大
  - 按讚越多越好，能證明個人價值
  - 按讚是工具，重點在有意識使用
  - 按讚是騙局，平台只想操控人心
  answer: C
- question: 4.作者大量使用「真實案例」（網紅、同學、莫莉），最主要目的為何？
  options:
  - 製造八卦話題
  - 讓論點更可信
  - 證明人人受害
  - 比較各國文化
  answer: B
- question: 5.依作者整體提醒，下列哪個做法最能同時照顧「情緒/自我價值」與「資訊/視野」兩個面向？
  options:
  - 頻繁發文並反覆修圖求按讚
  - 追逐讚數並只看同類內容吧
  - 關掉通知並只看熟人貼文喔
  - 隱藏讚數並刻意看不同內容
  answer: D
