vocabulary:
- word: 倍受矚目
  definition: 矚目：被看見。指受到很多人的注意，成為大家關注的焦點。
- word: 欲罷不能
  definition: 想要停下來，卻停不住，形容對某件事非常著迷，忍不住一直做下去。
- word: 自我價值
  definition: 一個人對「自己有沒有用、值不值得被肯定」的看法與感受。
- word: 悵然若失
  definition: 若失：好像失去了什麼。指心裡感到失落、空虛，好像少了什麼重要的東西。
- word: 起伏不定
  definition: 形容情緒或狀態時好時壞，變化很大，沒有穩定下來。
- word: 左右
  definition: 左右：原本指左邊和右邊。本文是指影響或控制某人的想法、情緒或行為，使事情朝某個方向發展。
- word: 推播
  definition: 推：主動送出；播：傳送、播放。指平台主動把資訊、影片或廣告送到使用者眼前，而不是等使用者自己去找。
- word: _席捲
  definition: 事物來得又快又猛，影響範圍很大，幾乎無法阻擋。
- word: 演算法
  definition: 按照一定步驟計算或處理的方法。本文指電腦依照設定好的規則，分析資料並做出判斷的方法，例如決定要顯示哪些內容給使用者。
- word: 心緒
  definition: 指一個人內心的情緒與想法狀態，例如心情好壞、情緒是否平靜。
- word: 過濾泡泡
  definition: 過濾：把某些東西篩選掉，只留下特定的內容。本文指在網路上，只看到符合自己喜好的資訊，其他不同的觀點被擋在外面，像被泡泡包住一樣。
