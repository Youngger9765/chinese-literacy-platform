spotlight_raw_text: "閱讀聚光燈\n找作者主要論點\n這篇文章的主要論點不是一句話直接說完，而是每一段提出一個「作者看法」，並用例子或說明支持。讀這樣的文章，你要先學會：在同一段裡分辨——哪一句是作者的看法（觀點）？哪些是用來支持的論據（證據/例子）或說明？接著把各段的看法放進「論述架構」，就能統整出文章的主要論點。\n一、找出各段的最主要的「觀點」（看法／判斷）\n下表寫出每個段落的兩個句子，請先勾選①哪一個句子是「作者想要表達的主要觀點／看法」，再勾選②另一個句子的功能。\n段落\n①請勾選作者的主要觀點/看法\n②勾選另一句的功能\n1\n□A.「讚」有時代表喜歡支持，有時是關心，也可能只是感興趣。\nB.(按讚)這個輕輕一點的動作，背後卻隱藏著你未必察覺的真相。\n ①說明\n□ ②例子（證據）\n□ ③做法\n2\nA.按讚帶來即時回饋感，讓人更容易一直滑下去。\n□B.朋友按讚你會覺得被重視，你按讚也讓對方收到關注\n ①說明\n□ ②例子（證據）\n□ ③做法\n3\nA.有些人把自我價值建立在按讚數上，心情起伏不定。\n□B.網紅艾絲娜為追求讚數反覆拍照修圖，最後刪除帳號。\n□ ①說明\n ②例子（證據）\n□ ③做法\n4.\n□A.同學按了遊戲影片的讚，之後手機幾乎都被遊戲內容佔滿\nB.平台會記錄按讚偏好並推播相似內容，久而久之形成過濾泡泡，讓視野變窄。\n□ ①說明\n ②例子（證據）\n□ ③做法\n5.\nA.按讚本身沒有錯，但不要讓讚數左右情緒與自我價值，也要平衡使用。\n□B.有些人使用「隱藏按讚數」功能，作為減壓的方法。\n□ ①說明\n□ ②例子（證據）\n ③做法\n你在任務一已經找出各段的主要觀點，這讓複雜的文字有了清楚的概念。\n二、本文主要論點的論述架構：\n任務二要做的是：看見作者怎麼把這些觀點，做清楚的論述——讓你一眼就看見文章的論述主線，即「描述現象說明它的影響給你的建議」。\n請根據論述的主線，找到對應的段落，填入段落數代號，並選出該段的關鍵詞。下一題要用這條主線和關鍵詞，整合出文章的主要論點。\n作者的論述主線\n填上段落數\n這段的關鍵詞（單選）\n①先說「作者看到的現象」\n（　1　）\n①按讚背後另有真相　\n□②要多按讚表示關心支持\n②再說「你會受到什麼影響」\n（　3　 ）\n①情緒與心理健康失控\n\
  □②覺得開心倍受矚目\n③再說「會怎樣限制你的視野」\n（　4　 ）\n□①過度依賴按讚數\n②受困過濾泡泡，視野變窄\n④最後說「建議你可以怎麼做」\n（　5　）\n①平衡使用社群　\n□②追求更多按讚\n三、整合主要論點：請用一句話說出作者的主要論點。\n提示：主要論點，請參考上表的「論述主線」與「關鍵詞」，合起來，用「心理影響＋資訊影響＋作者建議」三個元素，寫出作者的主要論點。（答案合理就好）\n①按讚看似小動作，但它背後另有真相，②它會影響你的自我價值和心理健康　，③還會讓你受困於過濾泡泡，視野變窄　，④因此，不要讓讚數左右情緒與自我價值，要懂得平衡使用，讓社群媒體成為幫手　　　　   　。\n（提示詞可選用：自我價值、心理健康、過濾泡泡、視野、平衡使用）\n◎"
strategy_exercise:
