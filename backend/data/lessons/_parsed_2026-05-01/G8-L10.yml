    reasoning: 根據原文，選項A前有□，表示不是正確答案，因此B是作者的主要觀點。
  - prompt: '請勾選段落1中另一句（非主要觀點）的功能。

      另一句是：A.「讚」有時代表喜歡支持，有時是關心，也可能只是感興趣。'
    type: select
    options:
    - ①說明
    - ②例子（證據）
    - ③做法
