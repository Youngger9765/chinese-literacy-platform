title: 「按讚」背後的真相！
authors: 課文 ：林玫伶 學習單：陳淑麗
story_text: 看到有趣的貼文、新奇的影像或朋友的近況，許多人手指會很自然的點一下「讚」。這個大拇指的符號，有時候代表喜歡、支持，有時候是傳達關心，也有時候是對內容感興趣。這個輕輕一點的動作，背後卻隱藏著你未必察覺的真相。 最早的「按讚」設計出現在2005年一個名為Vimeo的影片分享網站，之後陸續被更多平台採用；而真正讓「按讚」快速普及的，則是2009年臉書推出的藍色大拇指。這個小小的符號迅速席捲全球。對使用者來說，按讚不只是按一個符號，它帶來一種即時回饋感，朋友看了你的貼文以後按讚，你會覺得被重視；你對別人的貼文按讚，也能讓對方收到你的關注。即使只是看到有趣或有意思的內容，按個讚就能表達自己的感受。這種快速、簡單又能被看見的互動方式，讓許多人一滑手機就欲罷不能，也讓按讚成為社交生活中不可或缺的一部分。 當貼文獲得很多讚時，你會覺得開心、倍受矚目；反之，如果按讚數不如預期，可能會感到悵然若失。久而久之，有些人甚至會把自己的自我價值建立在按讚數上，心情隨之起伏不定。澳洲有位網紅艾絲娜曾擁有超過50萬粉絲，她公開表示，為了追求按讚數，她常常拍了數十張照片才發出去，拍到快哭、修到不想看，照片裡的完美生活都是演出來的，這讓她感到空虛和不真實，最後決定刪掉了自己的帳號。美國11歲的瑟琳娜因為在社群貼文上獲得的按讚數太少而感到自卑焦慮，她的母親甚至對平台提起訴訟。這些例子提醒我 們，按讚不只是數字，它正悄悄左右我們的心緒，甚至心理健康。 此外，你每一個按讚，對像IG、脆、抖音這樣的平台經營者來說都是重要線索：你對哪些貼文按過讚，平台就會記下你的偏好，再透過演算法推播更多類似內容和廣告給你，不知不覺延長你在這類主題停留的時間。有位同學給幾段線上遊戲的影片按了讚，之後他的手機幾乎都被遊戲攻略的排名影片佔滿，讓他忍不住一直滑下去。英國14歲女孩莫莉的案例更凸顯這個問題：她只是看了幾篇關於情緒低落的貼文，平台便大量推送更多負面內容，使她長期沉浸在越來越灰暗的訊息裡，最後導致輕生的悲劇。當平台一再強化你看過的內容，久而久之，不同的觀點或其他資訊越來越難出現在你的眼前，這會使你就像被困在網路的「過濾泡泡」裡，使你看到的世界變得越來越片面狹隘。 按讚本身並沒有錯，它能讓我們快速表達喜好、關心朋友，也讓社交更方便。但也要注意，不要讓按讚數左右自己的情緒與自我價值。現在有些人開始使用「隱藏按讚數」的功能，這也是不錯的減壓方法。同時，也要留意自己滑動的內容，別讓過濾泡泡限制了視野。懂得平衡使用，就能讓社群媒體真正成為連結朋友、探索世界的好幫手。
  現在你讀完這篇文章了，會想給個讚嗎？為什麼？
