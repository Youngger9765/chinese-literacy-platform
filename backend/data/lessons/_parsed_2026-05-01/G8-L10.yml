  - prompt: '請勾選段落2中哪一個句子是「作者想要表達的主要觀點／看法」。

      段落2：

      A.按讚帶來即時回饋感，讓人更容易一直滑下去。

      B.朋友按讚你會覺得被重視，你按讚也讓對方收到關注'
    type: select
    options:
    - A.按讚帶來即時回饋感，讓人更容易一直滑下去。
    - B.朋友按讚你會覺得被重視，你按讚也讓對方收到關注
    answer: 0
    reasoning: 根據原文，選項B前有□，表示不是正確答案，因此A是作者的主要觀點。
  - prompt: '請勾選段落2中另一句（非主要觀點）的功能。

      另一句是：B.朋友按讚你會覺得被重視，你按讚也讓對方收到關注'
    type: select
    options:
    - ①說明
    - ②例子（證據）
    - ③做法
    answer: 0
    reasoning: 根據原文，選項①前有□，表示是正確答案，說明了按讚帶來的互動感受。
  - prompt: '請勾選段落3中哪一個句子是「作者想要表達的主要觀點／看法」。

