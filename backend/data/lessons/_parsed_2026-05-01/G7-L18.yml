title: 一封向醫師求助的信
authors: 課文 ：曾世杰 學習單：張筱晴
story_text: 雷醫師您好： 我是病患蔡淑惠的孫女林麗怡，因在臺東讀大學，無法陪同阿嬤就醫，故想藉此信向您報告阿嬤在就醫前的症狀，希望對後續的診斷治療有所幫助。這封信也在向您求助——阿嬤的狀況帶來了許多我們無法解決的困難，也祈請雷醫師幫助我們。 我和妹妹是阿公阿嬤養大的，爸媽在我們小時候就離開了，家裡就只有四個人。約莫5年前，阿嬤開始會時常莫名對阿公發脾氣、怪罪阿公年輕時對她有多壞，頻率2─3天一次，每次約1個鐘頭。一年多前，我離家求學，妹妹多數時間在外打工，家裡少了我們的居中協調，阿嬤發脾氣的次數與日俱增，頻率增加為1─2天一次，每次2─3個鐘頭。更嚴重的是，從今年年初開始，阿嬤開始指控阿公偷她的錢，甚至認為阿公與銀行聯手騙她，因此跑到數間銀行大鬧，多次遭人報警帶離現場。此時，阿嬤發脾氣的頻率已攀升到每天2─3次，每次2─4個鐘頭，近來更是會揮舞菜刀、朝阿公丟尖銳物品。 讓我們非常困擾的除了上述行為外，她還時常遺失重要物品，例如這星期她將機車遺失在外，且在遺失後，她又向鄰居借腳踏車外出，並且一樣弄丟。另外，阿嬤也出現搞不清楚狀況而不告而取的行為，目前家裡前前後後已被她搜走數萬元現金，且都不知去向。雪上加霜的是，阿嬤沒有病識感，她不知道也不承認自己生病，這次我們要帶她到醫院，必須用哄騙的才能成功。 我們的生活拮据，我19歲，妹妹17歲，都要靠打工養活自己，我週末每天打工時數超過十二小時，而平日沒有課的時間也都塞滿了打工，有時甚至到晚上九點才下班，我妹妹負擔也是這麼重。我的阿公今年78歲了，沒有固定收入，表達也不清楚。阿嬤的狀況令我們不知所措，擔心她是否遭人控制，才總想著要拿家裡的錢？更害怕她被人拐騙簽寫契約或購物，而造成我們無法承擔的交易損失。最後，如果她的病難以康復，後續的安置或照顧該怎麼辦？我們負擔得起嗎？想到這些，我和妹妹常常哭泣，晚上更是難以成眠。 我們諮詢過懂法律的人，他說我們若能得到醫師的診斷證明，或許有機會能夠向法院聲請監護宣告，以保護阿嬤，也保護我們一家人。 總之，我們要拜託雷醫師，除了幫阿嬤治療之外，也希望您幫忙我們兩件事： 一、開立診斷書：我們想向法院聲請監護宣告。 二、我們需要諮詢社工師：我們想知道再來怎麼辦？社會局會有什麼資源？我們有什麼求助的管道？ 最後還是要感謝您的協助，在凱旋醫院病床不足的狀況，還緊急排出病床來讓阿嬤入院，11月20日我們到凱旋急診時，若沒有病床，急診處理完就要我們回家，之後要再送她進醫院就幾乎不可能了。最後敬祝 秋祺 林 麗 怡 敬上 20XX/11/21
