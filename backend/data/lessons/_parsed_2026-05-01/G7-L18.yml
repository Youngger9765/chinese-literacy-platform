vocabulary:
- word: 祈請
  definition: 十分誠懇的請求。
- word: 拮据
  definition: 指生活貧困、經濟困難。
- word: 與日俱增
  definition: 隨著時間不斷增加。
- word: 雪上加霜
  definition: 降雪過多，又降霜，造成農作物雙重傷害。比喻在糟糕的情況下，又發生新的不幸，讓狀況更困難。相反詞是「錦上添花」。
- word: 病識感
  definition: 生病時，對自己病情的認知和接受程度。
- word: 哄騙
  definition: 用溫和的言語或行動安撫、欺騙。
- word: 聯手
  definition: 共同合作。
- word: 諮詢
  definition: 向人請教意見或建議。
- word: 秋祺
  definition: 通常放在書信結尾，祝福收信人秋日安好。
