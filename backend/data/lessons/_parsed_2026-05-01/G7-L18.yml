multiple_choice:
- question: 1. 下列語詞，何者使用正確？
  options:
  - 多虧善心路人真誠的「拐騙」，小女孩才終於停止哭泣
  - 阿公向營養師「諮詢」飲食建議後，才了解平常都吃太鹹了
  - 他不僅錄取了柔道隊，還獲得學長的肯定，真是「雪上加霜」D.在美麗的燈光與柔和的音樂中，他們夫妻「聯手」走進會場
  answer: B
- question: 2. 根據文章，為什麼作者要用寫信的方式表達？
  options:
  - 作者在臺東讀大學，無法陪伴阿嬤就醫(第一段有提到)
  - 作者口語表達能力不佳，擔心說明不清楚
  - 阿嬤沒有病識感，所以作者先寫信偷偷告訴醫師
  - 因為作者諮詢過懂法律的人，那人建議寫信
  answer: A
- question: 3. 請從信件中第二段上下文推論，作者的「居中協調」，可能是指什麼作為或行動？
  options:
  - 在阿嬤怪罪阿公時，擋在他們中間
  - 向阿公、阿嬤抱怨自己和妹妹的困難
  - 在阿嬤對阿公發脾氣時，努力安撫阿嬤
  - 在醫院和家庭間協調，讓阿嬤願意就醫
  answer: C
- question: 4. 請從信件中上下文推論，作者在第五、六段提及想獲得法院的「監護宣告」，最可能的目的是下列何者？
  options:
  - 讓阿嬤不會因為被拐騙而有金錢損失
  - 讓阿嬤在外面行動時有法院的人員保護
  - 讓家人可以知道阿嬤生活的一舉一動
  - 向社區宣告，讓大家知道阿嬤生病了
  answer: A
- question: 5. 根據文章判斷，若雷醫師回應了作者的請求，下列何者最可能發生？
  options:
  - 阿嬤診斷的結果為精神與行為皆正常，返家休養
  - 阿公被要求一起接受診斷治療，協助兩人相處
  - 醫院直接報警，指出阿嬤是偷竊腳踏車的兇手
  - 作者接到社工師的聯繫，詢問她需要的協助
  answer: D
