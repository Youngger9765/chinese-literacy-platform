spotlight_raw_text: "閱讀聚光燈\n從事實歸納概念\n    在寫作時，一個想法或概念，若能運用具體、有細節的事實、例子來說明，會讓讀者更能感受與想像；但在閱讀時，常相反的，需要從具體事實，歸納出作者想要表達的概念，才能促成最佳的理解。\n一、以下先讓我們用生活中常見的具體事實，來練習提取抽象概念：\n具體事實\n抽象概念\n1.我今天的回家作業有國文習作、數學課本、英文造句、自然複習卷，還要準備明天的上台報告。\n我今天的回家作業\n□很少   很多。\n2.我們從幼稚園就認識，國小也一直都在同一個班，而到了國中還能一起在球隊奮鬥。\n我們對彼此很\n□陌生   熟悉。\n3.他每天都早睡早起，且有慢跑的習慣，更會留意自己一天水分的攝取是否足夠。\n他對健康很\n□忽視   重視。\n\n二、接著我們回到本篇文章，來練習看看作者想要藉由具體事實表達什麼概念：\n描述主題\n實際發生的具體事實\n     想表達的抽象概念(單選)\n亂發\n脾氣\n發生\n時間\n過去  現在\n狀況：\n持續 □停止\n1.阿嬤的症狀越來越\n 嚴重□輕微\n\n2.對大家的影響越來越\n  大 □小\n\n對象\n在家裡罵阿公  在銀行大鬧\n影響範圍：\n變大 □變小\n\n發生頻率\n2-3天一次\n  每天2-3次\n頻率：\n變高 □變低\n\n持續時間\n1個鐘頭 \n2-4個鐘頭\n時間：\n變長 □變短\n\n方式\n責罵 \n 揮菜刀、\n        丟尖銳物\n危險性：\n變高 □變低\n\n三、請你整理作者想表達的概念，但難度提升了，請你試著寫出來：\n實際發生的具體事實\n想表達的抽象概念\n我週末每天打工時數超過十二小時，……，有時甚至到晚上九點才下班\n我的工作負擔\n    沉重/龐大  \n擔心她是否遭人控制，……，更害怕她被人拐騙簽寫契約或購物，而造成我們無法承擔的交易損失。\n我們對現況與未來感到\n   擔憂/害怕   \n想到這些，我和妹妹常常哭泣，晚上難以入睡。\n阿嬤狀況讓我們\n  煩惱/擔心   \n\n3070860815340\nA.與真誠矛盾、C雪上加霜是指負面情境、D應為攜手。0\nA.與真誠矛盾、C雪上加霜是指負面情境、D應為攜手。51276546100\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
