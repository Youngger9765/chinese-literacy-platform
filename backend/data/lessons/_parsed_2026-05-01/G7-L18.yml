  reasoning: 此練習旨在引導學生從具體事實中提取抽象概念，分為三個階段：第一階段透過生活實例練習，第二階段應用於課文摘要中的具體事實，第三階段則提升難度，要求學生自行寫出抽象概念。每個步驟都根據原文的提示和答案標記（如□或無□）來判斷選項和答案。
  steps:
  - prompt: 我今天的回家作業有國文習作、數學課本、英文造句、自然複習卷，還要準備明天的上台報告。我今天的回家作業
    type: select
    options:
    - 很少
    - 很多
    answer: 1
    reasoning: 根據具體事實描述，作業項目繁多且包含準備報告，顯示作業量大，故選「很多」。原文以「□很少   很多」標示「很多」為正確答案。
  - prompt: 我們從幼稚園就認識，國小也一直都在同一個班，而到了國中還能一起在球隊奮鬥。我們對彼此很
    type: select
    options:
    - 陌生
    - 熟悉
    answer: 1
    reasoning: 根據具體事實描述，從幼稚園到國中都認識且在同班、同球隊，顯示關係密切，故選「熟悉」。原文以「□陌生   熟悉」標示「熟悉」為正確答案。
  - prompt: 他每天都早睡早起，且有慢跑的習慣，更會留意自己一天水分的攝取是否足夠。他對健康很
    type: select
    options:
    - 忽視
    - 重視
    answer: 1
    reasoning: 根據具體事實描述，早睡早起、慢跑、留意水分攝取，皆為關注健康的行為，故選「重視」。原文以「□忽視   重視」標示「重視」為正確答案。
  - prompt: '實際發生的具體事實: 過去 現在。想表達的抽象概念: 持續'
    type: select
    options:
    - 停止
    - 持續
    answer: 1
    reasoning: 根據課文摘要，阿嬤發脾氣的狀況從5年前開始，並持續到現在，故選「持續」。原文以「持續 □停止」標示「持續」為正確答案。
  - prompt: '實際發生的具體事實: 1.阿嬤的症狀越來越。想表達的抽象概念:'
    type: select
    options:
    - 輕微
    - 嚴重
    answer: 1
    reasoning: 根據課文摘要，阿嬤的症狀從發脾氣到大鬧銀行、揮舞菜刀，顯示症狀越來越嚴重，故選「嚴重」。原文以「嚴重□輕微」標示「嚴重」為正確答案。
  - prompt: '實際發生的具體事實: 2.對大家的影響越來越。想表達的抽象概念:'
    type: select
    options:
    - 小
    - 大
    answer: 1
    reasoning: 根據課文摘要，阿嬤的行為從家裡發脾氣到銀行大鬧，影響範圍擴大，且造成家人困擾，故選「大」。原文以「大 □小」標示「大」為正確答案。
  - prompt: '實際發生的具體事實: 在家裡罵阿公 在銀行大鬧。想表達的抽象概念: 影響範圍：'
    type: select
    options:
    - 變小
    - 變大
    answer: 1
    reasoning: 根據具體事實，從「在家裡罵阿公」到「在銀行大鬧」，顯示影響範圍擴大，故選「變大」。原文以「變大 □變小」標示「變大」為正確答案。
  - prompt: '實際發生的具體事實: 2-3天一次 每天2-3次。想表達的抽象概念: 頻率：'
    type: select
    options:
    - 變低
    - 變高
    answer: 1
    reasoning: 根據具體事實，從「2-3天一次」到「每天2-3次」，顯示發生頻率變高，故選「變高」。原文以「變高 □變低」標示「變高」為正確答案。
  - prompt: '實際發生的具體事實: 1個鐘頭 2-4個鐘頭。想表達的抽象概念: 時間：'
    type: select
    options:
    - 變短
    - 變長
    answer: 1
    reasoning: 根據具體事實，從「1個鐘頭」到「2-4個鐘頭」，顯示持續時間變長，故選「變長」。原文以「變長 □變短」標示「變長」為正確答案。
  - prompt: '實際發生的具體事實: 責罵 揮菜刀、丟尖銳物。想表達的抽象概念: 危險性：'
    type: select
    options:
    - 變低
    - 變高
    answer: 1
    reasoning: 根據具體事實，從「責罵」到「揮菜刀、丟尖銳物」，顯示危險性變高，故選「變高」。原文以「變高 □變低」標示「變高」為正確答案。
  - prompt: '實際發生的具體事實: 我週末每天打工時數超過十二小時，……，有時甚至到晚上九點才下班。想表達的抽象概念: 我的工作負擔'
    type: free_text
    reasoning: 此題要求學生根據具體事實「週末每天打工時數超過十二小時，有時甚至到晚上九點才下班」，歸納出「工作負擔」的抽象概念，並填寫形容詞。原文提供的參考答案為「沉重/龐大」。
  - prompt: '實際發生的具體事實: 擔心她是否遭人控制，……，更害怕她被人拐騙簽寫契約或購物，而造成我們無法承擔的交易損失。想表達的抽象概念: 我們對現況與未來感到'
    type: free_text
    reasoning: 此題要求學生根據具體事實「擔心遭人控制、害怕被拐騙簽約造成損失」，歸納出「對現況與未來」的抽象概念，並填寫形容詞。原文提供的參考答案為「擔憂/害怕」。
  - prompt: '實際發生的具體事實: 想到這些，我和妹妹常常哭泣，晚上難以入睡。想表達的抽象概念: 阿嬤狀況讓我們'
    type: free_text
    reasoning: 此題要求學生根據具體事實「常常哭泣，晚上難以入睡」，歸納出「阿嬤狀況」帶來的抽象概念，並填寫形容詞。原文提供的參考答案為「煩惱/擔心」。
