- question: （ Ｃ ）1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 他在開場時「總結」了今天的重點，讓大家十分期待
  - 面對即將到來的園遊會，班上已經「連忙」作足準備
  - 陷入低潮時，「不妨」換個角度看看，也許會有新發現
  - 國家代表隊舉辦盛大的慶祝活動，對球迷「略表」感謝
  answer: C
- question: 2. 根據第四段「這根本一點意思都沒有！」這句話最可能表達什麼心情？
  options:
  - 認為活動簡單，缺乏挑戰性
  - 認為事情讓人很失望與生氣
  - 覺得組員們講的話太過傷人
  - 覺得老師安排的課程沒意義
  answer: B
- question: 3. 根據文章最後一段「下次再看到這個詞時，不妨停下來想一想：這是什麼『意思』呢？」，這句話的用意最可能是什麼？
  options:
  - 建議讀者閱讀時應該放慢速度 B.鼓勵讀者多背熟「意思」的定義 C.諷刺現代人對語言的使用太過隨便
  - 引導讀者透過文章內容思考語詞意義
  answer: D
- question: 4. 這篇文章主要在說明什麼？ A.「意思」是中文裡最難理解的詞語 B.同一個詞語在不同情況中會有不同的意義 C.語言的使用應該盡量簡單清楚，避免誤會 D.多使用諧音字詞和成語能讓語言更有深度
  options: []
  answer: B
- question: 5.下列哪一句話中的「意思」與「我不是這個意思，你別誤會了」的「意思」用法最接近？
  options:
  - 我聽不太懂你的「意思」是什麼
  - 他說這點小「意思」，不用放在心上
  - 真是沒「意思」的聚會，浪費我時間
  - 在這麼重要的聚會遲到真是不好「意思」
  answer: A
