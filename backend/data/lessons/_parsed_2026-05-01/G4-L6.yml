vocabulary:
- word: 不妨
  definition: 可以、沒關係。
- word: 諧音
  definition: 字詞的讀音相似，常用於語言遊戲、吉祥話或雙關語。
- word: 總結
  definition: 整理重點後，作出簡要說明。
- word: 連忙
  definition: 趕緊、急忙。
- word: 好感
  definition: 對某人或某事產生喜歡或欣賞的感覺。
- word: 歉意
  definition: 抱歉的心意。
- word: 器具
  definition: 工具、用具。
- word: 略表 _
  definition: 以簡單的方式表示或表達心意。
