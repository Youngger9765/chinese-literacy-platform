spotlight_raw_text: '閱讀聚光燈

  推論代名詞

  　　之前我們有學過代名詞是「代替前面提過的名詞（人物或物品），避免一個詞重複出現」。例如：你、我、他、牠（動物）、它（沒有生命的物體）。除此之外，「這」、「那」也是一種代名詞，代替前面提過的事情或狀況。若能正確推論代名詞所對應的內容，就能增加對文章的理解。

  ◎'
