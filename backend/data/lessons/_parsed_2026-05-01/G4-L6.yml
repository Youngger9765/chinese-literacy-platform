discussion_content:
- 閱讀題目，並回到課文段落閱讀，勾選出指稱詞（框框內的語詞）所代表的事物。
- 推論三步驟：
- 1.往前文找找：代名詞代替的人物、狀況，一定是文章前面有提到的內容、事物。當不確定代名詞在指什麼時，可以往前文找找，再根據代名詞後面的描述來推論。
- 2.圈詞＋畫線：往前文找找時，你可以先把代名詞(他/她/它/牠、這/那)圈起來，畫條線連到指稱的對象。會更清楚喔。
- 3.代入句子讀讀看：如果你還不太確定，可以把指稱的對象，替換到句子中讀讀看，讀起來合理了，就對了。
- 例如： 雖然老師連假前派了一堆作業，但這對美美來說是小意思。
