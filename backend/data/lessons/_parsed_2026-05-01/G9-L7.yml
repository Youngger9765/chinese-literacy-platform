multiple_choice:
- question: 1. 下列選項的描述，何者出現「過度表徵」的現象?
  options:
  - 華語人口占世界人口的14.8%，華語是世界上排名第一的常用語言。
  - 臺北市大安區人口占全台灣人口的1.2%，但台大有6.9%的學生來自大安區。
  - 2023年印度總人口14億2千萬人，是全世界人口數最高的國家。
  - 男生占全臺灣國中生52%，但某國中的男生卻占全校人數的20%。
  answer: B
- question: 2. 根據課文第五段長條圖，以下描述何者是錯誤的？
  options:
  - 卑南族人口中有米田堡血型的比率是21%
  - 各個族裔帶有米田堡血型的比率差異很大
  - 世界上只有這六種族裔具備米田堡血型
  - 阿美族有米田堡血型的比率遠超過其他族裔
  answer: C
- question: 3. 馬偕醫院想知道「米田堡血型的人，運動後代謝二氧化碳能力的強弱」，因而進行了實驗。根據課文對實驗的描述，何者錯誤？
  options:
  - 實驗設計對參與者進行運動前測、後測
  - 實驗設計比較有、無米田堡血型者的代謝效能
  - 結果發現具有米田堡血型的人能更快的排出二氧化碳
  - 結果發現運動產生的二氧化碳在體內越久、效能越好
  answer: D
- question: 4. 根據本文結尾，下列何者是本文想要傳達給讀者的理念？
  options:
  - 選擇職涯可綜合評估天賦及努力
  - 身體素質是影響運動表現的唯一因素
  - 後天的努力比先天基因更為重要
  - 有米田堡血型的人都是運動健將
  answer: A
- question: 5. 作者在課文第一、二段用了三個例子描述「阿美族人」身體素質的特殊之處，請問這樣的寫作方式目的為何？
  options:
  - 為了與結尾相互呼應
  - 用三個例子加強說服力
  - 方便比較三種例子的差異
  - 科學問題一定要有三個支持的證據
  answer: B
