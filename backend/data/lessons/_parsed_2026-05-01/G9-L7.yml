spotlight_raw_text: '閱讀聚光燈2645410313359

  長條圖與圓形圖0

  長條圖與圓形圖常見的統計圖表：

  1.長條圖：把長條繪製在圖形上，每一個長條代表一個類別，長條的高度表示該類別的大小（次數、人數或百分比）。

  　※以課文的米田堡血型占族裔總人數的比率為例：

  阿美族

  雅美族

  卑南族

  臺灣人

  東北亞人

  白種人

  88%

  34%

  21%

  5%

  0.006%

  0.002%

  ❶畫上兩條垂直的直線，橫軸最右邊寫上族裔，縱軸最上方寫上比率（％）。

  ❷分別寫上橫軸的族群，畫上縱軸的單位。　　　（學生版需換圖❸）

  ❸將各項比率畫成長條圖。'
