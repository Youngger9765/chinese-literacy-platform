vocabulary:
- word: 事半功倍
  definition: 費力少但收穫大。
- word: 水滴石穿
  definition: 比喻雖然力量小，只要堅持不懈，就能把艱難的事做成。
- word: 得天獨厚
  definition: 獨具特殊的優越條件。
- word: 效率
  definition: 付出心力與獲得成效的比率。
- word: 職涯
  definition: 指職業、生涯。
- word: 過度表徵
  definition: 某一群體在某個類別中的比率太高，超出預期。例如，全臺灣國中男生佔52%，但某國中的男生占全校人數的70%，表示這個國中的男生是過度表徵。
- word: 因材施教
  definition: 根據學生不同的特質，給予不同的教導。
- word: 代謝
  definition: 生物體內物質轉換成能量的過程。
