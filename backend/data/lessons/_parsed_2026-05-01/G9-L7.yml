story_structure_table:
- - 從基因來的特別禮物
- - 問題與 假設
  - 問題：阿美族人運動與勞動能力特別強，是什麼因素造成的？ 假設：88%的阿美族人有米田堡血型，可能具有 【 得天獨厚 】的呼吸生理優勢。
- - 檢驗假設
  - 研究問題
  - 「米田堡血型」和「非米田堡血型」的人們，運動後 【 代謝 】二氧化碳的效率是否有差異？
- - 檢驗假設
  - 實驗
  - 對300位成人進行血液、血型的檢測，並要求參與者做3分鐘的踏階運動測驗，比較運動前後的呼吸生理數值差異。
- - 檢驗假設
  - 研究結論
  - 在運動之後，有米田堡血型的人體能恢復得較【 快 】。
- - 啟示
  - (1)除了努力練習，【 身體素質 】也可能影響運動表現。 (2)如果可以【 因材施教 】，將可以發揮個人最大的優勢。
