discussion_content:
- ❹在正下方寫上圖的標題「米田堡血型占族裔總人數的比率長條圖」。
- 2.圓形圖：將統計資料用百分率(部分÷全部)表示，每個「扇形」代表某項目在全體中所占的比率，整個圓形是100%，代表全體。
- (1)周老師在黑板上寫道：「天下所有的人都會羨慕別人，絕大多數的人曾經被別人羨慕。」請問下列哪一張圖表最能表示周老師的這句話?
- (2)根據聯合國《2019年永續發展目標報告》內容：全球曾有過伴侶的15至49歲女性中，其中有18%在過去12個月經歷過來自伴侶的身體或性暴力。
- ❶請就文中敘述的資訊，畫出圓形圖。
- ❷小明說：「依據此圓形圖，82％的全球女性未曾遭受來自伴侶的身體或性暴力。」框框處為小明錯誤的部分，請寫出正確的資訊？
- 答：應為全球曾有過伴侶的15至49歲女性。
