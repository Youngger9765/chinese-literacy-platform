  instruction: 本練習將引導你使用PREP架構來清晰表達自己的看法。
  reasoning: 原文介紹了PREP表達架構，並提供了兩個範例來練習。範例(1)是一個完整的PREP回答，範例(2)則有空白處需要填寫。根據指示「每個例子都當一個
    select 題（單選）」以及「請你幫忙完成表格內容」，我將範例(1)的P主張轉化為一個選擇題，並將範例(2)中的兩個空白處（P主張和P結論）分別轉化為兩個選擇題，以完成表格內容並練習PREP架構的應用。
  steps:
  - prompt: 根據例(1)的PREP架構，請問其P主張（Point）為何？
    type: select
    options:
    - 書名的科學怪人指的是瘋狂科學家
    - 他想要運用科學實驗把屍塊變成人的這件事很古怪
    - 我跟同學都不敢想像可以用屍塊做實驗
    answer: 0
    reasoning: 例(1)中明確指出「我覺得書名的科學怪人指的是瘋狂科學家（P主張）」，故選此作為P主張。其他選項分別為R（原因）和E（舉例）。
  - prompt: 根據例(2)的PREP架構，請問P主張（Point）的內容應填入什麼？
    type: select
    options:
    - 怪物
    - 瘋狂科學家
    answer: 0
    reasoning: 例(2)的P主張後方空白處填入「怪物」，且後續的R（原因）和E（舉例）都支持「怪物」的觀點。
  - prompt: 根據例(2)的PREP架構，請問P結論（Point）的內容應填入什麼？
    type: select
    options:
    - 書名的科學怪人指的是怪物
    - 書名的科學怪人指的是瘋狂科學家
    answer: 0
    reasoning: 例(2)的P結論應與P主張一致，即「書名的科學怪人指的是怪物」。
