multiple_choice:
- question: 1. 請問怪物的名字是什麼？
  options:
  - 弗蘭肯斯坦 B.瑪麗•雪萊
  - 普羅米修斯 D.怪物沒有名字
  answer: D
- question: 2. 下列哪個句子中的語詞運用錯誤？
  options:
  - 大雄和小孟大吵一架後，他一時氣不過便「奪門而出」
  - 陽光太強，小美一手提東西，只好「隻手遮天」擋住陽光
  - 為了讓自己訓練時更專注，他「離群索居」到深山裡受訓
  - 研究顯示，運動前吃香蕉，有助於預防運動後肌肉「痙攣」
  answer: B
- question: 3. 根據文章，下列敘述何者不正確？
  options:
  - 弗蘭肯斯坦因爲想起曾看見樹被閃電擊中的景象，而得到用電流進行造人實驗的靈感
  - 雖然弗蘭肯斯坦成功的造出「人」來，但隨後就被自己創造出來的「人」嚇得奪門而出
  - 怪物透過學習，慢慢擁有知識和判斷力，起初被討厭，最終因他的善良而被人類接納
  - 小說的中文翻譯是⟪科學怪人⟫，有人認為「科學怪人」是指怪物，也有人認為是科學家
  answer: C
- question: 4. 小說的副標題是「現代普羅米修斯」，原因可能是什麼？
  options:
  - 弗蘭肯斯坦造人的行為和普羅米修斯一樣，觸犯了神的禁忌
  - 弗蘭肯斯坦把普羅米修斯當成目標，立志成為普羅米修斯
  - 科學怪人和普羅米修斯一樣，都被用鐵鍊綁起來並鎖在高處
  - 作者希望弗蘭肯斯坦能像普羅米修斯一樣，接受神的懲罰
  answer: A
- question: 5. 根據文章，下面哪一個選項比較接近本文主旨？
  options:
  - 為了讓科學可以有更好的發展，我們應該要投注所有的心力
  - 不要隨便觸犯神的禁忌，否則將會招來厄運，最後不得善終
  - 怪物很可憐，沒有名字，也沒有人愛，才會造成一連串悲劇
  - 發展科學時不能只關注知識本身，也要留意可能帶來的後果
  answer: D
