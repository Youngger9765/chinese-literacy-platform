spotlight_raw_text: '閱讀聚光燈

  表達看法—PREP架構

  　　你是否有過想要回答問題，卻總是說不清楚的時刻呢？如何清楚表達自己的看法，其實也有小技巧喔！這次我們要練習用PREP的方法來表達，究竟什麼是PREP呢？

  Ｐ是Point（主張）：先說出自己對於這個問題的看法，我覺得…

  Ｒ是Reason（原因）：說明自己這麼認為的原因，因為……

  Ｅ是Example（舉例）：原因的延伸舉例或想法，可以是自己的生活經驗或閱讀到的書籍內容。（有時可省略）

  Ｐ是Point（結論）：再說一次自己對於這個問題的看法，所以…

  1.有兩個人根據問題給出了答案，請你幫忙完成表格內容。

  本文小說的中文譯名是《科學怪人》，有人認為「科學怪人」是指怪物，也有人認為是那位瘋狂科學家，你認為呢？

  (1)

  我覺得書名的科學怪人指的是瘋狂科學家（P主張），因為他想要運用科學實驗把屍塊變成人的這件事很古怪（R原因），我跟同學都不敢想像可以用屍塊做實驗（E舉例），所以我覺得書中的科學怪人指的應該是瘋狂科學家（P結論）。

  (2)

  我覺得書名的科學怪人指的是【  怪物    】（P主張），因為他是運用科學實驗製造出來的人（R原因），雖然外表像人，但他的誕生違反自然法則（E舉例），所以我覺得【   書名的科學怪人指的是怪物  】（P結論）。

  2.'
