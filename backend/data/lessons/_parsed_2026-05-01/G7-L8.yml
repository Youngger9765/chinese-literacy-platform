vocabulary:
- word: 抽搐
  definition: 肌肉不受控制的收縮、抖動。
- word: 痙攣
  definition: 肌肉快速而不能控制的收縮，並有疼痛的感覺。
- word: 神祇
  definition: 指神明。
- word: 離群索居
  definition: 離開人群，自己生活。
- word: 魁梧
  definition: 體格高大強壯。
- word: 奪門而出
  definition: 迅速衝出大門。「奪」是指衝出去的意思。
- word: 禁忌
  definition: 因為風俗習慣或想法，而被禁止說的話或做的事。
- word: 哀鳴
  definition: 哀傷的叫喊。
- word: 隻手遮天
  definition: 想用一隻手遮住天，比喻隱瞞事實的真相。
- word: 遲滯
  definition: 緩慢、停止不動。
