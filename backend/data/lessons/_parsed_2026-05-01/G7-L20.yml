genre: 說明文
title: 網紅的電子煙實驗：偽科學的陷阱
authors: 課文 ：林玫伶 學習單：巫怡蓉
story_text: 朋友傳給阿政兩位網紅拍攝的電子煙實驗影片，電子煙是一種新型菸品，造型像3C產品，又酷又炫，還有多種口味可選擇。阿政覺得影片很新奇，想知道網紅怎麼用科學的方法證明電子煙好或不好！
  影片一：棉花肺實驗 第一位網紅在兩個玻璃器皿內放滿棉花，當作是人的肺，接著分別導入傳統紙菸及電子煙的煙霧，不久紙菸便將整團棉花燻成深褐色，且帶有黏稠的液體；而導入電子煙的棉花，顏色依舊潔白，只有稍微溼溼的。
  實驗後的兩團棉花顏色落差好大，阿政不禁心想：「紙菸太毒了，千萬別碰！但電子煙看起來對身體無害呀，政府為什麼要禁？」 影片二：煙油食材實驗 另一位網紅認為，電子煙的煙油成分，就和常見的食物添加物一樣，沒什麼害處，因此網紅表演用麵包、冰棒沾各種不同口味的煙油吃，又把煙油滴進飲料當成調味喝，最後還把煙油入菜後吃下肚。網紅告訴觀眾：「這些成分你平常在食物裡也吃得到，沒問題啦！」
  阿政看完這部有點搞笑的影片後，忍不住佩服網紅用自己的身體做實驗，同時也對電子煙的安全性更加放心。阿政本來想勸一位朋友戒掉電子煙，這下他覺得沒什麼好勸戒的，「煙油都能吃了，還怕用抽的啊！」阿政這樣想。
  網路的偽科學 然而，阿政看的這兩部影片都有問題，影片製作者的描述方式看起來像科學，但訊息並不完整，容易讓觀眾信以為真，誤入偽科學的迷魂陣。 以第一部影片為例，讓棉花變成深褐色的是紙菸裡的焦油，也是容易看得見的物質；但電子煙裡的煙油成分不一，加熱後產生煙霧，很可能包含許多有害物質如尼古丁、重金屬等，而偏偏那些是看不見的。因此，光靠棉花不會變色就得出「電子煙無害」的結論，並不恰當。
  再以第二部影片為例，網紅以「吃下煙油」證明煙油只是食品香料，不用緊張。但別忘了，食品香料是用吃的，能添加什麼或添加多少，都是依據進入人的消化道進行的安全評估；但電子煙的煙霧是「吸入肺」中的，對身體產生的影響，不能和「吃下肚」相提並論，這種指鹿為馬的說法，並無說服力。更何況，健康問題也不是靠「敢吃」來證明的。
  理性判斷 聰明識讀 事實上，不僅網路上似是而非的實驗混淆大眾對電子煙的認知；電子煙廠商為了龐大的利益，把目標鎖定在年輕族群，以無害、時尚、不會上癮等說法來美化電子煙的影響，降低青少年的戒心，只要你一上鉤，往後就成了業者的長期提款機。
  2023年「菸害防制法」修法後已全面禁止電子煙，但仍有業者不斷變換行銷手法，除了利用高人氣網紅進行行銷，也利用網路拍賣平台暗地販售，因此，只靠政府查緝禁止是不夠的，最重要的，還是要認清菸品行銷手法，並且多方查證、辨識網路上的訊息，才不會掉進菸害的陷阱。
