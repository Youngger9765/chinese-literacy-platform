spotlight_raw_text: '閱讀聚光燈

  辨別網路訊息真偽

  　　怎樣當一個聰明的閱聽人？辨別真假訊息絶殺技！

  Ｑ1：為什麼會有假消息？

  Ｑ2：假消息的傳播途徑？

  希望利用假消息謀取利益或引發社會恐慌、洗腦民眾相信特定的立場。

  Line、Facebook、Youtube、IG、抖音、網路新聞……。

  Ｑ3：如何辨別假消息？

  (1)誰寫的？→找得到「作者」嗎？匿名一定是假的，因為無須負責任。

  (2)誰獲益？→找出網頁上「關於我們」，就可知道該消息的立場為何。

  (3)來源呢？→確認國外消息來源是否正確，文字是否為臺灣常用語。

  (4)時間呢？→這則消息的撰寫時間是不是過時很久了？有沒有時效性。

  Ｑ4：假消息偽裝術?

  Ｑ5：有哪些平台可以查證假消息？

  (1)聳動標題，吸引人目光。

  (2)免費廣告，好康或福利。

  (3)引人好奇的照片或圖片。

  (4)引發人仇恨／恐慌的激進言論。

  「MyGoPen 麥擱騙」、

  「Cofacts 真的假的」、

  「趨勢科技防詐達人」、

  「美玉姨」、「台灣事實查核中心」。

  總結：遇到任何訊息，別太快選邊站，先思考及蒐證，再做結論。


  ◎'
