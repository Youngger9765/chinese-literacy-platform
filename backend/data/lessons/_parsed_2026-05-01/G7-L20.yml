multiple_choice:
- question: 1. 下列語詞何者用法使用正確?
  options:
  - 弟弟作業沒做，又躲避檢查，就像進入了「迷魂陣」
  - 妹妹實在是太「黏稠」了，走到哪跟到哪，甩都甩不掉
  - 老師講解概念簡單清楚，學生非常容易「混淆」
  - 他只要女友一喊缺錢，就給她錢，簡直就像「長期提款機」
  answer: D
- question: 2. 電子煙的廠商為何會把目標鎖定在年輕族群?
  options:
  - 因為年輕族群好奇心重，容易因行銷手法而受騙
  - 因為年輕族群很有錢，可以當廠商長期提款機
  - 因為電子煙有龐大的利益，如果越多人抽越好
  - 因為年輕族群比較聰明，可躲開執法機關的查緝
  answer: A
- question: 3. 在本文中，在判斷「電子煙好不好？」時，阿政犯了什麼錯誤？
  options:
  - 覺察紙菸和電子煙的不同
  - 毫不懷疑，直接相信網紅的實驗
  - 查找科學影片去證實想法
  - 對電子煙充滿好奇心
  answer: B
- question: |-
    4. 「社會上多的是『指鹿為馬』的人，常常亂說話混淆大眾視聽，所以閱讀媒體報導時，不可不慎。」，請問『指鹿為馬』不可用哪個詞語替換？（D比喻愚賢不一、高低程度不一樣的人混在一起）
  options:
  - 顛倒黑白
  - 是非不分
  - 扭曲事實
  - 龍蛇混雜
  answer: D
- question: 5. 請問何種情況最不符合本文所說的「理性判斷、聰明識讀」呢？（A要先蒐證再下判斷，不可人云亦云。）
  options:
  - 高人氣網紅製作、在網路上瘋傳的影片是可信度一定較高
  - 看到吸引我的訊息時，我會想一想傳播者的動機是什麼
  - 我可以用關鍵詞在google上搜尋，查證新聞的正確性
  - 投票前夕突然出現對某陣營特別不利的消息，我會特別小心
  answer: A
