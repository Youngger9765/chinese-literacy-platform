story_structure_table:
- - 網紅的電子煙實驗：偽科學的陷阱
- - 好奇的問題
  - 電子煙好不好？
- - 方法
  - 看朋友寄來的【 電子煙實驗影片 】。
- - 網紅的實驗
  - '(1)__實驗：

    用紙菸和電子煙的煙霧試驗棉花有沒有變色。'
  - '(2)【 棉花肺 】實驗：

    把煙油當成食物調味料，看看吃下去的後果。【 煙油食材 】'
- - 實驗結論
  - 電子煙對人體【 無害 】。
- - 對網紅實驗的批判
  - "(1)棉花肺實驗的問題\n→光看棉花潔白與否不足以證明電子煙無害，很多有害物質如尼古丁、重金屬根本【 看不見 】。 \n(2)煙油食材實驗的問題(單選)　\n\
    →電子煙是【 吸⃞吃 】到肺裡的，\n網紅把煙油【 ⃞吸吃 】下肚，完全沒有說明吸電子煙對人體的影響。"
- - 總結
  - '理性判斷、聰明識讀的方法：

    (1)認清廠商的行銷手法，學會質疑傳播者的

    【 動機 】。

    (2)多方【 查證 】網路上訊息的正確性。'
