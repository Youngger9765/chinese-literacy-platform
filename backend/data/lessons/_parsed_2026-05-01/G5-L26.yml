vocabulary:
- word: 差異
  definition: 兩件事情的差別、不一樣的地方，例如：Ａ班身高平均160cm，B班身高平均150cm，我們會說兩班的身高有「差異」。
- word: 年齡層
  definition: 用來描述在某個年齡範圍內的特定群體，例如幼兒、青少年或成人。
- word: 推論
  definition: 根據已經知道的事情，想出還不知道的結果或答案。
- word: 異議
  definition: 不同意見。
- word: 差距
  definition: 兩件事情之間的差別或距離，指的是兩個數字或情況之間「差了多少」。通常用於成績、能力之間的比較。例如：Ａ班平均分數85分，B班平均分數78分，兩班的「差距」是85-78＝7分。
- word: 複製
  definition: 把一樣的東西再做一次，或把過程一模一樣的重現出來。
- word: 平均值
  definition: 幾個人平均的表現。例如，有3個人，體重分別是50、60、70公斤，他們3人的平均值就是60公斤，計算方法是（50+60+70）∕3＝60。人們經常用平均數來代表一群人的表現。
