multiple_choice:
- question: （ Ｂ ）1. 如果一個小朋友在記憶數字的測驗中，能夠成功記住「2-7-5-8」，但記不住「6-7-0-4-9」，他會得到幾分？
  options:
  - 5分 B.4分 C.2758分 D.67049分
  answer: B
- question: （ Ａ ）3. 實驗二提到小老中和小老美數字記憶廣度如果有所差異，「就絶對不可能是補習造成的」，為什麼作者可以這麼確定呢?
  options:
  - 因為小老中和小老美都沒有補習
  - 因為研究人員請家長不要讓小孩去補習
  - 因為小老中有補習，小老美沒有
  - 因為小老中的記憶力比小老美好
  answer: A
- question: 4.實驗二的小老中和小老美在數字記憶廣度上差異明顯，這意味著什麼？
  options:
  - 補習對記住數字有很大的影響
  - 運動可能影響記住數字的能力
  - 年齡小的孩子更擅長記住數字
  - 語言的發音速度可能是關鍵原因
  answer: D
