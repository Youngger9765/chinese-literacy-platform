multiple_choice:
- question: 1.反對者說核災是「低機率、高衝擊的系統性風險」，最想凸顯的想法是？
  options:
  - 雖然不太可能發生，但一旦發生會重創多面向運作
  - 發生相當頻繁，所以應該立刻全面停用所有核電廠
  - 只要資訊公開，就能把所有可能風險完全降到最低
  - 只要設備更新，就能降低發生的可能並減少衝擊
  answer: A
- question: 2.作者先用車諾比與福島的撤離案例，再轉到「放到台灣會更具體」，這段最主要的作用是什麼？
  options:
  - 先用國外歷史事件吸引目光，讓讀者忽略台灣的具體事實
  - 先用案例說明風險，再套用台灣情境，讓讀者更能具體想像
  - 證明核災影響完全一樣，台灣若有核災，命運相同且可預測
  - 比較兩次核災誰較嚴重，進而判斷台灣要學哪國的管理制度
  answer: B
- question: 3.反對方談「核災＋戰時風險」，正方談「進口依賴＋減碳壓力」。把兩邊整合起來，本文真正要讀者思考的是什麼？
  options:
  - 哪一邊口號更有力，才能在社會上快速獲勝
  - 只要選擇綠能，就能同時解決安全與供電的問題
  - 用什麼代價換電力，並比較不同風險的可承受性
  - 核能只要不發生事故，就能自動得到所有人支持
  answer: C
- question: 4.本文在討論「要不要用核能」時，反覆提醒：做決定時必須同時考慮三件事。下列哪一組最符合文中的三個考量？
  options:
  - 供電穩定、核能安全、減碳目標三者的取捨平衡
  - 供電成本、電價漲幅、民眾負擔三者的影響比較
  - 核安技術、設備新舊、專家判斷三者的可靠程度
  - 民意支持、政黨立場、選舉結果三者的互動變化
  answer: A
- question: 5.作者最後提出「公開透明的數據、嚴格監管與持續對話」，最可能想改善的是哪一個問題？
  options:
  - 先統一立場，讓討論快點結束不再爭辯
  - 回到資料與監督，降低情緒對立與互不信任
  - 應託付專家決定，民眾不能也不必了解細節
  - 先拚口號動員，趁選舉前快速形成決策壓力
  answer: B
