spotlight_raw_text: "閱讀聚光燈\n比較多元觀點\n前兩課我們學習過「比較多元觀點」策略：先找出每一派的立場/主張，再整理「理由-證據」，最後比較差異。這一課也是議題文，有兩派觀點。請你再用一次這個方法，看看你能不能把兩派的觀點整理清楚，並推論文章主旨。\n\n一、確定議題\n這篇文章在談「哪個議題／爭議」（提示：可能出現「爭議」、「要不要」、「是否」等關鍵詞）\n     臺灣要不要核電？                                         \n二、找觀點（立場）\n請你整理這個議題有哪些立場/主張？主要用哪些理由？有沒有證據支持？\n觀點\n要素\n請根據課文內容勾選(單選) 或填答（內容合理即可）\n立場/\n主張\n       ①反對核能     □②贊成核能  \n\n理由\n(回答「為什麼\n這樣主張\n」？)\n請依課文內容，判斷每個理由最主要屬於哪一類(單選)\n1.核災屬於低機率、高衝擊的系統性風險，出事難收拾\n ①安全風險 □②能源供應 □③減碳責任□④選址處置\n2.台灣人口密度高，若發生核災，會使交通與安置更困難\n ①安全風險 □②能源供應 □③減碳責任□④選址處\n3.兩岸    情勢緊張，若核電遭飛彈轟炸，民眾更緊張         \n ①安全風險 □②能源供應 □③減碳責任□④選址處置\n4.核電廠與核廢料要設在哪裡、放在哪裡，有鄰避效應\n □①安全風險 □②能源供應 □③減碳責任④選址處置\n**你發現了嗎？反對核能的理由主要集中在：  安全風險     \n證據\n①車諾比、福島的撤離人數與範圍等案例數據\n□②很多人認為核能一出事修復費用太昂貴，不能考慮核能\n立場/\n主張\n□①反對核能     ②贊成核能\n主要\n理由\n(回答「為什麼這樣主張\n」？)\n請依課文內容，判斷每個理由最主要屬於哪一類(單選)\n1.台灣能源多靠進口，有核能可增加穩定來源，減少依賴\n□①安全風險  ②能源供應  □③減碳責任  □④選址處置\n2.減碳是趨勢，核能排放的溫室氣體極少，能減碳\n□①安全風險  □②能源供應  ③減碳責任  □④選址處置\n3.臺灣的用電   需求快速上升，需要更穩定的電力來源支撐      \n□①安全風險  ②能源供應  □③減碳責任  □④選址處置\n**你發現了嗎？贊成核能的理由主要集中在：    能源供應    \n證據\n①數據指出，台灣能源多靠進口、用電需求急速上升\n□②只要擴大核能發電，就保證不缺電，不必其他電源\n\n三、比較觀點差異（用「價值／風險」兩個角度）\n我們先用「主張＋理由＋證據」掌握每一方在說什麼；再追問理由在強調什麼──最優先的價值與最害怕的風險。用這兩個角度看，就能清楚比較觀點差異。\n立場\n最優先的價值（單選）\n最害怕的風險（單選）\n贊成\n①安全優先　\n□②穩定供電\n□③減碳目標\n①核災失控　\n□②能源中斷\n□③減碳落後\n反對\n□①安全優先\n②穩定供電\n□③減碳目標\n□①核災失控\n②能源中斷\n□③減碳落後\n＊歸納觀點差異：\n反對核能把「  安全優先  」放第一，因此最怕「  核災失控    」。\n贊成核能把「  穩定供電  」放第一，因此最怕「  能源中斷    」。\n四、推論主旨（從「觀點差異」推論整篇重點）\n你已用表格整理兩派的「理由與證據」，也用「最優先的價值／最害怕的風險」比較差異。綜合這些整理，本文主旨最可能是什麼？（單選）\n①列出反對與贊成的理由，提醒能源決策必須權衡利弊並持續對話\n□②用核災案例證明核能最危險，呼籲台灣立刻全面停止使用核電\n□③用用電需求與減碳壓力證明核能必要，主張台灣應立即擴建核電廠\n五、推論作者意圖\n你在比較表中看見兩派「優先價值」與「害怕風險」不同；作者最後提出「公開透明的數據、嚴格監管與持續對話」。作者這樣收尾，最可能想達到什麼效果？（單選）\n□①先由專家提出完整報告並公開發布，再依報告定案執行。\n②讓討論回到可查核資料與制度程序，降低對立與互不信任。\n\n◎"
