vocabulary:
- word: 眾說紛紜
  definition: 眾說：很多人的說法；紛紜：雜亂、不相同。大家說法很多、意見不一致。
- word: 兵凶戰危
  definition: 戰爭可能發生，局勢緊張不安。
- word: 系統性風險
  definition: 不是單一問題，而是整個系統連鎖出問題的大風險。
- word: 風靡
  definition: 非常流行，迅速受到很多人喜愛與追捧。
- word: 鄰避效應
  definition: 大家知道某設施「有需要」，但不希望蓋在自己家附近（例如垃圾場、核廢料）。
- word: 置身事外
  definition: 置：放；事外：事情之外。把自己當作不相關的人，不參與、也不負責。
- word: 因噎廢食
  definition: 怕出事就乾脆不做，結果反而失去原本的好處。
- word: 捉襟見肘
  definition: 捉襟：拉住前襟；見肘：露出手肘。資源不夠用，怎麼安排都很吃緊。
- word: 權衡
  definition: 把不同選項的利弊放在一起比較，再做選擇。
- word: 尤有甚者
  definition: 更糟的是、甚至更過分的是（用來加重後面情況）。
