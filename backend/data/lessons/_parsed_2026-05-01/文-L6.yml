- - 導讀：這故事發生在二千多年前的楚國。江乙是當時的小官，他管轄的郢都󠇡王宮發生竊案，江乙的長官（叫做「令尹」）不高興，就報請楚王把江乙免職了。 東西又不是江乙偷的，結果他被免職，說起來實在很寃枉。這時，又聰明又勇敢的江乙媽媽挺身而出，就跑到王宮找楚王，為自己的兒子打抱不平了。 「大王，我家掉了八匹布，是令尹偷的！」她告狀道。 「講話小心一點，你若誣告，國家是有法律的喔！」楚王警告。 「就算不是令尹偷的，也是他指使人去偷的！」江乙媽媽答，而且說了一長段的話，意思是令尹沒有把國家治理好，才出現這麼多小偷，我家掉了東西，他當然要負責。 「但小偷偷東西，令尹並不知道啊，這跟他有什麼關係？」王說。 「對啊，那王宮掉了東西，又跟我兒子有什麼關係？」江乙媽媽說出了心中的話。 江乙媽媽說了這麼多，你覺得有道理嗎？最後，她有達到目的嗎？答案就隱藏在本課的某一頁中，祝你順利找到答案哦。 古文今譯 楚國人江乙擔任郢都󠇡的大夫。有人進入王宮偷盜，令尹因此怪罪江乙，向楚王請求罷黜(免職)他。 江乙的母親到王宮拜見楚王說：「我在半夜丟失八匹布，是令尹偷了我的布。」楚王告訴江乙的母親說：「令尹確實偷布的話，我不會因為他富貴而不依法處置。但如果令尹沒有偷竊卻誣賴他，楚國是有法律的。」 江母說：「即使令尹不是親自去偷，也是指使人偷的。」楚王說：「他如何指使人偷盜？」江母回答：「從前孫叔敖擔任令尹時，路上不會有人撿走失物，家裡的門不用關，而盜賊自動就消失了。如今他令尹治理，耳朵和眼睛不清楚(能力差、愚昧糊塗)，盜賊公然橫行，所以才使盜賊得以偷走我的布，這跟指使人偷有什麼不同？」 楚王說：「令尹在朝廷，盜賊在民間，令尹有什麼罪過呢？」江乙的母親說：「從前我的孩子作為郢都的官員，有人偷了王宮的東西，我的孩子卻受到連坐而被免職，我的孩子又哪裡知道(盜賊要到王宮偷東西)呢？但他最終受到連坐而被罰。令尹是什麼特別的人，卻不因為這樣算他的錯嗎？從前周武王說過：『百姓有罪過，原因都在我一人。』上面的官員不賢明，那麼下面的人民就不能治理好，宰相不賢能，那麼國家就不安寧。請王上明察這件事。」
- - 西漢・劉向
  - ''
- - 楚人.江乙.為郢大夫。有入王宮中.盜者，令尹.以罪乙，請於王.而黜之。 其母.往言.於王曰：「妾.夜亡布.八匹󠇡，令尹.盜之。」王謂母曰：「令尹.信盜之，寡人.不為󠇡其富貴.而不行法焉。若不󠇡盜.而誣之，楚國.有常法。」 母曰：「令尹.不身盜之也，乃使人.盜之。」王曰：「其使人盜.奈何？」對曰：「昔.孫叔敖.之為令尹也，道.不拾遺，門.不閉關，而盜賊.自息。今.令尹.之治也，耳目.不明，盜賊.公行，是故.使盜.得盜.妾之布，是與.使人盜.何以異也？」 王曰：「令尹.在上，寇盜.在下，令尹.不知.有何罪焉？」母曰：「昔日.妾之子.為郢大夫，有盜王宮中.之物者，妾子.坐１而黜，妾子.亦豈知之哉？然.終坐之。令尹.獨何人，而不以是.為過也2？昔者.周武王.有言曰：『百姓.有過，在予󠇡.一人。』上不明.則下不󠇡治，相不賢.則國不寧。王其.察之。」
- - 注釋 1.坐：連坐，受他人連累而被罰。 2.令尹獨何人，而不以是為過也：江母的意思是令尹很特別嗎？為何她的兒子江乙要因別人(王宮竊賊)犯罪而受連坐罰，令尹卻不必因她家遭竊也被罰？
