  instruction: 請閱讀江乙媽媽告御狀的故事，並根據課文內容回答以下問題，以理解故事的脈絡與人物行為。
  reasoning: 本練習旨在將「江乙媽媽告御狀」的課文內容結構化為故事理解的步驟。儘管原文標題為「文言聚光燈：指示與疑問代詞」，但提供的文本中並無針對指示與疑問代詞的具體練習題。因此，本練習的步驟是依據故事的「主角、問題、解決、結果」框架，並結合原文中的開放性問題來設計，以幫助學生理解敘事內容。
  steps:
  - prompt: 根據導讀與課文內容，本故事中為兒子打抱不平的主要人物是誰？
    type: select
    options:
    - 江乙
    - 令尹
    - 楚王
    - 江乙媽媽
    answer: 3
    reasoning: 導讀明確指出「又聰明又勇敢的江乙媽媽挺身而出，就跑到王宮找楚王，為自己的兒子打抱不平了。」因此江乙媽媽是主要人物。
  - prompt: 江乙媽媽為何要向楚王告狀？她認為最主要的問題是什麼？
    type: select
    options:
    - 王宮發生竊案
    - 令尹偷了她家的布
    - 江乙因王宮失竊被免職
    - 楚國有太多小偷
    answer: 2
    reasoning: 導讀說明「東西又不是江乙偷的，結果他被免職，說起來實在很寃枉。」這是江乙媽媽行動的根本原因。她告狀說令尹偷布是策略，而非根本問題。
  - prompt: 江乙媽媽為了替兒子洗刷冤屈，她採取了什麼行動？
    type: select
    options:
    - 直接找令尹理論
    - 向楚王誣告令尹偷竊
    - 向楚王陳述令尹治國不力，並類比兒子受罰的不公
    - 放棄為兒子申冤
    answer: 2
    reasoning: 課文對話中，江乙媽媽先是「誣告」令尹偷布，接著解釋「意思是令尹沒有把國家治理好，才出現這麼多小偷，我家掉了東西，他當然要負責。」最後以「對啊，那王宮掉了東西，又跟我兒子有什麼關係？」點出核心，並在古文今譯中詳細闡述了其類比推理的過程。
  - prompt: 江乙媽媽說了這麼多，你覺得有道理嗎？最後，她有達到目的嗎？
    type: free_text
    reasoning: 這是原文中提出的開放性問題，答案未在提供的文本中直接給出，需要學生思考並在閱讀完整課文後才能得知最終結果。原文提示「答案就隱藏在本課的某一頁中」。
