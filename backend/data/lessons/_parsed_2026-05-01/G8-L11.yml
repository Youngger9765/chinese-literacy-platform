vocabulary:
- word: 殘骸
  definition: 災難或事故後留下的破碎遺體、碎片。
- word: 邊陲
  definition: 最偏遠、離市中心最遠的地區。
- word: 日益猖獗
  definition: 一日比一日更嚴重，越來越難控制。
- word: 人心惶惶
  definition: 大家都很害怕，氣氛緊張。
- word: 束手無策
  definition: 「束手」：把手綁起來；「無策」：沒有辦法。想不出辦法、無能為力，只能乾著急。
- word: 荒蕪
  definition: 沒人整理，雜草叢生，很荒涼。
- word: 攫取
  definition: 猛力抓住並奪走。
- word: _霧靄
  definition: 霧氣很濃、景物朦朧不清。
- word: 眾目睽睽
  definition: 「眾目」：很多眼睛。很多人都在看，大家都看得很清楚。
- word: 蠶食鯨吞
  definition: 「蠶食」：像蠶吃葉子，一口一口慢慢啃；「鯨吞」：像鯨魚吞食，吞很大一口。一點一點或大口大口地侵占別人的地盤、資源，越占越多。
