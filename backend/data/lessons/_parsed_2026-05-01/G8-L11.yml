multiple_choice:
- question: 1. 本文第２段，為什麼婦女去河邊洗衣「還得請兩名壯丁持矛守望」？
  options:
  - 河水可能暴漲，洗衣時需要防洪以免被沖走
  - 河邊常有小偷出沒，洗衣時需要防賊搶東西
  - 虎患已嚴重到日常活動，也得防虎突然來襲
  - 官府常在河邊盤查，洗衣時需要有人出面作證
  answer: C
- question: 2. 科貝不盲目搜山、先走遍村莊訪察時間與地形，最主要的用意是什麼？
  options:
  - 他想拖延時間多待幾天，順便提高酬金與待遇
  - 他先蒐集線索推定路線，才有辦法設伏圍捕老虎
  - 他想把功勞集中在自己身上，避免村民分走功勞
  - 他怕再次失手造成意外，因此先到處提醒村民小心
  answer: B
- question: 3. 根據本文「人口增加、農園擴大、棲地被侵占」的說明，下列哪一項最符合作者對「人虎衝突增加」原因的推論？
  options:
  - 棲地被侵占→生活重疊→衝突變多
  - 村民越害怕→老虎越興奮→衝突變多
  - 老虎更聰明→學會偷襲→衝突變多
  - 火把更少見→老虎更大胆→衝突變多
  answer: A
- question: 4. 第２段連續寫了「夜裡／清晨／正午」的虎襲情境，主要用意是什麼？
  options:
  - 用時間順序交代作息，讓讀者知道村民一天怎麼過
  - 用連續列舉堆疊危機，營造無所不在的壓迫恐懼感
  - 用反覆時間提示規律，讓讀者掌握老虎行動的節奏
  - 用固定時間點作鋪陳，暗示獵人出場的時機即將到來
  answer: B
- question: 5. 下列哪一項最能概括全文主旨？
  options:
  - 文章著重歌頌獵人英勇除害，成功獵殺猛虎以安定人心
  - 文章強調虎患殘酷可怕，主張必須徹底圍剿才能自保
  - 文章重點在追虎與伏擊技巧，呈現獵虎過程並教人方法
  - 文章透過虎襲案例反思，指出人虎衝突常與人類行為相關
  answer: D
