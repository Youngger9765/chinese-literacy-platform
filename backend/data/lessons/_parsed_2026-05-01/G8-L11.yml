title: 虎襲事件的真相：誰才是受害者？
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  1900年，在尼泊爾與印度交界的邊陲山村，一名村民背著柴刀上山，日落仍未歸。眾人循路搜尋，只在竹林旁找到落下的柴刀、山澗邊幾片沾血碎布，以及留著深刻齒痕的殘骸——兇手是一隻孟加拉虎。 虎患日益猖獗：夜裡牠跳上屋頂，攫取靠窗熟睡的孩子；清晨在田埂長草間潛伏，襲擊白髮老人；甚至正午也敢在眾目睽睽下，將割草的婦人拖入林中。人心惶惶，恐懼像霧靄般漫進村落，午後陽光仍灼熱，家家戶戶已緊閉木門；婦女去河邊洗衣，還得請兩名壯丁持矛守望。 這隻食人虎持續危害村民七、八年，尼泊爾國王曾調集上千士兵圍剿，峽谷火把綿延，卻不見虎影；反倒是印度一側陸續傳出死傷，許多村子成了「死村」，田園荒蕪、長草沒󠇡膝，寺廟香火斷絕。兩國因虎襲喪生者累計多達436人，村民談虎色變，卻束手無策。 1907年4月，英國獵手吉姆・科貝抵達，局勢才出現轉機。他不盲目搜山，而是花幾星期走遍受害村莊，訪察歷次遇襲的時間與地形，據此推定這隻老虎的出沒路線，並發現牠多挑瘦小的老人、婦女與孩童下手。5月12日，科貝召集了298名村民，人人舉火把、敲鐵鍋，自四面八方逼近老虎藏身處，噪音迫使老虎自山坳衝出，直闖谷底伏擊圈。科貝藏在榕樹後，待老虎離得只有幾步遠，他扣動扳機，子彈打中它的胸口和肩膀。受傷猛虎嘶吼反撲，他又抓過同伴的槍，打中它的腿，這隻作惡多年的猛虎終於轟然倒地。 半晌後，他蹲下扳開虎口，指著獠牙大喊：「你們看！」這隻雌虎右上犬齒斷了一半、右下犬齒齊根折斷，只有槍擊才可能造成這樣的斷齒。眾人這才明白：斷齒使牠無法正常獵捕水牛、花鹿與野豬，讓牠成為殺人機器的原因。 1929年，印度的另一個地區又發生虎襲事件，四年內64人喪命，科貝再次應邀為民除害，他在1,295平方公里的熱帶叢林裡，獵殺了一隻雌虎和牠的幼虎，雌虎已老邁，爪子破損變形，一隻犬齒折斷，門齒磨耗到接近牙床。1930年代，科貝又獵殺了兩頭食人虎：一隻公虎殺害了3個兒童，牠下顎犬齒斷裂，身上有多處槍傷；另一隻殺害4人的母虎，身上有兩處槍傷，其中一處已長期化膿。這些成為人們噩夢的惡虎都有什麼共同點，你發現了嗎？ 此外，從英國人1750年代在印度實際掌權後，兩百年間，總人口從一億八千萬成長到三億六千萬人，村莊及農園擴大，人類對野生動物棲地蠶食鯨吞，人虎生活重疊後，衝突自然增加。 在了解影響老虎吃人背後的這兩重結構性的因素之後，柯貝對老虎有了深深的同情，最後放下他愈顯沈重的獵槍，拿起相機，四處奔走呼籲保護老虎，1936年幫著建立了印度第一個國家公園，這個後來以他的名字命名的公園，成了老虎的庇護所。現在在公園的博物館裡，還能看到這隻有史以來殺人最多的老虎標本，最顯眼的就是那兩顆斷牙呢。
