vocabulary:
- word: 一息尚存
  definition: 還有一點氣息存在，表示生命危急但還活著。
- word: 號叫
  definition: 大叫。
- word: 杳無人煙
  definition: 比喻荒涼無人居住、很少人的地方。
- word: 手無寸鐵
  definition: 鐵指武器，在此指的是手裡沒有任何武器。
- word: 陰黯
  definition: 天陰，昏暗不明。
- word: 倖存
  definition: 僥倖活下來。
- word: 險峻
  definition: 地勢高聳危險。
- word: 驚心動魄
  definition: 驚險刺激、通常形容難忘的經歷、旅程或冒險。
- word: 山坳
  definition: 兩山間凹下的地方。
- word: 譁眾取寵
  definition: 用大眾喜歡的話或行動來吸引他人的注意。
- word: 回天乏術
  definition: 病情嚴重無法挽救。
- word: 一命嗚呼
  definition: 即「死亡」。
- word: 攫
  definition: 指鳥獸用爪抓取獵物。
