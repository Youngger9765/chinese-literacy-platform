discussion_content:
- 3.在這篇文章中，我們學到了對文章提出質疑以及上網找證據。含光的品格也是值得我們學習，請問看完了這篇文章，你覺得主角──含光有什麼人格特質？請說明理由。
- 例：我覺得含光很勇敢，因為他不害怕死亡，敢徒手打老虎。
- 換你試試看：我覺得含光很 友愛兄弟 ，因為他為了救弟弟，揹著弟弟下山，並找醫生醫治他 。
- （ B ）1. 下列文句，何者語詞使用最恰當?
- A.這裡風光明媚，是「杳無人煙」的旅遊勝地
- B.這部電影有許多令人「驚心動魄」的火爆場面，超級可怕
- C.這個道士學藝不精，破綻百出，真是「回天乏術」
- D.做事應用「譁眾取寵」的態度，博取流量及曝光度
- （ B ）2. 根據作者的說法，為什麼含光可以擊退老虎、救回弟弟？
- A.因為含光有道士的即時幫忙和提醒
- B.老虎可能身體狀態不佳，不敵人類
- C.因為含光是百年難得一見的大力士
- D.含光不怕死的吮吸弟弟傷口的毒血
- （ C ）3. 根據本課內容，何者敘述為真？
- A.故事發生的地點是人跡眾多地方
- B.弟弟受傷過重，從頭到尾未甦醒
- C.含光為救弟弟，不顧自身的安全
- D.故事中的老虎敏捷迅速、很強壯
- （ A ）4. 請問這篇文章中，作者（曾世杰）最想傳達什麼理念給讀者？
- A.對任何事情都要保持先懷疑，後求證的態度
- B.批判古人在記載故事都十分潦草、不求謹慎
- C.宣揚兄弟友愛的理念，互助合作來打退猛虎
- D.宣傳在野外被動物咬傷時，正確的急救方式
- （ C ）5. 這篇文章示範了一種閱讀態度，請選出底下最接近的描述？
- A.文字紀錄是可靠的，隔了350年仍然可信
- B.閱讀時應該全然信任作者
- C.閱讀時可以提出質疑，並蒐集資料
- D.閱讀時寧願相信書，而不要相信網路
