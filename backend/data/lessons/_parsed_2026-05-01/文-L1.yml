multiple_choice:
- question: 1. 下列文句，何者語詞使用最恰當?
  options:
  - 這裡風光明媚，是「杳無人煙」的旅遊勝地
  - 這部電影有許多令人「驚心動魄」的火爆場面，超級可怕
  - 這個道士學藝不精，破綻百出，真是「回天乏術」
  - 做事應用「譁眾取寵」的態度，博取流量及曝光度
  answer: B
- question: 2. 根據作者的說法，為什麼含光可以擊退老虎、救回弟弟？
  options:
  - 因為含光有道士的即時幫忙和提醒
  - 老虎可能身體狀態不佳，不敵人類
  - 因為含光是百年難得一見的大力士
  - 含光不怕死的吮吸弟弟傷口的毒血
  answer: B
- question: 3. 根據本課內容，何者敘述為真？
  options:
  - 故事發生的地點是人跡眾多地方
  - 弟弟受傷過重，從頭到尾未甦醒
  - 含光為救弟弟，不顧自身的安全
  - 故事中的老虎敏捷迅速、很強壯
  answer: C
- question: 4. 請問這篇文章中，作者（曾世杰）最想傳達什麼理念給讀者？
  options:
  - 對任何事情都要保持先懷疑，後求證的態度
  - 批判古人在記載故事都十分潦草、不求謹慎
  - 宣揚兄弟友愛的理念，互助合作來打退猛虎
  - 宣傳在野外被動物咬傷時，正確的急救方式
  answer: A
- question: 5. 這篇文章示範了一種閱讀態度，請選出底下最接近的描述？
  options:
  - 文字紀錄是可靠的，隔了350年仍然可信
  - 閱讀時應該全然信任作者
  - 閱讀時可以提出質疑，並蒐集資料
  - 閱讀時寧願相信書，而不要相信網路
  answer: C
