spotlight_raw_text: '閱讀聚光燈

  找出故事道理

  　　你喜歡看故事嗎？相信很多人的答案都是肯定的。故事到底有什麼魔力讓人想要一看再看呢？原來，看故事能讓讀者身歷其境，對主角產生認同感，因而更能體驗到作者想傳達的道理，因此更具說服力，也更容易被記住。

  　　然而，要理解作者在故事裡想傳達的核心理念，不能只有讀者個人的主觀看法，還需要從文本中找到足夠的支持證據。舉例來說：

  　　例一：正太與小豬的第十一段

  原來啊，豬本來小小的，很輕，但牠每天都長大一點點，這一點點的變化，抱的時候根本感覺不出來。每天加重一點點，加重一點點，根本感覺不出來有多難。在滴水穿石、循序漸進的努力之後，正太的筋骨肌肉慢慢適應這漸進的挑戰，過了一千多天，男孩變成身材魁梧󠇠、帥氣挺拔的男人，他跑得快、跳得高，能舉起寺裡最重的石臼，一般的匪徒強盜再也不是正太的對手了。

  　　從上面的文字來看，故事強調了循序漸進的努力所帶來的成長與蛻變。因此，我們可以合理推測，作者希望傳達「滴水穿石，只要持續努力，就有可能成功」的理念。

  　　例二：龜兔賽跑

  有一天，烏龜和兔子在聊天，不知不覺說到誰跑得比較快，於是兔子便邀約烏龜比賽跑步。一開始，兔子大幅領先烏龜，但不久後，兔子便開始輕敵，認為即使小睡一下，烏龜仍追趕不上牠，便到路邊睡覺。結果烏龜後來趕上，等到兔子醒了時，烏龜已經到達終點了。


  下面有兩個人的說法，你覺得誰的說法比較合理呢？（請打勾）

  ❶小明說：「作者想要表達驕傲會讓人失敗的道理。因為兔子輕敵、驕傲自滿，才導致失敗。」

  □❷大華說：「作者想要表達驕傲會讓人失敗的道理。因為兔子天性懶惰愛睡覺，才導致失敗。」

  　　你答對了，小明的說法比較能被大家接受，因為他是從文章裡面找出支持的理由：「兔子是因為輕敵，認為即使小睡一下，烏龜也追不上牠。」而大華說：「兔子天性懶惰愛睡覺」，文章中根本沒有提到，這是大華自己講的，不是作者想傳達給讀者的道理。所以，要了解作者想用故事想傳達什麼道理，可以從文章中找支持理由。

  　　那麼，找到支持的理由後，如何用簡單的句子表達作者想傳達的道理呢？可以用兩個問題幫助你思考：

  　　❶文章有沒有強調某種品德？（例如：堅持、勇敢、勤奮）

  　　❷主角的經歷讓我們學到什麼道理？（例如：努力就有回報、勇敢挑戰才能成長）

  　　讓我們用例子說明：

  　　村子裡有四個兄弟，經常為小事爭吵，彼此不團結。一天，父親拿來一捆竹筷，讓每個孩子試著折斷它。他們用盡全力，但無法折斷。接著，父親拆開筷子，讓他們一根一根折，結果輕鬆就折斷了。

  　　父親說：「你們就像這捆筷子，團結在一起，就無比強大；若各自為戰，就容易被擊敗。」兄弟們恍然大悟，從此學會合作，村子也因此變得更繁榮。

  ❶文章強調了什麼品德（請打Ｖ）？【團結合作  □勤奮努力　】

  ❷主角的經歷讓我們學到什麼？（請打Ｖ）

  【團結力量大　　□要聽老人家的話】

  現在就讓我們練習看看吧！

  ◎'
