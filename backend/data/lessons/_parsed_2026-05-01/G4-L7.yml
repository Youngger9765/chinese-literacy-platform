- question: （ Ｂ ）3. 正太剛開始養豬時，對這項任務的想法及態度是什麼？
  options:
  - 他覺得這是一種特殊的武術訓練，興奮不已
  - 他不開心，心中無奈，但還是勉強服從
  - 他認為這是培養耐心的一種方式，欣然接受
  - 他覺得師父簡直把無聊當有趣，氣憤拒絕
  answer: B
- question: 4. 請問興福寺的師父，有教正太武功嗎？
  options:
  - 有，師父一開始就傳授他高深的武術秘技
  - 沒有，師父讓他每天抱豬、養豬，沒有直接教武功
  - 有，師父用特別的方法訓練他，讓他打下良好基礎
  - 沒有，師父只是讓他做雜役，沒有任何訓練的用意
  answer: C
