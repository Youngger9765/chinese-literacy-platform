vocabulary:
- word: 剃度
  definition: 剃頭髮為了當出家人的宗教儀式。
- word: 萬紫千紅
  definition: 形容百花盛開的景象。
- word: 敢怒不敢言
  definition: 心中有怒氣卻沒有勇氣說出來。
- word: 寒氣逼人
  definition: 形容非常寒冷。
- word: 抱頭鼠竄
  definition: 形容慌張逃走時狼狽尷尬的樣子。
- word: 身材魁梧󠇠
  definition: 形容身材高大雄偉。
- word: 惡言相向
  definition: 用惡劣或無禮、侮辱人的話罵人。
- word: 囑咐
  definition: 交代吩咐、叮嚀。
- word: 金風送爽
  definition: 指秋天帶來了涼意。金風指秋天的風。
- word: 帥氣挺拔
  definition: 形容男人外表英俊、身材高大。
- word: 暑氣蒸人
  definition: 指夏天的氣溫很高，讓人感到很濕熱。
- word: 循序漸進
  definition: 按照一定的次序與步驟逐漸推進。
- word: 滴水穿石
  definition: 滴水久了可以穿透石頭。比喻雖然力量小，只要堅持不懈，就能把艱難的事做成。
