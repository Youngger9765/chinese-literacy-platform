discussion_content:
- 破掉的水桶
- 一個農夫每天用兩個水桶從河裡取水回家，其中一個水桶有裂縫，每次走回家時，它總是漏掉一半的水，而另一個水桶則能保持完整的水量。
- |-
  破掉的水桶很自卑，對農夫說：「對不起，我讓你浪費了一半的水。」但農夫笑著回答：「你有沒有注意到，沿路的花都只長在你的那一側？因為你的裂縫讓水滴落在地上，澆灌了這條路旁的花朵，讓我們有了一條美麗的小路！」
- 一、先從文章線索判斷角色的想法
- （一）破掉的水桶
- 1.從文章中找線索，請將「破掉的水桶」說的話用螢光筆畫線。
- 2.想想看，為什麼破掉的水桶會說這句話？(請打勾)
- 它認為自己的裂縫使水流失，覺得自己沒有用，因此感到內疚。
- □ 它擔心農夫會因為它的缺陷而丟棄它，所以試圖討好農夫。
- （二）農夫
- 1.從文章中找線索，請將「農夫」說的話用螢光筆畫線。
- 2.想想看，農夫和破水桶的說法有什麼不同？(請打勾)
- □破水桶認為不應該浪費水，農夫水很多漏掉沒關係。
- 同一件事，破水桶看到負面的缺點，但農夫卻看到正面的優點。
- 二、這篇文章作者想要傳達什麼道理
- 從農夫和破水桶的想法，想一想作者想要傳達什麼道理？(請打勾)
- ❶文章強調了什麼品德？【正向思考 □勤勞努力 】
- ❷主角的經歷讓我們學到什麼道理？(多選)
- □人生應該盡量避免失敗，追求完美才能心靈滿足。
- 每個人都有自己的價值，不必因為不完美而自卑。
- 換個角度，不完美的事物也可能有獨特的貢獻。
- □只要你努力達成目標，過程中的小瑕疵並不重要。
- （ Ａ ）1. 下列語詞，何者使用正確?
- A.那位保鏢「魁梧挺拔」，站在門口架勢十足
- B.炎炎夏日，「金風送爽」，大家熱得滿頭大汗
- C.他得到第一名，高興得「抱頭鼠竄」，與人分享喜悅
- D.她突然靈感爆發，「循序漸進」的寫完了一整本小說
- （ Ｃ ）2. 為什麼正太想進入興福寺學武？
- A.他想變得會作戰，變成將軍
- B.他希望學習佛法，成為高僧
- C.他想學習武功才能打倒惡霸 (文中第一段)
- D.他喜歡寺廟平靜清閒的生活
- （ Ｂ ）3. 正太剛開始養豬時，對這項任務的想法及態度是什麼？
- A.他覺得這是一種特殊的武術訓練，興奮不已
- B.他不開心，心中無奈，但還是勉強服從
- C.他認為這是培養耐心的一種方式，欣然接受
- D.他覺得師父簡直把無聊當有趣，氣憤拒絕
- （ C ）4. 請問興福寺的師父，有教正太武功嗎？
- A.有，師父一開始就傳授他高深的武術秘技
- B.沒有，師父讓他每天抱豬、養豬，沒有直接教武功
- C.有，師父用特別的方法訓練他，讓他打下良好基礎
- D.沒有，師父只是讓他做雜役，沒有任何訓練的用意
- （ Ｄ ）5. 請問本文主旨是什麼？
- A.天才出於名門，才能必須由名師傳授
- B一個成功的領袖知道如何運用他人的優勢
- C.工欲善其事，必先利其器
- D.成功沒有捷徑，需要日積月累的努力
