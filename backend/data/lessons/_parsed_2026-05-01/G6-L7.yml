- question: 1. 下列選項「 」中的語詞，何者使用正確?
  options:
  - 小雅騎車跌倒，膝蓋在柏油路上摩擦受傷，傷口「深不可測」
  - 小麗參加運動會的百公尺短跑，「馬不停蹄」的奪得第一名
  - 小洛因為口渴，便到冰箱隨手拿了一瓶「夢寐以求」的水來喝
  - 爸媽時常「掛慮」離家住校的小成，擔心他飲食或作息不夠正常
  answer: D
- question: 2. 根據本文第六段，為什麼珍古德能確認黑猩猩和她交心了呢?
  options:
  - 黑猩猩撇開臉是因為害羞，代表牠接受了珍古德
  - 黑猩猩用動作示意，珍古德因此了解牠不喜歡紅堅果
  - 雖然黑猩猩不要堅果，卻依舊做出握手示好的動作
  - 雖然黑猩猩一開始不要堅果，最後依然收下了堅果
  answer: C
- question: 3. 根據本文，下列選項哪一個最能描述珍古德的一生？
  options:
  - 鍥而不捨地長期投入，終有所成
  - 做出有智慧的抉擇，讓她有所成就
  - 身強體壯，終能克服疾病瘟疫
  - 在母親的陪伴鼓勵下，她走出自己的路
  answer: A
- question: 4. 根據本文，下列何者不是珍古德研究黑猩猩所面臨的挑戰？
  options:
  - 面臨毒蛇猛獸的威脅
  - 不斷被黑猩猩挑釁攻擊
  - 初期不易取得黑猩猩的信任
  - 得到嚴重的疾病
  answer: B
- question: 5. 根據本文，黑猩猩開始與人類接觸後，雙方的關係會如何變化？
  options:
  - 防衛→信任→接納
  - 接納→防衛→信任
  - 接納→信任→防衛
  - 防衛→接納→信任
  answer: D
