spotlight_raw_text: "閱讀聚光燈\n摘要策略—故事結構 一、找到文章裡的故事體結構\n全文共有９個自然段，它們分別屬於「背景」、「起因」、「經過」、「結果」的故事結構。請你試著在底下空格中，填入各段落的阿拉伯數字，例如第一段，就寫1。\n故事結構\n背景\n起因\n經過\n結果\n自然段\n第【 1 】段\n第【2-3】段\n第【４-7】段\n第【8-9】段\n二、為每個故事結構做摘要（以「背景」和「起因」為例）\n1.找出背景的摘要：背景包含故事發生的時間、地點、人物或相關補充。\n珍古德因為家庭經濟因素，高中畢業後沒有繼續念大學。她小時候最喜愛《杜立德醫生非洲歷險記》這本書，書中描述杜立德醫生到非洲，把一群得了瘟疫的猴子拯救出來的故事。她一次又一次的閱讀，把關於464820-1143000非洲、叢林和各種動物的鏡頭，深深的烙在心靈深處，總是夢想著去非洲探險。成年後，工作之餘，她總是在自然歷史博物館裡，大量閱讀有關動物生態的各種書籍。\n(1)本段內容為故事的背景，主要說明珍古德去非洲之前的基本訊息。\n(2)畫出與背景相關的關鍵訊息：\n7848601587500找關鍵訊息的訣竅是「事情事情，重事不重情！」也就是說，「人事時地、如何、為何」才是重要的關鍵訊息。而文章中關於情緒的描述通常是不重要的，可以刪去。例如，烙在心靈深處、血液近乎沸騰，這些情緒的描寫都可刪除。\n首先先畫出重要的人物珍古德。\n本文主題是黑猩猩的守護者，黑猩猩在非洲，因此非洲也是重要的訊息。\n而杜立德醫生非洲歷險記這本書是讓珍古德想去非洲的一個重要元素，因此也要畫起來。\n(3)串連關鍵訊息：請將關鍵訊息加上連接詞後串連成完整通順的句子。\n珍古德 小時候 《杜立德醫生非洲歷險記》 夢想著去非洲探險\n【珍古德小時候因為讀了《杜立德醫生非洲歷險記》，所以夢想著去非洲探險。                             】\n2.找出起因段的摘要：起因是故事開始的原因。\n312420762000    珍古德二十三歲時，終於有機會帶著簡單的行囊，搭上飛機，從英國投向非洲的懷抱。踏上夢寐以求的土地時，她全身的血液近乎沸騰，覺得像在作夢一般。\n    珍古德很快的在當地的博物館找到工作。博物館的館長，當時正想找人到岡貝研究黑猩猩。珍古德雖然沒有大學文憑，也沒有受過專業訓練，但是她對動物的熱情，獲得館長的讚賞，讓她得到了這份工作。珍古德立刻寫信，邀請遠在英國的媽媽陪她一起前往岡貝。\n(1)「起因」即故事開始的原因，主要在說明珍古德因為什麼樣的機緣才會去非洲照顧黑猩猩。\n(2)畫出起因關鍵訊息：請你用螢光筆畫出「珍古德去非洲照顧黑猩猩的原因」有關的關鍵訊息。\n她什麼時候去非洲呢？\n是怎麼得到照顧黑猩猩的機會呢？\n(3)串連關鍵訊息：請你用自己的話將關鍵訊息串連成完整通順的句子。\n【珍古德23歲時去非洲，在博物館找到工作，館長想找她到岡貝研究黑猩猩。                                    】\n恭喜你已經寫出這個故事的背景和起因，接下來我們來整理本課的文章重點嘍！\n\n072\n六"
