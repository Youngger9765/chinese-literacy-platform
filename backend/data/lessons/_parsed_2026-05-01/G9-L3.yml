  支持論點的論據

  17780495612

  議論文通常包含四個要素：論點、支持理由、論據和結論。在議論文中，「論點」是作者的觀點，「支持理由」則是作者支持此觀點的原因，「論據」是作者舉出的客觀事實，用來增加支持理由的說服力，最後下一個「結論」。綜合這些要素，整篇文章就形成了完整的結構，讓讀者能夠清楚地了解作者的立場。

