multiple_choice:
- question: 1. 下列「」的詞語，何者替換後文意改變？
  options:
  - 計算機幫助學生「騰出」更多時間專注於思考——空出
  - 關於這則訊息的真實性仍有待「商榷」，不可輕易相信——討論
  - 體育館興建後，雨天訓練的難題也變得「迎刃而解」——困難重重(意思不同)
  - 在嚴格訓練之下，球隊實力迅速「躍升」，成為聯賽黑馬——提升
  answer: C
- question: 2.第三段最後兩行，作者問道：「以上的教學活動中，哪一個步驟是國中生數學學習的重點？我想應該不會有人說是乘除計算的正確與速度。」請問作者認為文中教師的教學活動其學習重點為何？
  options:
  - 能理解書桌、講桌、窗戶的幾何形狀如何構成
  - 能精確測量各種長方形的長、寬、對角線長度
  - 能夠熟記畢氏定理「a2+b2＝c2」公式
  - 發現所有直角三角形的長邊，都可用畢式定理算出
  answer: D
- question: 3. 文章中提到人類文明發展歷程中的「外化」例子，以下哪一項不屬於「外化」的例子？
  options:
  - 用手機行事曆提醒自己買牛奶
  - 用筆記本寫下未完成的重要事項
  - 熟記數學的重要公式及應用方法
  - 將課堂所學重點打在電腦上
  answer: C
- question: 4. 根據本文，關於數學學習中使用計算機的敘述，下列何者正確？
  options:
  - 手動計算能幫助學生增加理解數學概念，但容易出錯
  - 計算機可以節省時間心力，留下大腦資源做更重要的學習
  - 手動計算能增加學生對數學的興趣，也能深化數學的理解
  - 計算機能減少計算錯誤，但可能會讓學生不思考解題過程
  answer: B
- question: 5. 請問以下選項，何者最能說明作者第五、六段的「寫作目的」？
  options:
  - 詳細描述人類異於禽獸的文明發展歷史
  - 舉各種例子，說明人類的溝通可以跨越時間與空間
  - 講述電腦、網路及行動裝置的興起對書藉與圖書館的衝擊
  - 說明心智外化是世界趨勢，不必排斥在課堂上用計算機
  answer: D
