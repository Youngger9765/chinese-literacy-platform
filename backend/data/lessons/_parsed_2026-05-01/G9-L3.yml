  議論文通常包含四個要素：論點、支持理由、論據和結論。在議論文中，「論點」是作者的觀點，「支持理由」則是作者支持此觀點的原因，「論據」是作者舉出的客觀事實，用來增加支持理由的說服力，最後下一個「結論」。綜合這些要素，整篇文章就形成了完整的結構，讓讀者能夠清楚地了解作者的立場。

  底下只聚焦在支持理由和論據的練習。

  以下為本課整理：

  論點

  學數學可以用計算機。

  支持理由

  因為透過工具外化能降低認知負荷，並有助於達成目標。

  論據

  紙筆

  計算機

  工具

  語言

  文字

  圖書館

  網路


  論據檢核：論據要能證明支持理由是對的

  論據舉例

  檢核提問：

  是否降低認知負荷？

  檢核結果：

  是否適合作為論據？

  例一

  利用紙筆記錄數字

  是   □否

  是   □否

  例二

  計算機幫助計算

  是   □否

  是   □否

  ◎'
