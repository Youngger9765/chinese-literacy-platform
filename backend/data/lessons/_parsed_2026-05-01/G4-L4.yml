multiple_choice:
- question: 1.請問第二段提到：「每一項獨立出來都是很不錯的徒手訓練運動」，句中『徒手』下列那一句使用不當?
  options:
  - 爸爸很厲害，可以徒手攀岩高山
  - 哥哥徒手打死一隻狼，非常勇猛
  - 媽媽徒手炒出了一桌豐盛的晚餐
  - 員警徒手與歹徒搏鬥，終於將他制服
  answer: C
- question: 2.請問蒼藍鴿認為埼玉老師的訓練菜單有效嗎？為什麼？
  options:
  - 有效，因為記者親身體驗，身材有明顯改善
  - 無效，因為這四種方式同時訓練是有衝突的（第二段）
  - 有效，因為徒手運動改善了身材與減輕體重
  - 無效，因為只對埼玉老師一人有效，無法推廣
  answer: B
- question: 3.運動科學對體育選手最主要的幫助是什麼？
  options:
  - 幫助選手了解自身的問題，進而改善（第三段）
  - 實際測量選手的身形，紀錄體重變化
  - 幫忙選手統計專項運動需要做的次數
  - 目前只在羽球及馬拉松領域有所成效
  answer: A
- question: 4.有關運動科學的敘述，下列何者正確？
  options:
  - 運動科學是只限定體育選手專用
  - 運動科學只能在實驗室完成測量
  - 每個人都可以成為專業的運動選手
  - 運動科學可以找出最適合每個人的運動模式
  answer: D
- question: 5.透過運動科學，下列何種方式能有效協助一位短跑選手跑得更快？
  options: []
  answer: C
