spotlight_raw_text: "閱讀聚光燈\n條件複句\n「只要獲得獎牌，就有保送升學的機會。」在這兩個句子裡，前句是「條件」，後句是「結果」，像這樣的句子，就是條件複句。\n常見的句型有:「只要…就…」、「只有…才…」、「便」、「無論…都…」、「不管…都…」、「除非…否則…」、「沒有…就…」。\n1.辨別句子的意思，選出適當的分句，在□打勾。(單選)\n\n條件\n結果\n例\n只要獲得獎牌，\n就有保送升學的機會。\n□就想回家。\n(1)\n只要妹妹想畫畫，\n就會拿起彩色筆。\n□就會穿上游泳衣。\n(2)\n只要  放暑假， \n      □開學，\n就會有很多人出國去玩。\n(3)\n只要有人打電話求助，\n警察就會立刻提供援助。\n□植物就可以快速生長。\n2.連連看，先圈出關聯詞，再將相關的句子連起來。\n條件\n\n產生結果\n只要遵照訓練菜單，\n40005302260●          ●\n就可以加入籃球隊。\n你沒有早睡早起， \n76200-19177000●          ●\n就有機會打敗敵人。\n不管你再怎麼辯解， \n●          ●\n隔天就無精打采。\n哥哥只要再長高一點， \n●          ●\n都改變不了既定的事實。\n除非把功課寫完， \n●          ●\n否則你不能出去玩。\n3.句型大比拚：我們這幾課學過了許多關聯詞，現在我們將這些關聯詞整理在下方的方框內。請你將適當的關聯詞填入括號內，成為一個通順的句子。\n不但…而且　　雖然…但是　　只要…就　　先…然後　　　　　　\n無論…都　　　一邊…一邊　　既…又　　　寧可…也\n(1)小美【 不但    】功課好，【 而且    】熱心助人。 \n(2)【 雖然    】實驗失敗了，【 但是    】愛迪生絲毫不氣餒。\n(3)【 只要   】晚上早點睡，白天上課【 就   】不會打瞌睡了。\n(4)每次出門，爸爸會【 先   】把車子擦乾淨，【 然後    】再開車。\n(5) 【 無論   】謊言聽起來多麼動聽，最終【 都    】會被人拆穿的\n\n51276546100\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
