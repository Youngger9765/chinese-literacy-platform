title: 運動科學
authors: 課文 ：吳漢庭 學習單：張明珠
story_text: 漫畫《一拳超人》中的埼玉老師堅持了三年，每天做一百次的伏地挺身、一百次的仰臥起坐、一百次的深蹲、十公里的長跑，終於擁有一拳就能打倒所有敵人的實力。許多人看完漫畫後，紛紛效法實施「一拳超人訓練菜單」。臺灣有一位記者，實施後貼出成效，身材明顯的改善、體重也呈現明顯的變化；國外也有大同小異的影片支持這是有效的。但是事情有這麼簡單嗎？ 蒼藍鴿醫師（本名吳其穎）從運動科學的角度，在一部影片中說明埼玉老師的訓練菜單並不是那麼妥當：研究證實，這四種運動方式是相互衝突的，有氧運動(訓練心肺功能，如長跑）與其他訓練肌肉的運動，擺在同一天進行，效果會相互抵消。也有科學證據指出，運動訓練把肌肉鍛鍊跟有氧運動的時間分開，才會達到較好的訓練效果；不但如此，近年來，體育界也已不推薦仰臥起坐，因為仰臥起坐對腰部容易造成很大的壓力，容易傷到腰椎，留下後遺症。雖然一拳超人的訓練菜單中，伏地挺身、深蹲都是很不錯的徒手訓練運動，但主要是練胸肌、腿部肌肉，對於背肌跟肩膀是沒有效的，反而會使身體呈現駝背圓肩的狀態。 蒼藍鴿根據科學證據來分析運動訓練，這種方法就是所謂的「運動科學」。運動科學是對體育活動進行科學分析的一個綜合性學科，科學家們了解了人體的特質及各項運動的原理，累󠇡積各種知識之後，才能知道如何有效的進行體育訓練。 運動科學結合現代科技後，在競技運動上有了突破性的發展，教練開始透過精準的測量，幫助運動者在安全的狀況下達到更快、更高、更遠的目標。競技場上，失之毫釐，差之千里，即使是一點點差距，都可能會影響選手的勝敗，有了運動科技加持，教練團可用各種設備測量記錄選手的表現，讓選手看到自己、甚至是對手數據或動作的變化，讓選手明白問題，進而透過加強訓練，改善問題，才能爭取更佳成績。 以味全龍職棒隊投手林逸達為例，他高中時球速就可以到達147公里，但進職棒後一度失速，最多只能投出129到132公里，他非常沮喪󠇡，向運動科學專長的張立帆教練求助。張立帆在分析過高速錄影之後，指出林逸達揮臂沒辦法完全發力，他從運動科學的角度重新設計了林逸達的投球動作，建議他改變揮臂長度，讓手早點到正確的位置，並且要他的跨步再加長一點，修正下盤的發力機制。結果 成效斐然，林逸達的球速在很短的時間內恢復過來，他受訪時表示：「本來手會不舒服，改變機制後，現在速度比較穩定……這樣投會比較輕鬆，對手的負擔不會太大。」這就是運動科學的應用實例。 最後，運動科學並不專屬於體育選手，很多人都對運動有興趣，但不一定可以成為選手，而運動科學的目標則是讓每個人都有機會參與󠇡，讓自己知道如何運動能更有效、更健康，更能享受運動的快樂！
