discussion_content:
- □週一早上慢跑，下午再重訓。 週一早上慢跑，週二早上重訓。
- 1.辨別句子的意思，選出適當的分句，在□打勾。(單選)
- 2.連連看，先圈出關聯詞，再將相關的句子連起來。
- 3.句型大比拚：我們這幾課學過了許多關聯詞，現在我們將這些關聯詞整理在下方的方框內。請你將適當的關聯詞填入括號內，成為一個通順的句子。
- (1)小美【 不但 】功課好，【 而且 】熱心助人。
- (2)【 雖然 】實驗失敗了，【 但是 】愛迪生絲毫不氣餒。
- (3)【 只要 】晚上早點睡，白天上課【 就 】不會打瞌睡了。
- (4)每次出門，爸爸會【 先 】把車子擦乾淨，【 然後 】再開車。
- (5) 【 無論 】謊言聽起來多麼動聽，最終【 都 】會被人拆穿的
