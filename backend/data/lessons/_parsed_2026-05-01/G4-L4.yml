vocabulary:
- word: 大同小異
  definition: 致相同，但有一點點的差異。
- word: 加持
  definition: 保護、扶持或支持。
- word: 負擔
  definition: 承擔，背負。
- word: 失之毫釐，差之千里
  definition: 剛開始極微小的差異，卻對結果造成巨大影響。
- word: 抵消
  definition: 抵減，消除。
- word: 徒手訓練
  definition: 徒手=空手。不需要任何器具的訓練就是徒手訓練。
- word: 成效斐然
  definition: 效果非常好。
- word: 數據
  definition: 研究所得的數量化資料。
- word: 精準
  definition: 非常精密、正確。
- word: 沮喪
  definition: 心情低落到極點。
