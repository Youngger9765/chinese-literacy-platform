spotlight_raw_text: '閱讀聚光燈

  從具體描述提取上位概念

  一篇文章常常會出現很多細節，我們可以把這些細節整理成「上位概念」。例如，「日治時代的1921年…組一支棒球隊」，這裡的「日治時代的1921年」它的「上位概念」就是「成立時間」。讀者閱讀時如果能夠提取「上位概念」，就會讓文章內容變得更簡單、更清楚，也會比較容易抓到文章的重點。

  「上位概念」有兩種不同的層次：

  一、句中細節的上位概念：像剛才的例子就是，句子裡的細節。

  二、段落的上位概念：就是「整個段落要表達的主要意思」，例如，本文的第三段，雖然有幾百個字，但這段主要的意思是「能高團第一次出賽的戰績」，這就是第三段的上位概念。

  本篇要學習的是第一個層次。例如：「他（林桂興）招募了一群阿美族少年，成立了高砂棒球隊。」

  文章中的「林桂興」就是球隊的【□隊員　□對手　創辦人】。

  「創辦人」就是我們從具體描述中提取的上位概念。

  接著，讓我們根據文章內容進行練習。

  　


  ◎'
