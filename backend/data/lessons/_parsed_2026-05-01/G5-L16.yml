multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 這位發明家開啟全新的研究方向，是研發綠能的「先驅」
  - 這家公司產品以品質不佳「著稱」，受到許多消費者批評
  - 小孩子洗完澡後，常常「一絲不苟」在房間裡跑來跑去
  - 他個性內向，不喜歡「嶄露頭角」，但做事十分認真負責
  answer: A
- question: 2. 根據第三段「日本觀眾忍不住瞪大了眼睛」這句話最可能表達什麼意思？
  options:
  - 觀眾想幫裁判找出對手犯規的證據
  - 觀眾對規則不熟，不懂發生什麼事
  - 觀眾對球隊的表現感到震驚與讚嘆
  - 觀眾想表達對比賽結果的無法接受
  answer: C
- question: 3. 根據第五段，60年後能高團的故事仍被日本媒體提及，最可能的原因是什麼？
  options:
  - |-
    能高團的球員後來有多人加入日本職棒球隊 B.球員的表現超出當時他們對臺灣球隊的期待 C.能高團曾經擊敗過所有日本的頂尖棒球隊伍 D.他們比賽時使用阿美族語作為溝通暗號語言。
  answer: B
- question: |-
    4. 本篇文章以「2024 年臺灣奪冠」作為引入，最主要的用意是可能是什麼？ A.提醒讀者臺灣棒球的歷史源自於日治時期 B.引起讀者興趣並銜接到能高團的歷史地位 C.讓讀者對現代棒球情況有更多的深入了解 D.暗示能高團的組成與2024年的冠軍隊有關
  options: []
  answer: B
- question: |-
    5.「2021年，臺灣體操選手李智凱在東京奧運男子鞍馬決賽中，以招式『湯瑪士迴旋』獲得銀牌，創下臺灣在奧運體操項目的最佳成績，被媒體稱為『鞍馬王子』。」根據本段文字，下列內容對應的上位概念何者正確？
  options:
  - 鞍馬──比賽招式 B.鞍馬王子──比賽結果
  - 湯瑪士迴旋──比賽項目 D.創下最佳成績──比賽成就
  answer: D
