  - 這座古蹟他已造訪數次，多年「嶄新」的風貌令他流連忘返
  - 這個巷道狹小，火災時，消防車進退兩難「格格不入」
  - 在老師的一番引導下，他才對自己犯下的錯誤「恍然大悟」
  answer: D
- question: 2. 關於「思念是烏雲，日積月累，不斷膨脹，遮住了我的笑容」這句話的詮釋，下列敘述何者正確？
  options:
  - 思念隨著時間越來越深，並且影響了心情
  - 烏雲像思念一樣，當天氣不好時心情也不好
  - 在思念時特別容易暴飲暴食，因此身形變胖
  - 在陰天時會特別思念，以至於無法展現笑容
  answer: A
- question: 3.作者「升上國中的新鮮感」隨著時間有何變化？下列哪一張圖最能說明？
  options:
  - B.
  answer: C
- question: 4. 根據文章，作者在經歷小學升國中的歷程後有了新的體悟，下列何者最貼近作者的體悟？
  options:
  - 平靜的海造就不出優秀的水手
  - 人生最大的過錯就是錯過，好好珍惜當下
  - 當你面對太陽時，陰影總是落在你的身後
  - 當你真心想完成一件事時，全宇宙都會集合起來幫助你
  answer: B
- question: 5. 下列文句的聯想和運用，何者正確？
  options:
  - 妹妹的個性像綿羊一樣火爆
  - 他嚴肅說話的樣子像個小丑
  - 你閃亮的眼眸彷彿天上的星星
  - 從空中看，地上的房子好像雨滴
  answer: C
