vocabulary:
- word: 韶光
  definition: 時間，常指美好的時光。
- word: 嶄新
  definition: 全新。
- word: 枯燥乏味
  definition: 單調、無趣的。
- word: 眷戀
  definition: 懷念、不捨。
- word: 如影隨形
  definition: 像影子跟著形體，比喻關係密切或一直都在。
- word: 恍然大悟
  definition: 突然醒悟、明白。
- word: 格格不入
  definition: 不適合、難以融入。
- word: 雀躍
  definition: 像雀鳥一樣跳躍，比喻非常開心、興奮。
- word: 翻天覆地
  definition: 發生巨大改變。同「天翻地覆」。
