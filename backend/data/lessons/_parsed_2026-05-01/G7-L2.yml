    - 當訊息很多時，能更清楚文章的重點
    - 方便老師批改作業
    - 可以減少閱讀時間
    answer: 1
    reasoning: 原文提到：「閱讀一篇文章時，當訊息很多時，容易讓人眼花撩亂，若能善用表格做訊息的整理，就能更清楚文章的重點。」選項2直接呼應此說明。
  - prompt: 根據「整理表格步驟」，畫出表格時，「第一列」應該寫什麼？
    type: select
    options:
    - 重點主題項目
    - 比較的對象
    - 總結
    - 文章標題
    answer: 1
    reasoning: 原文「整理表格步驟」A點說明：「先畫出表格，「第一列」先寫出比較的對象」。
  - prompt: 根據「整理表格步驟」，畫出表格時，「第一欄」應該列出什麼？
    type: select
    options:
    - 比較的對象
    - 重點主題項目
    - 文章的結論
    - 作者的姓名
    answer: 1
    reasoning: 原文「整理表格步驟」A點說明：「先畫出表格，...「第一欄」列出重點主題項目」。
  - prompt: 根據文章說明，完成表格填寫後，最後一個步驟是什麼？
    type: select
    options:
    - 直接丟棄表格
    - 根據這個表格進行分析，提出結論
    - 將表格內容背誦下來
    - 與同學分享表格
    answer: 1
    reasoning: 原文在表格範例下方明確指出：「總結：根據這個表格進行分析，提出結論。」
  - prompt: 請根據課文摘要，嘗試畫出一個比較澳洲和臺灣的表格，並填入你認為重要的訊息。完成後，請寫下你的總結。
    type: free_text
    reasoning: 此題旨在引導學生將所學的「用表格整理訊息」策略應用於實際文章（課文摘要），練習辨識比較對象（澳洲與臺灣）、找出比較主題（人口、獎牌數、地理環境、政府支持、學校體育、家長觀念等），並最終根據整理的訊息提出自己的分析與結論，達到策略練習的實踐目的。
