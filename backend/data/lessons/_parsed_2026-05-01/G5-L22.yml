vocabulary:
- word: 不外乎
  definition: 例外的意思，表示所有情況都差不多。
- word: 汗流浹背
  definition: 全身流汗，形容非常辛苦或緊張。
- word: 僧多粥少
  definition: 人多資源少，供不應求。
- word: 達標
  definition: 成績達成當初所設立的標準。
- word: 合作無間󠇡
  definition: 形容彼此間密切合作。
- word: 想方設法
  definition: 用各種方法來達成目標。
- word: 精湛
  definition: 技術或技能非常高超。
- word: 朝思暮想
  definition: 白天晚上都在想念。形容非常想念某個人或非常想做某件事。
