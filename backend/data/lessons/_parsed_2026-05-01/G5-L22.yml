multiple_choice:
- question: 1. 依據本文，下列哪一個成語最能形容職棒選手選秀時面臨的「職業競爭」？
  options:
  - 僧多粥少 B.汗流浹背
  - 精湛出色 D.合作無間
  answer: A
- question: 2. 學生棒球運動員如果無法進入職棒，常見的職業選擇是什麼?
  options:
  - 科技業 B.金融業 C.醫療業 D.服務業
  answer: D
- question: 3. 根據本文，臺灣學生棒球運動員主要面臨的困難是什麼？
  options:
  - 訓練設施不夠完善
  - 學業與棒球訓練難以兼顧
  - 缺乏家長的支持
  - 教練資源不足
  answer: B
- question: 4. 課文中說，不管繼續打球或離開球場，棒球運動員的職涯選擇都受到重重限制，請問最可能的原因是什麼？
  options:
  - 因為職棒選手的職涯太短，平均不到五年
  - 球員經常因過度訓練而受傷，不易進入職棒
  - 球員基礎學力弱，缺乏終身學習的能力
  - 臺灣的訓練環境艱苦，不易培養出球技精湛的選手
  answer: C
- question: 5. 課文最後一句中，「可以有不同於現在的想像」是什麼意思？
  options:
  - 學生球員可以提早轉職，去體驗不同的職業活動
  - 棒球夢可以兼顧學業，未來職涯有更寬廣的選擇
  - 學生球員必須放棄棒球夢，專注於學業才能有好前途
  - 學生球員只能在棒球或學業中選擇一個，全心全意投入
  answer: B
