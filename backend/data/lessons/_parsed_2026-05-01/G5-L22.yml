story_structure_table:
- - 我有一個棒球夢
- - 學生棒球運動員的現狀
  - '1.臺灣國小到高中大約有1萬5千名的學生棒球運動員，大多數在國小【 四年級 】加入棒球隊。

    2.為了當上職業棒球選手，學生付出大量時間進行訓練和比賽，甚至離家住校。'
- - 問題1：學業與訓練難以平衡
  - 因為投入大量時間在【 棒球 】上，學生難以兼顧學業，影響學業成績。
- - 問題2：生涯選擇的困境
  - '高中畢業時，學生面臨兩條路：

    1.繼續打球：只有少數優秀球員能進入職棒，且職棒生涯【 短 】，轉業困難。

    2.離開球場：球員因各種原因離開球場，因缺乏【 學力 】，職業選擇受限。'
- - 解決方法：學校的策略與努力
  - '許多學校以各種方式幫助學生在【 學業與棒球 】間取得平衡。例如：

    1.改善球員的生活設施，並要求【 學業成績 】達標才能參加比賽。

    2.提供【 夜間課輔 】，確保學生基本學力。'
- - 結論
  - 愈多的學校開始幫助學生棒球員兼顧【 球技 】與【 學力 】，希望通過共同努力，讓學生的棒球夢有不同的未來。
