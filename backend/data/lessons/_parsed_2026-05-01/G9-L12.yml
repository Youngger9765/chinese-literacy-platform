spotlight_raw_text: "閱讀聚光燈\n摘要策略──\n小標題的作用：找細節\n　　本課是一篇說明文，文章用小標題分段，分別說明文章主題的不同面向。閱讀這類文章，你只要抓住三件事就能掌握重點：\n\
  一、大主題是什麼？\n二、每個小標題在說明哪個面向？\n三、每個面向最重要關鍵的細節是什麼？\n接下來，我們就來做這三件事：確認大主題與小主題、找重要細節。\n\
  一、確認大主題\n說明文的「大主題」通常就是文章標題。大主題要精簡，也要抓到本文最核心的概念。\n1473261421800下列哪一個名稱，也可做為本文的大主題？（單選）\
  \                    \n □①齊柏林號：升空的第一步   ②福衛八號：守望臺灣的衛星星系\n二、小主題定位＋找重要細節（扣住小主題，挑出最關鍵的句子）\n\
  本文每段資訊都很多，請用小主題抓住這段的重點，並挑出最能支持小主題的「重要細節」句子。\n（一）第3~4段〈宇宙中的巡邏隊〉\n  1.小主題-這段重點最接近哪個標題：(單選)\n\
  ①星系接力觀測：間隔變短、看得更清楚\n□②衛星速度驚人：太空中的高速飛行\n2.找重要細節：哪些句子最能直接支持你選的小主題？(4選2)\n□①福衛八號從2025起逐年發射，到2031全部就位。\n\
  □②衛星在約561公里的太陽同步軌道運行，輪流拍攝。\n③星系完成後，觀測間隔將大幅縮短，能更快取得影像。\n④解析度比以往更高，能看清災區地形、道路、建築、農田。\n\
  3.精簡成一句話(3選1)\n①星系完成後觀測更頻繁、影像更清楚，能更快掌握災情。\n□②衛星在太陽同步軌道運行，所以速度很快、很壯觀。\n□③福衛八號會逐年發射到2031，形成一套完整的觀測系統。\n\
  （二）第５～６段〈沒有「重來」的按鈕〉\n  1.小主題-這段重點最接近哪個標題：(單選)    \n□①太空環境嚴酷：溫差、輻射與隕石　\n②失誤難挽回：發射前要反覆測試\n\
  2.找重要細節：哪些句子最能說明小主題的重點?(4選３)\n①在地球上壞了可以修，但在太空失誤往往覆水難收。\n②太空環境嚴酷，有溫度變化、輻射和微小隕石撞擊。\n\
  ③因此發射前必須在地面經歷無數次的模擬測試。\n□④衛星只有冰箱大小，但內部塞滿精密相機和推進系統。\n3.精簡成一句話(3選1)\n①太空危險多、失誤很難補救，所以發射前必須反覆模擬測試。\n\
  □②太空環境很嚴酷，所以衛星要縮小到冰箱大小，較不易故障。\n□③人造衛星設備太精密了，所以發射成功主要靠運氣。\n（三）第7段〈星光背後的二十年〉\n1.小主題-這段重點最接近哪個標題：(單選)\n\
  ①二十年太空里程：從仰賴他國到自主製造\n□②二十年太空厲害：解析度更高、看得更清楚\n2.找重要細節：哪些句子最能說明小主題的重點？(4選2)\n□①臺灣位處地震帶與颱風路徑上，需要更快掌握災情。\n\
  ②福衛八號有許多關鍵零件，由臺灣本土團隊研發製造。\n③自1999年福衛一號起，二十多年累積，從仰賴他國走到自主製造。\n□④就像運動員磨練成國手，象徵每一步都在挑戰極限。\n\
  3.精簡成一句話(2選1)\n①臺灣累積二十多年太空經驗，逐步從仰賴走向自主製造。\n□②臺灣關鍵零件自己研發，因此衛星資料一定最準也最完整\n（四）第8段〈「齊柏林」守望臺灣〉\n\
  找重要細節：請寫出最能支持「「齊柏林」守望臺灣」的句子。\n透過衛星影像，我們能更快速的掌握災情、守護國土。             \n（五）第9段〈守護家園，也有你一份〉\n\
  請先找出最能支持「守護家園與，也有你一份」的細節，並精簡為一句話。（答案合理即可）\n衛星為我們守望家園，你可以成為那個看見臺灣、珍惜臺灣的人。   \n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 摘要策略 - 小標題的作用：找細節
  instruction: 閱讀說明文時，請抓住大主題、小標題說明面向，以及每個面向最重要關鍵的細節。
  reasoning: 此練習旨在引導學生透過小標題來掌握說明文的結構與重點。整體結構分為確認大主題、小主題定位與找重要細節兩大部分，後者再細分為多個段落練習。每個子任務都對應一個
    `step`，並根據原文的標示（如 `□`）判斷正確答案。
  steps:
  - prompt: 下列哪一個名稱，也可做為本文的大主題？（單選）
    type: select
    options:
    - 齊柏林號：升空的第一步
    - 福衛八號：守望臺灣的衛星星系
    answer: 1
    reasoning: 原文中選項①有 `□` 標示，表示其為錯誤選項。選項②「福衛八號：守望臺灣的衛星星系」更符合文章整體介紹福衛八號計畫及其組成的衛星星系，而非僅指單一衛星「齊柏林號」。
  - prompt: 小主題-這段重點最接近哪個標題：(單選)
    type: select
    options:
    - 星系接力觀測：間隔變短、看得更清楚
    - 衛星速度驚人：太空中的高速飛行
    answer: 0
    reasoning: 原文中選項②有 `□` 標示，表示其為錯誤選項。第3-4段主要描述福衛八號星系如何透過多顆衛星接力，縮短觀測間隔並提升解析度，以更快、更清楚地取得影像，符合選項①的描述。
  - prompt: 找重要細節：哪些句子最能直接支持你選的小主題？(4選2)
    type: select
    options:
    - 福衛八號從2025起逐年發射，到2031全部就位。
    - 衛星在約561公里的太陽同步軌道運行，輪流拍攝。
    - 星系完成後，觀測間隔將大幅縮短，能更快取得影像。
    - 解析度比以往更高，能看清災區地形、道路、建築、農田。
    answer: 2
    reasoning: 原文中選項①和②有 `□` 標示，表示其為錯誤選項。此題為多選題 (4選2)，正確答案為選項③和④。選項③「觀測間隔將大幅縮短」直接支持小主題中的「間隔變短」，選項④「解析度比以往更高」直接支持小主題中的「看得更清楚」。由於
      schema 限制 `answer` 只能為單一索引，故選擇第一個正確選項③作為答案。
  - prompt: 精簡成一句話(3選1)
    type: select
    options:
    - 星系完成後觀測更頻繁、影像更清楚，能更快掌握災情。
    - 衛星在太陽同步軌道運行，所以速度很快、很壯觀。
    - 福衛八號會逐年發射到2031，形成一套完整的觀測系統。
    answer: 0
    reasoning: 原文中選項②和③有 `□` 標示，表示其為錯誤選項。選項①「星系完成後觀測更頻繁、影像更清楚，能更快掌握災情」精確地總結了第3-4段關於福衛八號星系在觀測頻率和影像品質上的提升，以及其應用目的。
  - prompt: 小主題-這段重點最接近哪個標題：(單選)
    type: select
    options:
    - 太空環境嚴酷：溫差、輻射與隕石
    - 失誤難挽回：發射前要反覆測試
    answer: 1
