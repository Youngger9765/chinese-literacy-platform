story_structure_table:
- - 臺灣的太空之眼
- - 衛星任務首部曲(段1～2)
  - 「福衛八號」計畫的首顆衛星-【 齊柏林號 】成功抵達外太空，且回傳了訊息。
- - 宇宙中的巡邏隊(段3～4)
  - '1.福衛八號是一支由【 8顆 】測衛星組成的「衛星星系」。輪流飛過臺灣和周邊地區拍攝。

    2.飛行速度很【 快 】。

    3.星系完成後【 觀測間隔 】大幅縮短，能更快取得影像。

    4.【 解析度 】提升，能看清災區地形、道路、建築、農田等細節'
- - 沒有重來的按鈕(段5～6)
  - '1.送衛星上天挑戰大，一旦【 失誤 】，沒有第二次機會。

    2.太空環境非常【 嚴酷 】，因此，衛星發射前，必須先在地面做無數次的【 模擬測試 】。'
- - 星光背後的二十年(段7)
  - '1.福衛八號有許多關鍵【 零件 】，由臺灣團隊研發製造。

    2.二十年的累積，臺灣終於能自己製造衛星。'
- - 齊柏林守望臺灣(段8)
  - 齊柏林導演生前透過空拍鏡頭，拍下了《看見台灣》。這顆衛星繼承齊柏林的眼睛，讓【 守望臺灣 】的精神在高空延續。
- - 一起守護家園(段9)
  - 衛星為我們守望家園，你可以成為那個【 看見臺灣、珍惜臺灣 】的人。
