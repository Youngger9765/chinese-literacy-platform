multiple_choice:
- question: 1. 本文第三段：衛星「像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區拍攝」，主要想強調什麼？
  options:
  - 衛星會像警車一樣巡邏，監控違法人車
  - 衛星輪班接力，能快速、持續提供觀測
  - 衛星能夠合作拍攝廣大的地球表面區域
  - 衛星日夜不休，需設法提供休息的時間
  answer: B
- question: （ Ｂ ）3. 如果要把第三段「宇宙中的巡邏隊」的內容，整理成一條清楚的因果鏈，下列哪一個最符合？
  options:
  - 衛星速度很快→很快回到同地點→單顆就能即時掌握災情
  - 多顆衛星接力→觀測間隔縮短→影像更快取得，有助於救災
  - 解析度大幅提升→觀測間隔縮短→能用更少的經費攝影
  - 關鍵零件在地製造→衛星更耐輻射震動→遇到隕石也不怕
  answer: B
- question: 5. 這篇文章最主要想表達的核心主旨是什麼？
  options:
  - 即使臺灣可自製人造衛星，仍需仰賴SpaceX的火箭技術
  - 自製的福衛八號星系功能提升，能守望且保護國土的安全
  - 衛星上的工作，一出錯就覆水難收，需要縝密周延的規劃
  - 齊柏林導演的生前作品很感人，應該用人造衛星紀念他
  answer: B
