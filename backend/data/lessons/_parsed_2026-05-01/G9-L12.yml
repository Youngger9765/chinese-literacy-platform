title: 臺灣的太空之眼
authors: 課文 ：林玫伶 學習單：陳淑麗
story_text: 2025年11月29日凌晨，當整座城市萬籟俱寂、沉入夢鄉時，位於新竹的國家太空中心（TASA）卻是一片緊張氣氛。工程師們緊盯螢幕上的數據，現場安靜得連心跳聲都聽得到。
  凌晨2點44分，美國 加州傳來振奮的消息：SpaceX 的獵鷹9號火箭拖著長長的尾焰，載著「福衛八號」計畫的首顆衛星——「齊柏林」號，呼嘯著劃破天際。臺灣時間的清晨5點34分，當螢幕跳出它從外太空傳回的訊號時，現場情緒潰堤、掌聲如雷。
  宇宙中的巡邏隊 福衛八號是一支由8顆光學遙測衛星組成的「衛星星系」，從2025年起逐年發射，到2031年全部就位，形成一套縝密周延的觀測系統。這些衛星會在地球上空約561公里的太陽同步軌道運行，彼此分工合作、相互接力，就像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區的上空拍攝。
  它們的速度比子彈快，一秒鐘可以跑7.5公里，快過方程式賽車300倍，即使如此，仍需90到100分鐘才能繞過臺灣上空一次，只有一顆衛星時，如果發生重大災難（如2025年花蓮
  光復堰塞湖潰決），必須隔好一段時間才能拍到同一個地點；星系完成後，觀測間隔將大幅縮短，能更快取得影像。不僅如此，它們的「視力」也大幅提升，拍攝影像的解析度比以往的衛星更高，可以清楚看見災區地形、道路、建築、農田等地表細節，簡直就是千里眼。
  沒有「重來」的按鈕 送衛星上天，是一場艱鉅的挑戰。在地球上，機器壞了可以修；但在距離地面561公里的軌道上，一旦失誤，往往覆水難收，沒有第二次機會。 太空環境非常嚴酷，衛星必須承受劇烈的溫度變化、強大的輻射、微小隕石的撞擊。因此，衛星在發射前，必須在地面經歷無數次的模擬測試。福衛八號雖然只有冰箱大小，但麻雀雖小，五臟俱全，內部塞滿了精密的相機和推進系統。每一個零件、每一道程序，都必須層層檢驗，才能把它送上太空。也正因為沒有重來的機會，每一次成功都需要長期累積。
  星光背後的二十年 最令人自豪的是，福衛八號有許多關鍵零件，是由臺灣本土團隊研發製造的，這代表我們不再需要仰人鼻息。臺灣的太空之路，絕非一蹴可幾󠇡，自1999年發射「福衛一號」開始，從仰賴他國到臺灣自製，從單顆衛星到衛星星系，二十多年的累積，每一步都在挑戰極限，就像一名運動員從實習生磨練成國手，最終在星空中刻下屬於臺灣的名字。臺灣位處地震帶與颱風路徑上，多少科學家在水滴石穿的努力之後，我們終於有了能夠守望家園、未雨綢繆󠇡的太空科技。
  「齊柏林」守望臺灣 福衛八號首顆衛星的名字，是為了紀念已故的紀錄片導演齊柏林。齊導演生前透過空拍鏡頭，拍下了《看見台灣》。他讓我們看見阿里山的壯闊，也讓我們看見河流被染紅、山林被濫墾的傷痕。他曾說：「當你看見這片土地的美麗與哀愁，才能真正祝福她。」現在，齊導演雖然不在了，但這顆衛星繼承了他的眼睛，透過衛星影像，我們能更快速的掌握災情、守護國土，也讓齊導演的精神在500多公里的高空延續，守望這片我們熱愛的土地。
  守護家園，也有你一份 或許你會覺得外太空遙不可及，但請記得，這不是課本裡的冷冰冰的知識，而是與你我生活休戚與共的真實故事。當這八顆衛星全部就位，敏銳的「太空之眼」就會日夜在五百多公里的高空，為我們守望家園。你不一定要會設計衛星，但你可以成為那個「看見臺灣、珍惜臺灣」的人。
