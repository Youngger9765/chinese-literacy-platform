spotlight_raw_text: '閱讀聚光燈你已經學會怎麼推論作者的觀點和目的，接著，我們就來完整的整理本課的重點嘍！

  主題

  你以為的浪漫可能是跟騷

  情境案例

  阿哲反覆追求小芳，小芳【  壓力　  】很大，甚至失眠。

  迷思來源

  愛情電影常把糾纏行為美化為浪漫行為，誤導了觀眾，

  法律標準

  《跟蹤騷擾防治法》：若違反他人意願，針對特定人反覆做出與【性或性別有關的行為        】，造成對方【恐懼    　】及【影響日常生活　    　】 就構成了「跟蹤騷擾」。

  判斷關鍵

  如何區別浪漫和跟騷，關鍵是【尊重　   】與【同意　　 】。

  行動建議

  遭跟騷應【 找大人 】或【報警    】或【 申請保護令   】。

  結語

  真正的喜歡要從尊重他人開始。

