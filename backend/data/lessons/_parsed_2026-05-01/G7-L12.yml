multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用錯誤？
  options:
  - 小強每天送早餐、寫紙條給小芳，「死纏爛打」的追求讓人反感
  - 自從發生意外後，小美變得像「驚弓之鳥」，聽到車聲就嚇得發抖
  - 在與人互動時，總是堅守「界線」，不輕易干涉別人的選擇
  - 每次聽到警車聲，他就「怦然心動」，彷彿戀愛般的悸動湧上心頭
  answer: D
- question: 2. 作者第二段描述了「許多愛情電影中的誇張舉動和唯美畫面」，作者描述電影情節的目的是什麼？
  options:
  - 浪漫電影的情節其實很無聊，不好看
  - 提醒許多人易被電影影響，誤以為那就是浪漫
  - 只有電影才會出現浪漫情節，現實中不可能
  - 電影主角的行為值得模仿，才能學會浪漫
  answer: B
- question: 3. 下列何者最符合本文的主旨？
  options:
  - 不管對方感受，只要持續付出就精誠所至、金石為開
  - 真正的浪漫在於尊重對方，冒犯對方的行為可能觸法
  - 愛情電影裡的浪漫情節都不切實際，不能當真
  - 遇到跟蹤騷擾要自保、勇敢反擊，以免自己受害
  answer: B
- question: 4. 如果你發現朋友有像阿哲那樣死纏爛打的行為，你會給他哪一項建議最符合本文的觀點？
  options:
  - 勸他尊重對方的決定，不要再干擾對方
  - 鼓勵他更加熱情地表達愛意，對方終會被感動
  - 要他暫時先放棄，隔一段時間再繼續嘗試
  - 建議他設計更有創意的驚喜，好讓對方回心轉意
  answer: A
- question: 5. 若有人不斷在網路社群標註你、留言「我愛你」，叫你「親愛的」，使你困擾，依文章觀點，你最先應採取的行動是？
  options:
  - 默默刪除留言或退出群組
  - 清楚告知對方停止或尋求大人協助
  - 找好朋友去警告，再不停止會有嚴重後果
  - 對方畢竟是好意，默默接受不處理
  answer: B
