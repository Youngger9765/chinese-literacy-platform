discussion_content:
- 〈你以為的浪漫，可能是跟騷〉，這篇文章在談哪件事？
- 浪漫與跟騷的區別 □浪漫的行為 □《跟蹤騷擾防治法》
- 步驟❷──推論作者立場（可和「步驟❸找支持證據」同時進行）
- 1.問自己：作者對文章事件的看法是什麼？支持、反對？
- 2.祕訣：(1)找出表達情緒語詞（開心/害怕…）或例子方向（好/壞）。
- (2)勾選立場。
- (1)閱讀課文後，選出表達被跟騷者情緒的語詞（請打勾，複選）
- 轉身離開 壓力大 輾轉難眠
- (2)判斷選出的語詞是正面或負面的 □正面 負面
- (3)判斷作者看待跟騷的立場 □作者支持死纏 作者反對死纏
- 步驟❸──找支持證據
- 1.問自己：作者用什麼說服我？
- 2.祕訣：通常作者會用「案例、數據、法律、名言」當支持證據。
- 真實案例 □名人採訪 法律條文 □影視數據
- 步驟❹──推論寫作目的
- 1.問自己：作者想要影響我什麼？
- 2.祕訣：呼籲句、結論段重點
- (1)結尾呼籲：「如果真心喜歡，就從尊重開始！」
- (2)作者想讓我知道：
- □喜歡一個人要不顧一切、以浪漫方式追求
- 追求異性時，要尊重別人意願，避免觸法
- 二、挑戰題：
- 再讀一個短文，看看你是否可以讀出作者的主要觀點和寫作目的。
- 別讓紙吸管成為下一個塑膠袋
- |-
  為響應減塑，許多飲料店改用紙吸管。但不少消費者已養成用完即丟的習慣，因此常一次拿幾支吸管，以備不時之需。環保團體調查發現，一些觀光區紙吸管一週的垃圾量竟高於過去使用塑膠吸管時期。此外，多數紙吸管難以有效回收處理，最終仍將送進焚化爐。減塑真正該做的是「少用一次性吸管」，而非僅將材質從塑膠換成紙。下次點飲料前，先問自己──我真的需要吸管嗎？
- 步驟❶──先看焦點
- 1.問自己：這篇在談「哪件事」？
- 2.這篇文章主要關注哪件事情？（請打勾，單選）
- □塑膠袋污染 一次性吸管帶來的環境問題
- 步驟❷──推論作者立場
- 1.問自己：作者看法是什麼？支持、反對？
- 2.根據標題，作者態度是？（請打勾，單選）
- □紙吸管能解決塑膠污染問題
- 應該減少使用一次性用品，而非僅更換材質
- 步驟❸──找支持證據
- 1.問自己：作者用什麼說服我？
- 2.文中哪兩項資訊用來支持作者立場？（請打勾，複選）
- 調查發現某些景點的紙吸管垃圾量甚至比塑膠吸管更多
- 多數紙吸管仍難以有效回收，只能送入焚化爐
- □飲料店為消費者提供紙吸管，增加了消費成本
- 步驟❹──推論寫作目的
- 1.問自己：作者想要影響我什麼？
- 2.作者寫這篇短文想讓我知道：
- □提醒讀者減少飲料的購買頻率
- 鼓勵讀者盡量不要使用一次性吸管
- □鼓勵讀者多使用紙吸管而非塑膠吸管
