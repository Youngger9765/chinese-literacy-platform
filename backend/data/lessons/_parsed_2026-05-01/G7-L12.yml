title: 你以為的浪漫可能是跟騷
authors: 課文 ：林玫伶 學習單：陳淑麗
story_text: 「小芳，我真的很喜歡你，再給我一個機會吧！」阿哲第五次向小芳告白時，小芳臉色一沉，轉身離開。儘管她多次明確拒絕，阿哲卻完全不放棄。他常在校門口等她，頻繁傳訊息問她在哪裡、跟誰一起，甚至趁人不注意時將情書塞進她的書包。最近，他還開始在小芳夜間回家的路上守候。小芳感到壓力越來越大，走過小巷時聽到腳步聲，她會像驚弓之鳥般的回頭張望，夜裡甚至輾轉難眠。 在許多愛情電影中，主角為了追求心儀對象，常做出誇張舉動：守候在對方常去的場所、悄悄監視行蹤、送上鮮花禮物，甚至在被拒絕後仍然堅持不放棄。這些情節配上動人音樂與唯美畫面，滿滿的愛情元素，讓觀眾怦然心動，誤以為這就是浪漫的模樣。現實中，類似行為並不少見。有人相信，只要真心付出、鍥而不捨，精誠所至，金石為開，對方終會被感動。然而，當這種自以為是的「浪漫」讓對方感到不安或被打擾時，它就不再是愛情的象徵，而可能成為法律上的問題。 根據民國111年施行的《跟蹤騷擾防治法》（簡稱《跟騷法》），若違反他人意願，反覆或持續針對特定人做出與性或性別有關的行為，例如監視行蹤、反覆跟隨、不斷傳送訊息或一再告白，導致對方感到恐懼、焦慮，影響其學習、工作或日常生活，就構成了「跟蹤騷擾」。阿哲的行為——守候、追問、強塞情書——看似深情，卻已符合跟騷的特徵。這些舉動並非浪漫，而是對人際界線的侵犯，可能已經觸犯法律。 或許你會問：「浪漫和跟騷該如何區分？」這個問題確實不容易回答，因為每個人對行為的感受不同，有人喜歡收到禮物，覺得溫馨；有人卻視為壓力，感到不適。關鍵在於「尊重」與「同意」。當你對某人表達心意時，是否考慮過對方的意願？例如，你想送同學回家，可以先問：「我可以陪你走一段嗎？」若對方同意，這是雙方都自在的互動；若被拒絕，真正的喜歡應該是尊重對方的決定，停止進一步的行動。若不尊重對方的意願，無論初衷多麼美好，都可能變成騷擾，甚至會帶來法律上的問題。 同樣的，若你遇到讓人不舒服的「浪漫」行為，比如不斷靠近你、糾纏你，讓你感到被打擾或害怕時，你也有權利表達自己的想法；若是遭到跟騷，可以向信任的大人求助，或向警方報案、甚至申請保護令。 感情無法勉強，浪漫更不是誇張的付出或死纏爛打。如果真心喜歡一個人，那就從學習尊重對方開始吧！
