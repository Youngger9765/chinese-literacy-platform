- question: 3. 下列哪一個選項，最能看出荀巨伯的人格特質？
  options:
  - 荀巨伯遠看友人疾，值胡賊攻郡
  - 我輩無義之人，而入有義之國
  - 大軍至，一郡盡空，汝何男子，而敢獨止
  - 友人有疾，不忍委之，寧以我身代友人命
  answer: D
- question: 4. 下列哪一個選項中的代詞代表荀巨伯的朋友？
  options:
