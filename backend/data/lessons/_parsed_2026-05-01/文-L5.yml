  - 「友人有疾，不忍委之」的「之」
  - 「汝何男子，而敢獨止」的「汝」
  - 「遠來相󠇡視，子令吾去」的「吾」
  answer: B
- question: 5.「重義的荀巨伯」一文的主旨近似於下列何者？
  options:
  - 勿以善小而不為，勿以惡小而為之
  - 改變自己是自救，影響別人是救人
  - 良藥苦口利於病，忠言逆耳利於行
  - 為人若真誠有德，自能感召人心
  answer: D
- question: 6. 武俠小說中的人物，常以謙遜的口吻自稱。下列哪個人物沒有使用自謙詞？
  options:
