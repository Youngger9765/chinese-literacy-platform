spotlight_raw_text: "文言聚光燈：人稱代詞\n文言文類型\n記敘人物\t\n\n-27940-18224500第5課  重義的荀巨伯  \n學習單：\n\
  王淑瑱\n古文今譯\n荀巨伯到很遠的地方去看望生病的朋友，正巧遇上胡兵準備攻打這座城。朋友告訴荀巨伯說：「我就要死了，你趕快離開吧！」荀巨伯說：「我遠道來看你，現在有危險了，你就叫我丟下你自己逃命去，這種敗壞道義而求取生路的事，難道我荀巨伯做得出來嗎？」\n\
  胡兵進城後，一看見荀巨伯就說：「大軍到來，整座城全部都空了，你是什麼人？竟敢獨自留在這裏？」荀巨伯說：「我的朋友身患重病，我不忍心拋下他，寧願用我的命換我朋友的命。」\n\
  在場的胡兵聽了這番話相互議論說：「我們這些不懂道義的人，竟然入侵了這樣重道義的國家！」於是撤軍回去，整座城的人因此全都獲得了保全。\n73850544894500\n\
  \n南朝宋・劉義慶(編)\n \n荀巨伯.遠看.友人疾，值胡賊.1攻郡。友人語\U000E01E1巨伯.曰：「吾今.死矣，子可去！」巨伯曰：「遠來.相\U000E01E1\
  視2，子令.吾去；敗義.以求生，豈.荀巨伯所行邪？」\n賊既至，謂巨伯曰：「大軍至，一\U000E01E1郡.盡空，汝何.男子，而敢獨止？」巨伯曰：「友人有疾，不忍.委之，寧以我身.代友人命。」賊相\U000E01E1\
  謂曰：「我輩.無義之人，而入.有義之國！」遂.班軍而還\U000E01E1，一\U000E01E1郡並獲全。\n487643185345注釋\n1.胡賊：胡，古代對外族的通稱，秦、漢時多指北方的匈奴。因外族入侵中國，中國屬於「被侵略者」，所以稱外族的軍隊為「胡賊」，表示鄙視、憤怒的情緒。\n\
  2.「相」視：具代詞功能的助詞。這裡的代詞指的是「你」；「相視」的意思是「看你」。\n-4953090301\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n\
  2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。00\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n\
