  strategy_name: 文言聚光燈：人稱代詞
  instruction: 請閱讀課文，並辨識文中人稱代詞所指涉的對象。
  reasoning: 根據原文「文言聚光燈：人稱代詞」的策略主題，設計題目以辨識文中人稱代詞的指涉對象。題目選取了原文中包含人稱代詞的關鍵句子，並參考課文摘要的段落劃分，但修正了摘要中可能存在的斷句或標示問題，以確保題目的準確性。
  steps:
  - prompt: 在「友人語󠇡巨伯曰：『吾今死矣，子可去！』」這句話中，『吾』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 0
    reasoning: 友人對荀巨伯說話，故「吾」指友人。
  - prompt: 在「友人語󠇡巨伯曰：『吾今死矣，子可去！』」這句話中，『子』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 1
    reasoning: 友人對荀巨伯說話，故「子」指荀巨伯。
  - prompt: 在「遠來相󠇡視，子令吾去」這句話中，『相』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 0
    reasoning: 荀巨伯說「遠來相視」，根據注釋，「相」在此作「你」解，指友人。
  - prompt: 在「遠來相󠇡視，子令吾去」這句話中，『子』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 0
    reasoning: 荀巨伯說「子令吾去」，此處「子」指友人。
  - prompt: 在「遠來相󠇡視，子令吾去」這句話中，『吾』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 1
    reasoning: 荀巨伯說「子令吾去」，此處「吾」指荀巨伯自己。
  - prompt: 在「汝何男子，而敢獨止？」這句話中，『汝』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 1
    reasoning: 胡兵進城後對荀巨伯說話，故「汝」指荀巨伯。
  - prompt: 在「友人有疾，不忍委之」這句話中，『之』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 0
    reasoning: 荀巨伯說不忍心拋下「友人」，故「之」指友人。
  - prompt: 在「寧以我身代友人命」這句話中，『我』指的是誰？
    type: select
