multiple_choice:
- question: 1. 下列選項「」中字，何者字音、字義完全正確？
  options:
  - 「豈」荀巨伯所行邪——ㄎㄞˇ，難道
  - 友人有疾，不忍「委」之——ㄊㄨㄛ，委託
  - 「寧」以我身代友人命——ㄋㄧㄥˊ，寧願
  - 「遂」班軍而還——ㄓㄨˊ，於是
  answer: C
- question: 2. 關於「重義的荀巨伯」一文的寫作手法，下列敘述何者最恰當？
  options:
  - 運用對話，凸顯人物個性
  - 夾敘夾議，事理分析清楚
  - 全文採第一人稱敘述
  - 以設問法結尾，激發讀者思考
  answer: A
- question: 3. 下列哪一個選項，最能看出荀巨伯的人格特質？
  options:
  - 荀巨伯遠看友人疾，值胡賊攻郡
  - 我輩無義之人，而入有義之國
  - 大軍至，一郡盡空，汝何男子，而敢獨止
  - 友人有疾，不忍委之，寧以我身代友人命
  answer: D
- question: 4. 下列哪一個選項中的代詞代表荀巨伯的朋友？
  options:
  - 「吾今死矣，子可去」的「子」
  - 「友人有疾，不忍委之」的「之」
  - 「汝何男子，而敢獨止」的「汝」
  - 「遠來相󠇡視，子令吾去」的「吾」
  answer: B
- question: 5.「重義的荀巨伯」一文的主旨近似於下列何者？
  options:
  - 勿以善小而不為，勿以惡小而為之
  - 改變自己是自救，影響別人是救人
  - 良藥苦口利於病，忠言逆耳利於行
  - 為人若真誠有德，自能感召人心
  answer: D
- question: 6. 武俠小說中的人物，常以謙遜的口吻自稱。下列哪個人物沒有使用自謙詞？
  options:
  - 鐵心蘭：「妾身就此告退。」
  - 花無缺：「承蒙閣下對本人的指點。」
  - 燕南天：「這劍法確實是在下自創。」
  - 小魚兒：「敝人這就前往一探究竟。」
  answer: B
- question: |-
    （ Ｃ ）1. 關於本文，下列敘述何者正確？ A.「渡河」、「亡其舟」、「號呼救命」的人都是漁夫 B.漁夫是因為商人重賞才去救人的 C.依據文意，「向許百金」的「許」意思是「許諾」 D.商人的情緒變化依序是驚恐、高傲、憤怒、心虛
  options: []
  answer: C
- question: 3. 這個故事的主旨為何？ A.有錢能使鬼推磨
  options:
  - 人須言而有信
  - 得饒人處且饒人
  - 多行不義必自斃
  answer: B
