    - 胡兵
    answer: 1
    reasoning: 荀巨伯說「寧以我身代友人命」，故「我」指荀巨伯自己。
  - prompt: 在「我輩無義之人，而入有義之國！」這句話中，『我輩』指的是誰？
    type: select
    options:
    - 友人
    - 荀巨伯
    - 胡兵
    answer: 2
