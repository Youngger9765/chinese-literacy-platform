  reasoning: 根據原文的結構，將每個問題或練習轉換為一個步驟（step）。對於單選題，根據原文中選項前的「□」符號來判斷正確答案（無「□」者為正確答案）。對於原文標示「可複選」但 JSON schema 僅支援單選的情況，選擇第一個未標示「□」的選項作為答案，並在該 step 的 reasoning 中說明此限制。開放式問題則使用 free_text 類型。
  steps:
  - prompt: '晚間新聞正播報明天的天氣預報，爺爺坐在電視前的沙發上，早就進入夢鄉。

      問題：爺爺有聽到明天的天氣預報嗎？'
    type: select
    options:
    - 有聽到
    - 沒有聽到
    answer: 1
    reasoning: 根據原文描述「爺爺坐在電視前的沙發上，早就進入夢鄉」，推論爺爺已經睡著，因此沒有聽到天氣預報。
  - prompt: 故事一開始，大媽上公車後看到什麼？
    type: select
    options:
    - 一位年輕的女生坐在博愛座，而車上其他人都站著。
    - 女生主動起身讓位，大媽馬上坐到了博愛座。
    answer: 0
    reasoning: 原文選項中，「一位年輕的女生坐在博愛座，而車上其他人都站著。」沒有「□」，表示為正確答案。課文摘要也描述「一位國中女生...走到唯一空著的博愛座坐下。」
  - prompt: 面對這種情況，你猜大媽的心情是什麼？為什麼？
    type: select
    options:
    - 生氣，因為她認為年輕人不該坐博愛座。
    - 驚喜，因為有人馬上讓座給她。
    answer: 0
    reasoning: 原文選項中，「生氣，因為她認為年輕人不該坐博愛座。」沒有「□」，表示為正確答案。從大媽後續的言行「板起臉，嚷道：『誰家小孩這麼沒教養...』」可推知其生氣不滿。
  - prompt: '段5：大媽眉毛一挑：「我都沒得坐，小孩子裝個病，就有博愛座？真了不起！」

      她「眉毛一挑」，這個動作通常表示什麼？'
    type: select
    options:
    - 驚訝
    - 不高興
    - 想笑
    - 輕視
    answer: 0
    reasoning: 原文標示「可複選」，但 JSON schema 僅支援單選。根據原文選項中沒有「□」的選項為正確答案，此處「驚訝」和「輕視」均無「□」。選擇第一個無「□」的選項「驚訝」作為答案。在語境中，「眉毛一挑」結合諷刺語氣，也常帶有輕視或不滿的意味。
  - prompt: 你覺得「真了不起」的意思是什麼？
    type: select
    options:
    - 她年紀小，生病居然膽敢去坐博愛座，勇氣值得稱讚。
    - 她在稱讚，司機先生明察秋毫、願意助人，值得稱讚。
    - 她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。
    answer: 2
    reasoning: 原文選項中，「她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。」沒有「□」，表示為正確答案。原文後續解釋了「說反話」的例子，明確指出大媽此處是反話。
  - prompt: 段8：明明看大媽不順眼，乘客卻用哪4個字稱讚她?
    type: free_text
    reasoning: 此題為開放式問答，要求學生從原文中找出反話的例子。答案為「真了不起」。
  - prompt: 在段5和段8之間還有一句6個字的反話，請你找到，寫在下面。
    type: free_text
    reasoning: 此題為開放式問答，要求學生從原文中找出反話的例子。答案為「好有正義感呀」。
  - prompt: '事件：大媽一上車，看見年輕女生坐在博愛座，板起臉、嚷道「誰家小孩這麼沒教養...」

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 生氣、不滿
    - 驚訝、不解
    answer: 0
    reasoning: 原文表格中，「生氣、不滿」沒有「□」，表示為正確答案。從大媽的言行「板起臉、嚷道」可直接判斷其情緒為生氣不滿。
  - prompt: '事件：聽到司機解釋女生身體不舒服，眉毛一挑，說：「小孩子裝個病...，真了不起！」

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 稱讚女生厲害
    - 不服氣、語氣諷刺
    answer: 1
    reasoning: 原文表格中，「不服氣、語氣諷刺」沒有「□」，表示為正確答案。結合前文對「真了不起」是反話的解釋，可知大媽是不服氣且語氣諷刺。
  - prompt: '事件：阿姨出聲挺女生，提高音量：「唷，好有正義感呀。」

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 覺得被針對、更生氣
    - 真心佩服阿姨講得很好
    answer: 0
    reasoning: 原文表格中，「覺得被針對、更生氣」沒有「□」，表示為正確答案。大媽的回應「好有正義感呀」是反話，顯示她覺得被針對且更生氣。
  - prompt: '事件：聽到有人出聲批評她，更大聲回嗆：「….，我說個話也不行了嗎？」

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 覺得開心，有人注意到
    - 被批評，火氣更大了
    answer: 1
    reasoning: 原文表格中，「被批評，火氣更大了」沒有「□」，表示為正確答案。大媽「更大聲回嗆」的行為直接表明她因被批評而火氣更大。
  - prompt: '事件：司機廣播警告，「我要去投訴你...」

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 想冷靜坐下來
    - 憤怒不甘
    answer: 1
    reasoning: 原文表格中，「憤怒不甘」沒有「□」，表示為正確答案。大媽被警告後仍說「我要去投訴你」，顯示其憤怒且不甘心。
  - prompt: '事件：老奶奶說女生真的生病了，願意讓座，臉紅、連忙擺手說：「…我馬上到站了。」

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 尷尬、丟臉、自覺理虧
    - 還在生氣、不想理會
    answer: 0
    reasoning: 原文表格中，「尷尬、丟臉、自覺理虧」沒有「□」，表示為正確答案。大媽「臉紅、連忙擺手」的動作，以及找藉口說「馬上到站了」，都顯示她感到尷尬、丟臉和理虧。
  - prompt: '事件：車子一停，提著大包小包一溜煙下車

      「大媽」的情緒或感受是什麼？'
    type: select
    options:
    - 慚愧或丟臉、急著離開現場
    - 假裝什麼也沒發生
    answer: 0
    reasoning: 原文表格中，「慚愧或丟臉、急著離開現場」沒有「□」，表示為正確答案。大媽「一溜煙下車」的行為，表明她急於離開現場，可能因為慚愧或丟臉。
  - prompt: 從大媽的說話、語氣、動作，我們可以看到，大媽從誤會「生氣」，被提醒理解後，態度轉變為「慚愧」的過程。最後，讓我們來想想，透過大媽的轉變，這個故事想要告訴我們什麼？
    type: select
    options:
    - 人會因為理解而改變態度
    - 發脾氣是解決問題的最好方法。
    - 善意可以化解衝突、消除誤會
    - 不用了解情況，吃虧時就應該生氣
    answer: 0
    reasoning: 原文標示「可複選」，但 JSON schema 僅支援單選。根據原文選項中沒有「□」的選項為正確答案，此處「人會因為理解而改變態度」和「善意可以化解衝突、消除誤會」均無「□」。選擇第一個無「□」的選項「人會因為理解而改變態度」作為答案。這兩個選項都符合故事主旨。
  - prompt: 段六：女生都快哭出來了，勉強要站起來。女生當時最可能的情緒是什麼？
    type: free_text
    reasoning: 此題為開放式問答，要求學生推論女生的情緒。答案為「害怕、委屈」。
  - prompt: 段八：人群聲音：「幹嘛呀，都幾歲了，還這樣講話？真了不起！」講這句話的人，最可能的情緒是什麼？
    type: free_text
    reasoning: 此題為開放式問答，要求學生推論說話者的情緒。答案為「忿忿不平／不屑」。
