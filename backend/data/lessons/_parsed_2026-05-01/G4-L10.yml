multiple_choice:
- question: 1. 課文中有許多不認識國中女生的陌生人，都出來對大媽說話了，下列哪一個選項，最能夠描述這些人的共同特點？
  options:
  - 熱心公益 B.誠懇善良 C.智慧溫暖 D.見義勇為
  answer: D
- question: 2. 從「女生都快哭出來了，勉強要站起來」，可以推測女生當時想做什麼？
  options:
  - 她感到害怕，想把座位讓給大媽 B.她覺得休息夠了，不想再坐 C.她生氣地想站起來跟大媽爭吵 D.她正好要下車，所以站起來
  answer: A
- question: 3. 從司機在故事中「說的話、做的事」，可以推論他是個怎樣的人？
  options:
  - 溫暖又有智慧的人 B.凶巴巴又不講理的人 C.冷淡、不關心乘客的人 D.害羞、不敢說話的人
  answer: A
- question: 4. 這篇故事主要想表達什麼？
  options:
  - |-
    不舒服的時候可以坐博愛座，司機會幫忙留座位 B.互相體諒和幫助可以化解誤會，讓一天變得美好 C.在公車上大吵大鬧會被司機趕下車 D.年紀大的人通常比較有智慧，要聽從長者意見
  answer: B
- question: |-
    5. 故事中哪一個人物的舉動讓事情發生了轉折，走向美好的結局？A.司機在廣播中警告大聲喧嘩的乘客 B.旁邊的阿姨安慰女學生不要讓座 C.白髮老奶奶主動將座位讓給大媽 D.有人路見不平大聲譴責那位大媽
  options: []
  answer: C
