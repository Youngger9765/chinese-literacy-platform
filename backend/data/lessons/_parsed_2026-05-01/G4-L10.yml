self_check_items:
- 我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
- 我會思考人物說的話是不是真心話，推測他隱藏的真正情緒。
- 我能把故事前後線索連起來，推論大媽情緒的變化，並明白故事想傳達的道理。
