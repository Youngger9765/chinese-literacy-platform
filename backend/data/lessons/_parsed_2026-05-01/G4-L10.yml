vocabulary:
- word: 示意
  definition: 用動作、眼神等方式讓別人知道自己的意思。
- word: 局面
  definition: 事情進行到某一階段時，出現的整體情況或狀態。
- word: 火藥味
  definition: 比喻出現人際衝突時的氣氛，脾氣像火藥一樣快爆炸了。
- word: 不可收拾
  definition: 事情變得太嚴重、混亂，已經沒辦法解決或控制。
- word: 尷尬
  definition: 讓人不好意思，不知道該怎麼辦。
- word: 顫顫巍巍
  definition: 形容人因老弱或害怕而動作不穩、發抖的樣子。
- word: 一溜煙
  definition: 形容動作非常快，像煙一樣迅速不見。
- word: 側目
  definition: 用眼睛斜著看人，通常表示驚訝、不滿、或看不慣。
- word: 路見不平
  definition: 在路上遇到不公正或不合理的事情，挺身而出，打抱不平。
