multiple_choice:
- question: （ Ｂ ）1. 請選出最適合「繪聲繪影」語意的句子：
  options:
  - 他用簡單的語句說明了整件事，大家都聽懂了
  - 她講故事時聲音忽高忽低，手舞足蹈，讓大家彷彿身歷其境
  - 老師用公式解釋原理，大家似懂非懂，低頭猛抄筆記
  - 他只說了一句「事情很複雜」，就結束了報告
  answer: B
- question: 2. 文中說「天空會降下火光」這種說法容易讓人覺得「好像應驗了」，人們會這樣覺得的原因是什麼？
  options:
  - 預言者精確描述了事件的時間與地點
  - 這句話可以套用到太多不同類型的事件上
  - 預言者事先觀察到天文異常現象
  - 人們對天空現象普遍感到恐懼
  answer: B
- question: 3. 「倖存者偏誤」會讓人覺得某個預言很準的原因是什麼？
  options:
  - 人們會只記住應驗的預言，忽略未應驗的
  - 所有應驗的預言都附有科學證據
  - 人們只相信自己經歷過的事
  - 一定要經過災難才能相信預言
  answer: A
- question: 4. 作者提到諾查丹瑪斯和瑪雅曆法的例子，是想告訴我們什麼？
  options:
  - 古代的災難預言比現代更可怕
  - 不要只聽信預言，平時要做好防災準備
  - 災難預言會帶來恐懼，所以多去求神拜佛
  - 透過舉例說明，即使很有名的預言，多數也不準確
  answer: D
- question: 5. 假如未來有一則預言「東亞地區將在未來五年內出現重大自然災害」，根據文章內容，下列哪種行為最合理？
  options:
  - 立即搬離東亞，避免任何可能風險
  - 每天追蹤與預言相符的新聞，確保第一時間得知
  - 評估科學機構的資料，並落實日常防災準備
  - 在網路上大量轉發預言，提醒更多人注意
  answer: C
