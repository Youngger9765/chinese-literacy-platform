vocabulary:
- word: 預言
  definition: 預測未來可能發生的事情。
- word: 風險意識
  definition: 對可能發生的危險或風險有事先的覺察與防範的心理準備。
- word: 雷同
  definition: 形容事物之間太過相似，通常帶有「缺乏創意、重複」的負面評價。
- word: 應󠇡驗
  definition: 通常形容事先的預言、推測或夢境等，後來真的發生了。
- word: 點閱率
  definition: 指某個影音或文字內容在網路上被點擊或瀏覽的次數與比例。通常用來衡量該內容的受歡迎程度或曝光效果。
