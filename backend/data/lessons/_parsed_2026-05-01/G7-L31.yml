    - 單一群旅人鴿可能超過十億隻，飛過天空要好幾個小時
    answer: 1
    reasoning: 重點句強調旅人鴿數量驚人，是段落主旨。
  - prompt: 作者寫「超過十億隻、飛過天空要好幾個小時、讓日光失色」主要想讓讀者產生什麼感覺？（單選）
    type: select
    options:
    - 覺得旅人鴿的數量大得難以想像，畫面非常震撼
    - 覺得旅人鴿的外觀很特別，適合做物種辨識
    - 覺得旅人鴿飛行耐力很強，適合研究運動表現
    answer: 0
