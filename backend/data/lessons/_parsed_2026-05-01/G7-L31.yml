  - □①最後一隻旅人鴿在野外存活至1950年 ②世界上最後一隻旅人鴿於1914年在辛辛那提動物園老死 □③旅人鴿已被成功復育，現仍存活
- - 結論
  - 一整個物種因人類活動而消失，提醒我們及早保育的重要 【 課文最後想告訴我們什麼？ 】
