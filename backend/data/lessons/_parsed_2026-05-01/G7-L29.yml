multiple_choice:
- question: 1.根據第二段的說明，「溫室效應假說」主要在說明哪一件事？
  options:
  - 地球本來就會自己變冷變熱，所以近年暖化只是自然循環。
  - 近年天氣變得特別古怪，因此都市人對暖化感受最為明顯。
  - 二氧化碳排放量逐漸升高，所以兩條曲線後來一起往上爬升。
  - 大量二氧化碳使部分熱量不易散出，所以地球逐漸升溫。
  answer: D
- question: ２.第四段為什麼要把時間拉長到 40 萬年來看地球溫度變化？
  options:
  - 為了說明圖一和圖三的資料有限，因此前面的說法都要放棄。
  - 為了提醒讀者改變觀看尺度以後，推論近年暖化要更小心。
  - 為了證明遠古人類已會大量燃燒燃料，因此很早就影響氣候。
  - 為了證明近年暖化只是自然循環，因此與人類活動沒有關係
  answer: B
- question: ３.下列哪一項最能說明這一篇文章的寫作手法和意圖？
  options:
  - 藉由四張圖比較不同訊息，提醒讀者閱讀與推論都要小心。
  - 藉由四張圖介紹暖化現象，直接證明人類活動就是唯一原因。
  - 藉由四張圖整理不同看法，批評部分科學家忽略整體的證據。
  - 藉由四張圖練習答題技巧，提醒學生只要熟記圖表就能作答
  answer: A
- question: ４.如果老師要你只用一句話分別概括圖一和圖二的功能，下列哪一組最合適？
  options:
  - 圖一看近代升溫速度，圖二看長時間冷熱循環。
  - 圖一看升溫現象變化，圖二看暖化可能原因。
  - 圖一看排放與氣溫趨勢，圖二看熱量移動變化。
  - 圖一看生活感受例子，圖二看人類歷史發展。
  answer: B
- question: ５.下面哪一種做法，最符合這一課教的「圖文整合閱讀策略」？
  options:
  - 先讀文字抓出重點，再到圖中找到和文字對應的訊息。
  - 先把整篇文字讀完，再回頭一次把四張圖全部快速看完。
  - 先看圖片猜出大意，再用自己的感覺補上文字沒有寫的內容。
  - 先挑最容易的圖來看，只要圖看懂了就不必細讀文章內容。
  answer: A
