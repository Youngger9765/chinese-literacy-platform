spotlight_raw_text: "閱讀聚光燈\n圖文整合閱讀策略\n前一課我們已經學過圖文整合閱讀策略，知道圖片能幫助我們理解文章重點。讀有插圖的文章時，不能只看文字，也不能只看圖片，而要把文字和圖片對照起來讀。至於先看文字還是先看圖片，並沒有固定的順序。這一課，我們要練習另一種常用的方法：先讀文字，再看圖片。我們用下面4個步驟來進行圖文整合閱讀：\n    ❶先讀文字——抓到重點，想一想：要我從圖中看什麼 \n❷再看圖——讀懂這張圖告訴我們什麼訊息\n❸回到文字——從圖中找對應的訊息\n❹整合文圖——把文和圖合起來想，文圖要表達什麼\n練習一：第一段 vs 圖一 \n步驟❶：先讀文字——抓到重點，想一想：要我從圖中看什麼？\n  小祕訣：文字會告訴我們，哪些地方要看圖。你讀到「請看圖一」「如圖二」這些提示詞時，就要看圖，並問自己這段要你看圖的什麼？\n1.請把第一段文字中，要你看圖的地方畫線\n2.這段要你看圖一的什麼？（單選）\n  ①1850年以來地球平均氣溫的變化趨勢\n  □②1850年以來地球平均氣溫的最高溫度\n步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息\n小祕訣：看圖時，要先看圖名、縱軸、橫軸分別表示什麼，再看整體方向。\n1.圖一主要在說什麼？（單選）\n  □①圖一是張比較圖，讓我們比較不同時期的溫度高低\n  ②圖一是張時間趨勢圖，告訴我們地球氣溫隨時間怎麼變化\n2.下面哪一句最能從圖一直接看出來？（單選）\n  ①1850年以來，地球的平均氣溫持續上升\n  □②1975年以來，上升的速度加快了3倍\n  □③2024年為有記錄以來的最暖年，比20世紀平均高1.29°C，比19世紀高1.46°C\n※小提醒：你發現了嗎？圖一是示意圖，可以看出趨勢，但不一定能直接讀出倍數和精確數字。\n步驟❸：回到文字——從圖中找對應的訊息（單選）\n1.「地球的平均氣溫持續上升」這句，圖一哪裡看得出來？（單選）\n□①線條中間有起伏，表示氣溫沒有持續上升\n②整體來看，雖然氣溫有上有下，但從左到右愈來愈高\n5281295242494\n（單選）00\n（單選）2.「1975年以來，上升的速度加快了3倍」這句，圖一哪裡看得出來？\n①1975年後，線條變得更陡，表示上升速度加快\n□②1975年後，線條位置較高，表示氣溫變得較高\n3.「2024年為有記錄以來的最暖年」這句，讀圖時要注意哪裡？（單選）\n①先找到2024的大概位置，看看它的折線圖是不是來到最高點附近\n□②圖的最左邊是不是落在最低點附近\n步驟❹：整合文圖——把文和圖合起來想，文圖要表達什麼？\n下面哪一句，最能把第一段和圖一的意思一起說清楚？（單選）\n □①地球平均氣溫整體在上升，而且近年來到高點\n ②地球平均氣溫整體在上升，而且1975年後升得更快，近年來到高點\n\n練習二：第二段 vs 圖二 \n步驟❶：先讀文字——抓到重點，想一想：要我從圖中看什麼？ \n  小祕訣：讀到「如圖二」時，就要看圖，想一想：這一段要我從圖中看出的是變化，還是原因？\n1.請把第二段文字中，要你看圖的地方畫線\n2.這段文字要你看圖二的主題是什麼？（單選）\n  □①地球的熱量從太陽來\n  ②地球氣溫上升的原因\n步驟❷：再看圖——先讀懂這圖告訴我們什麼訊息（試著依以下步驟讀圖）\n1.圖二的標題是：   溫室效應示意圖    \n2.兩大星體分別是？ 太陽和   地球    。\n3.兩大星體熱量的方向是？①從太陽射向地球  □②從地球射向太陽\n4.圖二用什麼表示溫室氣體形成的「外套」？\n□①５條由太陽射出的波浪形曲線  ②圍著地球的那條大弧形線 \n5.圖二的什麼地方表示「部分被困住的熱能？」\n①大弧形線和地球間的２個山形曲線  □②有箭頭的３條曲線\n６.圖二的什麼地方表示「被散到外太空的熱能？」\n□①大弧形線和地球間的２個山形曲線  ②有箭頭的３條曲線\n7.圖二主要在說什麼？\n  ①從太陽來的熱量有一部分被溫室氣體困住，不容易散出去\n  □②從太陽來的熱量源源不斷，讓地球氣溫提升，像溫室一樣\n步驟❸：文圖整合——把文和圖合起來想，文圖要表達什麼？\n 下面哪一句，最能把第二段和圖二的意思一起說清楚？（單選）\n□①二氧化碳像厚外套，讓太陽的熱量都留在地球上，所以地球逐漸升溫\n②二氧化碳像厚外套，讓部分熱量不容易散出去，所以地球逐漸升溫\n\n練習三：第三段 vs 圖三 \n步驟❶：先讀文字——抓到重點，想一想：要我從圖中看什麼？\n  小祕訣：讀到「圖三進一步說明」時，要想一想：這一段要我看的是一條線，還是兩條線一起怎麼變。\n1.請把第三段文字中，要你看圖的地方畫線\n2.這段要你看圖三的什麼？（單選）\n  □①地球氣溫逐漸升高的原因\n  ②二氧化碳排放量和全球氣溫的共同成長趨勢\n步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息\n  小祕訣：看圖三時，先看有幾條線、各代表什麼，再看它們的整體趨勢。\n圖三主要在說什麼？\n  ①圖三是在呈現「二氧化碳排放量」和「全球氣溫」的變化趨勢\n  □②圖三是在說明熱量怎麼進來，又怎麼不容易散出去\n步驟❸：回到文字——從圖中找對應的訊息\n1.「二氧化碳的排放量愈來愈高，而全球氣溫亦步亦趨，也愈來愈高」這句，讀圖時要注意什麼？（單選）\n①兩條線整體都往上升\n□②兩條線一高一低，方向相反\n2.「兩條曲線的前半段，還算平穩緩升，但後半段，曲線往上爬的角度變大」這句，圖三哪裡看得出來？（單選）\n□①後半段兩條線變成完全平行的兩條線\n②前半段曲線比較平，後半段變得比較陡\n步驟❹：文圖整合——把文和圖合起來想，文圖要表達什麼？\n請用一句話，說明第三段和圖三的意思：\n    二氧化碳排放量和全球氣溫都愈來愈高，而且後半段上升更快        \n                                                                 \n\n練習四：第四段 vs 圖四 \n步驟❶：先讀文字——抓到重點，想一想：要我從圖中看什麼？\n1.請把第四段文字中，要你看圖的地方畫線\n2.這段要你看圖四的什麼？（單選）\n  ①長時間地球溫度冷熱變化的情形\n  □②近一、兩百年地球升溫的速度變化\n步驟❷：再看圖——先讀懂這張圖告訴我們什麼訊息\n1.圖四主要在說什麼？（單選）\n  □①把時間拉長來看，地球溫度會一路持續往上升\n  ②把時間拉長來看，地球溫度會反覆出現高低變化\n2.讀圖四時，最先要注意哪一個特徵？（單選）\n  ①橫軸時間很長，而且曲線有高有低\n  □②橫軸時間很長，而且曲線一路往上升\n步驟❸：回到文字——從圖中找對應的訊息\n1.「低下去的『∪形』就是『冰河期』，高起來的『倒∪形』就是『發燒期』」這句，讀圖時要注意什麼？（單選）\n□①曲線會一直往上，不再往下\n②曲線會反覆出現低谷和高峰\n2.圖四最能直接幫助你讀懂哪一句？（單選）\n①幾萬年來，地球的溫度曲線本來就有高有低\n□②近年的暖化現象「不一定」和人類使用化石燃料有關\n步驟❹：文圖整合——把文和圖合起來想，文圖要表達什麼？\n   把時間拉長來看，地球溫度本來就有高有低，所以推論近年暖化的原因時要特別小心                                                 \n\n練習五：統整一下：把四張圖串起來讀 \n前面四個練習，是分開讀每一段和每一張圖。現在請你把四段和四張圖連起來想。\n下面哪一句，最能把四段和四張圖的關係串起來？（單選）\n□①圖一呈現升溫現象，圖二說明可能原因，圖三補充共同趨勢，圖四證明近年暖化和人類活動無關。\n②圖一呈現升溫現象，圖二說明可能原因，圖三補充共同趨勢，圖四提醒推論時要更小心。\n\n◎"
