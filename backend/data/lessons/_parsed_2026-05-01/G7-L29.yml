story_text: |-
  近年來，很多人都注意到天氣愈來愈古怪，四、五月已經熱到汗流浹背，夏天熱到讓人懷疑人生，冬天了居然還有颱風警報。這些現象，讓人不禁懷疑：地球是不是愈來愈熱了？不過，要回答這個問題，不能只靠生活中的感受，而要看長期的平均氣溫變化。自1850年以來，地球的平均氣溫持續上升，1975年以來，上升的速度加快了3倍（請看圖一）。圖一縱軸為0.0的橫線是20世紀的均溫，從圖中可看出，1850年以來，天氣愈來愈熱，2024年為有記錄以來的最暖年，比20世紀平均高1.29°C，比19世紀高1.46°C。 為什麼地球氣溫會逐漸升高呢？「溫室效應假說」是目前最多證據支持的說法——工業革命以來，人類開始大量燃燒煤、石油等化石燃料，因此，大量的二氧化碳被釋放到大氣層，這些二氧化碳太多了，就好像給地球穿上一件厚外套，讓太陽照到地球的熱量，有一部分沒有辦法散到太空去，地球就愈來愈熱了（如圖二）。 圖三進一步說明了一百多年來「二氧化碳排放量（實線）」和「全球氣溫（虛線）」的共同成長趨勢。可以看出，從1880年到2025年，二氧化碳的排放量愈來愈高，而全球氣溫亦步亦趨，也愈來愈高。兩條曲線的前半段，還算平穩緩升，但後半段，曲線往上爬的角度變大，亦即，二氧化碳排放和全球氣溫，上升的情況更快了。 但是，並非所有的科學家都認為這一、兩百年來的升溫是人類燃燒石化燃料所致，有些科學家把時間拉長來看，畫出地球史上平均溫度的變化情形，如圖四。在這個圖裡，橫軸的時間長達40萬年，而地球溫度曲線本來就有高有低——低下去的「∪形」就是「冰河期」，高起來的「倒∪形」就是「發燒期」。你可以點數一下，這40萬年裡，冰河期和升溫期各有出現多少次？此外，人類的祖先大概在10萬年前才從非洲走出，開始往全球開拓生活空間，那時人類還不會「大量燃燒化石燃料」，因此，10萬年以前地球幾次的「發燒期」就不可能是人類活動造成的，而是「自然發生」的。亦即，近年的暖化現象「也許」只是地球氣溫長期變化中的一小段，「不一定」和人類使用化石燃料有關。 總結來說，雖然最近的科學家看到一個新的、很強的原因可以解釋地球暖化，但地球本來就會自己變冷或變熱，所以到底今天地球暖化的原因為何？在推論時，還需要特別小心才行。
