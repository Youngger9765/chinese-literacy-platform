multiple_choice:
- question: 1. 下列語詞何者使用錯誤？
  options:
  - 她走過挫折，終於完成自我「蛻變」，變得更加堅定自信
  - 這項網路技術突破距離限制，實現「無遠弗屆」的即時連結
  - 女配角雖然出場華麗，卻對劇情毫無影響，簡直就是個「花瓶」
  - 災區現場秩序井然，救援有效，整體氣氛「群情激昂」，令人敬佩
  answer: D
- question: 2. 依據第5段內容，網路時代「鏡頭、截圖無遠弗屆」最可能導致的連鎖影響為何？
  options:
  - 影像被大量保存→大家更認真看比→爭議自然消失
  - 片段影像易被挪用放大→惡意評論增加→隊員承受更多壓力
  - 觀眾更常上網查資料→更了解專業訓練→誤解大幅減少
  - 比賽畫面更加精彩→啦啦隊曝光提升→球隊成績必然變好
  answer: B
- question: 3. 文本把啦啦隊比喻為「掌握賽場氣氛的指揮家」，這個比喻最想強調哪一點？
  options:
  - 啦啦隊必須像指揮家一樣懂得演奏各種樂器
  - 啦啦隊的領導者必須指揮所有的隊員進行加油表演
  - 啦啦隊能帶領觀眾進入節奏，整合氣氛並提升士氣
  - 啦啦隊須依指揮劇本演出，無法根據比賽狀況調整
  answer: C
- question: 4. 文章在結尾說「不妨換一種角度看待這群氣氛指揮家」，作者希望讀者做到哪件事？
  options:
  - 看見笑容背後的訓練與紀律，用尊重取代誤解
  - 更專注觀察服裝造型，分辨哪一隊的設計更用心
  - 把注意力放在裁判判決，學會用口號影響比賽結果
  - 追蹤每位隊員社群，隨時掌握球場外的最新動態
  answer: A
- question: 5. 本文作者對啦啦隊的態度最接近下列哪一項？
  options:
  - 認為啦啦隊的主要價值在吸引觀眾的外貌與舞台效果
  - 認為啦啦隊讓球場震耳欲聾，會對球迷及球員的健康不利
  - 強調啦啦隊的專業與辛勞，並呼籲觀眾以尊重的眼光看待
  - 主張最好不要在網路上傳截圖改圖，以減少啦啦隊的爭議
  answer: C
