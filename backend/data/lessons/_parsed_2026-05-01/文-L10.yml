spotlight_raw_text: "文言聚光燈：固定句式\n文言文類型\n.\t\n\n-27940-18224500第10 課  荒野救亡記\n學學習單：王淑瑱\n\n古文今譯\n魏國的鮑子都某天傍晚走在荒野，碰巧見到一名書生突然心絞痛。鮑子都立刻下馬，為他按摩心臟。不久，書生還是死了。鮑子都看書生的袋子裡有一冊兵書和十個金餅，就賣了一個金餅，把賣的錢全用來安葬書生，剩下的九個金餅就墊在書生的頭下，兵書也放在書生的肚子邊。\n幾年後，子都在路上，一位騎著駿馬的人追趕他。等到那人追上以後，把子都當作強盜，還一再追問鮑子都他兒子的屍身在哪裡。鮑子都就把當時的情況全說了，然後那個人跟隨鮑子都來到書生的墓前。\n那人挖開墳墓，取出兒子的屍身要帶回去，果然看到九個金餅墊在兒子的頭下，兵書也在身旁。書生全家都非常感謝鮑子都的恩德與義舉。從此鮑子都的名字與事蹟被眾人口耳相傳，一下子就有名起來了。\n\n唐朝・李亢\n\n魏　鮑子都\U000E01E1，暮行於野，見一\U000E01E2書生卒\U000E01E11心痛。子都\U000E01E1下馬，為\U000E01E1摩其心。有頃2，書生卒。子都\U000E01E1視其囊中，有《素書》3一\U000E01E1卷，金十餅。乃賣一\U000E01E2餅，具葬書生，其餘枕\U000E01E1之頭下，置素書於腹旁。\n後數年，子都\U000E01E1於道上，有乘驄馬者逐之。既及，以子都\U000E01E1為盜，固問兒屍所在。子都\U000E01E1具言，於是相\U000E01E1隨往。\n開墓，取兒屍歸，見金九餅在頭下，素書在腹旁。舉家感子都\U000E01E1之德義。由是聲名大振。\n487643185345注釋\n卒：ㄘㄨˋ，通「猝」。急促、突然。\n有頃：不久、一會兒。\n卒：死亡。\n素書：兵書。\n枕：ㄓㄣˋ，當動詞，用什麼東西墊頭。\n\ncenter45720\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。00\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。\n\n第1次計時\n第2次計時\n第3次計時\n裁判計時\n秒\n秒\n秒\n秒\n\n裁判簽名:                \n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 文言聚光燈：固定句式
  instruction: 請閱讀《荒野救亡記》原文與今譯，並回答以下問題，以練習理解故事的結構與情節。
  reasoning: 此練習旨在引導學生透過「主角、問題、解決、結果」的結構化提問，深入理解文言文故事《荒野救亡記》的內容與情節發展。雖然原文未提供具體選擇題，但根據指示，本練習生成了符合閱讀策略的題目，以幫助學生掌握敘事脈絡，並結合原文朗讀計時的目的，加入反思題。
  steps:
  - prompt: 這個故事的主角是誰？
    type: select
    options:
    - 書生
    - 鮑子都
    - 騎駿馬的人
    - 書生的家人
    answer: 1
    reasoning: 故事主要圍繞鮑子都的行為和經歷展開，他是在荒野中遇到書生並提供幫助，後來又被誤解並澄清事實的核心人物。
  - prompt: 故事中鮑子都最初遇到的主要問題是什麼？
    type: select
    options:
    - 他迷路了
    - 書生突然死亡，需要處理後事
    - 他被強盜搶劫
    - 他找不到回家的路
    answer: 1
    reasoning: 故事開頭，鮑子都遇到書生猝死，這是他必須面對並解決的首要問題。
  - prompt: 鮑子都如何處理書生的後事，展現其義舉？
    type: select
    options:
    - 他直接離開，不予理會
    - 他賣掉書生的金餅，將錢財據為己有
    - 他賣掉一個金餅安葬書生，並將其餘金餅和兵書留在書生身旁
    - 他將書生遺體丟棄在荒野
    answer: 2
    reasoning: 原文明確指出鮑子都『乃賣一餅，具葬書生，其餘枕之頭下，置素書於腹旁』，這是他義舉的具體體現。
  - prompt: 幾年後，鮑子都遇到什麼新的問題？他是如何解決的？
    type: select
    options:
    - 他再次遇到書生，但書生已變成鬼魂
    - 他被書生的父親誤認為盜賊，但他解釋清楚並帶其前往墓地
    - 他被書生的家人邀請去享用大餐
    - 他發現書生的墓地被破壞了
    answer: 1
    reasoning: 原文描述『既及，以子都為盜，固問兒屍所在。子都具言，於是相隨往』，清楚說明了後續的問題與解決方式。
  - prompt: 鮑子都的義舉最終帶來了什麼結果？
    type: select
    options:
    - 他因此被判刑入獄
    - 他被書生家人誤會更深
    - 他聲名大振，受到眾人讚揚
    - 他失去了所有的財產
    answer: 2
    reasoning: 故事結尾『舉家感子都之德義。由是聲名大振』，明確指出鮑子都因此獲得了良好的聲譽。
  - prompt: 請思考：透過朗讀原文並計時，你認為自己在閱讀文言文的流暢度上有哪些進步或挑戰？
    type: free_text
    reasoning: 此題旨在引導學生反思朗讀計時活動的意義，鼓勵他們思考自己在文言文閱讀流暢度上的表現與進步空間，符合原文中計時練習的目的。
