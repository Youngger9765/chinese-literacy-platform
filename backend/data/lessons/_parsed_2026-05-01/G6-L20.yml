multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 老師喊到他的名字，他立刻「遲疑」舉手，大聲回答
  - 他講話清楚直接，不會特別「顧忌」誰的立場或感受
  - 儘管已失散多年，母親仍「眼睜睜」盼望著兒子早日回來
  - 在多次的訓練後，他已能夠在台上「拘謹」分享經驗想法
  answer: B
- question: 2. 根據第五段「或許只是我自作多情，把普通的關心錯認為特別的對待」，下列哪一選項最能說明句中「特別的對待」的涵意？
  options:
  - 以為這份關心是出自敬佩，特別欣賞自己
  - 以為這份關心是出自禮貌，對同學都一樣
  - 以為這份關心是出自同情，幫助需要的人
  - 以為這份關心是出自愛情，是專屬於自己
  answer: D
- question: 3. 根據全文，哪一選項最貼近主角面對的兩難猶豫？
  options:
  - 告白了怕破壞關係，不告白怕錯過機會 B.告白會讓對方困擾，不告白就不能曖昧 C.告白會被大家嘲笑，不告白又怕人誤會 D.告白就能維持現狀，不告白會改變關係
  answer: A
- question: 4. 文中主角經歷許多矛盾掙扎，下列何者最貼近他最後的決定？
  options:
  - 他決定壓抑心情，避免讓感情干擾生活 B. 他決定尋求朋友的建議，參考他人想法 C. 他決定表達情感，並勇敢接受所有可能 D. 他仍遲疑，但願意真誠思考，不留遺憾
  answer: D
- question: 5. 根據閱讀聚光燈的練習，下列何者關注的面向屬於自己的「控制圈」？
  options:
  - 吉伊：家中有遺傳性疾病，我很擔心有一天會發病
  - 兔兔：朋友都脫單了，我很期待有更多喜歡我的人
  - 小八：物價近年快速上漲，我想知道更多理財方法
  - 栗子：這是最後一年的比賽，希望對手都比我們弱
  answer: C
