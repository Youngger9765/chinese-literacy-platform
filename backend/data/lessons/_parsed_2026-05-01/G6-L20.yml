vocabulary:
- word: 坐立難安 _
  definition: 坐也不是、站也不是，形容緊張或不安。
- word: 拘謹
  definition: 因為謹慎或緊張，行動或說話不自在的樣子。
- word: 曖昧
  definition: 不清楚、不明白的關係。
- word: 糾結
  definition: 心裡有矛盾或難以決定的情況。
- word: 渾身
  definition: 整個身體、從頭到腳。
- word: 遲疑
  definition: 猶豫不定，無法馬上做出決定或行動。
- word: 顧忌
  definition: 擔心做某事會帶來不好結果，因此不敢做。
- word: 指指點點 _
  definition: 用手指著別人或東西，比喻對人議論或批評。
- word: 盤旋
  definition: 在空中繞圈圈飛，或在某個地方逗留不離開。
- word: 眼睜睜
  definition: 親眼看到事情發生卻無能為力。
