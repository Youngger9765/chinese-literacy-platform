strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈-控制圈
  instruction: 請判斷下列選項中，何者關注的面向屬於自己的「控制圈」？
  reasoning: 此練習旨在引導學生辨識哪些事情是自己可以控制的（控制圈），哪些是不可控制的。題目要求學生從四個情境中選出屬於控制圈的選項。判斷依據為該情境所描述的行動或關注點是否能透過個人努力或選擇來影響。
  steps:
  - prompt: 閱讀聚光燈的練習，下列何者關注的面向屬於自己的「控制圈」？
    type: select
    options:
    - A. 吉伊：家中有遺傳性疾病，我很擔心有一天會發病
    - B. 兔兔：朋友都脫單了，我很期待有更多喜歡我的人
    - C. 小八：物價近年快速上漲，我想知道更多理財方法
    - D. 栗子：這是最後一年的比賽，希望對手都比我們弱
    answer: 2
    reasoning: 選項A「發病時機」不可控制。選項B「他人的喜歡」不可控制。選項D「對手的強度」不可控制。選項C「學習理財方法」是個人可以主動學習和實踐的，屬於自己的控制圈。
