spotlight_raw_text: "閱讀聚光燈\n推論人物特質\n    我們可以從一個人說的話、做的事來推論角色的人物特質。閱讀時，讀者若能從文中線索推論人物特質，就能對文章有更好的掌握，理解文章主旨。\n1.將支持理由與所屬種類連起來，並找出課文提到的周天成的人物特質。\n\n支持理由\n\n種類\n人物特質\n(1)\n周天成完成每日的羽球訓練菜單\n4652823344900●  \n做的事\n在課文\n第( 一 )段提到，周天成極度\n   自律  。\n \n(2)\n「強健的肌肉是每個運動員必備的條件之一。」\n●           ●\n\n(3)\n他說：「我也會時刻提醒自己，保持謙虛不驕傲。」\n●       \n說的話\n\n(4)\n周天成嚴格限制自己的口腹之慾\n●           ●\n\n2.除了上述特質，周天成還有其他的特質，請由文章中支持的理由推論人物特質。（單選）\n課文句子\n人物特質\n１.\n(1)身為一個持續參加國際賽事的國手，除了「比賽、訓練」之外，也有社會教育的責任。 \n(做的事  □說的話 )\n有使命感\n□樂觀\n□感恩\n\n(2)「只有拿了好成績，有影響力的時候，才可以去回饋、影響更多人，不然我就只是個路人。」\n( □做的事  說的話 )\n\n2.\n(3)「每當我驕傲起來，就無法在場上打出好表現。」\n( □做的事  說的話 )\n謙虛\n□驕傲\n□熱情\n\n(4)就算現在已經是臺灣羽球一哥，周天成仍然不自滿，一直在找各種進步的方法。\n(做的事  □說的話 )\n\n53163542259\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 推論人物特質
  instruction: 閱讀時，讀者若能從文中線索推論人物特質，就能對文章有更好的掌握，理解文章主旨。
  reasoning: 此練習旨在引導學生透過分析人物的言行（「說的話」與「做的事」）來推論其人物特質。第一部分透過具體事例，讓學生練習辨識與特質的連結；第二部分則要求學生綜合多個線索，從選項中選出最符合的人物特質，加深對文本理解與推論能力的訓練。
  steps:
  - prompt: 周天成完成每日的羽球訓練菜單。這屬於「做的事」。請問這推論出周天成什麼人物特質？
    type: select
    options:
    - 自律
    - 謙虛
    - 熱情
    - 感恩
    answer: 0
    reasoning: 周天成每日按時完成訓練菜單，顯示他對自我要求高且能嚴格執行，這正是「自律」的表現。課文第一段也明確提到「周天成極度自律」。
  - prompt: 周天成說：「強健的肌肉是每個運動員必備的條件之一。」這屬於「說的話」。請問這推論出周天成什麼人物特質？
    type: select
    options:
    - 自律
    - 嚴謹
    - 樂觀
    - 感恩
    answer: 1
    reasoning: 這句話顯示周天成對運動員的專業要求和對自身體能的重視。課文提到他「對自己的要求從不鬆懈」，並在羽球訓練後繼續進行重量訓練，這些都體現了他對訓練和身體狀態的「嚴謹」態度。
  - prompt: 周天成說：「我也會時刻提醒自己，保持謙虛不驕傲。」這屬於「說的話」。請問這推論出周天成什麼人物特質？
    type: select
    options:
    - 自律
    - 謙虛
    - 驕傲
    - 熱情
    answer: 1
    reasoning: 周天成在言談中直接表達了要「保持謙虛不驕傲」的自我提醒，因此「謙虛」是直接且明確的人物特質。
  - prompt: 周天成嚴格限制自己的口腹之慾。這屬於「做的事」。請問這推論出周天成什麼人物特質？
    type: select
    options:
    - 自律
    - 樂觀
    - 感恩
    - 熱情
    answer: 0
    reasoning: 嚴格控制飲食是自我約束和自我管理的一種行為，這直接反映了「自律」的人物特質。
  - prompt: '請根據以下課文句子，推論周天成的人物特質：

      1. 身為一個持續參加國際賽事的國手，除了「比賽、訓練」之外，也有社會教育的責任。(做的事)

      2. 「只有拿了好成績，有影響力的時候，才可以去回饋、影響更多人，不然我就只是個路人。」(說的話)'
    type: select
    options:
    - 有使命感
    - 樂觀
    - 感恩
    answer: 0
    reasoning: 第一句指出他認為自己有社會教育的責任，第二句則說明他希望透過好成績來回饋和影響更多人。這兩點都顯示他不僅追求個人成就，更希望為社會做出貢獻，具有強烈的「使命感」。原文中「有使命感」選項旁無方框，表示為正確答案。
  - prompt: '請根據以下課文句子，推論周天成的人物特質：

      1. 「每當我驕傲起來，就無法在場上打出好表現。」(說的話)

      2. 就算現在已經是臺灣羽球一哥，周天成仍然不自滿，一直在找各種進步的方法。(做的事)'
    type: select
    options:
    - 謙虛
    - 驕傲
    - 熱情
    answer: 0
    reasoning: 第一句他提到驕傲會影響表現，暗示他警惕自己不驕傲；第二句則直接說明他「不自滿」並持續尋求進步。這些言行都指向「謙虛」的人物特質。原文中「謙虛」選項旁無方框，表示為正確答案。
