title: 周天成的一天──頂尖選手的養成
authors: 課文 ：余茹帆 學習單：陳允捷
story_text: |-
  2014年，周天成成為臺灣第一位在世界羽聯超級系列賽奪冠的男單選手，此後其世界排名多年穩居前十，成為臺灣羽球界一哥。「羅馬不是一天造成的。」讓我們來了解世界排名前十的羽球選手—周天成的一天，來窺視他如何透過「自律」一步一步成為世界級的選手吧！ 羽球的基本訓練是周天成每天必備「菜單」。他一大早就起床，8點前到達羽球館，先是暖身。從拉筋開始，他將掃把柄架在肩膀上並轉動身軀，把關節的活動度拉到最大；接著是用腳踩網球大小的硬球，以放鬆腳底筋膜；再來跟陪練員做網前平推、殺球、發球……等基本練習。陪練員也會在餵球時加入不同的球路變化，強化周天成的羽球步伐，最後就是周天成與陪練員的對打比賽。這樣日復一日的基本訓練，是周天成站上世界級羽球舞台的最基本功。 周天成說：「強健的肌肉是每個運動員必備的條件之一。」多年的鍛鍊讓周天成的體脂率不到百分之五，但他對自己的要求從不鬆懈，完成辛苦的羽球訓練後，他直奔健身房，繼續進行重量訓練。首先，他做了核心肌群訓練；再來，他舉啞鈴強化左手的肌肉，要讓左手的肌肉強度跟他的慣用手一樣強大，這樣一來，身體的肌肉才會平衡，以預防脊椎歪斜；最後，他做了好幾組的下肢肌肉重量訓練，有了強大的下肢肌肉，才能提升周天成在球場上移動的速度、步伐的穩定性、彈跳的高度，以及擊球的表現。周天成把開發身體潛能視為重要的課題之一，他會去尋求運動指導員的幫助，開發身體各部分沉睡已久的肌肉，讓每塊肌肉都能發揮最大的效用，以增進自己的運動表現。 頂尖運動員也需要管好自己的口腹之欲。午餐時間到了，周天成連吃飯都是有設計、有紀律的。他的餐盤裡是原型食物，不加任何調味料。吃飯的順序是：水果、蔬菜、澱粉、肉。每種食物都要吃完後，才能換下一種食物。吃到飯時，就只能吃飯，不能一口飯搭一口菜，每口慢慢咀嚼，這樣可以減少熱量的攝取，保持輕盈的身軀，這對需要頻繁快速移動的羽球運動是有利的。 到了夜晚，周天成經常必須出席參與一些公開活動或私人的拜會，因為身為一個持續參加國際賽事的國手，除了「比賽、訓練」之外，也有社會教育的責任，也必須尋求企業或政府機構的贊助。但為了保護自己，他不騎車也不開車，儘量搭捷運或公車前往，讓可能造成身體傷害的因素降到最低。避免受傷，也是一個運動員對自己運動生涯負責的一種表現。 在夜深人靜的時候，周天成也會自我反省、調整心態與激勵自己。他說：「雖然我有時候輸掉了比賽，但只要參賽總是可以學到很多東西，最重要的是你必須為自己奮鬥，我也會時刻提醒自己，在每場比賽中保持謙虛，每當我驕傲起來，就無法在場上打出好表現。」就算現在已經是臺灣羽球一哥，周天成仍然不自滿，一直在找各種進步的方法，哪怕只有百分之一的進步機會，他都會去嘗試，「只有拿了好成績，有影響力的時候，才可以去回饋、影響更多人，不然我就只是個路人。」 周天成日復一日過著極度自律的生活，每個生活的環節都要「注意」，把自己維持在最佳的狀況。我們若陪周天成過一天這樣的生活，也許會覺得很新鮮。但是要一年365天，每天每天都堅持地重複下去，能辦到的人大概就不多了。你呢？你能每天反覆地鍛鍊技術、增強體能、拒絶美食、連機車也不騎，你辦得到嗎？
