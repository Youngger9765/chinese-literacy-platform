multiple_choice:
- question: 1. 請問哪一個句子的語詞使用正確?
  options:
  - 黑夫將白米裝進「竹簡」，煮竹筒飯給弟弟吃
  - 經過細心的照顧，總算「安然」度過危險期
  - 他被斬首，現場「拋頭顱灑熱血」，畫面驚悚
  - 姐姐離婚後，又與前男友復合，「轉嫁」給他
  answer: B
- question: 2. 根據本文，秦朝士兵的生活狀況為何？
  options:
  - 粗茶淡飯，衣食無缺
  - 艱難困苦，缺乏物資(從第4、5段可知)
  - 戰爭刺激，充滿冒險
  - 戰爭榮耀，高官厚祿
  answer: B
- question: 3. 根據本文，大哥把弟弟們的家書當陪葬品的主要原因為何？
  options:
  - 秦國最後打了勝仗，家書是光榮的印記
  - 竹簡價值萬金，在當時非常昂貴
  - 書信內容可能透露國家機密，他擔心外洩
  - 兄弟戰死沙場，他悲傷歉疚，念念不忘(從13段可知)。
  answer: D
- question: 4. 根據本文，下列哪句話最能總結這兩封家書所揭露的歷史真相？
  options:
  - 戰爭的勝利往往是以犧牲無數平民為代價
  - 秦朝的統一是全國人民的幸福與榮耀
  - 秦朝士兵的生活充滿了榮譽和驕傲(根據第5及11段可知)
  - 秦始皇的統治穩固，人民安居樂業
  answer: A
- question: 5. 本篇文章對於研究秦朝歷史有何重要意義？
  options:
  - 揭示了秦朝統一戰爭的過程
  - 展示了秦朝皇帝的英明神武
  - 反映了秦朝底層民眾的真實生活
  - 說明了秦朝的徵兵制度非常完善
  answer: C
