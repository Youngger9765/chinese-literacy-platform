vocabulary:
- word: 英姿颯爽
  definition: 形容威武豪邁，意氣風發的樣子。
- word: 兵餉
  definition: 士兵的薪水。
- word: 拋頭顱灑熱血
  definition: 拋棄頭顱，灑出熱血。比喻願意為理想犧牲自己的生命，在所不惜。
- word: 轉嫁
  definition: 將應該承受的負擔轉移到他人身上。嫁，轉移。
- word: 嚴峻
  definition: 嚴厲、苛刻。本文的意思是情況變得更糟糕。
- word: 搏命
  definition: 以性命相爭。形容不顧生命，全力以赴。搏，雙方打鬥。
- word: 絕筆
  definition: 臨死前最後的文字。
- word: 安然
  definition: 平安無事的樣子。然，意思是「…的樣子」。
- word: 書吏
  definition: 古代專門替人記錄事情或抄寫文本的人。吏，是職位較低的政府官員。
- word: 文房四寶
  definition: 即筆、墨、紙、硯四種古代文人書房必備的文具。
- word: 竹簡
  definition: 古代刻寫文字用的竹片。
- word: 生死未卜
  definition: 不知道是死還是活。
- word: 贍養
  definition: 提供生活所需的物品、金錢。本文是指照顧年邁的父母。
- word: 有幸窺見
  definition: 幸運的能看見。有幸，幸運。
