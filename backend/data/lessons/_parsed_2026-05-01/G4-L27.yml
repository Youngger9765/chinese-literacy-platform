multiple_choice:
- question: （ Ａ ）1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 這片山林因為民宿開發而被「大肆」破壞
  - 他「邋遢」的行事風格，受到許多人喜愛
  - 這「惱人」的鳥鳴聲，在早晨中使人喜悅
  - 他「效應」了許多次都沒用，只好發起抗爭
  answer: A
- question: （ Ｃ ）3. 根據文章，作者認為「藍海豚」的功能最接近下列何者？
  options:
  - 幫助我們逃避負面情緒
  - 教我們忽略一切不好的事情
  - 幫助我們將注意力拉回當下
  - 用更嚴格的標準來要求自己
  answer: C
- question: （ Ｄ ）5. 根據品格聚光燈，面對上台時刻，下列哪一種因應方式最符合召喚「藍海豚」？
  options:
  - 告訴自己「不要緊張，不要出錯！」
  - 強迫自己不要去想最糟的結果會怎樣
  - 放空不想任何事，或乾脆不去報告了
  - 專注練習，在心中反覆複習報告重點
  answer: D
