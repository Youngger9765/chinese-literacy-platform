  坐在搖曳的篝火旁邊，他用低沉的聲音，告訴我熱帶雨林的祕密。原來，這表面看來深沉寧靜的叢林，往往有突如其來的殺手──大風、暴雨、毒蟲、猛獸，盤桓其中，隨時可能要人性命；不過，只要謹慎小心，這片赤道旁的熱帶雨林，不只會讓我們走入神祕的世界，更會讓我們見識到各種新鮮有趣的事物。
- ～出自周寶興＜走進原始雨林＞
- A.雨林是個祕密的地方，搖曳的篝火令人有無限的遐想。
- B.雨林是個深沉寧靜的地方，因為有各種新鮮有趣的事物。
- C.雨林是個危險的地方，因為有很多自然殺手隱藏其中。
- D.雨林是個有豐富生物的地方，因為有很多毒蟲及猛獸。
