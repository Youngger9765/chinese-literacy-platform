- 二、由課文觀點找出支持理由
- 文章觀點：植物肉市場潛力非常巨大
- 支持理由：（請從文章的五、六段找出至少兩個支持理由）
- (1)根據最新的統計，2021年到未來2028年，全球植物肉市場規模將大幅【成長 】，反映出消費者對植物性蛋白的需求急劇【上升 】。
- (2)越來越多的連鎖超市設置專門的植物性食品區。／眾多知名快餐店和餐廳也紛紛將植物肉的料理納入菜單選項。／預計會有越來越多人開始嘗試「彈性素食主 義」，在日常飲食中增加植物性蛋白的比例。
- 三、總結作者觀點（小提示：觀點是含有個人的意見看法）
- →由文章觀點可知道，作者【 支持 □不支持】植物肉。
- 四、挑戰題：找出全文主旨
