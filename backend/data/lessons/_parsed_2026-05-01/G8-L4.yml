- 一、下圖中，左邊列出三個課文的觀點，請在右邊找到這些觀點的支持理由，並畫線連起來。
- 二、由課文觀點找出支持理由
- 文章觀點：植物肉市場潛力非常巨大
- 支持理由：（請從文章的五、六段找出至少兩個支持理由）
- (1)根據最新的統計，2021年到未來2028年，全球植物肉市場規模將大幅【成長 】，反映出消費者對植物性蛋白的需求急劇【上升 】。
