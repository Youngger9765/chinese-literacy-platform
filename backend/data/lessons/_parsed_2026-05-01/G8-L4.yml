  answer: B
- question: 3. 根據課文，何者不是現代植物肉的風行的原因？
  options:
  - 商店提供了消費者更多樣化的產品選擇
  - 植物肉的營養價值及口感都不輸真肉
  - 真肉必須屠宰動物，讓人看了很不忍心
