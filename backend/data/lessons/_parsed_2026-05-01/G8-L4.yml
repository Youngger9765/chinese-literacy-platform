spotlight_raw_text: "閱讀聚光燈\n由觀點找出支持理由\n    這一課是說明文，作者先告訴讀者植物肉引發的風潮，再用具體的例子去支持作者種種的看法（觀點），讓文章更有說服力。所以，閱讀時，如果能找出作者觀點，並從文章中找出支持觀點的理由，你會更容易讀出文章的重點喔。\n    ※什麼是觀點和理由？\n\n「觀點」\n「支持理由」\n定義\n個人的意見、看法，跟個人價值觀有關，通常帶有一點評論。\n指支持觀點的例子、事例。\n例如\n他很用功。\n他每天都讀書四小時以上、他在假日都到圖書館念書、他上課都會做筆記。\n\n這份英文作業很困難。\n他花好久的時間查字典、\n大多數同學無法完成作業。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 由觀點找出支持理由
  instruction: 請練習從文章中找出作者的觀點，並辨識支持這些觀點的理由。
  reasoning: 原文開頭說明了「閱讀聚光燈」策略的目標是「由觀點找出支持理由」，並提供了「觀點」與「支持理由」的定義及兩個範例。因此，設計兩個選擇題來練習從給定的觀點中辨識出其支持理由，符合原文的教學目的和範例結構。
  steps:
  - prompt: 請判斷以下哪一個選項是支持「他很用功」這個觀點的理由？
    type: select
    options:
    - 他很用功。
    - 他每天都讀書四小時以上、他在假日都到圖書館念書、他上課都會做筆記。
    - 這份英文作業很困難。
    - 他花好久的時間查字典。
    answer: 1
    reasoning: 根據原文範例，觀點是「他很用功」，其支持理由為「他每天都讀書四小時以上、他在假日都到圖書館念書、他上課都會做筆記」。選項1是觀點本身，選項3和4是第二個範例的觀點和理由，故選項2為正確答案。
  - prompt: 請判斷以下哪一個選項是支持「這份英文作業很困難」這個觀點的理由？
    type: select
    options:
    - 這份英文作業很困難。
    - 他很用功。
    - 他花好久的時間查字典、大多數同學無法完成作業。
    - 他每天都讀書四小時以上。
    answer: 2
    reasoning: 根據原文範例，觀點是「這份英文作業很困難」，其支持理由為「他花好久的時間查字典、大多數同學無法完成作業」。選項1是觀點本身，選項2和4是第一個範例的觀點和理由，故選項3為正確答案。
