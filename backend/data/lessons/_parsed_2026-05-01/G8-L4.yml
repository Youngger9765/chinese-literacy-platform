vocabulary:
- word: 質地
  definition: 物品的材料、品質。
- word: 膳食纖維
  definition: 食物中無法被人體消化的剩餘物，過去常被誤解為無營養價值，其實它可以增加食物在體內的停留時間，吸收水分迅速膨脹，增加飽足感，還有助排便。
- word: 悄然興起
  definition: 某一事物或現象在大家未察覺的情況下，慢慢興起或發展起來。
- word: 應運而生
  definition: 順應時勢需求而產生。
- word: 刮目相看
  definition: 另眼看待，用新的眼光來看待。
- word: 媲美
  definition: 媲：比得上。通常用於稱讚對方的能力比得上厲害的人。例如：媽媽的廚藝媲美五星級大廚。
- word: 追溯
  definition: 回想、探究事物發生的原因。溯：逆著、往前或往回。
- word: 蓬勃
  definition: 茂盛繁榮的樣子。
- word: 屠宰
  definition: 宰殺牲畜。
- word: 不分軒輊
  definition: 比喻分不出高下，實力相當。軒，車前高起的部分。輊，車後低下的部分。
