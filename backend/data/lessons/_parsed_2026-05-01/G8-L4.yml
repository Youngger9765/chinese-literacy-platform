  (2)越來越多的連鎖超市設置專門的植物性食品區。／眾多知名快餐店和餐廳也紛紛將植物肉的料理納入菜單選項。／預計會有越來越多人開始嘗試「彈性素食主 義」，在日常飲食中增加植物性蛋白的比例。
- 三、總結作者觀點（小提示：觀點是含有個人的意見看法）
