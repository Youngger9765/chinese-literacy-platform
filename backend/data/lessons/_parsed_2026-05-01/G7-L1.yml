spotlight_raw_text: "閱讀聚光燈\n寫作手法——排比\n   當文章中有結構相似、意義相關的句子，且使用相同的詞或短句，並連續三句或以上，我們稱這組句子為「排比句」。使用「排比」能增加文句氣勢、加強論點，或是呈現事件具體、多元的樣貌。請看以下例子：\n1.增加氣勢──「我們要追求進步，不怕困難，不懼挑戰，不畏艱險。」\n2.呈現具體、多元樣貌──「公園裡充滿春天來臨的氣息，柳樹正輕輕搖曳，花兒正灑落芬芳，蝴蝶正翩翩起舞。」\n    而閱讀排比句時，我們可以從排比句歸納、推論作者想強化的重點，如第1句強調的是「勇於面對困難」，第2句則著重於「春天來臨」。歸納後，就可將理解重點聚焦於統整後的結果，而不侷限在排比句中所提到的細節和面向。\n一起來看看本篇文章中的三組排比句：\n※判讀方式：\n找出排比句型，並歸納排比句型中的內容。\n(段一)當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，在音樂驚悚而畫面黯淡時，會聽到有人低語著「來了！來了！」。\n排比句型\n當……會……\n句型關鍵詞\n當……\n會……\n文句內容\n eq \\o\\ac(○,1)上課前大家玩鬧不休\n eq \\o\\ac(○,2)心儀對象迎面走來\n eq \\o\\ac(○,3)三五好友一起壯膽看恐怖片\n eq \\o\\ac(○,1)面面相覷說道「來了！來了！」\n eq \\o\\ac(○,2)會聽見身旁損友竊笑「來了！來了！」\n eq \\o\\ac(○,3)會聽到有人低語著「來了！來了！」\n共同點\n(單選)\n1.□隻身一人 好友成群\n2.□固定時機 各種時機\n3.都有人說【來了！來了！ 】\n歸納重點\n(依序將共同點填入句中)\n在【1  好友成群  】的【2  各種 】時機，都有人說【3 來了！來了！ 】\n呼應前文\n那一句「來了！來了！」可以千變萬化，可以在不同時機派上用場。\n(段二) 羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？\n排比句型\n……【不是    】……【  嗎？  】\n句型關鍵詞\n……不是\n……嗎？\n文句內容\n eq \\o\\ac(○,1)羊隊和牛群\n eq \\o\\ac(○,2)綠色的小河\n eq \\o\\ac(○,3)螢火蟲\n eq \\o\\ac(○,1)本來就會回家\n eq \\o\\ac(○,2)一直都在歌唱\n eq \\o\\ac(○,3)原本就提著燈\n共同點\n(單選)\n1.皆為\n【 自然景物 □人類】\n2.皆為\n【人類動作 □動物/自然動作】\n3.作者認為這些事都\n【理所當然 　□出乎意料】\n歸納重點\n(依序將共同點填入句中)\n作者認為【1 自然景物  】能做出【2 人類動作  】，是【3 理所當然  】。\n呼應前文\n困惑的是，為什麼許多句子都是「擬人」呢？\n(段三) 當「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；「當街燈亮起來向村莊道過晚安」，更常是我們店裡忙得不可開交之時；當「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。\n排比句型\n當……，……\n句型關鍵詞\n當……\n，……(後句)\n文句內容\n eq \\o\\ac(○,1)「火紅的太陽也滾著火輪子回家了」\n eq \\o\\ac(○,2)「當街燈亮起來向村莊道過晚安」\n eq \\o\\ac(○,3)「小雞和小鴨們關在欄裡睡了」\n eq \\o\\ac(○,1)我得匆忙趕回去幫忙家裡的生意\n eq \\o\\ac(○,2)更常是我們店裡忙得不可開交之時\n eq \\o\\ac(○,3)就是我和蚊子決鬥的時刻\n共同點\n(單選)\n1.從【   上下引號   】可以判斷此處是引用【  夏夜   】的原文\n2.皆為\n【作者的日常 □楊喚的日常】\n3.時間點與〈夏夜〉【相同 □相異】\n4.情景與〈夏夜〉【□相同相異】\n歸納重點\n(依序將共同點填入句中)\n【1 夏夜  】原文與【2 作者  】的日常，雖然是在【3 相同  】的時間點，但情景【4 相異  】，作者認為【□自己 楊喚）比較幸福。\n呼應前文\n而羨慕的是，楊喚的童年大概特別幸福吧。\n72572575673\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
