multiple_choice:
- question: 1. 下列語詞何者使用正確？
  options:
  - 藉由這次旅行，我真正「領略」到了大自然的壯麗
  - 此處山區交通不便，許多家庭的經濟十分「乏味」
  - 她性格溫順隨和，做事總是「習以為常」，從不強求
  - 孩子們在音樂聲中開心的「面面相覷」，充滿了歡樂
  answer: A
- question: |-
    2. 第二段中「小時候的我看世界，總戴著一副想像的眼鏡，從眼鏡裡看出的是一個童稚的世界……然而這眼鏡，隨著年紀增長漸漸模糊失效，放眼望去都僅是習以為常的乏味景象。」關於此段的解讀下列何者正確？
  options:
  - 這副眼鏡幫助作者逃離學習的壓力和辛苦的生活
  - 眼鏡隨年紀增長而模糊是因為作者近視度數加深
  - 作者長大後對所見感到乏味是因為對世界失去新鮮感和好奇
  - 作者小時候比同年孩子更幼稚，總是想像自己戴著眼鏡
  answer: C
- question: 3. 根據本文對〈夏夜〉與其作者楊喚的描述，下列敘述何者正確？
  options:
  - 「來了！來了！」是在營造像鬼片般驚悚的氛圍
  - 「羊隊和牛群告別了田野回家了」運用擬人修辭
  - 楊喚小時候睡前都有老祖母為他講述床邊故事
  - 楊喚的朋友都非常支持他投身兒童文學的創作
  answer: B
- question: 4. 關於作者對〈夏夜〉解讀的轉變，下列敘述何者正確？
  options:
  - 作者長大後對老師的詮釋感同身受，因此喜歡〈夏夜〉
  - 作者長大後知道楊喚童年十分辛苦，因此深有共鳴
  - 作者對〈夏夜〉的情感從困惑轉變為理解與敬佩
  - 作者認為楊喚持續創作兒童詩僅是為了療癒自己
  answer: C
- question: 5. 「燕子去了，有再來的時候；楊柳枯了，有再青的時候；桃花謝了，有再開的時候。」（朱自清〈匆匆〉），下列何者為此排比句的重點？
  options:
  - 對時間一去不復返的感慨 B.強調大自然中的詩意美好
  - 描寫季節交替的自然景象 D.營造生命無限循環的希望
  answer: D
