title: 長大後，我才讀懂〈夏夜〉
authors: 課文/學習單：張筱晴
story_text: 還記得，國中第一篇課文是楊喚的〈夏夜〉。會對這課文印象深刻不是因為喜歡，而是對當時愛調皮搞笑的我們來說，那一句「來了！來了！」可以千變萬化，可以在不同時機派上用場。當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，在音樂驚悚而畫面黯淡時，會聽到有人低語著「來了！來了！」。而終於在老師一番苦心解釋後，我們才明白，詩中的「來了！來了！」其實是一種歡迎、期待夏夜到來的喜悅氛圍。但十三歲的我們，在嬉笑中，哪裡領略得到那樣的詩意？ 然而，那首童詩帶給我的，比起歡樂，更多的是困惑和羨慕。 困惑的是，為什麼許多句子都是「擬人」呢？羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲原本就提著燈嗎？這個謎，直到長大後才解開。小時候的我看世界，總戴著一副想像的眼鏡，從眼鏡裡看出的是一個童稚的世界：天空會哭泣也會怒吼、月亮總是陪伴著我、影子會和我捉迷藏，這些都是我童年的日常。然而這眼鏡，隨著年紀增長漸漸模糊失效，放眼望去都僅是習以為常的乏味景象。此時，我才了解，同是大人的楊喚，能寫出如此貼近孩童想像的文字，能保有那份真摯單純的眼光，是多麼可貴。 而羨慕的是，楊喚的童年大概特別幸福吧。當「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；「當街燈亮起來向村莊道過晚安」，更常是我們店裡忙得不可開交之時；當「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。我從來沒有祖母可以在床邊說故事，而我的夢境都是被考試、作業、妖魔鬼怪追逐，不像詩中的小弟弟、小妹妹可以夢見自己變成魚和蝴蝶。但後來長大，偶然聽到楊喚的生命故事，才發現我一直都想錯了。 楊喚不到一歲時，母親便因病去世，他的父親雖然賣力維持家計，但成天酗酒，無心照顧楊喚。父親再娶後，等著楊喚的則是數年的挨餓受凍及頓頓毒打。楊喚說自己「從小就是個可憐的小東西」，在挨打受罵的生活中，是「以痛苦做食糧，被眼淚給餵養大的」，多麼艱辛悲苦的童年！ 正是這樣的過去，讓楊喚特別熱衷於兒童文學。然而童詩創作收入微薄，有朋友建議他轉換方向，但他分享道：「童話最難寫，兒童詩更難寫，但我願意學習，因為這樣，我便可以找到失去的快樂了，能和可愛的孩子們一道哭，一道笑了。」一個從未擁有幸福快樂童年的人，卻傾盡畢生力氣，在文字中打造無憂無慮的童年王國，為了所有和他一樣經歷苦難的孩子。楊喚的這份心意，直到現在我才讀懂。 心理學家阿德勒有句名言：「幸福的人用童年治癒一生，不幸的人用一生治癒童年。」或許楊喚也是如此。但令人感佩的是，他不僅嘗試治癒自己的童年，也將這份對幸福的渴望化為文字，希冀能滋養更多在困苦煎熬中成長的孩子，期盼他們也能擁有一方心靈和想像的富足美好。
