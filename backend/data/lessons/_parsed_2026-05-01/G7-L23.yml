multiple_choice:
- question: 1. 科學家回到馬來西亞想採集更多樣本時，為何只找到枯死的樹樁？
  options:
  - 因為原始雨林已被清除，被改作農地
  - 因為有人聽說樹能治病，先下手為強
  - 樹木孕育出愛滋病藥物後，會自然死亡
  - 因為科學家走錯地點，找錯森林區域
  answer: A
- question: 2. 依文章脈絡，作者最可能想影響讀者的想法或態度是什麼？
  options:
  - 鼓勵多向原住民學習各種雨林草藥的使用方法
  - 謹慎進行所有醫學研究，因為採集樣本會破壞自然
  - 重新重視雨林保育，因為雨林可能帶來救命藥物
  - 呼籲大家，要接近大自然才能找到各種治療方法
  answer: C
- question: 3. 第一段大量描寫旅人鴿成群飛過天空、讓日光失色，主要想讓讀者感受到什麼？
  options:
  - 旅人鴿能長途飛行、耐力驚人，值得研究
  - 旅人鴿有特別的飛行特色，很容易辨識
  - 旅人鴿曾經數量驚人，景象非常震撼
  - 旅人鴿遷徙路線複雜，很難追蹤研究
  answer: C
- question: 4. 旅人鴿「性情出奇溫馴」在文中最可能用來暗示什麼影響？
  options:
  - 牠們容易被獵捕，族群更快減少
  - 牠們更會躲藏，所以不容易被抓到
  - 牠們更愛獨居，所以不會成群出現
  - 牠們更能適應環境，所以不怕獵人
  answer: A
- question: 5. 如果你要用這篇文章設計一則「保育提醒」，最符合文意的主張是？
  options:
  - 只要禁止所有狩獵活動，就能完全解決滅絕問
  - 等數量明顯變少再處理，才不會浪費資源人力
  - 把動物送進動物園就好，棲地保護不是最重要
  - 提前保護棲地並限制獵捕，避免物種走向滅絕題
  answer: D
