  - prompt: 根據課文摘要對螞蟻和蟋蟀的描述，最適合用來比較牠們的『主題』是什麼？
    type: select
    options:
    - 外觀與體型
    - 覓食習慣與棲息地
    - 社會結構與繁衍策略
    answer: 2
    reasoning: 原文描述螞蟻的「社會性昆蟲，分工嚴密」、「協助蟻后繁衍後代」和蟋蟀的「求偶」、「吸引女朋友的注意」、「交配繁殖下一代」，這些都指向社會結構與繁衍策略。
