multiple_choice:
- question: （ Ｄ ）1. 下列語詞，何者使用正確？
  options:
  - 他每年都「繁衍」許多新的計劃，讓公司逐漸擴大
  - 他在社交場合中四處「求偶」，似乎不願意安定下來
  - 他「鎮日」旅行，每天都在不同的城市度過
  - 這幅畫「體現」了藝術家對大自然的熱愛和敬畏
  answer: D
- question: 2. 文章提到螞蟻和蟋蟀行為的共同點是什麼？ (文中第二段)
  options:
  - 都是為了儲存食物
  - 都是為了延續生命
  - 都是為了避免天敵的捕食
  - 都是為了追求個體的娛樂
  answer: B
- question: 3. 「螞蟻可能覺得蟋蟀荒廢正業，蟋蟀則認為螞蟻缺乏情趣，但行為背後可能都有共同的目的」，這段文字表達了什麼意思？
  options:
  - 螞蟻和蟋蟀的一偏之見，經常讓自己看不到真相
  - 螞蟻和蟋蟀認為彼此的行為都應該改變，以符合各自的期望
  - 螞蟻和蟋蟀的行為可以互相借鑑，以達到更好的生存效果
  - 螞蟻和蟋蟀認為對方的行為不符合生物學上的生存需求
  answer: A
- question: 4. 作者對《伊索寓言》的批判主要是什麼？
  options:
  - 偏重教育目的，給昆蟲加了道德的標籤
  - 過度聚焦螞蟻的合作，而忽略蟋蟀的價值
  - 作者為蟋蟀打抱不平，高歌行為並沒有對錯
  - 強調昆蟲的個體行為，忽略了群體行為的重要性
  answer: A
- question: 5.「如果只從自己的角度出發，導致片面結論，常會因此失去對事物多元客觀的理解。」下列情況，哪一個不是片面的結論？
  options:
  - 看到一些畫家收入不高，便認定「藝術不能當飯吃」
  - 認為孩子只有在學校名列前茅，才會有成功的未來
  - 認為遊民不一定是好吃懶做，也許他們遭遇了不得已的困境
  - 認為穿粉紅色衣服的男生，有女性化的傾向
  answer: C
