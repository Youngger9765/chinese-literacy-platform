    type: select
    options:
    - 螞蟻和蜜蜂
    - 螞蟻和蟋蟀
    - 蟋蟀和蝴蝶
    answer: 1
    reasoning: 原文明確指出「螞蟻的合作是為了共同的生存，而蟋蟀則用不同的方式延續族群的生命」，顯示比較對象為螞蟻和蟋蟀。
  - prompt: 在課文摘要中，關於螞蟻的『集體行動』與『力量』，下列哪一項描述是正確的？
    type: select
    options:
    - 螞蟻喜歡獨自行動，力量微小。
    - 螞蟻集體出動，能扛起比自己體重大上數十倍的食物。
    - 螞蟻集體行動，但力量不大。
    answer: 1
