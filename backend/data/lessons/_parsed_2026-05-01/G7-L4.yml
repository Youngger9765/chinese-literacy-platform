vocabulary:
- word: 天兵
  definition: 原指天神的兵。現在被用來指稱搞不清狀况，做事糊塗、常出錯的人。
- word: 此起彼落
  definition: 這裡起來，那裡落下。形容連續不斷。
- word: 求偶
  definition: 尋找配偶。
- word: 鎮日
  definition: 整天。
- word: 覓食
  definition: 找尋食物。
- word: 基因
  definition: 遺傳的基本單位。
- word: 體現
  definition: 把抽象的東西具體的表現出來。例如：螞蟻的合作精神體現了群體的力量。
- word: 繁衍
  definition: 生物透過生殖的方式增加後代。
- word: 灌木
  definition: 主幹不明顯的矮小樹種。
- word: 紀律
  definition: 一個團體所有成員共同遵守的規則。
