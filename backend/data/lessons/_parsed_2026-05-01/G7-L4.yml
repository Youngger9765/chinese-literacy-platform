spotlight_raw_text: "閱讀聚光燈\n用表格整理訊息\n    之前我們學過可以將文章內容整理成表格。表格的優點有(1)幫助讀者快速看到文章的重點。(2)藉由訊息分類，將文章化繁為簡。(3)讓讀者能發現訊息的共同點或差異處。\n\
  　　在「L3女性太空人登月」，我們已經學過整理表格的步驟：\n(1)確認比較的對象：是什麼和什麼比較？寫在表格第一列。\n(2)找重點：先用鉛筆將每段可能的重點句（行為特徵）畫起來。\n\
  (3)想主題1.2…的名稱：從重點句判斷「主題」。 \n(4)寫表格左欄：將「主題」寫在表格左欄項目中。\n(5)將文章細節填入表格內。\n項目       \
  \    　　 對象\n對象１\n對象２\n228178317500主題１\n文章細節\n文章細節\n主題２\n文章細節\n文章細節\n　　現在就讓我們利用本課文章來練習看看吧！\n\
  ◎"
