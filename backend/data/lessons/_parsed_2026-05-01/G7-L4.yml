- （ A ）3. 「螞蟻可能覺得蟋蟀荒廢正業，蟋蟀則認為螞蟻缺乏情趣，但行為背後可能都有共同的目的」，這段文字表達了什麼意思？
- A.螞蟻和蟋蟀的一偏之見，經常讓自己看不到真相
- B.螞蟻和蟋蟀認為彼此的行為都應該改變，以符合各自的期望
- C.螞蟻和蟋蟀的行為可以互相借鑑，以達到更好的生存效果
- D.螞蟻和蟋蟀認為對方的行為不符合生物學上的生存需求
- （ A ）4. 作者對《伊索寓言》的批判主要是什麼？
