  - prompt: ❷找重點句：（兩段各有一個重點句）
    type: select
    options:
    - ①1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，證實了達爾文的預測。
    - ②科學家一直沒有直接證據說明天蛾和風蘭間的關係。
    - ③1992年，研究團隊拍到了長喙天蛾為風蘭授粉的畫面，這個跨世紀的謎題終於得到完整的解答。
    answer: 0
    reasoning: 原文中選項①和③前沒有「□」，表示它們是正確答案，且符合「驗證」的定義，說明了達爾文預測被證實的具體事件。選項②描述的是缺乏證據，不屬於驗證的重點句。由於JSON schema的`answer`為單一索引，故選擇第一個正確選項「①」。
  - prompt: '五、找「啟示」

      ※祕訣：「啟示」是從這個故事得到的道理或體會，點出作者想傳達的科學精神。

      ❶找段落：「啟示」出現在文章哪一段？（單選）'
    type: select
    options:
    - 段6
    - 段7
    - 段8
    - 段9
    answer: 3
    reasoning: 原文選項「段9」前沒有「□」，表示它是正確答案。根據課文內容，啟示在第九段提出。
