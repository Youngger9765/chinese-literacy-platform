multiple_choice:
- question: |-
    1. 達爾文在收到大彗星蘭標本時，最令他驚訝的是什麼？ A.花朵帶有約30公分長的花距 B.蘭花的花朵潔白芳香，形狀如星 C.蘭花屬於達爾文未見過的新品種 D.蘭花裡藏著一隻巨型飛蛾
  options: []
  answer: A
- question: |-
    2. 第五段末：「達爾文先生帶著他的預言離世了。人們開始淡忘他的推測，甚至淡忘這種神奇的風蘭。」這段話透露出當時人們對達爾文預言抱著什麼樣的態度？ A.半信半疑，選擇靜候未來證明 B.深信不疑，並持續投入尋找巨蛾 C.認為缺乏證據而漸漸不再關注 D.熱烈討論，使預言成為熱門話題
  options: []
  answer: C
- question: 3. 達爾文能提出長喙天蛾存在的推測，這顯示他具備怎樣的特質？
  options:
  - 敏銳的觀察力與嚴謹推理的能力 B.大膽想像但缺乏科學依據的作風 C.過度自信，容易忽略他人意見 D.謹慎保守，不願提出新假設
  answer: A
- question: |-
    4. 作者透過這篇文章最想傳達的用意是什麼？ A.介紹一項鮮為人知的科學發現，增進讀者的自然知識 B.倡導細心觀察與大膽假設的精神，激勵讀者勇於探索未知 C.批評當時科學界不尊重達爾文預言的態度，以警惕現代人 D.說明科學預言成真的不易，告誡研究者應該及早驗證假說
  options: []
  answer: B
- question: |-
    5. 下列哪一種情境最符合本文所體現的「見前人所未見」精神？ A.科學家只相信現有定論，排斥任何與傳統相悖的新假說 B.學生完全遵循教科書範例解題，毫無變通創意 C.探險家走訪前人踏過的路線，結果未有任何新發現 D.偵探憑藉他人忽略的細微線索成功破解疑案
  options: []
  answer: D
