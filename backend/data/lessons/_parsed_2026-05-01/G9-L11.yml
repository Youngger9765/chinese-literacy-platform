spotlight_raw_text: "閱讀聚光燈\n摘要策略—科學探究文本結構\n    這篇典型的科學探討文章，描述了科學史上一個膾炙人口的故事——達爾文見到一朵從未見過的蘭花，因而推測一種長喙天蛾的存在，這個推測在數十年之後，終於由其他的科學家驗證。\n科學探究文章中經常隱含著「觀察⭢提問⭢推測⭢驗證⭢啟示」等五個探究的成分（或元素）。閱讀時，你若心中有這五個步驟，並在文章裡找到它們，閱讀效率與理解都會大幅提升。\n接著，我們來練習用下列兩個步驟尋找文章的「觀察、提問、推測、驗證、啟示」五部分。\n❶找出成分（元素）在哪個段落\n❷找出各個成分的重點句\n一、找「觀察」\n※祕訣：「觀察」描述科學家看到了什麼重要的現象，常出現在文章開頭。\n　　❶找段落：「觀察」出現在文章哪些段落？（提示，有兩段）\n     段1   段2   □段3   □段4\n　　❷找重點句：\n本文開頭有多句描述達爾文觀察的句子，請判斷哪一句是觀察的重點句。（單選）\n□①達爾文逐一觀察，仔細在筆記本上記錄形態與結構。\n②一株名叫「大彗星風蘭」的蘭花格外引人矚目，它的花距長度竟超過三十公分！\n□③達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」\n60896526035000小撇步：\n②是重點句，直接點出達爾文觀察到的特殊現象（蘭花的花距長達三十公分）。①只是描述觀察的過程，③則已經是在提出疑問。\n\n二、找「提問」\n※祕訣：「提問」是科學家根據觀察提出的問題，研究想要解開的謎團，通常緊接在觀察之後出現，常會以問句呈現。\n　　❶找段落：「疑問」出現在文章哪個段落？\n□段1   段2   □段3   □段4\n❷找重點句：（單選）\n□①達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」\n②新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？\n23558529781500   小撇步：\n以上句子中，有兩句以問號結尾，表示主角提出了兩個提問。但②的提問（有沒有如此長口器的昆蟲）更關鍵，是研究要解決的謎題\n三、找「推測」\n※祕訣：「推測」是根據提問提出的大膽假設或可能的答案。「推測」常會有明顯的關鍵詞，例如「推測」、「猜想」、「預測」等。\n❶找段落：「推測」出現在文章哪一段？（單選）\n□段1   □段2   □段3   段4\n❷找重點句：\n□①這實在令人難以置信！\n②達爾文寫下推測：在馬達加斯加島上，應該有一種口器長達三十公分的蛾類，能夠幫這朵風蘭授粉。\n四、找「驗證」\n※祕訣：「驗證」指透過實驗或觀察找到證據來證明先前的推測。通常出現在文章後段，說明科學家找到的證據或得到結果。\n❶找段落：「驗證」出現在文章哪一段？（提示，有兩段）\n段6   □段7   段8   □段9\n❷找重點句：（兩段各有一個重點句）\n①1903年，科學家在馬達加斯加找到了口器長達30公分的天蛾，證實了達爾文的預測。\n□②科學家一直沒有直接證據說明天蛾和風蘭間的關係。\n③1992年，研究團隊拍到了長喙天蛾為風蘭授粉的畫面，這個跨世紀的謎題終於得到完整的解答。\n五、找「啟示」\n※祕訣：「啟示」是從這個故事得到的道理或體會，點出作者想傳達的科學精神。\n❶找段落：「啟示」出現在文章哪一段？（單選）\n□段6   □段7   □段8   段9\n❷找重點句：最後一段直接提到這個故事帶來「許多啟示」，請勾選這個故事帶來的啟示。（複選）\n①科學不只是描述所觀察到的現象，更要推論現象背後隱藏的機制。\n②科學不只是「眼見為憑」，未親眼所見之事，也能從理性與經驗中推論其答案\n③原來，科學就是從觀察裡提出好問題之後，「大膽假設，小心求證」的歷程。\n□④這樣的啟示，一代一代傳下來，成了每一位科學工作者的基本信念。\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 摘要策略—科學探究文本結構
  instruction: 本練習將引導你運用「觀察⭢提問⭢推測⭢驗證⭢啟示」五個步驟，分析科學探究文章的結構，並找出各成分的重點句。
  reasoning: 此練習旨在引導學生結構化閱讀科學探究文本，辨識其核心探究元素。我將原文的五個主要探究成分（觀察、提問、推測、驗證、啟示）作為主要步驟，每個成分又細分為「找出段落」和「找出重點句」兩個子步驟。答案的判斷依據原文中選項前的「□」（表示錯誤）或無「□」（表示正確），以及「小撇步」中的明確提示。對於原文中標示為「複選」或有多個正確答案的題目，由於JSON schema的`answer`欄位為單一索引，我將選擇第一個正確選項作為答案，並在該步驟的`reasoning`中說明其多選性質。
  steps:
  - prompt: '一、找「觀察」

      ※祕訣：「觀察」描述科學家看到了什麼重要的現象，常出現在文章開頭。

