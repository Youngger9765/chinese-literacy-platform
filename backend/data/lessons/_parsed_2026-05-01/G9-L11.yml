    - 段4
    answer: 0
    reasoning: 原文提示「觀察」出現在兩段，且「段1」和「段2」選項前沒有「□」，表示它們是正確答案。由於JSON schema的`answer`為單一索引，故選擇第一個正確選項「段1」。
  - prompt: '❷找重點句：

      本文開頭有多句描述達爾文觀察的句子，請判斷哪一句是觀察的重點句。（單選）'
    type: select
    options:
    - ①達爾文逐一觀察，仔細在筆記本上記錄形態與結構。
    - ②一株名叫「大彗星風蘭」的蘭花格外引人矚目，它的花距長度竟超過三十公分！
    - ③達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」
    answer: 1
    reasoning: 原文「小撇步」明確指出「②是重點句，直接點出達爾文觀察到的特殊現象（蘭花的花距長達三十公分）」。選項①描述觀察過程，選項③是提問，皆非觀察的重點句。
  - prompt: '二、找「提問」

      ※祕訣：「提問」是科學家根據觀察提出的問題，研究想要解開的謎團，通常緊接在觀察之後出現，常會以問句呈現。

      ❶找段落：「疑問」出現在文章哪個段落？'
    type: select
    options:
    - 段1
    - 段2
    - 段3
    - 段4
    answer: 1
    reasoning: 原文選項「段2」前沒有「□」，表示它是正確答案。根據課文內容，達爾文的疑問在第二段提出。
  - prompt: ❷找重點句：（單選）
    type: select
    options:
    - ①達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」
    - ②新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有長達30公分的口器……這世界上真的有口器這麼長的昆蟲嗎？
    answer: 1
    reasoning: 原文「小撇步」明確指出「但②的提問（有沒有如此長口器的昆蟲）更關鍵，是研究要解決的謎題」。雖然選項①也是提問，但選項②是更核心、推動後續推測的關鍵問題。
  - prompt: '三、找「推測」

      ※祕訣：「推測」是根據提問提出的大膽假設或可能的答案。「推測」常會有明顯的關鍵詞，例如「推測」、「猜想」、「預測」等。

      ❶找段落：「推測」出現在文章哪一段？（單選）'
    type: select
    options:
    - 段1
    - 段2
    - 段3
    - 段4
    answer: 3
    reasoning: 原文選項「段4」前沒有「□」，表示它是正確答案。根據課文內容，達爾文的推測在第四段提出。
  - prompt: ❷找重點句：
    type: select
