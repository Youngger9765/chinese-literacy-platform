genre: 說明文
title: 見前人所未見—達爾文與長喙天蛾的故事
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  神祕的包裹 1862年的一個早晨，世界上最知名的博物學家達爾文收到一個來自非洲的包裹。他小心翼翼地拆開包裹，裡面裝著幾株來自馬達加斯加島的植物標本。達爾文逐一觀察，仔細在筆記本上記錄形態與結構。就在這些標本之中，一株名叫「大彗星風蘭」的花格外引人矚目。 花朵潔白厚實、幾乎有手掌那麼大；最特別的，是它唇瓣後方那條細長的管子——「花距」。達爾文用尺一量，長度竟超過三十公分！達爾文難掩驚訝，他知道，那條細管裡通常藏著花蜜，用來吸引昆蟲。當一隻昆蟲出入花朵、大飽口福時，牠們身上就會沾上雄蕊的花粉，牠再飛到下一朵花時，這些花粉會碰到雌蕊，就幫忙完成授粉了。達爾文的疑問是：「這麼長的花距，真的有傳宗接代的功能嗎？」 驚人的發現 為了解開謎題，達爾文用一根細長的探針，小心的插入那條花距，探針越插越深，最後，在花距的末端，他採到了花蜜。有花蜜，表示蘭花的確是靠吸蜜的昆蟲完成授粉的！ 新的問題來了——昆蟲若要取得這朵花的花蜜，牠應該要有一個長達30公分的口器，才能嚐到花距末端甜美的花蜜。這樣的推論讓他更興奮、也更困惑。這世界上真的有口器這麼長的昆蟲嗎？這實在令人難以置信！但，如果沒有這樣的昆蟲，這種蘭花就不可能繁衍、不可能存在啊。因為當時已經發現有口器長達20公分的蛾，達爾文於是寫下他的推測：在馬達加斯加島上，應該有一種口器長達 30公分的蛾類，能夠幫這朵風蘭授粉。 被質疑的預言 「天方夜譚吧？」許多人覺得這個推論太荒唐。畢竟，30公分幾乎等於一張A4白紙的長邊，比一般鉛筆長兩倍多，這樣的昆蟲真的存在嗎？雖然倍受質疑，但達爾文仍堅信這是「共同演化」的結果——風蘭與那隻尚未被發現的昆蟲，長期互相依存、一起改變。若沒有那種蛾，風蘭就不可能繁衍。很可惜，1882年達爾文帶著他的預言離世，沒有人見過那隻天蛾。人們開始淡忘他的推測，甚至淡忘這種神奇的風蘭。他的推論，成了一個懸而未決的謎。 預測之物現身 白駒過隙，時光流轉，1903年，也就是達爾文提出推論之後40年，科學家在馬達加斯加終於找到了一隻奇特的蛾。牠翼展僅20公分，但將那根捲曲的口器攤開，竟然長達30公分！這一發現證實了達爾文的預測。為了紀念這段跨世紀的科學推理，這隻蛾被命名時，用了拉丁字praedicta，意思是「被預測的」意思，以紀念達爾文當年對未知的洞察。 然而，證據仍不完全。這種蛾數量稀少、棲息於偏遠地區，又只在夜間活動，幾乎是自然界中的幽靈般的存在。科學家一直沒有直接證據說明天蛾和風蘭間的關係。 相隔130年的印證 直到1992年的一個夜晚，研究團隊在叢林裡架設高速攝影機，終於捕捉到那個令人屏息的畫面——一隻長喙天蛾在月光下飛來，伸出三十公分長的口器，緩慢而精確地探入風蘭的尾端吸蜜。當牠起身之際，頭部與口器上沾滿花粉塊，成功完成授粉，這個跨世紀的謎題終於得到完整的解答。此刻，距離達爾文的預測已經有130年。 故事的啟示 達爾文這個膾炙人口的故事帶來許多啟示——原來，科學不只 是描述所觀察到的現象，更要推論現象背後隱藏的機制；原來，科學不只是「眼見為憑」，未親眼所見之事，也能從理性與經驗中推論其答案；原來，科學就是從觀察裡提出好問題之後，「大膽假設，小心求證」的歷程。這樣的啟示，一代一代傳下來，成了每一位科學工作者的基本信念，帶著全人類揭開一層層迷霧，看見美麗的未知世界。
