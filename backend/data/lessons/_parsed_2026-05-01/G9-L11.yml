    answer: 1
    reasoning: 選項②明確包含了「推測」一詞，並闡述了達爾文的具體假設，符合「推測」的定義。選項①僅為感嘆句，並非推測內容。
  - prompt: '四、找「驗證」

      ※祕訣：「驗證」指透過實驗或觀察找到證據來證明先前的推測。通常出現在文章後段，說明科學家找到的證據或得到結果。

      ❶找段落：「驗證」出現在文章哪一段？（提示，有兩段）'
