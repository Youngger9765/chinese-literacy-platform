multiple_choice:
- question: 1.請問下列語詞，何者使用正確？
  options:
  - 只要學會方法，就能輕鬆「駕馭」這套新軟體 B.媽媽罵我之後，我花了一點時間「磨合」我的心情 C.他唱歌太大聲，讓整個教室都產生「共鳴」 D.我昨天「構思」好了一篇作文，交給老師批改
  answer: A
- question: 2.作者在文中最後回應開頭問題「AI什麼都會，我們還需要學習嗎？」時，答案是什麼？
  options:
  - 不需要，因為AI足以取代所有的學習過程
  - 需要，AI越聰明，人類更需要學會駕馭AI C.有時需要，有時不需要，看個人的使用AI的能力
  - 需要，但只要學會使用AI就好，其他不必太在意
  answer: B
- question: 3. 作者提到「學習的重點，也許不再是誰記得多、誰算得快」，這句話隱含的意思是什麼？
  options:
  - 學校應該取消考試制度與評量方法
  - 學習的價值應轉向「發問、體驗與判斷」 C.讚嘆AI的能力的強大，減輕了學習負擔
  - 擔憂AI出現後，學生記憶力、計算力下降
  answer: B
- question: 4. 作者以「月經汙名化」作為開頭例子，其作用最可能是什麼？
  options:
  - 強調長久以來女性在生理議題上的委屈與不被理解 B.點出學生太依賴AI搜尋資料，缺乏自主思考能力 C.說明AI能解決社會性別平等問題，展現科技的進步 D.用生活化情境引出使用AI與人類學習的核心問題
  answer: D
- question: 5. 作者認為AI應該幫助學生思考，而不是取代學生的學習，下列哪一種做法最符合文意？
  options:
  - 學生用AI找到課文的重點，然後背誦這些重點
  - 學生用 AI 分析自己的學習，並照AI的建議行動
  - 學生利用AI查資料後，自己整理出觀點與問題
  - 學生把報告交給 AI 完成，最後加上一句自己的心得
  answer: C
