spotlight_raw_text: "閱讀聚光燈\n推論策略—找作者觀點與支持理由\n在前一課我們有學習到閱讀說明文或議論文時，如果想完全理解文章，就必須讀出「作者的觀點」和「支持觀點的理由」，以及推論出隱含的意義。觀點和支持理由間的關係，就像插圖中的桌子一樣，桌子要有腳才站得穩，觀點要有支持理由，才有說服力。\n10553705016500\n\n這次，我們再練習用❶～❸的步驟來讀出「作者的觀點、支持理由和隱含的意義」。\n   【❶確認觀點】   【❷找支持理由】   【❸推論隱含意義】\n(作者提出什麼主張？)  (用哪些證據支持？)  (隱含什麼深層意義？)\n一、作者在第一段提出了什麼「問題」？\n先看第一段：根據開頭「公民課月經討論」的情境，作者想讓讀者思考的問題是什麼？（請打勾，單選）\n□①月經之所以被汙名化的原因是什麼？\n②AI的功能越來越強，讓人懷疑是否還要學習？\n□③AI能快速整合資訊，讓人質疑AI的資訊都正確嗎？\n二、作者的回答：從各段標題找作者觀點、支持理由與隱含意義\n步驟❶──找作者觀點 \n　請你看四、五段，作者的觀點是什麼？（請打勾，單選）\n①AI懂回答，卻不懂發問，而「發問」才是思考與學習的起點。\n□②AI能在短時間提供各種資料與觀點，並且提供適當的評論。\n□③AI可以幫忙人類思考哪個觀點更有意義、更符合使用者需要。\n步驟❷──找支持理由\n祕訣：支持理由常出現在觀點後，通常是「事實、數據、例子、…」。"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 推論策略—找作者觀點與支持理由
  instruction: 這次，我們再練習用❶～❸的步驟來讀出「作者的觀點、支持理由和隱含的意義」。
  reasoning: 整體結構依循 guided_steps 類型。策略名稱和說明直接取自原文開頭。問題部分被解析為 steps 陣列。對於選擇題，prompt 直接取自問題文字，options 列出所有選項。答案是根據原文中未標示 □ 的選項來判斷。對於「步驟❷──找支持理由」部分，由於原文只提供了「祕訣」而非明確問題，我將其解釋為一個自由填答題，要求學生根據前一步驟的觀點和課文摘要找出支持理由，以符合該策略步驟的練習目的。
  steps:
  - prompt: 作者在第一段提出了什麼「問題」？先看第一段：根據開頭「公民課月經討論」的情境，作者想讓讀者思考的問題是什麼？（請打勾，單選）
    type: select
    options:
    - 月經之所以被汙名化的原因是什麼？
    - AI的功能越來越強，讓人懷疑是否還要學習？
    - AI能快速整合資訊，讓人質疑AI的資訊都正確嗎？
    answer: 1
    reasoning: 根據課文摘要第一段：「如果AI又快又好，我們還需要辛辛苦苦的看書、查資料嗎？」這句話直接點出了選項②的疑問。原文中選項②沒有 □ 符號，表示為正確答案。
  - prompt: 請你看四、五段，作者的觀點是什麼？（請打勾，單選）
    type: select
    options:
    - AI懂回答，卻不懂發問，而「發問」才是思考與學習的起點。
    - AI能在短時間提供各種資料與觀點，並且提供適當的評論。
    - AI可以幫忙人類思考哪個觀點更有意義、更符合使用者需要。
    answer: 0
    reasoning: 根據課文摘要第四段：「它懂『回答』，卻不懂『發問』——而『能提出問題』正是人類思考與學習的起點。」這句話直接支持了選項①的觀點。原文中選項①沒有 □ 符號，表示為正確答案。
  - prompt: 根據步驟❶找到的作者觀點，並參考課文摘要，請找出支持此觀點的理由。
    type: free_text
    reasoning: 此步驟旨在練習「找支持理由」策略。雖然原文未提供明確的選擇題或開放題，但其標題「步驟❷──找支持理由」和隨後的「祕訣」暗示了學生應在此處練習找出支持觀點的證據。因此，設計為一個開放題，讓學生根據前一步驟的觀點和課文內容自行歸納支持理由。
