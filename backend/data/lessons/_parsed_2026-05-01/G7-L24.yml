vocabulary:
- word: 鬱鬱蔥蔥
  definition: 植物長得很茂盛、很濃密，一片綠油油。
- word: 始終如一
  definition: 始：開始；終：結束。從開始到最後都一樣，沒有改變。常用來形容人的態度或品質從頭到尾都沒有改變。
- word: 冷冽
  definition: 形容天氣很冷，也可比喻語氣或氣氛嚴厲、刺骨。
- word: 校正
  definition: 修正錯誤，把不準或有偏差的地方調整回正確的狀態。可用於數據、儀器或觀點等。
- word: 狐疑
  definition: 像狐狸一樣多疑。比喻心中懷疑、拿不定主意。
- word: 所費不貲
  definition: 所費：花費的錢；不貲：不可計算。形容花費非常高。
- word: 雞皮疙瘩
  definition: 因為冷、害怕或噁心，皮膚冒出一粒一粒的小突起。
- word: 徒手
  definition: 不使用工具，只靠雙手做。
- word: 模擬
  definition: 模仿現實情境進行演練或實驗，用於教學、訓練或研究。
