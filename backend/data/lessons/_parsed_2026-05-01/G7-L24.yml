multiple_choice:
- question: 1.下列語詞何者使用正確？
  options:
  - 他講話太直接，需要花點時間去「校正」人際關係
  - 這間新開的餐廳裝潢豪華，設備頂級，是「所費不貲」的成果
  - 偵探已經掌握了線索，不再「狐疑」犯人的動機
  - 聽到朋友出國旅遊計畫，我不禁起了「雞皮疙瘩」，真是羨慕
  answer: B
- question: 2. 第六段提到「令人作嘔的『加菜』」，最可能指的是什麼？
  options:
  - 青菜裡加了肉片，味道變得很怪
  - 青菜裡混進讓人反胃的蠕動菜蟲
  - 青菜加了太多鹽巴，吃起來很噁心
  - 青菜份量突然變大，吃到最後想吐
  answer: B
- question: 3. 從第四段大仁哥的說明來看，垂直農場的哪一項特點最有助於穩定蔬菜品質？
  options:
  - 使用大量人工施肥，強化蔬菜營養
  - 利用太陽光與自然雨水的直接灌溉
  - 感測器與控制系統維持最佳環境
  - 建立戶外開放式栽培平台增加通風
  answer: C
- question: 4. 文中提及宇晴想到媽媽和祖母種菜的方式，「鼻子皺了起來，雞皮疙瘩掉了一地」，這段回憶與她當下在垂直農場的觀察有何關聯？
  options:
  - 對比出科技農業已經脫離了泥土與大自然
  - 雖然農業進步，但傳統農業仍帶給她懷舊感
  - 她經歷過高科技農業，已經難以回到傳統農業
  - 反映她對科技農業與傳統農業間的抉擇困難
  answer: C
- question: 5. 第六段大仁哥用「家庭理髮」和「髮廊設計師」作比較，主要想說明什麼？
  options:
  - 品質與專業的價值會帶來價格差異
  - 理髮技術不同，髮型就一定更好看
  - 家庭理髮比較省錢，所以更值得選
  - 髮廊設計師更辛苦，所以應該多收費
  answer: A
