  definition: 說 □太陽很大
- word: 含光「竭力」以口遍吮之
  definition: □用力 盡力
- word: 虎怒，力不得「肆」
  definition: 施展 □放肆
- word: 含光負其弟「疾」奔下嶺
  definition: 快速 □疾病
- word: 其弟尚「一息未殊」
  definition: □還有一口氣沒吸 一口氣還沒有斷絶
