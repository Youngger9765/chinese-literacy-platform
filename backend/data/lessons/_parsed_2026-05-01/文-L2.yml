discussion_content:
- （ 2 ）(1)天帝「使」我長百獸：擅長 命令 增加 使用
- （ 4 ）(2)虎不知獸「畏」己而走也：尊敬 擔心 危險 害怕
- （ 1 ）(3)子「隨」我後：跟隨 追隨 隨便 隨意
- 4.全句翻譯：
- 懂了文言文的代名詞，也能推測出不認識的字的意思，你應該就可以理解句義了。請勾選出「虎以為然，故遂與之行。獸見之皆走。」的正確翻譯。
- 老虎認為狐狸的話很有道理，所以就跟著他走，野獸看到老虎走在狐狸後面，全都嚇得逃走了。
- □老虎認為狐狸在騙人，所以就想看看狐狸要做什麼行為，野獸看到老虎後，全都嚇得逃走了。
- 5.讀出作者意圖：試試看，從文中角色的關係，推論作者意圖：（單選）
- 野獸們怕的是誰？（老虎 □狐狸），因為會害怕被牠吃掉。
- 狐狸藉著老虎讓自己看來很厲害，讓野獸們紛紛走避。
- →所以作者藉這個故事諷刺那些沒有真本事的小人，藉著大人物的權勢，提高自己的地位。
- 下課返家，事雜頗繁。舍弟閒置於椅，無所事事；喚，無動於衷；家嚴(父親)後至咱旁，無視其閒散，喚我做事。心偏之劣，厚此薄彼，吾欲哭無淚，憤恨難平。
- (1)這個故事有哪些角色？（複選）哥哥 弟弟 父親 □母親。
- (2)這個故事的作者是誰？哥哥 □弟弟 □父親。
- (3)請你把人物用螢光筆畫出來。
- (4)寫出字詞的意思（可用推論的方式喔！)
- 返： 回 ；繁： 繁重 ；閒置於椅： 閒閒地坐在椅子上 ；
- 喚： 叫 ；心偏之劣：實在很偏心；厚此薄彼：對他好、對我差；
- 無視其閒散，喚我做事： 沒有看到弟弟閒散，只叫我做事 。
- (5)推測作者想要傳達的意圖：
- 抱怨爸爸對弟弟偏心，都叫我（哥哥）做事。 。
- （ D ）1. 下列文句，何者語詞使用最恰當？
- A.小朋友被路上的石頭絆倒「墜地」，痛得哇哇大哭
- B.為了這場比賽，他練習游泳許久，在泳池中大汗「淋漓」
- C.他看起來很面熟，我苦思良久，「俄而」才喚出他的名字
- D.街頭畫家掌握模特兒的神韻，運筆「疾速」，完成畫像
- （ A ）2. 閱讀完本篇課文，請問有關「文言文」的敘述，何者為不正確？
- A.文言文的出現是為了要記錄古代的生難字，以供後人閱讀
- B.因為古代書寫成本很高，文言文大幅精簡了需要紀錄的文字
- C.文言文是書面用語，和古人平常說話的方式有所不同
- D.精簡文字的方式有精簡用詞、省略主詞和受詞及省略連接詞
- （ B ）3. 下列選項，何者無法證明含光與老虎歷經一番搏鬥？
- A.左手據虎頸，右手以鞭亂捶虎頭，呼號󠇡聲震山谷
- B.含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地
- C.虎怒，力不得肆，舍其弟據嵎而吼，將以搏含光
- D.猛虎攫其弟去。含光大驚墜地，持短鞭力追
- （ C ）4. 下列何者是作者(曾世杰)想要學生學到的概念？
- A.宣揚文言文寫作之美，推廣文言文
- B.說明文言文中生字、難字、古字的字義
