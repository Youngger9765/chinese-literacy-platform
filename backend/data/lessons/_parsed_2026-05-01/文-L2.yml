multiple_choice:
- question: 1. 下列文句，何者語詞使用最恰當？
  options:
  - 小朋友被路上的石頭絆倒「墜地」，痛得哇哇大哭
  - 為了這場比賽，他練習游泳許久，在泳池中大汗「淋漓」
  - 他看起來很面熟，我苦思良久，「俄而」才喚出他的名字
  - 街頭畫家掌握模特兒的神韻，運筆「疾速」，完成畫像
  answer: D
- question: 2. 閱讀完本篇課文，請問有關「文言文」的敘述，何者為不正確？
  options:
  - 文言文的出現是為了要記錄古代的生難字，以供後人閱讀
  - 因為古代書寫成本很高，文言文大幅精簡了需要紀錄的文字
  - 文言文是書面用語，和古人平常說話的方式有所不同
  - 精簡文字的方式有精簡用詞、省略主詞和受詞及省略連接詞
  answer: A
- question: 3. 下列選項，何者無法證明含光與老虎歷經一番搏鬥？
  options:
  - 左手據虎頸，右手以鞭亂捶虎頭，呼號󠇡聲震山谷
  - 含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地
  - 虎怒，力不得肆，舍其弟據嵎而吼，將以搏含光
  - 猛虎攫其弟去。含光大驚墜地，持短鞭力追
  answer: B
- question: 4. 下列何者是作者(曾世杰)想要學生學到的概念？
  options:
  - 宣揚文言文寫作之美，推廣文言文
  - 說明文言文中生字、難字、古字的字義
  - 告訴讀者文言文的由來以及閱讀的策略
  - 說明文言文傳承古人智慧，現代人不可不學
  answer: C
