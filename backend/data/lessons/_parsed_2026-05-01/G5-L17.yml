vocabulary:
- word: 晝伏夜出
  definition: 白天藏起來，夜晚才出現；「晝」是白天，「伏」是潛伏；描述夜行性動物的習性。
- word: 成效斐然
  definition: 工作的績效非常好。
- word: 刻不容緩
  definition: 形容情況十分緊急，一刻也不容耽擱。
- word: 表彰
  definition: 對傑出表現的表揚或獎勵。
- word: 肉眼
  definition: 人的眼睛，指不倚賴眼鏡或光學設備的視力。
- word: 刨地
  definition: 動物用爪子或人用工具抓地。
- word: 雜草叢生
  definition: 無人管理的土地長滿各種野生植物的樣子。
- word: 層出不窮
  definition: 形容壞事不斷出現，似乎沒有盡頭。（注意：這個詞不能用來形容好事）。
- word: 繁殖
  definition: 生出新的生命，讓物種的數量增加。例如，老鼠生出小老鼠、植物的種子變成小苗，都是繁殖。
- word: 救苦救難
  definition: 提供救助，使人脫離痛苦與災難。
- word: 效能
  definition: 一定時間之內的成效。「工作效能很好」指的是工作做得又快、又好。
