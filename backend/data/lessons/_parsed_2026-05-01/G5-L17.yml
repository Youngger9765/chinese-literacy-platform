title: 掃雷英雄馬嘎瓦
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  馬嘎瓦是一隻非洲巨鼠，牠長的和台灣常見的田鼠很像，但是大了三、四倍，有小貓那麼大，約1到1.5公斤重。巨鼠晝伏夜出，繁殖力強，讓農民傷透腦筋。沒想到，後來有科學家看到牠們嗅覺靈敏的優點，在訓練後，開始用巨鼠在全球各地偵測地雷，成效斐然！ 地雷是一種埋在土裡的炸彈，人員或車輛壓過時，只要重量超過6公斤，就會爆炸，殺傷敵人。地雷製造容易，成本低廉，戰爭時，軍人經常在重要的地點埋設地雷，好讓敵人無法通過。最糟糕的是，雖然地雷是為了殺傷敵對陣營的武裝人員而設置的，但是地雷殺傷的平民更多。即使戰事已經結束幾十年，被地下的地雷殺傷的情況仍然層出不窮，造成人們行動時的害怕與不便。聯合國估計，2015年全世界約有6,500人因地雷而死亡或受傷，大多數受害者是平民，其中三分之一是兒童。因此，偵測和掃除地雷成為刻不容緩的工作。 但地雷埋在地下，肉眼看不出來，要怎麼掃雷呢？這時馬嘎瓦和牠的弟兄姊妹就派上用場了。 傳統上，軍隊的掃雷人員要手持金屬探側器，像除草機一樣左右扇形擺動，如果探測器嗶嗶作響，就表示地下有金屬，掃雷人員就會停下來，小心翼翼的用小鏟子挖掘，確定是地雷後，再遠距引爆。若使用馬嘎瓦掃雷，牠靠「嗅覺」偵測地雷，只要聞到地雷裡的TNT炸藥，馬嘎瓦就會原地不動，用爪子刨󠇡地，工作人員會立刻在這個地點插上小旗子，確認是地雷後，再遠距引爆。表１整理了使用巨鼠掃雷的許多優點。 表1 兩種掃雷方式的比較：「金屬探測器」和「非洲巨鼠」 簡單的說，以巨鼠掃雷相對安全、有效能、便宜而且方便。例如，馬嘎瓦可在30分鐘內掃描完一個網球場大小的區域，而人類使用金屬探測器則需要1至4天才能完成相同的任務。 從2000年到今天，在非洲的安哥拉、莫三比克和亞洲的柬埔寨等國家，巨鼠已經幫助清理了超過2,300萬平方公尺的土地，找到107,600枚地雷和未爆炸的彈藥。其中最知名的掃雷鼠就是馬嘎瓦，牠在柬埔寨掃雷五年，成功發現71枚地雷和38件未爆炸物，協助清理了相當於42個足球場大小的土地，預防了大批平民與兒童的傷亡，並且讓大片的土地可以重新被開發利用。2020年，英國獸醫慈善協會頒發了動物勇氣金牌獎給馬嘎瓦，表彰牠為拯救生命所做的重大貢獻，在馬嗄瓦和眾多弟兄姊妹的努力下，巨鼠的形像，已經從令人噁心的大老鼠，轉變成救苦救難的英雄了。
