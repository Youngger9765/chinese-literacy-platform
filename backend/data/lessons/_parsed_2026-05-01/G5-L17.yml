multiple_choice:
- question: 1. 下列語詞何者使用正確?
  options:
  - 既然此事「刻不容緩」，明天再處理就好了
  - 這場脫口秀實在太好笑了，「效能」超級讚
  - 近年來，網路謠言「層出不窮」，必須提高警覺
  - 籃球校隊在跨校聯賽裡連三敗，「成效斐然」（前後邏輯錯誤）
  answer: C
- question: 3. 根據表1，使用巨鼠掃雷的優勢不包括哪一項？
  options:
  - 掃雷速度比金屬探測器快
  - 可以直接引爆地雷，減少人力需求
  - 訓練和飼養成本比金屬探測器低
  - 在雜草叢生的環境中仍能有效工作
  answer: B
- question: 4. 巨鼠掃雷時為什麼不會引爆地雷？
  options:
  - 因為巨鼠受過專業訓練
  - 因為巨鼠嗅覺很靈敏
  - 因為巨鼠體重很輕
  - 因為巨鼠不會踩在地雷上
  answer: C
- question: 5. 文章提到，巨鼠的形象發生了什麼變化？
  options:
  - 牠們從討厭的農業害蟲，轉變為重要的掃雷工具
  - 牠們從被當作實驗動物，變成受保護的瀕危物種
  - 牠們從被當作寵物飼養，轉變為軍用動物
  - 牠們從森林動物，變成都市中常見的寵物
  answer: A
