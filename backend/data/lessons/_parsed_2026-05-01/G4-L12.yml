vocabulary:
- word: 嘲弄
  definition: 取笑或羞辱別人，讓人難堪。
- word: 調侃
  definition: 用開玩笑的語氣說話，有時帶點諷刺。
- word: 歉疚
  definition: 因為做錯或對別人造成傷害而感到不好意思。
- word: 靦腆
  definition: 害羞、不太敢表現自己。
- word: 飛馳而過
  definition: 形容速度很快，像風一樣奔馳過去。
- word: 哽咽
  definition: 因為情緒激動，說不出話或聲音顫抖。
- word: 小心翼翼
  definition: 形容非常小心，害怕弄壞或做錯。
- word: 輕蔑
  definition: 看不起人、態度不屑或鄙視。
- word: 譏諷
  definition: 嘲笑、諷刺別人，讓人感到受辱。
- word: 刮目相看
  definition: 改變原本看法，重新用欣賞的眼光看待某人。
- word: 忐忑不安
  definition: 心情緊張、焦慮，不知道會發生什麼事。
