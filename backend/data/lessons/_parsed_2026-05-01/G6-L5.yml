title: 卡通人氣王票選政見發表會
authors: 課文 ：黃金萍學習單：陳允捷
story_text: |-
  「卡通人氣王」的票選活動開始了！ 哆啦Ａ夢、魯夫是經由分組討論推選出來的卡通人氣王候選人。各組的發言代表已經在一旁摩拳擦掌，準備大展身手；至於用心準備的各項宣傳道具、造型妝扮等，也都紛紛呈現，宛如一場「政見發表會」。 這場發表活動的主持人是班長，她上了講台，清清喉嚨說：「讓我們歡迎第一組的同學上場!」 「大家好！請問：我手上拿的銅鑼燒，是哪一位卡通人物的最愛呢？」第一組的代表說完之後，馬上張口一咬，把銅鑼燒咬下一大塊。 「哆啦Ａ夢！」全班異口同聲。 「賓果！哆啦Ａ夢不是普通的機器貓，而是陪伴大雄成長的親密好友；有時像守護神般的呵護著大雄，有時也會糾正大雄的錯誤觀念。他對朋友無私，每當大雄遇到麻煩，他就會提供適當的建議或從百寶袋裡掏出法寶，幫助……」 他還沒講完，小妤脫口而出：「我最崇拜他有百寶袋。」無視台上正在發表的同學。 「請聽完介紹後再舉手發言，這樣我們才能了解各個卡通人物。」主持人看了小妤一眼，接著趕緊請台上同學繼續。 「哆啦Ａ夢不僅使用各種功能強大的法寶幫助大雄，也很樂意協助大雄的朋友們。雖然胖虎、小夫常欺負大雄，但是他仍然大方伸出援手，幫他們解決困難。」發言代表順利的完成說明。 「針對剛才的報告，大家有沒有疑問或反對的意見？」主持人詢問後，留意到有人舉手。 「育勤，請說！」 「雖然百寶袋裡有任意門、時光機或竹蜻蜓等令人驚奇的法寶，但是沒有一樣可以幫哆啦Ａ夢抗拒銅鑼燒的誘惑。有一次，大雄曾經以銅鑼燒來和哆啦Ａ夢交換條件，要他幫忙寫數學作業。哆啦Ａ夢這樣做，可能會讓大雄養成逃避問題的習慣。」同學們聽完育勤有條有理的分析，頻頻點頭。 第二組代表──夏恩，一個箭步衝上台，高舉右手，大聲一喊，「我是魯夫，我要成為航海王！」吸引全班目光，教室裡瞬間鴉雀無聲。 「魯夫從小被爺爺帶大，缺少父母照顧，還吃了橡膠果實，可以隨意伸縮自己的身體，雖然擁有橡膠的彈力，刀槍不入，但從此必須要遠離尖銳的物品。在追求夢想的過程，他經歷過許多艱辛和危險，但都能勇敢克服，而且不會為了追求夢想傷害別人，他寧願自己受傷，也不讓同伴身陷危險，因此能獲得同伴信任……，這是魯夫和其他海賊不同的地方。」同學們全神貫注的聆聽。第二組發表完後，主持人請大家分享自己的看法。「我覺得魯夫有時太莽撞了，很容易中計而受騙上當。」育勤舉手發言，說出對魯夫的看法。 票選活動進入最後階段，主持人為發表會做總結。「謝謝大家發表了自己的觀點，謝謝大家專心聆聽彼此的意見，誰會成為第一名的卡通人氣王？我們就投票來決定囉！」
