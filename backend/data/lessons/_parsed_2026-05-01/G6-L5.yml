spotlight_raw_text: "閱讀聚光燈\n推論主旨\n62230350520\n方法200\n方法2推論文章主旨的方法：\n摘取文章的大意＋找出關鍵語句。\n通常作者在敘述事件後，會在文章最後位置表達心得感受或收穫，與主題相連結。讀者在整合課文大意及關鍵語句後，可推論文章主旨。\n 1.寫出本課大意\n班上正舉辦【 卡通人氣王   】的票選活動。候選卡通人物有哆啦A夢和魯夫。各組派代表上台，為候選卡通人物進行【  政見發表會      】，介紹他們的特色。主持人讓大家都有舉手發表的機會，在【 小妤  】（人名）打斷會議的時候，能適時提醒，讓每個人都能分享【自己的看法        】。\n2.作者通常會在文章結尾處，表達感受或說明道理，這就是關鍵語句。這一課的文章內容是政見發表會，以下文章結尾的句子，哪一句最可能成為關鍵語句？請打勾。(單選)\n□票選活動進入最後階段，主持人為發表會做總結。\n謝謝大家發表了自己的觀點，謝謝大家專心聆聽彼此的意見。\n□誰會成為第一名的卡通人氣王？我們就投票來決定囉。\n3.下列哪一個選項敘述符合本課主旨？請打勾。(單選)\n□A.少數服從多數，最優秀的人就是你自己。\nB.每個人都可以有不同的觀點，我們應該彼此尊重。\n□C.只要我喜歡，有什麼不可以。\n□D.人可以犯錯，但是不可犯同一個錯。\n4.透過這一課，我學到了什麼？ \n　  勇於發表自己的想法／尊重他人／如何找出文章主旨    \n  \n51276546100\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 推論主旨
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  reasoning: 此練習旨在引導學生透過「摘取文章大意」和「找出關鍵語句」兩個步驟，來推論文章主旨。題目設計依序從大意填空、關鍵語句判斷，到主旨選擇，最後以學習反思作結，完整實踐了「推論主旨」的策略方法。
  steps:
  - prompt: '寫出本課大意

      班上正舉辦【 卡通人氣王   】的票選活動。候選卡通人物有哆啦A夢和魯夫。各組派代表上台，為候選卡通人物進行【  政見發表會      】，介紹他們的特色。主持人讓大家都有舉手發表的機會，在【 小妤  】（人名）打斷會議的時候，能適時提醒，讓每個人都能分享【自己的看法        】。'
    type: free_text
    reasoning: 此題要求學生填寫文章大意，這是推論主旨策略的第一步，旨在讓學生掌握文章的整體內容和主要事件。
  - prompt: 作者通常會在文章結尾處，表達感受或說明道理，這就是關鍵語句。這一課的文章內容是政見發表會，以下文章結尾的句子，哪一句最可能成為關鍵語句？請打勾。(單選)
    type: select
    options:
    - '票選活動進入最後階段，主持人為發表會做總結。

      謝謝大家發表了自己的觀點，謝謝大家專心聆聽彼此的意見。'
    - 誰會成為第一名的卡通人氣王？我們就投票來決定囉。
    answer: 0
    reasoning: 此題旨在訓練學生辨識文章中的「關鍵語句」，特別是結尾處表達感受或道理的句子。選項一「謝謝大家發表了自己的觀點，謝謝大家專心聆聽彼此的意見」表達了尊重與聆聽的道理，符合關鍵語句的定義；選項二僅為活動的程序性結語，不含深層意義。原文中，正確答案通常沒有「□」標記，但此處兩個選項都有，故依據策略定義判斷。
  - prompt: 下列哪一個選項敘述符合本課主旨？請打勾。(單選)
    type: select
    options:
    - A.少數服從多數，最優秀的人就是你自己。
    - B.每個人都可以有不同的觀點，我們應該彼此尊重。
    - C.只要我喜歡，有什麼不可以。
    - D.人可以犯錯，但是不可犯同一個錯。
    answer: 1
    reasoning: 此題要求學生綜合文章大意和關鍵語句，推論出文章的主旨。根據課文摘要中主持人提醒小妤尊重發言的行為，以及選項二所表達的「每個人都可以有不同的觀點，我們應該彼此尊重」的理念，最符合文章所傳達的核心價值。原文中，正確答案B沒有「□」標記，符合判斷規則。
  - prompt: 透過這一課，我學到了什麼？
    type: free_text
    reasoning: 此題為開放性問題，旨在鼓勵學生反思和歸納本課所學，包括內容知識（如尊重他人、表達想法）和閱讀策略（如如何找出文章主旨），以鞏固學習成效。
