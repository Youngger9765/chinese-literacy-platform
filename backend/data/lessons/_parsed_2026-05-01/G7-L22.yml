multiple_choice:
- question: 1. 下列語詞何者使用正確？
  options:
  - 民眾從各地湧入跨年晚會，廣場擠滿了「南轅北轍」的人潮
  - 父親勤懇工作以累積財富，為家庭「傾家蕩產」的付出
  - 這個命案發生在密室，兇手如何潛入作案，令警方「匪夷所思」
  - 哨聲一響，大家「衝鋒陷陣」的跳入水中，泳渡日月潭
  answer: C
- question: 2. 根據課文第九段，「聽其言、觀其行」的信眾，最容易做出何種舉動？
  options:
  - 信徒對教主的言論以及行為都深信不疑
  - 用一個人的外貌，決定他是否可以信任
  - 如果對方可以說服我，我就決定信任他
  - 觀察其言行是否一致，再決定是否信任
  answer: D
- question: 3. 根據你對課文的理解，教主預言失敗後，信眾對教主的態度是否轉變？答案為「視情況而定」，這個答案和底下哪一選項的意思最相似？
  options:
  - 必須看信眾得到什麼證據而定
  - 必須看信眾投入此信仰的程度而定
  - 必須看教主是否真能提供救贖而定
  - 必須看教主是否能自圓其說而定
  answer: B
- question: 4. 根據作者的說法，如果有一位「教主」的預言和承諾，到後來都沒有實現，下列哪一類的信眾，最有可能繼續跟隨著教主？
  options:
  - 和教主保持距離、較少參與，而且承諾較低的信眾
  - 教育程度低、年紀最大、比較迷信的信眾
  - 平常就抱著「聽其言、觀其行」態度的信眾
  - 為了擁護教主，捐了最多錢，或和親友斷絶關係的信眾
  answer: D
- question: 5. 根據本文，哪一選項最可能是作者想要傳達的意涵？
  options:
  - 人們在作決策時，總是根據證據作出判斷
  - 人們在做決策時，信念的影響會超過證據
  - 愈崇拜教主，愈投入信仰，愈可能得到救贖
  - 為了信仰和朋友斷絶關係或傾家蕩產很愚蠢
  answer: B
