vocabulary:
- word: 廝殺
  definition: 互相打殺，有競爭、比賽之意。
- word: 自圓其說
  definition: 解釋自己的矛盾說法。
- word: 益發
  definition: 更加的。
- word: 南轅北轍
  definition: 有非常大的差異；字面意思是原本想去南方卻駕車向北行駛。
- word: 匪夷所思
  definition: 不是一般人根據常理所能想像出來的。
- word: 前仆後繼
  definition: 作戰時前面的人倒下，後面的繼續往前衝。☞比喻一群人不怕犧牲，勇往向前。
- word: 衝鋒陷陣
  definition: 勇猛奮進，不怕困難。形容面對困難時，所表現出的勇氣和毅力。
- word: 罪孽
  definition: 罪惡、過失。
- word: 傾家蕩產
  definition: 為了做某件事，用光了家中全部的財產。
