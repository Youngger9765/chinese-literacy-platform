multiple_choice:
- question: 1. 下列語詞何者使用正確？
  options:
  - 滷肉飯在臺灣是一個非常「珍稀」的食物
  - 這船超載，港口又不夠深，因此「擱淺」在港口
  - 我們應勇於創新，才能「束縛」傳統框架
  - 洪水之後，災民無家可歸四處「流竄」
  answer: B
- question: 2. 根據課文，藍鯨現今為瀕危物種，造成藍鯨大量滅絕的原因為何？
  options:
  - 博物館需要製作標本，所以大肆獵捕藍鯨
  - 人類為了自身的利益，所以大肆獵捕藍鯨
  - 因為海水暖化，便造成藍鯨的棲息地不足
  - 因為魚群減少，藍鯨無法覓得足夠的食物
  answer: B
- question: 3. 請選出最符合第三段藍鯨被人發現的模樣？
  options: []
  answer: D
- question: 4. 本文說了許多的「事實」，也有許多的「判斷（或評論）」，請問底下選項中，哪一個是作者的「判斷」呢？
  options:
  - 小藍鯨的死亡凸顯人類的無知
  - 2020年1月25日鯨魚擱淺的新聞
  - 專家發現小藍鯨生前被海廢漁具繩索纏繞住頭部
  - 海生館進行藍鯨的骨骼重建與典藏
  answer: A
- question: 5. 下列何者為本文作者的寫作意圖？
  options:
  - 透過「巨鯨之死」個案的精彩描述，吸引讀者參觀海生館
  - 以小藍鯨的個案凸顯人與環境的關係，及環境教育重要性
  - 強調事件發生的日期，呼籲當天可以成為臺灣的特別節日
  - 透過小藍鯨重生的故事，凸顯人類創意可以化腐朽為神奇
  answer: B
