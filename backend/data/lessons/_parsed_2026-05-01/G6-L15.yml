- question: 1. 下列語詞何者使用正確？
  options:
  - 滷肉飯在臺灣是一個非常「珍稀」的食物
  - 這船超載，港口又不夠深，因此「擱淺」在港口
  - 我們應勇於創新，才能「束縛」傳統框架
  - 洪水之後，災民無家可歸四處「流竄」
  answer: B
- question: 2. 根據課文，藍鯨現今為瀕危物種，造成藍鯨大量滅絕的原因為何？
  options:
  - 博物館需要製作標本，所以大肆獵捕藍鯨
  - 人類為了自身的利益，所以大肆獵捕藍鯨
  - 因為海水暖化，便造成藍鯨的棲息地不足
  - 因為魚群減少，藍鯨無法覓得足夠的食物
  answer: B
- question: 3. 請選出最符合第三段藍鯨被人發現的模樣？
  options: []
  answer: D
- question: 4. 本文說了許多的「事實」，也有許多的「判斷（或評論）」，請問底下選項中，哪一個是作者的「判斷」呢？
