  - 海生館進行藍鯨的骨骼重建與典藏
  answer: A
- question: 5. 下列何者為本文作者的寫作意圖？
  options:
  - 透過「巨鯨之死」個案的精彩描述，吸引讀者參觀海生館
  - 以小藍鯨的個案凸顯人與環境的關係，及環境教育重要性
