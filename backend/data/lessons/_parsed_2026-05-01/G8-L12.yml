multiple_choice:
- question: 1. 請問下列語詞，何者使用錯誤？
  options:
  - 這條馬路又直又長，兩旁的景色幾乎一樣，看起來「如出一轍」
  - 這本書用故事開場的方式講解歷史，內容「引人入勝」
  - 他長年救災，面對災難事件早已「司空見慣」，仍能冷靜處理
  - 這位設計師的想法「天馬行空」，創意常讓人眼睛為之一亮
  answer: A
- question: 2. 作者說語言「即使過了數百年歲月的淘洗，發音已經略有改變，仍可溯源」，最接近的意思是什麼？
  options:
  - 語言一旦發音改變，就很難再追查到更早的來源
  - 語言隨著時間推移會逐漸消失，因此不具研究價值
  - 語言即使發音改變，仍可能追查到更早的來源與根。
  - 語言隨時間改變的只有發音，原本的語意一定不會改變
  answer: C
- question: 3. 文中舉「那個→辣個」、「很熱→很樂」的例子，是用來說明什麼？
  options:
  - 臺灣人說話咬字不清楚
  - 語言會自然演化、產生音變 C.南島語族之間的語言完全相同
  - 年輕人喜歡創造新詞
  answer: B
- question: （ Ｂ ）5. 每一篇文章都有吸引讀者的賣點，你覺得這篇課文作者最大的賣點是哪一選項？
  options:
  - 從萬華地名的溯源切入，讓讀者了解地名背後的文化意義
  - 透過跨島語族詞彙的相似性引起驚奇，再說明其背後的觀點
  - 詳細介紹南島語族的分布範圍，讓讀者認識其活動區域之廣
  - 運用專業的語言學知識與研究成果，提高文章的學術深度。
  answer: B
