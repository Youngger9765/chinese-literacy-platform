genre: 說明文
title: 語言的足跡：從臺北 萬華到南太平洋的航海之路
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: 三百多年前，臺北盆地 淡水河和新店溪的匯流處，有一個舟船雲集的小港口，凱達格蘭族和泰雅族的原住民以小船載著山產海味，來這裡與漢人交易，因為當地的原住民稱呼「小船」或「獨木舟」為「manga」，後來這個港口就被稱為manga。日治時期，這個地名才被改為諧音的「萬華」。 萬華的地名典故，讓我們明白一件耐人尋味的事：原來我們今天用的語詞，即使過了數百年歲月的淘洗，發音已經略有改變，仍可溯源至當地原住民的古老語彙。這已經很有趣了，但更引人入勝的還在後頭。 你知道嗎？不只三百年前的臺北使用manga這個詞，東南亞（如菲律賓、印尼、新幾內亞）和南太平洋（薩摩亞、紐西蘭）諸多島嶼上的族群，千百年來也皆以manga（或vanga）指稱小船或獨木舟。人類學家把這些使用相似語言的族群稱為「南島語族」。 南島語族共享著許多相似的語彙。例如，眼睛皆稱「馬大（mata）」，繩索稱「里那（lina）」，母親稱「以娜（ina）」。有一年，臺東辦理南島文化節活動，南太平洋 斐濟的表演團隊在臺東街上發現了一家「以娜早餐店」，倍感親切。因為他們的語言裡，媽媽叫做提娜（tina），和ina的音義如出一轍。 數字亦然。多數南島語族將「5」說成「里馬（lima）」，少數族群則說「尼馬（nima）」或「綠馬（rima）」。這種細微的音變，就像我們把「那個」說成「辣個」、把「很熱」說成「很樂」，都是語言傳遞過程中司空見慣的自然演化。表1彙整了幾個最常被提及的南島語族共通語彙。 表1 南島語族最常被提起的跨族共通詞彙 新的疑問接踵而來：南島語族散居於南太平洋、南海、印度洋諸島，彼此之間隔著浩瀚無垠的海洋，他們怎麼可能說著近似的語言？從臺灣到復活節島的直線距離約有15,000公里吔！難道是有外星訪客頒布共同語言教材，再派語言教師搭著飛碟巡迴各島授課？講到這裡，你大概會忍不住翻白眼：「拜託，別再天馬行空了！」 言歸正傳󠇡，目前科學界較廣為接受的理論是：約三千五百年前，這些語族擁有共同的祖先，他們精於航海，從起源地逐步遷徙至鄰近島嶼，再從這些島嶼持續拓展。歷經千年的開枝散葉，各地語言雖已無法互通，卻仍留存部分共同的語彙，成為語言親緣的證據。 語言是一條跨越千年的足跡，它不僅記錄族群遷徙的方向，也默默保存了人們如何在島嶼之間往返、交流、生活的歷史。大洋中的南島語族彼此遙隔，卻在共享語彙中暗藏語源線索。無論是稱呼小船的manga、表示親情的ina、指向世界的mata，抑或數字5的lima，都像是一條條細緻的語言纜繩，把遙遠的島嶼重新牽繫起來。新的問題來了，到底哪裡才是語言散播的源頭呢？這個答案居然落在臺灣四處可見的構樹身上，我們下一課再談。
