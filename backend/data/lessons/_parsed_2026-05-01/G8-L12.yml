spotlight_raw_text: "閱讀聚光燈\n推論策略—從例子推論作者觀點\n這篇課文和上一篇虎襲課文一樣，作者沒有一開始就直接告訴你他的想法，反而先安排一連串吸引讀者注意的例子，為同一個觀點鋪路。所以，這一課你要學習的，仍然是下面這個策略，請你默讀一次。\n從作者反覆舉的例子中，推論他真正想表達的觀點。\n   語言的足跡這篇文章，作者仍然是透過反覆的例子，來表達一個特定的想法。我們再練習一次，用❶～❸的步驟「推論（歸納）作者的觀點」。\n   【❶找例子】 【❷找共同點】【❸推論觀點】\n\n一、步驟❶──找例子\nA.作者在文中舉了不少語詞例子。請勾選這些語詞「出現在哪些地區」，\n為下一步找出它們的共同點做準備。（複選）\n語詞（作者舉的例子）\n出現地區（觀察分布）\n1.manga、 vanga（小船）\n①臺灣 ②東南亞 ③南太平洋\n2.mata（眼睛）\n①臺灣 ②東南亞 ③南太平洋\n3.lina（繩索）\n①臺灣 ②東南亞 ③南太平洋\n4.ina / tina（母親）\n①臺灣 ②東南亞 ③南太平洋\n5.lima / nima / rima（五）\n①臺灣 ②東南亞 ③南太平洋\n\nB.第五段用來說明「音變很常見」的兩個生活例子（請打勾，複選）\n   那個→辣個　很熱→很樂　□ 很冷→很勒\n➡小祕訣：看到「例如、就像、亦然」常常就是例子要出現了。\n二、步驟❷──找這些例子的共同點：\n  作者想讓我們注意到這些例子什麼共同點？（請勾選，單選）\n①南島語族分布在不同地區，卻出現相似發音的詞彙\n□②例子顯示語言會一直改變，無法留下任何線索\n□③例子來自不同語言，所以彼此沒有關聯\n三、步驟❸──推論作者觀點\n□①萬華地名的重點，在於日治時期的改名過程。\n②南島語族雖分散在各地島嶼，卻擁有部分相似語彙，這些語言線索可推知他們曾經是一家人。\n□③不同島嶼的語言之所以相似，是因為受到外來力量的共同影響。\n□④語言會隨時間改變，因此難以用來追查來源與歷史。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 推論策略—從例子推論作者觀點
  instruction: 本課將學習推論策略，透過作者反覆舉的例子，推論其真正想表達的觀點。請依序完成以下步驟。
  reasoning: 此練習旨在引導學生透過「找例子」、「找共同點」及「推論觀點」三個步驟，掌握從文本中推論作者觀點的策略。題目設計緊扣原文的引導式提問，確保學生能逐步理解並應用該策略。對於原文中的「複選」題，為符合單一答案的JSON Schema，已將選項調整為包含「以上皆是」或將正確選項合併為一個選項。
  steps:
  - prompt: 作者在文中舉的語詞例子「manga、vanga（小船）」出現在哪些地區？
    type: select
    options:
    - 臺灣
    - 東南亞
    - 南太平洋
    - 以上皆是
    answer: 3
    reasoning: 根據課文第三段「不只三百年前的臺北使用manga這個詞，東南亞（如菲律賓、印尼、新幾內亞）和南太平洋（薩摩亞、紐西蘭）諸多島嶼上的族群，千百年來也皆以manga（或vanga）指稱小船或獨木舟。」可知manga/vanga出現在所有列出的地區。
  - prompt: 作者在文中舉的語詞例子「mata（眼睛）」出現在哪些地區？
    type: select
    options:
    - 臺灣
    - 東南亞
    - 南太平洋
    - 以上皆是
    answer: 3
    reasoning: 根據課文第四段「南島語族共享著許多相似的語彙。例如，眼睛皆稱「馬大（mata）」...」以及第三段對南島語族的定義（臺灣、東南亞、南太平洋），可知mata出現在所有列出的地區。
  - prompt: 作者在文中舉的語詞例子「lina（繩索）」出現在哪些地區？
    type: select
    options:
    - 臺灣
    - 東南亞
    - 南太平洋
    - 以上皆是
    answer: 3
    reasoning: 根據課文第四段「南島語族共享著許多相似的語彙。例如，...繩索稱「里那（lina）」...」以及第三段對南島語族的定義（臺灣、東南亞、南太平洋），可知lina出現在所有列出的地區。
  - prompt: 作者在文中舉的語詞例子「ina / tina（母親）」出現在哪些地區？
    type: select
    options:
    - 臺灣
    - 東南亞
    - 南太平洋
    - 以上皆是
    answer: 3
    reasoning: 根據課文第四段「南島語族共享著許多相似的語彙。例如，...母親稱「以娜（ina）」。有一年，臺東辦理南島文化節活動，南太平洋 斐濟的表演團隊在臺東街上發現了一家「以娜早餐店」，倍感親切。因為他們的語言裡，媽媽叫做提娜（tina），和ina的音義如出一轍。」可知ina/tina出現在臺灣和南太平洋，且南島語族定義包含東南亞，故為所有列出的地區。
  - prompt: 作者在文中舉的語詞例子「lima / nima / rima（五）」出現在哪些地區？
    type: select
    options:
    - 臺灣
    - 東南亞
    - 南太平洋
    - 以上皆是
    answer: 3
    reasoning: 根據課文第五段開頭「數字亦然。多數南...」以及前文對南島語族共享語彙的描述，可知這些數字詞彙也屬於南島語族共享，因此出現在所有列出的地區。
  - prompt: 第五段用來說明「音變很常見」的兩個生活例子是哪些？
    type: select
    options:
    - 那個→辣個
    - 很熱→很樂
    - 很冷→很勒
    - 那個→辣個 和 很熱→很樂
    answer: 3
    reasoning: 根據原文「第五段用來說明『音變很常見』的兩個生活例子」後列出的選項，只有「那個→辣個」和「很熱→很樂」沒有被方框（□）標示，表示它們是文中提及的例子。
  - prompt: 作者想讓我們注意到這些例子什麼共同點？
    type: select
    options:
    - 南島語族分布在不同地區，卻出現相似發音的詞彙
    - 例子顯示語言會一直改變，無法留下任何線索
    - 例子來自不同語言，所以彼此沒有關聯
    answer: 0
    reasoning: 根據原文「二、步驟❷──找這些例子的共同點」下的選項，只有第一個選項沒有被方框（□）標示，表示它是正確答案。這也符合課文內容，強調南島語族雖分散但語言有相似性。
  - prompt: 推論作者觀點
    type: select
    options:
    - 萬華地名的重點，在於日治時期的改名過程。
    - 南島語族雖分散在各地島嶼，卻擁有部分相似語彙，這些語言線索可推知他們曾經是一家人。
    - 不同島嶼的語言之所以相似，是因為受到外來力量的共同影響。
    - 語言會隨時間改變，因此難以用來追查來源與歷史。
    answer: 1
    reasoning: 根據原文「三、步驟❸──推論作者觀點」下的選項，只有第二個選項沒有被方框（□）標示，表示它是正確答案。這也是課文透過萬華地名和南島語族語彙相似性所要傳達的核心觀點。
