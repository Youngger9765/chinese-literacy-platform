discussion_content:
- 1.找出大主題（可從標題找，只要找一次即可）： 古代畫家心中的仙境
- 2.找出小主題：
- (1)課文第二段
- ❶先畫出關鍵句
- 在古代中國人的想像裡，神仙不食人間煙火，總是住在遠離凡塵俗世、雲霧飄渺的深山裡。在許多口耳相傳的故事裡，曾有極少數幸運的人「誤入」仙境，看見不可思議的景象。這些傳說中的仙境，通常都藏在深山的洞穴裡。
- ❷本段的小主題是 古代神仙的【 住所／居住地點 】。
- ❸找出與小主題最相關的重要細節（多選）
- 神仙總是住在遠離凡塵俗世、雲霧飄渺的深山裡。。
- 這些傳說中的仙境，通常都藏在深山的洞穴裡。。
- ⃞千百年來，許多畫家都將其描繪成通往仙境的入口之一。
- (2)課文第四段
- 畫家們常在畫中安排三種特別的元素：山洞、小橋和小船。山洞意味著通往仙境的神祕門戶，小橋代表跨進另一個世界的通道，小船象徵渡過現實與仙境的交通工具。這些元素彷彿是進入另一個世界的「護照」，標誌著從凡塵俗世到神奇仙境的奇妙轉變。
- ❶畫出關鍵句
- ❷本段的小主題是 【仙境畫的元素 】與意義 。
- ❸找出與小主題最相關的重要細節（填空）
- 畫家們常在畫中安排三種特別的元素，【 山洞 】、【 小橋 】、【 小船 】標誌從凡塵俗世到神奇仙境的奇妙轉變。
- (3)課文第五段
