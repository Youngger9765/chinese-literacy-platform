multiple_choice:
- question: （ Ｂ ）1. 下列語詞，何者使用正確？
  options:
  - 近期流感頻傳，病毒透過「口耳相傳」讓人染病
  - 經過一整天的來回奔波，爸爸到家時已「疲憊不堪」
  - 啄木鳥正對著樹木「精雕細琢」從中尋找食物
  - 最幸福的事莫過於在「浩瀚無垠」的家好好放鬆
  answer: B
- question: 2. 文中「山洞、小橋、小船」這三個元素在畫中代表什麼意義？
  options:
  - 提供進入山林的交通方式
  - 象徵進入仙境的現實條件
  - 強調畫中三者平衡的美麗
  - 象徵古代人對仙境的嚮往
  answer: B
- question: 3. 古代畫作中「人物非常渺小，山水風景宏大」主要想表達什麼？
  options:
  - 畫家很喜歡居住在深山裡，遠離人群
  - 古代畫家認為山水比人物更容易繪製
  - 強調大自然壯美，人類應該更加謙卑
  - 山水畫中人物不重要，風景才是重點
  answer: C
- question: 4. 元明時期，仙境畫開始在民間普及，這一現象反映了什麼文化變遷？
  options:
  - 畫作不再屬於宮廷專有，藝術創作逐漸平民化
  - 元明時期的畫家開始失去皇室的支持
  - 人們對仙境的信仰開始動搖，反對虛構仙境
  - 庶民畫家更熱衷於描繪真實的山水，「旅行」到仙境
  answer: A
- question: 5. 文末說：「誰說世界沒有神仙呢？」這句話的深層含義是什麼？
  options:
  - 神仙是真實存在的，只是現代人失去尋找的能力
  - 神仙居住山林，只有有緣人方能找到心中的神仙
  - 藝術具有永恆的力量，能讓人在心中產生共鳴
  - 神仙只是古代藝術作品中的象徵，並無現實意義
  answer: C
