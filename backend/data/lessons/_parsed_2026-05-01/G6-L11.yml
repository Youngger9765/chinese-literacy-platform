vocabulary:
- word: 雲霧飄渺
  definition: 指雲霧又高又遠、若隱若現的樣子。
- word: 不食人間煙火
  definition: 道家認為仙人超凡脫俗，不吃熟食，後用來形容具有仙氣或靈氣的人。
- word: 口耳相傳
  definition: 指事物通過口頭傳播和聆聽而流傳下來。
- word: 疲憊不堪
  definition: 形容非常疲倦，幾乎無法負荷。
- word: 精雕細琢
  definition: 指精心細緻的雕刻琢磨。比喻做事或創作非常用心，注重每一個細節。
- word: 塵囂
  definition: 指世俗的喧鬧與紛擾。
- word: 浩瀚無垠
  definition: 形容廣大無邊，通常用來形容天空、海洋或宇宙。
- word: 凡塵俗世
  definition: 指人們日常所生活的世界，帶有平凡、世俗的意思，通常用來與出家修行的境界做對比。
- word: 滄海一粟
  definition: 大海中的一粒米粟。比喻極其渺小，無足輕重的事物。
- word: 庶民
  definition: 指普通百姓，平民。
- word: 微不足道
  definition: 形容極其渺小，不值得一提。
