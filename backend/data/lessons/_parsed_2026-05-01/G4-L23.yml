multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 比賽輸了，大家互相指責，場面「不動聲色」，令人緊張
  - 她第一次來這座城市，走在街道上卻有「似曾相識」的感覺
  - 即使在遭受嚴厲的批評時，他也「不是滋味」，繼續保持冷靜
  - 湖泊和山林交織成一幅美景，「平分秋色」，讓人心情平靜
  answer: B
- question: 2. 根據第四段「這些話就像一群吵鬧的麻雀，在腦子裡飛來飛去，吵得她幾乎忘了眼前的投手正準備出手。」這句話表達了佳恩正遇到什麼困難？
  options:
  - 太過專注於比賽，無法聽到隊友的提醒
  - 觀眾的加油聲太熱烈，干擾她的注意力
  - 腦中的負面想法太多，導致她無法專注
  - 眼前的投手一直發出聲音，思緒被打斷
  answer: C
- question: 3. 下列何者最能作為這篇文章的主旨？
  options:
  - |-
    心理素質與運動表現息息相關，也可以透過練習提升 B.選手應避免有情緒，情緒失控會讓選手失去比賽機會 C.提升運動表現最適當的方法是規律的技術與體能訓練 D.透過競爭、壓力能激發自己的潛力，要善用逆境進步
  answer: A
- question: |-
    4. 文末提到「原來我們可以不只被心帶著跑，心，也能支撐我們」下列哪一個說法最能呼應這句話的意思？ A.心臟健康是運動表現的重要指標，應該重視心肺功能訓練 B.心情起伏是無法控制的，只能盡量逃避或靠意志力撐過去 C.情緒變化難以避免，但選手應該隱藏情緒，不讓他人發現 D.即使感到緊張，也可以透過練習學會穩定情緒、發揮實力
  options: []
  answer: D
- question: 5. 面對考試成績不理想的狀況，下列何者的想法最符合「自我覺察」的表現？
  options:
  - 柏丞：「我現在好沮喪，好像一直懷疑自己，感覺這次的考試對我來說意義重大。」
  - 怡萱：「考那麼差，一定是因為我沒天分，算了啦，反正再怎麼努力也沒用。」
  - 品妤：「老師也出太難了吧，這種題目到底有幾個人可以及格啊？」
  - 祐廷：「只要考卷不用帶回家簽名就好了，反正也就是一次考試，沒什麼大不了的。」
  answer: A
