discussion_content:
- 練習一：從日常情境練習覺察自己的情緒和想法，能讓我們更懂自己，也更懂得照顧自己。請根據每個情境勾選或填寫你的想法。（可複選）
- 情境一：明天段考要考你最在乎的那一科。
- ＊你的情緒會是： □緊張 □焦慮 □專注 □期待 □有點壓力 □自信 □好奇 □其他：＿＿＿＿＿
- ＊為什麼會有這種情緒： □想知道自己的實力 □怕被嘲笑 □怕被比較 □怕被罵 □想挑戰自己 □對自己沒有信心 □其他：＿＿＿＿＿
- ＊這種情緒可能讓我： □睡不著 □更專心準備 □覺得煩躁 □想再複習一次 □越想越慌 □告訴自己「盡力就好」 □ 其他：＿＿＿＿＿
- |-
  ＊更好的應對方式： □做幾次深呼吸讓自己放鬆 □告訴自己「我已經準備得不錯了」□把緊張當成專注的提醒 □規劃休息時間，避免過度緊繃 □考前與朋友聊聊、舒緩壓力 □其他：＿＿＿＿＿
- 情境二：小組討論時，有同學沒幫忙，還批評你的意見。
- ＊你的情緒會是： □生氣 □委屈 □驚訝 □無奈 □失望 □平靜 □其他：＿＿＿＿＿
- ＊為什麼會有這種情緒： □覺得不公平 □覺得被誤會 □沒想到他會這樣說 □想讓討論更好 □想維持小組和諧 □希望大家一起做好 □其他：＿＿＿＿＿
- ＊這種情緒可能讓我： □想反擊或頂嘴 □想冷靜一下再處理 □不想再合作 □想私下問清楚 □想請老師協助 □其他：＿＿＿＿＿
- |-
  ＊更好的應對方式： □先讓自己冷靜一下再回應 □試著理解對方的立場 □用「我覺得……因為……」表達想法 □選擇合適的時間再談 □尋求老師或同學協助溝通 □其他：＿＿＿＿＿
- 練習二：請想一件最近發生在你身上的小事，寫下你的覺察。
- ＊發生的事情是：_________________________________________
- ＊我當下的情緒是：_______________________________________
- ＊讓我產生這種情緒的原因是：______________________________
- ＊這種情緒讓我做了什麼事？結果如何？______________________
- （ B ）1. 下列選項「 」中的語詞，何者使用正確？
- A.比賽輸了，大家互相指責，場面「不動聲色」，令人緊張
- B.她第一次來這座城市，走在街道上卻有「似曾相識」的感覺
- C.即使在遭受嚴厲的批評時，他也「不是滋味」，繼續保持冷靜
- D.湖泊和山林交織成一幅美景，「平分秋色」，讓人心情平靜
- （ C ）2. 根據第四段「這些話就像一群吵鬧的麻雀，在腦子裡飛來飛去，吵得她幾乎忘了眼前的投手正準備出手。」這句話表達了佳恩正遇到什麼困難？
- A.太過專注於比賽，無法聽到隊友的提醒
- B.觀眾的加油聲太熱烈，干擾她的注意力
- C.腦中的負面想法太多，導致她無法專注
