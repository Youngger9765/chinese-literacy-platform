title: 心，也要一起練
authors: 課文/學習單： 張筱晴
story_text: |-
  以下情境，你是否覺得似曾相識呢？ 換上球衣的小美，看見隊上那位表現亮眼的隊友時，心裡有點不是滋味。她告訴自己要替隊友開心，可心底卻忍不住想：「為什麼上場的不是我？」她不動聲色的望向教練，想知道自己有沒有先發的機會，卻又怕答案讓她更失望。 練習結束後，阿哲坐在場邊，低頭看著自己的鞋帶。今天練體能時，雙腿像灌了鉛，怎麼也提不起力氣，落後別人一大截。他抬頭看著操場上還在跑動的隊友們，聽著他們的笑聲，心裡有點羨慕，也有點沮喪。 罰球的哨聲還沒響，小宇的手心就已經全是汗。平常練習投籃時明明很穩，可今天球還沒出手，心裡就像有一群小鼓手在亂敲，讓他的手臂微微發抖。他看著裁判、看著觀眾，感覺每一雙眼睛都在等著看他會不會失誤。 佳恩站在打擊區旁，等著上場。上一輪她才被三振，現在腦袋裡滿是「你這個害群之馬」、「這球你一定又打不到」的聲音。這些話就像一群吵鬧的麻雀，在腦子裡飛來飛去，吵得她幾乎忘了眼前的投手正準備出手。 小美他們的經驗，你是否也曾經遭遇？明明想好好表現，卻被緊張、疲累或心裡的小劇場絆住腳步。運動不只是跑得快、打得準，更需要一顆能和身體好好合作的心。它會影響你面對壓力時的反應，左右你看待隊友與自己的方式，也決定你能不能從低潮中再站起來。 很多時候，競技場上的較勁，不是只靠體能和技巧，還要靠心。兩個實力平分秋色的選手，勝負的關鍵往往就在心理素質，獲勝的經常是那個情緒比較穩定、意志堅定、不易受干擾、比較能專注的人。研究也告訴我們，心理狀態對運動表現的影響不容小看。而就像肌肉、技術可以透過訓練變強，心理素質也可以。優秀的選手會把握每一次訓練和比賽的機會，隨時覺察、調整自己的情緒與想法。隨著經驗、汗水的累積，這些心理力量，都能幫助我們在關鍵時刻展現最好的自己。 那時候，你會發現，比賽不只是得分和輸贏，而是一場又一場和自己、和別人互相了解的冒險；會發現，原來我們可以不只被心帶著跑，心，也能支撐我們，能陪你在場上發揮全部的實力；也會發現，原來要變厲害，不只是要練身體、練技術，更要練心。現在就讓我們跟著一系列的文章，展開這場練習吧！
