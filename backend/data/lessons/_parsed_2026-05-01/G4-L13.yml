multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確?
  options:
  - 小夫捉弄胖虎，胖虎氣炸了，「熱氣騰騰」的跑去找他算帳
  - 他們因為觀念相差太多，最終感情「漸行漸遠」，離婚收場
  - 晚飯時間，我的爸爸下班後「陸續」離開公司回來了
  - 開學前他去把頭髮「渲染」成金色，希望能成為大家目光的焦點
  answer: B
- question: 2. 根據本文，下列哪一個描述可能無法表示老人的經濟能力較差?
  options:
  - 老人家摸摸自己的肚子，對孫子說自己飽的像蜘蛛
  - 老人家在社區做資源回收，提著裝了回收物的垃圾袋
  - 老人家看菜單，數一數手中零錢，點最便宜的陽春麵
  - 老人家只點一碗麵給孫子吃，自己只是拚命喝水
  answer: A
- question: 3. 根據第三段，老阿公真的是第一百個客人嗎？為什麼老闆要這麼說？
  options:
  - 是，因為這是他們店裡新的促銷活動，阿公正好是幸運兒
  - 是，因為他是店裡第一百個客人，所以免費得到一碗麵
  - 不是，因為老闆根本沒算人數，他只想快點賣完回家休息
  - 不是，因為老闆看出老人經濟狀況不好，想幫忙他
  answer: D
- question: 4. 根據第三段內容，為什麼老人要跟小男孩說他飽的像蜘蛛一樣？
  options:
  - 因為他有啤酒肚，看起來像蜘蛛
  - 他剛剛有吃其他東西，真的很飽
  - 他想開玩笑讓吃飯氛圍更開心
  - 他想用玩笑來化解孫子的擔心
  answer: D
- question: 5. 根據本文，老闆最後說小男孩正在學習「不吃東西也會飽」的道理，請問這個道理是什麼意思呢？
  options:
  - 這是一種鍛鍊意志力的方法
  - 這是運用想像力讓自己度過難關的練習
  - 這是為了他人付出而自我犧牲的感情
  - 這是一種新的飲食型態，斷食久了就會習慣
  answer: C
