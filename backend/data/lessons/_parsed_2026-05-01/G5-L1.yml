spotlight_raw_text: "閱讀聚光燈\n拆詞釋義\n　　有許多新詞，雖然你第一次讀到，但它是由你熟悉的國字組成的，只要試著根據這些字的意思去猜，大概就猜得出來那個新詞是什麼意思。這種掌握新詞的方法，叫做拆詞釋義。自然科、社會科的用詞大多數都是可以拆詞釋義的哦！本課有許多語詞，也能用拆詞釋義的方法來推論出它的詞義。\n例１：赤眼卵寄生蜂\n⚫赤眼：「赤」是紅色，赤眼，就是「紅色的眼睛」。\n⚫卵寄生蜂：\n1.我們學過「寄生蟲」，那是寄生在別的動物身上的蟲。\n2.「卵寄生蜂」應該是靠著別種昆蟲的蟲卵生存的蜂。\n⚫赤眼卵寄生蜂：紅色眼睛、靠著別種昆蟲蟲卵過活的蜂。\n2176951259781\n⚫翼展就是「翅膀展開」。00\n⚫翼展就是「翅膀展開」。例２：翼展\n5459394635500⚫翼：翅膀。\n⚫展：展開。\n■那麼「拆詞釋義」，具體該怎麼做呢?\n❶將目標語詞拆解成較小的單位（字或詞）：如將「翼展」拆解成「翼」和「展」。\n❷想想看（拆解後的）字或詞的意：「翼」的意思是翅膀，「展」的意思是展開。\n❸把這些字詞的意思合併起來，推論目標語詞的完整詞義：將翅膀及展開合併在一起變成「翅膀展開」，結合課文中「展翼」後面的2.5公分，可以推論出翼展的意思是「翅膀展開的長度」。\n❹放回句子唸一唸，判斷是否合理：將推論出的詞義，套回句子讀一讀，是否合理；如果不合理，可能這個詞不適合這個策略，請嘗試其它的方法。\n 最小單位的詞是指具有意義的詞彙，例如：美、美麗、天、天空、飛、飛翔……，只要具有意義，即使單字也成詞。\n1.基礎題：請先圈出目標語詞的個別詞義，再把組成的意思寫下來。\n(1)科技日新月異，許多事情現在都可交由機器處理。\n34915765739\n生日\n每日\n日\n更新\n新年\n新\n每月\n月亮\n月\n特別\n不同\n異\n組合\n每日都更新，每月都不同。（形容每天、每月都有新的發展和進步。）00\n生日\n每日\n日\n更新\n新年\n新\n每月\n月亮\n月\n特別\n不同\n異\n組合\n每日都更新，每月都不同。（形容每天、每月都有新的發展和進步。）\n\n217714315686\n(1)那隻蚯蚓在土裡蠕動著。\n\n組合\n像蟲一樣緩慢扭動/移動/行動。\n蠕\n蟲類緩慢移動。\n動\n移動/扭動/行動。00\n(1)那隻蚯蚓在土裡蠕動著。\n\n組合\n像蟲一樣緩慢扭動/移動/行動。\n蠕\n蟲類緩慢移動。\n動\n移動/扭動/行動。2.進階題：請先寫出目標語詞的個別詞義，再把組成的意思寫下來。\n\n22860080736\n(2)他們幾個好朋友集資開了一間飲料店。\n\n組合\n集合了大家的資金。\n集\n集合/集中/募集。\n資\n資金。0\n(2)他們幾個好朋友集資開了一間飲料店。\n\n組合\n集合了大家的資金。\n集\n集合/集中/募集。\n資\n資金。\n\n198120382270\n(1)他的笑容就像遙不可及的彩虹，讓人嚮往。\n\n推論\n形容距離【 遙遠 】【能 / 不能 】到達，\n或形容【 有 / 沒有 】希望。\n遙\n遙遠。\n不可\n不可以/沒辦法。\n及\n到達。00\n(1)他的笑容就像遙不可及的彩虹，讓人嚮往。\n\n推論\n形容距離【 遙遠 】【能 / 不能 】到達，\n或形容【 有 / 沒有 】希望。\n遙\n遙遠。\n不可\n不可以/沒辦法。\n及\n到達。3.挑戰題：請先寫出目標語詞的個別詞義，並推論出語詞的意思。\n\n 最小單位的詞是指具有意義的詞彙，例如：美、美麗、天、天空、飛、飛翔……，只要具有意義，即使單字也成詞。\n51276546100\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
