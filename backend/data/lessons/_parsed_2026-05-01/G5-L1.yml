multiple_choice:
- question: 1. 請問哪一個句子使用語詞正確？
  options:
  - 我的小考成績「日新月異」，每次得到的成績都不一樣
  - 阿姨將民宿出租給旅客居住，因此她是客人的「宿主」
  - 自從孩子失蹤後，他「想方設法」地打聽孩子的下落
  - 吃泡泡糖時，我喜歡讓吹出的泡泡不斷「蔓延」變大
  answer: C
- question: 2. 根據本文對防治秋行軍蟲的說明，下列表格的內容何者完全正確?
  options: []
  answer: B
- question: 3. 根據本文，專家處理秋行軍蟲的態度與下列何者選項最接近？
  options:
  - 腳踏實地 B.未雨綢繆
  - 有備無患 D.見招拆招(遇到什麼問題用什麼方法應對。)
  answer: D
- question: 4. 本文的主旨為何？請選出最適當的答案。
  options:
  - 專家們遇到蟲害問題，想方設法解決問題令人佩服
  - 秋行軍蟲的危害擴及全臺，呼籲大家一同防治蟲害
  - 外來種生物對於本土動植物的危害嚴重，應該杜絕
  - 雖然臺灣遇到蟲害，但人定勝天最終必能戰勝自然
  answer: A
- question: 5. 「夏天必須要『防治』疾病傳染。」請問括號中語詞的意思為何？
  options: []
  answer: D
