genre: 說明文
title: 兵來將擋，水來土掩
authors: 課文 ：曾世杰 學習單：唐儀庭
story_text: '秋行軍蟲是一種原產在美洲的飛蛾，翼展約2.5公分，牠繁殖力驚人，母蛾一生可以產下1500到2000顆卵，幼蟲長得像小號的蠶，對玉米、高粱有嚴重的破壞力。2019 年，苗栗發現第一起入侵案例，幾年內秋行軍蟲的危害蔓延到全臺灣，農民深受其害。而臺灣的昆蟲學家們面對這種陌生的害蟲，防治技術不斷的演化改進，我們來看看他們曾經嘗試過的方法。

  噴灑農藥就可殺死秋行軍蟲，然而要有效防治，必須重複噴藥，平均一週要噴藥一次，持續兩、三週，影響糧食安全和農民的健康。現在天氣愈來愈熱，當種植的面積很大時，人工噴農藥實在太耗工、太辛苦、太危險。如一位農民所說：「要我穿防護衣進田裡去噴，我看會死在田裡。不是被毒死，就是被熱死。」

  人工噴藥既然又辛苦又危險，那用無人機噴可以嗎？大型的無人機，低空噴一公頃的農藥只要20分鐘，一天可以噴五公頃，而且施作者不必直接接觸農藥，又安全，又省力。但這樣農民就可以一勞永逸了嗎？那可不。農藥一灑，昆蟲死了99.9%，那倖存的千分之一，再繁殖出來的下一代，就比較不怕農藥了，只要這麼繁殖個幾代，新生代的幼蟲就會產生抗藥性。

  昆蟲學家發現，一種只有１公釐大小的「赤眼卵寄生蜂」是秋行軍蟲的剋星。寄生蜂的母蜂會在玉米田裡飛呀飛，找到秋行軍蟲的蟲卵，就在蟲卵上下蛋；秋行軍蟲的幼蟲剛孵化時還算正常，但沒有幾天，藏在牠身上的幾十個寄生蜂幼蟲就開始蠕動起來，它們從秋行軍蟲幼蟲體內發動攻擊，把自己的宿主吃掉。昆蟲學家讓寄生蜂在小紙卡上產下密密麻麻的卵，再請農民把這個卵片用釘書機釘在玉米葉的背面，一公頃放121片就可以防治蟲害。但是，釘121片卵片的工作須耗時2個鐘頭，對年紀大的農民仍然是苦差󠇡事。

  昆蟲學家從小朋友玩的扭蛋得到靈感，他們把寄生蜂卵放進紙做的扭蛋裡，扭蛋可以讓小蜂跑出來，但雨水淋不進去。農民只要把扭蛋丟進玉米田裡，就可以產生防治蟲害的效果。更棒的是，這種扭蛋可以用無人機施作，一公頃只要20到30分鐘就可以灑完了。寄生蜂不但可以殺死秋行軍蟲，也一併消滅了其他的害蟲。

  昆蟲學家面對秋行軍蟲的來襲，想方設法，以日新月異的科技幫農民解決問題，從噴農藥到生物防治，從純人工到無人機，每種方法又帶來新的問題，只能再設法解決，真可說是「兵來將󠇡擋，水來土掩」啊。'
