vocabulary:
- word: 抗藥性
  definition: 讓藥物失去功效。若長期使用某種藥物對付細菌或昆蟲，藥物的功效會漸漸消失，這就是細菌或昆蟲產生了抗藥性。
- word: 蠕動
  definition: 像蟲一樣扭動。
- word: 日新月異
  definition: 每天都有新的變化，每個月都不同。形容每天、每月都有新的發展和進步。
- word: 翼展
  definition: 翅膀展開的長度。
- word: 演化
  definition: 演變、變化。
- word: 蔓延
  definition: 像藤蔓一樣延伸，形容事態向四面八方擴展延伸。
- word: 施作
  definition: 實行、運作。
- word: 想方設法
  definition: 窮盡努力，想出方法；設想各種方法來達到目的。
- word: 宿主
  definition: 為寄生生物提供生存環境的生物，例如：跳蚤的宿主就是貓狗。
- word: 剋星
  definition: 能克制對方的人或物。
- word: 兵來將擋，水來土掩
  definition: 敵兵攻打過來，將士就去抵擋；水來了，就用土掩蓋。指不管遇到任何事，依情況不同採取不同的應變方式。
