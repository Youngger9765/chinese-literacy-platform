multiple_choice:
- question: （ Ａ ）1. 下列句子使用的語詞，何者錯誤？
  options:
  - |-
    弟弟的身高和桌子一樣高，比較起來真是「不相上下」 B.這個故事緊湊又精彩，讀起來令人「興味盎然」 C.這支新手機功能齊全、外型漂亮，讓人「愛不釋手」 D.哥哥迷上了程式設計，常常「廢寢忘食」研究新功能
  answer: A
- question: 2. 阿耀在信中提到他在課業上的最大困難是什麼？
  options:
  - 缺課太多，沒有老師願意幫他補課
  - 比賽和集訓太多，常常請假而跟不上課程
  - 學校的老師因為他的缺課而討厭他
  - 對自己未來迷茫，不知道自己適合做什麼
  answer: B
- question: 3. 第一位朋友雖然因傷無法繼續打球，但他後來成為翻譯，這顯示他具備什麼特質？
  options:
  - |-
    熱愛棒球、願意堅持到底，永不放棄當球員的夢想 B.擁有優秀的英文天分，只要稍加努力就能成功 C.運氣比努力更加重要，剛好受傷時出現翻譯機會 D.遇到困難時懂得改變方向，從興趣中找到新的機會
  answer: D
- question: 4. 健豪學長舉了三個朋友的例子來回答阿耀的信，這種寫作手法的效果是什麼？
  options:
  - 增加篇幅內容，讓文章看起來更豐富完整 B.營造氣氛對比，讓讀者更能感受情緒轉折 C.以具體例子說明主題，增加說服力 D.凸顯學生的角色，使故事更貼近校園生活
  answer: C
- question: 5.下列哪一個例子最符合作者要傳達的觀點?
  options:
  - 喜歡畫畫的人，就要專心畫圖，精益求精
  - 對數學有興趣，就可以從生活中的購物、比價開始學習
  - 對學校課程沒興趣，就應該放棄，追尋自己熱愛的事物
  - 學校的課業不可荒廢，興趣與課業本來就該兼顧
  answer: B
