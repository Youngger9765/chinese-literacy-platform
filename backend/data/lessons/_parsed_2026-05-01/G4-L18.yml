story_structure_table:
- - 想讀書，該從哪裡著手？
- - 阿耀的問題
  - 下列哪個是阿耀遇到的問題？(單選) □①阿耀的疑問：一定要讀書嗎？ ②阿耀覺得自己跟不上課程，想請教學長。
- - 學長的觀點
  - 他學習方式有【很多 】，不一定在教室讀課本才叫學習。
- - 舉例說明
  - 例子1
  - |-
    問題：高中隊友想去美國打球，但雖然每天自學英文，卻跟不上學校的英文課。 解決：從最熟悉的棒球開始，每天學一點學英文，看【 英文棒球雜誌 】、看體育台報導。 結果：沒有繼續打棒球，但成為旅美選手的【翻譯 】。
- - 舉例說明
  - 例子2
  - |-
    問題：第二位朋友因為運動傷害，打球期間需要復健。 解決：一邊復健，一邊研究身體骨骼肌肉的【解剖學 】，探討如何訓練才能預防運動傷害。 結果：大量投入後，考上醫學相關科系，成為【 隊醫 】。
- - 舉例說明
  - 例子3
  - |-
    問題：第三位朋友進棒球隊後不愛讀書，到國中連簡單的文章都讀不懂。 解決：從青少棒揚威記愛上閱讀，繼續讀了更多【 漫畫 】，和少年小說，帶動了所有學科的學習信心。 結果：會考時，他的成績和普通班學生不相上下。
- - 結尾
  - 三人共通點：當原本的路受挫時，想辦法從【 熱愛 】的事物出發、找出新的可能，靠【 行動 】與【 學習 】，繼續留在熱愛的領域。
