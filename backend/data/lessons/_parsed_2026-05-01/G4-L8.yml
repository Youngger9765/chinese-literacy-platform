multiple_choice:
- question: 1. 下列語詞，何者使用錯誤?
  options:
  - 陳老師風趣幽默，上起課來「趣味橫生」
  - 下班時間是交通尖峰期，車輛幾乎「不為所動」
  - 感冒鼻塞讓他吃東西時覺得食物「索然無味」
  - 王教練訓練球員方式「與眾不同」，極少大聲叫罵
  answer: B
- question: 2. 媽媽為什麼要作者在人多、沒有位置的時候用眼睛觀察車廂上的人呢？
  options:
  - 可以學到觀察的方法 B.可以打發無聊的搭車時間
  - 可以讓自己與眾不同 D.可以學會禮貌，避免讓人不自在
  answer: B
- question: 3. 文中描述讀書的大姊姊「像整個車廂裡唯一的主角」，這句話除了強調她的與眾不同，還可能隱含什麼訊息？
  options:
  - 人們在滑手機的同時，其實更渴望單純的閱讀
  - 生活中不是缺乏美，而是缺乏仔細觀察的眼睛
  - 讀書的行為正逐漸取代滑手機，成為新的潮流
  - 閱讀展現出的專注神情，令人移不開目光
  answer: D
- question: 4. 第四段，從媽媽對「閱讀」與「滑手機」的分析中，可以推論出作者希望向讀者傳達什麼觀點？
  options:
  - 閱讀可以改變他人對自己的看法
  - 學會尊重他人，才能更融入現代社會
  - 閱讀比滑手機更能促成主動的思考與學習
  - 只有透過不斷觀察他人，才能發現自我優點
  answer: C
- question: 5. 請問下文＜種子的力氣＞的主旨是什麼呢？
  options: []
