discussion_content:
- 線索一：從文章題目找主旨
- 1.請問根據課文的文章題目是最美的畫面，可以找出主旨嗎？
- □可以 不可以
- 線索二：有些文章在開頭或結尾段提示了文章的主旨。
- 現在，我出門也會在背包裡放一本書，一有空檔就拿出來讀，我猜，現在我也成了別人眼中最美的畫面啦！
- 2.作者覺得自己在別人眼中最美的畫面是： 看書的樣子 。
- 線索三：從段落大意或關鍵語句找主旨。(課文第三段)
- 瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。
- 3.作者覺得阿姨閱讀時的樣子如何? 專注而優雅 。
- 4.總結上述線索，本文的主旨是：
- 作者鼓勵讀者【 多閱讀 】，成為別人眼中【 最美的畫面 】。
- （ B ）1. 下列語詞，何者使用錯誤?
- A.陳老師風趣幽默，上起課來「趣味橫生」
- B.下班時間是交通尖峰期，車輛幾乎「不為所動」
- C.感冒鼻塞讓他吃東西時覺得食物「索然無味」
- D.王教練訓練球員方式「與眾不同」，極少大聲叫罵
- （ B ）2. 媽媽為什麼要作者在人多、沒有位置的時候用眼睛觀察車廂上的人呢？
- A.可以學到觀察的方法 B.可以打發無聊的搭車時間
- C.可以讓自己與眾不同 D.可以學會禮貌，避免讓人不自在
- （ D ）3. 文中描述讀書的大姊姊「像整個車廂裡唯一的主角」，這句話除了強調她的與眾不同，還可能隱含什麼訊息？
- A.人們在滑手機的同時，其實更渴望單純的閱讀
- B.生活中不是缺乏美，而是缺乏仔細觀察的眼睛
- C.讀書的行為正逐漸取代滑手機，成為新的潮流
- D.閱讀展現出的專注神情，令人移不開目光
- （ C ）4. 第四段，從媽媽對「閱讀」與「滑手機」的分析中，可以推論出作者希望向讀者傳達什麼觀點？
- A.閱讀可以改變他人對自己的看法
- B.學會尊重他人，才能更融入現代社會
- C.閱讀比滑手機更能促成主動的思考與學習
- D.只有透過不斷觀察他人，才能發現自我優點
- （ A ）5. 請問下文＜種子的力氣＞的主旨是什麼呢？
- |-
  你見過被壓在石塊下的小草嗎？它為了成長，為了接近陽光，不管上面的石塊如何重，縫隙如何窄，它還是會從彎彎曲曲的縫隙中，跑到地面上來。它的根往土裡扎，芽往地面挺，這是一種不可思議的力量。 （本文出自國立編譯館）
- A.說明種子強靭的生命力 B.舉證種子的力大無窮
- C.說明種子發育的過程 D.瓦礫與石塊才能造就小草
