vocabulary:
- word: 博取
  definition: 獲得。「博取眼球」在此處指的是獲得注意。
- word: 誘餌
  definition: 用來引誘目標上鉤的事物。
- word: 閱聽大眾
  definition: 以文字、影音接收各種傳播媒體訊息的人。
- word: 語不驚人死不休
  definition: 沒有說出驚人的話，死也不甘心。
- word: 帶風向
  definition: 企圖製造輿論，以影響別人的看法。
- word: 聳動
  definition: 驚動、使人感到吃驚。
- word: 辛辣
  definition: 言語尖銳、刺激。
- word: 氾濫
  definition: 原指河水流出河道，淹沒土地。本文是形容事物像河水流出一樣，到處擴散。
- word: 文不對題
  definition: 文章內容和題目的意思不符合。
- word: 推播
  definition: 此處指將自己在網路上看到的訊息分享出去。
- word: 核對
  definition: 互相比對檢查。
- word: 目不暇給
  definition: 形容眼前事物太多或變化太快，眼睛來不及觀看。
- word: 眼花撩亂
  definition: 形容看到的東西眾多而且雜亂。
