spotlight_raw_text: '閱讀聚光燈

  認識誘餌式新聞標題

  　　誘餌式標題充斥在我們的生活中，但你知道嗎？誘餌式標題有固定的模式喔！了解誘餌式標題，可以讓我們更容易發現它，引誘讀者點擊時，常使用的手段有以下幾種：

  1.引發好奇心

  (1)常用的語詞：竟然、甚至、沒想到、反倒、原來、卻……

  (2)常使用的標點符號：！、？、……（不把話說完，引發好奇）

  (3)用模糊不清的訊息：不把話說清楚，引發讀者好奇點擊。

  　　如：肌肉要怎麼練？她釣出一堆網友解答

  2.用誇張的句子

  (1)句子中有強烈的「對比語詞」：標題中會用對比強烈的元素，讓標題更有趣，像是「平價v.s.有錢人」，「素人v.s.美女」。

  　　如：這家平價肉圓店，全臺首富也愛吃！

  (2)「刻意地放大或縮小」對事情的描述，引發讀者興趣。

  　　如：這樣子洗隱形眼鏡，醫生：「可能導致永久失明」

  3.使用充滿「誇大的情緒」的字眼

  標題中加入一些誇大的情緒性的字眼，像是：痛心、心都碎了、爆氣、人神共憤、嗨翻……。如：爸爸給兒子取奇葩名字，百萬網友笑到抽筋

  4.利用熱門的話題或公眾人物


  誘餌式標題有時會同時運用好幾種上面的方法喔！


  ◎'
