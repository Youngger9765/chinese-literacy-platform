vocabulary:
- word: 奠定
  definition: 建立。
- word: 注目
  definition: 指被看見及重視。
- word: 永續
  definition: 長久而持續。
- word: 瀕臨
  definition: 緊接著面臨。
- word: 瀕危
  definition: 接近滅絕。
- word: 樹冠
  definition: 樹木的頂部。
- word: 趨近
  definition: 非常接近。
- word: 拗口
  definition: 不順口。
- word: 汲取
  definition: 吸收、吸取。
- word: 倚重
  definition: 信賴器重。
- word: 變遷
  definition: 事物的變化。
- word: 杳無人煙
  definition: 比喻荒涼無人居住、很少人的地方。
- word: 佼佼者
  definition: 優秀出眾的人。
- word: 僥倖
  definition: 藉著運氣意外獲得成功或逃過一劫。
- word: 悄然無息
  definition: 寂靜無聲。
- word: 棲地
  definition: 居住停留的地方。
