multiple_choice:
- question: 1. 請問哪一個句子使用語詞有誤？
  options:
  - 他工作態度好、資訊能力強，備受上司「倚重」
  - 許多瀕危物種已經從地球上「悄然無息」地消失了
  - 自從禁菸令之後，公共場所都已經「杳無人煙」了
  - 他不斷「汲取」新知，希望能提升自己的能力
  answer: C
- question: 2. 根據文章，什麼是「植物獵人」?
  options:
  - 為植物驅除病蟲害的人
  - 保種中心照顧植物的人
  - 從事植物保育的人
  - 採集稀有植物的人
  answer: D
- question: 3. 洪信介後來如何克服被拒絕的困境，成功進入保種中心？
  options:
  - 他努力自學提升自己的植物知識
  - 他考入員林農工的園藝科當學生
  - 他用自己的野外探險經驗說服專家
  - 保種中心力排眾議，讓他加入團隊
  answer: B
- question: 4. 洪信介說：「有些事情還是必須要有人去做啊！」請問這件事指的是什麼？
  options:
  - 積極投入種樹的行列
  - 保育瀕危絕種的植物
  - 建造瀕危植物的庇護所
  - 考上員林農工園藝科
  answer: B
- question: 5. 阿介的故事帶來許多啟示，你覺得對求職者最重要的啟示是哪一樣？
  options:
  - 要成為植物獵人必須要有良好的體力及膽識
  - 不要在意他人的評論，遵從自己內心的聲音
  - 具備無可取代的技能，就會給自己帶來機會
  - 低學歷並不會影響一個人的生涯發展
  answer: C
