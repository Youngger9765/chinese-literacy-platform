spotlight_raw_text: "閱讀聚光燈\n自我提問\n    前一課我們學到了：閱讀時，怎麼把好奇或有疑惑的地方，轉成問題，對自己發問。這一課我們要來學，閱讀時，怎麼問出重要的問題。\n132715250190\n重要\n問問題\n好奇、疑惑\n閱讀時覺得好奇、疑惑的地方\n文章的重要概念：\n例如記人文章：主角背景、奮鬥歷程、成就、人物特質00\n重要\n問問題\n好奇、疑惑\n閱讀時覺得好奇、疑惑的地方\n文章的重要概念：\n例如記人文章：主角背景、奮鬥歷程、成就、人物特質1.什麼是重要的問題？\n(1)文章的重要概念，有助於理解文章的問題。\n(2)重要的問題因文章類型而異，例如本課是記人文章，「主角背景、奮鬥歷程、成就、人物特質」是重要概念。\n2.什麼是不重要的問題：如果問題的答案是太瑣碎、太細節的訊息，刪除也不會影響理解文章，就是不重要的問題。\n3.以下以本課「植物獵人-洪信介」為例，「重要」和「不重要」問題各舉一例\n文章 \n類型\n問題\n說明\n例子\n記人文章\n重要\n主角背景、奮鬥歷程、成就、人物的特質\n你覺得小時候學習上有什麼困難？\n答案在文章第一段。\n\n不重要\n很瑣碎、細節的訊息，即使不知道也不會影響理解文章內容。\n洪信介曾在山裡迷路，迷路時在山上哭了幾天？三天。\n 答案在文章第六段。\n4.怎麼問出重要的問題？\n(1)直接問出重要問題\n(2)如果無法直接提出重要問題，可以先找出「文章的重點」，再轉換成「問題」喔！例如下表：\n22913117793文章重點\n轉化成重要的問題\n洪信介從小成績不好，學習受到很多挫折，所幸他在大自然中找到了熱愛的事物。\n1.洪信介小時候的學習情況如何？\n2.洪信介在哪裡找到自己熱愛的事物？\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 自我提問
  instruction: 本課將引導你學習如何在閱讀時提出重要的問題，並區分重要與不重要的問題。
  reasoning: 根據原文內容，將「自我提問」策略的定義、重要與不重要問題的區分、以及如何提問的步驟，拆解成多個選擇題與一個開放題，以引導學生理解並練習該策略。
  steps:
  - prompt: 根據課文說明，什麼是「重要的問題」？
    type: select
    options:
    - 答案在文章中明確指出，且不影響理解文章內容。
    - 有助於理解文章的重要概念，且因文章類型而異。
    - 問題的答案是太瑣碎、太細節的訊息。
    answer: 1
    reasoning: 原文「1.什麼是重要的問題？(1)文章的重要概念，有助於理解文章的問題。(2)重要的問題因文章類型而異...」明確指出重要問題的定義。
  - prompt: 根據課文說明，什麼是「不重要的問題」？
    type: select
    options:
    - 問題的答案是太瑣碎、太細節的訊息，刪除也不會影響理解文章。
    - 有助於理解文章的重要概念，且因文章類型而異。
    - 問題的答案在文章中找不到。
    answer: 0
    reasoning: 原文「2.什麼是不重要的問題：如果問題的答案是太瑣碎、太細節的訊息，刪除也不會影響理解文章，就是不重要的問題。」明確指出不重要問題的定義。
  - prompt: 根據「植物獵人-洪信介」一文，下列哪個問題是「重要的問題」？
    type: select
    options:
    - 洪信介曾在山裡迷路，迷路時在山上哭了幾天？
    - 你覺得小時候學習上有什麼困難？
    - 洪信介最喜歡哪種植物？
    answer: 1
    reasoning: 原文「3.以下以本課「植物獵人-洪信介」為例...記人文章 重要...你覺得小時候學習上有什麼困難？」明確將此問題列為重要問題的例子。
  - prompt: 根據「植物獵人-洪信介」一文，下列哪個問題是「不重要的問題」？
    type: select
    options:
    - 洪信介小時候的學習情況如何？
    - 洪信介在哪裡找到自己熱愛的事物？
    - 洪信介曾在山裡迷路，迷路時在山上哭了幾天？
    answer: 2
    reasoning: 原文「3.以下以本課「植物獵人-洪信介」為例...不重要...洪信介曾在山裡迷路，迷路時在山上哭了幾天？」明確將此問題列為不重要問題的例子。
  - prompt: '課文提到，如果無法直接提出重要問題，可以先找出「文章的重點」，再轉換成「問題」。請將以下文章重點轉換成一個重要的問題：


      文章重點：洪信介從小成績不好，學習受到很多挫折，所幸他在大自然中找到了熱愛的事物。'
    type: free_text
    reasoning: 此題旨在練習原文「4.怎麼問出重要的問題？(2)如果無法直接提出重要問題，可以先找出「文章的重點」，再轉換成「問題」喔！」所教授的技巧，讓學生將文章重點轉化為問題。
