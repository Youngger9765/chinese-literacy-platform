discussion_content:
- 判斷題：辨別重要和不重要的問題，重要的打，不重要的畫。
- 找出重要問題後，請和你的同學分享，為什麼你覺得那是重要的問題。
- （ ）(1) 洪信介具備哪些成為植物獵人的條件？(第三段)
- （ ）(2) 黃喉貂是什麼動物？(第六段，此段刪掉不影響故事情節)
- （ ）(3) 洪信介要到植物保種中心工作，遇到什麼問題？
- （ ）(4) 洪信介考上哪個學校？(第四段，瑣碎細節)
- （ ）(5) 洪信介最重要的成就是什麼？
