  definition: 捶打胸膛，以腳跺地。形容極為悲憤或悔恨。
- word: 摸不著頭緒
  definition: 搞不清楚狀況的樣子。
- word: 目不轉睛
  definition: 形容眼睛盯著、非常專心的樣子。
- word: 凝聚力
  definition: 讓一群人非常團結的力量。
- word: 勢均力敵
  definition: 雙方實力很接近，不知道誰會贏。
