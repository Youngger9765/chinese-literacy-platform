title: 贏得喝󠇡采的輸家
authors: 課文/學習單： 張明珠
story_text: 「戴資穎戴資穎第一名，戴資穎戴資穎我愛妳~~~」這一句洗腦的廣告臺詞，是否也在你的周遭出現？她就是臺灣第一人，累計214周排名世界第一的球后──戴資穎。 小戴即使在強大的壓力下，仍然堅持維持自己的風格。小戴相信攻擊是最好的防禦，總是主動出擊，她追求完美的邊角球和難以預測的穿越角度，她的攻擊千變萬化，讓對手摸不著󠇣頭緒。雖然這樣的進攻方式會提高失誤率，但如果要她打穩定的安全球風，小戴就不是小戴了。這就是她獨特的地方，也是她迷人之處。 2021年8月1日，小戴在東京奧運金牌賽的轉播收視率創下新高，這場小戴與陳雨菲的龍爭虎鬥，戰況勢均力敵，全臺觀眾守在電視前，目不轉睛。小戴一得分，大家歡天喜地、讚嘆不已；不幸鷹眼判定小戴的殺球出界，大家不免唉聲嘆氣、捶胸頓足。一場比賽帶出全國人民不可思議的凝聚力和向心力！ 小戴在最後一局落後七分時，依然面不改色的一分一分追回來，她的每一下揮拍、每一次扣殺，都是在和自己比賽，她沒有因為想贏得比賽而選擇保守，她選擇的是做自己、用自己擅長的方式戰鬥，她要掌握比賽的節奏，她拚盡全力攻擊。雖然球評都指出小戴打得太精采了，但她最終還是以三分之差不敵對手的嚴密防守，只能奪得銀牌。下場時，小戴落寞的神情，讓全國粉絲們的心都揪了起來。受訪時，她卻不改大俠的性子，說：「盡力了，不後悔。」球迷們留言鼓勵。她，打得漂亮，雖然輸了比賽，卻贏得了人心，贏得全國人民的尊敬及喝采。 其實比賽就像是一場模擬的人生，有一些障礙你可以克服，也有一些不可控制的疑難雜症，「贏了值得開心，輸了也不必難過」，小戴面對挫折的坦然與勇氣、永不放棄的精神，值得我們學習，因為只要你沒有輸了自己，比賽就會一直持續下去。
