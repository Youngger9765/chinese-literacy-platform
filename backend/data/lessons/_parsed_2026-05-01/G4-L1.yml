multiple_choice:
- question: 1.請問「勢均力敵」，可以用哪個詞語替換?
  options:
  - 天差地遠
  - 揚眉吐氣
  - 不分上下 （勢均力敵表示兩方對手實力相近）
  - 寡不敵眾
  answer: C
- question: 2.請問文中第二段「捶胸頓足」最可能的情緒是哪個？
  options:
  - 開心
  - 懊惱 （由後句「滿臉失落」可推論事懊惱的情緒）
  - 欣喜
  - 寂寞
  answer: B
- question: 3.「贏了值得開心，輸了不必難過」，和下列哪一句話的意思最接近？
  options:
  - 天生我材必有用
  - 勝不驕，敗不餒。（輸了不必難過代表失敗了不用氣餒）
  - 天塌下來有高個子擋著
  - 失敗是成功的必要條件
  answer: B
- question: 4.為什麼戴資穎在落後的時候，不調整為成穩定的打法？
  options:
  - 他要用自己的方式戰鬥（第三段）
  - 高風險才有高得分
  - 他認為自己打不出穩定的球路
  - 對手太強了，讓他無法獲勝
  answer: A
- question: 5.根據本文，戴資穎打球的最終目標為何？
  options:
  - 賺進大量廣告代言費
  - 希望贏得比賽的勝利
  - 希望獲得人民的喝采
  - 做自己、為自己比賽（第三、四段）
  answer: D
