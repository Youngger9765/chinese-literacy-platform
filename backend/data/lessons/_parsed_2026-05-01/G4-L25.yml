discussion_content:
- 練習一：身體照護檢核表──透過營養、水分、休息三個面向來看看自己的身體照護習慣吧！
- ＊營養：
- ＊水分：
- ＊休息：
- ＊反思──我發現自己：
- 做得不錯的是：□①營養補充 □②水分攝取 □③休息安排
- 有待加強的是：□①營養補充 □②水分攝取 □③休息安排
- 練習二：感謝身體
- 寫下你今天最想感謝的三個身體部位，並在後方寫上原因。
- 例1：我想感謝我的( 眼睛 )，( 讓我可以閱讀 ）
- 例2：我想感謝我的( 手臂 )，( 幫助我完成體能訓練 ）
- (1)我想感謝我的( )，( ）
- (2)我想感謝我的( )，( ）
- (3)我想感謝我的( )，( ）
- 如果你的身體會說話，你覺得以下哪些句子是他最常說的？(可複選)
- □ ①「我有點累，可以讓我休息一下嗎？」 □ ②「我好渴，請幫我喝點水。」 □ ③「肚子餓了，該補充能量囉！」 □ ④「好緊繃喔，幫我伸展一下吧。」 □ ⑤「今天太久沒動了，帶我出去走一走！」 □ ⑥「太久盯著螢幕了，讓眼睛休息一下。」 □ ⑦「呼吸一下，別那麼趕。」 □ ⑧「我表現得不錯吧？可以稱讚我一下！」 □ ⑨「別再勉強我了，我真的需要放慢腳步。」 □ ⑩其他：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿
