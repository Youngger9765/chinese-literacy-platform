multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 我寧願花心思修正錯誤，也「不妨」再重頭來過
  - 面對記者「突如其來」的訪問，他仍能從容回應
  - 儘管颱風天，爺爺「固然」到農田裡巡視排水系統
  - 對喜歡穩定的他來說，「照表操課」的安排使他驚慌
  answer: B
- question: 2. 根據第二段「如果你這個老闆只顧著提高生產，直到機器冒煙、員工疲倦、倉庫爆滿——最後整座工廠可能陷入罷工危機。」這句話主要是想表達什麼？
  options:
  - 人體如工廠一般，會因過度操勞而導致病痛
  - 為了增加產能，工廠經營需要更多人力投入
  - 從工廠的生產力可以看出，身體的健康狀況
  - 懂得管理的老闆會重視團隊合作及生產效率
  answer: A
- question: 3. 根據本文，下列何者正確？
  options:
  - 只有運動員的身體才是「工廠」
  - 所有人都是自己身體的「老闆」
  - 身體就像工廠一樣，會輪班工作
  - 身體是完成責任，不需要被感謝
  answer: B
- question: 4. 根據本文，下列何者最符合文章主旨？
  options:
  - 人體就像運動員，在適當的壓力下才能激發潛力
  - 只要有充足的營養與水分，身體就可以持續運作
  - 人體運作如同工廠合作無間，也需要妥善的照顧
  - 運動員的訓練辛苦，值得大家更多的尊敬與鼓勵
  answer: C
- question: 5. 根據文章與品格聚光燈，下列何者最可能最需要調整生活習慣？
  options:
  - 志豪會留意自己在三餐中有沒有攝取足夠的蛋白質
  - 芷涵每天下課都會補充水分，並確認水壺水量充足
  - 怡文運動完會確實收操，睡前也會做伸展幫助放鬆
  - 偉翔每天熬夜讀書，常靠能量棒及手搖杯維持精神
  answer: D
