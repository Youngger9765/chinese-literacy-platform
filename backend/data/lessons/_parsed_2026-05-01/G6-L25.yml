vocabulary:
- word: 股票
  definition: 一種公司發給投資者的憑證，擁有股票即成為該公司的股東，可能賺錢也可能虧損。
- word: 利潤
  definition: 收入減去成本後剩下的錢。
- word: 股東
  definition: 擁有公司股份的人，有權參與公司的分紅，甚至投票參與公司的決策。
- word: 積蓄
  definition: 一段時間內慢慢存下來的錢。
- word: 獲利
  definition: 賺到錢。
- word: 集資
  definition: 為完成某事，向多人籌錢。
- word: 大手一揮
  definition: 大動作地揮動手臂，形容人很有氣勢地做出動作或決定。
- word: 揚帆啟航
  definition: 原指船帆升起開始航行，比喻展開新的旅程、開始新的計畫或人生階段。
- word: 節衣縮食
  definition: 形容生活非常節省、過得簡樸。
- word: 派遣
  definition: 派人前往某地工作或執行任務。
- word: 滿手老繭
  definition: 形容經常勞動或做粗重工作，手上長滿了硬皮。
