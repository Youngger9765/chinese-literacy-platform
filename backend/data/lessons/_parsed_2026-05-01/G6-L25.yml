multiple_choice:
- question: 2. 文中說「四百多年前，要展開一場長途遠洋探險可不容易」，下列哪一項不是造成當時遠航困難的原因？
  options:
  - 需要造船和準備大量糧食 B.船員可能遭遇疾病或受傷
  - 航行中要應付壞天氣和海盜 D.香料價格太低無法回本
  answer: D
- question: 3. 本文提到「瑪莉、達安和奧倫治這三個背景不同的人都成為股東」，作者舉這個例子最主要是想說明股票制度的什麼特點？
  options:
  - 它讓「參與投資」不再是君王和貴族的專利
  - 它可以幫助許多投資人賺到錢
  - 遠洋航行太昂貴了，需要很多人出錢才能成行
  - 窮人無法和富人一起投資，得到的回報是不同的
  answer: A
- question: 4. 荷蘭東印度公司這趟航行到錢，因此把股利分給股東；依據這個道理，如果航行遇到颱風，船沈了，下列哪種情況最可能發生？
  options:
  - 公司仍然會發放給股東18%的股利
  - 股東的股票下跌，公司無法付出股利
  - 公司要賠錢給每一位投資的股東
  - 公司會先欠著股東錢，等賺錢了再還
  answer: B
- question: 5. 這篇課文主要在介紹什麼？
  options:
  - 瑪莉如何利用股票投資賺了一大筆錢
  - 十七世紀航海探險的種種危險與高昂成本
  - 股票制度的起源以及所帶來的影響
  - 荷蘭人在臺灣建立殖民地的歷史經過
  answer: C
