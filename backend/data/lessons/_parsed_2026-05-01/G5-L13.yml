spotlight_raw_text: "閱讀聚光燈\n摘要策略—主題描述結構\n　　本課是一篇說明文，文章結構清楚，從「小丑醫生」這個大主題出發，依序介紹幾個小主題，每個小主題都補充了豐富的細節（說明或具體例子），這是說明文常見的呈現方式。\n    閱讀說明文時，如果我們可以理解大主題、小主題和具體細節之間的關係，就能幫助我們掌握文章的重點。底下我們來學習說明文「小主題」與「細節」的配對。\n34417021590000說明文結構圖： \n\n69215018923000◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 摘要策略—主題描述結構
  instruction: 本練習將引導你學習如何辨識說明文中的「小主題」與其「細節」之間的配對關係，以掌握文章重點。
  reasoning: 原文明確指出本課為說明文，其結構由「大主題」、「小主題」及「細節」構成，並強調理解三者關係有助於掌握重點。練習目標為「小主題」與「細節」的配對。因此，我根據提供的「課文摘要」內容，設計了數個選擇題來練習從細節判斷小主題，或從小主題找出相關細節，並加入一個開放題鼓勵學生思考應用，以符合原文所提的策略練習目標。
  steps:
  - prompt: 根據課文摘要，「小丑醫生的構想最早可以追溯到20世紀80年代。美國一位名叫亞當斯的醫生認為，治療病人不能光靠藥物和手術，還需要關懷病人的情感需求。」這段細節主要說明了小丑醫生的哪個面向？
    type: select
    options:
    - 小丑醫生的發展與推廣
    - 小丑醫生的起源與理念
    - 小丑醫生的工作內容
    answer: 1
    reasoning: 這段文字明確提到「最早可以追溯到20世紀80年代」以及「亞當斯的醫生認為...」，這些都是關於小丑醫生概念的發源和其核心思想，因此最符合「起源與理念」這個小主題。
  - prompt: 課文摘要中提到「1995年，『小丑照護計畫』在紐約開始推動，由小丑表演者克里斯廷創立，讓小丑醫生正式成為醫療團隊的一份子。」這段細節最能支持下列哪一個小主題？
    type: select
    options:
    - 小丑醫生的起源故事
    - 小丑醫生的正式化與推廣
    - 小丑醫生的治療工具
    answer: 1
    reasoning: 這段文字描述了「小丑照護計畫」的啟動時間、地點、創立者，以及小丑醫生如何「正式成為醫療團隊的一份子」，這些都指向了小丑醫生這個概念如何從構想走向實際的組織化與推廣。
  - prompt: 根據課文摘要，小丑醫生在兒童病房中，除了講笑話，還會運用哪些方式讓孩子們感到輕鬆愉悅？
    type: select
    options:
    - 只用魔術表演
    - 只用音樂和搞笑表演
    - 魔術、音樂、搞笑表演，或是即興互動
    answer: 2
    reasoning: 課文摘要中明確指出：「他們用魔術、音樂、搞笑表演，或是即興互動，讓眉頭深鎖的孩子們感受到片刻輕鬆與愉悅。」選項2完整涵蓋了課文提到的所有方式。
  - prompt: 課文摘要提到小丑醫生能「緩解醫院裡的緊張氛圍」。請你試著想像一個情境，說明小丑醫生可能會如何運用幽默或分散注意力的方式，幫助一個害怕打針的孩子放鬆。
    type: free_text
    reasoning: 此題旨在鼓勵學生將課文中的抽象概念（緩解緊張氛圍）具體化，並結合課文提到的方法（幽默、分散注意力）來創造一個實際情境，以檢視學生對「小丑醫生的其他功能」這個小主題及其細節的理解與應用能力。
