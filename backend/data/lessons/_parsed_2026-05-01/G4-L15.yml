authors: 課文/學習單： 張筱晴
story_text: 這陣子，我腦海裡一直想著這件事。我不敢跟家人說，怕朋友笑我，更不知道該怎麼辦。但我發現自己越來越奇怪，只好寫在這裡…… 像是那天下課在收聯絡簿，他經過我旁邊時停了下來，朝我伸出手。我一臉茫然的望著他，而他只是隨口說了一句：「你看起來很累，要不要幫你交？」語氣跟平常沒什麼兩樣，但我卻結結巴巴的接不上話，覺得有點害羞。 還有一次，上體育課，我們需要兩兩一組練習傳球，那時他正好站在我旁邊，老師就把我們分在一起。那刻他轉過來對我笑了一下，我瞬間覺得心跳漏了一拍，像心臟被什麼輕輕撞了一下，只好假裝沒事轉身去拿球。 最近下課我總是習慣看向有他的地方，看著他和朋友有說有笑的樣子，我也會覺得開心。而有時候他的眼神會突然和我對上，我只好急忙低下頭看小說，裝作沒看到。而且我發現我會忍不住一直偷偷觀察他都和同學聊什麼話題，也不想錯過他的任何一篇社群發文和動態。 回家路上，我常常偷偷回想我們一整天相處的片段，像是在腦袋裡播一部只屬於自己的小電影。想到他幫我撿掉在地上的筆，或是在小組討論時不經意叫我的名字，我心裡就會不自覺發熱，像被陽光輕輕照到一樣。可是，我也不懂為什麼這種感覺只對他有。其他同學也對我很好啊，但那種溫暖又興奮的感覺，卻只有在他身上才會發生。更奇怪的是，我甚至開始期待每天上學，只要一想到可能會跟他有多一些互動，我就會覺得這一天好像變得特別一點。 這到底是什麼感覺呢？為什麼他會如此吸引我的目光？這感覺跟我對朋友不太一樣，卻又說不上來是哪裡不同。我只是單純覺得他很不錯，和他相處總是很開心。好複雜，我覺得我的腦袋要炸掉了。
