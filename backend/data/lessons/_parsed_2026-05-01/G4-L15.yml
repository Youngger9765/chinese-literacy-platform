  - 害羞與緊張，因為被對方注意到而慌亂
  - 討厭與厭煩，不想和對方產生任何互動
  - 擔心與尷尬，不想突然被拉去加入話題
  answer: B
- question: 3. 根據全文，下列選項何者最貼近作者的心理變化？
  options:
  - 一開始就確定自己愛上了他，並準備向對方表白
  - 感到不確定，但發現這份情感與友情不同而疑惑
  - 雖然覺得他不錯，但後來發現其實和朋友差不多
  - 不想給予對方任何回應，最後決定完全忘記對方
  answer: B
- question: 4. 根據閱讀聚光燈的練習，下列何者對待感情的態度較為合適？
  options:
  - 小新：交朋友不需要想太多，反正船到橋頭自然直
  - 大雄：為了避免被他人誤會，保持適當距離比較安全
  - 柯南：友情和愛情必須有很清楚的界線，一看就知道
  - 小智：比起為關係命名，更重要的是了解自己的感受
  answer: D
- question: 5. 關於本文的行為與心理感受描述，下列詮釋何者正確？
  options:
  - 「像是在腦袋裡播一部只屬於自己的小電影（第五段）」──表達心中對美好回憶的陶醉
  - 「像心臟被什麼輕輕撞了一下（第三段）」──表示受到攻擊而委屈
  - 「像被陽光輕輕照到一樣（第五段）」──突顯作者因害羞而臉紅
  - 「我覺得我的腦袋要炸掉了（第六段）」──是指作者出現頭痛症狀
  answer: A
