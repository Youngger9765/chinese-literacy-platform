multiple_choice:
- question: 1. 下列語詞何者使用正確？
  options:
  - 能成為同班同學是珍貴的「緣起」，我們要好好珍惜
  - 因為消息來得太突然，大家「素未謀面」，不知所措
  - 偏鄉地區醫療資源缺乏，許多民眾生病時「求助無門」
  - 「突發奇想」的大雨讓行人措手不及，紛紛跑到騎樓下躲雨
  answer: C
- question: 2.「信件的力量不僅傳遞關懷，更改變了許多人的命運，讓他們從黑暗走向光明」，關於這句話的詮釋，下列敘述何者正確？
  options:
  - 信件中的關懷，造成他人命運起起伏伏
  - 信件的力量，幫助許多人去反省自己糟糕的生活
  - 信件表達對收件者的關心，也幫助許多人擺脫困境
  - 信件中的文字，讓許多人認識到他人不同的人生經歷
  answer: C
- question: 3. 文章中作者使用「你知道嗎？」和「你相信嗎？」兩個問句做開頭，下列何者最不可能是這種做法的用意？
  options:
  - 吸引讀者的注意與興趣
  - 展現出作者內心的疑惑
  - 增加作者與讀者間的互動性
  - 激發讀者對文章內容的好奇
  answer: B
- question: 4. 根據文章，「寫信馬拉松」行動能幫助受援者有機會重獲自由，以下何者最能說明其原因？
  options:
  - 信件中美麗的插圖和溫暖的文字感動了政府，進而改變政策
  - 大量民眾的信件，使國際社會關注到這些受壓迫者的處境
  - 活動主要針對少部分極權國家，因此成效較為明顯
  - 寫信行動是由政府主動邀請民眾參與，想改善目前的政策
  answer: B
- question: 5. 文章已經舉琪哈姆與米基塔的例子，為何還需舉泰國蓉的例子？下列何者最有可能是錯誤的？
  options:
  - 蓉的例子能證明所有受援者，最後都能獲得自由
  - 蓉是援助成功的例子，能說明國際聲援確實能促使改變
  - 三人皆來自不同國家，突顯援助對象不分國界。
  - 蓉是成年人，搭配琪哈姆與米基塔這兩位青少年，展現援助對象年齡層的多元性。
  answer: A
