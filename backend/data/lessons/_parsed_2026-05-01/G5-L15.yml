title: 信件的力量──寫信馬拉松
authors: 課文/學習單： 張筱晴
story_text: |-
  你知道嗎？一封信，除了能尋求協助，也可能改變另一個人的命運。你相信嗎？一張張的明信片，不僅能帶來勇氣與力量，更可能支撐一個人從黑暗走向光明。 二十年前，一群關注社會議題與人權的好朋友突發奇想，決定以創新的方式慶祝12月10日的世界人權日─一場24小時的寫信活動，為遭受不公平對待的人們發聲。這便是國際特赦組織「寫信馬拉松」活動的由來。這個活動邀請世界各地的人寫一封信，支持那些受到政府壓迫、監禁的人們，給予他們的家人關心和鼓勵，也積極向政府或相關單位施壓，是現今全球最大的人權活動。 不過，或許你很難想像，當今這看似文明進步的地球上，仍有人遭受不公不義的對待，且包含青少年。 在非洲東北部的厄利垂亞，20年來由同一位總統治理，人民沒有言論、參政、新聞等自由，被稱為「非洲版北韓」。2012年12月8日，15歲的女孩琪哈姆，試圖逃離國家而遭到逮捕。至今已超過10年，她生死不明、毫無消息，而她的家人求助無門，也只能乾著󠇢急。2020年8月，白俄羅斯16歲的米基塔，某日經過廣場時，意外被捲入抗議人群中，隔天，警方便指控他向警察投擲汽油彈，被判處五年徒刑。從那時起，他被關進黑牢，患有癲癇的他不但沒有得到適當的醫療照顧，且疑似遭受酷刑。 這兩位青少年，都是「寫信馬拉松」聲援的對象。「這封信，極權政府大概不會看，甚至可能無法送達收信人手上。」記者張育軒說，「然而幾萬人同時發出聲援，那麼即便極權政府充耳不聞，也更能匯聚國際社會對案件的注意力。」而這項活動也的確成功的造成極權政府壓力，改變了超過百人的命運，讓他們擺脫了殘酷與不公不義的對待，泰國的蓉就是一例。 泰國是少數實施「冒犯君主罪」的國家之一，批評王室成員可能導致入獄。22歲的蓉，因為呼籲廢除國王特權，而面臨終身監禁，也因此成為寫信馬拉松支持的對象。「這些字句，點亮了我最黑暗的時光，他們和我素未謀面，我卻感受他們的愛。」蓉在被釋放之後表示這些信件帶給她無比的力量。「如果沒有國際壓力，沒有人認識我，沒有人為我寫信，我可能會在監獄裡待更久，這對我來說就是奇蹟。」 每年的12月，臺灣北中南各地也會固定舉辦寫信馬拉松的活動。2023年在臺北的華山文創園區，一群人專注地寫著明信片，有的明信片上是密密麻麻的英文，有的畫上了可愛的插圖，而每張都傳達著滿滿的鼓勵與祝福。會場周遭展示著這場活動的緣起與聲援對象的簡介，搭配現場歌聲或講座談話，讓活動顯得盛大非凡。 信件的力量，遠超乎我們的想像。一封封充滿關懷與支持的信，猶如黑暗中的一道光芒，為世界各地身陷困境的人們帶來希望和勇氣。「寫信馬拉松」讓大家看見，每個人都能成為改變的推手，每一封信都是一個承諾，告訴世界上不公義的黑暗勢力：我們看見了，我們在乎，我們不會放棄。告訴受每一位受難者和家人：我們與你同在，你不孤單，我們一起迎接雨過天青的那天。 (文章資料來源：國際特赦組織網站)
