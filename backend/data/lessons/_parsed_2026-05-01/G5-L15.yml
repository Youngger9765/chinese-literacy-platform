vocabulary:
- word: 極權
  definition: 一種政府制度，由一個或少數人掌握國家權力，人民沒有表達想法、選舉等自由。
- word: 突發奇想
  definition: 突然產生奇特的想法。
- word: 素未謀面
  definition: 表示從來沒有見過面。
- word: 乾著急
  definition: 遇到問題時非常著急，但卻無法解決。
- word: 充耳不聞
  definition: 裝著沒聽見。形容故意不理會或不願聽取別人的意見。
- word: 求助無門
  definition: 在遇到困難或危險時，找不到可以幫助的人或地方。
- word: 聲援
  definition: 用言語或行動支持他人，幫助他們對抗困難或不公。
- word: 壓迫
  definition: 壓制逼迫。
- word: 緣起
  definition: 事物的由來。
- word: 癲癇
  definition: 一種病名。發作時會突然昏倒，牙關緊閉，口吐白沫，四肢抽搐。
- word: 國際特赦組織
  definition: 一個關注人權的非政府組織。
