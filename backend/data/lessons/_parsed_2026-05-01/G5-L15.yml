discussion_content:
- 練習一：以下再以「翠玉白菜」的描述做練習，讀完後，請分別寫出「灰底文字」與「加底線文字」上位概念。
- 上位概念：【翠玉白菜的 外型 】
- |-
  翠玉白菜是以一塊半白半綠的玉料雕成，玉匠巧妙利用玉質顏色的變化，將玉石綠色部分，雕出翻捲的菜葉；白色部分，雕出脈絡分明的菜莖，白、綠的漸層變化，渾然天成，有如一棵鮮嫩欲滴，可以掐出水來的白菜。更有趣的是，玉匠神來一筆，在葉片上端，雕了兩隻活靈活現的螽斯。翠玉白菜，白菜寓意清白，象徴新娘的純潔；螽斯，俗稱「紡織娘」，能高聲鳴唱，而且繁殖力很強，用來祝福新娘多子多孫。
- (資料來源:南一國語課本)
- 上位概念：【翠玉白菜的 含意 】
- 練習二：一則新聞報導
- |-
  近日，新竹市發生大樓火警，兩名消防員救災時不幸殉職，眾人同感心痛。為了感謝消防員的辛苦與付出，一位國小老師帶領學生在課程中繪製感謝卡片，一同寫上感謝與紀念的文字，並送到消防隊。
