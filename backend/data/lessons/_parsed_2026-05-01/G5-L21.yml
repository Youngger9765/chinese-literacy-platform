title: 抗拒指尖上的誘惑
authors: 課文 ：陳韻如 學習單：張明珠
story_text: 2018年開始，短影音平臺開始風靡全球，特別受到年輕人歡迎。臺灣的青少年每天平均花1.5小時看短影片，遠超過閱讀紙本書的時間！短影音之所以這麼吸引人，是因為內容又短又多樣，各種主題都能在幾十秒內秀出最精彩有趣的情節。更厲害的是，這些平臺會按照使用者的喜好推薦影片，讓人覺得每支影片都超合自己胃口，進而不知不覺沉浸其中，甚至廢寢忘食。小睿就是其中一例。
  小睿放學回到家，就迫不及待拿出手機，他突然停下來，心裡亮起紅燈：「昨天我才發誓，不能再玩了。」但是魔鬼的聲音在他心裡響起：「再10分鐘就好，才10分鐘，沒關係啦。」天人交戰後，小睿最後還是打開手機，點入短影音平臺。他的手指在螢幕上滑個不停，影片一個接一個的出現：搞笑的惡作劇、刺激的遊戲實況、驚險的跑酷表演、職業球賽的菁華剪輯……時間悄然流逝，天色漸漸轉暗，而他渾然不覺，依然沉浸在這個片斷式的世界裡。
  「小睿，作業寫完了嗎？」媽媽的聲音從廚房傳來。 他連忙放下手機，揉了揉痠痛的眼睛，瞥見手機上的時間，「6:45？」，他差點尖叫起來：「天啊，這麼晚了，教練要求的練習日誌、數學和英文的作業都沒有做，我到底在幹什麼？」他覺得又懊惱又愧疚。小睿想到昨天也是這樣──短影音加上「英雄聯盟」手遊，一下子就花掉三個小時，他昨天才告訴自己，以後絶對不要「再」……，但今天又重󠇡蹈覆轍。他發現自己掉進一個「玩手機懊惱愧疚發誓戒手機隔天再玩手機」的惡性循環。慘的是這完全是自己造成的，他不敢跟爸媽講，也不知道如何掙脫這個泥沼。左思右想，他終於向導師洪老師開口求助。
  隔天，洪老師在早自習時跟大家說：「班上有好幾位同學向我求助，希望能戒手機，有這個問題的舉手？」結果，舉手的居然超過三分之二。洪老師說：「好，我會和家長聯絡，用團體的方式，讓同學互相約束，學會善用時間。」
  在洪老師的指導下，小睿及同學們採取了多方面的行動：首先，班級的晚自習開始了，小睿報了名，確保週一到週五每天晚上有兩小時專心閱讀及做功課的時間；其次，爸媽在小睿的手機上安裝了時間管理的app，從此，上網的時間每天只剩30分鐘，其它時間手機自動上鎖。此外，小睿和三位有同樣困擾的同學組成「脫癮小組」，大家每天見面就拿出手機，看看彼此前一天的使用情況，誰違規超時就要請喝飲料；週末時，四個人也開始安排一起念書、打球或爬山等戶外活動，以減少獨自滑手機的機會。至於獨處的時候，小睿學會一招，每當腦中玩手機的念頭蠢蠢欲動時，他會把掛在腕上的橡皮筋拉得高高的，皺眉閉眼咬牙，對自己大喊一聲「停！」同時放手彈自己一下。說也奇怪，這招還真能有效阻斷那些壞念頭呢。
  漸漸的，小睿每天沉迷於手機的時間變少，他有多出來的時間打球、看課外書或和同學聊天，生活變得更充實了。不但如此，他的小考成績也漸有起色，連數學都能考到70分以上了。詩人泰戈爾曾經說過：「頂不住眼前的誘惑，就會失去未來的幸福」。透過多方面的努力和支持，小睿頂住了指尖上的誘惑，成為手機的主人。
