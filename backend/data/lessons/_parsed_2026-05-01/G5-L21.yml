discussion_content:
- 1.情境：我在房間裡寫作業時會分心。
- 解決：以下是解決寫作業分心的「策略」與「具體做法」，請連線配對。
- |-
  ３.自我省思：你是否有想改掉的壞習慣？試著運用本文介紹的三大策略──「改變環境」「設定規範」「自我提醒」。請先寫下你想改變的壞習慣，再從三種策略中勾選一項，並思考具體做法，填入下列表格。
- 4.分享與回饋：和同學交換學習單，分享你的心得，也請同學寫下回饋。
- 同學回饋：
- 簽名：
- （ A ）1. 下列語詞，何者使用錯誤？
- A.小美準備充分，考試又「重蹈覆轍」，再次高分順利通過
- B.經過治療後，奶奶的病情終於有了「起色」，精神也好多了
- C.珍珠奶茶在國際媒體報導後，迅速「風靡全球」
- D.因錯誤的決策導致破產，他長時間「沉浸」在懊悔之中
- （ Ｄ ）2. 以下哪一個選項的文字，最能描述小睿和洪老師兩人間的關係？
- A.無話不談
- B.情同手足
- C.尊重推崇
- D.信任安全
- （ C ）3. 下列哪一選項是本文主要想傳達的訊息？
- A.短影音精彩引人，而且會照使用者的喜好推薦影片
- B.要改掉手機成癮，必須靠自己堅強的意志力
- C.面對手機誘惑要自制，並善用多種輔助策略
- D.青少年容易沉迷於短影音，必須謹慎使用
- （ Ｂ ）4. 小睿戒除手機後，生活出現了哪些正向的改變？
- A.他成為學校裡手機使用時間最短的學生
- B.他更能善用時間，生活更健康、更充實了
- C.他從此再也不碰手機遊戲及短影音了
- D.他可以擺脫網路社群上緊張的人際關係
- （ B ）5. 小涵很想在星期日和朋友出去玩，但星期一有篇報告要交。如果她想遵循泰戈爾說的：「頂不住眼前的誘惑，就會失去未來的幸福」，請問小涵接下來會怎麼做？
- A.先出門玩到開心，再熬夜趕報告
- B.無論如何週六完成報告，再出去玩
- C.船到橋頭自然直，等到時候再說 D.報告不要求完美，簡單完成即可
