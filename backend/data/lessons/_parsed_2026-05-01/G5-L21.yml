  - 要改掉手機成癮，必須靠自己堅強的意志力
  - 面對手機誘惑要自制，並善用多種輔助策略
  - 青少年容易沉迷於短影音，必須謹慎使用
  answer: C
- question: 5. 小涵很想在星期日和朋友出去玩，但星期一有篇報告要交。如果她想遵循泰戈爾說的：「頂不住眼前的誘惑，就會失去未來的幸福」，請問小涵接下來會怎麼做？
  options:
  - 先出門玩到開心，再熬夜趕報告
  - 無論如何週六完成報告，再出去玩
  - 船到橋頭自然直，等到時候再說 D.報告不要求完美，簡單完成即可
  answer: B
