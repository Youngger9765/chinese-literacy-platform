story_structure_table:
- - 抗拒指尖上的誘惑
- - 背景
  - '1.短影音自 2018 年開始【 風靡 】全球。

    2.台灣青少年平均每日1.5小時觀看，遠超紙本閱讀。

    3.短影音會按照使用者喜好推薦影片，讓人停不下來。'
- - 問題
  - 小睿每天【 沉迷手機 】，無法自拔，陷入惡性循環。
- - 解決
  - '1.找老師求助。

    2.老師建議具體作法：

    (1)改變環境：

    ❶參加班級【 晚自習 】，放學後先到教室專心寫作業。

    ❷與同學約【 戶外活動 】，減少宅在家滑手機的機會。

    (2)設定手機使用規範：

    ❶手機安裝【 時間管理 】App，平日限用 30 分鐘。

    ❷與同儕組成「脫癮小組」，互相【 監督 】手機使用時長。

    (3)自我提醒：

    手腕掛橡皮筋，想滑手機時立即彈一下並大聲說「停！」'
- - 結果
  - '小睿使用手機的時間  □上升  下降，

    他的生活品質與成績  上升  □下降，

    頂住指尖的誘惑，成為「手機的主人」。'
