  url: ''
multiple_choice:
- question: 1. 下列語詞何者用法使用正確?
  options:
  - 面對惡犬，他「毛骨悚然」，完全不畏懼
  - 「乍見」新年的曙光，讓人內心雀躍不已
  - 他能言善道，完全不像個「喑啞」人士
  - 這棟鬼屋傳說眾多，真是「窮凶極惡」之地
  answer: B
- question: 2. 有關「睡眠癱瘓症」的描述，何者正確？
  options:
  - 通常發生在睡眠時的深睡期
  - 絕大多數的人會頻繁發生睡眠癱瘓
  - 作噩夢時，身體可以自由移動
  - 癱瘓現象是人體在睡眠中的保護機制
  answer: D
- question: 3. 人們常常聽到「鬼火」與「鬼壓床」的經驗，請問兩者的共同之處為何？
  options:
  - 都是鬼魂想要向人世間傳達訊息的一種手段
  - 只有在深度睡眠時期，才可能會發生這種現象
  - 都是人類對未知事物的恐懼感所產生的解釋
  - 都是身體的自我保護，以避免人在黑暗中受傷
  answer: C
- question: 4. 根據本文結論，如果遇到超自然事件時，哪一個選項不符合現代科學的精神？
  options:
  - 調整思考，依據科學的角度去解釋異狀
  - 心理治療，透過專業協助，找到問題的根源
  - 身體檢查，看看是否有腦部或癲癇等疾病
  - 敬畏鬼神，常去廟裡收驚、拜拜、保平安
  answer: D
- question: 5. 解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。 以「止癢」為例，請將代號依步驟排出正確的順序。
  options: []
  answer: A
