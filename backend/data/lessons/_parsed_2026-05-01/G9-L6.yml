discussion_content:
- 1.以「鬼火」為例
- 2.情境→小明上課都很想睡覺
- (1)為什麼小明上課都很想睡覺？
- →因為 昨晚小明太晚睡 □小明是懶惰蟲。
- (2)為什麼小明 太晚睡 ？
- →因為 玩電動忘記時間。 □他生活習慣不好。
- (3)如何解決問題/結論： 設定玩電動的時間，早點休息 。
- （ B ）1. 下列語詞何者用法使用正確?
- A.面對惡犬，他「毛骨悚然」，完全不畏懼
- B.「乍見」新年的曙光，讓人內心雀躍不已
- C.他能言善道，完全不像個「喑啞」人士
- D.這棟鬼屋傳說眾多，真是「窮凶極惡」之地
- （ D ）2. 有關「睡眠癱瘓症」的描述，何者正確？
- A.通常發生在睡眠時的深睡期
- B.絕大多數的人會頻繁發生睡眠癱瘓
- C.作噩夢時，身體可以自由移動
- D.癱瘓現象是人體在睡眠中的保護機制
- （ C ）3. 人們常常聽到「鬼火」與「鬼壓床」的經驗，請問兩者的共同之處為何？
- A.都是鬼魂想要向人世間傳達訊息的一種手段
- B.只有在深度睡眠時期，才可能會發生這種現象
- C.都是人類對未知事物的恐懼感所產生的解釋
- D.都是身體的自我保護，以避免人在黑暗中受傷
- （ D ）4. 根據本文結論，如果遇到超自然事件時，哪一個選項不符合現代科學的精神？
- A.調整思考，依據科學的角度去解釋異狀
- B.心理治療，透過專業協助，找到問題的根源
- C.身體檢查，看看是否有腦部或癲癇等疾病
- D.敬畏鬼神，常去廟裡收驚、拜拜、保平安
- （ A ）5. 解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。 以「止癢」為例，請將代號依步驟排出正確的順序。
- A.乙甲丙 B.乙丙甲 C.甲乙丙 D.丙乙甲
