spotlight_raw_text: "閱讀聚光燈\n解決問題－科學探究法\n    科學是以系統的方法解決問題的學問。若能善用科學方法，除了可以培養明辨是非的能力，也可以解決生活中的問題喔。\n解決科學問題的步驟：\n我們看到一個現象，可以利用「為什麼」或「是什麼」的問題，一層一層的提問，找出問題的解答。\n(1)提出問題（發現問題與定義問題）：對所見現象抱持好奇心，發現尚未解決的問題，確認「問題」是什麼？\n注意：要提出清楚、可回答的問題。\n(2)提出假設：從既有的知識基礎上，提出問題的可能答案。\n注意：假設應該根據基於「客觀的事實」，避免只有主觀的意見。（客觀指的是每一個人看到的都一樣；主觀指的是大家對同樣的事情有不同的意見。）\n(3)檢驗假設：蒐集資料，小心求證，檢驗假設是否正確。\n總結：學習好奇的事物問「為什麼」，是科學訓練的起點。\n\n16567154762500\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 解決問題：科學探究法
  instruction: 科學探究法能幫助我們系統性地解決問題。請完成以下練習，了解科學探究法的步驟與重點。
  reasoning: 此練習旨在引導學生理解科學探究法的核心步驟與注意事項。透過將原文的定義與說明轉化為選擇題，確保學生能辨識並記憶各步驟的關鍵內容。
  steps:
  - prompt: 科學探究法的第一步是「提出問題」。請問，在提出問題時，我們應該注意的重點是什麼？
    type: select
    options:
    - 對所見現象抱持好奇心，發現尚未解決的問題。
    - 要提出清楚、可回答的問題。
    - 從既有的知識基礎上，提出問題的可能答案。
    answer: 1
    reasoning: 題目詢問「提出問題」時應注意的重點，原文「注意」處明確指出：「要提出清楚、可回答的問題。」
  - prompt: 科學探究法的第二步是「提出假設」。關於提出假設，以下哪一個敘述是正確的？
    type: select
    options:
    - 假設應該根據基於「客觀的事實」，避免只有主觀的意見。
    - 對所見現象抱持好奇心，發現尚未解決的問題。
    - 蒐集資料，小心求證，檢驗假設是否正確。
    answer: 0
    reasoning: 題目詢問關於「提出假設」的正確敘述，原文「注意」處明確指出：「假設應該根據基於『客觀的事實』，避免只有主觀的意見。」
  - prompt: 科學探究法的第三步是「檢驗假設」。請問，檢驗假設的主要目的是什麼？
    type: select
    options:
    - 確認「問題」是什麼？
    - 蒐集資料，小心求證，檢驗假設是否正確。
    - 從既有的知識基礎上，提出問題的可能答案。
    answer: 1
    reasoning: 題目詢問「檢驗假設」的主要目的，原文對此步驟的描述為：「蒐集資料，小心求證，檢驗假設是否正確。」
