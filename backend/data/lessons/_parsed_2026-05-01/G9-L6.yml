vocabulary:
- word: 毛骨悚然
  definition: 讓人感到毛髮直立、背脊發涼，形容極度害怕。
- word: 週期
  definition: 指的是一定的時間間隔，定期的重複發生。
- word: 喑啞無聲
  definition: 發不出聲音。
- word: 癱瘓
  definition: 失去行走的能力。
- word: 窮凶極惡
  definition: 形容人十分凶惡。
- word: 乍見
  definition: 忽然看見。
- word: 引人入勝
  definition: 故事或景物很吸引人，引起人們極大的興趣。
- word: 睡眼惺忪
  definition: 剛睡醒，眼神模糊，神智不清醒的樣子。
- word: 啟人疑竇
  definition: 讓人開始懷疑事情的合理性。
- word: 閃爍
  definition: 光線快速閃動的樣子。
