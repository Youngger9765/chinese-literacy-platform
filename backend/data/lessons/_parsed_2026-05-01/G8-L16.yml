    - 很怕阿嬤
    answer: 1
    reasoning: 原文提到「手心立刻冒汗，連呼吸都放輕，小跑步進房間」，這些身體反應和行為顯示作者對阿嬤感到恐懼或緊張，而非愛。
  - prompt: 推論作者想表達的想法
    type: select
    options:
    - 阿嬤很嚴厲，讓我總是戰戰兢兢
    - 阿嬤討厭我，總是修理我、恐嚇我
    answer: 0
    reasoning: 文章線索提到「只看見作者該改進的地方」、「再哭一聲看看！我會立刻噤聲」、「她只要在家大喊我的名字……小朋友立刻神色大變……」，這些都指向阿嬤的嚴厲和作者的戰戰兢兢，而非阿嬤討厭作者。
  - prompt: 推論祖孫關係 阿嬤與作者：
    type: select
    options:
