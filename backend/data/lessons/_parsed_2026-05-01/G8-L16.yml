multiple_choice:
- question: 1. 作者在後段補寫阿嬤的成長背景（貧困、威權、階級、被罵而躲桌下），最主要的用意是什麼？
  options:
  - 把責任推給日本警察，他才是造成悲劇的根源
  - 為了讓故事更曲折熱鬧，增加閱讀的戲劇張力
  - 用阿嬤更辛苦的童年來對照，暗示作者不該計較
  - 交代阿嬤的成長，開始理解她為何會這樣對待小孩
  answer: D
- question: 2. 第五段為什麼作者在當兵時，聽到鄰兵啜泣，會不屑地想：「哼，嬌生慣養！」又感謝起阿嬤來？
  options:
  - 作者覺得班長再兇也不過如此，和阿嬤比起來不算什麼
  - 作者覺得當兵就是要吃苦，哭出來只會讓家人更難過
  - 作者覺得鄰兵是想博取同情，好讓班長對他放寬標準
  - 作者知道成功嶺結訓後，阿嬤會煮一大桌好菜等他回家
  answer: A
- question: 3. 作者安排「阿嬤很兇、滿口髒話」與「晚餐滿桌菜、作者擁抱阿嬤」的對照，最主要是在凸顯什麼？
  options:
  - 阿嬤既然出口粗魯，就不可能真的在乎家人
  - 阿嬤情緒忽冷忽熱，讓人永遠摸不清她的心思
  - 愛的表達不只靠言語，也可能藏在照顧與付出裡
  - 作者懂得討好長輩，所以才換來比較好的對待
  answer: C
- question: 4. 作者和阿嬤的關係，為什麼會從「又怨又怕、能逃就逃」變成可把阿嬤抱離地面、幽默反酸她？最可能的原因為何？
  options:
  - 作者長大成為教授後，阿嬤改變了，比較不會罵人了
  - 作者教會阿嬤心理學裡尊重接納小孩的現代教養觀念
  - 阿嬤沒有改變，是作者開始正向詮釋自己的童年經驗
  - 作者長大後，知道要忍耐、吃苦，才能提升家人關係
  answer: C
- question: 5. 有同學讀完後說：「這篇文章是在替打罵式教養背書，甚至鼓勵家長用打罵管教。」你認為最貼近本文立場的回應是什麼？
  options:
  - 沒錯，因為作者最後很感謝，所以他真的在鼓勵打罵
  - 沒錯，因為作者後來當教授，可見打罵管教很有效果
  - 不對，本文未推廣打罵，只強調人不是早期經驗決定的
  - 不對，作者完全否定童年經驗，所以教養方式不重要
  answer: C
