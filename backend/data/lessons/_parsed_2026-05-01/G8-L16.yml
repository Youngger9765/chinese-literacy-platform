  - prompt: 推論作者想表達的想法
    type: select
    options:
    - 我常挨阿嬤罵，是因為我很糟，不夠好
    - 阿嬤愛罵人是她自己的問題，我不必每句話都當真
    answer: 1
    reasoning: 文章提到「她連看八點檔，都會挑剔演員，說他很醜」，這暗示作者開始意識到阿嬤的挑剔是其個人特質，不完全是針對自己，因此不必句句當真。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 班長本來就該嚴厲，我不懂鄰兵為什麼哭
    - 阿嬤對我的嚴厲，能幫助我適應軍中生活
    answer: 1
    reasoning: 作者在軍中看到鄰兵啜泣，心裡不屑「哼，嬌生慣養！」，並「開始感謝起阿嬤來」，這表明作者認為阿嬤的嚴厲管教使他具備了適應艱苦環境的心理韌性。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 藉此展現在部隊裡訓練出來的肌肉
    - 很久沒有見到阿嬤，很高興再見到她
    - 不再是小孩了，現在不論身心，我都能輕易面對阿嬤
    answer: 1
    reasoning: 原文此題為「3選2」題型，選項②和③皆為正確答案。根據JSON schema僅能選擇一個答案的限制，此處選擇選項②。作者「把她風雨不透的抱離地面，轉了一個圈」，顯示了久別重逢的喜悅和親近，同時也暗示了作者體能和心態上的成長，不再是過去那個懼怕阿嬤的小孩。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 我們的關係改變了，我不再怕她，可以提不同想法
    - 我進入了反抗期，對什麼都不滿意，都要抗議
    answer: 0
    reasoning: 作者「試著講完全的尊重接納……並抗議她總是在嫌我罵我」，這表明作者不再只是被動接受，而是能主動表達自己的想法和感受，關係從單向服從轉為雙向溝通。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 壞脾氣的她，畢竟也有心情好的時候
    - 我開始讀懂她用行動在乎我，雖然說話難聽
    answer: 1
    reasoning: 作者說「我知道這是她愛我的方式」，顯示作者開始理解阿嬤雖然言語刻薄，但會透過實際行動（如準備豐盛晚餐）來表達關愛。
  - prompt: 推論作者認為自己的角色有了什麼變化？
    type: select
    options:
    - 從「受壓迫的小孩」「能提出不同意見的大人」
    - 從「又怕又怨的小孩」「能夠勇敢反擊的大人」
    answer: 0
    reasoning: 綜合大學時期的線索，作者從過去的懼怕和服從，轉變為能夠理解阿嬤的行為模式，並嘗試表達自己的觀點，顯示其角色從被動的「受壓迫小孩」轉變為能主動溝通的「大人」。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 在任何情境，不管對誰，阿嬤說話方式從未改變
    - 阿嬤對孩子的口頭霸凌方式歷歷可數
    answer: 0
    reasoning: 阿嬤對作者的挑剔言詞（「我看你一輩子也做不完」、「你讀什麼博士？讀到天邊去了？」、「你牙齒痛是嗎？」）以及對三歲小昀的影響，都顯示阿嬤的說話方式是其一貫的模式，不因對象或情境而改變。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 祖孫關係改變了，我現在能幽默接住阿嬤的刻薄
    - 從小被罵被酸，我當然要找機會報仇一下
    answer: 0
    reasoning: 作者以阿嬤慣用的「你牙齒痛是嗎？」反問阿嬤，這是一種幽默的回應，顯示作者不再懼怕，而是能以輕鬆的方式應對阿嬤的刻薄，關係趨於平等。
  - prompt: 推論作者未寫出的想法
    type: select
    options:
    - 我不再怕她，能用幽默接住她的刻薄，也能理解她的成長，並決定如何詮釋自己的童年經驗
    - 我用反酸贏了她，證明我比較厲害，她以後就不敢再罵我了
    answer: 0
    reasoning: 作者理解到「阿嬤對我們說話的方式，就是她小時候大人對她說話的方式」，這表明作者不僅能幽默應對，更能從歷史和成長背景的角度理解阿嬤，進而重新詮釋自己的童年經驗。
  - prompt: 試著推論作者現在怎麼看待他的阿嬤？
    type: select
    options:
    - 一個沒水準、滿口髒話、家暴小孩、死性不改的長輩
    - 阿嬤愛我，她說話刻薄有其成長背景，我能理解
    answer: 1
    reasoning: 綜合前述推論，作者已能理解阿嬤刻薄言語背後的成長背景和關愛方式，不再單純視其為負面形象，而是能以更全面、包容的視角看待。
  - prompt: 1.互動方式變化（關係）：請選出最符合本文「作者×阿嬤」互動方式的變化？
    type: select
    options:
    - 噤聲不敢回→能提出不同想法→能幽默接住刻薄
    - 噤聲不敢回→越來越反感→逐漸疏離對立
    answer: 0
    reasoning: 根據文章各階段的描述，作者從最初的懼怕「噤聲不敢回」，到大學時期能「提出不同想法」甚至「抗議」，再到35歲時能「幽默接住刻薄」，顯示關係是正向的轉變而非疏離對立。
  - prompt: 2.想法變化路線：本文中「作者對阿嬤的想法」，變化歷程為何？
    type: select
    options:
    - 覺得被討厭→覺得溝通無用→決定遠離她
    - 先求不挨罵→不再句句當真、看懂她的愛→理解脈絡並重新詮釋
