spotlight_raw_text: "閱讀聚光燈\n推論策略—\n推論角色關係與觀點\n推論和腦補\n請試著讀底下的文字，再回答一個問題：\n　　「阿嬤在屋裡喊：『過來！』我手心立刻冒汗，連呼吸都放輕，小跑步進房間。」\n問題：作者和阿嬤的關係可能是？【□很愛阿嬤　　很怕阿嬤】\n在回答這個簡單的問題時，你已經在做推論了。\n你看，「作者很怕阿嬤」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」，最近的流行語叫做「腦補」哦。\n閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！\n這篇故事，描述了作者和阿嬤之間的互動，故事沒有把他們的關係和想法講白，而是把線索藏在對話、動作和反應裡。\n接下來要做的就是抓住這些線索，推論作者和阿嬤的關係如何改變，並進一步理解作者真正想傳達的意思。\n\n階段\n文章線索及推論想法\n小時候\n文章線索\n①只看見作者該改進的地方\n②「再哭一聲看看！」我會立刻噤聲。\n③她只要在家大喊我的名字……小朋友立刻神色大變……\n\n推論作者想表達的想法\n（單選）\n①阿嬤很嚴厲，讓我總是戰戰兢兢\n□②阿嬤討厭我，總是修理我、恐嚇我\n\n推論祖孫關係\n(單選)\n阿嬤與作者：\n①權威者 vs. 服從者\n□②照顧者 vs. 被照顧者\n讀大學時期\n文章線索\n阿嬤連看八點檔，都會挑剔演員，說他很醜\n\n推論作者想表達的想法\n（單選）\n□①我常挨阿嬤罵，是因為我很糟，不夠好\n②阿嬤愛罵人是她自己的問題，我不必每句話都當真\n\n文章線索\n聽見鄰兵啜泣……我心裡不屑：哼，嬌生慣養！開始感謝起阿嬤來。\n\n推論作者未寫出的想法\n(單選)\n□①班長本來就該嚴厲，我不懂鄰兵為什麼哭\n②阿嬤對我的嚴厲，能幫助我適應軍中生活\n\n文章線索\n（從軍中回家見到阿嬤）把她風雨不透的抱離地面，轉了一個圈。\n\n推論作者未寫出的想法\n\n(3選2)\n□①藉此展現在部隊裡訓練出來的肌肉\n②很久沒有見到阿嬤，很高興再見到她\n③不再是小孩了，現在不論身心，我都能輕易面對阿嬤\n\n文章線索\n我試著講完全的尊重接納……並抗議她總是在嫌我罵我。\n\n推論作者未寫出的想法\n\n(單選)\n①我們的關係改變了，我不再怕她，可以提不同想法\n□②我進入了反抗期，對什麼都不滿意，都要抗議\n\n文章線索\n晚餐有滿桌子的菜，我知道這是她愛我的方式\n\
  \n推論作者未寫出的想法\n(單選)\n□①壞脾氣的她，畢竟也有心情好的時候\n②我開始讀懂她用行動在乎我，雖然說話難聽\n\n推論作者認為自己的角色有了什麼變化？(單選)\n①從「受壓迫的小孩」「能提出不同意見的大人」\n□②從「又怕又怨的小孩」「能夠勇敢反擊的大人」\n35歲\n｜\n作者在大學教學\n文章線索\n①她嫌我動作慢：「我看你一輩子也做不完。」忘了鎖門，她：「你讀什麼博士？讀到天邊去了？」我哼個歌，她：「你牙齒痛是嗎？」\n②三歲的小昀被薰陶一個月，也學會說「幹恁婆啊！」\n\n推論作者未寫出的想法\n(單選)\n①在任何情境，不管對誰，阿嬤說話方式從未改變\n□②阿嬤對孩子的口頭霸凌方式歷歷可數\n\n文章線索\n作者唱歌被罵，阿嬤唱歌，作者笑著反酸：「阿嬤，你牙齒痛是嗎？」\n\n推論作者未寫出的想法\n(單選)\n①祖孫關係改變了，我現在能幽默接住阿嬤的刻薄\n□②從小被罵被酸，我當然要找機會報仇一下\n\n文章線索\n阿嬤成長在一個威權當道，階級分明的世代。原來，阿嬤對我們說話的方式，就是她小時候大人對她說話的方式。\n\n推論作者未寫出的想法\n\n(單選)\n①我不再怕她，能用幽默接住她的刻薄，也能理解她的成長，並決定如何詮釋自己的童年經驗\n□②我用反酸贏了她，證明我比較厲害，她以後就不敢再罵我了\n\n試著推論作者現在怎麼看待他的阿嬤？\n□①一個沒水準、滿口髒話、家暴小孩、死性不改的長輩\n②阿嬤愛我，她說話刻薄有其成長背景，我能理解\n\n二、把三個階段串連起來看歷程。(單選)\n1.互動方式變化（關係）：\n請選出最符合本文「作者×阿嬤」互動方式的變化？\n    eq \\o\\ac(○,1)噤聲不敢回→能提出不同想法→能幽默接住刻薄\n   □②噤聲不敢回→越來越反感→逐漸疏離對立\n2.想法變化路線：\n  本文中「作者對阿嬤的想法」，變化歷程為何？(單選)\n□ eq \\o\\ac(○,1)覺得被討厭→覺得溝通無用→決定遠離她\n②先求不挨罵→不再句句當真、看懂她的愛→理解脈絡並重新詮釋\n三、從上述作者觀點轉變歷程，本文最想提醒讀者的是什麼?(單選)\n eq \\o\\ac(○,1)人不會被早期經驗決定一輩子；我們可以選擇怎麼理解自己的童年\n□②長輩多半愛挑剔，孩子只能忍耐，關係很難改變\n□③心理韌性靠打罵養成，受過嚴格管教的人一定更強\n\
  □④當兵最能鍛鍊意志，因此比讀書更能改變一個人\n\n◎"
