multiple_choice:
- question: 1.第三段指出臺灣已有安寧緩和醫療與《病人自主權利法》，並鼓勵民眾預先決定醫療選擇。作者最想強調的重點是什麼？
  options:
  - 臺灣已全面讓臨終病人的安樂死與協助自殺合法化
  - 臺灣目前鼓勵民眾尋求各種醫療方案以延長壽命
  - 只要臨終病人簽字，就能要求醫師立即結束生命
  - 臺灣的制度法令尊重臨終病人停止無效醫療的決定
  answer: D
- question: 2.最後一段提到「如果資源到位……末期的病人就不會只剩非黑即白的極端選項」，這段話主要在強調什麼？
  options:
  - 很多求死念頭，可能來自疼痛與孤單等生不如死的處境
  - 要降低爭議，必須先釐清安樂死與協助自殺的差別
  - 只要有完善的照護，就能減少因疼痛孤單而求死的情況
  - 真正想要解決問題，仍需盡快推動法律開放與全面上路
  answer: C
- question: 3.根據文章內容，下列哪一項最能說明支持者與反對者立場的核心差異？
  options:
  - 是否相信醫師有能力正確判斷病人的真實意願
  - 是否贊成參考瑞士的制度來處理臨終病人的選擇
  - 對「自主與尊嚴」和「開放後風險」的取捨不同
  - 是否認為只要程序嚴格就能完全避免制度被濫用
  answer: C
- question: 4.作者先用傅達仁案例，再進行三種類型的分類，接著呈現三方立場。這種安排最可能是為了什麼？
  options:
  - 先製造情緒衝突，再讓讀者只接受作者強調的結論
  - 先描寫人物形象，再把他塑造成唯一正確的選擇榜樣
  - 先解釋法律條文細節，再用案例補充艱深的專業內容
  - 先建立共感與問題感，再用概念與觀點整理複雜議題
  answer: D
