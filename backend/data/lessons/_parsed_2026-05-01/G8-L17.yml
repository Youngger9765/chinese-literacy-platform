  - 是否贊成參考瑞士的制度來處理臨終病人的選擇
  - 對「自主與尊嚴」和「開放後風險」的取捨不同
  - 是否認為只要程序嚴格就能完全避免制度被濫用
  answer: C
- question: 4.作者先用傅達仁案例，再進行三種類型的分類，接著呈現三方立場。這種安排最可能是為了什麼？
