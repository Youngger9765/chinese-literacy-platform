strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈策略練習
  instruction: 請判斷下列何者對於「事件─想法─感受」的理解較為合適。
  reasoning: 此題目旨在評估學生對「事件─想法─感受」模型核心概念的理解。該模型強調事件本身不直接決定感受，而是個人對事件的「想法」決定了感受，因此釐清想法有助於情緒調適。題目選項設計用以區辨學生是否能正確掌握此因果關係。
  steps:
  - prompt: 閱讀聚光燈的練習，下列何者對於「事件─想法─感受」 的理解較為合適？
    type: select
    options:
    - 橘子：每個人在相同的事件中都有相同的感受
    - 步美：比起想法，事件對感受的影響更為直接
    - 靜香：越快對事件下判斷就越能保持平靜喜悅
    - 小葵：釐清對事件的想法有助於自己調適心情
    answer: 3
    reasoning: 「事件─想法─感受」模型的核心在於，事件本身不直接導致感受，而是個人對事件的「想法」決定了感受。課文摘要中，主角因為對「他」的行為產生了「他是不是喜歡那個很幽默的同學？」「我根本不特別？」等想法，才導致了「胸口就會被抓緊，心裡很不是滋味」的感受。因此，釐清這些想法，理解其如何影響情緒，是調適心情的關鍵。選項D「釐清對事件的想法有助於自己調適心情」最符合此模型的精神。選項A、B、C皆與模型概念相悖：A忽略了個體差異，B錯誤地將事件視為感受的直接原因，C則可能導致更多負面情緒而非平靜喜悅。
