- question: （ Ｃ ）2. 根據第三段，「（這些念頭）像是一群停不下來的蜜蜂，在腦袋裡嗡嗡作響」這句話最可能表現出作者當時的什麼狀態？
  options:
  - 手足無措，對於未來感到一片茫然
  - 活力四射，腦海中有大量靈感出現
  - 煩亂不堪，無法停止各種胡思亂想
  - 緊張無比，深怕自己做錯了什麼事
  answer: C
- question: 4. 根據本文標題「喜歡是什麼」及內容，下列敘述何者最貼近作者答案？
  options:
  - 喜歡是颱風來臨時的海浪，高高低低，且難以控制
  - 喜歡是大雨過後的彩虹，繽紛美好，卻也無法久留
  - 喜歡是遲遲無法擺脫的惡夢，時刻相伴，無處可逃
  - 喜歡是童年時的糖果，讓人滿口都甜蜜，心情愉快
  answer: A
- question: 5. 根據閱讀聚光燈的練習，下列何者對於「事件─想法─感受」 的理解較為合適？
  options:
  - 橘子：每個人在相同的事件中都有相同的感受
  - 步美：比起想法，事件對感受的影響更為直接
  - 靜香：越快對事件下判斷就越能保持平靜喜悅
  - 小葵：釐清對事件的想法有助於自己調適心情
  answer: D
