vocabulary:
- word: 煙消雲散
  definition: 比喻事情或情緒完全消失不見。
- word: 一言一行
  definition: 說的每句話、做的每件事；常用來形容行為表現的細節。
- word: 亂竄
  definition: 快速、沒方向的跑來跑去。
- word: 揮之不去
  definition: 無法從心中或腦中去掉，常指記憶或情緒。
- word: 動向
  definition: 行動和事情發展的方向。
- word: 起伏
  definition: 高高低低的變化，常用來形容情緒或局勢。
- word: 心花怒放
  definition: 形容心情像盛開的花朵一樣，非常開心。
- word: 深淵
  definition: 比喻危險或苦痛的地方。
- word: 不是滋味
  definition: 心裡覺得不舒服、不開心，但又難以形容。
- word: 偵測
  definition: 測量、查找或發現。
- word: 雀躍
  definition: 像麻雀輕快地跳躍；形容心情輕快愉悅。
