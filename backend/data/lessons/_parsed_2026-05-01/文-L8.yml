spotlight_raw_text: "文言聚光燈：一字多義：「少」\n文言文類型\n記敘人物\t\n\n-27940-18224500第8課  愛讀書的顧寧人\
  \  \n學習單：\n王淑瑱\n古文今譯\n崑山有一位顧寧人先生，生長在世代做官的家族，年少時就擁有超越其他人的資質，他專注於研究古代的學問，儒家的書及各種史書，差不多都能背誦。\n\
  他的精力超越一般人，沒有其他嗜好，從小到老，從來沒有一天不讀書。出門時，車上一定要帶上幾箱的書隨行，到旅店稍微休息後，就翻找書箱拿書出來讀，從不曾表現出疲倦的樣子來。\n\
  清朝・潘耒\n  \n崑山.顧寧人.先生，生長\U000E01E1.世族，少\U000E01E1負.絕異之資，潛心古學，九經.諸史，略能.背誦。\n精力.絕人，無他.嗜好\U000E01E1\
  ，自少\U000E01E1.至老，未嘗.一\U000E01E1日.廢書。出.必載書.數簏1.自隨，旅店少休，披尋.搜討，曾無.倦色。\n487643185345注釋\n\
