strategy_exercise:
  type: guided_steps
  strategy_name: 文言聚光燈：一字多義：「少」
  instruction: 請判斷文中「少」字的意義。
  reasoning: 此練習旨在引導學生理解文言文中「少」字的一字多義現象。原文中「少」字出現兩次，皆取「年輕時」之意。透過選擇題，學生需辨識其在特定語境下的意義。課文摘要部分僅供理解上下文，不作為獨立的練習步驟。
  steps:
  - prompt: 請判斷「少負絕異之資」中的「少」字，其意義為何？
    type: select
    options:
    - 年輕時
    - 數量不多
    - 缺少
    answer: 0
    reasoning: 原文「少負絕異之資」在古文今譯中為「年少時就擁有超越其他人的資質」，故「少」在此處意指「年輕時」。
  - prompt: 請判斷「自少至老」中的「少」字，其意義為何？
    type: select
    options:
    - 年輕時
    - 數量不多
    - 缺少
    answer: 0
    reasoning: 原文「自少至老」在古文今譯中為「從小到老」，故「少」在此處意指「年輕時」。
