spotlight_raw_text: "閱讀聚光燈\n寫作手法－擬人\n    寫作常見的手法--譬喻、轉化和誇飾修辭，都是運用聯想、想像力的方式，來聯想連結讀者普遍的經驗，以引起讀者共鳴，讓讀者感同身受。\n　　轉化修辭中的擬人是常見的聯想方式。擬人主要將動、植物或無生命之物想像成人，或是對它投射情感，就像我們對小時候的玩具或娃娃一樣，可能會幫它命名、跟它說話，把它當作人一樣對待。\n    而文章使用擬人之處，也是作者投入想像和感情之重點處，像是這篇文章將台東聯想成心愛的對象，進而對其傾訴，因此閱讀時我們可以留意擬人的句子，推論作者主要想傳達的感受或意涵。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 寫作手法：擬人
  instruction: 本練習將引導你認識寫作手法中的擬人，並學習如何在文章中辨識擬人句，進而推論作者想傳達的感受或意涵。
  reasoning: 此練習旨在引導學生理解擬人修辭的定義、目的，並能從課文中找出擬人句，進一步推論作者的情感與意涵。原文文字明確解釋了擬人手法，並指出其在課文中的應用方式（將台東擬人化）。
  steps:
  - prompt: 根據原文說明，下列何者最符合「擬人」修辭的定義？
    type: select
    options:
    - 將兩種不同事物進行比較，使描述更生動。
    - 將動、植物或無生命之物想像成人，或對其投射情感。
    - 誇大事物的特徵或數量，以加強語氣或效果。
    answer: 1
    reasoning: 原文提到：「擬人主要將動、植物或無生命之物想像成人，或是對它投射情感」。選項2直接呼應此定義。
  - prompt: 原文指出，作者使用擬人手法的目的為何？
    type: select
    options:
    - 讓文章內容更客觀，避免主觀情感。
    - 運用聯想、想像力，引起讀者共鳴，讓讀者感同身受。
    - 使文章結構更嚴謹，增加閱讀難度。
    answer: 1
    reasoning: 原文說明：「都是運用聯想、想像力的方式，來聯想連結讀者普遍的經驗，以引起讀者共鳴，讓讀者感同身受。」選項2符合此目的。
  - prompt: 根據課文摘要，請找出一個將「台東」或其相關事物「擬人化」的句子，並說明你判斷的理由。
    type: free_text
    reasoning: 此題旨在引導學生將所學的擬人定義應用到實際課文內容中，辨識出具體的擬人句，並能解釋其判斷依據，以加深對擬人手法的理解與應用能力。例如：「靠向我的層層山巒彷彿是你的溫柔迎接。」將山巒賦予了人的「溫柔迎接」的動作。
