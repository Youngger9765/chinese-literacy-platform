multiple_choice:
- question: 1. 下列語詞何者使用正確？
  options:
  - 學生在操場上追逐嬉戲，「呢喃」的笑聲傳遍校園
  - 十年同學會上，大家期待著與昔日同窗的「邂逅」
  - 儘管面臨挑戰，公司仍堅持「一貫」的環保信念
  - 年邁的夫妻「佇足」在公園的長椅上，看著夕陽
  answer: A
- question: 2. 第一段「我是風塵僕僕的考生，緊湊的腳步踩著不容錯過的時刻」，請問最可能是下列何種情境？
  options:
  - 作者考試項目是跳舞，必須踏準節拍
  - 作者於風沙中行走，需抖落鞋中的沙
  - 作者已遲到許久，因此必須加快腳程
  - 作者行程緊湊，腳步匆忙，深怕耽擱
  answer: B
- question: 3. 下列文句的解讀何者正確？
  options:
  - 「台北的天空被建築擠得破碎」──台北的高樓遮蔽了天空
  - 「台北的星光被霓虹無聲淹沒」──台北人對星星不抱興趣
  - 「台北那棋盤般的巷弄，更讓人宛如一顆身不由己的棋。」
  answer: A
- question: 4. 關於余光中〈台東〉及本文與此詩的關係，下列敘述何者正確？
  options:
  - 詩人藉由台東與台北的比較，強調台北的先進
  - 詩人藉由東岸與西岸的比較，凸顯東岸的遼闊
  - 作者引用此詩是為了證明自己所見與詩人略同
  - 此詩中的台東，已與本篇文中的台東相差甚遠
  answer: D
- question: 5. 關於本篇文章的標題分析，下列敘述何者正確？
  options:
  - 從「致台東」可知是將台東想像成寫信的人
  - 從「過客」可知作者自認與觀光客有所不同
  - 從「情書」可知此信主要訴說對台東的情感
  - 從本文標題可知作者預計未來仍會拜訪台東
  answer: C
