vocabulary:
- word: 邂逅
  definition: 偶然相遇、相逢。
- word: 風塵僕僕
  definition: 旅途艱辛奔波。
- word: 佇足
  definition: 停下腳步。
- word: 揣想
  definition: 猜測、猜想。
- word: 呢喃
  definition: 小聲說話。
- word: 林立
  definition: 像林木密集的聳立。比喻眾多。
- word: 絡繹不絕
  definition: 連續不斷，通常指人群。相似詞有「川流不息」。
- word: 一貫
  definition: 從來沒改變。
- word: 流連忘返
  definition: 沉醉而不願離開。
- word: 汲汲營營
  definition: 過於急切追求的樣子。
- word: 遣返
  definition: 回到原來的地方。常用於出國後被送回的狀況。
- word: 餞行
  definition: 為人送行。相似詞有「餞別」。若歡迎歸來可用「接風」、「洗塵」。
