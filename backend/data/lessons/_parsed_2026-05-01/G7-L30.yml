lesson_intro:
  source: docx_explanation
  text: 閱讀有圖或有表的文章時，不能只看文字，而要來回比對圖、表與文章內容，理解彼此之間的關係。這樣不但能更快掌握重點，也能更正確地回答問題。這一課，我們將以〈都是八哥，為什麼命運不一樣？〉為例，學習有表格文章的閱讀方法。
