spotlight_raw_text: "閱讀聚光燈\n圖文表整合閱讀策略\n這篇文章裡，文字、圖片和表格都提供了重要訊息。閱讀時，不能只看文字，也不能只看圖片或表格，而要先注意文字怎麼提醒你看圖表、怎麼告訴你圖表的功能，再把文字、圖片、表格連起來想。\n這一課我們用下面4個步驟，練習圖文表整合閱讀：\n❶先讀文字——抓出這段的重點\n❷找出相關圖表——判斷各自提供什麼訊息\n❸文圖表對照——從圖表中找到和文字對應的資訊\n❹整合多種材料——比較、連結各項資訊之間的關係\n\n練習一：第一段 vs 圖一 \n 1.圖一最主要提供哪一類訊息？（單選）\n  ①兩種八哥外形相近的整體印象\n  □②兩種八哥近年的族群變化情形\n2.讀完第一段後，請你找出和圖一最相關的文字。（單選）\n□①白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。\n②這兩種八哥外形十分相似，不容易單靠外表一眼分辨。\n\n練習二：第二段 vs 表一 \n步驟❶：先讀文字——抓出這段的重點\n  小祕訣：含有表格的文章經常會告訴讀者，哪些地方要看表。當你讀到「表一」的提示時，你知道等一下要轉去看表一，並問自己這段要你看表的什麼？\n1.請把第二段文字中，要你看表的地方畫線或圈起來\n2.這段要你看表的什麼？（單選）\n  ①八哥的外形與習性\n  □②八哥的數量變化\n步驟❷：再看表一——讀懂這張表告訴我們什麼訊息\n  小祕訣：看表時，要先讀表格「標題」、再讀「第一列」和「第一欄」的小標題，判斷一下這個表在比較什麼，最後讀表格裡的內容。\n1.表一主要提供的是哪一類訊息？（單選）\n  □①白尾八哥和臺灣冠八哥近年的族群變化\n  ②白尾八哥和臺灣冠八哥的異同\n步驟❸：文圖表對照——從圖表中找到和文字對應的資訊\n在表一找到對應文字說明的訊息，必要時回頭看圖一，看看表格怎麼幫助你把文字讀得更清楚。\n1.第二段說兩種八哥「外表相似」，表一中哪些資料可支持這句話？（複選）\n①全身大致為黑色   ②身形大小接近       \n□③常在地面走動覓食，吃昆蟲、果實  □④都屬八哥屬、留鳥 \n2.第二段說「只要觀察嘴喙和尾羽的顏色，就能分辨牠們」，表一中的哪些資料正好對應這句話？（複選）\n①嘴喙顏色  ②尾羽顏色 □③築巢地點  □④適應都市環境\n3.第二段提到臺灣冠八哥又稱「臺灣八哥」，表一中的哪一項資料和這句話最有關？（單選）\n□①冠羽是否明顯  ②外來種／原生種\n□③族群數量      □④保育身分\n4.讀表一，對理解第二段有什麼幫助？（單選）\n□①表一只是把第二段重新整理一次，並沒有幫助我們更清楚理解這段意思。\n②表一幫助我們更清楚看出，兩種八哥雖然外形相近，但仍可從特徵和習性加以分辨。\n步驟❹：整合多種材料——比較、連結各項資訊之間的關係\n1.下面哪一句最能把第二段和表一的意思一起說清楚？（單選）\n□①兩種八哥雖然外形相近，但只要知道牠們同屬八哥屬，就能解釋後來族群數量不同的原因\n②兩種八哥雖然外形相近，但仍可從嘴喙、尾羽等特徵區分，表一也進一步比較了牠們的習性差異\n2.讀完第二段和表一後，你認為哪些差異最值得留意，因為它們可能和課文標題的「命運不一樣」有關？（單選）\n①是否怕人、是否利用人造設施築巢、適應都市環境強弱\n□②嘴喙顏色、尾羽顏色、冠羽是否明顯\n\n練習三：第三段 vs 表二 \n步驟❶：先讀文字——抓出這段的重點\n  1.請把第三段文字中，要你看表的地方畫線\n2.這段要你看表的什麼？（單選）\n  □①兩種八哥的外形與習性\n  ②兩種八哥的數量變化\n步驟❷：再看表——讀懂這張表告訴我們什麼訊息\n1.表二主要提供的是哪一類訊息？（單選）\n①兩種八哥近年族群數量的變化\n□②白尾八哥和臺灣冠八哥的異同\n步驟❸：文表對照——從表中找到和文字對應的資訊\n在表二找到對應文字說明的訊息，看看表格怎麼把第三段說的內容整理得更清楚。\n1.第三段說「外來種白尾八哥都明顯多過原生種臺灣冠八哥」，表二中的哪些資料可以支持這句話？（複選）\n①近年數量變化（2009-2020）\n②看得到的地點數／總調查地點數（2009-2021）\n③2021年看得到的地點數  \n④2018年花蓮調查結果 \n2.讀表二時，看到「84／584」旁邊有「註2」，到表格下方看註解有什麼幫助？（單選）\n①註2會說明這個寫法的意思，幫助我們理解表格內容。\n□②註2會補充八哥的外形特徵，幫助我們分辨兩種八哥。\n3.第三段說「有些地方甚至已經看不到臺灣冠八哥的身影了」，表二中哪一項最直接支持這句話？（單選）\n□①近年數量變化：無明顯變化  \n□②2021年看得到的地點數：23個地點\n③2018年花蓮調查結果：0隻  \n□④白尾八哥成長250% \n4.作者呈現表格後，通常會在文字中說明這張表的重要訊息。請回到第三段，判斷哪一句最能統整表二最重要的訊息？（單選）\n□①表二則說明了兩種八哥近年族群數量的變化\n②從表二可知，不論是整體數量、出現的地點，還是在部分地區的觀察結果，外來種白尾八哥都明顯多過原生種臺灣冠八哥\n□③可是，當初白尾八哥被引進臺灣時，牠們的數量很少，臺灣冠八哥才是隨處可見的常客。\n□④那麼，為什麼幾十年過去，原生種臺灣冠八哥逐漸消聲匿跡，白尾八哥卻愈來愈常見，聲勢愈來愈大呢？\n\n步驟❹：整合多種材料——比較、連結各項資訊之間的關係\n1.再回頭看表一，哪幾項差異最可能和第三段的數量變化有關？（複選）\n①較不怕人／較怕人 \n②常利用人造設施築巢／較少利用人造設施築巢\n③適應都市環境較強／較弱  □④嘴喙顏色不同\n2.下面哪一句最能把第三段和表二的意思一起說清楚？（單選）\n□①表二說明兩種八哥近年的數量差不多，而表一只是補充牠們名稱上的不同。\n②表二告訴我們兩種八哥近年的族群差距很大，而表一提供了進一步思考原因的重要線索。\n3.你發現了嗎，讀第三段不能只看表二，還要回頭看表一，是因為：\n①表二讓我們知道哪一種八哥變多、哪一種變少；表一幫助我們思考為什麼會這樣。\n□②表二幫助我們思考為什麼會這樣；表一讓我們知道哪一種八哥變多、哪一種變少。\n\n練習四：第四段 vs 表一、二 \n步驟❶：先讀文字——抓出這段的重點\n  1.這段要你「回到表一」回答什麼問題？（單選）\n  □①八哥的外形與習性\n  ②根據表一試著推論兩種八哥族群變化的原因\n步驟❷：整合多種材料——比較、連結各項資訊之間的關係\n1.請根據表一，並結合第四段提到的都市化背景，試著推論兩種八哥族群變化的原因？\n→白尾八哥  較不怕人  ，又   較會利用人造設施築巢  ，適應都市環境較強，所以在都市化的環境中比較容易生存，族群逐漸增加；\n→臺灣冠八哥  較怕人，又  較少利用人造設施築巢   ，適應都市環境較弱，因此族群逐漸減少。\n\n◎"
