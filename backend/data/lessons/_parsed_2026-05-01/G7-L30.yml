multiple_choice:
- question: 1.根據表一，下列哪一項最能正確分辨白尾八哥和臺灣冠八哥？
  options:
  - 白尾八哥是白色嘴喙、黑色尾羽；臺灣冠八哥是黃色嘴喙、白色尾羽
  - 白尾八哥是黃色嘴喙、白色尾羽；臺灣冠八哥是白色嘴喙、黑色尾羽
  - 白尾八哥是黑色嘴喙、白色尾羽；臺灣冠八哥是黃色嘴喙、黑色尾羽
  - 白尾八哥是黃色嘴喙、黑色尾羽；臺灣冠八哥是白色嘴喙、白色尾羽
  answer: B
- question: ２.從表一、表二和最後一段一起看，下列對臺灣冠八哥成為保育類的原因，哪一項最合理？
  options:
  - 牠冠羽較為明顯、外形也較特殊，所以更需要受到法律保護
  - 牠和白尾八哥同屬八哥屬，因此族群減少時較容易被列入保育
  - 牠冠羽明顯，容易成為獵人或猛禽捕獵的目標
  - 牠怕人又不易適應都市環境，競爭力不如白尾八哥
  answer: D
- question: ３.文章末段沒有直接下結論，而是接連提出問題，作者這樣寫最可能的目的是什麼？
  options:
  - 用連續提問吸引讀者注意，讓文章讀起來更有變化與懸念
  - 引導讀者回看文字及表格，促成讀者整合訊息、解決問題
  - 用設問整理前文重點，強調兩種八哥外形其實非常接近
  - 用提問保留討論空間，表示作者對研究結果仍無法確定
  answer: B
- question: ４.如果地方政府想幫助白嘴八哥恢復族群，下列哪一項措施最可能有效？
  options:
  - 保留較安靜的綠地環境，並增加接近自然的築巢空間
  - 增設更多橋梁與水泥建物，讓牠們改用人工設施繁殖
  - 在人口密集商圈投放食物，吸引牠們習慣接近人群活動
  - 讓兩種八哥共享同類巢位，以提高都市區域利用效率
  answer: A
- question: ５.下列哪一個結論，最需要同時整合前文敘述、表一和表二，才能完整判斷？
  options:
  - 兩種八哥外形十分相似，所以只看整體羽色仍不容易正確分辨
  - 白尾八哥較能適應人類環境，因此近年數量與分布都明顯增加
  - 臺灣冠八哥原本就是臺灣原生種，所以現在在各地仍應較常見到
  - 八哥近年比麻雀更常被看見，主要是因為牠們叫聲特別明顯熱鬧
  answer: B
