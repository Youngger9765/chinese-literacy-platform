- question: 1. 下列選項「」中字，何者字音、字義完全正確？
  options:
  - 「嘗」於市遇一佳硯——ㄔㄤˊ，曾經
  - 既「還」邸，使門人往——ㄏㄞˊ，還是
  - 吾嫌其微「凸」——ㄊㄨ，突出
  - 公大「惋」惜——ㄨㄢˇ，可惜
  answer: A
- question: 2. 根據「陸公買硯」一文，關於陸盧峰這個人的敘述下列何者正確？
  options:
  - 玩物喪志，優柔寡斷
  - 寬厚仁愛，度量很大
  - 管理下屬，恩威並濟
  - 言出必行，做事果斷
  answer: B
- question: 3. 「淳于恭，北海人。人有盜刈1恭禾者，恭見之，念其愧，因伏草中，至去乃起。」根據這則故事，下列敘述何者最恰當？
  options:
  - 當時五穀歉收，盜賊四處搶糧
  - 淳于恭個性溫厚寬容，能體恤他人
  - 北海地區盜賊兇悍，人民不敢與之對抗
  - 淳于恭伏於草中，乃心中有愧，不欲見人
  answer: B
- question: 4. 據「陸公買硯」一文，下列關於故事中人物的敘述，何者最恰當？
  options:
  - 門人買錯硯臺卻不知道
  - 陸公惋惜是因為石工技藝不佳
  - 門人請人磨平硯眼是自作聰明
  - 陸公對門人購硯的價格感到驚訝
  answer: C
- question: 5. 下列何者不可能是「陸公買硯」一文的寓意？
  options:
  - 不聽老人言，吃虧在眼前
  - 即使是好心也可能辦壞事
  - 知人善任才不會反受其害
  - 託人辦事，一定要先清楚溝通
  answer: A
- question: 6. 下列哪一選項的閩南語俗諺可以形容課文中的僕人？
  options:
  - 痟貪軁雞籠
  - 好心予雷唚
  - 目睭花花，匏仔看做菜瓜
  - 生雞卵的無，放雞屎的一大堆
  answer: D
