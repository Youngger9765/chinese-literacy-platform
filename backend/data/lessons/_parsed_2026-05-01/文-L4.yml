- - 第4課 陸公買硯
  - 學習單： 王淑瑱
- - 古文今譯 明朝有位叫陸盧峰的人，在京城等待朝廷的任用。他曾在市集上見到一塊上好的硯臺，可是議價沒有成功。回到官邸之後，他還是派僕人前往，用一兩銀子買硯臺回來。 僕人拿著硯臺回來，陸公驚訝它不像自己想買的那個，僕人卻堅持說它就是。陸公說：「剛才我看的硯臺有個八哥眼，現在為何沒有了？」僕人回答說：「我嫌棄它有點凸，路上正好遇見石工，幸好有剩餘的銀子，就叫他打磨讓微凸的地方平整了。」陸公感到十分可惜。 好的故事都會有它吸引人的「賣點」，如有趣的地方、出人意料之外的轉折、發人深省的啟示等，這篇文章也不例外。 硯臺是古代的讀書人每日用品，這位陸先生在市場上看到一方好硯，非常喜歡，但因價錢談不攏，沒有買成。但他回家後，念念不忘，最後終於叫來僕人，給他錢，叫他去買硯。 故事到這裡，作者告訴你兩件事：1、陸先生有多麼喜歡這方硯臺；2、它的價錢貴到讓陸先生猶豫再三。 再來是故事的轉折。 僕人買硯回來了，陸先生一看就說：「它不像我想買的那個硯啊！我要買那個硯有個漂亮的八哥眼喔！」僕人這時卻答道：「我覺得那個突起不好看，就請石匠把它磨掉了。」陸先生花了一大筆錢買硯，結果不識貨的僕人出自好心，竟把主人最喜愛的部分破壞掉了。
- - 明朝・馮夢龍
  - ''
- - 明.有陸盧峰者，於京城.待用。嘗於市.遇一佳硯，議價.未定。既還󠇡邸，使門人.往，以一󠇢金.易歸。 門人.持硯歸，公.訝其不󠇡類，門人.堅稱其是。公曰：「向觀硯.有鴝鵒眼，今何.無之？」答曰：「吾.嫌其微凸，路值.石工，幸有.餘銀，令.磨而平之。」公.大惋惜。
- - 注釋 1. 鴝鵒眼：一種硯石。這種硯石上有圓點形狀的花紋，就像是鴝鵒鳥的眼睛，所以叫「鴝鵒眼」。
