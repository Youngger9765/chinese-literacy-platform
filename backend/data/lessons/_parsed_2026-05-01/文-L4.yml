spotlight_raw_text: "文言聚光燈：斷句與判讀主語II\n文言文類型\n記敘人物\t\n\n-27940-18224500第4課  陸公買硯  \n學習單：\n王淑瑱\n古文今譯\n明朝有位叫陸盧峰的人，在京城等待朝廷的任用。他曾在市集上見到一塊上好的硯臺，可是議價沒有成功。回到官邸之後，他還是派僕人前往，用一兩銀子買硯臺回來。\n僕人拿著硯臺回來，陸公驚訝它不像自己想買的那個，僕人卻堅持說它就是。陸公說：「剛才我看的硯臺有個八哥眼，現在為何沒有了？」僕人回答說：「我嫌棄它有點凸，路上正好遇見石工，幸好有剩餘的銀子，就叫他打磨讓微凸的地方平整了。」陸公感到十分可惜。\n-2101337118\n故事賞析00\n故事賞析\n-275694410300\n    好的故事都會有它吸引人的「賣點」，如有趣的地方、出人意料之外的轉折、發人深省的啟示等，這篇文章也不例外。\n　　硯臺是古代的讀書人每日用品，這位陸先生在市場上看到一方好硯，非常喜歡，但因價錢談不攏，沒有買成。但他回家後，念念不忘，最後終於叫來僕人，給他錢，叫他去買硯。\n　　故事到這裡，作者告訴你兩件事：1、陸先生有多麼喜歡這方硯臺；2、它的價錢貴到讓陸先生猶豫再三。\n　　再來是故事的轉折。\n　　僕人買硯回來了，陸先生一看就說：「它不像我想買的那個硯啊！我要買那個硯有個漂亮的八哥眼喔！」僕人這時卻答道：「我覺得那個突起不好看，就請石匠把它磨掉了。」陸先生花了一大筆錢買硯，結果不識貨的僕人出自好心，竟把主人最喜愛的部分破壞掉了。\n明朝・馮夢龍\n  \n明.有陸盧峰者，於京城.待用。嘗於市.遇一佳硯，議價.未定。既還\U000E01E1邸，使門人.往，以一\U000E01E2金.易歸。\n門人.持硯歸，公.訝其不\U000E01E1類，門人.堅稱其是。公曰：「向觀硯.有鴝鵒眼，今何.無之？」答曰：「吾.嫌其微凸，路值.石工，幸有.餘銀，令.磨而平之。」公.大惋惜。\n487643185345注釋\n1. 鴝鵒眼：一種硯石。這種硯石上有圓點形狀的花紋，就像是鴝鵒鳥的眼睛，所以叫「鴝鵒眼」。\n\nleft79433\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。00\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。\n\n第1次計時\n第2次計時\n第3次計時\n裁判計時\n秒\n秒\n秒\n秒\n\n裁判簽名:                \n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 文言聚光燈：斷句與判讀主語II
  instruction: 請閱讀「陸公買硯」一文，並回答相關問題，以練習斷句與判讀主語的技巧。
  reasoning: 本練習旨在透過「陸公買硯」一文，引導學生練習文言文的斷句與判讀主語。題目設計涵蓋故事主要情節（主角、問題、解決方式、結果），並加入判讀主語的開放題，以強化學生對文言文語法結構的理解。選項和答案皆根據原文內容判斷。
  steps:
  - prompt: 這篇文章的主角是誰？
    type: select
    options:
    - 陸盧峰
    - 僕人
    - 石工
    - 八哥
    answer: 0
    reasoning: 根據原文「明朝有位叫陸盧峰的人...」以及故事內容，陸盧峰是故事的核心人物。
  - prompt: 陸公最初想買的硯臺，最吸引他的是什麼？
    type: select
    options:
    - 價格便宜
    - 體積小巧
    - 有八哥眼
    - 材質堅硬
    answer: 2
    reasoning: 根據原文「陸公說：『剛才我看的硯臺有個八哥眼，現在為何沒有了？』」可知八哥眼是其特色。
  - prompt: 僕人為何要請石工磨平硯臺上的凸起？
    type: select
    options:
    - 陸公吩咐的
    - 覺得凸起不好看
    - 石工主動提議
    - 為了讓硯臺更光滑
    answer: 1
    reasoning: 根據原文「僕人回答說：『我嫌棄它有點凸...就叫他打磨讓微凸的地方平整了。』」可知是僕人個人判斷。
  - prompt: 故事最後，陸公對於僕人磨平硯臺的行為，感受如何？
    type: select
    options:
    - 非常滿意
    - 感到可惜
    - 覺得無所謂
    - 稱讚僕人
    answer: 1
    reasoning: 根據原文「陸公感到十分可惜。」以及文言文「公.大惋惜。」可知其感受。
  - prompt: 請從原文「公.訝其不󠇡類，門人.堅稱其是。」這句話中，找出兩個句子的主語分別是誰？
    type: free_text
    reasoning: 此題旨在練習判讀文言文句子的主語，符合策略「判讀主語」的要求。第一個句子的主語是「公」（陸公），第二個句子的主語是「門人」（僕人）。
