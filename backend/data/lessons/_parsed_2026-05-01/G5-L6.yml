vocabulary:
- word: 直言
  definition: 直接說出自己的想法或意見。
- word: 激勵
  definition: 激發、鼓勵。
- word: 盛夏
  definition: 一年中最熱的時候。
- word: 鴻溝
  definition: 比喻差距很大。
- word: 寄予厚望
  definition: 對某人有很大的期待，希望他能成功或表現很好。
- word: 力邀
  definition: 大力邀請。
- word: 菜單
  definition: 本文指訓練計畫的內容安排。
- word: 技不如人
  definition: 自己的能力或技術比不上別人。
- word: 引退
  definition: 離開、退休。
- word: 晉升
  definition: 升到更高的職位或等級。
- word: 懈怠
  definition: 不努力、不積極，變得懶散。
- word: 自立自強
  definition: 靠自己努力，不依靠別人。
