multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 雖然無人對他「寄予厚望」，但他靠著努力贏得了教練肯定
  - 他們的實力有「鴻溝」般的差距，比賽誰輸誰贏難以判斷
  - 運動後的「懈怠」很重要，才不會讓肌肉處於太緊繃的狀態
  - 他做事經常「自立自強」，不在乎他人感受，讓人難以認同
  answer: A
- question: |-
    2. 第四段中「在不服輸前要先懂得認輸」最可能要表達的意思是下列何者？ A.只有承認失敗，才能開始真正的努力 B.只要不服輸，就不需要承認失敗 C.認輸等於放棄比賽，不必再努力 D.先承認失敗，才能證明別人比自己差
  options: []
  answer: A
- question: |-
    3. 第五段中，周思齊提到「簡單的事情重複做」，從文中內容看，這種訓練態度的最大優點可能是什麼？ A.能避免嘗試新方法帶來的風險 B.能在長期積累中不斷打磨基本功 C.能減少日常練習的時間與精力 D.能讓練習過程更輕鬆無壓力
  options: []
  answer: B
- question: |-
    4. 這篇文章開頭先描述了周思齊引退賽的現場及他的頭銜，這樣的寫作安排主要想要產生什麼效果？ A.直接揭示文章的結局，避免讀者產生疑問 B.以熱鬧氛圍吸引讀者，讓人感到身歷其境 C.引起讀者興趣，也凸顯文章人物的代表性 D.藉頭銜強調文章人物的成就與引退的可惜
  options: []
  answer: C
- question: |-
    5. 體育記者對李教練的描述是「他是位看重團隊紀律的教練」，請問底下哪一選項「不能支持」這個觀點？ A.他要求球員晨操絶對準時，不能遲到早退 B.出外比賽，嚴格要求每位球員的服裝儀容 C.要求球隊自訂球隊公約，及違規的處罰方式 D.他鼓勵球員大量閱讀，發現自己的潛能
  options: []
  answer: D
