title: 堅持到底的棒球人生──周思齊(前篇)
authors: 課文/學習單：張筱晴
story_text: 球場的燈光打亮場地，看台上坐滿了超過四萬名觀眾。大家穿著亮黃色的球衣，就像一片金黃色的稻田，也像盛夏的陽光。今天是他的引退賽。他曾是世界棒球經典賽中的「亞洲選球王」，也是中華職棒歷史上第9位達成「千安、百轟、百盜」的球員。他拿過三次最佳外野手，還得過一次最佳指定打擊的獎。他是──周思齊。 出生於花蓮縣 光復鄉，身為阿美族人的他從小就喜歡打棒球。六年級時，他加入了少棒隊，和光復國小的隊友們打出好成績，拿下全國第二名。國中畢業時，原本可以靠成績保送花蓮高職，但後來在朋友的邀請下，他決定一起進入有「綠色怪物」之稱的棒球強校──高苑工商。不過，一開始沒有人對他寄予厚望。他之所以能進球隊，是因為兩位朋友受高中教練力邀，而他們說：「如果思齊不能一起去，我們也不去。」所以周思齊一開始只能在最弱的三軍練習。 三軍在球隊裡的地位就是打雜。他們每天都要幫一、二軍整理場地，才能回自己的球場練球。下雨積水了，他們還需要拿著水桶和海綿去把場地一塊一塊吸乾。總算可以開始練球時，教練也只是留下訓練菜單，球員們要自己練習、自立自強。那是周思齊第一次感覺到委屈與不甘心。從11人的小球隊，來到有200多人的大球隊，他第一次感受到「人外有人，天外有天」，發現原來有這麼多人熱愛棒球，原來有這麼多棒球高手。 不過，周思齊被肯定的從來不是他的天賦，而是努力。他在三軍時，曾有教練對他說：「你就不要再打了，回家種田去吧！」更曾經被學長直言：「你不是天才」。看著一軍隊友的表現，周思齊也不得不低頭承認這鴻溝般的實力差距。他說，在不服輸前要先懂得認輸，「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」於是，他開始不搭校車，改用跑步當體能訓練，回到宿舍後也不懈怠，而是繼續練習揮棒。晚上熄燈後，他會和隊友帶著棉被到頂樓繼續練習，累了就直接睡在頂樓。 日復一日，他以身邊的強者激勵自己，堅持「簡單的事情重複做」，就算傳接球到手破皮也纏起來繼續練。到了高二暑假，周思齊終於如願晉升一軍。他說：「在一流的球隊裡，作為一個三流角色的我，得像一個吸水的海綿，在努力吸飽養分的同時，又要有辦法把不好的情緒給擠掉。唯有這樣，我才能獲得成長的力量。」 周思齊將技不如人的失落，轉換成努力向前的動力。儘管一開始比不上別人，他並沒有自暴自棄，而是更加努力的鍛鍊自己。真正厲害的人，並不是從來不輸，而是願意承認自己的不足，然後一步一步追上去──周思齊就是最好的例子。 高中、大學畢業後，周思齊帶著熱愛棒球的心加入了職棒，沒想到卻面臨了前所未有的威脅和考驗，甚至讓他一度想放棄打棒球。到底發生了什麼事？周思齊又如何選擇？我們下篇繼續。
