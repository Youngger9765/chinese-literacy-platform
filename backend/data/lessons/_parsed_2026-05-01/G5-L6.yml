spotlight_raw_text: '閱讀聚光燈

  觀點找支持理由

  　　本課課文透過周思齊求學時的練球歷程，不僅凸顯了周思齊的人格特質，也傳達了作者的觀點。通常作者在文中選用的例子、故事，都能支持文章的觀點，也就是觀點的「支持理由」。而觀點和支持理由的關係，就像插圖中的桌子一樣，桌子要有腳才站得穩，觀點要有支持理由，才有說服力。底下再次複習什麼是觀點和支持理由：

  觀    點：就是對事情的看法、意見。

  支持理由：可以說服別人接受觀點的「證據（事實）」

  例如：觀點──三軍的地位就是打雜。

  支持理由──(1)三軍要負責整理一、二軍的場地

  (2)三軍場地積水時要拿海綿一塊塊吸

  (3)三軍練習時無教練在旁指導

  7556506477000


  當我們提出觀點時，提供合理的證據或理由會讓我們的說法更具說服力！

  ◎'
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈：觀點找支持理由
  instruction: 本練習將帶你認識觀點與支持理由的關係，並學習如何辨識它們。
  reasoning: 此練習旨在幫助學生理解「觀點」與「支持理由」的定義及其重要性。透過選擇題確認學生對基本概念的掌握，並透過開放題鼓勵學生思考兩者之間的關聯與說服力。
  steps:
  - prompt: 根據課文，什麼是「觀點」？
    type: select
    options:
    - 對事情的看法、意見
    - 可以說服別人的證據
    - 作者選用的例子或故事
    - 桌子的腳
    answer: 0
    reasoning: 課文明確指出：「觀點：就是對事情的看法、意見。」
  - prompt: 根據課文，什麼是「支持理由」？
    type: select
    options:
    - 對事情的看法、意見
    - 可以說服別人接受觀點的「證據（事實）」
    - 文章的結論
    - 作者的個人感受
    answer: 1
    reasoning: 課文明確指出：「支持理由：可以說服別人接受觀點的「證據（事實）」」
  - prompt: 課文中提到「三軍的地位就是打雜」，這句話屬於下列哪一種？
    type: select
    options:
    - 觀點
    - 支持理由
    - 事實
    - 結論
    answer: 0
    reasoning: 課文在「例如」的範例中，明確將「三軍的地位就是打雜」標示為「觀點」。
  - prompt: 課文中提到「三軍要負責整理一、二軍的場地」，這句話屬於下列哪一種？
    type: select
    options:
    - 觀點
    - 支持理由
    - 作者的看法
    - 故事背景
    answer: 1
    reasoning: 課文在「例如」的範例中，將「三軍要負責整理一、二軍的場地」列為支持「三軍的地位就是打雜」這個觀點的理由之一。
  - prompt: 為什麼觀點需要支持理由，才能有說服力？請用自己的話說明。
    type: free_text
    reasoning: 此題旨在評估學生對課文核心概念的理解，即「觀點要有支持理由，才有說服力」，並鼓勵學生用自己的語言闡述其重要性。
