discussion_content:
- 一、確認觀點：本篇文章的主要觀點是下列何者？（單選）
- □(1)進入高苑工商是周思齊第一次感覺到委屈與不甘心
- □(2)周思齊曾經不被教練和學長看好，被直言沒有天賦
- (3)真正厲害的人是願意承認自己的不足，然後一步一步追上去
- □(4)周思齊帶著熱愛棒球的心加入了職棒，卻面臨了前所未有的威脅和考驗
- 二、分析觀點：根據上題答案，本文的觀點有兩個重點，為了支持這個觀點，支持理由應該提及哪些事情？（複選）
- □他受到的肯定 □他的天賦 他一步步努力
- □他的委屈和不甘心 他承認自己不足
- □他熱愛棒球的心 □所面臨的威脅考驗
- 三、觀點找支持理由：根據上題分析，下列哪些事件或細節可以支持文章觀點中的兩個重點？（可複選）
- 1.支持觀點重點1：「願意承認自己不足」：
- □(1)周思齊和光復國小的隊友們打出好成績，拿下全國第二名
- □(2)周思齊因好友被教練力邀，而一起加入了棒球強隊
- (3)周思齊說：「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」
- 2.支持觀點重點2：「一步步追上去」：
- (1)為了彌補體能，周思齊開始不搭校車，改用跑步當體能訓練
- (2)為了增進技巧，周思齊回到宿舍後也繼續練習揮棒。
- (3)為了增進技巧，宿舍晚上熄燈後周思齊會繼續到頂樓練習。
- 四、延伸練習：根據下列觀點，找出適當的支持理由。
- 1.觀點：逆境使人成長。
- 支持理由：
- □(1)只有在大風大浪裡，才能看出船長的航行技術。
- □(2)他靠著助聽器，彌補天生的聽覺障礙。
- (3)因為家裡窮，他比同輩更早開始了解理財知識。
- 2.觀點：失去後才懂得珍惜。
- 支持理由：
- □(1)爺爺過世後，小明的家中再也沒有過年圍爐的笑聲。
- □(2)阿芳珍惜畢業前能和同學相處的時光，規劃了許多活動。
- (3)附近的早餐店關門後，大華才發現這間店的口味無可替代。
- （ A ）1. 下列選項「 」中的語詞，何者使用正確？
- A.雖然無人對他「寄予厚望」，但他靠著努力贏得了教練肯定
- B.他們的實力有「鴻溝」般的差距，比賽誰輸誰贏難以判斷
- C.運動後的「懈怠」很重要，才不會讓肌肉處於太緊繃的狀態
- D.他做事經常「自立自強」，不在乎他人感受，讓人難以認同
- （ A ）2. 第四段中「在不服輸前要先懂得認輸」最可能要表達的意思是下列何者？ A.只有承認失敗，才能開始真正的努力 B.只要不服輸，就不需要承認失敗 C.認輸等於放棄比賽，不必再努力 D.先承認失敗，才能證明別人比自己差
- （ B ）3. 第五段中，周思齊提到「簡單的事情重複做」，從文中內容看，這種訓練態度的最大優點可能是什麼？ A.能避免嘗試新方法帶來的風險 B.能在長期積累中不斷打磨基本功 C.能減少日常練習的時間與精力 D.能讓練習過程更輕鬆無壓力
- （ C ）4. 這篇文章開頭先描述了周思齊引退賽的現場及他的頭銜，這樣的寫作安排主要想要產生什麼效果？ A.直接揭示文章的結局，避免讀者產生疑問 B.以熱鬧氛圍吸引讀者，讓人感到身歷其境 C.引起讀者興趣，也凸顯文章人物的代表性 D.藉頭銜強調文章人物的成就與引退的可惜
- （ D ）5. 體育記者對李教練的描述是「他是位看重團隊紀律的教練」，請問底下哪一選項「不能支持」這個觀點？ A.他要求球員晨操絶對準時，不能遲到早退 B.出外比賽，嚴格要求每位球員的服裝儀容 C.要求球隊自訂球隊公約，及違規的處罰方式 D.他鼓勵球員大量閱讀，發現自己的潛能
