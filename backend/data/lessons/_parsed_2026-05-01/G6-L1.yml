multiple_choice:
- question: 1. 請問下列句子內使用的詞語，哪一個使用正確？
  options:
  - 她眉頭緊皺，冷汗直流，看起來似乎非常「放鬆」(痛苦)
  - 他「全神貫注」的聆聽音樂，連門鈴響了也不知道
  - 他品學兼優，表現良好， 令父母親「憂心忡忡」（驕傲）
  - 期中考開始了，監考老師一走進教室，全班同學立刻「哄堂大笑」
  answer: B
- question: 2. 請問文中的「雙喜臨門」代表的是什麼？
  options:
  - 詹老師與皓祥有好事發生 B.抽筋及扭傷
  - 肌肉痠痛及失去電解質 D.籃球比賽獲勝及慶祝
  answer: B
- question: 3. PEACE是基本的運動傷害處置，下面哪一個選項何者正確？
  options:
  - 保護（Protect）：讓血液回流心臟，消腫效果較快(抬高)
  - 壓迫（Compression）：彈性繃帶固定受傷部位和抑制腫脹
  - 避免（Avoid）：受傷後1-3天內限制活動及負重(保護)
  - 抬高（Elevation）：認識恢復的進程、避免過度的壓力(教育)
  answer: B
- question: 4. 文中提到「不管是哪一種運動，做好暖身是最重要的。請問暖身運動的敘述何者為非？
  options:
  - 提升心肺功能，讓身體準備好開始運動
  - 增加關節的靈活度
  - 提升肌體溫，有助於提升身體的柔軟度和反應力
  - 只需短暫的暖身，才能有更多體力投入主要運動
  answer: D
- question: 5. 除了原篇名外，你認為下列哪一個也適合當作本文的篇名？
  options:
  - 暖身活動的重要
  - 如何提高心肺功能
  - 扭傷時的應變
  - 保養肌肉的方法
  answer: C
