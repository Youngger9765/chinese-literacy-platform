discussion_content:
- ３.人際關係延伸題：請勾選出正確答案。（答案不只一個喔！）
- (1)倒反法若使用不當，很容易造成人際衝突。但在文章中，皓祥並沒有不舒服的感覺。從此推論，文中詹老師與皓祥的關係如何？
- 親密 熟悉 □生疏 □敵對
- (2)幽默也要看對象，何種關係才能使用倒反法呢?
- 擁有長時間情誼的朋友。 □第一次見面的陌生人。
- □上司與下屬。 互相信任的工作夥伴。
