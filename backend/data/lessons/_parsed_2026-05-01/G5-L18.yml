spotlight_raw_text: "閱讀聚光燈\n摘要策略—問題.解決結構找重點\n    這篇故事是一篇說明文，講「魚兒迴游時被閘門擋住」的解決過程。故事從第四段開始有明顯的「問題、解決、結果」結構。但閱讀時，如何找到文章中的問題、解決、結果呢？我們可以用一些線索來做判斷喔！\n我們來練習用兩步驟（❶找元素對應的段落 ❷找重點句）找「問題、解決、結果」。\n一、找「問題」\n※祕訣：「問題」描述一個「需要解決的壞事或困難」。\n　　❶找段落：\n「問題」在哪個段落？（請在□打勾，單選）\n【□段1、2、3　　　段4　　　　□段5　　】\n「問題」通常出現文章的前面，但這篇文章花了比較長的篇幅說明right2476500故事的背景。第四段才是描述「問題」，是在描述魚兒遭遇的問題。\n　　❷找重點句：\n本文第四段有三個句子，都在描述「壞事」，請判斷哪一個句子是「重點句」。(請在□打勾，三選一。)\n句1：但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。 \n□句2：當萬頭鑽動的魚兒卡在閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖的時機，導致魚寶寶的數量減少，影響整個魚群的生存。\n□句3：為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。\n\n68072031496000小撇步：\n這段有3個句子，3句都是描述「壞事」，第一句是重點句，直接說明魚兒的困難。第二句是補充說明，第三句解決這個問題的舊方法。所以我留下第一句，並把第一句畫線。\n\n二、找「解決」\n※祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。\n❶找段落：\n「解決」在哪個段落？（請在□打勾，單選）\n【□段4　　段5　　□段6　　】\n❷找重點句：（第5段）\n請你先判斷哪些句子是描述「有人想出辦法或行動的句子」的重點句。（請在□打勾，四選一）\n句1：一位名叫馬克·范赫斯的生態學家為了解決這個問題，便和一群工程師、科學家合作，在荷蘭烏特勒支市的運河設計了「魚門鈴」。\n□句2：他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。\n□句3：這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按鈕。\n□句4：運河管理員收到訊息後，便會開啟閘門，讓魚兒順利通過。\n71183531877000小撇步：\n這段4個句子都是描述為了解決魚兒被閘門擋住的問題，做了什麼事。第一句是重點句，第二～四句是補充說明「魚門鈴」怎麼用。\n三、找「結果」\n祕訣：「結果」通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變。\n❶找段落：\n「結果」在哪個段落？（請在□打勾，單選）\n【□段4　　□段5　　段6　　□段7　　】\n❷找重點句：（第6段）\n請你先判斷哪個句子是描述「行動後帶來的改變」的重點句。（請在□打勾，二選一）\n□句1：「魚門鈴」上線後，效果超乎預期！\n句2：從2019年啟動以來，幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康\n52070032131000小撇步：\n這段2個句子都是描述裝了「魚門鈴」之後，帶來什麼改變。第二句是重點句，因為第二句的概念才完整。成果（改變）包括魚兒順利通過閘門＋運河生態變健康。\n◎"
