multiple_choice:
- question: 1.下列哪一個句子中，語詞的使用錯誤？
  options:
  - 海邊擠滿了遊客，放眼望去真是「萬頭鑽動」，十分熱鬧
  - 這條街道拓寬整修後變得「暢行無阻」，再也不會塞車了
  - 公車每天要「承載」大量乘客，因此需要定期檢查保養
  - 每個人的知識都是「與生俱來」的，必須經由後天的學習獲得
  answer: D
- question: 2.文中提到「代表魚兒塞車了」，「魚兒塞車」是指什麼情況？
  options:
  - 大量魚群擠在閘門前進退兩難
  - 魚群像汽車一樣排成一直線前進
  - 魚群游到閘門前因害怕而停下來
  - 魚群因數量太多，在水中移動緩慢
  answer: A
- question: 3.文章標題和結尾都重複出現「叮咚叮咚」，作者這樣安排有何用意？
  options:
  - 暗示裝置的聲音特別，凸顯魚門鈴設計的新穎創意
  - 用門鈴的功能，提醒讀者開門後總是會有驚喜出現
  - 用門鈴首尾呼應，邀請讀者以有創意的方式參與關心生態保育
  - 透過聲音營造輕快感，讓讀者感覺文章讀起來順暢
  answer: C
- question: 4.本文的主旨是什麼？
  options:
  - 強調興建堤防、水閘對環境的危害，呼籲拆除多餘的水閘設施
  - 介紹荷蘭人如何以創意幫助魚群洄游、並讓人們可以參與保育
  - 說明荷蘭運河的歷史與功能，展現人類水利工程的智慧成果
  - 討論魚類洄游的習性與面臨的挑戰，提醒大眾關注水域生態
  answer: B
- question: 5.下列哪項做法的理念和本文介紹的「魚門鈴」最相近？
  options:
  - 在高速公路架設野生動物天橋，讓動物安全穿越道路
  - 規定每年魚類產卵季節禁止關閉任何水閘，讓河道保持暢通
  - 使用聲波裝置驅趕捕食魚類的鳥類，減少魚群天敵
  - 在河道旁設立告示牌，提醒民眾不要干擾洄游魚群遷徙
  answer: A
