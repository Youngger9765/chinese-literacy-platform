vocabulary:
- word: 洄游
  definition: 多指魚類為了繁殖或生存而逆流或返回原棲地的行為。
- word: 命脈
  definition: 維持生存與發展的最重要元素。在本課指的是對生活極為重要的設施。
- word: 萬頭鑽動
  definition: 形容人群非常擁擠、熱鬧。
- word: 本能
  definition: 不用學就會的反應或行為。
- word: 承載
  definition: 受或運送某種東西，可指實體重量，也可指抽象的情感或責任。
- word: 暢行無阻
  definition: 行進時完全沒有障礙或阻礙。
- word: 與生俱來
  definition: 出生時就已具備的，天生的。
- word: 契機
  definition: 出現正向轉變或發展的關鍵時機。
- word: 棲息地
  definition: 動植物生長、生活的自然環境。
- word: 閘門
  definition: 用來控制水流的水門裝置。
- word: 滯留
  definition: 停留不動，無法離開或無法前進。
