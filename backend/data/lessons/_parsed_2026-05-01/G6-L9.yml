discussion_content:
- (1)課內練習
- 第四段：好好睡一覺，好處多多。每天晚上睡眠時，當你以為大腦在休息的時候，其實它正在默默的工作，它要修補勞累了一天的肌肉，調整身體各部分的運作，清除新陳代謝物。
- 請將關鍵句畫起來，本段的小主題是 充足睡眠的【 好處 】。
- |-
  第五段：雖然睡眠的重要性已廣為人知，但仍有一些似是而非的觀念讓人混淆。有種說法是：「平日熬夜沒關係，可以利用假日補眠。」然而有時早有時晚、有時長有時短的睡眠，會影響我們的生理時鐘。想像身體裡有一個看不見的時鐘，它會提醒身體何時睡眠、醒來、飢餓和分泌賀爾蒙等；如果經常擾亂生理時鐘的規律性，就會影響睡眠的品質。
- 請將關鍵句畫起來，這段的小主題是 大眾對睡眠的【錯誤觀念 】。
- (2)課外延伸
- |-
  人一生當中約三分之一的時間都在睡眠，良好的睡眠不僅可消除疲勞、恢復體力，還能保護我們的大腦，修復全身器官系統功能、增強記憶、減少各種生理和心理的併發症、減少死亡率等，所以睡眠對人體的重要性不言可喻。
- 請將關鍵句畫起來，這段的小主題是【 睡眠的重要性 】。
- |-
  如果你有失眠的困擾，不妨試試看下列的做法：每天適量的運動，幫助新陳代謝；晚餐後到睡前不宜飲用酒、咖啡、茶、可樂等刺激物，睡前可飲用一杯牛奶或小點心有益於安眠；養成規律的睡眠時間的時間，固定的時間上床躺平，讓腦袋放空，遠離3C產品，相信你的睡眠品質一定能大幅提升。
- 請將關鍵句畫起來，這段的小主題是【 改善失眠的方法 】。
