title: 祝你好眠
authors: 課文 ：林玫伶 學習單：張明珠
story_text: 起床的鬧鐘響了，阿勝心不甘情不願的起床，睡眼惺忪，哈欠連連，一整天都覺得沒精神。小琪最近上課頻頻打瞌睡，為了抵抗瞌睡蟲，小琪狂喝含有咖啡因的茶飲，結果晚上睡不著、白天又起不來…… 阿勝和小琪都遇到睡眠不足的問題，你也有類似狀況嗎？回顧過去一週，你自認睡眠充足嗎？ 事實上，睡眠與健康的關係密切，對於成長中的國中生來說更是重要，美國疾病預防與控制中心建議，青少年每天需要睡眠時間為8到10小時，換句話說，如果你預計6點半起床，那麼最遲晚上10點半就該上床睡覺啦！ 好好睡一覺，好處多多。每天晚上睡眠時，當你以為大腦在休息的時候，其實它正在默默的工作，它要修補勞累了一天的肌肉，調整身體各部分的運作，清除新陳代謝物。如果老是睡不夠，等於剝奪了讓身體恢復與修復的時間，長期下來會增加多種疾病發生的風險，包括糖尿病、心血管疾病、癌症、憂鬱、焦慮等。 睡眠還能讓你學得更好。研究顯示，大腦在睡眠過程中會進行記憶的重整，把白天接收的訊息去蕪存菁，保留重要的部分，進一步形成長期記憶。當睡眠不足時，大腦很難吸收新知、回想細節，反應變得遲鈍，出錯率高。從這個角度看，古人「懸樑刺股」，讀書時把頭髮用絲線綁在橫樑上，一打瞌睡，頭皮就會被拉扯，因而痛醒。你覺得這樣會有好的學習效果嗎？ 雖然睡眠的重要性已廣為人知，但仍有一些似是而非的觀念讓人混淆。有種說法是：「平日熬夜沒關係，可以利用假日補眠。」然而，有時早有時晚、有時長有時短的睡眠，會影響我們的生理時鐘。想像身體裡有一個看不見的時鐘，它會提醒身體何時睡眠、醒來、飢餓和分泌賀爾蒙等；如果經常擾亂生理時鐘的規律性，就會影響睡眠的品質。此外，為數不少的人認為：「睡前喝酒能幫助入眠。」不過根據研究，睡覺時血液中若含有酒精，就容易頻繁醒來，整體睡眠品質下降，第二天更加疲倦。因此，酒精不是睡眠的好朋友，如果家裡大人想小酌一番，建議睡前至少3小時避免飲酒。 睡眠不足是現代人常見的問題，原因很多，其中3C產品的普及也加重此一現象。許多人明明沒有外部因素干擾，卻常在沒有必要的情況下延遲就寢時間，在臉書、IG、抖音等社群媒體流連忘返，捨不得睡，這就是所謂的「睡前拖延症」。現代人白日工作壓力大，夜裡上網的確可以接觸到各種有趣的資訊，得到紓解壓力的效果，但若因此破壞了生理時鐘，影響了睡眠，形成惡性循環，反而得不償失。 聰明的你，現在應該知道該怎麼「睡」對自己最有利了。今晚，睡前請放下手中的3C產品，關掉煩擾的思緒，對自己說一聲「晚安」。明天，當鬧鐘再次響起，你將以更加飽滿的精神和活力迎接新的一天。 祝你好眠，每一個夜晚。
