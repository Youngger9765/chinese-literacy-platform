vocabulary:
- word: 去蕪存菁
  definition: 把壞的東西除去，只留下好的。
- word: 流連忘返
  definition: 貪戀某一事物，甚至忘了回去。
- word: 得不償失
  definition: 所得到的好處，不足以彌補所遭受的損失。
- word: 惡性循環
  definition: 指壞事不斷的循環發生，讓結果越來越糟。
- word: 小酌
  definition: 指少量喝酒。
- word: 懸梁刺股
  definition: 比喻人發憤努力學習。
- word: 睡眼惺忪
  definition: 剛睡醒，還很迷糊，神智不清醒的樣子。
- word: 新陳代謝
  definition: 體內除去老舊物質更新的過程，引申為事物除舊更新的過程。
- word: 生理時鐘
  definition: 人體內的週期性節律功能。會讓人到了固定時間點，自動化地產生特定的生理反應。例如，時間到了，就會想睡；時間到了，就會肚子餓。
