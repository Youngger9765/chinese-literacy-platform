multiple_choice:
- question: 1.下列語詞何者使用不正確？
  options:
  - 不肖商人將仿冒品「去蕪存菁」，欺騙不知情的顧客
  - 他貪小便宜，買了有問題的機車，結果出了車禍，真是「得不償失」
  - 她昨天熬夜晚睡，早上起來「睡眼惺忪」，非常疲累
  - 許多人喜歡在夜晚「小酌」一番，釋放工作壓力
  answer: A
- question: 2. 根據課文，有關睡眠的敘述，何者不正確?
  options:
  - 大腦在睡眠時會修復疲勞的肌肉
  - 好的睡眠可降低疾病發生的風險
  - 睡眠時可重組記憶，有助於學習
  - 不論老小，每個人每天都需要睡滿八小時
  answer: D
- question: 3. 根據課文，為什麼睡前喝酒不能幫助入眠？
  options:
  - 酒精會使人睡不安穩
  - 酒精會使人上癮、喝多易作夢
  - 酒精會讓大腦分泌過多賀爾蒙
  - 酒精易讓人產生「睡前拖延症」
  answer: A
- question: 4. 造成現代人有「睡前拖延症」最主要的原因為何？
  options:
  - 失眠導致晚上無法入睡
  - 睡前被3C內容吸引，停不下來
  - 大腦有其他的睡眠障礙
  - 大腦高速運轉不想入睡
  answer: B
- question: 5. 根據本課課文，你覺得「懸樑刺股」的讀書效果好嗎？為什麼？
  options:
  - 效果好！這樣才能隨時警惕自己，才不會偷懶
  - 效果好！這樣才可以增加讀書的時間
  - 效果不好！它剝奪了睡眠，讓人很難吸收新知
  - 效果不好！它違反了基本人權，帶來負向情緒
  answer: C
