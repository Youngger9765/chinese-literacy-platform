multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確？
  options:
  - 打開相簿，一張張舊照片「映入眼簾」，讓我回想起兒時
  - 看完那場恐怖電影，我內心充滿「悸動」，整晚睡不著覺
  - 他面對批評內心忐忑不安，顯得十分「坦然」。
  - 每當朋友來訪，他總是特別「尷尬」，熱情招呼每位客人
  answer: A
- question: 3. 根據第二段至第四段內容，以下何者最能推論出主角內心真正的掙扎？
  options:
  - |-
    害怕拒絕後會破壞彼此的友情與班上的氣氛 B.不確定自己是否也喜歡對方，只是還沒發現 C.曾經在感情上受傷，不確定是否要接受告白 D.擔心拒絕告白會惹怒對方，引起更多的衝突
  answer: A
- question: 4. 根據文中主角的心路歷程，下列哪一項情緒變化順序最符合她的內在轉折？
  options:
  - 驚訝→高興→接受→平靜 B.驚訝→惱怒→掙扎→坦然 C.驚喜→糾結→生氣→無奈 D.驚嚇→無奈→勉強→釋懷
  answer: B
- question: 5. 根據閱讀聚光燈的練習，下列何者對於「拒絕」的想法與表達較為合適？
  options:
  - 阿健：不喜歡的事要當面果斷拒絕，不要為了對方委屈自己
  - 安安：與其直接拒絕，不如保持模糊空間，這樣就不會尷尬
  - 小明：拒絕別人的時候一定要記得道歉，才不會讓對方生氣
  - 大宇：感謝對方勇敢表達心意，也真誠回覆自己的立場看法
  answer: D
