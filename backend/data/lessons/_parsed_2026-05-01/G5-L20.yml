discussion_content:
- |-
  1.「真的謝謝你對我的喜歡，但我現在的心情還沒準備好談感情。」 □2.「這個問題現在說再多也沒什麼幫助，先把作業做完吧。」 □3.「我沒有那麼好啦，我覺得你不要考慮我，希望你不要生氣。」 □4.「你為什麼要跟我說這個？不覺得這樣很尷尬嗎？」 5.「我知道沒辦法回應你會讓你有點難過，如果你想談，我可以聽你說。」 □6.「哈哈哈，你別鬧了啦，趕快去跟別人聊一聊啦！」
