strategy_exercise:
  type: guided_steps
  strategy_name: 文言聚光燈：判斷句
  instruction: 本練習旨在引導學生閱讀並理解文言文《范式張劭》的故事內容，並透過朗讀提升閱讀流暢度。請仔細閱讀原文，並完成後續問題。
  reasoning: 根據提供的原文，此練習旨在引導學生閱讀並理解文言文《范式張劭》的故事內容，並透過朗讀計時來提升閱讀流暢度。雖然策略名稱為「判斷句」，但提供的原文練習內容主要集中在故事理解和朗讀，因此依據「主角是誰」、「問題是什麼」、「如何解決」、「結果」的原則設計了四個步驟，以評估學生對文本的掌握度。
  steps:
  - prompt: 這篇文章主要在講述哪兩位朋友的故事？
    type: select
    options:
    - 范式和張劭
    - 范曄和張劭
    - 范式和他的母親
    - 張劭和他的母親
    answer: 0
    reasoning: 此題旨在確認學生是否能正確辨識文章的主要人物。
  - prompt: 故事中，張劭的母親對范式是否會準時赴約感到懷疑，主要的原因是什麼？
    type: select
    options:
    - 范式從未拜訪過他們家
    - 兩人分別已久，相隔千里，且交通不便
    - 范式過去曾失約
    - 張劭對范式沒有信心
    answer: 1
    reasoning: 此題旨在評估學生對故事中核心衝突或疑慮的理解，即時間與距離造成的懷疑。
  - prompt: 面對母親的疑慮，張劭如何回應，展現他對朋友的信任？
    type: free_text
    reasoning: 此題旨在讓學生理解張劭如何堅定地表達對范式信用的信任，並為朋友的到來做準備，鼓勵學生用自己的話語表達理解。
  - prompt: 故事的結局是什麼？
    type: select
    options:
    - 范式因故未能赴約
    - 范式遲到，但最終還是來了
    - 范式準時赴約，兩人盡歡而別
    - 范式派人送來禮物，但自己未到
    answer: 2
    reasoning: 此題旨在確認學生是否能正確理解故事的最終發展和結局，強調信守承諾的結果。
