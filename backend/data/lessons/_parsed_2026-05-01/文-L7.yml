- question: 2. 張劭對他的媽媽說：「巨卿信士，必不乖違」。依據對話的內容，請問：「信士」是什麼意思？
  options:
  - 誠實守信的人
  - 信任朋友的人
  - 相信報應的人
  - 信仰神靈的人
  answer: A
- question: 3.「相隔千里的約定」一文的主旨與下列何者接近？
  options:
  - 范式與張劭都是刻苦讀書的典範
  - 張劭的母親不輕易相信他人的承諾
  - 范式與張劭信守約定，展現誠信精神
  - 朋友間不要計較利害，應該互相幫助
  answer: C
- question: 4. 下列文句中，哪個選項的「為」字可以用白話文的「是」來解釋？
  options:
  - 「為」了準時到校，他很早就起床了
  - 這件衣服的材質「為」純棉
  - 我們應該「為」自己的行為負責
  - 他的夢想是成「為」一名醫生
  answer: B
- question: 5. 下列句子中的▢▢處都缺少了主語，如果依本文文意要為句子補上主語，請問：哪一選項的主語是指元伯？
  options:
  - ▢▢遊太學，為諸生
  - ▢▢後二年當還󠇡，將過拜尊親
  - ▢▢請設饌以候之
  - 巨卿信士，▢▢必不乖違
  answer: C
