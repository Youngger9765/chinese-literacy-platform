vocabulary:
- word: 絕種
  definition: 指一個物種在地球上完全不存在了。
- word: 棲地
  definition: 動物生活、覓食、繁殖的地方。
- word: 坎坷
  definition: 路不平，不好走；引申為命運不好，處境艱難。
- word: 疾駛
  definition: 疾：快；駛：車子行駛。車子開得很快。
- word: 瀕危
  definition: 瀕：靠近、快要到；危：危險。族群數量很少，可能很快消失的狀態。
- word: 破碎化
  definition: 原本完整的一大片環境被切割成很多小塊，變得零散。
- word: 路殺
  definition: 路：道路；殺：造成死亡。動物在道路上被車輛撞死。
- word: 掠食者
  definition: 掠：奪取、搶走。以捕食其他動物為生的動物（在食物鏈中「吃別人」的那一方）。
- word: 干預
  definition: 以外力介入，改變原本的進行方式或結果。
- word: 緩不濟急
  definition: 方法太慢，來不及解決眼前的急迫問題。
- word: 補償機制
  definition: 因損失而提供補貼或賠償的一套做法。
- word: 植被
  definition: 植：植物；被：覆蓋指。某地表面被植物覆蓋的情況（草、灌木、樹木等）。
