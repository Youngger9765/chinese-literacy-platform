multiple_choice:
- question: 1. 文章列舉的威脅中，下列何者「不是」文中提到石虎常見的生存危險？
  options:
  - 被疾駛的車輛撞擊，發生路殺
  - 大量遊蕩犬追逐攻擊，造成犬殺
  - 大量寵物貓移入，導致獵食困難
  - 誤食被毒死的老鼠，造成間接毒殺
  answer: C
- question: 2. 第五段支持遷移者說：「遷移不是放棄原棲地，而是爭取時間」，這句話最可能想表達的是什麼？
  options:
  - 遷移優先，原棲地修復先暫緩，等族群穩定再做
  - 遷移作短期避險先降風險，同步修復原地並推友善措施
  - 遷移就是打算永久搬離，未來不再考慮回到原棲地
  - 遷移後威脅自然降低，交通、犬隻、雞舍等配套可不做
  answer: B
- question: 3. 對「風險排序」不同的兩派主張，本文作者的態度為何？
  options:
  - 作者說明兩派主張給讀者判斷，並未表明自己的立場
  - 偏向「反對石虎遷移」的主張，因為遷移可能帶來新危機
  - 偏向「贊成石虎遷移」的主張，因為改善原棲地緩不濟急
  - 作者認為折衷的作法最好，兩種主張可以考慮一起進行
  answer: A
- question: 4. 作者在文末寫道「石虎的未來……也是一個社會選擇」，最可能想提醒讀者什麼？
  options:
  - 保育不只靠生物學，還牽涉人類生活方式與公共決策
  - 只要把石虎搬到保護區，社會就能完全避免所有衝突
  - 石虎能否存活主要看天意，人類努力其實影響不大
  - 保育的正確答案只有一個，應由專家直接替大眾決定
  answer: A
- question: 5. 某地石虎棲地被道路切割，且常見遊蕩犬出沒；若想做「最有立即效果」的措施。下列哪一組最符合支持遷移者的思路？
  options:
  - 先設警示牌與夜間限速加強宣導，暫不做犬隻管控與雞舍改善
  - 優先做動物廊道與減速設施，先改善原地，再評估是否遷移
  - 僅做必要監測通報，盡量不介入，讓石虎自行尋找出路與棲地
  - 先移到管制嚴、干擾少的區域降風險，同步改善原棲地環境
  answer: D
