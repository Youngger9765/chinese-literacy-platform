spotlight_raw_text: '閱讀聚光燈你已經學會用「一連串因果」整理事件的脈絡，接著，我們就來整理本課的重點嘍！

  讓你口中的甜蜜，成為遠方農民的希望

  問題1：

  勞動剝削

  1.種植與採收可可豆【過程繁瑣、費工耗時        】，但農民的收入很低，難以養家活口

  2.為節省成本，不少農場雇用【童工     】。

  問題 2：

  利潤分配不均與世代貧窮

  1.全球巧克力產業【利潤分配不均            】，大量利潤被製造商與經銷商取得，底層農民收益不到總額5%。

  2.扭曲的分配制度導致農民無法改善生計，被迫讓子女從事童工，一代代【複製貧窮        】。

  問題3：

  環境惡化

  1.【氣候變遷      】使病蟲害加劇，農民無力改善問題，只好【 砍伐森林    】開墾新地。

  2.砍伐森林又【  破壞生態   】，惡化病蟲害與土壤流失，導致【  可可產量不穩  】。

  解決方案：

  公平交易模式

  1.採【  公平交易   】模式，直接與農民合作社簽約，減少中間商【剝削     】，保證合理的價格，並禁用童工。

  2.「東尼公平巧克力」為典範，無奴工、不規則巧克力造型提醒【分配不公    】、並投資農村建設。

  結語

  提醒讀者選購有【 公平交易/永續認證      】標章的巧克力，以實際支持農民。


