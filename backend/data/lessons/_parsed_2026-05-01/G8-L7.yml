multiple_choice:
- question: 1. 下列哪一選項是本課課文的重點？
  options:
  - 巧克力產業的工序繁瑣，讓可可農民過於費工耗時
  - 可可種植過程大量使用機械，工人需求日益減少
  - 農民被剝削，收入太低，農場雇用未滿15歲的童工
  - 受到氣候變遷衝擊，農民開始使用農藥與肥料
  answer: C
- question: 2. 作者在第二段詳細描述可可果的生長位置和採收方式，這樣安排的用意為何？
  options:
  - 凸顯可可採收繁瑣，讓讀者理解農民辛苦，為後面的問題鋪墊
  - 教導讀者如何親自採收可可果，鼓勵大家實地體驗農耕生活
  - 對比可可與一般水果生長的差異，以說明巧克力特殊風味的來源
  - 描繪可可果貼幹生長的奇觀，增添文章畫面感與趣味性
  answer: A
- question: 3. 作者舉「東尼公平巧克力」的例子，這樣的寫作安排主要有什麼作用？
  options:
  - 替公司打廣告，吸引讀者購買該品牌推出的特殊造型巧克力產品
  - 提供實例說明公平交易的制度，以改善產業鏈不公平的現象
  - 強調荷蘭巧克力在造型設計上創新有趣，建議其他品牌仿效
  - 表明只有大型企業才有能力解決可可產業問題，消費者無力改變現況
  answer: B
- question: 4. 下列何者最符合本文的主旨？
  options:
  - 揭露巧克力產業鏈背後隱藏的不公平，呼籲消費者支持公平交易
  - 詳細介紹巧克力的原料來源、生產過程、商業模式與發展歷史
  - 探討童工造成教育中斷與貧窮的惡性循環，呼籲保障兒童受教權
  - 聚焦在氣候變遷與砍伐森林對產業鏈的威脅，呼籲注重環保問題
  answer: A
- question: 5. 下列哪一種情境最符合文章所提倡的「公平交易」精神？
  options:
  - 一家科技公司將部分營收投入新產品研發，以提升產品性能和國際競爭力
  - 一個服飾品牌為降低成本而削減工人薪資，商品以低價出售，以利消費者
  - 某超市大量進口廉價巧克力，宣稱價格愈低愈能幫助消費者節省開支
  - 一家咖啡公司以高於市場的價格向小農收購咖啡豆，以改善農民生活
  answer: D
