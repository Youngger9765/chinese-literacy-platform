title: 讓你口中的甜蜜成為遠方農民的希望
authors: 課文 ：林玫伶 學習單：陳淑麗
story_text: 你喜歡吃巧克力嗎？這種略帶苦味的甜點，風靡全球已超過一個世紀。全球每年吃掉的巧克力約有700萬公噸，人們享受甜蜜的滋味與濃郁的可可香氣，為生活增添不少小確幸。然而，這份甜蜜的背後，卻隱藏著許多不為人知的辛酸，這些故事的主角，是遠在西非的可可農民。 可可樹分布在赤道附近的熱帶地區，其中西非地區的象牙海岸、迦納、奈及利亞、喀麥隆等國，供應了全球70% 左右的可可豆。可可果不像蘋果、橘子那樣長在細細的枝頭上，它像一顆小型橄欖球，直接生長在樹幹和粗壯的枝條上，採收時，工人必須彎腰或仰頭，用彎刀或長柄刀具砍下來，剖開果殼，取出裡面的可可豆。 種植與採收可可豆過程繁瑣、費工耗時。從整地、栽種、除草、施肥、除蟲，到最後的採收與剖果，及剖果後的發酵、乾燥，每一道工序都必須以人工完成。但可可農民的日薪往往不到2美元（新台幣60元），實在難以養家活口。更糟的是，為節省成本，不少農場甚至有家庭貧困、年齡未滿15歲的童工，這些兒童原本應該在學校讀書，卻背著沉甸甸的可可豆籃，揮動刀具，每天工作十多個小時。 可可豆乾燥後，交由採購商出口。根據非洲進出口銀行的數據估算，全球巧克力產業每年市值約2000億美元，但大部分利潤被歐美的製造商和經銷商掌握；相較之下，處於產業鏈最底端、人數眾多的西非農民，終年勞苦所獲得的收益居然不到總額的5%。在這個扭曲的分配制度下，農民永遠無法改善生計。為了活下去，許多父母不得不把未成年子女送進這個產業鏈當童工。這些孩子因此不可能靠教育翻身，只能一代一代複製貧窮，他們形同巧克力產業的奴工，永遠過著暗無天日的日子。 近年來，氣候變遷引發乾旱與暴雨等極端天氣，使可可樹更容易遭受病蟲害侵襲。農民因收入微薄，無法為耕種多年、地力耗盡的土地購買肥料、殺蟲劑或更新樹苗，只能砍伐原始森林，開墾新地，希望有較好的收成。可是，砍伐森林破壞了生態平衡，少了鳥類或昆蟲等天敵來控制害蟲，新地的病蟲害問題反而更嚴重。此外，失去森林的保護，土壤容易流失，農地更難抵擋極端氣候，導致可可豆產量不穩定，推高了巧克力價格。然而，即使巧克力價格攀升，但因可可豆產量減少，西非農民依舊難以擺脫貧困。 為了改善這些問題，「公平交易」模式逐漸受到重視。這種模式由公平交易組織或企業直接與農民合作社簽約，減少了中間商的剝削󠇡。這種交易模式保證可可豆有合理公平的收購價格，並禁止雇用童工。荷蘭品牌「東尼公平巧克力」便是其中典範，他們標榜「100% 無奴工」，希望改善可可產業使用童工、奴工的現象。他們打破了市售巧克力網格狀的規則造型，推出不規則塊狀組合的巧克力──一片巧克力由三角形、矩形、圓形、長條形的造型組成，刻意讓消費者很難公平的分享巧克力，以提醒消費者關注產業不公的議題；此外，公平巧克力還付出了高於市場價格的收購費用，並投資農村的社區建設，讓農民和兒童能更有尊嚴的生活。 下一次，當你想買巧克力時，請留意包裝上的「公平交易」標章或「永續認證」標誌，支持有良心的品牌，讓你的每一口甜蜜，都能成為遠方農民的希望。
