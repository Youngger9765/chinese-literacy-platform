vocabulary:
- word: 產業鏈
  definition: 從原料到成品，各產業之間互相連結形成的生產體系。
- word: 養家活口
  definition: 工作賺錢來維持一家人的生活。
- word: 繁瑣
  definition: 事情瑣碎又多，讓人覺得麻煩。
- word: 小確幸
  definition: 讓人感到小小幸福的事物。通常形容微小但確實能夠帶來幸福感的事情。
- word: 工序
  definition: 製作產品時按照順序進行的各種步驟。
- word: 沉甸甸
  definition: 形容東西很重，也可形容心情或責任很重。
- word: 風靡全球
  definition: 形容某件事物非常流行，受到全世界歡迎與喜愛。
- word: 暗無天日
  definition: 比喻處境非常艱難，覺得沒有希望。
- word: 剝削
  definition: 壓榨弱勢者，從中得利。如果可可豆運銷過程中，有太多層商人經手，他們會分掉太多利潤，農民就受到了剝削，賺的錢變少了。
- word: 地力耗盡
  definition: 土地長期種植沒有休耕，使土壤失去養分。
- word: 標榜
  definition: 宣傳或讚揚某人或某事。
- word: 終年
  definition: 一整年，常用來形容天氣或某種狀況長期存在。
