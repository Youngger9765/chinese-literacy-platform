multiple_choice:
- question: 1. 以下哪種人最不需要尋找食物？
  options:
  - 罹難者（「罹難」指的是遭遇不幸而喪失生命，與食物尋找無關。）
  - 骨瘦如柴者
  - 生還者
  - 倖存者
  answer: A
- question: 2. 四名孩童在亞馬遜雨林中生還的最主要原因是什麼？
  options:
  - 飛機上的儲備食物充足
  - 軍方的特種部隊快速反應
  - 當地原住民的積極參與
  - 萊絲莉的野外求生技巧
  answer: D
- question: 3. 哥倫比亞軍方在搜救過程中面臨的主要挑戰是什麼？
  options:
  - 沒有足夠的人手和裝備
  - 叢林環境惡劣，能見度低
  - 當地原住民多數不合作
  - 合格搜救犬的數量不足
  answer: B
- question: 4. 為何這場救援行動被稱為「奇蹟行動」？
  options:
  - 因為孩子們在叢林中生還的可能性極低
  - 因為搜救隊在極短時間內找到了孩子們
  - 因為這是哥倫比亞歷史上最大規模的搜救行動
  - 因為搜救隊使用了高科技裝備進行搜救
  answer: A
- question: 5. 本文的主旨是什麼？請選出最適合的選項。
  options:
  - 描述哥倫比亞原住民在雨林中野外求生的專長
  - 討論哥倫比亞政府對空難事件的應急處置
  - 描述四名孩童在雨林中40天如何求生、獲救的經歷
  - 說明亞馬遜雨林惡劣的環境，讓人難以生存
  answer: C
