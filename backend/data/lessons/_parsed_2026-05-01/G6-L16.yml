title: 奇蹟行動
authors: 課文 ：林玫伶 學習單：陳允捷
story_text: |-
  這是個真實的故事。 2023年5月1日，四名孩童跟著母親搭乘一架小飛機，從哥倫比亞南方的一個機場起飛，準備前往位於北方的聖荷西瓜維亞雷，卻不幸在飛越亞馬遜雨林上空時墜機，機上的三位成人，包括機師、孩子們的母親和一名親戚，都在這場空難中不幸罹難󠇡，四名孩童則歷經了長達40天的叢林求生，最後奇蹟般的獲救。 四名孩童是哥倫比亞原住民維托托（Huitoto）族人，他們住在南方的小村莊，那裡沒有公路，出遠門唯一的方法是搭小飛機。孩子們當中，年紀最大的是13歲的姊姊萊絲莉，同行的弟弟妹妹依序只有9歲、4歲，以及不到1歲的小嬰孩。 飛機失事後，哥倫比亞軍方派出上百名特種部隊軍人進入蠻荒叢林，帶著10隻搜救犬展開地毯式搜索，還有超過200名原住民主動加入志工行列。亞馬遜熱帶雨林植被茂密，被喻為地球上的肺，他們搜索的範圍達323平方公里，雨林中的巨樹平均高度為40至50公尺，且密集度難以讓陽光透入，因此搜救行動倍極艱難，搜救團隊花了超過兩週時間才找到飛機殘骸和三位大人的遺體，但沒有發現孩子們的蹤跡。 為了營救四個孩子，數架直升機在雨林上空盤旋，關注雨林裡的動靜。搜救隊曾空投一萬份傳單，並大聲播放孩子們祖母的錄音，希望孩子留在原地，等待救援。搜救隊也把食物箱空投到叢林，有些似乎被孩子們撿到。然而，這片叢林十分廣闊，滿布蚊蚋、毒蜘蛛、血蛭，經常有蟒蛇、美洲豹以及其他野獸出沒，加上雷雨不斷，能見度低，搜救工作十分困難。 隨著時間一天天流逝，大家越來越感到希望渺茫，在這片危機四伏的叢林裡，即使是成人都難以倖存，更何況四個都是孩子，其中一個還在襁褓中。直到搜救隊發現小孩的足印、被啃過的新鮮野果、奶瓶，還找到用樹枝搭建的簡陋遮蔽棚，大家才重新燃起希望，相信孩子們很可能還活著。 6月9日，墜機40天以後，奇蹟發生了！搜救隊在距離失事現場大約五公里的地方，找到這四個孩子。消息一出，舉國歡騰！ 孩子們被發現時，仍然意識清楚，但個個骨瘦如柴、體力虛弱。大家好奇的是，他們如何在險惡的叢林中生存了40天？原來，大姊萊絲莉從小在原住民社區長大，在族人的教導下熟悉野外求生技巧，她會分辨哪些植物可以吃、哪些有毒，當他們吃完從飛機上帶下來的一包木薯粉後，便靠著採集種子、野果和根莖類植物充飢。喝水更是重要，萊絲莉知道不可以直接喝叢林的水，不然可能會把寄生蟲一起喝下肚；要喝只能喝雨水，她先承接雨水，等水沉澱淨化後，再給弟弟妹妹喝。為了避免被地面的野獸、毒蛇攻擊，需要休息時，她便和9歲的索來尼在樹上搭建小屋，保護大家的安全——這個本領是從他們平日遊戲中得來的靈感。不僅如此，她還懂得如何照顧小嬰兒。 這場名為「奇蹟行動」的搜救行動受到國際注目，萊絲莉懂得利用族人教導的方式求生，帶領弟妹度過艱困的40天，成為大家心目中的英雄。
