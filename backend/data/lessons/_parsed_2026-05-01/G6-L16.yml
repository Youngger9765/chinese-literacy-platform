spotlight_raw_text: "閱讀聚光燈\n野外求生技能\n    在野外迷路時，首先要保持冷靜。等待救援的過程中，盡量減少身體能量的消耗。等待救援還有一個非常重要的「333原則」：人可以3週沒有食物，3天沒有水，但失溫3個小時就會致命。因此，在發生迷路、山難的狀況下，最重要的就是要預防失溫，所以登山時切記穿著防風保暖的衣物。\n    了解在野外迷路等待救援的333原則後，基本的求生技巧也是重要的。課文中孩童之所以得以奇蹟生存，主要是因為萊絲莉掌握了保命原則並運用了族人教導的野外求生技巧。\n    在野外的環境求生存，有些原則、技能是必備的。現在就讓我們看看野外求生的注意事項及補充知識，或許將來有機會救你一命呢！\n 1.野外求生必備知識\n\n食物\n水源\n火\n避難所\n求救信號\n功用\n提供能量。\n維持身體機能。\n取暖、煮食、驅蟲、照明。\n預防野獸侵襲、避寒、避雨。\n增加被救援的機會。\n種類\n野果、根莖植物、魚類和小動物。\n雨水、溪流、河流和湖泊。\n無。\n山洞、堅固粗壯的樹上方。\n火、信號彈、反光鏡、石頭鮮豔布條。\n方法\n可設陷阱、捕魚和收集野果。\n先過濾(去除雜質)，後煮沸。\n使用打火機、火柴、放大鏡和摩擦生火法。\n使用樹枝、樹葉和其他天然材料建造。\n燃營火或狼煙、用鏡子發出信號、用石頭排SOS、布條標記位置。\n注意事項\n先學會辨識哪些東西可食用。\n即使水看起來乾淨，也需要進一步處理才能安全飲用。\n保持火源乾燥和準備足夠的燃料是成功生火的關鍵。\n盡量在白天完成搭建，避難所應該避免積水。\n若是四周無人，保留體力，不要大肆呼喊。\n２."
strategy_exercise:
  type: guided_steps
  strategy_name: 資訊整理與應用
  instruction: 請閱讀野外求生技能的說明，並根據內容回答以下問題。
  reasoning: 此練習旨在引導學生從「野外求生技能」的原文中，提取關鍵資訊，特別是「333原則」和表格化的求生知識，並理解其應用。題目設計涵蓋了對原則的理解、對各項求生知識（食物、水源、火、避難所、求救信號）的細節掌握，以及結合課文摘要進行推論的能力。
  steps:
  - prompt: 根據「333原則」，在野外迷路時，哪項情況最可能在最短時間內致命？
    type: select
    options:
    - 3天沒有水
    - 3週沒有食物
    - 3小時失溫
    answer: 2
    reasoning: 原文明確指出：「人可以3週沒有食物，3天沒有水，但失溫3個小時就會致命。」因此，失溫在最短時間內致命。
  - prompt: 根據原文，在野外迷路或山難時，為什麼預防失溫最為重要？
    type: select
    options:
    - 失溫會讓人感到不舒服
    - 失溫可能在短時間內致命
    - 失溫會消耗大量體力
    answer: 1
    reasoning: 原文提到：「失溫3個小時就會致命。因此，在發生迷路、山難的狀況下，最重要的就是要預防失溫」。這直接說明了失溫的致命性是其重要原因。
  - prompt: 關於野外求生中的「食物」，原文特別提醒了什麼注意事項？
    type: select
    options:
    - 必須先煮熟才能食用
    - 即使看起來乾淨也需要處理
    - 先學會辨識哪些東西可食用
    answer: 2
    reasoning: 在「野外求生必備知識」表格中，「食物」的「注意事項」欄位寫著：「先學會辨識哪些東西可食用。」
  - prompt: 關於野外求生中的「水源」，原文建議如何處理才能安全飲用？
    type: select
    options:
    - 直接飲用溪流中的水
    - 先過濾，後煮沸
    - 只收集雨水
    answer: 1
    reasoning: 在「野外求生必備知識」表格中，「水源」的「方法」欄位寫著：「先過濾(去除雜質)，後煮沸。」「注意事項」也強調「即使水看起來乾淨，也需要進一步處理才能安全飲用。」
  - prompt: 根據原文，成功生火的關鍵是什麼？
    type: select
    options:
    - 使用打火機或火柴
    - 保持火源乾燥和準備足夠燃料
    - 只在夜間生火
    answer: 1
    reasoning: 在「野外求生必備知識」表格中，「火」的「注意事項」欄位寫著：「保持火源乾燥和準備足夠的燃料是成功生火的關鍵。」
  - prompt: 關於建造「避難所」，原文建議的注意事項為何？
    type: select
    options:
    - 避難所應避免積水，並盡量在白天完成搭建
    - 避難所必須建在山洞裡
    - 避難所應盡量高，以防野獸侵襲
    answer: 0
    reasoning: 在「野外求生必備知識」表格中，「避難所」的「注意事項」欄位寫著：「盡量在白天完成搭建，避難所應該避免積水。」
  - prompt: 在野外發出「求救信號」時，如果四周無人，原文建議的注意事項是什麼？
    type: select
    options:
    - 大聲呼喊以引起注意
    - 保留體力，不要大肆呼喊
    - 燃燒營火製造狼煙
    answer: 1
    reasoning: 在「野外求生必備知識」表格中，「求救信號」的「注意事項」欄位寫著：「若是四周無人，保留體力，不要大肆呼喊。」
  - prompt: 根據原文和課文摘要，你認為萊絲莉在野外求生中，除了掌握「333原則」外，還可能運用了哪些族人教導的野外求生技巧？請至少列舉兩項。
    type: free_text
    reasoning: 此題旨在引導學生結合課文摘要中「萊絲莉掌握了保命原則並運用了族人教導的野外求生技巧」的線索，從「野外求生必備知識」表格中推斷出萊絲莉可能使用的具體技能，例如辨識可食用的野果、處理水源、生火取暖、搭建簡易避難所、製作求救信號等，以展現其資訊整合與應用能力。
