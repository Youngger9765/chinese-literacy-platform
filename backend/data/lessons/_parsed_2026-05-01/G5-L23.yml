vocabulary:
- word: 按表操課
  definition: 比喻按照計劃或時間表進行工作或活動。。
- word: 融會貫通
  definition: 把各種學問串起來，讓自己更全面的了解事情。
- word: 依樣畫葫蘆
  definition: 形容跟著樣子模仿學習。
- word: 康莊大道
  definition: 平坦暢通的大路。比喻美好的前途。
- word: 節節攀升
  definition: 形容某種數據或成績持續上升，不斷突破新高。
- word: 激情洋溢
  definition: 形容情感非常熱烈、激動，通常指人很投入活動當中。
- word: 允文允武
  definition: 形容一個人文武雙全，既具備學識又擅長武藝。
- word: 座無虛席
  definition: 形容場內座位全部坐滿，一個空位都沒有。
- word: 愧疚
  definition: 因做錯事或未完成應盡責任而感到內疚、不安。
- word: 沸騰
  definition: 液體汽化的現象，從液體變成氣體，例如：水燒開時，水面會劇烈滾動。在此比喻現場氣氛熱烈，帶動觀眾情緒高漲。
- word: 出爐
  definition: 原指從烤爐中取出。例如：剛出爐的麵包。也可比喻新事物的誕生或出現，例如：新出爐的影后，新出爐的課表。
- word: 相輔相成
  definition: 兩者互相輔助配合，以完成某種事物。
