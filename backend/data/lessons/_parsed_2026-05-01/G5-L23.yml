multiple_choice:
- question: 1. 下列語詞，何者使用錯誤？
  options:
  - 小明每天都在家休息，他的收入「節節攀升」
  - 訓練時，教練要求大家要「按表操課」，準時完成每個項目
  - 他的努力和老師的指導「相輔相成」，成績逐漸提升
  - 小華邏輯思考能力很好，能把不同的知識「融會貫通」
  answer: A
- question: 2. 主角成功的提升了自己的成績，關鍵是什麼？
  options:
  - 主角每天熬夜用功讀書，逐漸提高成績
  - 遇到困難時，他選擇放棄電競專注於學業
  - 他運用了時間管理技巧，制定可行的作息表
  - 他不斷參加電競比賽，磨練自己的專業技能
  answer: C
- question: 3. 主角在電競比賽中逆轉局勢的關鍵原因是什麼？
  options:
  - 對手操作連續失誤，使他們得以輕鬆逆轉
  - 主角結合了課堂知識與戰術，掌握對手的心理
  - 他的隊友們發揮卓越的技術，憑靠實力獲勝
  - 隊友們默契十足，一起想到了一個新的戰術
  answer: B
- question: 4. 主角覺得晚上九點半時要關機很痛苦，但他說：「還好這不是我一個人的武林」，請問他最可能的意思是什麼？
  options:
  - 夥伴們也必須關機，主角幸災樂禍
  - 表示一起練武功的人，不會覺得孤單
  - 我們關機了，總還有人在線上繼續努力
  - 如果只有他一個人，想抗拒誘惑就更難了
  answer: D
- question: 5. 從主角的經歷中，我們可以學到什麼樣的生活態度？
  options:
  - 只要有天賦，就能在電競和學業中都取得成就
  - 所有的學習都需要團隊合作，才能成功
  - 努力在夢想與學業間尋找平衡，並且堅持不懈
  - 找到貴人，人生才會有轉機，才會看到方向
  answer: C
