- word: 不可逆
  definition: 一旦發生了，就無法改變或回到原來的樣子。
- word: 視而不見
  definition: 明明知道有事情發生，但卻故意不去注意或不去關心。
- word: 蹂躪
  definition: 比較粗暴地破壞或糟蹋，讓東西變得很糟。
- word: 負成長
  definition: 表示經濟或某個指標的成長率為負數，代表該項目在一段時間內數量減少了。
- word: 每況愈下
  definition: 情況變得越來越糟糕。
