  452628016510000　　你聽過資料視覺化嗎？它是將複雜的資訊以圖表的方式呈現，讓讀者能更容易的理解訊息。本課我們要來學習折線圖，現在就讓我們看看如何將表格的資訊繪製成折線圖：

