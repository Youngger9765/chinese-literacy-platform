strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 折線圖
  instruction: 本課將學習如何繪製與解讀折線圖，並從中理解資料視覺化的重要性。
  reasoning: 此練習旨在引導學生認識折線圖的基本構成要素（標題、橫縱軸）及其繪製步驟，並透過實際數據練習解讀圖表趨勢與特定數值，以提升資料視覺化理解能力。
  steps:
  - prompt: 選出折線圖的標題：(請打勾，單選)
    type: select
    options:
    - 臺北市113年1~7月平均氣溫變化統計表
    - 臺北市113年1~7月平均氣溫變化折線圖
    answer: 1
    reasoning: 根據原文提示，沒有打勾的選項為正確答案。此題旨在確認學生能正確辨識圖表類型與其對應的標題。
  - prompt: 選出橫軸表示的統計項目及單位：
    type: select
    options:
    - 氣溫(℃)
    - 月份(月)
    answer: 1
    reasoning: 根據原文提示，沒有打勾的選項為正確答案。折線圖的橫軸通常表示時間或類別，此處為月份。
  - prompt: 選出縱軸表示的統計項目及單位：
    type: select
    options:
    - 氣溫(℃)
    - 月份(月)
    answer: 0
    reasoning: 根據原文提示，沒有打勾的選項為正確答案。折線圖的縱軸通常表示數值，此處為氣溫。
  - prompt: 從折線圖來看，最高溫會落在幾月？氣溫是幾度？
    type: free_text
    reasoning: 學生需根據提供的表格數據或想像中的折線圖，找出最高氣溫對應的月份和溫度，考驗數據讀取能力。答案應為「7月」和「30度」。
  - prompt: 從折線圖可看出：從1月到７月的氣溫變化是如何？(請打勾，單選)
    type: select
    options:
    - 越來越高
    - 越來越低
    answer: 0
    reasoning: 根據原文提示，沒有打勾的選項為正確答案。從數據16.9到30.0，氣溫呈現上升趨勢。
  - prompt: 承上題，你是怎麼判斷的？因為我看到折線圖的趨勢是：
    type: select
    options:
    - 上升
    - 下降
    answer: 0
    reasoning: 根據原文提示，沒有打勾的選項為正確答案。此題旨在引導學生將氣溫變化與折線圖的視覺趨勢（上升/下降）連結起來。
