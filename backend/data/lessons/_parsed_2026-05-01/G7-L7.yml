multiple_choice:
- question: 1. 依據本文的定義：「灰犀牛指的是正在發生、明明可見的負面事件，但因為沒有急迫性，大家卻視而不見。」請問何者狀況不是灰犀牛？
  options:
  - 少子化 B.高齡化 C.氣候變遷 D.俄烏戰爭
  answer: D
- question: 2. 有關人口負成長的說明，何者正確？
  options:
  - 人口負成長是出生率大於死亡率
  - 人口負成長的因素是人口大量外移
  - 未來臺灣的被扶養人數將會逐步升高
  - 臺灣的生育率逐年升高，全球第一
  answer: C
- question: 3. 臺灣2020年後開始人口負成長，影響了臺灣社會，請問人口負成長所帶來的影響為何？
  options:
  - 未來人力的短缺
  - 青壯年經濟負擔減輕（加重，因為扶養的人變多了)
  - 育齡婦女人數下滑（此為人口負成長的原因)
  - 醫療更趨進步（與人口負成長無關)
  answer: A
- question: 4. 臺灣的少子化已經成為政府的一大危機，有專家學者認為或許可以透過國家邊境開放政策，讓國民人數增加。請問根據上述的內容判斷，下列哪一個對策與專家的意見最相符？（改寫112年社會科會考題？
  options:
  - 提高外籍移工的雇用人數（雇用仍是非本國民，無法增加國民人數)
  - 鼓勵各國人才的移民臺灣（由國家邊境開放政策可知，是讓外來的人口移民臺灣，以增加人口數，故答案為Ｂ)
  - 推動老人長期照顧政策
  - 增加公立幼兒托育中心
  answer: B
