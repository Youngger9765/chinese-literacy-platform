  ❹省略符號：省略不需要用到的刻度。

  ❺用點來表示橫軸和縱軸上的兩組數字，依序用直線把這些點連起來。

  ◎考考你：

  (1)從折線圖來看，最高溫會落在【 7 】月，氣溫是【 30　】度。

