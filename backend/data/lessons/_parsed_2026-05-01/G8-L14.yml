title: 科學辦案：破解蝴蝶蘭的花期密碼
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  臺灣農業技術在世界上首屈一指，那是因為農業界在解決問題時，運用了「問題⭢假設⭢驗證⭢結論⭢應用」的科學步驟；蝴蝶蘭的花期調整，就是一個絕佳的例證。 臺灣消費者喜愛蝴蝶蘭，尤其在農曆新年，家家戶戶都喜歡擺幾盆花團錦簇、奼紫嫣紅的蘭花。但是，蝴蝶蘭盛開的月份是三、四月，花農要怎樣把開花的時機提早到一、二月，好配合農曆年的商機呢？ 要解決這個問題，花農必須先找到幾個可能催促開花的因素，以科學方法確認真正能催花的因素後，再想方設法降低成本，在農園實踐出來。 第一個被想到的因素是肥料。施用磷、鉀比重較高的肥料，是花農催花的常見手段。像校園常見的矮牽牛、日日春、長春花、非洲菫，高磷鉀肥可促進花芽的形成。但，農業專家在實驗後發現，施肥只能讓花朵更大更美，卻無法提早促成蝴蝶蘭開花。 另一個促成開花的可能因素是「白晝的長度」。以火龍果為例，專家發現白晝長度超過12小時40分後，火龍果就會開花。現在你二月去屏東，發現火龍果園夜裡燈火通明，那可不是農民連夜趕工，也不是想讓植物光合作用，而是想在日落後用電燈連照4小時，讓火龍果錯以為「白天變長」了，它們就會努力伸出花芽來。相反地，蝴蝶蘭是白晝變短的時候開花，於是農業專家用黑塑膠網遮光，讓花錯以為「白天變短」了，實驗結果顯示，這招的確能催花，但只能提早5到7天，對農民沒有太大幫助。 因為蝴蝶蘭都是在秋末時開始萌生花芽的，另一個可能的促花因素會不會是「低溫」呢？ 許多在小型花房進行的實驗開始了，這些實驗的作法大致如下：先用無菌試管培育了幾百株完全相同的蘭苗，直到夏天到來，蘭苗長大準備開花時，實驗開始了——蘭花被分成實驗組和對照組，實驗組被移到有冷氣的房間，對照組仍然留在原來的花房。結果，實驗組在冷房過了一個多月，紛紛抽出花梗，準備大放異彩時，對照組還沒有動靜呢。結論是，白天的溫度若能降到26度以下，持續30到40天，就可以成功催花。 新的問題來了，實驗室的密閉花房空間小，開冷氣降溫，冷氣和電費都有政府補助，但花農的花房空間是開放的，即使願意投資把花房密封、裝設冷氣，動輒上萬平方公尺的花房，冷氣、電費的成本，會讓花農入不敷出。 匠心獨具的花農，總是能想出巧妙的因應方法。臺南的一個蘭園，在夏天把平地的蝴蝶蘭送到50分鐘遠、海拔1,100公尺高的另一個蘭園。因為海拔每上升100公尺，氣溫就會降0.6度，平地32度時，這個蘭園只有25度。搬家後一個多月，每株蘭花整整齊齊的冒出花梗，花朵完全盛開時，正好趕上過年的旺季。台糖公司甚至就直接在海拔700公尺埔里設置了蘭園，這樣還省下了上山下山的運輸費用。還有一個別出心裁的嘗試，花蓮有一個蘭園設在太平洋畔，園主抽取只有9～11℃的冰冷深層海水，這個冷源經機器轉化後送出冷風，可在暑氣蒸人的夏天使花房的溫度降了10度。而這麼做比傳統冷氣的催花方式節省了將近70%的電費。 農業專家提出肥料、光照、低溫等不同假設，再以實驗一一驗證，找到催花因素後，再用種種巧思把這個結論在現場實踐，一盆盆準時含苞待放的蝴蝶蘭，臺灣被稱為「蝴蝶蘭王國」，一點也不意外，你看出其中的道理了嗎？
