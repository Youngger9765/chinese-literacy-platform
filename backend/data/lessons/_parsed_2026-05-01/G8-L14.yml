spotlight_raw_text: "閱讀聚光燈\n解決問題—科學探究法\n上一課《構樹》告訴我們：有些說明文像科學偵探故事。作者先提出「問題」，再提出「假設」，接著用證據「驗證假設」，最後下「結論」；閱讀時要看懂「證據是否能支持（或推翻）假設」。\n這課我們要學一樣的策略，用4個步驟把「解決科學問題的過程」整理清楚。你還記得這些步驟的關鍵概念或提示嗎？請連連看。\n\n步驟\n\n關鍵概念或提示\n❶\n找問題\n● 　　　 　　 　\n推測原因可能是…；或暫時性的答案\n可能出現「可能」、「推測」等關鍵詞。\n\n16383018986500●         ●\n\n❷\n找假說\n95972-23311900    　　  　          ●           ●\n　　　　     　\n文章主要想解決（或追問）什麼問題？ \n❸\n找驗證\n         　　●         ●\n　     　　　　\n證據最後支持哪個假說？\n❹\n下結論\n\n●         ●\n用什麼方法、看到什麼結果？結果符不符合推測？\n\n一、找問題→找假說→找驗證→下結論\n表：本課的科學解決四步驟：找問題→找假說→找驗證→下結論\n步驟\n根據課文內容，請勾選或填寫答案（答案合理即可）\n❶\n問題\n1.花期落差\n  蝴蝶蘭盛開在（ 3-4 ）月；市場需求卻在（1-2）月\n2.文章要解決什麼問題？\n   如何讓蝴蝶蘭提早開花，以配合市場需求？                   \n❷\n假說⭣\n❸\n驗證\n\n❷假說\n❸驗證\n\n影響因素可能是\n用什麼方法\n結果/\n是否支持假說？\n\n1.肥料\n1.施肥\n1.花更大更美，但沒提早開花  / □是  否 □部分支持\n\n2白晝長度\n2.用黑塑膠網遮光     \n2.遮光可催花但僅提早5–7天     \n / □是  □否 部分支持\n\n3.低溫    \n3.實驗組放冷氣房、對照組留原來花房\n3.實驗組一個多月後，抽出花梗       ；對照組則無      / 是  □否  □部分支持\n❹\n結論\n低溫，溫度26度以下，持續30-40天，就能成功催花             \n\n二、應用（把結論帶回現場：問題→解決→結果）\n前面我們用科學步驟找出「低溫能催花」。再來是把結論應用到現場。但農民遇到了新的問題，請根據課文寫出他們如何解決問題。\n\
  1.問題：    花房面積大，冷氣電費成本太高        \n2.解決：\n①把平地蘭花送到高海拔蘭園降溫 \n②   在高海拔地方設置蘭園          \n③   用深層海水降溫         \n3.結果：用大自然降溫，降低電費負擔，也能順利催花。     \n◎"
