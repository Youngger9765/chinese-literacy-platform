multiple_choice:
- question: 1. 下列哪一個選項中，語詞使用「錯誤」？
  options:
  - 他剛創業時收入太少，經常「入不敷出」，靠朋友接濟度日
  - 畫展作品風格新穎，構圖尤其「別出心裁」，讓人眼睛一亮
  - 臺北的午後像火爐一樣，走在街上讓人覺得「暑氣蒸人」
  - 小安運動會時跑最後一名，在參賽選手中表現「首屈一指」
  answer: D
- question: ２. 本文第五段指出「遮光能催花，但只能提早5到7天，對農民沒有太大幫助」，下列哪個理由最能說明作者這樣判斷的原因？
  options:
  - 遮光只能小幅提早，仍難把開花時間提前到過年
  - 遮光會減少光照，花朵品質容易明顯變差
  - 遮光需要整片花房覆蓋，材料與人力成本太高
  - 遮光會影響生長節奏，導致花梗抽得不整齊
  answer: A
- question: 3. 根據文中最後幾段，花農把蘭花送上高海拔、或利用海邊冷源降溫。這兩種做法最共同的特色是什麼？
  options:
  - 都是改用自然條件降溫，減少大量開冷氣的成本
  - 都是把蘭花換到不同地點，讓花期自然提前一段時間
  - 都是利用環境刺激讓花梗冒出，縮短開花準備期
  - 都是用新設備提供冷風，讓花房溫度下降更快更穩
  answer: A
- question: 4. 本文主要想說明什麼？
  options:
  - 只要調整白天光照長短，就能讓蝴蝶蘭提早開花
  - 提高磷鉀肥比例，可讓蝴蝶蘭花團錦簇、大放異彩
  - 以花期調整為例，說明如何用科學步驟解決問題
  - 只要政府補助冷氣電費，花農就能輕鬆調整花
  answer: C
- question: 5. 若你要用同樣的「科學辦案四步驟」研究「為什麼某班段考平均下降」，下列哪一組最符合「假說」的寫法？
  options:
  - 據我觀察，因為這次題目很難，所以大家考不好
  - 這班平均下降，是因為天時、地利、人和未到位
  - 平均下降的原因很多，大家都不知道從哪裡開始
  - 平均下降可能和作息、練習量或題型改變有關
  answer: D
