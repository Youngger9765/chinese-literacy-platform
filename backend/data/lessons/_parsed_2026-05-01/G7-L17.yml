strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 解決問題—科學探究法
  instruction: 本練習將引導你運用科學探究法解決問題，跟隨李昌鈺博士的辦案過程，學習發現問題、提出假設、驗證假設並得出解答。
  reasoning: 根據原文「閱讀聚光燈」的「解決問題—科學探究法」部分，將李昌鈺博士的辦案流程（發現問題→提出假設→驗證假設→解答）轉化為一個引導式練習。原文中的「推理示範」被視為一個完整的案例，其「解答」部分被轉換為一個單選題，要求學生根據提供的假設和驗證結果做出判斷。選項和答案的判斷依據是原文中「假設一【 成立 / □不成立】；假設二【 □成立 / 不成立】」的標示。
  steps:
  - prompt: 李昌鈺博士在辦案中，針對「死者被刺18刀，地上卻無血跡」的問題，提出「血跡已經清理過了」與「這裡不是第一現場」兩假設。經化學藥品檢驗，發現現場有滿地血跡反應。根據這些資訊，關於這兩個假設的判斷，何者正確？
    type: select
    options:
    - 假設一（血跡已經清理過了）成立，假設二（這裡不是第一現場）不成立。
    - 假設一（血跡已經清理過了）不成立，假設二（這裡不是第一現場）成立。
    - 假設一和假設二都成立。
    - 假設一和假設二都不成立。
    answer: 0
    reasoning: 原文「假設一【 成立 / □不成立】；假設二【 □成立 / 不成立】。」明確指出假設一成立，假設二不成立。且「用化學藥品看到滿地血跡反應」的檢驗結果，證明現場是案發現場（推翻假設二）且血跡曾被清理（支持假設一）。
