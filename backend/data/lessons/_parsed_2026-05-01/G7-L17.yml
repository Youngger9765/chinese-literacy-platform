multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確?
  options:
  - 聽了老師的說明，他「赫然」發現自己的錯誤，只好連聲說抱歉
  - 他「環顧」手機裡所有關於大谷翔平的資料，覺得非常佩服
  - 坐車時，如果看到老人或孕婦，我都會「移駕」，把座位讓給他們
  - 他們用這麼少的經費，蓋出這麼高品質的房子，真是「令人髮指」
  answer: A
- question: 2. 底下選項中，哪一項最可能是作者的寫作手法與目的?
  options:
  - 用令人髮指的的老太太謀殺案，說明警方伸張正義的決心
  - 用具體的事例，鮮活的對話，說明李昌鈺辦案的科學方法
  - 用李昌鈺和警察同仁的比較對照，凸顯李昌鈺的聰明過人
  - 用年輕白人的真實個案，說明犯罪者如何一步一步走向岐途
  answer: B
- question: 3. 根據本文，下列何者不是李昌鈺運用科學方法辦案的過程？
  options:
  - 推想凶手鞋子在哪裡？去哪裡找鞋子主人的過程
  - 接到電話就儘速在大雪天趕到凶案現場
  - 現場看不到血，推論血跡可能被清理過了，或者這裡不是第一現場
  - 噴灑化學藥品，尋找血跡反應，確認該處是否為案發現場
  answer: B
- question: 4. 第11段李昌鈺說：「鞋子是不是在購物中心旁邊的垃圾箱找到的？」提出這個問題，李昌鈺需要哪一種能力？
  options:
  - 觀察力 B.推論力 C.創造力 D.批判力
  answer: B
- question: 5. 李昌鈺是位厲害的辦案人員，本課最強調他的哪一個特性？
  options:
  - 假作真時真亦假，無為有處有還無
  - 法網恢恢，疏而不失
  - 從蛛絲馬跡推論出合理假設的能力
  - 萬物靜觀皆自得
  answer: C
