story_structure_table:
- - 用科學方法伸張正義的神探
- - 前言
  - 1.科學是一種【 系統性 】解決問題的方法。 2.警察也會依循【 問題 】、【 假設 】、 【 檢驗假設 】、【 解答 】的程序來辦案。
- - 案件背景
  - 1.鄰居孩子發現老太太倒在自家廚房，老太太已死去。 2.當天晚上十二點，李昌鈺博士趕到現場。
- - 案發現場
  - 1.警方已在現場調查【 十 】小時。 2.老太太死因：【 被刺十八刀/失血過多 】。 3.凶器：【 廚房的刀 】。
- - 辦案歷程
  - 問題
