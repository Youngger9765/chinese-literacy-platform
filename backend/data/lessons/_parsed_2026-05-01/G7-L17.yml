spotlight_raw_text: '閱讀聚光燈

  解決問題—科學探究法

  從文章中可以發現李昌鈺博士在辦案的過程中，不斷地運用科學方法思考的歷程：發現問題→提出假設→驗證假設→解答。

  發現問題：從現場觀察到的現象、找到的線索，而產生的疑問。

  提出假設：對問題提出一些可能的答案。

  驗證假設：運用方法、蒐集證據驗證假設的答案是否正確。

  提出解答：根據驗證的結果，回答提出的問題。

  只要能熟練這樣的思考模式，你也能成為名偵探喔！

  讓我們回到課文：李博士在辦案過程中，分別產生了三個問題，並且根據問題提出假設，最後驗證了假設。接下來，請你跟著李昌鈺博士一起辦案吧！

  1.推理示範

  175308145327

  死者被刺18刀，為什麼地上沒有血？

  問題

  血跡已經清理過了。

  這裡不是第一現場。

  假設

  檢驗

  解答

  這裡是案發現場，但血跡已經被清理過了。(單選)

  假設一【 成立 / □不成立】；

  假設二【 □成立 / 不成立】。00

