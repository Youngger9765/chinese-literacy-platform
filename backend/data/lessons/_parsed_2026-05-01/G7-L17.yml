  - 噴【化學藥劑 】驗證，地上是否有血跡反應。
  - 有血跡反應，假設一成立
- - 辦案歷程
  - 鞋子在哪裡？
  - 沾血的鞋，凶手不會再穿，會被丟到垃圾箱嗎？
  - 派200名刑警到附近垃圾箱找鞋子。
  - 找到鞋子，假設成立。
- - 辦案歷程
  - 去哪裡找鞋子的主人？
  - ？
  - 找到前天下午買鞋的人
- - 案件真相
  - 凶手是老太太的【 遠親 】，有【 吸毒 】惡習。感恩節當天想找老太太要錢，老太太不給，情緒失控殺了老太太。
- - 總結
  - 李博士和他的團隊用【 鑑識科學 】，替無聲的死者說話，讓正義得到伸張。
