spotlight_raw_text: '閱讀聚光燈

  　　順敘法是一種最基本、最常用的敘述方式，指的是敘述時順著事情發生的先後順序來呈現。若我們能先找到描述時間的詞，例如：幾年、之前、過後等，將能夠幫助我們理解事件發生的先後順序，以及事件全貌。

  ◎'
strategy_exercise:
  type: guided_steps
  strategy_name: 順敘法
  instruction: 順敘法是依事情發生先後順序敘述。請找出文章中描述時間的詞，以理解事件順序與全貌。
  reasoning: 此練習旨在介紹「順敘法」的定義與判斷方式，並引導學生思考如何在文章中應用此策略，特別是透過辨識時間詞來理解事件發展。由於原文文字僅為策略說明，故設計了兩道題目：一題選擇題檢測對策略定義的理解，一題開放題引導學生將策略應用於課文摘要。
  steps:
  - prompt: 根據「閱讀聚光燈」的說明，「順敘法」最主要的特點是什麼？
    type: select
    options:
    - 敘述時會跳過部分情節，只呈現重點。
    - 敘述時會順著事情發生的先後順序來呈現。
    - 敘述時會穿插不同人物的觀點。
    answer: 1
    reasoning: 此題旨在檢測學生是否理解「順敘法」的定義，答案直接來自原文：「順敘法是一種最基本、最常用的敘述方式，指的是敘述時順著事情發生的先後順序來呈現。」
  - prompt: 請從課文摘要中找出至少三個描述時間的詞語，並說明它們如何幫助你理解事件的先後順序。
    type: free_text
    reasoning: 此題旨在引導學生將「順敘法」的判斷方式（尋找時間詞）應用到實際課文，加深對事件時間軸的理解。預期答案會包含「2017年」、「2018年」、「2019年」、「2021年」、「當時」、「二十五年來」等詞，並解釋這些詞如何標示事件的發展順序。
