multiple_choice:
- question: 1. 下列哪個詞語使用正確？
  options:
  - 快樂的連假時光總是「轉瞬即逝」，令人不捨
  - 體育競賽總是讓人「事與願違」，相當刺激(血脈賁張)
  - 日本的冬季溫度與高雄相比真是「血脈賁張」(天壤之別)
  - 他想出去玩，沒想到「天壤之別」，颱風來襲，只好在家
  answer: A
- question: 2. 楊俊瀚在2018年面對失敗的態度是什麼呢？
  options:
  - 失敗是我天份不足，比不上別人
  - 失敗是對手太強，並不是我太弱
  - 失敗是我不夠努力，我要加強自己(第三段)
  - 失敗是命中注定，要聽從命運安排
  answer: C
- question: 3. 2017-2021年楊俊瀚的體育生涯有什麼轉變？
  options: []
  answer: B
- question: 4. 「十秒間的每個擺手、衝刺，都是經年累月的訓練與堅持。」這句話與下列哪句話相符合？
  options:
  - 一沙一世界，剎那即永恆
  - 莫要人不知，除非己莫為
  - 台上一分鐘，台下十年功
  - 一朝被蛇咬，十年怕草繩
  answer: C
- question: 5. 根據這篇文章，下列敘述何者不正確？
  options:
  - 遇到逆境時，可以進行自我對話找尋答案
  - 短跑運動是多人競賽，可以進行團隊合作
  - 學會擁抱恐懼，了解、堅持到底並戰勝它
  - 現今的挫折都會成為未來人生路上的養分
  answer: B
