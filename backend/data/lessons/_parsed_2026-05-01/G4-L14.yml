multiple_choice:
- question: 1. 下列語詞何者使用不正確？
  options:
  - 一陣「凜冽」的寒風吹來，冷得我不由自主地縮起脖子
  - 他從二樓跳下來，竟然「毫髮無傷」，真讓人驚訝
  - 一想起跟好朋友吵架的事，我就「輾轉難眠」，一直睡不著
  - 跑完一百公尺，我只能「奄奄一息」的喘氣
  answer: D
- question: 2. 獵人在山中無法安心入睡，最可能的原因是什麼？
  options:
  - 他擔心下雪抓不到獵物
  - 他怕黑夜裡遇到狼群攻擊
  - 他擔心家裡的小寶和白牙是否平安
  - 他害怕明天天氣更差，會回不了家
  answer: C
- question: 3. 獵人為什麼會懷疑白牙吃了小寶？
  options:
  - 因為白牙肚子餓了 B.因為朋友曾經警告他
  - 因為白牙很喜歡小寶 D.因為白牙搖著尾巴迎接他
  answer: B
- question: 4. 第十三段提到：「白牙已經奄奄一息，但牠用盡全力，把尾巴搖了幾下。」為什麼白牙快死了，還在搖尾巴？
  options:
  - 因為白牙還是很信任主人
  - 因為每隻狗臨死時都會搖尾巴
  - 因為白牙覺得主人在跟牠玩
  - 因為白牙想要主人給牠東西吃
  answer: A
- question: 5. 讀完本課，請問作者想要傳達什麼道理？
  options:
  - 狗咬人的本性很難改變，要特別小心
  - 衝動的決定可能帶來無法挽回的錯誤
  - 不要單獨留小孩子在家裡，容易有意外發生
  - 防人之心不可無，即使是信任的朋友，也要有所保留
  answer: B
