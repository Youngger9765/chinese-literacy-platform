vocabulary:
- word: 凜冽
  definition: 形容天氣非常寒冷。
- word: 遍體鱗傷
  definition: 全身都是傷。
- word: 蹭
  definition: 用身體輕輕靠著、磨一磨，有時是撒嬌。
- word: 奄奄一息
  definition: 快沒氣了，快不行了，比喻非常虛弱。
- word: 凌亂
  definition: 雜亂沒有秩序。
- word: 忐忑不安
  definition: 心情緊張、焦慮，不知道會發生什麼事。
- word: 輾󠇡轉難眠
  definition: 因為緊張、擔心或想太多事，翻來翻去睡不著。
- word: 毫髮無傷
  definition: 形容在危險或災難中平安無事，連一點傷都沒有。
- word: 淚水奪眶而出
  definition: 眼淚不由自主的流出來。
- word: 忠心耿耿
  definition: 非常忠實，不會背叛或離開。
- word: 威風凜凜
  definition: 看起來很有氣勢，讓人覺得厲害或很強。
- word: 不寒而慄
  definition: 形容在極度恐懼之下，明明不冷，卻在發抖。
