title: 白牙的最後一戰
authors: 課文 ：曾世杰 學習單：巫怡蓉
story_text: 獵人住在森林旁的小木屋裡，他有一條忠心耿耿的大狗，叫做白牙。白牙有一半狼的血統，看起來威風凜凜。只要陌生人靠近，牠就會毛髮倒豎，露出白森森的利齒，喉嚨傳出低沉的怒吼，讓人不寒而慄。鎮上的朋友都怕牠，他們說：「牠骨子裡就是一頭狼，小心一點，不要被牠吃了。」獵人總是笑說：「放心！牠是我最信任的朋友，有牠，連灰熊都不敢靠近呢。」 在蒲公英盛開的那個春天，獵人結婚了。白牙深愛著牠的女主人，還有後來出世的小寶。不幸的是，小寶一歲時，女主人因病去世。那天晚上，獵人對白牙說：「你不能再跟我出獵了，小寶不能一個人在家，只能請你照顧了。」白牙看得出主人的悲傷，牠用頭輕蹭主人，然後跑到小床邊，把頭貼在小寶的腳旁。 秋末，初雪剛停的早晨。獵人看著天邊的烏雲，回頭對白牙說：「我得上山，天氣不好，我會在天黑前回來，你要陪好小寶哦。」這時白牙正舔著小寶的臉，小寶格格大笑，彷彿白牙是他毛絨絨的大玩具。 獵人背起獵槍，走向白茫茫的山林。他巡視了之前設下的陷阱，處理了皮毛和獸肉，沒想到暴風雪來襲，氣溫驟降，寒風像刀子般凜冽。他伸手不見五指，只能找了個樹洞躲了一晚。但他心裡忐忑不安，輾轉難眠，想著的都是：「小寶會不會餓了？白牙會照顧他吧？」 天一亮，風雪稍歇。獵人立刻踩著積雪趕路。他的腳凍得幾乎失去知覺，卻顧不得疲累，只想快點回家。終於，他看見小木屋。門開著。他一推門，愣住了——地上都是凌亂的腳印、翻倒的桌椅，還有暗紅的血跡。搖籃是空的，小寶不見了。獵人站在原地，渾身發抖。 這時，一個黑影從角落跳出來，是白牙！牠帶著笑容，吐著舌頭，尾巴搖得飛快。牠用後腳站立，往獵人身上撲。但獵人卻呆住了——白牙的嘴邊、脖子、前腳，全是血！「牠……是不是餓壞了？把小寶吃了？」獵人的腦中浮現朋友們的警告——「牠是狼，不要被牠吃了。」但獵人搖頭：「不可能，絕對不可能！」可他從地上撿起小寶的被巾和衣服，上頭全沾滿了鮮血。他淚水奪眶而出，懷疑與怨恨終於爆發：「竟然被他們說中了！」 他從牆上拿下小斧頭，藏在背後。「白牙，來。」聽到命令，白牙立刻跑來。「坐下！」白牙坐下，吐著舌頭，搖著尾巴，像是在等主人稱讚。 「你這個畜生！」獵人揚起斧頭，用力向白牙砍去，他邊哭邊罵，連下重手：「才餓了一晚，你就變成狼了？連小主人你也敢吃？你怎麼對得起我？」白牙痛極，哀號的聲音，迴盪在山谷。 這時，床底突然傳來「哇——哇——」的嬰兒哭聲。 獵人的斧子掉在地上，他撲到床邊，看見了縮在床下的小寶，他衣衫破爛，但毫髮無傷。「這怎麼回事？」獵人愣住了。 他起身四處查看，終於在牆角發現一頭死去的大灰狼，喉嚨有致命的咬痕，地上全是打鬥的血痕。獵人明白了。原來，昨晚有狼闖進，白牙奮力與牠搏鬥，遍體鱗傷後終於守住了孩子。 獵人抱著小寶衝到白牙身邊，跪著哭喊：「對不起，對不起，我誤會你了，你不要死，不要死啊！」 白牙已經奄奄一息，但牠用盡全力，把尾巴搖了幾下，然後，永遠閉上了牠的眼睛。
