spotlight_raw_text: "閱讀聚光燈\n表達看法——以科學證據說服人\n    我們在生活中，經常有說服別人的需要，從說服爸媽讓你養小狗，到說服班上同學依照你的想法辦園遊會。這篇文章也是在傳達一個主張，說服讀者要讓孩子多曬太陽，以預防近視。你有看到作者怎樣說服讀者接受他的論點嗎？他的論述步驟下表左欄：\n\n    論述步驟\n課文中的例子\n1.舉出一個讓人驚訝的事實。\n近視的人越來越多。\n2.提出作者對這個事實的論點\n（看法、主張）。\n近視是缺乏陽光所致。\n3.舉客觀證據支持２的論點\n（看法、主張）。\n※「客觀」指的是，不管是誰來看，都可以得同樣結果。例如，磅秤上的體重，誰看都一樣，這就是客觀的訊息。科學研究所蒐集的，都是客觀的資訊。\n1.戶外活動時間與家長近視情況可有效預測學生是否會罹患近視。\n2.澳洲的學童戶外活動多，所以近視情況比新加坡低。\n3.高照明度的雞近視率較低。\n4.下課離開教室學童近視率較低。\n4.下一個結論。\n多點戶外活動，讓眼球多一點陽光的照明，可以預防近視。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈：表達看法——以科學證據說服人
  instruction: 這篇文章傳達了一個主張，說服讀者要讓孩子多曬太陽以預防近視。請辨識作者如何運用科學證據來支持其論點，並完成以下論述步驟。
  reasoning: 根據原文「閱讀聚光燈」的「論述步驟」表格，將每個步驟轉換為一個選擇題。每個題目的prompt為論述步驟，options則包含課文中的正確例子及根據課文摘要編造的錯誤選項，answer指向正確選項的索引。此設計旨在引導學生理解作者如何透過提出事實、論點、客觀證據及結論來進行說服。
  steps:
  - prompt: 作者首先舉出一個讓人驚訝的事實，請問是哪一個？
    type: select
    options:
    - 近視的人越來越多。
    - 許多研究者把近視歸因於遺傳。
    - 受教育年數愈多，近視比例愈高。
    - 美國1970年時，近視率只有25%。
    answer: 0
    reasoning: 根據原文「論述步驟」表格第一點「1.舉出一個讓人驚訝的事實。」，其「課文中的例子」為「近視的人越來越多。」，與選項0相符。其他選項雖為課文內容，但並非作者開頭提出的「驚訝事實」。
  - prompt: 作者針對這個驚訝的事實，提出了什麼論點（看法、主張）？
    type: select
    options:
    - 近視是缺乏陽光所致。
    - 近視是遺傳因素造成的。
    - 近視與近距離工作時間增加有關。
    - 近視是全球性的流行病。
    answer: 0
    reasoning: 根據原文「論述步驟」表格第二點「2.提出作者對這個事實的論點（看法、主張）。」，其「課文中的例子」為「近視是缺乏陽光所致。」，與選項0相符。其他選項是課文提及的其他觀點或事實，但不是作者在此處提出的核心論點。
  - prompt: 作者為了支持其論點，舉出了哪些客觀證據？請選出其中一個。
    type: select
    options:
    - 戶外活動時間與家長近視情況可有效預測學生是否會罹患近視。
    - 上海、新加坡、南韓、日本的學生近視率高達80-90%。
    - 受教育年數愈多，近視比例愈高。
    - 到2050年，全世界超過一半的人口需要戴眼鏡。
    answer: 0
    reasoning: 根據原文「論述步驟」表格第三點「3.舉客觀證據支持２的論點（看法、主張）。」，其「課文中的例子」列舉了四項，其中「1.戶外活動時間與家長近視情況可有效預測學生是否會罹患近視。」與選項0相符，且符合客觀證據的定義。其他選項是課文中的事實或推論，但並非直接用來支持「近視是缺乏陽光所致」的客觀科學證據。
  - prompt: 作者最後根據上述論點和證據，下了一個什麼結論？
    type: select
    options:
    - 多點戶外活動，讓眼球多一點陽光的照明，可以預防近視。
    - 近距離工作是導致近視的主要原因。
    - 遺傳是近視率快速上升的關鍵因素。
    - 各國政府應推廣視力保健操以預防近視。
    answer: 0
    reasoning: 根據原文「論述步驟」表格第四點「4.下一個結論。」，其「課文中的例子」為「多點戶外活動，讓眼球多一點陽光的照明，可以預防近視。」，與選項0相符。這個結論直接呼應了作者「近視是缺乏陽光所致」的論點，並提出解決方案。
