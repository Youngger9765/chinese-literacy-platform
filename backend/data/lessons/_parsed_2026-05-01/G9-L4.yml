multiple_choice:
- question: 1. 下列語詞何者使用正確?
  options:
  - 車子高速行駛，揚起地面上的灰塵，使人「望塵莫及」
  - 他們倆今天結為夫妻，真是「無獨有偶」、天作之合
  - 「刻板印象」指的是面無表情的人給他人的印象
  - 他們日夜苦練，想爭取冠軍的決心早已「不言而喻」
  answer: D
- question: 2. 這篇文章認為造成近視的原因為何？
  options:
  - 遺傳 B.近距離工作 C.受教育的時長 D.眼球缺乏陽光
  answer: D
- question: 3. 根據本文的描述，請問下列有關近視的敘述，何者為非？
  options:
  - 長期在光源不足的環境下看書，可能會造成近視
  - 陽光可以剌激視網膜分泌多巴胺，抑制眼軸伸長
  - 室內開燈照明的效果和戶外活動的光線亮度相同 D.保持良好的視力方法就是多到戶外走動、曬太陽
  answer: C
- question: 4. 請問這篇文章中，作者說服讀者的步驟為何？請排出順序。
  options: []
  answer: B
- question: 5. 在閱讀聚光燈裡提到「說服別人的論述步驟」，說明作者要用「客觀證據」支持自己的「主張」。請問下列何選項的證據，最不能支持說話者的「主張」？
  options:
  - 我主張學生不能參與學校獎懲會議：因為我認為學生年紀小，總是出錯誤的決定
  - 我主張晚上過十點就不能放鞭炮：因為第二天大家都要上班上學，這會讓大家不能好好休息
  - 我主張保護蜜蜂：因為蜜蜂變少，許多植物無法授粉，自然界食物來源就會變少
  - 我主張營養午餐多點蔬菜：因為蔬菜有豐富的纖維素和維生素Ｃ，可以幫助消化和健康
  answer: A
