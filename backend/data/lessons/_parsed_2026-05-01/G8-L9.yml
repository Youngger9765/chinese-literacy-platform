vocabulary:
- word: 震撼彈
  definition: 比喻讓人非常震驚、造成很大影響的消息或事件。
- word: 屏息以待
  definition: 形容大家因為期待或緊張而「安靜的等著結果」，連呼吸都放輕。
- word: 命運共同體
  definition: 彼此緊緊連在一起，一方出事或改變，其他也會受影響。
- word: 鼎力相助
  definition: 很用力、很認真的幫忙。
- word: 改寫
  definition: 把原本的內容、結果或紀錄大幅改變；也可指「刷新紀錄、改變走向」。
- word: 難以為繼
  definition: 很難再繼續撐下去或維持下去。
- word: 緊張
  definition: 資源不夠用或分配壓力變大的狀態。
- word: 大聲疾呼
  definition: 用很強烈、急迫的態度公開呼籲，希望大家重視某件事。
- word: 打量
  definition: 用眼睛上下仔細看對方，帶有評估、判斷的意味。
- word: 嗤之以鼻
  definition: 非常不屑、看不起。
