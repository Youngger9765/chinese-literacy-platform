spotlight_raw_text: "閱讀聚光燈\n推論策略——\n從對比推論作者觀點\n這篇文章透過珍古德的故事，帶你看見作者的想法，但作者並沒有直接寫出主要觀點，而是安排了許多「前後對照」的對比，讓你在閱讀的過程中慢慢發現：\n\
  \    「啊！原來這些對比，都是在把我帶向同一個觀點。」\n    「啊！原來作者想透過這些對比，改變我原本的想法。」\n讀這樣的文章，你要先讀出對比，然後一邊讀一邊問自己兩個問題：\
  \   \n1.這組對比想讓我看見什麼？（重點）\n    2.作者透過這些重點想影響我什麼？（作者意圖）\n一、找對比與歸納重點：\n向度\n對比\n工具\n\
  原來的舊信念 vs 珍古德的新證據\n\n①人類是唯一會製造與使用工具的生物。\n□②人類最擅長使用工具，但動物也會用簡單工具。\n①黑猩猩用草桿釣白蟻。\n\
  □②黑猩猩用樹葉遮雨。\n\n歸納重點：\n①用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。\n□②用黑猩猩的工具行為作例子，證明牠們的智力接近人類。\n\
  評價與\n證明\n對珍古德的質疑 vs 珍古德的行動回應\n\n①沒念大學又年輕，珍古德有什麼能力去森林做研究？\n□②缺少昂貴儀器與團隊，珍古德怎麼可能得到可靠資料？\n\
  □①她改用更先進的儀器，縮短時間完成研究成果。\n②她長期守候記錄，讓黑猩猩習慣她，看見前所未見的細節。\n\n歸納重點：\n□①她用長期投入回應外界質疑，最後因改用先進的儀器而得到肯定。\n\
  ②她對黑猩猩長期觀察，得到不為人知的細節，回應了外界的質疑。\n研究方法\n不帶感情的編號 vs 帶來理解的命名\n\n□①為了方便電腦的處理，應該用編號記錄動物，輸入時較為容易。\n\
  ②為了保持客觀距離，應該用編號記錄動物，避免感情用事。\n①她堅持命名，這樣才能辨識個體，看見互動、情緒與關係。\n□②她堅持命名，才能讓黑猩猩更親近人類，方便接受訓練。\n\
  \n歸納重點：\n①她用命名來辨識與追蹤互動，讓研究看見黑猩猩的情緒與關係。\n□②她用命名來拉近與黑猩猩的距離，使牠們更親近人類以便觀察。\n黑猩猩\n關係\n\
  展現親密關係 vs 爆發戰爭虐殺\n\n□①黑猩猩天性溫馴親人，所以很少發生群體衝突。\n②黑猩猩能建立親密關係，也會照顧年幼同伴。\n□①黑猩猩常因情緒失控隨機攻擊，所以衝突沒有原因。\n\
  ②資源緊張時會激烈競爭，甚至出現集體對抗與戰爭虐殺。\n\n歸納重點：\n□①理解黑猩猩要看見「全貌」：牠們既會合作互助，也可能因情緒失控而暴力。\n②理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。\n\
  角色轉變\n研究者角色 vs 成為倡議者\n\n□①留在森林觀察記錄，把成果寫成報告就足夠。\n②留在森林長期研究，持續觀察黑猩猩的行為。\n①走出森林成立研究院、推動根與芽，號召更多人投入保育。\n\
  □②走出森林出版傳記上節目，讓自己的故事更受關注。\n\n歸納重點：\n①她把研究的看見帶出森林，走向保育倡議，讓理解轉成保育行動。\n□②她把研究帶出森林，走向保育倡議，是為了爭取資源與提高能見度。\n\
  \n二、歸納主要論點/主旨\n對比歸納的重點\n找共同點\n看見了……\n主要論點/主旨/作者意圖\n❶用黑猩猩能使用工具的證據，推翻「只有人類會用工具」的舊信念。\n\
  長期觀察：\n看見證據與細節\n1.本文重點是：\n①珍古德用長期研究的證據，讓黑猩猩的全貌被看見，並把理解推向保育行動。\n□②本文重點是珍古德克服質疑、追求夢想，鼓勵讀者堅持到底就會成功。\n\
  2.作者最可能想改變讀者什麼想法／態度？\n□①讓讀者理解黑猩猩也有衝突與競爭，因此應提高警覺、不要太靠近牠們。\n②讓讀者用證據與全貌取代刻板印象，並從理解走向關心與保育行動。\n\
  ❷她對黑猩猩長期觀察，得到不為人知的細節，回應了外界的質疑。\n\n❸她用命名來辨識個體並追蹤互動，讓研究看見黑猩猩的情緒與關係。\n看見黑猩猩的全貌\n\n\
  ❹理解黑猩猩要看見「全貌」：既有親密照顧，也會在資源壓力下競爭對抗。\n\n❺她把研究帶出森林，走向保育倡議，讓理解轉成保育行動。\n看見行動\n\n◎"
