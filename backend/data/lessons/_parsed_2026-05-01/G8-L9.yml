  strategy_title: 文言文閱讀策略──判斷句
  text: 學習「文言文閱讀策略──判斷句」的閱讀方法。
worksheet_pdf_url: https://storage.googleapis.com/lingoleap-assets/worksheets/G8-L9.pdf
story_structure_table:
- - 讓黑猩猩被看見的人
- - 關鍵發現（段1-3）
  - '1.珍古德觀察到黑猩猩用【 草桿 】釣白蟻。

    2.這件事像「震撼彈」，因為當時學界普遍相信：人類是唯一會【 製造與使用工具 】的生物。'
- - 研究方法（段4-5）
  - '1.她用最原始也最費力的方法：長時間【 守候與觀察 】並持續記錄。

    2.珍古德改寫了科學界【 理解黑猩猩的方式 】。

    3.科學界主張為保持客觀，應用【 編號 】記錄動物；珍古德堅持為牠們【 命名 】。

    4.她認為給黑猩猩名字，才容易追蹤牠們之間的【 互動與關係 】，也更看得見牠們的【 情緒與選擇 】。'
- - 觀察發現(段5-6)
  - '1.看見黑猩猩的情緒和相互陪伴。

    2.珍古德目睹黑猩猩為了【 地盤與資源 】爆發衝突，甚至演變成殘忍的【 戰爭 】。'
- - 走出森林→行動(段7)
  - '1.珍古德看見人類開發影響黑猩猩的【 棲地 】，使保育【 難以為繼 】。

    2.她成立研究院、推動【 根與芽計畫 】，號召年輕人投入保育。'
