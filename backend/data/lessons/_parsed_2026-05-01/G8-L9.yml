  url: ''
- title: '她是珍古德，早餐的咖啡是重複沖泡的咖啡渣、尿液樣本罐拿來裝糖粉，愛地球的想法已深植她心【珍古德: 點燃希望】'
  url: ''
multiple_choice:
- question: 1. 為何「黑猩猩用草桿釣白蟻」在當時被形容為投下「震撼彈」？
  options:
  - 因為它直接挑戰了「只有人類會製造與使用工具」的舊觀念
  - 因為它顯示黑猩猩具備「教學傳承」能力，會把技巧教給同伴
  - 因為它讓研究者發現黑猩猩有高度智慧，可能接近人類的思考
  - 因為它暗示白蟻數量影響族群生存，牽動整個森林的生態平衡
  answer: A
- question: 2. 第四段提到「珍古德把時間交給森林」，最可能想表達什麼？
  options:
  - 她只是靠苦撐待在森林裡久一點，想久了就會有發現
  - 她長時間守候觀察，讓細節慢慢浮現，耐心累積證據成果
  - 指的是她在森林裡工作了許多年，一直到青春不再、變老
  - 指的是她把做觀察研究必備的計時工具遺留在森林裡
  answer: B
- question: 3. 珍古德觀察到黑猩猩哪些現象，最能說明許多行為並非人類的專利？
  options:
  - 採集食物、群體合作、扶弱育幼
  - 命名習性、破壞環境、保持客觀
  - 使用工具、展現親情、戰爭虐殺
  - 保護生態、解決問題、同儕競爭
  answer: C
- question: 4. 作者同時寫「親情與守護」也寫「戰爭與虐殺」，這樣安排最能凸顯什麼？
  options:
  - 指出黑猩猩有時溫和有時殘暴，所以行為常讓人難以捉摸
  - 作者想讓故事更有張力，因此安排對比情節吸引讀者注意
  - 珍古德太投入牠們的生活，因此記錄難免帶入個人主觀立場
  - 黑猩猩社會同時包含親密與衝突的複雜樣貌，不只單一面向
  answer: D
- question: 5. 下列哪一項最能概括本文想傳達的核心？
  options:
  - 岡貝森林的生態資源不足，最後導致黑猩猩戰爭
  - 科學方法太生硬冷漠，只有珍古德願意打破傳統
  - 珍古德以研究改變理解，並把理解推向保育行動
  - 黑猩猩仍有許多神秘的習性需要人類去研究了解
  answer: C
