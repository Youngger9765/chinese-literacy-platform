title: 讓黑猩猩被看見的人
authors: 課文 ：林玫伶 學習單：陳淑麗
story_text: 1960年的某個午後，坦尚尼亞的岡貝森林悶熱異常。26歲的珍古德伏在草叢中，汗如雨下。她屏息以待，目光鎖定在前方的一隻黑猩猩身上——她稱呼牠為「大衛鬍子」。
  大衛鬍子正專注地蹲在蟻塚旁，牠撿起一根細長的草桿，先把多餘的葉片一一剝掉，接著將草桿探入蟻洞，像是在「釣魚」一般。幾秒鐘後，牠輕巧一抽，草桿上爬滿了白蟻。大衛鬍子熟練地一抿，把這頓點心送入口中。
  這個看似自然不過的動作，在當時的科學界卻投下了一顆震撼彈。因為那時學者普遍相信：人類是唯一會製造與使用工具的生物。 踏入叢林的女孩 走進非洲之前，珍古德常被人用懷疑的眼光打量：一個來自英國、沒念過大學的年輕女孩，有什麼能力去森林裡做研究？她從小迷戀動物，卻因家裡無法負擔大學學費，只好先去工作維持生活。她做過祕書，也在餐廳洗過盤子，一點一滴存下旅費。後來，她在人類學家李奇博士的鼎力相助下，帶著望遠鏡和筆記本，走進岡貝的森林，用最原始、也最費力的方法──長時間守候與觀察，一步步走進黑猩猩的世界。當時許多人對她的計畫嗤之以鼻，認為她撐不了多久，更不可能做出像樣的研究；然而，珍古德把時間交給森林。她一天天蹲守、一頁頁記錄，直到黑猩猩習慣她的存在。幾個月、幾年過去，許多黑猩猩不為人知的細節慢慢浮現。她的筆記越寫越厚，也在不知不覺中改寫了科學界理解黑猩猩的方式。
  命名與理解：看見情感與關係 當時科學界主張為了保持客觀，應以「編號」記錄動物，認為替動物取名字太感情用事、不夠科學；然而珍古德仍堅持為牠們命名——有溫和的「大衛鬍子」、優雅的「菲菲」，還有脾氣暴躁的「佛羅多」。她認為，當我們給了黑猩猩名字，才更容易追蹤牠們之間的互動與關係，也更看得見牠們的情緒與選擇：牠們會因失去母親而傷心難過，也會在關鍵時刻守護年幼的同伴。正因如此，她這種在當時引起爭議的做法，反而讓愈來愈多人開始思考：研究若只剩編號與數據，會不會反而看不見行為背後的情感與關係？
  黑猩猩的戰爭課：複雜的真相 然而，真相並不只有美好的一面，珍古德曾目睹黑猩猩群體為了地盤與資源而爆發衝突，甚至演變成殘忍的「戰爭」，殘忍的虐殺敵對陣營的成員，這讓世人對動物為之改觀，因為當時不少人把「戰爭」視為人類獨有的行為。
  這些觀察讓人更完整的看見黑猩猩的社會：牠們會使用工具，也能建立親密關係、照顧同伴；但在資源緊張時，同樣可能走向激烈競爭，甚至出現類似戰爭的集體對抗。於是，「工具」、「親情」與「衝突」不再只能是用來形容人類社會的詞，也能用來理解黑猩猩的群體生活。而這樣的群體生活，必須以森林作為舞台；一旦森林縮小，牠們的活動空間與社會關係也會被迫改變。
  把研究帶出森林 從1960年開始，珍古德大半輩子都待在岡貝森林，讓黑猩猩的世界從「被想像」變成「被看見」，她也越來越清楚：人類的開發會快速改變森林樣貌，進而影響黑猩猩的棲地與群體生活。她親眼看見，當地居民生活貧困，為了生計，必須砍樹、開墾農田，樹一倒，森林縮小，黑猩猩的棲地也跟著變小，再這麼下去，任何保育都難以為繼。她體會到，環境、動物與人類是緊密相連的命運共同體，珍古德決定把腳步從研究現場走向更大的世界，開始為生態保護大聲疾呼——她成立珍古德研究院，並推動「根與芽計畫」，吸引更多年輕人投入環境保育行動。她相信，了解不是終點，而是行動的起點。
  珍古德於2025年以91歲高壽去世，她曾說：「唯有了解，才會關心；唯有關心，才會行動；唯有行動，生命才有希望。」她用了一輩子實踐這句話，為世界帶來了希望。
