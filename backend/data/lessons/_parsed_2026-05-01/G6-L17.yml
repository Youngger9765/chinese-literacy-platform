  answer: A
- question: |-
    3. 第十三段，護理師後來轉述說，她向太太說：「我上有老下有小，是放心不下，但是，也不想回來了。」請問句中的「我」指的是誰？ A.醫生 B.乩童 C.病人 D.病人的哥哥
  options: []
  answer: C
- question: 4. 陳醫師在文章裡寫道：「這完全顛覆了我對乩童的刻板印象！」請問下列哪一個選項顛覆了陳醫師對乩童的刻板印象？
  options:
  - 乩童會在加護病房裡作法
  - 乩童會代替病人擁抱家屬
  - 乩童很辛苦，退駕時滿身大汗
  - 乩童是這個站在床邊的年輕女性
  answer: D
- question: 5. 陳醫師並沒有在文章裡寫出他對乩童有什麼刻板印象，但讀者好像也猜得到。請問陳醫師心中本來認為乩童應該是什麼樣子？
  options:
  - 年紀更小的孩童 B.年紀更小的女人
  - 年紀稍大的男人 D.年輕貌美的女人
  answer: C
- question: 6. 讀完本課，請問作者想要傳達給讀者什麼道理？
  options:
  - 提倡凡事講求科學證據，不要太迷信
  - 若疾病治不好，可以去尋求宗教協助
  - 呼籲乩童未來可以是醫護人員的夥伴
  - 設身處地為人著想，事情就會有轉機
  answer: D
