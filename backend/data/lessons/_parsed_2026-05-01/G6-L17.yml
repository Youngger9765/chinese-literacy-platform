vocabulary:
- word: 稱職
  definition: 把分內的工作做得很好。
- word: 會診
  definition: 邀請其他醫生合力診斷疑難病症。
- word: 納悶
  definition: 心裡有疑問。
- word: 不情之請
  definition: 不合情理的請求。
- word: 退駕
  definition: 神明結束附身。
- word: 觸怒
  definition: 惹人生氣。
- word: 喬裝
  definition: 改變服裝、面貌，以掩飾本來面目。
- word: 不假思索
  definition: 不須思考，直覺反應。
- word: 預後
  definition: 推估病人治療後可能的結果。
- word: 攙扶
  definition: 用手扶著他人。
- word: 刻板印象
  definition: 對人、事、物固定的印象或概念。
- word: 由衷
  definition: 從內心深處。
