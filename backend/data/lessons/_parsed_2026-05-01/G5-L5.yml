discussion_content:
- 一、連連看：請判斷以下的描述，是「觀點」，還是「支持理由」
- 二、判斷觀點和支持理由的關係──請你找出能支持觀點的理由
- 1.基礎題（請打勾，多選）
- (1)小美很細心
- □她喜歡幫助同學，因此大家都很喜歡她
- 她寫作業時，總是仔細檢查，確保沒有錯誤
- □她做事情的時候，總是以很快的速度完成
- □她上課時一邊聽講，一邊畫畫，還能回答老師的問題
- 她摺紙時，會對齊每一條邊，讓作品看起來很整齊
- (2)小名很幽默
- 他總是能用有趣的方式講故事，讓大家笑得合不攏嘴
- □他看到有趣的故事會哈哈大笑
- □他經常在課堂上講話，引起大家的注意
- □他很受歡迎，很多同學都喜歡和他做朋友
- 他常常用機智的回答讓同學們哈哈大笑
- 2.課內練習（請打勾，多選）
- (1)朱蒂是一個勤奮不懈，以努力克服不足的人
- 她發現程度遠遠落後同學，積極訂定學習計畫來提升自己
- □她為一個神祕又重要的人物取了個貼切的綽號──長腿叔叔
- 她努力補強數學及拉丁文成績不及格的弱點
- 她基本常識不足，卻不氣餒，每天晚上在房間苦讀
- □她參加了婦女選舉權的辯論會
- (2)朱蒂的成功不只是靠運氣，還靠著自己的努力創造出來的
- 她會針對自己的困難制定學習計畫，增進自己知識
- 她持續不間斷的閱讀與學習，使她學業突飛猛進
- 她以自己的能力賺進獎學金，甚至希望能自己負擔學費
- □她因長腿叔叔的資助，得到進入大學就讀的機會
- （ C ）1. 請問哪一個句子使用語詞正確？
- A.螞蟻的視角非常「低微」，所以看見的世界與我們大不相同
- B.這棵樹長得很高，已經「脫穎而出」了
- C.他總是把失敗「歸咎」於運氣不好，而不願檢討自己的問題
- D.我仔細「瞥見」了這本書的內容，覺得很有趣
- （ Ｂ ）2. 朱蒂如何彌補自己學識上的不足？
- A.她選擇放棄困難課程，學習容易的科目
- B.積極訂定計畫補足自己缺少的知識
- C.她請長腿叔叔當家教老師輔導功課
- D.她參加學校舉辦的晚間自習活動
- （ C ）3. 請問這篇文章的主旨是什麼？
- A.一個人只要有貴人相助，就能改變人生，獲得成功
- B.這是一部浪漫的愛情故事，描述了朱蒂的感情發展
- C.朱蒂的成功不僅有貴人相助，更關鍵的是她持續不懈的努力
- D.朱蒂的成功來自長腿叔叔的幫助，沒有資助，她就無法成長
- （ A ）4. 朱蒂與長腿叔叔的關係如何從「資助與被資助」轉變為「平等的夥伴關係」？
- A.朱蒂的努力與成長，讓她擁有與長腿叔叔想法交流的能力
- B.因為朱蒂最終發現長腿叔叔的真實身分，兩人成為朋友
- C.長腿叔叔主動決定不再以「資助者」的角色自居
- D.朱蒂長大後，不再接受長腿叔叔的幫助，以合夥人身分幫助更多小孩
- （ B ）5. 根據本文，以下哪位同學的成長過程和朱蒂最相像？
- A.小明因考試不及格，決定換個學校，選擇合適的環境學習
- B.小芳家境貧困，但她積極努力，利用免費資源持續提升自己
- C.小強因為家人支持，從不擔心成績問題，隨遇而安的生活
- D.小玲學習講求效率，專注自己擅長的科目，弱科順其自然
