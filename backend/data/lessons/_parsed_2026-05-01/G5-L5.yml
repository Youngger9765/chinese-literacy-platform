multiple_choice:
- question: 1. 請問哪一個句子使用語詞正確？
  options:
  - 螞蟻的視角非常「低微」，所以看見的世界與我們大不相同
  - 這棵樹長得很高，已經「脫穎而出」了
  - 他總是把失敗「歸咎」於運氣不好，而不願檢討自己的問題
  - 我仔細「瞥見」了這本書的內容，覺得很有趣
  answer: C
- question: 3. 請問這篇文章的主旨是什麼？
  options:
  - 一個人只要有貴人相助，就能改變人生，獲得成功
  - 這是一部浪漫的愛情故事，描述了朱蒂的感情發展
  - 朱蒂的成功不僅有貴人相助，更關鍵的是她持續不懈的努力
  - 朱蒂的成功來自長腿叔叔的幫助，沒有資助，她就無法成長
  answer: C
- question: 4. 朱蒂與長腿叔叔的關係如何從「資助與被資助」轉變為「平等的夥伴關係」？
  options:
  - 朱蒂的努力與成長，讓她擁有與長腿叔叔想法交流的能力
  - 因為朱蒂最終發現長腿叔叔的真實身分，兩人成為朋友
  - 長腿叔叔主動決定不再以「資助者」的角色自居
  - 朱蒂長大後，不再接受長腿叔叔的幫助，以合夥人身分幫助更多小孩
  answer: A
- question: 5. 根據本文，以下哪位同學的成長過程和朱蒂最相像？
  options:
  - 小明因考試不及格，決定換個學校，選擇合適的環境學習
  - 小芳家境貧困，但她積極努力，利用免費資源持續提升自己
  - 小強因為家人支持，從不擔心成績問題，隨遇而安的生活
  - 小玲學習講求效率，專注自己擅長的科目，弱科順其自然
  answer: B
