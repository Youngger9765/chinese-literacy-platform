genre: 說明文
title: 比運氣更重要的事：《長腿叔叔》的啟發
authors: 課文 ：林玫伶 學習單：巫怡蓉
story_text: '《長腿叔叔》是美國作家珍‧韋伯斯特於1912年發表的經典小說，描述18歲的朱蒂在「長腿叔叔」的資助下，得到進入大學就讀的機會，並克服她因貧窮而導致的種種學習困難，最終取得學位，成長為一位獨立的女性。她這般脫胎換骨的經歷，讓我在佩服之餘，也開始思考：讓朱蒂成功的原因，真的只是得到貴人相助的好運嗎？讀完故事，我才知道，除了貴人相助之外，朱蒂勤奮不懈、自立自強的特質，也是帶來蛻變的關鍵。

  故事中，「長腿叔叔」的身分一直保密到最後。朱蒂最初在孤兒院只瞥見這位資助人的背影，知道他是個子很高的長腿男人，因此叫他長腿叔叔，英文是「Daddy-Long-Legs」，這個名稱其實也是一種長腿蜘蛛的俗名，朱蒂為一個神祕又重要的人物取了個貼切的綽號，展現了她幽默詼諧的性格。

  長腿叔叔規定朱蒂上大學後要按時寫信給他，以鍛鍊文筆，但也表明他不會回信。雖然如此，朱蒂依然把她的坦率與真情傾注於一封封的信件中，透過這些書信，讓讀者走進她豐富的內心世界。

  朱蒂在孤兒院時沒能受到完整的教育，上大學後發現自己的知識遠遠落後其他同學，她從未看過「蒙娜麗莎的微笑」畫像，也沒聽說過「福爾摩斯」的名字；大一就面臨數學和拉丁文成績不及格的慘狀。許多人遇到這樣的情況，可能會因自卑而選擇逃避，或是把挫折歸咎於低微的出身；但朱蒂只讓自己失落一下下，很快就發揮她樂觀不怕失敗的個性，拾起戰鬥力。

  為了把18年的空白補回來，朱蒂為自己訂下有條不紊的學習計畫。她在信中提到每天都期待夜晚的到來，她會在門上掛著「忙碌中」的牌子，穿上舒服的浴袍和毛茸茸的拖鞋，泡一杯茶，點亮桌旁的電燈，然後開始閱讀各種書籍，享受其中。就這樣持續的閱讀與學習，讓她的學業在短時間內脫穎而出，蛻變為成績名列前茅的「有料」女孩。

  對於長腿叔叔定期資助學費和生活費，朱蒂更是抱持感恩的心，且生活儉樸，從不濫用，甚至當她以自己的能力賺得稿費、獲得獎學金時，就想先用來償還󠇡資助——雖然長腿叔叔不同意她這麼做。除此之外，朱蒂在信中提到，她參加了一場關於婦女選舉權的辯論會，並極力支持女性擁有投票權，強調這是社會進步的一部分，這在當時的美國可說是比較前衛的思想呢！

  雖然長腿叔叔對來信總是「已讀不回」，但朱蒂的誠懇、樂觀、努力與獨立見解，最終還是感動了他，讓兩人之間從「資助與被資助」的關係，轉變為平等的夥伴關係。

  《長腿叔叔》不僅是一部成長故事，也讓我學到：當我們羨慕朱蒂藉著好運脫胎換骨時，更應該看見愈挫愈勇的她，付出了無數挑燈夜戰的努力，最終才能蛻變為獨立自主的女性！'
