- （ Ｂ ）2. 朱蒂如何彌補自己學識上的不足？
- A.她選擇放棄困難課程，學習容易的科目
- B.積極訂定計畫補足自己缺少的知識
- C.她請長腿叔叔當家教老師輔導功課
- D.她參加學校舉辦的晚間自習活動
- （ C ）3. 請問這篇文章的主旨是什麼？
