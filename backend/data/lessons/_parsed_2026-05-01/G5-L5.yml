spotlight_raw_text: "閱讀聚光燈\n觀點找支持理由\n    本課課文強調一個觀點：「幸運除了靠貴人相助，自己的努力也很重要」。為了讓這個觀點更有說服力，課文舉了好幾個支持這個觀點的支持理由。觀點和支持理由的關係，就像插圖中的桌子一樣，桌子要有腳才站得穩，觀點要有支持理由，才有說服力。\
  \ 底下說明什麼是觀點和支持理由：\n觀    點：就是對事情的看法、意見。\n支持理由：可以說服別人接受觀點的「證據（事實）」\n7556506477000\n\
  \n　　當我們提出觀點時，提供合理的證據或理由會讓我們的說法更具說服力！\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 觀點找支持理由
  instruction: 本策略練習將引導你辨識文章中的核心觀點，並找出支持該觀點的具體理由或證據，以提升閱讀理解與分析能力。
  reasoning: 原文主要在解釋「閱讀聚光燈」策略中的「觀點找支持理由」子策略。我從原文中提取了策略名稱、核心教學目標作為 instruction。由於原文沒有提供具體的練習題目，我根據原文對「觀點」、「支持理由」的定義、課文強調的觀點以及其比喻關係，設計了數個選擇題來測試學生對策略概念的理解，並加入一個開放題來鼓勵學生思考其重要性。
  steps:
  - prompt: 根據原文，本課課文主要強調的觀點是什麼？
    type: select
    options:
    - 幸運主要來自貴人相助。
    - 個人的努力是成功的唯一因素。
    - 幸運除了靠貴人相助，自己的努力也很重要。
    - 貴人相助和努力都不重要。
    answer: 2
    reasoning: 此題旨在測試學生是否能從原文中辨識出課文所強調的核心觀點。答案直接取自原文：「本課課文強調一個觀點：『幸運除了靠貴人相助，自己的努力也很重要』」。
  - prompt: 根據原文的定義，「觀點」指的是什麼？
    type: select
    options:
    - 可以說服別人的證據。
    - 對事情的看法、意見。
    - 課文中的插圖。
    - 貴人相助的例子。
    answer: 1
    reasoning: 此題旨在測試學生對「觀點」定義的理解。答案直接取自原文：「觀點：就是對事情的看法、意見。」
  - prompt: 根據原文的定義，「支持理由」指的是什麼？
    type: select
    options:
    - 對事情的看法、意見。
    - 課文的標題。
    - 可以說服別人接受觀點的證據（事實）。
    - 主角的個人經歷。
    answer: 2
    reasoning: 此題旨在測試學生對「支持理由」定義的理解。答案直接取自原文：「支持理由：可以說服別人接受觀點的『證據（事實）』」。
  - prompt: 原文中，觀點和支持理由的關係被比喻成什麼？
    type: select
    options:
    - 一本書和它的封面。
    - 一棵樹和它的果實。
    - 一張桌子和它的桌腳。
    - 一個故事和它的結局。
    answer: 2
    reasoning: 此題旨在測試學生對原文中比喻關係的理解。答案直接取自原文：「觀點和支持理由的關係，就像插圖中的桌子一樣，桌子要有腳才站得穩，觀點要有支持理由，才有說服力。」
  - prompt: 為什麼在提出觀點時，提供合理的證據或理由會讓說法更具說服力？請說明你的看法。
    type: free_text
    reasoning: 此題為開放題，旨在鼓勵學生思考並闡述提供支持理由的重要性，呼應原文結尾：「當我們提出觀點時，提供合理的證據或理由會讓我們的說法更具說服力！」
