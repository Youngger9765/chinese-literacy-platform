vocabulary:
- word: 開門見山
  definition: 說話或寫文章一開始就直接切入主題。
- word: 投奔
  definition: 投靠別人或某個地方，多指在困境中尋求保護。
- word: 互比苗頭
  definition: 互相較勁誰強誰弱。
- word: 唯妙唯肖
  definition: 形容模仿得非常逼真、傳神。
- word: 讒言
  definition: 挑撥離間󠇡或陷害他人的壞話。
- word: 爭強鬥勝
  definition: 互相比較誰更強、更厲害，不肯示弱。
- word: 匪夷所思
  definition: 形容事情非常奇特、難以想像或理解。
- word: 悶不吭聲
  definition: 心裡有話卻不說出來。
- word: 凶多吉少
  definition: 指情況不樂觀，可能會有不好的結果。
- word: 面面相覷
  definition: 大家彼此看著對方，不知道該怎麼辦；常用於尷尬或錯愕的場面。
- word: 津津樂道
  definition: 形容人對某件事情非常感興趣，並且樂於談論或分享。
- word: 鴉雀無聲
  definition: 連烏鴉麻雀的聲音都沒有，形容非常安靜。
- word: 快馬加鞭
  definition: 騎著快馬還用鞭子催促，形容行動迅速或狀況急迫的狀態。
- word: 軟禁
  definition: 將人限制在住宅裡，從旁監視，讓他不能自由的行動。
