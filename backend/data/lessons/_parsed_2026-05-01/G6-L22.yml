discussion_content:
- 1.讓我們來看課文另一個故事
- 孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。
- 這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很開心，幫孟嘗君在秦王面前說好話。秦王聽信她的話，便放了孟嘗君。
- ❶主角是誰？ □秦昭王 孟嘗君 □幸姬 □狗盜先生
- ❷主角遇到了什麼「問題」？
- □沒錢買白狐裘 幸姬要白狐裘但已送給秦王 □找不到人幫忙
- ❸問題如何「解決」？
- □拜託秦王讓給幸姬 □再去買一件 食客潛入寶庫偷回白狐裘
- ❹最後得到什麼「結果」？
- 幸姬幫忙說話，秦王放了孟嘗君 □幸姬拒絕幫忙，孟嘗君被關
- □秦王說話不算話，不肯放人
- 有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。
- |-
  這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。
- 最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。
- ❶主角是誰？□曹操 曹沖
- ❷主角遇到了什麼「問題」？ 大象太重，沒辦法秤 。
- ❸問題如何「解決」？
- □請工人抬大象放到大磅秤上秤重
- □讓大家猜一個大概的重量
- 用船的下沉水位線比對石頭重量，間接秤量體重
- ❹最後得到什麼「結果」？
- 知道大象的重量 □不知道大象的重量
- （ C ）1. 下列語詞，何者使用正確？
- A.籃球比賽時，兩方人馬「面面相覷」，防守嚴密
- B.書裡生動有趣的插圖，讓小朋友看得「津津樂道」
- C.他對於事情的解釋前後矛盾，讓人感到「匪夷所思」
- D.他的報告內容清楚、條理分明，真是「唯妙唯肖」
- （ Ｄ ）2. 第五段說：「狗盜先生捧了個包袱進來，白狐裘雪亮的光芒帶來了活下去的希望。」這裡的「活下去的希望」最可能代表什麼？
- A.有了白狐裘，孟嘗君可以再次收買更多食客，幫助他逃難
- B.白狐裘象徵孟嘗君的誠意，可能讓秦國君王重新考慮釋放他
- C.白狐裘的光芒喚醒了孟嘗君求生的意志，使他下定決心逃亡
- D.代表孟嘗君終於能滿足幸姬的條件，換取她出面求情的機會
- （ A ）3. 哪一個選項正確描述了孟嘗君從赴秦到成功逃離秦國的順序？
- A.獲邀赴秦→被誣陷軟禁→食客協助脫困→成功逃離秦國
- B.獲邀赴秦→被誣陷軟禁→幸姬主動求情→食客回贈白狐裘
- C.獲邀赴秦→食客盜取白狐裘→秦王震怒→追殺孟嘗君
- D.因白狐裘被奪失信秦王→求助食客→食客讓幸姬求情→逃離秦國
- （ Ｂ ）4. 文中說：「他必須趁著秦昭王還在美人窩裡昏睡時，儘快離開險地，以免秦昭王清醒後突然又開始『想念』孟嘗君。」這裡的「想念」最可能代表什麼意思？
- A.秦昭王想再見孟嘗君一面，當面解釋誤會
- B.秦昭王後悔放走孟嘗君，重新生出殺意
- C.秦昭王覺得孟嘗君的才能可貴，想重新任用孟嘗君
- D.秦昭王回憶兩人曾經的交情，希望孟嘗君能常伴左右
- （ C ）5. 孟嘗君最後能夠逃出秦國的關鍵因素是什麼？
- A.他自己機智過人，靠自己想出所有辦法逃脫
- B.秦昭王心軟，主動赦免孟嘗君讓他自由離開
- C.食客們發揮各自的專長，幫助孟嘗君化解危機
- D.齊國軍隊立刻出兵支援，幫助孟嘗君逃出秦國
