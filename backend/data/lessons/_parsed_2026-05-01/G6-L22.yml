story_structure_table:
- - |-
    好故事，大家都愛看。為什麼？因為主角不是一帆風順，而是會遇到困難，然後想辦法解決，最後扭轉局面，迎向結局。這樣的故事最精彩、最吸引人！ 所以，一個經典又精彩的故事，常常有四個重點： ❶主角是誰？ ❷主角遇到了什麼「問題」？ ❸問題如何「解決」？ ❹最後得到什麼「結果」？ 今天，我們就來學一個超實用的閱讀方法，用「問題、解決、結果」的方式來整理故事內容，幫助你輕鬆抓到重點。舉例來說： 例一：烏鴉喝水 天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。 ❶主角是誰？ 烏鴉 ❷主角遇到了什麼「問題」？ 喝不到水 □天氣炎熱 ❸問題如何「解決」？ 丟小石頭進瓶子裡，讓水面升高 。 ❹最後得到什麼「結果」？主角順利喝到水 □主角沒有喝到水 接下來，我們來看課文的故事 孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。 這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。 孟嘗君一行人順利出關，逃出秦國。 ❶主角是誰？ 孟嘗君 □秦昭王 □雞鳴先生 ❷主角遇到了什麼「問題」？□被追兵追到 天沒亮，城門不能開 ❸問題如何「解決」？孟嘗君的食客【 模仿雞叫 】，引來附近公雞也一起叫。 ❹最後得到什麼「結果」？主角 成功出關 □沒有出關。
