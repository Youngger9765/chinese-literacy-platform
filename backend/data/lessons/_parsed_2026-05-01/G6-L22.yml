  - prompt: '例一：烏鴉喝水

      ❸問題如何「解決」？'
    type: free_text
    reasoning: 原文為直接提供答案，此處設定為開放題，讓學生填寫解決方法。答案應為「叼來小石頭丟進瓶子，讓水面升高」。
  - prompt: '例一：烏鴉喝水

