multiple_choice:
- question: 1. 下列語詞，何者使用正確？
  options:
  - 籃球比賽時，兩方人馬「面面相覷」，防守嚴密
  - 書裡生動有趣的插圖，讓小朋友看得「津津樂道」
  - 他對於事情的解釋前後矛盾，讓人感到「匪夷所思」
  - 他的報告內容清楚、條理分明，真是「唯妙唯肖」
  answer: C
- question: 2. 第五段說：「狗盜先生捧了個包袱進來，白狐裘雪亮的光芒帶來了活下去的希望。」這裡的「活下去的希望」最可能代表什麼？
  options:
  - 有了白狐裘，孟嘗君可以再次收買更多食客，幫助他逃難
  - 白狐裘象徵孟嘗君的誠意，可能讓秦國君王重新考慮釋放他
  - 白狐裘的光芒喚醒了孟嘗君求生的意志，使他下定決心逃亡
  - 代表孟嘗君終於能滿足幸姬的條件，換取她出面求情的機會
  answer: D
- question: 3. 哪一個選項正確描述了孟嘗君從赴秦到成功逃離秦國的順序？
  options:
  - 獲邀赴秦→被誣陷軟禁→食客協助脫困→成功逃離秦國
  - 獲邀赴秦→被誣陷軟禁→幸姬主動求情→食客回贈白狐裘
  - 獲邀赴秦→食客盜取白狐裘→秦王震怒→追殺孟嘗君
  - 因白狐裘被奪失信秦王→求助食客→食客讓幸姬求情→逃離秦國
  answer: A
- question: 4. 文中說：「他必須趁著秦昭王還在美人窩裡昏睡時，儘快離開險地，以免秦昭王清醒後突然又開始『想念』孟嘗君。」這裡的「想念」最可能代表什麼意思？
  options:
  - 秦昭王想再見孟嘗君一面，當面解釋誤會
  - 秦昭王後悔放走孟嘗君，重新生出殺意
  - 秦昭王覺得孟嘗君的才能可貴，想重新任用孟嘗君
  - 秦昭王回憶兩人曾經的交情，希望孟嘗君能常伴左右
  answer: B
- question: 5. 孟嘗君最後能夠逃出秦國的關鍵因素是什麼？
  options:
  - 他自己機智過人，靠自己想出所有辦法逃脫
  - 秦昭王心軟，主動赦免孟嘗君讓他自由離開
  - 食客們發揮各自的專長，幫助孟嘗君化解危機
  - 齊國軍隊立刻出兵支援，幫助孟嘗君逃出秦國
  answer: C
