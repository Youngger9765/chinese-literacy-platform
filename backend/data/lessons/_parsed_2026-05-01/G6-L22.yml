title: 小兵立大功：雞鳴狗盜的故事
authors: 課文 ：曾世杰 學習單：張明珠
story_text: |-
  中國的戰國時期，有七個國家總是爭強鬥勝、互比苗頭，為了要在競爭中勝出，各國都在搶傑出的管理人才，其中最有名的人才，就是齊國的孟嘗君。孟嘗君是有錢的貴族，最讓人津津樂道的是他在家裡養了三千名食客，食客就是在家裡吃飯的客人，三千人開飯的場面一眼望不完，真是非常壯觀。只要自認為有本事的人來投奔孟嘗君，他二話不說，總是張開雙手歡迎。這些食客具備各式各樣的才能，可以隨時幫他解決各種問題。 公元前299年，秦昭王聽說孟嘗君的賢達，便邀請他到秦國當宰相。孟嘗君便高高興興的和一批食客一起去秦國赴任。天有不測風雲，誰知道到了秦國，還沒有登上相位，就有人看他不順眼，開始對秦昭王咬耳根：「他是齊國人，做決策時一定先想齊國的好處，而後才考慮秦國，這樣可危險了。」秦昭王多疑狠毒，這些讒言讓他心裡的懷疑、猜忌一起發作，他不但開除了孟嘗君，還動了殺心，心想：「這人我不用，也不能給別人用。」便把他軟禁起來。 大事不妙了，孟嘗君每一根汗毛都感受得到死亡的威脅。這時他想到美女幸姬，秦昭王最寵愛的小老婆，可能是讓自己死裡逃生的關鍵人物。孟嘗君托人去見幸姬，開門見山向她求救。結果幸姬開了個條件說：「我想要那件白狐裘皮大衣。」原來孟嘗君來秦國時，帶了一件價值千金、舉世無雙的白狐裘皮大衣送給秦昭王當見面禮。愛漂亮的幸姬看在眼裡，從此日日夜夜都幻想著這件皮大衣穿在自己身上的樣子，因此趁機向孟嘗君索取：「我也要一件。」 這下孟嘗君頭大了，大衣只有一件，已經送給秦昭王，現在他的女人又要一件，如果不給，自己就凶多吉少。他立刻召集手下的食客開緊急會議，看怎麼解決問題。食客們面面相覷，會議現場鴉雀無聲。終於，一位坐在最後面、總是悶不吭聲的食客說話了：「我能得到那件皮大衣」。這位矮小瘦削󠇡的食客，在投奔孟嘗君時就說過自己的特長是「狗盜」──模仿狗的樣子和動作潛入家戶偷東西，他說他能潛入秦王收藏寶物的庫房盜取白狐裘，這事聽來匪夷所思，但事已至此，只能試試了。 當晚，夜黑風高，狗盜先生一身黑衣出任務去。又累又焦慮的孟嘗君徹夜失眠，正在孤燈前踱方步時，門開了。狗盜先生捧了個包袱進來，在桌上攤開，白狐裘雪亮的光芒帶來了活下去的希望。 得到白狐裘的幸姬芳心大悅，當夜就用撒嬌的聲音在枕邊為孟嘗君說好話，秦昭王被美女迷得暈頭轉向，下令解除對孟嘗君的軟禁，命令即刻生效。 孟嘗君太了解秦昭王的性格了，他必須趁著秦昭王還在美人窩裡昏睡時，儘快離開險地，以免他清醒後突然又開始「想念」孟嘗君。於是他率著眾食客迅速離開軟禁之處，連夜逃離咸陽城，一行人馬來到函谷關下，要出了城門，才算真正離開秦國國土，但新的問題來了，他們出不了關。 依照當時的法令，守城的士兵天亮才能開城門。兩千多年前沒有時鐘，人們聽著公雞的叫聲，來判定天亮了，所以士兵必須聽到雞鳴，才能開城門讓人們進出。狀況緊急，時間慢的像蝸牛，寒夜裡，孟嘗君額頭上全是冷汗。這時，一位食客雞鳴先生站出來了，他說「老大，我會學雞叫，讓我來試試看。」他站在城下，半合著手掌靠近嘴巴，發出唯妙唯肖的公雞鳴叫聲，他的叫聲嘹亮悠揚，立刻誘發附近公雞們的鬥志，都不甘示弱的叫了起來，雄雞報曉的聲音此起彼落。 函谷關的門終於打開，孟嘗君和食客們策馬狂奔而出，消失在夜色裡。秦昭王一早離開美人窩後，果然開始「想念」孟嘗君，當他發現軟禁處已經人去樓空，立刻派兵快馬加鞭去追，但這時孟嘗君已經脫困，來到安全的地方了。
