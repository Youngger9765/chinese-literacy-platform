- question: 1. 下列選項「」中的語詞，何者使用正確？
  options:
  - 看到未成年學生犯罪的重大新聞後，他忍不住氣得「拍案叫絕」
  - 網紅為了按讚數，不斷揭人隱私，誇張言行令人「嘆為觀止」
  - 激烈運動後「津津樂道」的猛灌冰水，血管快速收縮，反而不舒服
  - 聽說他曾經是富二代，可惜現在「家道中落」，經濟已經不比從前了
  answer: D
- question: 2. 根據本課「閱讀聚光燈」的推理練習，請問：下列何者比較能夠表示推理三要素之間的關係？（折線或曲線代表推理能力）
  options:
  - B. C. D.
  answer: A
- question: 3. 第十三段說：「這樣的觀察與推理，人人都辦得到，只要培養推論的習慣，你會開始以不一樣的眼光看這個世界」關於這段話的詮釋，下列何者正確？
  options:
  - 只要好好地觀察與推理，人人都可以成為名偵探
  - 培養推論的習慣有助於改善視力，會看得更清楚
  - 不懂觀察與推理的人，也看不見這個世界的美好
  - 擁有推論的習慣，往往能看見別人沒發現的細節
  answer: D
- question: 4. 根據本文的內容，下列敘述何者正確？
  options:
  - 福爾摩斯與王戎兩人都擅長觀察與推理，也是著名的偵探
  - 福爾摩斯與王戎遇事時會先冷靜觀察，經過思考後再行動
  - 福爾摩斯透過觀察帽子的款式、用料，推論出帽主的年紀
  - 王戎吃過路邊的野生李子，知道它又苦又澀，所以不肯摘
  answer: B
- question: 5. 下列選項，何者的做法不符合本文說的推理三要素？
  options:
  - 總是細心觀察身旁發生的人、事、物。
  - 遇到問題就請教專家或老師。
  - 持續且廣泛的閱讀，增加大腦知識量。
  - 時常思考推理，了解事件的因果關係。
  answer: B
