  instruction: 本練習將引導你透過觀察、背景知識與推論，學習解決問題的三要素。首先，我們將分析福爾摩斯的推理過程，接著你將應用這些要素來解決兩個情境謎題。
  reasoning: 根據原文內容，將「閱讀聚光燈」的策略練習結構化。福爾摩斯的推理過程被拆解為「觀察」、「背景知識」、「推論」和「結果」四個步驟，每個步驟都設計成單選題，答案直接取自原文中已填寫的內容。後續的兩個情境謎題，則將情境描述設為自由作答題（free_text），讓學生先閱讀思考，再將「問題」、「觀察」、「知識」、「推論」拆解成單選題，答案同樣取自原文的「推論」部分。
  steps:
  - prompt: 關於帽主的訊息，福爾摩斯觀察到了哪些細節？
    type: select
    options:
    - 帽子的設計是三年前的流行款。
    - 固定鬆緊帶的小圓環是請專人製作的、襯裡用料高級，還帶有一條精緻的絲綢箍帶。
    - 帽子主人至少三年前是有錢人。
    - 帽子有補丁且有墨水染黑痕跡。
    answer: 1
    reasoning: 此題對應原文「細心的觀察」部分：「固定鬆緊帶的小圓環是【請專人　　　】製作的、襯裡用料【高級　　　　】，還帶有一條【精緻　　　】的絲綢箍帶。」選項2直接引用了這些觀察結果。
  - prompt: 福爾摩斯運用了哪些背景知識來推論帽子的流行款式？
    type: select
    options:
    - 帽子的設計是三年前的流行款。
    - 帽子的造價不便宜。
    - 帽子的材質是毛氈。
    - 帽子的主人是中年人。
    answer: 0
    reasoning: 此題對應原文「背景知識」部分：「帽子的設計是【三年前　　　　】的流行款。」選項0直接引用了這項背景知識。
  - prompt: 綜合觀察結果與背景知識，福爾摩斯推論出帽子的造價為何？
    type: select
    options:
    - 非常便宜，因為是舊帽子。
    - 中等價位，一般人負擔得起。
    - 不便宜／昂貴。
    - 無法判斷造價。
    answer: 2
    reasoning: 此題對應原文「進行推論」部分：「可推知帽子的造價【不便宜／昂貴　　　　】」。選項2與原文推論結果一致。
  - prompt: 根據上述推論，福爾摩斯對帽子主人做出了什麼最終判斷？
    type: select
    options:
    - 帽子主人現在很有錢。
    - 帽子主人至少三年前是有錢人。
    - 帽子主人是個小偷。
    - 帽子主人是個年輕人。
    answer: 1
    reasoning: 此題對應原文「推理結果」部分：「帽子主人至少【三年前是有錢人 　　 】。」選項1與原文推理結果一致。
  - prompt: '請閱讀以下情境，並思考中村警官為何判斷伊藤沒有說實話：


      不久前，伊藤的管家頭部受到重擊而亡，中村警官找伊藤問話。燭光中，伊藤顫抖著從冰箱取了些冰塊，並往威士忌加冰塊。

      「我以為他是強盜。」伊藤喝著威士忌說：「三天前這裡開始停電，我就暫時搬去城裡住。大概兩小時前，我回來拿一些資料，就在我開抽屜時，他跳到我的身後。我現在猜想可能他以為我是小偷，而我在黑暗中則以為襲擊我的是歹徒，當時我只想到自保，我全力反擊，擊中了他，他倒退幾步後就倒下了，然後我就報警了。」

      中村警官：「老實交代吧！我不想聽你編故事。」'
    type: free_text
    reasoning: 此步驟提供「黑夜中的真相」情境的完整背景資訊，讓學生先閱讀並自行思考，為後續的分析題做準備。根據規則7，開放題使用free_text。
  - prompt: 在「黑夜中的真相」情境中，中村警官觀察到了什麼關鍵細節？
    type: select
    options:
    - 伊藤顫抖著。
    - 伊藤從冰箱拿冰塊。
    - 伊藤喝著威士忌。
    - 伊藤說他以為對方是強盜。
    answer: 1
    reasoning: 此題對應原文「觀察：伊藤從冰箱拿冰塊。」選項1直接引用了關鍵觀察。
  - prompt: 為了判斷伊藤是否說謊，中村警官運用了什麼背景知識？
    type: select
    options:
    - 停電後，冰箱中的冰塊大約6小時左右就會融化。
    - 威士忌加冰塊是常見的飲用方式。
    - 管家頭部受到重擊會死亡。
    - 停電會導致冰箱無法運作。
    answer: 0
    reasoning: 此題對應原文「知識：停電後，冰箱中的冰塊大約6小時左右就會融化。」選項0直接引用了相關背景知識。
  - prompt: 綜合觀察與背景知識，中村警官判斷伊藤沒有說實話的理由是什麼？
    type: select
    options:
    - 伊藤在停電三天後仍能從冰箱取出冰塊，這與冰塊應已融化的事實不符。
    - 伊藤的說詞前後矛盾，無法自圓其說。
    - 伊藤在案發後表現得過於冷靜。
    - 管家是伊藤殺害的，因為他有殺人動機。
    answer: 0
    reasoning: 此題對應原文「推論：兩天前開始停電，兩天後冰塊早都融光了，但伊藤卻還可以從冰箱拿出冰來用，證明伊藤沒有說實話。」選項0總結了這個推論。
  - prompt: '請閱讀以下情境，並試著推論誰是犯人：


      一名數學家在飯店13樓的15號房遇害，臨死前他留下了死亡訊息「hL」。警察全力搜索，最後鎖定三名嫌疑人，他們分別是住35號房的Ａ，74號房的Ｂ以及131號房的Ｃ。'
    type: free_text
    reasoning: 此步驟提供「誰是犯人？」情境的完整背景資訊，讓學生先閱讀並自行思考，為後續的分析題做準備。根據規則7，開放題使用free_text。
  - prompt: 為了理解數學家留下的死亡訊息「hL」，需要進行什麼觀察或操作？
    type: select
    options:
    - 查詢「hL」在數學上的意義。
    - 改變看紙條的方向。
    - 將「hL」轉換成數字。
    - 尋找其他線索來解釋「hL」。
    answer: 1
    reasoning: 此題對應原文「觀察：改變看紙條的方向」。選項1直接引用了這個觀察或操作。
  - prompt: 在「誰是犯人？」這個情境中，是否需要特定的背景知識來解讀死亡訊息？
    type: select
    options:
    - 是，需要了解特殊的密碼學知識。
    - 否，主要依賴觀察與視覺轉換。
    - 是，需要了解數學家的個人習慣。
    - 是，需要了解飯店的房間號碼規則。
    answer: 1
    reasoning: 此題對應原文「知識：Ｘ」，表示不需要特定的背景知識，主要依賴觀察和視覺上的轉換。選項1符合此意。
  - prompt: 綜合觀察與推論，數學家留下的死亡訊息「hL」代表什麼意思？誰是犯人？
    type: select
    options:
    - 「hL」是數學家名字的縮寫，犯人是A。
    - 將紙條倒過來後，「hL」會變成數字「74」，指向住74號房的B是犯人。
    - 「hL」是某種化學元素符號，犯人是C。
    - 「hL」是隨機的塗鴉，沒有特殊意義。
    answer: 1
    reasoning: 此題對應原文「推論：B是犯人。將紙條倒過來後，hL就會變成B的房間號碼74了。」選項1總結了這個推論。
