spotlight_raw_text: "閱讀聚光燈\n解決問題—簡單推理三要素\n從課文中可知：「推理」的要素有三：❶細心的觀察、❷具備背景知識、❸慣於推論。我們可以用下圖來表示：\n290830116840\n細心的觀察\n進行推論\n推理結果\n產出\n背景知識\n思考00\n細心的觀察\n進行推論\n推理結果\n產出\n背景知識\n思考\n\n1.推理能力是可以透過訓練而提升的，而且大腦越習慣思考就會越靈活哦！以下讓我們利用課文中福爾摩斯的推理來練習吧！\n細心的觀察：首先要用心並仔細的察看。關於帽主的訊息，福爾摩斯觀察到：\n805544907\n固定鬆緊帶的小圓環是【請專人　　　】製作的、襯裡用料【高級　　　　】，還帶有一條【精緻　　　】的絲綢箍帶。00\n固定鬆緊帶的小圓環是【請專人　　　】製作的、襯裡用料【高級　　　　】，還帶有一條【精緻　　　】的絲綢箍帶。\n\n背景知識：再來要了解有關這頂帽子的先備知識或常識。\n80708543815\n帽子的設計是【三年前　　　　】的流行款。00\n帽子的設計是【三年前　　　　】的流行款。\n\n進行推論：綜合觀察結果與背景知識後思考：\n77025542545\n帽子「請專人製作」而且「用料高級」又「精緻」，可推知帽子的造價【不便宜／昂貴　　　　】，加上款式流行於三年前的條件。00\n帽子「請專人製作」而且「用料高級」又「精緻」，可推知帽子的造價【不便宜／昂貴　　　　】，加上款式流行於三年前的條件。\n\n873125230505\n推理結果：帽子主人至少【三年前是有錢人 　　 】。\n00\n推理結果：帽子主人至少【三年前是有錢人 　　 】。\n\n 2.剛才的推理練習是不是很有趣呢？接下來有兩個情境，請你利用觀察力與背景知識，試著推論看看！\n369570337820\n不久前，伊藤的管家頭部受到重擊而亡，中村警官找伊藤問話。燭光中，伊藤顫抖著從冰箱取了些冰塊，並往威士忌加冰塊。\n「我以為他是強盜。」伊藤喝著威士忌說：「三天前這裡開始停電，我就暫時搬去城裡住。大概兩小時前，我回來拿一些資料，就在我開抽屜時，他跳到我的身後。我現在猜想可能他以為我是小偷，而我在黑暗中則以為襲擊我的是歹徒，當時我只想到自保，我全力反擊，擊中了他，他倒退幾步後就倒下了，然後我就報警了。」\n中村警官：「老實交代吧！我不想聽你編故事。」\n00\n不久前，伊藤的管家頭部受到重擊而亡，中村警官找伊藤問話。燭光中，伊藤顫抖著從冰箱取了些冰塊，並往威士忌加冰塊。\n「我以為他是強盜。」伊藤喝著威士忌說：「三天前這裡開始停電，我就暫時搬去城裡住。大概兩小時前，我回來拿一些資料，就在我開抽屜時，他跳到我的身後。我現在猜想可能他以為我是小偷，而我在黑暗中則以為襲擊我的是歹徒，當時我只想到自保，我全力反擊，擊中了他，他倒退幾步後就倒下了，然後我就報警了。」\n中村警官：「老實交代吧！我不想聽你編故事。」\n(1)黑夜中的真相\n問題：中村警官判斷伊藤沒有說實話的理由是什麼？\n觀察：伊藤從冰箱拿冰塊。\n知識：停電後，冰箱中的冰塊大約6小時左右就會融化。\n推論：兩天前開始停電，兩天後冰塊早都融光了，但伊藤卻還可以從冰箱拿出冰來用，證明伊藤沒有說實話。                          \n 489767343807\n一名數學家在飯店13樓的15號房遇害，臨死前他留下了死亡訊息「hL」。警察全力搜索，最後鎖定三名嫌疑人，他們分別是住35號房的Ａ，74號房的Ｂ以及131號房的Ｃ。\n\n00\n一名數學家在飯店13樓的15號房遇害，臨死前他留下了死亡訊息「hL」。警察全力搜索，最後鎖定三名嫌疑人，他們分別是住35號房的Ａ，74號房的Ｂ以及131號房的Ｃ。\n\n(2)誰是犯人？\n問題：數學家留下的死亡訊息代表什麼意思？\n觀察：改變看紙條的方向　　　　　　　　　　　\n知識：Ｘ\n推論：B是犯人。將紙條倒過來後，hL就會變成B的房間號碼74了。\n你還想挑戰更多謎題嗎？可以參考本課的「"
