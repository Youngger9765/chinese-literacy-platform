title: 看到了嗎？然後呢？
authors: 課文/學習單：王淑瑱
story_text: 福爾摩斯是十九世紀英國作家亞瑟・柯南・道爾筆下的人物，這位名偵探最為人津津樂道的就是他敏銳的觀察以及彷彿能洞察一切的推理能力。在一次的辦案中，福爾摩斯翻弄著一頂舊的毛氈帽，裡裡外外看個清楚之後說：「這頂帽子的主人是位中年人，曾經家境殷實，現在雖然家道中落了，但還是勉力維持自己的尊嚴。」旁人嘆為觀止，不知道他是怎麼從這頂舊帽推論出主人的經歷與性格的。 福爾摩斯說：「帽子的設計是三年前流行的樣式，裡頭用來固定鬆緊帶的小圓環是請專人製作的；襯裡用料高級，還帶有一條精緻的絲綢箍帶，說明帽子的主人至少三年前生活富裕，所以才買得起這頂昂貴的帽子；一絲黏在帽子內襯的灰白髮絲及散發出的檸檬味髮膏，說明帽主已步入中年；鬆緊帶壞了卻沒有換，帽子的補丁處有墨水染黑的痕跡，證明了帽子主人如今家道中落，但仍力圖維持自尊。」 福爾摩斯把觀察所得結合他對背景知識的理解，做出了令人拍案叫絕的推理。這裡的推理三要素是： 細心的觀察：他可以看到帽子的高級用料、灰白髮絲、補丁以墨水染黑等。 具備背景知識：對服飾流行趨勢、中年人慣用髮膏、染黑補丁動機的了解。 慣於推論：對事物或現象保持好奇心，經常思考現象背後傳遞的訊息是什麼。 古今中外也有許多像福爾摩斯一樣的人物。西晉時代，有一位名叫王戎的人，他小時候就展現了驚人的觀察與推理能力。王戎七歲時，跟著一群年齡相仿的孩子一起出去玩。無意間，他們發現路邊有一株野生的李子樹，樹上結實纍纍，幾乎要壓斷枝條。王戎的朋友們見了，無不爭先恐後地跑去採李子，只有王戎站在一旁，靜靜地看著朋友們的行動。 有人問他：「欸！你不去採李子嗎？」 王戎笑著說：「不去！那棵樹上的李子肯定又苦又澀。」 大家一嚐，李子果然又苦又澀，紛紛吐出口中的李子，露出瞇眼皺眉的表情。有人又問：「王戎，你怎麼知道這樹上的李子是苦的？」 王戎答道：「你看，這李子樹就長在路邊，結了果卻沒人採，如果是好吃的李子，還輪得到我們來摘嗎？」 推理三要素是：細心的觀察、具備背景知識和慣於推論，你能說一說王戎是怎麼辦到的嗎？ 「好厲害喔！」你也許會非常佩服福爾摩斯與王戎，但這樣的觀察與推理，人人都辦得到，只要培養推論的習慣，你會開始以不一樣的眼光看這個世界，或許你就看到藏在現象背後的道理或故事喔！
