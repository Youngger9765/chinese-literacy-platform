story_structure_table:
- - 把手上的餅吃香一點！
- - 問題
  - 1.作者百思不解的問題是： 小時候大人分餅，為什麼每次總覺得【 姊姊的餅比較大 】？ 2.類似的狀況在生活中層出不窮： (1)分組任務時，覺得別人的任務比較【 輕鬆 】。 (2)看書時，覺得別人手裡的書比較有趣。 (3)點餐時，覺得別人的餐點比較好吃。 (4)看同學的家庭，覺得別人的家庭比較【 溫暖 】。 →作者遇到的問題是：無論在任何情況中，為什麼別人都比較【 好/幸運 】？
- - 解決契機
  - 1.作者從【 湯姆歷險記 】中的小故事，解決了他的問題。 2.湯姆的姨媽要他去【 刷籬笆 】，一開始他刷得【 不甘願 】。後來他靈機一動，假裝正在創作偉大壁畫的藝術家，全神投入。 3.湯姆的舉動吸引很多羨慕別人的小朋友，拿玩具跟他換取【 刷牆 】的權利。 4.最後湯姆不但一個下午把牆刷完，還多了許多【 玩具 】。
- - 結果
  - 作者發現：原來問題不在於【 餅的大小 】，而在怎麼把手上的餅【 吃得香一點 】。
