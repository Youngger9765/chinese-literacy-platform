multiple_choice:
- question: 1. 下列選項「 」中的語詞，何者使用正確?
  options:
  - 胖虎把桌上的牛奶倒在大雄頭上，讓大雄「醍醐灌頂」，好過分
  - 弟弟遊戲輸了都會「撒賴」，要大家陪他再玩一次，真拿他沒辦法
  - 小夫在教室大聲的「嘀咕」説小明的壞話，讓小明氣到不跟他說話
  - 馬戲團表演者被大砲發射出去，飛到天上去，可說是「難如登天」
  answer: B
- question: 2. 作者小時候百思不解的問題是什麼呢?
  options:
  - 為什麼大人給零食時，都要他們「公家吃」
  - 為什麼作者常常要被迫跟姊姊分享同一個餅
  - 為什麼祖母都是讓姊姊來分餅，作者選餅呢
  - 為什麼他用盡策略，姊姊分到的餅都比較大
  answer: D
- question: 3. 第六段中提到「……，吸引了一位跟我有同樣毛病的小朋友，……」，請問這裡指的「同樣毛病」，是什麼毛病呢？
  options:
  - 愛計較，見到糖果餅乾都非常「餓鬼」
  - 只要遇到不順心的事，就對家人耍賴
  - 覺得別人得到的，都比自己擁有的好
  - 平常愛抱怨，總是自怨自艾感到鬱悶
  answer: C
- question: 4. 作者讀完湯姆歷險記的故事前，無論在什麼狀況，「總覺得別人擁有的東西比較好」，下面哪句俗諺語和作者以前的想法不同？
  options:
  - 柿子你要挑軟的吃 B.外國的月亮比較圓
  - 遠來的和尚會念經 D.隔牆的蘋果比較甜
  answer: A
- question: 5. 運動會，大家期待已久的大隊接力比賽，因為下雨而延期了，下面哪些想法是比較正向的呢？
  options: []
  answer: D
