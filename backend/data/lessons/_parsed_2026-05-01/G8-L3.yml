multiple_choice:
- question: 1.第2段寫道：「他們一下火車，在月台上面臨與家人生離死別的『篩選』。」根據這句話的語意，「篩選」最可能強調的是什麼？
  options:
  - 家人被要求各自排隊，按規定分流到不同車廂等待
  - 當場被決定生死去向，家人因此被迫立刻生離死別
  - 工作人員逐一核對資料，確認身分後再安排住宿地點
  - 醫護人員依健康狀況檢查，協助病弱者優先接受照顧
  answer: B
- question: 2.第3段提到：「他們的頭髮被剃光、姓名被手臂刺青編號取代。」這樣的描寫最可能想強調什麼？
  options:
  - 人數龐大不易辨識，因此用編號管理以便點名與管控
  - 生活規定十分嚴格，所以每個人都必須維持外表整潔
  - 表面為了便於管理，實際也抹去個體身分與尊嚴感受
  - 為了避免疾病傳播，所以要求剃髮並完成身分記錄
  answer: C
- question: 3.他把考卷摺了又摺，想把那些腥紅叉叉藏進書包。回家的路好長，連風吹樹葉聲，都像是在嘲笑。即使如此，回家後他仍翻開考卷，把錯的題目重新算了一遍。文中的「即使」最想凸顯的是什麼？
  options:
  - 夜色與路燈的描寫，表現回家路上特別孤單
  - 考得再差，心情再壞，他仍選擇面對、解決問題
  - 只要把錯題重算一次，下次考試就一定能進步
  - 因為害怕被責備，所以只能假裝努力來掩飾失落
  answer: B
- question: 4.根據本文的寫作手法，下列哪一個流程最能說明作者是怎麼用例子把主旨「撐起來」的？
  options:
  - 場景越驚悚→ 情緒越強烈→ 主旨越容易被接受
  - 例子越特別→ 讀者越感動→ 主旨越顯得正確
  - 多個例子指向同一概念→ 概念共同支撐主旨→ 主旨更站得住
  - 先講出主旨→ 再補充故事→ 讀者更容易記住內容
  answer: C
- question: 5.運動會前，你被同學嘲笑「你根本不配參加比賽」。若用文中法蘭柯所說「我可以決定用什麼態度回應」，下列哪個做法最符合？
  options:
  - 覺得對方說得有道理，決定先退出比賽，避免再被嘲笑
  - 當場用更刺的話回嗆對方，讓他閉嘴，維持自己的面子
  - 承認自己會難過，但不把嘲笑當成真相，繼續準備並尋求支持
  - 裝作完全不在乎這件事，把情緒吞下去，硬撐到結束
  answer: C
