spotlight_raw_text: "閱讀聚光燈\n寫作手法——\n看見文章結構與主旨支撐鏈\n這篇文章的主旨雖然是明示的，但作者不是只把主旨「講出來」；他先安排背景，再用多個意象鮮明、有具體轉折的例子，把主旨一步步撐起來。\n我們來學習作者的寫作手法：\n1.文章結構安排：導入問題→背景→具體例子→道理→總結/主旨\n2.主旨如何形成的：例子（故事）→概念（道理）→主旨（總結句）\n一、寫作手法：看見本文的結構\n    本文採用「導入問題→背景→例子/道理→總結/主旨」的結構，請在【  】填入對應的段落數。\n結構\n導入問題\n背景\n例子/道理\n總結/主旨\n段落數\n【   1   】\n【 2～4   】\n【 5～9   】\n【  10    】\n二、先找主旨（明示）\n祕訣：主旨通常會出現在總結段\n  1.請在主旨段落，找出本文明示的主旨。（單選）\n    ①外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇。\n□②法蘭柯戰後創設意義治療法，幫助很多人。\n2.把主旨拆成兩個「關鍵面向」（單選）\n□①痛苦很可怕 vs 人要更堅強\n②外在奪走 vs 內在回應\n三、主旨怎麼來的？從例子中的轉折，推出本文的道理\n你已經知道文章結構與主旨，接下來做的是：\n驗證主旨是怎麼被段5～9的例子一步步推出來的。\n（一）例子→概念：用例子中的轉折推出作者想說的道理\n這篇文章的每一個例子，都有一個「轉折」，把讀者從「A：外在很糟」推向「B：內在仍能…」。用A襯托B，讓B成為重點。\n\n以下例子，請你圈出或補上轉折詞，再判斷作者透過這些例子要凸顯什麼概念？\n段\n原文\n請圈出或在【】補上轉折詞\n轉折：對比什麼（單選）\n欲凸顯的概念\n5\n集中營裡食物匱乏，一口麵包都可能關乎生死，但仍有瘦弱的難友把最後一口麵包分享出去。\n□①飢餓匱乏vs人情溫暖\n②生存壓力vs道德選擇\n人仍能決定【 道德／品格    】\n6\n獄卒辱罵：「你們根本不配喝這碗湯。」但有難友情緒不受影響，只說：「他們罵的不是事實…」\n①外界羞辱vs內在界線\n□②羞辱言語vs情緒麻木\n我可以選擇不讓【 謊言／羞辱   】定義我\n7\n年輕女子失去所有親人、即將離世，她竟然是「愉快的」…仍能感恩\n①死亡逼近vs仍能感恩\n□②失去親人vs轉移注意\n我仍能抓住【 信念／感恩   】來支撐自己\n8\n腳凍傷、腫脹、踉蹌前行，【  但  】靠想念太太最終走到目的地\n□①走不動vs有人幫忙\n②身體痛苦vs愛與期待\n【 愛／期待 】能支撐我走下去\n9\n一群瘦骨嶙峋、失溫顫抖的難友，.. 【  但  】能被黎明之美打動、能心存驚嘆\n①外在剝奪vs內在感受\n□②星光vs晨光\n人的內在仍保有【 對美的感受力／尊嚴        】\n\n（二）概念→主旨：五個概念是否能支持主旨？\n主旨：外在的一切可能被奪走，但我仍能決定用什麼態度回應遭遇\n\n主旨是一句話，但你要看見：前面的概念如何共同支撐它：在壞事不可逆轉時，我仍可決定什麼？（以下均為單選）\n段\n概念（道理）\n是否支持主旨\n我可以決定什麼\n5\n即使情況壞到極點，人仍能決定自己道德與品格的高度\n①是 \n□②否 \n□①先活下去最重要\n②守住品格／選擇善良\n6\n我們不能阻止別人說什麼，但我們可以選擇不讓謊言定義我。\n①是 \n□②否\n①不把羞辱當真／不被假話控制\n□②只要忍耐就不會受傷\n7\n在死亡前一刻，仍然有人能靠著想像而感恩\n①是\n□②否\n□①把痛苦當作不存在\n②能靠著想像感恩\n8\n不管身體有多麼痛苦，靠著愛與期待，受苦的人仍能得到鼓舞與自由\n①是 \n□②否\n①抓住愛與期待／保有盼望\n□②靠身體強壯就能撐住\n9\n就算外在被剝奪到極致，人仍能保有對美的感受力，讓受苦的人短暫脫離苦境\n①是 \n□②否\n□①看見美景就能忘記痛苦\n②保有對美的感受／仍能驚嘆\n\n四、我的發現：\n1.我學到的「方法流程」最接近哪一項？（單選）\n□①先看結尾主旨，再回頭找一兩個例子當佐證。\n②先看文章結構與主旨，再用轉折抓重點，推成概念並回扣主旨。\n□③先找到每段重點，再把看起來相似的句子圈起來整理。\n2.用一句話統整：這些例子共同要支持的主張是什麼？（單選）\n□①外在再艱難，只要互相扶持，痛苦就會慢慢減少變淡。\n②外在可能被奪走，但仍能在內在做選擇，決定如何回應遭遇。\n□③外在越痛苦，越要保持樂觀，才能不被情緒拖垮。\n3.下次遇到「很多例子、最後才總結」的文章，我會怎麼讀？（複選）\n①我先找導入問題與總結主旨，再看例子如何支持主旨。\n②我看到但／卻／仍／就算／原來，就提醒自己：重點多半在轉折後。\n③我把每個例子推出概念，再檢查這些概念能不能一起撐住主旨。\n□④我先記住每個故事情節，主旨通常就會自然看懂。\n2103649301276\n「生離死別」暗示這不是普通分流或檢查，而是外在權力在月台上「一決定就改變命運」，導致家人被迫立刻分離\n「生離死別」暗示這不是普通分流或檢查，而是外在權力在月台上「一決定就改變命運」，導致家人被迫立刻分離122327571195\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。-3533609\n七"
