title: 當壞事已不可逆轉：集中營裡的一門課
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: 遇上不可逆轉的壞事，人還可能過著有意義的美好生活嗎？來看看法蘭柯（V. Frankl）的故事。他是精神科醫師與心理治療學者，也是一個世紀前，在歐洲備受歧視的猶太人。 第二次世界大戰期間，德國對猶太人展開種族迫害。1938年起，許多猶太人被塞在擠得水洩不通的貨運列車裡，被送往各地集中營，1942年，法蘭柯全家也被捕。他們一下火車，在月台上面臨與家人生離死別的「篩選」。 像法蘭柯這樣，能做苦工或有專業技能的青壯年，被挑選到由鐵絲網與守衛塔包圍的營區，成為奴工。他們的頭髮被剃光、姓名被手臂刺青編號取代。工作繁重、衛生惡劣，缺衣少食、飢寒交迫，還隨時受病痛與暴力威脅，一旦倒下，就可能被送進毒氣室。 沒有利用價值的老人、小孩與病人往往在劫難逃，屠殺像工廠流程一樣進行：逼人脫衣、走進毒氣室；死亡後，赤裸的遺體送入焚化爐。有時爐火轟鳴，燒了幾天幾夜，集中營上空不斷落下白色灰燼，落在做牛做馬的奴工身上。大家心知肚明，那是親人的灰燼！悲傷與害怕如影隨形，自殺的消息時有所聞。雖然如此，在這生不如死的煎熬裡，身為精神科醫師的法蘭柯，卻親眼看見人的心理韌性。 集中營裡食物匱乏，一口麵包都可能關乎生死，但仍有些瘦弱到像骷髏的難友，走過囚房，向更孱弱的難友問好、為他們禱告，甚至把最後一口麵包分享出去。這讓法蘭柯深受感動，也領悟到：即使情況壞到極點，人仍能決定自己道德與品格的高度。 難友每天最重要的餐，是一碗內容貧乏的湯。領湯時囚犯必須照規定「脫帽」領湯，用屈從的姿態領取施捨，獄卒還常辱罵：「你們根本不配喝這碗湯。」但法蘭柯發現，有難友的情緒不受影響，只說：「他們罵的不是事實，只是想羞辱我們，我為什麼要受假話影響？」原來，我們不能阻止別人說什麼，但可以選擇不讓謊言定義我們。 一位年輕女子失去所有親人、即將離世。法蘭柯去看她時，她竟然是「愉快的」。她說：「感謝命運的重擊。以前我被寵壞了，沒想到周遭有這麼多值得感恩的事。」她指向窗外一段開著兩朵花的樹枝：「這是我唯一的朋友，我常跟它說話。」法蘭柯問：「樹會回你嗎？」她說：「會啊，樹告訴我：『我在，我在，我是生命，永恆的生命。』」原來，在死亡前一刻，仍然有人能靠著想像而感恩。 法蘭柯描述自己和難友在寒夜裡被押著長途跋涉的經歷：他們的腳踩過結冰的水窪而凍傷，腫脹到連鞋子都穿不進，只能在寒風刺骨的黑暗裡踉蹌前行。「這時我聽見旁邊的難友低聲說：『我可不希望我太太看到我的慘狀……』」法蘭柯回憶道：「我因此也開始想起我的太太，彷彿聽見她的聲音、看見她的微笑，我渴望再看到她；靠著這樣的想像，我終於走到目的地。」原來，不管身體有多麼痛苦，靠著愛與期待，受苦的人仍能得到鼓舞與自由。 走到目的地後，他還記得那個草木盡皆結霜的清晨。一位難友蹣跚走來，指著天邊說：「你們看，你們看！」法蘭柯一抬頭，看見星光逐漸黯淡，晨光泛粉、雲後透亮——黎明正在到來。一群瘦骨嶙峋、因失溫而牙齒格格顫抖的難友聚在一起，他們又像「人」一樣，能被美打動、能心存驚嘆。原來，就算外在被剝奪到極致，人仍能保有對美的感受力，並因此讓受苦的人短暫脫離苦境。 法蘭柯戰後才知道，在這場猶太大屠殺中，有六百萬猶太人身亡，也包括他的妻子和父母。失去至親的痛苦無法改變，但他沒有讓自己被仇恨吞沒。因為在集中營裡，他學到一件事：外在的自由、財物、健康、甚至家人都可能被奪走，但有一件事仍掌握在自己手上——我可以決定用什麼態度回應我遭遇的一切。他把這個領悟整理成「意義治療法」，用來幫助受苦的人重新找到支撐自己的理由，並在黑暗裡找到自己可以負責、可以前進的一步。
