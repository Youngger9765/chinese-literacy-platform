vocabulary:
- word: 水洩不通
  definition: 形容人多，擠得連水都流不過去；也可指消息封鎖得很嚴。
- word: 孱弱
  definition: 身體或力量很弱，站不穩、撐不久。
- word: 煎熬
  definition: 身體或心裡被痛苦折磨，很難受，撐得很辛苦。像被火慢慢烤一樣的折磨感。
- word: 踉蹌
  definition: 走路不穩、東倒西歪，像快要跌倒的樣子。
- word: 屈從
  definition: 在壓力或威脅下被迫順從，不是心甘情願的接受。
- word: 如影隨形
  definition: 像影子跟著身體一樣，緊緊跟著；常用來形容壓力、恐懼、或困擾一直擺脫不了。
- word: 在劫難逃
  definition: 劫：災禍。指壞事似乎注定會發生，怎麼躲也躲不掉。
- word: 跋涉
  definition: 走很遠、很辛苦的路，形容旅途艱難。多用於翻山越嶺、長途奔波。
- word: 吞沒
  definition: 把人或事物整個淹過、蓋住，讓它消失不見。也可指情緒把人完全控制住。
- word: 蹣跚
  definition: 形容走路不穩、搖搖晃晃的樣子，常見於受傷、年老、疲憊或身體虛弱時的步伐。
