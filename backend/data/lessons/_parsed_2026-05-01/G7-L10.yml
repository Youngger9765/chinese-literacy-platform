vocabulary:
- word: 塑膠微粒
  definition: 微小的塑膠碎片，來自塑膠製品破裂或衣物纖維脫落，可進入河川、海洋與生物體內。
- word: 功敗垂成
  definition: 事情快成功了，卻在最後一刻失敗。
- word: 自行其是
  definition: 不聽別人的意見，只照自己的想法做事。
- word: 簽署
  definition: 在正式文件上簽名，使協議或公文生效。
- word: 杯水車薪
  definition: 力量太小，像用一杯水去救一車著火的柴薪，難以解決大問題。
- word: 無遠弗屆
  definition: 不管有多遠，都沒有到不了的情況。指的是影響或力量傳得很遠。
- word: 倡議者
  definition: 為了公共議題主動發聲、提出做法並帶頭推動的人。
- word: 闕如
  definition: 缺少、不足。
