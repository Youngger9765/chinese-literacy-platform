spotlight_raw_text: "閱讀聚光燈\n推論策略—找作者觀點與支持理由\n閱讀說明文或議論文時，讀出「作者的觀點」和「支持觀點的理由」，以及推論出隱含的意義，才能完全理解文章。觀點和支持理由間的關係，就像插圖中的桌子一樣，桌子要有腳才站得穩，觀點要有支持理由，才有說服力。\n\n我們用底下❶～❸的步驟來讀出「作者的觀點、支持理由和隱含的意義」。\n   【❶確認觀點】   【❷找支持理由】   【❸推論隱含意義】\n(作者提出什麼主張？)  (用哪些證據支持？)  (隱含什麼深層意義？)\n接下來，我們來運用這個策略，分析〈塑膠，好用不好甩〉這篇文章的內容。\n一、找作者觀點、支持理由與隱含意義\n步驟❶──找作者觀點\n祕訣：觀點常是判斷句；先看標題與開頭段。\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 推論策略—找作者觀點與支持理由
  instruction: 請運用「閱讀聚光燈」策略，找出文章的觀點、支持理由與隱含意義。
  reasoning: 原文介紹了「閱讀聚光燈」的推論策略，並明確指出三個步驟：確認觀點、找支持理由、推論隱含意義。接著，原文提供了一篇課文摘要，並開始引導學生進行「步驟❶──找作者觀點」。由於原文並未提供具體的題目選項，我根據原文的「祕訣」（觀點常是判斷句；先看標題與開頭段）和提供的課文摘要，設計了第一個步驟的選擇題，以符合前端期待的格式。
  steps:
  - prompt: 根據文章標題〈塑膠，好用不好甩〉與課文摘要的開頭段落，作者主要想表達的觀點是什麼？
    type: select
    options:
    - 樂高玩具的漂流顯示了海洋的廣闊與大自然的奧秘。
    - 塑膠製品因其輕便、便宜等優點而廣泛被人類使用。
    - 塑膠污染是一個長期存在且難以解決的全球性問題，影響深遠。
    - 科學家在人體內發現塑膠微粒，證明塑膠對人類健康有直接危害。
    answer: 2
    reasoning: 原文的「祕訣」指出觀點常是判斷句，且要看標題與開頭段。文章標題〈塑膠，好用不好甩〉暗示了塑膠的負面影響。開頭段落提到「這是一場長時存在的塑膠污染悲歌」和「塑膠一旦進入環境，就很難消失」，第二段也強調塑膠「很難在自然界裡完全分解」且「無遠弗屆」。選項3「塑膠污染是一個長期存在且難以解決的全球性問題，影響深遠」最能概括這些核心訊息，作為作者的主要觀點。選項1過於聚焦樂高玩具，選項2是塑膠的特性而非主要觀點，選項4是支持觀點的證據之一，但非最全面的主要觀點。
