multiple_choice:
- question: 1.文中指出全球每年產生約四億噸的塑膠垃圾，但回收率不到一成。下列何者不是造成塑膠垃圾回收率偏低的原因？
  options:
  - 民眾缺乏環保意識，對資源回收不夠積極 B.回收設備數量不足，分類方式也不夠便利 C.餐盒與飲料杯常有油污，清洗困難難以回收 D.塑膠垃圾回收成本太低，產業競爭過於激烈
  answer: D
- question: 2.本文第一段「看似大自然在送免費玩具，但其實，這是一場長時存在的塑膠污染悲歌。」這句話的含意是什麼？
  options:
  - 把大海形容成慷慨的送禮者，強調自然能化解塑膠汙染問題 B.海浪漂來的樂高積木像禮物，其實象徵塑膠長期留存在環境 C.以播放悲傷音樂為比喻，引發讀者對玩具遺失的同情感受 D.說明樂高積木對海洋無害，因為最後仍會被送回到陸地
  answer: B
- question: 3.作者以樂高玩具落海的故事作為文章開頭，這樣寫有什麼用意？
  options:
  - 藉由真實事件引起讀者興趣，並帶出塑膠難以消失的主題 B.為了譏諷愛爾蘭和荷蘭等國家，暗示他們只重視免費玩具 C.說明樂高積木比一般塑膠更耐久，凸顯其特別的材質特性 D.引出玩具與海洋的關聯，以輕鬆有趣的口吻討論環境問題
  answer: A
- question: 4.第四段提到要讓「塑膠水龍頭」慢慢關小一點。文中的「塑膠水龍頭」是用來比喻什麼？
  options:
  - 塑膠微粒污染自來水管線，導致環境與健康問題 B.塑膠垃圾沿河入海的路徑與擴散，比擬污染的流向與移動 C.塑膠製品大量生產與使用的現象，如同水龍頭持續出水 D.塑膠公司研發新式水龍頭，用以推廣環保新科技
  answer: C
- question: 5.根據本文對個人減塑的建議，下列哪項行為最符合作者的主張？
  options:
  - 每天購買瓶裝水，但將空瓶分類回收，以減少資源浪費
  - 盡量選購有塑膠包裝的產品，並重複利用這些塑膠包裝
  - 外出購物自備環保購物袋，盡量避免使用一次性塑膠袋
  - 關注國際塑膠公約的進展，等待各國政府解決塑膠污染問題
  answer: C
