discussion_content:
- 根據〈塑膠，好用不好甩〉的標題和第一段內容判斷，作者主要強調塑膠具備怎樣的特性？（請打勾，單選）
- ①塑膠進入環境後很難消失
- □②塑膠玩具可以隨海洋漂流到世界各地
- 步驟❷──找支持理由
- 祕訣：支持理由常會用「事實、數據、例子、說明…」，多在觀點後。
- ①1997年樂高玩具落海，20多年後仍被海浪沖上岸
- □②臺灣回收率高於世界平均，制度較完善
- 步驟❸──推論隱含意義
- 祕訣：問自己：這個觀點與證據告訴我們什麼？（這是讀者自己讀出來的結論，不一定是課文原句）
- ❶觀點：「塑膠一旦進入環境，就很難消失。」
- ❷理由：「樂高玩具漂流二十多年後仍被海浪沖上岸。」
- ❸我讀到的結論
- □①只要國際談成公約，問題就能立刻解決
- ②所以塑膠不是短期問題，而是長期存在自然中的垃圾。
