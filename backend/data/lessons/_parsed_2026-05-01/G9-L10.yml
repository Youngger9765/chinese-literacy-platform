title: 高地訓練有助於運動表現嗎?
authors: 課文 ：曾世杰 學習單：張明珠
story_text: 一說起馬拉松，相信所有人腦海中都會浮現「肯亞」這個非洲國家。近年來，肯亞幾乎囊括了世界級馬拉松大賽的大小獎項，馬拉松史上前十快的紀錄，肯亞就佔了七名，世界紀錄保持人基普喬吉也同樣來自肯亞。 基普喬吉小時候住在海拔1980公尺的地方，為了接受訓練，16歲時搬到海拔2112公尺處居住，37歲時，他的訓練地和居住地都在海拔2500公尺的高地。高海拔的生活與訓練是否有助於基普喬吉的成就呢？ 長跑是有氧運動，跑步時，肌肉會大量耗氧，怎麼讓運動員的身體可以運送更大量的氧氣，就成了訓練的重要課題。一個常見的方法是「高地訓練」──讓運動員在高海拔地區接受訓練。高地空氣稀薄、氣壓低，會讓運動員血液中運送氧氣的紅血球和血紅素大幅攀升，心肺功能及耐力便因此有所進步。許多人認為基普喬吉和肯亞的馬拉松健將可以一再跑出破世界紀錄的成績，他們的高地訓練功不可沒。但，高地訓練真的對每個運動員都有幫助嗎？ 答案是不一定。讓我們來看看三個研究的結果怎麼說。 研究一：在高地，紅血球生成素的濃度變化因人而異。 研究二：高地訓練，是否提升長跑成績？因人而異。 研究三：紅血球太多，不見得是件好事。 總結：目前沒有哪位科學家堅決主張，單憑高海拔，就能造就出不易疲乏的跑步健將，或是未經高地訓練，就不可能成為優秀的長跑好手。這篇文章的重點之一是，高地訓練的成效因個人而異，訓練一定要考量個別差異。亦即，想要有好成績，必須根據每個運動員獨特的生理狀態，量身制定訓練計畫，才可能有最好的成效。
