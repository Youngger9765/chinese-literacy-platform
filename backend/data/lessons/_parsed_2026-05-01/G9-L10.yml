multiple_choice:
- question: 1. 依文中所述，下列哪一個圖是「血栓」? (血栓為血管堵住，所以為A)
  options: []
  answer: A
- question: 2. 根據課文，運動員接受高地訓練可能有什麼好處？
  options:
  - 高地稀薄的空氣可以讓血液變得濃稠
  - 高地訓練可以提升每一位運動員的長跑成績
  - 高地訓練可以刺激每位運動員體內EPO的生成
  - 高地稀薄的空氣，可能有助於提升運動員的心肺耐力
  answer: D
- question: 3. 紅血球是人體運送氧氣的重要細胞，有關於紅血球的敘述，下列何者錯誤？
  options:
  - 紅血球太多，容易讓血液變濃稠
  - 紅血球太多不一定能幫助運動員
  - 紅血球多寡可能會影響長跑成績
  - 每個人紅血球生成素濃度都相同
  answer: D
- question: 4. 根據本文，下列選項何者最符合作者想傳達的理念？
  options:
  - 高海拔地區可以產出更多長跑好手
  - 到高地訓練，容易發生血栓的危險
  - 高地訓練需考量運動員的個別差異
  - 運動員體內都有大量攜氧的紅血球
  answer: C
- question: 5. 文章中用三個研究說明高地訓練對運動員的影響，請問這樣的寫作方式目的為何？
  options:
  - 作者想強調三個研究的共同點
  - 用三個研究增進論點的說服力
  - 比較三種不同的研究的差異之處
  - 用三個研究增強文章的豐富度
  answer: B
