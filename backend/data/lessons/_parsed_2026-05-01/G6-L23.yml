spotlight_raw_text: "閱讀聚光燈\n摘要策略—問題.解決結構找重點\n    這篇故事是一篇報導式說明文，講「毒鳥事件」解決的過程。故事結構裡有明顯的問題、解決、結果。但閱讀時，如何找到文章中的「問題、解決、結果」呢？我們可以用一些線索來做判斷喔！\n我們來練習用兩步驟（❶找重點句；❷精簡重點句）找「問題、解決、結果」。\n一、找「問題」\n※祕訣：「問題」通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。\n　　❶找重點句：\n本文第一段有三句，請你先判斷哪一個句子是描述「不好的事」，而且是「最嚴重」的。(請在□打勾，三選一。)\n□句1：2012年10月，屏東科技大學的研究人員收到兩隻死亡的老鷹，檢驗後，確認老鷹體內含有劇毒農藥。\n句2：2013年，他們在屏東縣一塊紅豆田中，發現了超過3000隻野鳥屍體。\n□句3：死亡的鳥類包括麻雀、紅鳩、小雲雀、斑文鳥、彩鷸、秧雞等，也包括食物鏈上層的紅隼、老鷹。\n67437032131000我們可以這樣思考：\n第一段有三個句子，第一句和第二句都是描述「不好的事」，我覺得第二句「發現超過3000隻野鳥屍體」更嚴重，所以我留下第二句，並把第二句畫線。\n　　❷精簡重點句：\n想一想這句話的意思，用更簡短的方式表達重點。\n請判斷第1段的「問題」可以精簡成哪一個句子？（在□打勾，二選一。）\n1.有大量的野鳥中毒死亡。 \n□2.在屏東縣做田野調查。\n二、找「解決」\n※祕訣：「解決」通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡，一個精彩的故事，通常有多個解決方法。\n　　❶找重點句：（第4段）\n請你先判斷哪些句子是描述「有人想出辦法或行動的句子」。（在□打勾，三選二）\n解決1：屏東科技大學在縣政府的協助下，找上當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這個生態的悲劇。 \n解決2：林先生坦承錯誤，自2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。\n□解決3：林先生雖然成為無毒農法的先驅，但這樣做成本高，18公頃紅豆田的收入，比過去少了100萬，因此無法大量推廣，只能苦撐待變。\n70675531940500我們可以這樣思考：\n解決1和2，都是描述為了野鳥中毒死亡問題，句子都是「誰＋做了什麼事」。\n\
  ❷精簡重點句：\n想一想這句話的意思，用更簡短的方式表達重點。（在□打勾，二選一。）\n(1)請判斷「解決1」可以精簡成底下哪一個句子？\n1.屏科大找林先生溝通。\n□2.屏科大找縣政府協助。\n(2)請判斷「解決2」可以精簡成底下哪一個句子？\n1.林先生坦承錯誤。\n     □2.林先生轉型用無毒農法種紅豆。\n◎"
