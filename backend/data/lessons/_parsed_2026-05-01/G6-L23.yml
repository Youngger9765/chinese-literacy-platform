title: 老鷹紅豆的故事
authors: 課文 ：曾世杰 學習單：陳淑麗
story_text: |-
  2012年10月，屏東科技大學的研究人員收到兩隻死亡的老鷹，檢驗後，確認老鷹體內含有劇毒農藥。2013年，他們在屏東縣一塊紅豆田中，發現了超過3000隻野鳥屍體。死亡的鳥類包括麻雀、紅鳩、小雲雀、斑文鳥、彩鷸、秧雞等，也包括食物鏈上層的紅隼、老鷹。 研究人員追根究柢後才知道，當地的稻子收割後，農民會利用空檔時間轉作紅豆，紅豆播種時遭到大量野鳥啄食。農民為了減少農損，便使用農藥製作毒餌，造成小型鳥類的大量死亡。而猛禽如老鷹、紅隼撿食小鳥的屍體，也因而間󠇡接受害。 其實，毒鳥事件並不只侷限在單一作物，也不只侷限在單一地區。例如，稻子收成之際，許多農民為了怕鳥群吃掉自己的心血，只好下手毒殺；又例如，採收紅豆時，農民也會噴灑落葉劑，好讓紅豆及雜草的綠葉全部枯乾，以方便採收，但這種落葉劑也會毒害小鳥。 屏東科技大學在縣政府的協助下，找上當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這個生態的悲劇。林先生坦承錯誤，自2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。林先生雖然成為無毒農法的先驅，但這樣做成本高，18公頃紅豆田的收入，比過去少了100萬，因此無法大量推廣，只能苦撐待變。 為了支持友善耕作的農民，2015年，全聯福利中心開始與農民簽訂契作協議，以高於市場的價格收購紅豆，並將這些紅豆命名為「老鷹紅豆」。最早和全聯契作的紅豆田雖然只有25公頃，但企業和農民一起保護老鷹的故事，開始在農民間慢慢傳開。全聯販售的紅豆產品，是不毒鳥、不用落葉劑的安全紅豆，經過層層把關，不必擔心農藥殘留的問題，希望高品質的老鷹紅豆可以取得消費者的青睞。 結果，老鷹紅豆的友善耕作方式不僅保護了生態，也帶來了經濟上的成功。在各方夥伴鍥而不捨的努力後，老鷹紅豆與老鷹紅豆銅鑼燒的總銷售額從第一年的10萬元，成長到2024年的5.5億元，契作的紅豆田也超過了200公頃。這些成果都顯示出，臺灣的消費者願意付出較高的價錢，支持友善生態的農業產品。 這個美好的故事，來自許多人的努力。大學提供科學證據、倡導生態理念，農民勇敢改變耕作方式，企業願意支持友善農法的產品，當然都是關鍵的參與者。而最重要的是，每一位願意掏腰包購買老鷹紅豆的老百姓。他們沒有親自到田野去觀察、保護鳥類，但是，他們心裡有愛，用消費守護了臺灣的生態，他們和科學家、農民與企業家，一起為臺灣創造了更美好的生活。
