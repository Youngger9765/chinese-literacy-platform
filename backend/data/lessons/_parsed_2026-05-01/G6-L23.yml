story_structure_table:
- - 老鷹紅豆的故事
- - 問題
  - 農民種的紅豆遭到大量野鳥啄食，為了減少農損，農民製作毒餌，導致大量鳥類【 中毒 】死亡。
- - 解決 （誰＋做什麼）
  - |-
    1.團隊實地調查、與農民溝通。 2.農民改用【 無毒農法 】種植紅豆，播種時將紅豆埋入土中，減少播種期的鳥害，收成時放棄使用農藥。 3.全聯與農民簽訂契作協議，【 高價 】收購紅豆
- - 結果
  - 老鷹紅豆的友善耕作方式保護了【 生態 】，也帶來了【 經濟 】的成功，友善紅豆面積大幅增加，紅豆產品總銷售額大幅成長。
- - 迴響 （結語）
  - 老鷹紅豆的成功，除了大學、農民和企業，還有許多【消費者 】，支持購買老鷹紅豆，用行動守護臺灣生態。
