vocabulary:
- word: 食物鏈
  definition: 自然界中，生物間「誰吃誰」的關係，像一條鏈子連接起來。像「大魚吃小魚，小魚吃蝦米」就是一個生物鏈。鳥類中食物鏈的最上層，指的是吃肉的猛禽，如老鷹。
- word: 青睞
  definition: 喜愛、看中某人或某事。常用在受到別人喜歡或肯定時。
- word: 先驅
  definition: 最早開始做改變的人或為後來者開路的人。
- word: 侷限
  definition: 受到限制，不能自由發揮的狀況。
- word: 坦承錯誤
  definition: 誠實地承認自己做錯了事。
- word: 契作協議
  definition: 農民與企業簽訂的書面合約，約定產品的生產方式、數量、品質與收購價格等內容。
- word: 鍥而不捨
  definition: 遇到困難不放棄，一直努力到底。
- word: 追根究柢
  definition: 徹底查清楚事情的原因或來龍去脈。
- word: 猛禽
  definition: 會用利爪和尖喙抓捕其他動物當食物的鳥類，例如老鷹、貓頭鷹。
- word: 層層把關
  definition: 每個步驟都小心檢查，不讓錯誤發生。
- word: 苦撐待變
  definition: 在困難中忍耐著，希望情況能改善。
