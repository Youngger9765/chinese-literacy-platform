discussion_content:
- 1.課文第五段：
- |-
  為了支持友善耕作的農民，2015年，全聯福利中心開始與農民簽訂契作協議，以高於市場的價格收購紅豆，並將這些紅豆命名為「老鷹紅豆」。最早和全聯契作的紅豆田雖然只有25公頃，但企業和農民一起保護老鷹的故事，開始在農民間慢慢傳開。全聯販售的紅豆產品，是不毒鳥、不用落葉劑的安全紅豆，經過層層把關，不必擔心農藥殘留的問題，希望高品質的老鷹紅豆可以取得消費者的青睞。
- (1)請先尋找重點句，並畫線。
- (2)請判斷第5段的「解決」可以精簡成底下哪個句子？（在□打勾，二選一。）
- 1.全聯與農民合作，並高價收購紅豆
- □2.老鷹紅豆得到消費者的青睞
- 三、找「結果」
- 祕訣：「結果」通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變。「結果」常有明顯的關鍵詞，例如「結果」、「最後」等。
- ❶找重點句：（第6段）
- 請你先判斷哪些句子是描述「行動後帶來的改變」。（在□打勾，三選一）
- 句1：結果，老鷹紅豆的友善耕作方式不僅保護了生態，也帶來了經濟上的成功。
- □句2：在各方夥伴鍥而不捨的努力後，老鷹紅豆與老鷹紅豆銅鑼燒的總銷售額從第一年的10萬元，成長到2024年的5.5億元，契作的紅豆田也超過了200公頃。
- □句3：這些成果都顯示出，臺灣的消費者願意付出較高的價錢，支持友善生態的農業產品。
- 我們可以這樣思考：
- 第一句出現了關鍵詞「結果」，說明「解決」行動後帶來的成果。
- ❷精簡重點句：想一想這句話的意思，用更簡短的方式表達重點。
- □1.這句已經很精簡了，不用再精簡。
- □2.我可以更精簡：友善耕作保護了生態，也帶來了經濟上的成功。
