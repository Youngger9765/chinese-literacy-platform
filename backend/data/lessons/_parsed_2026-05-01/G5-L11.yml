multiple_choice:
- question: 1. 請問文中提到「她是塊璞玉，更需要雕琢」，「璞玉」代表什麼意 思?
  options:
  - 能力已經非常強大的人
  - 有潛力而未經開發的人
  - 膽小害怕、不敢做的人
  - 所有人都知道的名人
  answer: B
- question: 2. 請問文中第一段「陳念琴讓尋找人才的柯教練眼睛為之一亮」，柯教練最可能的情緒是哪個?
  options:
  - 羨慕 B.悲傷 C.驚喜 D.憤怒
  answer: C
- question: 3. 第五段陳念琴說：「我的拳擊生涯就像坐雲霄飛車，oooooo」，請問oooooo最有可能是哪句話？
  options:
  - 忽高忽低，充滿挑戰
  - 左搖右擺，頭暈眼花
  - 急煞急停，如魚得水
  - 忽上忽下，緩慢前進
  answer: A
- question: 4. 文中第三段提到「陳念琴「越級打怪」挑戰臺北城市邀請賽」，請問下列何者不是越級打怪的例子？
  options:
  - 體重50公斤，去參加70公斤級的比賽
  - 打敗同年齡的對手
  - 挑戰比自己能力強的選手
  - 業餘球隊挑戰職業聯賽
  answer: B
- question: 5. 根據本文，陳念琴的拳擊人生遭遇的事件順序為何？
  options:
  - 面對低潮→找回自信→身分自卑→擊破困難
  - 擊破困難→身分自卑→找回自信→面對低潮
  - 身分自卑→擊破困難→面對低潮→找回自信
  - 身分自卑→找回自信→面對低潮→擊破困難
  answer: D
