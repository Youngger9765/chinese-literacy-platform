multiple_choice:
- question: 1. 請問哪一個句子使用語詞有誤？
  options:
  - 我迫不及待要在這場比賽「大顯身手」，展現平時訓練成果
  - 即使未來的路充滿「荊棘」，我們也要努力克服，繼續前行
  - 為了幫助災民，公益協會呼籲各界踴躍捐款，「多多益善」
  - 為了紀念蔣渭水的貢獻，政府設置了蔣渭水「里程碑」
  answer: D
- question: 2. 根據文章，1900年第二屆的巴黎運動會為什麼會開放女性參賽？
  options:
  - 奧運之父古柏坦改變心意
  - 因為女性的地位提升許多
  - 因性別、人權意識的抬頭
  - 為了熱鬧有趣，讓更多人參與
  answer: D
- question: 3. 根據本文，請問下列選項何者錯誤？
  options:
  - 參與奧運的女性運動員比率逐屆上升
  - 古代的女性都沒有參加奧運比賽的能力
  - 運動中的性別文化，仍有待提升
  - 2024巴黎奧運男女選手參與率為1:1
  answer: B
- question: 4. 雖然本文提到巴黎奧運創下「性別平衡的全新里程碑」，但第九段提到：「性別平等這條路仍是充滿荊棘。」似乎有所衝突。請問為什麼作者會這樣寫？
  options:
  - 作者認為在追求性別平等的路上，仍有努力空間
  - 作者認為巴黎奧運的男女人數平等只是假平等
  - 作者希望未來奧運比賽女子運動員人數應超過男子
  - 作者希望奧運會成為實現與檢視性別平等的最大舞台
  answer: A
- question: 5. 下列措施，何者有助於性別平等的落實？
  options:
  - 作為一個運動員，外表與實力缺一不可
  - 沙灘排球女性應穿著比基尼，以減少阻力
  - 國際奧會應該提升決策系統的女性占比
  - 女性在月經期間應避免運動，以免受傷
  answer: C
