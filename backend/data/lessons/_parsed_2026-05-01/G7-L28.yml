  options:
  - 保持瓶頸彎曲，並讓外界空氣持續進入
  - 先把肉湯煮沸，再讓瓶身一直保持直立
  - 折斷鵝頸瓶口，或讓肉湯流到瓶口處
  - 把瓶口維持開放，並讓微生物沉在頸部
  answer: C
- question: ２.第二段巴斯德提出假設：「只要把肉湯煮沸，並且阻止空氣中的微生物落入湯裡，肉湯即使接觸空氣，應該也不會腐敗。」從這句話可以推知，巴斯德設計實驗時最想驗證的是什麼？
  options:
