spotlight_raw_text: "閱讀聚光燈\n圖文整合閱讀策略\n許多文章裡的圖，不是裝飾，而是幫助讀者理解的重要訊息。讀有圖的文章時，不能只看文字，也不能只看圖片，而要在文字和圖片之間來回對照。這一課我們先練習一個常用的方法：先快速看圖，再看文字。接著我們要練習用底下的4個步驟，學圖文整合閱讀策略：\n    ❶先看圖——看整體，預測本文主要在談什麼\n❷文字和圖片對應——一邊讀文字，一邊回到圖中找對應\n❸整合文圖——把文字和插圖合起來想，文圖要表達什麼\n❹檢查理解——不確定，就回去重讀\n步驟❶：先看圖——看整體，預測本文主要在談什麼\n    小祕訣：看圖，先看整體，不用急著讀細節。先看看這張圖裡有幾種情況，從圖猜猜看這課主要在談什麼？ （試著依以下步驟讀圖）\n1.圖一的標題是：   巴斯德的鵝頸瓶實驗的設計與程序    \n2.實驗共有幾個情境？    三    個。\n3.圖一用什麼方式呈現實驗？（單選）\n①用箭頭呈現三個實驗情境的進行方式與結果\n□②用顏色呈現三種肉湯的不同味道\n4.圖一整體來看，這張圖最像在比較什麼？（單選）\n①肉湯在什麼情境下會產生改變？\n  □②肉湯加熱後，會產生什麼改變？\n5.根據圖一，你猜這篇文章最可能想回答哪一個問題？（單選）\n  □①肉湯顏色和加熱的時間長短有沒有關係\n  ②肉湯腐敗和瓶子的處理方式有沒有關係\n\n步驟❷：文字和圖片對應——一邊讀文字，一邊回到圖中找對應\n    小祕訣：仔細讀文章，讀到和圖片有關的文字，看一下圖，找跟圖有關的訊息。\n1.這是一篇科學性文章，段1～2，主要在描述研究的什麼？（4選2）\n①研究問題  ②假設  □③驗證方法  □④結論\n→段1~2有插圖嗎？ □①有 ②沒有\n2.段3主要描述這個研究的什麼？（單選）\n□①研究問題  □②假設  ③驗證方法  □④結論\n→段3有插圖嗎？ ①有 □②沒有\n2-1文字和圖片對應\n(1)「鵝頸瓶保持開口，外界空氣仍可進入，但空氣中的微生物會被彎曲的瓶頸攔住，沉積在頸部，因此無法進入瓶中的肉湯」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）\n⒈情境①-瓶頸彎曲，瓶口保持開放肉湯沒有腐敗\n□⒉情境②-瓶頸被打斷，瓶口直接外露肉湯臭了\n□⒊情境③-瓶身傾斜，肉湯流到瓶口肉湯臭了\n→你覺得插圖是否讓你更容易讀懂文字？ ①是 □②否\n(2)「將瓶頸折斷，空氣中若有微生物，就會掉進湯裡」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）\n□⒈情境①-瓶頸彎曲，瓶口保持開放肉湯沒有腐敗\n⒉情境②-瓶頸被打斷，瓶口直接外露肉湯臭了\n□⒊情境③-瓶身傾斜，肉湯流到瓶口肉湯臭了\n→你覺得插圖是否讓你更容易讀懂文字？ ①是 □②否\n(3)「把瓶身傾斜，讓肉湯流到瓶口」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）\n□⒈情境①-瓶頸彎曲，瓶口保持開放肉湯沒有腐敗\n□⒉情境②-瓶頸被打斷，瓶口直接外露肉湯臭了\n⒊情境③-瓶身傾斜，肉湯流到瓶口肉湯臭了\n→你覺得插圖是否讓你更容易讀懂文字？ ①是 □②否\n3.段4主要描述這個研究的什麼？\n□①研究問題  □②假設  □③驗證方法  ④結論\n→你覺得插圖是否讓你更容易讀懂文字？ ①是 □②否\n步驟❸：文圖整合——把文字和插圖合起來想，這課要表達什麼？\n下面哪一句，最能把文字和插圖的意思一起說清楚？（單選）\n①巴斯德比較三種情況後發現，肉湯腐敗和微生物污染有關\n□②巴斯德比較三種情況後發現，只要肉湯接觸空氣就會腐敗\n步驟❹：檢查理解——不確定，就回去重讀\n  看著圖，說說看：巴斯德想證明什麼？說不清楚，就回到文字再讀一次。\n\n◎"
