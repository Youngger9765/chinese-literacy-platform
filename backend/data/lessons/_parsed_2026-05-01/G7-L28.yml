story_structure_table:
- - 以實驗破解肉湯腐敗之謎
- - 研究問題/解釋 （段1）
  - 問題為什麼煮好的肉湯，過幾天會【 腐敗 ／變酸發臭 】？ 當年的解釋：【 自然發生說 】：因為湯裡含有某種特殊條件，讓無生命的物質變成生命。
- - 新說法/ 假說 （段2）
  - 新說法：巴斯德認為，肉湯腐敗可能和空氣中的【 微生物 】有關。 假說：只要把肉湯【 煮沸 】，並且阻止微生物落入湯裡，肉湯即使【 接觸空氣 】，也不會腐敗。
- - 實驗/檢驗 （段3)
  - |-
    情境①：瓶頸【 保持完整 】，空氣可進入，但微生物被攔住；結果肉湯【 沒有腐敗 】。 情境②：把瓶頸【 折斷 】，微生物可直接進入；結果肉湯【腐敗了／臭掉了 】。 情境③：把瓶身【 傾斜 】，讓肉湯流到瓶口、接觸微生物；結果肉湯【腐敗了／臭掉了 】。
- - 結論 (段4)
  - 生物不能【 自然產生 】，腐敗與【 微生物污染 】有關。
- - 研究影響 (段5)
  - 改變了醫學、生物學與【 公共衛生 】的發展方向，例如：消毒、洗手、戴口罩。
