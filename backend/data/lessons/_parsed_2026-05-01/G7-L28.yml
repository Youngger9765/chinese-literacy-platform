multiple_choice:
- question: 1.根據第三段的說明，在哪一選項的情況下，肉湯很快就發臭了？
  options:
  - 保持瓶頸彎曲，並讓外界空氣持續進入
  - 先把肉湯煮沸，再讓瓶身一直保持直立
  - 折斷鵝頸瓶口，或讓肉湯流到瓶口處
  - 把瓶口維持開放，並讓微生物沉在頸部
  answer: C
- question: |-
    ２.第二段巴斯德提出假設：「只要把肉湯煮沸，並且阻止空氣中的微生物落入湯裡，肉湯即使接觸空氣，應該也不會腐敗。」從這句話可以推知，巴斯德設計實驗時最想驗證的是什麼？
  options:
  - 肉湯腐敗是否因為沒有煮沸完全造成
  - 肉湯腐敗到底是空氣還是微生物造成的
  - 肉湯腐敗是否因為接觸空氣本身造成
  - 肉湯腐敗是否因為玻璃瓶內殘留雜質造成
  answer: B
- question: ３.文章最後提到「洗手、戴口罩的重要性，都與這項研究的精神息息相關」，這句話最適合用來說明下列哪一種想法？
  options:
  - 預防疾病的重要做法之一，是減少微生物傳播
  - 現代醫學進步的原因，主要來自顯微鏡的發明
  - 巴斯德做鵝頸瓶實驗時洗手、戴口罩，才能成功
  - 巴斯德設計實驗的目的，就是解決現代的疫情
  answer: A
- question: ４.圖一呈現的鵝頸瓶構造，最能幫助讀者理解下列哪一選項的文字？
  options:
  - 鵝頸瓶的彎曲瓶頸，可讓空氣通過卻攔住微生物
  - 煮沸後，鵝頸瓶肉湯中的微生物就可以完全消滅
  - 鵝頸瓶經過加熱之後，瓶內空氣就不再造成污染
  - 鵝頸瓶的主要作用，就是把外界空氣完全隔絕掉
  answer: A
- question: ５.本文先寫「最普遍的解釋是自然發生說」，接著又寫「但法國的科學家巴斯德卻有一個新的說法」，這樣安排最能突顯什麼？
  options:
  - 巴斯德的觀點，是把原有觀念說得更加完整
  - 巴斯德的觀點，是從舊說法中找到較合理部分
  - 巴斯德的觀點，是把注意重點轉到實驗工具上
  - 巴斯德的觀點，是對既有的解釋提出挑戰
  answer: D
