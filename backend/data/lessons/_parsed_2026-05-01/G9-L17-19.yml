discussion_content:
- 看完本課，你是否發現，對「基普喬吉破馬拉松紀錄」事件，三篇文章的觀點很不一樣，統整如下表：
- 由上可知，同一件事情可以有不同的觀點。能有自己的觀點，且理解與尊重多元觀點，是現代公民必須具備的素養哦。現在換你試試看。
- (1)你認為基普喬吉破紀錄是靠自己的力量嗎？寫出你的理由。
- 我認為他 □是 □不只是 靠自己的力量，因為
- 是，他是靠自己的力量。因為他從小刻苦訓練，長大後也精進自己。／不是每個人穿上了跑鞋就可以破紀錄，所以他是靠自己的力量破了馬拉松紀錄。或 否，他不只是靠自己的力量。他靠著團隊和現代科技的力量－跑鞋，才能破紀錄，所以並不只是靠自己。
- (2)（ A ）文章引用了三篇新聞，各有不同的看法，這樣的安排有什麼寫作用意?
- A.強調單一的解釋可能不夠完整。B.強調人定勝天及努力的重要性。
- C.比較不同觀點的優劣。 D.試圖批判基普喬吉的團隊努力。
- (3)你認為成為一個優秀的運動選手，需要有什麼必備的條件？
- 自身的天賦與努力、現代科技的協助、聰明的頭腦、自律、懂得依照自身的優勢發展自己的長才。
