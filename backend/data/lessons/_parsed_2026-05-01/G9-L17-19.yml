title: 馬拉松王者──基普喬吉 (記敘文)
authors: 課文 ：曾世杰 學習單：張明珠
story_text: 「你覺得100公尺跑17秒，這樣速度快不快？」 「很慢啦，還慢得要死。」 「但每100公尺跑17秒，連續跑42公里呢？」 「神經病，哪裡有可能？」 「你不要不相信，2022年9月25日在柏林的馬拉松大賽，就有一個神人，用兩小時零1分鐘跑完了42公里，打破了世界紀錄，他就是基普喬吉。」 來自肯亞的基普喬吉 肯亞以長跑好手聞名於世，他們絶大多數都出身貧苦，身型苗條、小腿細長是他們天生的優勢，此外，肯亞許多村莊海拔都在2500公尺以上，高海拔、溫和的氣候以及綿延的鄉村小路提供長跑運動員合宜的訓練環境，有利於訓練出強大的心肺功能。年輕人有很高的動機投入長跑運動，只要跑出成績，就可以進入訓練中心接受訓練。在能力分級的制度下，頂級的選手將有機會出國比賽、拿獎金。奪牌後的獎金和福利將讓他們下半輩子都不愁吃穿，而基普喬吉就是眾多選手中的佼佼者。 基普喬吉1984年出生於肯亞的裂谷省南迪郡，這裡海拔2047公尺，空氣中氧氣稀薄。他的家到學校有四、五公里遠，但他從小跑步上，長期下來，鍛鍊出他強大的心肺功能，奠定了長跑的基礎。基普喬吉認為：「在肯亞的農村長大，會幫助你培養各種技能，讓你的運動員生涯走得更長遠。」 運用團隊力量獲勝 基普喬吉說：「馬拉松將越來越需要團隊的努力。」馬拉松的距離有42公里，過去體育界普遍認為2小時跑完42公里是人類的極限，基普喬吉如何利用團隊力量破紀錄呢？以2019年的「1小時59分挑戰計畫」為例，教練團安排了幾位不斷輪替的陪跑員，陪跑員在基普喬吉前方擺出倒V字隊形，在他後方還有另外兩名陪跑員，這樣安排的目的是要以人為的方式，把空氣阻力降到最低。教練團以雷射光點引導陪跑員的配速，基普喬吉只要跟上團隊的配速，就有機會破世界紀錄。不但如此，他還穿上了高科技的跑鞋，NIKE宣稱這種鞋子可以提升4%的跑步效率。基普喬吉最終的成績是1小時59分40.2秒，打破了有史以來的「馬拉松2小時魔障」。當然，這次的破紀錄並不是真實的比賽，但在2022年柏林馬拉松大賽時，他用兩小時零1分鐘破了世界紀錄，基普喬吉一樣也歸功於團隊的努力。 看重自律、內省與閱讀 儘管基普喬吉是世界最頂尖的馬拉松選手，但他生活簡樸，和隊友住在面積不大的宿舍裡。他有次在接受記者採訪時談到：「我們在訓練中心的生活很簡單，早上起床後就練跑，回來後去吃午飯，接受按摩以放鬆肌肉；下午四點再跑，晚上喝點茶，休息，和隊友交流、討論，睡覺，日復一日。」他認為：「只有自律的人才能在生命中獲得自由。當你開始審視自己時，這就意味著要做正確的事，而不只是做你想做的事。我不是用腿在跑步，我是用心跟頭腦在奔跑。」此外，他也有寫訓練日記的習慣，寫下課程細節、感受和遇到的訓練難題，做為下一次調整的參考，多年下來，他累積了一大本厚厚的筆記。 更特別的是，許多人認為運動員是不讀書的，但基普喬吉熱愛閱讀，他認為閱讀能讓他專心，不必理會干擾他的紅塵俗事。他的閱讀書單有很高的多元性，希臘哲學家、傑出運動員傳記到各種心靈成長的書籍應有盡有。《與成功有約：高效能人士的七個習慣》就是他的愛書之一。 出身貧苦的基普喬吉，在充滿挑戰的自然環境下成長，苦練之外，又看重團隊合作與自律，也藉著廣泛閱讀來提升自己、增廣見聞，真是值得全世界年輕運動員效法的好榜樣。
