vocabulary:
- word: 抽絲剝繭
  definition: 比喻由淺入深，一層一層深入分析，探求真相。
- word: 鋪天蓋地
  definition: 容聲勢大，覆蓋得像天空一樣廣大。
- word: 劈頭
  definition: 指一開始就直接講或做，沒有緩和的過程。
- word: 眼睜睜
  definition: 清楚看著壞事發生，但無法改變情況。
- word: 援助
  definition: 援救幫助。
- word: 煽情
  definition: 故意挑動情緒，以引起共同情感的反應。
- word: 杜撰
  definition: 無事實根據、憑空捏造。
- word: 令人髮指
  definition: 讓人非常憤怒。
- word: 最負盛名
  definition: 最具有名望。
- word: 視若無睹
  definition: 雖然看到，但因不關心，好像沒有看到一樣。等同「視而不見」。
