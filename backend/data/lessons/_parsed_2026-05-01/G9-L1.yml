spotlight_raw_text: "閱讀聚光燈\n辨識假新聞\n    數位化時代能讓讀者快速取得資訊，但是也造成了假新聞當道的亂象。如果沒有深入的思考以及查核真相，就很容易做出錯誤的結論，讓我們繼續來當一個聰明的閱聽人，辨別真假訊息吧！。\nＱ1：人為什麼需要新聞？\nＱ2：寫新聞的人是誰？\n一個人不可能同時得知世界大小事，藉由新聞可得知各地發生的訊息。\n這是個言論自由的時代，「每個人」都能在社群媒體發表新聞。\nＱ3：假新聞是什麼？\nＱ4：假新聞背後的目的?\n假新聞是指根據特定目的發表假訊息，引起大眾注意，來達成混淆視聽的目的。\n(1)政治：透過媒體洗腦民眾，來達成特定政黨的目的。\n(2)利益：用假消息創造商機，例如商家說衛生紙要漲價，造成搶購。\nＱ5：我們該怎麼辨識假新聞？\n(1)多查看：檢查消息來源是否可信。\n(2)多思考：新聞的背後目的？新聞服務了誰？誰可能是最大利益者？\n(3)多討論：保持開放的心胸，多和立場不同的人討論。\n(4)多閱聽：平時多看多聽，腦袋裡要有各式各樣的知識。\n(5)多冷靜：看到特別聳動的新聞時，須保持冷靜，謹慎辨別。\n總結：\n真相是根據事實來判定的，每個人都要培養批判性思考的能力。\n\n◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 辨識假新聞
  instruction: 數位時代資訊繁雜，假新聞充斥。本練習將引導你學習如何辨識真假訊息，培養批判性思考，成為聰明的閱聽人。
  reasoning: 此練習旨在透過引導式問答，幫助學生理解假新聞的定義、目的及辨識方法，培養批判性思考能力。題目設計依循原文的問答結構，將原文提供的答案作為學生應理解並能闡述的內容。
  steps:
  - prompt: 請說明人為什麼需要新聞？
    type: free_text
    reasoning: 此題旨在引導學生思考新聞存在的必要性，並從課文中找出對應的解釋：人不可能得知世界大小事，需藉由新聞獲取各地訊息。
  - prompt: 請說明寫新聞的人是誰？
    type: free_text
    reasoning: 此題旨在引導學生理解在言論自由時代，新聞來源的多元性，並從課文中找出對應的解釋：每個人都能在社群媒體發表新聞。
  - prompt: 請定義什麼是假新聞？
    type: free_text
    reasoning: 此題旨在引導學生定義假新聞，並從課文中找出對應的解釋：根據特定目的發表假訊息，引起大眾注意，達成混淆視聽的目的。
  - prompt: 請說明假新聞背後的目的有哪些？
    type: free_text
    reasoning: 此題旨在引導學生分析假新聞背後的動機，並從課文中找出對應的解釋：政治（透過媒體洗腦民眾）和利益（用假消息創造商機）。
  - prompt: 請列出我們該怎麼辨識假新聞的方法？
    type: free_text
    reasoning: 此題旨在引導學生歸納辨識假新聞的方法，並從課文中找出對應的五點建議：多查看、多思考、多討論、多閱聽、多冷靜。
