discussion_content:
- 讀完文章後，我們一起來追查凱蒂案吧。
- 1.你從哪裡可以判斷凱蒂案可能是一則假新聞?
- 誇張聳動的標題 太過真實的目擊者數據 匪夷所思的社會冷漠。
- 2.你認為記者可能為了什麼目的寫出這則假新聞呢？（多選）
- 想搶得獨家頭條 想提高報紙的購買率 □指責警方辦事不力
- 懶得查證、直接寫故事比較快 帶有個人立場（想指責社會的冷漠）。
- （ B ）1. 下列語詞何者使用正確?
- A.看見路上發生車禍，他「煽情」的呼叫大夥一同幫忙。
- B.這件命案，經過警方「抽絲剝繭」，終於真相大白。
- C.他天生兩眼全盲，所以對任何東西都「視若無睹」。
- D.我們以天為被、地為席，「鋪天蓋地」徜徉在大自然中。
- （ C ）2. 下列選項何者最符合本文結尾所提到「盡信書不如無書」的涵義？
- A.沒有書本，世界上就可以減少紛爭。
- B.與其完全相信書，不如就不要讀書。
- C.讀書時，必須保有獨立懷疑的精神。
- D.如何選擇書中知識，全在一念之間。
- （ A ）3. 下列何者是「旁觀者效應」的例子？
- A.我以為你會掃，你以為他會掃，他以為我會掃，結果全都沒人掃。
- B.善良的人，看到的都是美好；多疑的人，會認為別人都不懷好意。
- C.最近種植高麗菜利潤非常高，大家便一窩蜂到菜園裡栽種高麗菜。
- D.本來乾淨的公廁，只要有人不愛惜乾淨，大家就會跟著亂丟垃圾。
- （ D ）4. 「長達43年，都沒有人對凱蒂案提出質疑？」最可能的原因為何？
- A.沒有管道與方法可以提出質疑。
- B.怕自己的判斷與大家不一樣。
- C.大家都認為這不關自己的事。
- D.迷信心理學家的權威，不加質疑。
- （ D ）5. 未來生活中若遇到真假難辨的訊息，我們應該怎麼做？
- A.警察為人民保母、有問題可詢問警察。
- B.書中的知識都經過前人驗證，可相信。
- C.可相信科學家的實驗，有實驗有保證。
- D.多質疑、多檢驗，常常保持探究的心。
