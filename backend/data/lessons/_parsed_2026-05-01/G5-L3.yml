discussion_content:
- 1.第七段──往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。
- ❶圈難詞：把「拜請」圈起來。
- ❷畫線找上下文線索：「叫不到的人」、「靠這些嫂子的關係」、「而來」
- ❸推詞義：「叫不到的人」表示自己邀不來，要靠大嫂的關係才能成功把人請到現場。所以可以推測「拜請」表示：（請打勾，單選）
- 【拜託、邀請 □祭拜、申請 】
- ❹檢查：把推測的答案代入原句，判斷【合理 □不合理】。
- 往往我們叫不到的人，都要靠這些嫂子的關係 拜託、邀請 而來。
- 2.第八段──工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在指點迷津。
- ❶圈難詞：把「指點迷津」圈起來
- ❷畫線找上下文線索：把關鍵訊息畫起來
- ❸推詞義：工程有困難、不順利時，要去哪裡拜拜祈求，都是大嫂他們提出解決問題的建議，可推測「指點迷津」表示：
- 【□指指點點造成困擾 提出解決問題的建議 】
- ❹檢查：把推測的答案代入原句，判斷【合理 □不合理】。
- 工程不順，要去哪裡拜什麼，下一步該怎麼做，都是她們在
- 提出解決問題的建議 。
- 3.換你試試看：每年會大約有一百多架飛機失事，死了很多人。
- ❶圈難詞：把「失事」圈起來
- ❷畫線找上下文線索：把關鍵訊息畫起來
- ❸推詞義：失事後面寫了死了很多人，會死很多人表示發生了意外，所以推測「失事」表示： 發生了意外 的意思。
- ❹檢查：把詞義帶回句子讀讀看，判斷是否合理。若不合理，需再回到第二步或用其他的方式找詞義，例如查字典、拆詞釋義。
- (1) 溫柔婉約 ：溫和柔順，婉轉含蓄。
- (2) 心知肚明 ：不用明說也非常清楚。
- (3) 粗野陽剛 ：粗魯豪放且強健、有朝氣的樣子。
- (4) 穿梭 ：形容頻繁快速的來回移動。
- (5) 調度 ：安排配置。
- (6) 調停折衝 ：調解協調並靈活應對衝突。
- (7) 無虞 ：不用擔心。
- 銜接無虞 ：指的是過程連接順利，沒有問題。
- (8) 使臂使指 ：揮動手臂與手指，比喻發號施令。
- (9) 度量胸襟 ：能包容別人的限度和氣度。
- (10) 長袖善舞 ：比喻處事圓滑，善於交際。
- (11) 當面戳破 ：直接揭穿他人的謊言或真相。
- (1)她說話總是( B )，輕聲細語，讓人感到如沐春風。
- (2)老師的一番話，正好為處在人生低潮中的我( G )。
- (3)她每天( H )於各科教室之間，忙碌得像個小蜜蜂。
- (4)他( I )對方的藉口，場面一度尷尬。
- (5)區間車準時到站，我們轉乘高鐵銜接( D )，時間很充裕。
- (6)領導者應有開闊的( E )，接納不同的看法，才能服眾。
- (7)他( C )，交際手腕高明，一下子就能和各方談成合作。
- (8)他喜歡把大家( J )的想法直接說出來，常常弄得現場很尷尬。
- （ Ｂ ）1. 請問哪一個句子使用語詞正確？
- A.她「長袖善舞」穿梭舞台之中，優美的舞姿令人心動不已
- B.當謊言被「戳破」的那一刻，他的臉瞬間漲得通紅
- C.氣溫突然升高，我們把冷氣的「調度」到二十六度才舒服
- D.新買的手機操作簡單，拍照也很清晰，功能「銜接無虞」
- （ Ａ ）2. 第八段提到：「即使她們心知肚明，也不願讓自己的丈夫出糗。」這句話的意思是什麼？
- A.大嫂刻意保護丈夫體面 B.大嫂無法改善丈夫問題
- C.大嫂不知道丈夫的缺點 D.大嫂很崇拜自己的丈夫
- （ C ）3. 依全文脈絡，下列哪一項最能說明大嫂在工地的「核心功能」？
- A.監工驗收 B.行政核帳
- C.協調與支援 D.專業設計
