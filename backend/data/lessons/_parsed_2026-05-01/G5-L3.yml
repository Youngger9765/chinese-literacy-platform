  - prompt: 請找出與「調停」詞義推測相關的上下文線索：在工地有人吵起架來，調停的常常是她們。
    type: free_text
    reasoning: 此題對應策略步驟❷「畫線找上下文線索」，訓練學生從句子中提取關鍵的上下文線索。
  - prompt: 根據你找到的上下文線索，推測「調停」的意思是什麼？
    type: free_text
    reasoning: 此題對應策略步驟❸「推測詞義」，要求學生根據線索進行詞義推論。
  - prompt: 將你推測的詞義代回原句：「在工地有人吵起架來，勸架調解、讓人停止爭吵 的常常是她們。」判斷是否合理？
    type: select
    options:
    - 合理
    - 不合理
    answer: 0
    reasoning: 此題對應策略步驟❹「檢查」，引導學生檢查推測的詞義是否符合語境，確保理解的正確性。原文範例中明確指出「合理」為正確判斷。
