discussion_content:
- 1.第七段──往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。
- ❶圈難詞：把「拜請」圈起來。
- ❷畫線找上下文線索：「叫不到的人」、「靠這些嫂子的關係」、「而來」
- ❸推詞義：「叫不到的人」表示自己邀不來，要靠大嫂的關係才能成功把人請到現場。所以可以推測「拜請」表示：（請打勾，單選）
- 【拜託、邀請 □祭拜、申請 】
- ❹檢查：把推測的答案代入原句，判斷【合理 □不合理】。
- 往往我們叫不到的人，都要靠這些嫂子的關係 拜託、邀請 而來。
- 2.第八段──工程不順，要去哪裡拜什麼、下一步該怎麼做，都是她們在指點迷津。
- ❶圈難詞：把「指點迷津」圈起來
- ❷畫線找上下文線索：把關鍵訊息畫起來
- ❸推詞義：工程有困難、不順利時，要去哪裡拜拜祈求，都是大嫂他們提出解決問題的建議，可推測「指點迷津」表示：
- 【□指指點點造成困擾 提出解決問題的建議 】
- ❹檢查：把推測的答案代入原句，判斷【合理 □不合理】。
- 工程不順，要去哪裡拜什麼，下一步該怎麼做，都是她們在
- 提出解決問題的建議 。
- 3.換你試試看：每年會大約有一百多架飛機失事，死了很多人。
- ❶圈難詞：把「失事」圈起來
- ❷畫線找上下文線索：把關鍵訊息畫起來
- ❸推詞義：失事後面寫了死了很多人，會死很多人表示發生了意外，所以推測「失事」表示： 發生了意外 的意思。
- ❹檢查：把詞義帶回句子讀讀看，判斷是否合理。若不合理，需再回到第二步或用其他的方式找詞義，例如查字典、拆詞釋義。
