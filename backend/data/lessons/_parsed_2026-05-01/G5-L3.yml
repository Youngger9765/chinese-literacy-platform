multiple_choice:
- question: （ Ｂ ）1. 請問哪一個句子使用語詞正確？
  options:
  - 她「長袖善舞」穿梭舞台之中，優美的舞姿令人心動不已
  - 當謊言被「戳破」的那一刻，他的臉瞬間漲得通紅
  - 氣溫突然升高，我們把冷氣的「調度」到二十六度才舒服
  - 新買的手機操作簡單，拍照也很清晰，功能「銜接無虞」
  answer: B
- question: 3. 依全文脈絡，下列哪一項最能說明大嫂在工地的「核心功能」？
  options:
  - 監工驗收 B.行政核帳
  - 協調與支援 D.專業設計
  answer: C
- question: 4. 根據文中「約束丈夫、顧好工作」與「丈夫帶上妻子後有所收斂、能繼續接案」的說明，作者多次強調大嫂陪同的主要原因是什麼？
  options:
  - 強調工地人力缺乏，凸顯人力成本的可貴
  - 丈夫害怕大嫂外出工作會有問題
  - 作者認為一家人就必須要齊心協力一起工作
  - 大嫂的陪同可降低丈夫行為失控與工作風險
  answer: D
- question: 5. 下列哪一項是作者寫這篇文章的主要用意？
  options:
  - 介紹工地常見的輩份稱呼與新手求生禮儀
  - 男人粗野陽剛功夫一流，這是女人辦不到的
  - 說明大嫂在工地的弱勢，希望推動性別平等
  - 強調大嫂們在工地的重要貢獻，表達敬意
  answer: D
