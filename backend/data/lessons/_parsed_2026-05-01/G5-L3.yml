- A.強調工地人力缺乏，凸顯人力成本的可貴
- B.丈夫害怕大嫂外出工作會有問題
- C.作者認為一家人就必須要齊心協力一起工作
- D.大嫂的陪同可降低丈夫行為失控與工作風險
- （ D ）5. 下列哪一項是作者寫這篇文章的主要用意？
- A.介紹工地常見的輩份稱呼與新手求生禮儀
- B.男人粗野陽剛功夫一流，這是女人辦不到的
