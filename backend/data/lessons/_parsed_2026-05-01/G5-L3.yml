  options:
  - 強調工地人力缺乏，凸顯人力成本的可貴
  - 丈夫害怕大嫂外出工作會有問題
  - 作者認為一家人就必須要齊心協力一起工作
  - 大嫂的陪同可降低丈夫行為失控與工作風險
  answer: D
- question: 5. 下列哪一項是作者寫這篇文章的主要用意？
  options:
  - 介紹工地常見的輩份稱呼與新手求生禮儀
  - 男人粗野陽剛功夫一流，這是女人辦不到的
  - 說明大嫂在工地的弱勢，希望推動性別平等
  - 強調大嫂們在工地的重要貢獻，表達敬意
  answer: D
