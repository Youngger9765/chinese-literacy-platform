spotlight_raw_text: "文言聚光燈：一字多義：「聞」\n文言文類型\n記敘人物\t\n\n第9課  從天才跌為凡人的神童  \n學習單：\n王淑瑱\n古文今譯\n金谿地方有一個人名叫方仲永，他們家世代都以種田為業。仲永長到五歲時，不曾見過寫字的紙、筆，有一天，他忽然哭著求要紙、筆。他的父親很訝異這件事，就跟鄰居借來給他，他立刻寫了一首四句詩，並寫上自己的名字。\n這首詩是寫奉養父母、團結親族的意思，還傳給全鄉的秀才觀看。自從這件事後，指定任何事物叫他作詩，他都能立刻作出來，而且詩的文采和道理都很值得欣賞。鄉裡的人驚奇仲永的天才，漸漸地都以賓客之禮對待他父親。有的人會用錢來求他作詩，他的父親為了利益的緣故，天天拉著兒子四處拜訪鄉人，沒有讓他學習。\n我聽說他的事很久了，明道年間，我跟從父親回鄉，在舅舅家見過他，當時他大約十二、三歲。叫他作詩，寫的詩卻不如先前傳聞的那麼好。又過七年，我從揚州回來，又到舅舅家，問起他。舅舅說：「他的才能已經消失，變得跟普通人一樣了。\n\n宋朝・王安石\n  \n金谿民.方仲永，世.隸耕。仲永.生五年，未嘗.識書具，忽啼.求之。父異焉，借旁近.與之。即書.詩四句，並.自為\U000E01E1其名。\n其詩以.養\U000E01E1父母、收族為意，傳一\U000E01E2鄉秀才.觀之。自是.指物作詩.立就，其文理.皆有可觀者。邑人.奇之，稍稍賓客.其父，或以.錢幣.乞之。父.利其然也，日扳仲永.環謁於邑人，不使學。\n予\U000E01E1聞之.也久，明道中，從先人.還\U000E01E1家，於舅家.見之，十二三矣。令作詩，不能稱\U000E01E1.前時之聞。又七年，還\U000E01E1自揚州1，復到.舅家，問焉。曰：「泯然2.眾人矣。」\n487643185345注釋\n1.還自揚州：這個句子中的「還」意思是「回來」；「自」的解釋是「從」。配合後方的地名，整句翻譯成「從揚州回來」。\n2.泯然：消失的樣子。\n-4953038367\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。00\n1. 請用計時器，朗讀原文，並將讀完的時間記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！\n2. 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。\n\n第1次計時\n第2次計時\n第3次計時\n裁判計時\n秒\n秒\n秒\n秒\n\n裁判簽名:                \n\n◎"
