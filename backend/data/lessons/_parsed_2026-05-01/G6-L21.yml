title: 感情小日記6──我失戀了
authors: 課文/學習單：張筱晴
story_text: 今天的天氣很好，陽光灑在教室窗邊，心裡的烏雲好像也悄悄散開了一些。我以為，自己的心情應該還是沉悶的，但現在回想起來，雖然心裡仍有些說不出的感覺，但至少，已經能夠坦然地面對了。 那天中午，幾個同學圍在一起聊著，我本來沒留意，直到聽見了他的名字。有同學興奮的說：「他跟某某在一起了耶！」短短一句話，卻像是一顆石頭砸進湖面，讓我的心掀起一陣難以平息的波瀾。他有另一半了？怎麼可能？那我們的相處算什麼？為什麼他沒有告訴我？我試著讓自己若無其事的低頭吃飯，但心感覺空空的，又像是有一把火，嘴裡除了苦澀，什麼味道都嚐不出來。 我的心像被什麼狠狠撞了一下，混亂、震驚、失落，各種情緒交織在一起。這些日子以來的點點滴滴湧上心頭——我們之間的談話、他的笑容、那些讓我悸動的瞬間……這些感覺都還那麼清晰，可是現在，卻已遙不可及。會不會如果我夠勇敢，能早一點向他說出我的心意，我們也會有機會呢？只是如今，這條路，似乎還沒開始，就已經走到了盡頭。 晚上回到家，我癱倒在床上，盯著天花板發呆。原來，這就是失戀的感覺嗎？有點酸、有點苦，還夾雜著一絲不甘心。我不禁想，這些日子以來的心動，究竟算什麼？是不是我自作多情了？如果一開始就知道結果，我還會讓自己陷進去嗎？可是一想到過去相處的點滴，我又無法否認，至少在那些時刻，我是快樂的。 這些想法一直在我腦中拉扯，直到我把這件事告訴朋友。他聽完笑著說：「你是不是把這件事想得太悲壯了？喜歡一個人又不是什麼壞事。」我愣了一下，還沒來得及反駁，他又補充：「而且這代表你有能力去喜歡一個人，也代表你未來還會遇到更多值得喜歡的人，對吧？」這句話讓我沉默了。原來，我一直在想「失去」了什麼，卻忘了這段感情本身也是一種「擁有」。我曾經因為這份情感而開心，也曾經真心期待過——那麼，或許它就不是白費的。 現在回想起那個聽到消息的當下，已經沒有那麼刺痛了。雖然心裡還是會有點酸澀，但至少，我知道自己沒有白白浪費這段心情。我還是會喜歡那個勇敢去感受的自己，還是會欣賞那個如此美好的他。而或許，這場小小的失戀，也只是生命中的一場小雨，現在，天氣已經慢慢轉晴了。
