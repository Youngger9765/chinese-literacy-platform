- question: （ Ｃ ）3. 下列何者為本文主旨？
  options:
  - 不要隨意公開關係，八卦消息經常對戀情帶來負面影響 B.暗戀就好，不應該主動告白，否則可能連朋友都做不成 C.感情的結果無法控制，但曾經喜歡也是一種成長與擁有 D.青少年心智尚未成熟，不應該過早投入情感，以免受傷
  answer: C
- question: 4. 本文在第一段提到「陽光灑在教室窗邊，心裡的烏雲好像也悄悄散開」，最後一段則寫「這場小小的失戀，也只是生命中的一場小雨，現在，天氣已經慢慢轉晴了」，這種寫法最主要的作用是什麼？
  options:
  - 強調近期天氣多變化，連帶影響作者的心情起伏
  - 凸顯人生有晴有雨，太在意外在變化是自討苦吃
  - 利用不同心情來傳達不同晴、陰、雨帶來的感受
  - 以天氣變化象徵情緒轉變為正向，形成首尾呼應
  answer: D
