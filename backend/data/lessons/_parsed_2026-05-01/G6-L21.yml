vocabulary:
- word: 苦澀
  definition: 原指味道苦，引申心裡感到痛苦、難受。
- word: 拉扯
  definition: 原指用力拉，比喻內心有矛盾或被不同方向的力量強烈影響。
- word: 酸澀
  definition: 原指味道酸苦，引申為心情複雜、難受。
- word: 難以平息 _
  definition: 指情緒或事件激烈，一時之間無法冷靜或結束。
- word: 反駁
  definition: 回應別人的話語，指出對方錯誤、提出不同意見。
- word: 波瀾
  definition: 原指水面上的大浪，比喻事情的起伏、變動或重大事件。
- word: 交織
  definition: 多種東西同時出現、重疊，常用來形容情感或狀況。
- word: 遙不可及 _
  definition: 形容目標或事物非常遠，幾乎無法達到。
- word: 悲壯
  definition: 充滿勇氣，但結局悲慘。
- word: 沉悶
  definition: 氣氛或心情壓抑、無趣、不開心。
