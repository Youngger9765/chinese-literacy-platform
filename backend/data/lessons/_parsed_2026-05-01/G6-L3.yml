spotlight_raw_text: "閱讀聚光燈\n解決問題──以實驗觀察找答案任務：請你依據提出的科學問題，根據觀察到的證據，找到結論。\n提出\n問題\n空氣是否佔有空間？ \n動物會不會分工合作呢？\n觀察到的證據\n1.把杯子放入裝滿水的杯子中，用打氣筒往杯子裡打氣，發現水被擠出杯子外。\n2.把紙團緊緊塞在杯子底部，垂直放入水中，再拿出來，發現紙團沒有被水弄濕。\n3.扁平的籃球，打入空氣後，球逐漸膨脹。\n4.其他你知道的例子：\n洋芋片裡面有空氣。                （答案合理都可以    ）\n                         \n1.螞蟻中的蟻后負責產卵，工蟻負責照顧幼蟲與覓食，兵蟻負責防禦外敵。\n2.臺灣獼猴會有一隻雌猴帶領大家覓食，一隻雄猴負責保護猴群，調解猴子之間的紛爭。\n3.其他你知道的例子：\n蜜蜂的蜂后和雄蜂負責繁衍後代，工蜂負責覓食和照顧幼蟲。      （可以鼓勵學生從書中或網路寫上例子）\n結論\n空氣佔有空間。\n□空氣不佔有空間。\n動物會分工合作。\n□動物不會分工合作。\n51276546100\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。00\n請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。27305337\n七"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 解決問題：以實驗觀察找答案
  instruction: 請你依據提出的科學問題，根據觀察到的證據，找到結論。
  reasoning: 此練習旨在引導學生透過觀察證據來推導科學結論。原文提供了兩個科學問題，每個問題都附有觀察到的證據，並要求學生選出或提出結論。我將每個主要問題的結論部分轉換為選擇題，並將「其他你知道的例子」轉換為開放式問題，以鼓勵學生進一步思考和提供證據。
  steps:
  - prompt: 空氣是否佔有空間？
    type: select
    options:
    - 空氣佔有空間。
    - 空氣不佔有空間。
    answer: 0
    reasoning: 根據原文「觀察到的證據」：1. 把杯子放入裝滿水的杯子中，用打氣筒往杯子裡打氣，發現水被擠出杯子外。2. 把紙團緊緊塞在杯子底部，垂直放入水中，再拿出來，發現紙團沒有被水弄濕。3. 扁平的籃球，打入空氣後，球逐漸膨脹。這些證據都指向空氣佔有空間，因此「空氣佔有空間。」是正確結論。
  - prompt: 請舉出其他你知道的例子，證明空氣佔有空間。
    type: free_text
    reasoning: 此題旨在鼓勵學生從日常生活中聯想並提出更多支持「空氣佔有空間」的證據，例如原文中提到的「洋芋片裡面有空氣」。
  - prompt: 動物會不會分工合作呢？
    type: select
    options:
    - 動物會分工合作。
    - 動物不會分工合作。
    answer: 0
    reasoning: 根據原文「觀察到的證據」：1. 螞蟻中的蟻后負責產卵，工蟻負責照顧幼蟲與覓食，兵蟻負責防禦外敵。2. 臺灣獼猴會有一隻雌猴帶領大家覓食，一隻雄猴負責保護猴群，調解猴子之間的紛爭。這些證據都顯示動物有明確的分工合作行為，因此「動物會分工合作。」是正確結論。
  - prompt: 請舉出其他你知道的例子，證明動物會分工合作。
    type: free_text
    reasoning: 此題旨在鼓勵學生從書本、網路或自身觀察中，提出更多支持「動物會分工合作」的例子，例如原文中提到的「蜜蜂的蜂后和雄蜂負責繁衍後代，工蜂負責覓食和照顧幼蟲」。
