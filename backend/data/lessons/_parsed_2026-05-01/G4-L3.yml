spotlight_raw_text: "閱讀聚光燈\n遞進複句\n\n    「我愛吃冰棒，更愛吃冰淇淋。」在這兩個句子裡，「後一句」比「前一句」有更大的強度，像這樣的句子，就是遞進複句。後一句通常數量更多、時間更長、程度更深、範圍更廣。遞進複句可以表達由小到大、由簡單到複雜…等等的描述。\n\
  \    常見的遞進複句使用的連接詞有:「還」、「更」、「不但…還…」、「不只…更…」、「不但…而且…」、「除了…還…」。\n2514600167500◎"
strategy_exercise:
  type: guided_steps
  strategy_name: 閱讀聚光燈 - 遞進複句
  instruction: 本練習將引導你認識遞進複句的定義、特徵與常見連接詞。
  reasoning: 此練習旨在幫助學生理解遞進複句的語法結構與表達功能，並辨識其常見連接詞，所有題目皆根據原文內容設計。
  steps:
  - prompt: 根據原文，下列哪一個選項最能說明「遞進複句」的特徵？
    type: select
    options:
    - 後一句比前一句有更大的強度。
    - 前後兩句表達相反的意思。
    - 前後兩句表達並列關係。
    - 後一句是前一句的結果。
    answer: 0
    reasoning: 原文明確指出：「在這兩個句子裡，『後一句』比『前一句』有更大的強度，像這樣的句子，就是遞進複句。」
  - prompt: 遞進複句的「後一句」通常具有哪些特點？
    type: select
    options:
    - 數量更多、時間更長、程度更深、範圍更廣。
    - 數量更少、時間更短、程度更淺、範圍更窄。
    - 與前一句的內容完全相同。
    - 表達對前一句的否定。
    answer: 0
    reasoning: 原文說明：「後一句通常數量更多、時間更長、程度更深、範圍更廣。」
  - prompt: 遞進複句可以用來表達哪種描述？
    type: select
    options:
    - 由小到大、由簡單到複雜。
    - 由大到小、由複雜到簡單。
    - 前後兩件事的因果關係。
    - 前後兩件事的選擇關係。
    answer: 0
    reasoning: 原文說明：「遞進複句可以表達由小到大、由簡單到複雜…等等的描述。」
  - prompt: 下列哪一組連接詞是遞進複句常見的用法？
    type: select
    options:
    - 還、更、不但…還…、不只…更…、不但…而且…、除了…還…。
    - 因為…所以…、雖然…但是…。
    - 如果…就…、只要…就…。
    - 不是…就是…、與其…不如…。
    answer: 0
    reasoning: 原文明確列出：「常見的遞進複句使用的連接詞有:『還』、『更』、『不但…還…』、『不只…更…』、『不但…而且…』、『除了…還…』。」
