multiple_choice:
- question: 1. 請問文中第四段提到「適當的運動也是要長高相當重要的一環。」請問「一環」最可能的解釋是什麼?
  options:
  - 圓形而中空的東西（玉環） B.指事物的關鍵
  - 圍繞（環繞） D.玉石雕的圓形圈子（玉環）
  answer: B
- question: 2. 小承恩不喜歡他的外號的原因是什麼？
  options:
  - 因為他討厭承恩這個名字 B.因為他討厭大承恩
  - 因為身高矮而自卑 D.因為都坐在第一排
  answer: C
- question: 3. 長高的關鍵原因何者正確？（第二段）
  options:
  - 轉骨湯是有效的民間偏方 B.激烈運動有助於骨骼生長
  - 要熬夜才能分泌生長激素 D.攝取足夠且多樣的營養素
  answer: D
- question: 4. 根據本文，請問促進成長的運動，下列何者配對錯誤？
  options:
  - 有氧運動慢跑 B.肌力訓練弓箭步
  - 跳躍刺激生長板游泳（第四段）D.伸展運動瑜珈
  answer: C
- question: 5. 下列何者是最符合均衡飲食的菜盤？（少了肉類及蔬菜）
  options:
  - 白飯+菠菜+雞胸肉+杏鮑菇 B.一盤蛋炒飯
  - 時蔬清炒義大利麵。 D.滷肉飯+豆干+貢丸湯
  answer: A
