vocabulary:
- word: 均衡
  definition: 相等、平衡，一樣多的。
- word: 前提
  definition: 事情應該先注意的部分或先決定的條件。
- word: 嘰嘰喳喳
  definition: 吵雜細碎的說話聲。
- word: 根據
  definition: 按照、依據。
- word: 富含
  definition: 充足的、豐富的。
- word: 攝取
  definition: 吸收、吸取。
- word: 分泌
  definition: 身體內部製造和釋放有用的液體或物質的過程。
- word: 促進
  definition: 促使加快發展。
- word: 迷思
  definition: 聽起來很有說服力或一般大眾相信的觀念，但實際上是錯誤的。
- word: 大幅度
  definition: 改變或變動的程度很大。
