fill_in_blank:
- sentence: 這兩款手機雖然外觀設計（　　），但內部的功能和操作系統還是有些許不同。
  answer: A
- sentence: 老師在我們上台前給了我們一個微笑，感覺好像獲得了無形的力量（　　），讓我們更有信心。
  answer: B
- sentence: 媽媽每天辛苦工作，還要照顧我們，家裡的經濟重擔都由她一個人（　　）著。
  answer: C
- sentence: 雖然這次考試考差了，但我決定努力準備下次，希望用優異的表現來（　　）這次的失落感。
  answer: D
- sentence: 為了保持身材，哥哥每天早上都會在家裡做一些伏地挺身和仰臥起坐，這種（　　）對場地和器材都沒有限制。
  answer: E
- sentence: 經過同學們幾個月的努力，這次為社區募款的活動（　　），遠超過預期的目標。
  answer: F
- sentence: 科學家們透過不斷的實驗和觀察，收集了大量的（　　），以便分析和歸納出新的發現。
  answer: G
- sentence: 射箭選手經過不斷練習，每次都能將箭射到靶心，他的技術可說是十分（　　）。
  answer: H
- sentence: 運動會比賽輸了之後，小明感到非常（　　），好幾天都提不起精神。
  answer: I
multiple_choice:
- question: 請問第二段提到：「每一項獨立出來都是很不錯的徒手訓練運動」，句中『徒手』下列那一句使用不當?
  options:
  - 爸爸很厲害，可以徒手攀岩高山。
  - 哥哥徒手打死一隻狼，非常勇猛。
  - 媽媽徒手炒出了一桌豐盛的晚餐。
  - 員警徒手與歹徒搏鬥，終於將他制服。
  answer: C
  explanation: 炒菜需要工具，無法空手進行。
- question: 請問蒼藍鴿認為埼玉老師的訓練菜單有效嗎？為什麼？
  options:
  - 有效，因為記者親身體驗，身材有明顯改善。
  - 無效，因為這四種方式同時訓練是有衝突的。（第二段）
  - 有效，因為徒手運動改善了身材與減輕體重。
  - 無效，因為只對琦玉老師一人有效，無法推廣。
  answer: B
  explanation: 第二段
- question: 運動科學對體育選手最主要的幫助是什麼？
  options:
  - 幫助選手了解自身的問題，進而改善。（第三段）
  - 實際測量選手的身形，紀錄體重變化。
  - 幫忙選手統計專項運動需要做的次數。
  - 目前只在羽球及馬拉松領域有所成效。
  answer: A
  explanation: 第三段
- question: 有關運動科學的敘述，下列何者正確？
  options:
  - 每個人都可以成為專業的運動選手。
  - 運動科學可以找出最適合每個人的運動模式。
  answer: C
  explanation: 第五段：不一定可以成為運動選手
