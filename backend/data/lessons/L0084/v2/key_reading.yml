passage: 心理學家阿德勒有句名言：「幸福的人用童年治癒一生，不幸的人用一生治癒童年。」或許楊喚也是如此。但令人感佩的是，他不僅嘗試治癒自己的童年，也將這份對幸福的渴望化為文字，希冀能滋養更多在困苦煎熬中成長的孩子，讓他們也能擁有一方心靈與想像都富足美好的天地。
