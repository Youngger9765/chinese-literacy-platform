passage: '正是這樣的過去，讓楊喚特別熱衷於兒童文學創作。然而童詩創作收入微薄，有朋友建議他轉換方向，但他分享道：「童話最難寫，兒童詩更難寫，但我願意學習，因為這樣，我便可以找到失去的快樂了，能和可愛的孩子們一道哭，一道笑了。」一個從未擁有幸福快樂童年的人，卻傾盡畢生力氣，為所有和他一樣經歷苦難的孩子，在文字中打造無憂無慮的童年王國。楊喚的這份心意，直到現在我才讀懂。

  心理學家阿德勒有句名言：「幸福的人用童年治癒一生，不幸的人用一生治癒童年。」或許楊喚也是如此。但令人感佩的是，他不僅嘗試治癒自己的童年，也將這份對幸福的渴望化為文字，希冀能滋養更多在困苦煎熬中成長的孩子，讓他們也能擁有一方心靈與想像都富足美好的天地。'
