spotlight:
  lesson: G7-L16
  strategy_name: 寫作手法：排比─從排比歸納文意重點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: '當文章連續出現三個或以上，結構相似、語意相關的詞組或句子，就形成「排比」。排比常會重複相同的詞語或句型，它能增加文句氣勢、加強論點，也更能呈現事件具體、多元的樣貌。請看以下例子：

      1.增加氣勢──「我們要追求進步，不怕困難，不懼挑戰，不畏艱險。」

      2.呈現具體、多元樣貌──「公園裡充滿春天來臨的氣息，柳樹正輕輕搖曳，花兒正散發芬芳，蝴蝶正翩翩起舞。」

      而閱讀排比句時，我們可以從排比句歸納、推論作者想強化的重點，如第1句強調的是「勇於面對困難」，第2句則著重於「春天來臨」。歸納後，就可將理解重點聚焦於統整後的結果，而不侷限在排比句中所提到的細節和面向。閱讀排比時，可以用四個步驟歸納重點：

      ❶察覺排比句型：圈出重複的詞語或相似結構。

      ❷細讀內容：看每一句分別寫了什麼。

      ❸找到異同：找出內容的共同點或差異。

      ❹歸納重點：把比較結果合成一句話，說出作者想強調什麼。'
  - type: guide
    text: 以下我們一起來看看〈長大後，我才讀懂夏夜〉課文中的三組排比句：
  - type: guide
    text: 練習一
  - type: passage
    source: unknown
    paragraphs:
    - (段一)當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，音樂驚悚、畫面黯淡時，會聽到有人低語著「來了！來了！」。
  - type: fill_table
  - type: guide
    text: 練習二
  - type: passage
    source: unknown
    paragraphs:
    - (段二)羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？
  - type: fill_table
  - type: guide
    text: 練習三
  - type: passage
    source: unknown
    paragraphs:
    - (段三)讀到「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；讀到「街燈亮起來向村莊道過晚安」，更常是我在店裡忙得不可開交之時；讀到「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。
  - type: fill_table
  - type: guide
    text: 讀到排比句時，我會：
  - type: self_check
    items:
    - 找出重複的句型。
    - 分清每一句寫了什麼。
    - 比較內容的共同點或差異。
    - 用一句話歸納作者想強調的重點。
