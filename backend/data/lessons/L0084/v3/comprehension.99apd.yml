lesson_uid: L0084
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列語詞何者使用正確？
    options:
      A: 藉由這次旅行，我真正「領略」到大自然的壯麗
      B: 此處山區交通不便，許多家庭的經濟十分「乏味」
      C: 這座小山的高度十分「微薄」，半小時就能走到山頂
      D: 孩子們在音樂聲中開心的「面面相覷」，充滿了歡樂
    explanation: (B)宜改為「貧乏」(C)宜改為「順其自然」(D)宜改為「手舞足蹈」
    explanation_note: '⚠️ (C) 的建議用詞是「順其自然」，但該選項講的是山的高度，語意上像是該用

      「微不足道」之類 —— 原稿如此，照抄不改（改了等於替教材做決定）。'
  - index: 2
    answer: C
    stem: 第三段中「小時候的我看世界，總戴著一副想像的眼鏡，從眼鏡裡看出的是一個童稚的世界……然而這眼鏡，隨著年紀增長漸漸模糊失效，放眼望去都僅是習以為常的乏味景象。」關於此段的解讀下列何者正確？
    options:
      A: 這副眼鏡幫助作者逃離學習的壓力和辛苦的生活
      B: 眼鏡隨年紀增長而模糊是因為作者近視度數加深
      C: 作者長大後對所見感到乏味是因為對世界失去新鮮感和好奇
      D: 作者小時候比同年孩子更幼稚，總是想像自己戴著眼鏡
    explanation: C.從「放眼望去都僅是習以為常的乏味景象」可知。
    stem_note: 題幹引用課文第 3 段但標點與斷句略有出入（課文是「漸漸模糊失效；放眼望去，所見的都只是…」），照原稿
  - index: 3
    answer: B
    stem: 根據本文對〈夏夜〉與其作者楊喚的描述，下列敘述何者正確？
    options:
      A: 「來了！來了！」是在營造緊張不安的氛圍
      B: 「羊隊和牛群告別了田野回家了」運用擬人修辭
      C: 楊喚童年曾有祖母陪伴，常在睡前聽她說故事
      D: 楊喚的朋友曾鼓勵他繼續專心投身兒童文學創作
    explanation: 'A.由第一段可知是喜悅的氛圍

      C.由第四段可知楊喚的童年缺乏溫暖

      D.由第五段可知朋友曾勸他改變方向'
    explanation_note: 原稿是三個各自獨立的文字方塊（A／C／D），本欄合成一段
  - index: 4
    answer: C
    stem: 關於本文作者閱讀〈夏夜〉及認識楊喚後的轉變，下列敘述何者正確？
    options:
      A: 作者長大後對老師的詮釋感同身受，因此喜歡〈夏夜〉
      B: 作者長大後知道楊喚童年十分辛苦，因此深有共鳴
      C: 作者從困惑、羨慕，轉為理解〈夏夜〉並感佩楊喚
      D: 作者認為楊喚持續創作兒童詩僅是為了療癒自己
    explanation: '(A)由第一段可知當時無法理解

      (B)並未表達共鳴(D)不僅為了自己，也為了其他孩子。'
  - index: 5
    answer: D
    stem: 「燕子去了，有再來的時候；楊柳枯了，有再青的時候；桃花謝了，有再開的時候。」（朱自清〈匆匆〉），下列何者最能歸納這組排比句的共同意思？
    options:
      A: 對時間一去不復返的感慨
      B: 讚美春天景物呈現繽紛色彩
      C: 比較三種自然景物的特色
      D: 營造生命循環反覆的希望
    options_note: 四個選項印成兩行、每行兩個（A／B 一行，C／D 一行），中間以全形空格分隔
    explanation: 排比句型為：……了，有再……的時候，「燕子去了」、「楊柳枯了」、「桃花謝了」，可歸納為生命消逝，而「來」、「青」、「開」可歸納為生命出現。因此答案選(D)
  notes:
    answer_carrier: 橘色手寫代號（字元樣式 af），文字流有此資訊
    teacher_note_carrier: 深藍色（0F4761）文字方塊，印在題目附近；五題都有
