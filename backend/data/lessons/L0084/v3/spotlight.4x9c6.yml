spotlight:
  strategy_name: 寫作手法──從排比歸納重點
  strategy_type: writing_technique
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，9 個）＋ 橘色手寫填空（字元樣式 af）
  blocks:
  - type: concept_box
    text: '當文章連續出現三個或以上，結構相似、語意相關的詞組或句子，就形成「排比」。排比常會重複相同的詞語或句型，它能增加文句氣勢、加強論點，也更能呈現事件具體、多元的樣貌。請看以下例子：

      1.增加氣勢──「我們要追求進步，不怕困難，不懼挑戰，不畏艱險。」

      2.呈現具體、多元樣貌──「公園裡充滿春天來臨的氣息，柳樹正輕輕搖曳，花兒正散發芬芳，蝴蝶正翩翩起舞。」

      而閱讀排比句時，我們可以從排比句歸納、推論作者想強化的重點，如第1句強調的是「勇於面對困難」，第2句則著重於「春天來臨」。歸納後，就可將理解重點聚焦於統整後的結果，而不侷限在排比句中所提到的細節和面向。閱讀排比時，可以用四個步驟歸納重點：

      ❶察覺排比句型：圈出重複的詞語或相似結構。

      ❷細讀內容：看每一句分別寫了什麼。

      ❸找到異同：找出內容的共同點或差異。

      ❹歸納重點：把比較結果合成一句話，說出作者想強調什麼。'
  - type: guide
    text: 以下我們一起來看看〈長大後，我才讀懂夏夜〉課文中的三組排比句：
  - type: sub_block
    label: 練習一
    value: (段一)當上課前大家玩鬧不休，而突然聽到老師逼近的腳步聲時，大家會面面相覷說道「來了！來了！」；當心儀對象迎面走來，即將和自己擦身而過時，會聽見身旁損友竊笑「來了！來了！」；當三五好友一起壯膽看恐怖片，音樂驚悚、畫面黯淡時，會聽到有人低語著「來了！來了！」。
    value_note: 引用課文第 1 段，但少了一個「在」（課文是「在音樂驚悚」），照原稿
    items:
    - sub_label: ❶察覺排比句型
      value: 當……時，會……
      keywords:
      - 當……時，
      - 會……
      keywords_label: 句型關鍵詞
    - sub_label: ❷細讀內容
      value: '①上課前大家玩鬧不休

        ②心儀對象迎面走來

        ③三五好友一起壯膽看恐怖片'
      value_right: '面面相覷說道「來了！來了！」

        ②會聽見身旁損友竊笑「來了！來了！」

        ③會聽到有人低語著「來了！來了！」'
      value_right_note: 右欄第一項原稿沒有印「①」（第二、三項有 ②③），照原稿
    - sub_label: ❸找到異同(單選)
      options_1:
        1: 隻身一人
        2: 好友成群
      answer_1: 2
      options_2:
        1: 固定時機
        2: 各種時機
      answer_2: 2
      value_3: 3.都有人說【來了！來了！】
    - sub_label: ❹歸納重點(依序填入比較結果)
      value: '在【　】的【　】時機，

        都有人說【　】'
      blanks:
      - answer: 好友成群
      - answer: 各種
      - answer: 來了！來了！
      value_note: '原稿的三個空格印成【1　】【2　】【3　】（框內帶序號，對應「依序填入比較結果」）。

        這裡寫成一般的【　】，序號由 blanks 的順序表達 ——

        把序號留在框內會讓逐字門切不開那個空格（`（　）`／`【　】` 才是它認得的斷點）。'
    - sub_label: 呼應前文
      value: 那句「來了！來了！」可以千變萬化，可以在不同時機派上用場。
  - type: sub_block
    label: 練習二
    value: (段二)羊隊和牛群不是本來就會回家嗎？綠色的小河不是一直都在歌唱嗎？螢火蟲不是原本就提著燈嗎？
    items:
    - sub_label: ❶察覺排比句型
      value: ……【　】……【　】
      blanks:
      - answer: 不是
      - answer: 嗎？
      keywords:
      - ……不是
      - ……嗎？
      keywords_label: 句型關鍵詞
    - sub_label: ❷細讀內容
      value: '①羊隊和牛群

        ②綠色的小河

        ③螢火蟲'
      value_right: '①本來就會回家

        ②一直都在歌唱

        ③原本就提著燈'
    - sub_label: ❸找到異同(單選)
      value_1: 三句皆為作者童年
      options_1:
        1: 日常常見
        2: 罕見奇特
      answer_1: 1
      value_1_tail: 的景象
      value_2: 2.皆為
      options_2:
        1: 人類動作
        2: 動物/自然動作
      answer_2: 1
      value_3: 3.三句都用反問，表示作者覺得這些現象
      options_3:
        1: 本來如此
        2: 出乎意料
      answer_3: 1
    - sub_label: ❹歸納重點(依序填入比較結果)
      value: 作者小時候把詩人的擬人描寫視為【　】，因此不明白為什麼老師會說這些句子用了【　】的手法？
      blanks:
      - answer: 理所當然
      - answer: 擬人
    - sub_label: 呼應前文
      value: 困惑的是，為什麼許多句子都是「擬人」呢？
  - type: sub_block
    label: 練習三
    value: (段三)讀到「火紅的太陽也滾著火輪子回家了」，我得匆忙趕回去幫忙家裡的生意；讀到「街燈亮起來向村莊道過晚安」，更常是我在店裡忙得不可開交之時；讀到「小雞和小鴨們關在欄裡睡了」，就是我和蚊子決鬥的時刻。
    value_note: 引用課文第 4 段，第二句少了「當」（課文是「當街燈亮起來」），照原稿
    items:
    - sub_label: ❶察覺排比句型
      value: 讀到……，我……
      keywords:
      - 讀到……
      - ，我……(後句)
      keywords_label: 句型關鍵詞
    - sub_label: ❷細讀內容
      value: '①火紅太陽也滾著火輪子回家了

        ②當街燈亮起來向村莊道過晚安

        ③小雞和小鴨們關在欄裡睡了'
      value_right: '①我得匆忙趕回去幫忙家裡的生意

        ②常是我在店裡忙得不可開交之時

        ③就是我和蚊子決鬥的時刻'
    - sub_label: ❸找到異同(單選)
      value_1: 1.從文字可以判斷此處是引用楊喚【　】的原文
      blanks_1:
      - answer: 〈夏夜〉
      value_2: 2.這裡的「我…」皆為
      options_2:
        1: 本文作者的日常
        2: 楊喚的日常
      answer_2: 1
      value_3: 3.「我…」的時間點與〈夏夜〉
      options_3:
        1: 相同
        2: 相異
      answer_3: 1
      value_4: 4.情景與〈夏夜〉
      options_4:
        1: 相同
        2: 相異
      answer_4: 2
    - sub_label: ❹歸納重點(依序填入比較結果)
      value: 〈夏夜〉描寫的溫馨情景，與本文作者同一時間的忙碌日常不同，本文作者當時以為
      options:
        1: 自己
        2: 楊喚
      answer: 2
      value_tail: 比較幸福。
    - sub_label: 呼應前文
      value: 而羨慕的是，楊喚的童年大概特別幸福吧。
  - type: self_check
    label: ◎自我檢核
    instruction: 讀到排比句時，我會：
    items:
    - 找出重複的句型。
    - 分清每一句寫了什麼。
    - 比較內容的共同點或差異。
    - 用一句話歸納作者想強調的重點。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
