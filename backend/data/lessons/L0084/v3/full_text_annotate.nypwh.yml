    lines:
    - 蝴蝶和蜜蜂們帶著花朵的蜜糖回來了，
    - 羊隊和牛群告別了田野回家了，
    - 火紅的太陽也滾著火輪子回家了，
    - 當街燈亮起來向村莊道過晚安，
    - 夏天的夜就輕輕地來了。
    - 來了！來了！
    - 從山坡上輕輕地爬下來了。
    - 來了！來了！
    - 從椰子樹梢上輕輕地爬下來了。
    - 撒了滿天的珍珠和一枚又大又亮的銀幣。
    - 美麗的夏夜呀！
    - 涼爽的夏夜呀！
    - 小雞和小鴨們關在欄裡睡了。
    - 聽完了老祖母的故事，
    - 小弟弟和小妹妹也闔上眼睛走向夢鄉
    - (小妹妹夢見她變做蝴蝶在大花園裡忽東忽西地飛，
    - 小弟弟夢他變做一條魚在藍色的大海裡游水。)
    - 睡了，都睡了！
    - 朦朧地，山巒靜靜地睡了！
    - 朦朧地，田野靜靜地睡了！
    - 只有窗外瓜架上的南瓜還醒著，
    - 伸長了藤蔓輕輕地往屋頂上爬。
    - 只有綠色的小河還醒著，
    - 低聲地歌唱著溜過彎彎的小橋。
    - 只有夜風還醒著，
    - 從竹林裡跑出來，
    - 跟著提燈的螢火蟲，
    - 在美麗的夏夜裡愉快地旅行。
    lines_note: 第 13 行與第 14 行之間原稿有數個空行（分節），本欄不另立段落
