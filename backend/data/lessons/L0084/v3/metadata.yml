strategy_explained: '這一課我們要練習的是，透過作者不斷重複說的那些句子，去抓住文章最想告訴你的重點

  這篇文章裡，作者用「來了！來了！」這樣重複的說法，來寫出詩中那種歡樂的感覺，很適合我們練習怎麼從重複的句子裡，找到文章的核心意思

  讀的時候，你可以注意作者用了哪些重複的詞句，然後想想這些重複是不是在強調某種情感或情境，進而了解作者想表達的意涵'
