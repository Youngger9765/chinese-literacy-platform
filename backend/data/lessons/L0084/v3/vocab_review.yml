  geometry_check: '全檔 `a:prstGeom prst="roundRect"` **13 個**（遞迴到 `wps:wsp`，不是數 anchor），

    而且**全部錨在找字格子裡**（9 個裝在一個群組「群組 129」內、錨點在格子 (2,1)；

    另外 4 個是獨立 anchor，分別錨在 (5,4)／(9,7)／表格層）——

    範圍已經限對，不是「全檔到處都是」的那種雜訊。


    ⚠️ **13 > 12 個目標語詞，這是「>」方向、屬於真警報**，而我**沒有把它收斂掉**：

    要判斷第 13 個是多出來的圈、還是某個裝飾框，需要看那一頁的像素，而本課刻意不讀圖。

    如實記錄，不下結論。

    ⛔ 這個警報**不影響上面 12 條路徑的正確性** —— 那 12 條是窮舉格子得到的唯一解，

    與圖形個數無關；就算第 13 個真的是一個圈，它也不可能圈出任何一個目標語詞的第二種擺法

    （因為每個詞在格子裡只有一種擺法）。'
  notes:
    target_words: 灰框的順序與第三大題語詞框不同（灰框把「領略」排在第 5、語詞框排在第 11），照各自原樣
    answers: '🔴 **這 12 條路徑是「窮舉格子」解出來的，不是讀圖讀出來的。**

      本課先前燒掉兩個 worker（兩次都在讀圖階段以 content filtering 結束），

      所以本次一頁圖都沒讀。改用的方法與它為什麼可信：


      **方法**：拿 `document.xml` 取到的 10×10 格子，對 12 個目標語詞做**八方向窮舉搜尋**

      （橫／直／四斜／反向），列出每個詞在格子裡所有拼得出來的位置。

      **結果：12 個詞每一個都只有唯一一種擺法**（沒有一個詞出現兩次、也沒有一個詞拼不出來）。

      唯一解 ⇒ 圈只可能圈在那裡，不需要看圖也不需要臆測。


      **獨立交叉驗證（方向組成）**：解出來的 12 條裡有 **4 條是斜的**

      （驚悚／習以為常／領略／傾盡）。而 XML 裡的圈選圖形**恰好有 4 個帶非直角旋轉**

      （rot 43.3°／50.2°／311.6°／319.5°），其餘都是 0°／90°／270°。兩邊相符。


      **座標門是最終判準**：`normalize_word_search.py` 會把 cells 套回 grid 取字，

      拼不回 word 就 FAIL —— 12 條全綠。'
