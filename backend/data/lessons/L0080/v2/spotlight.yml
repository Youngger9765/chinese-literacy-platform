spotlight:
  lesson: G7-L12
  strategy_name: 用表格整理訊息-比較兩者異同
  strategy_type: comparison
  blocks:
  - type: guide
    text: '當文章同時介紹兩個對象，而且訊息很多時，可以用「比較表」把相同主題的資料放在一起。這樣不但容易看出相同點和不同點，也能根據差異歸納文章重點。

      畫表格

      整理表格步驟：

      ❶找對象：找出文章要比較的兩個對象，寫在最上面一列。

      ❷找項目：找出兩邊都能比較的重點，寫在最左邊一欄。

      ❸填訊息：只根據文章，把資料填進對應的格子。

      ❹下結論：比較各格資料，用一句話說出重要差異及可能原因。

      總結：根據這個表格進行分析，提出結論。'
  - type: guide
    text: ◎小試身手：
  - type: passage
    source: unknown
    paragraphs:
    - 讀完文章後，你是不是發現澳洲與臺灣有許多不同的地方？現在我們要來練習整理文章的訊息，幫助你更能抓住文章重點！表格已經畫好，請依照上列步驟第❷至第❹步完成。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 總結：由上表可知：澳洲的人口數與臺灣差不多，但是澳洲對體育非常重視，體育設施的建設也比臺灣多，家長也重視體育，            所以這可能是澳洲得獎牌多於臺灣的原因。（答案合理即可）
