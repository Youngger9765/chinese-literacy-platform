comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 學校為了節省支出，「斥資」兩千元買了一盒彩色筆。
      B: 臺灣的社區普遍「井井有條」，地下水資源豐富
      C: 因為有全家人的支持，讓他沒有「後顧之憂」，可以專心工作
      D: 這所學校「幅員遼闊」，從前門就可以看到後門
    rationale: null
  - index: 2
    answer: A
    stem: 澳洲政府成立國家運動中心，主要的用意為何？
    options:
      B: 成為未來舉辦國際賽事的場地
      C: 培養運動員良好、健全的品格
      D: 讓運動員退役後能進入社區教學
      A: 第二段提到，為了培育更多有潛力的運動員。
    rationale: 第二段提到，為了培育更多有潛力的運動員。
    is_rationale: true
  - index: 3
    answer: B
    stem: 下列何者不是澳洲奪得眾多獎牌的原因？
    options:
      B: 主要由各級學校體育班集中培養少數學生選手
      C: 學校課程時間短，家長鼓勵孩子課後投入運動
      D: 社區有各種運動俱樂部，由退役運動員當教練
    rationale: 氣候宜人是澳洲人喜歡運動的原因，人口數與臺灣相距不遠。
  - index: 4
    answer: D
    stem: 比較澳洲與臺灣的體育環境，下列何者正確？
    options:
      A: 面積差距很大
      B: 人口數差不多
      C: 家長都把課業看得比體育重要
      D: 澳洲推動體育的力量較多元
    rationale: null
  - index: 5
    answer: D
    stem: 臺灣或許可以學習澳洲的成功經驗。請問何者不是澳洲帶給臺灣的啟示？
    options:
      A: 鼓勵社區增設運動俱樂部，讓更多人參與體育
      B: 善用退役運動員進入社區，做更多人才的篩選與訓練
      C: 教育家長改變「重學科、輕體育」的態度
      D: 讓體育資優選手進體育班，接受長時嚴格訓練
    rationale: 目前臺灣是用此方法，澳洲更推崇人人熱愛運動，從此找出選手。
