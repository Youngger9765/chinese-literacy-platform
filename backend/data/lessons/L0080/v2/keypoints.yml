keypoints:
  lesson: G7-L12
  structure: nested
  columns:
  - label
  - sub_label
  - value
  rows:
  - label: 澳洲全民重視體育
    sub_rows:
    - sub_label: 人民
      template: 經常自發運動。
      blanks: []
    - sub_label: 政府
      template: '設立了__的體育系統。

        1.__設置體育場設施、體育場館、學校。

        2.成立__，提供專業的科學訓練及獎學金。'
      blanks:
      - answer: 完善
        hint: ''
      - answer: 斥資
        hint: ''
      - answer: 國家運動中心
        hint: ''
    - sub_label: 學校
      template: '1.學生有__的課後時間進行體育活動

        2.經常舉辦校內、校際的體育競賽。'
      blanks:
      - answer: ①充足□②少量
        hint: ''
    - sub_label: 家長
      template: 熱衷讓孩子運動，以鍛鍊孩子身心，培養重要__。
      blanks:
      - answer: 品格
        hint: ''
  - label: 運動選手生涯
    sub_rows:
    - sub_label: 培育階段
      template: '(1)社區俱樂部常舉辦體育競賽，依年齡與水準分級。

        (2)表現__者，可持續晉級，有機會成為兼職或全職的運動員，或進入國家代表隊。'
      blanks:
      - answer: 優異
        hint: ''
    - sub_label: 退役後
      template: '(1)可從事其他或原本的職業

        (2)回到社區俱樂部當__。'
      blanks:
      - answer: 教練
        hint: ''
  - label: 臺灣體育的問題
    value: '1.運動績優生選才不易。

      2.運動選手主要是由政府與學校培育，較少俱樂部。

      3.體育班長時間嚴格的體育訓練，犧牲了選手的課業與職業發展，造成退役選手的就業__。'
    blanks:
    - answer: 困難
      hint: ''
  title: 澳洲奧運金牌的Ｘ機密
