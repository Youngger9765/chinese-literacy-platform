  paragraph_count: 7
  paragraphs:
  - idx: 1
    text: 根據統計，2020年東京奧運會金牌數最多的前五名國家分別是美國、中國、日本、英國、俄羅斯，這些國家大多人口眾多、國力強盛。但你知道嗎？金牌數第六名的，居然是人口與臺灣相差不多的澳洲。若再看總獎牌數，澳洲更是臺灣的八倍多，甚至連續十年在奧運的得牌數都位居所有國家的前十名。為什麼澳洲和臺灣會有這麼大差異呢？
  - idx: 2
    text: 澳洲幅員遼闊、氣候宜人，居民常親近大自然並享受戶外運動。除了居民自發的運動外，澳洲政府也全力支持體育活動，建立了非常完善的體育系統，斥資興建許多體育設施，並設立體育學校。各城市內也遍布各種體育場館，其中許多具備舉辦國際賽事的規模。此外，政府還成立國家運動中心，提供專業的運動科學訓練與豐厚的獎學金，藉此吸引更多有潛力的年輕運動人才投入訓練。
  - idx: 3
    text: 澳洲各級學校也重視體育，經常舉辦校內、校際的體育競賽。以國小為例，澳洲國小上課時間從上午九點到下午三點，放學後有充足的時間進行體育活動或比賽，家長們並不認為孩子接觸體育活動會影響課業；相反的，他們認為體育活動除了能鍛鍊身心，還能讓孩子學到許多重要的品格，例如團隊合作、自律、負責、吃苦耐勞和永不放棄。
  - idx: 4
    text: 因此，澳洲家長非常熱衷於讓孩子在放學後參加社區的運動俱樂部。俱樂部的訓練團隊由社區家長或志工組成，每週也會舉辦體育賽事。雖然是社區型俱樂部，賽制卻規劃得井井有條，按照年齡與水準分級比賽。各項比賽中表現優異的隊伍或運動員，可以參加更高層級的比賽，甚至獲得參與國家級比賽的機會。這樣層級分明的賽事安排，能有系統且及早發掘有運動天賦的孩子，經過積極培養後，他們有機會成為兼職或全職運動員。表現最優異的選手，則更有機會進入國家代表隊，為國家爭取國際賽獎牌。
  - idx: 5
    text: 澳洲國家隊選手除了運動員身分外，大多還有其他的職業，例如醫師、工程師、收銀員等。也就是說，他們退役後，可以運用在各行各業的專業技能，繼續發展職涯，較不會有後顧之憂。有些退役的運動員也會在工作之餘，到社區運動俱樂部擔任教練，指導更多孩子。就這樣形成了良好的循環，鞏固了澳洲體育人才篩選與訓練系統。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 6
    text: 反觀臺灣，家長對課業的看重遠遠超過體育，相較於澳洲，學生在校內的運動時間相當有限，放學後上補習班的學生也比參加運動的多得多。臺灣有許多運動資優學生會進入體育班，接受長時間的嚴格訓練，還經常因此犧牲課業。臺灣的教育觀念及體育環境造成幾個問題：一、參與各種專項運動的人數太少，運動績優生選才不易；二、運動選手的選拔與訓練主要由學校和政府負責，缺少像澳洲那樣遍地開花的社區運動俱樂部；三、為了訓練和出賽，可能犧牲了學生運動員的課業，及他們退役後的職業發展機會。
  - idx: 7
    text: 澳洲人口2600多萬，臺灣人口2300多萬，相差不多，但是兩國在奧運會獎牌數上卻有天壤之別。原因是什麼？如果想和澳洲一樣，成為奧運奪牌榜上的前幾名，你認為應該怎麼做呢？
