lesson_uid: L0080
version_id: v3
section_no: 六
spotlight:
  strategy_name: 用表格整理訊息——比較兩者異同
  strategy_type: information_organization
  section_title_printed: 閱讀聚光燈
  answer_carrier: '🔴 全部是**橘色手寫字**，本節沒有任何 ☑（w:sym F0FE 全課只有 1 個，在第五大題）。

    橘色答案在文字層裡，所以文字流抽得到；PDF p5~p6 也看得見。'
  structure_note: '⛔ 比較表刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '當文章同時介紹兩個對象，而且訊息很多時，可以用「比較表」把相同主題的資料放在一起。這樣不但容易看出相同點和不同點，也能根據差異歸納文章重點。

      (1)畫表格

      (2)整理表格步驟：

      ❶找對象：找出文章要比較的兩個對象，寫在最上面一列。

      ❷找項目：找出兩邊都能比較的重點，寫在最左邊一欄。

      ❸填訊息：只根據文章，把資料填進對應的格子。

      ❹下結論：比較各格資料，用一句話說出重要差異及可能原因。

      (3)總結：根據這個表格進行分析，提出結論。'
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 讀完文章後，你是不是發現澳洲與臺灣有許多不同的地方？現在我們要來練習整理文章的訊息，幫助你更能抓住文章重點！表格已經畫好，請依照上列步驟第❷至第❹步完成。
  - type: fill_table
    columns:
    - 項　目
    - 澳　洲
    - 臺　灣
    answer_carrier: 橘色手寫字（PDF p5~p6）；文字層已填有同樣的答案
    rows:
    - 項　目: 奧運得獎牌數量
      澳　洲: 澳洲奧運得獎牌數量是臺灣的【　】倍
      澳　洲_blanks:
      - answer: ８
      row_note: 這一列的內容橫跨澳洲、臺灣兩欄（合併儲存格），所以沒有臺灣欄。
    - 項　目: 人口數
      澳　洲: 約【　】人
      澳　洲_blanks:
      - answer: 2600萬
      臺　灣: 約【　】人
      臺　灣_blanks:
      - answer: 2300萬
    - 項　目: 國土面積(填入大或小)
      澳　洲: 大
      臺　灣: 小
    - 項　目: 參與體育的人數(填入多或少)
      澳　洲: 多
      臺　灣: 少
    - 項　目: 誰在推動體育？
      澳　洲: 全國人民、政府、社區俱樂部、家長
      臺　灣: 政府和學校
    - 項　目: 體育設施及場館(填入多或少)
      澳　洲: 多
      臺　灣: 少
    - 項　目: 家長重視什麼(填體育或課業)
      澳　洲: 體育
      臺　灣: 課業
  - type: free_text
    prompt: 總結：由上表可知：澳洲的人口數與臺灣差不多，但是【　】所以這可能是澳洲得獎牌多於臺灣的原因。
    blanks:
    - answer: 澳洲對體育非常重視，體育設施的建設也比臺灣多，家長也重視體育，
    note_printed: 原稿在這一段右下角另印一行小字「（答案合理即可）」。
    answer_carrier: 橘色手寫字（PDF p6）；文字層已填有同樣的答案
