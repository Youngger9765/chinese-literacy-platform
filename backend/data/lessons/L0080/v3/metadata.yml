strategy_explained: '這一課要練的是「抽絲剝繭找重點」

  因為這篇文章比較了澳洲和台灣在奧運表現上的差異，裡面有很多支持澳洲成功的細節，像政府的體育系統、訓練資源、社區運動俱樂部等等

  讀的時候，你可以試著把這些細節記下來，然後想想它們共同指向了什麼最重要的原因，就能更明白澳洲為何能屢創佳績'
