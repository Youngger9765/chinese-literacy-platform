lesson_uid: L0080
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 學校為了節省支出，「斥資」兩千元買了一盒彩色筆。
      B: 臺灣的社區普遍「井井有條」，地下水資源豐富
      C: 因為有全家人的支持，讓他沒有「後顧之憂」，可以專心工作
      D: 這所學校「幅員遼闊」，從前門就可以看到後門
    explanation: （A-雜亂無章不適宜人居住。B-井井有條表示整齊和水無關。D-語意相反）
    explanation_note: 原稿是一個浮動說明框，印在題目右上方
  - index: 2
    answer: A
    stem: 澳洲政府成立國家運動中心，主要的用意為何？
    options:
      A: 吸引並培育有潛力的年輕運動員
      B: 成為未來舉辦國際賽事的場地
      C: 培養運動員良好、健全的品格
      D: 讓運動員退役後能進入社區教學
    explanation: （第二段提到，為了培育更多有潛力的運動員。）
    explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 之前
  - index: 3
    answer: B
    stem: 下列何者不是澳洲奪得眾多獎牌的原因？
    options:
      A: 政府大量投入經費建設軟硬體及培訓系統
      B: 主要由各級學校體育班集中培養少數學生選手
      C: 學校課程時間短，家長鼓勵孩子課後投入運動
      D: 社區有各種運動俱樂部，由退役運動員當教練
    explanation: （氣候宜人是澳洲人喜歡運動的原因，人口數與臺灣相距不遠。）
    explanation_note: 原稿是一個浮動說明框；題幹的「不是」加了底線
  - index: 4
    answer: D
    stem: 比較澳洲與臺灣的體育環境，下列何者正確？
    options:
      A: 主要都由政府和學校培育選手
      B: 人口數量差距很大
      C: 家長都把課業看得比體育重要
      D: 澳洲推動體育的力量較多元
    explanation: 'A.面積差距很大

      B.人口數差不多

      C.臺灣較少體育場館的設施'
    explanation_note: 原稿是一個浮動說明框，在 document.xml 裡插在選項 A 與 B 之間，本檔歸位到題級
  - index: 5
    answer: D
    stem: 臺灣或許可以學習澳洲的成功經驗。請問何者不是澳洲帶給臺灣的啟示？
    options:
      A: 鼓勵社區增設運動俱樂部，讓更多人參與體育
      B: 善用退役運動員進入社區，做更多人才的篩選與訓練
      C: 教育家長改變「重學科、輕體育」的態度
      D: 讓體育資優選手進體育班，接受長時嚴格訓練
    explanation: （目前臺灣是用此方法，澳洲更推崇人人熱愛運動，從此找出選手。）
    explanation_note: 原稿是一個浮動說明框，印在選項 D 下方；題幹的「不是」加了底線
  notes:
    answer_carrier: 橘色手寫代號（PDF p6~p7）；文字層的（　）內已填有同樣的代號
