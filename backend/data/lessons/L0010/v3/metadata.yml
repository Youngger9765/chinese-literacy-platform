lesson_no: 19
series: 一般
lesson_seq: 4190
intro: 這篇文章記錄了一位熱愛棒球的八年級學弟阿耀，寫信給他崇拜的職棒學長，詢問關於棒球與課業的煩惱。阿耀夢想成為職棒選手，但老師卻要他兼顧課業，讓他感到迷惘，不確定是否只能靠打球。學長回信分享了自己在職棒路上的經驗，他點出即使球技再好，也可能受到外在因素影響，例如競爭激烈、傷病或位置問題，因此他認為人生不能只靠單一技能，讀書是為了多開闢一條路，增加更多人生選擇。
strategy_explained: 這一課我們要練習的是「想想看，未來還有什麼可能」，因為阿耀學弟熱愛棒球，但學長告訴他，人生不能只有一種選擇，讀書可以幫助你多開一條路，這樣當遇到困難時，你才不會只有一條路走，讀的時候，可以試著想想看，如果阿耀學長沒有打棒球，他還能做些什麼呢
