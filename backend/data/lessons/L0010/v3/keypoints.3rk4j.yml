  - label: 健豪學長的回覆
    value: '1.學長以前的想法：

      只要球打好，就能進職棒、獲得豐厚的【　】。

      2.進職棒後才發現，成功不只要【　】，還要【　】。

      3.舉例可能會遇到的三種情況

      (1)選秀遇到怪物級選手，自己未能【　】。

      (2)因為長時間比賽，身體容易【　】而受傷。

      (3)守備位置競爭激烈，即使實力不錯，也沒機會上場。

      4.結論

      (1)我們無法控制各種情況，雖然打球很重要，但不要【　】，不要只剩一條路可以走。

      (2)讀書是要讓你【　】。'
