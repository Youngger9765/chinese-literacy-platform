lesson_uid: L0010
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列的語詞，何者使用錯誤？
    options:
      A: 他憑著流利的英文，從眾多應徵者中「雀屏中選」，得到工作
      B: 他與夢想的大學「擦身而過」，只差一分沒錄取
      C: 那次比賽失誤的畫面，一直在他心中「揮之不去」
      D: 這部電影富含教育意義，小明「勸誡」我去看那部電影
    teacher_note: D.「勸誡」。語氣嚴肅，此句適合用於「邀請」或「推薦」。
  - index: 2
    answer: B
    stem: 信中提到「成功，不只要努力，還要『運氣站在你這邊』」，這句話主要想表達什麼？
    options:
      A: 努力很重要，但運氣比努力更重要
      B: 成功需要努力，也會受到運氣和機會影響
      C: 只要實力夠強，就能克服所有外在影響
      D: 遇到運氣不好時，再努力也沒有什麼作用
    teacher_note: 這句話表達的是「努力不是唯一因素」，說明人生中有些事無法掌控。
  - index: 3
    answer: C
    stem: 健豪學長列出「遇到怪物級選手」「身體受傷」「沒機會上場」等例子，主要想說明什麼？
    options:
      A: 打球時要小心身體健康，避免受傷
      B: 只有最強的人才能在職棒中生存
      C: 有些不可預測的因素會影響成功機會
      D: 運氣不好就不要打球，以免白費心力
    teacher_note: 健豪學長這一段的重點是：努力並不保證成功，外在條件（運氣、機會、競爭）也會影響結果。他並非在講健康、強弱或勸人放棄，而是在提醒要「多準備不同能力」。
  - index: 4
    answer: A
    stem: 從兩封信的內容推論，阿耀最可能是哪一種學生？
    options:
      A: 對讀書有些抗拒，但非常熱愛打球
      B: 認為課業和球技一樣，都值得投入
      C: 對未來沒有想法，只照學長的話做
      D: 想放棄棒球，專心準備學校考試
    teacher_note: 阿耀說「訓練後真的累癱了，一聽到這些話就覺得煩」，顯示他熱愛棒球但對讀書感到抗拒。
  - index: 5
    answer: B
    stem: 健豪學長在回信中，用了哪一種方法，讓阿耀更明白「讀書能讓人多一條路」？
    options:
      A: 他用很多難詞和成語，讓文章更有氣勢
      B: 他舉出不同的例子，說明只靠打球太危險
      C: 他用誇張的說法，讓故事更精采
      D: 他請阿耀自己去體會，不直接告訴他
    teacher_note: 幫助學生理解：這些例子都是在說明「只靠打球太冒險要多準備一條路」。
