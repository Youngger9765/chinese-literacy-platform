comprehension:
  questions:
  - index: 2
    answer: B
    stem: 信中提到「成功，不只要努力，還要『運氣站在你這邊』」，這句話主要想表達什麼？
    options:
      B: 只有最強的人才能在職棒中生存
      C: 有些不可預測的因素會影響成功機會
      D: 運氣不好就不要打球，以免白費心力
      A: 打球時要小心身體健康，避免受傷
    rationale: 這句話表達的是「努力不是唯一因素」，說明人生中有些事無法掌控。
  - index: 4
    answer: A
    stem: 從兩封信的內容推論，阿耀最可能是哪一種學生？
    options:
      B: 認為課業和球技一樣，都值得投入
      C: 對未來沒有想法，只照學長的話做
      D: 想放棄棒球，專心準備學校考試
      A: 阿耀說「訓練後真的累癱了，一聽到這些話就覺得煩」，顯示他熱愛棒球但對讀書感到抗拒。
    rationale: 阿耀說「訓練後真的累癱了，一聽到這些話就覺得煩」，顯示他熱愛棒球但對讀書感到抗拒。
    is_rationale: true
  - index: 5
    answer: B
    stem: 健豪學長在回信中，用了哪一種方法，讓阿耀更明白「讀書能讓人多一條路」？
    options:
      A: 他用很多難詞和成語，讓文章更有氣勢
      C: 他用誇張的說法，讓故事更精采
      D: 他請阿耀自己去體會，不直接告訴他
      B: 幫助學生理解：這些例子都是在說明「只靠打球太冒險，要多準備一條路」。
    rationale: 幫助學生理解：這些例子都是在說明「只靠打球太冒險，要多準備一條路」。
