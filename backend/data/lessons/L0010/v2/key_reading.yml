passage: '升上八年級後，我被排進先發名單，除了大隊訓練和晨操，我晚上還會自己加練。雖然很累很操，但我真的喜歡棒球，而且不少學長都告訴我們：「球打得好，以後就有高中、大學可讀；更強的話，高中就能直接進職棒！」我總是夢想有朝一日能像您一樣進職棒。

  但老師又會勸誡我們：「打球雖然重要，但書還是要讀。」我知道這是為我們好，可是訓練後真的累癱了，一聽到這些話就覺得煩，甚至有點想逃避。我總是在想：一定要讀書嗎？未來真的不能只靠打球嗎？

  謝謝你的來信，很開心看到你對棒球這麼熱愛。我當年和你一樣，天天拚命練球，心裡只想著怎麼打得更好。

  說實話，我以前也覺得只要球打得好，就能進職棒、獲得豐厚報酬。但等我真的進了職棒，我才發現：成功，不只要努力，還要「運氣站在你這邊」。'
