lesson_uid: L0156
version_id: v3
section_no: 六
spotlight:
  strategy_name: 善用網路資源找證據
  strategy_type: media_literacy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）＋ 橘色手寫（字元樣式 af）
  blocks:
  - type: concept_box
    text: '本文作者已經用Q1~Q4查過幾個讓人起疑的地方。不過，查到Q4，不表示所有疑問都解開了。讀完故事，你的心裡可能還會冒出一句：「等等，這裡真的嗎？」有疑問是好事，但不是每個不知道的疑問都值得花時間查。可以先問自己：

      1課文已經回答了嗎？

      2查清楚後，會不會影響我怎麼看這段故事？

      3這個問題有沒有辦法找到資料查證？

      如果「課文還沒回答、會影響判斷，而且查得到」，就值得繼續追。

      接下來，我們就接手作者還沒查完的疑點，一邊追問，一邊練習怎麼找資料、怎麼用證據判斷。'
  - type: guide
    text: 一、還有什麼值得追？
  - type: multi
    prompt: 1.根據本文，下面四個問題，選出兩個值得繼續查證的問題。（複選）
    options:
      1: 弟弟喝下湯藥後，有沒有甦醒？
      2: 道士說「老虎牙齒有毒」，是真的嗎？
      3: 含光追虎時，一共揮了幾下鞭子？
      4: 用嘴吸傷口，真的能幫助被老虎咬傷的人嗎？
    answers:
    - 2
    - 4
  - type: multi
    prompt: 2.為什麼2、4值得追？因為這兩個問題都：（複選）
    options:
      1: 課文還沒有回答。
      2: 會影響我們怎麼看故事中的這個做法。
      3: 有辦法再找資料查證。
    answers:
    - 1
    - 2
    - 3
  - type: guide
    text: →接下來，就沿著這兩個問題往下查：先追Q5，再看看查到的資料會不會讓Q6更值得追。
  - type: guide
    text: 二、追Q5：虎牙真的有毒嗎？
  - type: guide
    text: （一）先想：要怎麼找？搜尋資料時，不是只打「老虎」就開始找。可以先從問題中抓出關鍵詞，讓搜尋結果更接近真正想查的內容。
  - type: single
    prompt: 1.哪一組關鍵詞最適合查Q5？（單選）
    options:
      1: 老虎+凶猛+可怕
      2: 老虎+虎牙+有毒
      3: 老虎+牙齒+數量
      4: 老虎+咬人+故事
    answer: 2
  - type: guide
    text: →小提醒：可以先抓「對象+想查的重點」，例如「老虎+虎牙+有毒」。
  - type: single
    prompt: 2.搜尋結果很多，除了看內容，也要看資料是誰提供的。哪一種資料比較值得先看？（單選）
    options:
      1: 一般知識網站整理的老虎介紹
      2: 新聞網站報導的老虎咬人事件
      3: 醫療或科學研究機構發布的資料
      4: 網友整理的動物知識文章
    answer: 3
  - type: guide
    text: →查健康、科學問題時，可以優先查看醫療、研究或專業機構的資料，再和其他資料互相比較。
  - type: guide
    text: （二）做判斷 如果你找到兩筆資料：
  - type: table
    columns:
    - 資料
    - 內容
    rows:
    - - 資料1｜被動物咬傷，為什麼要小心？
      - 動物嘴裡可能有細菌。被咬後，細菌可能進入傷口，引起感染。醫療資料提醒，被動物咬傷後要清洗傷口，必要時就醫。
    - - 資料2｜哪些哺乳類真的會製造毒液？
      - 有些哺乳類真的會製造毒液，例如鴨嘴獸和懶猴。不過，這類動物很少；目前科學資料列出的有毒哺乳類中，沒有老虎。
  - type: single
    prompt: 1.哪一份資料比較直接回答「虎牙有毒嗎？」
    options:
      1: 資料1
      2: 資料2
    answer: 2
  - type: single
    prompt: 2.根據資料1、2，關於「虎牙有毒」的說法，哪一個判斷最適當？（單選）
    options:
      1: 咬傷可能感染，所以虎牙就是有毒。
      2: 虎牙沒有毒，所以只要防止傷口感染。
      3: 咬傷可能感染，但沒有證據支持虎牙有毒。
      4: 兩份資料不同，所以還不能判斷虎牙有沒有毒。
    answer: 3
  - type: guide
    text: ◎查到這裡，我們發現：傷口可能感染，不等於虎牙有毒。這個發現，也讓我們更有理由追下一個問題：道士說要把「毒血」吸出來。如果虎牙有毒的說法沒有證據支持，那麼，用嘴吸傷口真的有幫助嗎？
  - type: guide
    text: 三、追Q6：用嘴吸傷口真的有幫助嗎？
  - type: guide
    text: （一）先判斷：哪一筆資料值得先看？
  - type: single
    prompt: 1.你用「動物咬傷用嘴吸傷口處理」搜尋，出現下面幾筆結果。你會先點哪一筆來查證？（單選）
    options:
      1: 健康部落格：「被動物咬傷後，我都是這樣處理」
      2: 短影音創作者：「動物咬傷，第一時間該怎麼做？」
      3: 醫療機構：「動物咬傷後，傷口應該怎麼處理？」
      4: 戶外活動網站：「野外被動物咬傷的急救方法」
    answer: 3
  - type: guide
    text: →我們要查的是「動物咬傷後怎麼處理」。3不但最對準問題，資料來源也較適合用來查健康問題。
  - type: guide
    text: （二）做判斷 如果你找到兩筆資料：
  - type: table
    columns:
    - 資料
    - 內容
    rows:
    - - 資料3｜現在遇到動物咬傷，怎麼處理？
      - 醫療資料建議：被動物咬傷後，要盡快用肥皂和大量清水清洗傷口，再依傷口情況接受醫療處理。
    - - 資料4｜要不要用嘴吸？
      - 醫療資料提醒：不要用嘴吸咬傷的傷口；應先清洗傷口，再接受適當的醫療處理。
  - type: single
    prompt: 1.根據資料3、4，從現代醫學的角度來看，故事中「用嘴吸傷口」的做法適當嗎？（單選）
    options:
      1: 適當，清洗傷口後再用嘴吸也可以。
      2: 不適當，不建議用嘴吸，應清洗傷口並視情況就醫。
      3: 還不確定，資料只說要清洗傷口。
      4: 無法判斷，因為古今的處理方法不同。
    answer: 2
  - type: single
    prompt: 2.有人反問：「可是弟弟後來真的活下來了，不就表示含光用嘴吸傷口有效嗎？」這樣判斷適當嗎？
    options:
      1: 適當，因為含光吸過傷口後，弟弟最後真的活下來。
      2: 不適當，弟弟還喝了湯藥、接受多日醫治，不能只因後來活下來，就說是「用嘴吸傷口」救了他。
    answer: 2
  - type: guide
    text: 四、把作者和我們的查證放在一起看
  - type: guide
    text: '1.把Q1到Q6六個問題放在一起，看看找到的證據到底能讓我們判斷到哪裡。請在【】中填入代號。

      A.有資料支持：這類事情或這個情節有可能發生

      B.查到的資料顯示：這個做法有疑點

      C.有直接證據支持：含光兄弟這一次事件真的發生過'
  - type: fill_table
    prompt: 我們查的問題
    columns:
    - 我們查的問題
    - 目前查證結果
    rows:
    - 我們查的問題: Q1.真的會發生虎襲嗎？
      目前查證結果: 【　】
      目前查證結果_blanks:
      - answer: A
    - 我們查的問題: Q2.含光有可能追上老虎嗎？
      目前查證結果: 【　】
      目前查證結果_blanks:
      - answer: A
    - 我們查的問題: Q3.人有可能打退大型貓科動物嗎？
      目前查證結果: 【　】
      目前查證結果_blanks:
      - answer: A
    - 我們查的問題: Q4.「吸血數升」合理嗎？
      目前查證結果: 【　】
      目前查證結果_blanks:
      - answer: B
    - 我們查的問題: Q5.「虎牙有毒」是真的嗎？
      目前查證結果: 【　】
      目前查證結果_blanks:
      - answer: B
    - 我們查的問題: Q6.用嘴吸傷口真的有幫助嗎？
      目前查證結果: 【　】
      目前查證結果_blanks:
      - answer: B
  - type: single
    prompt: 2.根據上表，哪一個判斷最適當？（單選）
    options:
      1: 不少情節都可能發生，所以故事大致是真的。
      2: 救治說法有疑點，所以整個故事應該是假的。
      3: 有些情節可能發生，有些說法有疑點，目前還不能證明故事是真的。
      4: 既然不能證明故事是真的，前面找到的證據就沒有用。
    answer: 3
  - type: single
    prompt: 3.Q1~Q3都有資料支持，為什麼還不能說「含光兄弟遇虎真的發生過」？（單選）
    options:
      1: 這些資料只能說明情節可能發生，不能證明故事真的發生。
      2: 這些資料的數量還不夠多，不能判斷故事真假。
      3: 這些資料的年代不同，不能用來判斷古代故事。
      4: 這些資料分別回答不同問題，不能合起來判斷。
    answer: 1
  - type: self_check
    label: ◎我的發現與自我檢核
    instruction: 這一課學到的查證方法，你做到了哪些？如果有做到，請在□中打勾。
    items:
    - 1.我會先找出還沒回答、重要又查得到的問題。
    - 2.我會用合適的關鍵詞，優先找可靠的資料。
    - 3.我會檢查找到的資料是否真的回答我的問題。
    - 4.我會根據證據能支持的程度，再下適當的判斷。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿四格都是空的 □
