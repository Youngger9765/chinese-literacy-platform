lesson_uid: L0156
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列文句，何者語詞使用最恰當？
    options:
      A: 這裡風光明媚，是「杳無人煙」的旅遊勝地
      B: 這部電影有許多令人「驚心動魄」的火爆場面，超級可怕
      C: 這個道士學藝不精，破綻百出，真是「回天乏術」
      D: 做事應用「譁眾取寵」的態度，博取流量及曝光度
    option_notes:
      A: (成語誤用)
      C: (成語誤用)
      D: (成語誤用)
  - index: 2
    answer: B
    stem: 根據作者的說法，為什麼含光可以擊退老虎、救回弟弟？
    options:
      A: 因為含光有道士的即時幫忙和提醒
      B: 老虎可能身體狀態不佳，不敵人類
      C: 因為含光是百年難得一見的大力士
      D: 含光不怕死的吮吸弟弟傷口的毒血
  - index: 3
    answer: C
    stem: 根據本課內容，何者敘述為真？
    options:
      A: 故事發生的地點是人跡眾多地方
      B: 弟弟受傷過重，從頭到尾未甦醒
      C: 含光為救弟弟，不顧自身的安全
      D: 故事中的老虎敏捷迅速、很強壯
    option_notes:
      A: (人煙杳然)
      B: (灌湯藥後已甦醒)
      C: (用自己的嘴巴吸出毒素，不怕中毒)
      D: (老虎應是老弱病幼，才可能被人打跑)
  - index: 4
    answer: A
    stem: 請問這篇文章中，作者（曾世杰）最想傳達什麼理念給讀者？
    options:
      A: 對任何事情都要保持先懷疑，後求證的態度
      B: 批判古人在記載故事都十分潦草、不求謹慎
      C: 宣揚兄弟友愛的理念，互助合作來打退猛虎
      D: 宣傳在野外被動物咬傷時，正確的急救方式
  - index: 5
    answer: C
    stem: 這篇文章示範了一種閱讀態度，請選出底下最接近的描述？
    options:
      A: 文字紀錄是可靠的，隔了350年仍然可信
      B: 閱讀時應該全然信任作者
      C: 閱讀時可以提出質疑，並蒐集資料
      D: 閱讀時寧願相信書，而不要相信網路
  notes:
