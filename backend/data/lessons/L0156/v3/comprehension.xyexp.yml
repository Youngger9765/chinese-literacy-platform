lesson_uid: L0156
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列文句，何者語詞使用最恰當？
    options:
      A: 這裡商店林立、遊客很多，是「杳無人煙」的旅遊勝地
      B: 電影最後的追逐場面十分緊張，看得大家「驚心動魄」
      C: 醫生很快控制住病情，病人已經「回天乏術」
      D: 他據實報告事情經過，故意「譁眾取寵」吸引注意
  - index: 2
    answer: C
    stem: 作者列出過去和現代的虎襲紀錄，最主要想說明什麼？
    options:
      A: 以前的老虎一定比現在更喜歡攻擊人
      B: 含光兄弟確實曾經在山上受到老虎攻擊
      C: 老虎攻擊人的事件確實可能發生
      D: 只要山中有老虎，人類就可能受到攻擊
    explanation: 虎襲紀錄可以支持「這類事件確實可能發生」。A、B、D把有限資料說得過度確定
  - index: 3
    answer: C
    stem: 從含光救弟弟的過程，可以看出他當時怎麼做？
    options:
      A: 先躲避老虎，等待其他人前來救援
      B: 先帶自己逃走，再回旅店尋求協助
      C: 冒著危險追趕老虎，設法把弟弟救回
      D: 判斷老虎力量較弱，才決定上前搏鬥
    explanation: 含光手無寸鐵，只拿短鞭追虎，還抓住虎頸與牠搏鬥，可以看出他冒著危險救弟弟
  - index: 4
    answer: A
    stem: 作者在Q1~Q4查證後，都用「目前判斷」說明結果。為什麼不直接寫成「答案」？
    options:
      A: 目前的結論受到證據限制，之後仍可能修正
      B: 找到的證據已經很充分，可以確定故事真假
      C: 網路資料大多互相矛盾，所以無法進行判斷
      D: 古代故事年代太久，查到的資料沒有參考價值
  - index: 5
    answer: B
    stem: 作者最希望讀者養成哪一種閱讀態度？
    options:
      A: 遇到年代久遠的故事時，先假定內容有錯
      B: 遇到可疑的內容時，主動質疑並查找證據
      C: 遇到驚險的故事時，特別注意人物的品格
      D: 遇到網路上的資料時，只相信列出來源的內容
  notes:
    answer_carrier: 橘色手寫代號（字元樣式 af），文字流有此資訊
    teacher_notes: 第 2、3 題右側各有一個深色文字方塊寫解析，原稿把同一段印了兩次（文字方塊在 w:t 流裡重複出現），此處只收一份
