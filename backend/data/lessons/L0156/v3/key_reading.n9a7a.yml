  passage: 康熙乙卯年（1675年）秋天，含光帶著小弟路過一個地勢險峻、杳無人煙的山嶺，日垂西山，天色陰黯，兩人鞭打著驢子前行。忽然一陣帶著腥味的怪風刮起，飛沙走石，樹葉撲面有如雨下。一隻猛虎突然竄出把弟弟攫走了。含光大驚，跌倒在地上，然後手無寸鐵的他持著短鞭奮力追虎，他左手緊緊抓住虎頸，右手用鞭子全力捶打虎頭，他大聲呼喊號叫，聲音震動了山谷。老虎大怒，因為叼著一個人，無法施力，於是捨棄到口的獵物，靠著山坳，大聲吼叫，想要和含光搏鬥。含光背著他弟弟飛奔下嶺，投宿旅店。他把弟弟從肩上放下時，弟弟一息尚存。於是含光用湯藥灌下去，漸漸地弟弟甦醒過來；含光喘了口氣略微安定下來後，坐起來看他弟弟的肩膀。前後十幾個血洞，鮮血淋漓滿地都是。有個道士對他說：「老虎牙齒有毒，已經深入體內了，毒血如果不全部排出，就回天乏術了。」含光用盡全力用嘴巴吮吸傷口的毒血，吸血數升，醫治了幾十天，等到病情平穩了，才把他弟弟帶回家。
  start_text: 康熙乙卯年（1675年）秋天，含光帶著小弟路過一
