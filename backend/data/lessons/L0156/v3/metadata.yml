strategy_explained: 這一課我們要練習的是「辨別資訊真假」的能力，就像「鞭虎救弟記」這個故事，聽起來很驚險，但我們要學會像偵探一樣，仔細思考它可能是真實還是傳說。讀的時候，你可以試著問問自己，故事裡的情節有沒有可能發生，或是為什麼會有人把這個故事傳得這麼神奇，這樣就能慢慢培養出判斷資訊的能力喔
