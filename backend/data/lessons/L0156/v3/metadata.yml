intro: 這篇文章要帶我們一起來認識一個發生在三百多年前的驚險故事，叫做「鞭虎救弟記」。故事中，一位名叫含光的哥哥，在山上遇到老虎，為了救被老虎抓走的小弟弟，他奮不顧身地與老虎搏鬥。這段經歷聽起來是不是很不可思議呢？在現今網路資訊爆炸的時代，我們常常會遇到各種真假難辨的消息，因此，這篇文章會引導我們一起思考，這個流傳已久的故事，究竟是真實的經歷，還是經過誇大的傳說呢？讓我們一起來仔細探究吧！
