_總表_語詞_對照note: "總表列 11 個、學習單語詞框列 13 個。差異兩處，都照各自原樣記錄、未互相覆蓋：\n① 學習單多「攫」與「一命嗚呼」（兩個都真的出現在課文與第三大題）。\n② 總表寫「嘩眾取寵」，學習單四處（語詞框／第三大題/(10)／第四大題選項 C／第八大題灰框）\n   一致寫「譁眾取寵」——**第一個字不同**（嘩 vs 譁）。學習單自己前後一致，判為總表用字不同。"
