  items:
  - index: 1
    word: 一息尚存
    definition: 還有一口氣，表示還活著，但情況很危急。
  - index: 2
    word: 號叫
    definition: 大聲叫喊。
  - index: 3
    word: 杳無人煙
    definition: 形容地方荒涼偏僻，幾乎看不到人。
  - index: 4
    word: 手無寸鐵
    definition: 鐵指武器，形容手裡沒有任何武器。
  - index: 5
    word: 陰黯
    definition: 天色陰沉昏暗。
  - index: 6
    word: 倖存
    definition: 在危險或災難中幸運地活下來。
  - index: 7
    word: 一命嗚呼
    definition: 即「死亡」。
  - index: 8
    word: 驚心動魄
    definition: 形容事情非常驚險、緊張，讓人十分震撼。
  - index: 9
    word: 山坳
    definition: 兩座山之間低凹的地方。
  - index: 10
    word: 譁眾取寵
    definition: 故意用誇張、吸引人的言語或行動，吸引大家注意。
  - index: 11
    word: 險峻
    definition: 形容山勢又高又陡，十分危險。
  - index: 12
    word: 回天乏術
    definition: 病情嚴重無法挽救。
  - index: 13
    word: 攫
    definition: 鳥獸用爪抓取獵物；指抓住、奪走。
