  rows:
  - label: 【鞭虎救弟記】故事概要
    value: '1.時間：1675年秋天

      2.地點：地勢險峻、【　】的山嶺

      3.經過：含光兄弟經過山嶺時遇虎，老虎把弟弟【　】了，含光拿鞭子奮力追虎，經歷搏鬥，從虎口救出弟弟。弟弟一息尚存，但【　】過多，含光灌湯藥、吸毒血，弟弟終於得救。'
    blanks:
    - answer: 杳無人煙
    - answer: 攫走
    - answer: 失血
  - label: 作者質疑故事不合理之處
    columns_printed:
    - Q1
    - Q2
    - Q3
    - Q4
    items:
    - label: Q1
      value: 【　】
      blanks:
      - answer: 真的有老虎咬人事件嗎？
    - label: Q2
      value: 人類怎麼可能追上老虎？
      note: 這一格原稿就印好了，不是填空
    - label: Q3
      value: 含光怎麼可能打退兇猛的老虎？
      note: 這一格原稿就印好了，不是填空
    - label: Q4
      value: 【　】
      blanks:
      - answer: 吸了好幾升的血，是真的嗎？
  - label: 作者用網路查證
    items:
    - label: Q1
      value: '1876-1912年，印度就有33247人死於虎襲。

        康熙年間，老虎數量眾多。

        2022年印度有112人因虎襲死亡。'
    - label: Q2
      value: 華南虎體重約110-150kg，15歲的男生體重約50kg，老虎拖著體重約自己1/3體重的獵物，很可能【　】。
      blanks:
      - answer: 跑不快
    - label: Q3
      value: '老虎在【　】時，可能會攻擊人類。

        2019年美國有一位男子被年幼公獅攻擊，最後徒手掐死公獅。'
      blanks:
      - answer: 受傷、生病、年幼
    - label: Q4
      value: 人體失血超過1/3就會死亡，含光吮吸毒血數升，估計約2060 C.C，佔當事人血液的54%。
