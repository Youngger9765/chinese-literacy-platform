full_text_annotate:
  preface: 前言：這篇課文裡，你除了可以欣賞一篇新奇的紀實報導之外，也可以看到作者示範對報導提出合理的質疑，並且用網路搜尋的資訊去澄清自己提出來的質疑。
  paragraph_count: 6
  paragraphs:
  - idx: 1
    text: 清朝蔣衡先生曾經記錄一位將近八十歲的老人所說的經歷。老人褪去上衣，露出他肩上歷歷可數的傷疤，每道傷口都有好幾寸長，他說出十五歲時和哥哥在山上遇虎的故事。隔了三百多年，這篇「鞭虎救弟記」今天讀來仍然令人驚心動魄，但這故事是真的嗎？底下先用白話文把這個故事重新呈現，再從網路找資料來研判這故事的真偽。
  - idx: 2
    text: 康熙乙卯年（1675年）秋天，含光帶著小弟路過一個地勢險峻、杳無人煙的山嶺，日垂西山，天色陰黯，兩人鞭打著驢子前行。忽然一陣帶著腥味的怪風刮起，飛沙走石，樹葉撲面有如雨下。一隻猛虎突然竄出把弟弟攫走了。含光大驚，跌倒在地上，然後手無寸鐵的他持著短鞭奮力追虎，他左手緊緊抓住虎頸，右手用鞭子全力捶打虎頭，他大聲呼喊號叫，聲音震動了山谷。老虎大怒，因為叼著一個人，無法施力，於是捨棄到口的獵物，靠著山坳，大聲吼叫，想要和含光搏鬥。含光背著他弟弟飛奔下嶺，投宿旅店。
  - idx: 3
    text: 他把弟弟從肩上放下時，弟弟一息尚存。於是含光用湯藥灌下去，漸漸地弟弟甦醒過來；含光喘了口氣略微安定下來後，坐起來看他弟弟的肩膀。前後十幾個血洞，鮮血淋漓滿地都是。
  - idx: 4
    text: 有個道士對他說：「老虎牙齒有毒，已經深入體內了，毒血如果不全部排出，就回天乏術了。」含光用盡全力用嘴巴吮吸傷口的毒血，吸血數升，醫治了幾十天，等到病情平穩了，才把他弟弟帶回家。
  - idx: 5
    text: 在偽新聞充斥的今天，大家看到這則故事難免起疑：這故事是真的嗎？會不會只是譁眾取寵呢？
  - idx: 6
    text: 綜合相關的資訊看來，350年前蔣衡採訪的故事是很可能是真的，但失血的部分被誇大了。含光兄弟運氣不好，在山中遇虎，這隻老虎可能老、病、殘或幼，攻擊力道不強，被勇敢的含光打退了。幸好傷者失血有限，在救治後終於能夠倖存，留下了這個故事。
  inquiry_blocks:
  - question: Q1：真的會有老虎咬人的事件嗎？
    text: 我們雖然無法確知350年前（1675年）老虎族群的數量，但125年前（1900年）全世界野生老虎的數量還有10萬隻，1876到1912年間，單印度一國就有33,247人死於虎襲。350年前的中國，野生老虎數量極可能更多，康熙皇帝1719年就曾經向人誇耀，他從小到大獵殺的老虎有153隻，可見老虎數量之多。2022年，印度只有3682隻野生老虎，卻有112人因虎襲死亡，遇襲未死亡者尚未計入，可見虎襲事件並不少見。從這些數字判斷，蔣衡記錄的這個故事，是很可能在當時的中國發生的。
    footnote_refs:
    - 1
    - 2
    - 3
    - 4
  - question: Q2：人類怎麼可能追得上老虎呢？
    text: 中國的老虎叫華南虎，成虎平均體重110到150公斤。今日中國15歲男生，平均體重約為57公斤，就算350年前的營養狀況普遍不良，當事人15歲了，至少也有50公斤。假定老虎有150公斤，牠咬著當事人肩膀，拖著自己體重三分之一的獵物移動，一定跑不快，所以含光衝上去追趕，應該是可以趕上的。
    footnote_refs:
    - 5
    - 6
  - question: Q3：含光怎麼可能打退凶猛的老虎呢？
    text: 印度的研究指出，老虎其實不常攻擊人類，但在受傷（槍傷、豪豬刺傷）、生病（牙痛、年邁）或年幼缺乏經驗，捕獵能力低落時，才比較可能攻擊人類。不只老虎，其他大型貓科也如此。2019年美國一處國家公園內，有一位慢跑的男子被美洲山獅從背後偷襲，這位男子奮力與之打鬥，最後居然徒手掐死了這隻只有36公斤重的年幼公獅。
    footnote_refs:
    - 7
    - 8
  - question: Q4：吸了好幾升的血？是真的嗎？
    text: 根據康熙1713年發布的度量衡單位，那時的1升，相當於現在的1030毫升（ml，台灣常用C.C.）。當事人以體重50公斤計算，其血液量約有3850 C.C.，而人體失血超過1/3就會死亡。蔣衡的文章寫道「吸血數升」，以2升計算，失血就有2060 C.C.，佔全身血液量的54%。如果所寫為真，當事人早就一命嗚呼了。換句話說，「吸血數升」是誇大、不可能的。
    footnote_refs:
    - 9
    - 10
