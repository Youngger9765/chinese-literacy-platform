passage: '清朝蔣衡先生曾經記錄一位將近八十歲的老人所說的經歷。老人褪去上衣，露出他肩上歷歷可數的傷疤，每道傷口都有好幾寸長，他說出十五歲時和哥哥在山上遇虎的故事。隔了三百多年，這篇「鞭虎救弟記」今天讀來仍然令人驚心動魄，但這故事是真的嗎？底下先用白話文把這個故事重新呈現，再從網路找資料來研判這故事的真偽。

  康熙乙卯年（1675年）秋天，含光帶著小弟路過一個地勢險峻、杳無人煙的山嶺，日垂西山，天色陰黯，兩人鞭打著驢子前行。忽然一陣帶著腥味的怪風刮起，飛沙走石，樹葉撲面有如雨下。一隻猛虎突然竄出把弟弟攫走了。含光大驚，跌倒在地上，然後手無寸鐵的他持著短鞭奮力追虎，他左手緊緊抓住虎頸，右手用鞭子全力捶打虎頭，他大聲呼喊號󠇡叫，聲音震動了山谷。老虎大怒，因為叼著一個人，無法施力，於是捨棄到口的獵物，靠著山坳，大聲吼叫，想要和含光搏鬥。含光背著他弟弟飛奔下嶺，投宿旅店。'
