passage: 清朝蔣衡先生曾經記錄一位將近八十歲的老人所說的經歷。老人褪去上衣，露出他肩上歷歷可數的傷疤，每道傷口都有好幾寸長，他說出十五歲時和哥哥在山上遇虎的故事。隔了三百多年，這篇「鞭虎救弟記」今天讀來仍然令人驚心動魄，但這故事是真的嗎？底下先用白話文把這個故事重新呈現，再從網路找資料來研判這故事的真偽。
