passage: '在這裡的早晨，我總愛遠眺那抹屬於你的藍，並拍下每天的雲影變換；在這裡的黃昏，我總期待變化萬千的彩霞帶來的驚喜；在這裡的夜晚，避開光害便能擁有大片星空，令人迷醉且流連忘返。然而，我也見過漫天風沙中的你，嚇阻著想接近你的人，但或許，只需要一場雨，就能撫慰這片大地。

  最令人著迷的還是那片海。在陽光下閃耀淺藍、青藍、蔚藍、深藍的海，在月光下流動如歌、寧靜如詩的海。你多變的海岸，豐富了浪聲，也接住了每個聽海人的心聲。是因為你的廣闊，讓來到這裡的人們多了生活的餘裕，所以連心也變得柔軟了嗎？不用為了生存汲汲營營，在這裡相遇的人們，都是那麼的自在、勇敢而真誠。

  而我想，你才不介意，你才不介意是不是永遠在前面，你才不介意那些追逐、較量與名號，畢竟那都無法影響你的美好。只是，我終究是個過客，終將被時間遣返。謝謝你以熟悉的藍天藍海為我餞行，謝謝你在我心中存了一份天空的遼闊與陽光的燦爛，謝謝你讓我在下一次仰望星空、眺望大海時能尋回你、想念你。謝謝你，台東。'
