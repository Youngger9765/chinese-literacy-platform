spotlight:
  lesson: G8-L21
  strategy_name: 寫作手法-擬人－從擬人推論文章意涵
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: 擬人，是把非人的事、物、景寫得像人一樣，會動作、會說話、會有感受或態度。擬人手法可使景物更生動，也把自己的感情放進景物裡。就像我們對小時候的玩具或娃娃一樣，可能會幫被描述的事、物、景命名、跟它說話，把它當作人一樣對待。    而文章使用擬人之處，也是作者投入想像和感情之重點，這篇文章將台東聯想成心愛的對象，進而對其傾訴，因此閱讀時我們可以留意擬人的句子，推論作者主要想傳達的感受或意涵。
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 試試看，從這篇文章的擬人句讀出原先的客觀事實，再找出其中的聯想，並推論作者背後想表達的意涵：
  - type: table
    rows:
    - - 原文
      - 客觀描寫
      - 擬人聯想
      - 作者感受或意涵
    - - 無比慶幸，能與你再次相遇
      - 能再次來到台東
      - 將台東聯想成想見的【】
      - 對於要去台東：□①感到沮喪□②充滿期待□③感到平靜
    - - 當我背向台北走向你
      - 當我離開台北來到台東
      - 將台東聯想成想見的【】
      - 對於要去台東：□①感到沮喪□②充滿期待□③感到平靜
    - - 再往前走，是你一貫的熱情閃耀，以湛藍無邊的天際擁我入懷
      - 台東一貫的：（多選）□①高溫炎熱□②人潮洶湧□③艷陽高照□④湛藍天空
      - 將台東的炎熱聯想成人的【】；將一大片天空聯想成人的【】
      - 抵達台東時：□①欣喜雀躍□②思念家鄉□③疲倦不適
    - - 在漫天風沙中的你，嚇阻著想接近你的人
      - 颳起風沙的台東，讓人卻步
      - 將台東的風沙聯想成是為了【】他人的接近
      - 台東的風沙：□①讓人驚喜□②讓人膽怯□③讓人焦慮
    - - 你多變的海岸，豐富了浪聲，也接住了每個聽海人的心聲
      - 台東多變的【】 地形，產生不同的浪聲，也滿足不同人的喜好需要
      - 將台東豐富的海岸地形，以及產生的浪聲，聯想成是為了傾聽、接住每個人
      - 台東的浪聲：□①輕柔細碎□②氣勢非凡□③豐富多樣
    - - 你才不介意，你才不介意是不是永遠在前面，你才不介意那些追逐、較量與名號
      - 無論任何評價，都不影響台東本身的美好
      - 將台東不被評價影響，聯想成台東【】評價
      - 台東的美好：□①見仁見智□②無庸置疑□③微不足道
    - - 謝謝你以熟悉的藍天藍海為我餞行
      - 離開前，看見了【】與【】
      - 將離開前的美麗風景想像成是台東為自己【】
      - 對台東的風景感到：（多選）□①難以忘懷□②稀鬆平常□③眷戀不捨□④厭倦疲乏
    - - 謝謝你在我心中存了一份天空的遼闊與陽光的燦爛
      - 離開後，難以忘記台東的【】與【】
      - 將離開後無法忘記的風景，想像成是台東送給自己的禮物
      - 對台東的風景感到：（多選）□①難以忘懷□②稀鬆平常□③眷戀不捨□④厭倦疲乏
    answers:
    - 人
    - 人
    - 熱情
    - 懷抱
    - 嚇阻
    - 海岸
    - 不介意
    - 藍天
    - 藍海
    - 餞行
    - 天空
    - 陽光
