  passage: 下了車，站前廣場依舊熱鬧，麻糬果然已經售完，在陣陣阿粨的月桃葉香中，看見青草茶店的客人仍絡繹不絕。再往前走，是你一貫的熱情閃耀，以湛藍無邊的天際擁我入懷。人比西岸是稀一點/山比西岸卻密得多港比西岸是小一點/海比西岸卻大得多報紙送到是晚一點/太陽起來卻早得多無論地球怎麼轉/台東永遠在前面在這裡的早晨，我總愛遠眺那抹屬於你的藍，並拍下每天的雲影變換；在這裡的黃昏，我總期待變化萬千的彩霞帶來的驚喜；在這裡的夜晚，避開光害便能擁有大片星空，令人迷醉且流連忘返。然而，我也見過漫天風沙中的你，嚇阻著想接近你的人，但或許，只需要一場雨，就能撫慰這片大地。最令人著迷的還是那片海。在陽光下閃耀淺藍、青藍、蔚藍、深藍的海，在月光下流動如歌、寧靜如詩的海。你多變的海岸，豐富了浪聲，也接住了每個聽海人的心聲。是因為你的廣闊，讓來到這裡的人們多了生活的餘裕，所以連心也變得柔軟了嗎？不用為了生存汲汲營營，在這裡相遇的人們，都是那麼的自在、勇敢而真誠。
