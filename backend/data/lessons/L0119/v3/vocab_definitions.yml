lesson_uid: L0119
version_id: v3
section_no: 三
vocab_definitions:
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  vocabulary_bank:
  - 風塵僕僕
  - 邂逅
  - 佇足
  - 揣想
  - 呢喃
  - 林立
  - 汲汲營營
  - 絡繹不絕
  - 遣返
  - 流連忘返
  - 一貫
  - 餞行
  items:
  - index: 1
    word: 邂逅
    definition: 偶然相遇、相逢。
  - index: 2
    word: 風塵僕僕
    definition: 旅途艱辛奔波。
  - index: 3
    word: 佇足
    definition: 停下腳步。
  - index: 4
    word: 揣想
    definition: 猜測、猜想。
  - index: 5
    word: 呢喃
    definition: 小聲說話。
  - index: 6
    word: 林立
    definition: 像樹林一樣密集排列，形容數量很多。
  - index: 7
    word: 絡繹不絕
    definition: 連續不斷，通常指人車接連不斷。
  - index: 8
    word: 一貫
    definition: 從來沒改變。
  - index: 9
    word: 流連忘返
    definition: 沉醉而不願離開。
  - index: 10
    word: 汲汲營營
    definition: 形容一心急切追求名利。
  - index: 11
    word: 遣返
    definition: 把人送回原來的國家或地區。
  - index: 12
    word: 餞行
    definition: 為人送行。相似詞有「餞別」。若歡迎歸來可用「接風」、「洗塵」。
  notes:
    note: 第 2、9 兩則原稿句末沒有句號，照原樣抄錄
