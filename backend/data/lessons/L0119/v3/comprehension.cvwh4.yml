section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 學生在操場上追逐嬉戲，「呢喃」的笑聲傳遍校園
      B: 十年同學會上，大家期待著與昔日同窗的「邂逅」
      C: 儘管面臨挑戰，公司仍堅持「一貫」的環保信念
      D: 年邁的夫妻「佇足」在公園的長椅上，看著夕陽
    explanation: (A)宜改為「喧嘩」(B)宜改為「重逢」(D)宜改為「依偎」
    explanation_source_text: 宜改為「喧嘩」宜改為「重逢」(D)宜改為「依偎」
    explanation_note: (A)(B) 兩個代號由 Word 自動編號產生，不在文字流；(D) 是literal
  - index: 2
    answer: D
    stem: 第一段「我是風塵僕僕的考生，緊湊的腳步踩著不容錯過的時刻」，請問最可能是下列何種情境？
    options:
      A: 作者考試項目是跳舞，必須踏準節拍
      B: 作者於風沙中行走，需抖落鞋中的沙
      C: 作者已遲到許久，因此必須加快腳程
      D: 作者行程緊湊，腳步匆忙，深怕耽擱
    explanation: 從考生身分，及「不容錯過」可知應該與考試的行程安排有關。
    note: 題幹說「第一段」，但引用的句子在本課第二段（第一段是引用的新詩）；原稿如此
  - index: 3
    answer: A
    stem: 下列文句的解讀何者正確？
    options:
      A: 「台北的天空被建築擠得破碎」──台北的高樓遮蔽了天空
      B: 「台北的星光被霓虹無聲淹沒」──台北人對星星不抱興趣
      C: 「台北那棋盤般的巷弄，更讓人宛如一枚身不由己的棋。」──台北方方正正的街道讓人不敢為非作歹
      D: 「那城市灰濛濛的一切，都被陣陣長風吹得好遠、好遠」──在大風中，作者視野變得更加明朗清晰
    explanation: 第3題解析：B.是指星光被霓虹的光害掩蓋 C.是指在台北生活失去自由之感 D.是指大風讓作者把在城市的煩惱拋在腦後。
    teacher_note: B.是指星光被霓虹的光害掩蓋 C.是指在台北生活失去自由之感 D.是指大風讓作者把在城市的煩惱拋在腦後。
  - index: 4
    answer: B
    stem: 關於余光中〈台東〉及本文與此詩的關係，下列敘述何者正確？
    options:
      A: 詩人藉由台東與台北的比較，強調台北的先進
      B: 詩人藉由台東、台北的比較，凸顯台東的自然開闊
      C: 作者引用此詩是為了說明台東的緩慢、尚待改善
      D: 此詩中的台東，已與本篇文中的台東相差甚遠
    explanation: 第4題解析：A.台北的先進並非此詩想強調 C.作者認為台東不介意是否在前面，與詩人D.本文中提到的大海、天空、星空都與詩中有呼應之處。
    explanation_note: '原稿如此 —— C 的說明在「與詩人」之後就斷掉，直接接上 D 的說明。

      缺的字句無從得知，不臆造補寫（見檔頭 source_errata_note）。'
    teacher_note: A.台北的先進並非此詩想強調 C.作者認為台東不介意是否在前面，與詩人D.本文中提到的大海、天空、星空都與詩中有呼應之處。
  - index: 5
    answer: C
    stem: 關於本篇文章的標題分析，下列敘述何者正確？
    options:
      A: 從「致台東」可知是將台東想像成寫信的人
      B: 從「過客」可知作者自認與觀光客有所不同
      C: 從「情書」可知此信主要訴說對台東的情感
      D: 從本文標題可知作者預計未來仍會拜訪台東
    explanation: (A)是收信人 (B)沒有特別強調與觀光客的不同(D)無法從標題得知
