lesson_uid: L0119
version_id: v3
section_no: 六
spotlight:
  strategy_name: 寫作手法：擬人──從擬人推論文章意涵
  strategy_type: writing_craft
  blocks:
  - type: concept_box
    text: '擬人，是把非人的事、物、景寫得像人一樣，會動作、會說話、會有感受或態度。擬人手法可使景物更生動，也把自己的感情放進景物裡。就像我們對小時候的玩具或娃娃一樣，可能會幫被描述的事、物、景命名、跟它說話，把它當作人一樣對待。

      而文章使用擬人之處，也是作者投入想像和感情之重點，這篇文章將台東聯想成心愛的對象，進而對其傾訴，因此閱讀時我們可以留意擬人的句子，推論作者主要想傳達的感受或意涵。'
    emphasised_phrases:
    - 這篇文章將台東聯想成心愛的對象，進而對其傾訴
    - 留意擬人的句子，推論作者主要想傳達的感受或意涵
    note: 上面兩句在原稿加了字元框線（w:bdr auto）當強調，不是答案
  - type: guide
    text: '◎小試身手

      試試看，從這篇文章的擬人句讀出原先的客觀事實，再找出其中的聯想，並推論作者背後想表達的意涵：'
  - type: fill_table
    label: ◎小試身手
    columns:
    - 原文
    - 客觀描寫
    - 擬人聯想
    - 作者感受或意涵
    rows:
    - 原文: 無比慶幸，能與你再次相遇
      客觀描寫: 能再次來到台東
      擬人聯想: 將台東聯想成想見的【　】
      擬人聯想_blanks:
      - answer: 人
      作者感受或意涵: 對於要去台東：
      作者感受或意涵_options:
        1: 感到沮喪
        2: 充滿期待
        3: 感到平靜
      作者感受或意涵_answer: 2
    - 原文: 當我背向台北走向你
      客觀描寫: 當我離開台北來到台東
      擬人聯想: ''
      作者感受或意涵: ''
      row_note: 第 3、4 欄與上一列上下合併（vMerge），原稿此列該兩格是空的
    - 原文: 再往前走，是你一貫的熱情閃耀，以湛藍無邊的天際擁我入懷
      客觀描寫: '台東一貫的：

        （多選）'
      客觀描寫_options:
        1: 高溫炎熱
        2: 人潮洶湧
        3: 艷陽高照
        4: 湛藍天空
      客觀描寫_answers:
      - 1
      - 3
      - 4
      擬人聯想: '將台東的炎熱聯想成人的【　】；

        將一大片天空聯想成人的【　】'
      擬人聯想_blanks:
      - answer: 熱情
      - answer: 懷抱
      作者感受或意涵: 抵達台東時：
      作者感受或意涵_options:
        1: 欣喜雀躍
        2: 思念家鄉
        3: 疲倦不適
      作者感受或意涵_answer: 1
    - 原文: 在漫天風沙中的你，嚇阻著想接近你的人
      客觀描寫: 颳起風沙的台東，讓人卻步
      擬人聯想: 將台東的風沙聯想成是為了【　】他人的接近
      擬人聯想_blanks:
      - answer: 嚇阻
      作者感受或意涵: 台東的風沙：
      作者感受或意涵_options:
        1: 讓人驚喜
        2: 讓人膽怯
        3: 讓人焦慮
      作者感受或意涵_answer: 2
    - 原文: 你多變的海岸，豐富了浪聲，也接住了每個聽海人的心聲
      客觀描寫: 台東多變的【　】地形，產生不同的浪聲，也滿足不同人的喜好需要
      客觀描寫_blanks:
      - answer: 海岸
      擬人聯想: 將台東豐富的海岸地形，以及產生的浪聲，聯想成是為了傾聽、接住每個人
      作者感受或意涵: 台東的浪聲：
      作者感受或意涵_options:
        1: 輕柔細碎
        2: 氣勢非凡
        3: 豐富多樣
      作者感受或意涵_answer: 3
    - 原文: 你才不介意，你才不介意是不是永遠在前面，你才不介意那些追逐、較量與名號
      客觀描寫: 無論任何評價，都不影響台東本身的美好
      擬人聯想: 將台東不被評價影響，聯想成台東【　】評價
      擬人聯想_blanks:
      - answer: 不介意
      作者感受或意涵: 台東的美好：
      作者感受或意涵_options:
        1: 見仁見智
        2: 無庸置疑
        3: 微不足道
      作者感受或意涵_answer: 2
    - 原文: 謝謝你以熟悉的藍天藍海為我餞行
      客觀描寫: 離開前，看見了【　】與【　】
      客觀描寫_blanks:
      - answer: 藍天
      - answer: 藍海
      擬人聯想: 將離開前的美麗風景想像成是台東為自己【　】
      擬人聯想_blanks:
      - answer: 餞行
      作者感受或意涵: 對台東的風景感到：（多選）
      作者感受或意涵_options:
        1: 難以忘懷
        2: 稀鬆平常
        3: 眷戀不捨
        4: 厭倦疲乏
      作者感受或意涵_answers:
      - 1
      - 3
    - 原文: 謝謝你在我心中存了一份天空的遼闊與陽光的燦爛
      客觀描寫: 離開後，難以忘記台東的【　】與【　】
      客觀描寫_blanks:
      - answer: 天空
      - answer: 陽光
      擬人聯想: 將離開後無法忘記的風景，想像成是台東送給自己的禮物
      作者感受或意涵: ''
      row_note: 第 4 欄與上一列上下合併（vMerge），原稿此格是空的
    answer_carrier: '填空是橘色手寫體（文字流查得到）；選擇題是紅色 ☑（w:sym Wingdings F0FE）。

      「原文」欄的擬人字句在原稿加了底線當標記，不是答案。'
