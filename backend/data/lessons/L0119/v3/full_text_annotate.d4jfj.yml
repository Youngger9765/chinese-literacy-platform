full_text_annotate:
  header: 第21課  致台東：一封過客的情書
  paragraph_count: 8
  paragraphs:
  - idx: 1
    type: verse
    text: '城比台北是矮一點/天比台北卻高得多

      燈比台北是淡一點/星比台北卻亮得多

      街比台北是短一點/風比台北卻長得多

      飛機過境是少一點/老鷹盤空卻多得多'
    citation: 新詩引用：余光中，〈台東〉
  - idx: 2
    text: 在見過你之前，我便讀過你、聽過你。與你邂逅的那日，我是風塵僕僕的考生，緊湊的腳步踩著不容錯過的時刻；我是無法佇足的旅人，揣想眼前風景或許是第一眼也是最後一眼。單日往返台北與你的那天，我在心裡反覆呢喃著這首詩，而那遠方的藍，已足夠使我眷戀。
  - idx: 3
    text: 無比慶幸，能與你再次相遇。搭乘火車，我總喜歡靠窗的位子，喜歡目送林立的高樓大廈慢慢後退，喜歡等待平坦寬廣的田野悄悄映入眼簾，而當火車駛入花東縱谷，靠向我的層層山巒彷彿是你的溫柔迎接。台北的天空被建築擠得破碎，台北的星光被霓虹無聲淹沒，而台北那棋盤般的巷弄，更讓人宛如一枚身不由己的棋。但當我背向台北走向你，那城市灰濛濛的一切，都被陣陣長風吹得好遠、好遠。
  - idx: 4
    text: 下了車，站前廣場依舊熱鬧，麻糬果然已經售完，在陣陣阿粨的月桃葉香中，看見青草茶店的客人仍絡繹不絕。再往前走，是你一貫的熱情閃耀，以湛藍無邊的天際擁我入懷。
  - idx: 5
    type: verse
    text: '人比西岸是稀一點/山比西岸卻密得多

      港比西岸是小一點/海比西岸卻大得多

      報紙送到是晚一點/太陽起來卻早得多

      無論地球怎麼轉/台東永遠在前面'
  - idx: 6
    text: 在這裡的早晨，我總愛遠眺那抹屬於你的藍，並拍下每天的雲影變換；在這裡的黃昏，我總期待變化萬千的彩霞帶來的驚喜；在這裡的夜晚，避開光害便能擁有大片星空，令人迷醉且流連忘返。然而，我也見過漫天風沙中的你，嚇阻著想接近你的人，但或許，只需要一場雨，就能撫慰這片大地。
  - idx: 7
    text: 最令人著迷的還是那片海。在陽光下閃耀淺藍、青藍、蔚藍、深藍的海，在月光下流動如歌、寧靜如詩的海。你多變的海岸，豐富了浪聲，也接住了每個聽海人的心聲。是因為你的廣闊，讓來到這裡的人們多了生活的餘裕，所以連心也變得柔軟了嗎？不用為了生存汲汲營營，在這裡相遇的人們，都是那麼的自在、勇敢而真誠。
  - idx: 8
    text: 而我想，你才不介意，你才不介意是不是永遠在前面，你才不介意那些追逐、較量與名號，畢竟那都無法影響你的美好。只是，我終究是個過客，終將被時間遣返。謝謝你以熟悉的藍天藍海為我餞行，謝謝你在我心中存了一份天空的遼闊與陽光的燦爛，謝謝你讓我在下一次仰望星空、眺望大海時能尋回你、想念你。謝謝你，台東。
