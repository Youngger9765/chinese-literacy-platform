intro: 這篇文章是一位旅人寫給台東的情書。作者透過對比台北與台東在天空、燈光、街道、自然景觀等方面的差異，描繪出台東獨特的魅力。文章細膩地捕捉了作者在台東的各種感受，從初次匆匆一瞥的驚鴻，到火車上欣賞縱谷山巒的溫柔，再到漫步市集感受在地氣息，以及沉醉於台東的藍天、大海與星空。作者也觀察到台東居民的自在與真誠，並反思台東不受外界紛擾的特質。雖然作者知道自己終究是個過客，但台東留給他的遼闊與燦爛，將成為心中永恆的思念。
notes:
  總表_議題: 自然之美、鄉土情感
strategy_explained: '這一課我們要學的，是從「擬人」這個修辭手法，去感受作者對台東有多喜歡

  因為作者把台東的山、海、甚至天空都寫得像是有生命、有情感一樣，就像在跟朋友訴說心事一樣，這讓台東的景物變得好有溫度

  所以讀的時候，你可以試著想像一下，如果這些景物真的會說話、有感覺，它們會對作者說些什麼呢'
