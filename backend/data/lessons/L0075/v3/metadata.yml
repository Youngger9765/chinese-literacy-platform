strategy_explained: '這一課，我們要練習從故事裡找出「遇到的困難」、「大家怎麼想辦法解決」以及「最後的結果」

  這篇文章裡，白鯨被冰困住、又害怕船的聲音，這些都是很清楚的問題，而村民和科學家運用創意想辦法，最後成功救了白鯨，正好可以練習找出這些部分

  所以你讀的時候，可以一邊想「發生了什麼問題」、「有哪些人做了什麼事來幫忙」、「最後怎麼樣了」，這樣就能把文章重點抓得好好的'
