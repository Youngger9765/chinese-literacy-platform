version_id: v3
section_no: 六
spotlight:
  strategy_name: 摘要策略—問題—解決—結果找重點
  strategy_type: summary
  answer_carrier: 全部是橘色手寫填空＋三條手繪連線；本課完全沒有 ☑（w:sym F0FE 計數 0）
  blocks:
  - type: concept_box
    text: '這篇文章是一篇報導式說明文，記錄白鯨受困後，人們一步一步展開救援，直到白鯨脫離險境的過程。全文可以整理成「問題—解決—結果」：白鯨遇到什麼危機？哪些人先後採取了什麼行動？最後帶來什麼結果？

      上一課我們已經學過怎麼用線索，找出「問題、解決、結果」，這一課，我們要運用同樣的方法，自己整理重點。你還記得找重點的祕訣嗎？請你連連看。'
  - type: matching
    left_header: 結構
    right_header: 祕訣
    left:
      1: 問題
      2: 解決
      3: 結果
    right:
      A: 通常在文章後面，寫出行動後帶來的改變或成果，可能出現「結果」、「最後」等關鍵詞。
      B: 通常在文章前面，寫出需要解決的不好的事或困難。
      C: 通常在文章中段，寫出誰想到辦法、做了什麼。
    answer:
      1: B
      2: C
      3: A
    answer_carrier: "\U0001F534 三條手繪連線，**只在圖形層**（連連看表格內的 3 個 prstGeom prst=\"line\"\
      ），\n且 **PDF 完全沒有渲染它們** —— 光看 PDF 會以為這題沒有答案。\n判定依據（兩條互相獨立的證據都指向同一組對應）：\n① 幾何：三條線的端點\
      \ y 值把左欄三列（問題 y≈0／解決 y≈915253／結果 y≈1737033）\n   分別接到右欄的 B(y≈915819)／C(y≈1666990)／A(y≈2)。\n\
      \   其中接到 A 的那條帶 flipV=\"1\"（由下往上），跨距 1737031 正好是兩列高。\n② 語意：B 說「文章前面…需要解決的困難」＝問題；C\
      \ 說「文章中段…誰做了什麼」＝解決；\n   A 說「文章後面…行動後的成果」＝結果。"
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 現在要給你一個比較難的任務哦，請你用上一課學到的方法，找出「白鯨救援」這一課的「問題、解決、結果」。
  - type: fill_table
    columns:
    - 元素/段落
    - 提示
    - 重點
    rows:
    - 元素/段落: 問題/2
      提示: 描述一個「不好的事或困難」
      重點: '白鯨遇到什麼危機？

        白鯨群【　】'
      blanks:
      - answer: 困在冰原裡，冰洞愈來愈小，因為無法換氣快要窒息了
    - 元素/段落: 解決/3~6
      提示: 有人想出辦法或行動 (誰＋做什麼)
      重點: '1.村民【　】，但仍無法解除危機。

        2.政府【　】，但白鯨害怕噪音，不敢前進。

        3.船員【　】'
      blanks:
      - answer: 鑿開冰洞、餵白鯨吃冷凍魚
      - answer: 派破冰船救援，開出一條20多公里的水道
      - answer: 播放古典音樂引導白鯨前進
    - 元素/段落: 結果/6
      提示: 行動後，帶來什麼改變？
      重點: 【　】
      blanks:
      - answer: 數千頭白鯨游出冰原，回到大海
  - type: self_check
    label: ◎自我檢核
    instruction: 一、請你自己檢查以下2項，確定自己是否會抓重點了。
    items:
    - 1.我能自己找出文章的問題、解決和結果。
    - 2.我能依照事情發展，整理不同人一步一步採取的解決行動。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 二、如果兩項都打勾，恭喜你，你已經學會找文章「問題、解決、結果」的方法，這對你理解文章、記憶文章內容，都有很大的幫助哦。你超厲害的！
  - type: guide
    text: 三、不相信你具備這種能力？不然你試著不看課本，把這個故事用「問題、解決、結果」的結構講給好朋友聽聽看。
