    text: (A)漣漪是細微的感受，和句子情境不符(B)宜改為「自私」(C)宜改為「一反常態」(A)漣漪是細微的感受，和句子情境不符(B)宜改為「自私」(C)宜改為「一反常態」六閱讀理解六閱讀理解請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
