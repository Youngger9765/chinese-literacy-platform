spotlight:
  lesson: G5-L10
  strategy_name: 品格力-情緒覺察與調節-當我「吃醋」時
  strategy_type: sel_character
  blocks:
  - type: free_text
    prompt: (7)幸好同學及時發現他的(  G  )，才來得及在他暈倒前扶住他。
  - type: free_text
    prompt: (8)看見多年不見的老友，他開心的(  A  )腳步迎上前去。
  - type: guide
    text: 五文章重點表 五文章重點表 日記常用來記錄生活事件與心情感受，並藉此抒發情緒，上一篇小日記整理了作者經歷的事件與感受，這一篇則有更多作者內心的矛盾、掙扎，就讓我們用「事件─矛盾的想法與反應」來整理看看吧！
  - type: table
    rows:
    - - 感情小日記3──吃醋的滋味
    - - 段落
      - 事件
      - 矛盾的想法與反應
    - - 二、三
      - 看見自己的【】和喜歡的人聊得很開心
      - A.覺得很正常、不值得【】B.覺得胸口【】、不是滋味
    - - 四
      - 轉身離開現場，回到教室座位
      - Ａ.不想再看下去B.【】卻無法停止
    - - 五
      - 朋友阿葉來關心
      - Ａ.認為自己沒有回應阿葉，太【】B.認為阿葉忽略自己的心情，所以不想  【】
    - - 六
      - 獨自反思
      - Ａ.心情亂成一團，心裡莫名【】B.不想對朋友【】、不想承認因為阿葉【】
    - - 統整
      - 作者看見【】和喜歡的人聊天，心裡不是滋味，卻又不想承認自己在吃醋。作者寫下這篇小日記，是想抒發心情 （□①煩躁混亂  □②寂寞無奈）的感受。
    answers:
    - 朋友
    - 放在心上
    - 悶悶
    - 思緒
    - 小氣
    - 開口回應
    - 煩躁
    - 擺臭臉
    - 吃醋
    - 朋友/阿葉
  - type: passage
    source: unknown
    paragraphs:
    - 五品格聚光燈情緒覺察與調節—當我「吃醋」時五品格聚光燈情緒覺察與調節—當我「吃醋」時
  - type: guide
    text: 一、辨識「吃醋」
  - type: single
    prompt: 1.根據文章，作者看見朋友和喜歡的人聊得很開心後，你覺得哪些行為、情緒、反應是因為吃醋而產生的呢？（可複選，沒有標準答案，請依據你自己的想法、感受判斷）
    options:
    - 作者愣了一下，停下腳步，猶豫要不要走過去
    - 作者深吸一口氣，轉身走回教室，假裝自己不在意
    - 作者覺得胸口悶悶的，好像吞下了一顆沒嚼碎的糖果，卡在喉嚨裡
    - 作者低下頭，假裝在看書，眼神死死盯著書頁上的字
    - 作者生氣為什麼朋友那麼不貼心、為什麼自己要在意這些事
    - 作者不想回應阿葉的關心，還默默往旁邊挪了一點，遠離阿葉
    answer: 作者愣了一下，停下腳步，猶豫要不要走過去
  - type: single
    prompt: 2.下列哪些情境你會「吃醋」？（可複選）
    options:
    - 想和他一起完成的事，他卻先找別人了。
    - 他有心事不告訴我，卻和別的同學分享。
    - 他下課就只會打球，也不找我聊天。
    - 他很少發動態，但發了和別人一起出去玩的照片。
    - 他和別人有一些我無法參與的共同話題和小默契。
    - 明明你也有努力和付出，但他只稱讚別人。
    answer: 想和他一起完成的事，他卻先找別人了。
  - type: guide
    text: ※吃醋可能混合多種情緒，請從下列中選出你有過的感覺：（可複選）
  - type: multi
    prompt: 請選擇
    options:
    - 生氣
    - 難過
    - 羞愧
    - 失落
    - 焦慮
    - 不甘心
    - ⑦想哭
    - □⑧羨慕　□⑨嫉妒　□⑩討厭對方　□⑪想裝沒事
    - ⑫悶悶的
    answer:
    - 生氣
    - 難過
    - 羞愧
    - 失落
    - 焦慮
    - 不甘心
    - ⑦想哭
    - □⑧羨慕　□⑨嫉妒　□⑩討厭對方　□⑪想裝沒事
    - ⑫悶悶的
  - type: guide
    text: 二、理解「吃醋」：吃醋的原因大概可以分為以下四種──
  - type: table
    rows:
    - - 成因類型
      - 說明
      - 舉例
    - - 1.被忽略或被排除的感覺
      - 覺得自己不再是他的第一順位。
      - 好友下課沒來找你，卻和其他人一起走。
    - - 2.對關係的不安全感
      - 擔心朋友或喜歡的人對你的感情改變了。
      - 他最近常和別人聊天，跟我說話越來越少。
    - - 3.「和別人比較」引起
      - 覺得他對別人比較好，而你「輸了」。
      - 朋友在群組只回別人訊息，沒回你。
    - - 4.內心期望沒被滿足
      - 你希望他主動、靠近你，但他沒那麼做。
      - 你以為他知道你想一起吃午餐，結果他沒找你。
  - type: guide
    text: ※你覺得你自己比較常因為哪些原因吃醋呢？
  - type: multi
    prompt: 請選擇
    options:
    - 被忽略或被排除的感覺
    - 對關係的不安全感
    - 「和別人比較」引起
    - 內心期望沒被滿足
    answer:
    - 被忽略或被排除的感覺
    - 對關係的不安全感
    - 「和別人比較」引起
    - 內心期望沒被滿足
  - type: guide
    text: 三、調節情緒：6A策略──覺察（Aware）、承認（Acknowledge）、允許（Allow）、接納（Accept）、轉化（Action）、欣賞（Appreciate）
  - type: table
    rows:
    - - 6A策略
      - 實際演練
    - - 覺察（Aware）
      - 我發現我在吃醋，我感到【】、【】、【】（根據一、辨識「吃醋」練習，寫下你常見的三個情緒）
    - - 承認（Acknowledge）
      - 我承認我在吃醋，會有吃醋的心情很正常。
    - - 允許（Allow）
      - 我允許我吃醋，我知道吃醋是因為【】。（根據二、理解「吃醋」練習，寫下你最常發生的吃醋原因）
    - - 接納（Accept）
      - 我接納我吃醋，我知道這是因為我也想被放在心上。
    - - 轉化（Action）
      - ◎我可以……（勾選你願意嘗試的，可複選）□①嘗試換個角度，找到不同的解釋□②和朋友好好談談自己的感受□③把感覺寫下來、畫下來□④轉移注意力：先做些讓自己開心的事，轉換情緒□⑤不要立刻下判斷，先觀察一陣子再說□⑥告訴自己：這不代表我不夠好□⑦其他：_____________________________
    - - 欣賞（Appreciate）
      - 我願意謝謝、欣賞我自己，努力面對、調節這份不舒服的感受，不讓它變成傷人、傷害關係的行為。
  - type: passage
    source: unknown
    paragraphs:
    - 「吃醋」不代表你小氣、不成熟，而是表示你很在乎這份關係。願你學會照顧這些「不太想說出來」的情緒，學會在矛盾裡停下來、承認它、接納它，聽一聽自己的心，也願你在下一次感到「吃醋」的時候，更溫柔的理解自己❤︎
