  passage: 我盯著他們，心裡有點不是滋味。但這應該很正常吧？他們本來就是小學同學，話題比較多也沒什麼奇怪的……而且，我又不是那種愛計較的人，這種小事根本不值得放在心上。可是，如果真的沒什麼，那為什麼不肯邁開腳步走過去？為什麼胸口悶悶的，好像吞下了一顆沒嚼碎的糖果，卡在喉嚨裡？我深吸一口氣，轉身走回教室，不想再看下去，假裝自己根本不在意。可是，回到座位後，思緒卻無法停止。阿葉下課沒有找我一起去，或許只是剛好……可如果真的是這樣，為什麼我覺得有點失落？還是其實阿葉也喜歡他？這些念頭讓我的情緒越來越低落，甚至開始有點生氣，生氣他們看起來什麼都能聊、生氣為什麼朋友那麼不貼心、生氣自己為什麼要在意這些事情。後來阿葉回到教室，一進門就朝我走來。阿葉問我怎麼沒去福利社，聲音一如往常，語氣輕快，像是完全沒察覺我的異樣。我應該要像平常一樣回應他，裝作什麼事都沒有發生，可是——我就是不想開口。我低下頭，假裝在看書，眼神死死盯著書頁上的字，卻完全讀不進去。心裡有個聲音在喊：「你這樣是不是太小氣了？阿葉又沒有做錯什麼……」但另一個聲音又冒出來：「可是他難道不知道我也想一起聊天嗎？」於是，我什麼都沒說，只是默默往旁邊挪了一點，阿葉只說了聲「好吧！」就轉身離開了。
  start_text: 我盯著他們，心裡有點不是滋味。但這應該很正常吧？
