lesson_uid: L0022
version_id: v3
section_no: 五
keypoints:
  title: 感情小日記3──吃醋的滋味
  layout: matrix
  columns:
  - 段落
  - 事件
  - 矛盾的想法與反應
  instruction: 日記常用來記錄生活事件與心情感受，並藉此抒發情緒，上一篇小日記整理了作者經歷的事件與感受，這一篇則有更多作者內心的矛盾、掙扎，就讓我們用「事件─矛盾的想法與反應」來整理看看吧！
  rows:
  - 段落: 二、三
    事件: 看見自己的【　】和喜歡的人聊得很開心
    事件_blanks:
    - answer: 朋友
    矛盾的想法與反應: 'A.覺得很正常、不值得【　】

      B.覺得胸口【　】、不是滋味'
    矛盾的想法與反應_blanks:
    - answer: 放在心上
    - answer: 悶悶
  - 段落: 四
    事件: 轉身離開現場，回到教室座位
    矛盾的想法與反應: 'A.不想再看下去

      B.【　】卻無法停止'
    矛盾的想法與反應_blanks:
    - answer: 思緒
  - 段落: 五
    事件: 朋友阿葉來關心
    矛盾的想法與反應: 'A.認為自己沒有回應阿葉，太【　】

      B.認為阿葉忽略自己的心情，所以不想【　】'
    矛盾的想法與反應_blanks:
    - answer: 小氣
    - answer: 開口回應
  - 段落: 六
    事件: 獨自反思
    矛盾的想法與反應: 'A.心情亂成一團，心裡莫名【　】

      B.不想對朋友【　】、不想承認因為阿葉【　】'
    矛盾的想法與反應_blanks:
    - answer: 煩躁
    - answer: 擺臭臉
    - answer: 吃醋
  - 段落: 統整
    事件: 作者看見【　】和喜歡的人聊天，心裡不是滋味，卻又不想承認自己在吃醋。作者寫下這篇小日記，是想抒發心情（　）的感受。
    事件_colspan: 2
    事件_blanks:
    - answer: 朋友/阿葉
    事件_options:
      1: 煩躁混亂
      2: 寂寞無奈
    事件_answer: 1
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
