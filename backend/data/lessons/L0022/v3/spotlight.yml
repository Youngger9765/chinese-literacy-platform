version_id: v3
section_no: 六
spotlight:
  section_no_printed: 五
  strategy_name: 情緒覺察與調節—當我「吃醋」時
  strategy_type: character
  blocks:
  - type: concept_box
    text: 本文作者看到「朋友和自己喜歡的人聊天」，內心產生許多矛盾的想法，也發現自己在「吃醋」。「吃醋」是指當你在意的人去親近別人時，你感到不開心的情緒。如果我們不懂得怎麼面對這個情緒，就可能會用疏離、冷淡、責怪或自責的方式回應，反而讓關係受傷，也讓自己更難受。因此，學習辨認、理解和調節「吃醋」的情緒，也是成長中重要的一課，讓我們一起來看看！
  - type: guide
    text: 一、辨識「吃醋」
  - type: multi
    no_correct_answer: true
    index: 1
    prompt: 根據文章，作者看見朋友和喜歡的人聊得很開心後，你覺得哪些行為、情緒、反應是因為吃醋而產生的呢？（可複選，沒有標準答案，請依據你自己的想法、感受判斷）
    options:
      1: 作者愣了一下，停下腳步，猶豫要不要走過去
      2: 作者深吸一口氣，轉身走回教室，假裝自己不在意
      3: 作者覺得胸口悶悶的，好像吞下了一顆沒嚼碎的糖果，卡在喉嚨裡
      4: 作者低下頭，假裝在看書，眼神死死盯著書頁上的字
      5: 作者生氣為什麼朋友那麼不貼心、為什麼自己要在意這些事
      6: 作者不想回應阿葉的關心，還默默往旁邊挪了一點，遠離阿葉
    answers: null
    answer_carrier: 題目明寫「沒有標準答案」，學生自填；原稿無勾選
  - type: multi
    no_correct_answer: true
    index: 2
    prompt: 下列哪些情境你會「吃醋」？（可複選）
    options:
      1: 想和他一起完成的事，他卻先找別人了。
      2: 他有心事不告訴我，卻和別的同學分享。
      3: 他下課就只會打球，也不找我聊天。
      4: 他很少發動態，但發了和別人一起出去玩的照片。
      5: 他和別人有一些我無法參與的共同話題和小默契。
      6: 明明你也有努力和付出，但他只稱讚別人。
    answers: null
    answer_carrier: 學生自填，原稿無勾選
  - type: multi
    no_correct_answer: true
    prompt: ※吃醋可能混合多種情緒，請從下列中選出你有過的感覺：（可複選）
    options:
      1: 生氣
      2: 難過
      3: 羞愧
      4: 失落
      5: 焦慮
      6: 不甘心
      7: 想哭
      8: 羨慕
      9: 嫉妒
      10: 討厭對方
      11: 想裝沒事
      12: 悶悶的
    answers: null
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 二、理解「吃醋」：吃醋的原因大概可以分為以下四種──
  - type: table
    columns:
    - 成因類型
    - 說明
    - 舉例
    rows:
    - - 1.被忽略或被排除的感覺
      - 覺得自己不再是他的第一順位。
      - 好友下課沒來找你，卻和其他人一起走。
    - - 2.對關係的不安全感
      - 擔心朋友或喜歡的人對你的感情改變了。
      - 他最近常和別人聊天，跟我說話越來越少。
    - - 3.「和別人比較」引起
      - 覺得他對別人比較好，而你「輸了」。
      - 朋友在群組只回別人訊息，沒回你。
    - - 4.內心期望沒被滿足
      - 你希望他主動、靠近你，但他沒那麼做。
      - 你以為他知道你想一起吃午餐，結果他沒找你。
  - type: multi
    no_correct_answer: true
    prompt: ※你覺得你自己比較常因為哪些原因吃醋呢？
    options:
      1: 被忽略或被排除的感覺
      2: 對關係的不安全感
      3: 「和別人比較」引起
      4: 內心期望沒被滿足
    answers: null
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: 三、調節情緒：6A策略──覺察（Aware）、承認（Acknowledge）、允許（Allow）、接納（Accept）、轉化（Action）、欣賞（Appreciate）
  - type: fill_table
    columns:
    - 6A策略
    - 實際演練
    rows:
    - 6A策略: 覺察（Aware）
      no_correct_answer: true
      實際演練: 我發現我在吃醋，我感到【　】、【　】、【　】（根據一、辨識「吃醋」練習，寫下你常見的三個情緒）
      實際演練_blanks:
      - answer: null
      - answer: null
      - answer: null
      note: 三個空格由學生自填，原稿留白
    - 6A策略: 承認（Acknowledge）
      實際演練: 我承認我在吃醋，會有吃醋的心情很正常。
    - 6A策略: 允許（Allow）
      實際演練: 我允許我吃醋，我知道吃醋是因為【　】。（根據二、理解「吃醋」練習，寫下你最常發生的吃醋原因）
      實際演練_blanks:
      - answer: null
      note: 空格由學生自填，原稿留白
    - 6A策略: 接納（Accept）
      實際演練: 我接納我吃醋，我知道這是因為我也想被放在心上。
    - 6A策略: 轉化（Action）
      實際演練: ◎我可以……（勾選你願意嘗試的，可複選）
      實際演練_options:
        1: 嘗試換個角度，找到不同的解釋
        2: 和朋友好好談談自己的感受
        3: 把感覺寫下來、畫下來
        4: 轉移注意力：先做些讓自己開心的事，轉換情緒
        5: 不要立刻下判斷，先觀察一陣子再說
        6: 告訴自己：這不代表我不夠好
        7: 其他：
      實際演練_answers: null
      note: 學生自填，原稿無勾選；第 7 項後面是一條手寫底線
    - 6A策略: 欣賞（Appreciate）
      實際演練: 我願意謝謝、欣賞我自己，努力面對、調節這份不舒服的感受，不讓它變成傷人、傷害關係的行為。
  - type: concept_box
    text: 「吃醋」不代表你小氣、不成熟，而是表示你很在乎這份關係。願你學會照顧這些「不太想說出來」的情緒，學會在矛盾裡停下來、承認它、接納它，聽一聽自己的心，也願你在下一次感到「吃醋」的時候，更溫柔的理解自己❤︎
