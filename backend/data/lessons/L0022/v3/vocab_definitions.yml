lesson_uid: L0022
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank:
  - 靦腆
  - 計較
  - 邁開
  - 愣
  - 思緒
  - 一如往常
  - 異樣
  - 莫名
  - 漣漪
  items:
  - index: 1
    word: 思緒
    definition: 內心的想法、思考的歷程。
  - index: 2
    word: 邁開
    definition: 跨步向前。
  - index: 3
    word: 計較
    definition: 計算、比較，通常用於在意細節或小事。
  - index: 4
    word: 莫名
    definition: 說不出原因、無法解釋的感覺。
  - index: 5
    word: 漣漪
    definition: 水面上微小的波紋，也可比喻內心的細微感受或變化。
  - index: 6
    word: 異樣
    definition: 不一樣、和平常不同。
  - index: 7
    word: 靦腆
    definition: 不好意思、害羞的樣子。
  - index: 8
    word: 一如往常
    definition: 和以前一樣，沒有改變。
  - index: 9
    word: 愣
    definition: 因為驚訝、害怕或一時反應不過來，而短暫的停住或不說話、不動作。
  answer_carrier: 橘色手寫字（圖形層），文字流有字但無顏色資訊
