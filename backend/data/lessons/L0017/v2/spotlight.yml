spotlight:
  lesson: G4-L6
  strategy_name: 品格力-自我覺察-是友情還是愛情
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ◎接著，請再試著思考，以下的互動，對你來說，更偏向友情還是愛情呢？一樣沒有正確答案哦！
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ◎根據上面的回答，以及你自己的觀察，關於友情與愛情差異，哪些是你認同的？請打勾，也可以寫上自己的想法。
  - type: passage
    source: unknown
    paragraphs:
    - (自由填寫) 如果_________________________________________，就偏向愛情。
    - '謝謝你的嘗試與覺察，相信透過回答，你也更了解了自己的感受！

      友情與愛情的界線，有時真的不容易分清楚。但比起急著為關係命名，更重要的是，你有沒有注意到自己的「在意」和「情緒」，你對關係的理解、期待，及如何看待人與人之間的互動。願你記得，關係不必馬上定義，但你的感受值得被看見、被理解。這就是認識自己的開始。❤︎'
