spotlight:
  lesson: G4-L6
  strategy_name: 品格力-自我覺察-是友情還是愛情
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)
  - type: table
    rows:
    - - 互動與反應
      - 較偏向的感情類型(勾選)
    - - 1.被詢問要不要幫忙時，突然結巴、害羞
      - □①友情 □②愛情 □③難以區分
    - - 2.上體育課被分到同一組時，感到害羞、緊張
      - □①友情 □②愛情 □③難以區分
    - - 3.時常關注他的一言一行、一舉一動
      - □①友情 □②愛情 □③難以區分
    - - 4.喜歡回想和他相處的片段
      - □①友情 □②愛情 □③難以區分
    - - 5.被他幫忙、被他叫到名字時感到心裡發熱
      - □①友情 □②愛情 □③難以區分
    - - 6.因為他而特別期待上學
      - □①友情 □②愛情 □③難以區分
  - type: guide
    text: ◎接著，請再試著思考，以下的互動，對你來說，更偏向友情還是愛情呢？一樣沒有正確答案哦！
  - type: table
    rows:
    - - 互動方式
      - 較偏向的感情類型(勾選)
    - - 1.我喜歡和他一起聊天或玩手遊，也會約好幾個朋友一起上線。
      - □①友情 □②愛情 □③難以區分
    - - 2.是我唯一每天傳「晚安」的對象，有時還會期待收到他的貼圖或表情符號。
      - □①友情 □②愛情 □③難以區分
    - - 3.他一整天沒回我訊息，我就會開始覺得是不是我做錯了什麼。
      - □①友情 □②愛情 □③難以區分
    - - 4.我們會互相傾吐心事，也會為彼此保守秘密。
      - □①友情 □②愛情 □③難以區分
    - - 5.他如果和某位同學有親密的互動，我會很在意。
      - □①友情 □②愛情 □③難以區分
    - - 6.當我難過的時候，他總是第一個關心我、陪我說話、讓我開心。
      - □①友情 □②愛情 □③難以區分
    - - 7.我們會聊到未來畢業後還可以怎麼保持聯絡。
      - □①友情 □②愛情 □③難以區分
    - - 8.他常提醒我帶東西、寫作業，也很樂意和我討論作業怎麼做。
      - □①友情 □②愛情 □③難以區分
    - - 9.聽到我受委屈、被誤會，他會為我打抱不平。
      - □①友情 □②愛情 □③難以區分
    - - 10.我們有很多共同興趣和話題，也很願意分享。
      - □①友情 □②愛情 □③難以區分
  - type: guide
    text: ◎根據上面的回答，以及你自己的觀察，關於友情與愛情差異，哪些是你認同的？請打勾，也可以寫上自己的想法。
  - type: passage
    source: unknown
    paragraphs:
    - (自由填寫) 如果_________________________________________，就偏向愛情。
    - 謝謝你的嘗試與覺察，相信透過回答，你也更了解了自己的感受！友情與愛情的界線，有時真的不容易分清楚。但比起急著為關係命名，更重要的是，你有沒有注意到自己的「在意」和「情緒」，你對關係的理解、期待，及如何看待人與人之間的互動。願你記得，關係不必馬上定義，但你的感受值得被看見、被理解。這就是認識自己的開始。❤︎
  - type: guide
    text: 宜改為「自信」宜改為「精心」(D)宜改為「條理清楚」宜改為「自信」宜改為「精心」(D)宜改為「條理清楚」請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
