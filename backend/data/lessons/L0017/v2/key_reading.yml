passage: '回家路上，我常常偷偷回想我們一整天相處的片段，像是在腦袋裡播一部只屬於自己的小電影。想到他幫我撿掉在地上的筆，或是在小組討論時不經意叫我的名字，我心裡就會不自覺發熱，像被陽光輕輕照到一樣。可是，我也不懂為什麼這種感覺只對他有。其他同學也對我很好啊，但那種溫暖又興奮的感覺，卻只有在他身上才會發生。更奇怪的是，我甚至開始期待每天上學，只要一想到可能會跟他

  這到底是什麼感覺呢？為什麼他會如此吸引我的目光？這感覺跟我對朋友不太一樣，卻又說不上來是哪裡不同。我只是單純覺得他很不錯，和他相處總是很開心。好複雜，我覺得我的腦袋要炸掉了。'
