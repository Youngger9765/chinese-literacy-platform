strategy: 品格力──自我覺察－是友情還是愛情
課文學習單: 張筱晴
lesson_no: 6
series: 一般
lesson_seq: 4060
intro: 這篇文章記錄了作者心中一段複雜的情感。作者發現自己對某個同學產生了不同於一般友誼的特別感覺，這種感覺讓她感到困惑和好奇。透過描述與這位同學相處時的點點滴滴，例如對方無心的關心、一個微笑，或是無意間的眼神交會，都讓作者心跳加速、臉紅害羞。作者也觀察到自己會特別關注這位同學的動態，並在回憶與他相處的時光時感到開心。然而，這種感覺與對其他朋友的感情有所不同，作者試圖釐清這份特別的情感究竟是什麼。
