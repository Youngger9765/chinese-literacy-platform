strategy_explained: 這一課我們要學習的是「認識自己的感覺」，也就是SEL的「自我覺察」能力，就像作者一樣，你會發現自己對某個同學特別在意，會因為他的一句話或一個笑容而心跳加速、臉紅害羞，這篇文章記錄的正是這種特別的心情，讀的時候，你可以試著想想，當你讀到這些描述時，自己是不是也有類似的感覺，並且試著用自己的話說說看，你現在心裡是什麼樣的感覺
