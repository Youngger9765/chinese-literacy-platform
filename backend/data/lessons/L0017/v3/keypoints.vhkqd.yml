keypoints:
  title: 感情小日記1──是友情還是愛情？
  intro: 日記常用來記錄生活事件與心情感受，並藉此抒發情緒，因此讀日記時，我們也透過整理作者經歷的事件及感受來理解日記內容。
  layout: matrix
  columns:
  - 段落
  - 事件
  - 感受
  answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  rows:
  - 段落: 二
    事件: 他主動詢問要幫我交【　】
    事件_blanks:
    - answer: 聯絡簿
    感受: (勾選，可複選)
    感受_options:
      1: 茫然
      2: 害羞
      3: 緊張
    感受_answers:
    - 1
    - 2
    - 3
  - 段落: 三
    事件: 【　】課被分在同一組
    事件_blanks:
    - answer: 體育
    感受: 【　】漏了一拍
    感受_blanks:
    - answer: 心跳
  - 段落: 四
    事件: 習慣看向他、【　】突然對上、偷偷觀察他
    事件_blanks:
    - answer: 眼神
    感受: 在乎、緊張、期待
  - 段落: 五
    事件: 幫我撿掉在地上的筆、小組討論時叫我的【　】
    事件_blanks:
    - answer: 名字
    感受: (勾選，可複選)
    感受_options:
      1: 溫暖
      2: 害羞
      3: 興奮
    感受_answers:
    - 1
    - 2
    - 3
  - 段落: 統整
    事件: 結合第一段與最後一段，作者寫下這篇小日記，是想抒發（　）的心情。
    事件_options:
      1: 不知所措
      2: 深情思念
    事件_answer: 1
    note: 此列的「事件」與「感受」兩欄在教材上合併成一格，內容橫跨整列
