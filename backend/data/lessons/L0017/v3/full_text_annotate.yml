  - idx: 6
    text: 這到底是什麼感覺呢？為什麼他會如此吸引我的目光？這感覺跟我對朋友不太一樣，卻又說不上來是哪裡不同。我只是單純覺得他很不錯，和他相處總是很開心。好複雜，我覺得我的腦袋要炸掉了。
