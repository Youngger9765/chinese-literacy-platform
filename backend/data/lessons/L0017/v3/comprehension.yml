lesson_uid: L0017
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項「　」中的語詞，何者使用正確？
    options:
      A: 由於經過充分的準備，輪到他上台報告時，他一臉「茫然」
      B: 他「不經意」準備了生日驚喜，希望能夠讓好朋友開心
      C: 當她穿著一襲禮服登場時，所有人的「目光」都落在她身上
      D: 小老師「結結巴巴」的交代著作業，令老師相當讚賞
    option_corrections:
      A: 宜改為「自信」
      B: 宜改為「精心」
      D: 宜改為「條理清楚」
  - index: 2
    answer: B
    stem: 根據第四段，「他的眼神會突然和我對上，我只好急忙低下頭看小說」這句話最可能表現出敘述者當時的什麼情緒？
    options:
      A: 害怕與自卑，擔心對方嘲笑他看的小說
      B: 害羞與緊張，因為被對方注意到而慌亂
      C: 討厭與厭煩，不想和對方產生任何互動
      D: 擔心與尷尬，不想突然被拉去加入話題
    teacher_note: 從前文想關注同學一舉一動的心情，可以推論是(B)
  - index: 3
    answer: B
    stem: 根據全文，下列選項何者最貼近作者的心理變化？
    options:
      A: 一開始就確定自己愛上了他，並準備向對方表白
      B: 感到不確定，但發現這份情感與友情不同而疑惑
      C: 雖然覺得他不錯，但後來發現其實和朋友差不多
      D: 不想給予對方任何回應，最後決定完全忘記對方
    teacher_note: 從結尾可以知道作者不知所措與疑惑。
  - index: 4
    answer: D
    stem: 根據閱讀聚光燈的練習，下列何者對待感情的態度較為合適？
    options:
      A: 小新：交朋友不需要想太多，反正船到橋頭自然直
      B: 大雄：為了避免被他人誤會，保持適當距離比較安全
      C: 柯南：友情和愛情必須有很清楚的界線，一看就知道
      D: 小智：比起為關係命名，更重要的是了解自己的感受
    teacher_note: 從聚光燈結尾可知感情界線可能是難以定義的，但重點是了解自己。
  - index: 5
    answer: A
    stem: 關於本文的行為與心理感受描述，下列詮釋何者正確？
    options:
      A: 「像是在腦袋裡播一部只屬於自己的小電影（第五段）」──表達心中對美好回憶的陶醉
      B: 「像心臟被什麼輕輕撞了一下（第三段）」──表示受到攻擊而委屈
      C: 「像被陽光輕輕照到一樣（第五段）」──突顯作者因害羞而臉紅
      D: 「我覺得我的腦袋要炸掉了（第六段）」──是指作者出現頭痛症狀
    option_corrections:
      B: (B)是驚喜與害羞
      C: (C)是突顯心中的暖意
      D: (D)是指心煩意亂
