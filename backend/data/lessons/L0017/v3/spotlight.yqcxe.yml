lesson_uid: L0017
version_id: v3
section_no: 六
spotlight:
  strategy_name: 自我覺察──是友情還是愛情？
  strategy_type: character
  section_title_printed: 品格聚光燈
  blocks:
  - type: concept_box
    text: '在人際關係中，我們有時會對某些朋友特別在意──會想多知道他在做什麼、會因為一句訊息而開心或失落。

      這樣的感覺，可能只是友情的親密，也可能讓人誤會成其他情感。友情與愛情之間的界線，有時並不明顯，也容易讓人感到困惑。這種曖昧的關係時常出現在我們的生活中，因此我們需要學會觀察、釐清、尊重彼此的感受，讓關係保有自在與安全。

      日常生活中的互動，到底是友情？還是愛情？你可以幫忙判斷一下，作者記錄的互動，究竟靠近友情多一點？還是靠近愛情多一點呢？'
    emphasis_note: 「友情與愛情之間的界線，有時並不明顯，也容易讓人感到困惑。」印有底線
  - type: exercise
    label: 小試身手（第一張表·課文中的互動）
    instruction: ◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)
    columns:
    - 互動與反應
    - 較偏向的感情類型(勾選)
    option_bank:
      1: 友情
      2: 愛情
      3: 難以區分
    note: 教材明印「沒有標準答案」，教師版亦未印任何 ☑，故各題一律無 answer
    items:
    - type: single
      index: 1
      prompt: 被詢問要不要幫忙時，突然結巴、害羞
    - type: single
      index: 2
      prompt: 上體育課被分到同一組時，感到害羞、緊張
    - type: single
      index: 3
      prompt: 時常關注他的一言一行、一舉一動
    - type: single
      index: 4
      prompt: 喜歡回想和他相處的片段
    - type: single
      index: 5
      prompt: 被他幫忙、被他叫到名字時感到心裡發熱
    - type: single
      index: 6
      prompt: 因為他而特別期待上學
  - type: exercise
    label: 第二張表·更多生活情境
    instruction: ◎接著，請再試著思考，以下的互動，對你來說，更偏向友情還是愛情呢？一樣沒有正確答案哦！
    columns:
    - 互動方式
    - 較偏向的感情類型(勾選)
    option_bank:
      1: 友情
      2: 愛情
      3: 難以區分
    note: 同上，教材明印「沒有正確答案」，教師版未印 ☑，故無 answer
    items:
    - type: single
      index: 1
      prompt: 我喜歡和他一起聊天或玩手遊，也會約好幾個朋友一起上線。
    - type: single
      index: 2
      prompt: 是我唯一每天傳「晚安」的對象，有時還會期待收到他的貼圖或表情符號。
    - type: single
      index: 3
      prompt: 他一整天沒回我訊息，我就會開始覺得是不是我做錯了什麼。
    - type: single
      index: 4
      prompt: 我們會互相傾吐心事，也會為彼此保守秘密。
    - type: single
      index: 5
      prompt: 他如果和某位同學有親密的互動，我會很在意。
    - type: single
      index: 6
      prompt: 當我難過的時候，他總是第一個關心我、陪我說話、讓我開心。
    - type: single
      index: 7
      prompt: 我們會聊到未來畢業後還可以怎麼保持聯絡。
    - type: single
      index: 8
      prompt: 他常提醒我帶東西、寫作業，也很樂意和我討論作業怎麼做。
    - type: single
      index: 9
      prompt: 聽到我受委屈、被誤會，他會為我打抱不平。
    - type: single
      index: 10
      prompt: 我們有很多共同興趣和話題，也很願意分享。
  - type: multi
    no_correct_answer: true
    label: 歸納
    prompt: ◎根據上面的回答，以及你自己的觀察，關於友情與愛情差異，哪些是你認同的？請打勾，也可以寫上自己的想法。
    options:
      1: 如果有頻繁的聊天、相處，就偏向愛情。
      2: 如果願意和對方分享心事，也信任對方，就偏向愛情。
      3: 如果會時時刻刻留意對方的行為或在乎他的反應，就偏向愛情。
      4: 如果會希望能成為對方最重要的人或是唯一，就偏向愛情。
      5: 如果相處時會有比較大或頻繁的情緒起伏，就偏向愛情。
    note: 五個選項全部印空白 □，教師版未勾選任何一項（承接上文「沒有正確答案」）
  - type: free_text
    label: 自由填寫
    prompt: (自由填寫) 如果_________________________________________，就偏向愛情。
  - type: concept_box
    label: 結語
    text: '謝謝你的嘗試與覺察，相信透過回答，你也更了解了自己的感受！

      友情與愛情的界線，有時真的不容易分清楚。但比起急著為關係命名，更重要的是，你有沒有注意到自己的「在意」和「情緒」，你對關係的理解、期待，及如何看待人與人之間的互動。願你記得，關係不必馬上定義，但你的感受值得被看見、被理解。這就是認識自己的開始。❤︎'
    emphasis_note: 「但你的感受值得被看見、被理解」印有底線
