spotlight:
  lesson: G8-L16
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  blocks:
  - type: guide
    text: 一、確定議題
  - type: free_text
    prompt: 1.這篇文章在談「哪個議題／爭議」
  - type: guide
    text: 對安樂死或協助自殺的看法
  - type: guide
    text: 二、找觀點
  - type: passage
    source: unknown
    paragraphs:
    - 議題文章是在「說服」讀者：每一方會先表明立場與主張，再用理由說服。接著請你整理這個議題有哪些立場？每個立場的主張和理由是什麼？
  - type: table
    rows:
    - - 立場
      - 觀點要素
      - 請根據課文內容填答或勾選(單選)
    - - 【】
      - 主張
      - 在法律監督下開放讓病人選擇如何結束自己的生命
    - - 【】
      - 主要理由
      - □①病人意願清楚且堅定時，應尊重其自主與尊嚴，讓他有選擇權。□②病人意願清楚且堅定時，應先把照護資源做足再討論
    - - 【】
      - 條件
      - □①應有多位醫師評估、冷靜期、完整紀錄等程序，避免草率決定。□②先把疼痛控制與長照資源做足，再談是否開放。
    - - 【】
      - 主張
      - 不開放安樂死／協助自殺
    - - 【】
      - 主要理由
      - □①一旦開放且程序夠嚴格，就能避免界線擴大與被迫選擇。□②一旦開放，適用範圍可能擴大；弱勢病患也可能承受壓力而被迫選擇。
    - - 【】
      - 主張
      - 先落實臨終照顧：                                         讓疼痛控制、心理支持、長照與照顧者喘息服務更普及
    - - 【】
      - 主要理由
      - □①很多「想走」可能只是太痛太孤單，資源到位選項就不會只有極端選項。□②很多「想走」可能因程序不夠嚴格；所以應先補強審查監督，再討論是否開放。
    answers:
    - 贊成
    - 贊成
    - 贊成
    - 反對
    - 反對
    - 保留
    - 保留
  - type: guide
    text: 三、比較觀點差異（用「價值／風險」兩個角度）
  - type: passage
    source: unknown
    paragraphs:
    - 我們先用「主張＋理由」掌握每一方在說什麼；再追問理由在強調什麼──重視的價值與擔心的風險。用這兩個角度看，就能清楚比較觀點差異。
  - type: table
    rows:
    - - 立場
      - 重視的價值（單選）
      - 擔心的風險（單選）
    - - 贊成
      - □①自主與尊嚴　□②保護弱勢、避免被迫
      - □①草率決定、意願不清　□②界線擴大、範圍越放越寬
    - - 反對
      - □①自主與尊嚴　□②保護弱勢、避免被迫
      - □①草率決定、意願不清　□②弱勢受壓、被迫選擇死亡
    - - 保留
      - □①先把照護做到位　□②盡快立法開放選擇
      - □①照護不足，逼人只剩極端選項□②界線擴大，導致濫用難以收回
  - type: guide
    text: ＊歸納觀點差異：
  - type: passage
    source: unknown
    paragraphs:
    - 贊成者重視    自主與尊嚴     ；反對者最擔心   弱勢受壓、被迫選擇   ；保留者強調先    把照護做到位     。
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: passage
    source: unknown
    paragraphs:
    - 根據你整理的觀點差異（自主尊嚴／弱勢被迫／先補照護），下列哪一項最能概括本文主旨？（單選）
  - type: single
    prompt: 請選擇
    options:
    - 說明末期病人的自主選擇，並提醒制度應降低風險、補足照護資源
    - 透過多元觀點對照，凸顯此議題在權利、風險與照護之間的兩難
    answer: 說明末期病人的自主選擇，並提醒制度應降低風險、補足照護資源
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: fill_table
  - type: passage
    source: unknown
    paragraphs:
    - 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出本文的多元立場，及各自的主張與理由。
    - 我能用「多元觀點對照」推論主旨。
