strategy_explained: 這一課我們要練習的是「比較不同的看法」，因為傅達仁的例子讓我們看到「安樂死」和「協助自殺」議題背後，有很多人支持、反對或有保留意見，每個人的理由都不太一樣。讀的時候，你可以試著找出文章中提到哪些人提出了哪些想法，他們分別是怎麼想的，這樣就能更清楚地了解這件事為什麼這麼複雜囉
