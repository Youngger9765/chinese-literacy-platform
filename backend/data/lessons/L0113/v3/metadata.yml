intro: 這篇文章探討了當生命只剩下無盡的痛苦時，病人是否有權利選擇結束生命的方式。文章以籃球國手傅達仁因胰臟癌末期，選擇到瑞士透過「協助自殺」結束生命的經歷為引子，引導讀者思考「安樂死」與「協助自殺」的議題。文中介紹了幾種與臨終選擇相關的作法，並整理了支持、反對以及保留意見者的主要論點，包括對自主尊嚴的重視、對弱勢病患的擔憂，以及對完善臨終照護的呼籲。這是一個複雜且牽涉多方面考量的議題，需要我們深入思考。
