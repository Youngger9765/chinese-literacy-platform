full_text_annotate:
  lesson_heading: 第16課  我能不能選擇告別方式？
  課文作者: 曾世杰
  學習單: 陳淑麗
  paragraph_count: 9
  paragraph_numbering_note: '段號欄印的是「ㄧ二三四五六七八九」——第一個是**注音符號 ㄧ（U+3127）**不是漢字一（U+4E00）。

    原稿如此，不是我打錯；查全庫時要注意這兩個字元不相等。'
  paragraphs:
  - idx: 1
    text: 你有沒有想過：如果一個人每天都痛到睡不著，連呼吸都像被刀割，他還能怎麼活下去？傅達仁，叱吒風雲的籃球國手、家喻戶曉的體育主播，曾主播七屆奧運。2016年確診胰臟癌後，他經歷多次手術、化療，高大帥氣的他變得瘦骨嶙峋、形容枯槁。劇痛像刀子般持續的戳刺、割扯，讓他白天痛苦難當、夜裡無法成眠，只能靠強力止痛藥度過毫無品質的每一天。他想要了結這沒有盡頭的折磨，但沒有合法的管道可以達成。2016年底，他寫信給蔡總統，希望能推動安樂死立法並願做首例；總統府回函表示重視，也請相關單位處理。但這個議題爭議性高，各界難有共識，他一等再等，等不下去了。2018年他在家人陪伴下前往瑞士，6月7日依當地制度以「協助自殺」方式離世。
  - idx: 2
    text: 傅達仁的案例，把沉重的問題推到大家眼前：當生命只剩疼痛，病人能不能決定結束自己的生命？又能由誰提供協助？
  - idx: 3
    text: 「與臨終選擇有關的作法」大致可以分成三種。第一種是「不施行或撤除維持生命的醫療」，例如對病情已不可逆轉的病人不再插管、移除呼吸器、停止營養灌食等無效醫療，讓生命自然走到終點。第二種則是「安樂死」，由醫師依病人明確、持續的意願主動施用藥物，使病人死亡。第三種則是「協助自殺」，就是傅達仁瑞士行的目的：經過嚴謹的評估與確認，由病人在意識清楚、意願堅定時，在醫療人員的協助下，自己按下注射藥劑的開關。臺灣目前已有安寧緩和醫療與《病人自主權利法》，保障符合條件的病人拒絕或撤除特定維持生命治療，讓生命自然走到終點；後兩種在臺灣仍不合法。
    split_note: '🔴 這一段在 DOCX 裡被拆成**兩個 `<w:p>`**，斷點落在句子中間

      （「…拒絕或撤除特」＋「定維持生命治療…」＝「撤除特定維持生命治療」）。

