lesson_uid: L0113
version_id: v3
section_no: 五
spotlight:
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE ＋ w:color EE0000）＋橘色手寫填空；兩者都在文字流裡
  blocks:
  - type: concept_box
    text: 本文主要談一個人生重要的議題：能不能選擇告別方式。這種議題文章，就像一場「辯論」，你會看見多元觀點的討論。讀這類文章，重點是：「找到個別的觀點，再比較不同觀點的差異在哪裡？」最後再推論文章想要說什麼（主旨）。
  - type: guide
    text: 一、確定議題
  - type: free_text
    prompt: 1.這篇文章在談「哪個議題／爭議」【　】
    blanks:
    - answer: 對安樂死或協助自殺的看法
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 二、找觀點
  - type: guide
    text: 議題文章是在「說服」讀者：每一方會先表明立場與主張，再用理由說服。接著請你整理這個議題有哪些立場？每個立場的主張和理由是什麼？
  - type: fill_table
    label: 二、找觀點
    columns:
    - 立場
    - 觀點要素
    - 請根據課文內容填答或勾選(單選)
    rows:
    - 立場: 【　】
      立場_blanks:
      - answer: 贊成
      觀點要素: 主張
      請根據課文內容填答或勾選(單選): 【　】
      請根據課文內容填答或勾選(單選)_blanks:
      - answer: 在法律監督下開放讓病人選擇如何結束自己的生命
    - 立場: 【　】
      立場_note: 原稿此格與上一列合併（同一個「贊成」跨三列）
      觀點要素: 主要理由
      請根據課文內容填答或勾選(單選): ''
      請根據課文內容填答或勾選(單選)_options:
        1: 病人意願清楚且堅定時，應尊重其自主與尊嚴，讓他有選擇權。
        2: 病人意願清楚且堅定時，應先把照護資源做足再討論
      請根據課文內容填答或勾選(單選)_answer: 1
    - 立場: 【　】
      立場_note: 原稿此格與上兩列合併（同一個「贊成」跨三列）
      觀點要素: 條件
      請根據課文內容填答或勾選(單選): ''
      請根據課文內容填答或勾選(單選)_options:
        1: 應有多位醫師評估、冷靜期、完整紀錄等程序，避免草率決定。
        2: 先把疼痛控制與長照資源做足，再談是否開放。
      請根據課文內容填答或勾選(單選)_answer: 1
    - 立場: 【　】
      立場_blanks:
      - answer: 反對
      觀點要素: 主張
      請根據課文內容填答或勾選(單選): 不開放安樂死／協助自殺
      請根據課文內容填答或勾選(單選)_note: 這一格是原稿印好的，不是填空
    - 立場: 【　】
      立場_note: 原稿此格與上一列合併（同一個「反對」跨兩列）
      觀點要素: 主要理由
      請根據課文內容填答或勾選(單選): ''
      請根據課文內容填答或勾選(單選)_options:
        1: 一旦開放且程序夠嚴格，就能避免界線擴大與被迫選擇。
        2: 一旦開放，適用範圍可能擴大；弱勢病患也可能承受壓力而被迫選擇。
      請根據課文內容填答或勾選(單選)_answer: 2
    - 立場: 【　】
      立場_blanks:
      - answer: 保留
      觀點要素: 主張
      請根據課文內容填答或勾選(單選): 【　】
      請根據課文內容填答或勾選(單選)_blanks:
      - answer: 先落實臨終照顧：
      - answer: 讓疼痛控制、心理支持、長照與照顧者喘息服務更普及
    - 立場: 【　】
      立場_note: 原稿此格與上一列合併（同一個「保留」跨兩列）
      觀點要素: 主要理由
      請根據課文內容填答或勾選(單選): ''
      請根據課文內容填答或勾選(單選)_options:
        1: 很多「想走」可能只是太痛太孤單，資源到位選項就不會只有極端選項。
        2: 很多「想走」可能因程序不夠嚴格；所以應先補強審查監督，再討論是否開放。
      請根據課文內容填答或勾選(單選)_answer: 1
    rows_note: '原稿的「立場」欄是跨列合併的儲存格（贊成跨 3 列、反對跨 2 列、保留跨 2 列），

      本檔把它攤平成每列都帶立場，合併關係寫在 `立場_note`。

      三個立場本身是橘色手寫填空（PDF p6 上直排），不是印好的。'
  - type: guide
    text: 三、比較觀點差異（用「價值／風險」兩個角度）
  - type: guide
    text: 我們先用「主張＋理由」掌握每一方在說什麼；再追問理由在強調什麼──重視的價值與擔心的風險。用這兩個角度看，就能清楚比較觀點差異。
  - type: fill_table
    label: 三、比較觀點差異
    columns:
    - 立場
    - 重視的價值（單選）
    - 擔心的風險（單選）
    rows:
    - 立場: 贊成
      重視的價值（單選）: ''
      重視的價值（單選）_options:
        1: 自主與尊嚴
        2: 保護弱勢、避免被迫
      重視的價值（單選）_answer: 1
      擔心的風險（單選）: ''
      擔心的風險（單選）_options:
        1: 草率決定、意願不清
        2: 界線擴大、範圍越放越寬
      擔心的風險（單選）_answer: 1
    - 立場: 反對
      重視的價值（單選）: ''
      重視的價值（單選）_options:
        1: 自主與尊嚴
        2: 保護弱勢、避免被迫
      重視的價值（單選）_answer: 2
      擔心的風險（單選）: ''
      擔心的風險（單選）_options:
        1: 草率決定、意願不清
        2: 弱勢受壓、被迫選擇死亡
      擔心的風險（單選）_answer: 2
    - 立場: 保留
      重視的價值（單選）: ''
      重視的價值（單選）_options:
        1: 先把照護做到位
        2: 盡快立法開放選擇
      重視的價值（單選）_answer: 1
      擔心的風險（單選）: ''
      擔心的風險（單選）_options:
        1: 照護不足，逼人只剩極端選項
        2: 界線擴大，導致濫用難以收回
      擔心的風險（單選）_answer: 1
    rows_note: 這張表的「立場」欄是原稿印好的（贊成／反對／保留），不是填空
  - type: free_text
    prompt: ＊歸納觀點差異：贊成者重視【　】；反對者最擔心【　】；保留者強調先【　】。
    blanks:
    - answer: 自主與尊嚴
    - answer: 弱勢受壓、被迫選擇
    - answer: 把照護做到位
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: single
    prompt: 根據你整理的觀點差異（自主尊嚴／弱勢被迫／先補照護），下列哪一項最能概括本文主旨？（單選）
    options:
      1: 說明末期病人的自主選擇，並提醒制度應降低風險、補足照護資源
      2: 透過多元觀點對照，凸顯此議題在權利、風險與照護之間的兩難
    answer: 2
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出本文的多元立場，及各自的主張與理由。
    - 2.我能用「多元觀點對照」推論主旨。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩個 □ 都沒有勾
