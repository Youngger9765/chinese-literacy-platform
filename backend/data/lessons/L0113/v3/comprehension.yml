lesson_uid: L0113
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 第三段指出臺灣已有安寧緩和醫療與《病人自主權利法》，並鼓勵民眾預先決定醫療選擇。作者最想強調的重點是什麼？
    options:
      A: 臺灣已全面讓臨終病人的安樂死與協助自殺合法化
      B: 臺灣目前鼓勵民眾尋求各種醫療方案以延長壽命
      C: 只要臨終病人簽字，就能要求醫師立即結束生命
      D: 臺灣的制度法令尊重臨終病人停止無效醫療的決定
  - index: 2
    answer: C
    stem: 第七段提到「如果資源到位……末期的病人就不會只剩非黑即白的極端選項」，這段話主要在強調什麼？
    options:
      A: 很多求死念頭，可能來自疼痛與孤單等生不如死的處境
      B: 要降低爭議，必須先釐清安樂死與協助自殺的差別
      C: 只要有完善的照護，就能減少因疼痛孤單而求死的情況
      D: 真正想要解決問題，仍需盡快推動法律開放與全面上路
    teacher_hint: 第2題解析：這句話的重點在「如果資源到位」，病人就不會只剩「非黑即白」的極端選項
    teacher_note: 這句話的重點在「如果資源到位」，病人就不會只剩「非黑即白」的極端選項
  - index: 3
    answer: C
    stem: 根據文章內容，下列哪一項最能說明支持者與反對者立場的核心差異？
    options:
      A: 是否相信醫師有能力正確判斷病人的真實意願
      B: 是否贊成參考瑞士的制度來處理臨終病人的選擇
      C: 對「自主與尊嚴」和「開放後風險」的取捨不同
      D: 是否認為只要程序嚴格就能完全避免制度被濫用
    teacher_hint: 第3題解析：支持者重視「自主」與「尊嚴」；反對者則擔心開放後弱勢病患承受壓力等「潛在風險」。差異是對「自主尊嚴」與「風險的權衡」
    teacher_note: 支持者重視「自主」與「尊嚴」；反對者則擔心開放後弱勢病患承受壓力等「潛在風險」。差異是對「自主尊嚴」與「風險的權衡」
  - index: 4
    answer: D
    stem: 作者先用傅達仁案例，再進行三種類型的分類，接著呈現三方立場。這種安排最可能是為了什麼？
    options:
      A: 先製造情緒衝突，再讓讀者只接受作者強調的結論
      B: 先描寫人物形象，再把他塑造成唯一正確的選擇榜樣
      C: 先解釋法律條文細節，再用案例補充艱深的專業內容
      D: 先建立共感與問題感，再用概念與觀點整理複雜議題
    teacher_hint: 第4題：「案例→核心問題→概念分類→多方觀點」是典型議題文結構：先讓讀者理解痛苦與情境，再用清楚框架避免討論混亂
  - index: 5
    answer: A
    stem: 下列哪一項最能概括本文主旨？
    options:
      A: 以傅達仁案例，引出安樂死爭議並分析多方立場與制度困境
      B: 批判臺灣政府消極無為，讓末期病人只能出國尋求協助自殺
      C: 介紹傅達仁的生平事蹟，凸顯他對臨終病人生命決定的訴求
      D: 提醒民眾不要害怕談死亡，要早一點做重要決定、預立遺囑
    teacher_hint: 本文核心是用案例引出議題，進一步定義分類、說明臺灣現況、呈現支持/反對/保留三方觀點，最後回到制度設計與價值拉扯
    teacher_hint_note: 這一則解析的藍框沒有寫「第5題」前綴，位置排在第 5 題選項下方（PDF p10 上方）
