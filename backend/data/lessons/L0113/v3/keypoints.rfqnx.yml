section_no: 六
keypoints:
  title: 我能不能選擇告別方式？
  layout: list
  answer_carrier: 橘色手寫填空（教師版答案），文字流有此資訊
  rows:
  - label: 案例（段1）
    value: '問題：傅達仁罹癌，他想結束痛苦折磨，但臺灣無合法管道。

      解決：寫信給總統盼【　】，但爭議大、難有共識。

      結果：在家人陪伴下前往瑞士，依當地制度以【　】方式離世。'
    blanks:
    - answer: 推動立法
    - answer: 協助自殺
  - label: 核心議題（段2）
    value: 當生命只剩疼痛，是否能【　】？誰能協助做決定？
    blanks:
    - answer: 選擇告別
  - label: 三種性質不同的臨終選擇(段3)
    value: '1.【　】：不做無效醫療，讓生命自然走到終點

      2.【　】：他人主動用藥，讓無法自我決定的病人死亡

      3.【　】：在醫療人員的協助下，自己按下注射藥劑的開關，完成最後一步。'
    blanks:
    - answer: 撤除維生醫療
    - answer: 安樂死
    - answer: 協助自殺
  - label: 臺灣現況(段3)
    value: 臺灣目前已有【　】與【　】，主要保障的是第一種；第二、三種仍不合法。
    blanks:
    - answer: 安寧緩和醫療
    - answer: 病人自主權利法
  - label: 對議題看法：多元觀點(段4-6)
    value: '1.贊成：在【　】下開放讓病人可選擇結束生命。

      2.反對：擔心開放後【　】；也擔心弱勢病患因【　】而被迫選擇死亡。

      3.保留：主張先落實【　】：疼痛控制、心理支持、長照與照顧者喘息更普及。'
    blanks:
    - answer: 法律監督
    - answer: 適用範圍擴大
    - answer: 費用／照護壓力
    - answer: 臨終照顧
  - label: 兩難(段7)
    value: '1.此難題同時牽涉【　】、信仰、風險與【　】。

      2.若開放要設計【　】；若不開放要確保病人不被【　】吞沒、補足【　】。'
    blanks:
    - answer: 人權
    - answer: 制度設計
    - answer: 審查、申訴與監督
    - answer: 疼痛
    - answer: 照護缺口
  rows_note: '⚠️ 這張表的段號**跟課文段號欄對不上**：表上「多元觀點(段4-6)」對應的是課文的第 5~7 段

    （支持者／反對者／保留者），「兩難(段7)」對應的是課文第 8 段。

