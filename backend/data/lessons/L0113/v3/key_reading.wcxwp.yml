key_reading:
  instruction: 請用計時器，從指定段落（五    ）開始朗讀，在表格中記錄1分鐘朗讀的字數。如果你計時3次後，對自己還不滿意，可以多練幾次。最後一次，找位同學，請他計時、記錄並簽名！
  start_paragraph_note: '指示語印「（五 ☞）」，☞ 圖檔也錨在第 5 段段首，兩邊一致 —— 這一課**沒有** L0112 那種衝突。

    ⚠️ 但前提是第 3 段要照段號欄合成一段（見 body.paragraphs[3].split_note）：

    照 DOCX 的 `<w:p>` 數硬切成 10 段的話，☞ 會落在「第 6 段」而與指示語打架。'
  char_count_note: "末筆 349 不是全文長度：字數欄只標到第 7 段結束，第 8、9 段沒有標\n（「字數欄提早停」的形狀，已見 5 課）。三個檢查點**全部精準吻合**：\n\
    \  ・第 5 段 82 字 == 印出來的第 3 個數字 82\n  ・＋第 6 段 152 == 234 == 第 9 個數字（前一格 224→234\
    \ 只跳 10，正是段界的短行signature）\n  ・＋第 7 段 115 == 349 == 最後一個數字\n要對上必須把第 6 段的破折號「——」（兩個\
    \ U+2014）**不計入字數**：\n該段 154 個字元，扣掉這兩個就是 152。全課只有這一段有非中日韓標點，所以是乾淨的單變數檢查。\n⚠️ 但這條**不能直接推廣**：同一批的\
    \ L0112 要把「……」（兩個 U+2026）算成 **1 個字**才對得上，\n跟這裡「算 0 個字」不是同一條規則。兩課各自成立、彼此矛盾，樣本都只有\
    \ 1，\n所以我沒有把它寫成通則，只記錄現象。"
