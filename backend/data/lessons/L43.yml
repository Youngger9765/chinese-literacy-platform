vocabulary:
- word: 聞
  definition: 'ㄨㄣˊ；Ａ聽到、聽說；予聞之也久／

    我聽說他的事很久了'
  type: 多義字
- word: 聞
  definition: 'ㄨㄣˊ；Ｂ有名、著稱；吾愛孟夫子，風流天下聞／

    我喜愛孟先生，他的瀟灑天下有名'
  type: 多義字
- word: 聞
  definition: 'ㄨㄣˊ；Ｃ聽見的事情、消息；不能稱前時之聞／

    不能符合先前的傳聞'
  type: 多義字
