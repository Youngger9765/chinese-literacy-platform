- question: 下列選項「」中字，何者字音、字義完全正確？
  options:
  - 予「聞」之也久——ㄨㄣˊ，聽說
  - 「泯」然眾人矣——ㄇㄧㄣˊ，消失
  - 日扳仲永環「謁」於邑人——ㄐㄧㄝˊ，拜訪
  - 不能「稱」前時之聞——ㄔㄥˋ，稱讚
  answer: null
