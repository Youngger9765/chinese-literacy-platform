vocab_bank:
  A: 聞
  B: 聞
  C: 聞
fill_in_blank:
- sentence: 昨天老師說下週要考試，這個消息你（　　）了嗎？
  answer: A
- sentence: 這位科學家發明了許多東西，在國際上非常（　　）。
  answer: B
- sentence: 關於這次校外教學的地點，我已經從同學那裡得到了一些（　　）。
  answer: C
multiple_choice:
- question: 下列選項「」中字，何者字音、字義完全正確？
  options:
  - 予「聞」之也久——ㄨㄣˊ，聽說
  - 「泯」然眾人矣——ㄇㄧㄣˊ，消失
  - 日扳仲永環「謁」於邑人——ㄐㄧㄝˊ，拜訪
  - 不能「稱」前時之聞——ㄔㄥˋ，稱讚
  answer: A
  explanation: 選項A：「聞」在「予聞之也久」中，其讀音為ㄨㄣˊ (wén)，且在此句中意為「聽說、聽聞」，與選項提供的「聽說」完全符合。課文在「一字多義：聞」的練習中，也將此類用法歸於「聽見、聽到」的範疇，故字音、
- question: 根據本文，哪些地方可以看出方仲永的天才？
  options:
  - 甲丁
  - 乙丙
  - 甲丙
  - 乙丁
  answer: C
  explanation: 選項甲和丙直接描述了方仲永異於常人的作詩能力，前者是五歲時未曾識字卻能寫詩，後者是能即興創作並有出色文采，這些都是他天才的具體表現。
- question: 下列哪一選項中「聞」字，意思是「聽說、聽到」？
  options:
  - 默默無聞
  - 事母以孝聞
  - 天下奇聞
  - 聞風喪膽
  answer: D
  explanation: 在「聞風喪膽」中，「聞」的意思是「聽到」，表示聽到風聲或消息而感到恐懼，與題目要求的「聽說、聽到」意思相符。
- question: 下列何者是本文主旨？
  options:
  - 勝利不驕傲，失敗也不氣餒。
  - 知足是天然的財富，奢侈是人為的貧窮。
  - 天賦如同自然花木，要用學習來修剪。
  - 一枝草，一點露，天無絕人之路。
  answer: C
  explanation: 課文講述方仲永因父親只顧利用他的天賦賺錢，而沒有讓他接受學習和鍛鍊，最終導致他的才能衰退，從神童變為凡人。這說明了天賦雖然重要，但後天的學習和努力培養更是維持和發展才能的關鍵，就像花木需要修剪才能長得
- question: 下列何者是方仲永從天才跌為凡人的主要原因？
  options:
  - 生五年，未嘗識書具，忽啼求之
  - 指物作詩立就，其文理皆有可觀者
  - 邑人奇之，稍稍賓客其父，或以錢幣乞之
  - 父利其然，日扳仲永環謁於邑人，不使學
  answer: D
  explanation: 課文中明確指出「父利其然也，日扳仲永環謁於邑人，不使學」，正是因為父親只顧眼前的利益，不斷讓仲永四處應酬卻不讓他學習，導致仲永的才能逐漸消失，最終變成普通人。
