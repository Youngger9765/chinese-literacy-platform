- question: 下列何者是本文主旨？
  options:
  - 勝利不驕傲，失敗也不氣餒。
  - 知足是天然的財富，奢侈是人為的貧窮。
  - 天賦如同自然花木，要用學習來修剪。
  - 一枝草，一點露，天無絕人之路。
  answer: null
  explanation: null
- question: 下列何者是方仲永從天才跌為凡人的主要原因？
