passage: 當強烈地震把大型建築物震垮，有人被困在像山一般高的瓦礫廢墟時，就是非洲巨鼠出任務的時機。受過專門訓練的巨鼠，配備著微型背包，背包裡有麥克風、攝影機和定位追蹤器。當巨鼠被帶到廢墟，牠們可以靠著靈敏的聽覺、嗅覺，以及鑽進狹小縫隙的能力尋找倖存者。當牠們來到倖存者身邊，就會扯一扯繫在背包上的警報器，讓它嗶嗶響，救援人員就可以根據這個信號來找到受困者。
