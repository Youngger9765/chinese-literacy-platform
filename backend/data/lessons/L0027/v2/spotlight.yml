spotlight:
  lesson: G5-L15
  strategy_name: 用表格整理訊息-比較兩個對象
  strategy_type: comparison
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 深夜，一場猛烈的火災吞噬整棟大樓，濃煙不斷從建築物內竄出，驚慌的居民受困其中。消防員立刻趕到現場，全力(  E  )受困者。
  - type: guide
    text: 要(  G  )艱難的救援任務，消防員必須具備專業的(  A  )，並熟練操作各種滅火與救援設備。即使濃煙遮住視線，他們仍要保持感官(  B  )，迅速察覺求救信號，確認是否仍有居民(  D  )。
  - type: guide
    text: 五文章重點表 五文章重點表
  - type: fill_table
  - type: guide
    text: 六閱讀聚光燈用表格整理訊息──比較兩個對象六閱讀聚光燈用表格整理訊息──比較兩個對象
  - type: single
    prompt: 文章同時介紹兩個對象，細節又很多時，可以用表格來整理。怎麼做呢？
    options:
    - 先找出文章在比較哪兩個對象，再看看比較哪些項目，最後把兩個對象的訊息填進表格。完成後，就能清楚看出它們哪裡相同、哪裡不同，也比較容易說出結論。本課提到，救援行動中使用巨鼠好處多多，這時，我們就可以把狗與巨鼠放在一起進行比較，做成表格，就可以讓人一目了然兩者的差異囉。整理表格步驟：找對象：文章在比較誰和誰。先把比較的對象寫在表格「第一列」：巨鼠與狗找項目：文章從哪些方面比較兩個對象？把文章比較的項目寫在表格「第一欄」祕訣：文章中出現「但是」、「不同」、「比較」等語詞時，可能表示作者正在比較兩個對象喔！範例：訓練有素的巨鼠可以跟多位訓練員合作，        但狗通常只接受一位訓練員的指導。❶讀一讀，找出巨鼠與狗不同的地方。（單選）  巨鼠可以跟
    - 多位
    - 一位　訓練員合作，　狗只接受
    - 一位　訓練員指導。❷這句話比較的項目是什麼？
    - 可合作的訓練員人數
    - 嗅覺能力　  ❸把比較項目「可合作的訓練員人數」填入「第一欄」C.填細節：兩個對象在這個項目上有什麼不同？   把巨鼠和狗的相關細節，分別填入對應的格子     巨鼠可合作訓練員數量多位，狗可合作訓練員數量只有一位。第一欄第一欄第一列第一列對象1：巨鼠對象2：狗項目1：可合作的訓練員人數【　　多位　　】【　　一位　】項目2：看表格：比較兩個對象，找出相同和不同，再說出重點。
    answer: 多位
  - type: guide
    text: ◎小試身手
  - type: free_text
    prompt: 1.現在讓我們從文章找出比較的內容與項目
  - type: free_text
    prompt: (1)此外，巨鼠體型小，狗無法通過的瓦礫縫󠇡隙，巨鼠卻可以輕而易舉的鑽過。
  - type: single
    prompt: ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
    options:
    - 大
    - 小】，可以【
    - 輕易
    - 無法】鑽過瓦礫縫。
    answer: 小】，可以【
  - type: single
    prompt: ❷這句話比較的項目是什麼？□①訓練員數量　□②體型  □③成本。
    options:
    - 訓練員數量
    - □②體型
    - 成本。
    answer: □②體型
  - type: free_text
    prompt: (2)飼養和訓練巨鼠的成本比較低，不必花很多錢，只要有老鼠飼料和香蕉作為獎勵就可以了。
  - type: single
    prompt: ❶現在我們來看這句話，請你找出巨鼠與狗不同的地方。（單選）
    options:
    - 昂貴的專業食品
    - 簡單的飼料和香蕉】，所以巨鼠的訓練成本比狗【
    - 高
    - 低】。
    answer: 簡單的飼料和香蕉】，所以巨鼠的訓練成本比狗【
  - type: free_text
    prompt: ❷這句話比較的項目是什麼？　　訓練成本
  - type: free_text
    prompt: 2.請將比較項目與細節填入表格內(請打勾，單選)
  - type: table
    rows:
    - - 比較項目          對象
      - 巨鼠
      - 狗
    - - 1.可合作的訓練員人數
      - □①多位 □②一位
      - □①多位 □②一位
    - - 2.【】
      - □①大   □②小
      - □①大   □②小
    - - 3.【】
      - □①高   □②低
      - □①高   □②低
    answers:
    - 體型
    - 訓練成本
  - type: free_text
    prompt: 3.想一想表格內容告訴我們什麼？
  - type: single
    prompt: ❶誰可以跟多位訓練員合作？ □①巨鼠   □②狗
    options:
    - □①巨鼠
    - 狗
    answer: □①巨鼠
  - type: single
    prompt: ❷誰可以鑽過瓦礫縫隙？ □①巨鼠   □②狗
    options:
    - □①巨鼠
    - 狗
    answer: □①巨鼠
  - type: single
    prompt: ❸誰的訓練成本比較低？ □①巨鼠   □②狗
    options:
    - □①巨鼠
    - 狗
    answer: □①巨鼠
  - type: single
    prompt: 4.總結：根據上表，下列哪一句最能說明巨鼠和狗的比較結果？
    options:
    - 非洲巨鼠和搜救犬的各項能力都完全不同。
    - 在可合作訓練員人數、體型和訓練成本方面，巨鼠較有優勢。
    answer: 在可合作訓練員人數、體型和訓練成本方面，巨鼠較有優勢。
  - type: guide
    text: ★策略帶著走
  - type: guide
    text: 文章比較兩個對象時，可以用「找對象—找項目—填細節—看表格」整理訊息。
  - type: guide
    text: ◎我會了嗎？
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: passage
    source: unknown
    paragraphs:
    - （C.「倖存」通常指生物從危險中存活）（C.「倖存」通常指生物從危險中存活）（ C ）1. 下列語詞何者使用不正確？
    - A.地震後，建築物倒塌，滿地都是「瓦礫」
    - B.這隻警犬的嗅覺十分「靈敏」，能迅速偵測危險物品
    - C.她很節省，把所有打工賺的錢都「倖存」在郵局裡
    - D.她經過多年努力，終於能「勝任」老師的工作
