lesson_uid: L0027
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用不正確？
    options:
      A: 地震後，建築物倒塌，滿地都是「瓦礫」
      B: 這隻警犬的嗅覺十分「靈敏」，能迅速偵測危險物品
      C: 她很節省，把所有打工賺的錢都「倖存」在郵局裡
      D: 她經過多年努力，終於能「勝任」老師的工作
    teacher_note: （C.「倖存」通常指生物從危險中存活）
  - index: 2
    answer: B
    stem: 為什麼科學家認為使用非洲巨鼠進行救援更有優勢？
    options:
      A: 它們能夠幫助人類在廢墟中挖掘瓦礫
      B: 它們訓練成本低、體型小、能與不同訓練員合作
      C: 它們在野外比一般動物更容易生存
      D: 它們可以配備麥克風、攝影機和定位追蹤器
  - index: 3
    answer: A
    stem: 請問本課文章的主旨是什麼？
    options:
      A: 受過訓練的非洲巨鼠有望成為救援隊的好幫手
      B: 地震發生時，狗可以幫助救援隊找到倖存者
      C: 強調動物與科技結合的重要性
      D: 地震發生時，所有動物都能成為救援隊的一員
    teacher_note: （文中提到非洲巨鼠當救援動物好處多多，人類無須太過懼怕，所以答案為A。）
  - index: 4
    answer: B
    stem: 為什麼科學家需要透過媒體宣傳非洲巨鼠的救援能力？
    options:
      A: 讓更多人知道非洲巨鼠的救援能力，牠們應該受到保護
      B: 希望減少大家對巨鼠的排斥，看到巨鼠來救援時不要害怕
      C: 希望大眾捐款，讓科學家可以做更多的巨鼠訓練
      D: 希望說服更多的團體使用非洲巨鼠來取代搜救犬
  - index: 5
    answer: D
    stem: 末段提到要用巨鼠背上的揚聲器持續播放音訊。以下選項中，哪一項最可能是揚聲器播放的內容？
    options:
      A: 讓受難者可以感到安全、放鬆的古典或流行音樂
      B: 請受難者家屬錄下來的呼喊聲「ＯＯＯ，你在哪裡？」
      C: 廣播電台或電視台新聞報導節目的當天新聞
      D: 語音：「別害怕，這隻巨鼠是來協助救援的。」
    teacher_note: 揚聲器是為了減低人們對老鼠的恐懼，讓他們安心等候不害怕，D最符合。
