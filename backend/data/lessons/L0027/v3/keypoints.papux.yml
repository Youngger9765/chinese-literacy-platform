keypoints:
  title: 救援大隊的好幫手
  layout: list
  rows:
  - label: 介紹對象
    value: 【　】
    blanks:
    - answer: 非洲巨鼠
  - label: 特徵
    items:
    - label: '1'
      value: 體型如小貓。
    - label: '2'
      value: 嗅覺與聽力【　】及能鑽進狹小縫隙。
      blanks:
      - answer: 靈敏
  - label: 救援任務
    items:
    - label: '1'
      value: 巨鼠要在地震廢墟中尋找【　】。
      blanks:
      - answer: 倖存者
    - label: '2'
      value: 巨鼠身上裝備有麥克風、攝影機、定位追蹤器。
    - label: '3'
      value: 巨鼠發現倖存者後，拉扯警報器發出【　】。
      blanks:
      - answer: 信號
  - label: 優勢
    value: 相較於狗，非洲巨鼠有哪些優勢？（多選）
    options:
      1: 能與多位訓練員合作
      2: 體型小，可以進入狗無法進入的地方
      3: 比狗的嗅覺更靈敏
      4: 訓練與飼養成本較低
      5: 比狗更容易訓練
    answers:
    - 1
    - 2
    - 4
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 潛在問題
    value: 巨鼠可能會嚇壞瓦礫中的倖存者。
  - label: 科學家的對策
    value: 為了解決人們對巨鼠的恐懼，科學家採取了哪些方法？（多選）
    options:
      1: 透過媒體宣傳巨鼠的救援能力。
      2: 平常舉辦與巨鼠相處的活動，讓人們更認識巨鼠。
      3: 在巨鼠的背包內裝設揚聲器播放音訊，讓受困者明白巨鼠是救援動物。
      4: 在巨鼠的背包外印上醒目的救援標語。
    answers:
    - 1
    - 3
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - label: 結論
    value: 巨鼠是【　】的重要夥伴。
    blanks:
    - answer: 救援大隊
