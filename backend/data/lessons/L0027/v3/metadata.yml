intro: 這篇文章介紹了一種特別的救援動物——非洲巨鼠。你可能會覺得奇怪，老鼠怎麼能幫助救援呢？文章會告訴你，這種非洲巨鼠體型像小貓，聽力和嗅覺都非常靈敏，而且能鑽進狹小的空間。科學家們正訓練牠們執行救援任務，並為牠們配備了特殊的裝備。文章將探討巨鼠在救援行動中的優勢，像是牠們的嗅覺、訓練方式以及體型大小帶來的便利。同時，文章也會提到在運用巨鼠救援時，可能遇到的挑戰，以及研究人員如何克服這些困難，讓牠們成為名副其實的「救援大隊好幫手」。
