strategy_explained: 這次我們要練習「抓出文章的重點小標題」，就像幫每個段落或主題找一個代表性的標題一樣，這篇文章講了好多動物怎麼跟另一半求偶，從青蛙唱歌、海馬跳舞到飛蛾放氣味，這麼多不同的例子，很適合我們練習用小標題把牠們分類整理好，這樣讀完你就知道誰是誰、牠們都做了什麼，以後看其他文章也能試著自己畫重點找小主題喔
