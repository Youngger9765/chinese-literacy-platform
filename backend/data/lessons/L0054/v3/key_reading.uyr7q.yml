  passage: 到了繁殖季節，鴕鳥會舉行熱鬧非凡、令人耳目一新的招親活動。平常沉默的雄鳥，在求偶期間卻大展身手：一方面發出低沉的叫聲，呼喚雌鳥；一方面有節奏的展開、收合翅膀，露出尖端的白色羽毛，繞著雌鳥跳起獨特的求偶舞。花園裡、田野間，飛蛾也翩翩飛舞。飛蛾的生命雖然短暫，卻仍能完成繁衍後代的任務。雌蛾會分泌一種特殊氣味，這股氣味隨著空氣擴散，傳遞真摯的求偶訊息，吸引遠方的雄蛾千里迢迢飛來相會。為了躲避敵人的攻擊，也為了避免陽光曝曬，招潮蟹會在地洞裡築巢。到了求偶季節，雄蟹頂著兩根像火柴棒般的眼柄，雄赳赳、氣昂昂的站在洞口，快速揮動大螯，向雌蟹發出求偶訊息。醒目的大螯不但能吸引雌蟹，也能向競爭對手展示力量，彷彿在說：「看看我，我可是強壯又有本事的對象！」春暖花開時，許多蛇結束冬眠，出洞尋覓佳人。雌蛇會釋放特殊氣味，藉此傳出「我已經成熟，可以繁衍後代」的訊息。雄蛇聞到後，便循著氣味尾隨而至，展開追求。有些蛇類若有多隻雄蛇同時追求同一隻雌蛇，雄蛇可能彼此搏鬥，勝出的雄蛇才有較多機會與雌蛇交配。雄蛇的競爭熱鬧了山林，蛇類也在一次次求偶中延續生命。
  start_text: 到了繁殖季節，鴕鳥會舉行熱鬧非凡、令人耳目一新的
