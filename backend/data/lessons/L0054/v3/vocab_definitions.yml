lesson_uid: L0054
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 雄赳赳，氣昂昂
  - 爭強鬥勝
  - 粉墨登場
  - 耳目一新
  - 真摯
  - 青睞
  - 丰采
  - 嬌客
  - 招親
  - 尾隨而至
  answer_carrier: 橘色手寫字（圖形），文字流的空格內已填有答案
  items:
  - index: 1
    word: 爭強鬥勝
    definition: 在競爭中總想勝過別人，不願意落後。
  - index: 2
    word: 耳目一新
    definition: 看到或聽到和以前不同的事物，讓人感到新鮮。
  - index: 3
    word: 雄赳赳，氣昂昂
    definition: 形容精神飽滿、氣勢威武的樣子。
  - index: 4
    word: 粉墨登場
    definition: 原指化妝上臺演戲；現在也比喻人物上場或出現。
  - index: 5
    word: 真摯
    definition: 真誠、不虛假。
  - index: 6
    word: 嬌客
    definition: 受到特別照顧或款待的客人；也可形容珍貴、惹人喜愛的動物。
  - index: 7
    word: 尾隨而至
    definition: 緊跟在後面，接著來到。
  - index: 8
    word: 青睞
    definition: 喜歡或重視。
  - index: 9
    word: 招親
    definition: 公開尋找結婚對象。本文用來比喻動物求偶。
  - index: 10
    word: 丰采
    definition: 美好、吸引人的樣子或特色。
