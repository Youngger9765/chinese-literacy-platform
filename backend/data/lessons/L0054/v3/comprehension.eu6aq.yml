comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 小狗追著自己的尾巴跑，「尾隨而至」的模樣，可愛極了
      B: 家裡教室重新粉刷、換上窗簾後，讓人感到「耳目一新」
      C: 王阿姨的孩子走失了，她上網「招親」尋找
      D: 姊姊帶著畫具參加比賽，準備「粉墨登場」作畫
  - index: 2
    answer: D
    stem: 根據本文，下列關於動物求偶的敘述，何者不恰當？
    options:
      A: 求偶的方式十分多元
      B: 求偶的時間各不相同
      C: 求偶目的為繁衍後代
      D: 不同動物求偶地點皆相同
  - index: 3
    answer: C
    stem: 請問本文主旨為何？
    options:
      A: 作者對大自然被破壞感到憂心，希望大家能盡可能地愛護動物
      B: 作者非常喜愛動物，希望動物能多多繁衍，豐富大自然的風采
      C: 動物用不同方式求偶，以繁衍後代，也讓自然展現不同丰采
      D: 動物求偶時必須擊敗競爭對手，才能順利延續生命
  - index: 4
    answer: A
    stem: 小華閱讀了<口腔保健>一文，文章內有多個小標題，請問下列何者較不可能是它的小標題？
    options:
      A: 裝飾牙齒的方法
      B: 牙齒疾病形成原因
      C: 潔牙方式與步驟
      D: 牙齒的功能與分類
  - index: 5
    answer: B
    stem: 「用力量求偶」這個小主題，哪組內容最適合放進去？
    options:
      A: 雄蛙發出鳴叫聲；五色鳥發出求偶叫聲。
      B: 雄蟹揮動大螯；有些雄蛇彼此搏鬥。
      C: 雄海馬舞出姿勢；雄鴕鳥跳起求偶舞。
      D: 雌蛾分泌氣味；雌蛇釋放特殊氣味。
