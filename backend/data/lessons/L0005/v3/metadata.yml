strategy_explained: 這一課我們要練習的是「當別人說話或做事時，想想他心裡在想什麼、有什麼感覺」，就像這篇文章裡，那位身體不舒服的女生，還有生氣的大媽，你都可以試著想想他們為什麼會那樣做，還有當時心裡有多難過或生氣，讀的時候，可以把他們說的話和做的事，跟他們身體的狀況或當時的氣氛連在一起想，就能更了解他們囉
