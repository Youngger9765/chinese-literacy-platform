lesson_uid: L0005
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 示意
  - 局面
  - 路見不平
  - 側目
  - 火藥味
  - 一溜煙
  - 不可收拾
  - 尷尬
  - 顫顫巍巍
  items:
  - index: 1
    word: 示意
    definition: 用動作、眼神等方式讓別人知道自己的意思。
  - index: 2
    word: 局面
    definition: 事情進行到某一階段時，出現的整體情況或狀態。
  - index: 3
    word: 火藥味
    definition: 比喻氣氛緊張，好像快要吵起來或發生衝突。
  - index: 4
    word: 一溜煙
    definition: 形容動作非常快，像煙一樣迅速不見。
  - index: 5
    word: 尷尬
    definition: 讓人不好意思，不知道該怎麼辦。
  - index: 6
    word: 顫顫巍巍
    definition: 形容人因老弱、害怕或不舒服，動作不穩、發抖的樣子。
  - index: 7
    word: 不可收拾
    definition: 事情變得很嚴重、很混亂，已經沒辦法解決或控制。
  - index: 8
    word: 側目
    definition: 斜著眼睛看人，通常表示驚訝、不滿、或看不慣。
  - index: 9
    word: 路見不平
    definition: 看到不公正或不合理的事情，挺身而出，打抱不平。
