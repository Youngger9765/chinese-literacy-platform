  items:
  - index: 1
    stem: 老師用眼神向我（　）要我站起來回答問題，我趕緊從座位上站起來。
    answer: C
  - index: 2
    stem: 下課鐘一響，學生們（　）跑出教室，衝向福利社買點心。
    answer: H
  - index: 3
    stem: 他在網路上亂留言，如果不及早處理，後果恐怕（　）。
    answer: G
  - index: 4
    stem: 他看不慣班上霸凌的行為，所以（　），出面說了幾句公道話。
    answer: I
  - index: 5
    stem: 他在火車上大聲講電話，引來大家（　）。
    answer: B
  - index: 6
    stem: 他剛生完大病，走路時還是（　），需要人扶著。
    answer: E
  - index: 7
    stem: 比賽最後幾分鐘，雙方攻防激烈，（　）變得非常緊張。
    answer: F
  - index: 8
    stem: 學校開會討論要不要取消早自修，學生和學校立場不同，誰也不讓誰，會議室裡充滿（　）。
    answer: D
