  passage: 下班時刻，262路公車上有點擠。一位國中女生從前門上車，站在司機旁，搖搖晃晃的，臉色慘白，好像隨時會昏倒的樣子。司機發現後，對她說：「你不舒服就去坐博愛座！」女生點了個頭表示感謝，走到唯一空著的博愛座坐下。隔了兩站，一位大媽提著大包小包上車，她一看到博愛座上的女生，立刻板起臉，嚷道：「誰家小孩這麼沒教養，連博愛座都敢坐，全車都站著，你憑什麼坐著？」司機聽到連忙解釋：「這位同學身體不舒服，是我讓她去坐的。」大媽眉毛一挑：「我都沒得坐，小孩子裝個病，就有博愛座？真了不起！」女生都快哭出來了，勉強要站起來。旁邊一位阿姨，伸手按在她肩膀上，一邊搖頭一邊以眼神示意，要女學生不必起身，柔聲說道：「博愛座是給需要的人坐的。」大媽不甘示弱，提高音量：「唷，好有正義感呀。公車上互不相識，你怎麼知道誰有需要？她有需要，我就沒需要？」乘客開始側目、低聲議論。
