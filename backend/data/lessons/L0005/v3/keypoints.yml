lesson_uid: L0005
version_id: v3
section_no: 五
keypoints:
  title: 美好的一天
  structure: flat
  rows:
  - label: 事件起點
    value: 一位女生上了公車，臉色慘白，司機請她去【　】
    blanks:
    - answer: 坐博愛座
  - label: 衝突引爆
    value: '1.一位【　】上車後看到女生坐在博愛座，大聲指責。

      2.【　】解釋，但大媽繼續罵。'
    blanks:
    - answer: 大媽
    - answer: 司機
  - label: 衝突擴大
    value: '1.女生勉強要站起來，一位阿姨阻止女生讓座，認為博愛座是給需要的人坐的。大媽提高音量罵人

      2.其他乘客也開始議論怎麼這樣講話大媽回應，說話不行嗎？

      3.司機廣播請大家控制音量，不要干擾其他乘客

      大媽要【　】'
    blanks:
    - answer: 投訴
    note: 版面在「…人坐的。」「…這樣講話」「…其他乘客」之後各印一個 → 連接下句；箭頭是圖形物件，不在文字流，故不寫進 value
  - label: 關鍵轉折
    value: 老奶奶出面支持女生，願意【　】。
    blanks:
    - answer: 讓座
  - label: 結局
    value: 大媽【　】，全車掌聲，司機以「美好的一天」作結尾
    blanks:
    - answer: 尷尬下車
