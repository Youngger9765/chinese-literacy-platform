spotlight:
  lesson: G4-L14
  strategy_name: 推論策略-推論情緒和感受
  strategy_type: emotion_inference
  blocks:
  - type: single
    prompt: 請試著讀底下的文字，再回答一個問題：　　「晚間新聞正播報明天的天氣預報，爺爺坐在電視前的沙發上，早就進入夢鄉。」問題：爺爺有聽到明天的天氣預報嗎？
    options:
    - 【
    - 有聽到
    - 沒有聽到】在回答這個簡單的問題時，你已經在做推論了。你看，「爺爺睡著了，所以沒有聽到天氣預報」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」的過程，最近的流行語叫做「腦補」哦。閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！這篇故事描述公車上發生的爭執，文中角色的情緒起伏很大，但故事並沒有直接寫出角色的情緒或感受，我們可以透過兩個方法來推論：①理解現場情境：人物遇到什麼事？②觀察角色言行：人物說了什麼？做了什麼？表情、語氣？接下來，我們就用這兩個方法，練習推論角色──「大媽」的情緒和感受。並進一步瞭解故事想傳達的深層意義。
    answer: 沒有聽到】在回答這個簡單的問題時，你已經在做推論了。你看，「爺爺睡著了，所以沒有聽到天氣預報」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」的過程，最近的流行語叫做「腦補」哦。閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！這篇故事描述公車上發生的爭執，文中角色的情緒起伏很大，但故事並沒有直接寫出角色的情緒或感受，我們可以透過兩個方法來推論：①理解現場情境：人物遇到什麼事？②觀察角色言行：人物說了什麼？做了什麼？表情、語氣？接下來，我們就用這兩個方法，練習推論角色──「大媽」的情緒和感受。並進一步瞭解故事想傳達的深層意義。
  - type: guide
    text: 一、推論情緒和感受有方法
  - type: guide
    text: (一)理解現場情境
  - type: guide
    text: 小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。試著站在角色的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？
  - type: single
    prompt: ❶ 找情境：故事一開始，大媽上公車後看到什麼？（請在□打勾）□①一位年輕的女生坐在博愛座，而車上其他人都站著。□②女生主動起身讓位，大媽馬上坐到了博愛座。
    options:
    - 打勾）□①一位年輕的女生坐在博愛座，而車上其他人都站著。
    - 女生主動起身讓位，大媽馬上坐到了博愛座。
    answer: 打勾）□①一位年輕的女生坐在博愛座，而車上其他人都站著。
  - type: free_text
    prompt: ❷ 推情緒：面對這種情況，你猜大媽的心情是什麼？為什麼？（請在□打勾）
  - type: single
    prompt: 請選擇
    options:
    - 生氣，因為她認為年輕人不該坐博愛座。
    - 驚喜，因為有人馬上讓座給她。
    answer: 生氣，因為她認為年輕人不該坐博愛座。
  - type: guide
    text: （二）觀察角色言行
  - type: guide
    text: 小祕訣：角色「說的話、動作、表情、語氣」常常偷偷告訴我們他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。段5：大媽眉毛一挑：「我都沒得坐，小孩子裝個病，就有博愛座？真了不起！」
  - type: free_text
    prompt: ❶ 情境：生氣
  - type: single
    prompt: ❷ 找動作：她「眉毛一挑」，這個動作通常表示什麼？（請打勾，可複選）
    options:
    - 驚訝
    - 不高興
    - 想笑
    - 輕視
    answer: 驚訝
  - type: single
    prompt: ❸ 推想法：你覺得「真了不起」的意思是什麼？(單選)
    options:
    - 她年紀小，生病居然膽敢去坐博愛座，勇氣值得稱讚。
    - 她在稱讚，司機先生明察秋毫、願意助人，值得稱讚。
    - 她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。
    answer: 她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。
  - type: guide
    text: 什麼是「說反話」？
  - type: guide
    text: 當一個人有情緒時，卻說出和當時情緒相反的話語，很可能就是在「說反話」。
  - type: free_text
    prompt: 1.很生氣卻說出「讚美」的話
  - type: guide
    text: 你犯了嚴重錯誤，夥伴說：「你真的很天才啊!」
  - type: free_text
    prompt: 2.或很失望卻說出「感謝」的話
  - type: guide
    text: 導師被你們氣壞了，說：「感謝老天讓我教到你們這班！」
  - type: guide
    text: 在本課中出現好幾次「說反話」的例子：
  - type: free_text
    prompt: 1.段5：大媽明明不高興，卻說國中女生「真了不起！」
  - type: free_text
    prompt: 2.段8：明明看大媽不順眼，乘客卻用哪4個字稱讚她?
  - type: passage
    source: unknown
    paragraphs:
    - 【　　　真了不起　　　　　　】
  - type: free_text
    prompt: 3.在段5和段8之間還有一句6個字的反話，請你找到，寫在下面。【　　好有正義感呀　　　　　　】
  - type: guide
    text: ◎你發現了嗎，文章中沒有直接寫出來人物內心的情緒與感受，我們可以透過「理解現場情境」（站在人物的角度）與「觀察角色言行」來推敲喔。
  - type: guide
    text: 二、從故事發展，推論「大媽」的情緒或感受變化
  - type: table
    rows:
    - - 事件
      - 關鍵線索
      - 「大媽」的情緒或感受
    - - 1.大媽一上車，看見年輕女生坐在博愛座
      - 板起臉、嚷道「誰家小孩這麼沒教養...」
      - □①生氣、不滿□②驚訝、不解
    - - 2.聽到司機解釋女生身體不舒服
      - 眉毛一挑，說：「小孩子裝個病...，真了不起！」
      - □①稱讚女生厲害□②不服氣、語氣諷刺
    - - 3.阿姨出聲挺女生
      - 提高音量：「唷，好有正義感呀...」
      - □①覺得被針對、更生氣□②真心佩服阿姨講得很好
    - - 4.聽到有人出聲批評她
      - 更大聲回嗆：「….，我說個話也不行了嗎？」
      - □①覺得開心，有人注意到           □②被批評，火氣更大了
    - - 5.司機廣播警告
      - 「我要去投訴你...」
      - □①想冷靜坐下來             □②憤怒不甘
    - - 6.老奶奶說女生真的生病了，願意讓座
      - 臉紅、連忙擺手說：「…我馬上到站了。」
      - □①尷尬、丟臉、自覺理虧□②還在生氣、不想理會
    - - 7.車子一停
      - 提著大包小包一溜煙下車
      - □①慚愧或丟臉、急著離開現場□②假裝什麼也沒發生
  - type: guide
    text: 三、推論主旨或目的
  - type: passage
    source: unknown
    paragraphs:
    - 從大媽的說話、語氣、動作，我們可以看到她一開始因誤會而「生氣」，後來在老奶奶提醒後，轉為「尷尬」與「慚愧」。最後，讓我們來想想，透過大媽的轉變，這個故事想要告訴我們什麼？（請在□打勾，複選）
  - type: single
    prompt: 請選擇
    options:
    - 人會因為理解而改變態度
    - 發脾氣是解決問題的最好方法
    answer: 人會因為理解而改變態度
  - type: guide
    text: □③善意可以化解衝突、消除誤會
  - type: guide
    text: □④不用了解情況，吃虧時就應該生氣
  - type: guide
    text: 四、換你試試看，推論其他角色的情緒或感受
  - type: free_text
    prompt: 1. 段六：女生都快哭出來了，勉強要站起來。女生當時最可能的情緒是什麼？【　　　害怕、委屈　　　　　　】
  - type: free_text
    prompt: 2. 段八：人群聲音：「幹嘛呀，都幾歲了，還這樣講話？真了不起！」講這句話的人，最可能的情緒是什麼？【　　忿忿不平／不屑　　】
  - type: guide
    text: 一、請你自己檢查以下3項，確定自己是否會推論情緒和感受了
  - type: guide
    text: 二、如果三項都打勾，恭喜你，你已經學會找推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: table
    rows:
    - - 美好的一天
    - - 事件起點
      - 一位女生上了公車，臉色慘白，司機請她去【】
    - - 衝突引爆
      - 1.一位【】上車後看到女生坐在博愛座，大聲指責。     2. 【】解釋，但大媽繼續罵
    - - 衝突擴大
      - 1.女生勉強要站起來，一位阿姨阻止女生讓座，認為博愛座是給需要的人坐的。大媽提高音量罵人2.其他乘客也開始議論怎麼這樣講話大媽回應，說話不行嗎？3.司機廣播請大家控制音量，不要干擾其他乘客大媽要【】
    - - 關鍵轉折
      - 老奶奶出面支持女生，願意【】。
    - - 結局
      - 大媽【】，全車掌聲，司機以「美好的一天」作結尾
    answers:
    - 坐博愛座
    - 大媽
    - 司機
    - 投訴
    - 讓座
    - 尷尬下車
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
    - 我會思考人物說的話是不是真心話，推測他隱藏的真正情緒。
    - 我能把故事前後線索連起來，推論大媽情緒的變化，並明白故事想傳達的道理。
