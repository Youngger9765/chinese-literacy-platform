spotlight:
  lesson: G4-L14
  strategy_name: 推論策略-推論情緒和感受
  strategy_type: emotion_inference
  blocks:
  - type: single
    prompt: 請選擇
    options:
    - '請試著讀底下的文字，再回答一個問題：

      　　「晚間新聞正播報明天的天氣預報，爺爺坐在電視前的沙發上，早就進入夢鄉。」

      問題：爺爺有聽到明天的天氣預報嗎？【'
    - '有聽到　②沒有聽到】

      在回答這個簡單的問題時，你已經在做推論了。

      你看，「爺爺睡著了，所以沒有聽到天氣預報」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」的過程，最近的流行語叫做「腦補」哦。

      閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！

      這篇故事描述公車上發生的爭執，文中角色的情緒起伏很大，但故事並沒有直接寫出角色的情緒或感受，我們可以透過兩個方法來推論：

      ①理解現場情境：人物遇到什麼事？

      ②觀察角色言行：人物說了什麼？做了什麼？表情、語氣？

      接下來，我們就用這兩個方法，練習推論角色──「大媽」的情緒和感受。並進一步瞭解故事想傳達的深層意義。'
    answer: '請試著讀底下的文字，再回答一個問題：

      　　「晚間新聞正播報明天的天氣預報，爺爺坐在電視前的沙發上，早就進入夢鄉。」

      問題：爺爺有聽到明天的天氣預報嗎？【'
  - type: guide
    text: 一、推論情緒和感受有方法
  - type: guide
    text: (一)理解現場情境
  - type: guide
    text: 小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。試著站在角色的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？
  - type: free_text
    prompt: ❶找情境：故事一開始，大媽上公車後看到什麼？（請在□打勾）
  - type: single
    prompt: 請選擇
    options:
    - 一位年輕的女生坐在博愛座，而車上其他人都站著。
    - 女生主動起身讓位，大媽馬上坐到了博愛座。
    answer: 一位年輕的女生坐在博愛座，而車上其他人都站著。
  - type: free_text
    prompt: ❷推情緒：面對這種情況，你猜大媽的心情是什麼？為什麼？（請在□打勾）
  - type: single
    prompt: 請選擇
    options:
    - 生氣，因為她認為年輕人不該坐博愛座。
    - 驚喜，因為有人馬上讓座給她。
    answer: 生氣，因為她認為年輕人不該坐博愛座。
  - type: guide
    text: （二）觀察角色言行
  - type: guide
    text: '小祕訣：角色「說的話、動作、表情、語氣」常常偷偷告訴我們他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。

      段5：大媽眉毛一挑：「我都沒得坐，小孩子裝個病，就有博愛座？真了不起！」'
  - type: free_text
    prompt: ❶情境：生氣
  - type: free_text
    prompt: ❷找動作：她「眉毛一挑」，這個動作通常表示什麼？
  - type: guide
    text: （請打勾，可複選）
  - type: single
    prompt: 請選擇
    options:
    - 驚訝　　②不高興
    - 想笑　　④輕視
    answer: 驚訝　　②不高興
  - type: single
    prompt: ❸推想法：你覺得「真了不起」的意思是什麼？(單選)
    options:
    - 她年紀小，生病居然膽敢去坐博愛座，勇氣值得稱讚。
    - 她在稱讚，司機先生明察秋毫、願意助人，值得稱讚。
    - 她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。
    answer: 她在諷刺小孩子居然敢坐博愛座，用反話說她很糟糕。
  - type: guide
    text: 什麼是「說反話」？
  - type: guide
    text: 當一個人有情緒時，卻說出和當時情緒相反的話語，很可能就是在「說反話」。
  - type: free_text
    prompt: 1.很生氣卻說出「讚美」的話
  - type: guide
    text: 你犯了嚴重錯誤，夥伴說：「你真的很天才啊！」
  - type: free_text
    prompt: 2.或很失望卻說出「感謝」的話
  - type: guide
    text: 導師被你們氣壞了，說：「感謝老天讓我教到你們這班！」
  - type: guide
    text: 在本課中出現好幾次「說反話」的例子：
  - type: free_text
    prompt: 1.段5：大媽明明不高興，卻說國中女生「真了不起！」
  - type: free_text
    prompt: 2.段8：明明看大媽不順眼，乘客卻用哪4個字稱讚她？
  - type: passage
    source: unknown
    paragraphs:
    - 【　　　真了不起　　　　　　】
  - type: free_text
    prompt: 3.在段5和段8之間還有一句6個字的反話，請你找到，寫在下面。【　　好有正義感呀　　　　　　】
  - type: guide
    text: ◎你發現了嗎，文章中沒有直接寫出來人物內心的情緒與感受，我們可以透過「理解現場情境」（站在人物的角度）與「觀察角色言行」來推敲喔。
  - type: guide
    text: 二、從故事發展，推論「大媽」的情緒或感受變化
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、推論主旨或目的
  - type: passage
    source: unknown
    paragraphs:
    - 從大媽的說話、語氣、動作，我們可以看到她一開始因誤會而「生氣」，後來在老奶奶提醒後，轉為「尷尬」與「慚愧」。最後，讓我們來想想，透過大媽的轉變，這個故事想要告訴我們什麼？（請在□打勾，複選）
  - type: multi
    prompt: 請選擇
    options:
    - 人會因為理解而改變態度
    - 發脾氣是解決問題的最好方法
    - 善意可以化解衝突、消除誤會
    - 不用了解情況，吃虧時就應該生氣
    answer:
    - 人會因為理解而改變態度
    - 發脾氣是解決問題的最好方法
    - 善意可以化解衝突、消除誤會
    - 不用了解情況，吃虧時就應該生氣
  - type: guide
    text: 四、換你試試看，推論其他角色的情緒或感受
  - type: free_text
    prompt: 1.段六：女生都快哭出來了，勉強要站起來。女生當時最可能的情緒是什麼？【　　　害怕、委屈　　　　　　】
  - type: free_text
    prompt: 2.段八：人群聲音：「幹嘛呀，都幾歲了，還這樣講話？真了不起！」講這句話的人，最可能的情緒是什麼？【　　忿忿不平／不屑　　】
  - type: guide
    text: 一、請你自己檢查以下3項，確定自己是否會推論情緒和感受了
  - type: guide
    text: 二、如果三項都打勾，恭喜你，你已經學會推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: self_check
    items:
    - 我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
    - 我會思考人物說的話是不是真心話，推測他隱藏的真正情緒。
    - 我能把故事前後線索連起來，推論大媽情緒的變化，並明白故事想傳達的道理。
