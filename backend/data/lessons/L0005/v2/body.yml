source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 下班時刻，262路公車上有點擠。一位國中女生從前門上車，站在司機旁，搖搖晃晃的，臉色慘白，好像隨時會昏倒的樣子。
- 司機發現後，對她說：「你不舒服就去坐博愛座！」女生點了個頭表示感謝，走到唯一空著的博愛座坐下。
- 隔了兩站，一位大媽提著大包小包上車，她一看到博愛座上的女生，立刻板起臉，嚷道：「誰家小孩這麼沒教養，連博愛座都敢坐，全車都站著，你憑什麼坐著？」
- 女生都快哭出來了，勉強要站起來。旁邊一位阿姨，伸手按在她肩膀上，一邊搖頭一邊以眼神示意，要女學生不必起身，柔聲說道：「博愛座是給需要的人坐的。」
- 大媽不甘示弱，提高音量：「唷，好有正義感呀。公車上互不相識，你怎麼知道誰有需要？她有需要，我就沒需要？」乘客開始側目、低聲議論。
- 「幹嘛呀，都幾歲了，還這樣講話？真了不起！」人群裡突然有人路見不平，大聲的說，公車裡漸漸有了火藥味。
- 這時廣播裡傳出司機的聲音：「這位小姐，請控制自己的音量，任何人若再干擾到其他乘客，我都會請他下車。」
- 大媽尖聲嚷了起來：「干擾？干擾什麼？你這話是說我嗎？我要去投訴你這個不講理、不守規矩的……」
- 眼看局面就要不可收拾，國中女生隔壁一位頭髮斑白的老奶奶再也看不下去了，她伸出滿是皺紋的手，摸了摸女生的額頭，轉頭看著大媽說：「這位太太，年輕人真的生病了，你怎麼還強逼人家讓座？你需要座位，我讓位給你好了。」她一邊說一邊顫顫巍巍的站了起來。
- 大媽尷尬了，臉一下子漲得通紅，連忙擺手說：「您坐，您坐，我馬上到站了。」車子一停，大媽提著大包小包一溜煙的下了車。老奶奶再緩緩坐下時，全車爆出一陣掌聲。
