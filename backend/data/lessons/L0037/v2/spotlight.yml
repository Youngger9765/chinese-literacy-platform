  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 1.讓我們來看課文另一個故事
  - type: passage
    source: supplementary
    paragraphs:
    - 孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。
    - 這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很高興，便在秦王面前幫孟嘗君說好話。秦王聽了她的話，解除對孟嘗君軟禁。
  - type: single
    prompt: ❶主角是誰？ □①秦昭王　②孟嘗君　□③幸姬 □④狗盜先生
    options:
    - 秦昭王
    - 孟嘗君
    - 幸姬
    - 狗盜先生
    answer: 孟嘗君
  - type: single
    prompt: "❷主角遇到了什麼「問題」？  □①沒錢買白狐裘  \n②幸姬要白狐裘但已送給秦王   □③找不到人幫忙"
    options:
    - 沒錢買白狐裘
    - 幸姬要白狐裘但已送給秦王
    - 找不到人幫忙
    answer: 幸姬要白狐裘但已送給秦王
  - type: single
    prompt: "❸問題如何「解決」？  □①拜託秦王讓給幸姬   □②再去買一件 \n                      ③食客潛入寶庫偷回白狐裘"
    options:
    - 拜託秦王讓給幸姬
    - 再去買一件
    - 食客潛入寶庫偷回白狐裘
    answer: 食客潛入寶庫偷回白狐裘
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 幸姬幫忙說話，秦王解除軟禁
    - 幸姬拒絕幫忙，孟嘗君被關
    - 秦王說話不算話，不肯放人
    answer: 幸姬幫忙說話，秦王解除軟禁
  - type: free_text
    prompt: 2.策略帶著走：大象有多重？
  - type: passage
    source: unknown
    paragraphs:
    - 有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。
    - 這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。
    - 最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。
  - type: single
    prompt: ❶主角是誰？□①曹操　②曹沖
    options:
    - 曹操
    - 曹沖
    answer: 曹沖
  - type: free_text
    prompt: ❷主角遇到了什麼「問題」？  大象太大，放不上秤，沒辦法秤          。
  - type: single
    prompt: ❸問題如何「解決」？
    options:
    - 請工人抬大象放到大磅秤上秤重
    - 讓大家猜一個大概的重量
    - 用船的水位線比對大象和石頭，再秤出石頭的重量
    answer: 用船的水位線比對大象和石頭，再秤出石頭的重量
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 知道大象的重量
    - 不知道大象的重量
    answer: 知道大象的重量
  - type: fill_table
  - type: self_check
    items:
    - 我能找出主角真正要解決的問題。
    - 我能找出誰用什麼方法解決問題。
    - 我能找出解決後的結果，並用三個部分整理故事重點。
