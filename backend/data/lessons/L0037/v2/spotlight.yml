spotlight:
  lesson: G5-L25
  strategy_name: 摘要策略-問題.解決.結果找重點
  strategy_type: summary_pse
  blocks:
  - type: single
    prompt: 很多故事會寫主角遇到問題、想辦法解決，最後出現結果。把這三個部分找出來，就能掌握故事怎麼發展，也比較容易整理重點。讀這類故事時，可以先找出主角，再用三個問題整理：❶問題：主角遇到了什麼困難？
    options:
    - ❷解決：誰做了什麼，來解決這個困難？❸結果：問題解決後，最後結果如何？今天，我們就來學這個超實用的閱讀方法，用「問題、解決、結果」的方式來整理故事內容，幫助你輕鬆抓到重點。舉例來說：例一：烏鴉喝水天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。❶主角是誰？　　烏鴉　　　❷主角遇到了什麼「問題」？
    - 喝不到水
    - 天氣炎熱❸問題如何「解決」？　　叼小石頭丟進瓶子裡，讓水面升高　　　。❹最後得到什麼「結果」？
    - 主角順利喝到水
    - 主角沒有喝到水接下來，我們來看課文的「雞鳴」的故事孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。孟嘗君一行人順利出關，逃出秦國。❶主角是誰？
    - 孟嘗君
    - 秦昭王
    - 雞鳴先生❷主角遇到了什麼「問題」？
    - 被追兵追到
    - 天沒亮，城門不能開❸問題如何「解決」？孟嘗君的食客【    模仿雞叫　　　】，引來附近公雞也一起叫，讓士兵以為天亮。❹最後得到什麼「結果」？
    - 成功出關
    - 沒有出關
    answer: ❷解決：誰做了什麼，來解決這個困難？❸結果：問題解決後，最後結果如何？今天，我們就來學這個超實用的閱讀方法，用「問題、解決、結果」的方式來整理故事內容，幫助你輕鬆抓到重點。舉例來說：例一：烏鴉喝水天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。❶主角是誰？　　烏鴉　　　❷主角遇到了什麼「問題」？
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 1.讓我們來看課文另一個故事
  - type: passage
    source: supplementary
    paragraphs:
    - 孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。
    - 這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很高興，便在秦王面前幫孟嘗君說好話。秦王聽了她的話，解除對孟嘗君軟禁。
  - type: single
    prompt: ❶主角是誰？ □①秦昭王　□②孟嘗君　□③幸姬 □④狗盜先生
    options:
    - 秦昭王
    - 孟嘗君
    - 幸姬
    - 狗盜先生
    answer: 秦昭王
  - type: single
    prompt: ❷主角遇到了什麼「問題」？  □①沒錢買白狐裘  □②幸姬要白狐裘但已送給秦王   □③找不到人幫忙
    options:
    - 沒錢買白狐裘
    - 幸姬要白狐裘但已送給秦王
    - 找不到人幫忙
    answer: 沒錢買白狐裘
  - type: single
    prompt: ❸問題如何「解決」？  □①拜託秦王讓給幸姬   □②再去買一件                       □③食客潛入寶庫偷回白狐裘
    options:
    - 拜託秦王讓給幸姬
    - 再去買一件
    - 食客潛入寶庫偷回白狐裘
    answer: 拜託秦王讓給幸姬
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 幸姬幫忙說話，秦王解除軟禁
    - 幸姬拒絕幫忙，孟嘗君被關
    - 秦王說話不算話，不肯放人
    answer: 幸姬幫忙說話，秦王解除軟禁
  - type: free_text
    prompt: 2.策略帶著走：大象有多重？
  - type: passage
    source: unknown
    paragraphs:
    - 有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。
    - 這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。
    - 最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。
  - type: single
    prompt: ❶主角是誰？□①曹操　□②曹沖
    options:
    - 曹操
    - 曹沖
    answer: 曹操
  - type: free_text
    prompt: ❷主角遇到了什麼「問題」？  大象太大，放不上秤，沒辦法秤          。
  - type: single
    prompt: ❸問題如何「解決」？
    options:
    - 請工人抬大象放到大磅秤上秤重
    - 讓大家猜一個大概的重量
    - 用船的水位線比對大象和石頭，再秤出石頭的重量
    answer: 請工人抬大象放到大磅秤上秤重
  - type: single
    prompt: ❹最後得到什麼「結果」？
    options:
    - 知道大象的重量
    - 不知道大象的重量
    answer: 知道大象的重量
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: fill_table
  - type: guide
    text: 第1題詳解：A.指的是大家驚訝、慌張、困惑或尷尬樣子。B.指高興地談論。D.模仿得非常傳神、生動、像極了原本的樣子)。第1題詳解：A.指的是大家驚訝、慌張、困惑或尷尬樣子。B.指高興地談論。D.模仿得非常傳神、生動、像極了原本的樣子)。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出主角真正要解決的問題。
    - 我能找出誰用什麼方法解決問題。
    - 我能找出解決後的結果，並用三個部分整理故事重點。
