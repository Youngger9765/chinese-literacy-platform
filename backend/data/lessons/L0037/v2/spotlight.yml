    prompt: 請選擇
    options:
    - '天氣炎熱

      ❸問題如何「解決」？　　叼小石頭丟進瓶子裡，讓水面升高　　　。

      ❹最後得到什麼「結果」？①主角順利喝到水'
    - '主角沒有喝到水

      接下來，我們來看課文的「雞鳴」的故事

      孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。

      這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。

      孟嘗君一行人順利出關，逃出秦國。

      ❶主角是誰？　①孟嘗君'
    - 秦昭王
    - '雞鳴先生

      ❷主角遇到了什麼「問題」？'
    - '被追兵追到　　②天沒亮，城門不能開

      ❸問題如何「解決」？孟嘗君的食客【    模仿雞叫　　　】，引來附近公雞也一起叫，讓士兵以為天亮。

      ❹最後得到什麼「結果」？ ①成功出關'
    - 沒有出關
