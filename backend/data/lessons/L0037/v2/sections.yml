comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列語詞，何者使用正確？
    options:
      A: 有了白狐裘，孟嘗君可以再次收買更多食客，幫助他逃難
      B: 白狐裘象徵孟嘗君的誠意，可能讓秦國君王重新考慮釋放他
      C: 白狐裘的光芒喚醒了孟嘗君求生的意志，使他下定決心逃亡
      D: 代表孟嘗君終於能滿足幸姬的條件，換取她出面求情的機會
    rationale: Ｄ ）2. 第五段說：「狗盜先生捧了個包袱進來，白狐裘雪亮的光芒帶來了活下去的希望。」這裡的「活下去的希望」最可能代表什麼？
  - index: 3
    answer: A
    stem: 哪一個選項正確描述了孟嘗君從赴秦到成功逃離秦國的順序？
    options:
      A: 秦昭王想再見孟嘗君一面，當面解釋誤會
      B: 秦昭王後悔放走孟嘗君，重新生出殺意
      C: 秦昭王覺得孟嘗君的才能可貴，想重新任用孟嘗君
      D: 秦昭王回憶兩人曾經的交情，希望孟嘗君能常伴左右
    rationale: 「想念」在日常語境中是帶有情感的正面詞，但在這段話中，是帶有隱含殺意的諷刺轉義，代表秦昭王情緒反覆、心懷殺機。
  - index: 5
    answer: C
    stem: 孟嘗君最後能夠逃出秦國的關鍵因素是什麼？
    options:
      B: 秦昭王心軟，主動赦免孟嘗君讓他自由離開
      C: 食客們發揮各自的專長，幫助孟嘗君化解危機
      D: 齊國軍隊立刻出兵支援，幫助孟嘗君逃出秦國
    rationale: 雞鳴與狗盜先生的技能看似無用，但在關鍵時刻發揮出力量，解救孟嘗君。
