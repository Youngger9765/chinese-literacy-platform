strategy_explained: '這課要練的是「抓出故事的關鍵線索」

  因為故事裡孟嘗君遇到危險，他的食客們用「狗盜」、「雞鳴」這些特別的技能解決了問題，幫助他逃脫，很適合練習找出「發生了什麼事」、「怎麼解決的」、「最後怎麼樣了」

  讀的時候，你可以想想看，孟嘗君為什麼會被抓，又是怎麼被救出來的'
