intro: 這篇文章講述了戰國時期齊國貴族孟嘗君的故事。孟嘗君以廣納賢士、養了三千名食客而聞名。有一次，他受秦昭王邀請到秦國擔任宰相，卻因遭人讒言而遭到軟禁，甚至面臨殺身之禍。在危急關頭，孟嘗君的食客們展現了他們意想不到的才能，一位擅長「狗盜」的食客潛入秦王宮，為孟嘗君取得了一件關鍵的信物；另一位擅長模仿雞鳴的食客，則在函谷關幫助孟嘗君一行人順利逃脫。這篇故事透過這些情節，展現了即使是看似微不足道的小人物，也能在關鍵時刻發揮巨大的作用。
