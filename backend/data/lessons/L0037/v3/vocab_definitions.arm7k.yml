vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 爭強鬥勝
  - 投奔
  - 互比苗頭
  - 開門見山
  - 讒言
  - 軟禁
  - 凶多吉少
  - 面面相覷
  - 鴉雀無聲
  - 悶不吭聲
  - 匪夷所思
  - 唯妙唯肖
  - 津津樂道
