  passage: 這下孟嘗君頭大了，大衣只有一件，已經送給秦昭王，現在幸姬又想要一件，如果不給，自己就凶多吉少。他立刻召集手下的食客開緊急會議，看怎麼解決問題。食客們面面相覷，會議現場鴉雀無聲。終於，一位坐在最後面、總是悶不吭聲的食客說話了：「我能得到那件皮大衣。」這位矮小瘦削的食客，在投奔孟嘗君時就說過自己的特長是「狗盜」──模仿狗的樣子和動作潛入別人家裡偷東西，他說他能潛入秦王收藏寶物的庫房盜取白狐裘，這事聽來匪夷所思，但事已至此，只能試試了。
