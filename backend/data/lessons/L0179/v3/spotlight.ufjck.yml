lesson_uid: L0179
version_id: v3
section_no: 六
spotlight:
  strategy_name: 心理韌性
  blocks:
  - type: concept_box
    text: '運動場上，我們可能緊張、失誤、被批評，也可能努力了很久仍看不見成果，人生也是。有時候，一個問題還沒解決，另一個問題又跟著出現。

      心理韌性不是不會緊張、不會難過，也不是遇到困難就硬撐。心理有韌性，是遇到壓力、挫折或改變時，能看見自己的狀態、看清問題、找到可以做的事，也懂得運用身邊的支持，讓自己重新站穩、繼續往前。

      在前面的單元中，我們學習了許多照顧自己、面對挑戰的方法，現在就讓我們統整複習，並試試看可以怎麼在真實情境中運用。'
  - type: guide
    text: '◎遇到困難，先問自己四個問題

      來看看小安遇到困難時，可以怎麼一步一步想。'
  - type: passage
    paragraphs:
    - 小安明天要上臺報告。他想到上次忘詞的經驗，開始心跳加快、手心冒汗，心裡很緊張，腦中還一直想：「我明天一定又會忘記！」媽媽看見他反覆練習，問他要不要先休息一下，也可以陪他練習。
  - type: fill_table
    prompt: 1.我現在怎麼了？→先看看自己的身體、情緒和念頭。
    rows:
    - label: 身體
      answer: 心跳加快、手心冒汗
    - label: 情緒
      stem: 心裡很【　】
      answer: 緊張
    - label: 念頭
      answer: 我明天一定又會忘記
  - type: single
    prompt: 2.我真正卡在哪裡？「我明天一定又會忘記」是：
    options:
    - 已經發生的事實
    - 現在的想法
    answer: 2
    tail: →先分辨事實和想法，再找出真正需要處理的問題——現在的想法。
  - type: multi
    prompt: 3.我現在可以做什麼？（多選）我可以先試著（　）
    options:
    - 分段練習
    - 改變練習的方法
    - 苦撐下去
    answer:
    - 1
    - 2
  - type: free_text
    prompt: 4.有誰或什麼可以幫我？我可以找【　】陪我練習。
    reference_answer: 媽媽
  - type: guide
    text: '統整來說，可以有以下的思考：

      1.我現在怎麼了？→覺察；檢視自己的身體、情緒和念頭。

      2.真正的問題是什麼？→分辨事實和想法；找出真正的問題，看看原來的做法是否需要改變。

      3.我現在可以做什麼？→找可行的一步；想想現在還能做什麼：調整方法、找回動力、縮小目標，或選擇下一步。

      4.有誰或什麼可以幫我？→運用支持；遇到困難不必只靠自己。隊友、老師、教練、家人或其他資源，都可能幫得上忙。'
  - type: guide
    text: ◎情境練習：
  - type: passage
    paragraphs:
    - 小凱是校隊的先發球員。最近兩場比賽，他都出現失誤。比賽影片上傳後，還有人留言：「這種程度也能先發？」下一場比賽愈來愈近，小凱感到十分焦慮，腦中一直想到前兩次失誤。他很想證明自己，所以每天比平常多練許多。
  - type: multi
    prompt: 1.小凱現在怎麼了？(可複選)　先不要急著想辦法。從小凱的情況中，可以看見哪些身體、情緒或念頭？
    options:
    - 他的膝蓋已經開始疼痛
    - 想到下一場比賽時，他感到焦慮
    - 他一直想到前兩場的失誤
    - 他擔心自己會失去先發位置
    - 他已經不喜歡打球，所以想退出球隊。
    answer:
    - 1
    - 2
    - 3
    - 4
  - type: sub_block
    prompt: '2.真正把他卡住的是什麼？

      小凱腦中有很多想法，但想法不一定都是事實；有些做法也可能讓原來的問題變得更嚴重。請判斷下面的敘述，哪些屬於事實，哪些屬於想法。'
    items:
    - type: single
      prompt: (1)「小凱前兩場比賽都出現失誤。」
      options:
      - 目前知道的事實
      - 小凱自己的想法
      answer: 1
    - type: single
      prompt: (2)「出了兩次失誤，就表示小凱沒有資格當先發。」
      options:
      - 目前知道的事實
      - 由目前情況延伸出的想法
      answer: 2
    - type: single
      prompt: (3)「小凱的膝蓋已經開始疼痛。」
      options:
      - 目前知道的事實
      - 由目前情況延伸出的想法
      answer: 1
    - type: single
      prompt: (4)「只要再多練一點，就一定能證明自己有資格先發。」
      options:
      - 目前知道的事實
      - 由目前情況延伸出的想法
      answer: 2
  - type: multi
    prompt: ※再想一想，下列哪些想法或作法可能會讓問題更嚴重？
    options:
    - 膝蓋已經疼痛，卻繼續增加練習量
    - 把網路上的一句留言，當成對自己能力的判決
    - 想把下一場比賽打好。
    - 因為怕被換下場，所以不敢告訴教練身體狀況
    answer:
    - 1
    - 2
    - 4
  - type: multi
    prompt: 3.小凱現在可以做什麼？下列哪些方法可能幫得上小凱(可複選)
    options:
    - 比賽前先慢慢呼吸，把注意力放回眼前這一球
    - 想想網路留言有沒有具體根據，不讓一句話替自己下判決
    - 為了增加信心，再把每天的練習量提高一倍
    - 把「下一場絕對不能再失誤」改成「先把眼前這一球做好」
    - 暫時不和隊友說話，避免別人的想法影響自己
    answer:
    - 1
    - 2
    - 4
  - type: multi
    prompt: 4.有誰或什麼可以幫小凱？小凱可以主動尋求哪些支持？（可複選）
    options:
    - 告訴教練膝蓋已經疼痛，一起調整訓練
    - 找家人或信任的隊友說說自己的焦慮
    - 自己撐到比賽結束，不讓任何人知道
    - 在網路上公開回擊那些匿名批評的留言
    answer:
    - 1
    - 2
  - type: self_check
    instruction: ※複習：在這個系列的文章中，我們介紹了許多方法，讓我們在心理遇到挑戰，可以知道怎麼調整。請默讀底下各項，讀過後在□打勾。
    items:
    - ①緊張時，覺察身體和情緒，把注意力帶回當下。
    - ②腦中出現「我不行」時，分辨念頭和事實。
    - ③面對別人的評價時，判斷哪些值得接受，哪些不必照單全收。
    - ④遇到失敗時，找出原因、調整方法。
    - ⑤沒有動力時，換個方式、找到理由、縮小一步、看見進步。
    - ⑥一個人處理不了時，相信夥伴、尋求協助。
  - type: guide
    text: →心理韌性不是每件事都硬撐，是知道現在最重要的是什麼，先做適合的一步。
