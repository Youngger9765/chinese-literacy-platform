  passage: 比賽開始前，手心冒汗，肩膀繃得發硬，腦中一直喊著：「千萬不要失誤！」在球場上，緊張一來，腦中又想太多，讓我們的動作施展不開，甚至僵硬，那不代表我們內心脆弱，只是因為我們很在乎。運動員知道，越急著趕走緊張，動作可能越卡，只能先慢慢吐一口氣，感覺雙腳踩著地面，再把目光放回眼前的球。這種心跳加快的感覺，也會出現在考試、上臺報告或第一次走進陌生環境時。緊張不必完全消失，人可以帶著它，先做好眼前的一步。而萬一遇到失誤，心裡可能會迅速冒出「我果然不行」的念頭，甚至在面對他人的批評和嘲笑時，也不禁陷入自我懷疑。不過，運動員也要慢慢學會分辨：「我不行」是一個念頭，還是眼前的事實？他人的評價是能幫助我的建議，還是只是一句刻薄的標籤？回到教室，考卷上的紅字、同學無心的一句「你怎麼連這個都不會」，也可能令人沮喪。這時按下暫停鍵，區分哪些是事實，哪些只是想法，不要讓一句刺耳的話替自己下判決。
