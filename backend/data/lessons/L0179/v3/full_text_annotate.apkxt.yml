full_text_annotate:
  lesson_heading: 第15課  練過的心，陪你走更遠
  paragraph_count: 7
  paragraphs:
  - idx: 1
    text: 終場哨聲響起，球員走下場，換下裝備，把汗溼的球衣塞進袋子。記分板上的數字很快會被清除，球鞋和護具也收進櫃子。但那顆在一次次練習與比賽中歷經磨練、逐漸變得強韌的心，不會只留在球場。
  - idx: 2
    text: 比賽開始前，手心冒汗，肩膀繃得發硬，腦中一直喊著：「千萬不要失誤！」在球場上，緊張一來，腦中又想太多，讓我們的動作施展不開，甚至僵硬，那不代表我們內心脆弱，只是因為我們很在乎。運動員知道，越急著趕走緊張，動作可能越卡，只能先慢慢吐一口氣，感覺雙腳踩著地面，再把目光放回眼前的球。這種心跳加快的感覺，也會出現在考試、上臺報告或第一次走進陌生環境時。緊張不必完全消失，人可以帶著它，先做好眼前的一步。
  - idx: 3
    text: 而萬一遇到失誤，心裡可能會迅速冒出「我果然不行」的念頭，甚至在面對他人的批評和嘲笑時，也不禁陷入自我懷疑。不過，運動員也要慢慢學會分辨：「我不行」是一個念頭，還是眼前的事實？他人的評價是能幫助我的建議，還是只是一句刻薄的標籤？回到教室，考卷上的紅字、同學無心的一句「你怎麼連這個都不會」，也可能令人沮喪。這時按下暫停鍵，區分哪些是事實，哪些只是想法，不要讓一句刺耳的話替自己下判決。
  - idx: 4
    text: 真的失敗時，運動員也明白失敗是最好的老師：是哪個動作慢了？哪一次判斷出了問題？失敗不會自動讓人變強，但只要願意找出原因、重新練習，就能為下一次提供調整的方向。努力也不一定立刻看得見成果，這時堅持不只是一味苦撐，有時也包括尋求協助、改變練法，甚至重新選擇適合自己的方向。運動員們帶著這些覺察和態度回到生活，面對課業、人際甚至生涯的難題時，也能先看清問題，再決定怎麼走下一步。
  - idx: 5
    text: 而場上還有許多事，無法憑一己之力。接力選手伸出手，得相信隊友會把棒子準確交來；投手投出球，也要相信捕手會是能接住你的搭檔。即使競爭同一個位置，兩名隊友也能彼此提醒，讓對方成為一起進步的夥伴。在日常生活與學習中也是一樣，願意把一部分任務交給夥伴，不是偷懶；讓每個人發揮所長，事情反而可能做得更好。好的競爭，不一定只能是「你輸我贏」，而可以是「我好，你也好」：我努力發揮自己的長處，也願意讓隊友變強，彼此都能從對方身上學習。
  - idx: 6
    text: 這些在運動場上練出的能力，也可能陪一個人走進另一條路。跆拳道選手陳怡安15歲時，在1988年漢城奧運跆拳道示範賽奪金，四年後再度奪金。後來，她因傷在國手選拔中失利，運動生涯也轉了彎。離開擂台後，她做過記者、節目主持人和行銷工作，後來創立手工皂品牌。她把創業形容成一場比賽：每一回合，都要依據眼前的局勢調整戰術。運動沒有教她如何製作香皂，卻讓她熟悉了面對壓力、接受失誤、重新調整，再繼續往前的過程。
  - idx: 7
    text: 身為運動員，我們除了練身體，也要練心。練心從來不只是為了下一場比賽。獎牌會收進盒子，紀錄也可能被超越，但在辛苦的訓練與比賽中，你會慢慢學會聽懂身體和心裡的訊號，知道怎麼面對挫折，也學會和別人並肩往前走。這顆練過的心，會陪你走出球場，也會陪你走進更長的人生。
