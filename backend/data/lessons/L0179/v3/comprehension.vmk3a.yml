lesson_uid: L0179
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列選項中「  」的語詞，何者使用正確？
    options:
      A: 這支球隊的戰術安排十分「強韌」，每局都照原計畫進行
      B: 今天學校廣播出現嚴重「失利」，讓各處室老師都很困擾
      C: 面對現今複雜的「局勢」，各國領導者都想維護自身利益
      D: 這種布料十分「刻薄」，夏天穿起來輕薄透氣
    teacher_note: 第1題解析：(A)可用「縝密」；(B)宜用「故障」；(D)宜用「薄透」
  - index: 2
    answer: C
    stem: 根據第二段，文章說：「緊張不必完全消失，人可以帶著它，先做好眼前的一步。」這句話最主要想表達什麼？
    options:
      A: 緊張如果無法消失，就只能學著冷靜並忽略自己感受
      B: 緊張通常能提升運動表現，因此不需要特別處理情緒
      C: 即使仍有緊張，也可以把注意力帶回目前能做的事情
      D: 只要能夠專心完成眼前任務，緊張自然就會完全消失
    teacher_note: 第2題解析：從「做好眼前的一步」代表眼前能做的事情。
  - index: 3
    answer: A
    stem: 根據第三段，「『我不行』是一個念頭，還是眼前的事實？」作者最想提醒讀者避免哪一種情況？
    options:
      A: 把腦中的負面想法，直接當成對自己能力的事實判斷
      B: 因為別人提出批評，就認為對方一定比自己了解情況
      C: 因為一次表現不佳，就只注意別人對自己的負面看法
      D: 因為害怕失敗，所以完全不敢檢查自己的不足與失誤
    teacher_note: 第3題解析：從「我不行」是腦中的負面想法可看出。
  - index: 4
    answer: C
    stem: 根據本文，下列何者最符合文章主旨？
    options:
      A: 運動員面對緊張與失誤時，可以學習調整自己並專注當下
      B: 運動員除了努力提升自己，也要相信隊友並學會合作分工
      C: 運動中磨練出的心理能力，也能運用在人生面對各種挑戰
      D: 運動員遭遇失敗與挫折時，可以找出原因並調整前進方向
    teacher_note: 第4題解析：(A)(B)(D)都只提到單項的能力，(C)強調可以帶到人生其它情境。
  - index: 5
    answer: D
    stem: 文章第一段寫「記分板上的數字很快會被清除」，最後又寫「獎牌會收進盒子，紀錄也可能被超越」，這樣前後安排有什麼作用？
    options:
      A: 強調比賽勝負終會過去，不必把成績和獎牌看得太重要
      B: 對比球場成績與人生的經驗，說明後者更值得長久記住
      C: 強調運動生涯終會結束，應該放下過去曾經得到的成績
      D: 前後呼應比賽成果會過去，但磨練出的心理能力會留下
  slug: vmk3a
