  passage: 米田堡血型是指紅血球外層的紅血球膜上有較多的「帶三蛋白」，這種蛋白的主要功能是協助人們把體內的二氧化碳(CO2)由肺部呼氣排出體外，就像是細胞膜上開了很多道小門，讓二氧化碳能夠透過這些小門更快排出體外。據此，我們推論有米田堡血型的人排出二氧化碳的能力應該會比一般人強。為了檢驗這個想法，我們就進一步想看看「米田堡血型」和「非米田堡血型」的人們，運動後代謝二氧化碳的效率是否有所差異。馬偕醫院對近300位成人進行血液、血型檢驗，並且要求每位參與者做3分鐘的踏階運動測驗，而且在運動「之前」與「之後」測量他們的呼吸生理數值。運動後每個人都會呼出較多二氧化碳，這研究發現：沒有米田堡血型的成人在踏階後，平均需花2～3分鐘排完此運動所產生的二氧化碳；不過，帶有米田堡血型的成人在踏階後，僅需1～2分鐘就排完二氧化碳。這個實驗的結論是：在運動之後，有米田堡血型的人體能恢復得比較快。除了運動員水滴石穿、努力不懈的練習之外，米田堡血型的研究指出，基因決定的身體素質也可能會影響運動表現。如果可以因材施教，根據每個人的優勢，往適合的方向發展，也許能帶來事半功倍的效果哦。阿美族人在基因上有這麼特別的「禮物」，或許可以成為他們在運動發展上和未來職涯選擇上的參考呢！
