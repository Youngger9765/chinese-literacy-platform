  char_marks_note: "起點確認無誤：☞ 印在段落六那一行，而第 1 個數字 26 **正好等於段落六第 1 行的字數**\n（「米田堡血型是指紅血球外層的紅血球膜上有較多的「帶三蛋」＝26 字），兩邊互相印證。\n但**後面的端點對不上**：187 對段落六 191 字（差 4）、363 對段落六+七 383 字（差 20）。\nSKILL ⑥.7 四條 Word 口徑逐條試過都解釋不了：\n  ① 數字串算 1 字 → 已套（198→196），差距仍在\n  ② 註腳算進去   → 本課兩條註腳都掛在段落一（☞ 之前），不影響\n  ③ 分節小標算進去 → 段落六~八之間沒有不佔段號的小標\n  ④ variation selector 不算 → 段落六~八逐字元掃過，Cf/Mn 類別 0 個\n  ⑤ 破折號 U+2014 算 0 字 → 段落六~八**一個破折號都沒有**，這條用不上\n  ⑥ 空白不計入 → 段落六 0 個空白（無效果）；段落七 3 個，扣掉後 196→193，\n     段落六+七 = 384，離印出來的 363 還差 21\n另外「CO2」當一個拉丁字串算 1 字也只補得回 2 字（191→189）。\n2026-08-18 補：⑤⑥ 兩條是 SKILL 後來新增的，**回頭逐條重試過，仍然解釋不了**。\n⛔ 起點既然由 ☞ 與第 1 個數字雙重確認，就**不標 span_confidence: medium**——\n這是未解的計數差異，不是抓錯段落。\n末值 380 落在段落八中間（段落八共 138 字），字數欄在此停止，不是段界。\nPDF 上數字欄整體上移一行。"
