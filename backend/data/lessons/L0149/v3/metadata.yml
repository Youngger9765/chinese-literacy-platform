strategy_explained: '這一課我們要一起練習看懂和畫出長條圖、圓形圖，來了解各種數據的差別

  這篇文章裡有許多關於不同族群「米田堡血型」的比例，還有基因帶來的運動優勢，這些都非常適合用圖表來呈現和比較，讓你一眼就能看懂

  讀的時候，你可以試著把課文裡說到的數據，自己畫成長條圖或圓形圖，看看圖跑出來會是什麼樣子，是不是更容易理解阿美族人在運動上表現特別的原因呢'
