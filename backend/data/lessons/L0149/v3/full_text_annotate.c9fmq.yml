full_text_annotate:
  title_line: 第6課  從基因來的特別禮物
  paragraph_count: 8
  paragraphs:
  - idx: 1
    text: 羅馬奧運十項全能銀牌的楊傳廣、東京奧運女子舉重金牌的郭婞淳、女子拳擊女王陳念琴、臺灣最速男楊俊翰，他們四人除了運動表現傑出之外，還有什麼共同點？是的，他們都具有阿美族的背景。「是巧合吧！」你也許會說。這個現象也許不只是巧合，我們可以再看一組數據。再舉一個例子：阿美族約占全臺灣人口的1%，但是代表臺灣參加2021年東京奧運的國手總共有68位，其中7位有阿美族的血統，占全部選手的10.3%。亦即，阿美族人在東京奧運國手中的占比是「過度表徵」的。
  - idx: 2
    text: 無獨有偶，除了運動競技之外，人類學者賴昱錡在她的著作《你今天做苦力了嗎？》中提到，100年前，日本官員找臺灣人來開墾建設、做苦力，他們曾比較臺灣各族裔群體的勞動成效，結果發現阿美族人最能耐「苦力」。
  - idx: 3
    text: 以上這些報導對從事多年血型研究的馬偕醫院同仁來講，並不意外──88%的阿美族人有得天獨厚的「米田堡血型」，他們因此可能具有先天「呼吸生理」上的優勢！
  - idx: 4
    text: 大家都知道，不同血型的人不能互相輸血。病人接受手術前，醫院血庫的工作人員必須小心預防一件事——輸血袋中的血液和病人的血液產生不良的、甚至致命的輸血反應。但每個人體內的紅血球表面上，除了A、B、O、AB型之外，還有其他血型種類，為了了解臺灣病人的需求，馬偕醫院在1990年代調查全臺各地所有種類的血型分佈，當時一項驚奇的發現是：在多數族群中相當少見的「米田堡血型」，在臺灣東部還蠻常見的。
  - idx: 5
    text: 白種人5萬人裡才有1位是米田堡血型（0.002％），東北亞人種（如日本人）裡16,000人僅1位（0.006％）。帶有米田堡血型者，臺灣人約有5%，而阿美族人則高達88％，這比率幾乎是世界第一，再來依序是雅美族的34％，與卑南族的21％。
  - idx: 6
    text: 米田堡血型是指紅血球外層的紅血球膜上有較多的「帶三蛋白」，這種蛋白的主要功能是協助人們把體內的二氧化碳(CO2)由肺部呼氣排出體外，就像是細胞膜上開了很多道小門，讓二氧化碳能夠透過這些小門更快排出體外。據此，我們推論有米田堡血型的人排出二氧化碳的能力應該會比一般人強。為了檢驗這個想法，我們就進一步想看看「米田堡血型」和「非米田堡血型」的人們，運動後代謝二氧化碳的效率是否有所差異。
  - idx: 7
    text: 馬偕醫院對近300位成人進行血液、血型檢驗，並且要求每位參與者做3分鐘的踏階運動測驗，而且在運動「之前」與「之後」測量他們的呼吸生理數值。運動後每個人都會呼出較多二氧化碳，這研究發現：沒有米田堡血型的成人在踏階後，平均需花2～3分鐘排完此運動所產生的二氧化碳；不過，帶有米田堡血型的成人在踏階後，僅需1～2分鐘就排完二氧化碳。這個實驗的結論是：在運動之後，有米田堡血型的人體能恢復得比較快。
  - idx: 8
    text: 除了運動員水滴石穿、努力不懈的練習之外，米田堡血型的研究指出，基因決定的身體素質也可能會影響運動表現。如果可以因材施教，根據每個人的優勢，往適合的方向發展，也許能帶來事半功倍的效果哦。阿美族人在基因上有這麼特別的「禮物」，或許可以成為他們在運動發展上和未來職涯選擇上的參考呢！
