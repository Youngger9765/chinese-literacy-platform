keypoints:
  lesson: G9-L6
  structure: nested
  columns:
  - label
  - sub_label
  - value
  rows:
  - label: 問題與假設
    value: 問題：為什麼阿美族人在部分運動與勞動紀錄中有突出表現？這可能和哪些因素有關？ 假設：88%的阿美族人有米田堡血型，可能具有    __的呼吸生理優勢。
    blanks:
    - answer: 得天獨厚
      hint: ''
  - label: 檢驗假設
    sub_rows:
    - sub_label: 研究問題
      template: 「米田堡血型」和「非米田堡血型」的人們，運動後__二氧化碳的效率是否有差異？
      blanks:
      - answer: 代謝
        hint: ''
    - sub_label: 實驗
      template: 對300位成人進行血液、血型的檢測，並要求參與者做3分鐘的踏階運動測驗，比較運動前後的呼吸生理數值差異。
      blanks: []
    - sub_label: 研究結論
      template: 在運動之後，有米田堡血型的人體能恢復得較__。
      blanks:
      - answer: 快
        hint: ''
  - label: 啟示
    value: (1)除了努力練習，__也可能影響運動表現。(2)如果可以__，將可以發揮個人最大的優勢。
    blanks:
    - answer: 身體素質
      hint: ''
    - answer: 因材施教
      hint: ''
  title: 從基因來的特別禮物
