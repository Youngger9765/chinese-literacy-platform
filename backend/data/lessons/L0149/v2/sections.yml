comprehension:
  questions:
  - index: 1
    answer: B
    stem: 下列選項的描述，何者出現「過度表徵」的現象？
    options:
      A: 華語人口占世界人口的14.8%，華語是世界排名第一的常用語言
      B: 大安區人口占全台人口的1.2%，但台大有6.9%學生來自大安區
      C: 2023年印度總人口14億2千萬人，是全世界人口數最高的國家
      D: 男生占全臺灣國中生52%，但某國中的男生卻占全校人數的50%
    rationale: null
  - index: 2
    answer: C
    stem: 根據課文第五段長條圖，以下描述何者是錯誤的？
    options:
      B: 各個族裔帶有米田堡血型的比率差異很大
      C: 世界上只有這六種族裔具備米田堡血型
      D: 阿美族有米田堡血型的比率遠超過其他族裔
    rationale: 選項Ｃ－過度推論，長條圖雖未畫到，但不代表只有這六種族裔具米田堡血型。
  - index: 3
    answer: D
    stem: 馬偕醫院想知道「米田堡血型的人，運動後代謝二氧化碳能力的強弱」，因而進行了實驗。根據課文對實驗的描述，以下選項何者錯誤？
    options:
      B: 實驗設計比較有、無米田堡血型者的代謝效能
      C: 結果發現具有米田堡血型的人，能較快排出二氧化碳
      D: 結果發現運動產生的二氧化碳在體內越久、效能越好
    rationale: D-體內二氧化碳越少，效能越好。
  - index: 4
    answer: A
    stem: 根據本文結尾，下列何者是本文想要傳達給讀者的理念？
    options:
      A: 選擇職涯可綜合評估天賦及努力
      C: 後天的努力比先天基因更為重要
      D: 有米田堡血型的人都是運動健將
    rationale: 根據總結，努力和先天身體素質都是影響運動關鍵之一，所以依照自己的能力選擇自己的方向，將能事半功倍。
  - index: 5
    answer: B
    stem: 作者在課文第一、二段用了三個例子描述「阿美族人」在運動與勞動表現上的突出現象，請問這樣的寫作方式目的為何？
    options:
      A: 為了與結尾相互呼應
      C: 方便比較三種例子的差異
      D: 科學問題一定要有三個支持的證據
      B: 作者用三個例子說明阿美族的特殊之處，加強文章說服力。
    rationale: 作者用三個例子說明阿美族的特殊之處，加強文章說服力。
    is_rationale: true
