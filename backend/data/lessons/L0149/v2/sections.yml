vocab_definitions:
  items:
  - index: 1
    word: 事半功倍
    definition: 費力少但收穫大。
  - index: 2
    word: 效率
    definition: 付出心力與獲得成效的比率。
  - index: 3
    word: 職涯
    definition: 指職業、生涯。
  - index: 4
    word: 過度表徵
    definition: 某一群體在某個類別中的比率太高，超出預期。例如，全臺灣國中男生佔52%，但某國中的男生占全校人數的70%，表示這個國中的男生是過度表徵。
  - index: 5
    word: 因材施教
    definition: 根據學生不同的特質，給予不同的教導。
  - index: 6
    word: 代謝
    definition: 生物體內物質被轉換、利用或排出的過程。本文指運動後身體處理並排出二氧化碳的過程。
  - index: 7
    word: 得天獨厚
    definition: 獨具特殊的優越條件。
  - index: 8
    word: 水滴石穿
    definition: 比喻雖然力量小，只要堅持不懈，就能把艱難的事做成。
