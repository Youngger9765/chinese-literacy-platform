    word: 預言
    definition: 預測未來可能發生的事情。
  - index: 2
    word: 風險意識
    definition: 能察覺可能發生的危險，並事先防範的意識。
  - index: 3
    word: 雷同
    definition: 事物非常相似。
  - index: 4
    word: 應󠇡驗
    definition: 預言或推測後來真的發生了。
  - index: 5
    word: 倖存者
    definition: 在災難、事故或危險中存活下來的人。
  - index: 6
    word: 偏誤
    definition: 思考或判斷時產生的偏差與錯誤。
  - index: 7
    word: 含糊其辭
    definition: 說話或表達得不清楚，讓人難以知道真正的意思。
