comprehension:
  questions:
  - index: 2
    answer: B
    stem: 文中說「天空會降下火光」這種說法容易讓人覺得「好像應驗了」，人們會這樣覺得的原因是什麼？
    options:
      B: 這句話可以套用到太多不同類型的事件上
      C: 預言者事先觀察到天文異常現象
      D: 人們對天空現象普遍感到恐懼
    rationale: 文章解釋這句話可以被套用到火山爆發、戰爭或煙火秀等情況，因而產生「應驗」的感覺。
  - index: 3
    answer: A
    stem: 「倖存者偏誤」會讓人覺得某個預言很準的原因是什麼？
    options:
      A: 人們會只記住應驗的預言，忽略未應驗的
      B: 所有應驗的預言都附有科學證據
      C: 人們特別尋找符合自己信念的證據
      D: 人們因為未來不確定而尋求安心
    rationale: null
  - index: 4
    answer: D
    stem: 作者提到諾查丹瑪斯和瑪雅曆法的例子，是想告訴我們什麼？
    options:
      A: 立即搬離東亞，避免任何可能風險
      B: 每天追蹤與預言相符的新聞，確保第一時間得知
      C: 評估科學機構的資料，並落實日常防災準備
      D: 在網路上大量轉發預言，提醒更多人注意
    rationale: 文章強調真正可靠的是防災意識與專業機構資訊，而不是聽信模糊預言。
