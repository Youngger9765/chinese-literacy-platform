passage: 心理學研究提供了一些線索，幫助我們理解為什麼人們容易相信災難預言。首先是「倖存者 偏誤」，意思是我們傾向只注意那些看似應驗的預言，而忽略許多沒有應驗的預測。例如，某人預測「某年會有大地震」，如果地震真的發生，大家會說「他好準」！但他可能還預測了許多從未發生的災害，這些不準的預言卻很快就被遺忘了。其次是「確認偏誤」，指的是我們會特別尋找符合自己信念的證據。例如，聽到「某地將發生災難」，只要那個地方出現一點異常，比如暴風雨或停電，有些人就會以為預言成真。另外，人們常會對不確定性感到不安，當未來充滿未知時，災難預言反而像一盞指引的燈，哪怕不準確，也能讓人暫時感到安心。
