  - label: 預言例子
    value: '1.日本漫畫中的夢境

      (1)漫畫內的夢境災難場景和後來2011年東日本大地震高度雷同。

      (2)2025年7月5日會發生大地震和海嘯，引發許多人不安。

      2.諾查丹瑪斯

      有人根據他的詩句，預測1999年會出現世界末日。

      3.瑪雅文明

      有人把瑪雅曆法解讀為2012年12月21日世界末日。

      上述三項災難預言，最後都__。'
    blanks:
    - answer: 未發生/未成真
      hint: ''
  - label: 人們為何容易相信預言？
    value: '一、預言與網路的特性

      1.預言通常__，模糊的說法可以套用到多種情況。

      2.災難預言像恐怖片，讓人害怕，卻又忍不住想聽、想看。

      3.__讓內容快速傳播，相信的人也可能跟著增加。'
    blanks:
    - answer: 含糊其辭
      hint: ''
    - answer: 網路
      hint: ''
  - label: 人們為何容易相信預言？
    value: '二、心理學解釋

      1.__：只注意那些看似應驗的預言，忽略沒有應驗的預測。

      2.__：特別尋找符合自己信念的證據。

      3.對於不確定的未來，人們感到不安，災難預言能讓人暫時感到__'
    blanks:
    - answer: 倖存者偏誤
      hint: ''
    - answer: 確認偏誤
      hint: ''
    - answer: 安心
      hint: ''
  - label: 結論
    value: '1.大多數預言缺乏__，人們無須過度恐慌。

      2.面對災難，平時應具備__與防災能力，並留意專業機構發布的資訊。'
    blanks:
    - answer: 科學證據
      hint: ''
    - answer: 風險意識
      hint: ''
