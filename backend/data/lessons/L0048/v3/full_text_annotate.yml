  section_headings_note: 本課課文中間沒有分節小標。
  paragraphs:
  - idx: 1
    text: 一名叫龍樹諒的日本漫畫家，因1999年出版的漫畫《我所看見的未來》而受到關注。她在作品中描繪了自己夢境中出現的災難場景，後來有人認為這些場景與2011年3月11日的日本東北大地震高度雷同，因此引發了熱議。不久後，人們又注意到漫畫中的另一個夢境，並把它解讀為：2025年7月5日可能發生大地震，引發巨大海嘯，波及日本、臺灣及亞洲周邊地區。
  - idx: 2
    text: 這項預言在社群媒體上廣泛流傳，讓許多人感到不安，大量的外國旅客甚至取消或延期前往日本，有些日本民眾也表示會選擇這天與家人團聚，準備應對可能來臨的大災難。7月5日，預言中的世界末日到了，許多人屏息以待，等待災難的到來。所幸，這項預言最終沒有成真，7月5日仍是個平靜的週末。
  - idx: 3
    text: 災難預言不是什麼新鮮事，幾百年前，甚至更早的古代就已經有了！ 16世紀，法國預言家諾查丹瑪斯寫下許多神祕的詩，很多人相信他預言了戰爭、地震，甚至現代的科技革命。他的詩模模糊糊，有人根據其中一首詩，預測1999年世界會完蛋，結果大家還是活得好好的！另外，中美洲的古代瑪雅文明以天文、數學和曆法聞名。後來，有人根據流傳下來的瑪雅曆法，把2012年12月21日解讀為世界末日，預測屆時地球將面臨火山爆發、地震、海嘯等大災難，但到了那天，地球照樣轉動。這些有名的預言聽來玄妙，最後卻都沒有成真，到頭來仍是鬧劇一場。
  - idx: 4
    text: 然而，相信災難預言的人還真不少，為什麼呢？首先，預言通常含糊其辭，比如「天空會降下火光」，既可以解釋成火山爆發，也可以套用到戰爭，甚至煙火秀，事後看來，就容易讓人覺得「預言好像應驗了」。再來，人們天生愛聽故事，災難預言就像恐怖片，明明害怕，卻又忍不住想聽、想看。再加上網路盛行，有人把預言說得繪聲繪影；點閱率一飆升，內容就傳得更快，相信的人也可能跟著增加。
  - idx: 5
    text: 心理學研究提供了一些線索，幫助我們理解為什麼人們容易相信災難預言。首先是「倖存者 偏誤」，意思是我們傾向只注意那些看似應驗的預言，而忽略許多沒有應驗的預測。例如，某人預測「某年會有大地震」，如果地震真的發生，大家會說「他好準」！但他可能還預測了許多從未發生的災害，這些不準的預言卻很快就被遺忘了。其次是「確認偏誤」，指的是我們會特別尋找符合自己信念的證據。例如，聽到「某地將發生災難」，只要那個地方出現一點異常，比如暴風雨或停電，有些人就會以為預言成真。另外，人們常會對不確定性感到不安，當未來充滿未知時，災難預言反而像一盞指引的燈，哪怕不準確，也能讓人暫時感到安心。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 6
    text: 大多數災難預言缺乏科學根據，常靠模糊語言吸引注意，我們無須過度恐慌。雖然這些預言並不可信，但有時也會提醒人們重新關心防災。像2025年7月5日的大地震預言，就讓不少人重新重視地震防災準備。面對災難，與其聽信末日傳言，不如平時就具備風險意識與防災能力，並多留意專業機構發布的資訊。
