lesson_uid: L0048
version_id: v3
section_no: 四
spotlight:
  strategy_name: 詞彙推測策略──拆詞釋義＋從上下文推測詞義
  strategy_type: vocabulary
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '閱讀時遇到不懂的詞，不一定要馬上查字典。先看看可以用哪種線索。

      詞裡有熟悉的字或詞，可以先用「拆詞釋義」。

      詞裡的字或詞不熟悉，但前後文有線索，可以先用「從上下文推測詞義」。

      如果用一種方法還不能確定，可以再用另一種方法幫忙。最後，把推測的意思放回句子，看看是否合理。

      遇到難詞時，可以先這樣想：'
  - type: figure
    referent: 「自學遇到『難詞』怎麼辦？」決策流程圖
    text_carrier: image
    caption_lines:
    - 自學遇到「難詞」怎麼辦？
    - 難詞-我知道字義嗎？
    - 我知道 → 拆詞釋義
    - 我不知道 → 用上下文推詞義 → 失敗 → 查字典或問人
  - type: sub_block
    label: 一、詞彙：恐慌
    instruction: 一、詞彙：恐慌
    quote: 課文句子：大多數災難預言缺乏科學根據，我們無須過度恐慌。
    quote_note: 引文比課文第 6 段少了「常靠模糊語言吸引注意，」一句（原稿如此，是刻意節錄不是漏抄）。
    answer_carrier: 紅色 ☑（圖形，文字流無此資訊）；推測詞義的手寫答案在文字流內
    items:
    - type: single
      prompt: 1.先判斷：拆開後，「恐」和「慌」的意思你都熟悉嗎？
      options:
        1: 都熟悉，可以先用「拆詞釋義」
        2: 不熟悉，改用「從上下文推測詞義」或其他方法
      answers_printed: false
      answer_note: '兩個選項在教師版都是空白 □。這一題**有**標準答案（下一步就走「拆詞釋義」，

        可知是①），只是教師版沒印，故用 answers_printed 而非 no_correct_answer。

        本課一~四大題的「先判斷」都是同樣的缺印。'
    - type: free_text
      prompt: '2.如果你選「拆詞釋義」，試著推測詞義

        「恐」：【　】

        「慌」：【　】　　兩個字義合起來：【　】'
      blanks:
      - answer: 恐懼、害怕
      - answer: 慌張、慌亂
      - answer: 害怕慌張
    - type: single
      prompt: 3.把推測的意思放回課文：
      options:
        1: 合理
        2: 不合理
      answer: 1
  - type: sub_block
    label: 二、詞彙：熱議
    instruction: 二、詞彙：熱議
    quote: 課文句子：她在作品中描繪了自己夢境中出現的災難場景，後來有人認為這些場景與2011年3月11日的日本東北大地震高度雷同，因此引發了熱議。
    answer_carrier: 紅色 ☑（圖形，文字流無此資訊）；推測詞義的手寫答案在文字流內
    items:
    - type: single
      prompt: 1.先判斷：拆開後，「熱」和「議」的意思你都熟悉嗎？
      options:
        1: 都熟悉，可以先用「拆詞釋義」
        2: 不熟悉，改用「從上下文推測詞義」或其他方法
      answers_printed: false
    - type: free_text
      prompt: '2.如果你選「拆詞釋義」，試著推測詞義

        「熱」：【　】

        「議」：【　】　　　　兩個字義合起來：【　】'
      blanks:
      - answer: 熱烈
      - answer: 討論
      - answer: 熱烈討論
    - type: single
      prompt: 3.把推測的意思放回上面的句子：意思合理嗎？
      options:
        1: 合理
        2: 不合理
      answer: 1
  - type: sub_block
    label: 三、詞彙：屏息以待
    instruction: 三、詞彙：屏息以待
    answer_carrier: 紅色 ☑（圖形，文字流無此資訊）
    items:
    - type: single
      prompt: 1.先判斷：拆開後，「屏、息、以、待」的意思你都熟悉嗎？
      options:
        1: 大多熟悉，可以先用「拆詞釋義」
        2: 大多不熟悉，改用「從上下文推測詞義」
      answers_printed: false
    - type: guide
      text: 2.如果你選「從上下文推測詞義」，試著畫線找線索
    - type: passage
      label: 課文句子
      paragraphs:
      - 這項預言在社群媒體上廣泛流傳，讓許多人感到不安，…。7月5日，預言中的世界末日到了，許多人屏息以待，等待災難的到來。
    - type: single
      prompt: 3.根據這些線索，可以推論「屏息以待」的意思是：（單選）
      options:
        1: 緊張地等待
        2: 安靜地等待
      answer: 1
    - type: single
      prompt: 4.把推測的意思放回上面的句子：意思合理嗎？
      options:
        1: 合理
        2: 不合理
      answer: 1
  - type: sub_block
    label: 四、詞彙：點閱率
    instruction: 四、詞彙：點閱率
    answer_carrier: 紅色 ☑（圖形，文字流無此資訊）
    items:
    - type: passage
      label: 課文句子
      paragraphs:
      - 再加上網路盛行，有人把預言說得繪聲繪影；點閱率一飆升，內容就傳得更快，相信的人也可能跟著增加。
    - type: single
      prompt: 1.先判斷：拆開後，「點閱、率」的意思你都熟悉嗎？
      options:
        1: 都熟悉，可以先用「拆詞釋義」
        2: 不熟悉，改用「從上下文推測詞義」
      answers_printed: false
    - type: guide
      text: 2.如果你選「從上下文推測詞義」，請試著在上面的句子畫線找線索
    - type: single
      prompt: 3.根據這些線索，可以推論「點閱率」大概是指：（單選）
      options:
        1: 網路內容受到相信的程度
        2: 網路內容被點開閱讀的比率
      answer: 2
    - type: single
      prompt: 4.把推測的意思放回上面的句子：意思合理嗎？
      options:
        1: 合理
        2: 不合理
      answer: 1
  - type: sub_block
    label: 五、詞彙：繪聲繪影
    instruction: 五、詞彙：繪聲繪影
    quote: 課文句子：再加上網路盛行，有人把預言說得繪聲繪影；點閱率一飆升，內容就傳得更快，相信的人也可能跟著增加。
    answer_carrier: 紅色 ☑（圖形，文字流無此資訊）；拆詞釋義的手寫答案在文字流內
    items:
    - type: free_text
      prompt: '1.先用「拆詞釋義」，猜大概意思

        「繪聲」：【　】

        「繪影」：【　】　　兩個部分合起來：【　】'
      blanks:
      - answer: 描繪聲音
      - answer: 描繪景象
      - answer: 描繪聲音和景象
    - type: single
      prompt: 2.這個意思能完整說明「把預言說得繪聲繪影」嗎？
      options:
        1: 能
        2: 還不能，需要再看上下文
      answer: 2
    - type: guide
      text: 3.再用「從上下文推測詞義」，補充意思：把能幫助你推測詞義的文字畫線。
    - type: single
      prompt: 4.結合拆詞和上下文線索可以推測「繪聲繪影」的意思是：
      options:
        1: 把事情說得生動逼真，讓人覺得像真的一樣
        2: 把事情說得詳細，讓人容易了解
      answer: 1
    - type: single
      prompt: 5.把推測的意思放回上面的句子：意思合理嗎？
      options:
        1: 合理
        2: 不合理
      answer: 1
  - type: guide
    text: ※小提醒：遇到難詞時，如果這些方法都不適用，不要硬猜，可以查字典或請教同學、老師。
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.遇到難詞時，我會先判斷哪一種線索比較有用。
    - 2.我會用「拆詞釋義」或「從上下文推測詞義」來推測意思。
    - 3.如果一種方法還不夠，我會再用另一種方法，並把推測的意思放回句子檢查。
