lesson_uid: L0048
version_id: v3
section_no: 六
keypoints:
  title: 災難預言準不準
  title_note: 表格第一列右欄印「災難預言準不準」（不含問號，課名有問號），左欄空白，是標題列。
  layout: list
  answer_carrier: 橘色手寫字；文字流的【　】內已填有答案
  rows:
  - label: 預言例子
    items:
    - label: 1
      value: '日本漫畫中的夢境

        (1)漫畫內的夢境災難場景和後來2011年東日本大地震高度雷同。

        (2)2025年7月5日會發生大地震和海嘯，引發許多人不安。'
    - label: 2
      value: '諾查丹瑪斯

        有人根據他的詩句，預測1999年會出現世界末日。'
    - label: 3
      value: '瑪雅文明

        有人把瑪雅曆法解讀為2012年12月21日世界末日。'
    tail: 上述三項災難預言，最後都【　】。
    tail_blank:
      answer: 未發生/未成真
    tail_note: 'PDF 上這一行前面有一個「→」箭頭，文字流沒有（是繪製符號），故不寫進字串。

      答案印成「未發生/未成真」，是兩個並列的可接受答案，照原樣記錄不拆。'
  - label: 人們為何容易相信預言？
    value: 一、預言與網路的特性
    items:
    - label: 1
      value: 預言通常【　】，模糊的說法可以套用到多種情況。
      blanks:
      - answer: 含糊其辭
    - label: 2
      value: 災難預言像恐怖片，讓人害怕，卻又忍不住想聽、想看。
    - label: 3
      value: 【　】讓內容快速傳播，相信的人也可能跟著增加。
      blanks:
      - answer: 網路
  - label: 人們為何容易相信預言？
    value: 二、心理學解釋
    label_note: '這一列與上一列在原稿是**同一個直排合併儲存格**（vMerge restart / continue），

      左欄「人們為何容易相信預言？」只印一次，右欄則分成「一、」「二、」兩塊。

      因為 skill ⑥.55b 規定佈局 A 只到 rows→items 兩層，三層要攤平，

      故此處拆成兩列、共用同一個 label，分組標題放進 value。不是重複抄。'
    items:
    - label: 1
      value: 【　】：只注意那些看似應驗的預言，忽略沒有應驗的預測。
      blanks:
      - answer: 倖存者偏誤
    - label: 2
      value: 【　】：特別尋找符合自己信念的證據。
      blanks:
      - answer: 確認偏誤
    - label: 3
      value: 對於不確定的未來，人們感到不安，災難預言能讓人暫時感到【　】
      blanks:
      - answer: 安心
  - label: 結論
    items:
    - label: 1
      value: 大多數預言缺乏【　】，人們無須過度恐慌。
      blanks:
      - answer: 科學證據
    - label: 2
      value: 面對災難，平時應具備【　】與防災能力，並留意專業機構發布的資訊。
      blanks:
      - answer: 風險意識
