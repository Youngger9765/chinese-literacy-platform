_總表_對照note: "本課四份語詞清單**互不相同**，全部照原樣分別記錄，不合併也不補齊：\n・總表（10）：雷同、預言、點閱率、應驗、風險意識、倖存者、偏誤、熱議、恐慌、繪聲繪影\n・本課語詞框／第三大題（7）：雷同、預言、應驗、倖存者、風險意識、偏誤、**含糊其辭**\n・第五大題代號表（10）：總表那 10 個，但把「繪聲繪影」留著、另加「**屏息以待**」，\n  實際是 A雷同 B屏息以待\
  \ C偏誤 D繪聲繪影 E恐慌 F熱議 G點閱率 H應驗 I風險意識 J預言\n・第八大題找字框（12）：第五大題那 10 個 ＋ 倖存者 ＋ **玄妙**\n只有「含糊其辭」「屏息以待」「玄妙」三個不在總表；「玄妙」只出現在課文第 3 段與找字框。\n三者在課文裡都找得到，不是憑空多出來的。"
