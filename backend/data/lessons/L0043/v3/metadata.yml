  總表_對照: '🔴 **總表這一列的語詞整組是錯的 —— 它填的是上一課（G5-L3／L0042）的語詞。**

    總表 課次4 填「沉著／雕琢／防禦／監測／傾訴／質疑／橫逆／獨當一面／扳回一城／如魚得水／心力交瘁」，

    但本課學習單的語詞框、第三大題 11 題、第四大題選項、第八大題找字框，四處一致都是

    「食指浩繁／貼補／嗷嗷待哺／目不識丁／按件計酬／俐落／彌漫／餘悸猶存／積勞成疾／庇蔭／著落」，

    而且「食指浩繁」「嗷嗷待哺」「目不識丁」就在本課課文第 1 段。

    反向也對得上：總表 課次3 填的那組（貼補／俐落／彌漫…）才是本課這組。**兩課的語詞欄互換了。**

    兩課的原稿我都開過查證。差異全在總表側，兩課的學習單各自前後一致。'
  總表_議題對照: 總表議題欄填「運動+堅持」，但本課是童工翻身、教育翻轉人生，與運動無關 —— 疑與相鄰課次一併填錯，僅記錄。
strategy_explained: '這一課我們要練習「看懂一個人的言行，知道他為什麼會這樣做，而且會變成什麼樣子」

  因為小花在很辛苦的環境裡，還是努力讀書，這告訴我們她很堅強，而且很想要用讀書改變人生，就像你們在文章裡看到她做的那些事一樣

  讀的時候，你可以仔細想想小花做了哪些事情，說了哪些話，這些行為和話語透露出她是一個什麼樣的人，又是怎麼讓她一步步走到最後的'
