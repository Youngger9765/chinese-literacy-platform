lesson_uid: L0043
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 他家境貧窮，許多衣服都「嗷嗷待哺」
      B: 小青是大學教授，學問淵博、「目不識丁」（前後邏輯錯誤）
      C: 長期過度勞累使他「積勞成疾」，只好在家休養
      D: 他「身手俐落」，一天摔破了好幾個碗盤（前後邏輯錯誤）
    teacher_note: A.誤用，嗷嗷待哺 指人或動物
    options_note: B、D 兩個選項的「（前後邏輯錯誤）」是印在選項文字裡的教師註記，不是選項內容的一部分
  - index: 2
    answer: A
    stem: 文中第一段提到：「遠足時，她眼睜睜的看著同學啃著紅艷的大蘋果，只能撇開目光，嚥下自己的口水。」請問小花撇開目光的原因為何？
    options:
      A: 想要卻得不到，只能假裝沒看到，以免自己難受
      B: 她不喜歡同學吃的那種大蘋果，看了就不舒服
      C: 她更看重遠足時的學習，而不是吃喝玩樂
      D: 她想把遠足時間留給觀察風景，不想注意食物
    stem_quote_note: 題幹引「紅**艷**的大蘋果」，課文是「紅**豔**的大蘋果」（異體字）；照原樣記錄
  - index: 3
    answer: B
    stem: 第一段寫道，小花把糖果留到睡前，含在嘴裡再慢慢睡去，她「以為這樣才可以吃一整夜……這天真的代價可真不小啊。」請問這「天真的代價」指的可能是什麼？
    options:
      A: 含著糖睡覺，讓她整夜都睡不好
      B: 含著糖睡覺，使牙齒容易受到傷害
      C: 糖果在睡夢中不小心從嘴裡掉出來
      D: 睡前吃糖，使她隔天早上沒有食慾
    stem_quote_note: 題幹引「以為這樣**才**可以吃一整夜」，課文是「以為，這樣**就**可以吃一整夜」；照原樣記錄
  - index: 4
    answer: D
    stem: 文章最後比較小花與姊姊們的人生，最想強調哪一項差異？
    options:
      A: 姊姊們沒有像小花一樣努力
      B: 小花比姊姊好運才能夠成功
      C: 姊姊們的頭腦不如小花聰明
      D: 小花持續接受教育，獲得改變人生的機會
    teacher_note: （小花跟姊姊都努力，但差異在是否持續接受教育與學習。）
  - index: 5
    answer: C
    stem: 請問底下哪一個選項不是本文想表達的重點？
    options:
      A: 提供一個在逆境中成長的案例
      B: 說明除了努力之外，也要感恩幫助自己的人
      C: 只要肯長時間工作，就一定能改變命運（作者未提到這點）
      D: 強調教育是翻轉人生的關鍵力量
    options_note: C 選項的「（作者未提到這點）」是印在選項文字裡的教師註記
  slug: hkakq
  text_ref: nraty
