lesson_uid: L0043
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論人物特質
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '前面，我們學會從人物說的話、做的事的言行推論人物特質。這一課要再往前一步：把推論出的特質放回故事裡，看看這項特質如何影響人物的重要選擇，又如何影響後來的發展。

      小花和姊姊們都很努力，為什麼最後走向不同的人生？我們用四個步驟來讀懂：

      ❶找關鍵選擇    ❷串事件、推特質

      ❸比較不同處境  ❹統整全文關係'
  - type: fill_table
    label: 一、找出改變人生方向的關鍵選擇
    instruction: 一、找出改變人生方向的關鍵選擇
    sub_instruction: 高中畢業時，小花大學聯考落榜。請根據課文，判斷她當時面臨的兩條路，以及這個選擇帶來的影響。
    columns:
    - 想一想
    - 請勾選正確答案
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    rows:
    - 想一想: 1.媽媽希望小花
      請勾選正確答案_options:
        1: 再補習一年
        2: 找工作幫忙賺錢
      請勾選正確答案_answer: 2
    - 想一想: 2.小花為自己爭取
      請勾選正確答案_options:
        1: 和姊姊一樣直接工作
        2: 再考一次，靠教育翻身
      請勾選正確答案_answer: 2
    - 想一想: 3.這個選擇為什麼重要
      請勾選正確答案_options:
        1: 讓她從直接工作，轉向繼續升學
        2: 讓她從鄉下生活轉向臺中生活
      請勾選正確答案_answer: 1
  - type: guide
    text: ➡小花選擇了升學這條路，但她還要解決補習費和生活費等新困難。
  - type: fill_table
    label: 二之1、看小花怎麼把升學這條路走下去
    instruction: 二、串連不同事件，推論人物特質
    sub_instruction: '1.看小花怎麼把升學這條路走下去

      前面已經找出小花的關鍵選擇。接著，請沿著後來的故事發展，勾選她的做法。'
    columns:
    - 人生階段
    - 遇到的困難
    - 小花怎麼做
    - 事情怎麼往前
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    rows:
    - 人生階段: ①大學聯考落榜
      遇到的困難: 媽媽希望她去工作
      小花怎麼做: 爭取再考一次
      事情怎麼往前: 得到重考的機會
      note: 本列的「小花怎麼做」是題目印好的，不是選擇題
    - 人生階段: ②準備重考
      遇到的困難: 補習費和生活費沒有著落
      小花怎麼做_options:
        1: 留在家裡，等待家人籌錢
        2: 到補習班打工，想方法招收學生籌錢
      小花怎麼做_answer: 2
      事情怎麼往前: 賺到補習費；妹妹支援生活費
    - 人生階段: ③考上大學後
      遇到的困難: 還要負擔生活，並完成學業
      小花怎麼做_options:
        1: 繼續打工、接家教
        2: 暫停學業，先全心工作
      小花怎麼做_answer: 1
      事情怎麼往前: 完成大學，繼續念碩士和博士
  - type: fill_table
    label: 二之2、找出這些行動的共同點
    instruction: 2.找出這些行動的共同點
    columns:
    - 想一想
    - 請勾選最適合的答案
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    rows:
    - 想一想: 小花遇到困難時，一貫的做法是什麼？
      請勾選最適合的答案_options:
        1: 等待家人安排，再照別人的決定行動
        2: 主動爭取機會，並想方法繼續前進
      請勾選最適合的答案_answer: 2
    - 想一想: 這些做法最能表現她的哪一項特質？
      請勾選最適合的答案_options:
        1: 勤奮努力：願意花很多時間完成事情
        2: 懂得感恩：記得並感謝別人的幫助
        3: 積極進取：主動爭取並找方法前進
      請勾選最適合的答案_answer: 3
    - 想一想: 這項特質如何影響她的人生發展？
      請勾選最適合的答案_options:
        1: 讓她遇到困難仍能找方法，把升學之路繼續走下去
        2: 讓她把賺錢放在升學之前，逐步轉向全職工作
      請勾選最適合的答案_answer: 1
  - type: guide
    text: ➡小花積極進取，會主動爭取、想辦法，因此能把升學這條路繼續走下去。但是，人物特質是她改變人生的唯一原因嗎？
  - type: fill_table
    label: 三、比較小花與姊姊
    instruction: 三、比較小花與姊姊：為什麼人生進路不同？
    sub_instruction: '小花和姊姊們都很努力，後來卻走向不同的人生。

      1.請把課文線索合起來，完成判斷。'
    columns:
    - 比較重點
    - 大姊、二姊
    - 小花
    answer_carrier: 紅色手寫字（圖形），文字流的【　】內已填有答案
    rows:
    - 比較重點: 努力表現
      大姊、二姊: 國小畢業後便工作，長期為家庭付出
      小花: 從小打工，重考及上大學後仍繼續工作
    - 比較重點: 教育機會
      大姊、二姊: 二姊成績優秀，卻因家境困難而【　】
      大姊、二姊_blanks:
      - answer: 放棄升學
      小花: 爭取重考，並得到妹妹支援，【　】
      小花_blanks:
      - answer: 持續接受教育
    - 比較重點: 後來發展
      大姊、二姊: 大姊在工地工作，二姊逐戶【　】
      大姊、二姊_blanks:
      - answer: 為人打掃
      小花: 成為助教，繼續念碩士、博士，最後成為【　】
      小花_blanks:
      - answer: 教授
  - type: single
    label: 三之2
    prompt: 2.從表格可以看出，小花和姊姊們最重要的差別是什麼？（單選）
    options:
      1: 小花工作比較勤奮，姊姊們工作不夠認真。
      2: 她們都很努力，但持續接受教育的機會不同。
      3: 小花比較喜歡讀書，姊姊們比較喜歡工作。
    answer: 2
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: matching
    label: 四之1、不同因素各有什麼作用
    instruction: 四、把全文關係接起來
    sub_instruction: 1.不同因素，各有什麼作用？連連看。
    left_header: 想一想
    right_header: 作用
    left:
      1: 人物特質-「積極進取」
      2: 家人的犧牲與支援
      3: 持續接受教育
    right:
      A: 讓她更有條件繼續升學
      B: 讓她主動爭取、想辦法並把握機會
      C: 改變她後來可以選擇的工作與人生進路
    answer:
      1: B
      2: A
      3: C
    answers_printed: true
    answer_carrier: 橘色手繪連線（圖形），文字流無此資訊；1↔B 與 2↔A 兩條線在圖上交叉
  - type: single
    label: 四之2
    prompt: 2.哪一項最能完整說明小花的人生進路為什麼改變？
    options:
      1: 小花具有積極進取的特質，所以不受家庭與機會影響。
      2: 小花積極爭取並把握機會，也在家人支援下持續接受教育。
    answer: 2
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: guide
    text: ➡你發現了嗎？人物特質會影響人物怎麼選、怎麼做；但一個人的發展，也會受到家人、環境和機會的影響。
