    value: '1.小花小時候家裡很窮困

      (1)父親早逝，母親沒有【　】，到處打零工。

      (2)家裡沒有課外讀物，吃得不好。

      (3)大姊、二姊【　】學業，國小畢業就到工廠工作。

      (4)孩子們放學後、寒暑假都要到工廠【　】貼補家用。'
