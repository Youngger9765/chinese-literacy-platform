passage: 小花在鄉下長大，三歲時，爸爸就過世了，家中食指浩繁，她是六個嗷嗷待哺的孩子中的第五個，底下還有一個雙胞胎妹妹。媽媽目不識丁，又沒有一技之長，只能到處打零工。課外讀物、雞鴨魚肉、零食對小花家來說都是奢侈品。小花入小學後，發現同學家裡有兒童繪本、小說、漫畫，再看看自己的家，除了教科書，能看到的文字只有日曆和黃曆了。學校遠足時，她眼睜睜的看著同學啃著紅豔的大蘋果，只能撇開目光，嚥下自己的口水。偶爾鄰居給了一顆糖，小花捨不得吃，總要留到睡前，含在嘴裡再慢慢睡去。天真的她以為，這樣就可以吃一整夜。長大後，小花成為牙醫的常客，才知道這天真的代價真不小啊。小花家到學校要走半小時，那時學校沒有營養午餐，學生要自己帶便當或回家吃午餐，因為家裡窮，便當菜色太差，小花便選擇回家吃午餐。可是，吃完午餐，再走半小時的路回學校，肚子就又餓了。
