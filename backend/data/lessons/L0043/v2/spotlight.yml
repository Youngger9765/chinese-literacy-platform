spotlight:
  lesson: G5-L4
  strategy_name: 推論人物特質-從特質理解選擇與發展
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: '前面，我們學會從人物說的話、做的事的言行推論人物特質。這一課要再往前一步：把推論出的特質放回故事裡，看看這項特質如何影響人物的重要選擇，又如何影響後來的發展。

      小花和姊姊們都很努力，為什麼最後走向不同的人生？我們用四個步驟來讀懂：

      ❶找關鍵選擇    ❷串事件、推特質

      ❸比較不同處境  ❹統整全文關係'
  - type: guide
    text: 一、找出改變人生方向的關鍵選擇
  - type: guide
    text: 高中畢業時，小花大學聯考落榜。請根據課文，判斷她當時面臨的兩條路，以及這個選擇帶來的影響。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ➡小花選擇了升學這條路，但她還要解決補習費和生活費等新困難。
  - type: guide
    text: 二、串連不同事件，推論人物特質
  - type: free_text
    prompt: 1.看小花怎麼把升學這條路走下去
  - type: guide
    text: 前面已經找出小花的關鍵選擇。接著，請沿著後來的故事發展，勾選她的做法。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.找出這些行動的共同點
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: ➡小花積極進取，會主動爭取、想辦法，因此能把升學這條路繼續走下去。但是，人物特質是她改變人生的唯一原因嗎？
  - type: guide
    text: 三、比較小花與姊姊：為什麼人生進路不同？
  - type: guide
    text: 小花和姊姊們都很努力，後來卻走向不同的人生。
  - type: free_text
    prompt: 1.請把課文線索合起來，完成判斷。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 2.從表格可以看出，小花和姊姊們最重要的差別是什麼？（單選）
    options:
    - 小花工作比較勤奮，姊姊們工作不夠認真。
    - 她們都很努力，但持續接受教育的機會不同。
    - 小花比較喜歡讀書，姊姊們比較喜歡工作。
    answer: 她們都很努力，但持續接受教育的機會不同。
  - type: guide
    text: 四、把全文關係接起來
  - type: free_text
    prompt: 1.不同因素，各有什麼作用？連連看。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 2.哪一項最能完整說明小花的人生進路為什麼改變？
    options:
    - 小花具有積極進取的特質，所以不受家庭與機會影響。
    - 小花積極爭取並把握機會，也在家人支援下持續接受教育。
    answer: 小花積極爭取並把握機會，也在家人支援下持續接受教育。
  - type: guide
    text: ➡你發現了嗎？人物特質會影響人物怎麼選、怎麼做；但一個人的發展，也會受到家人、環境和機會的影響。
