spotlight:
  lesson: G5-L4
  strategy_name: 推論人物特質-從特質理解選擇與發展
  strategy_type: trait_inference
  blocks:
  - type: guide
    text: '前面，我們學會從人物說的話、做的事的言行推論人物特質。這一課要再往前一步：把推論出的特質放回故事裡，看看這項特質如何影響人物的重要選擇，又如何影響後來的發展。

      小花和姊姊們都很努力，為什麼最後走向不同的人生？我們用四個步驟來讀懂：

      ❶找關鍵選擇    ❷串事件、推特質

      ❸比較不同處境  ❹統整全文關係'
  - type: guide
    text: 一、找出改變人生方向的關鍵選擇
  - type: guide
    text: 高中畢業時，小花大學聯考落榜。請根據課文，判斷她當時面臨的兩條路，以及這個選擇帶來的影響。
  - type: table
    rows:
    - - 想一想
      - 請勾選正確答案
    - - 1.媽媽希望小花
      - '□①再補習一年

        ②找工作幫忙賺錢'
    - - 2.小花為自己爭取
      - '□①和姊姊一樣直接工作

        ②再考一次，靠教育翻身'
    - - 3.這個選擇為什麼重要
      - '①讓她從直接工作，轉向繼續升學

        □②讓她從鄉下生活轉向臺中生活'
  - type: guide
    text: ➡小花選擇了升學這條路，但她還要解決補習費和生活費等新困難。
  - type: guide
    text: 二、串連不同事件，推論人物特質
  - type: free_text
    prompt: 1.看小花怎麼把升學這條路走下去
  - type: guide
    text: 前面已經找出小花的關鍵選擇。接著，請沿著後來的故事發展，勾選她的做法。
  - type: table
    rows:
    - - 人生階段
      - 遇到的困難
      - 小花怎麼做
      - 事情怎麼往前
    - - ①大學聯考落榜
      - 媽媽希望她去工作
      - 爭取再考一次
      - 得到重考的機會
    - - ②準備重考
      - 補習費和生活費沒有著落
      - '□①留在家裡，等待家人籌錢

        ②到補習班打工，想方法招收學生籌錢'
      - '賺到補習費；

        妹妹支援生活費'
    - - ③考上大學後
      - 還要負擔生活，並完成學業
      - '①繼續打工、接家教

        □②暫停學業，先全心工作'
      - 完成大學，繼續念碩士和博士
  - type: free_text
    prompt: 2.找出這些行動的共同點
  - type: table
    rows:
    - - 想一想
      - 請勾選最適合的答案
    - - 小花遇到困難時，一貫的做法是什麼？
      - '□①等待家人安排，再照別人的決定行動

        ②主動爭取機會，並想方法繼續前進'
    - - 這些做法最能表現她的哪一項特質？
      - '□①勤奮努力：願意花很多時間完成事情

        □②懂得感恩：記得並感謝別人的幫助

        ③積極進取：主動爭取並找方法前進'
    - - 這項特質如何影響她的人生發展？
      - '①讓她遇到困難仍能找方法，把升學之路繼續走下去

        □②讓她把賺錢放在升學之前，逐步轉向全職工作'
  - type: guide
    text: ➡小花積極進取，會主動爭取、想辦法，因此能把升學這條路繼續走下去。但是，人物特質是她改變人生的唯一原因嗎？
  - type: guide
    text: 三、比較小花與姊姊：為什麼人生進路不同？
  - type: guide
    text: 小花和姊姊們都很努力，後來卻走向不同的人生。
  - type: free_text
    prompt: 1.請把課文線索合起來，完成判斷。
  - type: table
    rows:
    - - 比較重點
      - 大姊、二姊
      - 小花
    - - 努力表現
      - 國小畢業後便工作，長期為家庭付出
      - 從小打工，重考及上大學後仍繼續工作
    - - 教育機會
      - 二姊成績優秀，卻因家境困難而【】
      - 爭取重考，並得到妹妹支援，【】
    - - 後來發展
      - 大姊在工地工作，二姊逐戶【】
      - 成為助教，繼續念碩士、博士，最後成為【】
    answers:
    - 放棄升學
    - 持續接受教育
    - 為人打掃
    - 教授
  - type: single
    prompt: 2.從表格可以看出，小花和姊姊們最重要的差別是什麼？（單選）
    options:
    - 小花工作比較勤奮，姊姊們工作不夠認真。
    - 她們都很努力，但持續接受教育的機會不同。
    - 小花比較喜歡讀書，姊姊們比較喜歡工作。
    answer: 她們都很努力，但持續接受教育的機會不同。
  - type: guide
    text: 四、把全文關係接起來
  - type: free_text
    prompt: 1.不同因素，各有什麼作用？連連看。
  - type: table
    rows:
    - - 想一想
      - ''
      - 作用
    - - 1.人物特質-「積極進取」
      - ●
      - ●
      - A.讓她更有條件繼續升學
    - - 2.家人的犧牲與支援
      - ●
      - ●
      - B.讓她主動爭取、想辦法並把握機會
    - - 3.持續接受教育
      - ●
      - ●
      - C.改變她後來可以選擇的工作與人生進路
  - type: single
    prompt: 2.哪一項最能完整說明小花的人生進路為什麼改變？
    options:
    - 小花具有積極進取的特質，所以不受家庭與機會影響。
    - 小花積極爭取並把握機會，也在家人支援下持續接受教育。
    answer: 小花積極爭取並把握機會，也在家人支援下持續接受教育。
  - type: guide
    text: ➡你發現了嗎？人物特質會影響人物怎麼選、怎麼做；但一個人的發展，也會受到家人、環境和機會的影響。
