  blocks:
  - type: concept_box
    text: '每個人的信仰、飲食習慣、節慶和生活方式都可能不同。遇到自己不熟悉的做法時，我們可能會覺得奇怪，但不要急著說「不對」或「太迷信」。先了解對方為什麼這樣做，以及這件事對他有什麼意義，才能做出尊重又合適的回應。

      課文中的陳醫師沒有先否定家屬請乩童、使用符水和香灰的做法，而是看見他們想為病人盡一份心力。在不影響醫療與安全的情況下，他尊重家屬的信仰，也主動向乩童說明病情。接下來，讓我們看看陳醫師是怎麼理解家屬，又怎麼做出尊重的回應。'
  - type: guide
    text: 一、看看陳醫師怎麼做
  - type: fill_table
    prompt: 1.請根據課文，勾選合適的答案。
    columns:
    - 事件
    - 有些醫師可能出現的反應
    - 陳醫師了解後的尊重做法
    rows:
    - 事件: 1.家屬想請乩童來看病人
      有些醫師可能出現的反應: '覺得這很

        （☑①迷信　□②合理），

        和醫療無關，因此直接拒絕。'
      有些醫師可能出現的反應_options:
        1: 迷信
        2: 合理
      有些醫師可能出現的反應_answer: 1
      陳醫師了解後的尊重做法: '理解家屬想

        （☑①盡一份心力

        □②挑戰醫師）

        ，並確認不影響醫療與安全。'
      陳醫師了解後的尊重做法_options:
        1: 盡一份心力
        2: 挑戰醫師
      陳醫師了解後的尊重做法_answer: 1
    - 事件: 2.家屬想讓病人使用廟裡求來的符水、香灰
      有些醫師可能出現的反應: 覺得這些東西不乾淨，可能影響治療。
      陳醫師了解後的尊重做法: '理解這些物品代表家屬的

        （☑①祝福　□②不信任）。'
      陳醫師了解後的尊重做法_options:
        1: 祝福
        2: 不信任
      陳醫師了解後的尊重做法_answer: 1
    - 事件: 3.乩童在病房為病人作法
      有些醫師可能出現的反應: '覺得醫院

        （☑①不應　□②可以）

        出現乩童。'
      有些醫師可能出現的反應_options:
        1: 不應
        2: 可以
      有些醫師可能出現的反應_answer: 1
      陳醫師了解後的尊重做法: 主動向乩童說明病情，尊重並感謝她對家屬的協助。
  - type: multi
    prompt: 2.陳醫師這麼做，可能帶來哪些好處？（請打勾，複選）
    options:
      1: 讓家屬感受到醫療團隊願意理解自己。
      2: 讓家屬以為醫師認為所有民俗作法都能治病。
      3: 讓家屬更願意和醫療團隊溝通、聽取建議。
      4: 讓家屬有機會表達對病人的關心與不捨。
    answers:
    - 1
    - 3
    - 4
  - type: guide
    text: 二、生活中也會遇到文化差異
  - type: guide
    text: 1.不同的宗教信仰
  - type: passage
    paragraphs:
    - 班上舉行祭拜活動，一位同學因為宗教信仰不同，不參加祭拜。
  - type: single
    prompt: ❶先了解什麼？（單選）
    options:
      1: 他不參加，是因為不尊重班級。
      2: 不同信仰可能有不同的習俗與規定。
    answer: 2
  - type: single
    prompt: ❷怎麼做比較合適？（單選）
    options:
      1: 尊重他的選擇，讓他用其他方式表達對班級的關心。
      2: 要求他和大家做完全一樣的事。
    answer: 1
  - type: guide
    text: 2.不同的飲食文化
  - type: passage
    paragraphs:
    - 新住民同學帶來有家鄉香料味的便當，有人說：「味道好奇怪！」
  - type: single
    prompt: ❶先了解什麼？（單選）
    options:
      1: 他故意帶奇怪的食物來引起注意。
      2: 不同家庭與文化可能有不同的飲食習慣。
    answer: 2
  - type: single
    prompt: ❷怎麼做比較合適？（單選）
    options:
      1: 叫他以後不要再帶家裡準備的食物。
      2: 不嘲笑別人的食物，也可以友善地了解食物的特色。
    answer: 2
  - type: guide
    text: 3.不同族群的重要祭典
  - type: passage
    paragraphs:
    - 一位原住民族同學要參加部落的重要祭典，因此依規定請假。
  - type: single
    prompt: ❶先了解什麼？（單選）
    options:
      1: 祭典對族群的文化傳承可能具有重要意義。
      2: 他只是想找理由不來學校上課。
    answer: 1
  - type: single
    prompt: ❷怎麼做比較合適？（單選）
    options:
      1: 尊重同學參與祭典，也依照學校規定辦理請假。
      2: 所有人都應過完全一樣的節日，這樣才公平。
    answer: 1
  - type: self_check
    label: ◎把理解與尊重帶著走
    instruction: 遇到和自己不同的信仰、習慣或生活方式時，我會提醒自己：
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三格皆為空 □（無 w:sym F0FE）
    items:
    - 1.不急著用自己的標準批評或嘲笑，而是先了解對方的文化、心意或需要。
    - 2.尊重不等於全部同意，還要顧及安全、權利與規定。
    - 3.用不排斥、不傷害別人的方式，找出彼此都能接受的做法。
