  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），PDF p6~p8 可見
  structure_note: '⛔ 第一張表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

