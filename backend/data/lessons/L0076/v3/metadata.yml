intro: 這篇文章記錄了一位醫師在面對病危病患時，如何以開放的心態與家屬的信仰互動。當家屬提出想請乩童協助時，醫師並沒有排斥，反而將其視為家屬表達心意、尋求慰藉的方式。文章描述了醫師如何放下對乩童的刻板印象，主動與乩童溝通病情，並將其視為醫療團隊的「夥伴」。透過醫師的視角，我們看到了一種跨越專業界線的理解與合作，以及對家屬情感支持的重視。
