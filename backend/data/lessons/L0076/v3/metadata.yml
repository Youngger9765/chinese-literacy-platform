_總表_對照note: '總表 12 個語詞與學習單 12 個一一對應，唯一差異是總表「語詞12」印成「惡版印象」，

  學習單四處（語詞框／第三大題(10)／第四大題代號 F／第八大題灰框與格子）都寫「刻板印象」。

  課文本身也寫「這完全顛覆了我對乩童的刻板印象！」→ 研判是**總表那格的錯字**，不是抽取錯。

  ⛔ 未自行以學習單覆蓋總表 —— 那要改的是 xlsx，不是這份抽取。'
