strategy_explained: '這一課我們要練習的是，當別人跟你的想法不一樣時，要試著理解他們為什麼會這樣想

  就像故事裡，醫師沒有因為覺得乩童奇怪，就不理會病人家屬的心情

  你可以試著想想，如果換成你，你會怎麼做，或是想想家屬的感受，他們才會覺得有人懂他們'
