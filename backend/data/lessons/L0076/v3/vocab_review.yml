  answer_paths_note: '12 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。

    幾何交叉驗證（單向警報）：找字表格元素內、扣掉紙外殘留後的 roundRect = **12 個**，

    路徑也是 12 條 → 沒有「紙上 > 路徑」的缺條警報。

    ⚠️ **紙外殘留：未驗**。我用的是 `positionH/posOffset` 換算絕對位置的判準，

    而那隻判準只認得「錨點被放到紙外」，對「掛在儲存格裡被排版推出去」**零命中**

    （2026-08-18 更正）。所以本課不宣稱「0 個紙外」。

    不影響結論：警報只在「紙上 > 路徑」時響，而扣掉未偵測的殘留只會讓紙上數變**更少**。

    真正的正確性證據是下面每條 cells 套回 grid 拼字（12/12 全中），不是數量。

    ⚠️ 反向（紙上 < 路徑）不代表缺陷 —— 圈選常用別種圖形畫，roundRect 不是全部。

    主判準仍是下面每一條的 cells 套回 grid 拼字（比內容不比數量）。

    ⚠️ 跨頁：格子第 8~10 列被分到 PDF p10，而「會診」（第 10 列 3~4 欄）的橘框

    整組留在 p9 的格子下方（畫成一個看似空的框）——只看 p10 會判成「會診沒被圈到」。

    「由衷」（9~10 列第 9 欄）的框則落在 p10 上，兩者同一組圖形但分頁位置不同。'
