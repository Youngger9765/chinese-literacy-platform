  passage: 我想她心裡一定很納悶，以往去加護病房作法都是偷偷摸摸的，還要喬裝成家屬，經常遭受到醫療人員異樣、甚至不屑的眼神。怎麼現在這位醫師，竟然還會主動的來和她說明病情，簡直太不可思議了！「那就拜託妳了，謝謝。」什麼？我竟然還拜託她？還跟她說謝謝？有沒有搞錯啊？我當然要謝謝她，對我來說，她也是我們的「夥伴」，就像是前來協助「會診」的醫師一樣。我要向她清楚的交代病情，她才知道要如何「幫忙」，不是嗎？我以前就很常寫「會診單」，讓家屬帶去找神明。我從她的眼神確定，她有聽懂我的話。然後，我退後、站在遠處觀看。接下來，我被眼前的景象嚇呆了！她手腳比劃、口中念念有詞之後，轉頭向媽媽和太太講了幾句話，就突然給媽媽一個深深的擁抱，也給太太一個擁抱！護理師後來轉述說，她向太太說：「我上有老下有小，是放心不下，但是，也不想回來了，回來也是這樣躺著，很辛苦！也會讓你和媽媽辛苦！你要想清楚，我們夫妻同心！」（就是先生對太太的口吻在說話）
  start_text: 我想她心裡一定很納悶，以往去加護病房作法都是偷偷
