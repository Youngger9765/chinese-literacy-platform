    stem: 下列語詞何者使用不正確？
    options:
      A: 他「喬裝」成水電工人，以躲避警方的追緝
      B: 最近天氣多變，時常讓人感到胸口「納悶」
      C: 她扭傷了腳踝，痛到要人「攙扶」著去保健室
      D: 他工作表現十分「稱職」，很受上級的器重
    rationale: null
    marker_notes:
      B: 鬱悶
  - index: 2
    answer: A
    stem: 家屬想請乩童進入病房時，陳醫師的做法最能說明哪一種態度？
    options:
      A: 先理解家屬想盡心的需要，再在不妨礙醫療下尊重配合
      B: 為了安撫家屬，放棄醫療判斷，完全照家屬的意思
      C: 認為所有民俗作法都能治病，因此主動請乩童會診
      D: 避免和家屬發生衝突，所以不再說明病情與治療
    rationale: null
  - index: 3
    answer: C
    stem: 第十三段，護理師後來轉述說，她向太太說：「我上有老下有小，是放心不下，但是，也不想回來了。」請問句中的「我」指的是誰？
    options:
      A: 醫生
      B: 乩童
      C: 病人
      D: 病人的哥哥
    rationale: null
  - index: 4
    answer: D
    stem: 陳醫師在文章裡寫道：「這完全顛覆了我對乩童的刻板印象！」請問下列哪一個選項顛覆了陳醫師對乩童的刻板印象？
    options:
      B: 乩童會代替病人擁抱家屬
      C: 乩童很辛苦，退駕時滿身大汗
      D: 乩童是這個站在床邊的年輕女性
    rationale: 第八段：由上下文推測，陳醫師因為乩童是位年輕女性而吃驚。
  - index: 5
    answer: C
    stem: 下列哪一項最能表達本文想傳達的道理？
    options:
      A: 醫療專業遇到民俗信仰時，應完全退讓
      B: 只要家屬有心，任何作法都不必考慮安全
      C: 面對不同文化，先了解背後的心意，再找安全、尊重的做法
      D: 醫師應把乩童當成真正醫師，讓她參與所有治療決定
    rationale: 陳醫師先理解家屬請乩童、使用符水背後的心意，再透過溝通與說明病情，在不放棄醫療專業的情況下尊重家屬文化
