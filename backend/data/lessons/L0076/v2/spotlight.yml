    prompt: (5)真讓人(  B  )，氣溫35度，居然還有人穿厚夾克在街上走動？
  - type: free_text
    prompt: (6)這個病房的護理長是位男士，翻轉了許多人對護理師的(  Ｆ  )。
  - type: free_text
    prompt: (7)我(  J  )感謝您多年來的照顧。
  - type: free_text
    prompt: (8)他的病情十分嚴重，需要多位醫師一起(  I  )。
  - type: guide
    text: 五文章重點表 五文章重點表
  - type: fill_table
  - type: guide
    text: 六品格聚光燈跨文化理解與接納六品格聚光燈跨文化理解與接納
  - type: guide
    text: 看看陳醫師怎麼做
  - type: free_text
    prompt: 1.請根據課文，勾選合適的答案。
  - type: table
    rows:
    - - 事件
      - 有些醫師可能出現的反應
      - 陳醫師了解後的尊重做法
    - - 1.家屬想請乩童來看病人
      - 覺得這很（□①迷信  □②合理），和醫療無關，因此直接拒絕。
      - 理解家屬想（  □①盡一份心力　□②挑戰醫師     ），並確認不影響醫療與安全。
    - - 2.家屬想讓病人使用廟裡求來的符水、香灰
      - 覺得這些東西不乾淨，可能影響治療。
      - 理解這些物品代表家屬的（□①祝福　□②不信任）。
    - - 3.乩童在病房為病人作法
      - 覺得醫院（□①不應　□②可以）出現乩童。
      - 主動向乩童說明病情，尊重並感謝她對家屬的協助。
  - type: single
    prompt: 2.陳醫師這麼做，可能帶來哪些好處？（請打勾，複選）
    options:
    - 讓家屬感受到醫療團隊願意理解自己。
    - 讓家屬以為醫師認為所有民俗作法都能治病。
    - 讓家屬更願意和醫療團隊溝通、聽取建議。
    - 讓家屬有機會表達對病人的關心與不捨。
    answer: 讓家屬感受到醫療團隊願意理解自己。
  - type: guide
    text: 二、生活中也會遇到文化差異
  - type: free_text
    prompt: 1.不同的宗教信仰
  - type: guide
    text: 班上舉行祭拜活動，一位同學因為宗教信仰不同，不參加祭拜。
  - type: single
    prompt: ❶先了解什麼？（單選）
    options:
    - 他不參加，是因為不尊重班級。
    - 不同信仰可能有不同的習俗與規定。
    answer: 他不參加，是因為不尊重班級。
  - type: single
    prompt: ❷怎麼做比較合適？（單選）
    options:
    - 尊重他的選擇，讓他用其他方式表達對班級的關心。
    - 要求他和大家做完全一樣的事。
    answer: 尊重他的選擇，讓他用其他方式表達對班級的關心。
  - type: free_text
    prompt: 2.不同的飲食文化
  - type: guide
    text: 新住民同學帶來有家鄉香料味的便當，有人說：「味道好奇怪！」
  - type: single
    prompt: ❶先了解什麼？（單選）
    options:
    - 他故意帶奇怪的食物來引起注意。
    - 不同家庭與文化可能有不同的飲食習慣。
    answer: 他故意帶奇怪的食物來引起注意。
  - type: single
    prompt: ❷怎麼做比較合適？（單選）
    options:
    - 叫他以後不要再帶家裡準備的食物。
    - 不嘲笑別人的食物，也可以友善地了解食物的特色。
    answer: 叫他以後不要再帶家裡準備的食物。
  - type: free_text
    prompt: 3.不同族群的重要祭典
  - type: guide
    text: 一位原住民族同學要參加部落的重要祭典，因此依規定請假。
  - type: single
    prompt: ❶先了解什麼？（單選）
    options:
    - 祭典對族群的文化傳承可能具有重要意義。
    - 他只是想找理由不來學校上課。
    answer: 祭典對族群的文化傳承可能具有重要意義。
  - type: single
    prompt: ❷怎麼做比較合適？（單選）
    options:
    - 尊重同學參與祭典，也依照學校規定辦理請假。
    - 所有人都應過完全一樣的節日，這樣才公平。
    answer: 尊重同學參與祭典，也依照學校規定辦理請假。
  - type: guide
    text: ◎把理解與尊重帶著走
  - type: guide
    text: 遇到和自己不同的信仰、習慣或生活方式時，我會提醒自己：
  - type: multi
    prompt: 請選擇
    options:
    - 不急著用自己的標準批評或嘲笑，而是先了解對方的文化、心意或需要。
    - 尊重不等於全部同意，還要顧及安全、權利與規定。
    - 用不排斥、不傷害別人的方式，找出彼此都能接受的做法。
    answer:
    - 不急著用自己的標準批評或嘲笑，而是先了解對方的文化、心意或需要。
    - 尊重不等於全部同意，還要顧及安全、權利與規定。
    - 用不排斥、不傷害別人的方式，找出彼此都能接受的做法。
  - type: guide
    text: 七閱讀理解七閱讀理解請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
