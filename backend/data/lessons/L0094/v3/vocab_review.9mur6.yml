  notes:
    instruction: '原稿有**兩個重疊的文字方塊**，一個寫「…把灰框內的語詞劃掉。」、一個寫「…把灰框內的語詞刪除。」

      （各兩份）。PDF p8 上兩句疊印在一起。本檔採前者，另一句在此記錄。'
    target_words: 灰框原文分兩行：「津津樂道、家境殷實、家道中落、嘆為觀止、體面／力圖、拍案叫絕、趨勢、傳遞、相仿、結實纍纍」（11 個，與語詞框相同）。
    grid: '🔵 **格子跨頁**：第 1 列印在 p8 最下方、第 2~10 列印在 p9 最上方。

      橘圈整組留在 p9（p8 完全看不到圈），碰到第 1 列的兩條（相仿、拍案叫絕）

      在 p9 頁首被裁掉上緣，只看得到斜線的下半截。'
    answer_paths: '11 個目標語詞全部圈到（11/11），逐格取字都能拼回目標語詞，格子沒有錯字。

      「家道中落」與「家境殷實」共用 (4,4) 的「家」，兩條路徑十字交叉 —— 原稿如此，不是重複。


      幾何交叉驗證（單向警報，先縮到找字那一 block）：全檔 15 個 roundRect，

      其中 block 50 有 4 個（第六大題流程圖的圓角方塊），**block 108 有 11 個＝找字格子本身**。

      11 == 11 條路徑 → 11 ＞ 11 不成立，**不觸發**「少抓一條」警報。

      ⛔ 拿全檔 15 去比 11 會得到假警報。

      ⚠️ 紙外過濾在本課同樣不可信：naive 公式把 11 個裡的 5 個算成「紙外」，

      但那 5 個都是帶 rot 的斜框，而 6 條斜線在 p9 上明明都印出來了（與 L0063 同型的誤判）。

      像素佐證（200dpi 重繪、數橘色連通塊）：p8 只有 431 個橘像素（第 1 列兩條圈被頁緣裁掉的殘影），

      p9 有 **10 個連通塊**；連通塊會因相黏而合併，所以 10 ≤ 11 條路徑是正常的，

      **沒有出現超過路徑數的塊**（那才會是警訊）。'
    tail: 格子下方印有一行「你還想挑戰更多謎題嗎？「知識補給站」裡有更多的謎題等你去挑戰哦！」
