strategy_explained: '這一課我們要練習的是，從看到的線索和自己知道的事情，去猜測出沒看到的事，就像福爾摩斯看一頂帽子就想到主人的故事，或是王戎看到沒人吃的李子就猜到味道一樣

  讀的時候，你可以想想看，作者想讓我們從這些故事裡學到什麼

  試著找出文章裡有哪些線索，還有自己知道什麼，一起來動腦推理吧'
