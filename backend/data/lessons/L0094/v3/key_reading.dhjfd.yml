  passage: 福爾摩斯把觀察到的線索和背景知識連結起來，做出了令人拍案叫絕的推理。這裡的推理三要素是：觀察線索：找出和問題有關的線索，例如帽子的高級用料、灰白髮絲、壞掉的鬆緊帶和補丁上的墨水痕跡等。背景知識：了解服飾流行、材質價格，以及這些線索可能代表的情況。進行推論：把觀察到的線索和背景知識連起來，推測較合理的答案。古今中外也有許多像福爾摩斯一樣的人物。西晉時代，有一位名叫王戎的人，他小時候就展現了驚人的觀察與推理能力。王戎七歲時，跟著一群年齡相仿的孩子出去玩。他們發現路邊有一株野生的李子樹，樹上結實纍纍，幾乎要壓斷枝條。王戎的朋友們見了，無不爭先恐後地跑去採李子，只有王戎站在一旁靜靜地看著。有人問他：「欸！你不去採李子嗎？」王戎笑著說：「不去！那棵樹上的李子肯定又苦又澀。」大家一嚐，李子果然又苦又澀，紛紛吐出口中的李子，露出瞇眼皺眉的表情。有人又問：「王戎，你怎麼知道這李子是苦的？」
