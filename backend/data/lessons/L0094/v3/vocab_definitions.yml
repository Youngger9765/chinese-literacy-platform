section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框中找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  vocabulary_bank:
  - 津津樂道
  - 力圖
  - 家境殷實
  - 家道中落
  - 嘆為觀止
  - 拍案叫絕
  - 趨勢
  - 結實纍纍
  - 相仿
  - 傳遞
  - 體面
  items:
  - index: 1
    word: 津津樂道
    definition: 很感興趣地談論。
  - index: 2
    word: 趨勢
    definition: 事情發展的方向。
  - index: 3
    word: 傳遞
    definition: 傳達東西或消息。
  - index: 4
    word: 家道中落
    definition: 本來家裡有錢、有權勢，後來漸漸沒錢、沒權了。
  - index: 5
    word: 力圖
    definition: 盡力想要達成某個目標。
  - index: 6
    word: 家境殷實
    definition: 家裡經濟寬裕，非常有錢。
  - index: 7
    word: 拍案叫絕
    definition: 拍桌子叫好，表示對精彩的事物非常讚嘆。
  - index: 8
    word: 嘆為觀止
    definition: 讚嘆所看到的事物好到了極點。
  - index: 9
    word: 體面
    definition: 外表或言行看起來合宜得體，不會顯得難堪或寒酸。
  - index: 10
    word: 相仿
    definition: 彼此差不多。
  - index: 11
    word: 結實纍纍
    definition: 植物結果很多。
  notes:
    methods: 本課只有兩條方法，沒有多數課的第三條「問同學。」——原稿如此。
    vocabulary_bank: 語詞框原文為「本課語詞：津津樂道、力圖、家境殷實、家道中落、嘆為觀止、拍案叫絕、趨勢、結實纍纍、相仿、傳遞、體面」（11 個，句末無句號）。
