    text: 問題：中村警官判斷伊藤沒有說實話的理由是什麼？
  - type: guide
    text: 【　觀察線索　　　　】：伊藤從冰箱拿冰塊。
  - type: guide
    text: 【　背景知識　　　　】：冰箱的冰塊停電８小時左右就會融化。
  - type: guide
    text: 【　進行推論　　　　】：三天前開始停電，本案發生時，冰塊早該融光了，但伊藤喝酒卻能加冰塊？
  - type: single
    prompt: 請選擇
    options:
    - 伊藤很愛喝酒；
    - 伊藤沒有說實話。
    answer: 伊藤很愛喝酒；
