passage: '觀察線索：找出和問題有關的線索，例如帽子的高級用料、灰白髮絲、壞掉的鬆緊帶和補丁上的墨水痕跡等。

  古今中外也有許多像福爾摩斯一樣的人物。西晉時代，有一位名叫王戎的人，他小時候就展現了驚人的觀察與推理能力。王戎七歲時，跟著一群年齡相仿的孩子出去玩。他們發現路邊有一株野生的李子樹，樹上結實纍纍，幾乎要壓斷枝條。王戎的朋友們見了，無不爭先恐後地跑去採李子，只有王戎站在一旁靜靜地看著。

  大家一嚐，李子果然又苦又澀，紛紛吐出口中的李子，露出瞇眼皺眉的表情。有人又問：「王戎，你怎麼知道這李子是苦的？」

  王戎答道：「你看，這李子樹就長在路邊，結了果卻沒人採，如果是好吃的李子，還輪得到我們來摘嗎？」

  「好厲害！」你也許會非常佩服福爾摩斯與王戎，但這樣的觀察與推理也可以透過練習逐漸提升。平時多留意線索、累積背景知識，再練習把兩者連起來思考，你會開始用不一樣的眼光看這個世界，或許就能看見現象背後的道理或故事喔！'
