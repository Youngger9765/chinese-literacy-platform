source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 福爾摩斯是十九世紀英國作家亞瑟・柯南・道爾筆下的人物，這位名偵探最為人津津樂道的就是他敏銳的觀察力，以及出色的推理能力。在一次辦案中，福爾摩斯翻弄著一頂舊的毛氈帽，裡裡外外看個清楚之後說：「這頂帽子的主人是位中年人，曾經家境殷實，現在雖然家道中落了，但還是力圖保持體面。」旁人嘆為觀止，就問他是怎麼從這頂舊帽推論出主人的經歷與性格的。
- 福爾摩斯說：「帽子的設計是三年前流行的樣式，裡頭用來固定鬆緊帶的小圓環是請專人製作的；襯裡用料高級，還帶有一條精緻的絲綢箍帶，可以推測帽子的主人三年前生活較富裕，才可能買得起這頂昂貴的帽子；一絲黏在帽子內襯的灰白髮絲及散發出的檸檬味髮膏，讓我推測帽主已步入中年；鬆緊帶壞了卻沒有換，帽子的補丁有墨水染黑的痕跡，則讓我推測他家道中落，但不想讓人看出來。」
- 福爾摩斯把觀察到的線索和背景知識連結起來，做出了令人拍案叫絕的推理。這裡的推理三要素是：
- 觀察線索：找出和問題有關的線索，例如帽子的高級用料、灰白髮絲、壞掉的鬆緊帶和補丁上的墨水痕跡等。
- 背景知識：了解服飾流行、材質價格，以及這些線索可能代表的情況。
- 進行推論：把觀察到的線索和背景知識連起來，推測較合理的答案。
- 古今中外也有許多像福爾摩斯一樣的人物。西晉時代，有一位名叫王戎的人，他小時候就展現了驚人的觀察與推理能力。王戎七歲時，跟著一群年齡相仿的孩子出去玩。他們發現路邊有一株野生的李子樹，樹上結實纍纍，幾乎要壓斷枝條。王戎的朋友們見了，無不爭先恐後地跑去採李子，只有王戎站在一旁靜靜地看著。
- 有人問他：「欸！你不去採李子嗎？」
- 王戎笑著說：「不去！那棵樹上的李子肯定又苦又澀。」
- 大家一嚐，李子果然又苦又澀，紛紛吐出口中的李子，露出瞇眼皺眉的表情。有人又問：「王戎，你怎麼知道這李子是苦的？」
- 王戎答道：「你看，這李子樹就長在路邊，結了果卻沒人採，如果是好吃的李子，還輪得到我們來摘嗎？」
- 推理三要素是：細心的觀察、具備背景知識和慣於推論，你能說說看王戎是怎麼辦到的嗎？
- 「好厲害！」你也許會非常佩服福爾摩斯與王戎，但這樣的觀察與推理也可以透過練習逐漸提升。平時多留意線索、累積背景知識，再練習把兩者連起來思考，你會開始用不一樣的眼光看這個世界，或許就能看見現象背後的道理或故事喔！
