  passage: 釀小米酒的過程十分講究。許多部落由女性負責釀酒，她們挑最好的小米，蒸熟後慢慢攤開放涼，讓米的香氣自然散開。等到溫度適中，再與酒麴混在一起，放進陶甕裡靜置，等待發酵。釀酒的過程裡，族人遵守各種禁忌：手要乾淨，心要平靜，不可以罵人，也不能帶著怒氣。因為這甕酒不是一般的飲品，而是要獻給祖靈、或與族人分享的。如果心不淨，酒就不會順；如果語氣不敬，酒也不會香。族人對釀酒的每個步驟都莊嚴以對，展現對天地、祖靈與族人的禮敬。小米酒的意義，在一次次被舉起的場合中展現無遺。排灣族在農作的重要時刻，會以小米酒灑地，向百穀神與祖靈祈求平安與豐收；阿美族青年在通過成年禮的試煉後，會飲下小米酒，象徵正式獲得成年身分，能承擔保護部落的責任；魯凱族新人在婚禮上舉起小米酒，象徵家族的連結，也向祖靈致敬；在卑南族與阿美族的豐年祭裡，小米酒常被用來敬天、敬地，也獻給祖靈，感謝這一年大地的給予；而鄒族的祖靈祭中，小米酒會獻給戰神廟或神木，象徵敬意與感恩。這些儀式的動作與細節或許各有千秋，卻殊途同歸：小米酒是一種連結，連結人與天地，也連結人與族人。
