comprehension:
  questions:
  - index: 1
    answer: C
    stem: 請問下列語詞，何者使用錯誤？
    options:
      A: 她臉上的表情，已將內心的緊張「展現無遺」
      B: 每一次挫折都是人生給我們的「試煉」，讓我們變得更成熟
      C: 兩位選手的表現完全相同，真是「各有千秋」
      D: 老師提醒同學玩笑可以開，但要有「分寸」，不能過頭
    rationale: null
  - index: 2
    answer: C
    stem: 根據第二段，釀造小米酒時，族人共同遵守哪一項要求？
    options:
      B: 由部落中年紀最大的長者主持
      C: 手要乾淨、心要平靜、不得帶著怒氣
      D: 按照祖先留下的配方釀造，才夠純淨
    rationale: 第二段清楚列出「手要乾淨、心要平靜、不可以罵人」等禁忌。其他選項均未在文中提及。
  - index: 3
    answer: B
    stem: 第四段列出小米酒在排灣、阿美、魯凱等族群的使用方式，其共同意義最可能是什麼？
    options:
      B: 小米酒都象徵祝福、敬意與重要的連結
      C: 不同族群的小米酒口味差異很大
      D: 比較各族群之間小米酒釀法的不同
    rationale: 第3題解析：第四段最後一句直接指出：「但它們都指向同一件事：小米酒是一種連結。」推論核心一致性。
  - index: 4
    answer: A
    stem: 第六段提到「這樣的刻板印象會造成傷害」，此處的「傷害」最可能指什麼？
    options:
      A: 忽略小米酒在文化中的地位，使族人感到不被尊重
      B: 原住民大量購買小米酒，降低部落居民的生產力
      C: 會讓一般民眾誤以為小米酒是原住民的唯一文化
      D: 飲酒會造成許多身體的疾病，讓人身體不適
    rationale: null
  - index: 5
    answer: D
    stem: 作者希望讀者如何看待各原住民族群的小米酒？
    options:
      A: 挑選最受歡迎的小米酒款式加以宣傳，讓更多人認識小米酒
      B: 推廣小米酒對原住民的意義，鼓勵大家多飲用小米酒
      C: 小米酒很適合用來當伴手禮，送禮自用兩相宜
      D: 了解小米酒的象徵與脈絡，用尊重的態度看待原住民文化
    rationale: 第4題解析：第六段明確指出，有人把「小米酒＝愛喝酒」畫上等號，忽略其文化意義，甚至傷害以傳統為榮的族人。這種「傷害」指的是文化被誤解、被貶低、被簡化為酒精行為，使族人感到不被尊重。
