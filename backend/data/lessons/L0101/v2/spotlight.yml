spotlight:
  lesson: G7-L4
  strategy_name: 推論策略-找段落重點.推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: '這是一篇說明文，說明文的重要觀點經常會出現在文章開頭或結尾，有時則分散在不同段落中，需要讀者先找出各段重點，再把它們整合起來。本文第一段先指出小米酒象徵祝福與連結，但全文還補充了敬意、分享、接納，以及對刻板印象的提醒。因此，我們要整合各段重點，才能推論出作者完整的觀點。本課第一段，並沒有把重點說完整，所以，這個聚光燈，我們要來學習用四個步驟來整理各段的重點，再推論作者想強調的重點。

      ❶找各段重點：每一段主要說明什麼？

      ❷歸納共同意義：不同段落反覆呈現哪些概念？

      ❸留意文章轉折：作者反對什麼誤解？最後特別提醒什麼？

      ❹整合成作者觀點：用一句話概括全文，並回到各段檢查是否都有根據。'
  - type: guide
    text: 一、找各段重點
  - type: guide
    text: 請先判斷這段主要在說什麼，再找出文中支持這個重點的內容。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 二、統整共同意義
  - type: passage
    source: unknown
    paragraphs:
    - 把前面找到的段落重點放在一起想一想：每一段主要表現出小米酒的哪些文化意義？再看看整篇文章合起來，小米酒有哪些文化意義。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、留意文章轉折（單選）
  - type: passage
    source: unknown
    paragraphs:
    - 說明文經常會有正反兩邊的說法，例如，本課一開始就在講小米酒的正面文化意義，但第六段出現一個轉折詞，作者提出了一個許多人對小米酒的負面刻板印象。這樣負面議題的討論，也經常是文章的重點之一。
  - type: guide
    text: ◎察覺轉折：請找到第六段的文字轉折，回答以下的問題：
  - type: single
    prompt: 1.第六段用了哪一個轉折詞來轉換文章的方向？（單選）
    options:
    - 同樣的　　②然而
    - 雖然
    answer: 同樣的　　②然而
  - type: free_text
    prompt: 2.這個轉折詞前後的內容有什麼變化？（單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①前面介紹不同族群，後面繼續補充更多祭典。
    - ②前面說明小米酒的文化意義，後面指出社會上的刻板印象。
    - □③前面說明小米酒的文化意義，後面介紹小米酒的製作方法。
  - type: free_text
    prompt: 3.有些人把「小米酒」和「愛喝酒」畫上等號。作者為什麼認為這種看法不恰當？（複選）
  - type: passage
    source: unknown
    paragraphs:
    - ①傳統文化中的飲酒有分寸、有節制，也有規矩。
    - ②飲酒失序的人，也會受到部落長輩的責備。
    - □③小米酒只能在祭典中飲用，平時完全不能飲用。
  - type: guide
    text: 四、推論作者觀點（單選）
  - type: passage
    source: unknown
    paragraphs:
    - 前面我們已經找出各段的重點和文化意義，現在把它們合起來想一想：作者真正想表達的是什麼？
  - type: free_text
    prompt: 1.根據前面整理出的段落重點和文化意義，最符合作者觀點的是哪一項？
  - type: passage
    source: unknown
    paragraphs:
    - ①小米酒在原住民族文化中，不只是酒，更承載著祝福、敬意、連結，以及分享與接納的意義；我們不應用「愛喝酒」的刻板印象看待，而應理解並尊重其文化脈絡。
    - □②小米酒因為常出現在重要場合，所以是原住民族生活中受重視的傳統飲品。現在經過設計包裝，可以當做伴手禮，其商業價值已經遠遠超過傳統的意義。
  - type: self_check
    items:
    - 我能找出文章前幾段分別在說明什麼重點。
    - 我能整理各段重點，找出小米酒有哪些文化意義。
    - 我能注意到文章轉折，察覺作者對議題的正反說明。
    - 我能綜合各段重點和文化意義，推論出作者想表達的觀點。
