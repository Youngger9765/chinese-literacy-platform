spotlight:
  lesson: G7-L4
  strategy_name: 推論策略-找段落重點.推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 這是一篇說明文，說明文的重要觀點經常會出現在文章開頭或結尾，有時則分散在不同段落中，需要讀者先找出各段重點，再把它們整合起來。本文第一段先指出小米酒象徵祝福與連結，但全文還補充了敬意、分享、接納，以及對刻板印象的提醒。因此，我們要整合各段重點，才能推論出作者完整的觀點。本課第一段，並沒有把重點說完整，所以，這個聚光燈，我們要來學習用四個步驟來整理各段的重點，再推論作者想強調的重點。❶找各段重點：每一段主要說明什麼？❷歸納共同意義：不同段落反覆呈現哪些概念？❸留意文章轉折：作者反對什麼誤解？最後特別提醒什麼？❹整合成作者觀點：用一句話概括全文，並回到各段檢查是否都有根據。
  - type: guide
    text: 一、找各段重點
  - type: guide
    text: 請先判斷這段主要在說什麼，再找出文中支持這個重點的內容。
  - type: table
    rows:
    - - 段/焦點
      - 這段重點（單選）
      - 支持這個重點的線索（複選）
    - - 段1/小米酒的文化意義
      - □①小米酒在原住民族文化中象徵祝福與連結□②小米酒主要是部落用來招待客人的飲品
      - □①小米酒出現在播種、收穫、婚禮與祭典等重要場合 　□②對族人而言，小米酒是連結祖靈、土地與族人的重要媒介□③小米酒只在祭典或婚禮等隆重場合才會出現
    - - 段2/小米酒的釀造方式
      - □①釀造小米酒的步驟十分繁複，因此更能看出部落女性的技術　□②釀造小米酒的過程十分講究，表現出對祖靈與族人的禮敬
      - □①許多部落由女性負責釀酒□②釀酒時手要乾淨、心要平靜，不能罵人或帶怒氣 　□③族人對釀酒的每個步驟都莊嚴以對
    - - 段4/小米酒在儀式中的意義
      - □①不同族群雖然都使用小米酒，但彼此的意義並不相同□②不同族群在不同儀式使用小米酒，共同表達祝福、敬意與連結
      - □①排灣、阿美、魯凱、卑南、鄒族都在儀式中使用小米酒　□②這些儀式都指向同一件事：小米酒是一種連結□③不同族群儀式的動作與細節彼此完全相同
    - - 段5/小米酒在生活中的意義
      - □①部落日常生活裡，小米酒只是招待客人的一般飲料□②部落日常生活裡，以小米酒招待客人象徵分享珍貴之物與接納對方
      - □①主人願意把珍貴的東西與客人分享□②主人把客人當成朋友，甚至是家人□③客人可以不受限制，想喝多少就喝多少
    - - 段6/對小米酒的刻板印象
      - □①把小米酒和「愛喝酒」畫上等號，是忽略文化地位的刻板印象□②原住民族在日常生活中經常毫無節制地飲酒
      - □①傳統文化中的飲酒有分寸、有節制、有規矩□②飲酒失序會受到部落長輩責備□③小米酒在任何時間都可以隨意飲用
    - - 段7/小米酒真正的價值
      - □①小米酒真正的價值在於背後的文化心意，而不只是商品與酒□②小米酒的價值主要來自瓶子設計與伴手禮包裝
      - □①它承載「敬天、敬地、敬祖靈」的心意□②它在儀典中代表祝福，在分享時代表情誼□③商店中的小米酒比儀式使用的小米酒更有價值
  - type: guide
    text: 二、統整共同意義
  - type: passage
    source: unknown
    paragraphs:
    - 把前面找到的段落重點放在一起想一想：每一段主要表現出小米酒的哪些文化意義？再看看整篇文章合起來，小米酒有哪些文化意義。
  - type: table
    rows:
    - - 段落
      - 文化意義（可複選）
    - - 段1:小米酒的象徵意義
      - □①祝福 □②敬意 □③連結 □④分享與接納
    - - 段2:釀造時的講究與禁忌
      - □①祝福 □②敬意 □③連結 □④分享與接納
    - - 段4:小米酒在儀式中的使用
      - □①祝福 □②敬意 □③連結 □④分享與接納
    - - 段5:在日常生活中的意義
      - □①祝福 □②敬意 □③連結 □④分享與接納
    - - 段1～5合在一起
      - □①祝福 □②敬意 □③連結 □④分享與接納
  - type: guide
    text: 三、留意文章轉折（單選）
  - type: passage
    source: unknown
    paragraphs:
    - 說明文經常會有正反兩邊的說法，例如，本課一開始就在講小米酒的正面文化意義，但第六段出現一個轉折詞，作者提出了一個許多人對小米酒的負面刻板印象。這樣負面議題的討論，也經常是文章的重點之一。
  - type: guide
    text: ◎察覺轉折：請找到第六段的文字轉折，回答以下的問題：
  - type: single
    prompt: 1.第六段用了哪一個轉折詞來轉換文章的方向？（單選）
    options:
    - 同樣的
    - 然而
    - 雖然
    answer: 同樣的
  - type: free_text
    prompt: 2.這個轉折詞前後的內容有什麼變化？（單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①前面介紹不同族群，後面繼續補充更多祭典。
    - □②前面說明小米酒的文化意義，後面指出社會上的刻板印象。
    - □③前面說明小米酒的文化意義，後面介紹小米酒的製作方法。
  - type: free_text
    prompt: 3.有些人把「小米酒」和「愛喝酒」畫上等號。作者為什麼認為這種看法不恰當？（複選）
  - type: passage
    source: unknown
    paragraphs:
    - □①傳統文化中的飲酒有分寸、有節制，也有規矩。
    - □②飲酒失序的人，也會受到部落長輩的責備。
    - □③小米酒只能在祭典中飲用，平時完全不能飲用。
  - type: guide
    text: 四、推論作者觀點（單選）
  - type: passage
    source: unknown
    paragraphs:
    - 前面我們已經找出各段的重點和文化意義，現在把它們合起來想一想：作者真正想表達的是什麼？
  - type: free_text
    prompt: 1.根據前面整理出的段落重點和文化意義，最符合作者觀點的是哪一項？
  - type: passage
    source: unknown
    paragraphs:
    - □①小米酒在原住民族文化中，不只是酒，更承載著祝福、敬意、連結，以及分享與接納的意義；我們不應用「愛喝酒」的刻板印象看待，而應理解並尊重其文化脈絡。
    - □②小米酒因為常出現在重要場合，所以是原住民族生活中受重視的傳統飲品。現在經過設計包裝，可以當做伴手禮，其商業價值已經遠遠超過傳統的意義。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。各有千秋：各自具有不同的優點或特色。表現相同不能用各有千秋來描述各有千秋：各自具有不同的優點或特色。表現相同不能用各有千秋來描述六閱讀理解六閱讀理解
  - type: self_check
    items:
    - 我能找出文章前幾段分別在說明什麼重點。
    - 我能整理各段重點，找出小米酒有哪些文化意義。
    - 我能注意到文章轉折，察覺作者對議題的正反說明。
    - 我能綜合各段重點和文化意義，推論出作者想表達的觀點。
