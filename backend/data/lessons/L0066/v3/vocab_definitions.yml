lesson_uid: L0066
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 不食人間煙火
  - 雲霧飄渺
  - 口耳相傳
  - 精雕細琢
  - 浩瀚無垠
  - 微不足道
  - 滄海一粟
  - 疲憊不堪
  - 塵囂
  - 庶民
  - 凡塵俗世
  synonym_bank:
  - 象徵
  - 意味著
  - 代表
  answer_carrier: 橘色手寫字（PDF p3~p4）；文字層的空格內已填有同樣的答案
  items:
  - index: 1
    word: 雲霧飄渺
    definition: 雲霧飄動、若隱若現，看起來朦朧又遙遠的樣子。
  - index: 2
    word: 不食人間煙火
    definition: 原指神仙不吃人間煮熟的食物；後來形容人遠離世俗生活，彷彿不受現實生活影響。
  - index: 3
    word: 口耳相傳
    definition: 人們用口說、用耳聽，一代一代流傳下來。
  - index: 4
    word: 疲憊不堪
    definition: 形容非常疲累，累得快要撐不住。
  - index: 5
    word: 滄海一粟
    definition: 大海裡的一粒米，比喻在非常廣大的事物中顯得十分渺小。
  - index: 6
    word: 微不足道
    definition: 形容非常渺小或不重要，不值得特別提起。
  - index: 7
    word: 浩瀚無垠
    definition: 廣大到看不到邊，常用來形容天空、海洋或宇宙。
  - index: 8
    word: 凡塵俗世
    definition: 人們日常生活的世界，常用來和神仙世界相比。
  - index: 9
    word: 塵囂
    definition: 人群和日常生活中的喧鬧、忙亂。
  - index: 10
    word: 庶民
    definition: 普通百姓，也就是一般人民。
  - index: 11
    word: 精雕細琢
    definition: 仔細雕刻、反覆修整；也比喻做事或創作非常用心，重視每一個細節。
  synonym_analysis:
    index: 12
    title: 相似詞的比較分析
    columns:
    - 象徵
    - 意味著
    - 代表
    rows:
    - 列: 解釋
      象徵: 用具體的人或事物，表達較抽象的意義。
      意味著: 表示某件事有某種意義，或可能帶來某種結果。
      代表: 代替某個人或團體行動；也可以表示某種意義。
    - 列: 例句(請唸一遍)
      象徵: '1.鴿子象徵和平。

        2.春天象徵新的開始。

        3.這枚戒指象徵他們的愛情。'
      意味著: '1.他這麼說意味著他不同意。

        2.經濟數據的回升意味著景氣正在復甦。'
      代表: '1.這個徽章代表榮譽。

        2.他被選為學生會代表。

        3.他代表學校出賽。'
