  passage: 不只如此，這些古代畫作還有個引人深思的特點──「畫中的人物都非常渺小，周圍的山水風景卻極其宏大」。這和現代人拍照時常把自己放在畫面中心的習慣，形成鮮明的對比。古代畫家如此安排有其深意，主要在表達面對浩瀚無垠的大自然時，人類是微不足道的。畫中的小人物彷彿是畫家在向觀畫者細語：「看啊！這個世界是如此遼闊壯美，人不過是滄海一粟罷了。」
