lesson_uid: L0066
version_id: v3
section_no: 五
spotlight:
  strategy_name: 寫作手法──從具體內容到作者觀點
  strategy_type: writing_craft
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），PDF p5~p6 全部可見
  structure_note: '⛔ 「A、C 兩欄的作用」在原稿是第一張表格最後一列（跨欄），本檔把它攤平成

    guide + 兩個 single + guide 放在 blocks 最上層 ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，塞進巢狀只會整段消失。'
  blocks:
  - type: concept_box
    text: '本文以說明為主，介紹古代仙境畫。文章不只提供相關內容，也一步一步帶出作者的想法。閱讀時，要看懂前面的說明如何形成最後的觀點。

      這一課，我們要練習看懂三個層次如何一步一步接起來：

      具體內容→作者解釋→全文觀點'
  - type: guide
    text: 一、從具體內容讀出作者的解釋
  - type: fill_table
    prompt: 作者從不同方面介紹古代仙境畫。先判斷每一項具體內容屬於哪一方面，再選出作者對這項內容的解釋。
    columns:
    - A.文中的具體內容
    - B. 這項內容屬於哪一方面？
    - C.這項內容表達什麼意義？
    rows:
    - A.文中的具體內容: 古代仙境畫使用山洞、小橋和小船
      B. 這項內容屬於哪一方面？: '①畫中元素

        ②畫面安排'
      B. 這項內容屬於哪一方面？_options:
        1: 畫中元素
        2: 畫面安排
      B. 這項內容屬於哪一方面？_answer: 1
      C.這項內容表達什麼意義？: '①呈現古人遊覽張公洞時經過的景物與路線。

        ②表達從凡塵俗世走向神奇仙境的轉變。'
      C.這項內容表達什麼意義？_options:
        1: 呈現古人遊覽張公洞時經過的景物與路線。
        2: 表達從凡塵俗世走向神奇仙境的轉變。
      C.這項內容表達什麼意義？_answer: 2
    - A.文中的具體內容: 畫家把人物畫得渺小、山水畫得宏大
      B. 這項內容屬於哪一方面？: '①畫中元素

        ②畫面安排'
      B. 這項內容屬於哪一方面？_options:
        1: 畫中元素
        2: 畫面安排
      B. 這項內容屬於哪一方面？_answer: 2
      C.這項內容表達什麼意義？: '①表達人在浩瀚的大自然面前十分渺小。

        ②凸顯畫中的山水比人物更值得欣賞。'
      C.這項內容表達什麼意義？_options:
        1: 表達人在浩瀚的大自然面前十分渺小。
        2: 凸顯畫中的山水比人物更值得欣賞。
      C.這項內容表達什麼意義？_answer: 1
    - A.文中的具體內容: 許多畫家使用「山人」、「道人」等稱號
      B. 這項內容屬於哪一方面？: '①畫中元素

        ②畫家稱號'
      B. 這項內容屬於哪一方面？_options:
        1: 畫中元素
        2: 畫家稱號
      B. 這項內容屬於哪一方面？_answer: 2
      C.這項內容表達什麼意義？: '①說明這些畫家大多真的隱居山林、苦修尋道。

        ②反映畫家想遠離塵囂、親近自然並提升心靈。'
      C.這項內容表達什麼意義？_options:
        1: 說明這些畫家大多真的隱居山林、苦修尋道。
        2: 反映畫家想遠離塵囂、親近自然並提升心靈。
      C.這項內容表達什麼意義？_answer: 2
  - type: guide
    text: A、C兩欄的作用：
  - type: single
    prompt: 1.寫出「文章寫了哪些看得見、找得到的內容」：
    options:
      1: A欄
      2: C欄
    answer: 1
  - type: single
    prompt: 2.說明「這些內容所表達的意義」：
    options:
      1: A欄
      2: C欄
    answer: 2
  - type: guide
    text: →作者的解釋把看得見、找得到的內容，連到畫家看不見的思想與感受
  - type: guide
    text: 二、三方面的說明為什麼要放在一起？
  - type: single
    prompt: 第五至七段分別介紹畫中元素、畫面安排和畫家稱號。作者把這三方面放在一起，主要有什麼作用？（單選）
    options:
      1: 從不同方面介紹仙境畫的特色，讓讀者增加更多古畫知識。
      2: 從不同方面共同呈現畫家對自然與理想世界的內心嚮往。
      3: 比較三種表現方式，判斷哪一種最能代表古代仙境畫。
    answer: 2
  - type: guide
    text: 三、前面的說明如何形成全文觀點？
  - type: single
    prompt: 1.最後兩段為什麼要寫現代人欣賞仙境畫時的感受？（單選）
    options:
      1: 補充現代人參觀博物館、欣賞水墨畫時可能出現的情景。
      2: 比較古今對自然的喜愛，說明現代人比古人更嚮往山林。
      3: 把畫家的內心嚮往連到現代人，說明藝術能跨越時空。
    answer: 3
  - type: single
    prompt: 2.下列哪一項最能說明作者如何一步一步形成全文觀點？（單選）
    options:
      1: 先介紹仙境畫的多種特色，再說明古畫能長久保存，讓現代人看見過去的山水。
      2: 先解釋仙境畫如何呈現畫家的嚮往，再連結現代人的相似感受，帶出藝術能連結古今。
      3: 先比較古今對神仙的看法，再指出兩者具有相同信仰，所以欣賞仙境畫時感受相同。
    answer: 2
  - type: guide
    text: '◎策略帶著走

      讀介紹畫作、建築或文物的文章時，可以問自己：

      1.作者寫了哪些具體內容？

      2.作者怎麼解釋這些內容？

      3.這些解釋最後形成什麼觀點？'
