  passage: 不只如此，這些古代畫作還有個引人深思的特點──「畫中的人物都非常渺小，周圍的山水風景卻極其宏大」。這和現代人拍照時常把自己放在畫面中心的習慣，形成鮮明的對比。古代畫家如此安排有其深意，主要在表達面對浩瀚無垠的大自然時，人類是微不足道的。畫中的小人物彷彿是畫家在向觀畫者細語：「看啊！這個世界是如此遼闊壯美，人不過是滄海一粟罷了。」此外，許多庶民畫家在簽名時，還喜歡加上「山人」、「道人」等稱號。雖然他們不一定真的隱居山林、苦修尋道，但這些稱號反映出他們遠離塵囂的渴求、對大自然的嚮往，以及對心靈提升的期待。山洞、小橋和小船，渺小的人物與宏大的山水，以及「山人」、「道人」等稱號，看似各不相同，卻都透露出畫家心底的嚮往。他們想遠離塵囂、親近自然，也在浩瀚天地間感受到人的渺小，並把對心靈提升的期待寄託在畫中。原來，古代畫家畫的不只是眼前的山水，更把看不見的內心嚮往，化成了畫中看得見的仙境。
