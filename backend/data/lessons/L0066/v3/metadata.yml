strategy_explained: '這一課我們要練習的是，讀完文章後，能從具體描寫的景物中，找出作者想傳達的特別想法；

  因為這篇文章透過描繪古代畫家心中的仙境，像是山洞、小橋、小船，還有畫中人物和風景的對比，讓我們能更清楚地感受到畫家們渴望遠離塵囂的心情，這種從細節推敲作者心意的練習，正好適合用這篇文章來學習；

  所以讀的時候，可以試著想想看，文章裡提到的畫家們，為什麼會畫這些東西，還有這些畫面背後，他們心裡可能在想些什麼'
