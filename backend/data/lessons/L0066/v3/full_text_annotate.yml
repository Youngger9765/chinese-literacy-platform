  paragraphs:
  - idx: 1
    text: 從變出玻璃鞋給灰姑娘的神仙教母，到大蚌裡誕生的愛神維納斯，再到臺灣的雷公、電母、城隍爺，世界許多文化都有神仙或神明的想像。中國人也不例外。
  - idx: 2
    text: 在古代中國人的想像裡，神仙不食人間煙火，總是住在遠離凡塵俗世、雲霧飄渺的深山裡。在許多口耳相傳的故事裡，曾有極少數幸運的人「誤入」仙境，看見不可思議的景象。這些傳說中的仙境，通常都藏在深山的洞穴裡。
  - idx: 3
    text: 中國江蘇的宜興市有個著名的「張公洞」，根據古書記載，此洞穴三面都是高聳的懸崖，只有北面有一個入口，洞內深不見底，潺潺流水穿過其中，岩壁上的鐘乳石宛如精雕細琢的藝術品。千百年來，許多畫家都將其描繪成通往仙境的入口之一，周圍獨特的地景與岩石，更增添了幾分神祕色彩。
  - idx: 4
    text: 從唐宋到元明，許多畫家都以張公洞為創作題材。在唐宋時期，這類仙境畫主要出自皇宮中的專業畫師；到了元明時期，這類畫作開始在民間普及，越來越多庶民畫家投入創作。仔細觀察這些畫作，會發現它們不只是單純的風景畫，更像是古代版的旅遊指南，生動的展現了當時人們心目中仙境的模樣。古代畫家究竟如何把心中的仙境變成看得見的畫面呢？
  - idx: 5
    text: 首先，畫家們常在畫中安排三種特別的元素：山洞、小橋和小船。山洞意味著通往仙境的神祕門戶，小橋代表跨進另一個世界的通道，小船象徵載人渡向仙境的交通工具。這些元素彷彿是進入另一個世界的「護照」，標誌著從凡塵俗世走向神奇仙境的奇妙轉變。
  - idx: 6
    text: 不只如此，這些古代畫作還有個引人深思的特點──「畫中的人物都非常渺小，周圍的山水風景卻極其宏大」。這和現代人拍照時常把自己放在畫面中心的習慣，形成鮮明的對比。古代畫家如此安排有其深意，主要在表達面對浩瀚無垠的大自然時，人類是微不足道的。畫中的小人物彷彿是畫家在向觀畫者細語：「看啊！這個世界是如此遼闊壯美，人不過是滄海一粟罷了。」
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 7
    text: 此外，許多庶民畫家在簽名時，還喜歡加上「山人」、「道人」等稱號。雖然他們不一定真的隱居山林、苦修尋道，但這些稱號反映出他們遠離塵囂的渴求、對大自然的嚮往，以及對心靈提升的期待。
  - idx: 8
    text: 山洞、小橋和小船，渺小的人物與宏大的山水，以及「山人」、「道人」等稱號，看似各不相同，卻都透露出畫家心底的嚮往。他們想遠離塵囂、親近自然，也在浩瀚天地間感受到人的渺小，並把對心靈提升的期待寄託在畫中。原來，古代畫家畫的不只是眼前的山水，更把看不見的內心嚮往，化成了畫中看得見的仙境。
  - idx: 9
    text: 這些珍貴的藝術遺產，讓畫家的嚮往隨著歲月流傳至今，也讓我們不禁想問：現代人和古人，是否仍有著相似的嚮往？
  - idx: 10
    text: 二十一世紀的我們，好像不再相信山裡的神仙了。然而，當備受挫折、疲憊不堪的你，凝視博物館櫥窗裡泛黃的仙境水墨畫時，不也會想要遠離塵囂，乘著一葉扁舟，從小橋下緩緩划過，駛入如畫的碧綠山林嗎？原來，好的藝術作品能穿越時空，撥動幾個世紀後觀畫者的心弦，讓現代人也感受到與古人相通的嚮往。誰說世界沒有神仙呢？
