vocab_definitions:
  items:
  - index: 1
    word: 雲霧飄渺
    definition: 雲霧飄動、若隱若現，看起來朦朧又遙遠的樣子。
  - index: 2
    word: 不食人間煙火
    definition: 原指神仙不吃人間煮熟的食物；後來形容人遠離世俗生活，彷彿不受現實生活影響。
  - index: 3
    word: 口耳相傳
    definition: 人們用口說、用耳聽，一代一代流傳下來。
  - index: 4
    word: 疲憊不堪
    definition: 形容非常疲累，累得快要撐不住。
  - index: 5
    word: 滄海一粟
    definition: 大海裡的一粒米，比喻在非常廣大的事物中顯得十分渺小。
  - index: 6
    word: 微不足道
    definition: 形容非常渺小或不重要，不值得特別提起。
  - index: 7
    word: 浩瀚無垠
    definition: 廣大到看不到邊，常用來形容天空、海洋或宇宙。
  - index: 8
    word: 凡塵俗世
    definition: 人們日常生活的世界，常用來和神仙世界相比。
  - index: 9
    word: 塵囂
    definition: 人群和日常生活中的喧鬧、忙亂。
  - index: 10
    word: 庶民
    definition: 普通百姓，也就是一般人民。
  - index: 11
    word: 精雕細琢
    definition: 仔細雕刻、反覆修整；也比喻做事或創作非常用心，重視每一個細節。
