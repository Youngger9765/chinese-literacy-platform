comprehension:
  questions:
  - index: 2
    answer: B
    stem: 張公洞為什麼常被畫家描繪成通往仙境的入口？
    options:
      A: 仙境畫從宮廷走向民間，投入創作的畫家更多
      B: 元明時期的畫家開始失去皇室的支持
      C: 人們對仙境的信仰開始動搖，反對虛構仙境
      D: 庶民畫家更熱衷於描繪真實的山水，「旅行」到仙境
    rationale: 藉由兩者巨大落差，人在大自然面前是如此渺小，更應該懷有謙卑的心。
  - index: 5
    answer: C
    stem: 文末說：「誰說世界沒有神仙呢？」這句話最主要想表達什麼？
    options:
      A: 神仙是真實存在的，只是現代人失去尋找的能力
      B: 神仙居住山林，只有有緣人方能找到心中的神仙
      C: 藝術具有永恆的力量，能讓人在心中產生共鳴
    rationale: 文章最後強調人們心中對美好生活與心靈寧靜的追求，這種精神上的「神仙」才是作者真正想表達的含義。
