spotlight:
  lesson: G6-L27
  strategy_name: 寫作手法-從具體內容到作者觀點
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: 本文以說明為主，介紹古代仙境畫。文章不只提供相關內容，也一步一步帶出作者的想法。閱讀時，要看懂前面的說明如何形成最後的觀點。這一課，我們要練習看懂三個層次如何一步一步接起來：具體內容→作者解釋→全文觀點
  - type: guide
    text: 五閱讀聚光燈寫作手法──從具體內容到作者觀點五閱讀聚光燈寫作手法──從具體內容到作者觀點
  - type: guide
    text: 一、從具體內容讀出作者的解釋
  - type: guide
    text: 作者從不同方面介紹古代仙境畫。先判斷每一項具體內容屬於哪一方面，再選出作者對這項內容的解釋。
  - type: table
    rows:
    - - A.文中的具體內容
      - B. 這項內容屬於哪一方面？
      - C.這項內容表達什麼意義？
    - - 古代仙境畫使用山洞、小橋和小船
      - □①畫中元素□②畫面安排
      - □①呈現古人遊覽張公洞時經過的景物與路線。□②表達從凡塵俗世走向神奇仙境的轉變。
    - - 畫家把人物畫得渺小、山水畫得宏大
      - □①畫中元素□②畫面安排
      - □①表達人在浩瀚的大自然面前十分渺小。□②凸顯畫中的山水比人物更值得欣賞。
    - - 許多畫家使用「山人」、「道人」等稱號
      - □①畫中元素□②畫家稱號
      - □①說明這些畫家大多真的隱居山林、苦修尋道。□②反映畫家想遠離塵囂、親近自然並提升心靈。
    - - A、C兩欄的作用：1.寫出「文章寫了哪些看得見、找得到的內容」：□①A欄  □②C欄2.說明「這些內容所表達的意義」：  □①A欄  □②C欄→作者的解釋把看得見、找得到的內容，連到畫家看不見的思想與感受
  - type: guide
    text: 二、三方面的說明為什麼要放在一起？
  - type: single
    prompt: 第五至七段分別介紹畫中元素、畫面安排和畫家稱號。作者把這三方面放在一起，主要有什麼作用？（單選）
    options:
    - 從不同方面介紹仙境畫的特色，讓讀者增加更多古畫知識。
    - 從不同方面共同呈現畫家對自然與理想世界的內心嚮往。
    - 比較三種表現方式，判斷哪一種最能代表古代仙境畫。
    answer: 從不同方面介紹仙境畫的特色，讓讀者增加更多古畫知識。
  - type: guide
    text: 三、前面的說明如何形成全文觀點？
  - type: single
    prompt: 1.最後兩段為什麼要寫現代人欣賞仙境畫時的感受？（單選）
    options:
    - 補充現代人參觀博物館、欣賞水墨畫時可能出現的情景。
    - 比較古今對自然的喜愛，說明現代人比古人更嚮往山林。
    - 把畫家的內心嚮往連到現代人，說明藝術能跨越時空。
    answer: 補充現代人參觀博物館、欣賞水墨畫時可能出現的情景。
  - type: single
    prompt: 2.下列哪一項最能說明作者如何一步一步形成全文觀點？（單選）
    options:
    - 先介紹仙境畫的多種特色，再說明古畫能長久保存，讓現代人看見過去的山水。
    - 先解釋仙境畫如何呈現畫家的嚮往，再連結現代人的相似感受，帶出藝術能連結古今。
    - 先比較古今對神仙的看法，再指出兩者具有相同信仰，所以欣賞仙境畫時感受相同。
    answer: 先介紹仙境畫的多種特色，再說明古畫能長久保存，讓現代人看見過去的山水。
  - type: guide
    text: ◎策略帶著走
  - type: guide
    text: 讀介紹畫作、建築或文物的文章時，可以問自己：
  - type: free_text
    prompt: 1.作者寫了哪些具體內容？
  - type: free_text
    prompt: 2.作者怎麼解釋這些內容？
  - type: free_text
    prompt: 3.這些解釋最後形成什麼觀點？
  - type: guide
    text: 六文章重點表 六文章重點表 ◎小試身手：練習完閱讀聚光燈的題目後，請你完成文章重點表。
  - type: table
    rows:
    - - 古代畫家心中的仙境
    - - 古人的仙境  想像
      - 古人想像神仙遠離【】，住在雲霧飄渺的深山中，傳說中的仙境通常藏在深山的【】裡。
    - - 張公洞與仙境畫
      - 張公洞有高聳的懸崖、流水與鐘乳石等獨特地景，許多畫家將它描繪成通往【】的入口。
    - - 仙境畫的畫面
      - 1.仙境畫常見【】、【】、【】，表達進入仙境的奇妙轉變。2.畫家把人物畫得【】、山水畫得【】，表達人在大自然面前十分渺小。
    - - 仙境畫與庶民畫家
      - 元明時期，仙境畫逐漸在【】普及，許多庶民畫家喜用【】、【】等稱號。
    - - 藝術連結 古今
      - 現代人也可能有與古人相似的嚮往；好的藝術作品能【】，讓古今的觀畫者產生【】。
    answers:
    - 凡塵俗世
    - 洞穴
    - 仙境
    - 山洞
    - 小橋
    - 小船
    - 渺小
    - 宏大
    - 民間
    - 山人
    - 道人
    - 穿越時空
    - 共鳴
