comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列哪一項最能作為「昆蟲可能會因情況改變做法」的證據？
    options:
      A: 捲葉象鼻蟲母蟲在交配後，會尋找葉片並產卵
      B: 捲葉象鼻蟲會在葉片不同部位來回檢查葉片
      C: 葉苞轉不動時，捲葉象鼻蟲改用葉緣包住葉苞
      D: 黃面蜂會在野地尋找獵物，為幼蟲準備食物
    rationale: null
  - index: 2
    answer: A
    stem: 文中捲葉象鼻蟲如何找出適合的葉子作為「育嬰室」，請排出正確的順序？
    options:
      A: ㄆ→ㄅ→ㄇ
      B: ㄅ→ㄆ→ㄇ
      C: ㄇ→ㄆ→ㄅ
      D: ㄆ→ㄇ→ㄅ
    rationale: ㄅ.在葉片不同部位來回重複檢查
  - index: 3
    answer: D
    stem: 黃面蜂最後能抓到捲葉蛾幼蟲，最關鍵的做法是什麼？
    options:
      A: 用觸鬚碰葉苞底部，讓幼蟲開始在葉苞裡移動
      B: 以迅雷不及掩耳的速度，追趕在葉苞裡逃跑的幼蟲
      C: 在葉苞外前後追逐，跟著幼蟲來回變換位置
      D: 不再來回追逐，改守在葉苞開口，等幼蟲自己跑過來
    rationale: null
  - index: 4
    answer: B
    stem: 小丸想知道：「彩虹是怎麼形成的？」哪一種做法最符合「根據證據形成結論」的方法？
    options:
      A: 只看見一次雨後出現彩虹，就判斷彩虹一定是雨水造成的
      B: 查找可靠的科學資料，再用三稜鏡觀察陽光能否分散成不同顏色
      C: 詢問同學支持哪一種說法的人最多，把多數意見當成答案
      D: 看到網紅說彩虹是飛機留下的，就直接接受他的說法
    rationale: null
  - index: 5
    answer: B
    stem: 為什麼作者要用疑問句當標題呢？
    options:
      A: 因為作者還沒有找到任何證據，只能把問題留給讀者
      B: 因為全文從問題出發，引導讀者根據觀察一步步尋找答案
      C: 因為作者想比較兩種昆蟲的能力，判斷哪一種比較聰明
      D: 因為昆蟲是否會思考無法研究，所以只能用疑問句當標題
