  - label: 證據一：捲葉象鼻蟲
    value: '1.捲葉象鼻蟲母蟲通常依照相似的程序選葉、測量和捲葉，這些是牠的__行為。

      2.一隻母蟲遇到葉苞轉不動的困難時，改把__拉過來包住葉苞，成功固定育嬰室。'
    blanks:
    - answer: 本能
      hint: ''
    - answer: 葉緣
      hint: ''
  - label: 證據二：黃面蜂
    value: '1.黃面蜂原本跟著捲葉蛾幼蟲在葉苞前後來回__。

      2.等幼蟲形成來回奔跑的規律後，黃面蜂改守在__，最後抓住幼蟲。'
    blanks:
    - answer: 追逐
      hint: ''
    - answer: 葉苞開口
      hint: ''
  - label: 兩項觀察
    value: 捲葉象鼻蟲和黃面蜂遇到新的情況後，都改變原來的__，並達成目的。
    blanks:
    - answer: 做法
      hint: ''
  - label: 結尾問題
    value: 把兩項觀察合起來，這些證據能支持什麼__？
    blanks:
    - answer: 結論
      hint: ''
  title: 昆蟲會思考嗎？
