passage: 「噗噗！噗噗！」黃面蜂（狩獵蜂的一種）正在野地裡飛來飛去，尋找獵物，為孵化後的幼蟲準備食物。黃面蜂發現一個葉苞裡藏著一隻捲葉蛾幼蟲，便飛過去停在捲起的葉子上。牢固的葉苞把牠擋在外面，牠便用觸鬚碰碰葉苞的底部，彷彿在告訴獵物：「殺手來啦！」
