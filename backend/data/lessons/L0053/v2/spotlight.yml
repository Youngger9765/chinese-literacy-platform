spotlight:
  lesson: G6-L13
  strategy_name: 推論策略-整合證據，形成結論
  strategy_type: inference
  blocks:
  - type: guide
    text: 上一課，我們學會找證據，看證據能支持什麼判斷。這一課，文章提出「昆蟲會不會思考」的問題，並提供兩項觀察。閱讀時，我們要找出真正能回答問題的證據，再把證據合起來，看看能形成什麼結論。
  - type: guide
    text: 一、先鎖定問題
  - type: single
    prompt: 這篇文章主要想回答什麼問題？（單選）
    options:
    - 捲葉象鼻蟲和黃面蜂如何為幼蟲準備住處或食物？
    - 昆蟲是否只會依循本能，還是也可能因情況改變做法？
    - 捲葉象鼻蟲和黃面蜂的行為有哪些相同和不同？
    answer: 捲葉象鼻蟲和黃面蜂如何為幼蟲準備住處或食物？
  - type: guide
    text: 二、找出行為怎麼改變
  - type: guide
    text: ㈠捲葉象鼻蟲：哪一項才是關鍵證據？
  - type: single
    prompt: 1.文章寫了許多捲葉象鼻蟲的動作。哪一項觀察最能幫助我們回答「昆蟲會不會思考」？（單選）
    options:
    - 母蟲會拉一拉葉片、推一推葉緣，測試葉片的彈性。
    - 母蟲會在葉片上前進、後退、橫著走，測量葉片大小。
    - 葉苞轉不動時，母蟲改把葉緣拉過來，包住並固定葉苞。
    answer: 母蟲會拉一拉葉片、推一推葉緣，測試葉片的彈性。
  - type: guide
    text: →小提醒
  - type: guide
    text: 前兩個選項是母蟲平常都會做的事，可能是固定的本能行為。
  - type: guide
    text: 第③選項比較重要，因為牠在原來的方法無法成功時，改變了做法。
  - type: single
    prompt: 2.這項證據最能支持哪一項判斷？（單選）
    options:
    - 捲葉象鼻蟲遇到困難時，會改變原來的做法來解決問題。
    - 捲葉象鼻蟲一開始就知道葉苞會轉不動，已準備好另一種方法。
    - 捲葉象鼻蟲反覆進行捲葉動作後，動作會變得更加熟練。
    answer: 捲葉象鼻蟲遇到困難時，會改變原來的做法來解決問題。
  - type: guide
    text: ㈡黃面蜂：牠改變了什麼？
  - type: single
    prompt: 1.哪一組最完整呈現黃面蜂改變追逐方式的過程？（單選）
    options:
    - 來回追逐幼蟲→幼蟲形成固定路線→繼續來回追逐→抓住幼蟲。
    - 來回追逐幼蟲→幼蟲形成固定路線→改守葉苞開口→抓住幼蟲。
    - 用觸鬚碰葉苞→幼蟲形成固定路線→加快速度追逐→抓住幼蟲。
    answer: 來回追逐幼蟲→幼蟲形成固定路線→繼續來回追逐→抓住幼蟲。
  - type: single
    prompt: 2.黃面蜂原本跟著幼蟲來回追逐，後來卻不再追逐，改守在開口處。這項觀察最能支持哪一項判斷？（單選）
    options:
    - 黃面蜂只靠快速追趕，就能順利抓住葉苞裡的幼蟲
    - 黃面蜂可能會因應幼蟲的行動規律，改變追逐方式
    - 黃面蜂一開始就知道幼蟲會跑到開口，事先在那裡等待
    answer: 黃面蜂只靠快速追趕，就能順利抓住葉苞裡的幼蟲
  - type: guide
    text: 三、合併證據，形成結論
  - type: free_text
    prompt: 1.整理兩項觀察
  - type: guide
    text: 請從下列選項中，選出適合的代號，填入表格的【　】中。
  - type: guide
    text: A.葉苞怎麼轉也轉不動
  - type: guide
    text: B.把葉緣拉過來包住葉苞
  - type: guide
    text: C.幼蟲逐漸形成來回奔跑的規律
  - type: guide
    text: D.不再來回追逐，改守在葉苞開口
  - type: single
    prompt: 2.把兩項觀察合起來看，它們有什麼共同點？（單選）
    options:
    - 遇到新情況後，仍照原來的方式繼續行動。
    - 遇到新情況後，會調整做法，並達成目的。
    - 遇到新情況前，已經安排好完整的行動計畫。
    answer: 遇到新情況後，仍照原來的方式繼續行動。
  - type: single
    prompt: 3.根據前面兩項觀察，哪一個結論最適合？（單選）
    options:
    - 這兩項觀察只顯示昆蟲的動作很複雜，還不能說牠們會調整做法。
    - 這兩項觀察顯示，有些昆蟲可能會依情況調整行動，展現解決問題的能力。
    - 這兩項觀察證明，所有昆蟲都能像人類一樣分析情況，事先安排完整計畫。
    answer: 這兩項觀察只顯示昆蟲的動作很複雜，還不能說牠們會調整做法。
  - type: single
    prompt: 4.上題選項③有哪兩個地方超過文章提供的證據？（3選2）
    options:
    - 文章只觀察兩種昆蟲，不能擴大成「所有昆蟲」。
    - 文章只觀察昆蟲的行為，不能確定牠們像人類一樣分析和計畫。
    - 文章顯示昆蟲會調整做法，不能說牠們具有解決問題的能力。
    answer: 文章只觀察兩種昆蟲，不能擴大成「所有昆蟲」。
  - type: guide
    text: →方法帶著走：先鎖定問題，再找出情況改變後的做法，最後整合證據，檢查結論有沒有說得太大。證據能支持到哪裡，結論就說到哪裡。
  - type: guide
    text: 如果你有做到，請在□內打勾。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能從許多觀察中，找出真正能回答問題的證據。
    - 我能比較行為前後的變化，找出多項證據的共同點。
    - 我能根據證據形成結論，並檢查結論有沒有超過證據。
