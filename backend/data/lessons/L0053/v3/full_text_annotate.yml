  lesson_heading: 第13課  昆蟲會思考嗎？
  paragraph_count: 9
  section_headings:
  - 解決困難的捲葉象鼻蟲
  - 改變追逐方式的黃面蜂
  section_headings_note: '兩個小標印在課文中間、外加灰底方框，是段落之間的分節標題，不佔段號

