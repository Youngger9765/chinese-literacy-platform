  paragraphs:
  - idx: 1
    text: 「昆蟲會不會思考？」人們對這個問題有不同的看法。有些人認為昆蟲會思考；有些人則認為，昆蟲的行為主要受本能控制，只會依循固定的方式覓食、築巢，不會思考或解決問題。但在科學界，回答問題必須以充足的證據為基礎。臺灣著名的昆蟲學者李淳陽，長年在田野觀察昆蟲行為。讓我們來看看，他從捲葉象鼻蟲和黃面蜂身上，發現了什麼。
    followed_by_heading: 解決困難的捲葉象鼻蟲
  - idx: 2
    text: 捲葉象鼻蟲母蟲在交配後，會找一片葉子，產卵在葉片末端，最後將葉片捲成葉苞，當作育嬰室，好讓蟲卵在葉苞中安全孵化。選葉和捲葉時，每一隻母蟲進行的程序都非常相似。牠們會先拉一拉葉片，推一推葉緣，測試葉片的彈性，然後在葉片的不同部位來回檢查，確認這片葉子適不適合當育嬰室。
  - idx: 3
    text: 接著，牠慢慢的、慢慢的，往前走、倒退走、橫著走，一步、兩步，彷彿在仔細測量葉片的長度和寬度。最後才開始把葉片捲起來，作為蟲卵的育嬰室。
  - idx: 4
    text: 但有一次，李淳陽發現，有一隻捲葉象鼻蟲折彎葉片的角度不對，等到要旋轉葉苞，把它固定好時，卻怎麼轉也轉不動。沒想到，牠竟然轉頭跑到葉片基部，把葉緣拉過來包住葉苞，巧妙的把育嬰室固定住。
  - idx: 5
    text: 捲葉象鼻蟲折葉、捲葉，是每一隻母蟲都會的本能行為。可是，這隻象鼻蟲在折葉、捲葉的過程中碰到困難，居然做出和其他同伴不同的做法，臨機應變，另找方法解決問題。
    followed_by_heading: 改變追逐方式的黃面蜂
  - idx: 6
    text: 「噗噗！噗噗！」黃面蜂（狩獵蜂的一種）正在野地裡飛來飛去，尋找獵物，為孵化後的幼蟲準備食物。黃面蜂發現一個葉苞裡藏著一隻捲葉蛾幼蟲，便飛過去停在捲起的葉子上。牢固的葉苞把牠擋在外面，牠便用觸鬚碰碰葉苞的底部，彷彿在告訴獵物：「殺手來啦！」
    marker: ☞ 印在本段段號「六」的右側（念順順起點）
  - idx: 7
    text: 葉苞裡的捲葉蛾幼蟲嚇得從葉苞底部鑽到前端，黃面蜂也以迅雷不及掩耳的速度追到前端，在開口處探頭查看。捲葉蛾幼蟲趕緊又縮回去，逃到後端。就這樣，獵人在葉苞外，獵物在葉苞內，牠們前前後後、來來回回的追逐著。
  - idx: 8
    text: 等幼蟲來回奔跑的路線逐漸形成規律後，黃面蜂突然改變了追逐方式。牠回到葉苞前端，頭部朝向開口處，靜止不動；裡面的捲葉蛾幼蟲仍然依循原來的規律來回奔逃。幼蟲跑到一端，就回頭跑向另一端，沒想到這次正好撞上守株待兔、等在葉苞開口處的黃面蜂。「噗！」黃面蜂立刻撲上前，抓住捲葉蛾幼蟲，飛回巢穴了。
  - idx: 9
    text: 昆蟲會不會思考呢？這類問題可不是隨口說說就算了。科學家必須經過細緻的觀察，蒐集足夠的證據，才能下結論。李淳陽已經累積了一些證據，你覺得，這些證據能支持什麼結論呢？
