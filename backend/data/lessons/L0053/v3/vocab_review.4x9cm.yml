    answer_path: '⚠️ 本課 roundRect 共 11 個，但**只有 10 個是答案圈**：

      第 11 個是 `bg1`（灰）色、2.98×0.77 in 的方塊，就是題目講的那個「灰框」

      （框住語詞清單），錨點在格子上方，不是圈。其餘 10 個都是 `#E97132` 橘色。

      ⚠️ 格子跨頁（第 1~7 列在 p8、第 8~10 列在 p9），但**所有圈都畫在 p8**——

      第 8~10 列的三個圈（孵化／守株待兔下半／彷彿）在 p8 底部看起來像空框。

      只看 p9 會判成「後三列沒有任何答案」。幾何（rot／長度／中心座標）與逐頁讀圖一致。'
