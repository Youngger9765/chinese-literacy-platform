  passage: 「噗噗！噗噗！」黃面蜂（狩獵蜂的一種）正在野地裡飛來飛去，尋找獵物，為孵化後的幼蟲準備食物。黃面蜂發現一個葉苞裡藏著一隻捲葉蛾幼蟲，便飛過去停在捲起的葉子上。牢固的葉苞把牠擋在外面，牠便用觸鬚碰碰葉苞的底部，彷彿在告訴獵物：「殺手來啦！」葉苞裡的捲葉蛾幼蟲嚇得從葉苞底部鑽到前端，黃面蜂也以迅雷不及掩耳的速度追到前端，在開口處探頭查看。捲葉蛾幼蟲趕緊又縮回去，逃到後端。就這樣，獵人在葉苞外，獵物在葉苞內，牠們前前後後、來來回回的追逐著。等幼蟲來回奔跑的路線逐漸形成規律後，黃面蜂突然改變了追逐方式。牠回到葉苞前端，頭部朝向開口處，靜止不動；裡面的捲葉蛾幼蟲仍然依循原來的規律來回奔逃。幼蟲跑到一端，就回頭跑向另一端，沒想到這次正好撞上守株待兔、等在葉苞開口處的黃面蜂。「噗！」黃面蜂立刻撲上前，抓住捲葉蛾幼蟲，飛回巢穴了。
  start_text: 「噗噗！噗噗！」黃面蜂（狩獵蜂的一種）正在野地裡
