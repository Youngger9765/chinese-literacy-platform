strategy_explained: '這一課我們要練習的是「看著一些線索，然後猜出最後的答案」的能力

  因為文章裡面介紹了捲葉象鼻蟲和黃面蜂的行為，就像在找證據一樣，我們可以從牠們怎麼照顧卵、怎麼抓蟲的過程中，推論出牠們是不是真的有在「想」

  所以讀的時候，試著想想作者提供的這些昆蟲行為，可以告訴我們什麼牠們是不是真的有思考喔'
