lesson_seq: 6130
intro: 這篇文章探討一個有趣的問題：昆蟲究竟會不會思考？作者透過昆蟲學家李淳陽的長期觀察，介紹了捲葉象鼻蟲和黃面蜂的行為。文章描述了捲葉象鼻蟲如何細心地為卵準備「育嬰室」，以及在遇到困難時，其中一隻象鼻蟲展現出的特殊應變能力。接著，文章描寫了黃面蜂如何巧妙地捕捉捲葉蛾幼蟲作為食物，牠們之間一來一往的追逐過程，以及黃面蜂最後採取的策略。透過這些生動的例子，引導讀者思考昆蟲的行為模式，以及科學家如何透過觀察與證據來探究生命的奧祕。
