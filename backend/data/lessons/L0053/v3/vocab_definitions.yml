lesson_uid: L0053
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 依循
  - 覓食
  - 葉苞
  - 臨機應變
  - 孵化
  - 規律
  - 巧妙
  - 彷彿
  - 守株待兔
  - 迅雷不及掩耳
  answer_carrier: 橘色手寫字（圖形），文字流的空格內已填有答案
  items:
  - index: 1
    word: 覓食
    definition: 尋找食物。
  - index: 2
    word: 依循
    definition: 按照一定的方式或規則行動。
  - index: 3
    word: 守株待兔
    definition: 比喻不主動想辦法，只想等機會或成果自己送上門。本文指黃面蜂守在葉苞開口，等幼蟲自己跑過來。
  - index: 4
    word: 巧妙
    definition: 做法聰明又合適，能順利達成目的。
  - index: 5
    word: 葉苞
    definition: 由葉子捲成、外形像花苞的構造。
  - index: 6
    word: 彷彿
    definition: 似乎、好像。
  - index: 7
    word: 孵化
    definition: 卵裡的小動物發育後，破殼而出的過程。
  - index: 8
    word: 規律
    definition: 事情反覆出現時，有固定的順序或變化方式。
  - index: 9
    word: 臨機應變
    definition: 遇到新的情況時，立刻調整做法。
  - index: 10
    word: 迅雷不及掩耳
    definition: 雷聲突然響起，讓人來不及掩住耳朵；比喻速度非常快，讓人來不及反應或防備。
