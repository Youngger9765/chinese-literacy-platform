lesson_uid: L0019
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 大同小異
  - 抵消
  - 沮喪
  - 徒手訓練
  - 精準
  - 失之毫釐，差之千里
  - 數據
  - 加持
  - 成效斐然
  - 負擔
  items:
  - index: 1
    word: 大同小異
    definition: 大致相同，但有一點點的差異。
  - index: 2
    word: 加持
    definition: 保護、扶持或支持。
  - index: 3
    word: 負擔
    definition: 承擔，背負。
  - index: 4
    word: 失之毫釐，差之千里
    definition: 剛開始極微小的差異，卻對結果造成巨大影響。
  - index: 5
    word: 抵消
    definition: 抵減，消除。
  - index: 6
    word: 徒手訓練
    definition: 徒手=空手。不需要任何器具的訓練。
  - index: 7
    word: 成效斐然
    definition: 效果非常好。
  - index: 8
    word: 數據
    definition: 用數字記錄下來的資料，例如速度、次數、時間。
  - index: 9
    word: 精準
    definition: 非常精密、正確。
  - index: 10
    word: 沮喪
    definition: 心情低落、失望，覺得提不起精神。
