strategy_explained: '這篇文章裡有很多「如果……就……」或「因為……所以……」的句子，我們要學會認識這些「條件複句」，它們能讓文章的道理說得更清楚

  因為這篇在講運動科學，像是不能亂學《一拳超人》的訓練，還有運動需要搭配和休息，這些道理都常常用「如果……就……」或「因為……所以……」來解釋，幫助我們理解為什麼

  所以讀的時候，可以試著找出這些句子，想一想「為什麼會這樣」或是「這樣做會怎樣」，這樣就能更了解運動科學的知識囉'
