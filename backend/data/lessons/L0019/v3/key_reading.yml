  passage: 運動科學結合現代科技後，在競技運動上有了突破性的發展，教練開始透過精準的測量，幫助運動者在安全的狀況下達到更快、更高、更遠的目標。競技場上，失之毫釐，差之千里，即使是一點點差距，都可能會影響選手的勝敗，有了運動科技加持，教練團可用各種設備測量記錄選手的表現，讓選手看到自己、甚至是對手數據或動作的變化，讓選手明白問題，進而透過加強訓練，改善問題，才能爭取更佳成績。
