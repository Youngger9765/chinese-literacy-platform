  passage: 運動科學結合現代科技後，在競技運動上有了突破性的發展，教練開始透過精準的測量，幫助運動者在安全的狀況下達到更快、更高、更遠的目標。競技場上，失之毫釐，差之千里，即使是一點點差距，都可能會影響選手的勝敗，有了運動科技加持，教練團可用各種設備測量記錄選手的表現，讓選手看到自己、甚至是對手數據或動作的變化，讓選手明白問題，進而透過加強訓練，改善問題，才能爭取更佳成績。以味全龍職棒隊投手林逸達為例，他高中時球速就可以到達147公里，但進職棒後一度失速，最多只能投出129到132公里，他非常沮喪，向運動科學專長的張立帆教練求助。張立帆在分析過高速錄影之後，指出林逸達揮臂沒辦法完全發力，他從運動科學的角度重新設計了林逸達的投球動作，建議他改變揮臂長度，讓手早點到正確的位置，並且要他的跨步再加長一點，修正下盤的發力機制。結果，成效斐然，林逸達的球速在很短的時間內恢復過來，他受訪時表示：「本來手會不舒服，改變機制後，現在速度比較穩定……這樣投會比較輕鬆，對手臂的負擔不會太大。」這就是運動科學的應用實例。
  start_text: 運動科學結合現代科技後，在競技運動上有了突破性的
