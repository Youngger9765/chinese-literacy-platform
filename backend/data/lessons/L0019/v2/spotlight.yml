spotlight:
  lesson: G4-L8
  strategy_name: 認識句型-條件複句
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: single
    prompt: 如果想避免長跑影響肌力訓練，下列哪一種安排較適合？（單選）
    options:
    - 週一早上跑十公里，接著立刻重訓。
    - 週一早上慢跑，週二早上重訓。
    answer: 週一早上慢跑，週二早上重訓。
  - type: free_text
    prompt: 1.連連看，先圈出關聯詞，再將相關的句子連起來。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.辨別句子的意思，選出適當的分句，在□打勾。(單選)
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 3.句型大比拚：請你選擇適當的關聯詞填入括號內，成為通順的句子。
  - type: free_text
    prompt: (1)小美【 不但    】功課好，【 而且    】熱心助人。
  - type: free_text
    prompt: (2)【 雖然    】實驗失敗了，【 但是    】愛迪生絲毫不氣餒。
  - type: free_text
    prompt: (3)【 只要   】晚上早點睡，白天上課【 就   】不會打瞌睡了。
  - type: free_text
    prompt: (4)每次出門，爸爸會【 先   】繫好安全帶，【 然後    】再開車。
  - type: free_text
    prompt: (5)【 無論   】謊言聽起來多麼動聽，最終【 都    】會被人拆穿。
  - type: free_text
    prompt: 4. 讀和課文有關的句子：判斷「條件」和「結果」
  - type: free_text
    prompt: (1)請圈出「條件」：
  - type: guide
    text: a. 如果大量長跑和肌力訓練排得太密集，就可能影響訓練效果。
  - type: guide
    text: b. 只有根據科學證據安排訓練，才能安全又有效的提升運動表現。
  - type: free_text
    prompt: (2)請圈出「結果」：
  - type: guide
    text: a.如果教練能透過數據找出選手的問題，就能設計更適合的訓練方式。
  - type: self_check
    items:
    - 我會圈出條件複句的關聯詞。
    - 我能分出哪一部分是條件，哪一部分是結果。
    - 我能用「條件 → 結果」說出句子的意思。
