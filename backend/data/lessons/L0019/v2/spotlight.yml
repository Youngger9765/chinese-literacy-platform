spotlight:
  lesson: G4-L8
  strategy_name: 認識句型-條件複句
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: single
    prompt: 如果想避免長跑影響肌力訓練，下列哪一種安排較適合？（單選）
    options:
    - 週一早上跑十公里，接著立刻重訓。
    - 週一早上慢跑，週二早上重訓。
    answer: 週一早上跑十公里，接著立刻重訓。
  - type: guide
    text: 六閱讀聚光燈條件複句六閱讀聚光燈條件複句
  - type: free_text
    prompt: 1.連連看，先圈出關聯詞，再將相關的句子連起來。
  - type: table
    rows:
    - - 條件
      - ''
      - 產生結果
    - - '1.'
      - 只要遵照訓練菜單，
      - ●             ●
      - A.就可以加入籃球隊。
    - - '2.'
      - 你沒有看重睡眠，
      - ●             ●
      - B.就有機會打敗敵人。
    - - '3.'
      - 不管你再怎麼辯解，
      - ●             ●
      - C.隔天就無精打采。
    - - '4.'
      - 哥哥只要通過體能測驗，
      - ●             ●
      - D.都改變不了既定的事實。
    - - '5.'
      - 除非把功課寫完，
      - ●             ●
      - E.否則你不能出去玩。
  - type: free_text
    prompt: 2.辨別句子的意思，選出適當的分句，在□打勾。(單選)
  - type: table
    rows:
    - - ''
      - 條件
      - 結果
    - - 例
      - 只要獲得獎牌，
      - ①就有保送升學的機會。□②就想回家。
    - - (1)
      - 只要妹妹想畫畫，
      - □①就會拿起彩色筆。□②就會穿上游泳衣。
    - - (2)
      - 只要  □①放暑假，       □②開學，
      - 就會有很多人出國去玩。
    - - (3)
      - 只要有人打電話求助，
      - □①警察就會立刻提供援助。□②植物就可以快速生長。
  - type: guide
    text: 3.句型大比拚：請你選擇適當的關聯詞填入括號內，成為通順的句子。
  - type: free_text
    prompt: (1)小美【 不但    】功課好，【 而且    】熱心助人。
  - type: free_text
    prompt: (2)【 雖然    】實驗失敗了，【 但是    】愛迪生絲毫不氣餒。
  - type: free_text
    prompt: (3)【 只要   】晚上早點睡，白天上課【 就   】不會打瞌睡了。
  - type: free_text
    prompt: (4)每次出門，爸爸會【 先   】繫好安全帶，【 然後    】再開車。
  - type: free_text
    prompt: (5)【 無論   】謊言聽起來多麼動聽，最終【 都    】會被人拆穿。
  - type: free_text
    prompt: 4. 讀和課文有關的句子：判斷「條件」和「結果」
  - type: free_text
    prompt: (1)請圈出「條件」：
  - type: guide
    text: a. 如果大量長跑和肌力訓練排得太密集，就可能影響訓練效果。
  - type: guide
    text: b. 只有根據科學證據安排訓練，才能安全又有效的提升運動表現。
  - type: free_text
    prompt: (2)請圈出「結果」：
  - type: guide
    text: a.如果教練能透過數據找出選手的問題，就能設計更適合的訓練方式。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我會圈出條件複句的關聯詞。
    - 我能分出哪一部分是條件，哪一部分是結果。
    - 我能用「條件 → 結果」說出句子的意思。
