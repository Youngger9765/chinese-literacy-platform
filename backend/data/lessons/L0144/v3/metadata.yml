strategy_explained: '這次咱們要練習的是，從不同的資料裡找出一樣的事情，然後想想它們說法上有什麼不一樣的地方

  因為基普喬吉不只跑步快，文章還說了他怎麼靠團隊、科技和自律，還有他熱愛閱讀、生活簡樸，這些讓你看到他成功的不同面向

  所以讀的時候，除了了解基普喬吉的跑步故事，也可以想想，有沒有其他地方也提到了他，他們講的方式有什麼不同呢'
