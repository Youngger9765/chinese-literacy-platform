  comprehension:
    instruction: 請根據課文內容，選出正確答案
    instruction_note: 篇3 的指示語與前兩篇不同，且句末沒有句號，原稿如此
    answer_carrier: 橘色手寫代號（在文字層），PDF p14 可見
    items:
    - index: 1
      stem: 對高科技跑鞋的公平問題，支持者與質疑者主要看法有什麼不同？
      options:
        A: 支持者認為公開販售就算公平；質疑者在意鞋底規格是否一致。
        B: 支持者強調長期苦練仍是關鍵；質疑者擔心裝備優勢影響勝負。
        C: 支持者認為跑鞋是破紀錄關鍵；質疑者認為科技幫助有限。
        D: 支持者重視其他選手能否取得；質疑者重視跑鞋是否符合規定。
      answer: B
    - index: 2
      stem: 世界田徑總會沒有全面禁止高科技跑鞋，而是要求鞋款公開販售並限制鞋底規格。這樣的做法最能說明什麼？
      options:
        A: 允許科技繼續使用，但以取得機會與規格限制畫出公平界線
        B: 只要鞋款已經公開販售，科技帶來多少優勢都不會影響公平
        C: 先停止使用新的跑鞋科技，等確認完全不影響成績後再開放
        D: 要求所有參賽選手使用相同的鞋款，減少裝備造成的成績差異
      answer: A
    - index: 3
      stem: 作者在結尾提出：「該怎麼做，才能讓科技幫助選手突破極限，又不讓裝備左右勝負？」主要有什麼作用？
      options:
        A: 質疑世界田徑總會訂出的規則，暗示這些規定沒有實際作用
        B: 把問題推向如何兼顧科技進步與競賽公平，留下值得思考的界線
        C: 強調只要限制鞋底厚度，科技帶來的公平問題就能逐漸解決
        D: 表明作者較支持限制科技，避免高科技裝備影響選手的比賽結果
      answer: B
  reading_relay:
    section_name_printed: 閱讀接力
    subtitle: 從突破紀錄到公平界線
    items:
    - type: single
      label: ❶先整理這一篇
      prompt: 讀完〈靠跑鞋破紀錄，合理嗎？〉，哪一項最完整地整理了本文內容？（單選）
      options:
        1: 高科技跑鞋能協助選手提升成績；只要選手仍然努力訓練，使用這類跑鞋就不會影響公平。
        2: 高科技跑鞋能協助選手提升成績，也可能影響公平；世界田徑總會以公開販售和規格限制畫出界線，但爭議仍未停止。
        3: 高科技跑鞋引發爭議，主要是因為原型鞋尚未公開販售，和跑鞋是否影響成績沒有太大關係。
      answer: 2
    - type: single
      label: ❷第三篇把問題往前推了一步
      prompt: 前兩篇都讓我們看見：科技可能幫助選手提升成績。第三篇進一步追問什麼？（單選）
      options:
        1: 高科技跑鞋怎麼設計，跑起來才能更輕、更穩？
        2: 科技既然能影響成績，怎麼使用才符合競賽公平？
        3: 不同運動使用的科技中，哪一種最能幫助選手破紀錄？
      answer: 2
