  comprehension:
    instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
    answer_carrier: 橘色手寫代號（在文字層），PDF p10~p11 可見
    items:
    - index: 1
      stem: 本文第3段介紹起跑架、釘鞋與跑道的改變。下列哪一項最能說明科技如何幫助短跑選手？
      options:
        A: 科技改變選手的身體比例，使他們逐漸更適合短跑
        B: 科技改善起跑與跑步條件，使選手的力量較少被消耗
        C: 科技延長選手的訓練時間，使他們更能適應比賽壓力
        D: 科技改變百公尺比賽規則，使現代選手更容易獲勝
      answer: B
      answer_note: 這一題的答案代號印成全形「Ｂ」（其餘各題為半形），原稿如此
    - index: 2
      stem: 本文第5至8段列出跳高、鉛球、體操、籃球、游泳與跑步選手的身材差異。這些例子共同說明什麼？
      options:
        A: 優秀選手多半需要高大體型，才能在各項運動占有優勢
        B: 身體條件比訓練更重要，教練應先看體型再看選手表現
        C: 現代選手的體型逐漸接近，才能符合競賽的共同標準
        D: 不同運動需要不同條件，教練會依專項需求挑選人才
      answer: D
    - index: 3
      stem: 作者先比較歐文斯與博爾特的比賽條件，再列舉不同運動選手的身材資料。這樣安排主要有什麼作用？
      options:
        A: 分別用比較與例子，支持科技進步和專項選才兩項解釋
        B: 依照運動出現年代，說明不同項目世界紀錄的發展順序
        C: 透過大量名人數據，證明身材條件比科技設備更為重要
        D: 比較各項運動難度，判斷哪一種運動最容易改寫紀錄
      answer: A
    - index: 4
      stem: 某校田徑隊換成PU跑道和輕量釘鞋後，教練說：「有了新設備，選手一定能大幅破紀錄。」根據全文，哪一項評估最適合？
      options:
        A: 說法合理，新設備改善比賽條件，是現代運動紀錄進步的重要原因。
        B: 說法大致合理，只要設備進步，選手原有的身體條件就不再那麼重要。
        C: 說法不夠完整，新設備能提供協助，但訓練與適合專項的條件仍很重要。
        D: 說法不太合理，新設備主要改善比賽環境，對選手實際成績的幫助有限。
      answer: C
  reading_relay:
    section_name_printed: 閱讀接力
    subtitle: 從科技影響成績，到科技使用的公平問題
    items:
    - type: single
      label: ❶把前兩篇接起來 1
      prompt: 前一篇提到，基普喬吉使用雷射配速與高科技跑鞋。第二篇又介紹起跑架、釘鞋、PU跑道、泳衣和自行車等。這一篇如何接續前一篇的「科技」線索？（單選）
      options:
        1: 說明各項運動只要使用高科技器材，就能像基普喬吉一樣打破紀錄。
        2: 從基普喬吉使用的科技，進一步看見科技也會改變多項運動的競賽條件與表現。
        3: 比較各種運動科技的效果，找出最能幫助選手提升成績的設備。
      answer: 2
    - type: single
      label: ❶把前兩篇接起來 2
      prompt: 第二篇除了延伸「科技」這條線索，還補充了哪一項因素？（單選）
      options:
        1: 選手成長的自然環境
        2: 教練與隊友的團隊合作
        3: 依運動需求進行專項選才
      answer: 3
    - type: guide
      label: →你發現了嗎？
      text: '前一篇從基普喬吉看見一位選手創造紀錄的多種因素；這一篇進一步說明，科技會影響多項運動的紀錄，也補充了專項選才這項因素，訓練仍不可少。

        一位選手創造紀錄的條件 → 多項運動紀錄進步的因素'
    - type: guide
      label: ❷帶著問題讀下一篇
      text: '前兩篇都讓我們看見，科技可能幫助選手提升成績。但科技帶來優勢後，又會出現新的問題。

        閱讀下一篇時，請帶著這個問題：

        →「科技能提升成績，怎麼使用才公平？」'
- part_note: 篇3（第25課）
  part_badge: 篇次3/3-(新聞短文)
  title_line: 第25課　靠跑鞋破紀錄，合理嗎？
  課文作者: 曾世杰
  學習單: 巫怡蓉/陳淑麗
  reading_prompt: ◎閱讀時想一想：科技能提升成績，怎麼使用才公平？
  body:
    paragraph_count: 5
    paragraphs_note: 段號欄印 一~五，沒有分節小標
    paragraphs:
    - idx: 1
      text: 當代馬拉松名將基普喬吉，2019年「跑出歷史」，成為史上首位在兩小時內跑完馬拉松的人。這次挑戰雖然不是正式比賽，成績也不列入世界紀錄，仍震撼全世界。然而，歡呼聲還沒散去，質疑聲就追了上來：他腳上穿的，是一雙尚未公開販售的高科技原型跑鞋。這場突破，靠的是人的極限，還是鞋子的力量？
    - idx: 2
      text: 這款跑鞋最大的賣點是「極輕」及「高回彈」。鞋子雖然增加了15％的特製泡棉，但總重量不變。跑鞋鞋面的特殊材料不容易吸收汗水和雨水，讓鞋子在跑步過程中較能保持乾爽。此外，前後腳掌的高低差也降低了0.3公分，這項微調讓腳掌在跑步時感覺更為穩定。
    - idx: 3
      text: 同一時期，多位跑者穿著同類型的高科技跑鞋，在正式比賽中屢屢打破馬拉松世界紀錄。高科技跑鞋是否讓比賽失去公平，成了爭議焦點。有人認為，鞋子再厲害，仍得靠選手長年苦練，科技只是從旁幫忙；質疑者卻擔心，當跑鞋能讓跑者更省力，甚至拉開成績差距，勝負比的就不只是選手的實力，還有腳上的裝備。
    - idx: 4
      text: 2020年1月，世界田徑總會對此爭議作出回應：沒有全面禁止高科技跑鞋，而是畫下界線。參賽鞋款必須先公開販售至少四個月，讓其他選手也有機會取得；鞋底厚度等規格，也必須符合規定。
    - idx: 5
      text: 規則畫下了界線，卻沒有讓爭議停下來。當一雙跑鞋也能拉開幾秒的差距，該怎麼做，才能讓科技幫助選手突破極限，又不讓裝備左右勝負？
    inline_marked_terms:
    - 原型
    - 屢屢
    - 界線
    - 左右
    inline_marked_terms_note: 課文加框的是「原型」「屢屢」「界線」「左右」四處，語詞框裡收的是「屢屢／界線／左右勝負」
  vocab_definitions:
    vocabulary_bank:
    - 屢屢
    - 界線
    - 左右勝負
    vocabulary_bank_label: 本課語詞
    instruction: 請在空格內填入本課語詞，若有困難，你可以試試回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    instruction_note: 篇3 的指示語比前兩篇短（沒有 🅐🅑🅒 三個方法），原稿如此
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    items:
    - index: 1
      word: 屢屢
      definition: 一次又一次，表示同樣的事情多次發生。
    - index: 2
      word: 左右勝負
      definition: 影響甚至決定比賽的結果。「左右」在這裡不是方向，而是「影響」的意思。
    - index: 3
      word: 界線
      definition: 用來分清楚哪些可以、哪些不可以的範圍或標準。
