lesson_uid: L0144
version_id: v3
section_no: 六
spotlight:
  part_note: 三篇合讀
  strategy_name: 從多文本閱讀──看文章之間的關係
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層）8 個，PDF p15~p16 可見
  blocks:
  - type: guide
    text: 一、後一篇，多告訴我們什麼？
  - type: exercise
    label: 1.請根據三篇文章，完成表格。
    note: 表格三欄（欄名照原稿）：文章／前面已經知道什麼？／這一篇讓理解多了什麼？
    items:
    - type: table
      label: 第一篇〈馬拉松王者──基普喬吉〉
      rows:
      - - 前面已經知道什麼？
        - ──
      - - 這一篇讓理解多了什麼？
        - 基普喬吉創造紀錄，不只靠苦練；環境、團隊、科技與自我鍛鍊等多種因素共同發揮作用。
    - type: single
      label: 第二篇〈不只靠苦練：運動紀錄為何不斷進步？〉
      prompt: 這一篇讓理解多了什麼？
      prompt_note: 「第一篇讓我們看見一位選手成功的多種因素。」印在「前面已經知道什麼？」欄
      options:
        1: 把「科技」從基普喬吉的個案擴大到不同年代與運動，並補充「專項選才」這項因素。
        2: 說明基普喬吉的成功只是特殊例子，其他運動的紀錄主要仍靠苦練。
      answer: 1
    - type: single
      label: 第三篇〈靠跑鞋破紀錄，合理嗎？〉
      prompt: 這一篇讓理解多了什麼？
      prompt_note: 「前兩篇已讓我們知道：科技確實可能幫助選手提升成績。」印在「前面已經知道什麼？」欄
      options:
        1: 既然科技能提升成績，就能直接判斷高科技裝備不公平。
        2: 科技既然能提升成績，就進一步追問：怎麼使用才符合競賽公平？
      answer: 2
  - type: single
    prompt: 2.哪一項最能說明三篇文章的關係？（單選）
    options:
      1: 三篇各說不同原因，要比較哪一篇說得比較對。
      2: 三篇都在談科技，只是換不同運動來說明。
      3: 後一篇增加新內容，補充前面的說法或提出新問題。
      4: 三篇對科技看法不同，所以前後說法互相矛盾。
    answer: 3
  - type: guide
    text: '→你發現了嗎？

      讀多篇文章時，要留意：

      後一篇比前面多告訴我們什麼？又提出了什麼新問題？'
  - type: guide
    text: '二、三篇合起來，我們可以說到哪裡？

      1.讀完三篇文章，下結論前再想一想：這些文章真的能支持我這樣說嗎？請判斷下面的說法。'
  - type: exercise
    label: 說法／三篇文章能不能支持？
    note: 表格兩欄（欄名照原稿）：說法／三篇文章能不能支持？答案是每列勾一個。
    items:
    - type: free_text
      prompt: ①運動紀錄的進步，不只受到選手個人苦練影響。
      answer: 可以支持
    - type: free_text
      prompt: ②科技是影響現代運動成績的重要因素之一。
      answer: 可以支持
    - type: free_text
      prompt: ③既然科技能提升成績，使用高科技裝備就是不公平。
      answer: 不能直接這樣說
    - type: free_text
      prompt: ④只要裝備符合目前規定，就表示公平爭議已經解決。
      answer: 不能直接這樣說
    answer_carrier: '①②的「可以支持」前面有紅色 ☑（w:sym Wingdings F0FE）；

      ③④的「不能直接這樣說」前面是空的 □ —— 教材用「哪一格被勾」表示判斷，兩種都是印出來的答案。'
  - type: guide
    text: →說法③、④都把部分訊息推得太遠，超過三篇文章能支持的範圍。
  - type: single
    label: 三、把三篇的訊息合起來
    options:
      1: 運動紀錄主要靠長期苦練，科技只是少數選手的額外協助
      2: 運動紀錄主要靠科技進步，限制科技就能解決競賽公平問題
      3: 運動紀錄受到多種因素影響；科技能提升成績，也要兼顧競賽公平
    answer: 3
    prompt: 三、把三篇的訊息合起來
    prompt_note: 這一題原稿只印大標，沒有另外的題幹句
  - type: guide
    text: '★策略帶著走

      讀多篇文章時，可以問自己：

      1.後一篇比前面多告訴我什麼？提出了什麼新問題？

      2.把多篇資料合起來後，我的結論有足夠的文章根據嗎？'
  - type: self_check
    prompt: ◎自我檢核
    items:
    - 1.我能看出後一篇比前面多了哪些內容或新問題。
    - 2.我能根據多篇文章，判斷自己的結論有沒有足夠根據。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
