  items:
  - index: 1
    word: 魔障
    definition: 比喻很難突破的障礙或限制。
  - index: 2
    word: 奠定
    definition: 打下穩固的基礎，讓後來發展更順利。
  - index: 3
    word: 聞名於世
    definition: 形容很有名，全世界都知道。
  - index: 4
    word: 綿延
    definition: 連續延伸很長，可形容道路、山脈或時間。
  - index: 5
    word: 佼佼者
    definition: 表現傑出的人。
  - index: 6
    word: 審視
    definition: 仔細查看、思考，了解情況或問題。
  - index: 7
    word: 輪替
    definition: 按照順序輪流替換。
  - index: 8
    word: 配速
    definition: 依照距離和目標，安排並控制跑步的速度。
