full_text_annotate:
  title_line: 第23課　馬拉松王者──基普喬吉
  reading_prompt: ◎閱讀時想一想：一位選手創造紀錄，受到哪些因素影響？
  paragraph_count: 9
  paragraphs:
  - idx: 1
    text: '「你覺得100公尺跑17秒，這樣速度快不快？」

      「很慢啦，還慢得要死。」

      「但每100公尺跑17秒，連續跑42公里呢？」

      「神經病，哪裡有可能？」

      「你不要不相信，2022年9月25日在柏林的馬拉松大賽，就有一個神人，用兩小時1分鐘跑完了42公里，打破了世界紀錄，他就是基普喬吉。」'
    text_note: 原稿排成五行對話，整組是第 1 段
  - idx: 2
    text: 肯亞的裂谷省 南迪郡以長跑好手聞名於世，此地海拔2047公尺，稀薄的空氣、溫和的氣候以及綿延的鄉村小路，都為長跑訓練提供了有利條件。1984年出生的基普喬吉，從小就在這裡生活、奔跑，逐漸練出強大的心肺功能，為日後的長跑生涯奠定基礎，成為世界長跑選手中的佼佼者。
  - idx: 3
    text: 基普喬吉說：「馬拉松將越來越需要團隊的努力。」馬拉松的距離有42公里，過去體育界普遍認為，在兩小時內跑完42公里，是人類難以跨越的極限，基普喬吉是如何利用團隊力量突破極限呢？
  - idx: 4
    text: 以2019年的「1小時59分挑戰計畫」為例，教練團安排多位陪跑員輪替上場，陪跑員在基普喬吉前方擺出倒V字隊形，在他後方還有另外兩名陪跑員。這種隊形可以降低空氣阻力。教練團再以雷射光點引導陪跑員的配速，基普喬吉只要跟得上團隊設定的速度，就有機會突破兩小時大關。
  - idx: 5
    text: 除此之外，他還穿上了高科技跑鞋，NIKE宣稱，這種鞋可以提升4%的跑步效率。最後，基普喬吉以1小時59分40.2秒完成挑戰，突破長久以來的「馬拉松兩小時魔障」。這次挑戰並非正式比賽，因此成績不列入世界紀錄。到了2022年柏林馬拉松大賽，他以兩小時一分刷新世界紀錄，並將這項成就歸功於團隊的努力。
  - idx: 6
    text: 儘管基普喬吉已是世界最頂尖的馬拉松選手，但他生活簡樸，和隊友住在面積不大的宿舍裡。他有次在接受記者採訪時談到：「我們在訓練中心的生活很簡單，早上起床後就練跑，回來後去吃午飯，接受按摩以放鬆肌肉；下午四點再跑，晚上喝點茶，休息，和隊友交流、討論，睡覺，日復一日。」
  - idx: 7
    text: 他認為：「只有自律的人才能在生命中獲得自由。當你開始審視自己時，這就意味著要做正確的事，而不只是做你想做的事。我不是用腿在跑，我是用心跟頭腦在奔跑。」此外，他也有寫訓練日記的習慣，寫下訓練內容、感受和遇到的訓練難題，作為下一次調整的參考。多年下來，這些紀錄累積成一本厚厚的訓練筆記。
  - idx: 8
    text: 更特別的是，不少人以為運動員只重視體能訓練，不太讀書；但基普喬吉也熱愛閱讀。他認為，閱讀能讓他保持專注，不被外界的紅塵俗事干擾。他的閱讀書單十分多元，從希臘哲學家、傑出運動員傳記到各種心靈成長的書籍，應有盡有。《與成功有約：高效能人士的七個習慣》就是他的愛書之一。
  - idx: 9
    text: 出身貧苦的基普喬吉，在充滿挑戰的自然環境中長大。他一路苦練，也懂得借助團隊的力量；他看重自律與內省，也藉著廣泛閱讀提升自己、增廣見聞。這些條件與努力交織在一起，陪著他一次次跑向新的紀錄。
