  paragraphs:
  - idx: 1
    text: 當代馬拉松名將基普喬吉，2019年「跑出歷史」，成為史上首位在兩小時內跑完馬拉松的人。這次挑戰雖然不是正式比賽，成績也不列入世界紀錄，仍震撼全世界。然而，歡呼聲還沒散去，質疑聲就追了上來：他腳上穿的，是一雙尚未公開販售的高科技原型跑鞋。這場突破，靠的是人的極限，還是鞋子的力量？
  - idx: 2
    text: 這款跑鞋最大的賣點是「極輕」及「高回彈」。鞋子雖然增加了15％的特製泡棉，但總重量不變。跑鞋鞋面的特殊材料不容易吸收汗水和雨水，讓鞋子在跑步過程中較能保持乾爽。此外，前後腳掌的高低差也降低了0.3公分，這項微調讓腳掌在跑步時感覺更為穩定。
  - idx: 3
    text: 同一時期，多位跑者穿著同類型的高科技跑鞋，在正式比賽中屢屢打破馬拉松世界紀錄。高科技跑鞋是否讓比賽失去公平，成了爭議焦點。有人認為，鞋子再厲害，仍得靠選手長年苦練，科技只是從旁幫忙；質疑者卻擔心，當跑鞋能讓跑者更省力，甚至拉開成績差距，勝負比的就不只是選手的實力，還有腳上的裝備。
  - idx: 4
    text: 2020年1月，世界田徑總會對此爭議作出回應：沒有全面禁止高科技跑鞋，而是畫下界線。參賽鞋款必須先公開販售至少四個月，讓其他選手也有機會取得；鞋底厚度等規格，也必須符合規定。
  - idx: 5
    text: 規則畫下了界線，卻沒有讓爭議停下來。當一雙跑鞋也能拉開幾秒的差距，該怎麼做，才能讓科技幫助選手突破極限，又不讓裝備左右勝負？
