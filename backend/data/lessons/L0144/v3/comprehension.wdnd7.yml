version_id: v3
section_no: 四
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  items:
  - index: 1
    stem: 本文第5段提到2019年與2022年的兩次挑戰。下列說明何者正確？
    options:
      A: 2019年在正式比賽突破兩小時，2022年在特殊挑戰刷新紀錄
      B: 2019年在特殊挑戰突破兩小時，2022年在正式比賽刷新紀錄
      C: 2019年靠個人力量完成挑戰，2022年才開始運用團隊合作
      D: 2019年穿一般跑鞋完成挑戰，2022年才改穿高科技跑鞋
    answer: B
  - index: 2
    stem: 本文第3至5段同時介紹陪跑員、雷射光點與高科技跑鞋，主要想說明什麼？
    options:
      A: 基普喬吉只要使用先進設備，就能減少平日訓練的時間
      B: 陪跑員主要負責保護選手，避免他在比賽中受到其他人干擾
      C: 高科技跑鞋是突破紀錄的關鍵，團隊合作只是額外的幫助
      D: 團隊安排與科技各有作用，共同協助他維持速度、挑戰極限
    answer: D
  - index: 3
    stem: 本文第6至8段寫到基普喬吉的規律生活、訓練日記和閱讀習慣。作者安排這些內容，主要想說明什麼？
    options:
      A: 他不只刻苦訓練，也透過自律、反省與閱讀持續調整自己
      B: 他把閱讀當成主要訓練，因此逐漸減少跑步與體能練習
      C: 他習慣獨自生活和思考，不太需要教練與隊友提供協助
      D: 他成為頂尖選手以後，才開始規律生活並書寫訓練日記
    answer: A
  - index: 4
    stem: 一位年輕選手想參考基普喬吉，把本文提到的多種做法一起運用。下列哪一種做法涵蓋的面向最完整？
    options:
      A: 選擇適合的訓練環境，長期累積體能，並依自己的狀況調整訓練
      B: 規律進行體能訓練，同時善用跑鞋與配速科技改善自己的表現
      C: 規律訓練並記錄調整，也善用團隊合作與科技提供的協助
      D: 維持規律生活與閱讀習慣，靠自律與反省持續提升自己的表現
    answer: C
