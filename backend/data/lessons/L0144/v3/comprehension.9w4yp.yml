  items:
  - index: 1
    stem: 對高科技跑鞋的公平問題，支持者與質疑者主要看法有什麼不同？
    options:
      A: 支持者認為公開販售就算公平；質疑者在意鞋底規格是否一致。
      B: 支持者強調長期苦練仍是關鍵；質疑者擔心裝備優勢影響勝負。
      C: 支持者認為跑鞋是破紀錄關鍵；質疑者認為科技幫助有限。
      D: 支持者重視其他選手能否取得；質疑者重視跑鞋是否符合規定。
    answer: B
  - index: 2
    stem: 世界田徑總會沒有全面禁止高科技跑鞋，而是要求鞋款公開販售並限制鞋底規格。這樣的做法最能說明什麼？
    options:
      A: 允許科技繼續使用，但以取得機會與規格限制畫出公平界線
      B: 只要鞋款已經公開販售，科技帶來多少優勢都不會影響公平
      C: 先停止使用新的跑鞋科技，等確認完全不影響成績後再開放
      D: 要求所有參賽選手使用相同的鞋款，減少裝備造成的成績差異
    answer: A
  - index: 3
    stem: 作者在結尾提出：「該怎麼做，才能讓科技幫助選手突破極限，又不讓裝備左右勝負？」主要有什麼作用？
    options:
      A: 質疑世界田徑總會訂出的規則，暗示這些規定沒有實際作用
      B: 把問題推向如何兼顧科技進步與競賽公平，留下值得思考的界線
      C: 強調只要限制鞋底厚度，科技帶來的公平問題就能逐漸解決
      D: 表明作者較支持限制科技，避免高科技裝備影響選手的比賽結果
    answer: B
