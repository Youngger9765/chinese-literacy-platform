version_id: v3
section_no: 六
spotlight:
  strategy_name: 用表格整理訊息——從細節歸納比較項目
  strategy_type: table_organize
  section_title_printed: 閱讀聚光燈
  answer_carrier: 橘色手寫字（本節沒有 ☑，全部是填空）
  blocks:
  - type: concept_box
    text: '前面我們學會從比較的細節命名「比較項目」，也學會依比較項目找出相同與不同。這一課要把兩個方法合起來：面對不同形式的比較，先找出可以放在同一列的細節，再替這一列取一個能概括所有細節的比較項目名稱。記得以下的整理表格的步驟嗎？

      找比較對象　②找同列細節　❸問比較項目　❹填入並檢查

      底下我們用這些步驟將本課訊息整理成表格，注意，步驟❸、❹是本課練習的重點哦！'
    note: '步驟列在畫面上是「① 找比較對象　②找同列細節　❸問比較項目　❹填入並檢查」，

      但第一個「①」是 Word 自動編號、**不在文字流裡**（其餘 ②❸❹ 都在）。

      照文字層記錄，不補寫 ①（跟 ☞ 同樣處理）。'
  - type: guide
    text: ◎ 小試身手
  - type: fill_table
    prompt: 1.將課文第三～六段內容整理成表格。
    columns:
    - 段
    - 比較主題
    - 同住前
    - 同住後
    - 帶來的影響
    header_note: 原稿第二欄表頭是斜分格「比較／時間／主題」，本檔取「比較主題」當欄名
    rows:
    - 段: 第三段
      比較主題: '示例：

        居家空間'
      同住前: 家中有門檻，浴室缺少扶手與防滑設備
      同住後: '1.改變擺設、敲掉門檻。

        2.浴室安裝止滑扶手、地板鋪上防滑墊。

        3.確保室內光線充足。'
      帶來的影響: 可以讓老人住得更【　】。
      帶來的影響_blanks:
      - answer: 安全
    - 段: 第四、五段
      比較主題: 【　】
      比較主題_blanks:
      - answer: 餐桌飲食
      同住前: 叫外送、微波食品
      同住後: '1.【　】製作美味可口的飯菜。

        2.爺爺帶著家人【　】。'
      同住後_blanks:
      - answer: 奶奶
      - answer: 洗手作羹湯/作菜
      帶來的影響: '1.全家有口福。

        2.現代超市買不到的【　】。'
      帶來的影響_blanks:
      - answer: 珍貴記憶
    - 段: 第六段
      比較主題: 【　】
      比較主題_blanks:
      - answer: 生活作息
      同住前: 晚睡晚起
      同住後: '1.【　】。

        2.【　】。

        3.到公園散步，呼吸新鮮空氣。'
      同住後_blanks:
      - answer: 早睡早起
      - answer: 吃早餐
      帶來的影響: 整個人變得【　】。
      帶來的影響_blanks:
      - answer: 神清氣爽
  - type: fill_table
    prompt: 2.請根據下表同一列的比較細節，取一個比較項目的名稱，填入最左欄。
    columns:
    - 段
    - 比較項目
    - 作者
    - 父母
    - 爺爺奶奶
    header_note: 原稿第二欄表頭是斜分格「對象／比較項目」，本檔取「比較項目」當欄名
    rows:
    - 段: ''
      比較項目: 示例：【休閒方式】
      作者: 打電動
      父母: 上網路
      爺爺奶奶: 看電視
    - 段: 第七段
      比較項目: 【　】
      比較項目_blanks:
      - answer: 音樂喜好
      作者: 周杰倫
      父母: 動力火車
      爺爺奶奶: 蔡琴
    - 段: ''
      比較項目: 【　】
      比較項目_blanks:
      - answer: 價值觀/金錢觀
      作者: 覺得熱就開冷氣
      父母: ''
      爺爺奶奶: 開冷氣浪費電
      note: 這一列原稿把「作者」「父母」兩欄合併成一格，只印「覺得熱就開冷氣」
    - 段: ''
      比較項目: 【　】
      比較項目_blanks:
      - answer: 飲食習慣
      作者: 愛喝飲料
      父母: （未提）
      爺爺奶奶: 含糖飲料是垃圾食物
