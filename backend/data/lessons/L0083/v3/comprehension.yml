lesson_uid: L0083
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列語詞，何者 使用正確？
    stem_note: 原稿「何者」與「使用正確」之間多一個半形空白，照原稿記錄
    options:
      A: 他「蘊含」了所有的力氣，搬起了那塊大石頭
      B: 他為了準備考試，「動員」了一整晚看書
      C: 他初次上舞台，非常緊張，整場都「躡手躡腳」
      D: 他是小說家，經常「琢磨」如何以文字打動人心
    explanation: '第1題詳解：

      A「蘊含」不適用於體力或動作，而是形容內在的隱含意義、Ｂ「動員」通常指調集力量或號召多人參與，不適用於個人行為、Ｃ情境不符。'
    explanation_note: 原稿是一個浮動說明框，印在第 2 題選項右側
  - index: 2
    answer: C
    stem: 根據課文，為了讓家裡更適合高齡者，家中做了哪些改變？
    options:
      A: 增加了室內植物和裝飾
      B: 廚房換成最先進的設備
      C: 增加防滑的扶手、地墊
      D: 特別加裝了輪椅斜坡道
  - index: 3
    answer: A
    stem: 「摹寫」是把看到、聽到、聞到等感受具體寫出來，讓讀者彷彿身在現場。下列何者主要使用視覺摹寫？
    options:
      A: 客廳有兩張…最愛的藤椅，陽台上擺滿奶奶精心照料的盆栽
      B: 我是夜貓子……早晨，能賴則賴，絕對沒有聞雞起舞的事
      C: 爺爺奶奶來一段時間以後，我們漸漸琢磨出相處之道
      D: 點點滴滴的相處經驗，教會我傾聽不同世代的聲音
  - index: 4
    answer: C
    stem: 作者在文末提到「只要轉換個觀點，得到的歡喜收穫，就會遠多於衝突不適」，這句話對整篇文章的作用是什麼？
    options:
      A: 總結經驗，說明三代同堂家庭生活的多樣性
      B: 暗示三代同堂的生活都在衝突與和解中循環
      C: 說明理解與包容是跨世代相處的核心智慧
      D: 強調相處時很難避免衝突，必須互相妥協
    explanation: (三代相處時價值觀的碰撞並非不可解，實際上可以成為促進彼此成長的契機。)
    explanation_note: 原稿是一個浮動說明框，印在選項 A、B 右側
  - index: 5
    answer: B
    stem: 請問本課的文章主旨是什麼？
    options:
      A: 探討高齡社會對社會文化家庭的影響
      B: 描述三代同堂家庭的種種挑戰與磨合
      C: 說明三代同堂飲食生活常規的重要性
      D: 強調並列舉不同世代同住的種種優點
    explanation: (從長輩來了之後的改變與適應)
    explanation_note: 這一則不是浮動說明框，是印在題幹同一行後面的橘色行內小字
  notes:
    answer_carrier: 橘色手寫代號（PDF p8）；文字層的（　）內已填有同樣的代號
