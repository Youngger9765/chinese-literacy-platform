  passage: 首先是居家空間的高齡友善改造，我們敲掉幾個可能讓人絆倒的門檻、在浴室加裝止滑扶手、地板鋪上防滑墊、並確保室內光線充足。這些看似簡單的改變，其實都經過專業設計，目的是為了讓爺爺奶奶住得更安全。最大的改變發生在餐桌上，以前爸媽忙於工作，家裡的餐點常常靠外送或微波食品快速解決，爺爺奶奶住進來後，餐桌成了全家人溫馨團聚的中心。奶奶總是變魔術似的端出一道道好菜，即使要遵照營養師建議的「三高二低」原則──高蛋白、高鈣、高纖維、低油、低鹽，她仍讓每道菜都美味可口。爺爺也會帶著我們「洗手作羹湯」，像上個週末，我們一起醃製了獨門醬菜──從挑選新鮮白菜、調配鹽水比例，到把握最佳發酵時間，每個步驟都蘊含著祖輩的智慧。整個過程帶來的不只是口福，更是現代超市裡買不到的珍貴記憶。
