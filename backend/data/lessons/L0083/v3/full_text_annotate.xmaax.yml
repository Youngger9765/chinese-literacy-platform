  lesson_heading: 第15課　爺爺奶奶來了以後
  paragraph_count: 9
  paragraphs:
  - idx: 1
    text: 根據內政部統計，2025年，65歲以上人口比例突破20%，臺灣已成為「超高齡社會」。而且，三代同堂的家庭比例從十年前的31.2%上升到38.7%；也就是說，每10個家庭中，就有將近4個家庭是和爺爺奶奶一起生活的，我家就是一個典型的例子。
  - idx: 2
    text: 爺爺奶奶搬進來那天，我們家就熱鬧了起來。客廳多了兩張他們最愛的藤椅，陽台上擺滿了奶奶精心照料的盆栽，廚房裡也飄起許久未聞的古早味菜香。但要讓三代的新組合可以合「住」無間，全家都需要動員起來，一起調整和適應。
  - idx: 3
    text: 首先是居家空間的高齡友善改造，我們敲掉幾個可能讓人絆倒的門檻、在浴室加裝止滑扶手、地板鋪上防滑墊、並確保室內光線充足。這些看似簡單的改變，其實都經過專業設計，目的是為了讓爺爺奶奶住得更安全。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 4
    text: 最大的改變發生在餐桌上，以前爸媽忙於工作，家裡的餐點常常靠外送或微波食品快速解決，爺爺奶奶住進來後，餐桌成了全家人溫馨團聚的中心。
  - idx: 5
    text: 奶奶總是變魔術似的端出一道道好菜，即使要遵照營養師建議的「三高二低」原則──高蛋白、高鈣、高纖維、低油、低鹽，她仍讓每道菜都美味可口。爺爺也會帶著我們「洗手作羹湯」，像上個週末，我們一起醃製了獨門醬菜──從挑選新鮮白菜、調配鹽水比例，到把握最佳發酵時間，每個步驟都蘊含著祖輩的智慧。整個過程帶來的不只是口福，更是現代超市裡買不到的珍貴記憶。
    layout_note: 原稿在「整個過程帶」與「來的不只是口福」之間有一個手動換行，仍是同一段
  - idx: 6
    text: 我們的生活作息也跟著改變了。我是晚睡晚起的夜貓子，夜裡總要過了十二點才睡，早晨能賴則賴，絕對沒有「聞雞起舞」的事。不必上學的週末或假日，更一定睡到日上三竿。現在不同了，晚上九點，爺爺奶奶「沒電了」，準備就寢，我們只能關掉電視，連去廚房倒杯水，都要躡手躡腳，像個小偷。早上六點多，我就會在睡夢中聽見各種聲音，從窸窸窣窣的拖鞋聲、鏗鏗鏘鏘的鍋盤聲、到喧鬧紛雜的晨間新聞聲。漸漸地，我竟然早起的日子愈來愈多，開始發現早起的「光明面」：一大早就能吃到熱騰騰的早餐，跟著爺爺奶奶到公園散步，在明亮卻不炎熱的陽光下呼吸清新的空氣，整個人都變得神清氣爽。
  - idx: 7
    text: 和爺爺奶奶之間的「小衝突」是難免的，畢竟每個世代都有自己熟悉的生活方式和價值觀。音樂的喜好就有很大差異，我愛聽周杰倫風格強烈的歌曲，爸爸媽媽喜歡聽動力火車的〈忠孝東路走九遍〉，爺爺奶奶喜歡的卻是蔡琴的〈最後一夜〉；我們夏天習慣把冷氣開到26度，他們卻披著外套，不但直喊冷，還說開冷氣浪費錢。他們只要看到我拿著一杯手搖飲，就開始唸：「你知道那裡面有多少糖嗎？你再吃這種垃圾食物，老了你就知道！」
  - idx: 8
    text: 爺爺奶奶來一段時間以後，我們漸漸琢磨出相處之道。有研究指出，和長輩同住的青少年特別容易培養良好的「情緒智商」，這和我的感受一致。點點滴滴的相處經驗，教會我傾聽不同世代的聲音，並學習設身處地為他人著想。
  - idx: 9
    text: 現在當爺爺奶奶分享「古時候」的事時，我不再覺得是囉嗦或嘮叨了，我會帶著好奇心聆聽、理解故事裡的悲歡離合。三代同堂對我來說，只要轉換個觀點，得到的歡喜收穫，就會遠多於衝突和不適呢。
