    語詞框有「設身處地」沒有「典型」。第八大題灰框 10 個 = 兩者聯集（典型＋設身處地都在）。

    第四大題代號表 10 個也是聯集。第三大題 9 題對應語詞框那一組。

    ⛔ 未自行以任何一份覆蓋另一份。'
strategy_explained: 這一課我們要練習的是「從細節裡找出文章的主題」，這篇文章描寫爺爺奶奶來了之後，家裡空間、餐桌、生活作息的種種變化，還有家人如何互相溝通、理解，這些具體的生活片段，都幫助我們看到三代同堂的溫暖和學習，讀的時候，你可以試著把這些發生的事，像是空間改造、餐桌上的對話、作息調整，想成是文章在告訴你的重點，然後試著幫這些重點想一個適合的名字
