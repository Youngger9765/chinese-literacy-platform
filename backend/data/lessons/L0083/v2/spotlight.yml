spotlight:
  lesson: G7-L15
  strategy_name: 用表格整理訊息-從細節歸納比較項目
  strategy_type: comparison
  blocks:
  - type: guide
    text: 第10課，我們學會從比較的細節命名「比較項目」；第11課，我們又學會依比較項目找出相同與不同。這一課要把兩個方法合起來：面對不同形式的比較，先找出可以放在同一列的細節，再替這一列取一個能概括所有細節的比較項目名稱。記得以下的整理表格的步驟嗎？找比較對象　②找同列細節　❸問比較項目　❹填入並檢查底下我們用這些步驟將本課訊息整理成表格，注意，步驟❸、❹是本課練習的重點哦！
  - type: guide
    text: ◎ 小試身手
  - type: free_text
    prompt: 1.將課文第三～六段內容整理成表格。
  - type: table
    rows:
    - - 段
      - 比較　　　 時間主題
      - 同住前
      - 同住後
      - 帶來的影響
    - - 第三段
      - 示例：居家空間
      - 家中有門檻，浴室缺少扶手與防滑設備
      - 1.改變擺設、敲掉門檻。2.浴室安裝止滑扶手、地板鋪上防滑墊。3.確保室內光線充足。
      - 可以讓老人住得更【】。
    - - 第四、五段
      - 【】
      - 叫外送、微波食品
      - 1.【】製作美味可口的飯菜。2.爺爺帶著家人【】。
      - 1.全家有口福。2.現代超市買不到的【】。
    - - 第六段
      - 【】
      - 晚睡晚起
      - 1.【】。2.【】。3.到公園散步，呼吸新鮮空氣。
      - 整個人變得【】。
    answers:
    - 安全
    - 餐桌飲食
    - 奶奶
    - 洗手作羹湯/作菜
    - 珍貴記憶
    - 生活作息
    - 早睡早起
    - 吃早餐
    - 神清氣爽
  - type: free_text
    prompt: 2.請根據下表同一列的比較細節，取一個比較項目的名稱，填入最左欄。
  - type: table
    rows:
    - - 段
      - 對象比較項目
      - 作者
      - 父母
      - 爺爺奶奶
    - - ''
      - 示例：【】
      - 打電動
      - 上網路
      - 看電視
    - - 第七段
      - 【】
      - 周杰倫
      - 動力火車
      - 蔡琴
    - - 第七段
      - 【】
      - 覺得熱就開冷氣
      - 開冷氣浪費電
    - - 第七段
      - 【】
      - 愛喝飲料
      - （未提）
      - 含糖飲料是垃圾食物
    answers:
    - 休閒方式
    - 音樂喜好
    - 價值觀/金錢觀
    - 飲食習慣
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
