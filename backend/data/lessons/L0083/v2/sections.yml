comprehension:
  questions:
  - index: 2
    answer: C
    stem: 根據課文，為了讓家裡更適合高齡者，家中做了哪些改變？
    options:
      B: 廚房換成最先進的設備
      C: 增加防滑的扶手、地墊
      D: 特別加裝了輪椅斜坡道
    rationale: A「蘊含」不適用於體力或動作，而是形容內在的隱含意義、Ｂ「動員」通常指調集力量或號召多人參與，不適用於個人行為、Ｃ情境不符。
  - index: 3
    answer: A
    stem: 「摹寫」是把看到、聽到、聞到等感受具體寫出來，讓讀者彷彿身在現場。下列何者主要使用視覺摹寫？
    options:
      A: 客廳有兩張…最愛的藤椅，陽台上擺滿奶奶精心照料的盆栽
      B: 我是夜貓子……早晨，能賴則賴，絕對沒有聞雞起舞的事
      C: 爺爺奶奶來一段時間以後，我們漸漸琢磨出相處之道
      D: 點點滴滴的相處經驗，教會我傾聽不同世代的聲音
    rationale: null
  - index: 4
    answer: C
    stem: 作者在文末提到「只要轉換個觀點，得到的歡喜收穫，就會遠多於衝突不適」，這句話對整篇文章的作用是什麼？
    options:
      B: 暗示三代同堂的生活都在衝突與和解中循環
      C: 說明理解與包容是跨世代相處的核心智慧
      D: 強調相處時很難避免衝突，必須互相妥協
    rationale: 三代相處時價值觀的碰撞並非不可解，實際上可以成為促進彼此成長的契機。
  - index: 5
    answer: B
    stem: 請問本課的文章主旨是什麼？(從長輩來了之後的改變與適應)
    options:
      A: 探討高齡社會對社會文化家庭的影響
      B: 描述三代同堂家庭的種種挑戰與磨合
      C: 說明三代同堂飲食生活常規的重要性
      D: 強調並列舉不同世代同住的種種優點
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞劃掉。
