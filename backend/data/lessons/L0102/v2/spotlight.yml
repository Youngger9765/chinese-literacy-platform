spotlight:
  lesson: G7-L5
  strategy_name: 媒體素養與識讀-辨別網路訊息真偽
  strategy_type: sel_character
  blocks:
  - type: free_text
    prompt: (4)如果對網路上的虛假消息(  C  )，就容易成為網路詐騙的對象。
  - type: free_text
    prompt: (5)誇大不實的廣告，容易使民眾對產品的療效產生 (  A  )。
  - type: free_text
    prompt: (6)班會紀錄寫得很清楚，他卻故意扭曲內容，企圖 (  H  )。
  - type: free_text
    prompt: (7)用星座、血型算命，根本就是(  J  )，經不起科學考驗。
  - type: free_text
    prompt: (8)他感冒後鼻涕又黃又(  E  )，醫生提醒他多喝水、多休息。
  - type: passage
    source: unknown
    paragraphs:
    - 五閱讀聚光燈媒體素養與識讀——辨別網路訊息真偽五閱讀聚光燈媒體素養與識讀——辨別網路訊息真偽
    - 網路上的影片只要出現實驗器材、明顯的研究結果，再加上說話者充滿信心，就很容易讓人覺得：「有做實驗，應該是真的吧！」
  - type: guide
    text: 可是，看起來「像」科學，不代表結論真的有科學根據。
  - type: passage
    source: unknown
    paragraphs:
    - 看到讓你驚訝、害怕或很想相信的訊息時，先不要急著相信或轉傳，可以用下面四個步驟檢查。
  - type: guide
    text: 網路訊息判讀四步驟
  - type: free_text
    prompt: ❶抓主張：這則訊息要我相信什麼？
  - type: free_text
    prompt: ❷查來源：是誰發布的？有沒有說明資料從哪裡來？
  - type: free_text
    prompt: ❸驗證據：他拿什麼來證明？證據能支持結論嗎？
  - type: free_text
    prompt: ❹再查證：其他可靠來源怎麼說？證據不足時，先保留判斷。
  - type: guide
    text: ※祕訣：判斷證據時，可以再問三個問題：
  - type: free_text
    prompt: 1.他實際測到的是什麼？
  - type: free_text
    prompt: 2.他最後下了什麼結論？
  - type: free_text
    prompt: 3.測到的結果，真的能證明這個結論嗎？
  - type: guide
    text: 一、跟著做：判讀「棉花肺實驗」
  - type: passage
    source: unknown
    paragraphs:
    - 影片中，網紅把紙菸和電子煙的煙霧分別導入兩團棉花。紙菸使棉花變成深褐色，電子煙的棉花仍然潔白。網紅藉此讓觀眾相信電子煙比較安全。
  - type: single
    prompt: ❶抓主張：影片要觀眾相信什麼結論？
    options:
    - 紙菸會使棉花變色
    - 電子煙不會使棉花變色，所以對人體無害
    - 棉花可以吸收各種煙霧
    - 電子煙的味道比紙菸好聞
    answer: 紙菸會使棉花變色
  - type: free_text
    prompt: ❷查來源：影片提供了哪些來源資訊？
  - type: passage
    source: unknown
    paragraphs:
    - 影片是否說明這項實驗來自哪一個研究機構，或引用哪一份醫學研究？
  - type: multi
    prompt: 請選擇
    options:
    - 有，資料來源交代得很完整
    - 沒有，文章中未提到查證的研究來源
    - 不完整
    - 非常可靠】。
    answer:
    - 有，資料來源交代得很完整
    - 沒有，文章中未提到查證的研究來源
    - 不完整
    - 非常可靠】。
  - type: free_text
    prompt: ❸驗證據：證據真的能支持結論嗎？
  - type: passage
    source: unknown
    paragraphs:
    - 影片提出的證據是：「電子煙煙霧導入棉花後，棉花仍然潔白。」
    - 下列哪一項判斷較合理？
  - type: multi
    prompt: 請選擇
    options:
    - 棉花沒有變色，就能證明電子煙沒有任何有害物質。
    - 棉花沒有變色，只能看出表面的顏色變化，不能排除看不見的有害物質。
    - 棉花沒有變色，表示所有人的肺部都不會受到影響。
    - 只要紙菸比較髒，電子煙就一定是安全的。
    answer:
    - 棉花沒有變色，就能證明電子煙沒有任何有害物質。
    - 棉花沒有變色，只能看出表面的顏色變化，不能排除看不見的有害物質。
    - 棉花沒有變色，表示所有人的肺部都不會受到影響。
    - 只要紙菸比較髒，電子煙就一定是安全的。
  - type: passage
    source: unknown
    paragraphs:
    - 課文指出，電子煙煙霧可能含有尼古丁、重金屬等看不見的物質。
    - →因此：「棉花仍然潔白」不能直接推成「電子煙對人體無害」。
  - type: single
    prompt: ❹再查證：接下來怎麼做較適當？
    options:
    - 看影片按讚數多不多
    - 看留言區有多少人相信
    - 查找衛生主管機關、醫療機構或研究資料，再互相比對
    - 因為影片看起來可疑，就直接認定所有內容都是假的
    answer: 看影片按讚數多不多
  - type: guide
    text: 我目前的判斷：
  - type: multi
    prompt: 請選擇
    options:
    - 影片已經證明電子煙無害
    - 影片已經證明電子煙一定比紙菸危險
    - 影片的證據不足，不能用棉花顏色證明電子煙無害
    answer:
    - 影片已經證明電子煙無害
    - 影片已經證明電子煙一定比紙菸危險
    - 影片的證據不足，不能用棉花顏色證明電子煙無害
  - type: guide
    text: 二、換你試試看：判讀「煙油食材實驗」
  - type: passage
    source: unknown
    paragraphs:
    - 影片中，網紅把煙油加入麵包、冰棒和飲料中，並當場吃下去。他說：「這些成分平常在食物裡也吃得到，沒問題啦！」請使用相同的四個步驟判讀。
  - type: free_text
    prompt: ❶抓主張
  - type: passage
    source: unknown
    paragraphs:
    - 這部影片想要讓觀眾相信什麼？
  - type: multi
    prompt: 請選擇
    options:
    - 有些食品中含有香料
    - 煙油可以吃，因此吸電子煙也不會傷害身體
    - 冰棒和飲料可以加入不同口味
    - 網紅很勇敢，願意親自嘗試
    answer:
    - 有些食品中含有香料
    - 煙油可以吃，因此吸電子煙也不會傷害身體
    - 冰棒和飲料可以加入不同口味
    - 網紅很勇敢，願意親自嘗試
  - type: free_text
    prompt: ❷查來源
  - type: passage
    source: unknown
    paragraphs:
    - 影片中，支持這個主張最主要的「證據或證明」是什麼？
  - type: multi
    prompt: 請選擇
    options:
    - 網紅親自把煙油加入食物並吃下去
    - 醫療機構進行長期人體研究
    - 多個研究團隊得到相同結果
    - 衛生主管機關公布安全檢驗
    answer:
    - 網紅親自把煙油加入食物並吃下去
    - 醫療機構進行長期人體研究
    - 多個研究團隊得到相同結果
    - 衛生主管機關公布安全檢驗
  - type: free_text
    prompt: ❸驗證據
  - type: passage
    source: unknown
    paragraphs:
    - 這個實驗最大的問題是什麼？
  - type: multi
    prompt: 請選擇
    options:
    - 網紅吃的煙油口味不夠多
    - 食物和飲料的外觀不夠吸引人
    - 「吃進消化道」和「吸入肺部」是不同途徑，不能放在一起比較
    - 影片沒有說明網紅喜歡哪一種口味
    answer:
    - 網紅吃的煙油口味不夠多
    - 食物和飲料的外觀不夠吸引人
    - 「吃進消化道」和「吸入肺部」是不同途徑，不能放在一起比較
    - 影片沒有說明網紅喜歡哪一種口味
  - type: passage
    source: unknown
    paragraphs:
    - 簡單的說，網紅敢吃下去，只能證明：他在影片中做了這個動作。
    - 不能因此證明：煙油對每個人都安全，也不能證明長期吸入不會造成危害。
  - type: free_text
    prompt: ❹再查證
  - type: passage
    source: unknown
    paragraphs:
    - 目前最合理的判斷是：
  - type: multi
    prompt: 請選擇
    options:
    - 網紅敢吃，所以電子煙一定安全
    - 只要是網紅影片，就一定是假消息
    - 影片把食用和吸入混為一談，證據不足，不能支持「電子煙無害」
    - 只要煙油有食物香味，就可以放心使用
    answer:
    - 網紅敢吃，所以電子煙一定安全
    - 只要是網紅影片，就一定是假消息
    - 影片把食用和吸入混為一談，證據不足，不能支持「電子煙無害」
    - 只要煙油有食物香味，就可以放心使用
  - type: guide
    text: 三、你發現了嗎？網路實驗常見的四種陷阱
  - type: table
    rows:
    - - 常見陷阱
      - 意思
      - 本文例子
    - - ❶只看表面
      - 只看容易看見的現象，忽略看不見的資訊
      - 棉花沒有變色，就說電子煙無害
    - - ❷偷換情況
      - 把兩種不同情況當成相同
      - 把「吃進消化道」和「吸入肺部」相提並論
    - - ❸一次當全部
      - 用一個人、一次示範，代表所有人與所有情況
      - 網紅敢吃煙油，就說煙油安全
    - - ❹結論說太滿
      - 證據只能說明一小部分，結論卻說得過度肯定
      - 從棉花潔白直接推成「對人體無害」
  - type: guide
    text: ◎學習：看到網路實驗時，再問自己一句：
  - type: guide
    text: 這個實驗真正測到的是什麼？它真的能回答影片提出的問題嗎？
  - type: guide
    text: 四、換個情境試試看：「能量手環讓球速立刻增加？」
  - type: passage
    source: unknown
    paragraphs:
    - 某網紅發布短影音。他先投三球，最快球速是每小時100公里；接著戴上「能量手環」再投三球，最快球速變成每小時105公里。於是他宣布：
    - 「實驗證明，戴上能量手環就能提升球速！」
    - 影片只測試網紅一個人，也沒有找其他人重複測試。
