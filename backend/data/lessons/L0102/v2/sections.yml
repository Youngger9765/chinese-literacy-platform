comprehension:
  questions:
  - index: 2
    answer: A
    stem: 電子煙的廠商為何會把目標鎖定在年輕族群?
    options:
      B: 因為年輕族群很有錢，可以當廠商長期提款機
      C: 因為電子煙有龐大的利益，如果越多人抽越好
      D: 因為年輕族群比較聰明，可躲開執法機關的查緝
      A: 年輕人容易因為廠商的行銷手法而上當，而忽略了實際的問題。
    rationale: 年輕人容易因為廠商的行銷手法而上當，而忽略了實際的問題。
    is_rationale: true
  - index: 3
    answer: C
    stem: 在本文中，判斷「電子煙好不好？」時，阿政犯了什麼錯誤？
    options:
      B: 查找科學影片去證實想法
      C: 毫不懷疑，直接相信網紅的實驗
      D: 對電子煙充滿好奇心
    rationale: 第六段，阿政看的兩部影片都有問題
  - index: 4
    answer: D
    stem: 「社會上多的是『指鹿為馬』的人，常常亂說話混淆大眾視聽，所以閱讀媒體報導時，不可不慎。」請問『指鹿為馬』不可用哪個詞語替換？（D比喻愚賢不一、高低程度不一樣的人混在一起）
    options:
      A: 顛倒黑白
      B: 是非不分
      C: 扭曲事實
      D: 龍蛇混雜
    rationale: null
  - index: 5
    answer: A
    stem: 請問何種情況最不符合本文所說的「理性判斷、聰明識讀」呢？
    options:
      A: 高人氣網紅製作、在網路上瘋傳的影片的可信度一定較高
      B: 看到吸引我的訊息時，我會想一想傳播者的動機是什麼
      C: 我可以用關鍵詞在Google上搜尋，查證新聞的正確性
      D: 投票前夕突然出現對某陣營特別不利的消息，我會特別小心
    rationale: A要先蒐證再下判斷，不可人云亦云。
