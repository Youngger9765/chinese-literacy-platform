  notes:
    target_words: '⚠️ 灰框列的 11 個語詞與三大題「本課語詞」框的 11 個**不完全相同**：

      灰框多了「行銷手法」、少了「偽科學」。而格子裡**兩個都被圈起來**，

      所以答案路徑有 12 條、比灰框的 11 個多一條（多的是「偽科學」）。照原稿記錄。'
    answer_paths: '12 條路徑，逐格取字皆能拼回，格子沒有錯字。

      ✅ 幾何交叉驗證：`roundRect` 紙上 13 個、紙外 0 個，而路徑 12 條 ——

      **多出來的那一個不是漏抓的答案，是「灰框」本身**：它 6.48×1.30 in、

      `fill=bg1` `line=bg1`（灰底灰框），就是框住語詞清單的那個外框，

      其餘 12 個都是 accent2／E97132 的細長框。

      （同型：L0053 的第 11 個 roundRect 也是灰框。）

      ⚠️ 「相提並論」與「長期提款機」**共用第 6 列第 5 欄的「提」**（兩條斜線交叉），

      不是重複圈選；格子裡另有一個「提」在第 9 列第 8 欄，但接不出完整語詞。'
