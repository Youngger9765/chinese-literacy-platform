intro: 這篇文章介紹了兩種常見的網紅電子煙實驗影片。影片中，網紅透過模擬實驗和親身示範，試圖證明電子煙的安全性。然而，作者指出這些實驗方法存在許多問題，例如實驗條件不嚴謹、混淆不同物質的危害，以及將食用與吸入對身體的影響混為一談。文章進一步分析了電子煙業者如何利用行銷手法吸引年輕族群，並提醒讀者要仔細辨識網路資訊，了解電子煙的真實危害，才能避免落入偽科學和菸害的陷阱。
