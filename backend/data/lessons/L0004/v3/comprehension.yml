lesson_uid: L0004
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列選項「  」中的語詞，何者使用正確？
    options:
      A: 經過多年的努力，他終於打破紀錄，攀上了「深淵」
      B: 美國暫緩提升關稅後，大家都密切關注市場「動向」
      C: 春天已經悄悄來臨，時不時都能看見路邊「心花怒放」
      D: 他對公司「揮之不去」，儘管時常加班，他也無怨無尤
    option_corrections:
      A: 宜改為「高峰」
      C: 宜改為「小花綻放」
      D: 宜改為「忠心耿耿」
  - index: 2
    answer: C
    stem: 根據第三段，「（這些念頭）像是一群停不下來的蜜蜂，在腦袋裡嗡嗡作響」這句話最可能表現出作者當時的什麼狀態？
    options:
      A: 手足無措，對於未來感到一片茫然
      B: 活力四射，腦海中有大量靈感出現
      C: 煩亂不堪，無法停止各種胡思亂想
      D: 緊張無比，深怕自己做錯了什麼事
    teacher_note: 從前後文可推知這樣的狀態讓作者十分困擾，所以選(C)
  - index: 3
    answer: D
    stem: 根據文章結尾「也許只要他再對我笑一次，這些煩惱又會立刻煙消雲散吧。」下列選項何者最貼近這句話的背後意涵？
    options:
      A: 強調任何煩惱都該要用微笑面對
      B: 強調煩惱像煙霧消散，不用掛心
      C: 強調已準備放下對方，一笑置之
      D: 強調對方對自己的情緒影響極大
    teacher_note: 從文章可知作者心情的起伏都和對方有關。
  - index: 4
    answer: A
    stem: 根據本文標題「喜歡是什麼」及內容，下列敘述何者最貼近作者答案？
    options:
      A: 喜歡是颱風來臨時的海浪，高高低低，且難以控制
      B: 喜歡是大雨過後的彩虹，繽紛美好，卻也無法久留
      C: 喜歡是遲遲無法擺脫的惡夢，時刻相伴，無處可逃
      D: 喜歡是童年時的糖果，讓人滿口都甜蜜，心情愉快
    teacher_note: 從文章可知作者因為這份情感而心情起伏劇烈。
  - index: 5
    answer: D
    stem: 根據品格聚光燈的練習，下列何者對於「事件─想法─感受」的理解較為合適？
    options:
      A: 橘子：每個人在相同的事件中都有相同的感受
      B: 步美：比起想法，事件對感受的影響更為直接
      C: 靜香：越快對事件下判斷就越能保持平靜喜悅
      D: 小葵：釐清對事件的想法有助於自己調適心情
    teacher_note: '(A)每個人感受不同(B)想法影響感受更多

      (C)應盡量避免太快下判斷。'
