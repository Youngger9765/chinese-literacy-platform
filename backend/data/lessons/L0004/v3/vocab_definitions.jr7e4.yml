vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 亂竄
  - 動向
  - 揮之不去
  - 起伏
  - 深淵
  - 煙消雲散
  - 偵測
  - 不是滋味
  - 雀躍
