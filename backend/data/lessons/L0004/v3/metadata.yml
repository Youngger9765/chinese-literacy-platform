strategy_explained: 這篇文章帶你練習「認識自己的感覺」，就像偵探一樣，仔細看看心裡有什麼想法和情緒在跑跳，因為文章裡作者常常忽喜忽憂，讓你感覺自己也跟著心情七上八下，讀的時候不妨想像自己是作者，問問自己「為什麼我會有這種感覺呢」
