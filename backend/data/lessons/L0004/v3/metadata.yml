intro: 這篇文章記錄了作者最近心情上的劇烈變化，她發現自己對某位同學產生了特別的關注，上課時會不自覺地觀察對方，下課時也希望能有更多相處的機會。然而，當看到對方和其他人互動愉快時，作者又會感到失落和不安，腦中充滿了各種猜測和擔憂。這種忽喜忽憂的情緒起伏，讓作者感到困惑和疲憊，她開始思考「喜歡」究竟是什麼樣的感覺，以及為什麼喜歡一個人反而會帶來這麼多複雜的情緒。
