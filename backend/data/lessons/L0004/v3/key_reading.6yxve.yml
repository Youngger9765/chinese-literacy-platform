  passage: 然而最近我更發現當他和其他同學聊天聊得很開心，我的胸口就會被抓緊，心裡很不是滋味，也開始胡思亂想：他是不是喜歡那個很幽默的同學？他們會不會常常傳訊息？他跟我聊天有這麼開心嗎？還是我根本不特別？這些念頭在我腦中亂竄，有時候一閃而過，但有時候卻揮之不去，像是一群停不下來的蜜蜂，在腦袋裡嗡嗡作響，也讓我越想越難過。
