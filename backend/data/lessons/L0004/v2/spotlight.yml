spotlight:
  lesson: G4-L13
  strategy_name: 品格力-自我覺察─想法與情緒的關係
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：(沒有標準答案，請依據你自己的想法、感受判斷)
  - type: table
    rows:
    - - 事件
      - 背後可能的想法（單選）
      - 情緒感受
    - - 1.看見喜歡的人與別人談笑
      - □①我沒有那個人幽默風趣□②他真棒，能和這麼多人打成一片
      - 不是滋味
    - - 2.他（喜歡的人）下課沒有來找我
      - □①我是不是沒那麼重要？□②今天他另有重要的事要做
      - 沮喪失落
    - - 3.下課時和喜歡的人說到話或對到眼
      - □①對他來說，我一定不只是普通同學□②我可以繼續觀察我們的關係變化
      - 雀躍欣喜
  - type: guide
    text: ☆勾完後，再看看沒有勾選的選項，那樣的想法所帶來的情緒有什麼不同呢？
  - type: guide
    text: ◎接著，我們再來看看更多情境事件，並根據題目的情緒，選擇對應的想法。
  - type: table
    rows:
    - - 事件
      - 背後可能的想法（單選）
      - 情緒感受
    - - 1.上課舉手發言，結果被老師糾正錯誤
      - □①天啊！大家一定覺得我愛現又很蠢□②幸好我有發言，才能得到老師的糾正
      - 踏實、感謝
    - - 2.傳訊息問朋友作業，被未讀未回
      - □①他可能嫌我太煩、太笨所以不想回□②他可能在忙，我先問問看其他人
      - 焦慮、失落
    - - 3.放學的時候，朋友沒等我一起走
      - □①他今天是不是有什麼急事呢？□②是我做錯了什麼嗎？他想刻意避開我
      - 平靜、好奇
    - - 4.同學在群組約大家看電影，沒有標註我
      - □①他們可能以為我一定會去了□②他們是不是想排擠我？故意針對我？
      - 傷心、憤怒
    - - 5.同學主動幫我處理老師交代的任務
      - □①同學好熱心，也為我省下了不少時間□②他好瞧不起我，不相信我可以做好
      - 開心、溫暖
  - type: guide
    text: ◎根據上面的回答，請試著歸納，能帶來平靜、好心情的想法多半具備下列哪些特質呢？
  - type: passage
    source: unknown
    paragraphs:
    - 回到文章，我們會看見，作者雖然是因為那份「喜歡」，所以十分在乎對方，以至於心情劇烈起伏，但影響情緒的關鍵也包含他的想法。所以當我們學會覺察想法，就能慢慢讓情緒變得穩定、有力量❤︎
