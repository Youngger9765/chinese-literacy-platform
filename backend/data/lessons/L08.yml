fill_in_blank:
- sentence: 夜深了，請把電視機的音量轉小，以免(　　)他人的睡眠。
  answer: D
- sentence: (　　)強的人，工作效率更高、產出品質更好，也更有競爭力。
  answer: Ａ
- sentence: 這次的辯論比賽，反方陷入(　　)，勝算不大。，落差很大。
  answer: E
- sentence: 他(　　)甚嚴，從不做損人利己或違法犯紀的事。
  answer: Ｂ
- sentence: 隨著國民平均所得的提高，國人也越來越(　　)生活品質。
  answer: Ｃ
multiple_choice:
- question: 請問第三段中寫到「注重」，最可能的解釋為何?
  options:
  - 注意、重視。（注重）
  - 將視線注意在一點上。（注目）
  - 集中注意力，精神專注。
  - 上天早已決定，非人力所能改變。（注定）
  answer: C
  explanation: 全神貫注
- question: 楊勇緯能擊敗哥哥的關鍵原因是什麼呢？
  options:
  - 哥哥在比賽中禮讓弟弟。
  - 楊勇緯天生比哥哥厲害。
  - 楊勇緯三年級就學柔道。
  - 楊勇緯不斷地精進自己。（第二段）
  answer: D
  explanation: 第二段
- question: 楊勇緯說「我的目標是金牌！」，你認為他說這句話的心情是什麼？
  options:
  - 憤怒，因為被判犯規輸給對手。
  - 不甘心，因為沒為臺灣拿到金牌。
  - 驕傲，獲得臺灣柔道奧運銀牌。
  - 恐懼，因為達不成人民的期望。
  answer: B
  explanation: 第四段，楊勇緯眼眶泛紅，激動的說「想拿金牌！」
- question: 在比賽中，若遇到外在干擾，文中提到可以用哪些步驟專注於比賽中？
  options:
  - 遇到挫折思考意義幫助成長。
  - 提早到校勤於練習精益求精。
  - 深深呼吸調整心情重新思考。
  - 雙手緊握仔細觀察壓制對手。
  answer: C
  explanation: 第三段，先深呼吸冷靜，再調整好些什麼，好讓自己多一點機會。
- question: 請你就作者觀點，試著為本文選出合適的結語。
  options:
  - 思考會讓你的思想更強大。
  - 不怕你犯錯，只要你改過。
  - 人生要學習放慢腳步，才能欣賞沿途的美景。
  - 走過的路不會白費，每一次的失敗都有獲得。
  answer: D
  explanation: 第六段，因為失
