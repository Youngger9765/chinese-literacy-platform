vocabulary:
- word: 劣勢
  definition: 條件或處境較差的形勢。
- word: 不得閒
  definition: 連短暫的時間都不會休息
- word: 按部就班
  definition: 做事依照一定的步驟。
- word: 過關斬將
  definition: 克服一連串的困難，達成目標。
- word: 心理素質
  definition: 心理學上指人的某些先天的個性、特點。
- word: 大滿貫
  definition: 指同一年在某項運動中，贏得所有錦標賽或比賽。
- word: 注重
  definition: 特別看重。
- word: 干擾
  definition: 擾亂、打擾。
- word: 自律
  definition: 規範、要求自己。
- word: 壓制
  definition: 一種柔道動作。以身軀伏壓對手，使之無法反抗。
