multiple_choice:
- question: 第一段陳彥博為亞洲創下了什麼成就?
  options:
  - 勇奪四大極地超級馬拉松巡迴賽總冠軍。（第一段）
  - 醫生告知他得了咽喉癌，但他成功復原。
  - 高中時即為田徑長跑選手，有亮眼成績。
  - 他克服家人與醫生的勸說，不放棄夢想。
  answer: A
  explanation: 第一段
- question: 第三段陳彥博意外的遇到一段「插曲」，這裡的插曲指的是什麼事件？
  options:
  - 他再也不能跑步了。
  - 醫生告知他得癌症。（第四段）
  - 害怕麻醉後醒不來。
  - 肌肉強度都不見了。
  answer: B
  explanation: 第四段
- question: 為什麼陳彥博說磁北極六百五十公里極限馬拉松是他的夢想起點？
  options:
  - 因為他獲得好成績，也有成就感，所以願意繼續挑戰。
  - 他夢想五年內挑戰世界七大洲、八大站的超級馬拉松。
  - 他認為夢想存在的價值在於制定計畫並且勇於執行。
  - 他利用這場賽事進行肌肉復健，加速復健的速度。
  answer: D
  explanation: 第二段，給他的感動無可言
- question: 第六段，陳彥博超越自己「極限」，這裡「極限」指的是什麼事情呢？
  options:
  - 跑出極地馬拉松的世界紀錄。
  - 克服癌症，完成自己的夢想。
  - 磁北極極限馬松獲得第三名。
  - 他成功登上喜馬拉雅的高山。
  answer: B
  explanation: 第四段及第六段
- question: 你覺得下列選項中，哪一項最能強調陳彥博的精神？
  options:
  - 充滿智慧，眼光長遠。
  - 寬宏大量，有容乃大。
  - 不屈不撓，永不放棄。（第六段）
  - 身體強壯，精力過人。
  answer: C
  explanation: 第六段
