lesson_uid: L0133
version_id: v3
section_no: 三
spotlight:
  strategy_name: 圖文整合閱讀策略──看圖、找對應、整合文圖
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: '紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）10 個，PDF p3~p5 全部可見；

    步驟❶第 1、2 小題的答案是橘色手寫，也在文字層。'
  note: '步驟❷第 2~4 題的選項在原稿是「操作➜結果」，那個 ➜ 是 w:sym Wingdings F0E0，

    **不在 w:t 文字流**。選項照原稿保留箭號，但在箭號前後斷行（HTML 會把換行收成空格，

    畫面上仍是一行），這樣逐字門切段後兩側都比得到，箭號本身不會被誤判成抄錯。'
  blocks:
  - type: concept_box
    text: '許多文章裡的圖，經常不只是裝飾，而是幫助讀者理解的重要訊息。讀有圖的文章時，不能只看文字，也不能只看圖片，而要在文字和圖片之間來回對照。這一課我們先練習一個常用的方法：先快速看圖，再看文字。接著我們要練習用底下的4個步驟，學圖文整合閱讀策略：

      ❶先看圖——看圖整體、箭頭、標號和文字說明，預測主旨

      ❷找對應文字——一邊讀文字，一邊回到圖中找對應

      ❸整合文圖——把文字和插圖合起來想，文圖要表達什麼

      ❹檢查理解——不確定，就回去重讀'
  - type: guide
    text: 步驟❶：先看圖——看圖整體、箭頭、標號和文字說明，預測主旨
  - type: guide
    text: 小祕訣：看圖，先看整體，不用急著讀細節。先看看這張圖裡有幾種情況，從圖猜猜看這課主要在談什麼？（試著依以下步驟讀圖）
  - type: free_text
    prompt: 1.圖一的標題是：【　】
    answers:
    - 巴斯德鵝頸瓶實驗的設計與程序
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: free_text
    prompt: 2.實驗共有幾個情境？【　】個。
    answers:
    - 三
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: single
    prompt: 3.圖一的每一列要依什麼方向閱讀？（單選）
    options:
      1: 由左到右，依箭頭看操作與結果
      2: 由右到左，先看結果再看操作
    answer: 1
  - type: single
    prompt: 4.三種情境一開始有什麼相同處？（單選）
    options:
      1: 都先把肉湯煮沸
      2: 都先折斷瓶頸
    answer: 1
  - type: single
    prompt: 5.根據圖一，你猜這篇文章最可能想回答哪一個問題？（單選）
    options:
      1: 肉湯顏色和加熱的時間長短有沒有關係
      2: 肉湯腐敗和瓶子的處理方式有沒有關係
    answer: 2
  - type: guide
    text: 步驟❷：文字和圖片對應——一邊讀文字，一邊回到圖中找對應
  - type: guide
    text: 小祕訣：仔細讀文章，讀到和圖片有關的文字，看一下圖，找跟圖有關的訊息。
  - type: single
    prompt: 1.圖一主要對應課文哪一段？
    options:
      1: 第1～2段：研究問題與假設
      2: 第3段：實驗方法與結果
      3: 第4～5段：結論與研究影響
    answer: 2
  - type: single
    prompt: 2.「鵝頸瓶保持開口，外界空氣仍可進入，但空氣中的微生物會被彎曲的瓶頸攔住，沉積在頸部，無法進入肉湯」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
    options:
      1: '情境❶-瓶頸彎曲，瓶口保持開放

        ➜

        肉湯沒有腐敗'
      2: '情境❷-瓶頸被打斷，瓶口直接外露

        ➜

        肉湯臭了'
      3: '情境❸-瓶身傾斜，肉湯流到瓶口

        ➜

        肉湯臭了'
    answer: 1
  - type: single
    prompt: 3.「將瓶頸折斷後靜置，空氣中若有微生物，就會直接落入湯裡」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
    options:
      1: '情境❶-瓶頸彎曲，瓶口保持開放

        ➜

        肉湯沒有腐敗'
      2: '情境❷-瓶頸被打斷，瓶口直接外露

        ➜

        肉湯臭了'
      3: '情境❸-瓶身傾斜，肉湯流到瓶口

        ➜

        肉湯臭了'
    answer: 2
  - type: single
    prompt: 4.「把瓶身傾斜，讓肉湯流到瓶口」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
    options:
      1: '情境❶-瓶頸彎曲，瓶口保持開放

        ➜

        肉湯沒有腐敗'
      2: '情境❷-瓶頸被打斷，瓶口直接外露

        ➜

        肉湯臭了'
      3: '情境❸-瓶身傾斜，肉湯流到瓶口

        ➜

        肉湯臭了'
    answer: 3
  - type: multi
    prompt: 5.圖一主要幫助你理解哪些訊息？（可複選）
    options:
      1: 三種情境的操作順序
      2: 三種情境的實驗結果
      3: 微生物為什麼會造成腐敗
      4: 這項研究對公共衛生的影響
    answers:
    - 1
    - 2
  - type: guide
    text: 步驟❸：文圖整合——把文字和插圖合起來想，這課要表達什麼？
  - type: single
    prompt: 下面哪一句，最能把文字和插圖的意思一起說清楚？（單選）
    options:
      1: 巴斯德比較三種情況後發現，肉湯腐敗和微生物污染有關
      2: 巴斯德比較三種情況後發現，只要肉湯接觸空氣就會腐敗
    answer: 1
  - type: guide
    text: 步驟❹：檢查理解——不確定，就回去重讀
  - type: free_text
    prompt: 看著圖，說說看：巴斯德想證明什麼？說不清楚，就回到文字再讀一次。
    no_correct_answer: true
    answer_carrier: 學生口說，原稿無答案
  - type: self_check
    title: ◎自我檢核
    instruction: 請你勾選下面 4 項，檢查自己是否學會閱讀圖文文章的方法。
    items:
    - 1.我會找出文章裡要看圖的地方。
    - 2.我會從圖中找到和文字對應的訊息。
    - 3.我會把文和圖合起來想，判斷它們的重點。
    - 4.我覺得看圖減輕理解文字的負擔，有助於理解文章。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
