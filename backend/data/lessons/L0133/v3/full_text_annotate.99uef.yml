full_text_annotate:
  instruction: '※閱讀前，先快速看過課文和圖一。

    ※閱讀時，看到「如圖一」或情境❶、❷、❸，就回到圖中找出相對應的位置。'
  explanation_box: 說明：圖文題在近年會考國文科的題數大幅增加——105年的會考只有1題，到了114年，會考的圖文題則增加到9題。圖文題就是「文字帶著插圖」的題目，這裡的圖，可能是流程圖、示意圖、地圖或統計圖。遇到圖文題時，你不能只看文字，也不能只看插圖，眼睛必須在文字和插圖中來回移動，把文圖之間的關係弄清楚，才能又快又正確地答題。這一課我們就用一個科學史上有名的實驗，來學習如何閱讀、解答圖文題。
  title_line: '第12課 看不見的兇手：

    以實驗破解肉湯腐敗之謎'
  paragraph_count: 5
  paragraphs:
  - idx: 1
    text: 「為什麼煮好的肉湯，過了幾天就會腐敗，變酸發臭，甚至長蟲？」在還沒有顯微鏡的時代，人類還不知道有細菌等微生物的存在，對這個問題，最普遍的解釋是「自然發生說」——肉湯之所以會壞掉，是因為湯裡具備某些特殊條件，讓無生命的物質變成生命。只要溫度、濕度與空氣合適，肉湯裡就會自己長出生物，導致腐敗。
  - idx: 2
    text: 但法國的科學家巴斯德卻有一個新的說法，他認為，也許是有人類看不見的微生物造成肉湯腐敗。滾燙的肉湯涼了以後，空氣中的微生物掉進湯裡，就導致了肉湯腐敗。根據這個解釋，巴斯德提出假設：「只要把肉湯煮沸，並且阻止空氣中的微生物落入湯裡，肉湯即使接觸空氣，應該也不會腐敗。」
  - idx: 3
    text: 為了檢驗這個假設，1865年，他設計了如圖一所示的鵝頸玻璃瓶，並比較三種情境，三種情境都先把瓶中的肉湯煮沸。情境❶：讓鵝頸瓶保持開口，外界空氣仍可進入，但空氣中的微生物會被彎曲的瓶頸攔住，沉積在頸部，無法進入肉湯。經過很長時間，瓶中的肉湯仍然清澈，沒有腐敗。情境❷：巴斯德將瓶頸折斷後靜置，空氣中若有微生物，就會直接落入湯裡；情境❸：他把瓶身傾斜，讓肉湯流到瓶口，接觸到瓶口可能存在的微生物。結果，在情境❷、❸中，肉湯很快就腐敗、發臭。
  - idx: 4
    text: 這些結果支持了巴斯德的假設——肉湯腐敗，是環境中原本存在的微生物進入肉湯所造成。巴斯德的結論是：生物只能來自既有生物，腐敗與微生物污染有關。他進一步主張，若要減少食物腐敗、預防疾病，就要設法控制微生物的來源與傳播。
  - idx: 5
    text: 巴斯德的鵝頸瓶實驗不只回答了生命是否會自然產生的問題，也改變了醫學、生物學與公共衛生的發展方向。今天，日常生活中的食物消毒、器具滅菌、無菌操作，以及疫情期間強調洗手、戴口罩等做法，都與這項研究的精神息息相關。
