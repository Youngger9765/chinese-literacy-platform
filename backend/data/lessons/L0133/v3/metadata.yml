intro: 這篇文章介紹了法國科學家巴斯德如何透過一個巧妙的實驗，破解了肉湯腐敗的原因。在過去，人們普遍認為無生命的物質在適當條件下可以自行產生生命，進而導致食物腐敗。然而，巴斯德提出了不同的看法，他認為是肉眼看不見的微生物造成了肉湯的腐敗。文章描述了巴斯德如何設計「鵝頸瓶」實驗，並比較了不同情境下的肉湯變化，藉此探討空氣中的微生物是否是導致肉湯腐敗的關鍵。透過這個實驗，巴斯德的發現不僅回答了關於生命起源的疑問，也對後來的醫學、生物學和公共衛生產生了深遠的影響。
