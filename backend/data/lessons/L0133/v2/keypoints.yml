  - label: 研究問題/舊解釋（段1）
    value: '研究問題：為什麼煮好的肉湯，過幾天會__？

      當年的解釋：__：因為湯裡具備某些特殊的條件，會讓無生命的物質變成生命。'
    blanks:
    - answer: 腐敗／變酸發臭
      hint: ''
    - answer: 自然發生說
      hint: ''
  - label: 新的說法/假設（段2）
    value: '新說法：巴斯德認為，肉湯腐敗可能和空氣中的__有關。

      假設：只要把肉湯__，並且阻止微生物落入湯裡，肉湯即使__，也不會腐敗。'
    blanks:
    - answer: 微生物
      hint: ''
    - answer: 煮沸
      hint: ''
    - answer: 接觸空氣
      hint: ''
  - label: 實驗方法與結果（段3)
    value: '情境❶：瓶頸__，瓶口開放，空氣可進入，但微生物被攔住；結果肉湯__。

      情境❷：把瓶頸__，微生物可直接進入；結果肉湯__。

      情境❸：把瓶身__，讓肉湯流到瓶口、接觸微生物；結果肉湯__。'
    blanks:
    - answer: 保持完整
      hint: ''
    - answer: 沒有腐敗
      hint: ''
    - answer: 折斷
      hint: ''
    - answer: 腐敗了／臭掉了
      hint: ''
    - answer: 傾斜
      hint: ''
    - answer: 腐敗了／臭掉了
      hint: ''
