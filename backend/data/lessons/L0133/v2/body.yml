source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 「為什麼煮好的肉湯，過了幾天就會腐敗，變酸發臭，甚至長蟲？」在還沒有顯微鏡的時代，人類還不知道有細菌等微生物的存在，對這個問題，最普遍的解釋是「自然發生說」——肉湯之所以會壞掉，是因為湯裡具備某些特殊條件，讓無生命的物質變成生命。只要溫度、濕度與空氣合適，肉湯裡就會自己長出生物，導致腐敗。
- 但法國的科學家巴斯德卻有一個新的說法，他認為，也許是有人類看不見的微生物造成肉湯腐敗。滾燙的肉湯涼了以後，空氣中的微生物掉進湯裡，就導致了肉湯腐敗。根據這個解釋，巴斯德提出假設：「只要把肉湯煮沸，並且阻止空氣中的微生物落入湯裡，肉湯即使接觸空氣，應該也不會腐敗。」
- 為了檢驗這個假設，1865年，他設計了如圖一所示的鵝頸玻璃瓶，並比較三種情境，三種情境都先把瓶中的肉湯煮沸。情境❶：讓鵝頸瓶保持開口，外界空氣仍可進入，但空氣中的微生物會被彎曲的瓶頸攔住，沉積在頸部，無法進入肉湯。經過很長時間，瓶中的肉湯仍然清澈，沒有腐敗。情境❷：巴斯德將瓶頸折斷後靜置，空氣中若有微生物，就會直接落入湯裡；情境❸：他把瓶身傾斜，讓肉湯流到瓶口，接觸到瓶口可能存在的微生物。結果，在情境❷、❸中，肉湯很快就腐敗、發臭。
- 這些結果支持了巴斯德的假設——肉湯腐敗，是環境中原本存在的微生物進入肉湯所造成。巴斯德的結論是：生物只能來自既有生物，腐敗與微生物污染有關。他進一步主張，若要減少食物腐敗、預防疾病，就要設法控制微生物的來源與傳播。
- 巴斯德的鵝頸瓶實驗不只回答了生命是否會自然產生的問題，也改變了醫學、生物學與公共衛生的發展方向。今天，日常生活中的食物消毒、器具滅菌、無菌操作，以及疫情期間強調洗手、戴口罩等做法，都與這項研究的精神息息相關。
