fill_in_blank:
- sentence: 夜晚的星星(　　)著，為夜空增添神祕的美感。
  answer: Ｇ
- sentence: 一大早，他還(　　)，頭腦無法回答困難的數學問題。
  answer: D
- sentence: 恐怖電影中的血腥場面讓人(　　)，心跳加速。
  answer: Ｂ
- sentence: 講師的教學風格非常生動有趣，每一堂課都能夠 (　　)。
  answer: A
- sentence: 警察詢問竊案嫌犯時，嫌犯吞吞吐吐、眼神閃躲，(　　)。
  answer: C
- sentence: 為什麼小明上課都很想睡覺？→因為□昨晚小明太晚睡 □小明是懶惰蟲。
  answer: 昨晚小明太晚睡
- sentence: 如何解決問題/結論：設定玩電動的時間，早點休息　　　 　       　。
  answer: 確保充足睡眠，維持規律作息
multiple_choice:
- question: 下列語詞何者用法使用正確？
  options:
  - 面對惡犬，他「毛骨悚然」，完全不畏懼。
  - 「乍見」新年的曙光，讓人內心雀躍不已。
  - 他能言善道，完全不像個「喑啞」人士。
  - 這棟鬼屋傳說眾多，真是「窮凶極惡」之地。
  answer: B
  explanation: A錯：前後句矛盾；C錯：前後矛盾，瘖啞人士不會說話；D錯：通常形容人罪大惡極
- question: 有關「睡眠癱瘓症」的描述，何者正確？
  options:
  - 通常發生在睡眠時的深睡期。
  - 絕大多數的人會頻繁發生睡眠癱瘓。
  - 作噩夢時，身體可以自由移動。
  - 癱瘓現象是人體在睡眠中的保護機制。
  answer: D
  explanation: 課文中雖未直接說明「睡眠癱瘓症」，但其定義的「癱瘓」與選項D提及的「癱瘓現象」概念相關，且選項D符合「靈異與科學」此課主題中科學解釋現象的精神。
- question: 人們常常聽到「鬼火」與「鬼壓床」的經驗，請問兩者的共同之處為何？
  options:
  - 都是鬼魂想要向人世間傳達訊息的一種手段。
  - 只有在深度睡眠時期，才可能會發生這種現象。
  - 都是人類對未知事物的恐懼感所產生的解釋。
  - 都是身體的自我保護，以避免人在黑暗中受傷。
  answer: C
  explanation: 因為人對未知事物的恐懼，才把一釋。
- question: 依據本文結論，如果遇到超自然事件時，哪一個選項不符合現代科學的精神？
  options:
  - 調整思考，依據科學的角度去解釋異狀。
  - 心理治療，透過專業協助，找到問題的根源。
  - 身體檢查，看看是否有腦部或癲癇等疾病。
  - 敬畏鬼神，常去廟裡收驚、拜拜、保平安。
  answer: D
  explanation: 依據本文結尾理性的科學方法，將可以幫助我們更進一步對現象有客觀的認識，所以未必每件事都是鬼怪之說。
- question: 解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。以「止癢」為例，請將代號依步驟排出正確的順序。
  options:
  - 乙甲丙
  - 乙丙甲
  - 甲乙丙。
  - 丙乙甲。
  answer: C
  explanation: 題目中明確指出解決科學問題的步驟為(1)提出問題→(2)提出假設→(3)檢驗假設。若將這些步驟依序對應為甲、乙、丙，則正確的順序即為甲乙丙。
