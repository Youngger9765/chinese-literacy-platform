spotlight:
  lesson: G6-L10
  strategy_name: 摘要策略-問題.解決.結果找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: 一、整理「問題—解決—結果」
  - type: passage
    source: unknown
    paragraphs:
    - 現在要給你一個比較難的任務哦，請你用前兩課學到的方法，找出本課的「問題、解決、結果」。這次多加一個挑戰，請你先找出「問題、解決」在哪個段落，寫在括弧內。（答案合理即可）
  - type: fill_table
  - type: guide
    text: 二、把重點合起來
  - type: single
    prompt: 綜合前面找到的「問題、解決、結果」，哪一句最能完整整理全文重點？
    options:
    - 亞洲香料十分珍貴，瑪莉購買股票、領取股利，最後把股票賣給文森。
    - 遠洋航行費用龐大，荷蘭人發行股票集合資金，使平民能參與投資，公司也能完成大型計畫。
    answer: 遠洋航行費用龐大，荷蘭人發行股票集合資金，使平民能參與投資，公司也能完成大型計畫。
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。六閱讀理解六閱讀理解
  - type: self_check
    items:
    - 我能自己找出「問題、解決、結果」所在的段落。
    - 我能自己找出文章的問題、解決和結果。
