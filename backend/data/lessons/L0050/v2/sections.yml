comprehension:
  questions:
  - index: 1
    answer: D
    stem: 下列句子中，哪一個語詞使用是錯誤的？
    options:
      A: 為了存錢買電腦，每天「節衣縮食」，連飲料都不買
      C: 公司決定「派遣」專家前往災區，協助災後重建
      D: 學校「集資」了三位同學代表參加全國比賽，大家都很期待
    rationale: 「集資」的意思是大家出錢，D應該是「派遣」或「推選」
  - index: 2
    answer: D
    stem: 文中說「四百多年前，要展開一場長途遠洋探險可不容易」，下列哪一項不是造成當時遠航困難的原因？
    options:
      A: 需要造船和準備大量糧食
      B: 船員可能遭遇疾病或受傷
      C: 航行中要應付壞天氣和海盜
      D: 香料價格太低無法回本
    rationale: null
  - index: 3
    answer: A
    stem: 本文提到「瑪莉、達安和奧倫治這三個背景不同的人都成為股東」，作者舉這個例子最主要是想說明股票制度的什麼特點？
    options:
      B: 股東的股票下跌，公司無法付出股利
      C: 公司要賠錢給每一位投資的股東
      D: 公司會先欠著股東錢，等賺錢了再還
      A: 公司仍然會發放給股東18%的股利
    rationale: 文中說明股票發明後連平民百姓都可以參與投資了。
  - index: 5
    answer: C
    stem: 這篇課文主要在介紹什麼？
    options:
      A: 瑪莉如何利用股票投資賺了一大筆錢
      B: 十七世紀航海探險的種種危險與高昂成本
      C: 股票制度的起源以及所帶來的影響
      D: 荷蘭人在臺灣建立殖民地的歷史經過
    rationale: 找一找：請圈出格子內的語詞，圈出後，把灰框內的語詞刪除。
