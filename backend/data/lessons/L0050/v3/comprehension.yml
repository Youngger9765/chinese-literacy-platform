lesson_uid: L0050
version_id: v3
section_no: 六
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 答案代號印在題號前的（　）內，文字流已含，非圖形層
  items:
  - index: 1
    answer: D
    stem: 下列句子中，哪一個語詞使用是錯誤的？
    options:
      A: 為了存錢買電腦，每天「節衣縮食」，連飲料都不買
      B: 為了替校隊加油，校長「大手一揮」，決定購買一批全新的運動服
      C: 公司決定「派遣」專家前往災區，協助災後重建
      D: 學校「集資」了三位同學代表參加全國比賽，大家都很期待
    teacher_hint: 「集資」的意思是大家出錢，D應該是「派遣」或「推選」
  - index: 2
    answer: D
    stem: 文中說「四百多年前，要展開一場長途遠洋探險可不容易」，下列哪一項不是造成當時遠航困難的原因？
    options:
      A: 需要造船和準備大量糧食
      B: 船員可能遭遇疾病或受傷
      C: 航行中要應付壞天氣和海盜
      D: 香料價格太低無法回本
  - index: 3
    answer: A
    stem: 本文提到「瑪莉、達安和奧倫治這三個背景不同的人都成為股東」，作者舉這個例子最主要是想說明股票制度的什麼特點？
    options:
      A: 股票制度讓不同身分的人都有機會參與投資
      B: 平民比貴族更願意投資，所以比較容易從股票獲利
      C: 遠洋航行太昂貴了，需要很多人出錢才能成行
      D: 窮人無法和富人一起投資，得到的回報是不同的
    teacher_hint: 文中說明股票發明後連平民百姓都可以參與投資了。
  - index: 4
    answer: B
    stem: 荷蘭東印度公司這趟航行賺到錢，因此把股利分給股東；依據這個道理，如果航行遇到颱風，船沉了，下列哪種情況最可能發生？
    options:
      A: 公司仍然會發放給股東18%的股利
      B: 股東的股票下跌，公司無法付出股利
      C: 公司要賠錢給每一位投資的股東
      D: 公司會先欠著股東錢，等賺錢了再還
    teacher_hint: (如果航行失敗沒有賺到錢，甚至是賠錢，股票就可能下跌，無法發放股利給股東。)
  - index: 5
    answer: C
    stem: 這篇課文主要在介紹什麼？
    options:
      A: 瑪莉如何利用股票投資賺了一大筆錢
      B: 十七世紀航海探險的種種危險與高昂成本
      C: 股票制度的起源以及所帶來的影響
      D: 荷蘭人在臺灣建立殖民地的歷史經過
  teacher_hint_carrier: 三則教師註解印在題目右側的小方框內（文字方塊），文字流已含。
