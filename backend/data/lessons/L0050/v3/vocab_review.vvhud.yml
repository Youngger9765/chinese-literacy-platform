  notes:
    answer_paths: '10 個目標語詞全部圈到，roundRect 圖形也正好 10 個（數量相符，不需回頭補格）。

      幾何逐一對得上：4 格垂直（w0.320×h1.527）＝揚帆啟航；rot 51.5°（向左下）4 格對角

      ＝滿手老繭；rot 309.6°（向右下）4 格對角＝大手一揮，兩者在第 5 列第 6 格的「手」交叉，

      是這一課唯一共用格子的一對。「獲利」與「利潤」共用第 8 列第 4 格的「利」。'
    distractor: '格子裡另有同音／形近誘答：第 1 列「陽」對「揚」、第 2 列「楊」對「揚」、

      第 1 列第 8 格「遺」對「遣」、第 7 列第 1~2 格「積蓄」與第 5~6 列第 10 格「儲蓄」

      （總表有「積蓄」但學習單三處都沒列，見 meta._總表_對照note）。逐格取字確認過，

      格子本身**沒有印錯字**。'
