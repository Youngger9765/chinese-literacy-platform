lesson_uid: L0050
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 揚帆啟航
  - 股票
  - 股東
  - 獲利
  - 大手一揮
  - 利潤
  - 派遣
  - 節衣縮食
  - 集資
  - 滿手老繭
  answer_carrier: 橘色手寫體字（文字流已含答案，非圖形層）
  items:
  - index: 1
    word: 股票
    definition: 代表投資一家公司、擁有公司一部分的證明。股票可以買賣，可能賺錢，也可能虧損。
  - index: 2
    word: 利潤
    definition: 收入扣掉成本後，真正賺到的錢。
  - index: 3
    word: 股東
    definition: 擁有公司股票的人。公司獲利時，股東可以分到部分利潤。
  - index: 4
    word: 滿手老繭
    definition: 形容經常做粗重工作，手上長滿又厚又硬的皮。
  - index: 5
    word: 獲利
    definition: 賺到錢。
  - index: 6
    word: 集資
    definition: 為完成某事，向許多人一起籌錢。
  - index: 7
    word: 大手一揮
    definition: 形容人很有氣勢、很爽快的作出決定。
  - index: 8
    word: 揚帆啟航
    definition: 原指升起船帆開始航行；也比喻開始新的旅程、計畫或人生階段。
  - index: 9
    word: 節衣縮食
    definition: 形容生活非常節省。
  - index: 10
    word: 派遣
    definition: 指派某人到某地工作或執行任務。
