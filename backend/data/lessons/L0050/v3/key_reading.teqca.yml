  passage: 這時，荷蘭人有了一個巧妙的構想——大家一起出錢，讓一家公司主導遠洋行動。於是，荷蘭東印度公司（Dutch East India Company）成立了，它是全世界第一家發行「股票」的公司。它把經營公司所需的資金分成許多小份，每一小份就是一張股票。如果人們認為這家公司會賺錢，就可以出錢認購股票，投資這家公司。只要有許多人投資，公司就能集到足夠的經費，組成船隊，揚帆啟航。「投資？那是有錢人的事吧？」你心裡也許會這樣問。股票制度出現前，投資幾乎是君王和貴族的專利。但是，股票出現後，連平民百姓也能參與投資了。例如，假設一趟航行需要1000萬元，荷蘭東印度公司就發行了10萬張股票，每張股票100元。瑪莉是個傭人，她用工作多年存下的1000元買了10張股票；達安是個滿手老繭的水手，他用節衣縮食存下的5000元買了50張股票；奧倫治是個貴族，也是大富翁。他大手一揮，掏出5萬元買了500張股票。
  start_text: 這時，荷蘭人有了一個巧妙的構想——大家一起出錢，
