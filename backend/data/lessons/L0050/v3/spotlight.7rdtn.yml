lesson_uid: L0050
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略—問題—解決—結果找重點
  strategy_type: summary
  section_title_printed: 閱讀聚光燈
  section_no_printed: 五
  blocks:
  - type: concept_box
    text: 這篇文章也是說明文，講「全世界第一張股票」是怎麼誕生的。文章裡也有明顯的問題、解決、結果。前面兩課我們已經學過怎麼用線索，來找到文章中的「問題、解決、結果」，我們再來複習這個祕訣，請你連連看。
  - type: matching
    left_header: 策略
    right_header: 祕訣
    left:
      1: 問題
      2: 解決
      3: 結果
    right:
      A: 通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變，可能出現「結果」、「最後」等關鍵詞。
      B: 通常出現在文章的開頭，描述一個「不好的事或困難」需要解決。
      C: 通常出現在文章中段，你可以找找「有人想出辦法或行動」的句子在哪裡。
    answer:
      1: B
      2: C
      3: A
    answers_printed: true
    answer_carrier: 三條手繪連線（圖形），文字流無此資訊
    answer_evidence_note: '三條線是同一個群組（錨在連線欄），群組內座標：左側錨點 y＝0.000／0.996／1.900，

      右側錨點 y 同三個高度。線段為 左0.000→右0.996、左1.900→右0.000、左0.996→右1.900，

      換算即 1→B、3→A、2→C。與語意獨立吻合（開頭＝問題、中段＝解決、後段＝結果）。

      ⚠️ 這組線在 PDF 上不明顯，且表格跨 p4/p5、圖形整組留在 p5。'
  - type: guide
    text: 一、整理「問題—解決—結果」
  - type: fill_table
    instruction: 現在要給你一個比較難的任務哦，請你用前兩課學到的方法，找出本課的「問題、解決、結果」。這次多加一個挑戰，請你先找出「問題、解決」在哪個段落，寫在括弧內。（答案合理即可）
    columns:
    - 元素/段落
    - 提示
    - 重點
    answer_carrier: 橘色手寫體字（文字流已含答案，非圖形層）
    rows:
    - 元素/段落: '問題

        /（【　】）'
      提示: 描述一個「不好的事或困難」
      重點: '歐洲人遇到什麼困難？

        歐洲人想要航行到亞洲買香料回來賣，【　】'
      元素/段落_blanks:
      - answer: 1～2
      重點_blanks:
      - answer: 遠洋探險需要龐大的費用，任何人都無法單獨承擔
    - 元素/段落: '解決

        /（【　】）'
      提示: 有人想出辦法或行動 (誰＋做什麼)
      重點: '荷蘭人想出什麼方法籌錢？

        荷蘭人成立【　】'
      元素/段落_blanks:
      - answer: '3'
      重點_blanks:
      - answer: 荷蘭東印度公司，並發行股票，讓許多人一起投資
    - 元素/段落: '結果

        / 5、10'
      提示: 行動後，造成了什麼改變？
      重點: '1.對投資者：平民百姓也能【　】

        2.對公司：荷蘭東印度公司【　】'
      元素/段落_note: 這一列的段落「5、10」是原稿印好的（黑色、無括弧），不是學生要填的
      重點_blanks:
      - answer: 參與投資，買股票，成為公司的股東
      - answer: 集到龐大的資金，能派遣船隊遠洋航行，完成大型計畫
  - type: guide
    text: 二、把重點合起來
  - type: single
    prompt: 綜合前面找到的「問題、解決、結果」，哪一句最能完整整理全文重點？
    options:
      1: 亞洲香料十分珍貴，瑪莉購買股票、領取股利，最後把股票賣給文森。
      2: 遠洋航行費用龐大，荷蘭人發行股票集合資金，使平民能參與投資，公司也能完成大型計畫。
    answer: 2
    answers_printed: true
    answer_carrier: 紅色 ☑（Wingdings F0FE，全份原稿唯一一個）
  - type: self_check
    label: ◎自我檢核
    instruction: 請你自己檢查以下項目，確定自己是否會抓重點了。
    items:
    - 1.我能自己找出「問題、解決、結果」所在的段落。
    - 2.我能自己找出文章的問題、解決和結果。
