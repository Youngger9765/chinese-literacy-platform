intro: 這篇文章要帶我們回到四百多年前的荷蘭，看看當時的歐洲人如何因為對珍貴香料的渴望，而想出一個創新的方法。遠洋貿易需要龐大的資金，個人難以負擔，因此，全世界第一家發行股票的公司——荷蘭東印度公司因此誕生。文章將介紹股票制度如何讓不同階層的人都有機會參與投資，集結眾人的力量，支持大型的遠洋計畫，並探討這種集資方式對當時世界產生的影響。
