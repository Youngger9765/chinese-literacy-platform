  總表_對照: '總表 11 個、學習單 10 個，差在**「積蓄」只在總表**：學習單的三處（第三大題語詞框、

    第四大題選項框、第七大題灰框）都是同一組 10 個，一致沒有「積蓄」。

    「積蓄」倒是出現在第七大題的找字格子裡（第 7 列第 1~2 格「積蓄」，另有第 5 列第 10 格

    ＋第 6 列第 10 格的「儲蓄」），是**誘答**不是答案 —— 灰框沒列它，也沒有圈。'
strategy_explained: '這篇文章要帶你練習找出故事的「問題、解決辦法和結果」來抓重點

  因為它介紹了荷蘭東印度公司如何解決遠洋貿易資金不足的「問題」，

  用發行股票這個「解決辦法」來集結眾人力量，

  最後達成遠大目標，這就是它的「結果」，讀的時候可以試著把這些找出來'
