strategy_explained: '這一課我們要練習「從文字裡去猜測」，像是猜阿嬤跟作者的關係，還有他們看事情的角度有什麼不一樣

  這篇文章裡，作者從一開始覺得阿嬤很兇很可怕，到後來發現那是因為愛，這種感覺的轉變，非常適合我們練習去讀懂作者心裡的想法和阿嬤背後的用意

  讀的時候，可以試著想想，作者為什麼會這樣想，阿嬤又為什麼會那樣做，把這些線索找出來，就能更了解他們了'
