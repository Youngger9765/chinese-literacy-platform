lesson_uid: L0110
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案），文字流有此資訊
  teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 1~5 題都有
  questions:
  - index: 1
    answer: D
    stem: 作者在後段補寫阿嬤的成長背景（貧困、威權、階級、被罵而躲桌下），最主要的用意是什麼？
    options:
      A: 把責任推給那個日本警察，他才是造成悲劇的根源
      B: 為了讓故事更曲折熱鬧，以增加故事的戲劇張力
      C: 用阿嬤更辛苦的童年來對照，暗示作者不該計較
      D: 交代阿嬤的成長，開始理解她為何會這樣對待小孩
    teacher_hint: 阿嬤在威權與貧困的環境中長大，被大人用責罵對待，她長大後也容易用同樣方式說話。作者補上這段，是要引導讀者理解
    teacher_hint_note: 藍框內的句子在原稿就以「引導讀者理解」結束，沒有句號、話沒說完，照原樣。
  - index: 2
    answer: A
    stem: 第六段為什麼作者在當兵時，聽到鄰兵啜泣，會不屑地想：「哼，嬌生慣養！」又感謝起阿嬤來？
    options:
      A: 作者覺得班長再兇也不過如此，和阿嬤比起來不算什麼
      B: 作者覺得當兵就是要吃苦，哭出來只會讓家人更難過
      C: 作者覺得鄰兵是想博取同情，好讓班長對他放寬標準
      D: 作者知道成功嶺結訓後，阿嬤會煮一大桌好菜等他回家
    teacher_hint: 第2題解析：作者把班長的吼罵和阿嬤的嚴厲放在同一條尺度上比較，發現自己早已習慣高壓語言，因此覺得班長「也不過如此」。因這種承受力是童年被阿嬤訓練出來的，反而感謝阿嬤
    teacher_hint_note: 這一則藍框印在第七大題標題旁（PDF p10 右上），不在題目旁邊。
  - index: 3
    answer: C
    stem: 作者安排「阿嬤很兇、滿口髒話」與「晚餐滿桌菜、作者擁抱阿嬤」的對照，最主要是在凸顯什麼？
    options:
      A: 阿嬤既然出口粗魯，就不可能真的在乎家人
      B: 阿嬤情緒忽冷忽熱，讓人永遠摸不清她的心思
      C: 愛的表達不只靠言語，也可能藏在照顧與付出裡
      D: 作者懂得討好長輩，所以才換來比較好的對待
    teacher_hint: 作者用「對比」手法照讓讀者看見：同一個人可能用很粗的方式說話，卻用很實際的方式愛人
  - index: 4
    answer: C
    stem: 作者和阿嬤的關係，為什麼會從「又怨又怕、能逃就逃」變成可把阿嬤抱離地面、幽默反酸她？最可能的原因為何？
    options:
      A: 作者長大成為教授後，阿嬤改變了，比較不會罵人了
      B: 作者教會阿嬤心理學裡尊重接納小孩的現代教養觀念
      C: 阿嬤沒有改變，是作者開始正向詮釋自己的童年經驗
      D: 作者長大後，知道要忍耐、吃苦，才能提升家人關係
    teacher_hint: 阿嬤沒有改變，是作者長大後改變了理解與詮釋方式
  - index: 5
    answer: C
    stem: 有同學讀完後說：「這篇文章是在替打罵式教養背書，甚至鼓勵家長用打罵管教。」你認為最貼近本文立場的回應是什麼？
    options:
      A: 沒錯，因為作者最後很感謝，所以他真的在鼓勵打罵
      B: 沒錯，因為作者後來當教授，可見打罵管教很有效果
      C: 不對，本文未推廣打罵，只強調人不是早期經驗決定的
      D: 不對，作者完全否定童年經驗，所以教養方式不重要
    teacher_hint: 文章確實呈現體罰與惡言，但作者最後的焦點放在「詮釋」與「主體性」：同樣的經驗可能造成傷害，也可能被重新理解成某種力量。作者是在分享自己如何理解阿嬤，而不是在下指令說「打罵才對」
