section_no: 五
keypoints:
  title: 我的阿嬤
  layout: list
  answer_carrier: 橘色手寫填空（教師版答案），文字流有此資訊
  rows:
  - label: '阿嬤個性

      （段2-3）'
    value: 1.阿嬤很酷、粗話多、不說禮貌的話，也不會說【　】；她眼裡只看見作者【　】。
    blanks:
    - answer: 我愛你
    - answer: 該改進的地方
  - label: '觀點轉折

      （段4-6）'
    value: '1.作者小時候對阿嬤【　】。長大發現也許不是我【　】，阿嬤連看電視都會挑剔演員。

      2.作者18歲上成功嶺，班長很兇，作者聽見鄰兵啜泣卻覺得他們【　】；反而開始感謝阿嬤，認為這種教養方式對他在軍的【　】有幫助。'
    blanks:
    - answer: 又怨又怕
    - answer: 一無是處
    - answer: 嬌生慣養
    - answer: 心理韌性
  - label: '關係改變

      (段7-8)'
    value: 下成功嶺，作者回家時，晚餐有滿桌子的菜，作者知道那是阿嬤表達愛的方式；但作者開始敢用【　】抗議，阿嬤卻以「我到40歲還不是被打」回應。
    blanks:
    - answer: 尊重接納／無條件關注
  - label: '成熟

      互動關係

      (段9-11)'
    value: 35歲回家，作者動作慢被嫌、唱歌被嫌。作者逮到機會幽默的用玩笑【　】「阿嬤，你牙齒痛是嗎？」阿嬤笑回「我又沒牙齒。」
    blanks:
    - answer: 反酸
  - label: '對阿嬤身世有同情的

      理解

      (段13)'
    value: '1.阿嬤的爸爸滿口髒話，生活拮据，阿嬤13歲就去日本警察家幫傭，警察大人很會罵人。

      2.阿嬤成長在【　】的時代，長大後說話的方式其實就是她小時候被對待的方式。'
    blanks:
    - answer: 威權當道、階級分明
  - label: '結尾

      (段14)'
    value: 作者以教師身分提醒：人不是被【　】決定的，我們可以決定怎麼【　】自己的童年經驗。
    blanks:
    - answer: 早期經驗
    - answer: 詮釋
  rows_note: '第 1、6 列的兩個空格在原稿是黑色印刷（非橘色手寫），其餘空格答案都是橘色 ——

    即「我愛你／該改進的地方／早期經驗／詮釋」四個在文字流裡就是一般顏色。照原樣收錄。'
