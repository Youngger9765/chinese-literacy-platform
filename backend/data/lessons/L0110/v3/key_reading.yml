  passage: 小時候的我，對她真是又怨又怕，能逃就逃。但隨著年齡漸長，我漸漸發現，我常挨罵，也許不是我一無是處——她連看八點檔，都會挑剔演員：「這個人醜到火車都不給坐！」這種教養方式，對我心理韌性的養成有莫大助益。18歲上成功嶺受兩個月的軍訓，我的班長姓李，橫眉豎目，是全營最剽悍的士官。經常從他嘴裡吼出來的名言有：「死老百姓！」「你不想活了？」「你再來有好日子過了。」「我給你當不完的兵！」檢查內務時，會把你的臉盆一腳踢進床底，要你爬進去撈出來，30秒內回復原狀。就寢時，我聽見睡我旁邊的鄰兵在黑暗中啜泣，接著帶動一片哭聲。我心裡就不屑：「哼，嬌生慣養！」開始感謝起阿嬤來。下成功嶺，背著綠色大軍用背包回家。一看到阿嬤，立刻衝過去，把她抱得風雨不透，還抱離地面轉了一圈。阿嬤一邊笑，一邊打我：「你發的什麼瘋？」晚餐桌上擺滿了菜，我知道這是她愛我的方式。大學時，每次回家前，都會特別把長髮剪短，以免挨罵。可一回到家，她就用嫌惡的口吻罵：「頭髮像熊一樣，也不知道去剪！」我已經在大學學了心理學，試著跟她講「完全的尊重接納，無條件的關注」，並且抗議她總是在嫌我罵我。阿嬤笑著說：「說什麼碗糕？我到40歲，我老母還不是拿著竹子打我！」我35歲時，從國外拿了博士回來，在大學教書，第一個寒假回到老家，立刻有了重溫舊夢的機會。幫她釘個木頭架子，她嫌我動作慢：「我看你這樣，做一輩子也做不完。」出門忘了鎖門，她罵：「你讀什麼博士，讀書讀到天邊去了？」連我哼個歌，她也會評論：「你牙齒痛是嗎？」隔天，我居然聽見她在哼著一首老歌：「白牡丹，笑文文……」，我逮到機會笑著反酸：「阿嬤，你牙齒痛是嗎？」阿嬤笑了，露出沒戴假牙的牙床說：「我又沒牙齒。」我姊的女兒小昀，三歲時被帶回老家給我阿嬤薰陶了一個月，台語大有進步。回台北後，我姊幫她洗澡，一不小心眼睛沾了水，小昀大叫：「幹恁婆啊！」我姊大吃一驚，然後大笑起來。薰陶一個月就有如此成效，若相處一年半載，肯定成就非凡哪。阿嬤出生在日治時代的花蓮鄉下，她爸爸是燒石灰的工人，滿口髒話，生活十分拮据，所以，阿嬤13歲就到一位日本警察「大人」家裡幫傭，少女阿嬤非常懼怕這位常罵人的大人，只要他走進家門口，她總是躲在桌子下瑟瑟發抖。阿嬤成長在一個威權當道，階級分明的世代。原來，阿嬤對我們說話的方式，就是她小時候大人對她說話的方式。我在大學教心理學，有位大學生向我哭訴：她媽媽總是對她口出惡言，讓她一輩子痛苦。碰到這類問題，我都會先把阿嬤對我的教養方式說給學生聽，然後做以下的結論：第一，說什麼一輩子，你才幾歲？第二，長大後，當你成為有力量的成人時，再回頭看這些舊事，會有完全不同的詮釋；第三，人不是被早期經驗決定的，我們可以決定怎麼詮釋自己的童年經驗。我很想念阿嬤。如果她還健在，現在已經120歲了。
