  passage: 小時候的我，對她真是又怨又怕，能逃就逃。但隨著年齡漸長，我漸漸發現，我常挨罵，也許不是我一無是處——她連看八點檔，都會挑剔演員：「這個人醜到火車都不給坐！」這種教養方式，對我心理韌性的養成有莫大助益。18歲上成功嶺受兩個月的軍訓，我的班長姓李，橫眉豎目，是全營最剽悍的士官。經常從他嘴裡吼出來的名言有：「死老百姓！」「你不想活了？」「你再來有好日子過了。」「我給你當不完的兵！」檢查內務時，會把你的臉盆一腳踢進床底，要你爬進去撈出來，30秒內回復原狀。就寢時，我聽見睡我旁邊的鄰兵在黑暗中啜泣，接著帶動一片哭聲。我心裡就不屑：「哼，嬌生慣養！」開始感謝起阿嬤來。下成功嶺，背著綠色大軍用背包回家。一看到阿嬤，立刻衝過去，把她抱得風雨不透，還抱離地面轉了一圈。阿嬤一邊笑，一邊打我：「你發的什麼瘋？」晚餐桌上擺滿了菜，我知道這是她愛我的方式。
