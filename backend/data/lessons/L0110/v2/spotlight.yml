spotlight:
  lesson: G8-L12
  strategy_name: 推論策略-推論角色關係與觀點
  strategy_type: main_idea_inference
  blocks:
  - type: single
    prompt: 請選擇
    options:
    - '推論和腦補

      請試著讀底下的文字，再回答一個問題：

      　　「阿嬤在屋裡喊：『過來！』我手心立刻冒汗，連呼吸都放輕，小跑步進房間。」

      問題：作者和阿嬤的關係可能是？【'
    - '很愛阿嬤　　②很怕阿嬤】

      在回答這個簡單的問題時，你已經在做推論了。

      你看，「作者很怕阿嬤」根本就沒有寫出來，但你是怎麼知道的？這就是「推論」，最近的流行語叫做「腦補」。

      閱讀高手的特色之一，就是超級會推論文章沒有寫出來的細節！

      這篇故事，描述了作者和阿嬤之間的互動，故事沒有把他們的關係和想法講白，而是把線索藏在對話、動作和反應裡。

      接下來要做的就是抓住這些線索，推論作者和阿嬤的關係如何改變，並進一步理解作者真正想傳達的意思。'
    answer: '推論和腦補

      請試著讀底下的文字，再回答一個問題：

      　　「阿嬤在屋裡喊：『過來！』我手心立刻冒汗，連呼吸都放輕，小跑步進房間。」

      問題：作者和阿嬤的關係可能是？【'
  - type: table
    rows:
    - - 階段
      - 文章線索及推論想法
    - - 小時候
      - 文章線索
      - '①只看見作者該改進的地方

        ②「再哭一聲看看！」我會立刻噤聲。

        ③她只要大喊我的名字……小朋友立刻神色大變……'
    - - 小時候
      - '推論作者想表達的想法

        （單選）'
      - '①阿嬤很嚴厲，讓我總是戰戰兢兢

        □②阿嬤討厭我，總是修理我、恐嚇我'
    - - 小時候
      - 推論祖孫關係(單選)
      - '阿嬤與作者：

        ①權威者 vs. 服從者　□②照顧者 vs. 被照顧者'
    - - 讀大學時期
      - 文章線索
      - 阿嬤連看八點檔，都會挑剔演員，說他很醜
    - - 讀大學時期
      - '推論作者想表達的想法

        （單選）'
      - '□①我常挨阿嬤罵，是因為我很糟，不夠好

        ②阿嬤愛罵人是她自己的問題，我不必每句話都當真'
    - - 讀大學時期
      - 文章線索
      - 聽見鄰兵啜泣……我心裡不屑：哼，嬌生慣養！開始感謝起阿嬤來。
    - - 讀大學時期
      - '推論作者未寫出的想法

        (單選)'
      - '□①班長本來就該嚴厲，我不懂鄰兵為什麼哭

        ②阿嬤對我的嚴厲，能幫助我適應軍中生活'
    - - 讀大學時期
      - 文章線索
      - （從軍中回家見到阿嬤）把她風雨不透的抱離地面，轉了一個圈。
    - - 讀大學時期
      - '推論作者未寫出的想法

        (3選2)'
      - '□①藉此展現在部隊裡訓練出來的肌肉

        ②很久沒有見到阿嬤，很高興再見到她

        ③不再是小孩了，現在不論身心，我都能輕易面對阿嬤'
    - - 讀大學時期
      - 文章線索
      - 我試著講完全的尊重接納……並抗議她總是在嫌我罵我。
    - - 讀大學時期
      - '推論作者未寫出的想法

        (單選)'
      - '①我們的關係改變了，我不再怕她，可以提不同想法

        □②我進入了反抗期，對什麼都不滿意，都要抗議'
    - - 讀大學時期
      - 文章線索
      - 晚餐有滿桌子的菜，我知道這是她愛我的方式
    - - 讀大學時期
      - '推論作者未寫出的想法

        (單選)'
      - '□①壞脾氣的她，畢竟也有心情好的時候

        ②我開始讀懂她用行動在乎我，雖然說話難聽'
    - - 讀大學時期
      - '推論作者認為自己的角色有了什麼變化？(單選)

        ①從「受壓迫的小孩」「能平等提出不同意見的大人」

        □②從「又怕又怨的小孩」「能夠勇敢反擊的大人」'
    - - '35歲

        ｜

        作者在大學教學'
      - 文章線索
      - '①她嫌我動作慢：「我看你一輩子也做不完。」忘了鎖門，她：「你讀什麼博士？讀到天邊去了？」我哼個歌，她：「你牙齒痛是嗎？」

        ②三歲的小昀被薰陶一個月，也學會說「幹恁婆啊！」'
    - - '35歲

        ｜

        作者在大學教學'
      - '推論作者未寫出的想法

        (單選)'
      - '①在任何情境，不管對誰，阿嬤說話方式從未改變

        □②阿嬤對孩子的口頭霸凌方式歷歷可數'
    - - '35歲

        ｜

        作者在大學教學'
      - 文章線索
      - 作者唱歌被罵，阿嬤唱歌，作者笑著反酸：「阿嬤，你牙齒痛是嗎？」
    - - '35歲

        ｜

        作者在大學教學'
      - '推論作者未寫出的想法

        (單選)'
      - '①祖孫關係改變了，我現在能幽默接住阿嬤的刻薄

        □②從小被罵被酸，我當然要找機會報仇一下'
    - - '35歲

        ｜

        作者在大學教學'
      - 文章線索
      - 阿嬤成長在一個威權當道、級分明的世代。阿嬤對我們說話的方式，就是她小時候大人對她說話的方式。
    - - '35歲

        ｜

        作者在大學教學'
      - '推論作者未寫出的想法


        (單選)'
      - '①我不再怕她，能用幽默接住她的刻薄，也能理解她的成長，並決定如何詮釋自己的童年經驗

        □②我用反酸贏了她，證明我比較厲害，她以後就不敢再罵我了'
    - - '35歲

        ｜

        作者在大學教學'
      - '試著推論作者現在怎麼看待他的阿嬤？

        □①一個沒水準、滿口髒話、家暴小孩、死性不改的長輩

        ②阿嬤愛我，她說話刻薄有其成長背景，我能理解'
  - type: guide
    text: 二、把三個階段串連起來看歷程。(單選)
  - type: free_text
    prompt: 1.互動方式變化（關係）：
  - type: passage
    source: unknown
    paragraphs:
    - 請選出最符合本文「作者×阿嬤」互動方式的變化？
    - 噤聲不敢回→能提出不同想法→能幽默接住刻薄
    - □②噤聲不敢回→越來越反感→逐漸疏離對立
  - type: free_text
    prompt: 2.想法變化路線：
  - type: passage
    source: unknown
    paragraphs:
    - 本文中「作者對阿嬤的想法」，變化歷程為何？(單選)
  - type: single
    prompt: 請選擇
    options:
    - 覺得被討厭→覺得溝通無用→決定遠離她
    - 先求不挨罵→不再句句當真、看懂她的愛→理解脈絡並重新詮釋
    answer: 覺得被討厭→覺得溝通無用→決定遠離她
  - type: guide
    text: 三、從上述作者觀點轉變歷程，本文最想提醒讀者的是什麼?(單選)
  - type: guide
    text: 人不是早期經驗決定的；我們可以選擇怎麼詮釋自己的童年
  - type: multi
    prompt: 請選擇
    options:
    - 長輩多半愛挑剔，孩子只能忍耐，關係很難改變
    - 心理韌性靠打罵養成，受過嚴格管教的人一定更強
    - 當兵最能鍛鍊意志，因此比讀書更能改變一個人
    answer:
    - 長輩多半愛挑剔，孩子只能忍耐，關係很難改變
    - 心理韌性靠打罵養成，受過嚴格管教的人一定更強
    - 當兵最能鍛鍊意志，因此比讀書更能改變一個人
  - type: self_check
    items:
    - 我會根據對話、語氣、動作與反應，推論作者和阿嬤的關係。
    - 我會把文章線索前後連起來，推論角色關係變化歷程。
    - 我能從關係變化推到作者的觀點轉變，並進一步推論本文的主旨。
