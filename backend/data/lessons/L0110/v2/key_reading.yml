passage: '18歲上成功嶺受兩個月的軍訓，我的班長姓李，橫眉豎目，是全營最剽悍的士官。經常從他嘴裡吼出來的名言有：「死老百姓！」「你不想活了？」「你再來有好日子過了。」「我給你當不完的兵！」檢查內務時，會把你的臉盆一腳踢進床底，要你爬進去撈出來，30秒內回復原狀。就寢時，我聽見睡我旁邊的鄰兵在黑暗中啜泣，然後帶動哭。我心裡就不屑：「哼，嬌生慣養！」開始感謝起阿嬤來。　下成功嶺，背著綠色大軍用背包回家。一看到阿嬤，立刻衝過去，把她抱得風雨不透，還抱離地面轉了一圈。阿嬤一邊笑，一邊打我：「你發的什麼瘋？」晚餐桌上擺滿了菜，我知道這是她愛我的方式。

  大學時，每次回家前，都會特別把長髮剪短，以免挨罵。可一回到家，她就用嫌惡的口吻罵：「頭髮像熊一樣，也不知道去剪！」我已經在大學學了心理學，試著跟她講「完全的尊重接納，無條件的關注」，並且抗議她總是在嫌我罵我。阿嬤笑著說：「說什麼碗糕？我到40歲，我老母還不是拿著竹子打我！」'
