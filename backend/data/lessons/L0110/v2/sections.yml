comprehension:
  questions:
  - index: 2
    answer: A
    stem: 第五段為什麼作者在當兵時，聽到鄰兵啜泣，會不屑地想：「哼，嬌生慣養！」又感謝起阿嬤來？
    options:
      A: 作者覺得班長再兇也不過如此，和阿嬤比起來不算什麼
      B: 作者覺得當兵就是要吃苦，哭出來只會讓家人更難過
      C: 作者覺得鄰兵是想博取同情，好讓班長對他放寬標準
      D: 作者知道成功嶺結訓後，阿嬤會煮一大桌好菜等他回家
    rationale: null
  - index: 3
    answer: C
    stem: 作者安排「阿嬤很兇、滿口髒話」與「晚餐滿桌菜、作者擁抱阿嬤」的對照，最主要是在凸顯什麼？
    options:
      B: 作者教會阿嬤心理學裡尊重接納小孩的現代教養觀念
      C: 阿嬤沒有改變，是作者開始正向詮釋自己的童年經驗
      D: 作者長大後，知道要忍耐、吃苦，才能提升家人關係
      A: 作者長大成為教授後，阿嬤改變了，比較不會罵人了
    rationale: 作者用對「對比」手法照讓讀者看見：同一個人可能用很粗的方式說話，卻用很實際的方式愛人
  - index: 5
    answer: C
    stem: 有同學讀完後說：「這篇文章是在替打罵式教養背書，甚至鼓勵家長用打罵管教。」你認為最貼近本文立場的回應是什麼？
    options:
      A: 沒錯，因為作者最後很感謝，所以他真的在鼓勵打罵
      B: 沒錯，因為作者後來當教授，可見打罵管教很有效果
      C: 不對，本文未推廣打罵，只強調人不是早期經驗決定的
    rationale: 文章確實呈現體罰與惡言，但作者最後的焦點放在「詮釋」與「主體性」：同樣的經驗可能造成傷害，也可能被重新理解成某種力量。作者是在分享自己如何理解阿嬤，而不是在下指令說「打罵才對」
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 0
    verdict: ok
