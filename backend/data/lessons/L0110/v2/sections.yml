  questions:
  - index: 1
    text: 爸媽都是畫家，他從小受到藝術的（　），一眼就看出配色的好壞。
    answer: I
  - index: 2
    text: 兩棲蛙人受過嚴格的訓練，是最（　）的部隊，讓敵人聞風喪膽。
    answer: E
  - index: 3
    text: 他在群組的話讓我不舒服，我決定（　）告訴他別再開這種玩笑。
    answer: A
  - index: 4
    text: 她對食物非常（　），連湯的鹹淡都要精確掌握。
    answer: C
  - index: 5
    text: 多年前移民之後，家鄉實在太遠，只能靠著泛黃的老照片 （　）。
    answer: H
  - index: 6
    text: 教室裡的臭襪子味非常令人（　），老師聞到就立刻開窗散味。
    answer: G
  - index: 7
    text: 她求學時，必須打三份工，雖然相當（　），卻始終沒有放棄夢想。
    answer: J
  - index: 8
    text: 比賽輸了之後，我曾經覺得自己（　），但在老師的鼓勵下，終於轉念，開心起來。
    answer: B
