  - label: 阿嬤個性（段2-3）
    value: 1.阿嬤很酷、粗話多、不說禮貌的話，也不會說__；她眼裡只看見作者__。
    blanks:
    - answer: 我愛你
      hint: ''
    - answer: 該改進的地方
      hint: ''
  - label: 觀點轉折（段4-6）
    value: '1.作者小時候對阿嬤__。長大發現也許不是我__，阿嬤連看電視都會挑剔演員。

      2.作者18歲上成功嶺，班長很兇，作者聽見鄰兵啜泣卻覺得他們__；反而開始感謝阿嬤，認為這種教養方式對他在軍的__有幫助。'
    blanks:
    - answer: 又怨又怕
      hint: ''
    - answer: 一無是處
      hint: ''
    - answer: 嬌生慣養
      hint: ''
    - answer: 心理韌性
      hint: ''
  - label: 關係改變(段7-8)
    value: 下成功嶺，作者回家時，晚餐有滿桌子的菜，作者知道那是阿嬤表達愛的方式；但作者開始敢用__抗議，阿嬤卻以「我到40歲還不是被打」回應。
    blanks:
    - answer: 尊重接納／無條件關注
      hint: ''
  - label: 成熟互動關係(段9-11)
    value: 35歲回家，作者動作慢被嫌、唱歌被嫌。作者逮到機會幽默的用玩笑__「阿嬤，你牙齒痛是嗎？」阿嬤笑回「我又沒牙齒。」
    blanks:
    - answer: 反酸
      hint: ''
  - label: 對阿嬤身世有同情的理解(段13)
    value: '1.阿嬤的爸爸滿口髒話，生活拮据，阿嬤13歲就去日本警察家幫傭，警察大人很會罵人。

      2.阿嬤成長在__的時代，長大後說話的方式其實就是她小時候被對待的方式。'
    blanks:
    - answer: 威權當道、階級分明
      hint: ''
  - label: 結尾(段14)
    value: 作者以教師身分提醒：人不是被__決定的，我們可以決定怎麼__自己的童年經驗。
    blanks:
    - answer: 早期經驗
      hint: ''
    - answer: 詮釋
      hint: ''
  title: 我的阿嬤
