section_no: 一
full_text_annotate:
  title_line: 第11課 預防近視？多點戶外活動就對了！
  paragraph_count: 13
  paragraphs:
  - idx: 1
    text: 上海、新加坡、南韓、日本的學生有一項特質讓全世界望塵莫及──這些地區的近視率愈來愈高，中學生的近視率高達80%～90%。而臺灣，根據衛福部的調查，小一近視率22%，小六66%，國三77%，高三85%。高中畢業典禮現場，一片「鏡光閃閃」。視力正常、不必戴眼鏡的學生鳳毛麟角。
  - idx: 2
    text: 其他國家也一樣，美國1970年時，近視率只有25%，但2000年近視率增加到42%，世界各國的近視率也都大幅增加，有研究推估，如果這個趨勢持續下去，到2050年，全世界超過一半的人口需要戴眼鏡。這樣血淋淋的事實，讓許多科學家一直努力尋找近視的成因及預防之道。
  - idx: 3
    text: 許多研究者把近視歸因於遺傳，但遺傳不能解釋怎麼會在短短30年內，人類的近視率會快速上升到流行疫病的程度。後來，環境因素便成了被咎責的對象，最明顯的嫌犯當然就是近距離的工作，如讀寫、打電動、看手機、看電視的時間增加了。澳洲一位研究近視的研究員摩根說：「各方研究均一致地指出，受教育年數愈多，近視比例愈高。」這裡的因果關聯似乎再清楚不過：受教育的時間愈長，則從事近距離功課的時間愈多，因此導致眼球發展異常。
  - idx: 4
    text: 這個說法和大眾的刻板印象一致。於是，「不要再看電視了！」「再玩手機我就把你沒收！」成了預防學生近視的主要手段。
  - idx: 5
    text: 但是，最近的研究聚焦在近視的另一個可能成因：「眼球缺乏陽光」。明亮的陽光有助於眼球的正常成長，預防眼球過度拉長。而太多室內活動—不管是讀書、打電動或看電視，都讓眼球缺乏足夠的陽光，就埋下近視的病根。
  - idx: 6
    text: 如果缺少陽光是導致近視的原因，那麼，「增加戶外活動時間」可不可以降低得到近視的機會呢？答案是肯定的。2007年，美國研究者對514位小學生進行研究，發現「戶外活動時間」及「家長近視情況」可以有效預測學生是否會罹患近視，相對之下，「做功課時間」就無法預測學生的近視率了。
  - idx: 7
    text: 無獨有偶，新加坡和澳洲的研究者比較了兩國6到7歲華裔兒童的近視率，他們發現，雖然澳洲兒童在室內閱讀和近距離功課的時間更多，他們卻只有3%近視，但新加坡的同齡兒童卻高達29%近視。澳洲兒童每週花了約13小時從事戶外活動，而新加坡卻只有3小時。這兩個研究都指出一個可能：近距離用眼未必是唯一關鍵，缺少戶外活動可能也是造成近視的重要因素。
  - idx: 8
    text: 但為什麼戶外活動可以預防近視呢？到底是「看遠」的效果，還是「光線」的效果呢？
  - idx: 9
    text: 2009年，德國研究者發表了一個動物實驗，他們讓雞在不同的照明度下成長，和一般室內成長的雞相比，高照明度情況下養大的雞得到實驗室誘發近視的機會降了60%；後來，用樹鼩和猴子的實驗也得到類似的結果。
  - idx: 10
    text: 科學家因此提出一個「光線-多巴胺假說」，指出光線刺激視網膜時，可能促使視網膜釋放多巴胺，這種生物化學物質會阻止眼球過度拉長，因此預防了近視。這個說法在動物實驗裡得到支持，2010年，另一個研究把一種抑制多巴胺生成的藥打進雞的眼睛，亮光對眼球的保護效果就消失了。
  - idx: 11
    text: 另一方面，澳洲和中國研究者在國小進行了一個實驗，他們安排兒童連續三年每天接受40分鐘的戶外活動，結果發現他們罹患近視的機會，比對照組相對低了23%。此外，2009年臺灣的高雄長庚吳佩昌醫師以571名國小學生為研究對象，要求其中的333名學生每節下課必須離開教室，出去校園玩，238名對照組則未如此要求。如此實驗一年之後，實驗組學生的近視率只有8%，但對照組則為18%。這兩個研究都支持了「增加戶外活動可以預防近視」的假設。
  - idx: 12
    text: 如果光線那麼重要，那麼，加強家裡或教室裡燈光的亮度，能不能預防近視呢？看起來機會不大。一般室內的照明，大概有只有100到500勒克斯，戶外自然光則明亮許多，明亮的陰天，中午戶外也可能達到約10,000～25,000勒克斯(Lux)；晴天直射陽光更可達約100,000勒克斯以上，戶外活動的效果也就不言而喻了。
  - idx: 13
    text: 其實，除了預防近視，陽光還有強化骨骼和預防憂鬱的效果，孩子本來就喜歡爬山涉水，喜歡在公園、遊樂場、游泳池嬉戲，就別再把孩子關在家裡了，帶他們出去玩吧！
