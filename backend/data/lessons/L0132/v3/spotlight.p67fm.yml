lesson_uid: L0132
version_id: v3
section_no: 六
spotlight:
  strategy_name: 科學推理策略——整合多項研究證據
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），PDF p7~p10 全部可見（11 個）
  note: '（二）解讀研究數據在原稿是一張兩欄表（閱讀步驟／根據研究內容勾選答案），

    ❶❷❸ 是左欄的三個小列。這裡攤成 guide + single 的序列，讓每一題各自可作答；

    表格外框沒有承載任何內容，攤平不丟資訊。'
  blocks:
  - type: concept_box
    text: '你讀過研究報告或科普文章嗎？讀這類文章，不能只記住研究結果，還要看懂：研究者怎麼做？研究結果告訴我們什麼？

      不過，一項研究通常只能回答一部分問題，也可能留下新的疑問。科學家會再進行其他研究，從不同角度繼續追問、檢查和補充，讓問題的答案越來越完整。這一課，我們要看懂多項研究如何一步步補上線索，讓最後的結論更有根據。

      這一課，我們要練習：

      【看做法】→【讀結果】→【找線索】→【合證據】'
  - type: guide
    text: 一、先讀懂一項研究
  - type: guide
    text: （一）研究比較澳洲和新加坡六、七歲的華裔兒童，以下是研究數據：
  - type: table
    columns:
    - 比較項目
    - 澳洲兒童
    - 新加坡兒童
    rows:
    - - 室內閱讀和近距離功課時間
      - 較多
      - 較少
    - - 每週戶外活動時間
      - 約13小時
      - 約3小時
    - - 近視率
      - 約3％
      - 約29％
  - type: guide
    text: （二）解讀研究數據
  - type: single
    prompt: ❶看做法
    options:
      1: 安排一組兒童增加戶外活動，再和另一組比較。
      2: 比較兩地兒童原有的生活情形和近視率。
    answer: 2
  - type: guide
    text: ❷讀結果
  - type: single
    prompt: 近距離用眼時間：
    options:
      1: 澳洲兒童較多
      2: 新加坡兒童較多
    answer: 1
  - type: single
    prompt: 戶外活動時間：
    options:
      1: 澳洲兒童較多
      2: 新加坡兒童較多
    answer: 1
  - type: single
    prompt: 近視率：
    options:
      1: 澳洲兒童較高
      2: 澳洲兒童較低
    answer: 2
  - type: guide
    text: 統整→澳洲兒童近距離用眼較多、戶外活動較多，近視率卻較低
  - type: single
    prompt: ❸研究帶來什麼新線索？
    options:
      1: 近距離用眼較多，近視率就一定比較高。
      2: 除了近距離用眼，戶外活動也可能是影響近視的重要因素。
    answer: 2
  - type: guide
    text: （三）這項研究還留下什麼問題？
  - type: single
    prompt: 這項研究比較了兩地兒童原有的生活情形。下列哪一個問題，還需要用其他研究繼續檢查？
    options:
      1: 澳洲兒童的戶外活動時間是否比新加坡兒童多？
      2: 增加兒童的戶外活動後，近視發生的機會是否會降低？
    answer: 2
  - type: guide
    text: →這項跨國比較先找到線索，接下來還要繼續檢查：增加戶外活動是否有助於降低近視風險？
  - type: guide
    text: 二、研究者怎麼繼續找答案
  - type: guide
    text: 前一項研究發現：戶外活動較多的兒童，近視率較低。為了繼續檢查這條線索，其他研究安排兒童增加戶外活動，看看近視發生的機會會不會降低。
  - type: guide
    text: （一）比較兩項研究，看看研究者如何繼續檢查前面的線索
  - type: table
    columns:
    - 比較項目
    - 跨國比較研究
    - 戶外活動實驗
    rows:
    - - 研究怎麼做？
      - 比較兩地兒童原有的生活情形
      - 安排一組兒童增加戶外活動，再和另一組比較
    - - 研究看到什麼？
      - 戶外活動較多的兒童，近視率較低
      - 增加戶外活動組，近視發生的機會較低
    - - 研究的作用
      - 找到線索：戶外活動可能和近視有關
      - 繼續檢查：增加戶外活動可能真的有幫助
  - type: single
    index: 1
    prompt: 1.戶外活動實驗和跨國比較研究最大的不同是什麼？
    options:
      1: 只是比較兒童原有的生活情形
      2: 實際安排一組兒童增加戶外活動
    answer: 2
  - type: single
    index: 2
    prompt: 2.戶外活動實驗研究結果支持哪一個說法？
    options:
      1: 增加戶外活動，有助於降低近視發生的機會
      2: 增加戶外活動，可以讓每一名兒童都不會近視
    answer: 1
  - type: guide
    text: 三、不同研究，繼續補上不同線索
  - type: guide
    text: 研究：動物與多巴胺實驗
  - type: guide
    text: 1.研究結果：高照明度下，動物被誘發近視的機會較低；抑制多巴胺生成後，亮光的保護效果消失。
  - type: single
    prompt: 2.這項研究主要幫助我們了解什麼？
    options:
      1: 了解增加戶外活動後，兒童的近視率是否降低。
      2: 了解明亮光線可能如何發揮保護眼球的作用。
    answer: 2
  - type: guide
    text: 研究：室內外照度比較
  - type: guide
    text: 1.研究結果：一般室內照明約100～500勒克斯，戶外自然光通常可達數萬勒克斯以上。
  - type: single
    prompt: 2.這項資料主要幫助我們了解什麼？
    options:
      1: 一般室內燈光很難達到戶外自然光的亮度。
      2: 只要室內開燈，亮度就和戶外自然光一樣
    answer: 1
  - type: guide
    text: 四、把不同研究合起來
  - type: table
    columns:
    - 研究線索
    - 研究幫助我們知道什麼？
    rows:
    - - 研究：戶外活動較多的兒童，近視率較低
      - 戶外活動可能和近視率有關
    - - 研究：增加戶外活動組，近視發生機會較低
      - 增加戶外活動可能真的有幫助
    - - 研究：明亮光線下，動物較不容易被誘發近視
      - 光線可能具有保護眼球的作用
    - - 研究：戶外自然光遠比普通室內照明明亮
      - 一般室內燈光很難達到戶外自然光的亮度
  - type: single
    prompt: 把四項線索合起來，哪一個結論最合理？
    options:
      1: 近視完全是缺少戶外光線造成的。
      2: 戶外光線可能是影響近視的重要因素；增加戶外活動有助於降低近視風險。
    answer: 2
  - type: guide
    text: ★策略帶著走
  - type: guide
    text: 下次讀到介紹多項研究的文章時，可以依序問自己：
  - type: passage
    paragraphs:
    - ☆研究者怎麼做？
    - ☆研究看到了什麼結果？
    - ☆這項研究幫助我們知道什麼？
    - ☆不同研究合起來，支持什麼結論？
  - type: self_check
    title: ◎自我檢核
    items:
    - 1.我能從研究資料中，找出研究怎麼做、看到了什麼結果。
    - 2.我能說出每項研究幫助我們知道什麼。
    - 3.我能把不同研究合起來，選出符合研究結果的結論。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
