  passage: 許多研究者把近視歸因於遺傳，但遺傳不能解釋怎麼會在短短30年內，人類的近視率會快速上升到流行疫病的程度。後來，環境因素便成了被咎責的對象，最明顯的嫌犯當然就是近距離的工作，如讀寫、打電動、看手機、看電視的時間增加了。澳洲一位研究近視的研究員摩根說：「各方研究均一致地指出，受教育年數愈多，近視比例愈高。」這裡的因果關聯似乎再清楚不過：受教育的時間愈長，則從事近距離功課的時間愈多，因此導致眼球發展異常。這個說法和大眾的刻板印象一致。於是，「不要再看電視了！」「再玩手機我就把你沒收！」成了預防學生近視的主要手段。但是，最近的研究聚焦在近視的另一個可能成因：「眼球缺乏陽光」。明亮的陽光有助於眼球的正常成長，預防眼球過度拉長。而太多室內活動—不管是讀書、打電動或看電視，都讓眼球缺乏足夠的陽光，就埋下近視的病根。如果缺少陽光是導致近視的原因，那麼，「增加戶外活動時間」可不可以降低得到近視的機會呢？答案是肯定的。2007年，美國研究者對514位小學生進行研究，發現「戶外活動時間」及「家長近視情況」可以有效預測學生是否會罹患近視，相對之下，「做功課時間」就無法預測學生的近視率了。
