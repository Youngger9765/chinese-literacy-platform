strategy_explained: '這一課我們要練習的是，怎麼看懂科學研究的證據，然後用這些證據去說服別人

  這篇文章就帶你分析，為什麼長時間待在室內、陽光照不夠，會讓近視越來越嚴重，裡面有很多研究和實驗可以讓你練習判斷

  讀的時候，可以試著想想，作者是怎麼一步一步證明「多去戶外」對眼睛好的，也可以想想，自己是不是也曾經有類似的經驗呢'
