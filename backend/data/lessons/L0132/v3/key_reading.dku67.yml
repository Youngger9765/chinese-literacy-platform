  passage: 許多研究者把近視歸因於遺傳，但遺傳不能解釋怎麼會在短短30年內，人類的近視率會快速上升到流行疫病的程度。後來，環境因素便成了被咎責的對象，最明顯的嫌犯當然就是近距離的工作，如讀寫、打電動、看手機、看電視的時間增加了。澳洲一位研究近視的研究員摩根說：「各方研究均一致地指出，受教育年數愈多，近視比例愈高。」這裡的因果關聯似乎再清楚不過：受教育的時間愈長，則從事近距離功課的時間愈多，因此導致眼球發展異常。
