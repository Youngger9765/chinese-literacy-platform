  items:
  - index: 1
    word: 流行疫病
    definition: 指在一定時期和一定地區內，大量感染的傳染病。
  - index: 2
    word: 刻板印象
    definition: 指因為固有的觀念或經驗，而對人或事物形成的片面固執的印象。例如：男主內女主外。
  - index: 3
    word: 望塵莫及
    definition: 比喻遠遠追不上。
  - index: 4
    word: 咎責
    definition: 責罰、怪罪。
  - index: 5
    word: 罹患
    definition: 染病。
  - index: 6
    word: 鳳毛麟角
    definition: 形容極為少見的珍貴事物。
  - index: 7
    word: 不言而喻
    definition: 指明顯到不需要說明的道理或情況。
  - index: 8
    word: 多巴胺
    definition: 一種神經傳遞物質，對大腦的情感和動機起著重要作用。
    example: 例句：運動可以促使大腦釋放多巴胺，讓人感到快樂和興奮。
