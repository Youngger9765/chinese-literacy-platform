spotlight:
  lesson: G9-L11
  strategy_name: 科學推理策略-整合多項研究證據
  strategy_type: unknown
  blocks:
  - type: guide
    text: 一、先讀懂一項研究
  - type: guide
    text: （一）研究比較澳洲和新加坡六、七歲的華裔兒童，以下是研究數據：
  - type: table
    rows:
    - - 比較項目
      - 澳洲兒童
      - 新加坡兒童
    - - 室內閱讀和近距離功課時間
      - 較多
      - 較少
    - - 每週戶外活動時間
      - 約13小時
      - 約3小時
    - - 近視率
      - 約3％
      - 約29％
  - type: guide
    text: （二）解讀研究數據
  - type: table
    rows:
    - - 閱讀步驟
      - 根據研究內容勾選答案
    - - ❶看做法
      - □①安排一組兒童增加戶外活動，再和另一組比較。□②比較兩地兒童原有的生活情形和近視率。
    - - ❷讀結果
      - 近距離用眼時間：□①澳洲兒童較多　□②新加坡兒童較多戶外活動時間：□①澳洲兒童較多　□②新加坡兒童較多近視率：□①澳洲兒童較高　□②澳洲兒童較低統整→澳洲兒童近距離用眼較多、戶外活動較多，近視率卻較低
    - - ❸研究帶來什麼新線索？
      - □①近距離用眼較多，近視率就一定比較高。□②除了近距離用眼，戶外活動也可能是影響近視的重要因素。
  - type: guide
    text: （三）這項研究還留下什麼問題？
  - type: single
    prompt: 這項研究比較了兩地兒童原有的生活情形。下列哪一個問題，還需要用其他研究繼續檢查？
    options:
    - 澳洲兒童的戶外活動時間是否比新加坡兒童多？
    - 增加兒童的戶外活動後，近視發生的機會是否會降低？
    answer: 澳洲兒童的戶外活動時間是否比新加坡兒童多？
  - type: guide
    text: →這項跨國比較先找到線索，接下來還要繼續檢查：增加戶外活動是否有助於降低近視風險？
  - type: guide
    text: 二、研究者怎麼繼續找答案
  - type: guide
    text: 前一項研究發現：戶外活動較多的兒童，近視率較低。為了繼續檢查這條線索，其他研究安排兒童增加戶外活動，看看近視發生的機會會不會降低。
  - type: guide
    text: （一）比較兩項研究，看看研究者如何繼續檢查前面的線索
  - type: table
    rows:
    - - 比較項目
      - 跨國比較研究
      - 戶外活動實驗
    - - 研究怎麼做？
      - 比較兩地兒童原有的生活情形
      - 安排一組兒童增加戶外活動，再和另一組比較
    - - 研究看到什麼？
      - 戶外活動較多的兒童，近視率較低
      - 增加戶外活動組，近視發生的機會較低
    - - 研究的作用
      - 找到線索：戶外活動可能和近視有關
      - 繼續檢查：增加戶外活動可能真的有幫助
  - type: single
    prompt: 1.戶外活動實驗和跨國比較研究最大的不同是什麼？
    options:
    - 只是比較兒童原有的生活情形
    - 實際安排一組兒童增加戶外活動
    answer: 只是比較兒童原有的生活情形
  - type: single
    prompt: 2.戶外活動實驗研究結果支持哪一個說法？
    options:
    - 增加戶外活動，有助於降低近視發生的機會
    - 增加戶外活動，可以讓每一名兒童都不會近視
    answer: 增加戶外活動，有助於降低近視發生的機會
  - type: guide
    text: 三、不同研究，繼續補上不同線索
  - type: guide
    text: 研究：動物與多巴胺實驗
  - type: free_text
    prompt: 1.研究結果：高照明度下，動物被誘發近視的機會較低；抑制多巴胺生成後，亮光的保護效果消失。
  - type: single
    prompt: 2.這項研究主要幫助我們了解什麼？
    options:
    - 了解增加戶外活動後，兒童的近視率是否降低。
    - 了解明亮光線可能如何發揮保護眼球的作用。
    answer: 了解增加戶外活動後，兒童的近視率是否降低。
  - type: guide
    text: 研究：室內外照度比較
  - type: free_text
    prompt: 1.研究結果：一般室內照明約100～500勒克斯，戶外自然光通常可達數萬勒克斯以上。
  - type: single
    prompt: 2.這項資料主要幫助我們了解什麼？
    options:
    - 一般室內燈光很難達到戶外自然光的亮度。
    - 只要室內開燈，亮度就和戶外自然光一樣
    answer: 一般室內燈光很難達到戶外自然光的亮度。
  - type: guide
    text: 四、把不同研究合起來
  - type: table
    rows:
    - - 研究線索
      - 研究幫助我們知道什麼？
    - - 研究：戶外活動較多的兒童，近視率較低
      - 戶外活動可能和近視率有關
    - - 研究：增加戶外活動組，近視發生機會較低
      - 增加戶外活動可能真的有幫助
    - - 研究：明亮光線下，動物較不容易被誘發近視
      - 光線可能具有保護眼球的作用
    - - 研究：戶外自然光遠比普通室內照明明亮
      - 一般室內燈光很難達到戶外自然光的亮度
  - type: single
    prompt: 把四項線索合起來，哪一個結論最合理？
    options:
    - 近視完全是缺少戶外光線造成的。
    - 戶外光線可能是影響近視的重要因素；增加戶外活動有助於降低近視風險。
    answer: 近視完全是缺少戶外光線造成的。
  - type: guide
    text: ★策略帶著走
  - type: guide
    text: 下次讀到介紹多項研究的文章時，可以依序問自己：
  - type: guide
    text: ☆研究者怎麼做？
  - type: guide
    text: ☆研究看到了什麼結果？
  - type: guide
    text: ☆這項研究幫助我們知道什麼？
  - type: guide
    text: ☆不同研究合起來，支持什麼結論？
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能從研究資料中，找出研究怎麼做、看到了什麼結果。
    - 我能說出每項研究幫助我們知道什麼。
    - 我能把不同研究合起來，選出符合研究結果的結論。
