  - label: 預防之道
    value: __可有效降低近視率。
    blanks:
    - answer: 戶外活動
      hint: ''
  - label: 支持證據
    sub_rows:
    - sub_label: 研究一
      template: "缺乏戶外活動可能是近視的重要因素\n(1)2007年美國研究者研究514位小學生，發現\n①戶外活動時間 ②家長近視情況 □③做功課時間(複選)\n\
        可有效預測學生是否會罹患近視。\n(2)新加坡和澳洲比較兩國6、7歲華裔兒童近視率，發現\n  (□內請填＞、＜或＝)\n室內閱讀與做功課的時間：澳洲＞新加坡\n\
        戶外活動時間：澳洲＞新加坡\n近視率：澳洲＜新加坡"
      blanks: []
    - sub_label: 研究二
      template: '「光線」可能有保護眼球的效果。(□內請填＞、＜或＝)

        動物實驗：高照明度養大的雞誘發近視率＜低照明度養大的雞

        →科學家提出「光線－__假說」，光線可能刺激視網膜釋放多巴胺，阻止眼球過度拉長，預防近視。'
      blanks:
      - answer: 多巴胺
        hint: ''
    - sub_label: '研究

        三'
      template: '增加戶外活動有助於預防近視。(□內請填＞、＜或＝)

        臺灣國小實驗：

        每天進行40分鐘的戶外活動的兒童近視率＜室內活動對照組

        333名下課離開教室的學生近視率＜未出去玩的學生'
      blanks: []
    - sub_label: 研究四
      template: '戶外的照度大於室內。(□內請填＞、＜或＝)

        室內的照明約100-500的流明，戶外的流明陰天約15000，晴天約130000，由此可知戶外流明＞室內。'
      blanks: []
  - label: 研究結論
    value: 孩子應該__！
    blanks:
