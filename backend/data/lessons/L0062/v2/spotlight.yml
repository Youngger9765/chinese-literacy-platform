spotlight:
  lesson: G6-L21
  strategy_name: 品格力-負責任的決定-區辨控制圈
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 控制圈關注圈控制圈關注圈一、認識「關注圈」與「控制圈」：
  - type: passage
    source: unknown
    paragraphs:
    - 生活中，健康、人際、課業等我們所關心的各種事物，都在「關注圈」裡。這些關注的事情裡，能由自己掌控或改變的部分，就是「控制圈」。若你的「關注圈」裡有這幾件事，請判斷哪些事情會落在你的「控制圈」呢？
  - type: guide
    text: 請在你可以掌控、改變的項目打勾：
  - type: multi
    prompt: 請選擇
    options:
    - 今天的天氣
    - 早上的起床時間
    - 公車上人多不多
    - 要不要找同學聊天
    - 功課有沒有完成
    - 老師幾點下課
    - ⑦回家作業多不多
    - □⑧手機要使用多久
    answer:
    - 今天的天氣
    - 早上的起床時間
    - 公車上人多不多
    - 要不要找同學聊天
    - 功課有沒有完成
    - 老師幾點下課
    - ⑦回家作業多不多
    - □⑧手機要使用多久
  - type: guide
    text: 二、區辨「控制圈」：
  - type: passage
    source: unknown
    paragraphs:
    - 從文章中，我們可以看出主角的兩難，請判斷主角在乎的事情是否落在他的「控制圈」（能不能由主角單方面決定？）：
  - type: table
    rows:
    - - 主角煩惱的事情
      - 是否落在「控制圈」
    - - 是否要告白
      - □是    □否
    - - 告白是否會成功
      - □是    □否
    - - 如果告白失敗，是否還可以毫無顧忌、維持朋友關係
      - □是    □否
    - - 如果告白失敗，事情會不會被傳開成為八卦
      - □是    □否
    - - 如果告白失敗，會不會變成話題、被同學指指點點
      - □是    □否
    - - 如果不告白，會不會錯過可以在一起的機會
      - □是    □否
  - type: passage
    source: unknown
    paragraphs:
    - ☆主角的心煩，也來自於他的焦點多在（□①控制圈之內　□②控制圈之外），一起來幫主角想想，哪些是在控制圈內的事情吧！（請打勾）
  - type: multi
    prompt: 請選擇
    options:
    - 告白時機
    - 告白方式
    - 對方的回應
    - 告白內容
    - 得到回覆的時間
    - 自己如何回應對方的答案
    answer:
    - 告白時機
    - 告白方式
    - 對方的回應
    - 告白內容
    - 得到回覆的時間
    - 自己如何回應對方的答案
  - type: guide
    text: ◎在生活中，也有許多兩難情境，就讓我們透過情境，來練習區辨「控制圈」：
  - type: table
    rows:
    - - ''
      - 情境
      - 在「控制圈」之內的事
    - - 一
      - 你跟朋友吵架，關係變冷淡，想和好但怕對方不理你。
      - □①是否主動和對方道歉□②對方是否願意回應或原諒你□③其他同學怎麼看待你們的關係□④自己想在相處中改進的地方□⑤和好後，關係是否會回到過去一樣
    - - 二
      - 有同學請你幫忙作弊，你不想違規又怕拒絕會失去朋友。
      - □①是否答應或拒絕幫忙作弊□②對方是否會因此不高興或疏遠你□③是否解釋自己的想法和立場□④對方會不會選擇找別人幫忙□⑤拒絕時的態度和說話方式
    - - 三
      - 和家人意見衝突，你希望堅持自己想法，但又不想讓家庭氣氛變差。
      - □①事先準備理由，說明自己的立場□②家人是否會接受或支持你的想法□③保持冷靜、尊重的態度□④願意聆聽家人的想法□⑤家庭氣氛是否能馬上緩和
  - type: guide
    text: ☆控制圈之外的事，仍值得努力；但努力過後也要明白，結果不是我們單方面能控制的。
  - type: passage
    source: unknown
    paragraphs:
    - 在面對兩難抉擇時，我們容易被各種擔憂困住，感到焦慮或茫然。而當我們專注在控制圈裡，能減少那些無力和不安，也能逐漸找回自己的主動權和力量。練習把注意力放在自己能影響的行動和選擇上，會更能勇敢、自在的面對每一次選擇❤︎
  - type: guide
    text: (A)宜用「迅速」(C)宜用「眼巴巴」(D)宜用「大方」(A)宜用「迅速」(C)宜用「眼巴巴」(D)宜用「大方」七閱讀理解七閱讀理解請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
