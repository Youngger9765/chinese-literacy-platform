source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 這個念頭一直揮之不去，讓我無法專心做任何事。上課時，我的視線總是不自覺飄向他的座位；放學回家後，我又反覆思考各種可能的結果。我很想知道他的想法，可是……如果答案是我不想面對的呢？
- 今天中午休息時，他照常走過來和我聊天，語氣輕鬆。我努力裝作若無其事，卻忍不住想——如果他知道我的心意，還能像現在這樣自在嗎？如果他也喜歡我，那當然是最好的結果。但萬一他沒有那種意思呢？他會不會開始刻意與我保持距離？我們還能像現在這樣，毫無顧忌的談天說笑嗎？
- 更讓我不安的是，萬一這件事傳開了呢？我們班上的八卦消息總是傳得飛快，如果同學們知道了，會不會開始對我們指指點點？會不會有人拿這件事開玩笑，甚至影響他的心情？光是想像這種場面，我就覺得渾身不自在。教室裡的每一道視線、每一次低聲細語，可能都會讓我坐立難安。我不想變成話題焦點，更不想因為自己的衝動，讓他感到困擾。
- 可是，這樣曖昧不明的處境又讓我焦躁不安。有時覺得自己也許可以大膽一點，畢竟，他經常主動找我說話，也常常會留意到我的心情和需要；他會不會其實也在等我開口？如果因為猶豫而錯過了，會不會有一天，我只能眼睜睜看他喜歡上別人？再換個角度想，他對其他人也很親切，會不會只是我自作多情，把普通的關心錯認為特別的對待？如果告白後，他因為不想傷害我而變得拘謹，我們反而連朋友都做不成，那該怎麼辦？
- 這些念頭不斷在腦海裡交戰，讓我心煩意亂，怎麼也得不出個結論。我多想把這些念頭一一劃上句點，但剛剛翻開筆記本，才發現今天上課時，我竟然在空白處畫滿了一個又一個的問號。這樣日復一日的糾結，真的能讓我少受傷害嗎？還是說，這種遲疑，反而會讓我錯失眼前的機會？
- 我知道明天或許還是沒有答案，也知道這件事只能由自己決定；但我希望自己能有足夠的勇氣和智慧，做出讓自己不後悔的選擇。
