passage: 更讓我不安的是，萬一這件事傳開了呢？我們班上的八卦消息總是傳得飛快，如果同學們知道了，會不會開始對我們指指點點？會不會有人拿這件事開玩笑，甚至影響他的心情？光是想像這種場面，我就覺得渾身不自在。教室裡的每一道視線、每一次低聲細語，可能都會讓我坐立難安。我不想變成話題焦點，更不想因為自己的衝動，讓他感到困擾。
