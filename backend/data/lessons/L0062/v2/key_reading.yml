passage: 可是，這樣曖昧不明的處境又讓我焦躁不安。有時覺得自己也許可以大膽一點，畢竟，他經常主動找我說話，也常常會留意到我的心情和需要；他會不會其實也在等我開口？如果因為猶豫而錯過了，會不會有一天，我只能眼睜睜看他喜歡上別人？再換個角度想，他對其他人也很親切，會不會只是我自作多情，把普通的關心錯認為特別的對待？如果告白後，他因為不想傷害我而變得拘謹，我們反而連朋友都做不成，那該怎麼辦？
