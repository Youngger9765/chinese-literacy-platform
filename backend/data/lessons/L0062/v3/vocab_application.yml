    stem: 她毫無（　），直接提出反對意見，不怕得罪不同想法的人。
    answer: F
  - index: 3
    stem: 他總是習慣在背後（　），卻從不願直接找當事人說清楚。
    answer: B
  - index: 4
    stem: 他們的互動方式非常（　），讓人無法輕易解讀。
    answer: C
  - index: 5
    stem: 面對突如其來的選擇，他（　）了，停頓了幾秒，才緩緩做出決定。
    answer: D
  - index: 6
    stem: 我們只能（　）看著颱風摧毀農作物，卻對災情無能為力。
    answer: H
