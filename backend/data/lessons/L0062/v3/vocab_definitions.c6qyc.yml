section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 盤旋
  - 顧忌
  - 糾結
  - 指指點點
  - 渾身
  - 自作多情
  - 坐立難安
  - 曖昧
  - 眼睜睜
  - 拘謹
  - 遲疑
  items:
  - index: 1
    word: 坐立難安
    definition: 坐也不是、站也不是，形容緊張或不安。
  - index: 2
    word: 拘謹
    definition: 因為緊張或怕做錯，說話、動作不自然，也不放鬆。
  - index: 3
    word: 曖昧
    definition: 態度、意思或關係不明確，讓人難以判斷。
  - index: 4
    word: 糾結
    definition: 心裡有不同想法互相拉扯，很難做決定。
  - index: 5
    word: 渾身
    definition: 整個身體、從頭到腳。
  - index: 6
    word: 遲疑
    definition: 拿不定主意，不能馬上做決定或行動。
  - index: 7
    word: 顧忌
    definition: 因為擔心不好的後果，所以不敢隨便行動。
  - index: 8
    word: 指指點點
    definition: 用手指著別人或東西，比喻議論或批評別人。
  - index: 9
    word: 盤旋
    definition: 在空中繞圈飛；也比喻某個念頭反覆出現在腦中。
  - index: 10
    word: 眼睜睜
    definition: 親眼看著事情發生，卻無法阻止或改變。
  - index: 11
    word: 自作多情
    definition: 別人只是一般的友善或關心，自己卻以為對方特別喜歡自己。
  notes:
    answer_carrier: 橘色手寫字（PDF p4）；文字層的空格內已填有同樣的答案
