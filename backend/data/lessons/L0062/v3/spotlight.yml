lesson_uid: L0062
version_id: v3
section_no: 六
spotlight:
  strategy_name: 負責任的決定──區辨控制圈
  strategy_type: character_sel
  section_title_printed: 品格聚光燈
  section_title_note: 本課第六大題印的是「品格聚光燈」，不是其他課的「閱讀聚光燈」
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元），全節 23 個
  blocks:
  - type: concept_box
    text: '在成長的路上，我們常常會遇到「兩難」的時刻：要不要向喜歡的人告白？該不該和吵架的朋友和好？這些問題沒有標準答案，讓人猶豫、糾結，也會因此感到無力。

      其實，生活中很多事情，我們都無法完全掌握結果。但面對選擇時，如果能學會把注意力放在自己可以決定、可以行動的部分，會讓自己在兩難中更有力量。讓我們一起練習，找到屬於自己的勇氣與方向。'
  - type: guide
    text: 一、認識「關注圈」與「控制圈」：
  - type: figure
    referent: diagram
    labels:
    - 控制圈
    - 關注圈
    note: '同心圓示意圖：外圈灰底標「關注圈」，內圈深灰標「控制圈」，印在本節說明文字右側。

      兩個標籤在文字層（文字方塊裡），圓形本身是圖形。'
  - type: guide
    text: 生活中，健康、人際、課業等我們所關心的各種事物，都在「關注圈」裡。這些關注的事情裡，能由自己掌控或改變的部分，就是「控制圈」。若你的「關注圈」裡有這幾件事，請判斷哪些事情會落在你的「控制圈」呢？
  - type: multi
    prompt: 請在你可以掌控、改變的項目打勾：
    options:
      1: 今天的天氣
      2: 早上的起床時間
      3: 公車上人多不多
      4: 要不要找同學聊天
      5: 功課有沒有完成
      6: 老師幾點下課
      7: 回家作業多不多
      8: 手機要使用多久
    answers:
    - 2
    - 4
    - 5
    - 8
  - type: guide
    text: 二、區辨「控制圈」：
  - type: guide
    text: 從文章中，我們可以看出主角的兩難，請判斷主角在乎的事情是否落在他的「控制圈」（能不能由主角單方面決定？）：
  - type: fill_table
    columns:
    - 主角煩惱的事情
    - 是否落在「控制圈」
    rows:
    - 主角煩惱的事情: 是否要告白
      是否落在「控制圈」: ''
      是否落在「控制圈」_options:
        1: 是
        2: 否
      是否落在「控制圈」_answer: 1
    - 主角煩惱的事情: 告白是否會成功
      是否落在「控制圈」: ''
      是否落在「控制圈」_options:
        1: 是
        2: 否
      是否落在「控制圈」_answer: 2
    - 主角煩惱的事情: 如果告白失敗，是否還可以毫無顧忌、維持朋友關係
      是否落在「控制圈」: ''
      是否落在「控制圈」_options:
        1: 是
        2: 否
      是否落在「控制圈」_answer: 2
    - 主角煩惱的事情: 如果告白失敗，事情會不會被傳開成為八卦
      是否落在「控制圈」: ''
      是否落在「控制圈」_options:
        1: 是
        2: 否
      是否落在「控制圈」_answer: 2
    - 主角煩惱的事情: 如果告白失敗，會不會變成話題、被同學指指點點
      是否落在「控制圈」: ''
      是否落在「控制圈」_options:
        1: 是
        2: 否
      是否落在「控制圈」_answer: 2
    - 主角煩惱的事情: 如果不告白，會不會錯過可以在一起的機會
      是否落在「控制圈」: ''
      是否落在「控制圈」_options:
        1: 是
        2: 否
      是否落在「控制圈」_answer: 2
  - type: single
    prompt: ☆主角的心煩，也來自於他的焦點多在
    options:
      1: 控制圈之內
      2: 控制圈之外
    answer: 2
  - type: multi
    prompt: 一起來幫主角想想，哪些是在控制圈內的事情吧！（請打勾）
    options:
      1: 告白時機
      2: 告白方式
      3: 對方的回應
      4: 告白內容
      5: 得到回覆的時間
      6: 自己如何回應對方的答案
    answers:
    - 1
    - 2
    - 4
    - 6
  - type: guide
    text: ◎在生活中，也有許多兩難情境，就讓我們透過情境，來練習區辨「控制圈」：
  - type: guide
    text: 在「控制圈」之內的事
    note: 這是下面三題所屬表格的右欄標題；左欄標題是「情境」，最左欄無標題（只放情境編號 一、二、三）
  - type: multi
    label: 情境一
    prompt: 你跟朋友吵架，關係變冷淡，想和好但怕對方不理你。
    options:
      1: 是否主動和對方道歉
      2: 對方是否願意回應或原諒你
      3: 其他同學怎麼看待你們的關係
      4: 自己想在相處中改進的地方
      5: 和好後，關係是否會回到過去一樣
    answers:
    - 1
    - 4
  - type: multi
    label: 情境二
    prompt: 有同學請你幫忙作弊，你不想違規又怕拒絕會失去朋友。
    options:
      1: 是否答應或拒絕幫忙作弊
      2: 對方是否會因此不高興或疏遠你
      3: 是否解釋自己的想法和立場
      4: 對方會不會選擇找別人幫忙
      5: 拒絕時的態度和說話方式
    answers:
    - 1
    - 3
    - 5
  - type: multi
    label: 情境三
    prompt: 和家人意見衝突，你希望堅持自己想法，但又不想讓家庭氣氛變差。
    options:
      1: 事先準備理由，說明自己的立場
      2: 家人是否會接受或支持你的想法
      3: 保持冷靜、尊重的態度
      4: 願意聆聽家人的想法
      5: 家庭氣氛是否能馬上緩和
    answers:
    - 1
    - 3
    - 4
  - type: guide
    text: ☆控制圈之外的事，仍值得努力；但努力過後也要明白，結果不是我們單方面能控制的。
  - type: concept_box
    text: 在面對兩難抉擇時，我們容易被各種擔憂困住，感到焦慮或茫然。而當我們專注在控制圈裡，能減少那些無力和不安，也能逐漸找回自己的主動權和力量。練習把注意力放在自己能影響的行動和選擇上，會更能勇敢、自在的面對每一次選擇❤︎
