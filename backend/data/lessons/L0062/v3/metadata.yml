strategy_explained: '這一課我們要練習的是「決定什麼時候該做，什麼時候可以等待」這樣的思考能力

  為什麼這篇日記很適合練習呢，因為作者就在猶豫到底要不要跟喜歡的人告白，他想了很多萬一告白成功或失敗會怎樣，也想了如果沒告白會怎樣

  讀的時候，你可以試著想想看，如果是你，你會怎麼做，還有什麼是你現在能控制的，什麼是沒辦法控制的呢'
