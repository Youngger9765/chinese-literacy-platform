source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 只是我有時候也不是不想讀書！比賽、集訓很多，我們常常請假在外，回來也跟不上課程，越落後越感到挫折。
- 不過我想跟你說——學習的方式很多，不一定要坐在教室讀課本才叫學習。你可以先從自己最熟悉、最喜歡的事開始。
- 第一位是我的高中隊友，一直想去美國打球，他從國中開始，每天晚上自學英文，但仍然跟不上學校的英文課。怎麼辦？他想：「就從我最熟悉的棒球開始吧！」於是他訂閱了英文棒球雜誌，每天都讀一點讀一點、查單字、聽MP3、看體育台的美國職棒報導。棒球的故事太精采了，所以他學英文學得興󠇡味盎然、欲罷不能。就這樣，他一邊打棒球一邊練英文，滴水穿石，他熟悉了所有跟棒球有關的英文。你知道嗎？後來他因傷沒有能繼續打球，但卻成了旅美選手的翻譯！
- 第二位是我們球隊的隊醫，以前也是學生棒球隊選手，但因運動傷害，打球期間一邊復健，一邊研究身體骨骼肌肉的解剖學，探討怎麼運動、如何訓練才能預防傷害。俗語說，久病而成良醫，他不但自己受傷，球隊裡受傷的情況太多、太頻繁了，這讓他有機會學習隊友們受傷的原因、醫師的診斷、復健師的復健指導到底怎麼做。靠著這些投入，他後來居然考上醫學相關科系。他最終雖然沒有成為職棒選手，卻用不一樣的方式，在最愛的棒球界完成夢想。
- 第三位朋友的故事更精彩，他從四年級進棒球隊後，就不愛讀書，到國中時，連簡單的文章都讀不懂。有一天，他迷上一套名叫《青少棒揚威記》的日本漫畫，廢寢忘食的閱讀，遇到不懂的字詞，就請教老師或同學。這套漫畫讓他的閱讀胃口大開，接著他讀了更多讓國中生愛不釋手的漫畫，像是《野球狂之詩》、《灌籃高手》和《好小子》。憑著對運動的熱愛，也是田徑高手的他，開始挑戰一本沒有插圖的運動少年小說《轉瞬為風》，不但讀完，還看了兩次。這樣的成功經驗，帶動了他所有學科的學習信心，最後在會考時，他的成績和普通班的同學不相上下呢！
- 這三位朋友都有一個共同點：當原本的路受挫時，他們想辦法從熱愛的棒球出發，找出新的可能，靠著行動與學習，繼續留在自己熱愛的領域。相信你也一定找得到自己的方法，往夢想前進！
