lesson_uid: L0012
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列句子使用的語詞，何者錯誤？
    options:
      A: 弟弟的身高和桌子一樣高，比較起來真是「不相上下」
      B: 這個故事緊湊又精彩，讀起來令人「興味盎然」
      C: 這支新手機功能齊全、外型漂亮，讓人「愛不釋手」
      D: 哥哥迷上了程式設計，常常「廢寢忘食」研究新功能
    teacher_note: 第1題解析：「不相上下」用於比較實力、程度，不能用來比較「身高」這類單純數量。
  - index: 2
    answer: B
    stem: 阿耀在信中提到他在課業上的最大困難是什麼？
    options:
      A: 缺課太多，沒有老師願意幫他補課
      B: 比賽和集訓太多，常常請假而跟不上課程
      C: 學校的老師因為他的缺課而討厭他
      D: 對自己未來迷茫，不知道自己適合做什麼
    teacher_note: 文中明確指出：「比賽、集訓很多，我們常常請假在外，回來也跟不上課程。」是最直接的描述。A、C、D 都未提及。
  - index: 3
    answer: D
    stem: 第一位朋友雖然因傷無法繼續打球，但他後來成為翻譯，這顯示他具備什麼特質？
    options:
      A: 熱愛棒球、願意堅持到底，永不放棄當球員的夢想
      B: 擁有優秀的英文天分，只要稍加努力就能成功
      C: 運氣比努力更加重要，剛好受傷時出現翻譯機會
      D: 遇到困難時懂得改變方向，從興趣中找到新的機會
    teacher_note: 體現主題「從熱愛出發、面對困境能調整方向」。
  - index: 4
    answer: C
    stem: 健豪學長舉了三個朋友的例子來回答阿耀的信，這種寫作手法的效果是什麼？
    options:
      A: 增加篇幅內容，讓文章看起來更豐富完整
      B: 營造氣氛對比，讓讀者更能感受情緒轉折
      C: 以具體例子說明主題，增加說服力
      D: 凸顯學生的角色，使故事更貼近校園生活
    teacher_note: 三個故事彼此呼應，共同支持主張，達到以例證論點、提升說服力的效果。
  - index: 5
    answer: B
    stem: 下列哪一個例子最符合作者要傳達的觀點？
    options:
      A: 喜歡畫畫的人，就要專心畫圖，精益求精
      B: 對數學有興趣，就可以從生活中的購物、比價開始學習
      C: 對學校課程沒興趣，就應該放棄，追尋自己熱愛的事物
      D: 學校的課業不可荒廢，興趣與課業本來就該兼顧
    teacher_note: 作者主張「從興趣出發」，B 是將此概念延伸到其他學科的具體應用。
