  passage: 第三位朋友的故事更精彩，他從四年級進棒球隊後，就不愛讀書，到國中時，連簡單的文章都讀不懂。有一天，他迷上一套名叫《青少棒揚威記》的日本漫畫，廢寢忘食的閱讀，遇到不懂的字詞，就請教老師或同學。這套漫畫讓他的閱讀胃口大開，接著他讀了更多讓國中生愛不釋手的漫畫，像是《野球狂之詩》、《灌籃高手》和《好小子》。憑著對運動的熱愛，也是田徑高手的他，開始挑戰一本沒有插圖的運動少年小說《轉瞬為風》，不但讀完，還看了兩次。這樣的成功經驗，帶動了他所有學科的學習信心，最後在會考時，他的成績和普通班的同學不相上下呢！這三位朋友都有一個共同點：當原本的路受挫時，他們想辦法從熱愛的棒球出發，找出新的可能，靠著行動與學習，繼續留在自己熱愛的領域。相信你也一定找得到自己的方法，往夢想前進！
