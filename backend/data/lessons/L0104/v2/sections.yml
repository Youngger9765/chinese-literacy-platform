vocab_definitions:
  items:
  - index: 1
    word: 加油添醋
    definition: 把事情說得更誇張，加入原本沒有的細節。
  - index: 2
    word: 跟風起鬨
    definition: 不太了解事情就跟著別人一起鬧、一起附和，常把事情越弄越大。
  - index: 3
    word: 做作
    definition: 表現得刻意、不自然，像在表演給人看。
  - index: 4
    word: 進退維谷
    definition: 前進也難、後退也難，左右為難。
  - index: 5
    word: 發酵
    definition: 本文指事情持續擴散，引起更多討論，影響越來越大。
  - index: 6
    word: 如坐針氈
    definition: 氈是毯子；像坐在會刺人的毯子上，形容非常不安、坐立難安。
  - index: 7
    word: 眾矢之的
    definition: 眾是許多；矢是箭，的是箭靶；許多支箭射在同一個靶上，指的是「大家一起指責、攻擊的共同目標」。
  - index: 8
    word: 強顏歡笑
    definition: 明明很難過，卻勉強擠出笑容裝作沒事。
  - index: 9
    word: 重整旗鼓
    definition: 失敗或受挫後重新振作、再出發。
  - index: 10
    word: 無妄之災
    definition: 沒做錯事卻遭到牽連的倒楣事。
  - index: 11
    word: 孤立無援
    definition: 遇到困難沒人幫忙，只能獨自面對。
  - index: 12
    word: 逞強
    definition: 明明撐不住，還硬要裝作沒事、自己扛。
  - index: 13
    word: 撥雲見日
    definition: 困難慢慢過去，情況變好，看見希望。
  - index: 14
    word: 有憑有據
    definition: 有證據、有依據，不是隨便說說。
  - index: 15
    word: 咆哮
    definition: 很大聲、很兇地吼叫或怒罵。
  - index: 16
    word: 得不償失
    definition: 得到的好處比付出的代價還小，結果不划算。
