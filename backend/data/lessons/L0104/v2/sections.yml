comprehension:
  questions:
  - index: 1
    answer: A
    stem: 第四段提及，安海瑟薇「猶豫要不要上台領獎」，最可能的原因是什麼？
    options:
      B: 她覺得獎項不重要，想低調生活
      C: 她天生很害羞，不喜歡公開場合
      D: 她認為自己不配得獎，想先反省
      A: 文中描述她陷入「笑也錯、不笑也錯」：笑被說假掰，不笑被說冷漠。她不是不在乎獎項，而是擔心任何反應都被剪輯嘲弄。
    rationale: 文中描述她陷入「笑也錯、不笑也錯」：笑被說假掰，不笑被說冷漠。她不是不在乎獎項，而是擔心任何反應都被剪輯嘲弄。
    is_rationale: true
  - index: 2
    answer: B
    stem: 本課為什麼要說安海瑟薇的故事？作者最主要的用意是什麼？
    options:
      B: 只要沉默到底，就能證明自己問心無愧、問題會消失
      C: 反擊可能升高衝突、被抓把柄，應先冷處理並保護自己
      D: 霸凌者不可理喻，因此最好的做法是完全切斷所有關係
      A: 遇到霸凌要更強硬回擊，才不會被看扁
    rationale: 名人案例能提高說服力：連好萊塢明星也會受害，表示這不是「你太脆弱」，而是霸凌機制本來就會擴散與貼標籤。
  - index: 4
    answer: D
    stem: 下列何者最符合本文主旨？
    options:
      A: 成名後難免被討厭，最好的方法就是習慣網路酸言
      B: 被霸凌多半是誤會，只要有適當的解釋就能讓大家改觀
      C: 演員形象影響工作，因此應該避免在網路上表達任何情緒
      D: 網路霸凌會造成傷害，遭遇時應如何面對、求助、避免受傷
    rationale: null
  - index: 5
    answer: D
    stem: 同學在班群被取笑後想立刻回嗆，最符合本文建議的做法是什麼？
    options:
      B: 發限動公審對方，讓他也難堪
      C: 退出群組就好，不需要留下任何紀錄
      D: 先停損離開現場，截圖蒐證再求助
    rationale: 文章主張「冷處理、不要以牙還牙」並「蒐證」，同時要「不要一個人扛」尋求師長協助。
