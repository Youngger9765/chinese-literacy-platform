spotlight:
  lesson: G7-L7
  strategy_name: 摘要策略-用問題解決結果找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: '你以前學過用「問題—解決—結果」抓文章摘要。這篇文章也有相同結構，只是換了比較貼近生活的名稱：

      問題（困擾）→解決（策略）→結果（改變）

      閱讀時，只要掌握這個結構，就可以快速抓到文章的重點，並進一步推論出主旨或作者意圖喔。

      請你先試著連連看，把左邊「元素」和右邊「關鍵概念」連起來。'
  - type: guide
    text: 一、找重點：問題（困擾）→解決（策略）→結果（改變）
  - type: guide
    text: 表：本課的結構：困擾→策略→改變
  - type: table
    rows:
    - - 元素
      - 根據課文內容，請填寫答案（答案合理即可）
    - - ❶困擾
      - "❶作者說生活中，你可能會遇到什麼困擾？\n   網路霸凌"
    - - '❷策略

        (段6~8）'
      - "❷遇到這個困擾，你可以怎麼做？（根據課文寫下具體的作法）\n1. 不要一個人扛，可以向信任的大人求助                      \
        \   \n2.冷處理，不要急著以牙還牙，截圖留下證據                      \n3.照顧好自己的情緒，找到方法紓壓，需要時求助找人陪伴"
    - - ❸改變
      - "❸做了之後，會出現什麼改變？\n   好好活著、慢慢走下去，終有撥雲見日的一天"
  - type: guide
    text: 二、推論主旨與作者意圖
  - type: single
    prompt: 1.根據你找到的重點，這篇文章的主旨是什麼（本文在說什麼）？（單選）
    options:
    - 安海瑟薇得獎後被討厭，所以名人都很辛苦
    - 網路霸凌會擴散放大並傷人，作者教你自保並走向復原
    - 遇到霸凌時，只要退出群組就能立刻解決問題
    - 網路世界太可怕，所以最好完全不上網
    answer: 網路霸凌會擴散放大並傷人，作者教你自保並走向復原
  - type: single
    prompt: 2.本文作者意圖（作者想影響你什麼？）（4選2）
    options:
    - 讓你知道「求助不是示弱」，遇到霸凌不要獨自硬撐
    - 鼓勵你立刻回嗆到底，才不會被看扁
    - 提醒你先停損、冷處理並蒐證，避免衝突升溫
    - 要你學會模仿明星受訪的表情管理，避免被剪短片
    answer: 讓你知道「求助不是示弱」，遇到霸凌不要獨自硬撐
  - type: guide
    text: ※區分主旨和作者意圖（很重要）
  - type: passage
    source: unknown
    paragraphs:
    - 主旨：這篇「在說什麼重點」
    - 意圖：作者「希望你怎麼想、怎麼做」
  - type: self_check
    items:
    - 我能根據文章的結構（困擾、策略、改變）找到文章重點。
    - 我能根據文章重點推論出文章主旨和作者意圖。
