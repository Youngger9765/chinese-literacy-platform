passage: 根據她的經驗，如果你正在經歷網路或關係霸凌，第一步是「不要一個人扛」，求助不是示弱，逞強硬撐只會使自己更加孤立無援。這不是你太玻璃心，是你正在被傷害。把你的委屈說給信任的大人聽——導師、家長、輔導老師都可以。你願意開口，就是在黑暗裡點一盞燈，有人能陪你一起處理問題，終有撥雲見日的一天。
