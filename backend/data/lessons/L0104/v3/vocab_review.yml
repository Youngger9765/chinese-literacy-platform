    target_words: 灰框列 16 個（三行），與三大題「本課語詞」框的 16 個完全相同，只是順序不同。
    answer_paths: '16 條路徑對 16 個目標語詞，逐格取字皆能拼回，格子沒有錯字。

      ✅ 幾何交叉驗證：全檔 `roundRect` **17** 個，但其中一個是**紙外殘留**——

      它的框線硬寫死 `srgbClr E97132`（其餘 16 個都用佈景色 `accent2`），

      而且 `positionH relativeFrom="rightMargin" posOffset=5264785`（約 5.76 in，

      加回右邊界基準遠超過 A4 頁寬 8.27 in）。扣掉它之後紙上 **16 個 ＝ 16 條路徑**。

      ⚠️「強」（第 6 列第 5 欄）同時屬於「逞強」與「強顏歡笑」兩條路徑（十字交叉），

      不是重複圈選。

      ⚠️ 干擾字：第 5 列第 2~3 欄的「添」「醋」、第 9 列第 1~3 欄的「援」「雲」「見」、

      第 10 列第 6~7 欄的「進」「退」都接不出完整語詞。'
