strategy_explained: '這一課，我們要練習的是「從故事裡找出問題、怎麼解決，還有最後的結果是什麼」的能力

  這篇故事講到名人也會被批評，就像我們遇到網路上的惡意評論一樣，很適合用來練習從主角遇到的「問題」、作者給的「解決方法」、以及事情的「結果」來抓到文章的重點

  讀的時候，你可以想想看，安海瑟薇遇到了什麼「問題」，她又是怎麼「解決」的，最後得到了什麼「結果」'
