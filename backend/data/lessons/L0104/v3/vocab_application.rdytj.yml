    stem: 有人發現他就是謠言的源頭，他因此成為（　），大家都罵他。
    answer: A
  - index: 2
    stem: 校際盃連敗兩場後，球隊（　），把失誤逐項檢討。
    answer: E
  - index: 3
    stem: 她故意捏著嗓音說：「哎呀，對不起啦，人家又不是故意的。」表現得非常（　）。
    answer: F
  - index: 4
    stem: 她被闖紅燈的摩托車嚇到，閃避時重重跌了一跤，真是（　）。
    answer: D
  - index: 5
    stem: 他校隊選拔遭到淘汰後，雖然難過，仍然（　）安慰隊友。
    answer: C
  - index: 6
    stem: 經過完整調查，真相終於（　），被冤枉的人也得以澄清。
    answer: G
  - index: 7
    stem: 大家都想開冷氣，卻沒有人希望發電廠蓋在附近，政府真是（　）。
    answer: J
  - index: 8
    stem: 導師叫我下課找她說明作弊的事，我這節課（　），無法專心上課。
    answer: B
