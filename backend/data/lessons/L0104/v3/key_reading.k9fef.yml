  passage: 根據她的經驗，如果你正在經歷網路或關係霸凌，第一步是「不要一個人扛」，求助不是示弱，逞強硬撐只會使自己更加孤立無援。這不是你太玻璃心，是你正在被傷害。把你的委屈說給信任的大人聽——導師、家長、輔導老師都可以。你願意開口，就是在黑暗裡點一盞燈，有人能陪你一起處理問題，終有撥雲見日的一天。第二是「冷處理，不要急著以牙還牙」。瘋狗在咆哮撕咬時，你愈用棒子打，牠咬得愈凶。你在網路上的反擊往往得不償失，還可能被對方抓到把柄再反咬一口。你可以簡短表明立場後離開霸凌現場，也可以調整隱私、封鎖、檢舉，降低對方繼續騷擾你的機會。先停損，才不必讓自己陷入無休止的口水戰；記得把留言、私訊、群組對話截圖，記下時間與帳號，後續處理時才能有憑有據。最後，請把照顧自己的情緒當成大事。霸凌的語言雖然可能很刺耳，但那不能定義你是誰；真正該被停止的是傷害，你不必因此否定自己。你可以用運動、寫日記、和支持你的朋友聊天等方式來紓壓，暫時遠離讓你焦慮的網路環境；如果你開始失眠、害怕上學、一直想哭或情緒崩潰，就更要向家人、師長或專業人員尋求協助。
