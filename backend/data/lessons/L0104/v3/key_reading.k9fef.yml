  start_paragraph_note: '三個訊號一致：指示語印「（六　）」、☞ 圖形印在第 6 段句首、

    字數欄的 29 個前置空段落正好把第 1~5 段的行數空掉（第 30 行同時是段號「六」與數字「28」）。'
