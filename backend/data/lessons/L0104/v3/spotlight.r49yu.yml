lesson_uid: L0104
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略——用問題-解決-結果找重點
  strategy_type: summarize
  section_title_printed: 閱讀聚光燈
  answer_carrier: '三種載體混用：連連看＝紅色連線（圖形，3 條）；一、找重點的表格＝橘色手寫字；

    二、推論主旨與作者意圖＝紅色 ☑（w:sym Wingdings F0FE，全課僅有的 3 個）。'
  structure_note: '⛔ 兩張表都留在 blocks 最上層、沒有塞進 sub_block ——

    `renderSubBlock` 不依 type 分派，巢狀的表格只會畫出 instruction，

    `columns`/`rows` 會整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '你以前學過用「問題—解決—結果」抓文章摘要。這篇文章也有相同結構，只是換了比較貼近生活的名稱：

      問題（困擾）→解決（策略）→結果（改變）

      閱讀時，只要掌握這個結構，就可以快速抓到文章的重點，並進一步推論出主旨或作者意圖喔。'
    text_note: '這一段裡的箭頭「→」是**真的文字字元**（在 `w:t` 裡），跟 L0103 的 Wingdings 符號不同，

      所以照抄即可。第一行的「問題—解決—結果」用的則是破折號。'
  - type: matching
    instruction: 請你先試著連連看，把左邊「元素」和右邊「關鍵概念」連起來。
    left_header: 元素
    right_header: 關鍵概念或提示
    left:
      1: 問題(困擾)
      2: 解決(策略)
      3: 結果(改變)
    right:
      A: '作者提出哪些解決方法？

        （可能出現第一、第二、最後等關鍵詞）'
      B: 遇到什麼困擾？（常在開頭段）
      C: '做了之後會出現什麼改變？

        （常在最後段）'
    answer:
      1: B
      2: A
      3: C
    answer_carrier: 紅色連線（圖形層的 3 條 `line`，`srgbClr FF0000`）
    answer_note: "\U0001F534 **PDF 上看不到這三條線**（LibreOffice 沒把該群組畫出來），只看 PDF 會判成\n「教師版沒連線、無答案可轉錄」。答案是從\
      \ `document.xml` 的線段端點座標解出來的：\n群組「群組 17」內三條 FF0000 的 `line`，縱向範圍 y=23153~1291926\
      \ 對應三列，\n  ・(69147, 23153) → (930118, 581920)：左第 1 列 → 右第 2 列，即 (1) → B\n  ・(76177,\
      \ 616492) → (930060, 23154)（flipV）：左第 2 列 → 右第 1 列，即 (2) → A\n  ・(92577, 1291926)\
      \ → (906514, 1291926)：水平，左第 3 列 → 右第 3 列，即 (3) → C\n三條的語意也各自合理（困擾＝遇到什麼困擾、策略＝提出哪些解決方法、改變＝出現什麼改變）。"
    left_note: 左欄每一列在原稿另有一個 (1)(2)(3) 的序號欄，此處以 left 的 key 表示。
  - type: guide
    text: 一、找重點：問題（困擾）→解決（策略）→結果（改變）
  - type: guide
    text: 表：本課的結構：困擾→策略→改變
  - type: fill_table
    columns:
    - 元素
    - 填寫答案
    column_headers_printed:
    - 元素
    - 根據課文內容，請填寫答案（答案合理即可）
    rows:
    - 元素: ❶困擾
      填寫答案: ❶作者說生活中，你可能會遇到什麼困擾？
      填寫答案_answer: 網路霸凌
    - 元素: '❷策略

        (段6~8）'
      填寫答案: ❷遇到這個困擾，你可以怎麼做？（根據課文寫下具體的作法）
      填寫答案_answer: '1. 不要一個人扛，可以向信任的大人求助

        2.冷處理，不要急著以牙還牙，截圖留下證據

        3.照顧好自己的情緒，找到方法紓壓，需要時求助找人陪伴'
    - 元素: ❸改變
      填寫答案: ❸做了之後，會出現什麼改變？
      填寫答案_answer: 好好活著、慢慢走下去，終有撥雲見日的一天
    rows_note: '答案是**開放式**的（表頭就寫「答案合理即可」），教師版填的內容放在 `_answer` 側欄。

      ⚠️ 第 2 列左格的「(段6~8）」左括號半形、右括號全形，原稿如此。

      ⚠️ ❸ 那一列的答案在 PDF 上被分頁切到下一頁（p6 只看得到空格、p7 才有橘字），

      單看 p6 會判成「這一格沒答案」。'
    answer_carrier: 橘色手寫字（PDF p6~p7）；文字層裡已有同樣的文字
  - type: guide
    text: 二、推論主旨與作者意圖
  - type: single
    prompt: 1.根據你找到的重點，這篇文章的主旨是什麼（本文在說什麼）？（單選）
    options:
      1: 安海瑟薇得獎後被討厭，所以名人都很辛苦
      2: 網路霸凌會擴散放大並傷人，作者教你自保並走向復原
      3: 遇到霸凌時，只要退出群組就能立刻解決問題
      4: 網路世界太可怕，所以最好完全不上網
    answer: 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: multi
    prompt: 2.本文作者意圖（作者想影響你什麼？）（4選2）
    options:
      1: 讓你知道「求助不是示弱」，遇到霸凌不要獨自硬撐
      2: 鼓勵你立刻回嗆到底，才不會被看扁
      3: 提醒你先停損、冷處理並蒐證，避免衝突升溫
      4: 要你學會模仿明星受訪的表情管理，避免被剪短片
    answer:
    - 1
    - 3
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）兩個
  - type: guide
    text: '※區分主旨和作者意圖（很重要）

      主旨：這篇「在說什麼重點」

      意圖：作者「希望你怎麼想、怎麼做」'
    text_note: 後兩行原稿前面各有一個 ● 項目符號。
  - type: self_check
    label: ◎自我檢核（請打勾）
    items:
    - 1.我能根據文章的結構（困擾、策略、改變）找到文章重點。
    - 2.我能根據文章重點推論出文章主旨和作者意圖。
    items_note: 兩個框在原稿上都是空的（□，沒有 ☑）—— 自我檢核由學生自填。
