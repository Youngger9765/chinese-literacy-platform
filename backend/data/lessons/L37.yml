multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 聽了老師的說明，他「赫然」發現自己的錯誤，只好連聲說抱歉。
  - 他「環顧」手機裡所有關於大谷翔平的資料，覺得非常佩服。
  - 坐車時，如果看到老人或孕婦，我都會「移駕」，把座位讓給他們。
  - 他們用這麼少的經費，蓋出這麼高品質的房子，真是「令人髮指」。
  answer: A
  explanation: 選項A中「赫然」表示令人吃驚地發現錯誤，符合其「醒目或令人吃驚」的語意；選項B「環顧」是觀察周圍，不能用於查看手機資料；選項C「移駕」是請人移動的敬語，不能用於自己；選項D「令人髮指」是形容極度憤怒，
- question: 底下選項中，哪一項最可能是作者的寫作手法與目的？
  options:
  - 用令人髮指的的老太太謀殺案，說明警方伸張正義的決心。
  - 用具體的事例，鮮活的對話，說明李昌鈺辦案的科學方法。
  - 用李昌鈺和警察同仁的比較對照，凸顯李昌鈺的聰明過人。
  - 用年輕白人的真實個案，說明犯罪者如何一步一步走向岐途。
  answer: B
  explanation: 課文標題與引言都明確指出本課旨在透過具體案例，說明李昌鈺博士如何運用科學方法來辦案。
- question: 根據本文，下列何者「不是」李昌鈺運用科學方法辦案的過程？
  options:
  - 推想凶手鞋子在哪裡？去哪裡找鞋子主人的過程。
  - 接到電話就儘速在大雪天趕到凶案現場。
  - 現場看不到血，推論血跡可能被清理過了，或者這裡不是第一現場。
  - 噴灑化學藥品，尋找血跡反應，確認該處是否為案發現場。
  answer: B
  explanation: 選項B描述的是接到通知後迅速抵達現場的行動，屬於辦案的準備或執行層面，而非李昌鈺博士運用科學方法「產生問題、提出假設、驗證假設」的具體過程。而A、C、D選項都涉及了證據分析、推論與驗證等科學辦案的環節
- question: 第11段李昌鈺說：「鞋子是不是在購物中心旁邊的垃圾箱找到的？」提出這個問題，李昌鈺需要哪一種能力？
  options:
  - 觀察力。
  - 推論力。
  - 創造力。
  - 批判力。
  answer: B
  explanation: 李昌鈺博士提出「鞋子是不是在購物中心旁邊的垃圾箱找到的？」這個問題，是基於他對案件的分析和線索的推敲，從而推斷出鞋子可能存在的地點，並以此向他人求證，展現了其卓越的推論能力。
- question: 李昌鈺是位厲害的辦案人員，本課最強調他的哪一個特性?
  options:
  - 假作真時真亦假，無為有處有還無。
  - 法網恢恢，疏而不失。
  - 從蛛絲馬跡推論出合理假設的能力。
  - 萬物靜觀皆自得。
  answer: C
  explanation: 課文明確指出李博士在辦案過程中，根據問題提出假設，最後驗證了假設，這正強調了他從細微線索進行推論的能力。
