vocabulary:
- word: 赫然
  definition: 醒目或令人吃驚。
- word: 惺忪
  definition: 剛睡醒，瞇著眼，看不清楚的樣子。
- word: 令人髮指
  definition: 使人憤怒到了極點，頭髮都豎了起來。
- word: 逕自
  definition: 直接行動。
- word: 孤苦伶仃
  definition: 孤單、無依無靠。
- word: 環顧
  definition: 觀察周圍。
- word: 一不做二不休
  definition: 指事情既然已經做了壞事，就不中途罷休，表示決心做到底。乾脆、索性。
- word: 環顧
  definition: 觀察周圍。
- word: 移駕
  definition: 很尊敬、客氣地請人移動到某地方（這是敬語，自己移動就不能用移駕這兩個字）。
- word: 兵貴神速
  definition: 做事時，速度非常重要。
vocabulary_count: 10
