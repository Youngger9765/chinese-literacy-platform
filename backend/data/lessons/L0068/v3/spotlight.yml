version_id: v3
section_no: 一
spotlight:
  strategy_name: 自我提問策略2──跟著人物故事線問問題
  strategy_type: self_questioning
  section_title_printed: 閱讀聚光燈-自我提問策略2──跟著人物故事線問問題
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層但非 ☑ 字元）
  structure_note: '原稿是「課文段落 → 停點方框」交錯排列，本檔照實際閱讀動線攤平成

    passage → 停點題組 → passage → 停點題組。停點方框在原稿是巢狀表格，

    不塞進 sub_block —— `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，

    巢狀的選項會整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '上一課，我們學會：讀人物故事時，先看故事發展到哪裡，再選一個適合的問題，帶著問題讀下一部分：

      ①他想做什麼？為什麼想做？

      ②他遇到什麼困難？怎麼繼續下去？

      ③最後有什麼成果？帶來哪些改變？

      讀完後，再檢查：我能回答問題，也找得到課文線索嗎？回答不完整，就回頭找線索。

      這一課，我們用同樣的方法讀阿介的故事。'
  - type: guide
    text: 先問，再讀：閱讀比較有方向
  - type: guide
    text: '【停點A】閱讀全文前

      自我提問

      ❶先問，再讀'
  - type: single
    prompt: 1.看到標題，知道這是一篇人物故事。故事一開始，最適合帶著哪個問題讀？
    options:
      1: 他想做什麼？為什麼想做？
      2: 他遇到什麼困難？怎麼繼續下去？
      3: 最後有什麼成果？帶來哪些改變？
    answer: 1
  - type: guide
    text: '❶先問，再讀

      2.帶著問題讀

      讀到【停點B】，把能回答上一題選項(如：想做什麼、「為什麼)的句子畫線。'
    note: 「(如：想做什麼、「為什麼)」的引號與括號在原稿就不對稱，照抄未補
  - type: passage
    label: 植物獵人
    paragraphs:
    - （段1）臺灣有個只有國中學歷的植物獵人，名叫洪信介，大家都稱他為阿介。他是臺灣山林界的傳奇，也是許多博士、教授倚重的合作夥伴。
    - （段2）但你知道嗎？阿介從小過動，不擅長與人相處，在課堂上總是坐不住，成績更是慘不忍睹，學習路上挫折不斷。長大後，他的工作也一直不穩定，四十四歲以前，只能靠打零工維生。所幸，他一直熱愛植物，也在大自然中找到了屬於自己的祕密花園。雖然在學校時課業不好，他卻沒有停止學習植物知識。植物圖鑑是他的精神糧食，遇到不懂的地方，他就請教專家，不斷汲取新知。日積月累，連拗口的植物學名也難不倒他。對植物的熱愛，讓他找到適合自己的學習方式，也奠定了日後成為植物獵人的基礎。
    - （段3）為什麼需要植物獵人呢？氣候變遷與人為開發不斷破壞棲地，使許多物種悄然從地球上消失。為了維持生態多樣性，科學家必須跟時間賽跑，趕在這些物種滅絕前，將它們保存下來，讓後世的科學家研究與復育。
    - （段4）但是，要在原始森林裡採集植物並不容易。森林裡的植物分布位置有高有低，有些接近地面，有些位在高大的樹木上。位置越高，採集就越困難，樹冠層的植物尤其難以取得。採集者不只要會爬山、爬樹，還要能在無水無電、杳無人煙的森林裡求生；同時，也得辨識物種，判斷哪些植物稀有或具有研究價值。能爬山、爬樹、在野外求生的人其實不少，熟悉植物的人也有，但能同時具備山林能力與植物專業的人少之又少，阿介正是其中的佼佼者。他走在樹上就像走在平地一樣自然，又有專業的植物知識，能和科學家溝通。多年累積的山林經驗與植物知識，使他成為許多植物專家心目中的不二人選。
    - （段5）2008年，辜嚴倬雲植物保種中心成立，需要植物獵人進行野外採集，以保存逐漸從野外消失，甚至瀕臨滅絕的物種。阿介很想進入保種中心，讓自己多年累積的山林經驗和植物專長，真正用在植物保育上。
    paragraphs_note: 原稿印（段1）～（段5），第 5 段末印【停點B】
  - type: self_check
    label: 【停點B】❶停一下，檢查理解
    items:
    - 我找到答案。
    - 我找到部分答案，要再回頭讀第2～5段找線索。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩格都是空的 □
  - type: single
    prompt: '❷先問，再讀

      知道阿介想做什麼了，接下來最適合帶著哪個問題讀？'
    options:
      1: 他想做什麼？為什麼想做？
      2: 他遇到什麼困難？怎麼繼續下去？
      3: 最後有什麼成果？帶來哪些改變？
    answer: 2
  - type: guide
    text: '❸帶著問題

      讀到【停點C】，把阿介遇到的困難和他採取的行動畫線。'
  - type: passage
    label: 植物獵人
    paragraphs:
    - （段6）然而，保種中心卻因為他只有國中學歷，多次拒絕他。
    - （段7）阿介沒有就此放棄。為了跨過學歷這道門檻，中年的他決定重返校園，考上員林農工園藝科。這一次，他成為全班最認真的學生。對自己喜歡、擅長的事，他有一種「要做就做到最好」的執著。最後，他終於以學生身分進入保種中心，讓多年累積的能力有了發揮的機會。
    paragraphs_note: 原稿印（段6）（段7），第 7 段末印【停點C】
  - type: self_check
    label: 【停點C】❶停一下，檢查理解
    items:
    - 我能回答問題。
    - 我只能回答一部分，要再回頭讀第6段找線索。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩格都是空的 □
  - type: guide
    text: '❷同一個問題，繼續讀

      段8說他的困難還沒結束。

      請繼續帶著剛才的第②個問題，讀到【停點D】。把工作的困難，以及阿介仍持續採集的行動和原因畫線。'
  - type: passage
    label: 植物獵人
    paragraphs:
    - （段8）進入保種中心後，他面對的困難並沒有結束。阿介每年將近三分之一的時間待在森林裡。為了採集稀有植物，他常帶著一把鐮刀，揹著四十公斤重的背包，獨自徒步進入山林十幾天。他要沿途砍路、辨認與採集植物、進行現場測量，並完整記錄數據。在茂密的山林中，他還必須快速掃視四周，認出稀有且瀕危的植物。
    - （段9）有人說，阿介從事的是全臺灣最危險的工作。為了採集植物，即使面對近乎垂直的峭壁，他也要冒著生命危險，想盡辦法爬上去。他曾一腳踩在枯枝上，從二十公尺高的樹上摔下；也曾在山林裡迷路，「在山上哭了三天」，才僥倖存活。他曾經兩天沒吃飯，只能吃腐木中的蟲。有一次，他受傷躺在地上，黃喉貂以為他死了，把他當成獵物；沒想到，他反而設下陷阱抓住牠，靠牠充飢，才活了下來。至於被虎頭蜂追，更是家常便飯。
    - （段10）有人問阿介：「植物獵人這份工作，賺錢不多，又辛苦又危險，為什麼還要繼續下去？」阿介回答：「有些事情還是必須要有人去做啊！」他最大的期望，就是讓瀕臨絕種的植物得到妥善照顧，在保種中心永續留存，甚至有朝一日能在野外成功復育。這也是他一次次走入危險山林的原因。
    paragraphs_note: 原稿印（段8）（段9）（段10），第 10 段末印【停點D】
  - type: guide
    text: 【停點D】❶停一下，檢查理解
  - type: single
    prompt: 1.阿介遇到的困難？
    options:
      1: 工作辛苦又危險
      2: 缺乏植物知識
    answer: 1
  - type: single
    prompt: 2.他怎麼繼續？
    options:
      1: 等危險消失，再進山採集
      2: 靠專業與保育使命，繼續進山採集
    answer: 2
  - type: self_check
    label: 3.理解情況
    items:
    - 兩個問題都能回答
    - 我只找到部分答案，要再回頭讀第8～9段找線索。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩格都是空的 □
  - type: single
    prompt: '❷先問，再讀

      知道阿介遇到的困難，以及他怎麼繼續下去。

      接下來最適合帶著哪個問題讀？'
    options:
      1: 他想做什麼？為什麼想做？
      2: 他遇到什麼困難？怎麼繼續下去？
      3: 最後有什麼成果？帶來哪些改變？
    answer: 3
  - type: guide
    text: '❸帶著問題

      讀到【停點E】，把找到的答案畫線。'
  - type: passage
    label: 植物獵人
    paragraphs:
    - （段10）二十五年來，阿介一次次走進山林，總共採集了兩萬種植物。他完成許多植物學家難以獨自完成的野外採集，也成為多篇學術論文的作者之一。因為他的努力，許多珍稀植物有了被保存、研究與復育的機會，更多人也開始看見植物保育的重要。
    - （段11）而山林帶給他的，還不只是這些成就。過去，他在學校和工作中屢受挫折，嘗盡人情冷暖，甚至覺得自己這輩子就是一個衰人，人生看不出有什麼意義。然而，默默累積的山林經驗和植物專業知識並沒有白費。如今，他對各種植物的名稱與特性倒背如流，也能和研究人員用專業語言溝通。這份專業為他贏得尊重，也讓他找回失去已久的自信。
    - （段12）他曾說：「在社會中，我是個貧窮失敗的人。」但是，在森林裡，他不只保存了植物，也找回了自己，走出一條真正屬於自己的路。
    paragraphs_note: 原稿印（段10）（段11）（段12）—— 第一段的段號重複，見 source_errata E1；末段印【停點E】
  - type: self_check
    label: 【停點E】❶停一下，檢查理解
    items:
    - 兩個角度都能回答。
    - 我只找到一部分，要再回頭讀第10～12段。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿兩格都是空的 □
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我會跟著人物故事的發展，選出適合的問題，帶著問題讀。
    - 2.我會檢查答案是否完整；不完整時，回頭找線索。
    - 3.下次讀人物故事時，我會再用這三個問題，讓閱讀更有方向。
    no_correct_answer: true
