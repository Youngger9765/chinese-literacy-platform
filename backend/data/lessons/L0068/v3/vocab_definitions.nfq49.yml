  items:
  - index: 1
    word: 奠定
    definition: 建立穩固的基礎。
  - index: 2
    word: 永續
    definition: 能長久維持下去。
  - index: 3
    word: 瀕臨
    definition: 接近、快要面臨。本文「瀕臨滅絕」是指快要滅絕。
  - index: 4
    word: 樹冠
    definition: 樹木上方長著許多樹枝和葉子的部分。
  - index: 5
    word: 汲取
    definition: 吸收、取得。常用來指學到知識或經驗。
  - index: 6
    word: 倚重
    definition: 信任並重視，常把重要工作交給他。
  - index: 7
    word: 變遷
    definition: 隨著時間產生的變化。
  - index: 8
    word: 杳無人煙
    definition: 形容地方偏僻荒涼，幾乎看不到人。
  - index: 9
    word: 佼佼者
    definition: 在一群人中特別優秀、出眾的人。
  - index: 10
    word: 僥倖
    definition: 靠運氣意外成功或逃過危險。
  - index: 11
    word: 棲地
    definition: 生物居住、覓食和繁殖的地方。
