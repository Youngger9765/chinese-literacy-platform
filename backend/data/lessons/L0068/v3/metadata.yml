strategy_explained: '這一課我們要練習的是「問對重要的問題」，這能幫助你更深入理解故事，找出關鍵訊息，像是阿介為什麼能成為植物學家們的好幫手，以及他在艱辛採集過程中，是如何保持那份堅持的

  讀的時候，你可以試著問自己：「阿介是怎麼克服學歷限制的呢」「遇到危險時，他為什麼還能繼續下去」這些問題，你會發現故事裡很多值得你學習的地方'
