lesson_uid: L0068
version_id: v3
section_no: 五
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（PDF p7）；文字層的（　）內已填有同樣的代號
  questions:
  - index: 1
    answer: C
    stem: 請問哪一個句子使用語詞有誤？
    options:
      A: 這位研究員經驗豐富，深受團隊「倚重」
      B: 森林被開發後，許多動物失去了原有的「棲地」
      C: 這座夜市人潮擁擠，真是「杳無人煙」
      D: 她從閱讀和旅行中不斷「汲取」新的經驗
    explanation: C語詞誤用，杳無人煙是指荒涼無人居住、很少人的地方，不能形容鬧市。
    explanation_note: 原稿是一個浮動說明框，印在選項 C 右側
  - index: 2
    answer: D
    stem: 根據文章，「植物獵人」最主要的工作是什麼？
    options:
      A: 在保種中心照顧已保存的植物
      B: 在農田中替植物防治病蟲害
      C: 在實驗室中分析植物生長資料
      D: 進入野外辨認並採集稀有植物
    explanation: 第3～4段說明，植物獵人必須具備山林求生與植物專業；第7段則寫出阿介進入山林辨認、採集與記錄植物。
    explanation_note: 說明框寫「第7段」，進山辨認採集實際印在（段8）；照原稿記錄，未更動
  - index: 3
    answer: B
    stem: 本文第6段，阿介如何跨過學歷門檻，進入保種中心？
    options:
      A: 持續自學，請專家替他推薦
      B: 重返校園，考上園藝科就讀
      C: 累積經驗，說服中心取消限制
      D: 參加採集，先證明自己的能力
    explanation: (第6段：中年重回校園，考上員林農工園藝科後，成為全班最認真的學生。)
    stem_note: 題目寫「第6段」，重返校園實際印在（段7）；（段6）只有一句「保種中心卻因為他只有國中學歷，多次拒絕他」。照原稿記錄，未更動
    explanation_note: 原稿是一個浮動說明框，PDF 上尾字被下方文字裁掉，文字層完整
  - index: 4
    answer: B
    stem: 洪信介說：「有些事情還是必須要有人去做啊！」請問這件事指的是什麼？
    options:
      A: 積極投入種樹的行列
      B: 保育瀕危絕種的植物
      C: 建造瀕危植物的庇護所
      D: 考上員林農工園藝科
    explanation: 第9段接著說，阿介最大的期望是讓瀕臨絕種的植物得到妥善照顧、永續留存，甚至在野外復育。
    explanation_note: 說明框寫「第9段」，最大的期望實際印在（段10）；照原稿記錄，未更動
  - index: 5
    answer: C
    stem: 下列哪一項最能概括阿介的人生轉變？
    options:
      A: 他靠過人的膽識克服危險，最後取代植物學家完成研究
      B: 他不在意學歷門檻，只憑興趣就順利進入保種中心
      C: 他長期累積植物專業、跨越阻礙，也在保育工作中找到價值
      D: 他為了受到世界注目，才願意持續從事危險的採集工作
    explanation: 第2段寫出阿介因熱愛植物而持續學習；第5～6段寫他跨越學歷門檻；第9～10段則寫他投入植物保育，最後找回自信與人生價值。
    explanation_note: 說明框引用的段號與課文印的（段N）同樣差一號；照原稿記錄，未更動
