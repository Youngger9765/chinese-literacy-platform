comprehension:
  questions:
  - index: 1
    answer: C
    stem: 請問哪一個句子使用語詞有誤？
    options:
      A: 這位研究員經驗豐富，深受團隊「倚重」
      B: 森林被開發後，許多動物失去了原有的「棲地」
      D: 她從閱讀和旅行中不斷「汲取」新的經驗
      C: C語詞誤用，杳無人煙是指荒涼無人居住、很少人的地方，不能形容鬧市。
    rationale: C語詞誤用，杳無人煙是指荒涼無人居住、很少人的地方，不能形容鬧市。
    is_rationale: true
  - index: 2
    answer: D
    stem: 根據文章，「植物獵人」最主要的工作是什麼？
    options:
      B: 在農田中替植物防治病蟲害
      C: 在實驗室中分析植物生長資料
      D: 進入野外辨認並採集稀有植物
    rationale: 第3～4段說明，植物獵人必須具備山林求生與植物專業；第7段則寫出阿介進入山林辨認、採集與記錄植物。
  - index: 3
    answer: B
    stem: 本文第6段，阿介如何跨過學歷門檻，進入保種中心？
    options:
      B: 重返校園，考上園藝科就讀
      C: 累積經驗，說服中心取消限制
      D: 參加採集，先證明自己的能力
    rationale: 第6段：中年重回校園，考上員林農工園藝科後，成為全班最認真的學生。
  - index: 4
    answer: B
    stem: 洪信介說：「有些事情還是必須要有人去做啊！」請問這件事指的是什麼？
    options:
      B: 保育瀕危絕種的植物
      C: 建造瀕危植物的庇護所
      D: 考上員林農工園藝科
    rationale: 第9段接著說，阿介最大的期望是讓瀕臨絕種的植物得到妥善照顧、永續留存，甚至在野外復育。
  - index: 5
    answer: C
    stem: 下列哪一項最能概括阿介的人生轉變？
    options:
      A: 他靠過人的膽識克服危險，最後取代植物學家完成研究
      B: 他不在意學歷門檻，只憑興趣就順利進入保種中心
      C: 他長期累積植物專業、跨越阻礙，也在保育工作中找到價值
      D: 他為了受到世界注目，才願意持續從事危險的採集工作
    rationale: 第2段寫出阿介因熱愛植物而持續學習；第5～6段寫他跨越學歷門檻；第9～10段則寫他投入植物保育，最後找回自信與人生價值。
