lesson_uid: L0006
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列哪一個句子，「」中的語詞使用錯誤？
    options:
      A: 面對好友的邀約，他內心十分「糾結」，不知道該怎麼選擇
      B: 看見受傷的狗，他「無動於衷」地送去醫院，焦急等待醫生
      C: 阿公老了，爬樓梯時常覺得「力不從心」，得慢慢走才不會喘
      D: 她習慣睡前「反芻」當天發生過的事情，從中學習寶貴經驗
  - index: 2
    answer: D
    stem: 「他每經過一個人，那一個人的頭就低了下來。」請從前後文推論乘客們為什麼要低頭，並選出最可能的答案。
    stem_source_text: 「他每經過每個人，那一個人的頭就低了下來。」請從前後文推論乘客們為什麼要低頭，並選出最可能的答案。
    errata_ref: E1
    options:
      A: 他們覺得無聊，低頭只是繼續做自己的事情
      B: 他們很生氣，覺得年輕人太麻煩所以不想看他
      C: 他們不敢直視年輕人，可能是因為害怕他報復
      D: 他們為剛才誤會感到慚愧，低頭不好意思看他
  - index: 3
    answer: A
    stem: 作者（我）最後說：「原來我是無數加害者之一。」他最可能的情緒是什麼？
    options:
      A: 愧疚自責，因為自己也曾誤會並傷害過對方
      B: 緊張不安，擔心對方會因此記恨自己
      C: 生氣難過，無法接受自己竟然做錯了事情
      D: 沮喪放棄，覺得自己再怎麼補救也沒有用
    teacher_note: 這句話帶有明顯的自責語氣，敘述者發現自己先前的言行造成對方心理上的傷害，因此感到愧疚與懊悔。
  - index: 4
    answer: B
    stem: 年輕人說「我習慣了」，他想表達的最可能是哪一選項？
    options:
      A: 他很習慣把自己的座位讓給老人家
      B: 經常有人誤會他、要求他離開博愛座
      C: 他很習慣在與人發生衝突時離開現場
      D: 他習慣自己的身心障礙，已經不在意了
  - index: 5
    answer: C
    stem: 這篇故事主要想表達什麼？
    options:
      A: 做錯事情時要負起責任，勇敢面對錯誤與後果
      B: 年輕人搭車時應有禮讓心，主動讓座是基本禮貌
      C: 評斷他人前應了解真相，避免因誤會造成傷害
      D: 身體不便的人應該避免搭乘公車，以免造成他人困擾
    teacher_note: 本文敘述者對年輕人的誤解與事後懊悔，強調「不應只憑外表就下判斷」，要在充分理解後再做評價
