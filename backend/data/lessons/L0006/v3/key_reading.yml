  passage: 公車慢慢地停在站牌旁，一位白髮蒼蒼的老爺爺上了車，從他登階時的緩慢動作可以看出他的力不從心。車上已經擠滿了人，大家稍微讓開一條小路，讓老爺爺進入走道中間。老爺爺左顧右盼，可惜已經滿座，他只好站在博愛座旁的空間，拉著吊環，隨著晃動的公車搖搖擺擺，就像風中抖動的燭光。博愛座上坐著一個年輕人，動也不動，正埋頭看書。他看得那麼專心，似乎完全沒有注意到眼前站著一位老爺爺。我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。這時，突然一個煞車，乘客都猛然向前方傾倒，老爺爺更是差點仆倒在地。我心頭一緊，實在看不下去了，大聲對著年輕人說：「這裡是博愛座耶！你沒看見老人家站在你面前嗎？」大家也七嘴八舌的加入圍剿：「還假裝看書呢！」「這麼沒教養！」「有沒有上過公民課啊？」
