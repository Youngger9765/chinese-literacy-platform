lesson_uid: L0006
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略—推論情緒和感受
  strategy_type: inference
  blocks:
  - type: concept_box
    text: 上一課我們已經學過，可以透過「理解現場情境」與「觀察角色言行」，推論人物內心的情緒與感受。這一課，我們再加入「換位思考」，練習從人物角度理解感受。並進一步體會故事傳達的意義。
  - type: guide
    text: 一、推論情緒和感受有方法——換位思考
  - type: sub_block
    label: （一）理解現場情境
    hint: 小祕訣：推論角色的心情，要先了解角色遇到了什麼情況。可以試著「換位思考」—就是試著站在人物的角度想一想：他正在經歷什麼事？可能會有怎樣的感受？
    items:
    - index: 1
      label: ❶找情境
      prompt: 故事一開始，老爺爺上車後發生了什麼情況？（單選）
      options:
        1: 車上沒有空位，卻有一位年輕人坐在博愛座上看書。
        2: 年輕人主動起身讓座，老爺爺順利坐下休息。
      answer: 1
      answer_carrier: 紅色 ☑（圖形），被勾中的 □ 已從文字流消失
    - index: 2
      label: ❷推情緒
      prompt: 看到這種情況，你猜作者（我）的心情是什麼？為什麼？（請在□打勾）
      options:
        1: 開心，因為他看到年輕人坐車還在看書，值得讚賞
        2: 不高興，因為他認為年輕人沒有讓座給老人家。
      answer: 2
      answer_carrier: 紅色 ☑（圖形）
    - index: 3
      label: ❸換位思考
      prompt: 如果是你，看見需要幫助的老人沒有座位，心裡會有什麼感受呢？
      answer_free_text: 我會覺得生氣，年輕人怎麼可以坐博愛座
  - type: guide
    text: 小撇步
  - type: concept_box
    text: 推論情緒或感受，也可以用身歷其境的方法換位思考，想一想，「如果是你呢？你會有什麼感受？」這個方法，會讓你更容易體會角色的情緒與感受喔！
  - type: sub_block
    label: （二）觀察角色言行
    hint: 小祕訣：角色「說話內容、語氣、動作、表情」常常透露出他們的情緒哦！仔細觀察這些線索，就能更準確推測他們的感受。
    items:
    - index: 1
      label: ❶觀察言行
      passage: (第三段)我就在旁邊，看了這一幕，心裡有點不高興：「老人家就站在博愛座前，他怎麼可以無動於衷？」我的眉頭皺了起來，心裡很糾結，猶豫著要不要開口提醒他。
    - index: 2
      label: ❷找情緒
      prompt: 這一段明白寫出了作者哪些情緒或感受？（複選）
      multi: true
      options:
        1: 不高興
        2: 糾結、猶豫
        3: 懷疑
      answer:
      - 1
      - 2
      answer_carrier: 紅色 ☑（圖形）
    closing: ◎發現了嗎？角色的情緒或感受，有些會直接寫出來；如果沒有直接寫出來，就要根據情境和言行線索來推論喔。
  - type: fill_table
    label: 二、從故事發展，推論「作者」（我）的情緒或感受變化
    columns:
    - 事件
    - 關鍵線索
    - 「作者」（我）的情緒或感受
    answer_carrier: 第三欄的紅色 ☑（圖形）
    rows:
    - 事件: 1.看到老人站在博愛座旁，年輕人低頭看書
      關鍵線索: '心裡不高興：「老人家站在博愛座前，怎麼無動於衷？」

        我的眉頭皺了起來，心裡很糾結，猶豫……。'
      options:
        1: 不高興、糾結
        2: 輕鬆、無所謂
      answer: 1
    - 事件: 2.公車急煞車，差點跌倒，大聲說話
      關鍵線索: 心頭一緊，看不下去了，大聲對著年輕人說：「這裡是博愛座耶！你沒看見老人家站在你面前嗎？」
      options:
        1: 緊張、憂慮
        2: 憤怒、看不下去
      answer: 2
    - 事件: 3.看到年輕人拿出拐杖、行動困難
      關鍵線索: 「年輕人手裡拿著..拐杖。他的右腿瘦弱而變形…他每經過一個人，那一個人的頭就低了下來。」
      options:
        1: 驚訝、羞愧
        2: 理所當然
      answer: 1
    - 事件: 4.說出「對不起，我誤會您了」
      關鍵線索: 這回換我臉紅了，我快步走向車門，低聲的向他說：「對不起，我誤會您了。」
      options:
        1: 不在意
        2: 自責、懊悔
      answer: 2
    - 事件: 5.聽到「我習慣了」
      關鍵線索: 「我心裡反芻著那句『我習慣了』，原來我是無數加害者之一。」
      options:
        1: 釋懷
        2: 慚愧
      answer: 2
  - type: multi
    label: 三、推論主旨或目的
    text: 從作者的說話、語氣、動作，我們可以看到，老爺爺差點跌倒後，作者開始指責年輕人，表現出「生氣」的情緒；後來當他發現真相後，不但臉紅、快步追上對方，還低聲道歉，顯現出「慚愧、懊悔」的心情。最後，讓我們來想想，透過作者的情緒和行為變化，這個故事想要告訴我們什麼？
    prompt: （請在□打勾，複選）
    options:
      1: 「對事情的理解程度」會改變一個人的情緒和態度。
      2: 只要自己沒有做錯，就不用在意別人的誤會。
      3: 勇敢承認自己的錯誤，也是一種重要的勇氣。
    answer:
    - 1
    - 3
    answer_carrier: 紅色 ☑（圖形）
  - type: guide
    text: ◎換你試試看-年輕人視角
  - type: fill_table
    label: 一、請推論寫下「持拐杖那位年輕人」的情緒或感受（答案合理即可）
    columns:
    - 事件
    - 關鍵線索
    - 「年輕人」的情緒或感受
    answer_carrier: 第三欄為教師版橘色手寫參考答案
    rows:
    - 事件: 1.被指責不讓位
      關鍵線索: 年輕人的臉一下子變得通紅，他不敢抬頭
      answer_free_text: 難堪、委屈
    - 事件: 2.決定站起、下車
      關鍵線索: 按了下車鈴，使勁站了起來
      answer_free_text: 委屈、難堪、壓抑、無奈
    - 事件: 3.最後那句「我習慣了」
      關鍵線索: 輕輕笑了笑，說：「沒關係！我習慣了。」
      answer_free_text: 心酸、無奈
  - type: single
    label: 二、請推論寫作意圖
    prompt: 年輕人從頭到尾沒有為自己解釋，最後只說：「我習慣了。」你覺得，作者寫出這樣的角色，想提醒我們什麼？（單選）
    options:
      1: 身心障礙者經常被誤解的無奈與委屈。
      2: 忍讓是最好的處理方式，不需要解釋。
    answer: 1
    answer_carrier: 紅色 ☑（圖形）
  - type: self_check
    label: ◎自我檢核
    instruction: 一、請你自己檢查以下2項，確定自己是否會推論情緒和感受了。
    items:
    - 1.我會根據人物說的話、語氣、表情、動作，推測情緒或感受。
    - 2.我能把故事前後線索連起來，推論角色情緒的變化，並明白故事想傳達的道理。
    closing: 二、如果兩項都打勾，恭喜你，你已經學會推論人物的情緒和感受，這對你理解文章和人際互動，都有很大的幫助哦。你超厲害的！
