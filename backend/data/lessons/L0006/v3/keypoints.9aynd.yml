keypoints:
  title: 誤會
  structure: flat
  rows:
  - label: 事件起點
    value: '1.一位老爺爺上了擁擠的公車，全車已滿座，他只好站在【　】旁邊。

      2.博愛座上坐著一位正專心【　】的年輕人，沒有注意到老爺爺。'
    blanks:
    - answer: 博愛座
    - answer: 看書
  - label: 情緒反應
    value: 作者（我）看了心裡不高興，猶豫著要不要開口提醒他。
  - label: 事件引爆
    value: '1.公車突然急煞，老人差點【　】。

      2.作者以為年輕人佔著博愛座卻不讓位，便大聲斥責，其他乘客也加入【　】。'
    blanks:
    - answer: 仆倒
    - answer: 圍剿
  - label: 轉折
    value: '1.年輕人站起來，手拿一支【　】，往車門走。

      2.他每經過每個人，那人的頭就低了下來。'
    blanks:
    - answer: 拐杖
  - label: 結局反思
    value: '1.作者（我）道歉，

      年輕人說：「沒關係，【　】。」

      2.作者（我）反芻那句「我習慣了」，發現自己是無數加害者之一。'
    blanks:
    - answer: 我習慣了
