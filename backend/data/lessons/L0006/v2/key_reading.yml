passage: 公車慢慢地停在站牌旁，一位白髮蒼蒼的老爺爺上了車，從他登階時的緩慢動作可以看出他的力不從心。車上已經擠滿了人，大家稍微讓開一條小路，讓老爺爺進入走道中間。老爺爺左顧右盼，可惜已經滿座，他只好站在博愛座旁的空間，拉著吊環，隨著晃動的公車搖搖擺擺，就像風中抖動的燭光。
