    answer: B
    stem: 下列哪一個句子，「」中的語詞使用錯誤？
    options:
      A: 面對好友的邀約，他內心十分「糾結」，不知道該怎麼選擇
      B: 看見受傷的狗，他「無動於衷」地送去醫院，焦急等待醫生
      C: 阿公老了，爬樓梯時常覺得「力不從心」，得慢慢走才不會喘
      D: 她習慣睡前「反芻」當天發生過的事情，從中學習寶貴經驗
    rationale: null
  - index: 2
    answer: D
    stem: 「他每經過每一個人，那一個人的頭就低了下來。」請從前後文推論乘客們為什麼要低頭，並選出最可能的答案。
    options:
      A: 愧疚自責，因為自己也曾誤會並傷害過對方
      B: 緊張不安，擔心對方會因此記恨自己
      C: 生氣難過，無法接受自己竟然做錯了事情
      D: 沮喪放棄，覺得自己再怎麼補救也沒有用
    rationale: 這句話帶有明顯的自責語氣，敘述者發現自己先前的言行造成對方心理上的傷害，因此感到愧疚與懊悔。
  - index: 4
    answer: B
    stem: 年輕人說「我習慣了」，他想表達的最可能是哪一選項？
    options:
      A: 他很習慣把自己的座位讓給老人家
      B: 經常有人誤會他、要求他離開博愛座
      D: 他習慣自己的身心障礙，已經不在意了
    rationale: 本文敘述者對年輕人的誤解與事後懊悔，強調「不應只憑外表就下判斷」，要在充分理解後再做評價
  - index: 5
    answer: C
    stem: 這篇故事主要想表達什麼？
    options:
