multiple_choice:
- question: 下列語詞何者使用正確？
  options:
  - 看見路上發生車禍，他「煽情」的呼叫大夥一同幫忙。
  - 這件命案，經過警方「抽絲剝繭」，終於真相大白。
  - 他天生兩眼全盲，所以對任何東西都「視若無睹」。
  - 我們以天為被、地為席，「鋪天蓋地」徜徉在大自然中。（誤用）
  answer: B
  explanation: A錯：引發人情緒；C錯：誤用，不關心；D錯：誤用
- question: 下列選項何者最符合本文結尾所提到「盡信書不如無書」的涵義？
  options:
  - 沒有書本，世界上就可以減少紛爭。
  - 與其完全相信書，不如就不要讀書。
  - 讀書時，必須保有獨立懷疑的精神。
  - 如何選擇書中知識，全在一念之間。
  answer: C
  explanation: 文末提到「如果沒有深入的思考以及查核真相，就很容易做出錯誤的結論，讓我們繼續來當一個聰明的閱聽人，辨別真假訊息吧！」，強調在數位化時代，面對大量資訊（如同「書」），需要有獨立思考和查證的精神，才能避免
- question: 下列何者是「旁觀者效應」的例子？
  options:
  - 我以為你會掃，你以為他會掃，他以為我會掃，結果全都沒人掃。
  - 善良的人，看到的都是美好；而多疑的人，會認為別人都不懷好意。
  - 最近種植高麗菜利潤非常高，大家便一窩蜂到菜園裡栽種高麗菜。
  - 本來乾淨的公廁，只要有人不愛惜乾淨，大家就會跟著亂丟垃圾。
  answer: A
  explanation: 「旁觀者效應」指的是當多人在場時，人們幫助受害者的意願會降低，因為責任被分散，每個人都認為其他人會採取行動。選項A「我以為你會掃，你以為他會掃，他以為我會掃，結果全都沒人掃」完美地說明了這種責任分散的
- question: 「長達43年，都沒有人對凱蒂案提出質疑？」最可能的原因為何？
  options:
  - 沒有管道與方法可以提出質疑。
  - 怕自己的判斷與大家不一樣。
  - 大家都認為這不關自己的事。
  - 迷信心理學家的權威，不加質疑。
  answer: D
  explanation: 課文強調在數位化時代需要「深入的思考以及查核真相」來「辨別真假訊息」，並警告若無此能力便容易「做出錯誤的結論」。凱蒂案被提出作為假新聞的例子，長達43年無人質疑，最可能的原因是人們迷信已成權威或廣泛接
- question: 未來生活中若遇到真假難辨的訊息，我們應該怎麼做？
  options:
  - 警察為人民保母、有問題可詢問警察。
  - 書中的知識都經過前人驗證，可相信。
  - 可相信科學家的實驗，有實驗有保證。
  - 多質疑、多檢驗，常常保持探究的心。
  answer: D
  explanation: 課文強調在數位化時代假新聞盛行，我們應該「深入的思考以及查核真相」，並「辨別真假訊息」，這與「多質疑、多檢驗，常常保持探究的心」的態度相符。
- question: 作者曾志朗是中研院院士，你覺得43年來，他有沒有被凱蒂案的新聞騙呢？你從哪裡看出來的？
  options:
  - 有被騙：因為第五段的說明。
  - 沒有被騙：因為他是院士啊。
  answer: A
  explanation: 課文標題「盡信書不如無書」以及「數位化時代能讓讀者快速取得資訊，但是也造成了假新聞當道的亂象。如果沒有深入的思考以及查核真相，就很容易做出錯誤的結論，讓我們繼續來當一個聰明的閱聽人，辨別真假訊息吧！」
