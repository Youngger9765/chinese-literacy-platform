fill_in_blank:
- sentence: 寒冷的冬天，媽媽端上桌的火鍋（　　），讓人感覺暖和許多。
  answer: A
- sentence: 寒流來襲，小明在公車站牌前不斷（　　），希望能讓身體暖和一點。
  answer: B
- sentence: 傍晚時分，夕陽的光線穿過窗戶，在房間裡灑下一片（　　）的暖色調。
  answer: C
- sentence: 運動會結束後，選手們（　　）地離開操場，準備回家休息。
  answer: D
- sentence: 媒體為了吸引讀者，常常會對某些事件進行過度的（　　），導致真相被扭曲。
  answer: E
- sentence: 隨著升上不同學校，我們和國小同學之間的聯繫也（　　），很少有機會再見面了。
  answer: F
- sentence: 老師雖然沒有直接批評小明的報告，但他委婉的語氣中，我卻聽出了（　　）。
  answer: G
multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 小夫捉弄胖虎，胖虎氣炸了，「熱氣騰騰」的跑去找他算帳。
  - 這對夫妻因為觀念相差太多，最終感情「漸行漸遠」，離婚收場。
  - 晚飯時間，我的爸爸下班後「陸續」離開公司回來了。
  - 開學前他去把頭髮「渲染」成金色，希望能成為大家目光的焦點。
  answer: B
  explanation: 「漸行漸遠」在課文解釋中可形容方向或關係越來越疏離，選項B用來形容夫妻感情變淡而離婚，符合其引申義。
- question: 根據本文，下列哪一個描述可能無法表示老人的經濟能力較差？
  options:
  - 老人家摸摸自己的肚子，對孫子說自己飽的像蜘蛛。
  - 老人家在社區做資源回收，提著裝了回收物的垃圾袋。
  - 老人家看菜單，數一數手中零錢，點最便宜的陽春麵。
  - 老人家只點一碗麵給孫子吃，自己只是拚命喝水。
  answer: B
  explanation: 選項B中的老人做資源回收，除了可能是為了生計，也可能基於環保理念、運動習慣或打發時間等其他原因，因此「可能無法表示」其經濟能力較差。而A、C、D三項描述都直接且明確地指向老人為了節省開支或隱藏經濟困難
- question: 根據第三段，老阿公真的是第一百個客人嗎？為什麼老闆要這麼說？
  options:
  - 是，因為這是他們店裡新的促銷活動，阿公正好是幸運兒。
  - 是，因為他是店裡第一百個客人，所以免費得到一碗麵。
  - 不是，因為老闆根本沒算人數，他只想快點賣完回家休息。
  - 不是，因為老闆看出老人經濟狀況不好，想幫忙他。
  answer: D
  explanation: 根據課文中的「換位思考」部分，老闆想在不傷害老人自尊心的情況下幫助他們，因此老闆聲稱阿公是第一百個客人，是為了給予幫助而不顯得是在施捨。
- question: 根據第三段內容，為什麼老人家要跟小男孩說他飽的像蜘蛛一樣？
  options:
  - 因為他有啤酒肚，看起來像蜘蛛。
  - 他剛剛有吃其他東西，真的很飽。
  - 他想開玩笑讓吃飯氛圍更開心。
  - 他想用玩笑來化解孫子的擔心。
  answer: D
  explanation: 根據課文中「小試身手」的「換位思考三步驟」推論，阿公之所以用誇張的方式說話，是因為他錢不夠但又想讓孫子安心吃麵，因此用玩笑的方式化解孫子的擔心。
- question: 根據本文，老闆最後說小男孩正在學習「不吃東西也會飽」的道理，請問這個道理是什麼意思呢？
  options:
  - 這是一種鍛鍊意志力的方法。
  - 這是運用想像力讓自己度過難關的練習。
  - 這是為了他人付出而自我犧牲的感情。
  - 這是一種新的飲食型態，斷食久了就會習慣。
  answer: C
  explanation: 文中阿公假裝吃飽，是為了讓錢不夠的情況下，孫子能安心吃麵，這是一種為他人付出的自我犧牲。老闆觀察到小男孩在模仿阿公的行為，因此說小男孩正在學習這種因愛而產生的「不吃東西也會飽」的感情。
