vocabulary:
- word: 熱氣騰騰
  definition: 形容食物或飲料熱呼呼的，蒸氣不斷上升的樣子。
- word: 搓手踏腳
  definition: 摩擦雙手並用腳踏地，形容藉著活動身體來取暖。
- word: 暈黃
  definition: 光線昏暗的光暈。暈，光影、色澤四周模糊的樣子。
- word: 陸續
  definition: 接連不斷的樣子。
- word: 渲染
  definition: 一種繪畫的技巧，用顏料塗滿畫面，讓主題和背景有明暗的分別。也比喻言詞、文字過度誇大。
- word: 漸行漸遠
  definition: 慢慢的越走越遠。也可以形容方向、關係越來越疏離。
- word: 言外之意
  definition: 沒有明白說出來，但間接透露出來的意思。
- word: 當志明說
  definition: 「春嬌這麼美，這麼好，是不可能看上我的。」志明的(  E  )是他好希望春嬌可以喜歡他。
