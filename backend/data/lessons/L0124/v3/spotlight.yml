lesson_uid: L0124
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略──由觀點找出支持理由
  strategy_type: inference
  blocks:
  - type: concept_box
    text: 本課是說明文，作者先寫出植物肉引發的風潮，再用具體的例子去支持作者種種的看法（觀點），讓文章更有說服力。閱讀時，若能找出作者觀點，並從文章中找出支持觀點的理由，你會更容易讀出文章的重點喔。
    source_text: 本課是說明文，作者先寫出植物肉引發的風潮，再用具體的例子去支持作者種種的看法（觀點），讓文章更有說服力。閱讀時，若能找出作者觀點，並從文章中找出支持觀點的理由，你會更容易讀出文章的重點喔。
    errata_ref: E2
  - type: table
    title: ※什麼是觀點和理由？
    columns:
    - ''
    - 「觀點」
    - 「支持理由」
    rows:
    - ? ''
      : 定義
      觀點: 作者對某個主題提出的看法、判斷或立場。
      支持理由: 用來支撐觀點的資料、例子、事實、研究、原因或說明。
    - ? ''
      : 例子
      觀點: 他很用功。
      支持理由: 他每天都讀書四小時以上；他假日都到圖書館念書；他上課都會做筆記。
    - ? ''
      : 例子
      觀點: 這份英文作業很困難。
      支持理由: 他花好久的時間查字典、大多數同學無法完成作業。
  - type: guide
    text: ◎ 小試身手
  - type: matching
    label: 一、連連看
    instruction: 請把左欄列出三個課文觀點，和右欄的支持理由連起來；每個觀點都有兩個支持理由。
    left_header: 文章觀點
    right_header: 支持的理由
    left:
      1: 植物肉口感與真肉相似
      2: 植物肉的營養價值不輸動物肉
      3: 植物肉有利於環境永續與動物保護
    right:
      A: 植物肉的蛋白質含量與動物肉相媲美，每100克通常含有約20克的蛋白質。
      B: 生產植物肉不必屠宰動物，正符合保護動物趨勢。
      C: 植物肉的脂肪含量通常較低，不含膽固醇，還富含膳食纖維。
      D: 「流血素肉漢堡」口感和牛肉漢堡不分軒輊。
      E: 研究顯示，生產植物肉可以大幅減少土地使用、水資源消耗和溫室氣體排放。
      F: 這些原料經過混合、擠壓成型、加熱處理等步驟，最終能製造出質地、口感、顏色及風味與真肉極為相似的植物肉。
    answer:
      1:
      - D
      - F
      2:
      - A
      - C
      3:
      - B
      - E
    answer_carrier: 紅色連線（圖形），文字流無此資訊
  - type: sub_block
    label: 二、由課文觀點找出支持理由
    viewpoint: 植物肉市場潛力非常巨大
    instruction: （請從文章的五、六段找出至少兩個支持理由）
    items:
    - index: 1
      value: 根據最新的統計，2021年到2028年，全球植物肉市場規模將大幅【　】，反映出消費者對植物性蛋白的需求急劇【　】。
      blanks:
      - answer: 成長
      - answer: 上升
    - index: 2
      answer_free_text:
      - 越來越多的連鎖超市設置專門的植物性食品區。
      - 眾多知名快餐店和餐廳也紛紛將植物肉的料理納入菜單選項。
      - 預計會有越來越多人開始嘗試「彈性素食主義」，在日常飲食中增加植物性蛋白的比例。
  - type: sub_block
    label: 三、總結作者觀點
    hint: （小提示：觀點是含有個人的意見看法）
    stem: →由文章觀點可知道，作者【　】植物肉。
    options:
      1: 支持
      2: 不支持
    answer: 1
  - type: sub_block
    label: 四、挑戰題：找出全文主旨
    intro: 接著我們來練習推論文章主旨，這是更高層次的功夫喔！我們可以先猜測標題想要傳達的重點，再從第一段和最後一段找主旨線索，最後推論全文主旨。現在就讓我們來練習看看吧！
    items:
    - index: 1
      stem: 從標題「新奇！『植物肉』你聽過嗎？」可以推測，作者想強調植物肉對許多讀者來說是：
      options:
        1: 新鮮、有趣、值得認識的食品科技
        2: 剛被發明、從未出現過的新食物
      answer: 1
    - index: 2
      stem: 可以從文章首段或末段找到全文主旨
      首段: 近年來，一種由植物製成卻能模仿肉類口感和風味的食品悄然興起，引發了一場飲食革命。
      末段: 植物肉代表了一種創新的飲食選擇，為我們餐桌帶來驚喜。
      conclusion: →由「飲食革命」、及「創新的飲食選擇」，可以推論全文主旨為：【　】可能改變營養、環境、動保與未來食物市場。
      blank:
        answer: 植物肉
  - type: guide
    text: 恭喜你，達成任務了，你好棒！
