lesson_seq: 8040
intro: 你聽過「植物肉」嗎？這篇文章要帶你認識這種用植物做成的美味食物。文章會介紹植物肉的歷史，從古早的豆腐素肉到現代科技的進步，還有它到底是怎麼做出來的，裡面有哪些厲害的植物成分。另外，也會探討植物肉的營養價值，以及它對環境和動物保護有什麼幫助。最後，文章會看看植物肉這個新興市場的發展，以及它如何改變我們的飲食習慣。準備好一起探索這個充滿新奇的植物肉世界了嗎？
strategy_explained: '這一課要練的是「從文章裡面的說明，找到支持說法的理由」

  為什麼要練這個呢，因為這篇文章會介紹植物肉的歷史、製作過程、營養價值和對環境的幫助，這些說明都是讓你了解植物肉的「理由」，我們要學著把這些理由找出來，弄清楚文章為什麼這樣說

  讀這篇文章的時候，你可以試著想想，當文章說植物肉對環境有幫助時，它是怎麼說明的，裡面有哪些「理由」讓你知道這件事是真的'
