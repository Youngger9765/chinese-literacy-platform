comprehension:
  questions:
  - index: 2
    answer: B
    stem: 從課文第一段可推論，現在的植物肉相較於早期豆腐製成的素肉，，最強調哪一項改進？
    options:
      A: 價錢
      B: 口感
      C: 營養
      D: 成分
    rationale: null
  - index: 3
    answer: A
    stem: 根據課文，下列何者不是現代植物肉的風行的原因？
    options:
      A: 希望藉由介紹植物肉來探討環境保護的議題
      B: 希望介紹植物肉讓更多人認識並願意考慮嘗試
      C: 比較兩種肉品的不同，質疑動物肉的必要性
      D: 教導讀者如何正確的寫出植物肉的介紹文章
    rationale: 選項A為植物肉風行後的結果，並非風行原因。
  - index: 5
    answer: C
    stem: 下列有關文章觀點與支持理由的配對，何者正確？
    options:
      A: 雨林是個祕密的地方，搖曳的篝火令人有無限的遐想
      B: 雨林是個深沉寧靜的地方，因為有各種新鮮有趣的事物
      C: 雨林是個危險的地方，因為有很多自然殺手隱藏其中
      D: 雨林是個有豐富生物的地方，因為有很多毒蟲及猛獸
    rationale: 坐在搖曳的篝火旁邊，他用低沉的聲音，告訴我熱帶雨林的祕密。原來，這表面看來深沉寧靜的叢林，往往有突如其來的殺手──大風、暴雨、毒蟲、猛獸，盤桓其中，隨時可能要人性命；不過，只要謹慎小心，這片赤道旁的熱帶雨林，不只會讓我們走入神祕的世界，更會讓我們見識到各種新鮮有趣的事物。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 0.67
    answers_recovered_from_rationale: 0
    verdict: ok
