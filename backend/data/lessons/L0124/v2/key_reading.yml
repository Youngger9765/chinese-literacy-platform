passage: 你可能會問：植物肉的營養價值如何呢？事實上，植物肉的蛋白質含量與動物肉相媲美，每100克通常含有約20克的蛋白質。而且，植物肉的脂肪含量通常較低，不含膽固醇，還富含膳食纖維。只是植物肉中的某些營養素如維生素B12，需額外添加才能達到與動物肉相當的含量。
