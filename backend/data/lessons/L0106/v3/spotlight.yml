  - type: passage
    label: 110會考第33~34題短文
    paragraphs:
    - 喝茶加檸檬是美式作法，英國人則不然。早期開始流行茶葉時，英國人模仿中國人使用瓷具泡茶，但若直接倒入熱茶可能導致瓷杯過熱破裂，故先加入牛奶來降溫。
    - 當時的上流社會也因此會比較彼此的瓷器等級，若茶具能接受牛奶後加，表示此家族擁有的茶具等級更高。中上階級的喝茶習慣，是先用茶壺浸泡茶葉，形成淡茶後再倒入單耳瓷杯裡。通常伯爵茶、烏龍茶是上流社會裡常見的茶品，茶色呈淡褐色，加入牛奶飲用，因為多會搭配甜品，通常不會加糖。而勞動階級的飲茶方式，則是以茶包沖泡於馬克杯中形成濃茶後再加入糖，牛奶則可融合濃茶的苦澀味，既濃又甜的阿薩姆故而成為受歡迎的茶，是需要消耗大量熱量的勞工階級喜愛的口味。
    - 在階級制度逐漸模糊的今天，茶葉如何沖泡或牛奶先加後加，已不大有明顯界線。方便快速的茶包市面上隨處可見，再講究一些的，也能在茶葉專賣店找到喜歡的茶葉。至於是否要加牛奶，英國人會告訴你：「什麼都不加的紅茶，只比白開水好喝一點而已。」
    - ──改寫自謝昀瑾〈喝茶加不加糖，原來和階級有關〉
  - type: single
