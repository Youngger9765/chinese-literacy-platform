lesson_uid: L0106
version_id: v3
section_no: 一
spotlight:
  strategy_name: 解題策略—帶著問題閱讀
  strategy_type: reading_strategy
  _practises: 會考國文題目（110-5／110-3／111-3／114-27）＋ 5 題自我練習
  answer_carrier: '三種載體都有：

    ① 紅色 ☑（w:sym Wingdings F0FE ＋ w:color FF0000）19 個

    ② 橘色字元框線（w:bdr FF3300／E1721F）6 段 —— 「請圈出」類題目的答案

    ③ 橘色手寫填空與括號內代號（文字流有此資訊）'
  blocks:
  - type: guide
    text: 示範１：來看一個例子（110年會考國文第５題；110-5）
  - type: passage
    label: 110年會考國文第5題
    paragraphs:
    - 5.「山田汽車成立於西元1916年。高橋汽車在山田汽車成立100週年時發表一段賀詞：『感謝100年來的競爭，沒有你的那30年有點孤獨。』」根據這段文字，高橋汽車最可能成立於西元哪一年？
    - (A)1816　 (B)1846　 (C)1886　 (D)1946
    note: '圓角外框內的題目。PDF p2 上「高橋汽車最可能成立於西元哪一年?」外面另加一個橘色方框

      （圖形層的 rect），示範「圈題目問句」這個動作；被圈的文字本身在文字層裡，已照錄。'
  - type: guide
    text: 1.沒有策略的閱讀 vs 帶著問題的閱讀
  - type: guide
    text: 我們先來看兩種不同閱讀策略的差異：
  - type: table
    columns:
    - A.沒有策略的閱讀
    - B.帶著問題的閱讀
    rows:
    - A.沒有策略的閱讀: '很多同學可能這樣讀：從「山田汽車……」一路讀到最後一句「……成立於西元哪一年?」才發現題目到底要你做什麼?

        但你還沒看見問句前，你其實不知道自己要找什麼，你的閱讀是目的不清楚，只是在逛街，一直讀到最後一句，才知道哪裡是必須細讀的重點。'
      B.帶著問題的閱讀: 如果你先讀最後一句——「高橋汽車……成立於西元哪一年？」情況就不同了。你馬上知道這題要問什麼，這時再回頭去讀題幹的文字，你會更容易抓到重點——年代。
  - type: guide
    text: '所以，考試作答是有方法的喔，這一課我們要來學解題3步驟:

      ❶問什麼→❷帶著問題閱讀→❸確定答案'
    source_text: '所以，考試作答是有方法的喔，這一課我們要來學解題3步驟:

      ❶問什麼❷帶著問題閱讀❸確定答案'
    note: '紙上印的兩個「→」是 `<w:sym w:font="Wingdings" w:char="F0E0"/>`（Wingdings 右箭頭），

      **不在 w:t 文字流裡**，所以逐字門比的是 `source_text`（文字層原樣，沒有箭頭），

      `text` 保留印出來的樣子。箭頭是排版符號，不是答案符號。'
  - type: guide
    text: 2.解題步驟：
  - type: sub_block
    label: ❶問什麼：圈題目問句
    items:
    - label: 問題是──高橋汽車最可能成立於西元哪一年?
    - label: 關鍵訊息是──年代
    note: 兩行都是印好的示範答案（教材直接寫出來），不是留白讓學生填
  - type: sub_block
    label: ❷帶著問題閱讀，❸確定答案
    items:
    - value: 從題幹可知，山田已經100週年了，而高橋說「沒有你的那30年有點孤獨」，換句話說，高橋成立30年後，山田才成立。因為山田是1916年成立的，再往前推30年，答案就是(C)1886年。
  - type: guide
    text: 你發現了嗎？這題的解題過程，你必須先問自己「這題在問什麼？」，然後再進行「帶著問題閱讀」哦。
  - type: guide
    text: 練習1：讓我們再練習用相同的步驟來做另一題（110-3），看看「帶著問題閱讀」的效果。
  - type: passage
    label: 110年會考國文第3題
    paragraphs:
    - 3.這是某相機使用說明書的一部分：
    - 對於以下主體，可能無法成功自動對焦：
    - 與背景色彩相近的主體
    - 自動對焦點同時覆蓋遠近主體
    - 重複的圖案
    - 根據以上說明，這臺相機在相同的設定下，下列哪一個景物最容易自動對焦？
    - (A)雪地上的雪人　         (B)欄杆後的盆栽　
    - (C)沙漠中的綠色仙人掌　   (D)花色相同的馬賽克磁磚
    note: '圓角外框內的題目。「下列哪一個景物最容易自動對焦」外面另加一個橘色方框（圖形層 rect），

      示範「圈題目問句」；被圈文字在文字層裡。'
  - type: figure
    referent: image
    note: '四張黑白線稿景物圖橫排，下方各標 (A)(B)(C)(D)：

      (A) 雪地上的雪人　(B) 欄杆後的盆栽　(C) 沙漠中的仙人掌　(D) 馬賽克磁磚。

      圖上沒有文字（選項文字在文字層，見上一個 passage），所以沒有要轉錄的字。'
    placement_note: 印在題目框內、選項文字上方（PDF p3）
  - type: guide
    text: ❶問什麼：圈題目問句
  - type: single
    prompt: (1)題目「問什麼」(單選)：
    options:
      1: 最容易自動對焦
      2: 哪一個景物
    answer: 1
  - type: guide
    text: 你發現了嗎？讀了圈起來的文字之後，看到底下4張景物，你馬上就知道，題目要你找出「最容易自動對焦」的那個圖。
  - type: guide
    text: ❷帶著問題閱讀
  - type: single
    prompt: (1)帶著「哪一個景物最容易自動對焦？」的問題，去讀說明書裡三個黑點後的文字。關鍵訊息是：(單選)
    options:
      1: 無法成功自動對焦的三個情況
      2: 能自動對焦的三個情況
    answer: 1
  - type: sub_block
    label: (2)讀一項文字後，立刻判斷符合底下哪一個圖（符合就排除）(單選)
    columns:
    - 說明書說明：
    - 符合哪個圖（符合就排除）
    items:
    - type: single
      prompt: 與背景色彩相近的主體
      options:
        A: A
        B: B
        C: C
        D: D
      answer: A
    - type: single
      prompt: 自動對焦點同時覆蓋遠近
      options:
        A: A
        B: B
        C: C
        D: D
      answer: B
      note: '這一列的說明書文字原稿印到「遠近」為止（比題目框內的「自動對焦點同時覆蓋遠近主體」

        少一個「主體」）。文字層與 PDF p4 一致，照原樣抄，不補字。'
    - type: single
      prompt: 重複的圖案
      options:
        A: A
        B: B
        C: C
        D: D
      answer: D
  - type: guide
    text: ❸確定答案
  - type: single
    prompt: 讀完每一個黑點後的文字，就可以排除掉一個選項，最後留下來的，就是正確的答案。最後我留下：
    options:
      A: A
      B: B
      C: C
      D: D
    answer: C
  - type: guide
    text: 練習2：（111年會考國文第3題）
  - type: passage
    label: 111年會考國文第3題
    paragraphs:
    - 3.「臺灣原住民的布只有形制屬傳統或較現代的分別，像圓領的剪裁、鈕扣和棉布的使用等，都是受漢人的影響而來。泰雅族的貝珠鈴衣，是貝珠串底下加銅鈴裝飾，銅鈴也是和漢人交易而來。日治時代的原住民服裝，還出現以漢人棉布做底、日本布做袖口、原住民圖案做主要裝飾的混搭法。」這段文字的主旨最可能是下列何者？
    - (A)不同文化的碰撞，可融合並產生新的火花
    - (B)外來文化的入侵，讓在地的傳統文化日漸消失
    - (C)臺灣原住民的文化，影響了漢人與日本人的穿著
    - (D)觀察不同族群的服飾，就能了解不同文化的差異
    note: '題幹裡有三段被橘色字元框線（w:bdr FF3300）框起來 —— 那是後面「請先圈出例子」的答案，

      逐段記在下方 free_text 的 blanks 裡。「這段文字的主旨最可能是下列何者？」另有橘色框。'
  - type: guide
    text: ❶問什麼：圈題目問句
  - type: guide
    text: 提醒：主旨題就是找「文章主要在說什麼？」
  - type: single
    prompt: (1)找到題目在「問什麼」(單選)：
    options:
      1: 舉例
      2: 主旨
    answer: 2
  - type: guide
    text: (2)先瀏覽「四個選項的答案」──大多和文化影響有關
  - type: guide
    text: ❷帶著問題閱讀
  - type: guide
    text: 提醒：看到同一種訊息重複出現，就很可能是主旨
  - type: free_text
    prompt: (1)文章舉了三個例子，請先圈出例子
    blanks:
    - answer: 像圓領的剪裁、鈕扣和棉布的使用等，都是受漢人的影響而來
    - answer: 泰雅族的貝珠鈴衣，是貝珠串底下加銅鈴裝飾，銅鈴也是和漢人交易而來
    - answer: 日治時代的原住民服裝，還出現以漢人棉布做底、日本布做袖口、原住民圖案做主要裝飾的混搭法。
    answer_carrier: 橘色字元框線 w:bdr FF3300（3 段），畫在題幹上；PDF p4 可見
  - type: single
    prompt: 並回答例子都在講什麼?(單選)
    options:
      1: 原民服裝被外來文化影響
      2: 漢人的服裝被原住民影響
    answer: 1
    note: '原稿把「(1)文章舉了三個例子，請先圈出例子，並回答例子都在講什麼?(單選)」印成一行，

      本檔拆成上面的 free_text（圈例子）與這一題（選擇），因為它們是兩個不同的作答動作、

      答案也分別由兩種載體帶（框線／☑）。原句照原樣切開，未改字。'
  - type: guide
    text: ❸確認答案
  - type: sub_block
    label: (1)所以這段文字的主旨應該是
    columns:
    - 選項
    - 它說的對嗎？怎麼判斷？
    items:
    - type: single
      prompt: (A)不同文化的碰撞，可融合並產生新的火花
      options:
        1: 對
        2: 錯
      answer: 1
      hint: →我圈到的三個例子都在說外來影響/混搭。
    - type: single
      prompt: (B)外來文化的入侵，讓在地的傳統文化日漸消失
      options:
        1: 對
        2: 錯
      answer: 2
      hint: →文章沒有提到文化消失
    - type: single
      prompt: (C)臺灣原住民的文化，影響了漢人與日本人的穿著
      options:
        1: 對
        2: 錯
      answer: 2
      hint: →剛好相反，是原住民的服裝被漢人影響
    - type: single
      prompt: (D)觀察不同族群的服飾，就能了解不同文化的差異
      options:
        1: 對
        2: 錯
      answer: 2
      hint: →文章沒有強調不同文化的差異
  - type: guide
    text: (2)我排除了(B)(C)(D)，(A)最合理，所以選(A)。
  - type: guide
    text: 練習3：題幹愈長，「帶著問題閱讀」策略的效果愈好，我們再來看底下這個題組（114-27）。
  - type: passage
    label: 114年會考國文第27題
    paragraphs:
    - 灰面鵟鷹是過境臺灣的候鳥。每年十月起，牠們遠從日本、西伯利亞或中國東北而來，經過墾丁，前往菲律賓的度冬地，到了三月，再集結北返。研究灰面鵟鷹十多年的人員曾經透過無線電追蹤，了解牠們的遷徙路線。春季牠們會從度冬地開始北遷，一條路線是從臺灣東南外海的蘭嶼，經過琉球北上，回到日本繁殖地。另一條路線則是從臺灣的西岸通過，回到中國東北、北韓或日本一帶。位在臺灣中部的八卦山，因為地理位置而成為牠們重要的休息站。每年春天，成千上萬的灰面鵟鷹從南方來，彰化人稱牠們「南路鷹」。八卦山的次生林環境，提供了豐富的食物來源。另外，猛禽遷徙過程依靠氣流滑翔，必須利用山脈地形，尋找上升氣流，再提升高度，八卦山正好就提供這樣的地理條件。──改寫自〈留住八卦驛站〉
    - 27.小原根據本文與圖(一)畫了一張灰面鵟鷹遷徙路線圖，如圖(二)。小嵐認為小原在圖中標示的遷徙路線有疏漏和錯誤，他提出了下列說法。對照本文後，何者可以成立？
    - (A)北上的路線應該在臺灣南部出海
    - (B)北上的路線少畫了經由蘭嶼的這條
    - (C)南下的路線不應該經由墾丁出海
    - (D)南下的路線少畫了從中國來的這條
  - type: figure
    referent: image
    text_carrier: image
    transcript: '圖(一)　　（日本／中國／臺灣的相對位置圖，只標地名）

      圖(二)　　往北韓　中國　臺灣海峽　八卦山　墾丁　往菲律賓

      圖(二) 圖例：北上路線　南下路線'
    note: '兩張地圖並排在第 27 題題幹左側。圖上的字**確實只畫在像素裡**：

      「往北韓」「臺灣海峽」「北上路線」「南下路線」「往菲律賓」在

      document.xml／footnotes.xml／endnotes.xml 三個檔 grep **全部回 0**；

      正向對照「八卦山」回 3、「雪地上的雪人」回 1（那兩個在文字層）——

      所以 0 是真的沒有，不是 grep 壞掉。'
    placement_note: 印在題目框內、題幹27題左側（PDF p5）
  - type: guide
    text: 這題文字超過300字，題幹長達76個字，如果從頭到尾逐字細讀，時間可能就不夠了。若用「帶著問題閱讀」策略，會有效率許多喔！
  - type: guide
    text: ❶問什麼：圈問題重點與問句
  - type: guide
    text: 提醒：先知道要做什麼，才不會逛街亂讀
  - type: free_text
    prompt: (1)找到題目在「問什麼」（直接在題目找，並圈出來）
    blanks:
    - answer: 灰面鵟鷹遷徙路線圖
    - answer: 小原在圖中標示的遷徙路線有疏漏和錯誤
    - answer: 對照本文後，何者可以成立
    answer_carrier: 橘色字元框線 w:bdr E1721F（3 段），畫在第 27 題題幹上；PDF p5 可見
  - type: guide
    text: 圈完你要抓到：這是一種鳥類的遷徙圖，小嵐認為小原畫的圖(二)有錯，題目要你找出來下列四個選項的說法哪一個成立。所以，我們要一一檢驗、確認四個選項的說法。
  - type: sub_block
    label: (2)再圈「四個選項的關鍵詞」──表達路線的詞
    items:
    - value: (A)北上的路線應該在臺灣南部出海
    - value: (B)北上的路線少畫了經由蘭嶼的這條
    - value: (C)南下的路線不應該經由墾丁出海
    - value: (D)南下的路線少畫了從中國來的這條
    note: '原稿把四個選項重印一次，關鍵詞用**粗體**標出（PDF p6：北上／臺灣南部出海／少畫／蘭嶼／

      南下／不應該／墾丁出海／中國）。粗體不是 `w:bdr`，不算第三種答案載體，本檔照文字記錄，

      粗體位置記在這裡。'
  - type: guide
    text: ❷帶著問題閱讀
  - type: guide
    text: 提醒：問題的重點是「遷徙路線」，你只需要找到和「遷徙路線」有關的句子，其他先跳過。
  - type: multi
    prompt: (1)我找到【　】條路線，請在文章上畫線。一邊閱讀，一邊對照圖(二)
    blanks:
    - answer: 3
    options:
      1: 十月起…或中國東北而來，經過墾丁，前往菲律賓
      2: 三月北返，一條路線從蘭嶼經琉球北上回日本
      3: 另一條路線從臺灣西岸通過回中國東北/北韓或日本一帶
    answers:
    - 1
    - 2
    - 3
    answer_carrier: '兩種載體同時在這一題：填空的「3」是橘色手寫（文字層有），

      三個選項前的紅 ☑ 是 w:sym F0FE。'
    note: '原稿三項**全部**打 ☑（三條路線都要找出來，不是三選一），所以是 multi 而不是 single。

      這三行沒有自己的題幹，直接接在「(1)我找到 3 條路線…」底下，本檔併成同一個 block，

      沒有另外造題幹。填空處原稿印的是一段底線，本檔照通例寫成【　】。'
  - type: guide
    text: ❸確定答案
  - type: sub_block
    label: (1)依照(A)(B)(C)(D)的順序，一一確認「它說的對嗎？」，記得，閱讀時，要一直「主動搜集資訊、回答問題」哦！
    columns:
    - 選項
    - 它說的對嗎？怎麼判斷？
    items:
    - type: single
      prompt: (A)北上的路線應該在臺灣南部出海
      options:
        1: 對
        2: 錯
      answer: 2
      hint: →北上？看圖(二)箭頭往北（向上）的路線，文、圖都沒有提到「從臺灣南部出海」。所以，(A)的說法是錯的。
    - type: single
      prompt: (B)北上的路線少畫了經由蘭嶼的這條
      options:
        1: 對
        2: 錯
      answer: 1
      hint: →蘭嶼？說明裡的確有「一條路線是從……蘭嶼，……北上，回到日本」。再看圖(二)，「咦，真的沒有蘭嶼吔。」文、圖對照後，(B)的說法可能是對的。
    - type: single
      prompt: (C)南下的路線不應該經由墾丁出海
