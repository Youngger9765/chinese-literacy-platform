      hint: →文章寫：鳥兒「遠從日本、……，經過墾丁……」圖（二）很清楚畫出鳥兒分二路南下，兩條路都經過墾丁；所以，(C)裡講「不應該經由墾丁出海」也是錯的。
    - type: single
