intro: 這篇文章從「血拼」這個有趣的詞語出發，帶我們思考兩種不同的購物方式：「逛街」和「採買」。接著，文章將這個概念延伸到閱讀上，介紹了「篇章瀏覽」和「帶著問題閱讀」這兩種閱讀方式。「逛街」式的閱讀，就像漫無目的地瀏覽網頁；而「採買」式的閱讀，則是有明確目標，像帶著購物清單一樣，知道自己要找什麼。文章會說明這兩種閱讀方式有什麼不同，以及為什麼「帶著問題閱讀」對學習和考試會有幫助。
