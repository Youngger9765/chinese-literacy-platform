strategy_explained: '這一課我們要練習的是「帶著問題去閱讀」，就像去逛街前有張購物清單一樣，知道自己想找什麼

  這篇文章就像是購物指南，教你怎麼從「隨便看看」變成「鎖定目標」的閱讀，讓我們知道為什麼要這樣做，以及怎麼帶著問題找出文章裡的重點，幫助你更有效率地學習

  所以讀的時候，可以先想一想，這篇文章會告訴我哪些關於「逛街式」和「採買式」閱讀的知識，還有「帶著問題閱讀」到底有什麼好處'
