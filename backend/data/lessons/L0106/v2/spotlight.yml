spotlight:
  lesson: G7-L9
  strategy_name: 解題策略-帶著問題閱讀
  strategy_type: self_questioning
  blocks:
  - type: passage
    source: unknown
    paragraphs:
    - 一閱讀聚光燈解題策略—帶著問題閱讀一閱讀聚光燈解題策略—帶著問題閱讀目標策略：解題策略──帶著問題閱讀目標策略：解題策略──帶著問題閱讀Level 7・說明文Level
      7・說明文
  - type: guide
    text: 示範１：來看一個例子（110年會考國文第５題；110-5）
  - type: free_text
    prompt: 5.「山田汽車成立於西元1916年。高橋汽車在山田汽車成立100週年時發表一段賀詞：『感謝100年來的競爭，沒有你的那30年有點孤獨。』」根據這段文字，高橋汽車最可能成立於西元哪一年？
  - type: guide
    text: (A)1816　 (B)1846　 (C)1886　 (D)1946
  - type: free_text
    prompt: 1.沒有策略的閱讀 vs 帶著問題的閱讀
  - type: guide
    text: 我們先來看兩種不同閱讀策略的差異：
  - type: table
    rows:
    - - A.沒有策略的閱讀
      - B.帶著問題的閱讀
    - - 很多同學可能這樣讀：從「山田汽車……」一路讀到最後一句「……成立於西元哪一年?」才發現題目到底要你做什麼?但你還沒看見問句前，你其實不知道自己要找什麼，你的閱讀是目的不清楚，只是在逛街，一直讀到最後一句，才知道哪裡是必須細讀的重點。
      - 如果你先讀最後一句——「高橋汽車……成立於西元哪一年？」情況就不同了。你馬上知道這題要問什麼，這時再回頭去讀題幹的文字，你會更容易抓到重點——年代。
  - type: guide
    text: 所以，考試作答是有方法的喔，這一課我們要來學解題3步驟:❶問什麼❷帶著問題閱讀❸確定答案
  - type: free_text
    prompt: 2.解題步驟：
  - type: free_text
    prompt: ❶問什麼：圈題目問句
  - type: guide
    text: 問題是──高橋汽車最可能成立於西元哪一年？
  - type: guide
    text: 關鍵訊息是──年代
  - type: free_text
    prompt: ❷帶著問題閱讀，❸確定答案
  - type: guide
    text: 從題幹可知，山田已經100週年了，而高橋說「沒有你的那30年有點孤獨」，換句話說，高橋成立30年後，山田才成立。因為山田是1916年成立的，再往前推30年，答案就是(C)1886年。
  - type: guide
    text: 你發現了嗎？這題的解題過程，你必須先問自己「這題在問什麼？」，然後再進行「帶著問題閱讀」哦。
  - type: guide
    text: 練習1：讓我們再練習用相同的步驟來做另一題（110-3），看看「帶著問題閱讀」的效果。
  - type: free_text
    prompt: 3.這是某相機使用說明書的一部分：
  - type: guide
    text: 對於以下主體，可能無法成功自動對焦：
  - type: passage
    source: unknown
    paragraphs:
    - 與背景色彩相近的主體
    - 自動對焦點同時覆蓋遠近主體
    - 重複的圖案
  - type: guide
    text: 根據以上說明，這臺相機在相同的設定下，下列哪一個景物最容易自動對焦？
  - type: guide
    text: (A)雪地上的雪人　         (B)欄杆後的盆栽
  - type: guide
    text: (C)沙漠中的綠色仙人掌　   (D)花色相同的馬賽克磁磚
  - type: free_text
    prompt: ❶問什麼：圈題目問句
  - type: single
    prompt: (1)題目「問什麼」(單選)：□①最容易自動對焦  □②哪一個景物
    options:
    - 最容易自動對焦
    - 哪一個景物
    answer: 最容易自動對焦
  - type: guide
    text: 你發現了嗎？讀了圈起來的文字之後，看到底下4張景物，你馬上就知道，題目要你找出「最容易自動對焦」的那個圖。
  - type: free_text
    prompt: ❷帶著問題閱讀
  - type: single
    prompt: (1)帶著「哪一個景物最容易自動對焦？」的問題，去讀說明書裡三個黑點後的文字。關鍵訊息是：(單選)
    options:
    - 無法成功自動對焦的三個情況
    - 能自動對焦的三個情況
    answer: 無法成功自動對焦的三個情況
  - type: free_text
    prompt: (2)讀一項文字後，立刻判斷符合底下哪一個圖（符合就排除）(單選)
  - type: table
    rows:
    - - 說明書說明：
      - 符合哪個圖（符合就排除）
    - - 與背景色彩相近的主體
      - □A  □B  □C  □D
    - - 自動對焦點同時覆蓋遠近
      - □A  □B  □C  □D
    - - 重複的圖案
      - □A  □B  □C  □D
  - type: single
    prompt: ❸確定答案
    options:
    - 讀完每一個黑點後的文字，就可以排除掉一個選項，最後留下來的，就是正確的答案。最後我留下：
    - A
    - B
    - C
    - D
    answer: 讀完每一個黑點後的文字，就可以排除掉一個選項，最後留下來的，就是正確的答案。最後我留下：
  - type: guide
    text: 練習2：（111年會考國文第3題）
  - type: free_text
    prompt: 3.「臺灣原住民的布只有形制屬傳統或較現代的分別，像圓領的剪裁、鈕扣和棉布的使用等，都是受漢人的影響而來。泰雅族的貝珠鈴衣，是貝珠串底下加銅鈴裝飾，銅鈴也是和漢人交易而來。日治時代的原住民服裝，還出現以漢人棉布做底、日本布做袖口、原住民圖案做主要裝飾的混搭法。」這段文字的主旨最可能是下列何者？
  - type: guide
    text: (A)不同文化的碰撞，可融合並產生新的火花
  - type: guide
    text: (B)外來文化的入侵，讓在地的傳統文化日漸消失
  - type: guide
    text: (C)臺灣原住民的文化，影響了漢人與日本人的穿著
  - type: guide
    text: (D)觀察不同族群的服飾，就能了解不同文化的差異
  - type: free_text
    prompt: ❶問什麼：圈題目問句
  - type: guide
    text: 提醒：主旨題就是找「文章主要在說什麼？」
  - type: single
    prompt: (1)找到題目在「問什麼」(單選)：□①舉例    □②主旨
    options:
    - 舉例
    - 主旨
    answer: 舉例
  - type: free_text
    prompt: (2)先瀏覽「四個選項的答案」──大多和文化影響有關
  - type: free_text
    prompt: ❷帶著問題閱讀
  - type: guide
    text: 提醒：看到同一種訊息重複出現，就很可能是主旨
  - type: single
    prompt: (1)文章舉了三個例子，請先圈出例子，並回答例子都在講什麼?(單選)
    options:
    - 原民服裝被外來文化影響
    - 漢人的服裝被原住民影響
    answer: 原民服裝被外來文化影響
  - type: free_text
    prompt: ❸確認答案
  - type: free_text
    prompt: (1)所以這段文字的主旨應該是
  - type: table
    rows:
    - - 選項
      - 它說的對嗎？怎麼判斷？
    - - (A)不同文化的碰撞，可融合並產生新的火花
      - □①對    □②錯→我圈到的三個例子都在說外來影響/混搭。
    - - (B)外來文化的入侵，讓在地的傳統文化日漸消失
      - □①對    □②錯→文章沒有提到文化消失
    - - (C)臺灣原住民的文化，影響了漢人與日本人的穿著
      - □①對    □②錯→剛好相反，是原住民的服裝被漢人影響
    - - (D)觀察不同族群的服飾，就能了解不同文化的差異
      - □①對    □②錯→文章沒有強調不同文化的差異
  - type: free_text
    prompt: (2)我排除了(B)(C)(D)，(A)最合理，所以選(A)。
  - type: guide
    text: 練習3：題幹愈長，「帶著問題閱讀」策略的效果愈好，我們再來看底下這個題組（114-27）。
  - type: guide
    text: 灰面鵟鷹是過境臺灣的候鳥。每年十月起，牠們遠從日本、西伯利亞或中國東北而來，經過墾丁，前往菲律賓的度冬地，到了三月，再集結北返。研究灰面鵟鷹十多年的人員曾經透過無線電追蹤，了解牠們的遷徙路線。春季牠們會從度冬地開始北遷，一條路線是從臺灣東南外海的蘭嶼，經過琉球北上，回到日本繁殖地。另一條路線則是從臺灣的西岸通過，回到中國東北、北韓或日本一帶。位在臺灣中部的八卦山，因為地理位置而成為牠們重要的休息站。每年春天，成千上萬的灰面鵟鷹從南方來，彰化人稱牠們「南路鷹」。八卦山的次生林環境，提供了豐富的食物來源。另外，猛禽遷徙過程依靠氣流滑翔，必須利用山脈地形，尋找上升氣流，再提升高度，八卦山正好就提供這樣的地理條件。──改寫自〈留住八卦驛站〉
  - type: free_text
    prompt: 27.小原根據本文與圖(一)畫了一張灰面鵟鷹遷徙路線圖，如圖(二)。小嵐認為小原在圖中標示的遷徙路線有疏漏和錯誤，他提出了下列說法。對照本文後，何者可以成立？
  - type: guide
    text: (A)北上的路線應該在臺灣南部出海
  - type: guide
    text: (B)北上的路線少畫了經由蘭嶼的這條
  - type: guide
    text: (C)南下的路線不應該經由墾丁出海
  - type: guide
    text: (D)南下的路線少畫了從中國來的這條
  - type: guide
    text: 這題文字超過300字，題幹長達76個字，如果從頭到尾逐字細讀，時間可能就不夠了。若用「帶著問題閱讀」策略，會有效率許多喔！
  - type: free_text
    prompt: ❶問什麼：圈問題重點與問句
  - type: guide
    text: 提醒：先知道要做什麼，才不會逛街亂讀
  - type: free_text
    prompt: (1)找到題目在「問什麼」（直接在題目找，並圈出來）
  - type: guide
    text: 圈完你要抓到：這是一種鳥類的遷徙圖，小嵐認為小原畫的圖(二)有錯，題目要你找出來下列四個選項的說法哪一個成立。所以，我們要一一檢驗、確認四個選項的說法。
  - type: free_text
    prompt: (2)再圈「四個選項的關鍵詞」──表達路線的詞
  - type: guide
    text: (A)北上的路線應該在臺灣南部出海
  - type: guide
    text: (B)北上的路線少畫了經由蘭嶼的這條
  - type: guide
    text: (C)南下的路線不應該經由墾丁出海
  - type: guide
    text: (D)南下的路線少畫了從中國來的這條
  - type: free_text
    prompt: ❷帶著問題閱讀
  - type: guide
    text: 提醒：問題的重點是「遷徙路線」，你只需要找到和「遷徙路線」有關的句子，其他先跳過。
  - type: multi
    prompt: (1)我找到  3  條路線，請在文章上畫線。一邊閱讀，一邊對照圖(二)
    options:
    - 十月起…或中國東北而來，經過墾丁，前往菲律賓
    - 三月北返，一條路線從蘭嶼經琉球北上回日本
    - 另一條路線從臺灣西岸通過回中國東北/北韓或日本一帶
    answer:
    - 十月起…或中國東北而來，經過墾丁，前往菲律賓
    - 三月北返，一條路線從蘭嶼經琉球北上回日本
    - 另一條路線從臺灣西岸通過回中國東北/北韓或日本一帶
  - type: free_text
    prompt: ❸確定答案
  - type: free_text
    prompt: (1)依照(A)(B)(C)(D)的順序，一一確認「它說的對嗎？」，記得，閱讀時，要一直「主動搜集資訊、回答問題」哦！
  - type: table
    rows:
    - - 選項
      - 它說的對嗎？怎麼判斷？
    - - (A)北上的路線應該在臺灣南部出海
      - □①對    □②錯  →北上？看圖(二)箭頭往北（向上）的路線，文、圖都沒有提到「從臺灣南部出海」。所以，(A)的說法是錯的。
    - - (B)北上的路線少畫了經由蘭嶼的這條
      - □①對    □②錯→蘭嶼？說明裡的確有「一條路線是從……蘭嶼，……北上，回到日本」。再看圖(二)，「咦，真的沒有蘭嶼吔。」文、圖對照後，(B)的說法可能是對的。
    - - (C)南下的路線不應該經由墾丁出海
      - □①對    □②錯→文章寫：鳥兒「遠從日本、……，經過墾丁……」圖（二）很清楚畫出鳥兒分二路南下，兩條路都經過墾丁；所以，(C)裡講「不應該經由墾丁出海」也是錯的。
    - - (D)南下的路線少畫了從中國來的這條
      - □①對    □②錯→圖(二)裡兩條向南的灰線，左邊那條明明就是從中國來的。所以，(D)也是錯的。
  - type: free_text
    prompt: (2)這4個選項裡，只有(B)是對的，答案當然就是(B)囉。
  - type: guide
    text: 換你試試看：請用「❶問什麼❷帶著問題閱讀❸確定答案」的策略解題。
  - type: guide
    text: 一、單選
