paragraphs:
- 上街買東西，英文叫shopping，它戲謔的譯名叫「血拼」。有「萬頭鑽動，一群人流『血』流汗，『拼』死搶貨」的意思，譯名和原文的發音相近、意象鮮明。但這篇課文重點其實不是血拼，而是藉著「血拼」這個意象鮮明的概念，來講一個重要的閱讀策略——帶著問題閱讀。
- 血拼有兩種，一種稱為「逛街」，另一種稱為「採買」。
- 如果你上街的目的是殺時間，並沒有什麼特別想買的東西。你走到哪裡，看到哪裡，這邊翻一翻換季服飾，那邊看一看手機配件。逛一個下午，也許滿載而歸，也許一樣都沒買，這就是「逛街」了。
- 「採買」就不同了，它有清楚的目的性。上街前你會先列一張血拼清單，拿筆寫下每一項需要的東西，例如，要去超市買雞蛋、牛奶、紅豆麵包，再去郵局買郵票。採買回來，你清清楚楚知道，清單上的項目是否買齊了。
- 閱讀也有兩種，一種是「篇章瀏覽」，另一種則是「帶著問題閱讀」。
- 大多數人早上打開手機，點進常用的社群媒體時，只是在「逛街」，這裡讀一點偶像新聞，那裡看一下職棒賽況，這樣的閱讀沒有特定的目的，只是走馬看花的「篇章瀏覽」。
- 但，如果你是為了週末要去平溪放天燈而上網的，你上網前，心中就會有清楚的待答問題，天氣如何？怎麼搭車？幾點要到？附近有什麼著名小吃？……這樣的閱讀就是「帶著問題閱讀」。
