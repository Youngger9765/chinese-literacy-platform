spotlight:
  lesson: G4-L17
  strategy_name: 品格力-想法感受的換位思考
  strategy_type: perspective_taking
  blocks:
  - type: guide
    text: 「換位思考」是站在別人的角度看事情，試著理解對方的處境、想法與感受。故事中的阿公、小男孩或是麵攤老闆，他們都能夠換位思考，懂得替別人著想。　　我們可以用三個步驟來學習「換位思考」喔：(1)觀察言行：看對方說了什麼、做了什麼。(2)推論動機：根據(1)的觀察，想想他為什麼這樣說或這樣做。(3)成功換位思考：綜合(2)的推論，站在他的角度，推想他可能的想法、感受或需要。　　接下來我們要用「換位思考三步驟」，來練習推論出本篇故事中人物說話或行為的動機，以及言外之意喔！
  - type: guide
    text: ◎小試身手
  - type: free_text
    prompt: 1.我們要利用換位思考三步驟來推論課文中阿公的想法，請根據阿公說的話或行為想一想、連連看，做出合理的推論。
  - type: table
    rows:
    - - 步驟一：觀察言行
      - ''
      - 步驟二：推論動機
    - - (1)
      - 老人看攤位的菜單，數手裡的零錢，點了一碗最便󠇡宜的陽春麵。
      - ●        　 ●
      - A.可能是藉由這樣的方式填飽肚子。
    - - (2)
      - 老人從袋子裡緩緩拿出瓶子，喝了口水，摸自己的肚子。
      - ●         　●
      - B.用開玩笑的方式讓孫子放心吃麵。
    - - (3)
      - 阿公說：「真的啊，飽得像蜘蛛一樣。」誇張的動作和語言，讓祖孫倆都笑了起來。
      - ●        　 ●
      - C.阿公的錢應該不夠多。
  - type: guide
    text: 步驟三：成功換位思考
  - type: passage
    source: unknown
    paragraphs:
    - →阿公應該【  還沒 / 已經  】吃飽，用這麼誇張的方式說話是因為錢不夠，又想讓孫子【  安心/放心  】吃麵。
  - type: free_text
    prompt: 2.進階題：我們要再利用換位思考三步驟來推論課文中老闆的想法，請根據老闆說的話或行為想一想、連連看，做出合理的推論。
  - type: table
    rows:
    - - 步驟一：觀察言行
      - 步驟二：推論動機
    - - (1)
      - 老闆看見老人數錢的樣子，又把祖孫的對話聽在耳裡。
      - 他發現老人的經濟狀況【】
    - - (2)
      - 他走到桌旁笑咪咪的對老人說：「恭喜恭喜，您是我們今天第一百個客人，這碗陽春麵我請客。」
      - 他想【】老人，又不希望他覺得被同情。
    - - (3)
      - 寒流來襲時，老闆看見小男孩守在攤子旁記錄進店內客人的人數，老闆打電話請老顧客跟朋友吃麵。
      - 1.他【】今天賣不到100碗。2.他擔心小男孩寒流中待太久會【】。
    - - (4)
      - 老闆娘問：「要不要也送一碗麵給那孩子呢？」老闆回答：「不，那孩子現在正在學習『不吃東西也會飽』的道理呢！」
      - 他想要讓小男孩也有機會【】為家人付出。
    answers:
    - □①好    □②不好
    - 幫助
    - □①擔心   □②希望
    - 著涼/感冒/生病
    - 學習/練習
  - type: guide
    text: 步驟三：成功換位思考
  - type: passage
    source: unknown
    paragraphs:
    - →老闆想要在不傷害老人及小男孩【   自尊心  /  自信心   】的情況下，【  幫助   】他們。
    - 有個貧窮的大學生，總在自助餐店快要打烊時，才走進店裡點了一碗白飯。他小心翼翼的詢問老闆：「請問可以幫我淋點滷肉汁嗎？」老闆笑咪咪地回：「當然沒有問題！」吃完那碗白飯後，大學生不好意思的問：「可以再給我一碗白飯嗎？我想要帶去學校當明天的午餐。」老闆接過餐盒，偷偷的把店裡的滷肉和滷蛋放在餐盒下方，並且裝了滿滿的白飯。老闆娘好奇老闆為什麼要把滷肉和滷蛋放在便當盒最下面，不放上方呢？  有個貧窮的大學生，總在自助餐店快要打烊時，才走進店裡點了一碗白飯。他小心翼翼的詢問老闆：「請問可以幫我淋點滷肉汁嗎？」老闆笑咪咪地回：「當然沒有問題！」吃完那碗白飯後，大學生不好意思的問：「可以再給我一碗白飯嗎？我想要帶去學校當明天的午餐。」老闆接過餐盒，偷偷的把店裡的滷肉和滷蛋放在餐盒下方，並且裝了滿滿的白飯。老闆娘好奇老闆為什麼要把滷肉和滷蛋放在便當盒最下面，不放上方呢？3.挑戰題：讀下面故事，運用換位思考三步驟，寫出老闆可能的想法。
    - →老闆這麼做是因為：【   怕大學生一看到老闆幫他加料，會覺得被施捨，傷害他的自尊心，因此才放在白飯下方。        　　　　               】
