passage: '寒流來襲那天，老闆又看見了小男孩。他守在攤子旁邊，每當有一位客人進入攤子，他就在自己的小冊子上記上一筆。雖然陸續有客人來，但過了好久好久，紙上的數字卻一直停留在八十五。天氣愈來愈冷，小男孩必須經常搓手踏腳以保持溫暖。老闆心急了，開始打電話給老顧客和朋友：「你今天有空嗎？能不能來吃碗麵？我請客。」

  就這樣，客人一個接著一個到了店裡，當小男孩數到第九十九個客人時，他急忙跑去找在附近做回收的老人，把他拉進攤子裡。他驕傲的說：「阿公，這一次換我請客了。」成為第一百位客人的老人，讓小男孩招待了一碗陽春麵。這次換小男孩從自己的袋子裡，拿出瓶

  子喝了口水，開心的看著阿公呼嚕呼嚕的吃起麵來。

  老闆娘看見這樣的景象，很不捨的說：「要不要也送一碗麵給那孩子呢？」「不，那孩子現在正在學習『不吃東西也會飽』的道理呢！」老闆回答。'
