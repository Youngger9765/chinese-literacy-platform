  rows:
  - label: 背景
    value: 做__的老人牽著小男孩，走進麵攤。
    blanks:
    - answer: 資源回收
      hint: ''
  - label: 起因
    value: 老人點了最便宜的__給孫子，自己只喝水。老闆看了說他們是__個客人，那碗麵他請客。
    blanks:
    - answer: 陽春麵
      hint: ''
    - answer: 第一百
      hint: ''
  - label: 經過
    value: 1.寒流來那天，小男孩想請阿公吃麵，在攤子旁數有多少      __進去吃麵，人數一直停留在85人。2.老闆看見小男孩的舉動，__給老顧客和朋友，邀請他們來店裡吃麵。3.小男孩數到第__個客人時，把老人拉進店裡，完成請阿公吃麵的心願。4.老闆娘想送一碗麵給小男孩，老闆卻說小男孩正在學習     「__」的道理。
    blanks:
    - answer: 客人
      hint: ''
    - answer: 打電話
      hint: ''
    - answer: '99'
      hint: ''
    - answer: 不吃東西也會飽
      hint: ''
  - label: 結果
    value: 吃完麵後，祖孫倆__的離去。
    blanks:
    - answer: 滿足/幸福
      hint: ''
  title: 第一百碗麵
