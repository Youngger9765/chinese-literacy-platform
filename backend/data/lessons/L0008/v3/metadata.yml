intro: 這篇文章講述一個寒冷夜晚，一位資源回收的阿公帶著孫子到麵攤吃麵的故事。阿公為了讓孫子能吃到熱騰騰的麵，自己只喝水，並巧妙地向孫子表達自己已經吃飽。麵攤老闆看見了這祖孫倆的互動，決定請客。後來，在寒流來襲的日子裡，孫子為了報答阿公的善意，也努力想讓阿公成為麵攤第一百位客人，而這份心意也讓阿公和孫子之間有了更深的理解。文章描寫了在物資匱乏的環境中，親情的可貴與人與人之間溫暖的互助。
strategy_explained: '這一課我們要練習的是**站在別人角度想一想，感受他的心情**

  這篇文章裡的阿公把麵讓給孫子吃，孫子想幫阿公的忙，都是因為他們懂得替對方著想，感受對方的需要

  讀的時候，你可以想想看，如果自己是阿公或孫子，會是什麼感覺，或是麵攤老闆看到了，心裡也會有什麼暖暖的感覺'
