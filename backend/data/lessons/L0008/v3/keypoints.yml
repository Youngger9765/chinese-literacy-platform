section_no: 五
keypoints:
  title: 第一百碗麵
  structure: flat
  rows:
  - label: 背景
    value: 做【　】的老人牽著小男孩，走進麵攤。
    blanks:
    - answer: 資源回收
  - label: 起因
    value: '老人點了最便宜的【　】給孫子，自己只喝水。

      老闆看了說他們是【　】個客人，那碗麵他請客。'
    blanks:
    - answer: 陽春麵
    - answer: 第一百
  - label: 經過
    value: '1.寒流來那天，小男孩想請阿公吃麵，在攤子旁數有多少【　】進去吃麵，人數一直停留在85人。

      2.老闆看見小男孩的舉動，【　】給老顧客和朋友，邀請他們來店裡吃麵。

      3.小男孩數到第【　】個客人時，把老人拉進店裡，完成請阿公吃麵的心願。

      4.老闆娘想送一碗麵給小男孩，老闆卻說小男孩正在學習「【　】」的道理。'
    blanks:
    - answer: 客人
    - answer: 打電話
    - answer: 99
    - answer: 不吃東西也會飽
  - label: 結果
    value: 吃完麵後，祖孫倆【　】的離去。
    blanks:
    - answer: 滿足/幸福
