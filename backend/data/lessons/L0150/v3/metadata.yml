strategy_explained: '這一課要帶你學會怎麼看懂和畫出折線圖

  這篇文章用了 PISA 數據分析臺灣學生的閱讀力趨勢和排名，最適合練習從圖表中看出重要的變化和比較

  讀的時候，你可以試著畫出 PISA 數據的折線圖，並從中找出臺灣學生閱讀力成長或退步的關鍵點喔'
