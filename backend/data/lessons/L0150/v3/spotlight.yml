        (C)經濟大幅衰退造成區域間發展不均

        (D)經濟大幅衰退反而縮小了貧富差距

        折線圖：橫軸 1998~2018(年)、縱軸「成長率(%)」-15~25，兩個灰色直條分別標

        「網路泡沫」與「金融海嘯」；實線＝收入最高20%家庭，虛線＝收入最低20%家庭。'
    printed_answer: 答案：  (B)
    answer_carrier: 橘色手寫，印在題目圖的右下角
