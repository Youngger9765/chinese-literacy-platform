lesson_uid: L0150
version_id: v3
section_no: 二
spotlight:
  strategy_name: 圖表判讀──折線圖
  strategy_type: chart_reading_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: '紅色 ☑（w:sym Wingdings F0FE）21 個，全部在本大題，PDF p4~p9 逐一清點相符；

    填空題與會考題答案是橘色手寫，文字流有此資訊；

    「對的畫○，錯的畫✗」那題的答案是 Wingdings 2 的 F099（○）與 F0CD（✗）。'
  note: '▲（symEx 25B2）與 ✗（Wingdings 2 F0CD）不在 w:t 文字流，照字面寫會被逐字門判成抄錯，

    所以在符號前後斷行（HTML 會收成空格，畫面仍是一行）。

    ●（25CF）與 ○（F099）剛好在逐字門的 BULLETS 清單裡會被濾掉，可以照寫。'
  blocks:
  - type: concept_box
    text: '我們先複習長條圖、圓形圖，再把重點放在折線圖，學會判讀數據隨時間變化的趨勢。

      1.常見的統計圖：

      2.怎麼閱讀統計圖：

      (1)先觀察圖表類型：首先確定圖表的類型，如長條圖、折線圖、圓形圖等。

      (2)閱讀標題：標題通常告訴我們圖表的主題。

      (3)閱讀橫軸和縱軸的名稱：閱讀橫軸和縱軸的名稱，它們通常告訴我們數據的類型和單位。

      (4)理解圖例：圖例（如顏色或符號）可以幫助我們區分不同類型的數據。（例如本文圖1，就是圖例，讓你知道三條線，分別代表什麼。）

      (5)讀懂統計圖：配合文字說明，讀出圖形代表數據的分佈及變化（特殊之處），以本課的折線圖為例，你可以：

      判斷線的趨勢：上升、下降、持平、起伏。

      比較不同線：誰比較高？誰變化比較大？兩條線距離變大或變小？'
  - type: guide
    text: Ａ.讀懂圖一——臺灣新生兒及全國性別比變化圖
  - type: figure
    id: 圖一
    referent: 臺灣新生兒及全國性別比變化圖
    caption: 圖一
    legend_labels:
    - 新生兒性別比
    - 全國性別比
    chart_title: 圖一 臺灣新生兒及全國性別比變化圖
    axis_titles:
    - (民國/年)
    - 性別比(%)
    carrier_note: '本圖在 PDF 上**有正常畫出來**（不像課文的圖1、圖2）。

      「圖一」與兩個圖例標籤（新生兒性別比／全國性別比）是**文字方塊**，在 document.xml；

      完整圖表標題與軸標題住在 word/charts/chart3.xml 的 `<a:t>` —— 逐字門現在讀得到，

      所以放在這一層照常受檢查，**不再借 image**。

      下面標 image 的節點只留兩樣真的驗不到的東西：我自己寫的圖形描述，

      以及系列數值（那些數字在 `<c:v>` 不在 `<a:t>`，逐字門讀的是 `<a:t>`）。'
    chart_data:
      text_carrier: image
      content: "兩條折線，橫軸民國 80~112 年（資料取自 word/charts/chart3.xml，各 33 點）：\n  新生兒性別比 起於 110.4，中段在 108~110 之間起伏，末段約 108\n  全國性別比   起於 106.77，逐年單調下降，末段跌破 100\n與教材的作答一致：民國 80 年全國性別比 107（圖上讀值 106.77）、民國 110 年約 98。"
  - type: guide
    text: (1)先觀察圖表類型：折線圖
  - type: guide
    text: '(2)閱讀標題：

      臺灣新生兒及全國性別比變化圖'
  - type: guide
    text: '(3)了解橫軸、縱軸名稱與意義:

      橫軸－民國/年

      縱軸－性別比

      性別比：

      每100名女性，男性有多少人。

      例如：「民國80年新生兒性別比=111」，它的意思是「當年出生的新生女嬰若有100人，則男嬰有111人」。'
  - type: free_text
    prompt: ❶讓我考考你，圖一顯示，民國80年全國性別比=107，請問當年全國女性若有100人，則當年全國男性有多少人？　答案：【　】人。
    answers:
    - '107'
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: free_text
    prompt: '❷民國110年時，全國性別比的數值是多少？答：【　】。

      請問當年全國女性若有100人，則男性有多少人？答：【　】人。'
    answers:
    - ９８
    - '98'
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊；第一格印成全形「９８」，第二格是半形
  - type: guide
    text: (4)理解圖例：
