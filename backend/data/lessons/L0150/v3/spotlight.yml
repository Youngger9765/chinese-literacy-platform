        趨勢以維持人口結構穩定，下列何者最可能是未來該國政府採行的作法？

        (A)提高幼兒教育補助金額 (B)加強宣導節制生育觀念 (C)提供弱勢學童輔導課程 (D)增設高齡安養照護機構

