      content: '23. 圖(九)呈現我國1998至2018年間，收入最高20%家庭與收入最低20%家庭的可支配所得

        成長率變化，其中灰階區塊是曾發生經濟成長率大幅衰退的兩段時間。根據圖中內容判斷，

        上述兩個灰階區塊的數據，呈現出下列哪一現象？

        （附註框）家庭可支配所得：家庭可以自由使用於消費或儲蓄的所得。

        (A)收入較高者的財富減損情況較嚴重

