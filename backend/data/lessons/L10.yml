vocabulary:
- word: 彌漫
  definition: 遍布、充滿。
- word: 積勞成疾
  definition: 長期勞累因而生病。
- word: 嗷嗷待哺
  definition: 形容飢餓哀號󠇡，等待餵食或救濟。
- word: 俐落
  definition: 做事明快，不拖泥帶水。
- word: 著落
  definition: 表示下落、結果。
- word: 庇蔭
  definition: 對子孫或弟妹的保護。
- word: 貼補
  definition: 填補不足的部分。
- word: 按件計酬
  definition: 按照完成的工作件數，計算工資。
- word: 餘悸猶存
  definition: 形容驚嚇、懼怕的心情，還沒平復過來。
- word: 目不識丁
  definition: 不識字或未受教育。
- word: 食指浩繁
  definition: 家裡要餵養的人數很多。
vocabulary_count: 11
fill_in_blank:
- sentence: 教室裡（　　）著一股淡淡的咖啡香，讓人感到放鬆。
  answer: A
- sentence: 爸爸為了養家，日夜辛勞，最後因過度疲憊而（　　）。
  answer: B
- sentence: 那些失去父母的孤兒，每天都（　　），盼望有人能伸出援手。
  answer: C
- sentence: 她的動作很（　　），三兩下就把桌面整理好了，一點也不拖泥帶水。
  answer: D
- sentence: 這筆捐款的用途還沒有（　　），大家都在等慈善機構的規劃。
  answer: E
- sentence: 小明在爺爺的（　　）下，生活過得無憂無慮，很少遇到困難。
  answer: F
- sentence: 媽媽打零工賺錢，希望能（　　）家用，減輕爸爸的負擔。
  answer: G
- sentence: 這份客服工作是（　　），處理的案件越多，薪水就越高。
  answer: H
- sentence: 雖然那場車禍已經過去很久了，但想到當時的驚險場面，我還是（　　）。
  answer: I
- sentence: 爺爺因為家境貧困，小時候沒機會上學，所以直到現在還是（　　）。
  answer: J
- sentence: 叔叔家裡（　　），光靠他一個人的薪水很難維持，生活壓力很大。
  answer: K
multiple_choice:
- question: 下列語詞何者使用正確？
  options:
  - 他家境貧窮，許多衣服都「嗷嗷待哺」。
  - 小青是大學教授，學問淵博、「目不識丁」。
  - 連日的加班使他「積勞成疾」，只能請假在家休養。
  - 他「身手俐落」，一天摔破了好幾個碗盤。
  answer: C
  explanation: A錯：誤用，嗷嗷待哺指人或動物；B錯：前後邏輯錯誤；D錯：前後邏輯錯誤
- question: 文中第一段提到：「遠足時，她眼睜睜的看著同學啃著紅艷的大蘋果，只能撇開目光，嚥下自己的口水。」請問小花撇開目光的原因為何？
  options:
  - 想要卻得不到，只能假裝沒看到，以免自己難受。
  - 她不喜歡同學吃的那種大蘋果，看了就不舒服。
  - 她更看重遠足時的學習，而不是吃喝玩樂。
  - 蘋果的顏色和反光刺痛了小花的眼睛。
  answer: A
  explanation: 文中提到小花「嚥下自己的口水」，表示她對蘋果有渴望。撇開目光是為了避免面對自己想要卻無法擁有的現實，以減少內心的難受。
- question: 第一段寫道，小花把糖果留到睡前，含在嘴裡再慢慢睡去，她「以為這樣才可以吃一整夜……這天真的代價可真不小啊。」請問這「天真的代價」指的可能是什麼？
  options:
  - 夢到一整個晚上都在吃糖。
  - 含著糖睡導致蛀牙。
  - 熟睡張口後引來蟑螂吃糖。
  - 嘴裡整夜都有甜蜜的滋味。
  answer: B
  explanation: 由於小花含著糖果入睡，讓糖分長時間停留在口腔內，極有可能造成蛀牙，這就是她天真行為所付出的代價。
- question: 文章最後一段提到：「小花與姊姊們都努力過人，但是，教育決定他們人生的進路的差異。」請問作者認為小花成功最可能的原因為何？
  options:
  - 姊姊們沒有像小花一樣努力。
  - 小花比姐姐好運才能夠成功。
  - 姊姊們的頭腦不如小花聰明。
  - 小花一直不放棄受教育的機會。
  answer: C
  explanation: 小花跟姊姊都努力，但差異在是否持續接受教育與學習。
- question: 請問底下哪一個選項不是本文作者的用意？
  options:
  - 提供一個在逆境中成長的案例。
  - 說明除了努力之外，也要感恩幫助自己的人。
  - 說明順境使人好逸惡勞，不知上進。
  - 強調教育是翻轉人生的關鍵力量。
  answer: C
  explanation: 作者未提到任何順境。
