- question: 課文中的商人把「不量」誤以為是「不良」，從而產生疑惑，這就是諧音雙關。請問下列何者造成誤解的原因與課文商人相同?
  options:
  - 店員：「請問您是付清嗎?」；
  - 客人：「我買了這麼多，可以送我點什麼吧?」
  - 老師：「壽司是Sushi，那『握壽司』跟『散壽司』的英文怎麼說?」
  - 老師：「寫功課時要多用點心，作業才寫得好。」
  answer: null
  explanation: null
- question: 「物產豐富」中的「物產」是本句的主語。下列各選項「」中的語詞，何者不做主語使用？
  options:
  - 「四海」昇平
  - 「群魔」亂舞
  - 「氣焰」囂張
  - 「百年」樹人
  answer: null
  explanation: null
- question: 根據本文，「張田獨無恙」的原因最可能是下列何者？
  options:
  - 張氏行善積德，得到護佑
  - 貧民虔誠祈願，感動上天
  - 張氏田產甚多無法丈量，看不出損失
  - 賈人福澤深厚，連帶使張田倖免於難。
  answer: null
  explanation: null
- question: 下列哪一選項與本文的主旨最接近？
  options:
  - 天助自助者，自助者人恆助之
  - 好心自有好報
  - 人在做，天在看
  - 謀事在人，成事在天
