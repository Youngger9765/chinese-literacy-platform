multiple_choice:
- question: 下列哪個詞語使用正確?
  options:
  - 姐姐做事「莽撞」，大家都很放心把任務交給他。(周全)
  - 眼看車子要衝過來了，爸爸「一個箭步」衝上前抱起馬路上的小孩。
  - 畢業旅行來臨，大家在車上都「鴉雀無聲」、熱鬧不已。
  - 他上課「全神貫注」，一直望著窗外發呆。
  answer: B
  explanation: A錯：周全；C錯：嘰嘰喳喳；D錯：心不在焉
- question: 第十五段提到魯夫吃了橡膠果實，下列何者最可能是魯夫的弱點？
  options:
  - 刀割。
  - 電擊。
  - 打擊。
  - 槍擊。
  answer: B
  explanation: 橡膠為絕緣體，不可導電
- question: 第一組提到：「哆啦A夢是大雄的守護神。」何者不是支持的理由。
  options:
  - 哆啦Ａ夢會適時提供大雄建議。
  - 在大雄有困難時，他會伸出援手。
  - 哆啦Ａ夢百寶袋有很多稀有的寶物。
  - 哆啦Ａ夢也常常幫助大雄的朋友們。
  answer: C
  explanation: 哆啦Ａ夢不僅幫助大雄及朋友們，定是守護神
- question: 請由本文推論「育勤」的人物特質為何？
  options:
  - 直率莽撞、不顧他人。
  - 掌控全局、大將之風。
  - 樂觀開朗、善解人意。
  - 條理分明、邏輯清晰。
  answer: D
  explanation: 選項 D，由 12、17 段可知，育勤分析
- question: 根據這篇文章，班長主要的角色是什麼？
  options:
  - 叫大家安靜不要講話。
  - 以合理程序讓大家表達不同意見。
  - 評論各候選人的政見。
  - 針對不守秩序的人給予懲罰。
  answer: B
  explanation: A錯：需舉手發言；C錯：需立場中立；D錯：主持人只能適時規勸
