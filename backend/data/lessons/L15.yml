- question: 下列哪個詞語使用正確?
  options:
  - 小原大字不識幾個，真可謂是「學問淵博」。
  - 他偷搶拐騙，無惡不作，真是「名符其實」的大善人。
  - 「富可敵國」的他，沒辦法再供應小孩的學費。
  - 王教授的口才很好，任何問題都能「應對如流」。
  answer: D
  explanation: A錯：前後句矛盾；B錯：前後句矛盾；C錯：前後句矛盾
- question: 第十九段，學生跟著孔子後面抿嘴偷笑，請問下列何種成語最符合學生的反應？(Ａ．孔子罵完宰予，學生跟在後面偷笑，代表有點看好戲的意味)
  options:
  - 幸災樂禍。　　　　　　B悲傷難受。
  - 敬佩不已。
  - 慈祥和藹。
