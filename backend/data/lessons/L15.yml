story_text: "這位酷老師，如果還活著，年紀和阿里山神木一樣老。他愛唱歌、吟詩，喜歡射箭，還是駕車的好手。他當時教過的學生約有三千人，後人尊稱他為「至聖先師」，他就是孔子。\n孔子三十歲時，就已經成為學問淵博的人，並且開始招收學生。他提倡「有教無類」，只要喜歡讀書，不分老小、貧富、貴賤或家世，肯用功向學，都可以當他的學生。富可敵國的子貢、家境貧寒的顏回、好勇直率的子路，以及個性謙和的冉有，都是孔子的得意學生。在那個時候，只有貴族才能上學，但是孔子卻開辦了一所平民學校，將教育普及到一般平民百姓，他真是一位名符其實的酷老師。\n酷老師的教學很有一套，總能針對每個人的特質，採取「因材施教」的方法。一個夏天的午後，子路問孔子：「老師，聽到該做的事，不要遲疑，立刻去做，對不對？」\n「你要先問問長輩的意見才行，不要馬上去做。」子路聽完孔子的回答，滿意的離開。\n這時，冉有也來請教同樣的問題，孔子的回答卻是：「你既然有了好主張，就不要遲疑，應該立刻去做！」\n在孔子身旁的學生公西華越聽越糊塗，忍不住發問：「老師，他們問同樣的問題，您的答案為什麼不一樣？」\n孔子笑著說：「你問得好啊！子路平時就衝動急躁，我希望他能謹慎思考再去做；至於冉有平時猶豫不決，我希望他能更果斷，免得錯失機會。」孔子了解每個學生的個性，給學生建議，就像醫生對症下藥一樣，真是酷哇！\n酷老師對教育充滿熱忱，不喜歡學生偷懶或不用功，要是被他發現，也會毫不客氣的責備。\n宰予熟讀經書，說起話來應對如流，孔子很喜歡他。有一回，宰予沒有來上學，孔子擔心他生病，特地前去探望；沒想到，他竟然躺在床上呼呼大睡，好端端的，根本沒有病。孔子眼睛瞪得像銅鈴一般大，盯著鼾聲如雷的宰予，一句話也沒說。 \n「宰予……」孔子身旁的學生試著叫醒宰予。 \n「只是睡個午覺嘛！」宰予翻過身，繼續睡。 \n「宰予……」\n「睡個午覺嘛，吵什麼吵！」\n「宰予！」孔子大聲喝\U000E01E1斥。\n宰予一聽，嚇得跌下床。\n「老——老——」\n「老——老什麼老？」\n孔子氣得火冒三丈，掉頭就走。\n「唉！朽木不可雕也！」學生們跟在老師後頭，抿嘴偷笑。)\n後來，孔子感慨的對學生們說：「以前我看人，只要聽了這個人的話，就會相信所做的事是真的。但是自從宰予這件事後，讓我學到還要從旁觀察這個人言行是否一致。」\n孔子用了將近一輩子的時間當老師，他是非分明，學生表現好，他不吝讚美，學生犯了錯，他嚴加責備。他上課最常使用的方式就是「問與答」，他喜歡學生提出問題，喜歡和學生們對談，甚至學生們和他辯論，一點也不生氣。\n學生們把和孔子在生活中的對話，加上平常的作為記錄下來，集結成《論語》，表達了對老師的懷念與敬愛；讓兩千五百年後的我們，也能透過閱讀，了解孔子是個博學有智慧，為理想奉獻一生的酷老師。"
paragraphs:
- 這位酷老師，如果還活著，年紀和阿里山神木一樣老。他愛唱歌、吟詩，喜歡射箭，還是駕車的好手。他當時教過的學生約有三千人，後人尊稱他為「至聖先師」，他就是孔子。
- 孔子三十歲時，就已經成為學問淵博的人，並且開始招收學生。他提倡「有教無類」，只要喜歡讀書，不分老小、貧富、貴賤或家世，肯用功向學，都可以當他的學生。富可敵國的子貢、家境貧寒的顏回、好勇直率的子路，以及個性謙和的冉有，都是孔子的得意學生。在那個時候，只有貴族才能上學，但是孔子卻開辦了一所平民學校，將教育普及到一般平民百姓，他真是一位名符其實的酷老師。
- 酷老師的教學很有一套，總能針對每個人的特質，採取「因材施教」的方法。一個夏天的午後，子路問孔子：「老師，聽到該做的事，不要遲疑，立刻去做，對不對？」
- 「你要先問問長輩的意見才行，不要馬上去做。」子路聽完孔子的回答，滿意的離開。
- 這時，冉有也來請教同樣的問題，孔子的回答卻是：「你既然有了好主張，就不要遲疑，應該立刻去做！」
- 在孔子身旁的學生公西華越聽越糊塗，忍不住發問：「老師，他們問同樣的問題，您的答案為什麼不一樣？」
- 孔子笑著說：「你問得好啊！子路平時就衝動急躁，我希望他能謹慎思考再去做；至於冉有平時猶豫不決，我希望他能更果斷，免得錯失機會。」孔子了解每個學生的個性，給學生建議，就像醫生對症下藥一樣，真是酷哇！
- 酷老師對教育充滿熱忱，不喜歡學生偷懶或不用功，要是被他發現，也會毫不客氣的責備。
- "宰予熟讀經書，說起話來應對如流，孔子很喜歡他。有一回，宰予沒有來上學，孔子擔心他生病，特地前去探望；沒想到，他竟然躺在床上呼呼大睡，好端端的，根本沒有病。孔子眼睛瞪得像銅鈴一般大，盯著鼾聲如雷的宰予，一句話也沒說。 \n「宰予……」孔子身旁的學生試著叫醒宰予。 \n「只是睡個午覺嘛！」宰予翻過身，繼續睡。 \n「宰予……」\n「睡個午覺嘛，吵什麼吵！」\n「宰予！」孔子大聲喝\U000E01E1斥。\n宰予一聽，嚇得跌下床。\n「老——老——」\n「老——老什麼老？」\n孔子氣得火冒三丈，掉頭就走。\n「唉！朽木不可雕也！」學生們跟在老師後頭，抿嘴偷笑。)"
- 後來，孔子感慨的對學生們說：「以前我看人，只要聽了這個人的話，就會相信所做的事是真的。但是自從宰予這件事後，讓我學到還要從旁觀察這個人言行是否一致。」
- 孔子用了將近一輩子的時間當老師，他是非分明，學生表現好，他不吝讚美，學生犯了錯，他嚴加責備。他上課最常使用的方式就是「問與答」，他喜歡學生提出問題，喜歡和學生們對談，甚至學生們和他辯論，一點也不生氣。
- 學生們把和孔子在生活中的對話，加上平常的作為記錄下來，集結成《論語》，表達了對老師的懷念與敬愛；讓兩千五百年後的我們，也能透過閱讀，了解孔子是個博學有智慧，為理想奉獻一生的酷老師。
