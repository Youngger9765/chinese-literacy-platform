spotlight:
  lesson: G5-L13
  strategy_name: 推論策略-找出觀點與支持理由
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 前兩課，我們學會分辨觀點與支持理由，也會為觀點中的不同重點找理由。這一課要再往前一步：文章的支持理由不一定緊接在觀點後面，可能分散在不同段落。閱讀時，要先抓住作者的觀點，再回到全文，找出能支持各個重點的事件或細節，看看這些理由合起來，是否能充分支持作者的觀點。這一課，我們要進一步練習：跨段找出支持理由，再把理由組合起來，看出它們如何完整支持作者的觀點。
  - type: guide
    text: ◎小試身手：
  - type: single
    prompt: 一、確認觀點：本文作者藉由周思齊的經歷表達觀點，下列何者最符合作者的觀點？（單選）
    options:
    - 大學畢業，周思齊進入職棒，直到第三年才當上先發球員
    - 每次出外比賽住進飯店，周思齊總是膽戰心驚
    - 他沒有妥協，也不願違背良心或辜負他最愛的棒球和球迷
    - 信念和堅持能幫助人不走錯方向
    answer: 大學畢業，周思齊進入職棒，直到第三年才當上先發球員
  - type: single
    prompt: 二、找出觀點重點：上面的觀點包含哪些重點？（複選）
    options:
    - 面對威脅時的膽戰心驚
    - 心中的信念和堅持
    - 進入職棒的原因
    - 支持他的球迷
    - 不走錯方向
    - 外出比賽時住進飯店
    - 第三年才當上先發球員
    answer: 面對威脅時的膽戰心驚
  - type: guide
    text: 三、跨段落找支持理由：根據上題，下列哪些事件或細節，分別能支持觀點中的兩個重點？（可複選）
  - type: free_text
    prompt: 1.支持觀點重點：「他有信念和堅持」
  - type: single
    prompt: 哪些事件或細節可以看出他有「信念和堅持」？
    options:
    - 他不願違背良心，也不願辜負最愛的棒球和支持他的球迷
    - 他要求自己不管環境如何，每場比賽都要全力以赴
    - 他念高中時，英文畢業考只考 26 個英文字母的大、小寫
    answer: 他不願違背良心，也不願辜負最愛的棒球和支持他的球迷
  - type: free_text
    prompt: 2.支持觀點重點：「他沒有走錯方向」
  - type: single
    prompt: 哪些事件或細節可以看出他「沒有走錯方向」？
    options:
    - 他拒絕黑道提出的五、六百萬簽約金與打假球的要求
    - 假球案爆發，他是少數沒有打假球嫌疑的人
    - 他進入職棒第三年才當上先發球員
    answer: 他拒絕黑道提出的五、六百萬簽約金與打假球的要求
  - type: guide
    text: 四、組合應用：下列選項為作者的觀點及支持觀點的細節，請用以下的結構整理作者想法。
  - type: guide
    text: 閱讀以下選項與結構，並根據文意填入A、B、C。
  - type: guide
    text: (A)要求自己每場比賽都要全力以赴
  - type: guide
    text: (B)信念和堅持能幫助我們不走錯方向
  - type: guide
    text: (C)拒絕黑道提出的百萬簽約金與打假球的要求
  - type: guide
    text: ◎作者想法：作者認為(  Ｂ  )。首先，周思齊(  Ａ  )，不拿環境當藉口，也不能辜負球迷。再者，他因著這份信念和堅持，在多數人都妥協時，他(  Ｃ  )，沒有走錯方向。最後，這份信念與堅持，造就了他穩定的表現，並幫助他在臺灣棒球史上留下的重要地位。
  - type: single
    prompt: 五、延伸練習：上面找出的支持理由，還可以支持下列哪些觀點？(複選)
    options:
    - 面對眼前利益時，不應放棄自己的原則
    - 持續學習新知，能為未來增加更多選擇
    - 良好的學習環境，能幫助運動員提升能力
    - 困境中堅守原則，能幫助人保持清白
    answer: 面對眼前利益時，不應放棄自己的原則
  - type: passage
    source: unknown
    paragraphs:
    - (A)宜用「細心謹慎」(B)宜用「回應」(C)宜用「妥協」(A)宜用「細心謹慎」(B)宜用「回應」(C)宜用「妥協」請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出文章想傳達的觀點。
    - 我能找出觀點中的不同重點。
    - 我能跨段找出支持各個重點的理由。
