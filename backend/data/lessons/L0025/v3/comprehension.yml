lesson_uid: L0025
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列選項「　」中的語詞，何者使用正確？
    options:
      A: 因為天生「膽戰心驚」，所以在比賽中總能冷靜分析局勢
      B: 他初次上場就能「辜負」全隊的期望，讓大家倍感振奮
      C: 這次他難得願意「倔強」，和隊友們溝通，嘗試取得共識
      D: 他在首次比賽中就能「大展身手」，贏得了觀眾們的掌聲
    option_notes:
      A: (A)宜用「細心謹慎」
      B: (B)宜用「回應」
      C: (C)宜用「妥協」
  - index: 2
    answer: D
    stem: 根據周思齊面對打假球威脅時的行為，可以推論他最重視的是下列何者？
    options:
      A: 保護個人安全，避免任何風險
      B: 維護球隊形象，保持外界信任
      C: 獲得更多比賽以及高額獎金的機會
      D: 堅守職業道德，不違背初衷和良心
    teacher_note: 從他不願違背良心、辜負球迷的期待來看宜選(D)
  - index: 3
    answer: A
    stem: 根據第六段，為什麼文中會提到「球員的平均職業運動生涯只有 4.8 年」？
    options:
      A: 突顯周思齊職棒生涯長達 20 年的難能可貴
      B: 說明棒球比其他運動失敗率更高也更易受傷
      C: 說明多數職業球員不願意長期投入棒球運動
      D: 暗示球員生涯短是因為缺乏專業訓練與防護
    teacher_note: 根據第六段前後文可知。
    quote_mismatch_note: 題幹引號內寫「球員的平均職業運動生涯只有 4.8 年」，課文第六段原文是「球員的平均職棒生涯只有4.8年」——引用與原文不符，但改動它等於改題目，故不列勘誤
  - index: 4
    answer: B
    stem: 下列何者最符合本文主旨？
    options:
      A: 周思齊的成功完全依靠天賦與運氣來取得成就
      B: 堅守信念並持續努力才能夠走過困境達成目標
      C: 棒球員應避免參加職業比賽以免捲入假球事件
      D: 棒球生涯若想要長久必須選擇收入較高的球隊
    option_notes:
      A: 是靠努力
      C: (C)(D)文章未提及
  - index: 5
    answer: A
    stem: 第七段描述周思齊手上的厚繭、脫皮與疤痕，最能支持下列哪一個觀點？
    options:
      A: 長期投入訓練，會在身體上留下努力的痕跡
      B: 面對挑戰，經常必須伴隨代價才能有所收穫
      C: 手上的厚繭越多，職業運動生涯通常越長久
      D: 保持良好狀態需要在日常中養成自律的習慣
    teacher_note: 根據第七段後文「這些都是他堅持與努力的痕跡」可知。
