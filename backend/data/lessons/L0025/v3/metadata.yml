  總表_對照: "⚠️ 本課的總表語詞欄有三處異常（差異全在總表側，學習單自己前後一致）：\n① 語詞4 把兩個語詞併進同一格：「身家資料膽戰心驚」＝身家資料＋膽戰心驚。\n\
    ② 語詞5 是空的（應該就是被併掉的那一格）。\n③ 總表列了「妥協」，但學習單的語詞框與第三大題都沒有它；反過來學習單有的\n   「睽違」「自傳」總表沒列。\n\
    學習單語詞框、第三大題 10 題、第八大題找字語詞框三者一致，都是同樣的 10 個語詞。"
strategy_explained: '這一課我們要練習的是，看看作者為什麼要這樣寫，他是不是有什麼想法或目的，然後在文章裡找一找，哪些地方可以證明你猜的想法對不對

  這篇寫周思齊為了棒球、為了不向誘惑低頭，非常堅持，這就是一個很好的例子，可以讓我們練習去想，為什麼作者會這樣寫他，以及他是怎麼做到

  所以讀的時候，你可以多想想，作者寫這些故事，是希望我們學到什麼，然後去文章裡找證據，看看有沒有哪些句子或事情，可以支持你的想法喔'
