  passage: 那時，球員平均月薪不到十萬元，對方卻開出五、六百萬元的簽約金，利誘球員答應打假球，還說之後會有更多獎金。除了利誘，對方也恐嚇球員，聲稱已掌握他們的身家資料和住址，甚至在桌上一邊擺錢，一邊擺槍，逼他們做出選擇。面對這些威脅，周思齊每次隨隊外出比賽，一住進飯店就膽戰心驚。為了不讓黑道找到，他有好幾次和隊友躲進衣櫃，或冒著摔下去的危險，待在狹小的陽台上，假裝房裡沒有人。有一次，他被黑道大哥找去，便假裝接電話，趁機逃跑，一路跑到黑漆漆的山路旁，躲進樹叢裡，等待機會攔車離開。整整一年，他都活在不安與恐懼中。然而，即使面對這些威脅，他仍沒有妥協，也不願違背自己的良心，更不願辜負最愛的棒球和支持他的球迷。後來，假球案爆發，全隊有兩位教練和十二位球員遭到起訴，只有他、總教練和內野手搭檔三人沒有打假球的嫌疑。隔年，他轉到另一支球隊，沒想到新球隊又爆發假球風暴。即便如此，他仍然堅守信念，沒有退讓。獲得最佳外野手獎時，他曾說：「當時外在條件不能選擇，也很難控制，但我一直告訴自己要堅持自己的信念，不管環境如何，每場比賽我都是全力以赴。」
  start_text: 那時，球員平均月薪不到十萬元，對方卻開出五、六百
