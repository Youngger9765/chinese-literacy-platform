lesson_uid: L0025
version_id: v3
section_no: 六
spotlight:
  strategy_name: 找出觀點與支持理由
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '前兩課，我們學會分辨觀點與支持理由，也會為觀點中的不同重點找理由。

      這一課要再往前一步：文章的支持理由不一定緊接在觀點後面，可能分散在不同段落。閱讀時，要先抓住作者的觀點，再回到全文，找出能支持各個重點的事件或細節，看看這些理由合起來，是否能充分支持作者的觀點。

      這一課，我們要進一步練習：跨段找出支持理由，再把理由組合起來，看出它們如何完整支持作者的觀點。'
  - type: guide
    text: ◎小試身手：
  - type: single
    label: 一、確認觀點
    prompt: 一、確認觀點：本文作者藉由周思齊的經歷表達觀點，下列何者最符合作者的觀點？（單選）
    options:
      1: 大學畢業，周思齊進入職棒，直到第三年才當上先發球員
      2: 每次出外比賽住進飯店，周思齊總是膽戰心驚
      3: 他沒有妥協，也不願違背良心或辜負他最愛的棒球和球迷
      4: 信念和堅持能幫助人不走錯方向
    answer: 4
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: multi
    label: 二、找出觀點重點
    prompt: 二、找出觀點重點：上面的觀點包含哪些重點？（複選）
    options:
      1: 面對威脅時的膽戰心驚
      2: 心中的信念和堅持
      3: 進入職棒的原因
      4: 支持他的球迷
      5: 不走錯方向
      6: 外出比賽時住進飯店
      7: 第三年才當上先發球員
    answers:
    - 2
    - 5
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: sub_block
    label: 三、跨段落找支持理由
    instruction: 三、跨段落找支持理由：根據上題，下列哪些事件或細節，分別能支持觀點中的兩個重點？（可複選）
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    items:
    - type: multi
      index: 1
      prompt: 1.支持觀點重點：「他有信念和堅持」
      sub_prompt: 哪些事件或細節可以看出他有「信念和堅持」？
      options:
        1: 他不願違背良心，也不願辜負最愛的棒球和支持他的球迷
        2: 他要求自己不管環境如何，每場比賽都要全力以赴
        3: 他念高中時，英文畢業考只考 26 個英文字母的大、小寫
      answers:
      - 1
      - 2
      prompt_marker_note: PDF 上「重點」與冒號之間印有 ❶，該符號不在文字流（Word 圖形／符號物件）
    - type: multi
      index: 2
      prompt: 2.支持觀點重點：「他沒有走錯方向」
      sub_prompt: 哪些事件或細節可以看出他「沒有走錯方向」？
      options:
        1: 他拒絕黑道提出的五、六百萬簽約金與打假球的要求
        2: 假球案爆發，他是少數沒有打假球嫌疑的人
        3: 他進入職棒第三年才當上先發球員
      answers:
      - 1
      - 2
      prompt_marker_note: PDF 上「重點」與冒號之間印有 ❷，該符號不在文字流
  - type: exercise
    label: 四、組合應用
    instruction: 四、組合應用：下列選項為作者的觀點及支持觀點的細節，請用以下的結構整理作者想法。
    sub_instruction: 閱讀以下選項與結構，並根據文意填入A、B、C。
    option_bank:
      A: 要求自己每場比賽都要全力以赴
      B: 信念和堅持能幫助我們不走錯方向
      C: 拒絕黑道提出的百萬簽約金與打假球的要求
    answer_carrier: 紅色手寫字（圖形），文字流的（　）內已填有答案
    items:
    - type: free_text
      label: ◎作者想法
      prompt: ◎作者想法：作者認為（　）。首先，周思齊（　），不拿環境當藉口，也不能辜負球迷。再者，他因著這份信念和堅持，在多數人都妥協時，他（　），沒有走錯方向。最後，這份信念與堅持，造就了他穩定的表現，並幫助他在臺灣棒球史上留下重要地位。
      prompt_source_text: ◎作者想法：作者認為（　）。首先，周思齊（　），不拿環境當藉口，也不能辜負球迷。再者，他因著這份信念和堅持，在多數人都妥協時，他（　），沒有走錯方向。最後，這份信念與堅持，造就了他穩定的表現，並幫助他在臺灣棒球史上留下的重要地位。
      errata_ref: E1
      blanks:
      - answer: B
      - answer: A
      - answer: C
      boxed_terms:
      - 作者認為
      - 首先
      - 再者
      - 最後
      boxed_terms_note: 這四個結構詞在教材上加了外框，用來提示「觀點→理由→理由→總結」的組合順序
  - type: multi
    label: 五、延伸練習
    prompt: 五、延伸練習：上面找出的支持理由，還可以支持下列哪些觀點？(複選)
    options:
      1: 面對眼前利益時，不應放棄自己的原則
      2: 持續學習新知，能為未來增加更多選擇
      3: 良好的學習環境，能幫助運動員提升能力
      4: 困境中堅守原則，能幫助人保持清白
    answers:
    - 1
    - 4
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出文章想傳達的觀點。
    - 2.我能找出觀點中的不同重點。
    - 3.我能跨段找出支持各個重點的理由。
