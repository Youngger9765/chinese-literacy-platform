  items:
  - index: 1
    word: 殘骸
    definition: 物體被破壞後留下的不完整部分。
  - index: 2
    word: 危機四伏
    definition: 到處都有潛藏的危險。
  - index: 3
    word: 蚊蚋
    definition: 蚊和蚋是兩種會叮咬、吸血的小昆蟲，常在潮濕環境出沒。
  - index: 4
    word: 襁褓
    definition: 本來指包裹嬰兒的布，也常用來指年幼、仍需要照顧的嬰兒。
  - index: 5
    word: 骨瘦如柴
    definition: 形容人非常瘦，瘦得像只剩骨頭。
  - index: 6
    word: 渺茫
    definition: 看不清楚、難以預料；常用來形容希望很小。
  - index: 7
    word: 倖存
    definition: 經歷災難或危險後活下來。
  - index: 8
    word: 罹難
    definition: 遇到災難而死亡。
  - index: 9
    word: 充飢
    definition: 吃東西以解除飢餓。
  - index: 10
    word: 植被
    definition: 某個地區覆蓋地面的各種植物。
