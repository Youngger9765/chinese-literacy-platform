strategy_explained: '這一課我們要練習的是「找出故事的重點」，像是先想想故事裡遇到了什麼大麻煩，然後是怎麼想辦法解決的，最後結果怎麼樣，這樣就能抓住文章說了什麼

  因為這篇文章講了孩子們在雨林裡怎麼靠著知識和智慧撐了40天，又講了搜救隊怎麼努力找到他們，很適合我們練習怎麼把一個長長的故事，變成簡單的問題、解決、結果這樣重要的線索

  所以你讀的時候，可以一邊看一邊想，遇到什麼危險，他們怎麼做的，最後怎麼樣了，這樣就很容易讀懂這篇精彩的求生故事囉'
