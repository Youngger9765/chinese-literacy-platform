intro: 這篇文章講述了一個真實的救援故事。在亞馬遜雨林中，一架載有四名孩童的飛機不幸墜毀，三位大人罹難。年幼的孩子們必須在嚴峻的叢林環境中獨自求生。文章描述了搜救團隊如何克服重重困難，在廣闊且危機四伏的雨林中展開大規模搜救行動。同時，也呈現了孩子們如何在極端艱困的條件下，依靠著大姊的智慧和族人傳授的知識，努力生存了40天，最終奇蹟般獲救的過程。
