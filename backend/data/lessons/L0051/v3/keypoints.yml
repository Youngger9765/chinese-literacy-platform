section_no: 五
keypoints:
  title: 奇蹟行動
  layout: list
  answer_carrier: 橘色手寫體字（文字流的【　】內已填有答案，非圖形層）
  rows:
  - label: '飛機失事

      （段2）'
    value: 2023年5月1日，小飛機在飛越亞馬遜雨林上空時，意外【　】。三名成人罹難，四名孩子受困雨林。
    blanks:
    - answer: 墜機
  - label: '搜救困難

      （段4-5）'
    value: 搜尋範圍十分【　】，雨林植被茂密，加上雷雨不斷、能見度低，還有蚊蟲、毒蛇和野獸出沒。
    blanks:
    - answer: 廣大
  - label: '搜救行動

      （段4-5）'
    value: '1.軍人帶著【　】進入雨林搜索，超過200名原住民志工也加入。

      2.搜救隊空投傳單和【　】，並播放孩子祖母的錄音。'
    blanks:
    - answer: 搜救犬
    - answer: 食物箱
  - label: '出現希望

      （段6）'
    value: 搜救隊發現孩子的足印、被啃過的野果、奶瓶和遮蔽棚，相信孩子們很可能【　】。
    blanks:
    - answer: 還活著
  - label: '孩子求生

      （段8）'
    value: '1.萊絲莉運用族人教導的【　】知識，分辨可食用與有毒的植物。

      2.她採集種子、野果和根莖類植物充飢，收集【　】，並和索來尼在樹上搭建小屋。

      3.她還照顧年幼的弟妹和【　】。'
    blanks:
    - answer: 野外求生
    - answer: 雨水
    - answer: 小嬰兒
  - label: '結果

      （段7）'
    value: 墜機【　】後，搜救隊找到四名孩子。他們雖然體力虛弱，但仍然意識清楚。
    blanks:
    - answer: 40天
  rows_note: '左欄一格印兩行（項目名 ＋ 段落），照原樣寫進 label。段落是原稿印好的黑字，

