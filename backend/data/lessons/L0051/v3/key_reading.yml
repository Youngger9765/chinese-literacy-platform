  passage: 飛機失事後，哥倫比亞軍方派出上百名特種部隊隊員，帶著10隻搜救犬進入蠻荒叢林，展開地毯式搜索；另有超過200名原住民志工主動加入搜救行列。亞馬遜熱帶雨林被喻為「地球之肺」，植被十分茂密。搜救範圍達323平方公里。雨林中的巨樹平均高40至50公尺，樹木又十分密集，陽光難以透入，因此搜救行動十分艱難。搜救團隊花了超過兩週，才找到飛機殘骸和三位大人的遺體，但仍沒有發現孩子們的蹤跡。為了營救四個孩子，數架直升機在雨林上空盤旋，搜尋孩子們的蹤跡。搜救隊曾空投一萬份傳單，也從空中播放孩子們祖母的錄音，希望孩子們留在原地等待救援。搜救隊也把食物箱空投到叢林，有些食物箱似乎被孩子們撿到。然而，這片叢林十分廣闊，到處都是蚊蚋、毒蜘蛛和血蛭，也經常有蟒蛇、美洲豹等野獸出沒。加上雷雨不斷、能見度低，搜救工作十分困難。
  start_text: 飛機失事後，哥倫比亞軍方派出上百名特種部隊隊員，
