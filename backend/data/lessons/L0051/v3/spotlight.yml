lesson_uid: L0051
version_id: v3
section_no: 六
spotlight:
  strategy_name: 摘要策略──問題—解決—結果找重點
  strategy_type: summary
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '這是一個真實故事，過去，我們已經學會用「問題—解決—結果」整理文章重點：

      1.發生了什麼問題？

      2.誰採取了什麼行動？

      3.行動最後帶來什麼結果？

      這一課再往前一步。〈奇蹟行動〉先寫搜救人員怎麼尋找孩子，寫到孩子獲救後，才回頭說明孩子如何在雨林中活下來。文章中有兩條分散在前後文的行動線，我們要把它們整理起來，才能找出全文重點。

      這一課要練習：

      ❶抓核心問題→❷找出兩條行動線→❸看每條線解決哪一部分問題

      →❹整合結果'
  - type: guide
    text: 一、整理「問題—解決—結果」
  - type: guide
    text: 請你用過去學到的方法，整理本課的「問題—解決—結果」，並填入「解決」與「結果」所在的段落。
  - type: sub_block
    label: '問題

      （第2～3段）'
    layout_note: '原稿把這四個 sub_block 排成一張兩欄表（欄名「元素(段落)」「重點」）：

      左欄是這裡的 label，右欄是 items。因為右欄裝的是真的選擇題與填空題，

      寫成 fill_table 會把選項壓成純文字，故改用 sub_block 保留可作答結構。'
    items:
    - type: single
      prompt: 1.飛機墜毀後，這篇文章最重要的問題是什麼？（單選）
      options:
        1: 四名孩子如何搭乘小飛機前往北方城市？
        2: 四名孩子受困雨林後，能否活下來並被找到？
        3: 搜救人員如何在雨林中學會野外求生？
      answer: 2
      answers_printed: true
      answer_carrier: 紅色 ☑（Wingdings F0FE），文字流以符號字元存在
  - type: sub_block
    label: '解決

      行動線一：外界如何搜救

      （第【　】～【　】段）'
    label_blanks:
    - answer: '4'
    - answer: '6'
    items:
    - type: multi
      prompt: '1.找重要行動

        下列哪些是搜救人員採取的行動？（5選4）'
      options:
        1: 軍人帶著搜救犬進入雨林搜索。
        2: 超過200名原住民志工加入行動。
        3: 空投傳單和食物箱，播放祖母錄音。
        4: 根據足印、野果、奶瓶和遮蔽棚追蹤。
        5: 分辨可食用的植物，採集野果充飢。
      answers:
      - 1
      - 2
      - 3
      - 4
      answers_printed: true
      answer_carrier: 紅色 ☑（Wingdings F0FE）四個，第 5 項為空白 □
    - type: free_text
      prompt: '2.把細節精簡成一句話

        上面的行動很多，請用一句話說出這些行動共同的作用。

        →軍人和原住民志工運用不同方法【　】，並根據孩子留下的【　】繼續追蹤，最後【　】。'
      blanks:
      - answer: 持續搜索
      - answer: 活動線索
      - answer: 找到四名孩子
  - type: sub_block
    label: '解決

      行動線二：孩子如何自救

      （第【　】段）'
    label_blanks:
    - answer: '8'
    items:
    - type: multi
      prompt: '1.找重要行動

        下列哪些是萊絲莉和弟妹採取的自救行動？（5選4）'
      options:
        1: 分辨哪些植物可以吃、哪些有毒。
        2: 採集種子、野果和根莖類植物。
        3: 收集雨水，並在樹上搭建小屋。
        4: 照顧年幼的弟妹和小嬰兒。
        5: 空投傳單，播放孩子祖母的錄音。
      answers:
      - 1
      - 2
      - 3
      - 4
      answers_printed: true
      answer_carrier: 紅色 ☑（Wingdings F0FE）四個，第 5 項為空白 □
    - type: free_text
      prompt: '2.把細節精簡成一句話

        上面行動很多，請用一句話說出這些行動共同的作用。

        →萊絲莉運用【　】，解決食物、飲水、休息和照顧弟妹等問題，讓四名孩子能夠【　】。'
      blanks:
      - answer: 族人教導的野外求生知識
      - answer: 在雨林中活下來
      blanks_note: 第一格原稿印成「族人教導的野 外求生知識」，「野」「外」之間多一個空格。
  - type: sub_block
    label: '結果

      （第【　】段）'
    label_blanks:
    - answer: '7'
    items:
    - type: free_text
      prompt: '1.把兩條行動線接起來

        請根據前面的整理，完成兩條行動線。

        ⑴孩子的自救行動→讓孩子【　】

        ⑵搜救人員持續搜尋→最後【　】'
      blanks:
      - answer: 撐過40天／活下來
      - answer: 找到孩子
    - type: free_text
      prompt: '2.兩條行動線合起來，最後的結果是：

        四名孩子在雨林中撐過40天，最後【　】'
      blanks:
      - answer: 活著獲救
  - type: guide
    text: 二、整合全文重點
  - type: single
    prompt: 根據上面的整理，哪一句最能完整概括全文重點？（單選）
    options:
      1: 孩子運用求生知識撐過40天，顯示野外技能十分重要
      2: 搜救人員克服雨林阻礙持續尋找，最後成功找到四個孩子
      3: 孩子設法活下來，搜救人員持續尋找，兩條行動共同促成孩子獲救
    answer: 3
    answers_printed: true
    answer_carrier: 紅色 ☑（Wingdings F0FE）
  - type: guide
    text: 三、比較段落順序與文章結構
  - type: free_text
    prompt: 上面的表：問題在第【　】段；兩條解決行動線，「外界搜救」在第【　】段，孩子自救在第【　】段；結果在第【　】段。
    blanks:
    - answer: 2～3
    - answer: 4～6
    - answer: '8'
    - answer: '7'
  - type: guide
    text: '→你發現了嗎？

      文章的段落順序，不一定和「問題—解決—結果」的結構順序相同。

      整理重點時，要判斷各段屬於哪一部分，不能只看出現的先後。'
  - type: guide
    label: ◎策略帶著走
    text: '下次讀到同一個問題有不同人物採取行動時，可以問自己：

      1.誰做了什麼？

      2.每一組行動解決了問題的哪一部分？

      3.這些行動如何合起來，造成最後的結果？'
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出文章真正要解決的核心問題。
    - 2.我能整理不同人物的行動，說出各自的作用。
    - 3.我能判斷各段屬於問題、解決還是結果，整理出全文重點。
