lesson_uid: L0051
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 答案代號印在題號前的（　）內，文字流已含，非圖形層
  questions:
  - index: 1
    answer: B
    stem: 文中說「大家越來越覺得希望渺茫」，這句話最接近什麼意思？
    options:
      A: 大家已經掌握位置，很快就能找到孩子
      B: 孩子是否平安仍難確定，找到的希望很小
      C: 搜救人員決定停止搜索，不願繼續行動
      D: 雨林天氣逐漸轉好，搜索變得十分容易
  - index: 2
    answer: C
    stem: 搜救隊看到足印、被啃過的野果、奶瓶和遮蔽棚後，為什麼重新燃起希望？
    options:
      A: 這些線索證明孩子一直留在墜機現場
      B: 這些物品表示飛機上的物資仍保存完整
      C: 這些線索顯示有人活動，孩子可能還活著
      D: 這些物品讓搜救隊立刻知道孩子的確切位置
    teacher_hint: 足印、被啃過的野果、奶瓶和遮蔽棚，都顯示失事後可能仍有人活動，因此搜救隊相信孩子可能還活著。
  - index: 3
    answer: B
    stem: 哥倫比亞軍方在搜救過程中面臨的主要挑戰是什麼？
    options:
      A: 沒有足夠的人手和裝備
      B: 叢林環境惡劣，能見度低
      C: 當地原住民多數不合作
      D: 合格搜救犬的數量不足
    teacher_hint: (第四段：亞馬遜熱帶雨林植被茂密，巨樹多，密集度難以讓陽光透入，能見度低，這些因素使得搜救行動極為困難。)
  - index: 4
    answer: A
    stem: 下列哪一項最能說明「孩子自救」和「外界搜救」的不同作用？
    options:
      A: 孩子自救使他們活下來，外界搜救使他們被找到
      B: 孩子自救使搜救停止，外界搜救提供所有食物
      C: 孩子自救只是照顧嬰兒，外界搜救負責搭建小屋
      D: 孩子自救讓雨林變安全，外界搜救消除所有危險
    teacher_hint: A完整呈現兩條行動線。其他選項都把人物行動或作用弄錯。
  - index: 5
    answer: B
    stem: 下列哪一項最能概括本文主旨？
    options:
      A: 亞馬遜雨林環境險惡，年幼孩童不適合搭飛機出門
      B: 族人傳承的求生知識與持續搜救，共同促成孩子獲救
      C: 軍方擁有大量人力與設備，是救援成功的唯一原因
      D: 野外求生最重要的是辨識植物，其他方法並不重要
  teacher_hint_carrier: 三則教師註解印在題目右側的小方框內（文字方塊），文字流已含。
