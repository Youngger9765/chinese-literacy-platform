  - label: 問題（第2～3段）
    value: 1.飛機墜毀後，這篇文章最重要的問題是什麼？（單選）□①四名孩子如何搭乘小飛機前往北方城市？□②四名孩子受困雨林後，能否活下來並被找到？□③搜救人員如何在雨林中學會野外求生？
    blanks: []
  - label: 解決行動線一：外界如何搜救（第4～6段）
    value: 1.找重要行動 下列哪些是搜救人員採取的行動？（5選4）□①軍人帶著搜救犬進入雨林搜索。□②超過200名原住民志工加入行動。□③空投傳單和食物箱，播放祖母錄音。□④根據足印、野果、奶瓶和遮蔽棚追蹤。□⑤分辨可食用的植物，採集野果充飢。2.把細節精簡成一句話上面的行動很多，請用一句話說出這些行動共同的作用。→軍人和原住民志工運用不同方法__，並根據孩子留下的__繼續追蹤，最後__。
    blanks:
    - answer: 持續搜索
      hint: ''
    - answer: 活動線索
      hint: ''
    - answer: 找到四名孩子
      hint: ''
  - label: 解決行動線二：孩子如何自救（第8段）
    value: 1.找重要行動 下列哪些是萊絲莉和弟妹採取的自救行動？（5選4）□①分辨哪些植物可以吃、哪些有毒。□②採集種子、野果和根莖類植物。□③收集雨水，並在樹上搭建小屋。□④照顧年幼的弟妹和小嬰兒。□⑤空投傳單，播放孩子祖母的錄音。2.把細節精簡成一句話上面行動很多，請用一句話說出這些行動共同的作用。→萊絲莉運用__，解決食物、飲水、休息和照顧弟妹等問題，讓四名孩子能夠__。
    blanks:
    - answer: 族人教導的野外求生知識
      hint: ''
    - answer: 在雨林中活下來
      hint: ''
  - label: 結果（第7段）
    value: 1.把兩條行動線接起來請根據前面的整理，完成兩條行動線。⑴孩子的自救行動→讓孩子__⑵搜救人員持續搜尋→最後__2.兩條行動線合起來，最後的結果是：
      四名孩子在雨林中撐過40天，最後__
    blanks:
