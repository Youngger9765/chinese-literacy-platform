spotlight:
  lesson: G6-L11
  strategy_name: 摘要策略-問題-解決-結果找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: 這是一個真實故事，過去，我們已經學會用「問題—解決—結果」整理文章重點：1.發生了什麼問題？2.誰採取了什麼行動？3.行動最後帶來什麼結果？這一課再往前一步。〈奇蹟行動〉先寫搜救人員怎麼尋找孩子，寫到孩子獲救後，才回頭說明孩子如何在雨林中活下來。文章中有兩條分散在前後文的行動線，我們要把它們整理起來，才能找出全文重點。這一課要練習：❶抓核心問題→❷找出兩條行動線→❸看每條線解決哪一部分問題→❹整合結果
  - type: guide
    text: 六閱讀聚光燈摘要策略──問題—解決—結果找重點六閱讀聚光燈摘要策略──問題—解決—結果找重點
  - type: guide
    text: 一、整理「問題—解決—結果」
  - type: passage
    source: unknown
    paragraphs:
    - 請你用過去學到的方法，整理本課的「問題—解決—結果」，並填入「解決」與「結果」所在的段落。
  - type: fill_table
  - type: guide
    text: 二、整合全文重點
  - type: single
    prompt: 根據上面的整理，哪一句最能完整概括全文重點？（單選）
    options:
    - 孩子運用求生知識撐過40天，顯示野外技能十分重要
    - 搜救人員克服雨林阻礙持續尋找，最後成功找到四個孩子
    - 孩子設法活下來，搜救人員持續尋找，兩條行動共同促成孩子獲救
    answer: 孩子設法活下來，搜救人員持續尋找，兩條行動共同促成孩子獲救
  - type: guide
    text: 三、比較段落順序與文章結構
  - type: guide
    text: 上面的表：問題在第【 2～3  】段；兩條解決行動線，「外界搜救」在第【4～6  】段，孩子自救在第【8  】段；結果在第【7  】段。
  - type: guide
    text: →你發現了嗎？
  - type: guide
    text: 文章的段落順序，不一定和「問題—解決—結果」的結構順序相同。
  - type: guide
    text: 整理重點時，要判斷各段屬於哪一部分，不能只看出現的先後。
  - type: guide
    text: ◎策略帶著走
  - type: guide
    text: 下次讀到同一個問題有不同人物採取行動時，可以問自己：
  - type: free_text
    prompt: 1.誰做了什麼？
  - type: free_text
    prompt: 2.每一組行動解決了問題的哪一部分？
  - type: free_text
    prompt: 3.這些行動如何合起來，造成最後的結果？
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出文章真正要解決的核心問題。
    - 我能整理不同人物的行動，說出各自的作用。
    - 我能判斷各段屬於問題、解決還是結果，整理出全文重點。
