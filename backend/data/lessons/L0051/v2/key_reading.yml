passage: 為了營救四個孩子，數架直升機在雨林上空盤旋，搜尋孩子們的蹤跡。搜救隊曾空投一萬份傳單，也從空中播放孩子們祖母的錄音，希望孩子們留在原地等待救援。搜救隊也把食物箱空投到叢林，有些食物箱似乎被孩子們撿到。然而，這片叢林十分廣闊，到處都是蚊蚋、毒蜘蛛和血蛭，也經常有蟒蛇、美洲豹等野獸出沒。加上雷雨
