passage: 飛機失事後，哥倫比亞軍方派出上百名特種部隊隊員，帶著10隻搜救犬進入蠻荒叢林，展開地毯式搜索；另有超過200名原住民志工主動加入搜救行列。亞馬遜熱帶雨林被喻為「地球之肺」，植被十分茂密。搜救範圍達323平方公里。雨林中的巨樹平均高40至50公尺，樹木又十分密集，陽光難以透入，因此搜救行動十分艱難。搜救團隊花了超過兩週，才找到飛機殘骸和三位大人的遺體，但仍沒有發現孩子們的蹤跡。
