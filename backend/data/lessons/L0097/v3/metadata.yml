strategy_explained: '這篇文章要帶你練習「落實環保3R」的品格力

  它為什麼適合呢？因為課文裡用跑者阿國的例子，告訴你運動賽事怎麼影響環境，也具體講了「減少使用、重複使用、回收再利用」這三個方法，如何在賽事中實踐

  讀的時候，你可以想想看，除了課文裡提到的，自己還能怎麼在學校運動會或生活中，用這三個方法幫忙環保呢'
