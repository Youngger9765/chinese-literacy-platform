intro: 這篇文章透過跑者阿國在賽事後看到的景象，引導我們思考運動賽事對環境造成的影響。文章說明了為何「綠色賽事」的概念應運而生，並解釋了「綠色賽事」的意義，即將環保永續的理念融入體育活動中。接著，文章介紹了落實「綠色賽事」的三個重要原則：減少使用（Reduce）、重複使用（Reuse）和回收再利用（Recycle），並舉出許多實際的例子來說明這些原則如何在運動賽事中實踐。最後，文章鼓勵大家將綠色賽事的想法帶入生活中，從學校的運動會開始，共同為環境盡一份心力。
