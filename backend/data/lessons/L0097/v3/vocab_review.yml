    target_words: 灰框 12 個詞，比本課語詞（13 個）少「因應而生」—— 它沒進找字遊戲，不是抽漏。
    answer_paths: '12 個目標語詞全部圈到，逐格取字皆能拼回，格子沒有印錯字。

      幾何交叉驗證（單向警報）：以找字表格元素當邊界，表格內 roundRect = **12 個**，

