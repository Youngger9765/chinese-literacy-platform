  paragraphs:
  - idx: 1
    text: 阿國終於完成了自己有史以來第一場路跑賽。抵達終點時，他滿心興奮，環顧四周，卻看見這一幕：路邊每隔幾步就有被丟棄的塑膠水杯，地面上到處是五顏六色的能量膠包裝；起跑時天氣濕冷，有些跑者穿上輕便雨衣禦寒，雨停後卻隨手把雨衣扔在分隔島。雨衣被風吹起，就像跑道上的黃色小怪物到處亂竄。這一幕出現在強調「為愛而跑」的比賽中，顯得格外諷刺。
    footnote_ref: 1
  - idx: 2
    text: 「運動是好事，但造成環境汙染就讓好事大大扣分了！」阿國心想：「有沒有可能舉辦沒有汙染的運動賽事呢？」
  - idx: 3
    text: 事實上，已經有越來越多人重視運動賽事的環境永續問題。一場運動賽事，從賽前的宣傳旗幟、賽事手冊，到比賽中的運動衣、紀念品，再到賽後的獎盃、證書等，都會消耗資源和能源。賽事規模越大，對環境造成的負擔通常也越大。例如交通運輸會增加碳排放，人潮聚集也會產生許多廢棄物。這些問題都讓人憂心忡忡，「綠色賽事」的理念於是因應而生。
  - idx: 4
    text: 在這裡，「綠色」是環保的象徵，代表對自然環境的尊重和保護。把永續的理念融入體育賽事，是為了減少自然資源的消耗與碳排放，降低賽事對環境的負擔，也為減緩氣候變遷盡一份力。同時，綠色賽事也能提升參賽者和社會大眾的環境意識。
  - idx: 5
    text: '打造「綠色賽事」，可以從落實「環保3R」做起：

      1.Reduce（減少使用）：減少不必要的物品與資源使用，降低垃圾與碳足跡。

      2.Reuse（重複使用）：讓器材、裝備或容器多次使用。

      3.Recycle（回收再利用）：將使用過的材料回收處理，再製成新的材料或產品。'
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 6
    text: 舉例來說，許多賽事採用網路報名，不再印製賽事手冊，連完賽證書都能線上下載，減少紙張的使用；比賽紀念衫也改為自由選購，參賽者有需要再買，避免無謂浪費，這就是Reduce（減少使用）。再者，布置改用可保存、下次比賽還可以再用的器材或物品；比賽過程提供可重複使用的環保杯，讓參賽者「一杯用到底、杯杯不落地」，就是Reuse（重複使用）的實踐。此外，回收材料也開始在各種運動賽事中大放異彩。臺北馬拉松選用花蓮再生石材，新竹城市馬拉松以回收玻璃製作獎盃；世界盃足球賽中，也有許多國家球隊穿著以回收寶特瓶製成的環保球衣。這些都是Recycle（回收再利用）的展現。
  - idx: 7
    text: 作為熱愛運動的地球公民，阿國意識到：「運動賽事不僅是一項帶來健康和快樂的活動，也應該是推動環境教育的好機會。」他決定把綠色賽事的想法分享給同學，邀請大家一起向學校師長提案──從學校每年舉辦的運動會做起，落實環保3R。他呼籲全校師生：不要把快樂帶走，卻把悲傷留給地球！
  footnotes:
