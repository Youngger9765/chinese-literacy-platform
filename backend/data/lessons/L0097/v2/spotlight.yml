spotlight:
  lesson: G7-L28
  strategy_name: 圖文整合閱讀策略（初階）
  strategy_type: image_text
  blocks:
  - type: guide
    text: 一、從生活中辨認3R
  - type: guide
    text: 下面三種做法，主要運用哪一個R？(請填入A、B或C)
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 二、用3R解決問題：
  - type: guide
    text: （一）幫阿國完成「綠色運動會」提案
  - type: guide
    text: 阿國和同學觀察以前的運動會，發現三個可以改善的地方。
  - type: guide
    text: "問題A：每人都會拿到一件紀念衫，但有些人不需要，拿回家後也很少穿。   問題B：每年都重新製作班級指示牌，活動結束後就丟掉。        \
      \      \n問題C：活動後留下許多寶特瓶，有些被丟進一般垃圾。"
  - type: multi
    prompt: 1.請從下面圓框中選出最適合的改善方法，完成提案。
    options:
    - 調查需求，有需要的人再訂購紀念衫。
    - 指示牌活動後收回保存，下次繼續使用。
    - 設置清楚的瓶罐回收區，將寶特瓶分類回收。
    - 在體育館屋頂裝設太陽能板，利用太陽能發電。
    answer:
    - 調查需求，有需要的人再訂購紀念衫。
    - 指示牌活動後收回保存，下次繼續使用。
    - 設置清楚的瓶罐回收區，將寶特瓶分類回收。
    - 在體育館屋頂裝設太陽能板，利用太陽能發電。
  - type: fill_table
  - type: single
    prompt: 2.想一想，圓框中最後一項「改善方法④」也是環保做法，為什麼沒有被放進這份3R提案裡？
    options:
    - 太陽能對環境沒有幫助。
    - 太陽能有環保作用，但不屬於Reduce、Reuse或Recycle。
    - 只有運動用品才能使用3R的方法。
    answer: 太陽能有環保作用，但不屬於Reduce、Reuse或Recycle。
  - type: guide
    text: （二）這份提案真的能改善問題嗎？
  - type: guide
    text: 阿國把提案寫好後，又逐項檢查這些做法是否真的能改善原來的問題：
  - type: guide
    text: "A.紀念衫改為有需要的人再訂購 → 減少不必要的製作  \n B.指示牌收回，下次再用 → 減少重複製作與丟棄      \n C.寶特瓶分類回收\
      \ → 讓材料可以回收再利用"
  - type: single
    prompt: 從這三個例子可以看出，運用3R改善問題時，應該先怎麼做？
    options:
    - 每一場活動都一定要同時做到三個R。
    - 活動結束後把所有垃圾分類好就可以。
    - 先找出活動中的問題，再用適合的3R方法改善。
    answer: 先找出活動中的問題，再用適合的3R方法改善。
  - type: guide
    text: 三、換我做做看
  - type: guide
    text: 下次班級或學校辦活動時，請至少選一項你願意先做到的事：
  - type: multi
    prompt: 請選擇
    options:
    - 不拿自己不需要的用品。
    - 把可以再用的物品留下來，下次繼續使用。
    - 把可回收的物品放進正確的回收區。
    answer:
    - 不拿自己不需要的用品。
    - 把可以再用的物品留下來，下次繼續使用。
    - 把可回收的物品放進正確的回收區。
  - type: guide
    text: 如果你有做到，請在□打勾。
