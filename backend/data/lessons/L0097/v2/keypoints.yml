  - label: 保護環境怎麼做？
    value: "1.Reduce__：減少不必要的物品與資源使用。例如，不再印製賽事手冊。\n2.Reuse__：讓器材、裝備或容器多次使用。例如：布置改用__下次可再使用；提供可重複使用的__。\
      \  \n3.Recycle__：將使用過的材料回收處理，再製成新的材料或產品。例如：用回收玻璃製作__；用回收寶特瓶製作__。"
