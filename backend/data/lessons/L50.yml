vocabulary:
- word: 舉證
  definition: 提出證據。
- word: 有所忌憚
  definition: 指因顧忌、害怕，而不敢有進一步的行動。相反詞是肆無忌憚。
- word: 標識
  definition: 與標示、標誌同義，用來表明某種特徵的記號或符號。
- word: 鏈結
  definition: link，指超連結的網址。
- word: 自主權
  definition: 為自己做決定的權利。
- word: 凝視
  definition: 專注地盯著看。
- word: 茶餘飯後
  definition: 喝完茶吃飽飯後，此指人們閒來無事的時候。
- word: 冒犯
  definition: 得罪人，使人有不舒服的感覺。
- word: 陰霾
  definition: 陰霾原形容天氣陰暗，課文所提到：「走出陰霾」指從過去的傷害走出來。
- word: 一片譁然
  definition: 發生一件事情，令大家很驚訝，引起討論。一般用於形容消息（多指不好的消息）傳開，引起轟動。
