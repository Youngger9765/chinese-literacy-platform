title: '#MeToo運動與我們的權利'
genre: 說明文
text_type: 單
reading_strategy: 性別平等教育－判斷性騷擾情況、保護自己遠離性騷擾的方法、辨識加害人的脫罪句
knowledge_video_url: https://www.youtube.com/watch?v=dvCL4iBIFjc
story_text: '近年「#MeToo」一詞受到社會大眾的關注和討論，究竟「#MeToo」是什麼？和我們又有什麼關係呢？

  #MeToo運動起源

  2006年，有位少女向社會運動人士伯克（T. Burke）傾訴她遭到性侵犯，伯克當時不知如何回應才好。後來伯克想到在網路平台使用「Me Too」（我也是）一詞，透過同理心的話語，讓受害女性知道她們並不孤單，幫助受害者早日走出陰霾。

  2017年，媒體披露好萊塢製片人溫斯坦（H. Weinstein）長期性侵演員，引發社會一片譁然。當時女演員米蘭諾（A. Milano）在推特（Twitter）上便使用「#MeToo」，分享自己的受害經驗，之後又有許多演員跳出來揭發哈維私下的面目。這個事件引發廣大迴響，#MeToo很快在網路社群傳播開來，成為全球性的運動，不但把受害者團結起來，同時呼籲大眾不要對性騷擾和性侵犯保持沉默。

  臺灣的#MeToo運動

  #MeToo運動也在2018年傳到臺灣。2023年一連串的性騷擾事件被揭露，當年上映的影集《人選之人─造浪者》中，一句「我們不要就這樣算了，好不好？」的台詞更引爆了話題，許多受害人開始在社群媒體舉發他們受到的性騷擾或性侵犯，讓人意想不到的是，原本最受信賴的師長、親友也可能是加害人，政界、文化界、演藝圈都有受害者，讓各界震驚不已。這個運動不僅關注女性，強調男性也可能受害。

  不是你的錯，安心說出來

  「勇敢站出來」並不是一件容易的事。

  許多性犯罪常常發生在隱密的空間，這讓受害者難以舉證；有些受害者也擔心一旦說出來，自己會成為大眾茶餘飯後的八卦話題，甚至被指責「為什麼不早點說」、「為什麼不反抗」、「你自己也有問題吧」……，這些都會造成受害者的二度傷害。

  再者，不少加害者和被害者處於「權力不對等」的關係，例如導演與演員、上司與部屬、明星與粉絲、老師與學生、長輩與晚輩等。站在權力高處的人可能展現出愛護、關心對方的舉動，讓人一開始不以為意；而權力低的受害者可能擔心說出來會被報復，或是不被相信。

  #MeToo運動讓飽受身心創傷的受害者有了支持的後盾，更重要的是，開始扭轉社會對性侵犯受害者的偏見，讓受害者知道「這不是你的錯」，進一步打造「安心說出來」的友善社會，讓受害者有機會獲得療癒，也讓有性犯罪意圖者有所忌憚。

  身體自主權，從尊重界線開始

  另一方面，#MeToo運動喚起社會大眾對「身體自主權」的重視，意思是「我的身體是我自己的」。每個人都有權利決定自己身體願意讓別人碰觸、凝視的限度，並且有權利保護自己在這限度內不被侵犯，這個限度就是「身體界線」。

  身體界線會因為對象、情境、時間而有所不同。例如，你可以接受教練在比賽剛結束時緊緊擁抱你，但平時或獨處時，不行！你可以接受車廂上擁擠時被陌生人碰到身體，但緊貼著，不行！你可以接受穿著露腰的服裝被大家欣賞，但一直盯著你的腰部看，不行！你可以接受朋友間開玩笑，但開黃腔，不行……！這些讓你有一絲不舒服或有片刻猶豫的感覺，不要輕輕放過，你可以大聲拒絕或離開現場，不需要對誰感到抱歉。

  同樣的，我們也要學習尊重別人的身體自主權，別人沒有同意就對他做出越界的行為，這就是一種冒犯。萬一做了讓對方不舒服的舉動，要趕快停下來，好好道歉，才是負責任的表現。

  總之，#MeToo運動讓受害者打破沉默，也帶動大眾身體自主權的覺醒，提醒每個人都有責任創造一個安全和彼此尊重的環境。'
