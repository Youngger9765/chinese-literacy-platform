strategy_exercise:
  type: guided_steps
  strategy_name: 性別平等與身體自主權
  instruction: 這篇文章介紹了#MeToo運動，教我們認識身體自主權和身體界線。請跟著步驟思考
  steps:
  - prompt: 受害者常常不敢站出來舉報，根據課文，以下哪些是原因？
    type: checkbox
    options:
    - 怕自己變成大家茶餘飯後的八卦話題
    - 加害者和受害者之間有「權力不對等」的關係
    - 受害者覺得自己有錯
    - 性犯罪發生在隱密空間，難以舉證
    answer:
    - 0
    - 1
    - 3
  - prompt: 「身體界線」會因為什麼而有所不同？
    type: select
    options:
    - 只看對方的年紀
    - 對象、情境、時間
    - 只看自己的心情
    answer: 1
  - prompt: 下面哪個情境可能已經越過身體界線？
    type: select
    options:
    - 比賽結束後教練擁抱你慶祝
    - 朋友在你同意下拍拍你的肩膀
    - 有人一直盯著你的身體看，讓你覺得不舒服
    answer: 2
  - prompt: 如果有人對你做了讓你不舒服的事，你可以怎麼做？請寫出至少兩個方法
    type: free_text
