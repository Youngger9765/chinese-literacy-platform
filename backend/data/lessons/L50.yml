fill_in_blank: []
multiple_choice:
- question: 下列語詞何者使用錯誤？
  options:
  - 八卦新聞常是大家「茶餘飯後」聊天的話題。
  - 這件賄選案一󠇢經媒體披露，輿論「譁然」。
  - 他奉公守法，常幫助別人，絲毫不「忌憚」。
  - 開黃腔容易「冒犯」別人，使人不舒服。
  answer: C
  explanation: 前後邏輯錯誤
- question: 根據課文，性侵或性騷擾受害者有幾項不敢站出來舉報的理由，以下敘述何者為非？
  options:
  - 怕自己變成八卦話題的主角。
  - 權力不對等，加害者權力位階較高。
  - 難以舉證，擔心不被別人相信。
  - 受害人在經濟或情感上依賴加害者。
  answer: null
  explanation: null
- question: '#MeToo運動希望帶來一些社會改變，以下敘述何者為非? （性犯罪常發生在隱密的空間，但在外面也有可能發生。）'
  options:
  - 讓受害者知道不是他的問題，停止內疚自責。
  - 扭轉大眾偏見、停止對受害者不友善的眼光。
  - 營造「安心說出來的友善社會」，讓加害人有所忌憚。
  - 讓大眾知道性侵害只會在密閉空間內發生。
  answer: null
  explanation: null
- question: 從本課第七段所引的電視劇台詞：「我們不要就這樣算了，好不好？」，你可以做出什麼推論？
  options:
  - 他們在討論債務的問題，有人欠了當事人一筆錢。
  - 說話的人地位較高，聽話的人地位較低。
  - 被害人不敢講，但說話的人鼓勵被害人面對問題，追究到底。
  - 說話的人在告訴加害者，這樣下去可不行。
  answer: null
  explanation: null
- question: 下列何者為本文作者的寫作意圖？
  options:
  - 介紹和討論「＃MeToo」，為性別平等教育努力。
  - 教導讀者如何用「＃MeToo」在社群網站上建立運動標識。
  - 教導讀者遇到壞事，如何以牙還牙，以眼還眼。
  - 作者比較「＃MeToo」在西方和臺灣社會的異同。
  answer: null
  explanation: null
