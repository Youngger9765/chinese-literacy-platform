multiple_choice:
- question: 關於本文，下列敘述何者正確？
  options:
  - 醫者治好裨將的傷，但裨將不滿意，醫者只好跪地求饒
  - 醫者剪去箭桿，治好裨將的傷，裨將因此跪地感謝他
  - 雖然醫者醫術高明，但為人廉潔，只收取合理的酬勞
  - 醫者認為自己剪去箭桿後，手術已完成，所以要求酬勞
  answer: D
  explanation: 根據課文「醫曰：『此內科事，不意並責我！』乃持并州剪，剪去矢管，跪而請謝。」，醫生將箭桿剪掉後，便認為自己的工作已完成，並跪下要求酬勞，暗示他認為處理箭頭深入體內屬於內科事務，非其外科職責。
- question: 關於上文的描述，下列何者正確？
  options:
  - 王夷甫嫉妒妻子比他有錢
  - 王夷甫口是心非，實際上很愛錢
  - 王夷甫用錢遶床是為了討好妻子
  - 王夷甫把「錢」叫做「阿堵物」
  answer: D
  explanation: 文中提到王夷甫「口未嘗言『錢』字」，當他看到錢阻礙行走時，便稱之為「阿堵物」，明確顯示他用「阿堵物」來指代「錢」。
- question: 下列選項「」中字，何者字音、字義完全正確？
  options:
  - 「嘗」於市遇一佳硯——ㄔㄤˊ，曾經
  - 既「還」邸，使門人往——ㄏㄞˊ，還是
  - 吾嫌其微「凸」——ㄊㄨ，突出
  - 公大「惋」惜——ㄨㄢˇ，可惜。
  answer: A
  explanation: "讓我們逐一分析每個選項：\n*   **A. 「嘗」於市遇一佳硯——ㄔㄤˊ，曾經**\n    *   字音：在「嘗於市遇一佳硯」（曾經在市集上遇到一塊好硯臺）中，「嘗」讀作ㄔㄤˊ，表示「曾經」，音義皆正"
- question: 根據「陸公買硯」一文，關於陸盧峰這個人的敘述下列何者正確？
  options:
  - 玩物喪志，優柔寡斷
  - 寬厚仁愛，度量很大
  - 管理下屬，恩威並濟
  - 言出必行，做事果斷
  answer: B
  explanation: 課文中陸公最喜歡的硯臺「八哥眼」被僕人磨掉了，陸公雖然感到「十分可惜」或「大惋惜」，卻沒有責怪或處罰僕人，這顯示他對待下屬寬厚仁愛，度量很大。
- question: 「淳于恭，北海人。人有盜刈1恭禾者，恭見之，念其愧，因伏草中，至去乃起。」根據這則故事，下列敘述何者最恰當？
  options:
  - 當時五穀歉收，盜賊四處搶糧
  - 淳于恭個性溫厚寬容，能體恤他人
  - 北海地區盜賊兇悍，人民不敢與之對抗
  - 淳于恭伏於草中，乃心中有愧，不欲見人
  answer: B
  explanation: 淳于恭看見小偷割取他的稻禾，顧慮到對方會感到羞愧，便躲藏起來，等到小偷離去才起身，這顯示他溫和寬厚，能體諒他人的處境。
- question: 根據「陸公買硯」一文，下列關於故事中人物的敘述，何者最恰當？
  options:
  - 門人買錯硯臺卻不知道
  - 陸公惋惜是因為石工技藝不佳
  - 門人請人磨平硯眼是自作聰明
  - 陸公對門人購硯的價格感到驚訝
  answer: C
  explanation: 課文中僕人認為硯臺上的八哥眼「有點凸」不好看，便請石工磨平，卻不知道這正是主人陸公最喜歡的特徵。僕人的行為是出於自己的判斷，卻破壞了珍貴之處，因此是「自作聰明」。
- question: 下列何者不可能是「陸公買硯」一文的寓意？
  options:
  - 不聽老人言，吃虧在眼前
  - 即使是好心也可能辦壞事
  - 知人善任才不會反受其害
  - 託人辦事，一定要先清楚溝通
  answer: A
  explanation: 「不聽老人言，吃虧在眼前」指的是不聽從長輩或有經驗者的勸告而導致損失，但文中並無陸公給予僕人明確的「老人言」或勸告，僕人也並非故意違背，而是因不識貨而自作主張，故此選項不能作為本課的寓意。
- question: 下列哪一選項的閩南語俗諺可以形容課文中的僕人？
  options:
  - 目睭花花，匏仔看做菜瓜
  - 生雞卵的無，放雞屎的一大堆
  - 痟貪軁雞籠
  - 好心予雷唚
  answer: A
  explanation: 僕人不知道「鴝鵒眼」是硯臺的珍貴之處，反而誤以為是瑕疵而磨平，這就如同眼睛模糊，把兩種不同的東西（葫蘆和絲瓜）混淆看錯一樣，形容因不識貨或粗心而導致的誤判。
