intro: 這篇文章要帶大家認識大自然中許多有趣的氣象小幫手。當我們想知道天氣會不會變，除了看天氣預報，還可以觀察身邊的動物和天空的變化。像是蜘蛛結網的大小，可能預告著晴天或雨天；蟋蟀的叫聲頻率，竟然可以幫助我們估算氣溫；家裡的貓狗在下雨前可能會出現一些特別的行為；天空中的日暈、月暈，或是星星、遠山的清晰度，也都是天氣變化的線索。透過這些自然的提示，我們可以更了解天氣的變化。
strategy_explained: '這一課我們要練習「抓到一篇文章裡，什麼是最重要的訊息，還有這些訊息分別是關於什麼的小主題」

  這篇文章介紹了好多種大自然裡預測天氣的小方法，像是蜘蛛、蟋蟀、貓狗和天空的變化，這些都是很具體的故事，很適合我們練習找出每一種方法的「重點」

  讀的時候，你可以一邊看，一邊想：「這個動物或現象是在告訴我們什麼天氣的訊息呢」，然後把它們記下來，這樣就能學得更好囉'
