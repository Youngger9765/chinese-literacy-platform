    - Ａ「坐立不安」指的是情緒焦急，A狀況不符。Ｂ「明察秋毫」形容人觀察細微。D「即將」表示事情快要發生。Ａ「坐立不安」指的是情緒焦急，A狀況不符。Ｂ「明察秋毫」形容人觀察細微。D「即將」表示事情快要發生。（
      C ）1. 下列語詞，何者使用正確？
    - A.他「坐立不安」在沙發上閱讀，十分投入
    - B.我想「明察秋毫」一下這杯飲料的味道
    - C.小樹「纖細」的枝芽，禁不起風吹雨打
    - D.我「即將」在昨天看一場精采的電影
