comprehension:
  questions:
  - index: 2
    answer: B
    stem: 根據文章，下列哪一項動物行為可能預示「快要下雨」？
    options:
      A: 蜘蛛結大網
      C: 蟋蟀叫聲速度變慢
      D: 鳥類在空中不停盤旋
      B: 文中第二至七段提到，狗坐立不安是快下雨的徵兆。D未提及也不正確
    rationale: 文中第二至七段提到，狗坐立不安是快下雨的徵兆。D未提及也不正確
    is_rationale: true
  - index: 3
    answer: B
    stem: 文章中提到：「你皺起眉頭，拿起掃把想把牠揮掉。且慢！」這段話中的「且慢」最可能代表什麼意思？
    options:
      B: 提醒主角先停下來、仔細觀察
      C: 作者想用宏亮的聲音嚇退蜘蛛
      D: 作者流露出對蜘蛛的強烈憤怒
    rationale: B「且慢」是說話者介入，引導讀者改變立場、暫停原先動作，轉而觀察蜘蛛。
  - index: 4
    answer: D
    stem: 依據本文，當家裡的狗狗坐立難安、貓咪亂躲藏時，你外出時可能需要準備什麼？
    options:
      A: 手電筒
      B: 毛帽
      C: 太陽眼鏡
      D: 雨具
    rationale: null
  - index: 5
    answer: A
    stem: 本文透過蜘蛛、蟋蟀、狗、貓行為與天空現象等例子進行說明。作者最想傳達的核心觀念是下列何者？
    options:
      A: 多觀察自然中的蛛絲馬跡，就能提前掌握天氣變化
      C: 動物與天氣無關，真正可靠的是氣象署資料
      D: 古代諺語早已精準掌握天氣預測法
    rationale: 全文從蜘蛛、蟋蟀、毛小孩到天空與星星，引導讀者學會留心身邊自然徵兆。
