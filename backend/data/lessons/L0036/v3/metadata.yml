intro: 這篇文章要帶大家認識臺灣棒球史上一個重要的隊伍──能高團。故事發生在日治時期，這支來自花蓮、由阿美族少年組成的球隊，是如何在沒有正規訓練和裝備的情況下，憑藉著過人的體能和默契，一步步走向日本的甲子園球場？文章會介紹能高團的成立背景、他們在日本比賽時的精彩表現，以及這群年輕球員如何為臺灣棒球寫下歷史新頁，並對後世產生深遠的影響。
