strategy_explained: '這一課我們要練習的是，從文章裡的故事細節，找到它藏起來的「重要概念」

  因為能高團的故事，從他們的出身、訓練到比賽，都有好多特別的描述，正好可以練習把這些具體的事情，變成一個讓大家都能懂的大道理

  讀的時候，你可以試著想想，這些阿美族少年為什麼這麼厲害，他們有哪些特質，是跟其他球隊不一樣的呢'
