section_no: 五
spotlight:
  strategy_name: 從具體描述提取上位概念
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '上一課，我們學會：看到文章裡的具體描述時，可以先想一想：「這些內容主要在說哪一方面？」再找出一個簡短的名稱，例如「外型、目的」。這個名稱就是「上位概念」。

      上位概念可以用來整理不同範圍的內容：

      一、找出句中細節的上位概念

      一句話裡的細節，也可以找出上位概念。

      例如：「日治時代的1921年，林桂興組了一支球隊。」

      其中，「1921年」主要在說球隊何時成立，上位概念是【成立時間】；「林桂興」主要在說由誰創辦球隊，上位概念是【創辦人】。

      二、找出整段內容的上位概念

      把一段文字合起來看，也可以想一想：「這一段主要在說什麼？」再用一個簡短名稱整理。這個名稱，就是整段內容的上位概念。

      例如，本文第3段，這段主要講的是「能高團第一次出賽的戰績」，這就是第3段的上位概念。

      這一課，我們練習第一個層次：從一句話裡的具體細節找出上位概念。

      例如：「他（林桂興）招募了一群阿美族少年，成立了高砂棒球隊。」'
  - type: single
    label: 概念說明框內的示範題
    prompt: 文章中的「林桂興」就是球隊的
    options:
      1: 隊員
      2: 對手
      3: 創辦人
    answer: 3
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    layout_note: 本題與前後兩個 block 印在同一個外框內，不是獨立的一題
  - type: guide
    text: 「創辦人」就是我們從具體描述中提取的上位概念。
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 以「高砂棒球隊／能高團」為中心，提取相關上位概念。
  - type: fill_table
    label: 一、找出上位概念
    instruction: 一、找出上位概念：請判斷文章中粗楷體文字的上位概念，並從右欄中選出正確答案，填在【    】裡
    columns:
    - 文章內容
    - 粗楷體字的上位概念
    - 選項
    answer_carrier: 紅色手寫數字（圖形），文字流的【　】內已填有答案
    rows:
    - index: 1
      文章內容: 時間回到日治時代的1921年（Ａ），花蓮港的廳長江口良三郎，為了讓更多人認識花蓮港（Ｂ），找了當時從事棒球運動的臺灣人林桂興（Ｃ）組一支球隊。
      bold_spans:
      - 1921年
      - 為了讓更多人認識花蓮港
      - 林桂興
      選項:
        1: 球隊經費
        2: 創辦人
        3: 成立目的
        4: 成立時間
      answers:
        A: 4
        B: 3
        C: 2
    - index: 2
      文章內容: 某天，林桂興走在秀姑巒溪畔，看到在河畔旁嬉戲的原住民少年，腦中浮現了一個大膽的想法──如果這些孩子組成一支球隊，會有怎樣的可能？於是，他招募了一群阿美族少年（Ａ），成立了「高砂棒球隊」（Ｂ）。
      bold_spans:
      - 阿美族少年
      - 「高砂棒球隊」
      選項:
        1: 成員組成
        2: 球隊名稱
        3: 成員人數
      answers:
        A: 1
        B: 2
      note: 答案 B 在原稿印成全形「２」，同列的 A 是半形「1」
  - type: sub_block
    label: 二、練習提取上位概念
    instruction: 二、練習提取上位概念：請閱讀以下段落，根據內容，填寫對應的上位概念。
    quote: 1925年，能高團赴日比賽，首戰面對豐島師範棒球隊，前四局以28比0大幅領先，獲「若武者」稱號。
    sub_instruction: ◎從這段文章可以看出：
    answer_carrier: 紅色手寫字（圖形），文字流的【　】內已填有答案
    items:
    - type: free_text
      index: 1
      prompt: 「1925」是比賽的【　】
      blanks:
      - answer: 時間
    - type: free_text
      index: 2
      prompt: 「日本」是比賽的【　】
      blanks:
      - answer: 地點
    - type: free_text
      index: 3
      prompt: 「豐島師範棒球隊」是比賽的【　】
      blanks:
      - answer: 對手
    - type: free_text
      index: 4
      prompt: 「28比0」是比賽的【　】
      blanks:
      - answer: 比數／結果
    - type: free_text
      index: 5
      prompt: 「若武者」是比賽後他們得到的【　】
      blanks:
      - answer: 稱號
  - type: sub_block
    label: 三、延伸練習
    instruction: 三、延伸練習：請閱讀以下段落，根據內容，提取上位概念。
    quote: 2021年，臺灣羽球選手李洋與王齊麟在東京奧運男子雙打決賽中，以直落二擊敗中國隊，奪下臺灣史上首面奧運羽球金牌。比賽結束後，兩人被媒體譽為「麟
      洋配」，成為全國矚目的焦點。這場比賽不僅創造歷史，也帶動臺灣羽球熱潮。
    sub_instruction: ◎請閱讀這段文字後，填寫下表1, 2, 3的細節與上位概念，第4個空格，請你自己找一個細節，並寫出它的上位概念（可參考前面兩大題的作法）：
    columns:
    - （　　細節　　）
    - 【上位概念】
    answer_carrier: 橘色手寫字＝教師版答案；黑字＝題目本來就印好的。兩欄逐列交替，每列只有一邊要學生填
    items:
    - type: free_text
      label: 例
      細節: 東京
      上位概念: 比賽【地點】
      note: 例題兩欄都是黑字（示範用，不是學生要填的）
    - type: free_text
      index: 1
      細節: 【　】
      細節_blanks:
      - answer: 2021年
      上位概念: 比賽【時間】
      note: 細節欄是橘字（教師答案），上位概念欄是黑字（題目給的）
    - type: free_text
      index: 2
      細節: 中國隊
      上位概念: 比賽【　】
      上位概念_blanks:
      - answer: 對手
      note: 這一列反過來 —— 細節欄是黑字，上位概念欄才是橘字
    - type: free_text
      index: 3
      細節: 【　】
      細節_blanks:
      - answer: 奧運金牌
      上位概念: 比賽【結果】
    - type: guide
      text: 再來，你自己試試看，從段落裡找一個細節，寫出它的上位概念
    - type: free_text
      index: 4
      細節: （　）
      上位概念: 【　】
      no_correct_answer: true
      answer_carrier: 兩欄都空白 —— 教師版未填，題目本身也要求學生自選細節，故無標準答案
  - type: self_check
    label: ◎自我檢核
    items:
    - 我能用簡短名稱寫出細節的上位概念。
