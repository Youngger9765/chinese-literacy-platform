      阿拉伯數字算成 1 個字**。第 3 段實際 230 字，內含 1925（4→1，少 3）與 28（2→1，少 1），

      Word 因此算 226 —— 正是印出來的第 8 個數字。第 4 段沒有數字，150 字照算，

      226＋150＝376 = 印出來的最後一個數字。兩端都精準吻合，據此確定範圍是第 3~4 段。'
