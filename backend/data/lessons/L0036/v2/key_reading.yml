passage: 1925年，這群來自花蓮的年輕阿美族球員，懷抱著緊張又興奮的心情前往日本。首戰面對豐島師範棒球隊，他們一開場就像脫韁野馬般猛攻，前四局就以28比0大幅領先，讓裁判不得不提早結束比賽。第二場比賽，能高團對上東京的強隊，最後打成平手，讓日本觀眾非常驚訝。能高的隊員在場上用阿美族語打暗號，不僅讓對手摸不著󠇣頭緒，連裁判都聽不懂，而他們揮棒的力道和傳球的速度，更讓日本觀眾忍不住瞪大了眼睛。賽後，他們獲得「若武者」的稱號，也就是「年輕的武士」，彷彿從山林裡走出的戰士。
