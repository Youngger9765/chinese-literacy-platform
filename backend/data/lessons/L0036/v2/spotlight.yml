spotlight:
  lesson: G5-L24
  strategy_name: 提取上位概念-從具體描述提取上位概念
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: ◎小試身手
  - type: guide
    text: 以「高砂棒球隊／能高團」為中心，提取相關上位概念。
  - type: guide
    text: 一、找出上位概念：請判斷文章中粗楷體文字的上位概念，並從右欄中選出正確答案，填在【    】裡
  - type: table
    rows:
    - - 文章內容
      - '粗楷體字的

        上位概念'
      - ''
    - - 時間回到日治時代的1921年（Ａ），花蓮港的廳長江口良三郎，為了讓更多人認識花蓮港（Ｂ），找了當時從事棒球運動的臺灣人林桂興（Ｃ）組一支球隊。
      - 'A.【】

        B.【】

        C.【】'
      - '1.球隊經費

        2.創辦人

        3.成立目的

        4.成立時間'
    - - 某天，林桂興走在秀姑巒溪畔，看到在河畔旁嬉戲的原住民少年，腦中浮現了一個大膽的想法──如果這些孩子組成一支球隊，會有怎樣的可能？於是，他招募了一群阿美族少年（Ａ），成立了「高砂棒球隊」（Ｂ）。
      - 'A.【】

        B.【】'
      - '成員組成

        球隊名稱

        成員人數'
    answers:
    - '4'
    - '3'
    - '2'
    - '1'
    - ２
  - type: guide
    text: 二、練習提取上位概念：請閱讀以下段落，根據內容，填寫對應的上位概念。
  - type: guide
    text: 1925年，能高團赴日比賽，首戰面對豐島師範棒球隊，前四局以28比0大幅領先，獲「若武者」稱號。
  - type: guide
    text: ◎從這段文章可以看出：
  - type: multi
    prompt: 請選擇
    options:
    - 「1925」是比賽的【　　時間 　　 】
    - 「日本」是比賽的【　　地點 　　】
    - 「豐島師範棒球隊」是比賽的【　　對手　　】
    - 「28比0」是比賽的【　　比數／結果　　　】
    - 「若武者」是比賽後他們得到的【　　稱號  　】
    answer:
    - 「1925」是比賽的【　　時間 　　 】
    - 「日本」是比賽的【　　地點 　　】
    - 「豐島師範棒球隊」是比賽的【　　對手　　】
    - 「28比0」是比賽的【　　比數／結果　　　】
    - 「若武者」是比賽後他們得到的【　　稱號  　】
  - type: guide
    text: 三、延伸練習：請閱讀以下段落，根據內容，提取上位概念。
  - type: guide
    text: 2021年，臺灣羽球選手李洋與王齊麟在東京奧運男子雙打決賽中，以直落二擊敗中國隊，奪下臺灣史上首面奧運羽球金牌。比賽結束後，兩人被媒體譽為「麟
      洋配」，成為全國矚目的焦點。這場比賽不僅創造歷史，也帶動臺灣羽球熱潮。
  - type: guide
    text: ◎請閱讀這段文字後，填寫下表1, 2, 3的細節與上位概念，第4個空格，請你自己找一個細節，並寫出它的上位概念（可參考前面兩大題的作法）：
  - type: fill_table
  - type: guide
    text: 在閱讀聚光燈時，我們整理了部分的上位概念，接著我們要練習從內容那欄中整理的上位概念尋找對應的文章細節，來完成文章重點表。
  - type: table
    rows:
    - - 臺灣棒球先驅──來自花蓮的能高團
    - - 主題
      - 段落
      - 內容
    - - 背景
      - 二
      - '1.成立時間：【】時代

        2.成立目的：讓更多人認識【】

        3.隊伍組成：【】

        4.隊伍名稱：高砂棒球隊、【】

        5.命名由來：凸顯由【】組成的特色'
    - - 發展
      - 三、四
      - '1.關鍵事蹟：【】到日本參賽，和當地強隊打成【】。

        2.特色與優勢：透過族語【】、強勁的【】與傳球。

        3.後續影響：部分球員受邀加入日本球隊。'
    - - 影響
      - 四、五
      - '1.傳承與延續：【】回到花蓮擔任教練 ，培養許多優秀的棒球選手。

        2.讓日本留下深刻印象：郭源治被稱為【】。'
    - - 意義
      - 五
      - '1.歷史上：讓臺灣棒球被【】看見

        2.文化上：【】的驕傲'
    answers:
    - 日治
    - 花蓮
    - 阿美族
    - 能高團
    - 原住民
    - '1925'
    - 平手
    - 打暗號
    - 揮棒
    - 伊藤正雄
    - 高砂／能高的 後代
    - 國際
    - 原住民族
