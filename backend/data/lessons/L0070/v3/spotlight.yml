    - (一)東非草原上，鐮莢金合歡樹提供原生舉尾蟻花蜜與住所，而舉尾蟻會保護金合歡免受食草性動物侵害，並攻擊啃食金合歡的非洲象。21世紀初，外來的熱帶大頭家蟻突然出現在肯亞，牠們會殺死舉尾蟻並吃掉其幼體，讓非洲象得以肆無忌憚地啃食金合歡。
