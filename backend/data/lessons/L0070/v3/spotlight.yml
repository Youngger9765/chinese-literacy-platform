    text: '挑戰題2：用策略試試會考題。

      （109會考國文科第40題）'
    text_note: '本題的出處併在標題行（版面上靠右印在同一行），沒有像挑戰題1、3 那樣另起一行寫「歷屆試題-N」。

      ⚠️ 這兩段字在原稿雖是同一個 `w:p`，中間卻夾著（一）那個文字方塊的 runs，

      所以在文字流裡並不相連 —— 寫成一個連續字串會過不了逐字門（實測 FAIL 過一次）。'
  - type: passage
    paragraphs:
    - (一)所謂的「歷史」，是「過去人類的所有活動」；而所謂的「歷史學」， 是「從史料（包括文獻、考古）所能復原過去人類的所有活動」。從各種史料中，不斷進行研究和比較，逐步接近真實，這就是歷史學的本色，也是歷史學家所從事的工作。因為這世上從來無法得到「真實的歷史」，我們所能得到的只有「歷史的真實」。
    note: 學習單只印頭段（一）；全文三段以圖片形式附在右側，見 source_images。
