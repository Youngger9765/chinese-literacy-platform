  blocks:
  - type: concept_box
    text: '◎策略說明：

      本課介紹了文章中的「關鍵少數」：

      1.文章或段落的開頭、結尾

      2.結論詞及後面的文句

      這些位置常藏有重要線索。當「選項剩下二選一」，或「作答時間不夠」時，可以幫助我們快速掌握文章或段落的重點。'
  - type: guide
    text: 策略：❶讀題幹與選項　❷比選項　❸看頭尾　❹找結論詞　❺綜合判斷
  - type: guide
    text: ◎小試身手：讓我們先來讀讀以下的文章，並依照狀況與策略找出答案。
  - type: guide
    text: 狀況一：選項剩下二選一
  - type: passage
    paragraphs:
    - 手機通知看似只占幾秒鐘，卻可能用不同方式打斷我們的學習。當訊息聲響起時，有些人會立刻拿起手機，原本正在思考的內容便被中斷。即使忍住不看，也可能一直猜想「是不是有人找我」，注意力因而分散。看完訊息後，還可能順手點進影片或社群網站，過了很久才發現自己忘了回到功課。長期下來，作業時間不但變長，也更容易漏掉重要細節。由此可見，通知的影響不只是花掉幾秒鐘，更可能打斷思考、分散注意力，甚至改變原本的學習安排。因此，讀書時暫時關閉通知，是保護專注力的一種方法。
  - type: guide
    text: ❶讀題幹與選項
  - type: single
    prompt: 根據本文，作者最可能贊成下列哪一種做法？
    options:
      A: 讀書時先關閉手機通知，減少注意力被打斷
      B: 查看通知後立即回到功課，就不會影響學習
    answer: A
    answer_note: 這一題的答案不是以 ☑ 標在選項旁，而是印在 ❺「因此與選項【 A 】相符」。
  - type: guide
    text: ❷比選項
  - type: free_text
    prompt: '選項A：讀書先【　】手機通知

      選項B：先看通知後立即回到功課

      關鍵差異是：「做法」不同。'
    blanks:
    - answer: 關閉
  - type: guide
    text: ❸看頭尾：本文只有一段，因此閱讀段落的頭尾句。
  - type: single
    prompt: 1.開頭句重點：（　）會打斷學習。
    options:
      1: 影片
      2: 手機通知
    answer: 2
  - type: single
    prompt: 2.結尾句重點：因此，讀書時應該暫時（　）手機通知。
    options:
      1: 關閉
      2: 查看
    answer: 1
  - type: guide
    text: ❹找結論詞
  - type: free_text
    prompt: '結尾有兩個結論詞：

      1.【　】後面統整手機通知帶來的影響。

      2.【　】後面提出讀書時暫時關閉通知的建議。'
    blanks:
    - answer: 由此可見
    - answer: 因此
  - type: single
    prompt: 題目問的是作者贊成哪種「做法」，所以最需要注意的是哪一個結論詞後面的文句？
    options:
      1: 由此可見
      2: 因此。
    answer: 2
  - type: guide
    text: ❺綜合判斷：
  - type: free_text
    prompt: 開頭句指出，手機通知會打斷學習；結尾句又建議讀書時暫時關閉通知，因此與選項【　】相符。
    blanks:
    - answer: A
  - type: guide
    text: →你有沒有發現，回答這個問題，掌握結尾，就可能選對答案了！
  - type: guide
    text: 狀況二：時間不足時
  - type: passage
    paragraphs:
    - 爺爺以前最喜歡坐在陽臺的藤椅上。每天放學回家，我總會看見他戴著老花眼鏡讀報紙，旁邊還放著一杯熱茶。爺爺住院後，那張藤椅便空了下來。起初，我沒有特別在意，照樣回房間寫功課、玩手機。直到有一天，我考了一百分，興沖沖跑到陽臺，正想把考卷拿給爺爺看，才突然停下腳步。風吹動椅背上的舊毛巾，像是有人剛剛離開。我把考卷放在藤椅上，小聲說：「爺爺，我這次考得不錯喔。」原來，有些思念平常安安靜靜，直到你習慣找的那個人不在了，才會忽然湧上心頭。
  - type: guide
    text: ❶讀題幹與選項
  - type: single
    prompt: 1.下列何者最能表達本文主要呈現的情感？
    options:
      A: 因為考了一百分，而感到十分得意
      B: 看見空著的藤椅，才察覺自己思念爺爺
      C: 覺得爺爺住院後，家裡變得更加安靜
      D: 後悔爺爺住院前，沒有常到陽臺陪伴爺爺
    answer: B
    answer_note: 答案印在 ❺「2.結尾句點出作者對爺爺的思念，與選項【 B 】相符。」
  - type: free_text
    prompt: 2.根據題幹，題目要找的是作者【　】
    blanks:
    - answer: 情感
  - type: free_text
    prompt: '❷比選項：請圈出各選項表達情感的關鍵詞

      （A）因為考了一百分，而感到十分得意

      （B）看見空著的藤椅，才察覺自己思念爺爺

      （C）覺得爺爺住院後，家裡變得更加安靜

      （D）後悔爺爺住院前，沒有常到陽臺陪伴爺爺'
    circled_keywords:
      A: 得意
      B: 思念
      D: 後悔
    answer_carrier: 橘色字元框線 `<w:bdr w:color="E97132" w:sz="18"/>`，全課只有這三個
    answer_note: '(C) 沒有被框起來 —— 「更加安靜」不是情感詞，這是這一題的設計。

      型別用 free_text 是封閉清單裡最接近的容器（學生的動作是在選項上圈字，

      不是從選項中選一個），⛔ 未為它發明新型別。'
  - type: guide
    text: ❸讀頭尾句：本文只有一段，因此快速閱讀段落的頭尾句。
  - type: single
    prompt: 1.開頭句交代「藤椅」和誰有密切的連結？
    options:
      1: 作者
      2: 爺爺
    answer: 2
  - type: single
    prompt: 2.結尾句直接點出作者的哪一種情感？
    options:
      1: 得意
      2: 思念
      3: 後悔
    answer: 2
  - type: guide
    text: ❹找結論詞：本篇沒有特別使用結論詞。
  - type: guide
    text: ❺綜合判斷
  - type: single
    prompt: 1.哪一個位置最直接點出作者的主要情感？
    options:
      1: 開頭句
      2: 結尾句
    answer: 2
  - type: free_text
    prompt: 2.結尾句點出作者對爺爺的思念，與選項【　】相符。
    blanks:
    - answer: B
  - type: guide
    text: →你有沒有發現，回答這個問題，掌握結尾，就可能選對答案了！
  - type: guide
    text: ◎挑戰題1：用策略試試會考題
  - type: guide
    text: 屆試題-1.108會考國文科第31題：
    text_note: 原稿漏了開頭的「歷」字，見 source_errata E1；此處照原稿保留。
  - type: passage
    paragraphs:
    - 「少了《史記》，這個歷史會少掉多少故事？會少掉多少可歌可泣的人物？而那在韓信落魄時給他一碗飯吃的漂母，使我不敢小看在河邊漂洗衣服的無名女人。那和屈原對話的漁父，也使我相信捕魚人中有大智若愚的隱者。《史記》書寫了主流價值之外的另一種信仰。」根據這段文字，下列何者最符合作者對《史記》 的看法？
    - (A)呈現市井小民在歷史上的意義
    - (B)描寫史事詳盡，考證鉅細靡遺
    - (C)透過平凡人物襯托主角的不凡
    - (D)顛覆大智若愚的傳統主流價值
  - type: guide
    text: ❶讀題幹與選項
  - type: single
    prompt: 1.根據這段文字，下列何者最符合作者對《史記》 的看法？
    options:
      A: 呈現市井小民在歷史上的意義
      B: 描寫史事詳盡，考證鉅細靡遺
      C: 透過平凡人物襯托主角的不凡
      D: 顛覆大智若愚的傳統主流價值
    answer: A
    answer_note: 答案印在 ❺「4.綜合線索，答案為：【 A 】」。
  - type: free_text
    prompt: 2.根據題幹，題目要找的是作者對【　】的看法
    blanks:
    - answer: 史記
  - type: guide
    text: '❷比選項：

      🄐呈現市井小民在歷史上的意義→《史記》寫平凡百姓，讓小人物被看見

      🄑描寫史事詳盡，考證鉅細靡遺→《史記》記載非常詳盡，經過完整考證

      🄒透過平凡人物襯托主角的不凡→《史記》的平凡人物只是用來襯托主角

      🄓顛覆大智若愚的傳統主流價值→《史記》故意推翻傳統價值'
    text_note: 這一節四行全是預先印好的白話對照（不是留白給學生寫），所以用 guide 不用 free_text。
  - type: guide
    text: ❸讀頭尾句：本文只有一段，因此快速閱讀段落的頭尾句。
  - type: single
    prompt: 1.開頭句點出史記有什麼特色？
    options:
      1: 留下了許多故事與人物事蹟
      2: 讀了會讓人悲傷不已
    answer: 1
  - type: single
    prompt: 2.結尾句點出史記有什麼特色？
    options:
      1: 只記錄名人和大官的故事
      2: 不只記錄名人大官的故事
    answer: 2
  - type: guide
    text: ❹找結論詞：本篇沒有特別使用結論詞。
  - type: guide
    text: ❺綜合判斷
  - type: free_text
    prompt: '1.開頭句強調《史記》留下許多歷史故事，結尾句則強調《史記》呈現了非主流的價值。

      2.選項【　】和【　】都強調《史記》留下的記錄，但文中沒有提及是否詳盡、完整，因此【　】可刪除。

      3.且選項【　】的「市井小民」就是用來呈現主流價值之外的例子。

      4.綜合線索，答案為：【　】'
    blanks:
    - answer: A
    - answer: B
    - answer: B
    - answer: A
    - answer: A
