    prompt: 1.本文的觀點與下列何者最接近？
    options:
      A: 「歷史」的研究是為了追求「歷史的真實」→強調歷史的真實
      B: 「歷史學」不斷進步可得到「真實的歷史」→強調真實的歷史
      C: 史書記載絕對可信，不容後人缺乏實據的懷疑→強調史書絕對可信
      D: 為了增加史書的可讀性，作者多半會虛構情節→強調史書多半虛構
    answer: A
    options_note: 選項後面的「→強調…」白話註是原稿印在選項裡的，不是我加的。
    answer_note: 答案印在 ❺「4.第一段結尾強調要追求「歷史的真實」，故正確答案為選項【 Ａ 】。」
