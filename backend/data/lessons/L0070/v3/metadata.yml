strategy_explained: '這一課我們來學怎麼在文章裡抓到最重要、最關鍵的訊息，就像在考試時遇到難題，要怎麼快速找到破題線索一樣

  因為這篇課文本身就在講，遇到難題時，文章開頭、結尾和出現「結論詞」的地方，常常藏著最重要的答案

  所以讀的時候，你可以試著特別注意這些地方，看看是不是真的能幫你更快找到重點喔'
