intro: 這篇文章探討在閱讀測驗中，當遇到難以抉擇的題目時，如何運用策略來做出更佳的判斷。文章以學生在考試中面臨兩難選擇的情境開頭，引導讀者思考解決之道。接著，介紹了經濟學上的「二八法則」，並將其概念延伸至文章結構，指出文章的重點往往集中在少數關鍵位置。文章接著說明，文章的開頭和結尾，以及出現「結論詞」的句子，是尋找重要線索的關鍵區域。最後，提醒讀者，這些方法是時間有限時的應急策略，完整的閱讀仍是理解文章的最佳途徑。
