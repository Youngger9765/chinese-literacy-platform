spotlight:
  lesson: G6-L3
  strategy_name: 解題策略-看頭尾、找結論線索
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: ◎小試身手：讓我們先來讀讀以下的文章，並依照狀況與策略找出答案。
  - type: guide
    text: 狀況一：選項剩下二選一
  - type: passage
    source: unknown
    paragraphs:
    - 手機通知看似只占幾秒鐘，卻可能用不同方式打斷我們的學習。當訊息聲響起時，有些人會立刻拿起手機，原本正在思考的內容便被中斷。即使忍住不看，也可能一直猜想「是不是有人找我」，注意力因而分散。看完訊息後，還可能順手點進影片或社群網站，過了很久才發現自己忘了回到功課。長期下來，作業時間不但變長，也更容易漏掉重要細節。由此可見，通知的影響不只是花掉幾秒鐘，更可能打斷思考、分散注意力，甚至改變原本的學習安排。因此，讀書時暫時關閉通知，是保護專注力的一種方法。
  - type: free_text
    prompt: ❶讀題幹與選項
  - type: guide
    text: 根據本文，作者最可能贊成下列哪一種做法？
  - type: guide
    text: （A）讀書時先關閉手機通知，減少注意力被打斷
  - type: guide
    text: （B）查看通知後立即回到功課，就不會影響學習
  - type: free_text
    prompt: ❷比選項
  - type: guide
    text: 選項A：讀書先【  關閉   】手機通知
  - type: guide
    text: 選項B：先看通知後立即回到功課
  - type: guide
    text: 關鍵差異是：「做法」不同。
  - type: free_text
    prompt: ❸看頭尾：本文只有一段，因此閱讀段落的頭尾句。
  - type: single
    prompt: 1.開頭句重點：（□①影片  □②手機通知）會打斷學習。
    options:
    - 影片
    - 手機通知）會打斷學習。
    answer: 影片
  - type: single
    prompt: 2.結尾句重點：因此，讀書時應該暫時（□①關閉  □②查看）手機通知。
    options:
    - 關閉
    - 查看）手機通知。
    answer: 關閉
  - type: free_text
    prompt: ❹找結論詞
  - type: guide
    text: 結尾有兩個結論詞：
  - type: free_text
    prompt: 1.【  由此可見  】後面統整手機通知帶來的影響。
  - type: free_text
    prompt: 2.【  因此  】後面提出讀書時暫時關閉通知的建議。
  - type: passage
    source: unknown
    paragraphs:
    - 題目問的是作者贊成哪種「做法」，所以最需要注意的是哪一個結論詞後面的文句？□①由此可見　　□②因此。
  - type: guide
    text: ❺綜合判斷：
  - type: passage
    source: unknown
    paragraphs:
    - 開頭句指出，手機通知會打斷學習；結尾句又建議讀書時暫時關閉通知，因此與選項【  A  】相符。
  - type: guide
    text: →你有沒有發現，回答這個問題，掌握結尾，就可能選對答案了！
  - type: guide
    text: 狀況二：時間不足時
  - type: passage
    source: unknown
    paragraphs:
    - 爺爺以前最喜歡坐在陽臺的藤椅上。每天放學回家，我總會看見他戴著老花眼鏡讀報紙，旁邊還放著一杯熱茶。爺爺住院後，那張藤椅便空了下來。起初，我沒有特別在意，照樣回房間寫功課、玩手機。直到有一天，我考了一百分，興沖沖跑到陽臺，正想把考卷拿給爺爺看，才突然停下腳步。風吹動椅背上的舊毛巾，像是有人剛剛離開。我把考卷放在藤椅上，小聲說：「爺爺，我這次考得不錯喔。」原來，有些思念平常安安靜靜，直到你習慣找的那個人不在了，才會忽然湧上心頭。
  - type: free_text
    prompt: ❶讀題幹與選項
  - type: free_text
    prompt: 1.下列何者最能表達本文主要呈現的情感？
  - type: guide
    text: （A）因為考了一百分，而感到十分得意
  - type: guide
    text: （B）看見空著的藤椅，才察覺自己思念爺爺
  - type: guide
    text: （C）覺得爺爺住院後，家裡變得更加安靜
  - type: guide
    text: （D）後悔爺爺住院前，沒有常到陽臺陪伴爺爺
  - type: free_text
    prompt: 2.根據題幹，題目要找的是作者【  情感  】
  - type: free_text
    prompt: ❷比選項：請圈出各選項表達情感的關鍵詞
  - type: guide
    text: （A）因為考了一百分，而感到十分得意
  - type: guide
    text: （B）看見空著的藤椅，才察覺自己思念爺爺
  - type: guide
    text: （C）覺得爺爺住院後，家裡變得更加安靜
  - type: guide
    text: （D）後悔爺爺住院前，沒有常到陽臺陪伴爺爺
  - type: free_text
    prompt: ❸讀頭尾句：本文只有一段，因此快速閱讀段落的頭尾句。
  - type: single
    prompt: 1.開頭句交代「藤椅」和誰有密切的連結？
    options:
    - 作者
    - 爺爺
    answer: 作者
  - type: single
    prompt: 2.結尾句直接點出作者的哪一種情感？
    options:
    - 得意
    - 思念
    - 後悔
    answer: 得意
  - type: free_text
    prompt: ❹找結論詞：本篇沒有特別使用結論詞。
  - type: guide
    text: ❺綜合判斷
  - type: single
    prompt: 1.哪一個位置最直接點出作者的主要情感？
    options:
    - 開頭句
    - 結尾句
    answer: 開頭句
  - type: free_text
    prompt: 2.結尾句點出作者對爺爺的思念，與選項【  B  】相符。
  - type: guide
    text: →你有沒有發現，回答這個問題，掌握結尾，就可能選對答案了！
  - type: guide
    text: ◎挑戰題1：用策略試試會考題
  - type: guide
    text: 屆試題-1.108會考國文科第31題：
  - type: passage
    source: unknown
    paragraphs:
    - 「少了《史記》，這個歷史會少掉多少故事？會少掉多少可歌可泣的人物？而那在韓信落魄時給他一碗飯吃的漂母，使我不敢小看在河邊漂洗衣服的無名女人。那和屈原對話的漁父，也使我相信捕魚人中有大智若愚的隱者。《史記》書寫了主流價值之外的另一種信仰。」根據這段文字，下列何者最符合作者對《史記》
      的看法？
  - type: guide
    text: (A)呈現市井小民在歷史上的意義
  - type: guide
    text: (B)描寫史事詳盡，考證鉅細靡遺
  - type: guide
    text: (C)透過平凡人物襯托主角的不凡
  - type: guide
    text: (D)顛覆大智若愚的傳統主流價值
