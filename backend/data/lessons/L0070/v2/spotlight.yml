    paragraphs:
    - 挑戰題2：用策略試試會考題。(一)所謂的「歷史」，是「過去人類的所有活動」；而所謂的「歷史學」， 是「從史料（包括文獻、考古）所能復原過去人類的所有活動」。從各種史料中，不斷進行研究和比較，逐步接近真實，這就是歷史學的本色，也是歷史學家所從事的工作。因為這世上從來無法得到「真實的歷史」，我們所能得到的只有「歷史的真實」。(一)所謂的「歷史」，是「過去人類的所有活動」；而所謂的「歷史學」，
      是「從史料（包括文獻、考古）所能復原過去人類的所有活動」。從各種史料中，不斷進行研究和比較，逐步接近真實，這就是歷史學的本色，也是歷史學家所從事的工作。因為這世上從來無法得到「真實的歷史」，我們所能得到的只有「歷史的真實」。（109會考國文科第40題）
