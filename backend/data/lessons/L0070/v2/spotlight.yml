    paragraphs:
    - (三)歷史學講究「持之有故，言之成理」，從許多《史記》的內容來看，太史公所記都有其根據。有些他根據的史料，今日還能見到，可以驗證這一點。只是太史公時代的書籍，已經有太多亡佚，因此有更多的記事，今天已經無法得知出處為何。我從不認為《史記》上的記載「絕對」可信，但若你不相信古人所記的史事，請拿出更可靠的證據。唯有如此，歷史學才能不斷進步，不致流於虛無的懷疑。(三)歷史學講究「持之有故，言之成理」，從許多《史記》的內容來看，太史公所記都有其根據。有些他根據的史料，今日還能見到，可以驗證這一點。只是太史公時代的書籍，已經有太多亡佚，因此有更多的記事，今天已經無法得知出處為何。我從不認為《史記》上的記載「絕對」可信，但若你不相信古人所記的史事，請拿出更可靠的證據。唯有如此，歷史學才能不斷進步，不致流於虛無的懷疑。□②沒有歷史的真實，只有真實的歷史
