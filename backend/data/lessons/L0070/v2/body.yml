paragraphs:
- 「又來了！二選一難題！」教室很安靜，只聽得到翻考卷和寫字的聲音，大家都埋頭努力著，阿光也是。看著眼前的閱讀題，好不容易刪掉錯誤的選項，卻還剩兩個，心裡有點著急。「上次我在兩個答案間改來改去，最後反而選錯。到底怎樣才會選對啊？」阿光的手在頭上抓了又抓。
- 教室的另一端是佑佑，眼看考試時間只剩下五分鐘，他卻還有三組閱讀測驗沒寫。「死定了，根本來不及寫完，只能瞎猜了嗎？」佑佑心裡十分著急，但越慌張反而越難專心閱讀。「啊，還是算了，不要亂猜。能寫多少算多少，搞不好還能答對。」佑佑一邊努力保持專注，一邊掙扎著。
- 如果你是阿光和佑佑，你會選擇怎麼做呢？有的人可能乾脆擲橡皮擦決定，也有的人會回頭計算哪個選項出現最少，又或者你也可能聽說「猜C答對的機率最高」？這些方法或許都有機會猜中，不過，與其只靠運氣，其實可以運用解題方法，從文章中尋找線索，讓猜測不再只靠運氣。
- 經濟學家曾提出被稱為「二八法則」的觀察，提醒我們：有時候少數關鍵因素可能帶來大部分的影響，像是：衣櫃裡二成的衣物，就足夠讓你應付八成場合的穿著；圖書館裡二成的藏書，就可以滿足八成讀者的需求。當然這裡的「二」和「八」也可能是個比喻，而不是固定比例。文章也是如此，多數的重點可能集中在少數幾個位置。但你可能會想問，那會在哪裡呢？答案是文章或段落的開頭與結尾。
- 因此，當你做題目，遇到不得不求助幸運女神時，請將注意力放在最可能藏有重要線索的地方：先看文章的開頭，再看文章的結尾。
- 一篇文章中，作者常會在開頭提出主題、交代問題或介紹背景；到了結尾，則可能整理結果、表達感想、提出建議，或點出最想傳達的觀點。因此，開頭和結尾往往藏著重要線索。雖然重要訊息不一定都出現在頭尾，但當時間有限時，優先查看這兩個地方，通常比隨意猜測更有根據。
- 除了開頭和結尾，文章中還有一種重要線索──結論詞，像是「所以」、「因此」、「總之」、「可見」、「由此可知」等詞語，就像作者舉起一面小旗子，提醒讀者：「注意！注意！接下來我要統整說過的內容，或提出結論了。」
- 下次遇到二選一的難題時，可以先比較兩個選項有什麼不同，再回到文章的開頭、結尾和結論詞附近找線索，看看哪一個選項更符合文意。而如果考試時間快到了，來不及把全文慢慢讀完，也可以先快速掃描文章的開頭和結尾，並留意出現結論詞的文句。這些位置不一定直接寫出答案，卻能幫助你在有限的時間裡，更快掌握文章的主題和結論唷！
