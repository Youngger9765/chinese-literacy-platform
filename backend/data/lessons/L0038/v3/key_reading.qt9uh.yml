  passage: 但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。當萬頭鑽動的魚兒滯留閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖契機，導致魚寶寶的數量減少，影響整個魚群的生存。為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。怎麼辦呢？為了解決這個問題，生態學家馬克．范赫斯和一群工程師、科學家合作，在荷蘭烏特勒支（Utrecht）市的運河設計了「魚門鈴」。他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按鈕。運河管理員收到訊息後，便會開啟閘門，讓魚兒順利通過。「魚門鈴」上線後，效果超乎預期！自2019年啟動以來，「魚門鈴」已幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康。
