lesson_uid: L0038
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略──問題解決結構找重點
  strategy_type: summary
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '這篇課文是一篇說明文，介紹魚兒洄游時被閘門擋住，以及人們如何解決這個問題。文章從第四段開始有明顯的「問題、解決、結果」結構。但閱讀時，如何找到文章中的問題、解決、結果呢？我們可以根據內容線索來做判斷喔！

      我們來練習用兩步驟找「問題、解決、結果」。

      ❶找段落 ❷找重點句'
  - type: sub_block
    label: 一、找「問題」
    instruction: 一、找「問題」
    tip: ※祕訣：「問題」是需要解決的困難或不好的情況。
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    items:
    - type: single
      index: 1
      prompt: ❶找段落：「問題」在哪個段落？（請在□打勾，單選）
      options:
        1: 段1、2、3
        2: 段4
        3: 段5
      answer: 2
    - type: guide
      label: 段落判斷的說明框
      text: 「問題」通常出現文章的前面，不過，這篇文章的前面三段先說明背景，到了第四段才寫出魚兒遭遇的困難。
    - type: single
      index: 2
      prompt: ❷找重點句：本文第四段有三個句子，都和魚兒遇到的問題有關。哪一句最能說出魚兒面臨的主要困難？(3選1)
      options:
        1: 句1：但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。
        2: 句2：當萬頭鑽動的魚兒滯留在閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖契機，導致魚寶寶的數量減少，影響整個魚群的生存。
        3: 句3：為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。
      answer: 1
      options_note: '句2 的引文與課文第四段原文有一字之差 —— 課文是「魚兒滯留閘門附近」，

        此處作「魚兒滯留**在**閘門附近」。多一個「在」，語意相同，照原樣記錄。'
    - type: concept_box
      label: 小撇步
      text: '小撇步：

        這段有3個句子，第一句直接說出魚兒被閘門擋住，面臨多重危機，是「問題」的重點句；第二句是補充危機造成的後果；第三句說明以前的處理方法，以及這個方法遇到的問題。'
  - type: sub_block
    label: 二、找「解決」
    instruction: 二、找「解決」
    tip: ※祕訣：「解決」說明誰想出辦法或採取行動，通常出現在文章中段。
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    items:
    - type: single
      index: 1
      prompt: ❶找段落：（請在□打勾，單選）「解決」在哪個段落？
      options:
        1: 段4
        2: 段5
        3: 段6
      answer: 2
    - type: single
      index: 2
      prompt: ❷找重點句：（第5段）第5段的四個句子都在說明解決方法。哪一句是「解決」的重點？(4選1)
      options:
        1: 句1：為了解決這個問題，生態學家馬克．范赫斯和一群工程師、科學家合作，在荷蘭烏特勒支市的運河設計了「魚門鈴」。
        2: 句2：他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。
        3: 句3：這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按鈕。
        4: 句4：運河管理員收到訊息後，便會開啟閘門，讓魚兒順利通過。
      answer: 1
      options_note: 句1 的引文省去課文的「（Utrecht）」，其餘逐字相同
    - type: concept_box
      label: 小撇步
      text: '小撇步：

        這段有4個句子。第一句直接說出生態學家和團隊設計了「魚門鈴」，是「解決」的重點句。第二～四句是補充說明「魚門鈴」如何運作。'
  - type: sub_block
    label: 三、找「結果」
    instruction: 三、找「結果」
    tip: ※祕訣：「結果」常接在「解決」之後，說明行動後，帶來了什麼改變，通常出現在文章的後段。
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    items:
    - type: single
      index: 1
      prompt: ❶找段落：（請在□打勾，單選）「結果」在哪個段落？
      options:
        1: 段4
        2: 段5
        3: 段6
        4: 段7
      answer: 3
    - type: single
      index: 2
      prompt: ❷找重點句：（第6段）哪一句是「結果」的重點句，清楚寫出「魚門鈴」帶來的改變？(2選1)
      options:
        1: 句1：「魚門鈴」上線後，效果超乎預期！
        2: 句2：自2019年啟動以來，「魚門鈴」已幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康。
      answer: 2
    - type: concept_box
      label: 小撇步
      text: '小撇步：

        這段2個句子。第二句清楚寫出兩項成果：魚兒順利通過閘門，運河生態也變得更健康。因此，第二句是「結果」的重點句。'
  - type: self_check
    label: ◎自我檢核
    instruction: 請你自己檢查以下2項，確定自己是否會抓重點了
    items:
    - 1.我能根據內容線索，找出「問題、解決、結果」的段落。
    - 2.我能在段落中分辨「重點句」
