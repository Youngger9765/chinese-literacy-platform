strategy_explained: '這一課我們要練習的是「找出問題和解決方法」，幫助你快速理解故事裡誰遇到了什麼困難，又是怎麼解決的

  這篇文章講荷蘭的魚過不去閘門，科學家就發明了「魚門鈴」讓魚能順利回家，非常適合練習找出文章裡的問題和解決辦法

  讀的時候，你可以試著想一想，文章裡「魚」遇到了什麼「問題」，然後「科學家」又是怎麼「解決」的喔'
