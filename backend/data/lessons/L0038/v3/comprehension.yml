lesson_uid: L0038
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列哪一個句子中，語詞的使用錯誤？
    options:
      A: 海邊擠滿了遊客，放眼望去真是「萬頭鑽動」，十分熱鬧
      B: 這條街道拓寬整修後變得「暢行無阻」，再也不會塞車了
      C: 公車每天要「承載」大量乘客，因此需要定期檢查保養
      D: 他經過長時間練習，終於培養出「與生俱來」的節奏感
    teacher_note: 第1題詳解：「與生俱來」指天生就有，不是經由長時間練習才培養出來。因此錯誤。
  - index: 2
    answer: A
    stem: 文中提到「代表魚兒塞車了」，「魚兒塞車」是指什麼情況？
    options:
      A: 大量魚群擠在閘門前進退兩難
      B: 魚群像汽車一樣排成一直線前進
      C: 魚群游到閘門前因害怕而停下來
      D: 魚群因數量太多，在水中移動緩慢
  - index: 3
    answer: C
    stem: 文章標題和結尾都重複出現「叮咚叮咚」，作者這樣安排有何用意？
    options:
      A: 暗示裝置的聲音特別，凸顯魚門鈴設計的新穎創意
      B: 用門鈴意象說明網站功能，讓讀者了解按鈴後會開閘
      C: 用門鈴首尾呼應，邀請讀者以有創意的方式參與關心生態保育
      D: 透過聲音營造輕快感，讓讀者感覺文章讀起來順暢
    teacher_note: 作者透過這種首尾呼應，用魚門鈴意象，邀請讀者也能像按下門鈴一樣採取行動關心生態
  - index: 4
    answer: B
    stem: 本文的主旨是什麼？
    options:
      A: 強調興建堤防、水閘對環境的危害，呼籲拆除多餘的水閘設施
      B: 介紹荷蘭人如何以創意幫助魚群洄游、並讓人們可以參與保育
      C: 說明荷蘭運河的歷史與功能，展現人類水利工程的智慧成果
      D: 討論魚類洄游的習性與面臨的挑戰，提醒大眾關注水域生態
  - index: 5
    answer: A
    stem: 下列哪項做法的理念和本文介紹的「魚門鈴」最相近？
    options:
      A: 在高速公路架設野生動物天橋，讓動物安全穿越道路
      B: 規定每年魚類產卵季節禁止關閉任何水閘，讓河道保持暢通
      C: 使用聲波裝置驅趕捕食魚類的鳥類，減少魚群天敵
      D: 在河道旁設立告示牌，提醒民眾不要干擾洄游魚群遷徙
    teacher_note: 魚門鈴的精神在於運用巧思與科技幫助動物克服人為障礙，並保護生態
