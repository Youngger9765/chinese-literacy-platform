spotlight:
  lesson: G5-L26
  strategy_name: 摘要策略-問題.解決結構找重點
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: '這篇課文是一篇說明文，介紹魚兒洄游時被閘門擋住，以及人們如何解決這個問題。文章從第四段開始有明顯的「問題、解決、結果」結構。但閱讀時，如何找到文章中的問題、解決、結果呢？我們可以根據內容線索來做判斷喔！

      我們來練習用兩步驟找「問題、解決、結果」。

      ❶找段落 ❷找重點句'
  - type: guide
    text: 一、找「問題」
  - type: guide
    text: ※祕訣：「問題」是需要解決的困難或不好的情況。
  - type: free_text
    prompt: ❶找段落：
  - type: passage
    source: unknown
    paragraphs:
    - 「問題」在哪個段落？（請在□打勾，單選）
    - 【□段1、2、3　　　段4　　　　□段5　　】
    - 「問題」通常出現文章的前面，不過，這篇文章的前面三段先說明背景，到了第四段才寫出魚兒遭遇的困難。
  - type: free_text
    prompt: ❷找重點句：
  - type: passage
    source: unknown
    paragraphs:
    - 本文第四段有三個句子，都和魚兒遇到的問題有關。哪一句最能說出魚兒面臨的主要困難？(3選1)
    - 句1：但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。
    - □句2：當萬頭鑽動的魚兒滯留在閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖契機，導致魚寶寶的數量減少，影響整個魚群的生存。
    - □句3：為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 這段有3個句子，第一句直接說出魚兒被閘門擋住，面臨多重危機，是「問題」的重點句；第二句是補充危機造成的後果；第三句說明以前的處理方法，以及這個方法遇到的問題。
  - type: guide
    text: 二、找「解決」
  - type: guide
    text: ※祕訣：「解決」說明誰想出辦法或採取行動，通常出現在文章中段。
  - type: free_text
    prompt: ❶找段落：（請在□打勾，單選）
  - type: passage
    source: unknown
    paragraphs:
    - 「解決」在哪個段落？ 【□段4　　段5　　□段6　　】
  - type: free_text
    prompt: ❷找重點句：（第5段）
  - type: guide
    text: 第5段的四個句子都在說明解決方法。哪一句是「解決」的重點？(4選1)
  - type: passage
    source: unknown
    paragraphs:
    - 句1：為了解決這個問題，生態學家馬克．范赫斯和一群工程師、科學家合作，在荷蘭烏特勒支市的運河設計了「魚門鈴」。
  - type: single
    prompt: 請選擇
    options:
    - 句2：他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。
    - 句3：這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按鈕。
    answer: 句2：他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。
  - type: passage
    source: unknown
    paragraphs:
    - □句4：運河管理員收到訊息後，便會開啟閘門，讓魚兒順利通過。
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 這段有4個句子。第一句直接說出生態學家和團隊設計了「魚門鈴」，是「解決」的重點句。第二～四句是補充說明「魚門鈴」如何運作。
  - type: guide
    text: 三、找「結果」
  - type: guide
    text: ※祕訣：「結果」常接在「解決」之後，說明行動後，帶來了什麼改變，通常出現在文章的後段。
  - type: free_text
    prompt: ❶找段落：（請在□打勾，單選）
  - type: single
    prompt: 「結果」在哪個段落？
    options:
    - 【□段4
    - □段5　　段6　　□段7　　】
    answer: □段5　　段6　　□段7　　】
  - type: free_text
    prompt: ❷找重點句：（第6段）
  - type: guide
    text: 哪一句是「結果」的重點句，清楚寫出「魚門鈴」帶來的改變？(2選1)
  - type: guide
    text: □句1：「魚門鈴」上線後，效果超乎預期！
  - type: passage
    source: unknown
    paragraphs:
    - 句2：自2019年啟動以來，「魚門鈴」已幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康。
  - type: guide
    text: 小撇步：
  - type: passage
    source: unknown
    paragraphs:
    - 這段2個句子。第二句清楚寫出兩項成果：魚兒順利通過閘門，運河生態也變得更健康。因此，第二句是「結果」的重點句。
    - 這是一篇問題解決結構的文章。透過閱讀聚光燈，你已經學會找出各段的重點句。接著，我們把這些重點整理在表格裡！
  - type: fill_table
  - type: self_check
    items:
    - 我能根據內容線索，找出「問題、解決、結果」的段落。
    - 我能在段落中分辨「重點句」
