source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 數百年來，荷蘭人在城市裡建造了許多運河，它們是城市的命脈，承載著住民的交通、貿易和生活。運河上常有閘門，看起來就像一道巨大的鐵牆或閘板，橫在水面上或水底下，可以上下移動或開合，用來控制水流，確保船隻順利通過或防止城市被洪水淹沒。雖然這個設計非常有用，讓人們的生活更為便利，但是這些閘門卻沒有考慮到洄游魚類的天性。
- 洄游魚類成長的地方和產卵的地方不同。牠們長大後，到了產卵時，與生俱來的本能會帶領牠們從海洋游到河川，或從河川游到海洋。找到適合的棲息地後，牠們才能繁殖下一代。
- 但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。當萬頭鑽動的魚兒滯留閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖契機，導致魚寶寶的數量減少，影響整個魚群的生存。為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。
- 怎麼辦呢？為了解決這個問題，生態學家馬克．范赫斯和一群工程師、科學家合作，在荷蘭烏特勒支（Utrecht）市的運河設計了「魚門鈴」。他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按
- 「魚門鈴」上線後，效果超乎預期！自2019年啟動以來，「魚門鈴」已幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康。
- 更有趣的是，魚門鈴的網站讓市民和遊客可以上網觀看魚兒的動態，還能參與「按鈴」行動。這不僅保護了魚類，也讓大家更關心身邊的自然環境，知道運河不只是風景，更是許多生物的家！這個故事提醒我們，保護自然不一定要做什麼驚天動地的大事，用心觀察、動動腦筋、付諸行動，就可能「叮咚叮咚」，為生態保育開啟一扇門。
