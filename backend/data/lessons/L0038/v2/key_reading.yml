passage: '怎麼辦呢？為了解決這個問題，生態學家馬克．范赫斯和一群工程師、科學家合作，在荷蘭烏特勒支（Utrecht）市的運河設計了「魚門鈴」。他們在運河裡裝設了水下攝影機，當魚兒游到閘門附近時，攝影機會捕捉到牠們的蹤影，並把影像傳送到一個網站。這個網站就像「魚兒直播間」，全世界的人都可以上網觀看！如果有人發現閘門前有魚群聚集，代表魚兒塞車了，就可以點擊網站上的「魚門鈴」按

  「魚門鈴」上線後，效果超乎預期！自2019年啟動以來，「魚門鈴」已幫助無數魚兒順利通過運河閘門，運河的生態系統也因此變得更健康。

  更有趣的是，魚門鈴的網站讓市民和遊客可以上網觀看魚兒的動態，還能參與「按鈴」行動。這不僅保護了魚類，也讓大家更關心身邊的自然環境，知道運河不只是風景，更是許多生物的家！這個故事提醒我們，保護自然不一定要做什麼驚天動地的大事，用心觀察、動動腦筋、付諸行動，就可能「叮咚叮咚」，為生態保育開啟一扇門。'
