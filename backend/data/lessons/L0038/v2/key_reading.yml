passage: 但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。當萬頭鑽動的魚兒滯留閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖契機，導致魚寶寶的數量減少，影響整個魚群的生存。為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。
