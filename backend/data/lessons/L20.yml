vocabulary:
- word: 多樣性
  definition: 事物或生物的種類呈現多種樣式。
- word: 未雨綢繆
  definition: 在問題發生之前做好準備。
- word: 森嚴
  definition: 形容防衛等級極為嚴密、嚴格的樣子。
- word: 倖免
  definition: 在災難或危險中幸運地避免受傷、逃過一劫。
- word: 戒備
  definition: 警戒防備來應對可能的危險或突發事件。
- word: 烽火漫天
  definition: 戰爭激烈，戰火四起的景象。
- word: 活性
  definition: 物質或細胞保持生存或運作的能力。
- word: 甦醒
  definition: 從昏迷、沉睡的狀態恢復過來，重新獲得意識或生機。
- word: 極端
  definition: 程度非常高或非常低，超出常規。
- word: 殃及池魚
  definition: 比喻無辜的人或事物受到牽連而遭受災禍。
- word: 出資
  definition: 提供資金，用在某個計劃或項目。
