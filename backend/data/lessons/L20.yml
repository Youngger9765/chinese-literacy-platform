story_text: '銀行是存錢的地方，你可知道，現在還有一種銀行，專門儲存來自世界各地的種子喔！

  這個種子銀行的正式名稱叫做斯瓦爾巴全球種子庫，是挪威政府出資興建的非營利儲藏庫，2008年完工開放以來，裡面已儲存了數以萬計的種子包，用來保存全世界的農作物種子。

  由於全球氣候變遷越來越劇烈，對生物多樣性造成威脅，不僅影響動物的生存，連植物也難以倖免。萬一發生大區域性或全球性的災害時，某些農作物可能從此滅絕，興建種子庫的目的，就是在預防這樣的末日景象，以保護農業作物的多樣性，因此它也被稱為「末日種子庫」。

  低溫乾燥的環境有利於保存種子，這座種子庫因而建造在斯瓦爾巴群島永久凍土區的山脈內部。這裡是挪威最北邊的國土，位於北極地區，冰天雪地，氣候極為寒冷，像一座大型的自然冷凍庫。種子庫的溫度維持在攝氏零下18度，這溫度可降低種子的代謝活動，並維持發芽的活性，是最適合保存種子的溫度。即使停電或製冷機故障，永凍土也能讓內部溫度保持在零下8度左右。這個世界最大的種子銀行，最多可存放450萬種作物的種子，珍貴的種子經過真空包裝，並用三層鋁箔密封，才能上架。

  這裡的戒備十分森嚴，如果你有機會進入內部，會先經過大約120公尺的隧道，並通過5扇有密碼裝置的門，才可進入地下的種子儲存庫。整棟建築位在海拔130公尺高的地方，外牆的混凝土厚達1公尺，可承受芮氏規模6.2的地震和核子武器攻擊，即使冰川

  融化、海平面上升，也不會威脅種子的安全。

  臺灣在2009年首度參與這項保存計畫，為了維繫臺灣原生小米的基因多樣性，2024年臺灣科學團隊特地前往北極，由三位排灣族原住民代表，將象徵繁榮和幸福的小米種子，存放在斯瓦爾巴全球種子庫。小米類穀物可以在惡劣的氣候條件下生存，抗旱又耐病蟲害，被視為極端氣候下解決糧食危機的重要作物。

  斯瓦爾巴全球種子庫設置的概念就像銀行，各國存放在裡面的種子，所有權仍是儲存國的，當有需要的時候可以領出來，讓種子從冷凍中甦醒，便可以再播種。2015年，敘利亞發生內戰，烽火漫天，第一大城阿勒坡受到嚴重破壞，城裡的種子庫也被殃及池魚。中東的研究人員於是向斯瓦爾巴全球種子庫提取存放其中的130箱種子，這也是末日種子庫成立以來首次被提取的案例。

  科學家未雨綢繆󠇡，運用科技為人類的生存而努力，我們每個人更要保護生態環境，祈禱永遠沒有人需要使用斯瓦爾巴種子庫的種子！'
