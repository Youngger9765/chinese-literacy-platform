  passage: 他從此離群索居，祕密進行實驗，從停屍房和墓穴找來許多屍塊當作「實驗材料」，將屍塊縫補成人的形狀，幻想他自己可以扮演上帝的角色，讓冰冷的屍體甦醒過來。某個夜晚，他苦心製造的「人」居然慢慢睜開了枯黃遲滯的眼睛，開始吃力的呼吸，四肢不斷抽搐著。弗蘭肯斯坦目睹這一刻，嚇得連連退後，他驚恐萬分，看著自己精心創造的「人」竟然如此恐怖，他淒厲的尖叫：「我創造了一個怪物啊！」接著奪門而出，留下這位身高八呎的怪物，好奇的開始對世界展開探索。換句話說，弗蘭肯斯坦成功的創造出一個「人」，但隨即拋棄了他。怪物被迫進入人類的世界，四處流浪，透過觀察學習，慢慢擁有知識，也學會判斷善惡、美醜，也希望被人類接納，卻因為醜陋無比的外表，一再遭受誤解與傷害，最後導致一連串的悲劇。每個人都有專屬於自己的名字，通常是由父母、家人所取名，一個名字的背後帶著取名之人的寄望、祝福。
