lesson_uid: L0095
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略——從文本線索理解標題
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，本大題 5 個）與橘色手寫字
  blocks:
  - type: concept_box
    text: '有些文章標題一看就知道意思，但有些標題卻不能只看字面。這時，想知道標題在說什麼，就要在文章裡找線索，把線索連起來，才能知道作者想透過這個標題告訴讀者什麼。

      要看懂標題，可以照❶~❹的步驟這樣做：

      ❶看標題：標題裡哪個詞最值得注意？我想知道什麼？

      ❷找線索：回到文章，找出和標題最有關的內容。

      ❸連線索：這些線索共同說明了什麼？

      ❹說出理解：用以下的句型說出你的理解：

      從______________和_____________這些線索，

      我推論標題「___________」可能是在說____________。'
  - type: guide
    text: 底下就讓我們用這４個步驟來練習看出標題的意思。
  - type: guide
    text: 一、標題中的「弗蘭肯斯坦」，這是……？
  - type: guide
    text: '❶看標題

      我們要回答：這個標題中的「弗蘭肯斯坦」指的是誰？'
  - type: multi
    prompt: '❷找線索：先在課文中圈出關於弗蘭肯斯坦的描述。

      下面哪些選項是判斷標題意思的重要線索？請在□打勾。（多選）'
    options:
      1: 弗蘭肯斯坦是一位研究生命起源的年輕科學家
      2: 弗蘭肯斯坦就是偷了眾神的火種，賜給人類的那個神話人物
      3: 弗蘭肯斯坦把屍塊縫合，進行造人實驗
      4: 怪物睜眼甦醒後，弗蘭肯斯坦嚇得奪門而出
      5: 「弗蘭肯斯坦」就是那位醜陋的人造怪物
    answers:
    - 1
    - 3
    - 4
  - type: single
    prompt: '❸連線索

      根據線索，哪一項理解最合理？'
    options:
      1: 「弗蘭肯斯坦」是怪物的名字，因為故事主要在寫怪物
      2: 「弗蘭肯斯坦」是科學家的名字，怪物其實沒有名字
      3: 「弗蘭肯斯坦」是造人實驗的名稱，不是人物的名字
      4: 「弗蘭肯斯坦」是科學家和怪物共同使用的名字
    answer: 2
  - type: free_text
    prompt: '❹說出理解

      你可以這樣說：從課文中所描述的弗蘭肯斯坦，我找到幾個線索：

      *弗蘭肯斯坦是一位研究【　】的年輕科學家

      *弗蘭肯斯坦把【　】縫合，進行造人實驗

      *怪物睜眼甦醒後，他嚇得奪門而出'
    blanks:
    - answer: 生命起源
    - answer: 屍塊
  - type: single
    prompt: →所以，我推論標題中弗蘭肯斯坦指的是
    options:
      1: 那個醜陋的怪物
      2: 那個創造怪物的科學家
    answer: 2
    note: 原稿把兩個選項印在同一組【　】裡（【 □那個醜陋的怪物；　☑那個創造怪物的科學家 】），沒有①②編號。
  - type: guide
    text: 二、標題中弗蘭肯斯坦為什麼有「現代普羅米修斯」的副標？
  - type: guide
    text: 請在底下的【　】填上適當的步驟名稱或詞彙
  - type: free_text
    prompt: '❶【　】

      我先圈出現代普羅米修斯，我問自己：弗蘭肯斯坦和普羅米修斯有什麼相像的地方？'
    blanks:
    - answer: 看標題
    prompt_note: 「現代普羅米修斯」在原稿加了黑色方框（w:bdr auto）當強調，不是答案載體。
  - type: free_text
    prompt: '❷【　】

      我回到文章，找到兩組重要線索：

      *弗蘭肯斯坦：　創造生命 → 跨越原有的界線 → 引發悲劇

      *普羅米修斯：【　】→ 觸犯禁忌 → 受到懲罰'
    blanks:
    - answer: 找線索
    - answer: 偷取火種
    prompt_note: 這一段裡的 → 是**文字**箭頭（U+2192），照抄。
  - type: free_text
    prompt: '❸【　】

      我發現，兩個人做的事情雖然不同，卻有個共同點：

      他們都做了原本不被允許或不該輕易跨越的事，而且後來都付出了代價。'
    blanks:
    - answer: 連線索
    prompt_note: 最後一行句首原稿印一個箭頭，它是 `w:sym Wingdings F0E0` 符號物件、不在文字流，未寫進 prompt。
  - type: free_text
    prompt: '❹【　】

      從普羅米修斯偷火種後受到【　】，以及弗蘭肯斯坦創造生命後導致【　】引發，我推論「現代普羅米修斯」是在暗示：他們倆都同樣觸犯了【　】，也因此帶來嚴重的後果。'
    blanks:
    - answer: 說出理解
    - answer: 懲罰
    - answer: 悲劇
    - answer: 禁忌
    prompt_note: 第二行句首原稿印一個箭頭（`w:sym Wingdings F0E0`，不在文字流），未寫進 prompt。
