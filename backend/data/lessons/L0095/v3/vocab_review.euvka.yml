  notes:
    instruction: 原稿有兩個重疊的文字方塊，另一句寫「…把灰框內的語詞刪除。」；PDF p9 上層是「劃掉」。
    target_words: 灰框原文分兩行：「魁梧、離群索居、遲滯、抽搐、轉瞬即逝、倫理／奪門而出、神祇、禁忌、隻手遮天、哀鳴」（11 個，與語詞框相同）。
    grid: '🔵 **格子跨頁**：第 1~4 列印在 p9 最下方、第 5~10 列印在 p10 最上方。

      ⚠️ 而且橘圈與格子在 PDF 上**錯位**：碰到第 1 列的兩條（禁忌、離群索居）整個被推到 p10 頁首，

      變成兩個懸空的框；p10 的其餘框也整體下移約一列。

      ⛔ 因此本課**不能靠「圈壓在哪一格上」判讀** —— 判準是 cells 套回 grid 拼不拼得回目標語詞。'
    answer_paths: '11 個目標語詞全部圈到（11/11），逐格取字都能拼回目標語詞，格子沒有錯字。

      幾何交叉驗證（單向警報）：全檔 11 個 roundRect **全部都在找字那一 block**（block 138），

      11 == 11 條路徑 → 11 ＞ 11 不成立，**不觸發**「少抓一條」警報。

      ⚠️ 紙外過濾在本課同樣不可信：naive 公式把 11 個裡的 7 個算成「紙外」，

      但格子裡明明看得到 11 個圈（與 L0063、L0094 同型的旋轉框誤判）。

      像素佐證（200dpi 重繪、數橘色連通塊）：p9 有 3 塊、p10 有 8 塊，**合計恰好 11**，

      與 roundRect 數與 answer_paths 條數三者一致。

      這一步是必要的：本課的圈在 PDF 上與格子錯位（碰到第 1 列的兩條整個被推到 p10 頁首），

      光看「圈壓在哪一格」會判錯。

      另記：格子裡埋了「痙攣」((3,9)(4,9))，它在總表的語詞欄裡但**不在學習單的 11 個目標語詞**，

      也沒有被圈起來 —— 是干擾詞，不是漏抽的答案（見 meta._總表_對照note）。'
