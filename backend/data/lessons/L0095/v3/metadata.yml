_總表_對照note: '🔴 總表與學習單的語詞**不完全相同**（不是只差數量，是有進有出）：

  ・兩邊都有（9 個）：魁梧、哀鳴、遲滯、抽搐、神祇、禁忌、奪門而出、隻手遮天、離群索居

  ・**只有總表有**：痙攣

  ・**只有學習單有**：倫理、轉瞬即逝

  學習單自己四處一致（語詞框 11／第三大題 11 題／第四大題代號 A~J 10 個／第八大題灰框 11 個），

  所以是總表那一列沒跟上改稿，不是抽取錯。

  ⚠️ 有趣的佐證：「痙攣」**確實印在找字格子裡**（(3,9)(4,9)），但它不在灰框的 11 個目標語詞中，

  也沒有被圈起來 —— 應是改稿時從語詞表拿掉、格子裡留下來當干擾詞。

  ⛔ 未自行以學習單覆蓋總表 —— 那要改的是 xlsx，不是這份抽取。'
