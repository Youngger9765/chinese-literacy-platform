  questions:
  - index: 2
    answer: B
    stem: 下列哪個句子中的語詞運用錯誤？
    options:
      A: 夫妻大吵一架後，這位太太一時氣不過便「奪門而出」
      B: 陽光太強，小美一手提東西，只好「隻手遮天」擋住陽光
      C: 為了準備國家考試，他「離群索居」，專心讀書了三個月
      D: 這外國人不了解台灣的「禁忌」，居然用紅筆寫信給友人
    rationale: null
  - index: 3
    answer: C
    stem: 根據文章，下列敘述何者不正確？
    options:
      A: 弗蘭肯斯坦因爲想起曾看見樹被閃電擊中的景象，而得到用電流進行造人實驗的靈感
      B: 雖然弗蘭肯斯坦成功的造出「人」來，但隨後就被自己創造出來的「人」嚇得奪門而出
      C: 怪物透過學習，慢慢擁有知識和判斷力，起初被討厭，最終因他的善良而被人類接納
      D: 小說的中文翻譯是《科學怪人》，有人認為「科學怪人」是指怪物，也有人認為是科學家
    rationale: null
  - index: 4
    answer: A
    stem: 為什麼小說原作者給本書書名的副標題是「現代普羅米修斯」？
    options:
      A: 弗蘭肯斯坦造人的行為和普羅米修斯一樣，都觸犯了禁忌
      B: 弗蘭肯斯坦把普羅米修斯當成目標，立志成為普羅米修斯
      C: 科學怪人和普羅米修斯一樣，都被用鐵鍊綁起來並鎖在高處
      D: 作者希望弗蘭肯斯坦能像普羅米修斯一樣，接受神的懲罰
    rationale: null
  - index: 5
    answer: D
    stem: 根據課文，下面哪一個選項比較可能是小說原作者透過故事想要傳達給讀者的？
    options:
      A: 為了讓科學可以有更好的發展，我們應該要投注所有的心力
      B: 不要隨便觸犯神的禁忌，否則將會招來厄運，最後不得善終
      C: 怪物很可憐，沒有名字，也沒有人愛，才會造成一連串悲劇
      D: 發展科學時不能只關注研發成果，也要留意可能帶來的後果
