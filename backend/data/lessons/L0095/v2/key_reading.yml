passage: '小說中，弗蘭肯斯坦是一位充滿夢想的青年科學家，對探究生命起源相當迷戀。他為了瞭解「生」，長時間鑽到墓園觀察「死」，有一次，他發現腐敗的人體竟會發出一道轉瞬即逝的光芒，他回想起十五歲那年曾看過閃電劈毀一棵老橡樹，心中頓時出現了一個大膽的想法：「生命的起源來自於電」。他從電流中得到這個啟發，開始進行創新的「造人」實驗，他心想，如果成功製造出一個「人」，那該是多麼傑出的科學成就啊！

  他從此離群索居，祕密進行實驗，從停屍房和墓穴找來許多屍塊當作「實驗材料」，將屍塊縫補成人的形狀，幻想他自己可以扮演上帝的角色，讓冰冷的屍體甦醒過來。某個夜晚，他苦心製造的「人」居然慢慢睜開了枯黃遲滯的眼睛，開始吃力的呼吸，四肢不斷抽搐著。'
