- word: 退役
  definition: 軍人退伍或運動員結束選手生涯。
- word: 鞏固
  definition: 加強力量使其堅固牢靠。
- word: 幅員遼闊
  definition: 領土非常大。
- word: 遍地開花
  definition: 滿地開花，比喻好的事物到處湧現。
- word: 發掘
  definition: 發現、引出。
- word: 後顧之憂
  definition: 在前進過程中，擔心有其他的壞事發生。
- word: 天壤之別
  definition: 有巨大的差別。
- word: 熱衷
  definition: 急切的追求且全心投入。
- word: 井井有條
  definition: 形容整齊有秩序的樣子。
- word: 斥資
  definition: 投入大量經費。
