story_text: '根據統計，2020年東京奧運會金牌數最多的前五名國家分別是：美國、中國、日本、英國、俄羅斯，這些國家大多是人口眾多、國力強盛的國家。但你知道嗎？金牌數第六名的國家，居然是人口數與臺灣相距不遠的澳洲，兩國人口數雖然相近，但澳洲的獎牌數卻是臺灣的八倍多，甚至連續十年在奧運的得牌數都位居所有國家的前十名。為什麼澳洲和臺灣會有這麼大差異呢？

  澳洲幅員遼闊、氣候宜人，居民常親近大自然並享受戶外運動。除了居民自發的運動外，澳洲政府也全力支持體育活動，設置了非常完善的體育系統，斥資設置許多體育設施及體育學校，城市內也遍佈各種體育場館，且大多都具備舉辦國際賽事的規模。此外，政府還成立國家運動中心，提供專業的科學運動訓練與豐厚的獎學金，藉此吸引更多有潛力的年輕運動人才投入訓練。

  澳洲的各級學校也看重體育，經常舉辦校內、校際的體育競賽。以國小為例，他們國小上課時間從上午九點到下午三點，放學後有充足的時間進行體育活動或比賽，家長們並不會覺得讓孩子接觸體育活動會影響到課業；相反的，他們認為體育活動除了鍛鍊身心的功能之外，還能讓孩子學到許多重要的品格，像團隊合作、自律吃苦、負責、永不放棄等。

  因此，澳洲的家長們非常熱衷於讓孩子在放學後參加社區的運動俱樂部。俱樂部裡有來自社區家長或志工組成的訓練團隊，每週也會舉辦體育賽事。雖然是社區型的俱樂部，但他們的賽制規劃得井井有條，按照年齡與水準分級進行比賽。各項比賽中表現優異的隊伍或運動員，就可以參加更高水準俱樂部的比賽，甚至獲得參與國家級比賽的機會。像這樣層級分明的運動賽事安排，可以系統化而且及早的發掘出有運動天賦的孩子，在積極培養後，有機會成為兼職或全職的運動員；表現最優異的選手，就會進入國家代表隊，得到為國家爭取國際賽獎牌的機會。

  澳洲國家隊選手除了運動員身份外，大多還有其他的職業，例如醫師、工程師、收銀員等。亦即，他們從運動員的角色退役後，不會有後顧之憂，可以靠著在各行各業的專業技能，得到生涯發展的機會。而這些退役的運動員，在工作之餘也會到社區的運動俱樂部當教練，指導更多的孩子。就這樣形成了良好的循環，鞏固了澳洲穩定的體育人材篩選與訓練系統。

  反觀臺灣，我們的家長對課業的看重，遠遠超過體育，相較於澳洲，學生在校內的運動時間少得可憐，而且放學後上補習班的，比去運動的多得多；臺灣運動資優的學生，有許多會進入體育班，接受長時、嚴格的訓練，還經常因此犧牲課業。臺灣的教育觀念及體育環境，造成幾個問題：一、參與各種專項運動的人數太少，所以運動績優生的選材不易；二、運動選手的選訓，主要是學校和政府在做，缺少像澳洲那樣遍地開花的社區運動俱樂部；三、為了訓練和出賽，犧牲了學生運動員的課業和職業發展，讓退役選手的就業產生困難。

  澳洲人口2600多萬，臺灣人口2300多萬，相差不多，但是兩國在奧運會的得牌數有天壤之別。原因是什麼？如果想和跟澳洲一樣，成為奧運奪牌榜上的前幾名，你認為臺灣該怎麼做呢？'
