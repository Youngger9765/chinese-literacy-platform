multiple_choice:
- question: 下列語詞何者使用正確？
  options:
  - 他的房間雜物眾多，寸步難行，真是「宜人」之所。
  - 臺灣「井井有條」，擁有豐饒的地下水。
  - 因為有全家人的支持，讓他沒有「後顧之憂」，可以專心衝刺事業。
  - 這所學校「幅員遼闊」，從前門就可以看到後門。
  answer: D
  explanation: 語意相反
- question: 澳洲政府成立國家運動中心，主要的用意為何？
  options:
  - 培育許多有潛力的年輕運動員。
  - 成為未來舉辦國際賽事的場地。
  - 培養運動員良好、健全的品格。
  - 讓運動員退役後能進入社區教學。
  answer: A
  explanation: 第二段提到，為了培育更多有潛力的運動員。
- question: 下列何者不是澳洲奪得眾多獎牌原因？
  options:
  - 政府大量投入經費建設軟硬體及培訓系統。
  - 氣候宜人，幅員遼闊，國家人口數量眾多。
  - 學校課程時間短，家長鼓勵孩子課後投入運動。
  - 社區有各種運動俱樂部，由退役運動員當教練。
  answer: B
  explanation: 氣候宜人是澳洲人喜歡運動的原因，人口數與
- question: 「澳洲」與「臺灣」有許多相似或不同之處，比較兩地，下列何者正確？
  options:
  - 兩國國土面積相差不多。
  - 兩國人口數量差距很大。
  - 兩國體育設施都很完善。
  - 兩國家長重視項目不同。
  answer: D
  explanation: A錯：面積差距很大。；B錯：人口數差不多。；C錯：臺灣較少體育場館的設施。
- question: 臺灣或許可以學習澳洲的成功經驗。請問何者不是澳洲帶給臺灣的啟示？
  options:
  - 鼓勵社區增設運動俱樂部，讓更多人參與體育。
  - 善用退役運動員進入社區，做更多人才的篩選與訓練。
  - 教育家長改變「重學科、輕體育」的態度
  - 讓體育資優選手進體育班，接受長時嚴格訓練。
  answer: D
  explanation: 目前臺灣是用此人人熱愛運動，從此找出選手。
