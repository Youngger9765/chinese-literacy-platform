lesson_uid: L0030
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 請問文中第四段所提到的：「練肌肉沒有一步登天的方法，循序漸進的飲食控制和規律練習才會慢慢看見成效。」，「循序漸進」可以用哪個詞語替換？
    options:
      A: 我們先把計畫擬訂好，然後「按部就班」去做，如期完成工作
      B: 我們做事要腳踏實地，不要老是想「一步登天」
      C: 小明為了趕時間，一路狂飆，結果「欲速則不達」，半路就出了車禍
      D: 他做事往往「求好心切」，操之過急，反而得到反效果
    teacher_note: （指的是做事依照一定的層次、步驟進行）
  - index: 2
    answer: B
    stem: 請問下列運動訓練肌肉的部位，何者配對正確？
    options:
      A: 深蹲－胸肌、三頭肌
      B: 棒式－核心肌群、肩膀、胸部
      C: 拉單槓－大腿、臀大肌
      D: 伏地挺身－背肌、二頭肌
    teacher_note: 選項 A 後面註「（伏地挺身）」、C 註「（深蹲）」、D 註「（拉單槓）」，是教師版標出各該正確的運動
  - index: 3
    answer: C
    stem: 根據本文，請問養成肌肉的基本原則何者為非？
    options:
      A: 均衡的飲食控制
      B: 維持良好的睡眠
      C: 先增肌，再減脂
      D: 專業規律的訓練
    teacher_note: C 後面註「（先減脂，再增肌）」
  - index: 4
    answer: D
    stem: 下列敘述的訓練，誰最有機會練出肌肉？
    options:
      A: 我吃完肯德基之後，都會去健身房重訓
      B: 我一天只睡四小時，剩下時間都在訓練
      C: 我都拉單槓拉到身體不能再做為止
      D: 我固定在睡前二十分鐘做伏地挺身
    teacher_note: D 後面註「（第四段）」
  - index: 5
    answer: B
    stem: 如果要換一個標題，請問最適合本課標題是什麼？
    options:
      A: 快速的肌肉養成步驟
      B: 減脂、增肌的關鍵
      C: 運動類型與肌肉塑造
      D: 肌肉和飲食控制的關係
    teacher_note: (本篇在說明肌肉的生成及鍛鍊方式。)
