lesson_uid: L0030
version_id: v3
section_no: 六
spotlight:
  strategy_name: 摘要策略—用主題細節整理重點
  strategy_type: comprehension_strategy
  blocks:
  - type: concept_box
    text: '說明文有許多不同的寫法。本課是一篇說明文，主要介紹與鍛鍊肌肉有關的知識。這一課很適合用「主題—細節結構」來整理：先找出文章的大主題，再看作者分成哪幾個小主題來說明，最後找出每個小主題中最重要的說明細節。

      下面的結構圖，可以幫助我們把文章重點分成三層，並把大主題、小主題和重要細節放到圖裡。'
  - type: guide
    text: 以本課第三段為例：看文章怎麼變成結構圖
  - type: single
    label: ⑴
    prompt: 大主題：第三段主要講什麼？
    options:
      1: 鍛鍊肌肉的方法
      2: 動作訓練
    answer: 1
    answer_carrier: Wingdings F0FE（☑，圖形字元），文字流無此資訊
  - type: guide
    text: 這就是結構圖最上方的大主題喔。
  - type: guide
    label: ⑵
    text: 小主題：第三段用「首先、再來、最後」依序說明三個小主題。請看下面的結構圖，找出作者分別用了哪三個小主題來說明，並填入【 】中。
  - type: fill_table
    label: 第三段結構圖
    columns:
    - 大主題
    - 小主題
    - 細  節
    rows:
    - 大主題: 鍛鍊肌肉的方法
      小主題: 均衡的飲食控制
      細  節: 減少油炸類和甜食的攝取
    - 小主題: 保持【　】
      小主題_blanks:
      - answer: 良好的睡眠
      細  節: 幫助分泌生長激素
      細  節_source_text: 幫助分泌生長激素激素素
      細  節_errata_ref: E1
    - 小主題: 【　】
      小主題_blanks:
      - answer: 專業且規律的訓練
      細  節: '不同肌肉部位有不同的訓練方式

        每次練習都要離開舒適圈'
    answer_carrier: 答案就寫在文字流的【 】裡（不是圖形層）；⚠️ LibreOffice 轉出的 PDF 把這幾格畫成空白，是轉檔漏字，不是教材沒答案
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 剛才我們試著用本課內容整理結構圖。現在請讀下面短文，也用「大主題—小主題—細節」的方法，把重點填進結構圖。
  - type: passage
    label: 範文
    attribution: (範文擷取自黃金萍〈海中霸王〉）
    paragraphs:
    - 鯊魚在水域食物鏈中位居頂端。牠們會成為海中霸王，主要歸功於靈敏的感覺功能。犀利的聽覺，可以感覺到海洋六千公尺外的音波；敏銳的嗅覺，能夠分辨五百公尺外的味道；至於電覺，則能發覺隱藏在沙底下的獵物，鯊魚是動物界感應電流的第一高手。
  - type: guide
    text: 換你試試看
  - type: fill_table
    label: 鯊魚結構圖
    columns:
    - 大主題
    - 小主題
    - 細  節
    rows:
    - 大主題: 鯊魚感官功能
      小主題: 【　】
      小主題_blanks:
      - answer: 聽覺
      細  節: 感覺海洋六千公尺外的【　】
      細  節_blanks:
      - answer: 音波
    - 小主題: 【　】
      小主題_blanks:
      - answer: 嗅覺
      細  節: 分辨五百公尺外的【　】
      細  節_blanks:
      - answer: 味道
    - 小主題: 電覺
      細  節: '發覺隱藏在【　】的獵物

        是動物界感應電流的第一高手'
      細  節_blanks:
      - answer: 沙底下
    answer_carrier: 答案寫在文字流的【 】裡；PDF 同樣把這幾格畫成空白（轉檔漏字）
