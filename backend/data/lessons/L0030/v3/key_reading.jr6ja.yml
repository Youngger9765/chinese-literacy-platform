  passage: 想擁有雷神索爾般的身材，首先要做到「均衡的飲食控制」，倘若每餐都是炸雞、薯條、可樂、珍奶，就算運動得很努力，也跟不上脂肪增加的速度，因此減少油炸類、甜食的攝取是非常關鍵的；再來是「保持良好的睡眠」，因為生長激素在睡覺時，濃度會快速上升，以利身體組織成長，所以充足的睡眠是不可或缺的；最後是「專業且規律的訓練」，身體的肌肉有相當多種類，不同的訓練方式，則會增強不同的肌肉，例如：伏地挺身會練到胸肌、三頭肌；拉單槓會練到背肌、二頭肌；棒式是核心肌群、肩膀、胸部；深蹲則是大腿、臀大肌。重要的是，每次練習，都要「離開舒適區」，練習的分量，要比自己能承受的最大重量再高一點點才行。不過有很多新手急於速成，想要趕快擁有肌肉，例如：教練說一天做二十下，新手卻一天做四十下，造成一個星期的肌肉酸痛，甚至帶來運動傷害，真是欲速則不達。其實，練肌肉沒有一步登天的方法，新手可以請教教練或是閱讀專門的書籍，循序漸進的飲食控制和規律練習才會慢慢看見成效。
