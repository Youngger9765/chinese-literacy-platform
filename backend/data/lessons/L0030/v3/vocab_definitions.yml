lesson_uid: L0030
version_id: v3
section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank:
  - 覆蓋
  - 壁壘分明
  - 結實
  - 不可或缺
  - 舒適區
  - 倘若
  - 欲速則不達
  - 分量
  - 一步登天
  - 循序漸進
  items:
  - index: 1
    word: 倘若
    definition: 如果、假使，假設語氣。
  - index: 2
    word: 結實
    definition: 堅固的，強健的。
  - index: 3
    word: 不可或缺
    definition: 指非常重要，一定要有，缺少了就不行。
  - index: 4
    word: 壁壘分明
    definition: 比喻彼此界限清楚，各自有自己的範圍。
  - index: 5
    word: 一步登天
    definition: 比喻輕易達到極高的地位或境界。
  - index: 6
    word: 分量
    definition: 事物的輕重、多寡。
  - index: 7
    word: 循序漸進
    definition: 按照一定的次序與步驟逐漸推進。
  - index: 8
    word: 欲速則不達
    definition: 只想快速達成，卻因此失敗了。
  - index: 9
    word: 覆蓋
    definition: 完全遮住、蓋住。
  - index: 10
    word: 舒適區
    definition: 讓人感到舒服、安適的狀態。
  notes:
    answer_carrier: 橘色手寫字（圖形層），文字流有字但無顏色資訊
