    text: (範文擷取自黃金萍〈海中霸王〉）　　鯊魚在水域食物鏈中位居頂端。牠們會成為海中霸王，主要歸功於靈敏的感覺功能。犀利的聽覺，可以感覺到海洋六千公尺外的音波；敏銳的嗅覺，能夠分辦五百公尺外的味道；至於電覺，則能發覺隱藏在沙底下的獵物，鯊魚是動物界感應電流的第一高手。　　鯊魚在水域食物鏈中位居頂端。牠們會成為海中霸王，主要歸功於靈敏的感覺功能。犀利的聽覺，可以感覺到海洋六千公尺外的音波；敏銳的嗅覺，能夠分辦五百公尺外的味道；至於電覺，則能發覺隱藏在沙底下的獵物，鯊魚是動物界感應電流的第一高手。
