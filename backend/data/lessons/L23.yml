vocabulary:
- word: 解剖
  definition: 為了研究，切開生物的軀體。
- word: 典藏
  definition: 有價值的文物被保存在博物館或私人收藏家的收藏中。
- word: 擱淺
  definition: 船隻或魚類在水淺處卡住，無法行進。
- word: 蛻變
  definition: 醜陋的毛蟲轉變成美麗的蝴蝶，這類的過程叫蛻變。比喻人事物經過巨大變化而有了更好的面貌或狀態。
- word: 削瘦
  definition: 指身體因為疾病、飢餓等原因而變得瘦弱。
- word: 珍稀
  definition: 珍貴稀少。
- word: 束縛
  definition: 使人或事物的行動受到限制。
- word: 瀕危物種
  definition: 指數量已經減少到接近滅絕的生物。
- word: 燃燒殆盡
  definition: 指火焰或燃料完全燃燒至沒有剩餘。
- word: 流竄
  definition: 指惡劣的昆蟲、疾病或勢力四處流動或擴散。
vocabulary_count: 10
