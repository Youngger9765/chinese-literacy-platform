multiple_choice:
- question: 請問哪一個句子使用語詞有誤?
  options:
  - 他們經歷千辛萬苦，終於「籌措」到開設新店所需的資金。
  - 眼前如詩如畫的景象，「震懾」了所有在場的人。
  - 一把無情大火，把他們辛苦建立的家園燃燒「殆盡」。
  - 在山林中呼吸著「沁涼」的空氣，讓人感到十分清爽。
  answer: B
  explanation: 「震懾」的意思是受到強烈的驚嚇恐懼。如詩如畫的景象通常令人感到美麗、驚豔或心曠神怡，而非受到驚嚇或恐懼，因此在此處使用「震懾」不恰當。
- question: 從賴桑做的事，說的話，你覺得賴桑是一個怎麼樣的人？以下何者最不合理？
  options:
  - 熱愛山林與大自然的人──整天與大自然為伍。
  - 不放棄的人──為了貢獻自己的力量，保護環境。
  - 環保的人──為了實踐自己生命的意義。
  - 喜歡出名的人──他吸引記者的注意，連總統都去看他。
  answer: D
  explanation: 課文內容只描述了賴桑思考生命的意義、決定種樹、買山種植以及面對困難時不放棄的態度，並沒有提到他喜歡出名、吸引記者或總統拜訪的資訊。
- question: 賴桑決定不使用化學肥料及除草劑的原因是什麼？
  options:
  - 為了讓草可以覆蓋土地。
  - 為了減少對環境的破壞。
  - 為了降低種樹成本。
  - 為了提升樹的價植。
  answer: B
  explanation: 雖然提供的課文內容並未直接提及賴桑不使用化學肥料及除草劑的具體原因，但從課文標題「森林大軍的守護者」以及賴桑選擇經營一個「不會被時間淘汰的事業」（暗示永續發展）並著手清理滿是垃圾的山林等情節來看，其行
- question: 賴桑妻子對他種樹行為的態度是什麼？
  options:
  - 充分理解並全力支援。
  - 不諒解，但後來接納。
  - 中立觀望，不干涉對方。
  - 起初支援，但後來失去信心。
  answer: B
  explanation: 課文中提到賴桑因忙碌工作「常被批評拋家棄子」，暗示家人（包括妻子）對其行為起初不諒解；而判斷題範例中提及「賴桑的家人從不支持轉變為支持」，說明其家人的態度後來有所轉變，因此妻子應是從不諒解到後來接納。
- question: 賴桑種樹，希望能達成許多目標，請問底下何者為非?
  options:
  - 在有生之年種植50萬棵樹木。
  - 讓更多人參與到種樹行列。
  - 吸引總統等名人，創造品牌形象。
  - 留下森林造福下一代子孫。
  answer: C
  explanation: 課文指出賴桑種樹的目標是思考生命的意義，經營一個不會被時間淘汰的事業，這反映了他追求長遠價值和造福後代的願望，而非吸引名人或創造品牌形象。課文中並未提及他有此商業導向的目標。
