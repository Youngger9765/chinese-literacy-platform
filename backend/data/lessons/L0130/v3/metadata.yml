intro: 這篇文章講述了正太從小立志成為武僧的故事。故事發生在日本奈良，正太在市集中目睹武僧的身手，心生嚮往。進入興福寺後，他並沒有立刻學到武功，而是接受了一項看似簡單卻極具挑戰性的任務：每天餵養一頭小豬。這項任務需要他日復一日地抱著逐漸長大的豬，爬上爬下、跨越門檻。透過這個過程，正太的體魄和意志力得到了磨練，展現了「滴水穿石、循序漸進」的道理。
