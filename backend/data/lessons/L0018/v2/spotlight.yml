spotlight:
  lesson: G4-L7
  strategy_name: 認識句型-遞進複句
  strategy_type: writing_technique
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: free_text
    prompt: 1.請依照下圖提示作答。
  - type: free_text
    prompt: (1)請問小傑跟阿光的車相同的地方是什麼？都跑得【  很快　  】
  - type: free_text
    prompt: (2)請問小傑跟阿光的車哪裡不一樣？小傑的車【   還很省油　  　】
  - type: single
    prompt: (3)誰的車子比較好？【□①小傑   □②阿光】，因為他的車子多了  【 省油       】的優點。
    options:
    - 【
    - 小傑
    - 阿光】，因為他的車子多了
    - 省油
    - 】的優點。
    answer: 【
  - type: single
    prompt: (4)小傑的車子「不但」跑得很快，「還」很省油。「不但……還……」這類把前後意思連起來的詞語，叫做【□①關聯詞　□②形容詞】
    options:
    - 關聯詞
    - 形容詞】
    answer: 關聯詞
  - type: free_text
    prompt: 2.請先圈出遞進關聯詞，再勾選作者最想強調的重點。
  - type: table
    rows:
    - - 課文句子
      - 作者想強調哪一句？(單選)
    - - １.
      - 但運動若是太過激烈（1）不只容易造成運動傷害（2）更無法達到促進長高的效果
      - □第(1)句□第(2)句
    - - '2.'
      - 如果常吃這類食物，（1）不但容易造成體重過重（2）也可能會影響生長激素的分泌，進而影響長高喔
      - □第(1)句□第(2)句
  - type: free_text
    prompt: 3. 讀一讀，把運動的兩個好處合成一句遞進複句
  - type: guide
    text: 由後句「明明都是男生，明明都叫承恩，身高卻差了近三十公分，他真的很不喜歡小承恩這個外號。」可推論。由後句「明明都是男生，明明都叫承恩，身高卻差了近三十公分，他真的很不喜歡小承恩這個外號。」可推論。
  - type: guide
    text: 七閱讀理解七閱讀理解請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
