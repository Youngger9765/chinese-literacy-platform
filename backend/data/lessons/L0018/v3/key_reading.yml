  passage: 適當的運動也是長高相當重要的一環。有氧運動能讓核心體溫適度上升，促進生長激素分泌，如：慢跑、游泳。另外，在做跳繩、籃球、羽球等運動時，常會頻繁跳躍，跳躍的動作也能刺激生長板發育。此外，弓箭步、深蹲等肌力訓練，及像瑜珈這樣的伸展運動，也都有助於成長發育。適當的運動能刺激成長，但若是太過激烈，不只容易造成運動傷害，更無法達到促進長高的效果。此外，均衡飲食也是關鍵。「多喝牛奶就可以長高」，其實是錯誤的迷思。蛋白質是人體重要的營養來源，富含蛋白質的食物包括雞蛋、牛奶、堅果、雞肉和鮭魚，這些都是健康的食物。不過，想長高，不能只靠某一種食物或單一營養。除了攝取蛋白質，也需要多吃綠色蔬菜，補充維生素，讓營養更均衡。同時，也要避免吃太多甜食、冰品與油炸食物。如果常吃這類食物，不但容易造成體重過重，也可能會影響生長激素的分泌，進而影響長高喔。
  start_text: 適當的運動也是長高相當重要的一環。有氧運動能讓核
