strategy_explained: 這一課我們要練習找出句子裡「越來越重要」的表達方式，這篇文章就在講睡眠、運動和飲食這三件事，怎麼一層一層地對我們長高越來越有幫助，讀的時候，你可以找找看，作者是怎麼說的，像是「不只...還...」或者「不但...更...」這種，讓句子聽起來更有力氣
