spotlight:
  lesson: G5-L11
  strategy_name: 推論策略-觀點找支持理由
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 一、連連看：請判斷以下的描述，是「觀點」，還是「支持理由」
  - type: table
    rows:
    - - '1.'
      - ①我認為「早上應該晚30分鐘到校，讓國中生多睡一點。」
      - ''
      - 'A.觀點

        （看法）'
    - - '1.'
      - ②研究發現，晚一點上學的國中生，缺曠課較少，白天也較不易打瞌睡
      - ''
      - 'A.觀點

        （看法）'
    - - '2.'
      - ③研究發現，戶外活動時間較多的兒童，近視率比較低。
      - ''
      - B.支持理由
    - - '2.'
      - ④我認為學生每天應該增加戶外活動時間。
      - ''
      - B.支持理由
  - type: guide
    text: 二、判斷觀點和支持理由的關係
  - type: guide
    text: 請讀一讀每個觀點，勾選能支持觀點的理由。（可複選）
  - type: free_text
    prompt: 1.基礎題（請打勾，多選）
  - type: multi
    prompt: (1)觀點：為了減少剩食，學校推出新菜色前，應先請部分學生試吃。
    options:
    - 某校依試吃意見調整新菜後，剩食少了三成。
    - 營養師表示，這道新菜含有足夠的蔬菜和蛋白質。
    - 學生反映咖哩太辣；降低辣度後，剩食明顯減少。
    - 這道新菜使用當季食材，食材費用比原來少了一成。
    answer:
    - 某校依試吃意見調整新菜後，剩食少了三成。
    - 營養師表示，這道新菜含有足夠的蔬菜和蛋白質。
    - 學生反映咖哩太辣；降低辣度後，剩食明顯減少。
    - 這道新菜使用當季食材，食材費用比原來少了一成。
  - type: multi
    prompt: (2)觀點：上課時，手機應統一放進教室的收納袋。
    options:
    - 某班實施後，上課查看手機的人次從每週十五次降為三次。
    - 小偉把手機放進收納袋後，不再一直看訊息，能專心完成練習。
    - 許多手機都有相機、鬧鐘和計算機等功能。
    - 同學使用的手機品牌、大小和外殼都不相同。
    answer:
    - 某班實施後，上課查看手機的人次從每週十五次降為三次。
    - 小偉把手機放進收納袋後，不再一直看訊息，能專心完成練習。
    - 許多手機都有相機、鬧鐘和計算機等功能。
    - 同學使用的手機品牌、大小和外殼都不相同。
  - type: free_text
    prompt: 2.課內練習（請打勾，多選）
  - type: multi
    prompt: (1)觀點：朱蒂是一個自立自強的人。
    options:
    - 她替神祕的資助人取了「長腿叔叔」這個綽號。
    - 她發現自己的程度落後後，主動訂定學習計畫。
    - 長腿叔叔要求她上大學後按時寫信，鍛鍊文筆。
    - 她靠自己的能力賺得稿費、獲得獎學金，還想償還資助。
    answer:
    - 她替神祕的資助人取了「長腿叔叔」這個綽號。
    - 她發現自己的程度落後後，主動訂定學習計畫。
    - 長腿叔叔要求她上大學後按時寫信，鍛鍊文筆。
    - 她靠自己的能力賺得稿費、獲得獎學金，還想償還資助。
  - type: multi
    prompt: (2)觀點：朱蒂的努力，是她克服學習困難的重要原因。
    options:
    - 面對數學和拉丁文不及格，她沒有逃避，仍繼續努力學習。
    - 長腿叔叔提供學費和生活費，讓她有機會進入大學。
    - 她持續閱讀與學習，從成績不及格進步到名列前茅。
    - 她在孤兒院沒有受到完整教育，知識比其他同學落後。
    answer:
    - 面對數學和拉丁文不及格，她沒有逃避，仍繼續努力學習。
    - 長腿叔叔提供學費和生活費，讓她有機會進入大學。
    - 她持續閱讀與學習，從成績不及格進步到名列前茅。
    - 她在孤兒院沒有受到完整教育，知識比其他同學落後。
  - type: guide
    text: ★策略帶著走
  - type: guide
    text: 讀文章時，先分清楚「觀點」和「支持理由」，再看看兩者是否接得起來：
  - type: guide
    text: ☆作者的觀點是什麼？
  - type: guide
    text: ☆哪些事實、例子或數據是支持理由？
  - type: guide
    text: ☆這些理由真的能支持觀點嗎？
