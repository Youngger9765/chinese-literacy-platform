passage: '朱蒂在孤兒院時沒能受到完整的教育，上大學後發現自己的知識遠遠落後其他同學，她從未看過「蒙娜麗莎的微笑」畫像，也沒聽說過「福爾摩斯」的名字；大一就面臨數學和拉丁文成績不及格的慘狀。許多人遇到這樣的情況，可能會因自卑而選擇逃避，或是把挫折歸咎於低微的出身；但朱蒂只讓自己失落一下下，很快就發揮她樂觀不怕失敗的個性，拾起戰鬥力。

  為了把18年的空白補回來，朱蒂為自己訂下有條不紊的學習計畫。她在信中提到每天都期待夜晚的到來，她會在門上掛著「忙碌中」的牌子，穿上舒服的浴袍和毛茸茸的拖鞋，泡一杯茶，點亮桌旁的電燈，然後開始閱讀各種書籍，享受其中。就這樣持續閱讀、努力學習，讓她的學業在短時間內脫穎而出，蛻變為成績名列前茅的「有料」女孩。'
