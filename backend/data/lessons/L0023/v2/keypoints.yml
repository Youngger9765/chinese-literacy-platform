    - sub_label: 故事大綱
      template: 描述孤兒朱蒂在「長腿叔叔」的__下進入大學，克服因__而導致的種種__困難，成為__的女性。
      blanks:
      - answer: 資助
        hint: ''
      - answer: 教育不足
        hint: ''
      - answer: 學習
        hint: ''
      - answer: 獨立
        hint: ''
  - label: 讀者自問自答
    value: 自問：朱蒂成功，只是得到貴人相助的好運嗎？自答：除了貴人相助，朱蒂__、自立自強的特質，也是她__的關鍵
    blanks:
    - answer: 勤奮不懈
      hint: ''
    - answer: 蛻變
      hint: ''
  - label: 從故事內容找支持「自答」的證據
    sub_rows:
    - sub_label: 勤奮不懈
      template: 1.在學業上，朱蒂有什麼困難？（請打勾，多選）□①在孤兒院沒有受到完整教育□②文化常識薄弱，也不認識名人□③大一時，數學及拉丁文成績不及格2.朱蒂如何克服困難：制定有條不紊的__，持續閱讀與學習。3.結果：朱蒂學業短時間內脫穎而出，成績名列前茅。
      blanks:
      - answer: 學習計畫
        hint: ''
    - sub_label: 自立自強
      template: 1.生活儉樸，不__資助的學費與生活費。2.靠自己能力賺錢、得獎學金時，想償還資助款。
      blanks:
      - answer: 濫用
        hint: ''
  - label: 讀者結論
    value: 除了貴人相助，朱蒂也把握機會、愈挫愈勇，不斷付出__，最後成為獨立自主的女性。
    blanks:
    - answer: 努力
      hint: ''
  title: 比運氣更重要的事：《長腿叔叔》的啟發
