strategy_explained: '這一課我們要練習的，是從文章裡找出作者認為比運氣更重要的特質，並且說出為什麼你會這樣想

  因為《長腿叔叔》的故事裡，朱蒂雖然得到資助，但她靠著自己的幽默、坦率、樂觀和勤奮，才能克服困難、越來越好，這些都是文章裡會提到、可以用來支持我們想法的具體例子

  讀的時候，你可以一邊讀一邊想：朱蒂做了什麼、說了什麼，讓你知道她不是只靠運氣，而是有哪些「品格」讓她成長，然後把這些找出來告訴大家'
