  items:
  - index: 1
    word: 貴人相助
    definition: 指在關鍵時刻得到有能力的人幫助。
  - index: 2
    word: 蛻變
    definition: 比喻經過改變後，變得更成熟、更好。
  - index: 3
    word: 傾注
    definition: 將全部心力投入在一件事情上。
  - index: 4
    word: 歸咎
    definition: 把過錯或責任推給別人或事物。
  - index: 5
    word: 低微
    definition: 地位、身分或聲望較低，不受重視。
  - index: 6
    word: 詼諧
    definition: 風趣幽默，帶有機智的趣味。
  - index: 7
    word: 瞥見
    definition: 用眼睛快速看到某個東西或情境，通常是一瞬間的動作。
  - index: 8
    word: 有條不紊
    definition: 形容做事有秩序，不慌亂。
  - index: 9
    word: 前衛
    definition: 走在潮流或時代的前端，具有創新性。
  - index: 10
    word: 名列前茅
    definition: 形容成績或表現排在前幾位。
  - index: 11
    word: 資助
    definition: 提供金錢或物資幫助別人。
  - index: 12
    word: 脫穎而出
    definition: 比喻在眾人之中顯露出色的才華或能力。
