lesson_uid: L0023
version_id: v3
section_no: 六
spotlight:
  strategy_name: 觀點找支持理由
  strategy_type: inference
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '本課一直強調一個觀點：「成功不只靠貴人相助，自己的努力也很重要。」為了讓讀者相信這個觀點，作者舉出朱蒂努力學習、自立自強的事例，作為支持理由。

      觀點和支持理由的關係，就像桌面和桌腳：桌面要有桌腳支撐，才站得穩；觀點也要有合理的理由支持，才更有說服力。

      觀    點：作者對事情提出的看法或主張。

      支持理由：用來說明觀點有道理的事實、例子或數據。'
    emphasis_note: 「成功不只靠貴人相助，自己的努力也很重要。」印成粗體
  - type: figure
    referent: 桌子比喻圖（棕色桌面標「觀點」，四支桌腳各標「支持理由」，配兩個對話框）
    text_carrier: image
    caption_lines:
    - 觀點：就是對事情的看法、意見。
    - 可以說服別人接受觀點的「證據（事實）」
    placement: 印在概念說明框中段，桌面標「觀點」、四支桌腳標「支持理由」
  - type: guide
    text: 　　這一課，先讓我們來認識什麼是「觀點」、什麼是「支持理由」，再看看支持理由如何讓觀點更有說服力。
  - type: guide
    text: ◎小試身手：
  - type: matching
    label: 一、連連看
    instruction: 一、連連看：請判斷以下的描述，是「觀點」，還是「支持理由」
    left_header: 描述
    right_header: 類別
    left:
      1: 我認為「早上應該晚30分鐘到校，讓國中生多睡一點。」
      2: 研究發現，晚一點上學的國中生，缺曠課較少，白天也較不易打瞌睡
      3: 研究發現，戶外活動時間較多的兒童，近視率比較低。
      4: 我認為學生每天應該增加戶外活動時間。
    right:
      A: 觀點（看法）
      B: 支持理由
    answers_printed: false
    answer_note: '教師版沒有畫連線 —— 該表兩側只有文字的 ● 圓點，逐頁看過沒有任何線條

      （對照組：本批 L0019 的連連看有清楚可見的黑線與紅線）。

      依題幹用語可推得 ①④→A（皆以「我認為」起頭）、②③→B（皆以「研究發現」起頭），

      但那是我推的、不是教材印的，所以不寫進 answer。

      ⚠️ 這跟「本題沒有標準答案」不同：本題有標準答案，只是教師版沒印，

      故**不標** no_correct_answer。'
  - type: guide
    text: 二、判斷觀點和支持理由的關係
  - type: guide
    text: 請讀一讀每個觀點，勾選能支持觀點的理由。（可複選）
  - type: sub_block
    label: 1.基礎題
    instruction: 1.基礎題（請打勾，多選）
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    items:
    - type: multi
      index: 1
      prompt: (1)觀點：為了減少剩食，學校推出新菜色前，應先請部分學生試吃。
      options:
        1: 某校依試吃意見調整新菜後，剩食少了三成。
        2: 營養師表示，這道新菜含有足夠的蔬菜和蛋白質。
        3: 學生反映咖哩太辣；降低辣度後，剩食明顯減少。
        4: 這道新菜使用當季食材，食材費用比原來少了一成。
      answers:
      - 1
      - 3
    - type: multi
      index: 2
      prompt: (2)觀點：上課時，手機應統一放進教室的收納袋。
      options:
        1: 某班實施後，上課查看手機的人次從每週十五次降為三次。
        2: 小偉把手機放進收納袋後，不再一直看訊息，能專心完成練習。
        3: 許多手機都有相機、鬧鐘和計算機等功能。
        4: 同學使用的手機品牌、大小和外殼都不相同。
      answers:
      - 1
      - 2
  - type: sub_block
    label: 2.課內練習
    instruction: 2.課內練習（請打勾，多選）
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
    items:
    - type: multi
      index: 1
      prompt: (1)觀點：朱蒂是一個自立自強的人。
      options:
        1: 她替神祕的資助人取了「長腿叔叔」這個綽號。
        2: 她發現自己的程度落後後，主動訂定學習計畫。
        3: 長腿叔叔要求她上大學後按時寫信，鍛鍊文筆。
        4: 她靠自己的能力賺得稿費、獲得獎學金，還想償還資助。
      answers:
      - 2
      - 4
    - type: multi
      index: 2
      prompt: (2)觀點：朱蒂的努力，是她克服學習困難的重要原因。
      options:
        1: 面對數學和拉丁文不及格，她沒有逃避，仍繼續努力學習。
        2: 長腿叔叔提供學費和生活費，讓她有機會進入大學。
        3: 她持續閱讀與學習，從成績不及格進步到名列前茅。
        4: 她在孤兒院沒有受到完整教育，知識比其他同學落後。
      answers:
      - 1
      - 3
  - type: concept_box
    label: ★策略帶著走
    text: '讀文章時，先分清楚「觀點」和「支持理由」，再看看兩者是否接得起來：

      ☆作者的觀點是什麼？

      ☆哪些事實、例子或數據是支持理由？

      ☆這些理由真的能支持觀點嗎？'
  slug: xw9rt
  text_ref: tqvdk
