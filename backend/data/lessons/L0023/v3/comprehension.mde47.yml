lesson_uid: L0023
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: C
    stem: 請問哪一個句子使用語詞正確？
    options:
      A: 螞蟻的視角非常「低微」，所以看見的世界與我們大不相同
      B: 這棵樹的枝葉從圍牆外「脫穎而出」，伸到了馬路上
      C: 他總是把失敗「歸咎」於運氣不好，而不願檢討自己的問題
      D: 我仔細「瞥見」了這本書的內容，覺得很有趣
    teacher_note: '第一題解析A.「低微」：地位、身分或聲望低下

      B.「脫穎而出」：人或事物的優秀表現。

      D.「瞥見」：短暫的看到'
  - index: 2
    answer: B
    answer_printed_as: Ｂ
    stem: 朱蒂如何彌補自己學識上的不足？
    options:
      A: 她選擇放棄困難課程，學習容易的科目
      B: 積極訂定計畫補足自己缺少的知識
      C: 她請長腿叔叔當家教老師輔導功課
      D: 她參加學校舉辦的晚間自習活動
    teacher_note: (第四段寫朱蒂沒有因程度落後而逃避，第五段則寫她訂定學習計畫、持續閱讀，答案是B)
  - index: 3
    answer: C
    stem: 請問這篇文章的主旨是什麼？
    options:
      A: 一個人只要有貴人相助，就能改變人生，獲得成功
      B: 這是一部浪漫的愛情故事，描述了朱蒂的感情發展
      C: 朱蒂的成功不只得到貴人相助，也來自她持續不懈的努力
      D: 朱蒂的成功來自長腿叔叔的幫助，沒有資助，她就無法成長
    teacher_note: (主旨首段及末段指出，真正的幸運要靠自己創造，朱蒂付出了無數努力才能成功。)
  - index: 4
    answer: A
    stem: 朱蒂與長腿叔叔的關係，為什麼能從單向資助逐漸走向平等交流？
    options:
      A: 朱蒂的努力與獨立見解，贏得長腿叔叔的理解與尊重
      B: 朱蒂發現長腿叔叔的真實身分後，立刻和他成為朋友
      C: 長腿叔叔決定不再擔任資助者，也不再提供任何幫助
      D: 朱蒂長大後和長腿叔叔合夥，一起資助其他孤兒
    teacher_note: 第七段指出，朱蒂的個性、努力與獨立見解，感動了長腿叔叔，能平等的交流想法。
  - index: 5
    answer: B
    stem: 根據本文，以下哪位同學的成長過程和朱蒂最相像？
    options:
      A: 小明因考試不及格，決定換個學校，選擇合適的環境學習
      B: 小芳家境貧困，但她積極努力，利用免費資源持續提升自己
      C: 小強因為家人支持，從不擔心成績問題，隨遇而安的生活
      D: 小玲學習講求效率，專注自己擅長的科目，弱科順其自然
