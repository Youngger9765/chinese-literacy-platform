intro: 這篇文章講述了日本男孩正太的故事。正太從小就嚮往成為一名武術高手，進入興福寺學習。然而，他的師父並沒有直接教他武功，而是交給他一項看似簡單卻充滿挑戰的任務：每天餵養一頭豬。這個任務需要他日復一日地抱著豬爬樓梯、跨門檻。隨著時間的推移，豬逐漸長大，正太的體能也因此得到了磨練。文章描寫了正太如何透過這項看似枯燥的訓練，逐漸成長為一個強壯有力的人。
