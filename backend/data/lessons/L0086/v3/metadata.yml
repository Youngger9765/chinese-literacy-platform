strategy_explained: '這一課，我們要練習的是「自己問自己問題」，就像偵探一樣，讀文章的時候主動問「這是什麼意思」「為什麼會這樣」

  這篇故事裡，正太每天抱著豬爬樓梯、跨門檻，看起來好像沒在學武功，你就該問自己「師父為什麼要這樣做」

  讀的時候，不妨像正太一樣，想想看為什麼做這件事，跟最後學到什麼有什麼關係'
