  strategy_type: self_questioning
  section_title_printed: 閱讀聚光燈：自我提問策略2
  section_subtitle_printed: ——讀出前後關係
  section_no_printed: 一
  section_no_note: 這個大題印的是「一」且排在最前面，後面的「讀全文-做記號」才又從「一」開始。見 sections_note。
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，18 個）
  structure_note: '⛔ 所有表格刻意留在 blocks 最上層、沒有塞進 sub_block ——

    `BlockSequenceRenderer` 的 `renderSubBlock` 不依 type 分派，巢狀的 fill_table

    只會畫出 instruction，`columns`/`rows` 整片消失而且不報錯。'
  blocks:
  - type: concept_box
    text: '自我提問策略：一邊讀、一邊問自己的讀書方法

      前一課的自我提問策略，是讓你練習閱讀時，每段都要問自己：「這段主要在說什麼？」這個策略能夠幫我們抓到段落的重點。

      但讀懂文章，不能只看懂個別的段落，也要看出前後內容怎麼連貫起來。這一課，我們要練習問自己：「這段和前面內容有什麼關係？」

      閱讀時，看到「可是、從此、所以、原來…」這類語詞，通常表示這一段和前面的內容有關。這時可以停一下，問自己：「這段和前面內容有什麼關係？」常見的前後文關係包括：前後反差、接續發展、過程與結果、疑問與回答。

      問完後，可以用三步驟幫自己回答：'
  - type: table
    prompt: 問完後，可以用三步驟幫自己回答：
    columns:
    - 步驟
    - 我要做什麼？
    rows:
    - - ❶讀這段
      - 看這段寫了什麼重要的事
    - - ❷找前面
      - 找前面段落中，哪些內容和這段最有關
    - - ❸說關係
      - 把這段和前面的內容連起來
    table_note: 這張三步驟表原稿印在概念框**裡面**（巢狀表格），此處拉到 blocks 最上層以免整片畫不出來。
  - type: guide
    text: 一、一邊讀，一邊問
  - type: guide
    text: '下表的左欄呈現「正太與小豬」這個有趣的故事，右欄則列出自我提問的問題，提醒你在關鍵地方停下來，把這段和前面連起來想。看到問題時，請做兩件事：

      ①先在心裡回答問題。

      ②回到課文，圈出「這段」和「前面」最有關的線索。'
  - type: fill_table
    prompt: 一、一邊讀，一邊問
    columns:
    - 正太與小豬：武僧的養成之路
    - 自我提問
    table_note: '課文全文在這張表裡**再印一次**（帶「（段N）」前綴），與後半「讀全文-做記號」的

      同一篇課文並存 —— 原稿如此，不是重複抽取。右欄五個提問依版面對齊到左欄的段落群。'
    rows:
    - 正太與小豬：武僧的養成之路: （段1）大約在兩百年前，日本奈良有一個叫正太的男孩，在市集裡幫媽媽賣菜。有兩個腰間掛著長刀的惡霸，經常來這裡欺負農民，跟小攤子收保護費。交不出錢來，就翻人家的菜攤，農民們都敢怒不敢言。有一天，來了一個僧人，身材瘦削的他，居然敢為農民們打抱不平。兩惡霸不但惡言相向，講沒兩句，居然動起手來。但這位僧人是「興福寺」裡的武僧，功夫了得，他以一敵二，兩三下就把帶著武器的惡霸打得抱頭鼠竄。旁觀的正太又是害怕，又是佩服，心想：「有一天，我也要去以武術聞名的興福寺學武功。」
      自我提問: 第1段主要在說什麼？
    - 正太與小豬：武僧的養成之路: '（段2）正太十四歲時終於進到興福寺，剃度成為小和尚。可是負責教他的師父並沒有教他武功，只是給他一頭小豬，比貓還要小，囑咐他說：「這是你的小豬，養在菜園後面的豬圈。每天三餐之後，你要把這隻小豬從菜園抱到廚房，餵牠吃廚餘。吃飽了，你再把牠抱回豬圈，這樣明白了嗎？」

        （段3）正太說：「明白了。」

        （段4）但他心裡不高興，私下嘀咕著說：「不教我武功就算了，還要叫我養豬？要從平地的豬圈走到半山腰的廚房？」可是他也沒辦法，誰叫他是全寺最菜的人呢，只好照做了。'
      自我提問: '第2～4段

        師父叫正太養豬，和他想學武功有什麼關係？'
    - 正太與小豬：武僧的養成之路: '（段5）從此，每天三次，正太要去豬圈抱小豬，走到廚房要經過200級的階梯，再跨過20道很高的門檻，等豬吃飽了，他再抱著豬走回去。

        （段6）「還好，豬這麼小。」正太看著這隻不到一斤重的小豬，心裡想著。

        （段7）經過了萬紫千紅的春天，暑氣蒸人的夏天，金風送爽的秋天，寒氣逼人的冬天。正太每天抱著豬上上下下，一天又一天，一年又一年，小豬慢慢長大，小豬變中豬，中豬變大豬了。'
      自我提問: '第5～7段

        正太每天抱小豬上下階梯，和前面的養豬任務有什麼關係？'
    - 正太與小豬：武僧的養成之路: '（段8）三年以後，這頭豬已經80公斤了，正太還抱得動這隻豬嗎？

        （段9）這時正太也長大了，他變得非常強壯，每天抱著這80公斤的大豬，上下200級階梯，來回20道門檻，一點都不成問題。'
      自我提問: '第8～9段

        正太抱得動大豬，和前面每天抱小豬有什麼關係？'
    - 正太與小豬：武僧的養成之路: '（段10）這麼重的豬，他怎麼抱得動呢？

        （段11）原來啊，豬本來小小的，很輕，但牠每天都長大一點點，這一點點的變化，抱的時候根本感覺不出來。每天加重一點點，加重一點點，根本感覺不出來有多難。在滴水穿石、循序漸進的努力之後，正太的筋骨肌肉慢慢適應這漸進的挑戰，過了一千多天，男孩變成身材魁梧、帥氣挺拔的男人，他跑得快、跳得高，能舉起寺裡最重的石臼，一般的匪徒強盜再也不是正太的對手了。'
      自我提問: '第10～11段

        這段怎麼解開前面「養豬和學武功有什麼關係」的疑問？'
  - type: guide
    text: 二、比較看看：自我提問後，有沒有幫助你抓到訊息間的關係？
