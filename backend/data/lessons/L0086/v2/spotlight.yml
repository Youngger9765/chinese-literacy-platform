spotlight:
  lesson: G7-L18
  strategy_name: 自我提問策略2-讀出關係
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: '自我提問策略：一邊讀、一邊問自己的讀書方法

      前一課的自我提問策略，是讓你練習閱讀時，每段都要問自己：「這段主要在說什麼？」這個策略能夠幫我們抓到段落的重點。

      但讀懂文章，不能只看懂個別的段落，也要看出前後內容怎麼連貫起來。這一課，我們要練習問自己：「這段和前面內容有什麼關係？」

      閱讀時，看到「可是、從此、所以、原來…」這類語詞，通常表示這一段和前面的內容有關。這時可以停一下，問自己：「這段和前面內容有什麼關係？」常見的前後文關係包括：前後反差、接續發展、過程與結果、疑問與回答。

      問完後，可以用三步驟幫自己回答：'
  - type: guide
    text: 一、一邊讀，一邊問
  - type: guide
    text: 下表的左欄呈現「正太與小豬」這個有趣的故事，右欄則列出自我提問的問題，提醒你在關鍵地方停下來，把這段和前面連起來想。看到問題時，請做兩件事：
  - type: single
    prompt: 請選擇
    options:
    - 先在心裡回答問題。
    - 回到課文，圈出「這段」和「前面」最有關的線索。
    answer: 先在心裡回答問題。
  - type: guide
    text: 二、比較看看：自我提問後，有沒有幫助你抓到訊息間的關係？
  - type: guide
    text: 請再讀一次2~4段，讀完後，先看看你現在比較接近哪一種理解？請打勾
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 如果你勾①或②，沒關係，表示你已經抓到一部分內容。接下來，我們要用自我提問，幫自己把理解推到層級③。
  - type: single
    prompt: 1.第2～4段，如果我要讀到層級③，最需要問自己哪一個問題？（３選１）
    options:
    - 這段主要在說什麼？
    - 這段和前面內容有什麼關係？
    - 這段讓我想到什麼道理？
    answer: 這段和前面內容有什麼關係？
  - type: free_text
    prompt: 2.要看出前後關係，不能只看這一段，也要回頭看前面。請依步驟把「前面線索」和「這段線索」連起來。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: single
    prompt: 3.你發現了嗎？問自己「這段和前面內容有什麼關係？」可以……
    options:
    - 幫我記住這一段發生了哪些事情，並回憶前一段發生哪些事情。
    - 幫我把這一段和前面的內容連起來，看出兩段之間的關係。
    answer: 幫我把這一段和前面的內容連起來，看出兩段之間的關係。
  - type: guide
    text: 三、換你試試看：
  - type: passage
    source: unknown
    paragraphs:
    - 現在換你試試看。每讀完一段，問「這段和前面內容有什麼關係？」接著用以下步驟讀出訊息間的關係：讀這段→找前面→說關係
  - type: guide
    text: （一）第5～7段
  - type: free_text
