  - type: guide
    text: 四、我的發現與自我檢核
  - type: free_text
    prompt: 1.我的發現：
  - type: single
    prompt: 請選出「這段和前面內容有什麼關係？」這個提問的功能：
    options:
    - 幫我看出：這段和前面哪裡不一樣、怎麼接著發展、出現什麼結果，或回答了什麼疑問。
    - 問自己這個問題，可以幫我記住故事裡先發生什麼、後發生什麼。
    answer: 幫我看出：這段和前面哪裡不一樣、怎麼接著發展、出現什麼結果，或回答了什麼疑問。
  - type: free_text
    prompt: 2.自我檢核
  - type: single
    prompt: □①我讀到重要段落時，會停下來問：「這段和前面內容有什麼關係？」
    options:
    - 我會先讀這一段重要的事，再回頭找前面有關的內容。
    - 我能把「這段」和「前面」的內容連起來，說出它們之間的關係。
    - 我以後閱讀故事或文章時，會試著用這個問題把段落連起來。
    answer: 我會先讀這一段重要的事，再回頭找前面有關的內容。
  - type: guide
    text: 接下來做什麼？
  - type: guide
    text: 恭喜你完成「自我提問策略」的練習了。
  - type: single
    prompt: 請選擇
    options:
    - 已經學過這篇課文：可以跳過後面的學習單，進入下一課。
    - 沒學過這篇課文：請繼續做後面的學習單，從「讀全文－做記號」開始。
    answer: 已經學過這篇課文：可以跳過後面的學習單，進入下一課。
