    referent: image
    asset: fig1.png
    bind_paragraph: 目標策略：自我提問策略2
  - type: guide
    text: 二念順順 二念順順
  - type: passage
    source: unknown
    paragraphs:
    - 請用計時器，從指定段落（七    )開始朗讀，計時1分鐘讀的字數，並記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！請用計時器，從指定段落（七    )開始朗讀，計時1分鐘讀的字數，並記錄在表格中。如果你計時3次後，對自己還不滿意，可以自己多練幾次喔。最後一次，找一位同學，請他來計時、記錄並簽名！
  - type: guide
    text: ◎ 我的表現
  - type: guide
    text: 本課語詞：敢怒不敢言、剃度、惡言相向、抱頭鼠竄、囑咐、萬紫千紅、暑氣蒸人、金風送爽、寒氣逼人、滴水穿石、循序漸進、身材魁梧、帥氣挺拔。本課語詞：敢怒不敢言、剃度、惡言相向、抱頭鼠竄、囑咐、萬紫千紅、暑氣蒸人、金風送爽、寒氣逼人、滴水穿石、循序漸進、身材魁梧、帥氣挺拔。請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：🅐
      從本課語詞框框，找語詞。🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。🅒 問同學。請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：🅐 從本課語詞框框，找語詞。🅑
      再回到課文讀讀看，這個解釋可能是哪個語詞的意思。🅒 問同學。三語詞我最棒 三語詞我最棒
  - type: free_text
    prompt: (1)    剃度        ：為了成為出家人而剃去頭髮的宗教儀式。
  - type: free_text
    prompt: (2)    萬紫千紅    ：形容百花盛開的景象。
  - type: free_text
    prompt: (3)    敢怒不敢言   ：心中有怒氣卻沒有勇氣說出來。
  - type: free_text
    prompt: (4)    寒氣逼人   ：形容非常寒冷。
  - type: free_text
    prompt: (5)    抱頭鼠竄    ：形容慌張逃走時狼狽尷尬的樣子。
  - type: free_text
    prompt: (6)    身材魁梧󠇠    ：形容身材高大雄偉。
  - type: free_text
    prompt: (7)    惡言相向    ：用惡劣或無禮、侮辱人的話罵人。
