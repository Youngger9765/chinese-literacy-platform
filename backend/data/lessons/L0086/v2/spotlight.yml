spotlight:
  lesson: G7-L18
  strategy_name: 自我提問策略2-讀出關係
  strategy_type: self_questioning
  blocks:
  - type: guide
    text: 自我提問策略：一邊讀、一邊問自己的讀書方法前一課的自我提問策略，是讓你練習閱讀時，每段都要問自己：「這段主要在說什麼？」這個策略能夠幫我們抓到段落的重點。但讀懂文章，不能只看懂個別的段落，也要看出前後內容怎麼連貫起來。這一課，我們要練習問自己：「這段和前面內容有什麼關係？」閱讀時，看到「可是、從此、所以、原來…」這類語詞，通常表示這一段和前面的內容有關。這時可以停一下，問自己：「這段和前面內容有什麼關係？」常見的前後文關係包括：前後反差、接續發展、過程與結果、疑問與回答。問完後，可以用三步驟幫自己回答：步驟我要做什麼？❶讀這段看這段寫了什麼重要的事❷找前面找前面段落中，哪些內容和這段最有關❸說關係把這段和前面的內容連起來
  - type: guide
    text: 一、一邊讀，一邊問
  - type: guide
    text: 下表的左欄呈現「正太與小豬」這個有趣的故事，右欄則列出自我提問的問題，提醒你在關鍵地方停下來，把這段和前面連起來想。看到問題時，請做兩件事：
  - type: single
    prompt: 請選擇
    options:
    - 先在心裡回答問題。
    - 回到課文，圈出「這段」和「前面」最有關的線索。
    answer: 先在心裡回答問題。
  - type: table
    rows:
    - - 正太與小豬：武僧的養成之路
      - 自我提問
    - - （段1）大約在兩百年前，日本奈良有一個叫正太的男孩，在市集裡幫媽媽賣菜。有兩個腰間掛著長刀的惡霸，經常來這裡欺負農民，跟小攤子收保護費。交不出錢來，就翻人家的菜攤，農民們都敢怒不敢言。有一天，來了一個僧人，身材瘦削󠇡的他，居然敢為農民們打抱不平。兩惡霸不但惡言相向，講沒兩句，居然動起手來。但這位僧人是「興福寺」裡的武僧，功夫了󠇡得，他以一敵二，兩三下就把帶著武器的惡霸打得抱頭鼠竄。旁觀的正太又是害怕，又是佩服，心想：「有一天，我也要去以武術聞名的興福寺學武功。」（段2）正太十四歲時終於進到興福寺，剃度成為小和尚。可是負責教他的師父並沒有教他武功，只是給他一頭小豬，比貓還要小，囑咐他說：「這是你的小豬，養在菜園後面的豬圈󠇡。每天三餐之後，你要把這隻小豬從菜園抱到廚房，餵牠吃廚餘。吃飽了，你再把牠抱回豬圈，這樣明白了嗎？」（段3）正太說：「明白了。」（段4）但他心裡不高興，私下嘀咕著說：「不教我武功就算了，還要叫我養豬？要從平地的豬圈走到半山腰的廚房？」可是他也沒辦法，誰叫他是全寺最菜的人呢，只好照做了。（段5）從此，每天三次，正太要去豬圈抱小豬，走到廚房要經過200級的階梯，再跨過20道很高的門檻，等豬吃飽了，他再抱著豬走回去。（段6）「還好，豬這麼小。」正太看著這隻不到一斤重的小豬，心裡想著。（段7）經過了萬紫千紅的春天，暑氣蒸人的夏天，金風送爽的秋天，寒氣逼人的冬天。正太每天抱著豬上上下下，一天又一天，一年又一年，小豬慢慢長大，小豬變中豬，中豬變大豬了。（段8）三年以後，這頭豬已經80公斤了，正太還抱得動這隻豬嗎？（段9）這時正太也長大了，他變得非常強壯，每天抱著這80公斤的大豬，上下200級階梯，來回20道門檻，一點都不成問題。（段10）這麼重的豬，他怎麼抱得動呢？（段11）原來啊，豬本來小小的，很輕，但牠每天都長大一點點，這一點點的變化，抱的時候根本感覺不出來。每天加重一點點，加重一點點，根本感覺不出來有多難。在滴水穿石、循序漸進的努力之後，正太的筋骨肌肉慢慢適應這漸進的挑戰，過了一千多天，男孩變成身材魁梧、帥氣挺拔的男人，他跑得快、跳得高，能舉起寺裡最重的石臼，一般的匪徒強盜再也不是正太的對手了。
      - 第1段主要在說什麼？第2～4段師父叫正太養豬，和他想學武功有什麼關係？第5～7段正太每天抱小豬上下階梯，和前面的養豬任務有什麼關係？第8～9段正太抱得動大豬，和前面每天抱小豬有什麼關係？第10～11段這段怎麼解開前面「養豬和學武功有什麼關係」的疑問？
  - type: guide
    text: 二、比較看看：自我提問後，有沒有幫助你抓到訊息間的關係？
  - type: guide
    text: 請再讀一次2~4段，讀完後，先看看你現在比較接近哪一種理解？請打勾
  - type: table
    rows:
    - - 讀完第2～4段的文字後，我……
      - 理解層級
    - - 讀到：□①師父沒有教正太武功，只叫他養小豬
      - 理解層級①嗯，能讀到這段發生的事
    - - 讀到：□②正太不高興，他想學武功，師父卻要他養豬
      - 理解層級②不錯！看到前後的反差—從充滿期待→失望生氣
    - - 想問：□③正太想學武功，師父卻要他養小豬，我想問：「奇怪，養豬和學武功有什麼關係？」
      - 理解層級③太讚了！你把這段和前面的內容連起來了
  - type: guide
    text: 如果你勾①或②，沒關係，表示你已經抓到一部分內容。接下來，我們要用自我提問，幫自己把理解推到層級③。
  - type: single
    prompt: 1.第2～4段，如果我要讀到層級③，最需要問自己哪一個問題？（３選１）
    options:
    - 這段主要在說什麼？
    - 這段和前面內容有什麼關係？
    - 這段讓我想到什麼道理？
    answer: 這段主要在說什麼？
  - type: free_text
    prompt: 2.要看出前後關係，不能只看這一段，也要回頭看前面。請依步驟把「前面線索」和「這段線索」連起來。
  - type: table
    rows:
    - - 步驟
      - 勾選正確答案
    - - ❶讀這段
      - 第2～4段接著寫了什麼重要的事？□①師父沒有教正太武功，只給他一頭小豬，要他每天抱去餵食。□②正太十四歲進入興福寺後，成為全寺最菜的僧人。
    - - ❷找前面
      - 這件事和第1段哪個內容最有關？□①正太看到武僧打敗惡霸，心裡又害怕又佩服。□②正太心想：「有一天，我也要去以武術聞名的興福寺學武功」。
    - - ❸說關係
      - 把「這段」和「前面」連起來，哪個理解比較完整？□①正太進入興福寺後，沒有立刻學到武功，只好先完成師父交代的養豬工作□②正太原本想學武功，但師父卻安排他養小豬，讓人想問：養豬和學武功有什麼關係？
  - type: single
    prompt: 3.你發現了嗎？問自己「這段和前面內容有什麼關係？」可以……
    options:
    - 幫我記住這一段發生了哪些事情，並回憶前一段發生哪些事情。
    - 幫我把這一段和前面的內容連起來，看出兩段之間的關係。
    answer: 幫我記住這一段發生了哪些事情，並回憶前一段發生哪些事情。
  - type: guide
    text: 三、換你試試看：
  - type: passage
    source: lesson_text
    paragraphs:
    - 現在換你試試看。每讀完一段，問「這段和前面內容有什麼關係？」接著用以下步驟讀出訊息間的關係：讀這段→找前面→說關係
  - type: guide
    text: （一）第5～7段
  - type: free_text
    prompt: 1.□我已經先問自己：「這段和前面內容有什麼關係？」
  - type: free_text
    prompt: 2.找出訊息間的關係
  - type: table
    rows:
    - - 步驟
      - 勾選正確答案
    - - ❶讀這段
      - 第5～7段接著寫了什麼重要的事？□①正太覺得小豬很輕，所以認為師父安排的任務其實不困難。□②正太每天三次抱豬上下階梯，日子一天天過去，小豬也慢慢長大。
    - - ❷找前面
      - 這件事和前面哪個內容最有關？□①正太心裡不高興，但因為自己是全寺最菜的人，只好照做。□②師父沒有教正太武功，只給他一頭小豬，要他每天抱去餵食。
    - - ❸說關係
      - 把「這段」和「前面」連起來，哪個理解比較完整？□①前面說師父安排養豬任務，這段說正太每天反覆抱豬上下階梯到半山腰，這件事開始像長期練習。□②前面說正太被安排養小豬，這段說他每天照顧小豬，慢慢適應寺裡的生活。
    - - 我看見的關係
      - □①前後反差：這段文字和前面有非常大的轉折□②接續發展：這段文字進一步說明故事接著怎麼發展    □③疑問與回答：這段文字回答了前面的故事提出來的疑問提示：前面說師父安排養豬，這段接著說正太每天抱豬上下階梯。
  - type: guide
    text: （二）第8～9段
  - type: free_text
    prompt: 1.□ 我已經先問自己：「這段和前面內容有什麼關係？」
  - type: free_text
    prompt: 2.找出訊息間的關係
  - type: table
    rows:
    - - 步驟
      - 勾選正確答案
    - - ❶讀這段
      - 哪一選項最能說明第8～9段中最關鍵的事？ □①三年以後，小豬已經長到80公斤，變成一頭很重的大豬。□②三年以後，正太變得非常強壯，抱著80公斤的大豬上下階梯也不成問題。
    - - ❷找前面
      - 這件事和前面哪個內容最有關？□①正太一開始覺得小豬不到一斤重，抱起來還好。□②正太每天抱著豬上上下下，日子一天一天、一年一年過去。
    - - ❸說關係
      - 把「這段」和「前面」連起來，哪個選項最能說明整個故事？□①前面說正太每天抱豬上下階梯，這段說他變得強壯→前面是練習的過程，這段是練習後的結果。□②前面說小豬慢慢長大，這段說小豬長到80公斤，正太仍然要照顧牠。
    - - 我看見的關係
      - □①故事寫出練習帶來的結果    □②故事回答了什麼疑問關係：前面寫正太每天抱豬練習，這段寫結果：他變得強壯。
  - type: guide
    text: （三）第10～11段
  - type: free_text
    prompt: 1.□ 我已經先問自己：「這段和前面內容有什麼關係？」
  - type: free_text
    prompt: 2.找出訊息間的關係
  - type: table
    rows:
    - - 步驟
      - 勾選正確答案
    - - ❶讀這段
      - 第10～11段接著寫了什麼重要的事？□①正太的筋骨肌肉慢慢適應挑戰，最後變得強壯。□②小豬每天長大一點，三年過去，變成80公斤。
    - - ❷找前面
      - 這件事和前面哪個內容最有關？□①養豬和學武功有什麼關係？□②正太為什麼要進興福寺？
    - - ❸說關係
      - 把「這段」和「前面」連起來，哪個理解比較完整？□①正太每天抱豬，所以慢慢習慣照顧牠，已經不會不高興了。□②每天抱豬不是無關的雜事，而是讓正太循序漸進變強的關鍵。
    - - 我看見的關係
      - □①故事補充前面的經過    □②故事回答前面的疑問關係：原來養豬是在訓練正太慢慢變強。
  - type: guide
    text: 四、我的發現與自我檢核
  - type: free_text
    prompt: 1.我的發現：
  - type: single
    prompt: 請選出「這段和前面內容有什麼關係？」這個提問的功能：
    options:
    - 幫我看出：這段和前面哪裡不一樣、怎麼接著發展、出現什麼結果，或回答了什麼疑問。
    - 問自己這個問題，可以幫我記住故事裡先發生什麼、後發生什麼。
    answer: 幫我看出：這段和前面哪裡不一樣、怎麼接著發展、出現什麼結果，或回答了什麼疑問。
  - type: free_text
    prompt: 2.自我檢核
  - type: single
    prompt: □①我讀到重要段落時，會停下來問：「這段和前面內容有什麼關係？」
    options:
    - 我會先讀這一段重要的事，再回頭找前面有關的內容。
    - 我能把「這段」和「前面」的內容連起來，說出它們之間的關係。
    - 我以後閱讀故事或文章時，會試著用這個問題把段落連起來。
    answer: 我會先讀這一段重要的事，再回頭找前面有關的內容。
  - type: guide
    text: 接下來做什麼？
  - type: guide
    text: 恭喜你完成「自我提問策略」的練習了。
  - type: single
    prompt: 請選擇
    options:
    - 已經學過這篇課文：可以跳過後面的學習單，進入下一課。
    - 沒學過這篇課文：請繼續做後面的學習單，從「讀全文－做記號」開始。
    answer: 已經學過這篇課文：可以跳過後面的學習單，進入下一課。
  - type: passage
    source: unknown
    paragraphs:
    - 目標策略：自我提問策略2──讀出前後關係目標策略：自我提問策略2──讀出前後關係一讀全文-做記號一讀全文-做記號※ 如果你有做到下列事項，請在□內打勾。□
      請在不太了解的字、詞或句做記號。□ 重要的地方、喜歡的語詞、句子或段落做上記號。※ 如果你有做到下列事項，請在□內打勾。□ 請在不太了解的字、詞或句做記號。□
      重要的地方、喜歡的語詞、句子或段落做上記號。Level 7・記敘文Level 7・記敘文
