spotlight:
  lesson: G8-L10
  strategy_name: 推論策略-從多個例子推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: '有些文章，作者不會一開始就直接告訴你他的想法（觀點），反而先安排一連串相關的例子，讓你在閱讀的過程中慢慢發現：

      「啊！原來這些例子，是在為同一個觀點鋪路。」

      所以，讀這類文章時，不能只看到例子，而要學會：

      從作者舉的多個例子中，看到共同點，再結合文章的其他說明，推論作者真正想表達的觀點。

      例如：一篇文章寫道：

      「陳老師上課時，會用學生的日常生活例子說明重點，常停下來確認學生是否聽懂，也會鼓勵學生提出不同想法。」

      上段文字講了3個陳老師上課的習慣，請問，從這些例子裡，作者最可能想表達的觀點是什麼？

      □ A.陳老師教學經驗豐富    B.陳老師看重學生的理解

      虎襲事件的真相這篇文章，作者就是透過多個虎襲的例子，來表達作者的觀點。我們來練習用❶～❸的步驟「推論（歸納）作者的觀點」。

      【❶找例子】【❷找共同點】【❸找其他說明】【❹推論觀點】'
  - type: guide
    text: 一、步驟❶──找例子
  - type: passage
    source: unknown
    paragraphs:
    - A.課文中舉了不少老虎攻擊人例子，但每個例子提供的資訊不一樣。請你依課文把表1的【  】填寫完成，為下一步「找共同點」做準備。
  - type: guide
    text: 表1.  科貝處理的食人虎案例與老虎身體狀況
  - type: table
    rows:
    - - 作者舉的例子
      - 受害人數
      - 老虎身體狀況
    - - ①1907/雌虎
      - '436'
      - 右上、右下犬齒折斷
    - - ②1929/老邁雌虎
      - 【】
      - 【】，犬齒折斷門齒磨耗
    - - ③1930年代/雄虎
      - 【】
      - 【】斷裂，身上有多處【】
    - - ④1930年代/雌虎
      - 【】
      - 兩處舊槍傷，其中一處長期【】
    answers:
    - '64'
    - 爪子破損變形
    - '3'
    - 下顎犬齒
    - 槍傷
    - '4'
    - 化膿
  - type: guide
    text: 二、步驟❷──找共同點
  - type: free_text
    prompt: (1)先找出虎襲案例的共同點，作者想讓我們注意什麼？（請勾選，單選）
  - type: passage
    source: unknown
    paragraphs:
    - ①食人虎多有「老病傷」狀態（斷齒、槍傷），可能影響牠們的正常獵食
    - □②虎患畫面一次比一次可怕，表示老虎的習性愈來愈凶殘
    - □③隨著年代的推演，虎患愈來愈猖獗，食人虎愈來愈多
  - type: guide
    text: 三、步驟❸──找其他說明
  - type: passage
    source: unknown
    paragraphs:
    - 除了虎襲案例，作者還加了一段「為什麼人虎衝突會變多」的解釋。作者還補充了什麼訊息？（單選）
    - □①老虎因為被追捕和驚擾，變得更兇猛，才會更常闖入村落攻擊人
    - ②人口變多、村莊擴大，動物棲地被擠壓，人虎生活重疊，衝突增加
  - type: guide
    text: 四、步驟❹──推論作者觀點
  - type: passage
    source: unknown
    paragraphs:
    - 根據你在步驟❷「找到的共同點」與❸「作者其他說明」，推論作者最想表達的主要觀點為何？
  - type: multi
    prompt: 請選擇
    options:
    - 老虎吃人主要是天性凶殘，所以最有效的方法是全面獵殺，才能徹底杜絕虎患與恐懼
    - 老虎吃人不必然是天性，人類傷害與人口擴張也可能讓牠們難以正常獵食，增加了虎襲事件的機會
    - 文章重點在只要為老虎設立國家公園，以相機取代獵槍，當老虎有了庇護所，人虎衝突才能根除
    answer:
    - 老虎吃人主要是天性凶殘，所以最有效的方法是全面獵殺，才能徹底杜絕虎患與恐懼
    - 老虎吃人不必然是天性，人類傷害與人口擴張也可能讓牠們難以正常獵食，增加了虎襲事件的機會
    - 文章重點在只要為老虎設立國家公園，以相機取代獵槍，當老虎有了庇護所，人虎衝突才能根除
  - type: guide
    text: ※如果你三項都打勾，恭喜你
  - type: passage
    source: unknown
    paragraphs:
    - 表示你已經學會用 4 步驟「從多個例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！
  - type: table
    rows:
    - - 虎襲事件的真相：誰才是受害者？
    - - 虎患與危機（段1-3）
      - '1.1900年尼泊爾與印度交界的村民失蹤，找到柴刀、碎布與帶齒痕的殘骸，推定兇手是【】。

        2.虎患持續七、八年，圍剿失敗，許多村子成「死村」，田園荒蕪，兩國因虎襲喪生者累計多達【】人。'
    - - '調查與解除危機

        （段4-5）'
      - '1.1907年4月英國獵手科貝先訪察虎襲的【】來推定老虎的【】

        2.1907年5月科貝召集村民以噪音逼迫老虎衝入伏擊圈；科貝開槍擊倒猛虎

        3.發現雌虎右犬齒折斷，並推論斷齒很可能由【】造成。'
    - - 更多例子（段6）
      - '1.1929年虎襲四年內【】人喪命，雌虎老邁爪子破損變形、犬齒折斷、門齒磨耗

        2.1930年代一隻公虎殺害３個兒童，牠下顎犬齒斷裂、多處【】；另一隻母虎殺害４人，牠身上有兩處槍傷，其中一處長期化膿。'
    - - 棲地衝突：另一虎襲原因（段7）
      - 兩百年間人口倍增，人類對野生動物棲地【】，人虎活動範圍愈來愈【】後，衝突【】。
    - - 立場轉向（段8）
      - 科貝理解老虎吃人可能受【】與【】的影響，他放下獵槍，拾起【】、呼籲保護老虎；1936年協助建立印度第一個國家公園，成為老虎的【】。
    answers:
    - 孟加拉虎
    - '436'
    - 時間、地點與地形
    - 出沒路線
    - 槍擊
    - '64'
    - 槍傷
    - 蠶食鯨吞
    - 重疊
    - 增加
    - 老邁傷病
    - 棲地衝突
    - 相機
    - 庇護所
  - type: self_check
    items:
    - 我能找到這些例子提供的重要資訊。
    - 我能把這些例子合起來看，找出它們的共同點。
    - 我能根據例子的共同點與文中其他說明，推論出作者想表達的觀點
