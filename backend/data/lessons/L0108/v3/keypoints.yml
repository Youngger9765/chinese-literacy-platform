  rows:
  - label: 虎患與危機（段1-3）
    value: '1.1900年尼泊爾與印度交界的村民失蹤，找到柴刀、碎布與帶齒痕的殘骸，推定兇手是【　】。

      2.虎患持續七、八年，圍剿失敗，許多村子成「死村」，田園荒蕪，兩國因虎襲喪生者累計多達【　】人。'
    blanks:
    - answer: 孟加拉虎
    - answer: '436'
  - label: 調查與解除危機（段4-5）
    value: '1.1907年4月英國獵手科貝先訪察虎襲的【　】來推定老虎的【　】

      2.1907年5月科貝召集村民以噪音逼迫老虎衝入伏擊圈；科貝開槍擊倒猛虎。

      3.發現雌虎右犬齒折斷，並推論斷齒很可能由【　】造成。'
    blanks:
    - answer: 時間、地點與地形
    - answer: 出沒路線
    - answer: 槍擊
  - label: 更多例子（段6）
    value: '1.1929年虎襲四年內【　】人喪命，雌虎老邁爪子破損變形、犬齒折斷、門齒磨耗

      2.1930年代一隻公虎殺害３個兒童，牠下顎犬齒斷裂、多處【　】；另一隻母虎殺害４人，牠身上有兩處槍傷，其中一處長期化膿。'
    blanks:
    - answer: '64'
    - answer: 槍傷
  - label: 棲地衝突：另一虎襲原因（段7）
    value: 兩百年間人口倍增，人類對野生動物棲地【　】，人虎活動範圍愈來愈【　】後，衝突【　】。
    blanks:
