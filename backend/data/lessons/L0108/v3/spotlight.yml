lesson_uid: L0108
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略——從多個例子推論作者觀點
  strategy_type: inference
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）＋橘色手寫填空
  blocks:
  - type: concept_box
    text: '有些文章，作者不會一開始就直接告訴你他的想法（觀點），反而先安排一連串相關的例子，讓你在閱讀的過程中慢慢發現：

      「啊！原來這些例子，是在為同一個觀點鋪路。」

      所以，讀這類文章時，不能只看到例子，而要學會：

      從作者舉的多個例子中，看到共同點，再結合文章的其他說明，推論作者真正想表達的觀點。

      例如：一篇文章寫道：

      「陳老師上課時，會用學生的日常生活例子說明重點，常停下來確認學生是否聽懂，也會鼓勵學生提出不同想法。」'
  - type: single
    prompt: 上段文字講了3個陳老師上課的習慣，請問，從這些例子裡，作者最可能想表達的觀點是什麼？
    options:
      A: 陳老師教學經驗豐富
      B: 陳老師看重學生的理解
    answer: B
    note: 這一題與上面的說明文字同在一個外框內；選項用 A/B 而非 ①②
  - type: guide
    text: 虎襲事件的真相這篇文章，作者就是透過多個虎襲的例子，來表達作者的觀點。我們來練習用❶～❹的步驟「推論（歸納）作者的觀點」。
  - type: guide
    text: 【❶找例子】 【❷找共同點】 【❸找其他說明】 【❹推論觀點】
    text_note: 四個方框之間版面上印的是箭頭，但那是 Wingdings 符號（w:sym F0E0）、不在文字流裡，故不寫入箭頭字元
  - type: guide
    text: 一、步驟❶──找例子
  - type: guide
    text: 課文中舉了不少老虎攻擊人例子，但每個例子提供的資訊不一樣。請你依課文把表1的【　】填寫完成，為下一步「找共同點」做準備。
  - type: fill_table
    label: 表1.  科貝處理的食人虎案例與老虎身體狀況
    columns:
    - 作者舉的例子
    - 受害人數
    - 老虎身體狀況
    rows:
    - 作者舉的例子: ①1907/雌虎
      受害人數: '436'
      老虎身體狀況: 右上、右下犬齒折斷
      row_note: 第 1 列是已填好的示範，原稿沒有空格
    - 作者舉的例子: ②1929/老邁雌虎
      受害人數: 【　】
      受害人數_blanks:
      - answer: '64'
      老虎身體狀況: 【　】，犬齒折斷門齒磨耗
      老虎身體狀況_blanks:
      - answer: 爪子破損變形
    - 作者舉的例子: ③1930年代/雄虎
      受害人數: 【　】
      受害人數_blanks:
      - answer: '3'
      老虎身體狀況: 【　】斷裂，身上有多處【　】
      老虎身體狀況_blanks:
      - answer: 下顎犬齒
      - answer: 槍傷
    - 作者舉的例子: ④1930年代/雌虎
      受害人數: 【　】
      受害人數_blanks:
      - answer: '4'
      老虎身體狀況: 兩處舊槍傷，其中一處長期【　】
      老虎身體狀況_blanks:
      - answer: 化膿
  - type: guide
    text: 二、步驟❷──找共同點
  - type: single
    prompt: 先找出虎襲案例的共同點，作者想讓我們注意什麼？（請勾選，單選）
    options:
      1: 食人虎多有「老病傷」狀態（斷齒、槍傷），可能影響牠們的正常獵食
      2: 虎患畫面一次比一次可怕，表示老虎的習性愈來愈凶殘
      3: 隨著年代的推演，虎患愈來愈猖獗，食人虎愈來愈多
    answer: 1
  - type: guide
    text: 三、步驟❸──找其他說明
  - type: single
    prompt: 除了虎襲案例，作者還加了一段「為什麼人虎衝突會變多」的解釋。作者還補充了什麼訊息？（單選）
    options:
      1: 老虎因為被追捕和驚擾，變得更兇猛，才會更常闖入村落攻擊人
      2: 人口變多、村莊擴大，動物棲地被擠壓，人虎生活重疊，衝突增加
    answer: 2
  - type: guide
    text: 四、步驟❹──推論作者觀點
  - type: single
    prompt: 根據你在步驟❷「找到的共同點」與❸「作者其他說明」，推論作者最想表達的主要觀點為何？
    options:
      1: 老虎吃人主要是天性凶殘，所以最有效的方法是全面獵殺，才能徹底杜絕虎患與恐懼
      2: 老虎吃人不必然是天性，人類傷害與人口擴張也可能讓牠們難以正常獵食，增加了虎襲事件的機會
      3: 文章重點在只要為老虎設立國家公園，以相機取代獵槍，當老虎有了庇護所，人虎衝突才能根除
    answer: 2
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找到這些例子提供的重要資訊。
    - 2.我能把這些例子合起來看，找出它們的共同點。
    - 3.我能根據例子的共同點與文中其他說明，推論出作者想表達的觀點
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: guide
    text: '※如果你三項都打勾，恭喜你

      表示你已經學會用 4 步驟「從多個例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！'
