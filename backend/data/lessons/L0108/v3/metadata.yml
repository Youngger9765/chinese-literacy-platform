strategy_explained: '這篇文章要帶你練習，從文章裡舉出的各種情況，去猜作者心裡的想法是什麼

  因為這篇故事講到一隻老虎吃了很多人，但又問了老虎為什麼會這樣，還提到人類的影響，很適合讓你練習去想作者看到這些事，心裡是怎麼判斷的

  讀的時候，你可以試著想想，作者提到老虎吃了人、又提到人類的擴張，他是不是在暗示什麼，讓牠們變成這樣呢'
