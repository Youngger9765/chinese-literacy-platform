intro: 這篇文章講述了在二十世紀初，尼泊爾與印度邊境發生的駭人聽聞的「虎襲事件」。一隻孟加拉虎在七、八年的時間裡，造成了數百人喪生，讓當地居民陷入恐懼之中。英國獵人吉姆・科貝受邀前來，他如何運用觀察與智慧，一步步追蹤並最終制伏這隻猛虎？文章也探討了老虎為何會變成「食人虎」，以及人類活動對野生動物棲地的影響。透過這個真實的事件，我們將重新思考人與動物之間的關係。
