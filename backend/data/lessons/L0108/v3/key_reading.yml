  passage: 1907年4月，英國獵手吉姆・科貝抵達，局勢才出現轉機。他不盲目搜山，而是花幾星期走遍受虎襲的村莊，訪察歷次遇襲的時間與地形，據此推定這隻老虎的出沒路線，並發現牠多以老人、婦女與孩童為目標。5月12日，科貝召集了298名村民，人們舉火把、敲鐵鍋，自四面八方逼近老虎藏身處，噪音迫使老虎自山坳衝出，直闖谷底伏擊圈。科貝藏在榕樹後，待老虎離得只有幾步遠，他扣動扳機，子彈打中牠的胸口和肩膀。受傷猛虎嘶吼反撲，他又抓過同伴的槍，打中牠的腿，這隻危害村民多年的猛虎終於轟然倒地。半晌後，他蹲下扳開虎口，指著獠牙大喊：「你們看！」這隻雌虎右上犬齒斷了一半、右下犬齒齊根折斷，科貝判斷，這樣的斷齒很可能由槍擊造成。眾人這才明白：斷齒使牠無法正常獵捕水牛、花鹿與野豬，也可能迫使牠轉而攻擊較容易捕捉的人類。1929年，印度的另一個地區又發生虎襲事件，四年內共有64人喪命。科貝再次應邀為民除害，他在1,295平方公里的熱帶叢林裡，獵殺了一隻雌虎和牠的幼虎。雌虎已老邁，爪子破損變形，一隻犬齒折斷，門齒磨耗到接近牙床。1930年代，科貝又獵殺了兩頭食人虎：一隻公虎殺害了3個兒童，牠下顎犬齒斷裂，身上有多處槍傷；另一隻殺害4人的母虎，身上有兩處槍傷，其中一處已長期化膿。這些成為人們噩夢的食人虎都有什麼共同點？你發現了嗎？此外，從英國人1750年代在印度實際掌權後的兩百年間，當地總人口從一億八千萬成長到三億六千萬人。村莊與農園持續擴大，人類逐步蠶食鯨吞野生動物的棲地。人虎的活動範圍愈來愈重疊，衝突也隨之增加。了解老虎因老邁或受傷而難以正常獵食，以及人類侵占棲地、增加人虎接觸這兩重結構性因素後，科貝對老虎有了深深的同情，最後放下他愈顯沉重的獵槍，拿起相機，四處奔走呼籲保護老虎，1936年協助建立了印度第一個國家公園，這座公園後來以他的名字命名，成為老虎的庇護所。如今，公園博物館裡仍能看到那隻殺人數最多的老虎標本；最醒目的，正是牠那折斷的兩顆犬齒。
