  instruction: 請用計時器，從指定段落（四☞）開始朗讀，在底下表格記錄1分鐘讀的字數，如果你計時3次後，對自己還不滿意，可以多練幾次。最後一次，找一位同學，請他計時、記錄並簽名！
  char_count_note: "右緣「字數」欄從第 4 段（☞ 指定的起點）開始累計，末筆 348 落在第 5 段結束，\n第 6~8 段沒有標 —— 屬「字數欄提早停」的形狀，348 不是全文長度。\n\U0001F534 本課要**同時套三條 Word 口徑**才對得上，少任何一條都全盤落空：\n  ① 濾掉隱藏字元（Cf/Mn）\n  ② 含千分位逗號的整串數字算 1 個字（本段有「1,295」）\n  ③ **註腳文字算進去**（第 4 段「山坳」的註腳「兩山間凹下的地方」共 8 字）\n驗算：第 4 段本文 229 ＋ 註腳 8 ＝ 237 == 印的 237；\n      第 4+5 段本文 340 ＋ 註腳 8 ＝ 348 == 印的最後一個 348。\n只套 ①② 會得到 229 / 340，兩個都不在印出來的數列裡。"
