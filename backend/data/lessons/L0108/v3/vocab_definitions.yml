lesson_uid: L0108
version_id: v3
section_no: 三
vocab_definitions:
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  vocabulary_bank:
  - 邊陲
  - 殘骸
  - 日益猖獗
  - 攫取
  - 眾目睽睽
  - 荒蕪
  - 人心惶惶
  - 束手無策
  - 霧靄
  - 蠶食鯨吞
  answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  items:
  - index: 1
    word: 殘骸
    definition: 災難或事故後留下的破碎遺體、碎片。
  - index: 2
    word: 邊陲
    definition: 靠近國家或地區邊界的偏遠地方。
  - index: 3
    word: 日益猖獗
    definition: 一日比一日更嚴重，越來越難控制。
  - index: 4
    word: 人心惶惶
    definition: 大家都很害怕，氣氛緊張。
  - index: 5
    word: 束手無策
    definition: 「束手」：把手綁起來；「無策」：沒有辦法。想不出辦法、無能為力，只能乾著急。
  - index: 6
    word: 荒蕪
    definition: 土地無人耕作或缺乏生機，顯得雜草叢生、十分荒涼。
  - index: 7
    word: 攫取
    definition: 猛力抓住並奪走。
  - index: 8
    word: 霧靄
    definition: 瀰漫的霧氣，常使遠處景物顯得朦朧不清。
  - index: 9
    word: 眾目睽睽
    definition: 「眾目」：很多眼睛。許多人同時注視著。
  - index: 10
    word: 蠶食鯨吞
    definition: 「蠶食」：像蠶吃葉子，一口一口慢慢啃；「鯨吞」：像鯨魚吞食，吞很大一口。一點一點或大口大口地侵占別人的土地、資源，越占越多。
