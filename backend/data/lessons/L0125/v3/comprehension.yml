lesson_uid: L0125
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  answer_carrier: 橘色手寫代號（教師版答案，印在題號前的括號內），文字流有此資訊
  answers_note: 第 1、3 題的代號在原稿印的是全形「Ｄ」「Ｂ」，第 2、4、5 題是半形；這裡一律記半形
  teacher_notes_note: '第 1、3、5 題右側有深藍色（C:0F4761）的教師解析文字方塊；

    第 2、3、4 題另有印在選項行內的括號提示（如「(是學校未提供)」「(文中未提到)」「(第八段末行)」），

    那些是**印在題幹或選項後面的正文**，不是文字方塊，照原樣記在 stem/options 裡。'
  questions:
  - index: 1
    answer: D
    stem: 下列選項中，哪個句子中的詞語使用不正確？
    options:
      A: 小明看到同學摔倒，「自告奮勇」的上前幫忙，十分熱心
      B: 只要我們努力準備，相信「事在人為」，一定會有好結果的
      C: 如果火災發生時，消防隊來不及救援，後果將「不堪設想」
      D: 她們倆的交情「情有可原」，兩人從國小時期就是好朋友
    teacher_note: 「情有可原」指在特定情況下，行為或錯誤是可以被理解的，與該詞原意不符。
  - index: 2
    answer: A
    stem: 文章提到二審法官判定陳同學也需賠償顏家，何者是法官做出此判決的原因？(第六段，二審法官的理由)
    options:
      A: 法官認為陳同學雖是好心，也要考量自身能力
      B: 法官認為陳同學已經發揮照顧同學的美德，情有可原
      C: 法官認為陳同學沒有提供無障礙設施給顏同學(是學校未提供)
      D: 法官認為家屬的延誤就醫是導致顏同學死亡的主因
  - index: 3
    answer: B
    stem: 緒恩舉手發問機車騎士扶老爺爺事件時，越說越激動，請你推測一下，讓緒恩情緒激動的背後原因是什麼？
    options:
      A: 他很生氣機車騎士居然不禮讓老人，害人受傷
      B: 他覺得機車騎士好心沒好報，因而忿忿不平
      C: 他認為機車騎士假好心，根本不是真心要幫人
      D: 緒恩以前也遇過類似的經驗，所以非常生氣(文中未提到)
    teacher_note: (B由第一段可知緒恩認為好心沒好報，所以質疑助人為快樂之本不合理。)
  - index: 4
    answer: B
    stem: 第八段第4行，雅柔說：「如果是我，我會先哭死，再氣死。」請問她話中的「我」，指的是誰？(第八段末行)
    options:
      A: 陳同學家人
      B: 顏同學家屬
      C: 陳同學
      D: 顏同學
    options_note: 四個選項印在同一行（A.陳同學家人　B.顏同學家屬　C.陳同學　D.顏同學），不是各佔一行
  - index: 5
    answer: C
    stem: 作者透過這篇文章想要達成什麼目的？請選出最可能的答案。
    options:
      A: 說明法官不太可能處罰熱心助人的行為
      B: 主張最好不要主動幫助別人，以免惹上麻煩
      C: 用爭議事件引發關注，從不同角度深入思考問題
      D: 說明法律可以解決許多糾紛，未來可考慮當法官
    teacher_note: 最末段，世界上常出現兩難的狀況，這些問題必須要透過多方討論及思考才能做出適當的決定。
