  passage: 一時之間，同學們的回應此起彼落。雅柔說：「我對顏家的悲傷痛苦可以感同身受，自己的孩子早上好好的去上學，上個體育課就天人永隔了。而一審法官的意思是，這沒辦法，大家都不是故意的，沒有人需要負責。如果是我，我會先哭死，再氣死。」承熹說：「陳同學自告奮勇幫助同學，如果還被處罰，這樣以後誰還敢去幫助同學？好心沒好報，二審的判決真是讓人氣餒。」語菲說：「我認為最高法院的判決最有道理，畢竟事在人為，如果學校本來就有提供為顏同學設計的體育課，這件悲劇就不會發生。陳同學熱心助人，卻造成不幸的結果，法官認為情有可原，不必負過失責任，也可以避免因噎廢食，讓整個社會大眾以後都不敢主動幫助別人了。」景杰老師說：「哇嗚，沒想到年紀輕輕的你們都這麼有想法，以後可以考慮當法官了。是的，這世界經常出現這種兩難、沒有簡單答案的問題，但今天在這裡，我們聽到了大家不同的意見，這樣我們才會有機會做出最適當的決定。今天的討論真精采，我對下一次上課充滿期待哦。」
