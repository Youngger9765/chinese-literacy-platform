lesson_uid: L0125
version_id: v3
section_no: 六
spotlight:
  strategy_name: 推論策略——推論人物行為的背後動機
  strategy_type: comprehension_strategy
  section_title_printed: 閱讀聚光燈
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE，在文字層，4 個）＋ 橘色手寫填空
  blocks:
  - type: concept_box
    text: '若看到「中學生墜樓輕生」或「國中學長霸凌新生」的新聞，你難免就會想進一步了解「為什麼他（她）會做這件事？」也就是說，人們總是還會想進一步了解行為（如墜樓或霸凌）背後的「動機」。而在文章中，人物的動機可能會「明示（明白的寫出來）」，但也可能「隱含（在情節中）」，例如：

      (1)明示：陳同學基於熱心抱顏同學到地下室上課。

      →陳同學抱顏同學到地下室的動機是熱心助人。

      (2)隱含：❶他上課時偷偷看了好幾次手機上的時間。

      →他急著想處理一些事，想要快點下課。

      ❷同學從他身邊走過，他立刻用身體擋住正在寫的卡片。

      →卡片要寫給誰、裡頭寫了什麼？他不想讓人知道。

      當人物的動機沒有直接寫出時，我們可以根據事情發生的背景、人物當時的處境、言行和反應，以及人物特質，推論他這樣做的原因或目的。

      小叮嚀：隱含動機的答案可能不只一個，但都要有課文線索支持，並符合情節發展，才是合理而有說服力的推論。'
    text_note: '原稿在「當人物的動機沒有直接寫出時…」與「小叮嚀…」兩段前面各印一個 ☞ 圖示（圖片 127），

      是圖不是字元，所以不寫進 text。'
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 一、人物動機「明示」在課文內文中
  - type: sub_block
    label: 明示 1
    value: '1.摔倒時，陳同學仍緊抱顏同學，將自己當成肉墊，保護著他。

      →陳同學的動機是想要【　】。'
    blanks:
    - answer: 保護顏同學
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: single
    prompt: '2.顏同學還告訴校護及導師：「不是陳同學的錯，請不要處罰他。」

      →顏同學的動機是(  )陳同學被學校處罰'
    options:
      1: 希望
      2: 不希望
    answer: 2
  - type: sub_block
    label: 明示 3
    value: '3.顏家對陳同學、學校提起民事訴訟。

      →顏家的動機是希望【　】。(課文第五段)'
    blanks:
    - answer: 有人為這件事情負責
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
  - type: guide
    text: 二、人物動機「隱含」在課文內文中
  - type: single
    prompt: '1.景杰老師沒有直接回答緒恩，反而講述玻璃娃娃事件，並請全班說說對法院判決的想法。

      →根據你的推測，景杰老師這樣做的動機可能是：（單選）'
    options:
      1: 希望學生比較三次判決的結果與理由
      2: 希望學生從不同角度思考兩難問題
      3: 希望學生了解助人之前應先衡量能力
    answer: 2
  - type: multi
    prompt: '2.校方與顏家共同成立「顏旭男急難救助獎學金」。

      →根據你的推測，他們成立這項獎學金的動機可能是：（多選）'
    options:
      1: 希望繼續向社會大眾募集賠償金
      2: 希望幫助其他遭遇急難的學生
      3: 希望紀念意外身亡的顏同學
      4: 希望證明法院做出了錯誤判決
    answers:
    - 2
    - 3
  absent_note: ⚠️ 本課聚光燈**沒有印「◎自我檢核」那一段**（L0116、L0123 都有）。這是原稿如此，不是漏抽。
