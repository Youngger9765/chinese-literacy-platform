intro: 這篇文章透過景杰老師的公民課，引導學生探討「好心卻可能沒好報」的社會現象。課文中首先提及一個路人扶起跌倒老翁卻反遭誣告的事件，接著深入介紹了2000年發生的「玻璃娃娃」顏旭男在校意外死亡的真實案例。文中詳細描述了顏同學的病情、意外發生的經過，以及他因摔倒後顱內出血而不幸身亡的結局。隨後，文章聚焦於此事件引發的社會爭議，特別是關於協助顏同學的陳同學以及學校是否需要負起法律責任的討論。最後，透過學生的發言，呈現了不同角度的觀點，引發對這類複雜事件的思考。
