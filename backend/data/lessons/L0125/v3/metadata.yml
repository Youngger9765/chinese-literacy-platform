strategy_explained: '這一課我們要練習「讀懂別人為什麼會這樣做」的能力

  這篇故事裡，有路人扶老人被誣告，還有玻璃娃娃的意外事件，這些事情背後有很多不同的想法和原因，很適合我們練習去猜測人物的心裡在想什麼

  讀的時候，你可以想想看，他們為什麼要那樣做，是不是有什麼特別的原因，或是他們在擔心什麼'
