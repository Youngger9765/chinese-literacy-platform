spotlight:
  lesson: G8-L5
  strategy_name: 推論策略-推論人物行為的背後動機
  strategy_type: motivation_inference
  blocks:
  - type: guide
    text: ◎ 小試身手：
  - type: guide
    text: 一、人物動機「明示」在課文內文中
  - type: free_text
    prompt: 1.摔倒時，陳同學仍緊抱顏同學，將自己當成肉墊，保護著他。
  - type: passage
    source: unknown
    paragraphs:
    - →陳同學的動機是想要【　　保護顏同學    】。
  - type: free_text
    prompt: 2.顏同學還告訴校護及導師：「不是陳同學的錯，請不要處罰他。」
  - type: passage
    source: unknown
    paragraphs:
    - →顏同學的動機是(　□①希望　　□②不希望　)陳同學被學校處罰
  - type: free_text
    prompt: 3.顏家對陳同學、學校提起民事訴訟。
  - type: passage
    source: unknown
    paragraphs:
    - →顏家的動機是希望   有人為這件事情負責           。(課文第五段)
  - type: guide
    text: 二、人物動機「隱含」在課文內文中
  - type: free_text
    prompt: 1.景杰老師沒有直接回答緒恩，反而講述玻璃娃娃事件，並請全班說說對法院判決的想法。
  - type: passage
    source: unknown
    paragraphs:
    - →根據你的推測，景杰老師這樣做的動機可能是：（單選）
    - □①希望學生比較三次判決的結果與理由
    - □②希望學生從不同角度思考兩難問題
    - □③希望學生了解助人之前應先衡量能力
  - type: free_text
    prompt: 2.校方與顏家共同成立「顏旭男急難救助獎學金」。
  - type: passage
    source: unknown
    paragraphs:
    - →根據你的推測，他們成立這項獎學金的動機可能是：（多選）
    - □①希望繼續向社會大眾募集賠償金
    - □②希望幫助其他遭遇急難的學生
    - □③希望紀念意外身亡的顏同學
    - □④希望證明法院做出了錯誤判決
  - type: guide
    text: 「情有可原」指在特定情況下，行為或錯誤是可以被理解的，與該詞原意不符。「情有可原」指在特定情況下，行為或錯誤是可以被理解的，與該詞原意不符。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  - type: guide
    text: 七閱讀理解七閱讀理解
