passage: '2.當天家長通知校方暫不送醫，家長的延誤可能是導致顏同學離世的原因，故學校無故意過失。

  1.陳同學的確是好心協助，但是助人時應先考量自己的能力，因為自己的疏忽導致顏同學不幸離世，須負過失責任。

  2.學校未提供無障礙設施及個別化體育教學給顏同學，導致意外發生，須負過失責任。

  1.陳同學只有16歲，經驗有限，意外發生的當下已盡了最大努力保護顏同學，不應苛責。

  2.學校未提供無障礙設施及個別化體育教學給顏同學，導致意外發生，須負80%過失責任。

  3.顏爸爸延誤就醫，導致顏同學死亡，應自負20%過失責任。

  陳同學、學校再上訴最高法院。

  雙方接受判決。校方與家屬成立顏旭男急難救助獎學金。

  景杰老師說完這個故事後，全班安靜了好一陣子，老師才說：「聽了這個故事，大家對法院的判決有什麼想法呢？」'
