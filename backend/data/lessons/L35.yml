multiple_choice:
- question: 下列選項「」中的語詞，何者使用正確？
  options:
  - 看到未成年學生犯罪的重大新聞後，他忍不住氣得「拍案叫絕」。
  - 這名網紅為了按讚數，不斷揭人隱私，誇張言行令人「嘆為觀止」。
  - 激烈運動後「津津樂道」的猛灌冰水，血管快速收縮，反而不舒服。
  - 聽說他曾經是富二代，可惜現在「家道中落」，經濟已經不比從前了。
  answer: D
  explanation: 「家道中落」是指本來家裡有錢、有權勢，後來漸漸沒錢、沒權了，選項D中描述「曾經是富二代，可惜現在經濟已經不比從前了」，與其定義完全吻合。
- question: 「這樣的觀察與推理，人人都辦得到，只要培養推論的習慣，你會開始以不一樣的眼光看這個世界」關於這段話的詮釋，下列何者正確？
  options:
  - 只要好好地觀察與推理，人人都可以成為名偵探。
  - 培養推論的習慣有助於改善視力，會看得更清楚。
  - 不懂觀察與推理的人，也看不見這個世界的美好。
  - 擁有推論的習慣，往往能看見別人沒發現的細節。
  answer: D
  explanation: 「以不一樣的眼光看這個世界」意指透過推論的習慣，能夠洞察到常人不易察覺的細節和真相。
- question: 根據本文的內容，下列敘述何者正確？
  options:
  - 福爾摩斯與王戎兩人都擅長觀察與推理，也是著名的偵探。
  - 福爾摩斯與王戎遇事時會先冷靜觀察，經過思考後再行動。
  - 福爾摩斯透過觀察帽子的款式、用料，推論出帽主的年紀。
  - 王戎吃過路邊的野生李子，知道它又苦又澀，所以不肯摘。
  answer: C
  explanation: 文中明確提到利用福爾摩斯對帽主的推理進行練習，並列出「細心的觀察」、「背景知識」、「進行推論」的步驟，雖然範例內容未完整提供，但選項C描述了福爾摩斯透過觀察帽子推論帽主資訊的行為，與課文引入福爾摩斯帽
- question: 下列選項，何者的做法「不符合」本文說的推理三要素？
  options:
  - 總是細心觀察身旁發生的人、事、物。
  - 遇到問題就請教專家或老師。
  - 持續且廣泛的閱讀，增加大腦知識量。
  - 時常思考推理，了解事件的因果關係。
  answer: B
  explanation: 推理的三要素是「細心的觀察」、「具備背景知識」和「慣於推論」。向專家或老師請教是一種獲取知識或解決問題的方法，而非推理本身的要素或構成推理的行為。
