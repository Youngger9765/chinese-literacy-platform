vocabulary:
- word: 津津樂道
  definition: 很感興趣地談論。
- word: 趨勢
  definition: 事情發展的方向。
- word: 傳遞
  definition: 傳達東西或消息。
- word: 家道中落
  definition: 本來家裡有錢、有權勢，後來漸漸沒錢、沒權了。
- word: 力圖
  definition: 盡最大的努力試著達成。
- word: 相仿
  definition: 差不多。
- word: 結實纍纍
  definition: 植物結了很多果實。
- word: 家境殷實
  definition: 家裡財力雄厚，非常有錢。
- word: 拍案叫絕
  definition: 拍桌子叫好，表示對看到或聽到的事感到驚嘆。
- word: 嘆為觀止
  definition: 形容事物極好，讓人看了都不停讚嘆。
