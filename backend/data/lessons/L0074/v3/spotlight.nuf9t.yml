lesson_uid: L0074
version_id: v3
section_no: 五
spotlight:
  strategy_name: 摘要策略──問題—解決—結果找重點
  strategy_type: summary
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）；另有 2 處是橘色手寫（見各 block 的 answer_carrier）
  blocks:
  - type: concept_box
    text: '這是一篇報導式說明文，講「毒鳥事件」如何在多方合作下解決問題的過程。文章有明顯的問題、解決、結果。但閱讀時，如何找到文章中的「問題、解決、結果」呢？我們可以用一些線索來做判斷喔！

      我們來練習用兩步驟（❶找重點句；❷精簡重點句）找「問題、解決、結果」。'
  - type: guide
    text: 一、找「問題」
  - type: concept_box
    text: ※祕訣：「問題」就是文章中需要解決的「不好的事或困難」。它常出現在文章的開頭。
  - type: guide
    text: ❶找重點句：
  - type: single
    prompt: 本文第一段有3句，哪一句最能看出事情的嚴重性，也最適合當作本文要解決的「問題」。（3選1）
    options:
      1: 句1：2012年10月，屏東科技大學的研究人員收到兩隻死亡的老鷹，檢驗後，確認老鷹體內含有劇毒農藥。
      2: 句2：2013年，他們在屏東縣一塊紅豆田中，發現了超過3000隻野鳥屍體。
      3: 句3：死亡的鳥類包括麻雀、紅鳩、小雲雀、斑文鳥、彩鷸、秧雞等，也包括食物鏈上層的紅隼、老鷹。
    answer: 2
  - type: concept_box
    label: 我們可以這樣思考：
    label_note: 標題前的「→」是 Wingdings 符號（w:sym F0E0），不在文字流裡
    text: 第一段有3個句子，第1句和第2句都寫到鳥類死亡，是需要解決的「不好的事」。第2句「發現超過3000隻野鳥屍體」更能看出毒鳥問題的嚴重性。因此，我留下第2句，並把第2句畫線。
  - type: guide
    text: ❷精簡重點句：
  - type: single
    prompt: 哪一句最能簡短說出第1段的「問題」？（2選1）
    options:
      1: 有大量的野鳥中毒死亡
      2: 在屏東縣做田野調查
    answer: 1
  - type: guide
    text: 二、找「解決」
  - type: concept_box
    text: ※祕訣：「解決」就是問題發生後，誰想出辦法或採取了什麼行動（誰＋做什麼），通常出現在文章中段。
  - type: guide
    text: ❶找重點句：（第4段）
  - type: multi
    prompt: 本文第四段共有3句。哪兩句寫出「誰採取了什麼行動」，來改善毒鳥問題？。（3選2）
    prompt_note: 原稿句末連用「？。」兩個標點，照抄未改
    options:
      1: 句1：屏東科技大學在縣政府的協助下，前往當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這場生態的悲劇。
      2: 句2：林先生坦承錯誤，2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。
      3: 句3：林先生雖然成為無毒農法的先驅，但這樣做成本高，18公頃紅豆田的收入，比過去少了100萬元，其他農民不容易跟進，林先生也只能苦撐待變。
    answers:
    - 1
    - 2
  - type: concept_box
    label: 我們可以這樣思考：
    text: 句1和2，都寫出為了解決野鳥中毒死亡問題，做了什麼事。句子都是「誰＋做了什麼事」。
  - type: guide
    text: ❷精簡重點句：
  - type: sub_block
    prompt: 想一想這句話的意思，用更簡短的方式表達重點。（2選1）
    items:
    - stem: (1)哪一句最能簡短說出「解決1」的重點？
      options:
        1: 屏科大找林先生溝通
        2: 屏科大找縣政府協助
      answer: 1
    - stem: (2)哪一句最能簡短說出「解決2」的重點？
      options:
        1: 林先生坦承錯誤
        2: 林先生轉型用無毒農法種紅豆
      answer: 2
  - type: guide
    text: ◎小試身手
  - type: passage
    label: 1.課文第五段：
    paragraphs:
    - 為了支持友善耕作的農民，2015年，全聯福利中心開始與農民簽訂契作協議，以高於市場的價格收購紅豆，並將這些紅豆命名為「老鷹紅豆」。最早和全聯契作的紅豆田雖然只有25公頃，但企業和農民一起保護老鷹的故事，開始在農民間慢慢傳開。全聯販售的老鷹紅豆，在種植過程中不毒鳥、不使用落葉劑，並經過層層把關，不必擔心農藥殘留的問題，希望高品質的老鷹紅豆可以取得消費者的青睞。
  - type: free_text
    prompt: (1)全聯為了支持友善耕作的農民，採取了什麼行動？請先尋找重點句，並畫線。
    answer: 為了支持友善耕作的農民，2015年，全聯福利中心開始與農民簽訂契作協議，以高於市場的價格收購紅豆，並將這些紅豆命名為「老鷹紅豆」。
    answer_carrier: 教師版在段落首句下方畫底線（圖形層），文字流無此資訊
  - type: single
    prompt: (2)請判斷第5段的「解決」可以精簡成底下哪個句子？（2選1）
    options:
      1: 全聯與農民合作，並高價收購紅豆
      2: 老鷹紅豆得到消費者的青睞
    answer: 1
  - type: guide
    text: 三、找「結果」
  - type: concept_box
    text: 祕訣：「結果」就是有人採取行動後，事情有了什麼改變。它常出現在文章的後段，有時會出現「結果、最後」等關鍵詞語。
    text_note: 這一條祕訣原稿沒有前置的「※」，與前兩條不同，照抄未補
  - type: guide
    text: ❶找重點句：（第6段）
  - type: single
    prompt: 第六段有3句。哪句最能說出這些行動帶來的結果？（3選1）
    options:
      1: 句1：結果，老鷹紅豆的友善耕作方式不僅保護了生態，也帶來了經濟上的成功。
      2: 句2：在各方夥伴鍥而不捨的努力下，老鷹紅豆與老鷹紅豆銅鑼燒的總銷售額從第一年的10萬元，成長到2024年的5.5億元，契作的紅豆田也超過了200公頃。
      3: 句3：這些成果都顯示出，臺灣的消費者願意付出較高的價錢，支持對生態友善的農業產品。
    answer: 1
  - type: concept_box
    label: 我們可以這樣思考：
    text: 句1說出行動後帶來的成果：同時說出「保護生態」和「經濟成功」兩方面的成果。
  - type: single
    prompt: ❷精簡重點句：請用更簡短的方式表達「結果」的重點句。
    options:
      1: 這句已經很精簡了，不用再精簡。
      2: 我可以更精簡：【　】。
    answer: 2
    blanks:
    - answer: 友善耕作保護了生態，也帶來了經濟上的成功
    answer_carrier: '⚠️ 這一題**兩個 □ 都沒有勾**；教師版是在選項2的橫線上用橘色手寫填答案。

      因此 answer: 2 是依「答案寫在選項2的空格裡」判定，非依 ☑。'
  - type: guide
    text: 四、把「問題—解決—結果」合起來
  - type: single
    prompt: 綜合前面找到的「問題、解決、結果」，哪一句最能完整整理全文重點？
    options:
      1: 研究團隊找出毒鳥原因，農民改變耕作方式，讓毒鳥問題開始改善。
      2: 面對大量鳥類中毒死亡的問題，研究團隊、農民、企業與消費者共同參與，讓友善耕作同時保護生態，也帶來經濟成果。
    answer: 2
  - type: self_check
    label: ◎自我檢核
    instruction: 請你自己檢查以下3項，確定自己是否會抓重點了
    items:
    - 1.我學到怎麼找出「問題」，知道故事一開始面臨什麼困境。
    - 2.我學到怎麼找出「解決」，了解主角/相關人物做了什麼來解決問題。
    - 3.我學到怎麼找出「結果」，說明解決行動帶來了哪些具體改變或成果。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
