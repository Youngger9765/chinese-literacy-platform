comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 文中第四段末行提到，林清源先生轉型無毒農法後「只能苦撐待變」。根據上下文推測，他面臨的主要困難是什麼？
    options:
      A: 無毒農法使成本提高、收入驟減，經濟壓力沉重
      B: 無毒防治的方法無效，鳥害依舊嚴重，他無計可施
      C: 缺乏政府補助，無法購置足夠的播種機器
      D: 其他農民強烈反對他的作法，使他難以堅持下去
  - index: 2
    answer: C
    stem: 文中最後一段「他們的心裡有愛，用消費守護了臺灣的生態」這句話的意思是什麼？
    options:
      A: 消費者因為心中有愛，所以願意捐款給保育團體保護鳥類
      B: 只要真心喜愛自然，就不需要親自參與保護行動
      C: 消費者透過購買支持友善農產品，表現出關愛生態的心意
      D: 農民和企業關注生態，而一般百姓只能用購物方式表達關心
  - index: 3
    answer: A
    stem: 本文作者列出許多具體數字（如「超過3000隻」、「少了100萬」、「5.5億元」、「200公頃」），這樣的寫作手法有何作用？
    options:
      A: 強調了問題的嚴重性和成果的顯著性，提高內容的說服力
      B: 考驗讀者的計算能力，讓文章內容更有趣味
      C: 精確地比較紅豆與其他作物在生態影響上的差異
      D: 展現作者對數字的敏感度，提升文章的可讀性
  - index: 4
    answer: B
    stem: 下列哪一項最符合《老鷹紅豆的故事》一文的主旨？
    options:
      A: 農民濫用劇毒農藥毒鳥，最終會破壞自然的生態平衡
      B: 各方合作努力可以讓農業同時保護生態並獲得經濟成功
      C: 保護老鷹等食物鏈頂端的猛禽對維持生態十分重要
      D: 提供經濟誘因才能鼓勵農民採用對生態友善的耕作方式
  - index: 5
    answer: D
    stem: 下列哪種情況與本文中「老鷹紅豆」的做法最相似？
    options:
      A: 有人發現魚池的魚生病，便停止餵食，讓池塘自然恢復生機
      B: 有人使用特製肥料讓植物長得更快，吸引遊客購票參觀賺錢
      C: 政府禁止農民在農地使用農藥，以防止鳥類再次出現中毒
      D: 為了保護青蛙，農民停用農藥，企業以高價收購他的稻米
