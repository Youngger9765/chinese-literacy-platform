  - label: 解決（誰＋做什麼）
    value: '1. 研究團隊追查毒鳥原因，並向林先生說明這場【　】。

      2.農民承認錯誤後，改變種植紅豆的方式。他們不再使用毒餌、落葉劑和除草劑，而是改用【　】種植紅豆。

      3.全聯與農民簽訂契作協議，【　】收購紅豆。'
    blanks:
    - answer: 生態悲劇
    - answer: 無毒農法
    - answer: 高價
  - label: 結果
    value: 老鷹紅豆的友善耕作方式保護了【　】，也帶來了【　】上的成功。
    blanks:
    - answer: 生態
    - answer: 經濟
  - label: 結語
    value: 老鷹紅豆的成功，除了大學、農民和企業，還有許多【　】，支持購買老鷹紅豆，用行動守護臺灣生態。
    blanks:
