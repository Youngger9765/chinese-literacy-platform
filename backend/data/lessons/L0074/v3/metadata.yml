strategy_explained: '這一課我們要練習的，是像偵探一樣，從文章裡找出「發生了什麼事」、「怎麼解決的」，還有「最後變成怎樣」的重點，這能幫助我們更了解一篇文章

  因為這篇故事裡，先有農藥毒害老鷹的「問題」，接著有研究員調查、林先生改變耕作方式、企業推動「老鷹紅豆」的「解決」辦法，最後讓友善耕作被大家認識與支持，這剛好很適合我們練習找出「問題—解決—結果」的架構來抓重點

  讀這篇故事時，你可以邊讀邊想：一開始有什麼不好的情況？後來是誰、做了什麼事來改善？最後的結果又變得怎麼樣呢'
