  - label: 問題
    value: 農民為了減少農業損失，使用會傷害鳥類的農藥，造成大量鳥類__死亡。
    blanks:
    - answer: 中毒
      hint: ''
  - label: 解決（誰＋做什麼）
    value: 1. 研究團隊追查毒鳥原因，並向林先生說明這場__。2.農民承認錯誤後，改變種植紅豆的方式。他們不再使用毒餌、落葉劑和除草劑，而是改用__種植紅豆。3.全聯與農民簽訂契作協議，__收購紅豆。
    blanks:
    - answer: 生態悲劇
      hint: ''
    - answer: 無毒農法
      hint: ''
    - answer: 高價
      hint: ''
  - label: 結果
    value: 老鷹紅豆的友善耕作方式保護了__，也帶來了__上的成功。
    blanks:
    - answer: 生態
      hint: ''
    - answer: 經濟
      hint: ''
  - label: 結語
    value: 老鷹紅豆的成功，除了大學、農民和企業，還有許多__，支持購買老鷹紅豆，用行動守護臺灣生態。
    blanks:
    - answer: 消費者/老百姓
      hint: ''
  title: 老鷹紅豆的故事
