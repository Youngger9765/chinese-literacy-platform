passage: 研究人員追根究柢後才知道，當地的稻子收割後，農民會利用空檔時間改種紅豆，紅豆播種時遭到大量野鳥啄食。農民為了減少農業損失，便使用農藥製作毒餌，造成小型鳥類的大量死亡。而猛禽如老鷹、紅隼撿食小鳥的屍體，也因而間󠇡接受害。
