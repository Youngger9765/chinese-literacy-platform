strategy_explained: '這一課我們要練習的是，練習看事情時，能夠同時看到不同人的想法和理由

  因為這篇在講核能，有人擔心風險，有人覺得能幫國家發電和減碳，兩種說法都很重要，這篇文章把它們都講清楚了

  讀的時候，你可以試著把贊成和反對核能的理由都找出來，想想看它們各有哪些地方比較有道理'
