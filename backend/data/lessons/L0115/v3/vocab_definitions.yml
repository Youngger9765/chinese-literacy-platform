lesson_uid: L0115
version_id: v3
section_no: 三
vocab_definitions:
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  vocabulary_bank:
  - 風靡
  - 權衡
  - 眾說紛紜
  - 系統性風險
  - 尤有甚者
  - 兵凶戰危
  - 鄰避效應
  - 因噎廢食
  - 置身事外
  - 捉襟見肘
  items:
  - index: 1
    word: 眾說紛紜
    definition: 眾說：很多人的說法；紛紜：雜亂、不相同。大家說法很多、意見不一致。
  - index: 2
    word: 兵凶戰危
    definition: 戰爭可能發生，局勢十分緊張不安。
  - index: 3
    word: 系統性風險
    definition: 不是單一問題，而是整個系統連鎖出問題的大風險。
  - index: 4
    word: 因噎廢食
    definition: 因為害怕出問題，便停止原本有益的作法，反而失去應有的好處。
  - index: 5
    word: 風靡
    definition: 非常流行，迅速受到很多人喜愛與追捧。
  - index: 6
    word: 置身事外
    definition: 置：放；事外：事情之外。把自己放在事情之外，認為事情與自己無關。
  - index: 7
    word: 捉襟見肘
    definition: 捉襟：拉住前襟；見肘：露出手肘。資源不夠用，怎麼安排都很吃緊。
  - index: 8
    word: 尤有甚者
    definition: 更糟的是、甚至更過分的是（用來加重後面情況）。
  - index: 9
    word: 權衡
    definition: 把不同選項的利弊放在一起比較，再做選擇。
  - index: 10
    word: 鄰避效應
    definition: 大家知道某設施「有需要」，但不希望蓋在自己家附近（例如垃圾場、核廢料）。
  notes:
    vocabulary_bank: '語詞框原文分四行印：「本課語詞：風靡、權衡／眾說紛紜、系統性風險、尤有甚者、兵凶戰危、／

      鄰避效應、因噎廢食、／置身事外、捉襟見肘、」——「風靡、權衡」被排在標題那一行、

      順序與其他三處不同，而且**整段以頓號「、」結束，沒有句號**。原稿如此，未調整未補。'
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    foot: Not In My BackYard意思是「不要在我家後院」，這句英文的首字字母為NIMBY，音譯即「鄰避」。
    footnote: 印在第 (10) 題「鄰避效應」解釋的下方，是該題的補充說明，不是獨立題目。
