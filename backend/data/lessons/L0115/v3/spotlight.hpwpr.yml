lesson_uid: L0115
version_id: v3
section_no: 五
spotlight:
  strategy_name: 比較多元觀點
  strategy_type: compare_perspectives
  answer_carrier: '紅色 ☑（w:sym Wingdings F0FE，共 15 個）＋橘色手寫填空。

    ⚠️ 部分橘字不帶 run 層 w:color（走字元樣式），只掃 rPr/w:color 會漏，見檔頭說明。'
  blocks:
  - type: concept_box
    text: 前兩課我們學習過如何「比較多元觀點」：先找出每一派的立場/主張，再整理「理由-證據」，最後比較差異。這一課也是議題文，有兩派觀點。請你再用一次這個方法，看看你能不能把兩派的觀點整理清楚，並推論文章主旨。
  - type: guide
    text: 一、確定議題
  - type: guide
    text: 這篇文章在談「哪個議題／爭議」（提示：可能出現「爭議」、「要不要」、「是否」等關鍵詞）
  - type: free_text
    prompt: （　）
    blanks:
    - answer: 臺灣要不要核電？
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    prompt_note: 原稿是一條底線留白，此處以（　）標示空格位置。
  - type: guide
    text: 二、找觀點（立場）
  - type: guide
    text: 這個議題的正反兩方有哪些立場/主張？各有哪些理由？有無證據支持？
  - type: sub_block
    label: 反對核能
    left_header: '觀點

      要素'
    right_header: 請根據課文內容勾選(單選) 或填答（內容合理即可）
    stance_row_label: '立場/

      主張'
    table_note: '原稿是一張兩欄表格：左欄是「觀點要素」（立場/主張・主要理由・證據），右欄放內容。

      「主要理由」那一格裡塞了 4 個小題，每題各自有一組 ①~④ 單選，故以 sub_block 展開。'
    items:
    - type: guide
      label: '主要

        理由

        (為什麼這樣主張

        ？)'
      text: 請依課文內容，判斷每個理由最主要屬於哪一類(單選)
    - type: single
      index: 1
      prompt: 1.核災屬於低機率、高衝擊的系統性風險，出事難收拾
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 1
    - type: single
      index: 2
      prompt: 2.臺灣人口密度高，若發生核災，會使交通與安置更困難
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 1
    - type: single
      index: 3
      prompt: 3.兩岸（　）
      blanks:
      - answer: 情勢緊張，若核電遭飛彈轟炸，民眾更緊張
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 1
      prompt_note: 這一題的理由本身是留白讓學生填的（原稿只印「3.兩岸」），教師版以橘字補上。
    - type: single
      index: 4
      prompt: 4.核電廠與核廢料要設在哪裡、放在哪裡，有鄰避效應
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 4
    - type: free_text
      prompt: '*你發現了嗎？反對核能的理由主要集中在：（　）'
      blanks:
      - answer: 安全風險
      answer_carrier: 橘色（走字元樣式，run 層無 w:color；PDF p6 可見）
    - type: single
      label: 證據
      options:
        1: 車諾比、日本 福島的撤離人數與範圍等案例數據
        2: 很多人認為核能一出事修復費用太昂貴，不能考慮核能
      answer: 1
      options_note: 選項①原稿在「日本」與「福島」之間有一個半形空格，照原樣。
  - type: sub_block
    label: 贊成核能
    stance_row_label: '立場/

      主張'
    items:
    - type: guide
      label: '主要

        理由

        (為什麼這樣主張

        ？)'
      text: 請依課文內容，判斷每個理由最主要屬於哪一類(單選)
    - type: single
      index: 1
      prompt: 1.臺灣能源多靠進口，有核能可增加穩定來源，減少依賴
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 2
    - type: single
      index: 2
      prompt: 2.減碳是趨勢，核能排放的溫室氣體極少，能減碳
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 3
    - type: single
      index: 3
      prompt: 3.臺灣的用電（　）
      blanks:
      - answer: 需求快速上升，需要更穩定的電力來源支撐
      options:
        1: 安全風險
        2: 能源供應
        3: 減碳責任
        4: 選址處置
      answer: 2
      prompt_note: 同反方第 3 題，理由本身留白讓學生填；橘字答案走字元樣式，靠 PDF p7 認出。
    - type: free_text
      prompt: '*你發現了嗎？贊成核能的理由主要集中在：（　）'
      blanks:
      - answer: 能源供應
      answer_carrier: 橘色（走字元樣式，run 層無 w:color；PDF p7 可見）
    - type: single
      label: 證據
      options:
        1: 數據指出，臺灣能源多靠進口、用電需求急速上升
        2: 只要擴大核能發電，就保證不缺電，不必其他電源
      answer: 1
  - type: guide
    text: 三、比較觀點差異（用「價值／風險」兩個角度）
  - type: guide
    text: 我們先用「主張＋理由＋證據」掌握每一方在說什麼；再追問理由在強調什麼──最優先的價值與最害怕的風險。用這兩個角度看，就能清楚比較觀點差異。
  - type: fill_table
    columns:
    - 立場
    - 最優先的價值（單選）
    - 最害怕的風險（單選）
    answer_carrier: 紅色 ☑（w:sym），PDF p7 可見；本表 4 個 ☑
    rows:
    - 立場: 反對核能
      最優先的價值（單選）: '①安全優先

        ②穩定供電

        ③減碳目標'
      最優先的價值（單選）_options:
        1: 安全優先
        2: 穩定供電
        3: 減碳目標
      最優先的價值（單選）_answer: 1
      最害怕的風險（單選）: '①核災失控

        ②電力不足

        ③減碳落後'
      最害怕的風險（單選）_options:
        1: 核災失控
        2: 電力不足
        3: 減碳落後
      最害怕的風險（單選）_answer: 1
    - 立場: 贊成核能
      最優先的價值（單選）: '①安全優先

        ②穩定供電

        ③減碳目標'
      最優先的價值（單選）_options:
        1: 安全優先
        2: 穩定供電
        3: 減碳目標
      最優先的價值（單選）_answer: 2
      最害怕的風險（單選）: '①核災失控

        ②電力不足

        ③減碳落後'
      最害怕的風險（單選）_options:
        1: 核災失控
        2: 電力不足
        3: 減碳落後
      最害怕的風險（單選）_answer: 2
  - type: guide
    text: ＊歸納觀點差異：
  - type: free_text
    prompt: 反對核能把「（　）」放第一，因此最怕「（　）」。
    blanks:
    - answer: 安全優先
    - answer: 核災失控
    answer_carrier: 橘色（PDF p7 可見）
  - type: free_text
    prompt: 贊成核能把「（　）」放第一，因此最怕「（　）」。
    blanks:
    - answer: 穩定供電
    - answer: 電力不足
    answer_carrier: 橘色（PDF p7 可見）
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: single
    prompt: 你已用表格整理兩派的「理由與證據」，也用「最優先的價值／最害怕的風險」比較差異。綜合這些整理，本文主旨最可能是什麼？（單選）
    options:
      1: 列出反對與贊成的理由，提醒能源決策必須權衡利弊並持續對話
      2: 用核災案例證明核能最危險，呼籲臺灣立刻全面停止使用核電
      3: 用用電需求與減碳壓力證明核能必要，主張臺灣應立即擴建核電廠
    answer: 1
  - type: guide
    text: 五、推論作者意圖
  - type: single
    prompt: 你在比較表中看見兩派「優先價值」與「害怕風險」不同；作者最後提出「公開透明的數據、嚴格監管與持續對話」。作者這樣收尾，最可能想達到什麼效果？（單選）
    options:
      1: 先由專家提出完整報告並公開發布，再依報告定案執行。
      2: 讓討論回到可查核資料與制度程序，降低對立與互不信任。
    answer: 2
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能說出文章討論的核心議題。
    - 2.我能找出本文兩派立場的主張、理由與證據。
    - 3.我能用「價值／風險」比較兩派的差異。
    - 4.我能從「觀點比較表」推論本文主旨與作者意圖。
    - 5.我能根據觀點異同統整文章主旨。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  slug: hpwpr
  text_ref: mr3he
