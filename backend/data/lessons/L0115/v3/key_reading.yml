  passage: 反對者認為，核災屬於低機率、高衝擊的系統性風險，一旦出事就難以收拾，而且，這種風險絕非想像。1986年蘇聯車諾比核電廠（在現在烏克蘭境內）爐心熔毀災變後，約有33.5萬人陸續被撤離並重新安置。2011年日本福島的地震引發海嘯，淹沒了核電廠，造成嚴重輻射外洩，超過10萬人被疏散。兩次核災都涉及大範圍疏散，疏散區域約達核電廠周邊30公里。把這些經驗放到臺灣，擔憂會更具體。臺灣有全世界名列前茅的人口密度（每平方公里643人），最寬處約144公里，若發生核災，不管在臺灣的什麼地方，半徑30公里的疏散圈，就非常可能讓島內的南北交通嚴重受阻，並發生大量人口疏散及安置的困難。尤有甚者，兩岸情勢緊張、社會對衝突風險有高度焦慮，如果核電廠遭飛彈轟炸怎麼辦？面臨兵凶戰危的現實考量，大家無處可逃的焦慮就更強了。
