  paragraphs:
  - idx: 1
    text: 我們生活中的照明、電視、冷氣到手機都要用電，電不但是生活的必需品，也是支撐產業發展的核心資源。臺灣這麼需要電，但電要從哪裡來？「臺灣要不要核電？」對這個問題，臺灣社會幾十年來一直有兩種對立的看法，眾說紛紜。2025年5月，臺灣最後一座核電機組停止運轉後，這個議題再次引起各方關注。
  - idx: 2
    text: 反對者認為，核災屬於低機率、高衝擊的系統性風險，一旦出事就難以收拾，而且，這種風險絕非想像。1986年蘇聯車諾比核電廠（在現在烏克蘭境內）爐心熔毀災變後，約有33.5萬人陸續被撤離並重新安置。2011年日本福島的地震引發海嘯，淹沒了核電廠，造成嚴重輻射外洩，超過10萬人被疏散。兩次核災都涉及大範圍疏散，疏散區域約達核電廠周邊30公里。
  - idx: 3
    text: 把這些經驗放到臺灣，擔憂會更具體。臺灣有全世界名列前茅的人口密度（每平方公里643人），最寬處約144公里，若發生核災，不管在臺灣的什麼地方，半徑30公里的疏散圈，就非常可能讓島內的南北交通嚴重受阻，並發生大量人口疏散及安置的困難。尤有甚者，兩岸情勢緊張、社會對衝突風險有高度焦慮，如果核電廠遭飛彈轟炸怎麼辦？面臨兵凶戰危的現實考量，大家無處可逃的焦慮就更強了。
  - idx: 4
    text: 此外，核電廠與核廢料的「鄰避效應」也難忽視。臺灣若要設新的核電廠，該設在哪裡？核廢料該放哪裡？放你家附近好嗎？即使專家說明核能設施可透過技術與監管降低風險，過往事故留下的教訓仍使部分民眾難以放心。核電廠與核廢料的選址，也會是政府必須面對的溝通難題。
  - idx: 5
    text: 支持核能者則提醒，若只看發生率極低的風險就否決核能，可能因噎廢食，反而讓臺灣面臨更大的風險。臺灣使用的能源總量中，約95.8%靠進口，如果有核能電廠提供穩定的能源，就比較不必仰人鼻息，即使發生戰爭，進口燃料斷絕，臺灣也能有比較好的能源韌性。
  - idx: 6
    text: 此外，人類產生的大量溫室氣體，導致地球快速升溫，為了維護生態平衡，減碳是必然的趨勢，臺灣也不能置身事外。2025年，臺灣的用電中只有約15%來自於綠電，其餘的85%來自燃燒化石燃料，排放了大量溫室氣體。相對的，核能排放的溫室氣體極少，若想同時減碳又想確保能源供應，核能是值得考慮的選項之一。
  - idx: 7
    text: 更直接的壓力來自快速上升的用電需求。護國神山台積電一家公司2024年用電量約為255.5億度，相當於臺北市300萬人的用電量，約全國用電量的一成。而人工智慧（AI）興起後，在短時間內風靡全球、也深入多數人的生活，因此，國際能源總署預估，AI相關的用電需求將出現爆炸性成長，到2030年，AI相關用電量可能增加到今天的兩倍，這也是美、俄、中、法、英等主要國家核能政策轉向積極擴張的原因，連飽受核災的日本都在2026年1月重啟全世界最大的核電廠，電力供應捉襟見肘的臺灣，還有別的選擇嗎？
  - idx: 8
    text: 核能的爭議，其實是在問大家：你願意用什麼方式換取電力？不用核能，缺口要由哪些電源補上，產業競爭力又怎麼維持？要用核能，安全演練、戰時風險、核廢料與地方共識該怎麼做？在權衡利弊後，也許我們能以民主方式做出決策。不論結果，仍需保持溝通的彈性，以公開透明的數據、嚴格監管與持續對話，替臺灣找出路。
