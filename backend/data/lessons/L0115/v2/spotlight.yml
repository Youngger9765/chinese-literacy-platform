spotlight:
  lesson: G8-L18
  strategy_name: 比較多元觀點
  strategy_type: multiple_perspectives
  blocks:
  - type: guide
    text: 一、確定議題
  - type: passage
    source: unknown
    paragraphs:
    - 這篇文章在談「哪個議題／爭議」（提示：可能出現「爭議」、「要不要」、「是否」等關鍵詞）
  - type: guide
    text: 臺灣要不要核電？
  - type: guide
    text: 二、找觀點（立場）
  - type: guide
    text: 這個議題的正反兩方有哪些立場/主張？各有哪些理由？有無證據支持？
  - type: table
    rows:
    - - '觀點

        要素'
      - 請根據課文內容勾選(單選) 或填答（內容合理即可）
    - - '立場/

        主張'
      - 反對核能
    - - '主要

        理由

        (為什麼這樣主張

        ？)'
      - "請依課文內容，判斷每個理由最主要屬於哪一類(單選)\n1.核災屬於低機率、高衝擊的系統性風險，出事難收拾\n ①安全風險 □②能源供應 □③減碳責任□④選址處置\n\
        2.臺灣人口密度高，若發生核災，會使交通與安置更困難\n ①安全風險 □②能源供應 □③減碳責任□④選址處置\n3.兩岸    情勢緊張，若核電遭飛彈轟炸，民眾更緊張\
        \         \n ①安全風險 □②能源供應 □③減碳責任□④選址處置\n4.核電廠與核廢料要設在哪裡、放在哪裡，有鄰避效應\n □①安全風險\
        \ □②能源供應 □③減碳責任④選址處置\n*你發現了嗎？反對核能的理由主要集中在：  安全風險"
    - - 證據
      - '①車諾比、日本 福島的撤離人數與範圍等案例數據

        □②很多人認為核能一出事修復費用太昂貴，不能考慮核能'
  - type: table
    rows:
    - - '立場/

        主張'
      - 贊成核能
    - - '主要

        理由

        (為什麼這樣主張

        ？)'
      - "請依課文內容，判斷每個理由最主要屬於哪一類(單選)\n1.臺灣能源多靠進口，有核能可增加穩定來源，減少依賴\n□①安全風險  ②能源供應  □③減碳責任\
        \  □④選址處置\n2.減碳是趨勢，核能排放的溫室氣體極少，能減碳\n□①安全風險  □②能源供應  ③減碳責任  □④選址處置\n3.臺灣的用電\
        \   需求快速上升，需要更穩定的電力來源支撐      \n□①安全風險  ②能源供應  □③減碳責任  □④選址處置\n*你發現了嗎？贊成核能的理由主要集中在：\
        \    能源供應"
    - - 證據
      - '①數據指出，臺灣能源多靠進口、用電需求急速上升

        □②只要擴大核能發電，就保證不缺電，不必其他電源'
  - type: guide
    text: 三、比較觀點差異（用「價值／風險」兩個角度）
  - type: passage
    source: unknown
    paragraphs:
    - 我們先用「主張＋理由＋證據」掌握每一方在說什麼；再追問理由在強調什麼──最優先的價值與最害怕的風險。用這兩個角度看，就能清楚比較觀點差異。
  - type: table
    rows:
    - - 立場
      - 最優先的價值（單選）
      - 最害怕的風險（單選）
    - - 反對核能
      - '①安全優先

        □②穩定供電

        □③減碳目標'
      - '①核災失控

        □②電力不足

        □③減碳落後'
    - - 贊成核能
      - '□①安全優先　

        ②穩定供電

        □③減碳目標'
      - '□①核災失控　

        ②電力不足

        □③減碳落後'
  - type: guide
    text: ＊歸納觀點差異：
  - type: passage
    source: unknown
    paragraphs:
    - 反對核能把「  安全優先     」放第一，因此最怕「  核災失控      」。
    - 贊成核能把「  穩定供電     」放第一，因此最怕「  電力不足      」。
  - type: guide
    text: 四、推論主旨（從「觀點差異」推論整篇重點）
  - type: passage
    source: unknown
    paragraphs:
    - 你已用表格整理兩派的「理由與證據」，也用「最優先的價值／最害怕的風險」比較差異。綜合這些整理，本文主旨最可能是什麼？（單選）
  - type: multi
    prompt: 請選擇
    options:
    - 列出反對與贊成的理由，提醒能源決策必須權衡利弊並持續對話
    - 用核災案例證明核能最危險，呼籲臺灣立刻全面停止使用核電
    - 用用電需求與減碳壓力證明核能必要，主張臺灣應立即擴建核電廠
    answer:
    - 列出反對與贊成的理由，提醒能源決策必須權衡利弊並持續對話
    - 用核災案例證明核能最危險，呼籲臺灣立刻全面停止使用核電
    - 用用電需求與減碳壓力證明核能必要，主張臺灣應立即擴建核電廠
  - type: guide
    text: 五、推論作者意圖
  - type: passage
    source: unknown
    paragraphs:
    - 你在比較表中看見兩派「優先價值」與「害怕風險」不同；作者最後提出「公開透明的數據、嚴格監管與持續對話」。作者這樣收尾，最可能想達到什麼效果？（單選）
  - type: single
    prompt: 請選擇
    options:
    - 先由專家提出完整報告並公開發布，再依報告定案執行。
    - 讓討論回到可查核資料與制度程序，降低對立與互不信任。
    answer: 先由專家提出完整報告並公開發布，再依報告定案執行。
  - type: guide
    text: 看見本文的結構與重點
  - type: passage
    source: unknown
    paragraphs:
    - 辯論式的議題文章，常見的論述結構是：「引出議題→一方論述→另一方論述→結尾」，請在【  】填入對應的段落數，並根據課文內容完成摘要。
  - type: table
    rows:
    - - 結構
      - 段落數
      - 精簡摘要
    - - 引出 議題
      - 【】
      - 生活與產業都需要【】，文章提出臺灣是否應使用【】的爭議。
    - - 反方 論述
      - 【】
      - 強調萬一出事【】，並指出臺灣疏散困難與核廢選址的困境。
    - - 正方 論述
      - 【】
      - 強調「不用核能也有風險」，包括能源【】、減碳壓力與【】。
    - - 結尾
      - 【】
      - 作者提醒要用【】來做出民主決策。
    answers:
    - '1'
    - 電力
    - 核電
    - 2～4
    - 代價太大
    - 5～7
    - 供應依賴進口
    - 用電需求上升
    - '8'
    - 透明數據、嚴格監管與持續對話
  - type: self_check
    items:
    - 我能說出文章討論的核心議題。
    - 我能找出本文兩派立場的主張、理由與證據。
    - 我能用「價值／風險」比較兩派的差異。
    - 我能從「觀點比較表」推論本文主旨與作者意圖。
    - 我能根據觀點異同統整文章主旨。
