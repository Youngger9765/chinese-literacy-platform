comprehension:
  questions:
  - index: 2
    answer: B
    stem: 作者先用車諾比與福島的撤離案例，再轉到「放到臺灣會更具體」，這段最主要的作用是什麼？
    options:
      A: 民意支持、政黨立場、選舉結果三者的互動變化
      B: 供電成本、電價漲幅、民眾負擔三者的影響比較
      C: 核安技術、設備新舊、專家判斷三者的可靠程度
      D: 供電穩定、核能安全、減碳目標三者的取捨平衡
    rationale: 本文不是要讀者立刻站隊，而是引導做「權衡」：安全、戰時想像、核廢治理 vs 能源韌性、減碳、供電需求，各有代價與風險。
  - index: 5
    answer: B
    stem: 作者最後提出「公開透明的數據、嚴格監管與持續對話」，最可能想改善的是哪一個問題？
    options:
      B: 回到資料與監督，降低情緒對立與互不信任
      C: 應託付專家決定，民眾不能也不必了解細節
      D: 先拚口號動員，趁選舉前快速形成決策壓力
    rationale: 這句話的核心是「程序」：用資料、監管、對話提升可檢核性與信任，讓公共討論不被情緒與同溫層綁架。
