multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 他因為酒駕撞到行道樹而受重傷，真是「無妄之災」。
  - 便利商店裡的熱狗，在架子上「輾轉反側」轉個不停。
  - 他因為一次考試失敗就「一蹶不振」，從此放棄學習。
  - 小明睡覺姿勢不良，起床右半邊都麻痺，「半身不遂」。
  answer: C
  explanation: 「一蹶不振」意指遭遇挫折或失敗後就無法振作，選項C中「因為一次考試失敗就從此放棄學習」的情境，完全符合其語義。
