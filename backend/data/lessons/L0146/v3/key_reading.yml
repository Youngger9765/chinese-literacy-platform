  start_marker_note: '🔴 ☞ 圖示印在段號「**七**」那一行（PDF p2），但指示語寫的是「（六 ）」。

    以字數欄獨立驗證：套 SKILL ⑥.7 第 1 條（「15,000」整串算 1 字）**從第 6 段起算**，

    第 6 段末 143、第 7 段末 261 —— 兩個都精準命中印出的數字；

    改從第 5 段（133/281/399…）或第 7 段（118/319…）起算則**一個都對不上**。

    → 起點是第 6 段，☞ 的視覺位置是排版上移，不是真值。

    （照 ☞ 位置抓會差一段，正是 #2555 那批 bug 的形狀。）'
