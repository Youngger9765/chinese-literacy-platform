lesson_uid: L0146
version_id: v3
section_no: 五
spotlight:
  strategy_name: 推論策略—從例子推論作者觀點
  blocks:
  - type: concept_box
    text: '這篇課文的作者不是一開始就把他的觀點全部說清楚，而是先安排一連串吸引讀者注意的例子，讓讀者發現「不同地方的語言怎麼這麼像？」再一步一步推向作者想表達的觀點。所以，這一課你要練習的是：

      從文章反覆舉出的例子中，推論作者真正想表達的觀點。

      語言的足跡這篇文章，作者仍然是透過反覆的例子，來表達一個特定的想法。我們再練習一次，用❶～❸的步驟「推論（歸納）作者的觀點」。

      【❶找例子】

      【❷找共同點】

      【❸推論觀點】'
    arrow_note: '最後三行在原稿是印成**一行**：【❶找例子】→【❷找共同點】→【❸推論觀點】，

      兩個「→」是 `w:sym Wingdings F0E0` **符號**（沒有 w:t）。

      依 SKILL 規則，符號箭號前後斷行 → 拆成三行的流程步驟。

      ⚠️ 接成一句也會通過逐字門（符號不貢獻 w:t，兩半都在原稿裡），

      但那樣讀起來就不是「三個依序進行的步驟」了 —— 門綠不等於寫對。'
  - type: guide
    text: '一、步驟❶──找例子

      A.作者在文中舉了不少語詞例子。請勾選這些語詞「出現在哪些地區」，

      為下一步找出它們的共同點做準備。（複選）'
  - type: fill_table
    columns:
    - 語詞（作者舉的例子）
    - 出現地區（觀察分布）
    rows:
    - 語詞（作者舉的例子）: 1.manga、 vanga（小船）
      出現地區（觀察分布）:
      - ①臺灣
      - ②東南亞
      - ③南太平洋
      出現地區（觀察分布）_answers:
      - 1
      - 2
      - 3
    - 語詞（作者舉的例子）: 2.mata（眼睛）
      出現地區（觀察分布）:
      - ①臺灣
      - ②東南亞
      - ③南太平洋
      出現地區（觀察分布）_answers:
      - 1
      - 2
      - 3
    - 語詞（作者舉的例子）: 3.ina / tina（母親）
      出現地區（觀察分布）:
      - ①臺灣
      - ②東南亞
      - ③南太平洋
      出現地區（觀察分布）_answers:
      - 1
      - 2
      - 3
    - 語詞（作者舉的例子）: 4.lima / nima / rima（五）
      出現地區（觀察分布）:
      - ①臺灣
      - ②東南亞
      - ③南太平洋
      出現地區（觀察分布）_answers:
      - 1
      - 2
      - 3
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）—— 四列各三個全部勾選，共 12 個
    note: 四列的答案都是「三個都勾」，這是原稿印的，不是抄錯
  - type: multi
    prompt: B.第五段用來說明「音變很常見」的兩個生活例子（請打勾，三選二）
    options:
      1: 那個→辣個
      2: 很熱→很樂
      3: 很冷→很勒
    answers:
    - 1
    - 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）×2
    arrow_note: 這三個選項裡的「→」是**字面**字元（U+2192），在句內、不斷行
  - type: guide
    text: ➡小祕訣：看到「例如、就像、亦然」常常就是例子要出現了。
    arrow_note: 行首的「➡」是字面 U+27A1 BLACK RIGHTWARDS ARROW，不是 w:sym
  - type: single
    prompt: '二、步驟❷──找這些例子的共同點：

      作者想讓我們注意到這些例子什麼共同點？（請勾選，單選）'
    options:
      1: 南島語族分布在不同地區，卻出現相似發音的詞彙
      2: 例子顯示語言會一直改變，無法留下任何線索
      3: 例子來自不同語言，所以彼此沒有關聯
    answer: 1
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: single
    prompt: 三、步驟❸──推論作者觀點
    options:
      1: 萬華地名的重點，在於日治時期的改名過程。
      2: 南島語族雖分散在各地島嶼，卻保留部分相似語彙，這些語言線索可推知他們可能有共同祖語、共同來源。
      3: 不同島嶼的語言之所以相似，是因為有人刻意在各島推行同一套語言。
      4: 語言會隨時間改變，因此難以用來追查來源與歷史。
    answer: 2
    answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）
  - type: self_check
    label: ◎自我檢核
    items:
    - 1.我能找出文章中作者反覆舉出的例子。
    - 2.我能把這些例子合起來看，找出它們的共同點。
    - 3.我能根據例子與共同點，推論出作者想表達的觀點。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿三個□都沒有勾選
  - type: guide
    text: '※如果你三項都打勾，恭喜你，

      表示你已經學會用 3 步驟「從例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！'
