strategy_explained: '這一課，我們一起練習從文章裡的例子，去猜作者心裡的想法或想表達的重點

  這篇文章用萬華地名和南太平洋的共同詞彙當例子，引導我們思考語言怎麼會這麼像，很適合練習推敲作者的觀點

  讀的時候，你可以想想，這些例子怎麼讓你聯想到人類的遷徙和文化交流，然後猜猜作者想藉由這些語言的線索告訴我們什麼'
