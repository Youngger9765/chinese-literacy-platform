  總表_對照: '總表第 4 個語詞寫「歲月**的**淘洗」，學習單的語詞框、語詞我最棒、詞語複習三處

    印的都是「歲月淘洗」（無「的」）。課文內文則是「數百年的歲月淘洗」。

    本檔一律照學習單印的「歲月淘洗」。

