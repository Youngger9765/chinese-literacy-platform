intro: 這篇文章帶我們踏上一趟有趣的語言探索之旅。從臺北萬華的地名由來，我們發現了語言的演變與連結。接著，文章將視角拉到廣闊的南太平洋，介紹了「南島語族」這個大家庭，以及他們語言中許多相似的詞彙，例如表示「小船」、「眼睛」、「母親」或數字「五」的說法。這些共同的語彙，就像是跨越時空的線索，引導我們思考南島語族為何能散布在廣大的海洋上，並擁有如此相近的語言。文章將藉由這些語言的足跡，帶領讀者一同探究人類遷徙與文化交流的奧秘。
