spotlight:
  lesson: G9-L3
  strategy_name: 推論策略-從例子推論作者觀點
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 這篇課文的作者不是一開始就把他的觀點全部說清楚，而是先安排一連串吸引讀者注意的例子，讓讀者發現「不同地方的語言怎麼這麼像？」再一步一步推向作者想表達的觀點。所以，這一課你要練習的是：
      從文章反覆舉出的例子中，推論作者真正想表達的觀點。   語言的足跡這篇文章，作者仍然是透過反覆的例子，來表達一個特定的想法。我們再練習一次，用❶～❸的步驟「推論（歸納）作者的觀點」。   【❶找例子】
      【❷找共同點】【❸推論觀點】
  - type: guide
    text: 一、步驟❶──找例子
  - type: passage
    source: unknown
    paragraphs:
    - A.作者在文中舉了不少語詞例子。請勾選這些語詞「出現在哪些地區」，為下一步找出它們的共同點做準備。（複選）
  - type: table
    rows:
    - - 語詞（作者舉的例子）
      - 出現地區（觀察分布）
    - - 1.manga、 vanga（小船）
      - □①臺灣 □②東南亞 □③南太平洋
    - - 2.mata（眼睛）
      - □①臺灣 □②東南亞 □③南太平洋
    - - 3.ina / tina（母親）
      - □①臺灣 □②東南亞 □③南太平洋
    - - 4.lima / nima / rima（五）
      - □①臺灣 □②東南亞 □③南太平洋
  - type: single
    prompt: B.第五段用來說明「音變很常見」的兩個生活例子（請打勾，三選二）
    options:
    - 那個→辣個
    - 很熱→很樂
    - 很冷→很勒
    answer: 那個→辣個
  - type: guide
    text: ➡小祕訣：看到「例如、就像、亦然」常常就是例子要出現了。
  - type: guide
    text: 二、步驟❷──找這些例子的共同點：
  - type: guide
    text: 作者想讓我們注意到這些例子什麼共同點？（請勾選，單選）
  - type: passage
    source: unknown
    paragraphs:
    - □①南島語族分布在不同地區，卻出現相似發音的詞彙
    - □②例子顯示語言會一直改變，無法留下任何線索
    - □③例子來自不同語言，所以彼此沒有關聯
  - type: guide
    text: 三、步驟❸──推論作者觀點
  - type: multi
    prompt: 請選擇
    options:
    - 萬華地名的重點，在於日治時期的改名過程。
    - 南島語族雖分散在各地島嶼，卻保留部分相似語彙，這些語言線索可推知他們可能有共同祖語、共同來源。
    - 不同島嶼的語言之所以相似，是因為有人刻意在各島推行同一套語言。
    - 語言會隨時間改變，因此難以用來追查來源與歷史。
    answer:
    - 萬華地名的重點，在於日治時期的改名過程。
    - 南島語族雖分散在各地島嶼，卻保留部分相似語彙，這些語言線索可推知他們可能有共同祖語、共同來源。
    - 不同島嶼的語言之所以相似，是因為有人刻意在各島推行同一套語言。
    - 語言會隨時間改變，因此難以用來追查來源與歷史。
  - type: guide
    text: ※ 如果你三項都打勾，恭喜你，
  - type: passage
    source: unknown
    paragraphs:
    - 表示你已經學會用 3 步驟「從例子推論作者觀點（歸納推論）」，不只看懂例子，還能看懂作者的想法，你超厲害的！
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: table
    rows:
    - - 語言的足跡：從臺北 萬華到南太平洋的航海之路
    - - 萬華地名典故
      - 「萬華」這個地名，來自原住民語 manga，原本是指【】
    - - 擴大觀察
      - 不只臺北，【】　與 【】等地，也以manga（或vanga）指稱小船或獨木舟。人類學家把這些使用相似語言的族群稱為【】。
    - - 更多例子
      - 南島語族共享許多相似語彙，例如眼睛稱 mata，母親稱 ina（或 tina），數字「５」稱 lima（或 nima／rima）語言在傳遞過程中會產生【】，這是一種自然現象。
    - - 疑問與解釋
      - 1.南島語族彼此相隔很遠，怎麼可能使用相似語言？2.科學界的解釋：他們曾有【】，並透過航海逐步 【】、拓展至各島嶼。
    - - 結尾
      - 語言是一條【】，語言能保存族群【】與【】 的歷史。
    answers:
    - 小船／獨木舟
    - 東南亞
    - 南太平洋
    - 南島語族
    - 音變
    - 共同祖先
    - 遷徙
    - 跨越千年的足跡
    - 遷徙
    - 交流、生活
  - type: guide
    text: 選項A句子雖提到「幾乎一樣」，但實際只是在描述同一條路的樣子，不是比較「兩個不同事物」，成語誤用。。選項A句子雖提到「幾乎一樣」，但實際只是在描述同一條路的樣子，不是比較「兩個不同事物」，成語誤用。。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能找出文章中作者反覆舉出的例子。
    - 我能把這些例子合起來看，找出它們的共同點。
    - 我能根據例子與共同點，推論出作者想表達的觀點。
