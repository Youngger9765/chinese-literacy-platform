passage: '新的疑問接踵而來：南島語族散居於南太平洋、南海、印度洋，各島之間隔著浩瀚無垠的海洋，他們的語言怎麼可能有這麼多相似的語彙？從臺灣到復活節島的直線距離約有15,000公里吔！難道是有外星人頒布共同語言教材，再派語言教師搭著飛碟巡迴各島授課？講到這裡，你大概會忍不住翻白眼：「拜託，別再天馬行空了！」

  言歸正傳󠇡，目前科學界較廣為接受的理論是：約三、四千年前，這些語族擁有共同的祖先，他們精於航海，從起源地逐步遷徙，先至鄰近島嶼，再從這些島嶼持續拓展。歷經數千年的開枝散葉，各地語言雖已無法互通，卻仍留存部分共同的語彙，成為語言親緣的證據。

  語言是一條跨越千年的足跡，它不僅記錄族群遷徙的方向，也默默保存了人們如何在島嶼之間往返、交流、生活的歷史。大洋中的南島語族彼此遙隔，卻在共享語彙中暗藏語源線索。無論是稱呼小船的manga、表示親情的ina、觀看世界的mata，抑或數字5的lima，都像是一條條細緻的語言纜繩，把遙遠的島嶼重新牽繫起來。新的問題來了，到底哪裡才是語言散播的源頭呢？這個答案居然落在臺灣四處可見的構樹身上，我們下一課再談。'
