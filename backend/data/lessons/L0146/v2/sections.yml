vocab_definitions:
  items:
  - index: 1
    word: 遷徙
    definition: 指成群的人或動物，從一個地方搬到另一個地方。
  - index: 2
    word: 典故
    definition: 指地名、人物、事件背後的歷史來源、語言根源或文化故事。
  - index: 3
    word: 溯源
    definition: 往回找，找到事物最早的來源或原因。
  - index: 4
    word: 匯流
    definition: 匯：水流會合。指不同方向的水流、意見或資訊聚集在一起。
  - index: 5
    word: 如出一轍
    definition: 轍：車子走過的輪跡。比喻做法或想法幾乎一模一樣，像同一個輪子印出來的。
  - index: 6
    word: 浩瀚無垠
    definition: 形容非常廣大，看不到邊際。
  - index: 7
    word: 言歸正傳󠇡
    definition: 把話題拉回原來要談的重點。
  - index: 8
    word: 引人入勝
    definition: 內容很有吸引力，帶人走進美好的情境。
  - index: 9
    word: 開枝散葉
    definition: 像樹木長出新的枝葉，比喻家族或事物逐漸繁衍、擴展。
  - index: 10
    word: 司空見慣
    definition: 常常看到，已經覺得很平常、不奇怪。
  - index: 11
    word: 接踵而來
    definition: 踵：腳後跟；「接踵而來」指的是前一人的腳後跟，接著下一個人的腳後腳。比喻事情一件接著一件發生，連續不斷的到來。
  - index: 12
    word: 歲月淘洗
    definition: 比喻時間像水流一樣，不斷沖刷、篩選，造成了改變。
  - index: 13
    word: 天馬行空
    definition: 形容想法非常自由、不受拘束，富有想像力。
  - index: 14
    word: 耐人尋味
    definition: 讓人越想越覺得有意思，值得細細品味、反覆思考。
