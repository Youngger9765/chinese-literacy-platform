comprehension:
  questions:
  - index: 1
    answer: A
    stem: 請問下列語詞，何者使用錯誤？
    options:
      A: 語言一旦發音改變，就很難再追查到更早的來源
      B: 語言隨著時間推移會逐漸消失，因此不具研究價值
      C: 語言即使發音改變，仍可能追查到更早的來源與根源
      D: 語言隨時間改變的只有發音，原本的語意一定不會改變
    rationale: 「淘洗」指時間造成的變化，但「仍可溯源」強調變中有不變，需要整句推論理解。
  - index: 3
    answer: B
    stem: 文中舉「那個→辣個」、「很熱→很樂」的例子，是用來說明什麼？
    options:
      B: 透過跨島語族詞彙的相似性引起驚奇，再說明其背後的觀點
      D: 運用專業的語言學知識與研究成果，提高文章的學術深度
      A: 從萬華地名的溯源切入，讓讀者了解當地原住民與漢人的互動
      C: 詳細介紹南島語族的分布範圍，讓讀者認識其活動區域之廣
    rationale: 作者用生活例子說明語言在傳遞過程中會自然變化，呼應南島語族語言的音變現象。
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 1.0
    answers_recovered_from_rationale: 0
    verdict: ok
