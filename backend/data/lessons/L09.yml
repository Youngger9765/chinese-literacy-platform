multiple_choice:
- question: 請問第三段「多年的鍛鍊讓周天成的體脂率不到百分之五，但他對自己的要求從不鬆懈。」文中的「鍛鍊」可以用哪個詞語替換?
  options:
  - 刻苦訓練。
  - 練習功夫。
  - 放鬆筋骨。
  - 排練演習。
  answer: A
  explanation: 由多年的鍛鍊讓周天成的脂肪不到5%可知，是經由不斷的訓練而來
- question: 本文主題是周天成的自律，請問以下哪一選項與這主題最不相關？
  options:
  - 羽球的基本訓練。
  - 強化鍛錬體能、預防傷害。
  - 私人拜會、參與公開活動。
  - 嚴格監控飲食。
  answer: C
  explanation: 由第五段可知拜會行程是為了爭取企業贊助
- question: 為什麼周天成已經是羽球一哥，仍然不斷的持續精進自己？
  options:
  - 他認為輸了比賽，先前的努力都白費了。
  - 想得到更多企業、政府機構的贊助。
  - 他想要追求體脂肪5%的體態。
  - 有了好成績，更有說服力影響他人。
  answer: D
  explanation: 第六段，好成績才可以去回饋影響他人
- question: 下列何者是本篇文章並沒有提到的？
  options:
  - 周天成日復一日的練習。（第二段）
  - 周天成的每日營養菜單。
  - 運動員的自主保護觀念。（第五段）
  - 周天成強健肌肉的由來。（第三段）
  answer: B
  explanation: 第四段只提到周天成吃飯的順序
- question: 根據本文末段，關於羽球選手周天成的形象，何者正確？
  options:
  - 追求完美，保持全身體態的健美。
  - 力求突破，不滿足階段性的成功。
  - 追求新鮮感，喜愛嘗試新奇事物。
  - 熱愛台灣，提升台灣國際競爭力。
  answer: B
  explanation: 雖然課文的完整內容未提供，但從標題「頂尖選手的養成」以及課文語詞「羅馬不是一天造成的」（指任何偉大表現需長期累積，不滿足於現狀）推斷，一位頂尖選手的養成過程必然是持續追求突破，不滿足於階段性的成功。
