spotlight:
  lesson: G4-L2
  strategy_name: 推論策略-找出故事道理
  strategy_type: inference
  blocks:
  - type: guide
    text: "讀故事時，我們不只要知道「發生了什麼事」，還要想：\n    這些事情想讓我明白什麼？\n    這就是故事的道理，也就是這個故事最想告訴我們的想法。\n\
      找故事道理時，可以用四個步驟：\n❶看狀況：故事一開始主角面對什麼狀況？有什麼願望或困難？\n❷找關鍵：後來哪件事最重要？這件事產生什麼影響或結果？\n\
      ❸說道理：這件事讓我們明白什麼？\n❹找證據：故事哪裡可以支持這句道理？回到故事裡，找出支持這句道理的地方。"
  - type: guide
    text: 例一：正太與小豬
  - type: free_text
    prompt: 1.正太與小豬這個故事想告訴我們什麼道理？我們用四個步驟來看：
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.你發現了嗎？
  - type: guide
    text: 正太每天抱小豬，表面上像是在做雜事，其實是在每天承受一點一點增加的挑戰。這些故事線索可以支持這個道理：
  - type: guide
    text: →能力不是一下子練成的，而是每天一點一點累積起來的。
  - type: guide
    text: 例二：龜兔賽跑
  - type: guide
    text: 龜兔賽跑
  - type: guide
    text: 有一天，烏龜和兔子在聊天，不知不覺說到誰跑得比較快，於是兔子便邀約烏龜比賽跑步。一開始，兔子大幅領先烏龜，但不久後，兔子便開始輕敵，認為即使小睡一下，烏龜仍追趕不上牠，便到路邊睡覺。結果烏龜後來趕上，等到兔子醒了時，烏龜已經到達終點了。
  - type: free_text
    prompt: 1.龜兔賽跑這個故事想告訴我們什麼道理？我們用四個步驟來看：
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: free_text
    prompt: 2.你發現了嗎？
  - type: guide
    text: 故事道理不是只看一件事，而是要把一開始的狀況、關鍵事件和結果連起來看，才能知道故事想告訴我們什麼。
  - type: guide
    text: 例三：破掉的水桶
  - type: guide
    text: 破掉的水桶
  - type: guide
    text: 一個農夫每天用兩個水桶從河裡取水回家，其中一個水桶有裂縫，每次走回家時，它總是漏掉一半的水，而另一個水桶則能保持完整的水量。
  - type: guide
    text: 破掉的水桶很自卑，對農夫說：「對不起，我讓你浪費了一半的水。」但農夫笑著回答：「你有沒有注意到，沿路的花都只長在你的那一側？因為你的裂縫讓水滴落在地上，澆灌了這條路旁的花朵，讓我們有了一條美麗的小路！」
  - type: single
    prompt: 1.「破掉的水桶」這個故事想告訴我們什麼道理？(可複選)
    options:
    - 人生應該盡量避免失敗，追求完美才能心靈滿足。
    - 每個人都有自己的價值，不必因為不完美而自卑。
    - 換個角度，不完美的事物也可能有獨特的貢獻。
    - 只要你努力達成目標，過程中的小瑕疵並不重要。
    answer: 每個人都有自己的價值，不必因為不完美而自卑。
  - type: single
    prompt: 2.請想想，哪一組線索最能支持你推論出的道理？(單選)
    options:
    - 破水桶一開始很自卑，覺得自己浪費水、沒有用；後來農夫指出，裂縫滴下的水澆灌了路旁的花。
    - 破水桶每次回家漏掉一半水；另一個水桶能保持完整水量。
    answer: 破水桶一開始很自卑，覺得自己浪費水、沒有用；後來農夫指出，裂縫滴下的水澆灌了路旁的花。
  - type: free_text
    prompt: 3.你發現了嗎？
  - type: guide
    text: 找故事道理時，要先抓住故事裡最重要的線索，再想：這些線索想讓我明白什麼？
