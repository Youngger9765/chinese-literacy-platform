lesson_uid: L0013
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: A
    stem: 下列語詞，何者使用正確?
    options:
      A: 那位保鏢「身材魁梧」，站在門口架勢十足
      B: 炎炎夏日，「金風送爽」，大家熱得滿頭大汗
      C: 他得到第一名，高興得「抱頭鼠竄」，與人分享喜悅
      D: 她突然靈感爆發，「循序漸進」的寫完了一整本小說
    teacher_note: 第1題解析：Ｂ「金風送爽」指涼爽天氣，而非炎炎夏日、Ｃ抱頭鼠竄用於負面情境、Ｄ爆發與循序漸進兩者矛盾。
  - index: 2
    answer: C
    stem: 為什麼正太想進入興福寺學武？
    options:
      A: 他想變得會作戰，變成將軍
      B: 他希望學習佛法，成為高僧
      C: 他想學習武功才能打倒惡霸
      D: 他喜歡寺廟平靜清閒的生活
    teacher_note: （文中第一段）— 原稿印在選項 C 右側
  - index: 3
    answer: B
    stem: 正太剛開始養豬時，對這項任務的想法及態度是什麼？
    options:
      A: 他覺得這是一種特殊的武術訓練，興奮不已
      B: 他不開心，心中無奈，但還是勉強服從
      C: 他認為這是培養耐心的一種方式，欣然接受
      D: 他覺得師父簡直把無聊當有趣，氣憤拒絕
    teacher_note: （第二段。）— 原稿印在選項 A 右側
  - index: 4
    answer: C
    stem: 從全文來看，師父讓正太每天抱小豬，真正的用意最可能是什麼？
    options:
      A: 讓正太學會照顧小豬，培養愛心
      B: 讓正太先做雜事，以後才開始學武功
      C: 用每天增加的重量，慢慢訓練正太的身體
      D: 讓正太知道學武很辛苦，所以不要抱怨
  - index: 5
    answer: D
    stem: 請問本文主旨是什麼？
    options:
      A: 天才出於名門，才能必須由名師傳授
      B: 一個成功的領袖知道如何運用他人的優勢
      C: 工欲善其事，必先利其器
      D: 成功沒有捷徑，需要日積月累的努力
    teacher_note: （從故事可知，正太最後能夠變得身材魁梧，就是因為每天抱豬，長久的鍛鍊日積月累，才能成功。）
