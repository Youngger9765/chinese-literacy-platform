  answer: Ａ
- sentence: 我最近真是(  Ｉ  )了，居然有人跑去跟老師告我的狀，說我作弊，根本是造謠生事！
  answer: 精采了
multiple_choice:
- question: 下列選項「  」中的語詞，何者使用正確？
  options:
  - 胖虎把桌上的牛奶倒在大雄頭上，讓大雄「醍醐灌頂」，好過分。
  - 弟弟遊戲輸了都會「撒賴」，要大家陪他再玩一次，真拿他沒辦法。
  - 小夫在教室大聲的「嘀咕」説小明的壞話，讓小明氣到不跟他說話。
  - 馬戲團表演者被大砲發射出去，飛到天上去，可說是「難如登天」。
  answer: B
  explanation: 「撒賴」指賴皮不認帳或無理取鬧，弟弟輸了遊戲要求重玩符合此義。而A選項的「醍醐灌頂」是形容得到啟發，與被倒牛奶的情境不符；C選項的「嘀咕」是指小聲說話，與「大聲的」相矛盾；D選項的「難如登天」是用來形
- question: 作者小時候百思不解的問題是什麼呢？
  options:
  - 為什麼大人給零食時，都要他們「公家吃」？
  - 為什麼作者常常要被迫跟姊姊分享同一個餅？
  - 為什麼祖母都是讓姊姊來分餅，作者選餅呢？
  - 為什麼他用盡策略，姊姊分到的餅都比較大？
  answer: D
  explanation: 雖然提供的課文內容並未直接描述作者小時候分享餅的具體情節，但從課文標題「把手上的餅吃香一點！」以及作者早期「總覺得自己好慘，別人好幸運」的心情來看，再結合「百思不解」的詞義，選項D描述了作者面對一個努
- question: 第六段中提到「……，吸引了一位跟我有同樣毛病的小朋友，……」，請問這裡指的「同樣毛病」，是什麼毛病呢？
  options:
  - 愛計較，見到糖果餅乾都非常「餓鬼」。
  - 只要遇到不順心的事，就對家人耍賴。
  - 覺得別人得到的，都比自己擁有的好。
  - 平常愛抱怨，總是自怨自艾感到鬱悶。
  answer: C
  explanation: 課文內容的評論提到：「作者在文章第四段說，他總覺得自己好慘，別人好幸運；但到了第十段，只要有人問作者好不好，作者一律回答『超讚的』或『太好了』。前後差異這麼大，難道是作者運氣變好了嗎？並不是。作者的運
- question: 作者讀完湯姆歷險記的故事前，無論在什麼狀況，「總覺得別人擁有的東西比較好」，下面哪句俗諺語和作者以前的想法不同？
  options:
  - 柿子你要挑軟的吃。
  - 外國的月亮比較圓。
  - 遠來的和尚會念經。
  - 隔牆的蘋果比較甜。
  answer: A
  explanation: 作者以前的想法是「總覺得別人擁有的東西比較好」，選項B、C、D都與這種「覺得別人比較好」的心態相似，而選項A「柿子你要挑軟的吃」是指選擇對自己有利或輕鬆的方式，與羨慕或認為他人擁有較好東西的心態不同。
- question: 運動會，大家期待已久的大隊接力比賽，因為下雨而延期了，下面哪些想法是比較正向的呢？
  options:
  - 甲乙
  - 乙丙
  - 丙丁
  - 甲丁。
  answer: A
  explanation: 中英字幕
