vocabulary:
- word: 難如登天
  definition: 形容非常困難，像登天一樣困難。
- word: 嘀咕
  definition: 小聲說話。說話時帶有抱怨或猜疑的語氣。
- word: 怨懟
  definition: 不滿、抱怨。
- word: 慢條斯理
  definition: 形容講話、做事慢吞吞不著急的樣子。
- word: 自怨自艾
  definition: 現在指怨恨、後悔，或自我責備。
- word: 嘴饞
  definition: 貪吃。
- word: 層出不窮
  definition: 接連不斷地出現，好像沒有盡頭。窮，指盡頭。
- word: 撒賴
  definition: 賴皮不認帳。
- word: 醍醐灌頂
  definition: 讓人得到啟發，徹底覺醒，好像頭頂被灌入智慧。醍醐，是牛奶提煉出的乳酪，佛教將它比喻為智慧。
- word: 故技重施
  definition: 再次使用同樣的手段或方法。
- word: 百思不解
  definition: 經過反覆思考，還是不能了解。
- word: 儼然
  definition: 好像、很像。
- word: 犯小人
  definition: 身旁出現了故意要害你的人。
