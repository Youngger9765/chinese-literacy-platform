- sentence: 教練要小夫每天多練習半小時，小夫不滿的(　　)幾句，讓教練大發雷霆。
  answer: Ｂ
- sentence: 他向來小氣，你想要他請你吃東西，簡直就(　　)。
  answer: Ｄ
- sentence: 詐騙集團騙人的手法不斷更新，被騙的案例(　　)，大家應該多加小心。
  answer: Ｃ
- sentence: 她總是認為自己受到了不公平的對待，因此內心充滿了 (　　)。
  answer: Ｆ
- sentence: 集合時間快要到了，同組的同學們還(  Ｈ  )的收拾行李，讓我好著急。
  answer: 慢條斯理
- sentence: 胖虎邀請大家去參加他的新歌發表會，舞台上，他臉上自信的表情，(　　)認為自己是大歌星。
  answer: Ｇ
- sentence: 輸球後，他每天(　　)，後悔當天出現大失誤，才會與冠軍擦肩而過。
  answer: Ｅ
