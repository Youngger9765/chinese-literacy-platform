vocabulary:
- word: 殘骸
  definition: 物體被破壞後留下的不完整部分。
- word: 危機四伏
  definition: 到處都有潛藏的危險。
- word: 蚊蚋
  definition: 蚊和蚋都是會吸血的小昆蟲，常見於潮濕環境。
- word: 襁褓
  definition: 兩字都指包裹嬰兒的布，指還需被照料的嬰兒。
- word: 骨瘦如柴
  definition: 形容人因長期饑餓而非常瘦的樣子。
- word: 渺茫
  definition: 狀況不明確，難以預料，通常用於希望很小的狀況。
- word: 倖存
  definition: 災難中意外活下來。
- word: 罹難
  definition: 遇到災難而死亡。
- word: 充飢
  definition: 吃東西以解除飢餓。
- word: 植被
  definition: 覆蓋地面的植物。
