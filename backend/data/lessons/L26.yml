fill_in_blank:
- sentence: 地震過後，街道上只剩下許多房屋的（　　），景象十分淒慘。
  answer: A
- sentence: 獨自一人走進這座漆黑的森林，感覺前方（　　），令人心生畏懼。
  answer: B
- sentence: 夏日傍晚，潮濕的公園裡總是飛舞著許多叮人的（　　），讓人不堪其擾。
  answer: C
- sentence: 妹妹還在（　　）之中，需要媽媽寸步不離地細心照料。
  answer: D
- sentence: 長期挨餓的流浪狗，瘦得幾乎（　　），看了真讓人心疼。
  answer: E
- sentence: 在大雨中迷失在深山裡，搜救隊能否及時趕到，希望顯得十分（　　）。
  answer: F
- sentence: 在那場無情的大火中，只有少數人幸運地（　　）下來。
  answer: G
- sentence: 突如其來的大地震，造成許多無辜民眾不幸（　　）。
  answer: H
- sentence: 為了趕時間，他匆匆忙忙地吃了一塊麵包來（　　）。
  answer: I
- sentence: 山坡上茂密的（　　）有助於防止水土流失，保護環境。
  answer: J
multiple_choice:
- question: 以下哪種人最不需要尋找食物？
  options:
  - 罹難者。
  - 骨瘦如柴者。
  - 生還者。
  - 倖存者。
  answer: A
  explanation: 「罹難」指的是遭遇不幸而喪失生命，與食物尋找無關。
- question: 四名孩童在亞馬遜雨林中生還的最主要原因是什麼？
  options:
  - 飛機上的儲備食物充足。
  - 軍方的特種部隊快速反應。
  - 當地原住民的積極參與。
  - 萊絲莉的野外求生技巧。
  answer: D
  explanation: 課文中明確提到：「課文中孩童之所以得以奇蹟生存，主要是因為萊絲莉掌握了保命原則並運用了族人教導的野外求生技巧。」因此，萊絲莉的野外求生技巧是他們生還的最主要原因。
- question: 哥倫比亞軍方在搜救過程中面臨的主要挑戰是什麼?
  options:
  - 沒有足夠的人手和裝備。
  - 叢林環境惡劣，能見度低。
  - 當地原住民多數不合作。
  - 合格搜救犬的數量不足。
  answer: B
  explanation: 課文中雖然沒有直接說明哥倫比亞軍方所面臨的挑戰，但有提到搜救發生的地點是「惡劣的環境」，且「這片叢林危機四伏，裡面有許多毒蛇和猛獸」，間接說明了惡劣的叢林環境是搜救行動的一大挑戰。
- question: 為何這場救援行動被稱為「奇蹟行動」？
  options:
  - 因為孩子們在叢林中生還的可能性極低。
  - 因為搜救隊在極短時間內找到了孩子們。
  - 因為這是哥倫比亞歷史上最大規模的搜救行動。
  - 因為搜救隊使用了高科技裝備進行搜救。
  answer: A
  explanation: 課文中有提到在惡劣環境中，「生還的機會非常渺茫」，因此孩子們能夠生存下來被視為奇蹟。
- question: 本文的主旨是什麼？請選出最合宜的選項。
  options:
  - 描述哥倫比亞原住民在雨林中野外求生的專長。
  - 討論哥倫比亞政府對空難事件的應急處置。
  - 描述四名孩童在雨林中40天如何求生、獲救的經歷。
  - 說明亞馬遜雨林惡劣的環境，讓人難以生存。
  answer: C
  explanation: 課文標題「奇蹟行動」本身就暗示著一個關於奇蹟生還的故事，而課文中明確提到「課文中孩童之所以得以奇蹟生存，主要是因為萊絲莉掌握了保命原則並運用了族人教導的野外求生技巧」，這直接點出了其主旨是關於孩童在惡
