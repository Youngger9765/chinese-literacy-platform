strategy: 拆詞釋義──藉由拆解字詞來推測詞義
課文作者: 林玫伶
學習單: 陳允捷
lesson_no: 7
series: 一般
lesson_seq: 5070
intro: 這篇文章要帶大家認識「仿生學」，也就是科學家如何從大自然中的生物身上獲得靈感，進而發明出各種新科技。文章以植物為主角，介紹了楓樹種子如何啟發科學家設計出小巧省電的飛行機器人；向日葵追逐太陽的特性，如何幫助科學家發明出更有效率的太陽能板；還有風滾草滾動散播種子的方式，又如何讓科學家構思出能在火星上滾動的探測器。透過這些有趣的例子，你會發現植物看似平凡，卻蘊藏著許多值得我們學習的生存智慧，也為人類的科技發展帶來了無限可能。
