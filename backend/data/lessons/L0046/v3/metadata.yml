  總表_對照: "總表 11 個語詞與學習單的差異出在**同一個位置**：總表列「探測車」，學習單的\n「本課語詞」框與第四大題列「崎嶇難行」，其餘 10 個完全相同。\n\
    ・學習單三處自己也不一致：\n  「本課語詞」框（11）＝第四大題語詞我最棒（11）＝含崎嶇難行、不含探測車；\n  第八大題找字框（12）＝**兩個都有**（崎嶇難行\
    \ ＋ 探測車），且 12 個圈全部圈到。\n・課文兩個詞都出現：「崎嶇難行的地形」（第 7 段）與「原本的火星探測器」（第 7 段，\n  課文寫「探測器」不是「探測車」）。\n\
    ・第三大題聚光燈「二、哪些詞可以試試拆詞釋義」只列 9 個，兩者都沒列到。\n結論：這是來源側的清單不一致，不是抽取漏抄，故照原樣分別記錄、不合併也不補齊。"
strategy_explained: '這一課我們要練習「拆開字詞，猜猜意思」的本領

  這篇文章裡面有很多關於「仿生學」的新名詞，像是「楓樹種子」、「向日葵」、「風滾草」等等，把這些詞拆開來，就可以更容易了解它們的意思，還有科學家從這些植物身上學到了什麼

  讀的時候，看到不懂的詞，可以試試看把這個詞拆成小小的字，猜猜看每個字的意思，也許就能連起來，弄懂整個詞的意思喔'
