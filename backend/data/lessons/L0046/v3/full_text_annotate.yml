  paragraphs:
  - idx: 1
    text: 你知道嗎？植物在地球上已經存在超過四億年。經過漫長的演化，植物發展出各式各樣的驚人適應能力。它們的生存智慧，為科學家帶來無限的啟發，讓我們一起看看這些「植物老師」如何引領科學家走上創新之路！
    followed_by_heading: 會飛的小種子
  - idx: 2
    text: 當楓樹的種子從樹上飄落時，會像小直升機一樣旋轉降落。這種特別的飛行方式讓它們能夠被風帶到更遠的地方，找到適合生長的新家。科學家受到楓樹種子的啟發，設計了一種名叫沙馬雷的飛行機器人！
  - idx: 3
    text: 沙馬雷和一般的無人機不一樣，它只有一片翅膀，因此構造簡單，體積更小，更省電，而且沒電時，它會盤旋而下，比較不會摔壞！它和一般無人機一樣，可以垂直起降，在狹窄的空間靈活飛行。內建攝影機時，可以幫助人類進行搜救、環境監測，甚至探索危機四伏、險象環生的災難現場。
    marker: ☞ 印在本段句首（念順順起點）
    followed_by_heading: 跟著太陽轉的花苞
  - idx: 4
    text: 還沒開花的向日葵花苞，早晨朝向東方，到了下午則轉向西方，整天彷彿在追逐太陽！這種「向陽性」讓科學家發明了一種能自動調整角度的仿生太陽能板，讓太陽能發電變得更有效率！
  - idx: 5
    text: 一般的太陽能板角度是固定的，當太陽移動後，吸收陽光的效率就會降低。但這種仿生設計模仿向日葵的特性，讓太陽能板可以「跟著太陽轉」，整天都能吸收到最多陽光，發電量大幅提升。這項技術已經在多個國家被應用，為地球提供更多乾淨能源！
    followed_by_heading: 滾來滾去的草球
  - idx: 6
    text: 西部電影中，常看到有些乾草球在荒涼的大地上滾來滾去，那就是風滾草！風滾草其實是某些植物成熟或枯死後，由枯乾的莖葉形成的大草球。強風吹起時，草球就會在原野上翻滾和轉動，藉此散播種子。
  - idx: 7
    text: 這種靠風「滾來滾去」的方式，也讓科學家有了探索火星的新點子！火星地表有許多崎嶇難行的地形，原本的火星探測器在這些地方移動得很慢。科學家便想到：如果探測器能像風滾草一樣，靠風在廣闊無垠的火星地表上滾動，就能前往更多地方蒐集資料。於是，他們設計出一種像大球的探測器，裡面裝著科學儀器，可以一邊滾動，一邊記錄火星各地的環境。
  - idx: 8
    text: 科學家從動物、植物獲取靈感，模仿它們的特性，設計出有用的科技產品，這門學問叫做仿生學。植物看似不動，但它們經過億萬年的演化，擁有許多聰明的生存技巧，為人類帶來無限啟發。下次，當你看到身邊的花草樹木，不妨仔細觀察，說不定也會從植物身上激發出好點子呢！
