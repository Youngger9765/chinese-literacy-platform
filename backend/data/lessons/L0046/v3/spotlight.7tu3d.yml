section_no: 三
spotlight:
  strategy_name: 詞彙推測策略─拆詞釋義
  strategy_type: vocabulary
  section_title_printed: 閱讀聚光燈
  blocks:
  - type: concept_box
    text: '上一課，我們學過遇到不認識的詞，可以用「拆詞釋義」推測詞義。只要拆開後的字或詞看得懂，合起來也說得通，就適合使用這個方法。

      這課要再進一步學：拆詞時，不一定要把每個字都分開，熟悉而且有完整意思的詞，可以放在一起看。遇到少數不懂的部分，也可以先利用自己看得懂的部分，再配合原句推測詞義。

      使用拆詞釋義時，可以照著四個步驟來做：

      ❶拆一拆：把語詞拆開。

      ❷想意思：想想每個字或詞的意思。

      ❸合詞義：把各部分的意思合起來，推測整個詞義。

      ❹放回句子：把推測出的詞義放回原句，讀一讀，看看是否合理。

      小提醒：如果拆開後大部分字詞都不懂，或推測的意思放回原句不合理，就表示這個詞可能不適合用「拆詞釋義」，要改用其他方法。'
  - type: guide
    text: 一、拆詞釋義練習
  - type: sub_block
    label: 例一：向陽性
    instruction: 例一：向陽性
    quote: 句子：向日葵花苞的向陽性，讓科學家設計出能自動調整角度的仿生太陽能板。
    answer_carrier: 紅色 ☑ 與橘框圈選（圖形，文字流無此資訊）；❸合詞義的手寫答案在文字流內
    items:
    - type: free_text
      prompt: '❶拆一拆：請先用「／」把語詞拆開。拆詞不一定要逐字拆，也可以幾個字一起看。

        向陽性'
      answers_printed: false
      answer_note: '拆解的「／」由學生自己畫，教師版此處只印「向陽性」三個字（字間留空），

        沒有印任何斜線。後面的「→你發現了嗎」才揭示答案是「向陽／性」。'
    - type: single
      prompt: 先判斷：拆開後，這些字詞的意思我都知道嗎？
      options:
        1: 都知道，可以繼續使用拆詞釋義。
        2: 大多不知道，先改用其他方法。
      answers_printed: false
      answer_note: '兩個選項在教師版都是空白 □，沒有勾。這一題**有**標準答案（依後續步驟推進可知是①），

        只是教師版沒印 —— 不是「本來就沒有標準答案」，故用 answers_printed 而非 no_correct_answer。

        例二的同一步驟也沒勾，是一致的缺印（與 L0045 同型）。'
    - type: exercise
      prompt: ❷想意思：請圈出比較適合的意思
      items:
      - type: single
        prompt: ⑴向陽：朝向陽光／指示方向
        options:
          1: 朝向陽光
          2: 指示方向
        answer: 1
      - type: single
        prompt: ⑵ 性：　個性／　特性
        options:
          1: 個性
          2: 特性
        answer: 2
    - type: free_text
      prompt: '❸合詞義：把兩部分的意思合起來

        ⑴向陽性：【　】'
      blanks:
      - answer: 朝向陽光的特性
    - type: single
      prompt: ❹放回句子：把上面推測的詞義放回原句，讀一讀，看看是否合理。
      options:
        1: 合理
        2: 不合理，試其他方法
      answer: 1
    - type: guide
      text: →你發現了嗎？拆詞時，不一定要一個字一個字拆。像「向陽性」可以拆成「向陽／性」，更容易推測出詞義喔！
  - type: sub_block
    label: 例二：廣闊無垠
    instruction: 例二：廣闊無垠
    quote: 句子：像大球的探測器可以在廣闊無垠的火星地表上滾動。
    answer_carrier: 紅色 ☑ 與紅框圈選（圖形，文字流無此資訊）；❸合詞義的手寫答案在文字流內
    items:
    - type: free_text
      prompt: '❶拆一拆：請先用「／」把語詞拆開。拆詞不一定要逐字拆，也可以幾個字一起看。

        廣闊無垠'
      answers_printed: false
      answer_note: 同例一，斜線由學生自己畫，教師版只印「廣闊無垠」四個字。
    - type: single
      prompt: 先判斷：拆開後，這些字詞的意思我都知道嗎？
      options:
        1: 都知道，可以繼續使用拆詞釋義。
        2: 大多不知道，先改用其他方法。
      answers_printed: false
      answer_note: 同例一，兩個選項在教師版都是空白 □。
    - type: exercise
      prompt: ❷想意思：請圈出比較適合的意思
      items:
      - type: single
        prompt: ⑴廣闊：範圍很大／地面平坦
        options:
          1: 範圍很大
          2: 地面平坦
        answer: 1
      - type: single
        prompt: ⑵無：沒有／很多
        options:
          1: 沒有
          2: 很多
        answer: 1
      - type: single
        prompt: ⑶垠：
        options:
          1: 知道
          2: 不知道
        answers_printed: false
        answer_note: '自陳是否認識「垠」字，教師版兩個 □ 都沒勾。下一行「即使不確定『垠』的意思」

          暗示教學上預期是②，但沒有印出來，故標 answers_printed 而不是逕自填②。'
    - type: guide
      text: 即使不確定「垠」的意思，也可以先用熟悉的部分猜一猜。
    - type: free_text
      prompt: '❸合詞義：把知道的意思合起來，再配合原句推測詞義

        ⑴廣闊無垠可能是：【　】'
      blanks:
      - answer: 範圍很大，沒有盡頭
    - type: guide
      text: 查一查可以知道，「垠」是邊界，因此「廣闊無垠」是形容範圍很大，沒有邊界。
    - type: single
      prompt: ❹放回句子：把推測的詞義放回原句，讀一讀，看看是否合理。
      options:
        1: 合理
        2: 不合理，試其他方法
      answer: 1
    - type: guide
      text: →你發現了嗎？拆詞後，有一個字不知道，也有機會先用熟悉的部分猜出大概意思！
  - type: guide
    text: 二、哪些詞可以試試拆詞釋義？
  - type: multi
    prompt: 下面是本課的語詞。如果你不懂整個詞，但知道拆開後大部分字詞的意思，就把它圈起來。
    options:
      1: 引領
      2: 盤旋
      3: 垂直起降
      4: 仿生學
      5: 內建
      6: 危機四伏
      7: 追逐
      8: 崎嶇難行
      9: 險象環生
    no_correct_answer: true
    answer_carrier: 學生自圈，教師版沒有任何圈選
    note: '學習單下一行自己註明「◎每個人熟悉的字詞不同，圈出的答案也可能不同。」

      ——本題**本來就沒有標準答案**，故用 no_correct_answer（不是 answers_printed）。

      ⚠️ 這 9 個語詞是本課語詞的子集：11 個語詞中少了「向陽性」「廣闊無垠」

      （那兩個已經在上面當示範例題用掉了），是刻意的，不是漏抄。'
  - type: guide
    text: ◎每個人熟悉的字詞不同，圈出的答案也可能不同。
  - type: concept_box
    label: ◎拆詞釋義小提醒
    text: '不是每個詞都適合用拆詞釋義。拆開後如果大多不懂，或推測的意思放回原句不合理，就要改用其他方法。

      例如，「馬馬虎虎」是做事隨便，不能從「馬」和「虎」的意思猜出，所以不適合用拆詞釋義。'
