  - type: free_text
    prompt: (5)這支手機(  A  )多種拍照功能。
  - type: free_text
    prompt: (6)站在山頂上，看著(  F  )的綠色草原，心情格外愉快。
  - type: free_text
    prompt: (7)教室窗邊的植物具有(  H  )，枝葉總是朝著陽光生長。
  - type: free_text
