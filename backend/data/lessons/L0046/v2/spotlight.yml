spotlight:
  lesson: G5-L7
  strategy_name: 詞彙推測策略-拆詞釋義
  strategy_type: inference
  blocks:
  - type: guide
    text: 上一課，我們學過遇到不認識的詞，可以用「拆詞釋義」推測詞義。只要拆開後的字或詞看得懂，合起來也說得通，就適合使用這個方法。這課要再進一步學：拆詞時，不一定要把每個字都分開，熟悉而且有完整意思的詞，可以放在一起看。遇到少數不懂的部分，也可以先利用自己看得懂的部分，再配合原句推測詞義。使用拆詞釋義時，可以照著四個步驟來做：❶拆一拆：把語詞拆開。❷想意思：想想每個字或詞的意思。❸合詞義：把各部分的意思合起來，推測整個詞義。❹放回句子：把推測出的詞義放回原句，讀一讀，看看是否合理。小提醒：如果拆開後大部分字詞都不懂，或推測的意思放回原句不合理，就表示這個詞可能不適合用「拆詞釋義」，要改用其他方法。
  - type: guide
    text: 一、拆詞釋義練習
  - type: guide
    text: 例一：向陽性
  - type: guide
    text: 句子：向日葵花苞的向陽性，讓科學家設計出能自動調整角度的仿生太陽能板。
  - type: free_text
    prompt: ❶拆一拆：請先用「／」把語詞拆開。拆詞不一定要逐字拆，也可以幾個字一起看。
  - type: guide
    text: 向陽性
  - type: single
    prompt: 先判斷：拆開後，這些字詞的意思我都知道嗎？
    options:
    - 都知道，可以繼續使用拆詞釋義。
    - 大多不知道，先改用其他方法。
    answer: 都知道，可以繼續使用拆詞釋義。
  - type: free_text
    prompt: ❷想意思：請圈出比較適合的意思
  - type: guide
    text: ⑴向陽：朝向陽光／指示方向
  - type: guide
    text: ⑵ 性：　個性／　特性
  - type: free_text
    prompt: ❸合詞義：把兩部分的意思合起來
  - type: guide
    text: ⑴向陽性：     朝向陽光的特性
  - type: single
    prompt: ❹放回句子：把上面推測的詞義放回原句，讀一讀，看看是否合理。
    options:
    - 合理
    - 不合理，試其他方法
    answer: 合理
  - type: guide
    text: →你發現了嗎？拆詞時，不一定要一個字一個字拆。像「向陽性」可以拆成「向陽／性」，更容易推測出詞義喔！
  - type: guide
    text: 例二：廣闊無垠
  - type: guide
    text: 句子：像大球的探測器可以在廣闊無垠的火星地表上滾動。
  - type: free_text
    prompt: ❶拆一拆：請先用「／」把語詞拆開。拆詞不一定要逐字拆，也可以幾個字一起看。
  - type: guide
    text: 廣闊無垠
  - type: single
    prompt: 先判斷：拆開後，這些字詞的意思我都知道嗎？
    options:
    - 都知道，可以繼續使用拆詞釋義。
    - 大多不知道，先改用其他方法。
    answer: 都知道，可以繼續使用拆詞釋義。
  - type: free_text
    prompt: ❷想意思：請圈出比較適合的意思
  - type: guide
    text: ⑴廣闊：範圍很大／地面平坦
  - type: guide
    text: ⑵無：沒有／很多
  - type: single
    prompt: 請選擇
    options:
    - 知道
    - 不知道
    answer: 知道
  - type: guide
    text: 即使不確定「垠」的意思，也可以先用熟悉的部分猜一猜。
  - type: free_text
    prompt: ❸合詞義：把知道的意思合起來，再配合原句推測詞義
  - type: guide
    text: ⑴廣闊無垠可能是：     範圍很大，沒有盡頭
  - type: guide
    text: 查一查可以知道，「垠」是邊界，因此「廣闊無垠」是形容範圍很大，沒有邊界。
  - type: single
    prompt: ❹放回句子：把推測的詞義放回原句，讀一讀，看看是否合理。
    options:
    - 合理
    - 不合理，試其他方法
    answer: 合理
  - type: guide
    text: →你發現了嗎？拆詞後，有一個字不知道，也有機會先用熟悉的部分猜出大概意思！
  - type: guide
    text: 二、哪些詞可以試試拆詞釋義？
  - type: guide
    text: 下面是本課的語詞。如果你不懂整個詞，但知道拆開後大部分字詞的意思，就把它圈起來。
  - type: free_text
    prompt: 1.引領　　  2.盤旋　　3.垂直起降　　4.仿生學    5.內建
  - type: free_text
    prompt: 6.危機四伏  7.追逐    8.崎嶇難行　　9.險象環生
  - type: guide
    text: ◎每個人熟悉的字詞不同，圈出的答案也可能不同。
  - type: guide
    text: ◎拆詞釋義小提醒
  - type: guide
    text: 不是每個詞都適合用拆詞釋義。拆開後如果大多不懂，或推測的意思放回原句不合理，就要改用其他方法。
  - type: guide
    text: 例如，「馬馬虎虎」是做事隨便，不能從「馬」和「虎」的意思猜出，所以不適合用拆詞釋義。
  - type: guide
    text: 本課語詞：引領、盤旋、崎嶇難行、垂直起降、仿生學、內建、向陽性、危機四伏、追逐、廣闊無垠、險象環生。本課語詞：引領、盤旋、崎嶇難行、垂直起降、仿生學、內建、向陽性、危機四伏、追逐、廣闊無垠、險象環生。請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：🅐
      從本課語詞框框，找語詞。🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。🅒 問同學。請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：🅐 從本課語詞框框，找語詞。🅑
      再回到課文讀讀看，這個解釋可能是哪個語詞的意思。🅒 問同學。四語詞我最棒 四語詞我最棒
  - type: free_text
    prompt: (1)   仿生學        ：模仿生物的構造或特性，設計產品或技術的學問。
  - type: free_text
    prompt: (2)    廣闊無垠     ：形容廣大、寬闊，沒有邊界。
  - type: free_text
    prompt: (3)    盤旋         ：在空中繞圈飛行；也可形容想法一直留在腦中。
  - type: free_text
    prompt: (4)    危機四伏     ：到處隱藏著危險。
  - type: free_text
    prompt: (5)    險象環生    ：危險的狀況一直出現。
  - type: free_text
    prompt: (6)    向陽性      ：植物朝向陽光生長的特性。
  - type: free_text
    prompt: (7)    引領        ：引導、帶領。
  - type: free_text
    prompt: (8)    崎嶇難行     ：地面高低不平，很難行走。
  - type: free_text
    prompt: (9)    內建        ：機器或系統中原本就裝有某種配件或功能。
  - type: free_text
    prompt: (10)    追逐       ：從後面追趕。
  - type: free_text
    prompt: (11)    垂直起降    ：垂直起飛和降落。
  - type: guide
    text: 在空格填入正確的語詞代號在空格填入正確的語詞代號五語詞應用五語詞應用
  - type: free_text
