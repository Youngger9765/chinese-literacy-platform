comprehension:
  questions:
  - index: 2
    answer: D
    stem: 根據本文，下列發明與其功能的對應關係，何者描述不正確？
    options:
      A: 比較說明─透過科技產品的比較來說明仿生學
      B: 舉例說明─透過列舉具體事例讓讀者理解仿生學
      C: 定義說明─直接解釋各種科技品的概念和用途
      D: 過程說明─詳細描述仿生學是如何逐步發明出來的
    rationale: Ｂ ）3. 本課是說明文，作者主要運用哪一種說明方法來介紹「仿生學」？
  - index: 4
    answer: D
    stem: 有許多語詞，可以用「拆詞釋義」的方式猜出它的意思，例如，防腐劑、危機四伏。請問底下選項中，哪一個語詞無法用「拆詞釋義」的策略來猜出它的意思？
    options:
      A: 一目十行
      B: 日新月異
      C: 垂直起降
      D: 馬馬虎虎
    rationale: null
  - index: 5
    answer: C
    stem: 課文末段說明了什麼是「仿生學」，請問底下選項中哪一個是「仿生學」的例子？
    options:
      A: 把速度最快的游泳選手取一個叫飛魚的綽號
      B: 把河馬張開大嘴的相片貼在大胃王餐廳的招牌上
      C: 模仿荷葉不易沾水的特性，設計不容易沾水的雨傘
      D: 把虎豹的斑紋印在布料上，做成服飾，以吸引人注意
    rationale: 第1題解析：（A-「險象環生」用於形容危機四伏的情境，而美術比賽並無危險性，現場氣氛應為緊張刺激。C-「引領」通常用於帶領人群或象徵性的指導、領導。D-「廣闊無垠」用來形容空間的無邊無際，而非興趣範圍，應為廣泛。
