passage: '沙馬雷和一般的無人機不一樣，它只有一片翅膀，因此構造簡單，體積更小，更省電，而且沒電時，它會盤旋而下，比較不會摔壞！它和一般無人機一樣，可以垂直起降，在狹窄的空間靈活飛行。內建攝影機時，可以幫助人類進行搜救、環境監測，甚至探索危機四伏、險象環生的災難現場。

  還沒開花的向日葵花苞，早晨朝向東方，到了下午則轉向西方，整天彷彿在追逐太陽！這種「向陽性」讓科學家發明了一種能自動調整角度的仿生太陽能板，讓太陽能發電變得更有效率！

