passage: 對學生來說也是如此，不管是學習、運動或人際關係，能夠用樂觀語言詮釋挫敗經驗的人，會更有心理韌性，也更能長期維持動力。例如：你也許會說：「我沒有數學細胞」、「我程度差，做什麼都來不及了」，這是悲觀的詮釋，你可以試著轉念：「我這次太晚開始準備考試，下次要提早一點」、「有些題型我其實懂，只是不夠熟，下次提早複習、再多練幾題」。雖然考不好，你沒有全然否定自己，仍然認為有峰迴路轉的可能。
