  questions:
  - index: 1
    text: 他經歷一段低潮後，終於（　），順利找到理想的工作與方向。
    answer: E
  - index: 2
    text: 正當大家以為兇手是他，電影情節突然（　），他反而變成受害者。
    answer: G
  - index: 3
    text: 他在實驗室歷經無數失敗，依然不放棄，展現（　）的精神，最終有了突破性的發現。
    answer: C
  - index: 5
    text: 面對錯誤，他選擇努力改變，而不是（　），一直陷在後悔之中。
    answer: D
  - index: 6
    text: 他沒有把失敗 （　）於同伴，而是冷靜的檢討自己不足之處，準備重新出發。
    answer: F
  - index: 7
    text: 他等待比賽結果公布的那一刻，心中（　），連呼吸都變得急促起來。
    answer: A
  - index: 8
    text: 醫生全力搶救，但病情惡化太快，最後仍然（　），讓家屬悲痛不已。
    answer: B
