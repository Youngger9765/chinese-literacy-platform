lesson_uid: L0138
version_id: v3
section_no: 五
keypoints:
  title: 樂觀者勝：向NBA球員學習「詮釋失敗」的智慧
  layout: list
  answer_carrier: 橘色手寫 + 紅色 ☑（w:sym Wingdings F0FE，在文字層）
  layout_note: '「主要發現」那一列底下嵌了一個 3 欄小表（代表球隊／波士頓塞爾提克(樂觀型)／

    紐澤西籃網(悲觀型)），其餘六列都是「左標題 + 右內容」。

    照 skill §⑥.55b 二選一 → 選 list，因為 list 允許某一列用 `items` 掛小題

    （消費端 `keypoints_to_structure.py` 會攤成 label + 成對的 sub_label/內容），

    而 matrix 沒有辦法表達另外六列。

    小表的兩隊分別記在 `team`；`sub_label` 一律照原稿印的字（不自己串接隊名，

    串出來的字串原稿沒有、逐字門會判成抄錯）。'
  rows:
  - label: 研究目的
    value: 心理學家塞利格曼博士想了解：球員和教練在輸球後如何解釋【　】，以及這樣的「詮釋方式」是否會影響後來表現。
    blanks:
    - answer: 失敗
  - label: 研究方法
    value: 研究團隊蒐集了一萬多篇美國報紙體育版上關於NBA的報導與訪談內容，分析球隊在輸球後的用語與態度，歸納出兩種不同的【　】。
    blanks:
    - answer: 詮釋風格
  - label: 主要發現
    header_note: 小表的表頭是「代表球隊」，兩欄分別是兩支球隊
    items:
    - sub_label: 1.對失敗的看法
      value: 【　】
      blanks:
      - answer: 暫時、特定、可改變
      team: '波士頓塞爾提克

        (樂觀型)'
    - sub_label: 1.對失敗的看法
      value: 【　】
      blanks:
      - answer: 長久、全面、無法改變
      team: '紐澤西籃網

        (悲觀型)'
    - sub_label: 2.之後表現
      value: (單選)
      options:
        1: 越打越好
        2: 連敗不止
      answer: 1
      team: '波士頓塞爾提克

        (樂觀型)'
    - sub_label: 2.之後表現
      value: (單選)
      options:
        1: 越打越好
        2: 連續低潮
      answer: 2
      team: '紐澤西籃網

        (悲觀型)'
    items_note: '⚠️ 兩隊的選項②**用字不同**（樂觀型那格印「連敗不止」、悲觀型那格印「連續低潮」），

      選項①兩格都是「越打越好」。看起來像同一組選項，其實不是 —— 照原稿分開記。'
  - label: 研究結論
    value: 【　】可能會影響後續表現。
    blanks:
    - answer: 思考方式（詮釋風格）
  - label: 國中應用
    value: 在考試、競賽、人際挫敗情境，如何用  樂觀【　】面對。
    blanks:
    - answer: 詮釋
  - label: 作者結論
    value: '1.失敗並不可怕，關鍵在於你怎麼【　】。

      2.【　】能讓人重新站起來，培養【　】。

      3.下次遇到挫折，告訴自己：「【　】只是暫時的、特定的、可改變的。」'
    blanks:
    - answer: 解釋失敗
    - answer: 樂觀詮釋
    - answer: 心理韌性
    - answer: 逆境
    value_note: 第 3 小項在 PDF 上被分頁切到下一頁（p7 頂端），與前兩項是同一格。
