strategy_explained: '這一課要練習的是，當遇到挫折或不如意時，你有沒有辦法換個角度，從中找出積極的意義

  這篇講NBA球員如何看待輸球，就是很好的例子，他們不會因為一次失敗就喪失信心，而是會思考下次怎麼做得更好

  所以讀的時候，試著想想看，那些球員遇到困難時，心裡是怎麼想的，然後學著用這種「不怕失敗」的心態，來看待自己的學習和生活'
