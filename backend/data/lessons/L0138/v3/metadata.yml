_目標框用詞_note: '⚠️ 本課頁首框印的是「**目標議題**：品格力──正向思考─用樂觀詮釋面對失敗」，

  其他課印的是「目標**策略**」。品格力單元用「議題」而不是「策略」，照原稿抄。

  另：框內第二行的破折號只有一個（「正向思考─用樂觀詮釋」），

  第一行是兩個（「品格力──」）—— 原稿長短不一，照抄。'
_大題名_note: '第六大題印的是「**品格聚光燈**」不是「閱讀聚光燈」（品格力單元的用法）。

  splitter 的 SECTION_NAME_TO_MODULE 用「包含『聚光燈』」比對，對得上。'
