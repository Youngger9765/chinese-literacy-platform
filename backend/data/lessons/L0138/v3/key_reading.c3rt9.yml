  char_marks_note: "**八個區塊界線全部精準吻合**，這一節是本課段落結構的硬證據（不是對著版面猜的）：\n\n  第 6 段 61 字                       → 61   ✓（第 3 個數字）\n  ＋ 小標「情境一：段考數學不及格」11 → 72   ✓\n  ＋ 第 7 段 129                       → 201  ✓\n  ＋ 小標「情境二：比賽中被換下場」11  → 212  ✓\n  ＋ 第 8 段 107                       → 319  ✓\n  ＋ 小標「情境三：聽到同學說我「難搞」」14 → 333 ✓\n  ＋ 第 9 段 118                       → 451  ✓（最後一個數字）\n\n要套的口徑只有 SKILL ⑥.7 **第 4 條**（隱藏的 variation selector 不算字）：\n第 8 段的「否極泰來」中間夾了一個 U+E01Ex，裸算 108、濾掉之後 107，\n不濾的話後面三個累計值全部差 1。\n其餘四條都不必套：計數區間內沒有阿拉伯數字（第 1 條）、footnotes.xml 是空的（第 2 條）、\n分節小標**要**算進去而且已經算了（第 3 條在本課是「照算」不是「額外加」）、\n計數區間內沒有 `U+2014` 破折號（第 5 條）——\n⚠️ 破折號在第 1、3、4 段各有一個，但那三段都在 ☞ 起點之前，所以第 5 條在本課用不到。\n這正是 SKILL 說的「看情況套」：同一份原稿裡有那個字元，不代表這一次要套那條規則。\n⚠️ 第 10 段（156 字）沒有配到數字 —— 字數欄停在倒數第二段，屬 SKILL 記過的常見形狀。"
