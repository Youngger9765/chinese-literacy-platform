comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 信件中的關懷，造成他人命運起起伏伏
      B: 信件的力量，幫助許多人去反省自己糟糕的生活
      C: 信件表達對收件者的關心，也幫助許多人擺脫困境
      D: 信件中的文字，讓許多人認識到他人不同的人生經歷
    rationale: 選項C說明信件既傳達了關心，又幫助受援者擺脫困境，正符合「從黑暗走向光明」的象徵意涵。
  - index: 3
    answer: A
    stem: 第1段作者用「你知道嗎？」和「你相信嗎？」兩個問句開頭，主要有什麼作用？
    options:
      B: 大量信件引起國際關注，進而對政府形成壓力
      C: 活動主要針對少部分極權國家，因此成效較為明顯
      D: 寫信行動是由政府主動邀請民眾參與，想改善目前的政策
      A: 許多信件感動了政府，使政府主動釋放受迫害者
    rationale: 這兩個問句的目的在於吸引讀者、並激發好奇心
  - index: 5
    answer: A
    stem: 文章已經舉琪哈姆與米基塔的例子，為何還需舉泰國蓉的例子？下列對「蓉的例子在文中的作用」的說明，哪一項不正確？
    options:
      B: 蓉是援助成功的例子，能說明國際聲援確實能促使改變
      C: 三人皆來自不同國家，突顯援助對象不分國界。
      D: 蓉是成年人，搭配琪哈姆與米基塔這兩位青少年，展現援助對象年齡層的多元性。
      A: 所有受援者最後都能獲得自由，這並非事實，因此正確答案為 A。
    rationale: 所有受援者最後都能獲得自由，這並非事實，因此正確答案為 A。
    is_rationale: true
  extraction_check:
    answers_without_option: []
    questions_with_few_options: []
    questions_grounded_in_body: 0.67
    answers_recovered_from_rationale: 1
    verdict: ok
