spotlight:
  lesson: G5-L23
  strategy_name: 提取上位概念-從具體描述提取上位概念
  strategy_type: main_idea_inference
  blocks:
  - type: guide
    text: 一篇文章常會有許多具體描述。閱讀時，可以先想一想：    這些內容主要在說哪一方面？再用一個簡短的名稱整理，例如「外型、含意、目的」。這個名稱就是「上位概念」。找出上位概念，可以幫助我們更快抓到重點，也更容易回想文章內容。　　(一)
      什麼是「上位概念」？例如：下面的文字在描述捷運站的裝置藝術。灰底文字主要寫它「長什麼樣子」，上位概念是「裝置藝術的外型」；加底線的文字主要寫它「代表什麼」，上位概念是「裝置藝術的含意」。     　　　　　　　　　　                                                   上位概念：【裝置藝術的外型】大安森林公園捷運站的廣場裡，有一隻由廢鋁罐回收做成的銀色短腿蛙，手拿鋁罐拉環，張開大嘴，不停的噴出水，代表牠將加工飲料轉化為純淨泉水，象徵藝術有淨化心靈的作用。　　　　　　　　　　　　　　　　　　　(資料來源:南一國語課本)　　　上位概念：【裝置藝術的含意】你發現了嗎？內容主要寫「長什麼樣子」，上位概念就是「外型」。
      內容主要寫「代表什麼」，上位概念就是「含意」(二)找出上位概念的好處：精簡複雜的文字、幫助你抓到重點。  原本這段文字有許多細節，找出「外型」和「含意」兩個上位概念後，就能把內容整理成兩個清楚的方向，文章重點更清楚，也更容易回想。
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 練習一：以下再以「翠玉白菜」的描述做練習，讀完後，請分別寫出「灰底文字」與「加底線文字」的上位概念。
  - type: guide
    text: 上位概念：【翠玉白菜的　外型　】
  - type: guide
    text: 翠玉白菜是以一塊半白半綠的玉料雕成，玉匠巧妙利用玉質顏色的變化，將玉石綠色部分，雕出翻捲的菜葉；白色部分，雕出脈絡分明的菜莖，白、綠的漸層變化，渾然天成，有如一棵鮮嫩欲滴，可以掐出水來的白菜。更有趣的是，玉匠神來一筆，在葉片上端，雕了兩隻活靈活現的螽斯。翠玉白菜，白菜寓意清白，象徵新娘的純潔；螽斯，俗稱「紡織娘」，能高聲鳴唱，而且繁殖力很強，用來祝福新娘多子多孫。
  - type: guide
    text: (資料來源:南一國語課本)
  - type: guide
    text: 上位概念：【翠玉白菜的　含意　】
  - type: guide
    text: 練習二：一則新聞報導
  - type: passage
    source: unknown
    paragraphs:
    - 近日，新竹市發生大樓火警，兩名消防員救災時不幸殉職，眾人同感心痛。為了感謝消防員的辛苦與付出，一位國小老師帶領學生在課程中繪製感謝卡片，一同寫上感謝與紀念的文字，並送到消防隊。
  - type: table
    rows:
    - - 文字呈現的事實
      - 上位概念
      - 說明
    - - 範例
      - 近日，新竹市發生大樓火警，兩名消防員救災時不幸殉職，眾人同感心痛。
      - □①參與者□②目的□③起因
      - 這段文字的上位概念是「起因」。因為它引發了後續的行動
    - - ☞ 換你試試看，請選出適當的上位概念，並在□中打勾。
    - - '1.'
      - 為了感謝消防員的辛苦與付出
      - □①參與者□②活動方式□③目的　　　　　　（單選）
    - - '2.'
      - 一位國小老師帶領學生在課程中繪製感謝卡片，一同寫上感謝與紀念的文字，並送到消防隊。
      - □①參與者□②活動方式□③目的 　　　　 （3選2）
  - type: passage
    source: unknown
    paragraphs:
    - ★ 你有沒有發現，找出這則新聞報導的上位概念──「起因、目的、參與者、活動方式」以後，你就會發現這則報導，只剩4個概念、11個字了。
  - type: guide
    text: 練習三：
  - type: guide
    text: 再回到本課課文。請你往前翻2頁，你看到了嗎？「五、文章重點表」最左邊的兩個欄位，都是課文的「上位概念」哦！
  - type: guide
    text: 請你參考「五、文章重點表」，寫出下表右欄文字的上位概念。
  - type: table
    rows:
    - - 上位概念
      - 課文文字
    - - 【】
      - 2012年12月8日，15歲的女孩琪哈姆，試圖逃離國家而遭到逮捕。至今已超過10年，她生死不明、毫無消息，而她的家人求助無門，也只能乾著󠇢急。2020年8月，白俄羅斯16歲的米基塔，某日經過廣場時，意外被捲入抗議人群中，隔天，警方便指控他向警察投擲汽油彈，被判處五年徒刑。從那時起，他被關進黑牢，患有癲癇的他不但沒有得到適當的醫療照顧，且疑似遭受酷刑。
    - - 【】
      - (寫信馬拉松)這個活動邀請世界各地的人寫一封信，支持那些受到政府壓迫、監禁的人們，給予他們的家人關心和鼓勵，也積極向政府或相關單位施壓，
    answers:
    - 兩位受迫害的青少年or 聲援對象
    - 活動方式 or　　 活動目的
