      - answer: 信件
        hint: ''
      - answer: 政府壓迫
        hint: ''
      - answer: 政府
        hint: ''
  - label: 聲援對象
    sub_rows:
    - sub_label: '兩位受迫害

        的青少年'
      template: 琪哈姆 嘗試逃離__失敗，被捕至今__。
      blanks:
      - answer: 厄利垂亞
        hint: ''
      - answer: 生死不明
        hint: ''
    - sub_label: '兩位受迫害

        的青少年'
      template: 米基塔 意外捲入抗議人群，被判__，不但未獲__，且疑似遭受酷刑。
      blanks:
      - answer: 五年徒刑
        hint: ''
      - answer: 醫療照顧
        hint: ''
