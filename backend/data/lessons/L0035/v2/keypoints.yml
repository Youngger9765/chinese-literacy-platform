    value: '1.一封封充滿關懷與支持的信，為身陷困境的人們帶來__與__。

      2.讓大家看見，__都能成為改變的推手。'
    blanks:
    - answer: 希望
      hint: ''
    - answer: 勇氣
      hint: ''
    - answer: 每個人
      hint: ''
  title: 寫信馬拉松
