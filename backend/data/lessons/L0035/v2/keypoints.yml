      template: 由一群關注人權的朋友發起，後來成為__的活動，目的是為__的人發聲。
      blanks:
      - answer: 國際特赦組織
        hint: ''
      - answer: 遭受不公平對待
        hint: ''
    - sub_label: 行動時間
      template: 每年__，是__日。
