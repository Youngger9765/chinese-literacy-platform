passage: 在非洲東北部的厄利垂亞，20年來由同一位總統治理，人民沒有言論、參政、新聞等自由，被稱為「非洲版北韓」。2012年12月8日，15歲的女孩琪哈姆，試圖逃離國家而遭到逮捕。至今已超過10年，她生死不明、毫無消息，而她的家人求助無門，也只能乾著󠇢急。2020年8月，白俄羅斯16歲的米基塔，某日經過廣場時，意外被捲入抗議人群中，隔天，警方便指控他向警察投擲汽油彈，被判處五年徒刑。從那時起，他被關進黑牢，患有癲癇的他不但沒有得到適當的醫療照顧，還疑似遭受酷刑。
