    definition: 遇到問題時非常著急，但卻無法解決。
  - index: 5
    word: 充耳不聞
    definition: 故意裝作沒聽見，不理會別人的話或提醒。
  - index: 6
    word: 求助無門
    definition: 在遇到困難或危險時，找不到可以幫助的人或地方。
  - index: 7
    word: 聲援
    definition: 用言語或行動支持他人，幫助他們對抗困難或不公。
  - index: 8
