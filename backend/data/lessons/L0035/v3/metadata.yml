intro: 這篇文章介紹了「寫信馬拉松」這項特別的活動。它說明了這個活動如何透過寫信的方式，為世界上遭受不公平對待、人權受到侵害的人們發聲，並給予他們支持與鼓勵。文章中也分享了幾個具體的案例，讓我們了解即使在現代社會，仍有許多人面臨困境，而一封封信件如何成為他們黑暗中的一道光。透過了解「寫信馬拉松」，我們能知道即使是小小的力量，也能匯聚成巨大的影響，展現出信件所蘊含的溫暖與改變的力量。
