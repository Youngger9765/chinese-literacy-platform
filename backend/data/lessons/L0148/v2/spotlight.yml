spotlight:
  lesson: G9-L5
  strategy_name: 科學推理策略-用科學步驟解決問題
  strategy_type: problem_solving
  blocks:
  - type: guide
    text: 這又是一篇「用科學步驟解決問題」的說明文，讀起來就像科學偵探故事。作者先找「問題」，再提出「假設」，接著做實驗，用證據「驗證假設」，最後下「結論」，最後再把結論應用出來。這樣的文章，閱讀時要先注意「證據是否能支持（或推翻）假設」。我們要先用4個步驟把「解決科學問題的過程」整理清楚。請根據你過去所學，把底下「四個科學步驟」和「ＡＢＣＤ的說明」連連看：步驟關鍵概念或說明❶找問題●
      　　　 　　 　A.推測原因可能是…；或暫時性的答案常出現「可能」、「推測」等關鍵詞。●         ●❷提假說    　　  　          ●           ●　　　　     　B.文章主要想解決（或追問）什麼問題？
      ❸找驗證         　　●         ●　     　　　　C.證據最後支持哪個假說？❹下結論●         ●D.用什麼方法、看到什麼結果？結果符不符合推測？
  - type: guide
    text: 一、找問題→提假說→看驗證→下結論
  - type: guide
    text: 表：本課的科學解決四步驟：找問題→提假說→看驗證→下結論
  - type: table
    rows:
    - - 步驟
      - 根據課文內容，請勾選或填寫答案（答案合理即可）
    - - ❶問題
      - 1.花期落差  蝴蝶蘭自然盛開於（ 3-4 ）月；市場需求卻在（1-2）月2.文章要解決什麼問題？   如何讓蝴蝶蘭提早開花，以配合市場需求？
    - - ❷假說⭣❸驗證
      - ❷假說
      - ❸驗證
    - - ❷假說⭣❸驗證
      - 影響因素可能是
      - 用什麼方法
      - 結果/是否支持假說？
    - - ❷假說⭣❸驗證
      - 1.肥料
      - 1.施用高磷、鉀肥
      - 1.花更大更美，但沒提早開花□①是 □②否 □③部分支持
    - - ❷假說⭣❸驗證
      - 2白晝長度
      - 2.用黑塑膠網遮光    ，讓蝴蝶蘭以為白天變短
      - 2.遮光可催花但僅提早5–7天     □①是 □②否 □③部分支持
    - - ❷假說⭣❸驗證
      - 3.低溫
      - 3.實驗組放冷氣房、對照組留原來花房
      - 3.實驗組一個多月後，抽出花梗       ；對照組則無。   □①是 □②否 □③部分支持
    - - ❹結論
      - 低溫，溫度26度以下，持續30-40天，就能成功催花
  - type: guide
    text: 二、應用（把結論帶回現場：問題→解決→結果）
  - type: passage
    source: unknown
    paragraphs:
    - 前面我們用科學步驟找出「低溫能催花」。再來是把結論應用到現場。但農民遇到了新的問題，請根據課文寫出他們如何解決問題。
  - type: free_text
    prompt: 1.問題：    花房面積大，冷氣電費成本太高
  - type: multi
    prompt: 2.解決：
    options:
    - 把平地蘭花送到高海拔蘭園降溫
    - 在高海拔地方設置蘭園
    - 用深層海水降溫
    answer:
    - 把平地蘭花送到高海拔蘭園降溫
    - 在高海拔地方設置蘭園
    - 用深層海水降溫
  - type: single
    prompt: 3.結果：用大自然降溫，降低電費負擔，也能順利催花。
    options:
    - 我能用四步驟整理文章：找問題→提假說→看驗證→下結論
    - 我能看懂作者如何用證據進行驗證，並判斷結果是否支持原本的假說。
    answer: 我能用四步驟整理文章：找問題→提假說→看驗證→下結論
  - type: guide
    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。六閱讀理解六閱讀理解
