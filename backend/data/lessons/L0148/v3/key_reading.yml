  passage: 要解決這個問題，花農必須先找到幾個可能催促開花的因素，以科學方法確認真正能催花的因素後，再想方設法降低成本，在農園實踐出來。第一個被想到的因素是肥料。施用磷、鉀比重較高的肥料，是花農催花的常見手段。像校園常見的矮牽牛、日日春、長春花、非洲菫，高磷鉀肥可促進花芽的形成。但是，農業專家在實驗後發現，施肥只能讓蝴蝶蘭花朵更大更美，卻無法提早促成開花。另一個促成開花的可能因素是「白晝的長度」。以火龍果為例，專家發現白晝長度超過12小時40分後，火龍果就會開花。現在你在二月去屏東，發現火龍果園夜裡燈火通明，那可不是農民連夜趕工，也不是想讓植物光合作用，而是想在日落後用電燈連照4小時，讓火龍果錯以為「白天變長」了，它們就會努力伸出花芽來。相反地，蝴蝶蘭是白晝較短的時候開花，於是農業專家用黑塑膠網遮光，讓花錯以為「白天變短」了，實驗結果顯示，這招的確能催花，但只能提早5到7天，對農民沒有太大幫助。
  start_text: 要解決這個問題，花農必須先找到幾個可能催促開花的
