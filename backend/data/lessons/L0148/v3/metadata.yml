strategy_explained: '這一課，我們要練習的是「像個科學家一樣，一步步解決問題」

  這篇文章講的就是花農如何用科學方法，像是觀察、實驗，找出讓蝴蝶蘭過年開花的辦法，就像在破解一個大謎題，非常適合我們練習解決問題的技巧

  讀的時候，你可以試著找出文章裡花農遇到的困難，他們用了哪些方法來試驗，最後又是怎麼找到解決辦法的喔'
