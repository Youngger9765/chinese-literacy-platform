  ⚠️ 這不是抽取遺漏 —— 總表是跨年級共用的一列（同一課同時掛在 G4-L2／G5-L0／

  G6-L0／G7-L0／G8-L0／G9-L0，其中 G4-L2 版另有第六大題標題「找出故事道理」），

  語詞欄是那些完整版共用的。第 0 課這一版只做兩個大題。'
_總表_跨年級note: '同一課名在總表出現 6 次（G4-L2／G5-L0／G6-L0／G7-L0／G8-L0／G9-L0）。

  只有 G4-L2 的「閱讀聚光燈策略──教材目標策略」寫「推論策略──找出故事道理」，

  其餘五列（含本課 G6-L0）寫「讀出故事道理」，與本課學習單右上角印的一致。'
