intro: 這篇文章講述了正太從小立志成為武僧的故事。故事發生在日本奈良，正太在市集目睹了武僧的身手，因而萌生了學習武功的念頭。進入興福寺後，他並沒有立刻學到想像中的武術，而是被師父指派了一項看似簡單卻充滿挑戰的任務：每天餵養一頭豬。這個任務需要他日復一日地抱著逐漸長大的豬，爬上陡峭的階梯，跨越重重門檻。文章描寫了正太如何透過這項看似枯燥的訓練，逐漸鍛鍊出強健的體魄，並領悟到持之以恆的努力所能帶來的巨大改變。
