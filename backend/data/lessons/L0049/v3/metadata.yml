strategy_explained: '這一課我們要練習的是**找出故事藏起來的道理**

  這篇文章講述正太每天抱著小豬爬樓梯，看起來很辛苦，但這能讓我們學到**只要堅持做一件事情，就算一開始看起來很難，最後也能變得不一樣**

  讀的時候，你可以想想看，正太做的那件看似簡單的餵豬爬樓梯，讓他最後變成了什麼樣的人呢'
