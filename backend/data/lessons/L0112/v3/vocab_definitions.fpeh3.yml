section_no: 四
vocab_definitions:
  instruction: '請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：

    🅐 從本課語詞框框，找語詞。

    🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。

    🅒 問同學。'
  vocabulary_bank:
  - 始終如一
  - 冷冽
  - 鬱鬱蔥蔥
  - 生機勃勃
  - 徒手
  - 校正
  - 所費不貲
  - 狐疑
  - 模擬
  - 雞皮疙瘩
  vocabulary_bank_label: 本課語詞
  items:
  - index: 1
    word: 鬱鬱蔥蔥
    definition: 植物長得很茂盛、很濃密，一片綠油油。
  - index: 2
    word: 始終如一
    definition: 常用來形容人的態度、想法或做法從開始到結束都沒有改變。
  - index: 3
    word: 冷冽
    definition: 形容寒冷、清冷；也可形容色調、語氣或氣氛給人冷峻、刺骨的感覺。
  - index: 4
    word: 生機勃勃
    definition: 充滿生命力，看起來很有活力、很旺盛。
  - index: 5
    word: 狐疑
    definition: 像狐狸一樣多疑。比喻心中懷疑、拿不定主意。
  - index: 6
    word: 雞皮疙瘩
    definition: 因為冷、害怕或噁心，皮膚毛孔出現的一粒一粒小突起。
  - index: 7
    word: 徒手
    definition: 空手、未用工具。
  - index: 8
    word: 模擬
    definition: 模仿真實的動作、情境或過程，讓人看出相似的樣子；也可用於教學、訓練或研究。
  - index: 9
    word: 所費不貲
    definition: 不貲：不可計算。形容花費非常高。
  - index: 10
    word: 校正
    definition: 修正錯誤，把不準或有偏差的地方調整回正確的狀態。可用於數據、儀器或位置等。
  notes:
    answer_carrier: 橘色手寫（教師版答案），文字流有此資訊
    items: '第 10 題的定義在 PDF p6 上被一個空的圓形徽章切成兩截（「可用於數據、儀器或位置等。」

      落到徽章下方）。文字層是同一個段落，本檔照文字層合起來記。'
  slug: fpeh3
  text_ref: heaup
