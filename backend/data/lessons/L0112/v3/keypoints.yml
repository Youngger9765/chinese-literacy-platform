section_no: 六
keypoints:
  title: 未來的農夫
  layout: list
  answer_carrier: 橘色手寫填空（教師版答案），文字流有此資訊
  rows:
  - label: 志向與進入場域(段1-2)
    value: '1.宇晴的志向是當【　】。

      2.宇晴到桃園【　】實習，農場沒有泥土味，反而有消毒酒精味，農場像【　】。'
    blanks:
    - answer: 農夫
    - answer: 垂直農場
    - answer: 高科技無塵室
  - label: 農場外觀（段3）
    value: 農場一層層栽培架和LED燈光，像【　】，每層水耕槽的葉片【　】。
    blanks:
    - answer: 太空站
    - answer: 嫩綠、整齊
  - label: 農場運作方式(段4)
    value: '1.水耕蔬菜不是用土種出來的，而是用【　】。

      2.透過【　】監測並調整各項條件，讓農場的環境維持在最適合蔬菜生長的範圍。'
    blanks:
    - answer: 營養液
    - answer: 全環境控制系統
  - label: 工作內容(段5)
    value: '1.宇晴每天【　】，找出【　】的地方，能處理就處理，必要時回報。

      2.她的領悟：讀圖表、看趨勢、抓異常也是在【　】。'
    blanks:
    - answer: 巡檢數據
    - answer: 偏離／異常
    - answer: 種菜
  - label: 農場優勢(段6)
    value: '1.垂直農場一開始【　】，宇晴擔心不賺錢。

      2.無毒、蔬菜長得又快又漂亮，因此可賣【　】。'
    blanks:
    - answer: 所費不貲
    - answer: 較高價格
  - label: 傳統與未來(段7-8)
    value: '1.宇晴回憶【　】（徒手、糞肥等），因此起雞皮疙瘩。

      2.未來農夫不再是戴斗笠拿鋤頭，而更像【　】'
    blanks:
    - answer: 傳統農耕
    - answer: 工程師
  rows_note: '左欄的分段標籤照原稿分行印（例如「志向與／進入場域／(段1-2)」），本檔合成一行。

    括號用字也照原稿：只有「（段3）」是全形括號，其餘都是半形。

    最後一列第 2 點原稿句末**沒有句號**，照留。'
