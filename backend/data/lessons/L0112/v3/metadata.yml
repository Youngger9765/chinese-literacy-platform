strategy_explained: '這篇文章要帶你練習一個很重要的讀書小撇步，叫做「先快速看過一遍，遇到不懂的地方暫時跳過，之後再回來」

  為什麼這篇《未來的農夫》這麼適合練習這個方法呢？因為它講了很多關於高科技農場的新知識，像什麼是垂直農場、裡面種植方式跟傳統的差很多，還有現在農夫需要學什麼新技術，這些一下子可能不太熟悉

  所以你讀的時候，可以先快速瀏覽一下整篇文章，了解大概在說什麼，不用因為看到一些新名詞或是不懂的句子就停下來，先往下讀，等你看完整篇文章後，再回頭去仔細看看那些之前跳過的部分，這樣你就能更有效率地抓住文章的重點囉'
