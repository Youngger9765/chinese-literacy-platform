  start_paragraph_conflict_note: "\U0001F534 **指示語印的段號（五）與 ☞ 標記的位置（第 6 段）不一致，這一條要人來裁決。**\n\
    我採 6，因為指向第 6 段的證據有三條、彼此獨立：\n  ① ☞ 圖檔（wp:anchor「圖片 127」）錨在第 6 段的段首，PDF p2 上也印在「可是這樣的垂直農場」之前。\n\
    \  ② 右緣字數欄的第一個數字 27 == 第 6 段第一行的字數；第 9 個數字 **263 == 第 6 段的完整字數**\n     （267 字扣掉\
    \ 4 串阿拉伯數字，套 Word 口徑第 1 條）。若改從第 5 段起算，\n     第 5 段結束的累計是 147，**不在印出來的數列裡**，而第\
    \ 6 段結束會變成 410、超出末筆 358。\n  ③ 字數欄那一格在數字之前有 **28 個空段落**，正好等於第 1~5 段在 Word 裡佔的行數\n\
    \     （每行約 29 字：2+6+5+9+6=28）。從第 5 段起算的話應該只墊 22 行。\n⛔ 我**沒有**去改指示語裡的「五」——無法判斷是「五」寫錯還是\
    \ ☞ 放錯，\n替教材決定哪一邊是錯的不是抽取者該做的事（同 L0087 兩份課文不一致的處置）。\n這一條的形狀正是 #2555 那批 bug（☞ 指到錯段落），請人回頭跟出版方確認。"
  char_count_note: "末筆 358 不是全文長度：字數欄只標到第 7 段結束，第 8 段沒有標（「字數欄提早停」的形狀，已見 5 課）。\n兩個段界檢查點**都精準吻合**，用的是\
    \ Word「字數＝中日韓字元＋非中日韓單字」這個算法：\n  ・第 6 段 267 個字元，其中 8 個是阿拉伯數字、分成 4 串（30／35／45／50）\n\
    \    → 259 個中文字元 ＋ 4 個「單字」＝ 263 == 印出來的第 9 個數字。\n    （這就是 skill 第 1 條「一串數字算 1\
    \ 個字」的來源。）\n  ・第 7 段 96 個字元，其中 2 個是刪節號 U+2026、算一串\n    → 94 個中文字元 ＋ 1 個「單字」＝ 95；263\
    \ ＋ 95 = 358 == 末筆。\n  ・另外要先濾掉隱藏字元（skill 第 4 條）：課文的「校正」中間夾 U+E01E1，不濾會多算 1。\n\
    ⚠️ **這個算法不能直接推廣**：同批的 L0113 有一段含破折號「——」（兩個 U+2014，同樣是一串\n非中日韓標點），那一課要把它算成 **0**\
    \ 才對得上（三個檢查點全中），算 1 就全差 1。\n兩課各自內部一致、彼此矛盾，樣本都只有 1 段，所以我沒有把它寫成通則，只記錄現象。"
