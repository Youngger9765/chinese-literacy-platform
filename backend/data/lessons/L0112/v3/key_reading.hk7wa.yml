  passage: 「可是這樣的垂直農場所費不貲，公司會賺錢嗎？」宇晴皺起眉頭，一臉狐疑。大仁哥笑著說：「好問題。一開始的投資真的很大，但我們不用煩惱雜草、蟲害、土壤病菌、雨災、日照不足、溫度變化這些問題。而且，蔬菜比在田園裡種植時長得快，例如，小白菜30到35天就可以收成，在菜園種的至少要45到50天。」他繼續說：「此外，我們的菜不但沒有農藥，而且特別乾淨漂亮，你不會在晚餐的炒青菜裡看到令人作嘔的『加菜』。」他做著鬼臉，一邊橫著食指，做出一伸一縮的動作，模擬那個「加菜」。他最後下結論：「同樣是剪髮，家庭理髮和髮廊設計師的價錢當然會有天壤之別囉。」在回家的公車上，宇晴突然想起，媽媽小時候要幫祖母在菜園裡種菜，用鋤頭、鐮刀、畚箕等農具施作，有些工作要徒手完成，甚至還要收集大小便，當作肥料……。宇晴想著想著，鼻子皺了起來，雞皮疙瘩掉了一地。但那是以前的生活。宇晴今天最大的學習是——未來的農夫，不再只是戴斗笠拿鋤頭，工作更像是工程師呢！
  start_text: 「可是這樣的垂直農場所費不貲，公司會賺錢嗎？」宇
