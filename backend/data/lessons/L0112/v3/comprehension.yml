lesson_uid: L0112
version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: B
    stem: 下列語詞何者使用正確？
    options:
      A: 面對新提案，他立刻「狐疑」地答應了
      B: 這座新建的展演館設備先進，整體工程「所費不貲」
      C: 老師把投影機的位置「校正」成一篇文章
      D: 雨後的草地十分「冷冽」，放眼望去一片翠綠
  - index: 2
    answer: D
    answer_note: 原稿這一題的答案代號印的是全形「Ｄ」，其餘四題是半形；本檔統一寫半形 D
    stem: 第六段提到「令人作嘔的『加菜』」，最可能指的是什麼？
    options:
      A: 青菜裡加了肉片，味道變得很怪
      B: 青菜份量突然變大，吃到最後想吐
      C: 青菜加了太多鹽巴，吃起來很噁心
      D: 青菜裡混進讓人反胃的蠕動菜蟲
    teacher_hint: 文中先強調「沒有農藥、又描寫用食指動作模擬，暗示一般青菜可能會出現蟲
    teacher_hint_note: '原稿這則解析**本來就沒有寫完**：文字層到「出現蟲」為止，前引號「也沒有收尾。

      PDF p8 上它同時被文字方塊裁掉，所以畫面看起來更短 —— 但即使不裁，原稿也只有這麼多。

      照原樣抄，不補字。'
  - index: 3
    answer: C
    stem: 從第四段大仁哥的說明來看，垂直農場的哪一項特點最有助於穩定蔬菜品質？
    options:
      A: 穿戴防塵裝備，避免灰塵進入廠房
      B: 使用營養液取代土壤，讓蔬菜不必施肥灌溉
      C: 用感測器與控制系統維持最佳環境
      D: 縮短蔬菜生長時間，提早進行採收
    teacher_hint: 文中詳述各項數據（如溫濕度、酸鹼值）由系統控管，強調科技與監測系統對蔬菜生長條件的精準維持
  - index: 4
    answer: C
    stem: 宇晴想到媽媽和祖母種菜的方式，對比眼前的垂直農場後，雞皮疙瘩掉了一地，這段安排有什麼作用？
    options:
      A: 顯示她無法適應垂直農場，想要放棄成為農夫
      B: 表示她懷念傳統農耕，希望回到祖母的生活方式
      C: 她經歷過高科技農業，已經難以回到傳統農業
      D: 反映她對科技農業與傳統農業間的抉擇困難
    teacher_hint: 這段對比傳統與現代農業，強化出她對科技農場的驚喜與感受，並強調新形象的衝擊
  - index: 5
    answer: A
    stem: 第六段大仁哥用「家庭理髮」和「髮廊設計師」作比較，主要想說明什麼？
    options:
      A: 品質與專業的價值會帶來價格差異
      B: 理髮技術不同，髮型就一定更好看
      C: 家庭理髮比較省錢，所以更值得選
      D: 髮廊設計師更辛苦，所以應該多收費
    teacher_hint: 他在談垂直農場雖成本高，但蔬菜乾淨漂亮、無農藥、風險少、生長快，因此可以有「溢價」，就像專業設計師的價錢更高
  notes:
    answer_carrier: 橘色手寫代號寫在題號前的括號內（教師版答案），文字流有此資訊
    teacher_hint_carrier: 藍框文字方塊（教師版解析），文字流有此資訊；第 2、3、4、5 題有，第 1 題沒有
