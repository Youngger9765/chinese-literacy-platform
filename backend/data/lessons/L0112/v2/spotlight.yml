spotlight:
  lesson: G8-L15
  strategy_name: 閱讀策略-跳過卡關，先瀏覽全文
  strategy_type: inference
  blocks:
  - type: figure
    referent: image
    asset: fig1.png
    bind_paragraph: 這一課我們繼續練習：
  - type: guide
    text: 二閱讀聚光燈閱讀策略——跳過卡關，先瀏覽全文二閱讀聚光燈閱讀策略——跳過卡關，先瀏覽全文
  - type: guide
    text: 〈未來的農夫〉
  - type: passage
    source: unknown
    paragraphs:
    - （段4）帶她的大仁哥，是工程師兼「科技農夫」，一邊走，一邊指著牆邊的控制箱與感測器解說：「這裡的水耕蔬菜不是用土種出來的，而是用營養液。輸送營養液的管路都有流量、溫度、酸鹼值、肥料濃度跟電導度的監測；溫度、濕度、空氣流動，甚至二氧化碳濃度，也都會一起控制。」他說：「這種全環境控制的系統，才能把溫度與濕度穩穩地維持在最適合蔬菜生長的範圍。」以萵苣類作物為例，溫度常被控制在約18～25°C、濕度65～75%；營養液的酸鹼值大約維持在5.5～6.5；為了加速光合作用，室內二氧化碳濃度也控制在1000～1500ppm之間。
    - （段5）「你的任務之一，」他把平板遞給她，「就是每天巡檢數據：看哪一區的酸鹼值或肥料配方有偏差、哪一層的溫濕度曲線不正常。問題能自己排除就儘快排除，必要時回報，讓值班同事去校正或調整配方。」宇晴盯著平板看，螢幕上跳動的數字像心電圖，她緊張的心情，忽然踏實了幾分：原來讀圖表、看趨勢、抓異常也是在種菜。
  - type: guide
    text: 步驟0：30秒快速瀏覽（先抓方向）
  - type: free_text
    prompt: 1.任務：只抓「第4～5段大概在講什麼？」（約10–15字）
  - type: guide
    text: →我猜第4～5段在講：  垂直農場用科技方法種菜
  - type: guide
    text: 步驟1：標示卡關點＋先往下讀
  - type: free_text
    prompt: 1.請在框框中把你覺得讀不懂、會卡住的地方圈起來或畫線。
  - type: free_text
    prompt: 2.再讀一次第4～5段：圈起的地方暫時略過，繼續往下讀，不要停太久。
  - type: single
    prompt: 3.自我檢核：跳過卡關處後，是否能讀完第4、5段並說出大意？（單選）
    options:
    - 能，我可以繼續往下讀
    - 不能，我需要回頭讀剛才標記的地方
    answer: 能，我可以繼續往下讀
  - type: guide
    text: 步驟2：抓第4段重點
  - type: single
    prompt: 1.下列哪一句最能概括第4段重點？（單選）
    options:
    - 水耕蔬菜不用泥土，而是用營養液栽種
    - 全環境控制能維持適合蔬菜生長的條件
    - 農場會監測溫度、濕度與二氧化碳濃度
    answer: 水耕蔬菜不用泥土，而是用營養液栽種
  - type: single
    prompt: 2.第4段中，哪一類內容較適合先暫時略過？（單選）
    options:
    - 一長串監測項目、數值與舉例；先略過仍能理解段落重點
    - 「全環境控制系統」這個反覆出現、連結全段的核心概念
    answer: 一長串監測項目、數值與舉例；先略過仍能理解段落重點
  - type: guide
    text: 步驟3：抓第5段重點
  - type: passage
    source: unknown
    paragraphs:
    - 小提示：第5段雖然也有數據與工作細節，但重點是宇晴主要做什麼，以及她有了什麼新理解。先抓主要工作，細節暫時放過。
  - type: free_text
    prompt: 1.第5段：先抓「宇晴在做什麼」，再抓「作者想告訴你什麼」。
  - type: single
    prompt: （1）宇晴主要在做什麼工作？（單選）
    options:
    - 巡檢數據，找出異常並處理或回報
    - 校正所有儀器，直接調整各區配方
    answer: 巡檢數據，找出異常並處理或回報
  - type: single
    prompt: （2）下列哪一句最能表達第5段的重點？（單選）
    options:
    - 必要時回報，讓值班同事校正或調整配方
    - 原來讀圖表、看趨勢、抓異常也是在種菜
    answer: 必要時回報，讓值班同事校正或調整配方
  - type: single
    prompt: 2.第5段你跳過的地方，是哪一類訊息？為什麼可以跳過？（單選）
    options:
    - 是補充細節；先跳過也不影響理解工作內容
    - 是主要流程；先跳過就會看不懂她在做什麼
    answer: 是補充細節；先跳過也不影響理解工作內容
  - type: guide
    text: 步驟4：合併兩段：抓段意
  - type: single
    prompt: 第4、5段想要表達什麼？請選出意思最接近的選項？（單選）
    options:
    - 用很多數字與專有名詞，要讀者學會現代種菜的技術
    - 垂直農場用環境控制與數據巡檢的方式種菜
    - 這家垂直農場設備昂貴，所以種菜的成本非常高
    answer: 用很多數字與專有名詞，要讀者學會現代種菜的技術
  - type: guide
    text: 步驟5：覺察與回顧──讀完後，要不要回頭？（複選）
  - type: single
    prompt: 讀完整段後，什麼情況需要回讀？
    options:
    - 略過後，我仍說不出段落大意
    - 題目正好問到那個數字或專有名詞
    - 只要是專有名詞或數字，都永遠不用再看
    answer: 略過後，我仍說不出段落大意
  - type: guide
    text: 請用計時器，從指定段落（五     ）開始朗讀，在表格記錄計時1分鐘的朗讀字數。如果計時3次後，對自己還不滿意，可以多練幾次。最後一次，找一位同學，請他計時、記錄並簽名！請用計時器，從指定段落（五     ）開始朗讀，在表格記錄計時1分鐘的朗讀字數。如果計時3次後，對自己還不滿意，可以多練幾次。最後一次，找一位同學，請他計時、記錄並簽名！三念順順
      三念順順
  - type: guide
    text: ◎ 我的表現
  - type: guide
    text: 本課語詞：始終如一、冷冽、鬱鬱蔥蔥、生機勃勃、徒手、校󠇡正、所費不貲、狐疑、模擬、雞皮疙瘩本課語詞：始終如一、冷冽、鬱鬱蔥蔥、生機勃勃、徒手、校󠇡正、所費不貲、狐疑、模擬、雞皮疙瘩請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：🅐
      從本課語詞框框，找語詞。🅑 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。🅒 問同學。請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：🅐 從本課語詞框框，找語詞。🅑
      再回到課文讀讀看，這個解釋可能是哪個語詞的意思。🅒 問同學。
  - type: guide
    text: 四語詞我最棒 四語詞我最棒
  - type: free_text
    prompt: (1)  鬱鬱蔥蔥     ：植物長得很茂盛、很濃密，一片綠油油。
  - type: free_text
    prompt: (2)  始終如一   　：常用來形容人的態度、想法或做法從開始到結束都沒有改變。
  - type: free_text
    prompt: (3)  冷冽      ：形容寒冷、清冷；也可形容色調、語氣或氣氛給人冷峻、刺骨的感覺。
  - type: free_text
    prompt: (4)  生機勃勃  　：充滿生命力，看起來很有活力、很旺盛。
  - type: free_text
    prompt: (5)  狐疑    　：像狐狸一樣多疑。比喻心中懷疑、拿不定主意。
  - type: free_text
    prompt: (6)    雞皮疙瘩     ：因為冷、害怕或噁心，皮膚毛孔出現的一粒一粒小突起。
  - type: free_text
    prompt: (7)   徒手   　：空手、未用工具。
  - type: free_text
    prompt: (8)  模擬     ：模仿真實的動作、情境或過程，讓人看出相似的樣子；也可用於教學、訓練或研究。
  - type: free_text
    prompt: (9)    所費不貲      ：不貲：不可計算。形容花費非常高。
  - type: free_text
    prompt: (10)  校正   　 ：修正錯誤，把不準或有偏差的地方調整回正確的狀態。可用於數據、儀器或位置等。
  - type: guide
    text: 在空格中填入正確的語詞代號在空格中填入正確的語詞代號五語詞應用五語詞應用
  - type: free_text
    prompt: (1)儘管環境困難，他追求夢想的態度 (  A   )，令人敬佩。
  - type: free_text
    prompt: (2)在使用儀器前，必須先進行(  E   )，以確保精準。
  - type: free_text
    prompt: (3)古蹟的修復 (  F   ) ，還要投入大量的人力，只為喚回歷史的光彩。
  - type: free_text
    prompt: (4)這公司在創新策略的推動下，展現出(  D   )的成長動能，前景看好。
  - type: free_text
    prompt: (5)他(  I   )攀爬台北101大樓，展現出驚人的體能與技術。
  - type: free_text
    prompt: (6)面對這項提議，他露出(  G   )的神情，心想：「這有可能嗎？」
  - type: free_text
    prompt: (7)上台前，我先在家(  H   )正式報告的情境，練習說話的速度和抑揚頓挫。
  - type: free_text
    prompt: (8) 山難發生時，雖然北風(  B   )，消防隊員們仍冒著嚴寒上山搜救。
  - type: guide
    text: 六文章重點表 六文章重點表
  - type: table
    rows:
    - - 未來的農夫
    - - 志向與進入場域(段1-2)
      - 1.宇晴的志向是當【】。2.宇晴到桃園【】實習，農場沒有泥土味，反而有消毒酒精味，農場像【】。
    - - 農場外觀（段3）
      - 農場一層層栽培架和LED燈光，像【】，每層水耕槽的葉片【】。
    - - 農場運作方式(段4)
      - 1.水耕蔬菜不是用土種出來的，而是用【】。2.透過【】監測並調整各項條件，讓農場的環境維持在最適合蔬菜生長的範圍。
    - - 工作內容(段5)
      - 1.宇晴每天【】，找出【】的地方，能處理就處理，必要時回報。2.她的領悟：讀圖表、看趨勢、抓異常也是在【】。
    - - 農場優勢(段6)
      - 1.垂直農場一開始【】，宇晴擔心不賺錢。2.無毒、蔬菜長得又快又漂亮，因此可賣【】。
    - - 傳統與未來(段7-8)
      - 1.宇晴回憶【】（徒手、糞肥等），因此起雞皮疙瘩。2.未來農夫不再是戴斗笠拿鋤頭，而更像【】
    answers:
    - 農夫
    - 垂直農場
    - 高科技無塵室
    - 太空站
    - 嫩綠、整齊
    - 營養液
    - 全環境控制系統
    - 巡檢數據
    - 偏離／異常
    - 種菜
    - 所費不貲
    - 較高價格
    - 傳統農耕
    - 工程師
  - type: passage
    source: unknown
    paragraphs:
    - 七閱讀理解七閱讀理解請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
