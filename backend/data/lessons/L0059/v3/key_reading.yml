  passage: 但這次，我繫著這條紅領帶，參加媽媽的告別式。我13歲那年，媽媽被診斷罹患一種惡性程度很高的胃癌。接下來的11個月，她承受了身體及心理的種種折磨。但是，媽媽用聖經裡的一句話鼓勵自己，也鼓勵我們：「你們落在百般試煉中，都要引以為大喜樂。」
