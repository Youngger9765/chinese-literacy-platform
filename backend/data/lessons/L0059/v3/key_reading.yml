  passage: 但這次，我繫著這條紅領帶，參加媽媽的告別式。我13歲那年，媽媽被診斷罹患一種惡性程度很高的胃癌。接下來的11個月，她承受了身體及心理的種種折磨。但是，媽媽用聖經裡的一句話鼓勵自己，也鼓勵我們：「你們落在百般試煉中，都要引以為大喜樂。」媽媽接受全胃切除手術，沒有胃以後，她一躺下，消化液就會衝到胸口，她從此無法躺著睡。面對這樣的試煉，她卻以黑色幽默說：「沒有胃真好，這樣就不會胃痛了。」接著是化療，媽媽頭髮掉光，又拉肚子、又便祕，還常發出「噁、噁」的乾嘔。媽媽很虛弱，只能坐在沙發上看電視，但這樣的試煉，媽媽卻引為大喜樂，又來個黑色幽默說：「生病最大的好處就是可以整天躺在沙發看林書豪打球，而且一點罪惡感都沒有！」後來，媽媽完全不能進食，只能喝一點點水，但這樣的試煉，她卻引為大喜樂，每次喝水，都充滿感謝的說：「這水好甜，好好喝喔。」
  start_text: 但這次，我繫著這條紅領帶，參加媽媽的告別式。我1
