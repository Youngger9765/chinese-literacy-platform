version_id: v3
section_no: 七
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 底下哪一個情況，可以用「如影隨形」這個詞語來形容？
    options:
      A: 月光下微風中搖曳的樹影
      B: 比賽時，突發的肌肉痙攣
      C: 小明比賽時失常，衝口而出咒罵起自己來
      D: 會考壓力一直跟著國三學生，難以擺脫
    teacher_note: (如影隨形表示緊緊跟隨，沒辦法拋開）
    teacher_note_carrier: 獨立文字方塊，浮貼在選項 A 右側；括號前半形後全形，原稿如此
  - index: 2
    answer: B
    stem: 作者為什麼繫著紅領帶去參加喪禮？
    options:
      A: 作者的媽媽生前最喜歡紅色
      B: 紅領帶提醒他學習媽媽面對苦難的方式
      C: 不想讓別人知道自己很難過
      D: 不懂人情故意穿著不適合的服裝
  - index: 3
    answer: D
    stem: 文中第八段作者說「我們下決心要跟媽媽看齊」，下列哪一個選項不是作者「跟媽媽看齊」的具體表現？
    stem_note: 「不是」在原稿加了底線
    options:
      A: 臨終前圍著媽媽唱歌說好笑的事
      B: 媽媽過世，感謝上帝讓媽媽息了世界上的勞苦
      C: 追思禮拜和告別式繫上紅領帶
      D: 悲傷不定時發作，哭到喘不過氣來
  - index: 4
    answer: C
    stem: 本文最主要想告訴讀者什麼？
    options:
      A: 選擇好的服飾，可以帶來不一樣的心情
      B: 親情是無可取代的，死亡也不會阻斷親子之情
      C: 有些事情無法掌控或改變，但人仍可以選擇如何面對
      D: 人生本來就是崎嶇不平、蜿蜒凶險，不必大驚小怪
  - index: 5
    answer: A
    stem: 請問下列選項最符合本文所說的「黑色幽默」？
    options:
      A: 腳受傷打石膏，他笑說：「這下鞋子可以休息幾天了。」
      B: 拿到獎狀後，他說：「我最大的優點就是很謙虛。」
      C: 朋友遲到半小時，他說：「你今天來得真早。」
      D: 演講結束後，他說：「內容越短，大家越捨不得結束。」
