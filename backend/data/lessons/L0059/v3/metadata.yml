intro: 這篇文章透過作者繫著紅領帶參加媽媽告別式的回憶，帶領我們看見一位母親在面對生命重大考驗時的態度。作者的媽媽在罹患重病後，經歷了身體的病痛、治療的折磨，以及對死亡的恐懼，但她始終抱持著樂觀、感恩的心，甚至用幽默化解艱難。這段經歷讓作者體悟到，即使生命中充滿無法預測的挑戰，我們仍然可以選擇如何面對，並從中找到力量。文章藉由一條紅領帶，連結了生命中的喜悅與哀傷，以及面對離別時的溫暖與堅強。
