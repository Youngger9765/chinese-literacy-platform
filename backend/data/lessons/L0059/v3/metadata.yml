  總表_對照: '總表只列 **8** 個語詞，學習單有 **9** 個 —— 差的是「**珍重**」。

    學習單自己的三處完全一致且都有珍重：語詞框（9 個）、第三大題（9 題，第 6 題就是珍重）、

    第四大題代號（A~I 共 9 個，H.珍重）、第八大題灰框（9 個）。

    所以是**總表漏列**，不是學習單多寫；抽取以學習單為準。'
strategy_explained: '這一課我們要練習的是「用正向想法，把壞事變好的魔法」

  為什麼呢，因為作者的媽媽即使生病很難受，還是用開心的態度面對，就像故事裡那條紅領帶，雖然代表著難過，卻也串起了很多溫暖和力量

  所以讀的時候，你可以想想看，當遇到困難時，有沒有什麼方法可以讓自己感覺好一點，或者發現裡面讓你覺得很佩服的地方'
