paragraphs:
- 但這次，我繫著這條紅領帶，參加媽媽的告別式。我13歲那年，媽媽被診斷罹患一種惡性程度很高的胃癌。接下來的11個月，她承受了身體及心理的種種折磨。但是，媽媽用聖經裡的一句話鼓勵自己，也鼓勵我們：「你們落在百般試煉中，都要引以為大喜樂。」
- 媽媽接受全胃切除手術，沒有胃以後，她一躺下，消化液就會衝到胸口，她從此無法躺著睡。面對這樣的試煉，她卻以黑色幽默說：「沒有胃真好，這樣就不會胃痛了。」
- 接著是化療，媽媽頭髮掉光，又拉肚子、又便祕，還常發出「噁、噁」的乾嘔。媽媽很虛弱，只能坐在沙發上看電視，但這樣的試煉，媽媽卻引為大喜樂，又來個黑色幽默說：「生病最大的好處就是可以整天躺在沙發看林書豪打球，而且一點罪惡感都沒有！」
- 後來，媽媽完全不能進食，只能喝一點點水，但這樣的試煉，她卻引為大喜樂，每次喝水，都充滿感謝的說：「這水好甜，好好喝喔。」
- 身體的磨難夠苦，但如影隨形的死亡和分離更可怕。第21次化療，醫師建議媽媽不要再繼續化療，改接受安寧照護，爸爸、哥哥和我都哭了，媽媽沒在怕，只說：「沒有關係，有一天我們還會在天父那裡再見哦。」
- 我們下定決心要跟媽媽看齊。
- 媽媽臨終那天，在她還聽得到的時候，我們打定主意要開開心心陪她最後一段，幾個朋友圍著病床，開始說我們小時候好笑的事情、唱詩歌。晚上10點06分，我們唱到媽媽最喜歡的「耶和華我的力量」時，儀器上所有的血壓、心跳指數開始歸零，我終於哭出聲來，但淚眼模糊中，我感謝上帝讓她息了世界上的勞苦。
- 但14歲，我就沒有媽媽了。
- 好像大地震之後的餘震一樣，我的悲傷會不定時發作，哭到喘不過氣來。但媽媽講的話一直在我耳邊響起，她說：「很多事不是我們能掌控的，但我們還是可以決定如何面對它。」
- 媽媽因病離開，這是我們無法控制的。但是，我們還是可以決定用怎樣的心情送她最後一程。於是，在葬禮和追思禮拜中，我們讓自己看來喜氣洋洋，白色襯衫、深色長褲、再繫上我最珍重的紅色領帶。
- 這條紅領帶提醒我，人生的路有時崎嶇不平，有時蜿蜒凶險，但即使事情已不可逆轉，我們還是可以轉換自己的觀點。
