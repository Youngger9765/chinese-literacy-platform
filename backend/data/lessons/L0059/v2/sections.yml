lesson_uid: L0059
version_id: v2
vocab_definitions:
  items:
  - index: 1
    word: 如影隨形
    definition: 像影子一直跟著一樣；比喻某種感受或問題緊緊跟隨，難以擺脫。
  - index: 2
    word: 百般試煉
    definition: 各式各樣的考驗與磨難。「百般」是各式各樣的意思。
  - index: 3
    word: 崎嶇不平
    definition: 形容道路高低不平、很難行走；也可比喻人生經歷許多困難。
  - index: 4
    word: 追思
    definition: 回想、懷念。
  - index: 5
    word: 蜿蜒凶險
    definition: 形容道路彎彎曲曲又危險；也可比喻人生路途充滿波折。
  - index: 6
    word: 珍重
    definition: 珍惜與重視。
  - index: 7
    word: 安寧照護
    definition: 對病情嚴重、無法痊癒的病人，提供減輕疼痛的照護，讓病人過得比較舒服、有尊嚴。
  - index: 8
    word: 黑色幽默
    definition: 面對痛苦或讓人難受的事情，用幽默的方式說出來，讓人想笑，也看見事情的沉重。例如，媽媽說：「沒有胃真好，這樣就不會胃痛了。」
  - index: 9
    word: 逆轉
    definition: 事情的發展方向改變，出現不同或相反的結果。「不可逆轉」是指事情已經無法回到原來的狀態，也無法挽回。
