    text: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。七閱讀理解七閱讀理解
  - type: self_check
    items:
    - 我能從媽媽的不同反應，找出共同信念。
    - 我能看出家人和作者如何接下這個信念。
    - 我能說明紅領帶的意義，並把信念用在新情境中。
