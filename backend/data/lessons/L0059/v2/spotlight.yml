spotlight:
  lesson: G6-L19
  strategy_name: 品格力-正向思考-如何面對不能改變的事
  strategy_type: sel_character
  blocks:
  - type: guide
    text: 一、從媽媽的反應找出共同信念
  - type: guide
    text: 媽媽的病痛一步步加重，但她每次面對病痛的方式不完全相同。請讀媽媽的反應，選出主要的面對方式。
  - type: table
    rows:
    - - 媽媽面對病痛時的反應
      - 這個反應主要表現什麼？
    - - 1.沒有胃、無法躺著睡，媽媽說：「沒有胃就不會胃痛了。」
      - '①用幽默轉換個角度看

        □②珍惜並感謝仍然擁有的'
    - - 2.化療後身體很虛弱，媽媽說可以整天躺在沙發上看球賽
      - '①用幽默轉換個角度看

        □②珍惜並感謝仍然擁有的'
    - - 3.不能進食，只能喝一點點水，媽媽說：「這水好甜，好好喝喔。」
      - '□①用幽默轉換個角度看

        ②珍惜並感謝仍然擁有的'
    - - 4.醫師建議不再繼續化療，媽媽說：「有一天我們還會在天父那裡再見哦。」
      - □①珍惜並感謝仍然擁有的②用信仰面對死亡與分離
  - type: single
    prompt: 1.媽媽面對病痛方式雖然不同，背後哪個信念一直沒有改變？（單選）
    options:
    - 只要保持喜樂，病情最後就會慢慢好轉。
    - 不能決定病痛如何發展，仍可以選擇如何面對。
    - 為了不讓家人難過，應把痛苦全部藏在心裡。
    answer: 不能決定病痛如何發展，仍可以選擇如何面對。
  - type: single
    prompt: 2.課文說：「我們下定決心要跟媽媽看齊。」這可以看出媽媽的做法對家人產生什麼影響？（單選）
    options:
    - 讓家人相信媽媽的病情其實沒有那麼嚴重。
    - 讓家人看見，面對無法改變的事仍能作出選擇。
    - 讓家人不用再擔心，也不必陪伴媽媽治療。
    answer: 讓家人看見，面對無法改變的事仍能作出選擇。
  - type: guide
    text: 你發現了嗎？
  - type: guide
    text: 媽媽有時用幽默，有時表達感謝，有時依靠信仰。做法雖然不同，背後的信念卻相同：
  - type: guide
    text: →很多事不能掌控，但仍可以選擇如何面對。
  - type: guide
    text: →這個信念不只幫助媽媽，也影響了家人和作者。
  - type: guide
    text: 二、看信念如何由媽媽走向作者
  - type: single
    prompt: 1.作者說「跟媽媽看齊」最接近什麼意思？（單選）
    options:
    - 要求自己和媽媽一樣，完全不害怕死亡
    - 學習媽媽面對無法掌控之事的方式。
    answer: 學習媽媽面對無法掌控之事的方式。
  - type: free_text
    prompt: 2.請完成「信念被承接」的歷程
  - type: table
    rows:
    - - 信念的發展
      - 課文中的表現
    - - 媽媽活出信念
      - 用【】、【】與【】面對病痛。
    - - 媽媽說出信念
      - 很多事不是我們能【】的，但可以決定如何【】。
    - - 家人跟媽媽看齊
      - 說好笑的事、唱詩歌，開心陪媽媽走完【】。
    - - 作者用行動承接
      - 在告別式和追思禮拜中，繫上【】送別媽媽。
    - - 紅領帶持續提醒
      - '往後遇到不可逆轉的困難時，提醒自己仍能選擇

        【】。'
    answers:
    - 幽默
    - 感謝
    - 信仰
    - 掌控
    - 面對
    - 最後一段路
    - 紅領帶
    - 如何面對
  - type: guide
    text: 三、讀懂紅領帶承接了什麼？
  - type: single
    prompt: 1.紅領帶如何把「看不見的信念」變得看得見？（單選）
    options:
    - 紅領帶的顏色很鮮豔，所以容易被大家注意。
    - 作者用繫紅領帶的行動，實踐媽媽教給他的面對方式。
    - 親友看見紅領帶，就不會在告別式感到難過。
    answer: 作者用繫紅領帶的行動，實踐媽媽教給他的面對方式。
  - type: single
    prompt: 2.下列哪一組最能說明全文的重要關係？（單選）
    options:
    - 媽媽生病→作者難過→作者穿上特別的服裝
    - 媽媽活出信念→家人跟媽媽看齊→作者用紅領帶繼續實踐
    - 媽媽接受治療→家人陪伴照顧→作者日後不再感到悲傷
    answer: 媽媽活出信念→家人跟媽媽看齊→作者用紅領帶繼續實踐
  - type: guide
    text: 四、換你試試看：把信念帶到生活裡
  - type: guide
    text: 情境：重要比賽前，小傑受傷了。醫師說：「這次不能上場。」小傑很失望，也擔心辜負隊友。
  - type: single
    prompt: 1.哪一個想法較符合本課的信念？（單選）
    options:
    - 告訴自己：「受傷其實是好事，我根本不想參加比賽。」
    - 不讓隊友失望，忍著疼痛上場，等比賽結束再治療。
    - 接受這次不能上場，先配合治療，也和教練討論自己還能怎麼幫助球隊。
    answer: 接受這次不能上場，先配合治療，也和教練討論自己還能怎麼幫助球隊。
  - type: free_text
    prompt: 2.小傑怎麼把「不能掌控的事」和「仍能選擇的事」分開？
  - type: free_text
    prompt: (1)不能掌控的事：【  這次不能上場      】
  - type: free_text
    prompt: (2)我仍然可以選擇的事：【  配合治療，並和教練討論如何幫助球隊     】
  - type: single
    prompt: 3.第③個做法為什麼符合本文媽媽的信念？（單選）
    options:
    - 他承認受傷和失望，也在現況中找出自己仍能做的事。
    - 他努力忘記受傷的事，讓自己不要再感到失望。
    answer: 他承認受傷和失望，也在現況中找出自己仍能做的事。
  - type: self_check
    items:
    - 我能從媽媽的不同反應，找出共同信念。
    - 我能看出家人和作者如何接下這個信念。
    - 我能說明紅領帶的意義，並把信念用在新情境中。
