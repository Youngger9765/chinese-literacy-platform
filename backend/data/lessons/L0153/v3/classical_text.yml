lesson_uid: L0153
version_id: v3
classical_text:
  label: 原文
  source: 唐朝・李亢
  note_dots: 文章中的「.」是表示斷詞的地方，朗讀時，不要把「同組的詞」分開。
  paragraphs:
  - 魏　鮑子都，暮行於野，見一書生卒1心痛。子都下馬，為摩其心。有頃2，書生卒。子都視其囊中，有《素書》3一卷，金十餅。乃賣一餅，具葬書生，其餘枕之頭下，置素書於腹旁。
  - 後數年，子都於道上，有乘驄馬者逐之。既及，以子都為盜，固問兒屍所在。子都具言，於是相隨往。
  - 開墓，取兒屍歸，見金九餅在頭下，素書在腹旁。舉家感子都之德義。由是聲名大振。
  annotations:
  - 'no': 1
    term: 卒
    text: 卒：ㄘㄨˋ，通「猝」。急促、突然。
  - 'no': 2
    term: 有頃
    text: 有頃：不久、一會兒。
  - 'no': 3
    term: 卒
    text: 卒：死亡。
  - 'no': 4
    term: 素書
    text: 素書：兵書。
  - 'no': 5
    term: 枕
    text: 枕：ㄓㄣˋ，當動詞，用什麼東西墊頭。
  notes:
    note_dots: '⚠️ 指示語這樣寫，但**本課原文的文字流裡沒有任何斷詞點「.」**（PDF p2 也看不到）。

      L0161 的原文則是每個詞組之間都有「.」。本課屬指示語留著、斷詞點沒排進去。'
    paragraphs: '「魏」與「鮑子都」之間是一個全形空格，原稿如此。

      段內的 1／2／3 是原稿印的注釋標號（字面數字，不是自動編號）。'
    annotations: 注釋的 1.~5. 是 Word 自動編號（不在文字流），此處補上序號；標號對不上原文，見 source_errata E1。
