lesson_uid: L0153
version_id: v3
section_no: 一
sentence_matching:
  label: ㄧ、文白句子比對
  instruction: '請模仿例句作法：

    ❶ 閱讀原文；❷ 找出對應的參考句；❸ 在下方的[  ]寫上參考句代號。'
  answer_carrier: 橘色代號（字元樣式），PDF p3 可見；每個［　］就印在對應子句的正下方
  example:
    文言: 魏　鮑子都，暮行於野，見一書生卒心痛
    answer: 5
  example_note: 例句的參考句［５］在參考句清單上被劃掉（原稿印刪除線＋「≫」記號），表示已用掉。
  reference_sentences:
    1: 一位騎著駿馬的人追趕他
    2: 還一再追問鮑子都他兒子的屍身在哪裡
    3: 不久，書生還是死了
    4: 就賣了一個金餅，把賣的錢全用來安葬書生
    5: 魏國的鮑子都某天傍晚走在荒野，碰巧見到一名書生突然心絞痛
    6: 子都就把當時的情況全說了
    7: 子都看書生的袋子裡有一冊兵書和十個金餅
    8: 書生全家都非常感謝鮑子都的恩德與義舉
    9: 子都立刻下馬，為他按摩心臟
    10: 從此鮑子都的名字與事蹟被眾人口耳相傳，一下子就有名起來了
    11: 剩下的九個金餅就墊在書生的頭下，兵書也放在書生的肚子邊
    12: 等到那人追上以後，把子都當作強盜
    13: 那人挖開墳墓，取出兒子的屍身要帶回去
  items:
  - 文言: 子都下馬，為摩其心
    answer: 9
  - 文言: 有頃，書生卒
    answer: 3
  - 文言: 子都視其囊中，有《素書》一卷，金十餅
    answer: 7
  - 文言: 乃賣一餅，具葬書生
    answer: 4
  - 文言: 其餘枕之頭下，置素書於腹旁
    answer: 11
  - 文言: 有乘驄馬者逐之
    answer: 1
  - 文言: 既及，以子都為盜
    answer: 12
  - 文言: 固問兒屍所在
    answer: 2
  - 文言: 子都具言
    answer: 6
  - 文言: 開墓，取兒屍歸
    answer: 13
  - 文言: 舉家感子都之德義
    answer: 8
  - 文言: 由是聲名大振
    answer: 10
  items_note: '13 個子句（含例句）用掉 13 個參考句代號，每個代號恰好用一次 —— 這是本節的內部一致性檢查。

    參考句清單裡 ［１］~［９］用全形數字、［10］~［13］用半形，原稿如此。'
