word_matching:
  label: 二、文白詞語比對
  instruction: 以下是原文與白話文的對照。請依照文意，寫出原文中灰底的白話文意思。
  items:
  - index: 1
    文言: 魏　鮑子都，暮行於野，見一書生卒心痛。
    白話: 魏國的鮑子都，某天(　)走(　)荒野，碰巧見到一名書生(　)心絞痛。
    blanks:
    - answer: 傍晚
    - answer: 在
    - answer: 突然
  - index: 2
    文言: 子都下馬，為摩其心，有頃，書生卒。
    白話: 子都立刻下馬，為他(　)心臟，(　)，書生還是(　)。
    blanks:
    - answer: 按摩
    - answer: 不久
    - answer: 死了
  - index: 3
    文言: 乃賣一餅，具葬書生，其餘枕之頭下，置素書於腹旁。
    白話: (　)賣了一個金餅，把賣的錢(　)安葬書生，剩下的九個金餅就墊在(　)的頭下，兵書也放(　)書生的肚子邊。
    blanks:
    - answer: 就
    - answer: 全用來
    - answer: 書生
    - answer: 在
  - index: 4
    文言: 後數年，子都於道上，有乘驄馬者逐之。
    白話: 幾年後，子都(　)路上，一位騎著駿馬的人追趕(　)。
    blanks:
    - answer: 在
    - answer: 他
  - index: 5
    文言: 既及，以子都為盜，固問兒屍所在。
    白話: 等到那人追上以後，(　)子都(　)強盜，還(　)鮑子都他兒子的屍身在哪裡。
    blanks:
    - answer: 把
    - answer: 當作
    - answer: 一再追問
  - index: 6
    文言: 子都具言，於是相隨往。
    白話: 子都就把當時的情況(　)，然後那個人跟隨子都來到書生的墓前。
    blanks:
    - answer: 全說了
  - index: 7
    文言: 舉家感子都之德義。由是聲名大振。
    白話: 書生(　)都非常感謝鮑子都(　)恩德與義舉。(　) 鮑子都的名字與事蹟被眾人口耳相傳，一下子就有名起來了。
    blanks:
    - answer: 全家
    - answer: 的
    - answer: 從此
  notes:
    answer_carrier: 橘色（字元樣式），PDF p4~p5 可見
    items: '第 2 題的文言把原文的兩句（「子都下馬，為摩其心。有頃，書生卒。」）併成一句並改標點為逗號；

      第 1 題的文言則與原文完全一致。原稿如此。'
