    why: '注釋依序是 1.卒(突然) 2.有頃 3.卒(死亡) 4.素書 5.枕，

      但原文裡「《素書》」標的是 3（對應的卻是「卒：死亡」），

      而第二個「卒」（書生卒）與「枕」根本沒有標號。

      正確標法應是《素書》4、書生卒3、枕5。因無法確定出版方要改哪一邊，**未更正**，只登錄。'
