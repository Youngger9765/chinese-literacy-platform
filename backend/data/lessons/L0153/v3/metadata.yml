intro: 這篇文章講述了魏國人鮑子都，在一次偶然的機會下，遇到一位奄奄一息的書生。鮑子都毫不猶豫地伸出援手，為書生減輕痛苦。書生過世後，鮑子都發現書生留下的財物，並用其中一部分妥善安葬了書生。幾年後，一位騎馬的男子找上鮑子都，原來是那位書生的兒子，他前來尋找父親的遺體。鮑子都帶著書生的兒子一同前往，並說明了事情的經過。這段經歷展現了鮑子都的善良與誠信，也讓他的名聲因此廣為流傳。
