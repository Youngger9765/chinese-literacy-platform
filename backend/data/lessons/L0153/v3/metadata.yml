strategy_explained: '這篇文章我們要練習的是，掌握文言文中常見的固定句式，就像學英文的片語一樣，能幫助你快速理解句子意思

  因為《荒野救亡記》裡有不少像「鮑子都遇書生」這樣的固定結構，熟悉它們就能更輕鬆讀懂鮑子都如何救人、安葬，以及書生兒子來尋父的經過

  讀的時候，試著留意這些重複出現、結構相似的句子，它們往往藏著關鍵的訊息喔'
