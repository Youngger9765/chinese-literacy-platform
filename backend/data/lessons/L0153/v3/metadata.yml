_總表_對照note: "・文言文分頁的欄名與 1.總表 不同（用「新課次」「單元議題」，沒有「議題」欄）。\n・「第六大題標題」欄寫「固定句式：以……為……」，與學習單第四大題標題完全一致；\n  學習單第一頁右上角的目標框則印「文言聚光燈：固定句式」（較短），兩者都照原樣。\n・⚠️ 本課聚光燈是**第四**大題（白話課多為第五或第六）—— 文言文的大題集合不同，\n  不能套白話課的位置推定。"
