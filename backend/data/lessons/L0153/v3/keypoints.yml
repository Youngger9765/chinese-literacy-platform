lesson_uid: L0153
version_id: v3
section_no: 三
keypoints:
  label: 三、文章重點表
  layout: matrix
  intro: '我們練習過很多次「問題、解決、結果」的故事結構，相信你現在已經是拆解故事的高手了！

    這次我們換個方式，把這篇課文當成一部微電影。在電影開拍前，我們要先佈置好「故事舞台」，然後跟著鮑子都一起經歷高潮迭起的三幕劇。

    準備好了嗎？讓我們一起看看這場發生在荒野的意外，鮑子都如何化解危機，寫下自己的傳奇吧！'
  columns:
  - 劇本設定
  - 內容摘要
  column_note: 【 】處填入原文，找不到原文時，再用自己的話寫。
  answer_carrier: 橘色（字元樣式），PDF p6 可見
  rows:
  - 劇本設定: 故事舞台
    內容摘要: '場景：魏國的(　)

      時間：(　)時分。'
    內容摘要_blanks:
    - answer: 野/荒野
    - answer: 暮/傍晚
  - 劇本設定: 第一幕
    內容摘要: '問題：鮑子都偶遇書生(　)

      解決：鮑子都立刻下馬施救。

      結果：書生不治身亡。'
    內容摘要_blanks:
    - answer: 卒心痛/突發心絞痛
  - 劇本設定: 第二幕
    內容摘要: '問題：書生不治身亡。

      解決：(1)發現書生有一本(　)與(　)。

      (2)變賣(　)安葬書生，剩下(　)墊在遺體的頭下，兵書也放在書生的身邊。

      結果：書生得到安葬。'
    內容摘要_blanks:
    - answer: 素書/兵書
    - answer: 十塊金餅
    - answer: 一金/一個金餅
    - answer: 九金/九個金餅
  - 劇本設定: 第三幕
    內容摘要: '問題：書生家人誤認鮑子都是(　)，厲聲質問兒子的下落。

      解決：鮑子都坦然說明往事，並帶路至墓地。

      結果：開墓後，九金與兵書完好無缺，證實鮑子都並未私吞財物。'
    內容摘要_blanks:
    - answer: 盜/強盜
  - 劇本設定: 結局
    內容摘要: '1.真相大白後，書生的家人從質疑轉為(　)。

      2.鮑子都的義舉在眾人的口耳相傳下，不久就成了很有名的人了。'
    內容摘要_blanks:
    - answer: 感激
  rows_note: '答案多為「原文/白話」兩種寫法並列（野/荒野、暮/傍晚…），對應欄位說明的

    「【 】處填入原文，找不到原文時，再用自己的話寫」。照原樣保留斜線兩式。

    ⚠️ 空格在原稿印的是圓括號(　)不是【　】，雖然欄位說明講的是【 】。'
