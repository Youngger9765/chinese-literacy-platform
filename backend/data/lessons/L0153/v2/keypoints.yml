    blanks: []
  - label: 第一幕
    value: 問題：鮑子都偶遇書生( 卒心痛/突發心絞痛 )解決：鮑子都立刻下馬施救。結果：書生不治身亡。
    blanks: []
  - label: 第二幕
    value: 問題：書生不治身亡。解決：(1)發現書生有一本( 素書/兵書 )與( 十塊金餅  )。(2)變賣(一金/一個金餅)安葬書生，剩下(九金/九個金餅)墊在遺體的頭下，兵書也放在書生的身邊。結果：書生得到安葬。
    blanks: []
  - label: 第三幕
    value: 問題：書生家人誤認鮑子都是( 盜/強盜  )，厲聲質問兒子的下落。解決：鮑子都坦然說明往事，並帶路至墓地。結果：開墓後，九金與兵書完好無缺，證實鮑子都並未私吞財物。
    blanks: []
  - label: 結局
    value: 1.真相大白後，書生的家人從質疑轉為( 感激  )。2.鮑子都的義舉在眾人的口耳相傳下，不久就成了很有名的人了。
    blanks: []
