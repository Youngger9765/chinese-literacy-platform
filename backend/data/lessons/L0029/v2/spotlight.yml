spotlight:
  lesson: G5-L17
  strategy_name: 多文本閱讀-品格力-認識自我-看見長處與限制
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 一、找出自己的優勢，選對戰場：如果你有下列優勢，請你選出適合你的優勢戰場。（請勾選，單選）
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 二、大衛不但善用自己的優勢（甩石），還把自己的劣勢也變成了優勢（矮小⭢靈活），上面的練習幫助我們覺察優勢能力，接下來，我們來練習怎麼樣換個角度看，把「劣勢」轉為「優勢」。
  - type: figure
    referent: table
    asset: null
    bind_paragraph: null
  - type: guide
    text: 三、換你試試看：請你想一想自己的特質，原本可能會有的劣勢，但換個角度看後，他或許可能變成你的優勢呢！
  - type: free_text
    prompt: 1.你的一項特點：
  - type: free_text
    prompt: 2.可能的劣勢：
  - type: free_text
    prompt: 3.換個角度看──可能的優勢：
  - type: guide
    text: 結語：大衛沒有盲目聽從「穿盔甲」的建議，而是看見自己的長處、挑對戰場，終於擊倒巨人。希望你也能像他一樣：先認識自己，然後勇敢選擇最能讓你發光的舞台。
  - type: guide
    text: 九*綜合閱讀理解
