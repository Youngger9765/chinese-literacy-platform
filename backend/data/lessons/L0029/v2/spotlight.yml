      - ㄊ.當節慶晚會的主持人
  - type: guide
    text: 三、換你試試看：請你想一想自己的特質，原本可能會有的劣勢，但換個角度看後，他或許可能變成你的優勢呢！
  - type: free_text
    prompt: 1.你的一項特點：
  - type: free_text
    prompt: 2.可能的劣勢：
  - type: free_text
    prompt: 3.換個角度看──可能的優勢：
  - type: guide
    text: 結語：大衛沒有盲目聽從「穿盔甲」的建議，而是看見自己的長處、挑對戰場，終於擊倒巨人。希望你也能像他一樣：先認識自己，然後勇敢選擇最能讓你發光的舞台。
  - type: guide
    text: 九*綜合閱讀理解
  - type: passage
    source: unknown
    paragraphs:
    - 請根據兩篇課文的內容，選出最適合的答案，要讀完每一個選項再作答。請根據兩篇課文的內容，選出最適合的答案，要讀完每一個選項再作答。
    - (「舉步維艱」通常用在身體虛弱、地形困難、情況艱困時，形容連走一步都很困難。)(「舉步維艱」通常用在身體虛弱、地形困難、情況艱困時，形容連走一步都很困難。)（
      C ）1. 下列語詞，何者使用錯誤？
    - A.古人沒有現代機器，卻能搬動巨石，實在令人「匪夷所思」
    - B.彈鋼琴對他來說已是「駕輕就熟」，就像喝水一樣簡單
    - C.看著百貨公司琳瑯滿目的商品，我真是「舉步維艱」
    - D.小偉說的話「破綻百出」，立刻被老師抓包
