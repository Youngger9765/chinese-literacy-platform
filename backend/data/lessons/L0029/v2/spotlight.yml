spotlight:
  lesson: G5-L17
  strategy_name: 多文本閱讀-品格力-認識自我-看見長處與限制
  strategy_type: sel_character
  blocks:
  - type: guide
    text: ◎小試身手：
  - type: guide
    text: 一、找出自己的優勢，選對戰場：如果你有下列優勢，請你選出適合你的優勢戰場。（請勾選，單選）
  - type: table
    rows:
    - - 如果你有這些優勢
      - 哪一個是你的優勢戰場？
    - - 1.反應快，適合處理需要即時決策的事情。
      - □①統整大型活動□②做長篇研究報告
    - - 2.口語表達清楚，能說服別人採納好點子。
      - □①負責寫校刊排版□②參加辯論隊
    - - 3.視覺敏銳，擅長圖像。
      - □①記錄課堂筆記文字稿□②設計美術視覺海報
    - - 4.喜歡統整資料，找出規律或關鍵數字。
      - □①統計班級意見並做圖表□②拍即興短影音
    - - 5.不怕陌生人，勇於跨出舒適圈交朋友。
      - □①靜態觀察植物生長□②行銷專案業務
    - - 6.實作能力強，熟悉家務、修繕等動手能力
      - □①現場帶動跳□②技藝競賽代表
    - - 7.體力很好，一整天運動都不會累
      - □①從事體能相關活動□②校園廣播站播音員
    - - 8.身體協調性佳，柔軟度很好
      - □①擔任電玩選手□②往舞蹈、 體操社發展
    - - 9.幽默感強，常逗得大家哈哈大笑
      - □①圖書館分類志工□②擔任校園活動主持人
    - - 10.換你試試看，你的優勢能力是什麼呢？【】
      - 你的優勢戰場是哪裡？【】
    - - ※請你和同學分享，並請同學給你回饋或建議：                                       同學簽名：
  - type: guide
    text: 二、大衛不但善用自己的優勢（甩石），還把自己的劣勢也變成了優勢（矮小⭢靈活），上面的練習幫助我們覺察優勢能力，接下來，我們來練習怎麼樣換個角度看，把「劣勢」轉為「優勢」。
  - type: table
    rows:
    - - 可能的劣勢
      - ''
      - 特質
      - ''
      - 可能的優勢
    - - 1.午餐挑剔，讓營養師頭痛
      - ●
      - ●
      - A.左撇子
      - ●
