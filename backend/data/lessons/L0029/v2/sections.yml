comprehension:
  questions:
  - index: 2
    answer: A
    stem: 根據兩篇文章，歌利亞連日叫陣，以色列卻無人應戰，推論當時以色列軍隊的狀態最不可能是什麼？
    options:
      B: 擔憂氣餒
      C: 士氣低落
      D: 畏縮不前
      A: 文本描述「無人敢出來應戰，全軍士氣低落」，顯示以色列士兵深感恐懼與挫敗，符合 B、C、D的「擔憂氣餒／士氣低落／畏縮不前」。
    rationale: 文本描述「無人敢出來應戰，全軍士氣低落」，顯示以色列士兵深感恐懼與挫敗，符合 B、C、D的「擔憂氣餒／士氣低落／畏縮不前」。
    is_rationale: true
  - index: 3
    answer: B
    stem: 如果大衛改用歌利亞那把又長又重的長矛，並採取近身肉搏，最可能發生的情況是什麼？
    options:
      A: 物質資源愈多愈容易取勝
      B: 面臨強敵，先求同伴協助
      C: 懷有內心信仰便能戰勝一切
      D: 善用自身優勢即可扭轉劣勢
    rationale: 兩篇文章都強調大衛致勝關鍵在「輕裝速度＋遠距攻擊」。改拿沉重長矛等於放棄機動與熟練度，最可能被對手抓到破綻。
  - index: 5
    answer: C
    stem: 假設某位同學同時具備「統整大量數據」與「版面視覺設計」兩項長處。根據「選對戰場、發揮長處」的原則，下列哪一項任務最能同時發揮這兩項長處？
    options:
      A: 為校刊撰寫 3000 字的人物專訪，專注採訪內容與文字表達
      B: 在校慶園遊會擔任攤位主持人，隨機即席推銷商品
      C: 統計並製作全校「課後社團意向」問卷的結果海報看板
      D: 負責紀錄每次田徑隊練習的秒數並口頭提醒隊友衝刺
    rationale: C需要先統計、大量歸納數據（對應統整能力），再視覺化排版問卷結果（發揮版面設計長處），可同時放大雙優勢，最符合「選對戰場」精神。
