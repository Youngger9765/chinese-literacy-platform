keypoints:
  lesson: G5-L17
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 【背景】
    value: '西元前 1100 年左右，以色列與非利士兩軍隔著__

      對峙，僵持數月。'
    blanks:
    - answer: 山谷
      hint: ''
  - label: 【起因】
    value: 非利士巨人__連日出來叫陣單挑，要求以單挑決定雙方勝負，以色列軍隊__，士氣低落。
    blanks:
    - answer: 歌利亞
      hint: ''
    - answer: 無人敢應戰
      hint: ''
  - label: 【經過】
    value: "15歲牧羊少年__送飯到陣地，自告奮勇請戰。 \n→國王一開始拒絕，後來被大衛的決心說服，讓大衛應戰。\n→大衛拿了牧羊的杖，以及在溪邊挑選__，帶著\n\
      \  甩石的機弦迎向巨人。\n→大衛將石頭甩射出去，一石擊中歌利亞未防護的__，大衛拔出巨人的__將其斬首。"
    blanks:
    - answer: 大衛
      hint: ''
    - answer: 五塊石子
      hint: ''
    - answer: 額頭
      hint: ''
    - answer: 大刀
      hint: ''
  - label: 【結果】
    value: 巨人倒地身亡，非利士軍__，以色列人大獲全勝。
    blanks:
    - answer: 四散逃跑
      hint: ''
  - label: 作者結語
    value: 面對可怕的挑戰及困難，勇敢面對，發揮自己的長處，就有機會將危機變成轉機。
    blanks: []
  title: 牧羊少年的逆轉勝
