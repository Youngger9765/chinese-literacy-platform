  vocabulary_bank_note: 上面是兩篇合併後的完整清單；篇1 有 13 個、篇2 有 14 個，各自的語詞框分開印
  items:
  - part: 1
    section_no_printed: 三
    index: 1
    word: 對峙
    definition: 雙方面對面僵持著，誰也不讓誰，好像隨時準備交戰。
  - part: 1
    index: 2
    word: 不甘示弱
    definition: 不想被別人看扁，積極採取行動，想表現得和對方一樣好，甚至更好。
  - part: 1
    index: 3
    word: 堅不可摧
    definition: 非常堅固，無法破壞；也可比喻強大的力量或意志。
  - part: 1
    index: 4
    word: 叫陣
    definition: 在對戰前，挑釁對方出戰，大聲嗆聲要對方出來比一比、拼一拼。
  - part: 1
    index: 5
    word: 千古流傳
    definition: 故事（或詩文）流傳很久，歷經千年仍被記得。
  - part: 1
    index: 6
    word: 輕舉妄動
    definition: 沒有想清楚就亂行動。
  - part: 1
    index: 7
    word: 僵持
    definition: 兩邊誰也不讓誰，卡在那裡很久沒結果。
  - part: 1
    index: 8
    word: 身材魁梧
    definition: 形容人高大壯碩、體格強健。
  - part: 1
    index: 9
    word: 毫無勝算
    definition: 一點贏的機會都沒有。
  - part: 1
    index: 10
    word: 迅雷不及掩耳
    definition: 比喻動作或事情發生得太快，根本來不及反應。
  - part: 1
    index: 11
    word: 血脈賁張
    definition: 形容情緒非常激動。賁：張大、鼓起、凸起。
  - part: 1
    index: 12
    word: 望而生畏
    definition: 光是看到就感到害怕，形容對方氣勢強大或外表嚇人。
  - part: 1
    index: 13
    word: 大驚失色
    definition: 形容因驚嚇而臉色大變。
  - part: 2
    section_no_printed: 四
    index: 1
    word: 力大無窮
    definition: 力氣非常大，好像用不完一樣。
  - part: 2
    index: 2
    word: 破綻
    definition: 容易被發現或攻擊的缺口；也可以指說話或做事上的漏洞。
  - part: 2
    index: 3
    word: 挑釁
    definition: 故意用言語或動作刺激對方，想讓對方生氣或反應。
  - part: 2
    index: 4
    word: 無用武之地
    definition: 沒有機會發揮一個人的本領，或一件物品的功能。
  - part: 2
    index: 5
    word: 螳臂擋車
    definition: 一隻小螳螂舉起牠的手臂，想要擋住車輛。形容想用很小的力量去阻擋很強大的事物，結果根本就擋不住。
  - part: 2
    index: 6
    word: 廝殺
    definition: 打仗或打架時激烈的互相攻擊，試圖殺死對方。
  - part: 2
    index: 7
    word: 匪夷所思
    definition: 事情太奇怪或太特別，讓人想不通。
  - part: 2
    index: 8
    word: 堅持己見
    definition: 堅持自己的看法，不輕易改變。
  - part: 2
    index: 9
    word: 駕輕就熟
    definition: 對一個技能太熟練了，所以做起來很輕鬆。
  - part: 2
    index: 10
    word: 盔甲
    definition: 古代人打仗時穿在身上的保護衣，通常是金屬做的。
  - part: 2
    index: 11
    word: 獨排眾議
    definition: 面對眾人的反對，仍堅持提出自己的主張。
  - part: 2
    index: 12
    word: 孤立無援
    definition: 形容某人陷入困難或危機，卻沒有人可以幫助。
  - part: 2
    index: 13
    word: 舉步維艱
    definition: 連走一步都很困難，比喻情況非常難處理。
  - part: 2
    index: 14
    word: 羊入虎口
    definition: 弱小的羊進入兇猛老虎的嘴巴，完全沒有逃脫的機會。比喻弱者陷入很大的危險，很難脫身。
  answer_carrier: 橘色手寫字（圖形層），文字流有字但無顏色資訊
