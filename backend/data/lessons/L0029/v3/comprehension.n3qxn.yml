version_id: v3
section_no: 六
comprehension:
  instruction: ◎請依據第二篇文章的內容，選出正確答案
  questions:
  - part: 2
    group: ◎請依據第二篇文章的內容，選出正確答案
    index: 1
    answer: D
    stem: 請從下列語詞中，選出用字正確的語詞。
    options:
      A: 堅持已見
      B: 舉步危艱
      C: 匪疑所思
      D: 孤立無援
    teacher_note: (A)堅持「己」見 (B)舉步「維」艱 (C)匪「疑」所思
  - part: 2
    index: 2
    answer: C
    stem: 根據課文，何者不是 大衛擊敗歌利亞的原因？
    options:
      A: 他年紀雖小，但沉著冷靜，不易被挑釁
      B: 他懂得善用策略，運用自身優勢將危機化為轉機
      C: 他接受眾人的幫助，展現不服輸的勇氣與智慧
      D: 他善用熟悉的武器，避免近戰劣勢
    teacher_note: (C)大衛是單挑巨人，並未接受眾人的幫助文中未提到。
  notes:
    instruction: 這是大題九（綜合閱讀理解）印的指示語；篇1、篇2 各自的題組另有自己的引導句
  part: 2
