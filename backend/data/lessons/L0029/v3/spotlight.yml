  section_no_printed: 八
  blocks:
  - type: guide
    label: 七*綜合練習（大題七，非聚光燈）
    text: 1.這兩篇文章雖然主角都是大衛，但是聰明的你有發現嗎？兩篇文章的敘述方式有點不太一樣。現在請把下列寫法，連到對應的課文。
  - type: matching
    label: 七-1 連連看
    left_header: 兩篇文章的寫法
    right_header: 課文名稱
    left:
      1: 主要用故事情節帶出大衛擊敗歌利亞的整個過程。
      2: 屬於說明／分析文，重點在拆解「為什麼能贏」。
      3: 文章大量描述人物對話與動作，如「大衛跑向巨人」。
      4: 提出許多具體的證據，以支持末段提出的「選對戰場、發揮長處」結論。
      5: 讀完後，我們能清楚看到「誰→做了什麼→結果如何」完整時間線。
    right:
      A: 牧羊少年的逆轉勝
      B: 牧羊少年致勝的關鍵
    answer:
      1: A
      2: B
      3: A
      4: B
      5: A
    answers_printed: true
    answer_carrier: 紅色手繪連線（5 條 srgbClr FF0000 的 line 圖形），文字流無此資訊
    answer_note: "\U0001F534 PDF 上一條線都看不到 —— LibreOffice 沒把該群組畫出來，p16 全頁的紅色像素\n只有七-2、七-3 的 ☑。只讀 PDF 會判成「教師版沒連線、無答案」（L0104 同型）。\n答案是解 document.xml 的線段端點座標還原的，三重佐證同時成立：\n① 幾何：anchor 內 5 條線的左端 y（0／143.7／260.4／375.1／437.5 px @200dpi）\n   對上左欄五列 ● 的頁面 y（875／1013／1137／1235／1301），殘差 ≤9px；\n   右端只有兩個 y 值、相距 337.5px，對上右欄 A／B 兩個 ●（相距 318px），\n   接 A 三條、接 B 兩條。左端的間距序列 143.7／116.7／114.6／62.4 與\n   ● 的 138／124／98／66 逐段對應 —— 這個對位不依賴擬合出來的位移量：\n   位移前後各挪 ±70px 都會讓某一列被連兩次或落到表外。\n② 方向：五條線的 flipV 與「● 在目標之上還是之下」完全一致 ——\n   1→A 無 flip（下斜）、3→A 與 5→A 皆 flipV=1（上斜）、\n   2→B 與 4→B 皆無 flip（下斜）。\n③ 語意：(1)(3)(5) 是敘事特徵（情節、對話動作、時間線）→ A 記敘文；\n   (2)(4) 是說明特徵（拆解原因、舉證據支持結論）→ B 說明文。\n   同一頁七-2 的紅色 ☑ 印著「逆轉勝＝①記敘文」「致勝的關鍵＝②說明文」，\n   與這個切分完全吻合。"
  - type: guide
    label: 七-2
    text: 2.從寫作手法判斷文體：透過配對，我們可以進行以下判斷
  - type: single
    label: 七-2(1)
    prompt: 牧羊少年的逆轉勝的文體是什麼？
    options:
      1: 記敘文(故事)
      2: 說明文
    answer: 1
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: single
    label: 七-2(2)
    prompt: 牧羊少年致勝的關鍵的文體是什麼？
    options:
      1: 記敘文(故事)
      2: 說明文
    answer: 2
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: single
    label: 七-3
    prompt: 3.把兩篇文章合起來讀，第二篇讓我們對第一篇多懂了什麼？
    options:
      1: 大衛獲勝主要是因為歌利亞一時大意。
      2: 大衛只要勇敢，就能彌補所有能力差距。
      3: 大衛看清自己的長處與限制，選擇了合適的作戰方式。
    answer: 3
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: concept_box
    text: '當你看到身形瘦小的大衛，把高大威猛的歌利亞打倒在地，是不是也跟著熱血沸騰呢？別以為這只是運氣！他之所以能逆轉勝，有二個關鍵：

      一、覺察自己的優勢，選對戰場：

      大衛身材瘦小，不適合近身肉搏，決定用遠距離的投石器作戰。

      二、換個角度看，將自己的特質從劣勢轉變為優勢：

      如：身材瘦小(特質)

      不適合近身肉搏換個角度看可進行靈活的遠距攻擊

      靠著「找出自己的優勢，選對戰場、換個角度看」，大衛懂得洞察自己、調整策略，讓限制成為突破的起點，把看似不可能的挑戰變成了勝利！'
    note: 「不適合近身肉搏→換個角度看→可進行靈活的遠距攻擊」是一個帶箭頭的流程圖，(劣勢)/(優勢) 是標在箭頭上下的小標籤
  - type: guide
    text: ◎小試身手：
  - type: fill_table
    label: 一、找出自己的優勢，選對戰場
    instruction: 一、找出自己的優勢，選對戰場：如果你有下列優勢，請你選出適合你的優勢戰場。（請勾選，單選）
    columns:
    - 如果你有這些優勢
    - 哪一個是你的優勢戰場？
    rows:
    - 如果你有這些優勢: 1.反應快，適合處理需要即時決策的事情。
      哪一個是你的優勢戰場？_options:
        1: 統整大型活動
        2: 做長篇研究報告
      哪一個是你的優勢戰場？_answer: 1
    - 如果你有這些優勢: 2.口語表達清楚，能說服別人採納好點子。
      哪一個是你的優勢戰場？_options:
        1: 負責寫校刊排版
        2: 參加辯論隊
      哪一個是你的優勢戰場？_answer: 2
    - 如果你有這些優勢: 3.視覺敏銳，擅長圖像。
      哪一個是你的優勢戰場？_options:
        1: 記錄課堂筆記文字稿
        2: 設計美術視覺海報
      哪一個是你的優勢戰場？_answer: 2
    - 如果你有這些優勢: 4.喜歡統整資料，找出規律或關鍵數字。
      哪一個是你的優勢戰場？_options:
        1: 統計班級意見並做圖表
        2: 拍即興短影音
      哪一個是你的優勢戰場？_answer: 1
    - 如果你有這些優勢: 5.不怕陌生人，勇於跨出舒適圈交朋友。
      哪一個是你的優勢戰場？_options:
        1: 靜態觀察植物生長
        2: 行銷專案業務
      哪一個是你的優勢戰場？_answer: 2
    - 如果你有這些優勢: 6.實作能力強，熟悉家務、修繕等動手能力
      哪一個是你的優勢戰場？_options:
        1: 現場帶動跳
        2: 技藝競賽代表
      哪一個是你的優勢戰場？_answer: 2
    - 如果你有這些優勢: 7.體力很好，一整天運動都不會累
      哪一個是你的優勢戰場？_options:
        1: 從事體能相關活動
        2: 校園廣播站播音員
      哪一個是你的優勢戰場？_answer: 1
    - 如果你有這些優勢: 8.身體協調性佳，柔軟度很好
      哪一個是你的優勢戰場？_options:
        1: 擔任電玩選手
        2: 往舞蹈、 體操社發展
      哪一個是你的優勢戰場？_answer: 2
    - 如果你有這些優勢: 9.幽默感強，常逗得大家哈哈大笑
      哪一個是你的優勢戰場？_options:
        1: 圖書館分類志工
        2: 擔任校園活動主持人
      哪一個是你的優勢戰場？_answer: 2
    - 如果你有這些優勢: 10.換你試試看，你的優勢能力是什麼呢？
      哪一個是你的優勢戰場？: 你的優勢戰場是哪裡？
      no_correct_answer: true
      note: 兩格都是【　】留白，由學生自填
    answer_carrier: 紅色 ☑（圖形），文字流無此資訊
  - type: free_text
    prompt: ※請你和同學分享，並請同學給你回饋或建議：
    no_correct_answer: true
    note: 下方有「同學簽名：」欄位
  - type: guide
    text: 二、大衛不但善用自己的優勢（甩石），還把自己的劣勢也變成了優勢（矮小⭢靈活），上面的練習幫助我們覺察優勢能力，接下來，我們來練習怎麼樣換個角度看，把「劣勢」轉為「優勢」。
  - type: matching
    label: 二、劣勢→特質→優勢 三欄連連看
    left_header: 可能的劣勢
    right_header: 可能的優勢
    middle_header: 特質
    left:
      1: 1.午餐挑剔，讓營養師頭痛
      2: 2.在圖書館自習室討人厭
      3: 3.寫字不方便、不會用開罐器
      4: 4.上課常插嘴，被老師罵
      5: 5.做海報一直調整字距、顏色，導致進度落後
      6: 6.一粒灰都受不了，同學覺得難相處
    middle:
      A: A.左撇子
      B: B.對味道超挑剔
      C: C.音量超大
      D: D.超愛乾淨
      E: E.太龜毛
      F: F.愛講話
    right:
      ㄅ: ㄅ.科展最後成品的品管員
      ㄆ: ㄆ.棒球校隊選投手，教練想找稀有的「左投」
      ㄇ: ㄇ.家政課做蛋糕，他品嚐後可以精準調甜度
      ㄈ: ㄈ.防疫大隊的「教室清潔達人」
      ㄉ: ㄉ.校隊比賽加油王
      ㄊ: ㄊ.當節慶晚會的主持人
    answer:
      1: B
      2: C
      3: A
      4: F
      5: E
      6: D
    answer_middle_right:
      A: ㄆ
      B: ㄇ
      C: ㄉ
      D: ㄈ
      E: ㄅ
      F: ㄊ
    answers_printed: true
    answer_carrier: 手繪連線（圖形）共 12 條，紅黑混用：左半 5 條 srgbClr FF0000 ＋ 1 條 scheme tx1（黑）；右半 5 條 srgbClr FF0000 ＋ 1 條 sysClr 000000（黑）。文字流無此資訊
    answer_note: "\U0001F534 PDF 只畫得出 12 條裡的 6 條：左半 5 條紅線 ＋ 右半那條黑線。\n右半 5 條紅線一條都沒畫（p18 右通道 x950~1140 完全沒有紅色像素），\n只讀 PDF 會判成「特質→優勢 只連了 A→ㄆ 一條」。\n另有一個座標陷阱：左半 5 條裡有 3 條裝在巢狀 grpSp 內（群組自帶 +2055572 EMU\n位移），不遞迴進 grpSp 就會把它們算在錯的位置（差了 449.6px）。\n答案是解端點座標還原的，佐證：\n① 錨點定位不靠推算：左半 anchor 的原點直接量 PDF 上畫出來的紅線像素得\n   (562, 1528.4)（兩條單線 ＋ 一條 327px 長線的 dx／dy／長度與 XML 逐一吻合）。\n   四個 anchor 都錨在同一列的段落上，只差各自的 positionV posOffset；\n   用同一個段落基準推右半黑線應在 y=1533.8，PDF 實測 1536（差 2px），互為印證。\n② 落點：12 條線的 24 個端點，每一個都落在它該落的那一列的儲存格區間內\n   （離列界最近的一個還有 38px），與該列 ● 的殘差 ≤22px；\n   兩段各自都是 6→6 一對一，沒有任何一項被連兩次或漏掉。\n   ⚠️ 這張表在 PDF 上被分頁切成 p18（列 1~4）＋ p19（列 5~6），線全畫在 p18、\n   有 3 條懸在表格下方。那是分頁造成的，**不是紙外殘留**：四個 anchor 都是\n   positionV relativeFrom=\"paragraph\" 的小正位移（0.07~0.16in），\n   不是 L0152 那種 relativeFrom=\"page\" 的負位移。比對時要把 p19 的列\n   接回 p18 座標（+1857px）才對得起來。\n③ 語意：六條鏈全部通順 —— 1 午餐挑剔→B 對味道超挑剔→ㄇ 做蛋糕精準調甜度；\n   2 圖書館討人厭→C 音量超大→ㄉ 比賽加油王；\n   3 寫字不方便、不會用開罐器→A 左撇子→ㄆ 棒球「左投」；\n   4 上課常插嘴→F 愛講話→ㄊ 晚會主持人；\n   5 做海報一直調整→E 太龜毛→ㄅ 科展品管員；\n   6 一粒灰都受不了→D 超愛乾淨→ㄈ 教室清潔達人。"
  - type: guide
    text: 三、換你試試看：請你想一想自己的特質，原本可能會有的劣勢，但換個角度看後，他或許可能變成你的優勢呢！
