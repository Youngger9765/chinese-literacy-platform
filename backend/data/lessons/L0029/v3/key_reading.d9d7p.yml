  passage: 大衛奔赴戰場，因為沒有笨重的盔甲，他行動迅捷自如。不顧歌利亞的怒吼挑釁，始終保持距離，讓對方的武器神力毫無用武之地。他把石子放入投石器裡，在頭上旋轉六、七圈，石子在空中呼呼作響，速度愈來愈快。他瞄準歌利亞的前額——重甲保護下唯一的破綻，果斷出手。石子像子彈一樣疾射而出，以時速130公里的速度擊中歌利亞的額頭，那顆堅硬冰冷的鵝卵石，將巨人當場擊倒。這場戰鬥告訴我們，戰爭的勝負從來不是決定於誰更大、更強，而是決定於誰更有創意，誰能善用優勢，誰更懂得用智慧破解困局。雖然大衛各樣條件遠遠不及歌利亞，但他用投石器遠距攻擊的策略，讓巨人的優勢毫無用武之地，讓自己最熟悉的工具，成為勝負的關鍵。回到文章開頭的問題，什麼是少年牧羊人致勝的關鍵？結論是，大衛獨排眾議，決定了自己的戰場。
