    title: 牧羊少年致勝的關鍵
    numbered_paragraphs: 10
    seq_range:
    - 10
    - 19
  paragraphs:
  - seq: 1
    idx: 1
    part: 1
    text: 基督教的《聖經》裡記載著一個以小勝大的故事。故事讀來令人血脈賁張，時隔三千多年，仍然讓今天的讀者備受激勵。
  - seq: 2
    idx: 2
    part: 1
    text: 西元前1100年，非利士人和以色列人正在打仗，兩軍隔著一個山谷對峙，兩軍都不敢輕舉妄動，戰況已經僵持了好幾個月。
  - seq: 3
    idx: 3
    part: 1
    text: 古代的戰爭，兩軍常常派出最厲害的戰士單挑，贏的一方就算獲勝。這天，非利士人有位叫歌利亞的巨人出來叫陣單挑了。他對以色列人喊叫：「派一個人來和我單挑！如果他打敗我，我們就做你們的僕人；但如果我贏了，你們要做我們的僕人！」歌利亞身材魁梧，身高超過200公分，穿著厚重的盔甲，拿著大矛和大刀，站在一般士兵面前就如一座小山，令人望而生畏。因此，歌利亞喊了好幾天，以色列的軍隊都沒有人敢出來應戰，全軍士氣低落。
  - seq: 4
    idx: 4
    part: 1
    text: 這時，故事的男主角出場了。15歲的大衛是一名牧羊人，他為了送飯給軍隊裡的哥哥們，來到了戰場。當他聽說以色列軍隊沒有人敢出面迎戰歌利亞時，他不知哪裡來的膽氣，說道：「我去！」
  - seq: 5
    idx: 5
    part: 1
    text: 以色列的國王掃羅一開始不答應：「你年紀太輕了，對方可是從小就打仗的戰士。」但大衛很堅持，他說：「我在放羊時，遇過獅子和熊，牠們搶走小羊，我都追上去把羊救回來，還打死過牠們。我相信，我也能打敗這個巨人！」掃羅終於被少年說服，就幫大衛穿上自己的沉重盔甲，但少年太瘦小，穿上後根本走不動，只好脫下來，拿了牧羊的杖，又在溪邊挑選了五塊光滑的石子，放在袋裡，帶著甩石的機弦，走下山谷，迎向巨人。
  - seq: 6
    idx: 6
    part: 1
    text: 歌利亞看到瘦小的大衛，哈哈大笑，喊道：「你拿根木棍就來打我？把我當狗嗎？」又恐嚇他：「來吧！我將你的肉給空中的飛鳥、田野的走獸吃。」大衛不甘示弱，也大喊：「我必殺你，斬你的頭。」一陣喊話之後，戰鬥開始了。巨人迎著大衛大步走來，大衛也向著巨人跑過去。
  - seq: 7
    idx: 7
    part: 1
    text: 接下來發生的事，就是千古流傳的傳奇了。
    note: 篇1 念順順的 ☞ 錨點印在本段；本段只有 19 字，正好等於字數欄第一個累計數 19
  - seq: 8
    idx: 8
    part: 1
    text: 大衛從袋中掏出一塊石子，把它裝入投石器的皮囊裡，石子甩射出去，準確擊中巨人銅盔未能防護到的額頭，歌利亞面朝下仆倒在地。大衛沒有帶刀，他跑過去，將巨人的刀拔出來，殺死他，並割下他的頭。預期中毫無勝算的少年，竟然只用一塊不值錢的小石子，就以迅雷不及掩耳的速度結束了這場戰鬥。看到自己的英雄倒下，非利士人大驚失色，四散逃跑。以色列軍隊大聲歡呼，追擊敵人，贏得了戰爭的勝利！
  - seq: 9
    idx: 9
    part: 1
    text: 在一對一的肉搏戰裡，少年絕對不可能擊敗巨人。但只要有勇氣，用了正確的方法，巨人並沒有想像中的那樣堅不可摧。我們的生活中，難免遇上像巨人般可怕的挑戰與困難，這時，不妨想起那個勇敢牧羊少年，勇敢面對，發揮自己的長處，就會有機會戰勝困難，把危機變成轉機！
  - seq: 10
    idx: 1
    part: 2
    text: 大衛和歌利亞的故事已經流傳了三千多年。很多人感到匪夷所思：「大衛只是個少年，怎麼可能打敗巨人呢？」讓大衛得到勝利的關鍵因素是什麼呢？
  - seq: 11
    idx: 2
    part: 2
    text: 這個故事裡有兩種不同的士兵：一種是步兵，他們穿著厚重盔甲，拿著長矛和砍刀近身搏鬥；另一種則是投擲兵，又分為弓箭手和投石手。他們用弓箭或投石器攻擊遠方的士兵。從故事中，我們知道歌利亞是一名步兵，大衛則是還沒有當兵的少年人，他會使用投石器，應該可以當一名投石手。
  - seq: 12
    idx: 3
    part: 2
    text: 步兵歌利亞身高超過兩公尺，手持近7公斤的長矛，穿著57公斤重的盔甲仍能行動自如，可見他力大無窮，在戰場上肯定是個殺人不眨眼的機器。
  - seq: 13
    idx: 4
    part: 2
    text: 反觀年僅15歲的大衛，穿上盔甲便舉步維艱，可見其尚未發育完全，體力有限。《聖經》兩次提到他「不靠刀槍」，實際情況可能是，連大約1公斤重的刀或3公斤重的矛，他都揮舞不動。試想，大衛孤立無援的面對高出自己兩個頭的巨人，沒有盔甲，沒有刀槍，力氣不足，豈不是羊入虎口、螳臂擋車？
  - seq: 14
    idx: 5
    part: 2
    text: 大衛手上只有一個投石器和幾顆石子，他平時都用投石器指揮羊群或驅趕野獸，所以這是他駕輕就熟的工具。投石器是用繩索和皮革製成的，使用者將石子在空中旋轉數次，再鬆手將石子甩出。石子時速可達130公里，猶如奔馳於高速公路上的汽車，其威力足以擊破敵人腦殼。
  - seq: 15
    idx: 6
    part: 2
    text: '步兵歌利亞身披重甲前來叫陣，眾人皆認為以色列必將派遣一名最強的步兵應戰。《聖經》記載著掃羅王試圖將大衛裝備成步兵，所以幫大衛穿上自己的盔甲，希望他以步兵的身分上戰場和歌利亞廝殺。但雙方千軍萬馬之中，唯獨大衛堅持己見，他拒絕了掃羅王，

      他不當步兵，要當投石手。'
    note: document.xml 拆成兩個 <w:p>，但段號欄只給一個「六」，此處併回一段
  - seq: 16
    idx: 7
    part: 2
    text: 大衛奔赴戰場，因為沒有笨重的盔甲，他行動迅捷自如。不顧歌利亞的怒吼挑釁，始終保持距離，讓對方的武器神力毫無用武之地。他把石子放入投石器裡，在頭上旋轉六、七圈，石子在空中呼呼作響，速度愈來愈快。他瞄準歌利亞的前額——重甲保護下唯一的破綻，果斷出手。石子像子彈一樣疾射而出，以時速130公里的速度擊中歌利亞的額頭，那顆堅硬冰冷的鵝卵石，將巨人當場擊倒。
    note: 篇2 念順順的 ☞ 錨點印在本段
  - seq: 17
    idx: 8
    part: 2
    text: 這場戰鬥告訴我們，戰爭的勝負從來不是決定於誰更大、更強，而是決定於誰更有創意，誰能善用優勢，誰更懂得用智慧破解困局。雖然大衛各樣條件遠遠不及歌利亞，但他用投石器遠距攻擊的策略，讓巨人的優勢毫無用武之地，讓自己最熟悉的工具，成為勝負的關鍵。
  - seq: 18
    idx: 9
    part: 2
    text: 回到文章開頭的問題，什麼是少年牧羊人致勝的關鍵？
  - seq: 19
    idx: 10
    part: 2
    text: 結論是，大衛獨排眾議，決定了自己的戰場。
  footnotes:
