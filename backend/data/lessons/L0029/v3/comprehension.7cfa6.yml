lesson_uid: L0029
version_id: v3
section_no: 六
comprehension:
  instruction: 請根據兩篇課文的內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - part: 3
    group: 九*綜合閱讀理解
    index: 1
    answer: C
    stem: 下列語詞，何者使用錯誤？
    options:
      A: 古人沒有現代機器，卻能搬動巨石，實在令人「匪夷所思」
      B: 彈鋼琴對他來說已是「駕輕就熟」，就像喝水一樣簡單
      C: 看著百貨公司琳瑯滿目的商品，我真是「舉步維艱」
      D: 小偉說的話「破綻百出」，立刻被老師抓包
    teacher_note: (「舉步維艱」通常用在身體虛弱、地形困難、情況艱困時，形容連走一步都很困難。)
  - part: 3
    index: 2
    answer: A
    stem: 根據兩篇文章，歌利亞連日叫陣，以色列卻無人應戰，推論當時以色列軍隊的狀態最不可能是什麼？
    options:
      A: 漠不關心
      B: 擔憂氣餒
      C: 士氣低落
      D: 畏縮不前
    teacher_note: (文本描述「無人敢出來應戰，全軍士氣低落」，顯示以色列士兵深感恐懼與挫敗，符合 B、C、D的「擔憂氣餒／士氣低落／畏縮不前」。)
  - part: 3
    index: 3
    answer: B
    stem: 如果大衛改用歌利亞那把又長又重的長矛，並採取近身肉搏，最可能發生的情況是什麼？
    options:
      A: 長矛夠長，他仍能維持安全距離，刺中歌利亞更容易
      B: 他拿不動沉重武器，揮舞遲緩，讓歌利亞勝算大增
      C: 兩人力量瞬間拉平，戰鬥拖成持久戰，最後平手收場
      D: 近身長矛配上他的靈活步伐，攻擊速度比投石器更快
    teacher_note: (兩篇文章都強調大衛致勝關鍵在「輕裝速度＋遠距攻擊」。改拿沉重長矛等於放棄機動與熟練度，最可能被對手抓到破綻。)
  - part: 3
    index: 4
    answer: D
    stem: 兩篇文章都想要表達什麼訊息？
    options:
      A: 物質資源愈多愈容易取勝
      B: 面臨強敵，先求同伴協助
      C: 懷有內心信仰便能戰勝一切
      D: 善用自身優勢即可扭轉劣勢
    teacher_note: 敘事篇以故事示範，說理篇以分析論證，皆落在「優勢＋策略→逆轉」的主旨。
  - part: 3
    index: 5
    answer: C
    stem: 假設某位同學同時具備「統整大量數據」與「版面視覺設計」兩項長處。根據「選對戰場、發揮長處」的原則，下列哪一項任務最能同時發揮這兩項長處？
    options:
      A: 為校刊撰寫 3000 字的人物專訪，專注採訪內容與文字表達
      B: 在校慶園遊會擔任攤位主持人，隨機即席推銷商品
      C: 統計並製作全校「課後社團意向」問卷的結果海報看板
      D: 負責紀錄每次田徑隊練習的秒數並口頭提醒隊友衝刺
    teacher_note: (C需要先統計、大量歸納數據（對應統整能力），再視覺化排版問卷結果（發揮版面設計長處），可同時放大雙優勢，最符合「選對戰場」精神。)
  notes:
    instruction: 這是大題九（綜合閱讀理解）印的指示語；篇1、篇2 各自的題組另有自己的引導句
