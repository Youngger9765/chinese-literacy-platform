lesson_uid: L0029
version_id: v3
section_no: 六
comprehension:
  instruction: 請根據兩篇課文的內容，選出最適合的答案，要讀完每一個選項再作答。
  instruction_note: 這是大題九（綜合閱讀理解）印的指示語；篇1、篇2 各自的題組另有自己的引導句
  questions:
  - part: 1
    group: 2.請依據第一篇文章的內容，選出正確答案
    index: 1
    answer: A
    stem: 請從下列語詞中，選出用字正確的語詞。
    options:
      A: 血脈賁張
      B: 望而身畏
      C: 豪無勝算
      D: 身材魁悟
    teacher_note: B.望而「生」畏 C.「毫」無勝算 D.身材魁「梧」
  - part: 1
    index: 2
    answer: B
    stem: 根據文章，大衛選擇不穿國王的盔甲，而改用投石器的主要原因是什麼？
    options:
      A: 國王的盔甲太舊，他擔心不安全
      B: 國王的盔甲太重，會限制他的行動
      C: 他想證明自己比戰士厲害，不須靠裝備就能贏
      D: 他沒接受過正統的軍隊訓練，只好放棄盔甲
    teacher_note: 在第五段提到，大衛太瘦小，穿上後根本走不動，所以只好脫下來。
  - part: 1
    index: 3
    answer: D
    stem: 文中寫歌利亞「面朝下仆倒在地」後，非利士人「四散逃跑」，可推知此時非利士人最可能有什麼心理反應？
    options:
      A: 嫉妒
      B: 輕蔑
      C: 恥辱
      D: 驚恐
    teacher_note: （英雄瞬間倒下，戰局翻盤，合理推斷是恐懼驚慌。）
  - part: 1
    index: 4
    answer: B
    stem: 文中多次穿插直接對話（例：「你拿根木棍就來打我？」），其主要作用是什麼？
    options:
      A: 讓大家知道歷史上真實事件的對話
      B: 呈現雙方互相挑戰，使衝突更鮮明
      C: 增加作者敘述的篇幅
      D: 從對話中更能突顯作者觀點
    teacher_note: （人物對罵讓氣氛緊張，凸顯故事衝突。）
  - part: 1
    index: 5
    answer: C
    stem: 這篇故事最後提到大衛的勝利，給讀者的啟示是什麼？
    options:
      A: 巨人其實並不可怕，最可怕的是自己沒有勇氣面對困難
      B: 團結力量大，小兵相互合作也能立下大功勞
      C: 面對巨大挑戰，善用策略就可能扭轉劣勢
      D: 年紀小不代表能力弱，小孩也能隨時上戰場
    teacher_note: （整篇故事透過大衛拒穿盔甲、採用投石器擊敗巨人，傳達「以小勝大」的核心並非僅靠膽量或年紀，而是清楚認識自己的優勢、選擇對的策略。）
  - part: 2
    group: ◎請依據第二篇文章的內容，選出正確答案
    index: 1
    answer: D
    stem: 請從下列語詞中，選出用字正確的語詞。
    options:
      A: 堅持已見
      B: 舉步危艱
      C: 匪疑所思
      D: 孤立無援
    teacher_note: (A)堅持「己」見 (B)舉步「維」艱 (C)匪「疑」所思
  - part: 2
    index: 2
    answer: C
    stem: 根據課文，何者不是 大衛擊敗歌利亞的原因？
    options:
      A: 他年紀雖小，但沉著冷靜，不易被挑釁
      B: 他懂得善用策略，運用自身優勢將危機化為轉機
      C: 他接受眾人的幫助，展現不服輸的勇氣與智慧
      D: 他善用熟悉的武器，避免近戰劣勢
    teacher_note: (C)大衛是單挑巨人，並未接受眾人的幫助文中未提到。
  - part: 3
    group: 九*綜合閱讀理解
    index: 1
    answer: C
    stem: 下列語詞，何者使用錯誤？
    options:
      A: 古人沒有現代機器，卻能搬動巨石，實在令人「匪夷所思」
      B: 彈鋼琴對他來說已是「駕輕就熟」，就像喝水一樣簡單
      C: 看著百貨公司琳瑯滿目的商品，我真是「舉步維艱」
      D: 小偉說的話「破綻百出」，立刻被老師抓包
    teacher_note: (「舉步維艱」通常用在身體虛弱、地形困難、情況艱困時，形容連走一步都很困難。)
  - part: 3
    index: 2
    answer: A
    stem: 根據兩篇文章，歌利亞連日叫陣，以色列卻無人應戰，推論當時以色列軍隊的狀態最不可能是什麼？
    options:
      A: 漠不關心
      B: 擔憂氣餒
      C: 士氣低落
      D: 畏縮不前
    teacher_note: (文本描述「無人敢出來應戰，全軍士氣低落」，顯示以色列士兵深感恐懼與挫敗，符合 B、C、D的「擔憂氣餒／士氣低落／畏縮不前」。)
  - part: 3
    index: 3
    answer: B
    stem: 如果大衛改用歌利亞那把又長又重的長矛，並採取近身肉搏，最可能發生的情況是什麼？
    options:
      A: 長矛夠長，他仍能維持安全距離，刺中歌利亞更容易
      B: 他拿不動沉重武器，揮舞遲緩，讓歌利亞勝算大增
      C: 兩人力量瞬間拉平，戰鬥拖成持久戰，最後平手收場
      D: 近身長矛配上他的靈活步伐，攻擊速度比投石器更快
    teacher_note: (兩篇文章都強調大衛致勝關鍵在「輕裝速度＋遠距攻擊」。改拿沉重長矛等於放棄機動與熟練度，最可能被對手抓到破綻。)
  - part: 3
    index: 4
    answer: D
    stem: 兩篇文章都想要表達什麼訊息？
    options:
      A: 物質資源愈多愈容易取勝
      B: 面臨強敵，先求同伴協助
      C: 懷有內心信仰便能戰勝一切
      D: 善用自身優勢即可扭轉劣勢
    teacher_note: 敘事篇以故事示範，說理篇以分析論證，皆落在「優勢＋策略→逆轉」的主旨。
  - part: 3
    index: 5
    answer: C
    stem: 假設某位同學同時具備「統整大量數據」與「版面視覺設計」兩項長處。根據「選對戰場、發揮長處」的原則，下列哪一項任務最能同時發揮這兩項長處？
    options:
      A: 為校刊撰寫 3000 字的人物專訪，專注採訪內容與文字表達
      B: 在校慶園遊會擔任攤位主持人，隨機即席推銷商品
      C: 統計並製作全校「課後社團意向」問卷的結果海報看板
      D: 負責紀錄每次田徑隊練習的秒數並口頭提醒隊友衝刺
    teacher_note: (C需要先統計、大量歸納數據（對應統整能力），再視覺化排版問卷結果（發揮版面設計長處），可同時放大雙優勢，最符合「選對戰場」精神。)
