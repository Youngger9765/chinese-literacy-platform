    title: 牧羊少年致勝的關鍵
    numbered_paragraphs: 10
    seq_range:
    - 10
    - 19
  paragraphs:
  - seq: 10
    idx: 1
    part: 2
    text: 大衛和歌利亞的故事已經流傳了三千多年。很多人感到匪夷所思：「大衛只是個少年，怎麼可能打敗巨人呢？」讓大衛得到勝利的關鍵因素是什麼呢？
  - seq: 11
    idx: 2
    part: 2
    text: 這個故事裡有兩種不同的士兵：一種是步兵，他們穿著厚重盔甲，拿著長矛和砍刀近身搏鬥；另一種則是投擲兵，又分為弓箭手和投石手。他們用弓箭或投石器攻擊遠方的士兵。從故事中，我們知道歌利亞是一名步兵，大衛則是還沒有當兵的少年人，他會使用投石器，應該可以當一名投石手。
  - seq: 12
    idx: 3
    part: 2
    text: 步兵歌利亞身高超過兩公尺，手持近7公斤的長矛，穿著57公斤重的盔甲仍能行動自如，可見他力大無窮，在戰場上肯定是個殺人不眨眼的機器。
  - seq: 13
    idx: 4
    part: 2
    text: 反觀年僅15歲的大衛，穿上盔甲便舉步維艱，可見其尚未發育完全，體力有限。《聖經》兩次提到他「不靠刀槍」，實際情況可能是，連大約1公斤重的刀或3公斤重的矛，他都揮舞不動。試想，大衛孤立無援的面對高出自己兩個頭的巨人，沒有盔甲，沒有刀槍，力氣不足，豈不是羊入虎口、螳臂擋車？
  - seq: 14
    idx: 5
    part: 2
    text: 大衛手上只有一個投石器和幾顆石子，他平時都用投石器指揮羊群或驅趕野獸，所以這是他駕輕就熟的工具。投石器是用繩索和皮革製成的，使用者將石子在空中旋轉數次，再鬆手將石子甩出。石子時速可達130公里，猶如奔馳於高速公路上的汽車，其威力足以擊破敵人腦殼。
  - seq: 15
    idx: 6
    part: 2
    text: '步兵歌利亞身披重甲前來叫陣，眾人皆認為以色列必將派遣一名最強的步兵應戰。《聖經》記載著掃羅王試圖將大衛裝備成步兵，所以幫大衛穿上自己的盔甲，希望他以步兵的身分上戰場和歌利亞廝殺。但雙方千軍萬馬之中，唯獨大衛堅持己見，他拒絕了掃羅王，

      他不當步兵，要當投石手。'
    note: document.xml 拆成兩個 <w:p>，但段號欄只給一個「六」，此處併回一段
  - seq: 16
    idx: 7
    part: 2
    text: 大衛奔赴戰場，因為沒有笨重的盔甲，他行動迅捷自如。不顧歌利亞的怒吼挑釁，始終保持距離，讓對方的武器神力毫無用武之地。他把石子放入投石器裡，在頭上旋轉六、七圈，石子在空中呼呼作響，速度愈來愈快。他瞄準歌利亞的前額——重甲保護下唯一的破綻，果斷出手。石子像子彈一樣疾射而出，以時速130公里的速度擊中歌利亞的額頭，那顆堅硬冰冷的鵝卵石，將巨人當場擊倒。
    note: 篇2 念順順的 ☞ 錨點印在本段
  - seq: 17
    idx: 8
    part: 2
    text: 這場戰鬥告訴我們，戰爭的勝負從來不是決定於誰更大、更強，而是決定於誰更有創意，誰能善用優勢，誰更懂得用智慧破解困局。雖然大衛各樣條件遠遠不及歌利亞，但他用投石器遠距攻擊的策略，讓巨人的優勢毫無用武之地，讓自己最熟悉的工具，成為勝負的關鍵。
  - seq: 18
    idx: 9
    part: 2
    text: 回到文章開頭的問題，什麼是少年牧羊人致勝的關鍵？
  - seq: 19
    idx: 10
    part: 2
    text: 結論是，大衛獨排眾議，決定了自己的戰場。
  footnotes:
