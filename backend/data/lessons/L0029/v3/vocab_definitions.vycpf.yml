section_no: 三
vocab_definitions:
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
    A: 從本課語詞框框，找語詞。
    B: 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
    C: 問同學。
  vocabulary_bank:
  - 盔甲
  - 廝殺
  - 破綻
  - 無用武之地
  - 力大無窮
  - 羊入虎口
  - 堅持己見
