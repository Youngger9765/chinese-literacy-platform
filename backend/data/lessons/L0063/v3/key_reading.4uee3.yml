  passage: 「這不是趁火打劫嗎？受災戶已經很可憐了，政府應該要出面，制定公道的價錢，制止這種災後漲價的現象。」一定會有人義憤填膺的說。假定政府料事如神，為了預防趁火打劫，早就立法規定災區工資、材料不得漲價，只要漲價就違法，就罰錢，就關人。但這樣做，反而可能壞事。災後，修繕人力和材料成為稀缺資源，價格自然上漲。漲價後有了誘因，全國各地的鐵工、鋁門窗師傅和水電工等修繕人員才可能願意離鄉背井，放下原本的工作，趕到臺東支援，災區復原工作才能加速完成。如果不准漲價，到臺東路程又遠、又辛苦、還沒地方住，賺的錢又沒有比較多，到底會有幾個人願意只憑著愛心來臺東呢？結果一定是臺東人望穿秋水，卻怎麼等也等不到人來修他們的房子。因此，這時政府該做的是發放賑災補助，受災戶每戶發給多少錢，而不是直接限制價格。
