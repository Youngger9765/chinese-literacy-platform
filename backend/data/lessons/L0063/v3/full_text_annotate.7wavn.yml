  paragraphs:
  - idx: 1
    text: 不只是「商品市場」受到供需法則的影響，「人力市場」也會！一份人人都能做的工作，薪水通常不高；一項很少人會、又是市場需要的技能，薪水往往很高。
  - idx: 2
    text: 你若會開飛機，被航空公司聘為機師，你的月薪會從新臺幣20萬起跳。也許你會眼睛睜大：「20萬？這麼多錢！」這還不算什麼，你知道有人一個月可以領80萬元嗎？
  - idx: 3
    text: 高雄港每天都有巨大的貨輪進進出出，有一群「引水人」不論天候，一天24小時待命。大船進港時，他們要先搭乘接駁小船靠近大船，再沿著繩梯登船，為大船指引航向，確保每一艘龐然大物都能安全進入港口。他們的月薪至少60萬元起跳，領到80萬元的比比皆是。
  - idx: 4
    text: '好吸引人的薪水！如果你年齡未滿50歲，具備底下四項的條件，你也可以來考引水人的執照哦。

      持有一等船長或二等船長證書。

      曾擔任一萬噸以上大船的船長，至少三年。

      具有進出高雄港100次以上的經驗。

      通過體能測驗：60秒內，徒手攀登9公尺高的繩梯，上、下各一次。'
    text_note: 後四行是帶 ● 項目符號的條件清單，● 由 numbering.xml 產生、不在文字流。
  - idx: 5
    text: 第一項就夠難了。你必須畢業於航海相關學校，再從船上實習生做起，多年媳婦熬成婆，過了15年，你終於成為船長；第20年，才有公司願意聘你當一萬噸巨輪的船長，再過3年，你終於符合了第一、二項的條件，但這還不夠，你還要有進出高雄港100次的經驗。最後還要通過體能測驗，因為大船進港時，你可能要在可怕的風浪中，從小船爬上東晃西搖的繩梯，登上大船。
  - idx: 6
    text: 為什麼引水人一個月薪資可以高達80萬？從以上說明可知，引水人的供給量非常非常少，物以稀為貴，他們的薪資比機師還高個三、四倍，也就可以理解了。
  - idx: 7
    text: 相反地，有些工作的技術門檻較低，例如商店店員、飯店房務人員、建築工地助手、送餐人員等。能投入這類工作的人較多，人力的供給遠大於市場需求，工資自然就高不起來。
  - idx: 8
    text: 同樣的道理，如果一個人能在崗位上兢兢業業、精益求精，把專業技能磨鍊到同業中無人能及的高度，這樣就能為自己爭取到更高的收入。例如，吳寶春17歲就去麵包店當學徒，每天從凌晨三點半開始工作，一直做到晚上七、八點才能休息，每個月只休兩天假，一個月薪水只有6000元。但他和別的麵包師傅不同，他不斷的努力學習新的技能，到處參加比賽。23年後，他40歲時，在法國拿下世界麵包大師賽冠軍。全臺灣麵包師傅有幾千個人，但這樣厲害的，只有吳寶春一個，他的薪水自然水漲船高了。
    marker: ☞ 印在本段句首（念順順起點）
    pdf_note: 🔴 PDF p13 **沒有印出這一段**（表格被 LibreOffice 截斷，只留下一個孤零零的 ☞）。文字層完整。
  - idx: 9
    text: 想要在職場上拿高薪嗎？記得物以稀為貴的道理，下定決心終身學習，做一個人力市場上人人想要的稀缺人才吧！
    pdf_note: 🔴 PDF p13 同樣沒有印出這一段。文字層完整。
