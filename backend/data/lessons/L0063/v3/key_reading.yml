  passage: 是這樣的，颱風前，新聞一直預報會有強風豪雨，消費者預期颱風後菜價會漲，大家都想：「先下手為強，後下手遭殃，趁現在還買得到青菜……」，於是颱風來襲前兩天，菜市場人滿為患，大家搶買青菜。這時，「供給」雖然沒有改變，但市場「需求」大幅增加，青菜根本不夠賣。有人甚至認為青菜奇貨可居，想等價格更高時再賣，價格也就開始上漲了。一把小白菜賣到80塊也不稀奇。同樣的供需因素，也可以解釋商品價格為什麼下滑。2016年11月，秋風吹起，天氣轉涼，薑母鴨、火鍋店高朋滿座，高麗菜的需求大增，批發價漲到每公斤45元。一公頃的高麗菜就可以讓農民賺270萬元。其他的農民眼紅了：「我也要種高麗菜！」大批的農民於是放棄了自己的農作物，搶種高麗菜。80天後，搶種的高麗菜收成了，市場一下子湧入大量的高麗菜，價格開始崩跌，到後來每公斤5元都賣不出去，高麗菜只好一車一車被倒在野地。
