  passage: 是這樣的，颱風前，新聞一直預報會有強風豪雨，消費者預期颱風後菜價會漲，大家都想：「先下手為強，後下手遭殃，趁現在還買得到青菜……」，於是颱風來襲前兩天，菜市場人滿為患，大家搶買青菜。這時，「供給」雖然沒有改變，但市場「需求」大幅增加，青菜根本不夠賣。有人甚至認為青菜奇貨可居，想等價格更高時再賣，價格也就開始上漲了。一把小白菜賣到80塊也不稀奇。
