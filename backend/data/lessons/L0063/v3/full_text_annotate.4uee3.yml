  paragraphs:
  - idx: 1
    text: 如果市場上某些民生必需品價格高漲，造成人民很大的負擔。這時，政府為了老百姓的生活，是不是可以立個「不准漲價」的規定呢？
  - idx: 2
    text: 2016年7月8日，尼伯特颱風來襲，給臺東帶來17級的強陣風。它掀開屋頂、吹破廣告看板、扯壞電線、把遮陽棚打爛、巨樹連根拔起。災後，臺東市大量房屋受損，市街像是被轟炸過一般殘破凌亂。你猜，這時什麼東西會漲價？你猜對了！因為需要修理房子的人太多了，修繕工作多得讓鐵工、鋁門窗師傅和水電師傅應接不暇。大家都要修房子，而修繕師傅的人數有限、材料有限，此時「需求」增加、「供給」相對不足，物以稀為貴，修房子的費用便飆漲。修一片屋頂原本要5000元，現在居然漲到8000元。
  - idx: 3
    text: 「這不是趁火打劫嗎？受災戶已經很可憐了，政府應該要出面，制定公道的價錢，制止這種災後漲價的現象。」一定會有人義憤填膺的說。
    marker: ☞ 印在本段句首（念順順起點）
  - idx: 4
    text: 假定政府料事如神，為了預防趁火打劫，早就立法規定災區工資、材料不得漲價，只要漲價就違法，就罰錢，就關人。但這樣做，反而可能壞事。
  - idx: 5
    text: 災後，修繕人力和材料成為稀缺資源，價格自然上漲。漲價後有了誘因，全國各地的鐵工、鋁門窗師傅和水電工等修繕人員才可能願意離鄉背井，放下原本的工作，趕到臺東支援，災區復原工作才能加速完成。
  - idx: 6
    text: 如果不准漲價，到臺東路程又遠、又辛苦、還沒地方住，賺的錢又沒有比較多，到底會有幾個人願意只憑著愛心來臺東呢？結果一定是臺東人望穿秋水，卻怎麼等也等不到人來修他們的房子。因此，這時政府該做的是發放賑災補助，受災戶每戶發給多少錢，而不是直接限制價格。
  - idx: 7
    text: 近年來，民眾總是希望政府管制價格，從汽柴油到雞蛋，從火車票到水電，都希望政府壓低價格。但諾貝爾經濟學獎得主傅利曼曾說：「如果你要市場上蕃茄短缺，就請政府頒布法令，禁止每斤蕃茄價格超過兩塊錢。你立刻能使蕃茄斷貨。」因為一斤兩塊錢太便宜了，連成本都不夠，農民根本不想種，即使收成了，也不想送到市場，因為愈賣愈虧啊。結論是，商品的價格主要是市場的供需法則決定的，政府最好不要干預市場的價格。看似「公平」的管制價格，最終反而會使民眾受害。
