  answer_paths_note: '15 個目標語詞全部圈到（15/15），逐格取字都能拼回目標語詞，格子沒有錯字。


    幾何交叉驗證（單向警報）——**這一課要先把範圍縮到找字那一塊，不能數全檔**：

    全檔 29 個 roundRect，但依文件順序分佈是

    ・block 76：8 個＝第一篇第五大題流程圖的圓角方塊

    ・block 184：1 個＝第二篇第四大題克漏字短文的外框

    ・block 198：5 個＝第二篇第五大題流程圖

    ・**block 397：15 個＝找字格子本身**

    找字那一塊 15 個，與 answer_paths 15 條相同 → 15 ＞ 15 不成立，**不觸發**警報。

    ⛔ 若直接用全檔 29 去比 15，會得到「29 ＞ 15 ⇒ 少抓 14 條」的假警報。


    另外做了一次**像素級獨立驗證**（不靠 EMU 幾何）：把 p22 以 200dpi 重繪，

    用暗像素投影抓出 10×10 字元格中心，再檢查每格附近有無 E97132 橘色。

    結果：本清單 15 條路徑覆蓋的 55 格**全部**有橘框（0 格落空）；

    有橘色但不在任何路徑上的格全是斜向膠囊經過相鄰格的溢出（像素數多在 200~600，

    遠低於被圈中格的 800~1600），沒有第 16 條路徑。


    另記：格子右上角埋了一組「比比皆是」（(1,10)→(4,10) 直向），

    但它**不在灰框的 15 個語詞裡，像素檢查也確認該四格無橘色** —— 是干擾詞，不是漏抽的答案。'
