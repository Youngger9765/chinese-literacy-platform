lesson_uid: L0063
version_id: v3
section_no: 三
vocab_definitions:
  part_no: 1
  instruction: 請在空格內填入本課語詞，遇到困難時，你可以試試以下方法：
  methods:
  - 從本課語詞框框，找語詞。
  - 再回到課文讀讀看，這個解釋可能是哪個語詞的意思。
  - 問同學。
  vocabulary_bank:
  - 稀奇
  - 物以稀為貴
  - 供給
  - 飆漲
  - 遭殃
  - 來襲
  - 人滿為患
  - 奇貨可居
  - 波動
  - 高朋滿座
  - 崩跌
  items:
  - index: 1
    word: 飆漲
    definition: 快速且大幅度的上漲。
  - index: 2
    word: 人滿為患
    definition: 形容人多到造成困擾或不便。
  - index: 3
    word: 崩跌
    definition: 價格、數值等迅速大幅下降。
  - index: 4
    word: 稀奇
    definition: 少見或不尋常。
  - index: 5
    word: 波動
    definition: 上下起伏的變化；本文指價格有時上漲、有時下跌。
  - index: 6
    word: 遭殃
    definition: 遇到災禍或麻煩。
  - index: 7
    word: 物以稀為貴
    definition: 東西數量少、想要的人多時，價格往往會提高。
  - index: 8
    word: 奇貨可居
    definition: 認為少見的貨品可能會漲價，就先買下或留著，等價格更高時再賣。
  - index: 9
    word: 高朋滿座
    definition: 形容賓客很多。
  - index: 10
    word: 供給
    definition: 市場上提供的商品或服務。
  - index: 11
    word: 來襲
    definition: 指災害、敵人等突然到來或侵襲。
  notes:
    vocabulary_bank: 語詞框原文為「本課語詞：稀奇、物以稀為貴、供給、飆漲、遭殃、來襲、人滿為患、奇貨可居、波動、高朋滿座、崩跌。」（11 個，比一般課多
      1 個）
    answer_carrier: 橘色手寫字（PDF p3~p4）；文字層的空格內已填有同樣的答案
