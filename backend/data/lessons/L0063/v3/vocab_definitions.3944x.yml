  answer_carrier: 橘色手寫字（PDF p9）；文字層的空格內已填有同樣的答案
  items:
  - index: 1
    word: 義憤填膺
    definition: 對不公平或不正當的事情，感到非常憤怒。
  - index: 2
    word: 賑災
    definition: 災害發生後，政府或民間提供金錢、物資或救援，幫助災民。
  - index: 3
    word: 料事如神
    definition: 形容預測事情的發展非常準確，好像神一樣。
  - index: 4
    word: 應接不暇
    definition: 形容來的人或事情太多，忙不過來。
  - index: 5
    word: 誘因
    definition: 吸引人去做某件事的原因或好處。例如洗完碗就能打電動，打電動就是誘因。
  - index: 6
    word: 頒布
    definition: 正式公布法令、規章或命令。
  - index: 7
    word: 趁火打劫
    definition: 比喻趁別人遭遇危難時占便宜，從中取得利益。
  - index: 8
    word: 離鄉背井
    definition: 指離開家鄉，在外地生活或工作。
  - index: 9
    word: 望穿秋水
    definition: 形容盼望得非常急切，等了很久還是沒有等到。
  - index: 10
    word: 干預
    definition: 介入並影響事情的發展；本文指政府用規定影響市場價格。
