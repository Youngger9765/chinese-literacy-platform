intro: 這篇文章要帶我們一起認識影響商品價格的經濟學原理。為什麼有些東西很貴，有些卻很便宜？為什麼即使是同一個東西，在不同時間價格也會差很多呢？文章會從「供給」和「需求」這兩個關鍵概念出發，透過生活中的例子，像是颱風天的菜價，或是大家搶種高麗菜後價格的變化，來解釋這些價格波動的原因。讓我們一起來了解，為什麼「物以稀為貴」會是影響商品價格的重要因素吧！
