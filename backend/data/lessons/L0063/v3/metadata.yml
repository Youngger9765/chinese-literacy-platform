strategy_explained: '這一課要練習的是，學習怎麼從不同生活例子裡面，發現作者怎麼解釋同一個概念

  這篇文章用颱風天的菜價和搶種高麗菜的故事，就是很好的例子，讓你看看「供給」和「需求」怎麼影響物價

  讀的時候，你可以想一想，作者除了這些例子，還能不能舉出別的例子來解釋「物以稀為貴」的道理'
