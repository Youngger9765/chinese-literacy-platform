  passage: 同樣的道理，如果一個人能在崗位上兢兢業業、精益求精，把專業技能磨鍊到同業中無人能及的高度，這樣就能為自己爭取到更高的收入。例如，吳寶春17歲就去麵包店當學徒，每天從凌晨三點半開始工作，一直做到晚上七、八點才能休息，每個月只休兩天假，一個月薪水只有6000元。但他和別的麵包師傅不同，他不斷的努力學習新的技能，到處參加比賽。23年後，他40歲時，在法國拿下世界麵包大師賽冠軍。全臺灣麵包師傅有幾千個人，但這樣厲害的，只有吳寶春一個，他的薪水自然水漲船高了。想要在職場上拿高薪嗎？記得物以稀為貴的道理，下定決心終身學習，做一個人力市場上人人想要的稀缺人才吧！
