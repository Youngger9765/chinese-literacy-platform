vocab_definitions:
  items:
  - index: 1
    word: 飆漲
    definition: 快速且大幅度的上漲。
  - index: 2
    word: 人滿為患
    definition: 形容人多到造成困擾或不便。
  - index: 3
    word: 崩跌
    definition: 價格、數值等迅速大幅下降。
  - index: 4
    word: 稀奇
    definition: 少見或不尋常。
  - index: 5
    word: 波動
    definition: 上下起伏的變化；本文指價格有時上漲、有時下跌。
  - index: 6
    word: 遭殃
    definition: 遇到災禍或麻煩。
  - index: 7
    word: 物以稀為貴
    definition: 東西數量少、想要的人多時，價格往往會提高。
  - index: 8
    word: 奇貨可居
    definition: 認為少見的貨品可能會漲價，就先買下或留著，等價格更高時再賣。
  - index: 9
    word: 高朋滿座
    definition: 形容賓客很多。
  - index: 10
    word: 供給
    definition: 市場上提供的商品或服務。
  - index: 11
    word: 來襲
    definition: 指災害、敵人等突然到來或侵襲。
  - index: 1
    word: 義憤填膺
    definition: 對不公平或不正當的事情，感到非常憤怒。
  - index: 2
    word: 賑災
    definition: 災害發生後，政府或民間提供金錢、物資或救援，幫助災民。
  - index: 3
    word: 料事如神
    definition: 形容預測事情的發展非常準確，好像神一樣。
  - index: 4
    word: 應接不暇
    definition: 形容來的人或事情太多，忙不過來。
  - index: 5
    word: 誘因
    definition: 吸引人去做某件事的原因或好處。例如洗完碗就能打電動，打電動就是誘因。
  - index: 6
    word: 頒布
    definition: 正式公布法令、規章或命令。
  - index: 7
    word: 趁火打劫
    definition: 比喻趁別人遭遇危難時占便宜，從中取得利益。
  - index: 8
    word: 離鄉背井
    definition: 指離開家鄉，在外地生活或工作。
  - index: 9
    word: 望穿秋水
    definition: 形容盼望得非常急切，等了很久還是沒有等到。
  - index: 10
    word: 干預
    definition: 介入並影響事情的發展；本文指政府用規定影響市場價格。
  - index: 1
    word: 比比皆是
    definition: 到處都是，隨處可見。
  - index: 2
    word: 多年媳婦熬成婆
    definition: 比喻經過長時間努力和等待，終於取得資格或地位。
  - index: 3
    word: 精益求精
    definition: 好還要再更好。
  - index: 4
    word: 兢兢業業
    definition: 做事認真負責，又小心謹慎。
  - index: 5
    word: 指引
    definition: 指示、引導。
  - index: 6
    word: 水漲船高
    definition: 比喻一件事提高後，相關事物也跟著提高。例如：這部偶像劇爆紅後，男主角的人氣也水漲船高。
  - index: 7
    word: 龐然大物
    definition: 形容外形非常龐大的事物。龐然：巨大的樣子。
  - index: 8
    word: 接駁
    definition: 用交通工具把人或物品從一處接送到另一處。
  - index: 9
    word: 無人能及
    definition: 沒有人比得上，形容在某方面特別優秀。
  extraction_check:
    vocabulary_agreement: 1.0
    missing_definitions: []
    indices_contiguous: false
    verdict: weak
comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列語詞，何者使用正確？
    options:
      A: 符合引水人資格的人在市場上「比比皆是」
      B: 看到天氣這麼熱，他「義憤填膺」的打開冷氣
      C: 公司的營收提升，員工薪資也跟著「水漲船高」
      D: 奶奶坐在公園看風景，看得「望穿秋水」
    rationale: null
  - index: 2
    answer: A
    stem: 三篇文章都提到了一個經濟學的核心原則，這個原則是什麼？
    options:
      B: 比較利益法則
      C: 分散風險原則
      D: 機會成本原則
      A: Ａ「比比皆是」很常見，引水人的月薪不常見。
    rationale: Ａ「比比皆是」很常見，引水人的月薪不常見。
    is_rationale: true
  - index: 3
    answer: B
    stem: 依據圖片，請問該項商品最後在市場上出現了什麼狀況？
    options:
      A: 供需均衡
      B: 供過於求
      C: 供不應求
      D: 飢餓行銷
    rationale: null
  - index: 4
    answer: D
    stem: 以下哪一種情境最符合「物以稀為貴」的道理？
    options:
      B: 供需會影響價格與薪資；限制價格也可能改變市場供給
      C: 工作薪資主要由辛苦程度決定，與人力供需關係無關
      D: 商品或人才只要數量稀少，價格與薪資就會持續上漲
      A: 政府訂定價格後，商品價格與工作薪資就不再波動
    rationale: 市場對工程師的需求大過於供給。
