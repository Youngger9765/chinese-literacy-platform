passage: '同樣的供需因素，也可以解釋商品價格為什麼下滑。2016年11月，秋風吹起，天氣轉涼，薑母鴨、火鍋店高朋滿座，高麗菜的需求大增，批發價漲到每公斤45元。一公頃的高麗菜就可以讓農民賺270萬元。其他的農民眼紅了：「我也要種高麗菜！」大批的農民於是放棄了自己的農作物，搶種高麗菜。80天後，搶種的高麗菜收成了，市場一下子湧入大量的高麗菜，價格開始崩跌，到後來每公斤5元都賣不出去，高麗菜只好一車一車被倒在野地。

  總之，商品價格的波動是「供給」和「需求」決定的。大家都想要的東西，價格就上揚；供給超過需求，價格就下滑。這就是「物以稀為貴」的道理。'
start_text: 同樣的供需因素，也可以解釋商品價格為什麼下滑。2
