spotlight:
  lesson: G6-L22
  strategy_name: 摘要策略：問題．解決．結果結構
  strategy_type: summary_pse
  blocks:
  - type: guide
    text: '這三篇都是說明文，分別從商品價格、政府政策和工作薪資，說明「物以稀為貴」背後的供需關係。為了說清楚這個抽象概念，三篇文章都從不同角度舉例，來幫助我們理解。

      讀這類文章時，不能只讀到個別例子，還要把不同例子合起來想：

      ❶找概念：作者想說明什麼？

      ❷看角度：每個例子說明哪一種情況？

      ❸合例子：這些例子合起來，讓我對概念多懂了什麼？

      接著，我們就用這三個步驟，看看三篇文章如何把抽象的供需概念說清楚。'
  - type: guide
    text: 任務一：找出三篇共同說明的概念
  - type: single
    prompt: 1.三篇文章雖然分別談商品、政府政策和工作薪資，但共同說明哪一個概念？（單選）
    options:
    - 市場的供給和需求，會影響商品價格與工作薪資。
    - 只要商品數量稀少，價格就一定會持續上漲。
    - 政府直接限制價格，就能解決市場供給不足。
    - 工作時間越長、越辛苦，得到的薪資一定越高。
    answer: 市場的供給和需求，會影響商品價格與工作薪資。
  - type: guide
    text: 任務二：比較例子，合起來理解概念
  - type: guide
    text: 一、先看第一、三篇：供需不同，價格或薪資會怎麼變？
  - type: table
    rows:
    - - 文章與問題
      - 提出不同角度的例子說明概念
      - 例子合起來，我懂了什麼？
    - - 文章與問題
      - 判斷例子的角度（單選）
      - 例子合起來，我懂了什麼？
    - - '第一篇

        〈物以稀為貴〉

        什麼因素影響商品的價格？'
      - '例1：

        颱風來，大量青菜被風雨打壞了，青菜價格變貴。'
      - '例2：

        農民搶種高麗菜，市場湧入大量高麗菜，高麗菜價格變便宜。'
      - '①商品價格高低，由市場供給和需求共同影響。

        □②商品價格高低，只由市場供給的多寡決定。'
    - - '第一篇

        〈物以稀為貴〉

        什麼因素影響商品的價格？'
      - ①需求＞供給□②需求＜供給
      - '□①需求＞供給

        ②需求＜供給'
      - '①商品價格高低，由市場供給和需求共同影響。

        □②商品價格高低，只由市場供給的多寡決定。'
    - - '第三篇

        〈一個月薪水80萬？〉

        為什麼不同工作的薪資不同？'
      - 例1：符合引水人資格者少，市場仍需要，薪資高。
      - 例2：有些工作可投入的人較多，薪資較低
      - '□①薪資高低主要看一份工作辛不辛苦。

        ②工作薪資高低，會受到人力供需關係影響。'
    - - '第三篇

        〈一個月薪水80萬？〉

        為什麼不同工作的薪資不同？'
      - '①需求＞供給

        □②需求＜供給'
      - '□①需求＞供給

        ②需求＜供給'
      - '□①薪資高低主要看一份工作辛不辛苦。

        ②工作薪資高低，會受到人力供需關係影響。'
  - type: guide
    text: 二、再看第二篇：價格改變，也會影響供給嗎？
  - type: guide
    text: 第一篇和第三篇說明「供需會影響價格或薪資」。第二篇再往前一步，讓我們看見：價格改變，也可能反過來影響市場供給。
  - type: table
    rows:
    - - 文章與問題
      - 提出不同角度的例子說明概念
      - 例子合起來，我懂了什麼？
    - - 文章與問題
      - 判斷例子的角度（單選）
      - 例子合起來，我懂了什麼？
    - - '第二篇

        〈政府可以干預價格嗎？〉

        政府直接限制災後修繕價格，可能帶來什麼後果？'
      - '做法一：

        不限制修繕價格

        價格上漲，可能吸引更多外地人力與材料進入災區。'
      - '做法二：

        限制修繕價格

        收入沒有提高，外地修繕人員前往災區的意願可能降低。'
      - '①直接限制價格，可能使供給減少。


        □②直接限制價格，可能使供給增加。'
    - - '第二篇

        〈政府可以干預價格嗎？〉

        政府直接限制災後修繕價格，可能帶來什麼後果？'
      - '修繕人力與材料的供給可能：

        ①增加

        ⃞②減少'
      - '修繕人力與材料的供給可能：

        ⃞①增加

        ②減少'
      - '①直接限制價格，可能使供給減少。


        □②直接限制價格，可能使供給增加。'
  - type: guide
    text: 任務三：看懂作者為什麼這樣寫
  - type: single
    prompt: 1.這三篇文章都從不同角度舉例，這樣寫有什麼作用？
    options:
    - 不同角度的例子增加內容，能讓文章篇幅更長
    - 不同角度的例子互相補充，能讓概念更完整
    answer: 不同角度的例子互相補充，能讓概念更完整
  - type: guide
    text: 任務四：換一篇試試看
  - type: guide
    text: 前面三篇都談供需。現在換一個不同的主題，看看你能不能使用同樣的方法，讀懂作者如何用不同角度的例子說明概念。
  - type: guide
    text: 高手是怎麼練成的？
  - type: guide
    text: 很多人看到圍棋高手、小提琴家或運動員的出色表現，常會讚嘆：「他一定天生就是個天才！」心理學家艾瑞克森長期研究各領域的高手，卻發現其實這些厲害的技能並不是天生的，而是經過長時間的練習和專業的指導，慢慢學會的。
  - type: guide
    text: 全世界最厲害的網球選手費德勒和小提琴家海菲茲，都曾說過自己並不是天才，而是在教練的指導下，日以繼夜、一步一步的苦練才變得那麼厲害。他們的成功並非偶然，是淚水與汗水換來的。
  - type: guide
    text: 莫札特七歲時，聽到樂器發出的聲音，就能立刻在鋼琴上找出相同的音，這種能力稱為「絕對音感」。許多人認為，這是少數人才具有的天賦。日本曾經做過一個實驗，讓21個孩子接受一段時間的音感訓練，結果每一個孩子都能像莫札特一樣，具有絶對音感。這個實驗指出，經過適當的教導和練習，每個人都能學會很特別的技能。
  - type: guide
    text: 總之，厲害的技能常是在指導下，長期苦練後學來的。不管是運動、音樂，還是其他技能，只要我們願意努力，認真練習，就有機會成為很厲害的人。天才其實是練出來的！
  - type: guide
    text: 請用剛才的三個步驟完成閱讀任務
  - type: table
    rows:
    - - 閱讀任務
      - 請判斷
    - - ❶作者想說明什麼？
      - '□①能力完全由天分決定

        ②能力可以透過指導與練習進步'
    - - '❷例子一

        從什麼角度說明？'
      - '①高手的練習經驗

        □②研究實驗的結果'
    - - '❷例子二

        從什麼角度說明？'
      - '□①高手的練習經驗

        ②研究實驗的結果'
    - - ❸兩個例子合起來，我懂了什麼？
      - '①個人經驗與實驗結果互相補充，說明練習能幫助能力進步。

        □②不同角度的例子都說明，只要努力，每個人都一定能成為天才。'
  - type: guide
    text: ★策略帶著走
  - type: guide
    text: 讀到作者從不同角度舉例時，先比較例子，再問自己：
  - type: guide
    text: 這些例子合起來，讓我對作者要說明的概念多懂了什麼？
  - type: guide
    text: 七*綜合閱讀理解
