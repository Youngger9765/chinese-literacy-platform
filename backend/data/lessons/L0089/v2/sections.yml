comprehension:
  questions:
  - index: 1
    answer: C
    stem: 下列語詞何者使用正確？
    options:
      A: 起初不耐煩長輩的關心，後來看見長輩的付出
      B: 起初期待長輩的協助，後來嫌棄長輩不夠能幹
      C: 起初害怕受到長輩責備，後來主動向長輩道歉
      D: 起初認為長輩十分冷漠，後來才發現長輩關心
    rationale: 第2題詳解：兒子、義傑和愛玲起初都對長輩的關心感到不耐；後來看見長輩的背影與付出，才重新理解長輩的心意。
  - index: 3
    answer: B
    stem: 〈背影〉中，兒子看見父親背影之前和之後，態度有什麼轉變？
    options:
      B: 第二組
      C: 第三組
      D: 第四組
      A: 第一組
    rationale: 第3題詳解：兒子先前嫌父親說話很迂、認為父親多此一舉；看見父親費力買橘子的背影後，才感受到父親的愛。
  - index: 5
    answer: B
    stem: 本文作者林玫伶為什麼詳細描寫四組學生的表演與討論，而不直接由老師說出答案？
    options:
      A: 交代各組不同的表演方式，完整呈現班級活動
      B: 讓讀者跟著學生比較線索，逐步理解背影感人的原因
      C: 強調四組學生對原文情節的記憶都十分正確
      D: 說明讀書會應以角色扮演取代個人閱讀與思考。
    rationale: 第5題詳解：作者詳細呈現表演、畫圖與討論，是讓讀者跟著學生一步步比較父子互動，形成對「背影」的理解。A只是表面效果，C、D都不是文章要表達的重點。
