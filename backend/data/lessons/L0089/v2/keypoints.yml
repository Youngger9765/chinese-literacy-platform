keypoints:
  lesson: G7-L20
  structure: flat
  columns:
  - label
  - value
  rows:
  - label: 討論主題
    value: 〈背影〉的作者朱自清為什麼特別描寫父親買橘子時的__？
    blanks:
    - answer: 背影
      hint: ''
  - label: 課文情境重現
    value: '老師要大家找出文章中祖母喪事後、父子互動的片段，請將以下片段依課文內容順序填入1～4：

      __父親在車站與腳夫討價還󠇡價，兒子嫌他話說得不好，不停插嘴。

      __父親鉅細靡遺囑託茶房陪兒子同去，後來改變主意，決定親自送兒子去車站。

      __父親去買橘子，兒子則坐在遠處，看著父親吃力的上下月臺。

      __進入車廂後，父親反覆叮嚀兒子，又囑託茶房好好照顧，兒子雖未插嘴，但內心認為父親多此一舉。'
    blanks:
    - answer: '2'
      hint: ''
    - answer: '1'
      hint: ''
    - answer: '4'
      hint: ''
    - answer: '3'
      hint: ''
  - label: 讀書會裡同學的解釋
    value: '1.曼屏：朱自清只注意到父親囑託茶房、與腳夫講價等細節，卻忽略了__。

      2.俊良：朱自清原來抗拒父親的__。看見老邁、動作__的父親仍為自己買橘子，便改變了看法。'
    blanks:
    - answer: 這一切都是為他做的
      hint: ''
    - answer: 過度保護
      hint: ''
    - answer: 笨拙
      hint: ''
  - label: 老師統整
    value: 兒子遠遠看著父親費力爬月臺，從父親老邁、笨拙的動作中，感受到父親__。
    blanks:
    - answer: 沒有說出口的愛
      hint: ''
  - label: 同學經驗連結
    value: '1.阿公來看義傑比賽時，義傑原本不情願，但看到阿公氣喘吁吁整理器材的背影，便感到__。

      2.每次媽媽要愛玲去讀書時，她聽了就翻白眼，但看到媽媽洗碗的背影時，又覺得自己__。'
    blanks:
    - answer: 內疚
      hint: ''
    - answer: 不應該
      hint: ''
  - label: 結論
    value: 無聲卻真實的背影，引發了人們的__。
    blanks:
    - answer: 共鳴
      hint: ''
  title: 「背影」讀書會
