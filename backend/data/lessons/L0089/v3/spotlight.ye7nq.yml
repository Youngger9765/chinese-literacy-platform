lesson_uid: L0089
version_id: v3
section_no: 五
spotlight:
  strategy_name: 自我提問──詰問作者
  strategy_type: self_questioning
  answer_carrier: 紅色 ☑（w:sym Wingdings F0FE）＋橘色手寫填空
  blocks:
  - type: concept_box
    text: '課文中的曼屏讀〈背影〉時，產生一個疑問：「朱自清為什麼要寫自己和父親面對面時沒有感動，看見父親的背影時卻感動到流淚？」

      老師認為這是個好問題，便提議舉辦讀書會，討論主題定為：「〈背影〉的作者朱自清，為什麼特別描寫父親買橘子時的『背影』？」

      像這樣，針對作者的表達提出問題，追問「作者為什麼這樣寫？」或「這樣寫想讓我們讀到什麼？」就是「詰問作者」

      作者不在眼前，不能直接回答我們。問完後，要回到文章找線索，把前後內容放在一起想，才能找到有根據的答案。

      詰問作者，可以幫助我們不只知道文章「寫了什麼」，還能進一步看懂作者「為什麼這樣寫」。'
  - type: guide
    text: 一、跟著問題，重新看〈背影〉
  - type: guide
    text: 我們就帶著這個問題，再看看文章前後的線索：
  - type: guide
    text: 〈背影〉的作者朱自清為什麼特別描寫父親買橘子時的「背影」？
  - type: guide
    text: ❶前面和後來，有什麼不同？
  - type: guide
    text: 請把「前三次父子互動」和「父親買橘子」的兩個情節放在一起看。
  - type: fill_table
    columns:
    - 項目
    - 前三次父子互動
    - 父親買橘子
    column_note: 第一欄沒有印欄名，格內印的是列名（父親的行動／兒子的反應／兒子注意到什麼？），本檔命名為「項目」
    rows:
    - 項目: 父親的行動
      前三次父子互動: 囑託、送行、講價、叮嚀，都是在替兒子張羅
      父親買橘子: 吃力爬上、爬下月臺，替兒子買橘子
    - 項目: 兒子的反應
      前三次父子互動: 不置可否、插嘴、覺得父親多此一舉
      父親買橘子: 看著父親的背影，對父親的看法改變
    - 項目: 兒子注意到什麼？
      前三次父子互動: '①父親一直為自己付出

        ②父親說話、做事讓自己不耐的地方'
      前三次父子互動_options:
        1: 父親一直為自己付出
        2: 父親說話、做事讓自己不耐的地方
      前三次父子互動_answer: 2
      父親買橘子: '①父親年紀已大，仍辛苦為自己做事

        ②父親動作不夠俐落'
      父親買橘子_options:
        1: 父親年紀已大，仍辛苦為自己做事
        2: 父親動作不夠俐落
      父親買橘子_answer: 1
  - type: guide
    text: ❷把前後放在一起想
  - type: single
    prompt: 哪一項最能說明兒子對父親的看法為什麼改變？
    options:
      1: 父親前面主要用說話表示關心，買橘子時才真正用行動付出。
      2: 父親一直都在關心兒子，只是兒子後來才看見父親為自己的付出。
      3: 父親前面處理事情的方式讓兒子不滿，買橘子時才完全改掉原來的做法
    answer: 2
  - type: guide
    text: '二、把線索接起來，回答問題

      回到一開始的問題：'
  - type: single
    prompt: 〈背影〉的作者朱自清為什麼特別描寫父親買橘子時的「背影」？
    options:
      1: 背影看不到父親的表情，可以讓讀者自行想像他的心情。
      2: 背影讓兒子遠遠看見年老的父親仍費力為自己付出，重新看見先前忽略的父愛。
      3: 背影讓兒子發現父親已經老了，因此開始擔心父親以後需要人照顧。
    answer: 2
  - type: guide
    text: '→你發現了嗎？

      1.如果只看故事，我們可能只讀到：「父親辛苦買橘子，兒子很感動。」

      2.追問「作者為什麼特別描寫這個背影」，再把前後線索放在一起，我們會更能看懂：

      父親的愛一直都在，只是兒子原本沒有看見。看到背影時，他才重新看見父親一直為自己的付出。'
  - type: guide
    text: '三、換你問本課作者林玫伶

      前面，我們跟著問題，詰問的是〈背影〉的作者朱自清。

      現在換你試著問這篇〈「背影」讀書會〉的作者——林玫伶。

      讀書會上，大家已經找出「背影」感人的原因。可是文章後半段，林玫伶又寫了義傑和愛玲的生活經驗。你會想問，為什麼作者要寫這些呢？'
  - type: free_text
    prompt: '❶換你提出問題

      請用「為什麼……？」完成你的問題

      我想問作者林玫伶：（問題合理即可）

      「你為什麼【　】'
    prompt_note: 原稿此處只有前引號「，沒有對應的收尾引號，照抄未補
    answer: 要寫義傑和愛玲自己的生活經驗？
    answer_carrier: 橘色手寫；教材標「問題合理即可」，此為示範答案非唯一解
  - type: single
    prompt: '❷回文章找線索

      課文中，義傑和愛玲的經驗有什麼共同點？'
    options:
      1: 兩人都曾和家人爭吵，最後主動向家人道歉。
      2: 兩人原本都對家人的關心感到不耐，後來從背影看見家人的付出。
      3: 兩人都因為家人特地來幫忙，才發現自己以前誤會了家人。
    answer: 2
  - type: single
    prompt: '❸用線索回答自己的問題

      林玫伶為什麼還要寫義傑和愛玲的生活經驗？（單選）'
    options:
      1: 補充不同家庭中，長輩照顧孩子的不同方式。
      2: 說明只要看見家人的背影，就會改變原來的想法。
      3: 把〈背影〉中的感受連到生活，讓讀者感同身受，引起共鳴。
    answer: 3
  - type: guide
    text: '→你發現了嗎？

      詰問作者時，可以問：

      作者為什麼這樣寫？這樣寫讓我多看懂什麼？'
  - type: guide
    text: '四、這次換你自己問

      剛才，我們已經練習對本文作者林玫伶提出問題。這一次，換你自己試試看。

      ❶找一個想問的地方

      再看一看〈「背影」讀書會〉，找一個讓你想問作者「為什麼這樣寫？」的地方。'
  - type: free_text
    prompt: '❷提出問題

      我注意到作者寫了…，我想問林玫伶：（問題合理即可）

      【　】'
    no_correct_answer: true
    answer_carrier: 學生自填，原稿此格空白
  - type: self_check
    label: ❸請你回到文章找線索，並用線索回答自己的問題
    instruction: 帶著剛才的問題回到文章。做到的請在□打勾。
    items:
    - ①我找到能幫助我回答問題的線索。
    - ②我能根據找到的線索，回答自己提出的問題。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
  - type: concept_box
    text: '★策略帶著走

      1.詰問作者時，可以想一想：

      「作者為什麼這樣寫？這樣寫讓我多看懂什麼？」

      2.再回文章找線索，把前後內容連起來想，就能把文章讀得更完整、更深入。'
  - type: self_check
    label: ◎自我檢核
    instruction: 如果你有做到，請在□打勾。
    items:
    - 1.讀文章時，我會想一想：作者這裡想讓我看懂什麼？
    - 2.我會回文章找相關線索，把相關內容連起來，回答自己的問題。
    no_correct_answer: true
    answer_carrier: 學生自填，原稿無勾選
