    \  （少「策略」二字）。meta.strategy 採學習單印的形式。\n・第六大題標題欄：本課聚光燈是**第五**大題、文章重點表才是第六（欄名是全庫通例稱呼）。"
strategy_explained: 這一課，我們要練習的是，讀書時自己問問題、找答案的能力，就像讀書會裡，大家一起追問「為什麼作者要寫爸爸的背影」一樣，從文章裡挖掘更深的意義，因為這篇故事藉由「背影」這個畫面，引導我們去感受那種很深很深、卻不說出口的愛，所以當你讀的時候，也可以試著像故事裡那樣，問問自己「這句話、這個畫面，讓你想到什麼」，或是「作者在這裡想表達什麼」
