intro: 這篇文章記錄了一場關於朱自清散文名作〈背影〉的讀書會。讀書會上，同學們針對「為什麼作者特別描寫父親買橘子時的『背影』？」這個問題，透過分組表演和討論，逐步探討作者的情感轉變。文章描寫了同學們如何從父親與兒子的互動細節中，理解到父愛的深沉與無聲。透過這次的讀書會，大家不僅更深入地體會了〈背影〉這篇文章的感人力量，也分享了自己生活中類似的經驗，體會到無聲的背影所蘊含的真摯情感。
