  passage: 第一組有三位同學，分別扮演父親、兒子和茶房。演的是父親起先囑託茶房陪兒子同去，後來改變主意，決定親自送兒子去浦口車站的情節。演出時，父親對茶房鉅細靡遺的交代，兒子則在一旁抱胸而立，表現出不置可否的樣子。演完後，老師在黑板上畫出三人互動的示意圖。
