lesson_uid: L0089
version_id: v3
section_no: 六
keypoints:
  title: 「背影」讀書會
  layout: list
  answer_carrier: 橘色手寫填空（教師版答案），文字流有此資訊
  rows:
  - label: 討論主題
    value: 〈背影〉的作者朱自清為什麼特別描寫父親買橘子時的【　】？
    blanks:
    - answer: 背影
  - label: 課文情境重現
    value: '老師要大家找出文章中祖母喪事後、父子互動的片段，請將以下片段依課文內容順序填入1～4：

      【　】父親在車站與腳夫討價還價，兒子嫌他話說得不好，不停插嘴。

      【　】父親鉅細靡遺囑託茶房陪兒子同去，後來改變主意，決定親自送兒子去車站。

      【　】父親去買橘子，兒子則坐在遠處，看著父親吃力的上下月臺。

      【　】進入車廂後，父親反覆叮嚀兒子，又囑託茶房好好照顧，兒子雖未插嘴，但內心認為父親多此一舉。'
    blanks:
    - answer: '2'
    - answer: '1'
    - answer: '4'
    - answer: '3'
    row_note: 這一列是排序題（依課文順序填 1～4），blanks 依印出來的先後順序記
  - label: 讀書會裡同學的解釋
    value: '1.曼屏：朱自清只注意到父親囑託茶房、與腳夫講價等細節，卻忽略了【　】。

      2.俊良：朱自清原來抗拒父親的【　】。看見老邁、動作【　】的父親仍為自己買橘子，便改變了看法。'
    blanks:
    - answer: 這一切都是為他做的
    - answer: 過度保護
    - answer: 笨拙
  - label: 老師統整
    value: 兒子遠遠看著父親費力爬月臺，從父親老邁、笨拙的動作中，感受到父親【　】。
    blanks:
    - answer: 沒有說出口的愛
  - label: 同學經驗連結
    value: '1.阿公來看義傑比賽時，義傑原本不情願，但看到阿公氣喘吁吁整理器材的背影，便感到【　】。

      2.每次媽媽要愛玲去讀書時，她聽了就翻白眼，但看到媽媽洗碗的背影時，又覺得自己【　】。'
    blanks:
    - answer: 內疚
    - answer: 不應該
  - label: 結論
    value: 無聲卻真實的背影，引發了人們的【　】。
    blanks:
    - answer: 共鳴
