multiple_choice:
- question: 根據這篇文章，請問下列哪個選項不是動物的本能?
  options:
  - 捲葉象鼻蟲母蟲在交配後，會找一片葉子，產卵在葉片末端。
  - 捲葉象鼻蟲在葉片不同部位，來回檢查，確定它適合作為育嬰室。
  - 捲葉象鼻蟲折捲葉子碰到困難時，做出和其他同伴完全不同的行為。
  - 黃面蜂在野地上尋找獵物，為蜂卵準備孵化後要吃的食物。
  answer: C
  explanation: 選項C描述的行為是昆蟲在遇到困難時，能做出與同伴「完全不同」的反應，這顯示了牠們具備「臨機應變」的能力，而非單純依循固定模式的本能行為。這與課文主題「昆蟲會思考嗎?」以及語詞(9)「臨機應變」的定義相
- question: 文中捲葉象鼻蟲如何找出適合的葉子作為「育嬰室」，請排出正確的順序？ ㄅ、在葉片不同部位來回重複檢查 ㄆ、測試葉片的彈性
  options:
  - ㄆ→ㄅ→ㄇ。
  - ㄅ→ㄆ→ㄇ。
  - ㄇ→ㄆ→ㄅ。
  - ㄆ→ㄇ→ㄅ。
  answer: null
  explanation: null
- question: 黃面蜂最終能抓到捲葉蛾幼蟲的關鍵原因是什麼？
  options:
  - 黃面蜂用觸鬚碰葉苞的底部，好像在告訴獵物：「殺手來啦！」
  - 黃面蜂用迅雷不及掩耳的速度，追趕捲葉蛾幼蟲。
  - 黃面蜂在葉苞外前前後後、來來回回的追逐捲葉蛾幼蟲。
  - 黃面蜂打破規律不再追逐，而是在原地守株待兔等捲葉蛾幼蟲。
  answer: D
  explanation: 課文雖然沒有提供完整的故事情節，但根據課文提供的語詞解釋，「守株待兔」在本課中指「等著目標自己送上門來」，而「規律」指「事物或現象反覆出現的秩序」。若黃面蜂能「打破規律不再追逐」，轉而採用「守株待兔」
- question: 小丸想知道：為什麼雨過天晴，天空常會出現彩虹？下面四位同學的做法，誰比較符合科學探究的精神？
  options:
  - 小豬：「聖經裡說，那是大洪水過後，神與人類立約的記號。」
  - 小玉：「維基百科的資料說，彩虹是陽光折射後產生的，17世紀的科學家就做過實驗了。」
  - 小美：「我看抖音影片，網紅說是噴射機經過留下的凝結尾！」
  - 小杉：「彩虹通常下雨後出現，我覺得是水折射產生的。」
  answer: B
  explanation: 小玉的說法引用了維基百科的資料，並提及17世紀科學家曾做過實驗，這表示她的結論是基於前人透過觀察、實驗和驗證所建立的科學知識，符合科學探究中依循證據和實驗精神的原則。
- question: 為什麼作者要用疑問句當標題呢？
  options:
  - 因為作者真的不知道昆蟲會不會思考，所以想問讀者。
  - 因為疑問句能激發讀者好奇心，帶著找答案的心理來閱讀。
  - 因為作者覺得標題字數太少，多加一個標點符號比較好。
  - 因為這個問題沒有答案，所以才會用疑問句。
  answer: B
  explanation: 疑問句作為標題能有效激發讀者的好奇心，引導他們帶著尋找答案的求知慾來閱讀課文內容。
