story_structure_table:
- - 昆蟲會思考嗎？
- - 提出問題
  - 昆蟲會不會【 思考 】？
- - 證據一：捲葉象鼻蟲
  - 捲葉象鼻蟲折捲葉子的行為，是每一隻母蟲的【 本能 】。但李淳陽觀察到，一隻母蟲折葉子時，碰到困難卻能做出【 完全不同 】的行為，解決問題。
- - 證據二：黃面蜂
  - 黃面蜂捕獵捲葉蛾幼蟲時，在葉子前端、後端來回追逐，等幼蟲展現來回奔跑的規律後，黃面蜂突然【 打破規律 】，停在一端守株待兔，抓住了捲葉蛾幼蟲。
- - 結論
  - '從李淳陽得到的證據：

    1.捲葉象鼻蟲臨機應變、解決問題。

    2.黃面蜂打破規律，抓住獵物。

    他得到的結論：昆蟲展現了本能之外的行為，牠們應該是【 會思考 】的動物。'
