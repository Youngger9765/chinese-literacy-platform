vocabulary:
- word: 依循
  definition: 依照遵循。
- word: 規律
  definition: 事物或現象反覆出現的秩序。
- word: 彷彿
  definition: 似乎、好像。
- word: 覓食
  definition: 尋找食物。
- word: 巧妙
  definition: 神奇美妙的方式。
- word: 守株待兔
  definition: 比喻不知變通或想要不勞而獲。在本課指等著目標自己送上門來。
- word: 迅雷不及掩耳
  definition: 雷聲突然響起，來不及掩住耳朵。比喻行動迅速，來不及防範準備。
- word: 葉苞
  definition: 本文指將葉子捲成如同花苞的形狀。
- word: 孵化
  definition: 卵變成幼蟲或小動物的過程。
- word: 臨機應變
  definition: 看現況的變化來做反應。
