lesson_number: 24
grade: 6
grade_code: G6-L03
title: 昆蟲會思考嗎？
genre: 說明文
text_type: 單
reading_strategy: 解決問題－讀者用觀察證據回答科學問題
knowledge_video_url: https://www.youtube.com/watch?v=x4DdIctCESI
story_text: '「昆蟲會不會思考？」這個問題，當然正反意見都有，有人說會，有人說不會。許多人認為昆蟲是低等生物，只會依循本能覓食築巢，不可能會思考、解決問題。但在科學界，要回答問題，都必須有充足的證據做基礎。台灣著名的昆蟲學者李淳陽，長年在田野觀察昆蟲行為，我們來看他對捲葉象鼻蟲和黃面蜂的觀察研究：

  解決困難的捲葉象鼻蟲。

  捲葉象鼻蟲母蟲在交配後，會找一片葉子，產卵在葉片末端，最後將葉片捲成葉苞當作育嬰室，好讓蟲卵可以在葉苞中安全的孵化。築巢中選葉及捲葉的工作，每一隻母蟲都展現了非常相似的程序，牠們會先拉一拉葉片，推一推葉緣，測試葉片的彈性，然後會在葉片的不同部位，來回重複檢查，以確定它適合做育嬰室。

  接著，牠慢慢的、慢慢的，往前走、倒退走、橫著走，一步、二步，似乎在仔細的測量葉片的長度和寬度，最後，才開始把葉片捲起來，做為蟲卵的育嬰室。

  但有一次，李淳陽發現，有一隻捲葉象鼻蟲因為折彎葉片時角度不對，等到要旋轉葉苞以便固定時，怎麼轉都轉不動了；沒想到，牠竟然會轉頭跑到葉片的基部，把葉緣拉過來包住葉苞，巧妙的固定住了育嬰室。

  捲葉象鼻蟲折捲葉子的行為，是每一隻母蟲的本能，可是這隻象鼻蟲在折來捲去的過程中，碰到了困難，牠居然能做出和其它的同伴完全不同的行為，牠能臨機應變，找到方法解決了問題。

  黃面蜂的心理戰術。

  「噗噗！噗噗！」黃面蜂（狩獵蜂的一種）正在野地上飛來飛去尋找獵物，為蜂卵準備孵化後的食物。黃面蜂發現一個葉苞裡有隻捲葉蛾幼蟲，便飛過去停在捲起的葉子上。因為被牢固的葉苞擋在外面，牠便用觸鬚碰碰葉苞的底部，彷彿告訴在獵物：「殺手來啦！」

  葉苞裡的捲葉蛾幼蟲嚇得從葉苞底部鑽到葉苞的前端，黃面蜂也以迅雷不及掩耳的速度追到前端，在開口處探一下頭，捲葉蛾幼蟲趕緊又縮回去，逃到後端。就這樣，獵人在葉苞外，獵物在葉苞內，牠們前前後後、來來回回的追逐著。

  等幼蟲展現來回奔跑的規律後，突然，黃面蜂打破了−這個規律，牠回到葉苞前端，頭部朝向開口處靜止不動；裡面的捲葉蛾幼蟲，仍然照著原來的規律來回奔逃，牠走到一方的盡頭，就回頭走到另一方的盡頭，可是這時正好遇上在葉苞開口處守株待兔等待著的黃面蜂，「噗！」黃面蜂立刻跳上前抓住捲葉蛾幼蟲，飛回巢穴了。

  昆蟲會不會思考呢？這種問題，可不是隨口說了就算。在科學界，要回答問題，就必須有足夠的證據才能下結論。經過許多細緻的觀察，李淳陽得到了一些證據，你覺得他的結論是什麼呢？'
