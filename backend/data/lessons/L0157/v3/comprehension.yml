lesson_uid: L0157
version_id: v3
section_no: 四
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列文句，何者語詞使用最恰當？
    options:
      A: 小朋友被路上的石頭絆倒「墜地」，痛得哇哇大哭
      B: 為了這場比賽，他練習游泳許久，在泳池中大汗「淋漓」
      C: 他看起來很面熟，我苦思良久，「俄而」才喚出他的名字
      D: 街頭畫家掌握模特兒的神韻，運筆「疾速」，完成畫像
    explanation: Ａ－墜地為高處往低處掉落，跌倒不適合用此詞。Ｂ－泳池看不出大汗淋漓。Ｃ－俄而是時間短暫。）
    explanation_note: 這個解析框只有結尾的全形右括號、沒有開括號，且選項代號用全形Ａ／Ｂ／Ｃ。原稿如此。
  - index: 2
    answer: A
    stem: 閱讀完本篇課文，請問有關「文言文」的敘述，何者為不正確？
    stem_note: 題幹的「不正確」在原稿加了底線強調
    options:
      A: 文言文的出現是為了要記錄古代的生難字，以供後人閱讀
      B: 因為古代書寫成本很高，文言文大幅精簡了需要紀錄的文字
      C: 文言文是書面用語，和古人平常說話的方式有所不同
      D: 精簡文字的方式有精簡用詞、省略主詞和受詞及省略連接詞
  - index: 3
    answer: B
    stem: 下列選項，何者無法證明含光與老虎歷經一番搏鬥？
    stem_note: 題幹的「無法證明」在原稿加了底線強調
    options:
      A: 左手據虎頸，右手以鞭亂捶虎頭，呼號聲震山谷
      B: 含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地
      C: 虎怒，力不得肆，舍其弟據嵎而吼，將以搏含光
      D: 猛虎攫其弟去。含光大驚墜地，持短鞭力追
    explanation: 解析：B.只能說明弟弟傷勢嚴重。
  - index: 4
    answer: C
    stem: 下列何者是作者(曾世杰)想要學生學到的概念？
    options:
      A: 宣揚文言文寫作之美，推廣文言文
      B: 說明文言文中生字、難字、古字的字義
      C: 告訴讀者文言文的由來以及閱讀的策略
      D: 說明文言文傳承古人智慧，現代人不可不學
  notes:
    answer_carrier: 橘色手寫代號（字元樣式 af），文字流有此資訊
    teacher_note_carrier: 深藍色（153D63）文字方塊，印在題目右側；只有第 1、3 題有
