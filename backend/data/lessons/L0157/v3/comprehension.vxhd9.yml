lesson_uid: L0157
version_id: v3
section_no: 四
comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
  - index: 1
    answer: D
    stem: 下列文句，何者語詞使用最恰當？
    options:
      A: 比賽失利後，他的心情一下子「墜地」
      B: 大掃除後，教室整理得十分「淋漓」
      C: 哥哥把兩塊蛋糕平均分給弟弟，真是「厚此薄彼」
      D: 聽到呼救聲，他立刻朝聲音傳來的方向「疾奔」而去
    explanation: 第1題解析：A-「墜地」指掉落到地上，不用來形容心情；B-「淋漓」不形容環境整齊；C-厚此薄彼是不公平。
  - index: 2
    answer: A
    stem: 閱讀完本篇課文，請問有關「文言文」的敘述，何者為不正確？
    stem_note: 題幹的「不正確」在原稿加了底線強調
    options:
      A: 文言文的出現是為了要記錄古代的生難字，以供後人閱讀
      B: 因為古代書寫成本很高，文言文大幅精簡了需要紀錄的文字
      C: 文言文是書面用語，和古人平常說話的方式有所不同
      D: 精簡文字的方式有精簡用詞、省略主詞和受詞及省略連接詞
  - index: 3
    answer: A
    stem: 下列哪一句直接寫出含光和老虎搏鬥的動作？
    options:
      A: 左手據虎頸，右手以鞭亂捶虎頭，呼號聲震山谷
      B: 含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地
      C: 虎怒，力不得肆，舍其弟據嵎而吼
      D: 猛虎攫其弟去。含光大驚墜地，持短鞭力追
    explanation: 第3題解析：A是「實際搏鬥動作」，B是「查看弟弟傷勢」，C是「老虎反應」，D是「遇虎、追虎」
  - index: 4
    answer: C
    stem: 這篇課文最主要想讓學生學會什麼？
    options:
      A: 比較文言文和白話文的差異，欣賞文言文精簡的特色
      B: 熟記文言文中的生字、古字，直接翻譯成白話文
      C: 了解文言文用字精簡的特色，並運用方法讀懂文意
      D: 認識古代書寫方式的演變，了解文言文的發展歷史
  notes:
