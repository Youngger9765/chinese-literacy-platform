source: DOCX 第一節（讀全文-做記號）
paragraphs:
- 前言：前一篇課文是蔣衡的「鞭虎救弟記」，以白話文呈現，如表１的右欄；但三百多年前，蔣先生的這篇故事用文言文寫的，如表１的左欄。請你輕聲朗讀這篇看起來不太習慣的文字，如果不懂意思，可以對照著白話文讀讀看。
- 表１ 鞭虎救弟記的白話/文言文對照表
- 既息肩，其弟尚一息未殊，以湯灌之，徐甦；含光喘亦略定，起視仲肩，前後十餘孔，血淋漓滿地。
- 有道士謂之曰：「虎牙有毒，深入，惡血不盡出，不可救。」
- 含光竭力以口遍吮之，去血數升，醫數十日漸平，乃偕歸。（195字）
- ◤忽然一陣帶著腥味的風刮起，場面飛沙走石，樹葉撲面有如雨下。一隻猛虎突然竄出把他弟弟攫走了。
- ◤含光大驚，跌倒在地上，然後他手持著短鞭奮力追虎，他左手緊緊抓著虎頸，右手用鞭子全力捶打虎頭，他大聲呼喊號叫，聲音震動了山谷。
- ◤老虎大怒，因為（叼著一個人）無法施力，於是捨棄到口的獵物，靠著山坳，大聲吼叫，想要和含光搏鬥。
- ◤含光背著他弟弟飛奔下嶺，投宿旅店。
- ◤等到他把弟弟從肩上放下，他弟弟一息尚存。於是含光用湯藥灌下去，漸漸地弟弟甦醒過來；含光喘了口氣略微安定下來後，坐起來看他弟弟肩膀。前後十幾個血洞，鮮血淋漓滿地都是。
- ◤有個道士對他說：「老虎的牙齒有毒，已經深入體內了，毒血如果不全部排出，就没救了。」
- ◤含光用盡全力用嘴巴吮吸每一傷口的毒血，吸血數升，醫治了幾十天，等到病情平穩了，才和他弟弟一起回家。（343字）
- 表1右欄中的白話文，連標點符號一共用了343字；左欄的文言文，連標點符號只用了195個字。讀完了以後，你會不會有一個疑問──「白話文比較容易懂吔，為什麼古人要用大家不容易懂的文言文寫文章啊？」
- 好問題！其實，對古人來說，白話文是日常的口語，也是比較容易懂的。但是，用白話文寫作的話，難免用上太多的字，古時候寫字要用毛筆，很不方便；紙還沒發明時，更不方便，還要用刀把字刻在竹簡上，印刷的門檻就更高了，現代人家家有印表機，在沒有電腦的時代，一般人想都別想。因為書寫、記錄和印刷都太麻煩、花太多時間、太花錢，因此可以大幅精簡文字的文言文應運而生。從西漢算起，文言文已經有兩千多年的歷史了，一直到100年前左右，紙、筆、印刷都更普遍之後，才開始有人推廣白話文。
- Ｑ１：文言文在哪裡節省用字？
- 以「鞭虎救弟記」為例，文言文比白話文少了148字，作者主要用了三個方式節省用字：
- 用詞精簡：「弟弟」在文言文裡只剩「弟」；「老虎的牙齒」只剩「虎牙」；弟弟被灌了湯藥後，「徐甦」。「徐」有「慢慢的」意思，「甦」則是甦醒。因此，「徐甦」就是弟弟「慢慢的清醒過來」，省了５個字呢。
- 省略主詞或受詞：如果句子的主詞或受詞是可以推敲出來的，文言文往往就省略不寫了。例如，「虎牙有毒，深入，惡血不盡出，不可救。」這裡「深入」的主詞指的是什麼？當然是虎牙的毒，但虎牙的毒會深入哪裡呢？當然是深入傷者的身體囉，這裡也省略了受詞不寫。作者表達「虎牙的毒深入傷者體內」時，把「虎牙的毒」和「傷者體內」都省略了，因為這些訊息是可以推敲出來的。
- 省略連接詞：連接詞就是「讓前後文可以更有意義串連在一起」的詞彙，例如，然後、因為、所以、於是、如果、就、才等詞彙，都是文言文裡非常少用的連接詞。像「惡血不盡出，不可救」其實是「惡血（如果）不完全排出，（就）沒救了。」，「如果」和「就」被省略了。
- 文言文節省用字，提高了閱讀的門檻，所以，讀文言文時必須強調「腦補」，讀者要試著推敲出被省略的部分，動動腦筋，把它補上。例如，道士說的「不可救」，猜猜看是誰不可救？你可以腦補出來嗎？
- Ｑ2：文言文一堆生字、難字、古字怎麼辦？
- 除了用字精簡外，文言文另一個難讀的地方是因時代更󠇡迭，這麼多年之後，古人的用詞和今人已經有了差異。例如，「起視仲肩」的「仲」，指的是一群兄弟中，排行老二的人，在這篇文言文裡就是「弟弟」的意思，現代已經少有人知道「仲」有弟弟的意思。又如「力不得肆」的「肆」，意思是「施展」，老虎的力氣施展不出來，「肆」有「施展」的意思，現代人也幾乎不用了。其他如「負其弟疾奔下嶺」的「負」，就是「背書包」的「背」；「一息未殊」的「殊」，就是「斷絕」的意思。這些古人的用詞，增加了現代人閱讀的難度。還好，國、高中國文課本裡的文言文，對這些生字難字古字都有注釋，看一下注釋，就可以知道這些字詞的意思了。
- 請依照文意，勾選出原文「 」中的白話文意思。
