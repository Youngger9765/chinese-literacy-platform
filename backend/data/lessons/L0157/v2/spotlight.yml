spotlight:
  lesson: 文-L2
  strategy_name: 文言文閱讀策略-如何讀懂文言文
  strategy_type: classical_grammar
  blocks:
  - type: guide
    text: ◎小試身手：選擇題
  - type: passage
    source: unknown
    paragraphs:
    - （ B　）(1)天帝「使」我長百獸：A.擅長  B.命令  C.增加  D.使用
    - （ D  ）(2)虎不知獸「畏」己而走也：A.尊敬 B.擔心 C.危險 D.害怕
  - type: guide
    text: （ A　）(3)子「隨」我後：A.跟隨  B.追隨  C.隨便  D.隨意
  - type: free_text
    prompt: 4.全句翻譯：
  - type: passage
    source: unknown
    paragraphs:
    - 懂了文言文的代名詞，也能推測出不認識的字的意思，你應該就可以理解句義了。請勾選出「虎以為然，故遂與之行。獸見之皆走。」的正確翻譯。
  - type: single
    prompt: 請選擇
    options:
    - 老虎認為狐狸的話很有道理，所以就跟著他走，野獸看到老虎走在狐狸後面，全都嚇得逃走了。
    - 老虎認為狐狸在騙人，所以就想看看狐狸要做什麼行為，野獸看到老虎後，全都嚇得逃走了。
    answer: 老虎認為狐狸的話很有道理，所以就跟著他走，野獸看到老虎走在狐狸後面，全都嚇得逃走了。
  - type: single
    prompt: 5.讀出作者意圖：試試看，從文中角色的關係，推論作者意圖：（單選）
    options:
    - 老虎
    - 狐狸），因為會害怕被牠吃掉。
    answer: 老虎
  - type: guide
    text: 狐狸藉著老虎讓自己看來很厲害，讓野獸們紛紛走避。
  - type: passage
    source: unknown
    paragraphs:
    - →所以作者藉這個故事諷刺那些沒有真本事的小人，藉著大人物的權勢，提高自己的地位。
  - type: guide
    text: ◎ 小試身手：綜合測驗
  - type: passage
    source: unknown
    paragraphs:
    - 下課返家，事雜頗繁。舍弟閒置於椅，無所事事；喚，無動於衷；家嚴(父親)後至咱旁，無視其閒散，喚我做事。心偏之劣，厚此薄彼，吾欲哭無淚，憤恨難平。
  - type: single
    prompt: (1)這個故事有哪些角色？（複選）
    options:
    - 哥哥
    - 弟弟
    - 父親
    - 母親
    answer: 哥哥
  - type: single
    prompt: (2)這個故事的作者是誰？□①哥哥　□②弟弟　□③父親
    options:
    - 哥哥
    - 弟弟
    - 父親
    answer: 哥哥
  - type: free_text
    prompt: (3)請你把人物用螢光筆畫出來。
  - type: free_text
    prompt: (4)寫出字詞的意思（可用推論的方式喔！)
  - type: guide
    text: 返：  回  ；繁：  繁重  ；閒置於椅：    閒閒地坐在椅子上    ；
  - type: guide
    text: 喚：  叫  ；心偏之劣：實在很偏心；厚此薄彼：對他好、對我差；
  - type: guide
    text: 無視其閒散，喚我做事：  沒有看到弟弟閒散，只叫我做事。
  - type: free_text
    prompt: (5)推測作者想要傳達的意圖：
  - type: guide
    text: 抱怨爸爸對弟弟偏心，都叫我（哥哥）做事。
  - type: guide
    text: Ａ－墜地為高處往低處掉落，跌倒不適合用此詞。Ｂ－泳池看不出大汗淋漓。Ｃ－俄而是時間短暫。）Ａ－墜地為高處往低處掉落，跌倒不適合用此詞。Ｂ－泳池看不出大汗淋漓。Ｃ－俄而是時間短暫。）請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。四閱讀理解四閱讀理解
