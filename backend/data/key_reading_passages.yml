# 重點朗讀指定段落對照表 (Issue #2562)
# lesson_code -> 老師 ☞ 指定的重點朗讀段落（新規則：只取 ☞ 那一段）
# 由紙本學習單 PDF 抽取；後端 loader 依 lesson_code 合併進 story.key_reading。
# needs_review: true 者為 ☞ 段號衝突/補字等，已上線但待人工複核。
passages:
  G4-L01:
    tou_paragraph: "第三段"
    passage: "2021年8月1日，小戴在東京奧運金牌賽的轉播收視率創下新高，這場小戴與陳雨菲的龍爭虎鬥，戰況勢均力敵，全臺觀眾守在電視前，目不轉睛。小戴一得分，大家歡天喜地、讚嘆不已；不幸鷹眼判定小戴的殺球出界，大家不免哀聲嘆息、捶胸頓足。一場比賽帶出全國人民不可思議的凝聚力和向心力！"
  G4-L02:
    tou_paragraph: "第四段"
    passage: "但事與願違，在2019年，楊俊瀚的體育生涯反而走到了谷底。他在拿坡里世大運比賽時受傷，開始了漫長的復健。運動員一旦受傷，不只要花時間復健、無法訓練和出賽，心裡更負擔著損失積分、與自我懷疑的種種壓力。"
  G4-L03:
    tou_paragraph: "第四段"
    passage: "適當的運動也是長高相當重要的一環。有助於成長發育的運動有：有氧運動─適度提升核心體溫，促進生長激素分泌（如慢跑、游泳）；跳躍的動作刺激生長板（如跳繩、籃球、羽球）；肌力訓練（弓箭步、深蹲）和伸展運動（瑜珈）等。適當的運動有助於刺激成長，但運動若是太過激烈，不只容易造成運動傷害，更無法達到促進生長的效果。"
  G4-L04:
    tou_paragraph: "第四段"
    passage: "運動科學結合現代科技後，在競技運動上有了突破性的發展，教練開始透過精準的測量，幫助運動者在安全的狀況下達到更快、更高、更遠的目標。競技場上，差之毫釐，失之千里，即使是一點點差距，都可能會影響選手的勝敗，有了運動科技加持，教練團可用各種設備測量記錄選手的表現，讓選手看到自己、甚至是對手數據或動作的變化，讓選手明白問題，進而透過加強訓練，改善問題，才能爭取更佳成績。"
  G4-L05:
    tou_paragraph: "第五段"
    passage: "手術順利完成，醫生說以他身體虛弱的狀態，可能不能跑步，因為跑極地馬拉松腳磨破、起水泡是家常便飯，炎熱或酷寒的天氣，增加了死亡的風險。身邊親友都勸他不要執著於賽事，好好過生活也不錯，陳彥博卻不這麼想，他問自己：「如果有一天，陳彥博不再跑步、不再冒險，那會怎樣？」他發現，答案很簡單，跑步是他唯一擅長也享受其中的事，如果上天給了他再活一次的機會，怎麼能夠不痛快淋漓的享受它？所以他克服身體上的不舒服，一次次的努力復健，開始嘗試再次跑步。雖然術後的體力大不如前，肌肉強度也不見了，但頑強的他，靠著漫長的訓練慢慢走出來，恢復從前狀態。"
  G4-L06:
    tou_paragraph: "第一段"
    passage: "有一次，我走路不小心撞到隔壁班的同學，連忙說：「不好意思！」他不但沒生氣，還笑著說：「沒關係！」沒想到旁邊的朋友小聲的說：「我覺得他可能對你有意思喔。」我心想這人的確蠻不錯，聽說還常常幫忙同學，講話又幽默，或許是個很有意思的人。但我最愛的笑話類型是諧音冷笑話，不知道他會不會覺得跟這種人相處起來很沒意思呢？"
  G4-L07:
    tou_paragraph: "第七段"
    passage: "又一年，小豬慢慢長大，小豬變中豬，中豬變大豬了。"
  G4-L08:
    tou_paragraph: "第三段"
    passage: "從此，我的「觀察遊戲」就成了「尋找讀書人」。不限車廂，也包括車站、餐館，雖然滑手機者還是遙遙領先，但「讀書人」也偶有所見。瞧！有位背著旅行背包的叔叔在路邊的候車亭等車，他老神在在的拿出一本書看，帥極了。瞧！放學時刻有個小男孩蹲靠在圍牆邊看故事書，大人在一旁嘻嘻哈哈聊天，他完全樂在書中，不為所動。瞧！有位阿姨在便利超商邊喝咖啡邊看書，拿在手上的似乎是一本小說，她閱讀時專注而優雅，真是漂亮啊！我也好想變成這樣。"
  G4-L09:
    tou_paragraph: "第七段"
    passage: "除了動物，天空本身也會說話。「日暈三更雨，月暈午時風」，所謂「暈ㄩㄣˋ」就是圍繞著太陽或月亮的光環。這句諺語指出，看到日暈表示夜裡會下雨，看到月暈白天就會起風。因為高空有一層很薄的冰晶雲，把光折射開來，我們才會看到日暈或月暈，這種雲常常是鋒面來臨的前兆，也就是說，看到日暈或月暈，再過半天，很可能就會起風或下雨。此外，我們偶爾會覺得今天的星星或遠山好像變近了，歷歷在目。有文學細胞的人就會寫下「今夜星辰分明，遠山如洗，彷彿天地間的距離被悄悄拉近」的美麗文句，這通常預示著冷空氣來臨，空氣潔淨，天氣即將轉晴或變涼。"
  G4-L10:
    tou_paragraph: "第一段"
    passage: "下班時刻，262路公車上有點擠。一位國中女生從前門上車，站在司機旁，搖搖晃晃的，臉色慘白，好像隨時會昏倒的樣子。"
  G4-L11:
    tou_paragraph: "第一段"
    passage: "公車慢慢地停在站牌旁，一位白髮蒼蒼的老爺爺上了車，從他登車時的緩慢動作可以看出他的力不從心。車上已經擠滿了人，大家稍微讓開一條小路，讓老爺爺進入走道中間。老爺爺左顧右盼，可惜已經滿座，他只好站在博愛座旁的空間，拉著吊環，隨著晃動的公車搖搖擺擺，就像風中抖動的燭光。"
  G4-L12:
    tou_paragraph: "第五段"
    passage: "吉他及歌聲開始飄揚，男人看著窗外飛馳而過的青山與稻田，輕輕的跟著哼唱。然後，這首歌出現了：
在這靜靜的黑夜裡
故鄉故鄉我想起她
在這悠悠的小河畔
故鄉故鄉我想起她"
  G4-L13:
    tou_paragraph: "第四段"
    passage: "寒流來襲那天，老闆又看見了小男孩。他守在攤子旁邊，每當有一位客人進入攤子，他就在自己的小冊子上記上一筆。雖然陸續有客人來，但過了好久好久，紙上的數字卻一直停留在八十五。天氣愈來愈冷，小男孩必須經常搓手踏腳以保持溫暖。老闆心急了，開始打電話給老顧客和朋友：「你今天有空嗎？能不能來吃碗麵？我請客。」"
  G4-L14:
    tou_paragraph: "第四段"
    passage: "獵人背起獵槍，走向白茫茫的山林。他巡視了之前設下的陷阱，處理了皮毛和獸肉，沒想到暴風雪來襲，氣溫驟降，寒風像刀子般凜冽。他伸手不見五指，只能找了個樹洞躲了一晚。但他心裡忐忑不安，輾轉難眠，想著的都是：「小寶會不會餓了？白牙會照顧他吧？」"
  G4-L15:
    tou_paragraph: "第五段"
    passage: "回家路上，我常常偷偷回想我們一整天相處的片段，像是在腦袋裡播一部只屬於自己的小電影。想到他幫我撿掉在地上的筆，或是在小組討論時不經意叫我的名字，我心裡就會不自覺發熱，像被陽光輕輕照到一樣。可是，我也不懂為什麼這種感覺只對他有。其他同學也對我很好啊，但那種溫暖又興奮的感覺，卻只有在他身上才會發生。更奇怪的是，我甚至開始期待每天上學，只要一想到可能會跟他有多一些互動，我就會覺得這一天好像變得特別一點。"
  G4-L16:
    tou_paragraph: "第三段"
    passage: "然而最近我更發現當他和其他同學聊天聊得很開心，我的胸口就會被抓緊，心裡很不是滋味，也開始胡思亂想：他是不是喜歡那個很幽默的同學？他們會不會常常傳訊息？他跟我聊天有這麼開心嗎？還是我根本不特別？這些念頭在我腦中亂竄，有時候一閃而過，但有時候卻揮之不去，像是一群停不下來的蜜蜂，在腦袋裡嗡嗡作響，也讓我越想越難過。"
  G4-L17:
    tou_paragraph: "第二段（學長回信）"
    passage: "說實話，我以前也覺得只要球打得好，就能進職棒、獲得豐厚報酬。但等我真的進了職棒，我才發現：成功，不只要努力，還要「運氣站在你這邊」。"
    needs_review: true
  G4-L18:
    tou_paragraph: "第十二段"
    passage: "第三位朋友的故事更精彩，他從四年級進棒球隊後，就不愛讀書，到國中時，連簡單的文章都讀不懂。有一天，他迷上一套名叫《青少棒揚威記》的日本漫畫，廢寢忘食的閱讀，遇到不懂的字詞，就請教老師或同學。這套漫畫讓他的閱讀胃口大開，接著他讀了更多讓國中生愛不釋手的漫畫，像是《野球狂之詩》、《灌籃高手》和《好小子》。憑著對運動的熱愛，也是田徑高手的他，開始挑戰一本沒有插圖的運動少年小說《轉瞬為風》，不但讀完，還看了兩次。這樣的成功經驗，帶動了他所有學科的學習信心，最後在會考時，他的成績和普通班的同學不相上下呢！"
  G4-L19:
    tou_paragraph: "第二段"
    passage: "當強烈地震把大型建築物震垮，有人被困在像山一般高的瓦礫廢墟時，就是非洲巨鼠出任務的時機。受過專門訓練的巨鼠，配備著微型背包，背包裡有麥克風、攝影機和定位追蹤器。當巨鼠被帶到廢墟，牠們可以靠著聽力、嗅覺及天生的鑽洞能力找到倖存者。當牠們來到倖存者身邊，就會扯一扯繫在背包上的警報器，讓它嗶嗶響，救援人員就可以根據這個信號來找到受困者。"
  G4-L20:
    tou_paragraph: "第五段"
    passage: "是這樣的，颱風前，新聞一直預報會有強風豪雨，消費者預期颱風後菜價會漲，大家都想：「先下手為強，後下手遭殃，趁現在還買得到青菜……」，於是颱風來襲前兩天，菜市場人滿為患，大家搶買青菜。這時，「供給」雖然沒有改變，但市場「需求」大幅增高，市場裡青菜奇貨可居，根本不夠賣，價格就開始漲了，一把小白菜賣到80塊都不稀奇。"
  G4-L21:
    tou_paragraph: "第三段"
    passage: "「這不是趁火打劫嗎？受災戶已經很可憐了，政府應該要出面，制定公道的價錢，制止這種災後漲價的現象。」一定會有人義憤填膺的這樣主張。"
  G4-L22:
    tou_paragraph: "第八段"
    passage: "相反地，如果一份工作技術門檻低，例如，商店店員、飯店房務人員、在建築板模上拔釘子、騎機車送餐等，這些工作只要身體健康，人人都能做，人力的供給遠大於市場需求，工資自然就高不起來。"
  G4-L23:
    tou_paragraph: "第六段"
    passage: "小美他們的經驗，你是否也曾經遭遇？明明想好好表現，卻被緊張、疲累或心裡的小劇場絆住腳步。運動不只是跑得快、打得準，更需要一顆能和身體好好合作的心。它會影響你面對壓力時的反應，左右你看待隊友與自己的方式，也決定你能不能從低潮中再站起來。"
  G4-L24:
    tou_paragraph: "第十一段"
    passage: "「哦！阿哲也來啦！」教練一邊準備貼紮的用具，一邊熱絡的打招呼。"
  G4-L25:
    tou_paragraph: "第一段"
    passage: "人體其實是一座精密的工廠，由206塊骨頭和數百條肌肉構成。清晨，你睜開眼、伸個懶腰，手臂一抬、一呼一吸，身體早已全員上工。你也許沒注意到，這短短幾秒，背後有超過二十條肌肉、十多塊骨頭、還有肺、肋間肌、橫膈膜、心臟一起配合協作──就像一支默契絕佳的工作團隊。每一次呼吸，數百萬個細胞正在同時衰亡與新生。所以，不但平凡的伸懶腰是一場無聲的奇蹟，連運動員在場上的精湛表現，都是這座工廠全力運轉的傑出成果。"
  G4-L26:
    tou_paragraph: "第五段"
    passage: "隨著打席越來越接近，沒想到腦中的念頭又開始作祟——「我真的打得到嗎？」、「不要又丟人現眼了啊！」、「再打不好，大家會恨死我！」我走向打擊區時，隊友們吆喝著「給他們好看！」、「加油，你沒問題的！」，但這讓我更加緊張，腦海裡的廣播排山倒海而來。我站上打擊區，手心全是汗，我無法全神貫注，根本來不及反應。「OUT！」三球就被解決，「又來了……」我在心裡嘆了一口氣，不敢看隊友。隨著攻守互換的哨聲響起，我戴上手套跑向外野，心裡滿是失落。每次都這樣，只要關鍵時刻或遭遇挫折，那個毒舌球評總是拖我後腿。"
  G4-L27:
    tou_paragraph: "第三段"
    passage: "有時候，一句「我很爛」，會讓我們明明有能力，卻在起步前就退縮；一句「我只會添麻煩」，讓我們覺得自己是別人的負擔，因此最需要協助時，卻把求助的話默默吞下去；一句「都是我的錯」，更會像一把沉重的鎖，把人關進自責的迷宮裡，不斷反覆回放失敗的畫面。當你越抗拒這些念頭越要自己不去想，會發現這些「腦內酸民」反而更大聲。就像，如果我要求：「你現在可以胡思亂想，但不准你想白熊！」你看！你的腦海是不是開始反覆出現白熊的畫面了呢？這就是經典的「白熊效應」——你愈想抗拒、壓抑一個念頭，那個念頭就更容易跳出來。"
  G5-L01:
    tou_paragraph: "第三段"
    passage: "人工噴藥既然又辛苦又危險，那用無人機噴可以嗎？大型的無人機，低空噴一公頃的農藥只要20分鐘，一天可以噴五公頃，而且施作者不必直接接觸農藥，又安全，又省力。但這樣農民就可以一勞永逸了嗎？那可不。農藥一灑，昆蟲死了99.9%，那倖存的千分之一，再繁殖出來的下一代，就比較不怕農藥了，只要這麼繁殖個幾代，新生代的幼蟲就會產生抗藥性。"
  G5-L02:
    tou_paragraph: "第三段"
    passage: "沙馬雷和一般的無人機不一樣，它只有一片翅膀，因此構造簡單，體積更小，更省電，而且沒電時，它會盤旋而下，比較不會摔壞！它和一般無人機一樣，可以垂直起降，在狹窄的空間靈活飛行。內建攝影機時，可以幫助人類進行搜救、環境監測，甚至探索危機四伏、險象環生的災難現場。"
  G5-L03:
    tou_paragraph: "第七段"
    passage: "也有的大嫂極有度量胸襟，帶著娘家、夫家侄兒親戚等一同工作，徒子徒孫遍布整個行業，整個家族全靠她用一支電話聯繫，指揮調度使臂使指，喊水會結凍，喊米變肉粽。真正趕起工來，人脈比我們這些營造廠還多、還廣。往往我們叫不到的人，都要靠這些嫂子的關係拜請而來。"
  G5-L04:
    tou_paragraph: "第五段"
    passage: "心理學研究提供了一些線索，幫助我們理解為什麼人們容易相信災難預言。首先是「倖存者偏誤」，意思是，我們傾向只注意那些看似應驗的預言，而忽略大量沒有應驗的預測。例如，某人預測「某年會有大地震」，如果地震真的發生，大家會說「他好準」！但他可能還預測了許多從未發生的災害，這些不準的預言卻被遺忘。其次是「確認偏誤」，指的是我們會特別尋找符合自己信念的證據。例如，聽到「某地將發生災難」，只要那個地方有任何異常，比如暴風雨或停電，我們就以為預言成真。心理學家還發現，人類對不確定性感到不安，當未來充滿未知時，災難預言反而像一盞指引的燈，哪怕不準確，也讓人暫時感到安心。"
  G5-L05:
    tou_paragraph: "第四段"
    passage: "朱蒂在孤兒院時沒能受到完整的教育，上大學後發現自己的知識遠遠落後其他同學，她從未看過「蒙娜麗莎的微笑」畫像，也沒聽說過「福爾摩斯」的名字；大一就面臨數學和拉丁文成績不及格的慘狀。許多人遇到這樣的情況，可能會因自卑而選擇逃避，或是把挫折歸咎於低微的出身；但朱蒂只讓自己失落一下下，很快就發揮她樂觀不怕失敗的個性，拾起戰鬥力。"
  G5-L06:
    tou_paragraph: "第四段"
    passage: "不過，周思齊被肯定的從來不是他的天賦，而是努力。他在三軍時，曾有教練對他說：「你就不要再打了，回家種田去吧！」更曾經被學長直言：「你不是天才」。看著一軍隊友的表現，周思齊也不得不低頭承認這鴻溝般的實力差距。他說，在不服輸前要先懂得認輸，「認輸，只是幫助自己先認清事實，接下來才是真正的開始，也才能用努力展現不服輸的精神。」於是，他開始不搭校車，改用跑步當體能訓練，回到宿舍後也不懈怠，而是繼續練習揮棒。晚上熄燈後，他會和隊友帶著棉被到頂樓繼續練習，累了就直接睡在頂樓。"
  G5-L07:
    tou_paragraph: "第四段"
    passage: "那時球員平均月薪不到十萬，對方卻拿出五、六百萬做為打假球的簽約金，並強調後續還有更多獎金。也恐嚇球員知道他們的身家資料及家裡地址等，甚至桌上一邊放錢、一邊放槍，要球員做出選擇。每次出外比賽，住進飯店後，周思齊總是膽戰心驚，有好幾次為了不讓黑道找到，只好和隊友躲在衣櫃，或冒著摔下去的危險待在狹小的陽台，假裝不在房間。有一次被大哥找去，他還假裝接電話趁機逃跑，一路跑到黑漆漆的山路樹叢旁躲著，等待機會攔車回去。這一整年，他都活在各種未知的恐懼中，但他沒有妥協，也不願違背自己的良心，不願辜負他最愛的棒球和支持他的球迷。"
  G5-L08:
    tou_paragraph: "第四段"
    passage: "心、體、技！心、體、技！競技場上，除了體能和技術，心理素質更是成敗關鍵。楊勇緯說：「賽前，我學會把注意力全部放在比賽上，讓身邊的干擾降到最低，專注在當下。先深呼吸冷靜，再調整好心情重新開始，然後思考應該再做些什麼，好讓自己多一點機會。」"
  G5-L09:
    tou_paragraph: "第五段"
    passage: "到了夜晚，周天成經常必須出席參與一些公開活動或私人的拜會，因為身為一個持續參加國際賽事的國手，除了「比賽、訓練」之外，也有社會教育的責任，也必須尋求企業或政府機構的贊助。但為了保護自己，他不騎車也不開車，儘量搭捷運或公車前往，讓可能造成身體傷害的因素降到最低。避免受傷，也是一個運動員對自己運動生涯負責的一種表現。"
  G5-L10:
    tou_paragraph: "第一段"
    passage: "小花在鄉下長大，三歲時，爸爸就過世了，家中食指浩繁，她是六個嗷嗷待哺的孩子中的第五個，底下還有一個雙胞胎妹妹。媽媽目不識丁，又沒有一技之長，只能到處打零工。課外讀物、雞鴨魚肉、零食對小花家來說都是奢侈品。小花入小學後，發現同學家裡有兒童繪本、小說、漫畫，而反觀自己的家，家裡出現的文字，除了教科書，就只有日曆和黃曆了。學校遠足時，她眼睜睜的看著同學啃著紅艷的大蘋果，只能撇開目光，嚥下自己的口水。偶爾鄰居給了一顆糖，小花捨不得吃，總要留到睡前，含在嘴裡再慢慢睡去，天真的她認為，這樣才可以吃一整夜，小花長大後成為牙醫的常客，才知道這天真的代價真不小啊。小花家到學校要走半小時，那時學校沒有營養午餐，小朋友要自己帶便當或回家吃午餐，因為家裡窮便當菜色太差，小花選擇回家吃午餐，常吃完午餐，再走半小時的路回學校，肚子又餓了。"
  G5-L11:
    tou_paragraph: "第四段"
    passage: "雪上加霜的是，她在準備2020年東京奧運時，陳念琴發現脖子有小小的硬塊，醫生告訴她罹患了淋巴癌。她和教練討論後，決定隱瞞病情，一邊備戰的同時也接受化學治療。化療的副作用讓她無力、想吐、掉髮，而且辛苦的治療過程，無人可以傾訴。她心力交瘁的同時，還要承受媒體的質疑：「你不是奧運選手嗎？怎麼在奧運前的賽事表現的那麼弱？」她的委屈沒有人可以理解，她堅持飛舞在拳擊的擂台上，因為她的信念是：「為了夢想我願意忍耐，在追求成功的過程中，再苦再累我都要咬牙撐過。」她堅韌的心志使她成為第一個拿到奧運拳擊項目資格的女拳手。她的抗癌經歷，也鼓舞了許多癌症的病友。"
  G5-L12:
    tou_paragraph: "第三段"
    passage: "想擁有雷神索爾般的身材，首先要做到「均衡的飲食控制」，倘若每餐都是炸雞、薯條、可樂、珍奶，就算運動得很努力，也跟不上脂肪增加的速度，因此減少油炸類、甜食的攝取是非常關鍵的；再來是「保持良好的睡眠」，因為生長激素在睡覺時，濃度會快速上升，以利身體組織成長，所以充足的睡眠是不可或缺的；最後是「專業且規律的訓練」，身體的肌肉有相當多種類，不同的訓練方式，則會增強不同的肌肉，例如：伏地挺身會練到胸肌、三頭肌；拉單槓會練到背肌、二頭肌；棒式是核心肌群、肩膀、胸部；深蹲則是大腿、臀大肌。重要的是，每次練習，都要「離開舒適區」，練習的分量，要比自己能承受的最大的重量再高一點點才行。"
  G5-L13:
    tou_paragraph: "第六段"
    passage: "如今，小丑醫生的工作已經在世界各地普及，在臺灣，小丑醫生的計畫由一些非營利組織推動，許多志工投入其中，為孩子們帶來希望和勇氣。"
  G5-L14:
    tou_paragraph: "第三段"
    passage: "然而，垃圾食物卻是這麼好吃，讓人一口接一口停不下來，到底是什麼原因呢？首先，它們的味道都經過精心調配，製造商會找到鹽、糖、油的完美比例，讓食物又香又美味，像外酥內軟的雞塊、酸酸甜甜的糖果、又脆又鹹的洋芋片、香甜濃郁的巧克力……，都讓人著迷，難以抗拒。其次，這些食物裡的脂肪和糖份會快速被身體吸收，促使大腦釋放多巴胺。多巴胺是一種可以帶來快樂的神經傳導物質，因此，在吃垃圾食物時，大量的多巴胺不但會為你帶來滿足快樂，當你焦頭爛額或愁眉不展時，也能降低你的焦慮憂愁。大腦會記住這種快樂無憂的感覺，下次一聞到熟悉的味道，就會忍不住想吃。最後，垃圾食品常和快樂時光連結在一起，例如生日時吃蛋糕、看電影配爆米花、邊逛街邊吃薯條，再加上有些垃圾食物的包裝和廣告令人垂涎欲滴，彷彿有個看不見的小精靈在誘惑我們：「來一口吧，吃了會開心喔！」"
  G5-L15:
    tou_paragraph: "第四段"
    passage: "在非洲東北部的厄利垂亞，20年來由同一位總統治理，人民沒有言論、參政、新聞等自由，被稱為「非洲版北韓」。2012年12月8日，15歲的女孩琪哈姆，試圖逃離國家而遭到逮捕。至今已超過10年，她生死不明、毫無消息，而她的家人求助無門，也只能乾著急。2020年8月，白俄羅斯16歲的米基塔，某日經過廣場時，意外被捲入抗議人群中，隔天，警方便指控他向警察投擲汽油彈，被判處五年徒刑。從那時起，他被關進黑牢，患有癲癇的他不但沒有得到適當的醫療照顧，且疑似遭受酷刑。"
  G5-L16:
    tou_paragraph: "第三段"
    passage: "1925年，一這群來自花蓮的年輕阿美族球員，懷抱著緊張又興奮的心情前往日本。首戰面對豐島師範棒球隊，他們一開場就像脫韁野馬般猛攻，前四局就以28比0大幅領先，讓裁判不得不提早結束比賽。第二場比賽，能高團對上東京的強隊，最後打成平手，讓日本觀眾非常驚訝。能高的隊員在場上用阿美族語打暗號，不僅讓對手摸不著頭緒，連裁判都聽不懂，而他們揮棒的力道和傳球的速度，更讓日本觀眾忍不住瞪大了眼睛。賽後，他們獲得「若武者」的稱號，也就是「年輕的武士」，彷彿從山林裡走出的戰士。"
  G5-L17:
    tou_paragraph: "第二段"
    passage: "地雷是一種埋在土裡的炸彈，人員或車輛壓過時，只要重量超過6公斤，就會爆炸，殺傷敵人。地雷製造容易，成本低廉，戰爭時，軍人經常在重要的地點埋設地雷，好讓敵人無法通過。最糟糕的是，雖然地雷是為了殺傷敵對陣營的武裝人員而設置的，但是地雷殺傷的平民更多。即使戰事已經結束幾十年，被地下的地雷殺傷的情況仍然層出不窮，造成人們行動時的害怕與不便。聯合國估計，2015年全世界約有6,500人因地雷而死亡或受傷，大多數受害者是平民，其中三分之一是兒童。因此，偵測和掃除地雷成為刻不容緩的工作。"
  G5-L18:
    tou_paragraph: "第四段"
    passage: "但是，魚兒們洄游時，本來暢行無阻的水道，現在有了一重重的閘門擋住了去路，製造了多重危機。當萬頭鑽動的魚兒滯留閘門附近的水域時，就會面臨食物不足、水質變差及容易被天敵（例如鳥類）捕食的風險，這可能會使魚兒錯過繁殖契機，導致魚寶寶的數量減少，影響整個魚群的生存。為了保護魚兒，閘門管理員只能經常到河邊檢查是否有魚群，或定時開啟閘門，既辛苦又無法準確掌握時機。"
  G5-L19:
    tou_paragraph: "第三段"
    passage: "我盯著他們，心裡有點不是滋味。但這應該很正常吧？他們本來就是小學同學，話題比較多也沒什麼奇怪的……而且，我又不是那種愛計較的人，這種小事根本不值得放在心上。可是，如果真的沒什麼，那為什麼不肯邁開腳步走過去？為什麼胸口悶悶的，好像吞下了一顆沒嚼碎的糖果，卡在喉嚨裡？"
  G5-L20:
    tou_paragraph: "第三段"
    passage: "我盯著螢幕，思緒變得混亂。每次遇到這樣的情境我總是會猶豫：到底要堅持追求自己喜歡的人，但可能沒有結果，還是要選擇喜歡自己的人，也許會更幸福？。當下有個念頭閃現：不如答應他的告白吧，這樣至少不用擔心受傷，畢竟他對我很好，和他在一起應該會很輕鬆吧？或許……我也可以試著喜歡他？可是，不管我怎麼努力說服自己，心裡卻始終沒有任何悸動。我低下頭，輕輕嘆了口氣——勉強自己接受一段沒有心動的關係，最後只會讓彼此都不快樂吧。"
  G5-L21:
    tou_paragraph: "第六段"
    passage: "在洪老師的指導下，小睿及同學們採取了多方面的行動：首先，班級的晚自習開始了，小睿報了名，確保週一到週五每天晚上有兩小時專心閱讀及做功課的時間；其次，爸媽在小睿的手機上安裝了時間管理的app，從此，上網的時間每天只剩30分鐘，其它時間手機自動上鎖。此外，小睿和三位有同樣困擾的同學組成「脫癮小組」，大家每天見面就拿出手機，看看彼此前一天的使用情況，誰違規超時就要請喝飲料；週末時，四個人也開始安排一起念書、打球或爬山等戶外活動，以減少獨自滑手機的機會。至於獨處的時候，小睿學會一招，每當腦中玩手機的念頭蠢蠢欲動時，他會把掛在腕上的橡皮筋拉得高高的，皺眉閉眼咬牙，對自己大喊一聲「停！」同時放手彈自己一下。說也奇怪，這招還真能有效阻斷那些壞念頭呢。"
  G5-L22:
    tou_paragraph: "第五段"
    passage: "許多學生球員仔細思考過夢想和事實之間可能的差距，他們也想兼顧學業和運動訓練，想讓自己未來有更寬廣的職涯選擇，但這不是學生自己就能辦到的。還好，現在全臺灣有許多愛棒球的校長及教練，運用各種方法幫助學生球員在教室和球場間取得平衡。例如，花蓮縣三民國中的林國源校長、張志強教練和老師們合作無間的改善了球員學習、訓練及生活的樣貌。他們增加了宿舍的淋浴間及洗衣機，減少等待洗澡、洗衣服的時間，讓球員在繁重嚴格的訓練中，還能擠出讀書的時間。學校還訂定了出賽辦法，要求學業成績達標才能出去比賽。再例如，新竹縣中山國小郭碧玄校長認為，為了確保孩子未來的人生能走得更寬廣，維持基本學力和開展運動技能同樣重要，他們加入中信基金會支持的「愛接棒計畫」，為棒球選手提供額外的夜間課輔，以確保學生的基本學力。"
  G5-L23:
    tou_paragraph: "第六段"
    passage: "我理智上知道，作息時間表剛出爐時就必須嚴格執行，但情感上，這樣的自我要求讓我痛苦萬分，特別是晚上九點半，不論遊戲多麼精彩刺激，也必須強迫關機。還好，這不是我一個人的武林，團隊的弟兄們總是在一起哀聲嘆氣後，同樣堅持按表操課，登出遊戲。經過幾個月持之以恆的自律和精確的時間管理，我們在遊戲中的排名節節攀升，學校成績也有明顯進步。爸媽都看在眼裡，臉上終於露出欣慰的笑容。"
  G5-L24:
    tou_paragraph: "第七段"
    passage: "接下來發生的事，就是千古流傳的傳奇了。"
  G5-L25:
    tou_paragraph: "第七段"
    passage: "大衛奔赴戰場，因為沒有笨重的盔甲，他行動迅捷自如。不顧歌利亞的怒吼挑釁，始終保持距離，讓對方的武器神力毫無用武之地。他把石子放入投石器裡，在頭上旋轉六、七圈，石子在空中呼呼作響，速度愈來愈快。他瞄準歌利亞的前額——重甲保護下唯一的破綻，果斷出手。石子像子彈一樣疾射而出，以時速130公里的速度擊中歌利亞的額頭，那顆堅硬冰冷的鵝卵石，將巨人當場擊倒。"
  G5-L26:
    tou_paragraph: "第三段"
    passage: "1987年，科學家找了兩組大學生做這個測驗，第一組大學生是說漢語的中國人（以下稱呼他們「老中」），第二組大學生是說英語的美國人（以下稱「老美」），結果指出，老中的平均得分是9，老美的平均卻只有7，老中很明顯的超過老美。"
  G5-L27:
    tou_paragraph: "第六段"
    passage: "你猜猜看，小歐和小莉在閱讀時，誰的工作記憶裝的是柳丁，誰裝的是文旦呢？你猜對了！小歐讀得慢，他工作記憶裡裝的是文旦，沒有幾顆；小莉讀得快，工作記憶裡裝的是柳丁，可以裝的數量，比小歐多得多。不只如此，科學家還進一步發現，像小莉這樣讀得快的人，閱讀理解的能力遠遠超過像小歐這樣讀得慢的人。"
    needs_review: true
  G6-L01:
    tou_paragraph: "第四段"
    passage: "「不管是哪一種運動，做好暖身是最重要的，正確的暖身時間至少要佔整個運動時間的十分之一，主要目的是爲了增加關節的靈活性、提高心肺功能及體溫及促進肌肉收放的效能，這樣才能防止運動傷害，降低訓練時受傷的風險。如果還是不幸發生意外──像皓祥的扭傷，可以記這五個步驟。」詹老師邊幫皓祥包紮，一邊說著：「最基本的處置原則，口訣為PEACE：保護（Protection）、抬高（Elevation）、避免（Avoid）、壓迫（Compression）、教育（Education）。」一、保護：受傷後1-3天內限制活動及負重。二、抬高：受傷的部位盡量高於心臟，幫助患部的血液回流至心臟，減少腫脹。三、避免：盡量避免使用抗發炎藥物。四、壓迫：適當的彈性繃帶，針對受傷部位給予包紮壓迫，可發揮固定和抑制腫脹的效果。建議這個步驟交給專業的人員比較好。五、教育：認識傷後恢復的流程，避免過度期待或壓力。"
  G6-L02:
    tou_paragraph: "第三段"
    passage: "慢慢的，我發現我和每個同學都能相談甚歡，但我不會是他們最要好的朋友，這份格格不入，讓我在走廊遇到小學朋友時總是特別開心，但迎面而來的卻經常是一份陌生的尷尬。又隨著第一次段考逼近，我才驚覺小學的讀書策略不再管用，面對小考卷上密密麻麻的紅字訂正，及格不再唾手可得，反而像斷線的風箏般，遠走高飛。升上國中的新鮮感慢慢退去，孤單和壓力卻如影隨形，無法擺脫也無處可逃。"
  G6-L03:
    tou_paragraph: "第六段"
    passage: "「噗噗！噗噗！」黃面蜂（狩獵蜂的一種）正在野地上飛來飛去尋找獵物，為蜂卵準備孵化後的食物。黃面蜂發現一個葉苞裡有隻捲葉蛾幼蟲，便飛過去停在捲起的葉子上。因為被牢固的葉苞擋在外面，牠便用觸鬚碰碰葉苞的底部，彷彿在告訴獵物：「殺手來啦！」"
  G6-L04:
    tou_paragraph: "第一段"
    passage: "這位酷老師，如果還活著，年紀和阿里山神木一樣老。他愛唱歌、吟詩，喜歡射箭，還是駕車的好手。他當時教過的學生約有三千人，後人尊稱他為「至聖先師」，他就是孔子。"
  G6-L05:
    tou_paragraph: "第六段"
    passage: "「賓果！哆啦Ａ夢不是普通的機器貓，而是陪伴大雄成長的親密好友；有時像守護神般的呵護著大雄，有時也會糾正大雄的錯誤觀念。他對朋友無私，每當大雄遇到麻煩，他就會提供適當的建議或從百寶袋裡掏出法寶，幫助……」"
  G6-L06:
    tou_paragraph: "第八段"
    passage: "鄧小姐憂鬱起來，她日間茶飯不思，夜裡輾轉反側，心裡不斷反芻：「為什麼是我？我那麼年輕，看重飲食和運動，又沒有過重，無妄之災啊，我為什麼那麼倒楣？」"
  G6-L07:
    tou_paragraph: "第四段"
    passage: "珍古德母女搭船進入保護區，映入眼簾的是險峻的山壁，層層交疊的樹冠，深不可測的密林。叢林中偶爾有黑猩猩的黑影快速飛奔閃過，珍古德又是歡喜又是焦慮：歡喜的是，終於可以展開期盼已久的黑猩猩研究；焦慮的是，如何在長年籠罩迷霧的森林中，追蹤迅疾如風的黑猩猩呢？"
  G6-L08:
    tou_paragraph: "第五段"
    passage: "每年的三至九月，鴕鳥有熱鬧非凡、令人耳目一新的招親活動。平常沉默的雄鳥，卻在活動期間大展身手，一方面發出低沉的叫聲，呼喚著雌鳥；一方面將翅膀尖端的白色羽毛，有節奏的開展和收合，圍繞在雌鳥身旁，瘋狂跳起獨特的求偶舞。"
  G6-L09:
    tou_paragraph: "第四段"
    passage: "好好睡一覺，好處多多。每天晚上睡眠時，當你以為大腦在休息的時候，其實它正在默默的工作，它要修補勞累了一天的肌肉，調整身體各部分的運作，清除新陳代謝物。如果老是睡不夠，等於剝奪了讓身體恢復與修復的時間，長期下來會增加多種疾病發生的風險，包括糖尿病、心血管疾病、癌症、憂鬱、焦慮等。"
  G6-L10:
    tou_paragraph: "第三段"
    passage: "由於全球氣候變遷越來越劇烈，對生物多樣性造成威脅，不僅影響動物的生存，連植物也難以倖免。萬一發生大區域性或全球性的災害時，某些農作物可能從此滅絕，興建種子庫的目的，就是在預防這樣的末日景象，以保護農業作物的多樣性，因此它也被稱為「末日種子庫」。"
  G6-L11:
    tou_paragraph: "第五段"
    passage: "這些古代畫作有個引人深思的特點──「畫中的人物都非常渺小，周圍的山水風景卻極其宏大」，這與現代人喜歡在自拍照中凸顯出自己的習慣，形成鮮明的對比。古代畫家如此安排有其深意，主要在表達面對浩瀚無垠的大自然時，人類是微不足道的。畫中的小人物彷彿是畫家在向觀畫者細語：「看啊！這個世界是如此遼闊壯美，人，不過是滄海一粟罷了。」"
  G6-L12:
    tou_paragraph: "第二段"
    passage: "最近流行跑酷的影音短片，跑酷者幾乎清一色是男生，或徒手，或騎登山腳踏車，他們飛簷走壁、攀越高牆欄杆，從高處後空翻，滾地而下。表演者不知付出多少受傷的代價，才能得到這些看起來英姿煥發的片段。2024 年 10 月，臺中一位高中生因跑酷練習從二樓跳下而受傷昏迷，這只是眾多傷害事例中的一個。其實不只是人類，所有的雄性哺乳類動物都普遍比較喜歡冒險。有兩位人類學家研究日本的短尾猴二十幾年，他們發現剛出生時，公猴和母猴的比例大約是 5：5，但因為大量的青少年公猴死亡，到成年時，這個比例下降到 1：5──一隻公猴：五隻母猴。人類學家仔細檢視 21 年的觀察資料後發現，公猴比較喜歡做危險的動作。例如，從這棵樹跳到那棵樹，母猴總是小心翼翼，寧願爬下樹、走到另一棵樹、再爬上去。但公猴總是自命不凡，認為這點距離易如反掌，奮力一跳的結果是……摔死了。公猴也比較不會審時度勢，喜歡冒險通過附近的公路，結果常常被高速行駛的車輛撞上，一命嗚呼。"
  G6-L13:
    tou_paragraph: "第一段"
    passage: "臺灣有個種樹達人，名叫賴倍元，大家都稱他為賴桑。童年時期的賴桑，喜歡到溪邊抓泥鰍、到樹上摘果實，整天與大自然為伍。十四歲開始，他跟著父親經營家族的運輸事業，工作之餘，就會騎著機車上山看神木。他常仰望著三千多歲的神木，呼吸著森林裡獨特的沁涼空氣，感受到自己生命的短暫與大自然的永恆，所有的煩惱也消失殆盡。他開始思考自己生命的意義，心中有一個願望慢慢成形：我要經營一個事業，一個不會被時間淘汰的事業。這個事業的「員工」，不會鬧脾氣、不會罷工、不會請假、免勞保，而且不用退休金。他決定開始種樹。"
  G6-L14:
    tou_paragraph: "第一段"
    passage: "臺灣有個只有國中學歷的植物獵人，名叫洪信介，大家都稱他為阿介。他是臺灣山林界的傳奇，走入森林 25 年，總共採集了兩萬種植物，是許多博士、教授倚重的助手，沒有博士學位的他，卻是多篇學術論文作者之一。但你知道嗎？他從小過動，不擅長與人相處，在課堂上總是坐不住，成績更是慘不忍睹，在學習路上挫折不斷，44 歲前，只能打零工維生，沒有穩定的工作。所幸，對植物的熱愛促成了他自發性的學習，他在大自然中，找到了屬於自己的祕密花園。在校時課業雖然不好，並沒有因此阻擋他持續汲取植物知識，植物圖鑑是他的精神糧食，不懂就請教專家，最後，連拗口的植物學名也難不倒他，這樣終身學習的努力，奠定了他成為植物獵人的基礎。"
  G6-L15:
    tou_paragraph: "第三段"
    passage: "研究團隊檢驗發現，這隻死亡的藍鯨全身仍有許多軟骨存在，研判是隻不到 2 歲、還在生長期的幼年藍鯨。牠身形削瘦，專家根據遺體狀況及骨骼判斷，小藍鯨生前被海廢漁具繩索纏繞住頭部，時間可能長達 5 至 6 個月，因為小藍鯨時候生長速度快，頭骨兩側被繩索束縛，竟勒出超過 10 公分深、5 公分寬的溝痕，嘴巴也因被勒住無法張嘴進食；解剖發現，小藍鯨近乎空腹，食道和胃裡只有一隻半消化的魚眼睛，體內脂肪幾乎燃燒殆盡，可說牠最終是被活活餓死的，讓人心疼不已，許多人感嘆這是小藍鯨「悲傷的故事」。"
  G6-L16:
    tou_paragraph: "第四段"
    passage: "飛機失事後，哥倫比亞軍方派出上百名特種部隊軍人進入蠻荒叢林，帶著 10 隻搜救犬展開地毯式搜索，還有超過 200 名原住民主動加入志工行列。亞馬遜熱帶雨林植被茂密，被喻為地球上的肺，他們搜索的範圍達 323 平方公里，雨林中的巨樹平均高度為 40 至 50 公尺，且密集度難以讓陽光透入，因此搜救行動倍極艱難，搜救團隊花了超過兩週時間才找到飛機殘骸和三位大人的遺體，但沒有發現孩子們的蹤跡。"
  G6-L17:
    tou_paragraph: "第十一段"
    passage: "我想她心裡一定很納悶，以往去加護病房作法都是偷偷摸摸的，還要喬裝成家屬，經常遭受到醫療人員異樣、甚至不屑的眼神。怎麼現在這位醫師，竟然還會主動的來和她說明病情，簡直太不可思議了！"
  G6-L18:
    tou_paragraph: "第三段"
    passage: "看在眼裡，我突然覺得自己「受騙」了，一定是她拿到比較大的那一半。年紀小嘛，撒賴一下，就可以把餅換回來。真換回來開始吃了，我狼吞虎嚥，兩三下就把餅吃光，再看姊姊，她還在慢條斯理細細品嚐，又甜又香的樣子。我的嫉妒、懷疑一起發作，心裡想：「一定是我原來的那一半比較大。」我百思不解的是，為什麼每次分餅，用盡所有策略，到頭來還是覺得姊姊的餅比我的大？"
  G6-L19:
    tou_paragraph: "第二段"
    passage: "但這次，我繫著這條紅領帶，參加媽媽的告別式。我媽媽在我 13 歲那年，被診斷出得了一種最惡性的胃癌。再來的 11 個月，媽媽承受了所有可能的身體及心理的折磨。但是媽媽用一句聖經裡的話，鼓勵自己，也鼓勵我們。「你們落在百般試煉中，都要引以為大喜樂。」"
  G6-L20:
    tou_paragraph: "第四段"
    passage: "更讓我不安的是，萬一這件事傳開了呢？我們班上的八卦消息總是傳得飛快，如果同學們知道了，會不會開始對我們指指點點？會不會有人拿這件事開玩笑，甚至影響他的心情？光是想像這種場面，我就覺得渾身不自在。教室裡的每一道視線、每一次低聲細語，可能都會讓我坐立難安。我不想變成話題焦點，更不想因為自己的衝動，讓他感到困擾。"
  G6-L21:
    tou_paragraph: "第三段"
    passage: "我的心像被什麼狠狠撞了一下，混亂、震驚、失落，各種情緒交織在一起。這些日子以來的點點滴滴湧上心頭——我們之間的談話、他的笑容、那些讓我悸動的瞬間……這些感覺都還那麼清晰，可是現在，卻已遙不可及。會不會如果我夠勇敢，能早一點向他說出我的心意，我們也會有機會呢？只是如今，這條路，似乎還沒開始，就已經走到盡頭。"
  G6-L23:
    tou_paragraph: "第二段"
    passage: "研究人員追根究柢後才知道，當地的稻子收割後，農民會利用空檔時間轉作紅豆，紅豆播種時遭到大量野鳥啄食。農民為了減少農損，便使用農藥製作毒餌，造成小型鳥類的大量死亡。而猛禽如老鷹、紅隼檢食小鳥的屍體，也因而間接受害。"
  G6-L24:
    tou_paragraph: "第三段"
    passage: "一位當地的村民發現了這緊急情況，他召集了附近的獵人和漁民，冒著嚴寒，用鐵鍬和鏟子努力鑿開冰洞，並且開始餵食白鯨冷凍魚類，這樣做了一個多月。但海水結凍的速度實在太快，救援緩不濟急、資源僧多粥少，體弱的白鯨開始死亡，村民徒勞無功之後，只好請求政府派出救援。"
  G6-L25:
    tou_paragraph: "第三段"
    passage: "這時，荷蘭人有了一個巧妙的構想——大家一起出錢，讓一家公司來主導這類的遠行行動。於是，荷蘭東印度公司（Dutch East India Company）成立了，它是全世界第一家發行「股票」的公司，它把經營公司需要用的錢，分成許多小份，每個小份就是一張股票。如果人們認為這家公司會賺錢，就可以出錢認購它的股票，投資這家公司。只要有許多人投資，公司就可以有足夠的經費組成船隊，揚帆啟航。"
  G7-L01:
    tou_paragraph: "第六段"
    passage: "正是這樣的過去，讓楊喚特別熱衷於兒童文學。然而童詩創作收入微薄，有朋友建議他轉換方向，但他分享道：「童話最難寫，兒童詩更難寫，但我願意學習，因為這樣，我便可以找到失去的快樂了，能和可愛的孩子們一道學，一道笑了。」一個從未擁有幸福快樂童年的人，卻傾盡畢生力氣，在文字中打造無憂無慮的童年王國，為了所有和他一樣經歷苦難的孩子。楊喚的這份心意，直到現在我才讀懂。"
  G7-L02:
    tou_paragraph: "第五段"
    passage: "澳洲國家隊選手除了運動員身份外，大多還有其他的職業，例如醫師、工程師、收銀員等。亦即，他們從運動員的角色退役後，不會有後顧之憂，可以靠著在各行各業的專業技能，得到生涯發展的機會。而這些退役的運動員，在工作之餘也會到社區的運動俱樂部當教練，指導更多的孩子。就這樣形成了良好的循環，鞏固了澳洲穩定的體育人才篩選與訓練系統。"
  G7-L03:
    tou_paragraph: "第四段"
    passage: "這次 NASA 特別關注女性太空人登月是有原因的。長期以來女性太空人的比例非常低，傳統認為高大強壯的男性更適合艱鉅的太空任務，許多太空裝備和任務設定也都為男性設計，這種對女性的偏見，讓科學家無從得知太空活動對女性健康影響的研究。隨著醫學進步，如今科學家認為，女性可能更適合長途的太空任務，因為女性消耗的飲食和氧氣比男性少，在幽閉的環境中情緒與精神表現平均也較為穩定，這些都是女性太空人的優勢。"
  G7-L04:
    tou_paragraph: "第七段"
    passage: "蟋蟀和螞蟻並列，則起源於《伊索寓言》。在寓言故事裡，蟋蟀是一隻鎮日高歌，不知貯糧的天兵，到了冬天只好跟螞蟻伸手乞求，懶惰又沒骨氣。然而，仔細了解後我們會發現，蟋蟀的高歌與螞蟻的存糧一樣，都是生物遵循本能的行動。螞蟻藉由合作，來達成群體繁衍的需求；蟋蟀則透過競爭，延續自己的基因。"
  G7-L05:
    tou_paragraph: "第四段"
    passage: "最大的改變發生在餐桌上，以前爸媽忙於工作，家裡的餐點常常是叫外送或用微波食品快速解決，爺爺奶奶住進來後，餐桌成了全家人溫馨團聚的中心。奶奶總是變魔術似的端出一道道好菜，即使要遵照營養師建議的「三高二低」原則——高蛋白、高鈣、高纖維、低油、低鹽，她仍讓每道菜都美味可口。爺爺也會帶著我們「洗手作羹湯」，像上個週末，我們製作了獨門的醃製醬菜——從上市場挑選新鮮白菜、調配鹽水比例，到把握黃金發酵時間，每個步驟都蘊含著祖輩的智慧。整個過程帶來的不只是口福，更是現代超市裡買不到的珍貴記憶。"
  G7-L06:
    tou_paragraph: "第六段"
    passage: "2024 年巴黎奧運，分別有 5,250 名男性和 5,250 名女性參與，達到男女參賽選手 1:1 的成就。巧合的是，1900 年巴黎奧運扮演著女性參賽的開路先鋒，124 年後同樣在巴黎舉辦的奧運又創下性別平衡的全新里程碑。巴黎，這個城市將在奧林匹克運動史上留下不可抹滅的印記。"
  G7-L07:
    tou_paragraph: "第一段"
    passage: "所謂灰犀牛，指的是正在發生、明明可見的負面事件，但因為沒有急迫性，大家卻視而不見。例如，每天都吃高糖飲料和炸雞，日復一日之後，對國中生的健康一定有壞的影響，但壞影響要很久以後才會發生，許多國中生因此完全不在意，這些高熱量飲食就是他們視而不見的灰犀牛了。"
  G7-L08:
    tou_paragraph: "第三段"
    passage: "他從此離群索居，祕密進行實驗，從停屍間和墓穴找來許多屍塊當作「實驗材料」，將屍塊縫補成人的形狀，幻想他自己可以扮演上帝的角色，讓冰冷的屍體甦醒過來。某個夜晚，他苦心製造的「人」居然慢慢睜開了枯黃遲滯的眼睛，吃力的呼吸，四肢同時痙攣的抽搐著。"
  G7-L09:
    tou_paragraph: "第二段"
    passage: "由於國土狹小，地勢又低，在全球暖化、海平面持續上升的威脅下，吐瓦魯已有兩座島嶼逼近被淹沒的臨界點，其他島嶼也岌岌可危。這個有「南太平洋天堂」之稱的國家即將面臨滅頂的命運，全國沉入海底只是遲早的問題。如果你是吐瓦魯的人民，你該怎麼辦？"
  G7-L11:
    tou_paragraph: "第六段"
    passage: "2024 年有一項研究指出，當我們閱讀故事時，如果作者是人類，我們更容易產生情感共鳴；但如果是 AI 寫的，即使語氣溫暖、詞藻優美，仍讓人覺得少了點「人味」。這種「人味」其實是作者真實經歷過的人生—那些磨難與挫折、喜悅與感動、成長與覺悟——都是 AI 無法真正體會的。"
  G7-L12:
    tou_paragraph: "第三段"
    passage: "根據民國 111 年施行的《跟蹤騷擾防治法》（簡稱《跟騷法》），若違反他人意願，反覆或持續針對特定人做出與性或性別有關的行為，例如監視跟蹤、反覆跟隨、不斷傳送訊息或一再告白，導致對方感到恐懼、焦慮，影響其學習、工作或日常生活，就構成了「跟蹤騷擾」。阿哲的行為——守候、追問、強塞情書——看似深情，卻已符合跟騷的特徵。這些舉動並非浪漫，而是對人際界線的侵犯，可能已經觸犯法律。"
  G7-L13:
    tou_paragraph: "第五段"
    passage: "「綠色賽事」的具體作法，就是落實「環保 3R」：1.Reduce（減少使用）：減少碳足跡、減少消耗資源、減少垃圾。2.Reuse（物盡其用）：重複使用器材及裝備。3.Recycle（循環回收）：使用再生能源、使用再生材料。"
  G7-L14:
    tou_paragraph: "第六段"
    passage: "儘管這些行為看起來無傷大雅，但它們對我們的社會及特定群體造成的影響卻很深遠。例如，特別強調某些群體的特性，或對弱勢群體表現出過度的憐憫，日積月累，滴水穿石後，這些說法逐漸滲透到每一個人的價值觀中，不但說話的人無感，甚至連長期受到微歧視的群體，也可能漸漸內化這些偏見，進而對自己產生負面的觀感。"
  G7-L15:
    tou_paragraph: "第三段"
    passage: "福爾摩斯把觀察所得結合他對背景知識的理解，做出了令人拍案叫絕的推理。這裡的推理三要素是："
  G7-L16:
    tou_paragraph: "第一段"
    passage: "2023 年 3 月，含金量最高的世界柑橘類果醬大賽在英國的一個小城市舉行。來自世界各國的參賽選手帶著他們得意的作品雲集在這裡，經過重重考驗，一位出身臺南柳營山村的年輕人脫穎而出，虜獲評審的味蕾，最終拿下了一金二銅的成績。"
  G7-L17:
    tou_paragraph: "第二段"
    passage: "有位 72 歲的老太太獨居在美國康乃狄克州的一個城市裡。這天是感恩節，外面大雪紛飛。中午，鄰居的媽媽烘了一個餅，請小孩送到老太太家，希望她在團圓的節日裡，不致於太孤苦伶仃。"
  G7-L18:
    tou_paragraph: "第二段"
    passage: "我和妹妹是阿公阿嬤養大的，爸媽在我小時候就離開了，家裡就只有四個人。約莫 5 年前，阿嬤開始會時常莫名對阿公發脾氣、怪罪阿公年輕時對她有多壞，頻率 2—3 天一次，每次約 1 個鐘頭。一年多前，我離家求學，妹妹多數時間在外打工，家裡少了我們居中協調，阿嬤發脾氣的次數與日俱增，頻率增加為 1—2 天一次，每次 2—3 個鐘頭。更嚴重的是，從今年年初開始，阿嬤開始指控阿公偷她的錢，甚至認為阿公與銀行聯手騙她，因此跑到數間銀行大鬧，多次遭人報警帶離現場。此時，阿嬤發脾氣的頻率已攀升到每天 2—3 次，每次 2—4 個鐘頭，近來更是會揮舞菜刀、朝阿公丟尖銳物品。"
  G7-L19:
    tou_paragraph: "第五段"
    passage: "第一組有三位同學，分別扮演父親、兒子和茶房。演的是父親起先囑託茶房陪兒子同去，後來改變主意，決定親自送兒子去浦口車站的情節。演出時，父親對茶房鉅細靡遺的交代，兒子則在一旁抱胸而立，表現出不置可否的樣子。演完後，老師在黑板上畫出三人互動的示意圖。"
  G7-L20:
    tou_paragraph: "第六段"
    passage: "然而，阿政看的這兩部影片都有問題，影片製作者的描述方式看起來像科學，但訊息並不完整，容易讓觀眾信以為真，誤入偽科學的迷魂陣。"
  G7-L21:
    tou_paragraph: "第一段"
    passage: "寫作文時，文章必須緊扣題目，是每個人都懂的道理，如果文不對題，一定會被老師扣很重的分數。但在日常生活中卻常常看到「題不對文」的現象，尤其是新聞報導—記者完成文章後，下標題時故意添加一些調味料，讓標題變得辛辣、浮誇，也就是閩南語所說的「重鹹」、「重口味」，目的是為了吸引閱聽大眾點擊閱讀或收看，我們稱這種標題為「誘餌式標題」或「釣魚式標題」。"
  G7-L22:
    tou_paragraph: "第五段"
    passage: "教主終於決定回她的房間去接收外星人的啟示。出來後，她告訴信眾：「你們的虔誠，外星人接收到了，外星人很感動，決定寬恕世人的罪孽，不再毀滅地球了，你們拯救了世界」。"
  G7-L24:
    tou_paragraph: "第五段"
    passage: "「你的任務之一，」他把平板遞給她，「就是每天巡檢數據：看哪一區的酸鹼值或肥料配方偏離了、哪一層的溫溼度曲線不正常。問題能自己排除就儘快排除，必要時回報，讓值班同事去校正或調整配方。」　盯著平板看，螢幕上跳動的數字像心電圖，她緊張的心情，忽然有了一種奇妙的踏實感：原來讀圖表、看趨勢、抓異常也是在種菜。"
  G7-L25:
    tou_paragraph: "第六段"
    passage: "根據她的經驗，如果你正在經歷網路或關係霸凌，第一步是「不要一個人扛」，求助不是示弱，逞強硬撐只會使自己孤立無援。這不是玻璃心，是你在被傷害。把你的委屈說給信任的大人聽——導師、家長、輔導老師都可以。你願意開口，就是在黑暗裡點一盞燈，有人能陪你一起解決問題，終有撥雲見日的一天。"
  G7-L26:
    tou_paragraph: "第二段"
    passage: "釀小米酒的過程十分講究。許多部落由女性負責釀酒，她們挑最好的小米，蒸熟後慢慢攤開放涼，讓米的香氣自然散開。等到溫度適中，再與酒麴混在一起，放進陶甕裡靜置，等待發酵。釀酒的過程裡，族人遵守各種禁忌：手要乾淨，心要平靜，不可以罵人，也不能帶著怒氣……。因為這甕酒不是一般的飲品，而是要獻給祖靈、或與族人分享的。如果心不淨，酒就不會順；如果語氣不敬，酒也不會香。釀酒的每個步驟都莊嚴以對，充滿對天地、祖靈與族人的禮敬。"
  G8-L01:
    tou_paragraph: "第四段"
    passage: "下了車，站前廣場依舊熱鬧，麻糬意料之中地售完，在陣陣阿粨的月桃葉香中，看見青草茶店的客人仍絡繹不絕。再往前走，是你一貫的熱情閃耀，以湛藍無邊的天際擁我入懷。"
  G8-L02:
    tou_paragraph: "第十三段"
    passage: "爸爸九十歲生日那天，我們把當年他阿公用來養家那把鏽跡斑斑的老斧頭裱裝加框，送給爸爸當禮物。斧頭旁的卡片上有爸爸顫危危的筆跡：「紀念那個貧無立錐，卻彼此相愛的日子」。"
  G8-L03a:
    tou_paragraph: "第五段"
    passage: "集中營裡食物匱乏，一口麵包都可能關乎生死，但仍有些瘦弱到像骷髏的難友，走過囚房，向更孱弱的難友問好、為他們禱告，甚至把最後一口麵包分享出去。這讓　深受感動，也領悟到：即使情況壞到極點，人仍能決定自己道德與品格的高度。"
  G8-L04:
    tou_paragraph: "第八段"
    passage: "一時之間，同學們的回應此起彼落。雅柔說：「我對顏家的悲傷痛苦可以感同身受，自己的孩子早上好好的去上學，上個體育課就天人永隔了。而一審法官的意思是，這沒辦法，大家都不是故意的，沒有人需要負責。如果是我，我會先哭死，再氣死。」"
  G8-L05:
    tou_paragraph: "第九段"
    passage: "有次事件最令人驚心動魄。那晚，戲院前的廣場傳來一陣喧嘩，一名男子手持武士刀追逐另一人，朝著我家的方向奔來。被追上的人情急下抓起戲院門口的鐵椅擋刀，刀鋒削進椅腳，紛亂中持刀人被制伏。整個過程僅數分鐘，但別說小孩，連大人都驚駭不已。"
  G8-L06a:
    tou_paragraph: "第二段"
    passage: "可可樹分布在赤道附近的熱帶地區，其中西非地區的象牙海岸、迦納、奈及利亞、喀麥隆等國，供應了全球70%左右的可可豆。可可果不像蘋果、橘子那樣長在細細的枝頭上，它像一顆小型橄欖球，直接生長在樹幹和粗壯的枝條上，採收時，工人必須彎腰或仰頭，用彎刀或長柄刀具砍下來，剖開果殼，取出裡面的可可豆。"
  G8-L06b:
    tou_paragraph: "第六段"
    passage: "你可能會好奇，為什麼歐洲人攜帶這麼多致命的病菌，自己卻不會生病？"
  G8-L11:
    tou_paragraph: "第三段"
    passage: "要解決這個問題，花農必須先找到幾個可能催促開花的因素，以科學方法確認真正能催花的因素後，再想方設法降低成本，在農園實踐出來。"
  G8-L12a:
    tou_paragraph: "第二段"
    passage: "這裡所說的「啦啦隊」，是指競賽時在場邊加油、歡呼、吶喊助陣的隊伍，也有人稱為「應援團」。隨著職業運動產業的成熟，啦啦隊已蛻變成一種有價值、需要高度專業能力的職業工作。她們並不是單純的舞蹈表演，在賽場上，啦啦隊透過節奏鮮明的樂曲與口號，將數千名球迷零散的加油聲轉化為整齊有力的音浪，讓所支持的球隊氣勢如虹。每當全場齊聲吶喊時，那種排山倒海的聲勢，往往能在關鍵時刻帶來心理上的鼓舞。"
  G8-L12b:
    tou_paragraph: "第四段"
    passage: "這種教養方式，對我心理韌性的養成有莫大助益。"
  G8-L14:
    tou_paragraph: "第三段"
    passage: "於是，一個爭議的問題浮上台面：如果石虎在原棲息地裡越來越難存活，我們該不該「幫牠換個地方」呢？保育界對這個「物種遷移」的議題有非常不一樣的想法。"
  G9-L01:
    tou_paragraph: "第三段"
    passage: "心理學家因此提出了「旁觀者效應」的理論，來解釋這個現象。"
  G9-L02:
    tou_paragraph: "第二段"
    passage: "戰火中價值萬金的家書不僅安然抵達了八百里外的故鄉——秦國安陸，而且最終還被收信人帶進了自己的墳墓。1975年，這批竹簡出土，使得我們今天有幸窺見那個龐大帝國底層民眾的血淚和悲哀。"
  G9-L03:
    tou_paragraph: "第五段"
    passage: "其實，人類的文明發展，就是一部把能力、經驗與知識「外化」的歷史。當人類祖先執起長竿打落樹上的果實，或撿起石子丟向獵物時，他異於禽獸之處，在於把自身的力量外化到長竿和石子上了；當最早使用語言的祖先，大喊：「有蛇！」以警告旁人時，他異於禽獸之處，在於把感官經驗外化成語言，將攸關生命的警報分享給同伴。六千年前，語言被外化成書面文字，知識得以有系統的被保存，讓今人仍然可知二千五百年前孔子講了什麼，人類的溝通因此得以跨越時空。二十世紀的圖書資訊專業，將數千年來累積的知識從書籍外化到圖書館；而二十一世紀電腦、網路及行動裝置的興起，又讓圖書館被外化到網路上。"
  G9-L04:
    tou_paragraph: "第一段"
    passage: "上海、新加坡、南韓、日本的學生有一項特質讓全世界望塵莫及——這些國家的近視率愈來愈高，中學生的近視率高達80-90%。而臺灣，根據衛福部的調查，小一近視率22%，小六66%，國三77%，高三85%。高中畢業典禮現場，一片「鏡光閃閃」。視力正常、不必戴眼鏡的學生鳳毛麟角。"
  G9-L05:
    tou_paragraph: "第七段"
    passage: "再者，不少加害者和被害者處於「權力不對等」的關係，例如導演與演員、上司與部屬、明星與粉絲、老師與學生、長輩與晚輩等。站在權力高處的人可能展現出愛護、關心對方的舉動，讓人一開始不以為意；而權力低的受害者可能擔心說出來會被報復，或是不被相信。"
  G9-L07:
    tou_paragraph: "第六段"
    passage: "米田堡血型是指紅血球外層的紅血球膜上有較多的「帶三蛋白」，這種蛋白的主要功能是協助人們把體內的二氧化碳（CO₂）由肺部呼氣排出體外，就像是細胞膜上開了很多道小門，讓二氧化碳能夠透過這些小門更快排出體外。據此，我們推論有米田堡血型的人排出二氧化碳的能力應該會比一般人強。為了檢驗這個想法，我們就進一步想看看「米田堡血型」和「非米田堡血型」的人們，運動後代謝二氧化碳的效率是否有所差異。"
  G9-L10:
    tou_paragraph: "第三段"
    passage: "長跑是有氧運動，跑步時，肌肉會大量耗氧，怎麼讓運動員的身體可以運送更大量的氧氣，就成了訓練的重要課題。一個常見的方法是「高地訓練」——讓運動員在高海拔地區接受訓練。高地空氣稀薄、氣壓低，會讓運動員血液中運送氧氣的紅血球和血紅素大幅攀升，心肺功能及耐力便因此有所進步。許多人認為基普喬吉和肯亞的馬拉松健將可以一再跑出破世界紀錄的成績，他們的高地訓練功不可沒。但，高地訓練真的對每個運動員都有幫助嗎？"
  G9-L11:
    tou_paragraph: "第三段"
    passage: "為了解開謎題，達爾文用一根細長的探針，小心的插入那條花距，探針越插越深，最後，在花距的末端，他採到了花蜜。有花蜜，表示蘭花的確是靠吸蜜的昆蟲完成授粉的！"
  G9-L12:
    tou_paragraph: "第三段"
    passage: "福衛八號是一支由8顆光學遙測衛星組成的「衛星星系」，從2025年起逐年發射，到2031年全部就位，形成一套縝密周延的觀測系統。這些衛星會在地球上空約561公里的太陽同步軌道運行，彼此分工合作、相互接力，就像一支日夜不休的巡邏隊，輪流飛過臺灣和周邊地區的上空拍攝。"
  G9-L14:
    tou_paragraph: "第八段"
    passage: "一名女子從倫敦地鐵避難所回家，裙腳還沾著灰塵。她家那條街已成廢墟，但她受訪時並未呼天搶地，只平靜幽默的說：「炸得還可以，沒打破我的茶壺。」當時英國人用「克制的上唇（stiff upper lip）」來形容這種面不改色的心理韌性。隨著大眾媒體的報導，「克制的上唇」成了英國的文化象徵，成了對恐懼集體免疫的預防針，更成了「我們撐得下去」的證據。"
