# 念順順起訖抽取的 golden set
#
# ⚠️ 2026-08-24 改寫過一次，因為**規則本身換了**，不是因為抽取器變好或變壞。
#    舊值鎖的是「☞ 起點段 → 右緣累計字數欄末筆落在的那一段」這個範圍規則
#    （12 課裡 11 課 end > start，中位 393 字）。靖杭比對紙本學習單後推翻：
#
#      > 從教授指定的段落，v3 會直接提取到結束，並沒有提取出該段落，
#      > 而是將該段落以下的內容全部提取了
#
#    現在的規則是 2026-07-20 專家審查定的**只取指定的那一段**，所以 end == start
#    恆成立，字數＝那一段自己的長度。累計字數欄不再參與判斷（它是「一分鐘能讀到
#    哪」的量尺，不是段落長度）。
#
# ⚠️ 原本的收錄原則（「計數欄吻合率的邊緣值」）連同範圍規則一起失效 —— 沒有計數欄
#    門檻了，就沒有「吻合率 63% 會不會被誤擋」這回事。**但收錄原則要有邊緣值這件事
#    本身仍然成立**，只是邊緣換了位置。新規則真正會踩的雷：
#
#      ① 段號重編（同一課出現兩個「二」）→ 挑錯那一個
#      ② 指定段很短（11 字、32 字）→ 被長度門檻誤擋，這正是 2026-08-24 那次
#         regression 的同一種死法（用門檻擋雜訊，順手擋掉真資料）
#      ③ 指定段很長（339 字）→ 被誤認成「已經跨段了」而去截斷
#      ④ 兩位數段號「十三」、注音「ㄧ」(U+3127) → 數字解析
#
#    only 典型樣本 = 這份 golden set 跟沒有一樣。

must_resolve:
  # uid: [start_idx, end_idx, 字數, 為什麼收這課]
  # end_idx 恆等於 start_idx —— 若哪天有人讓它們不相等，這 12 課會同時紅。
  L0140: [13, 13, 11, "🔴 邊緣：全庫最短。第十三段就是「這個故事有三個大轉折。」11 字，自己一個段號自己一行；14/15/16 是各自編號的「第一次/第二次/第三次轉折是…」。短≠錯，但 11 字不是一分鐘的量 → 抽取器標 short_marked_paragraph 送人看"]
  L0122: [6, 6, 32, "🔴 邊緣：32 字，而且**一版人工掃描逐字吻合** —— 短passage 是對的，這課是硬證據"]
  L0010: [2, 2, 66, "🔴 邊緣：書信體，段號重編成 1..4 再 1..8，全課有兩個「二」。指定的是第二個（start_text「說實話，我以前也覺得…」），一版真值逐字吻合。舊值寫 6 是**位置序**、這裡的 2 是**印在紙上的段號** —— 同一段、兩套座標，正是 #2720 的病灶"]
  L0039: [5, 5, 339, "🔴 邊緣：339 字，落在舊規則「約 300-400 字」的正中央 —— 單段本來就可能這麼長，不可以用長度回推「一定跨段了」"]
  L0034: [6, 6, 322, "🔴 邊緣：322 字，同上"]
  L0011: [3, 3, 136, "最基本的形狀：舊值 (3,4,379) 把下一段一起吃掉"]
  L0013: [7, 7, 79, "舊值 (7,11,341) 一路吃 5 段 —— 舊規則說跨段是常態，新規則說那就是 bug"]
  L0143: [3, 3, 144, "舊值 (3,4,170)"]
  L0173: [6, 6, 186, "舊值 (6,8,453)"]
  L0054: [5, 5, 102, "舊值 (5,8,468)"]
  L0047: [7, 7, 123, "舊值 (7,9,393)"]
  L0001: [4, 4, 98, "舊值 (4,6,405)。指示句印的是「四」，直接用，不必再靠計數欄段界投票打破平手 —— 少一個訊號就少一個錯的機會"]

must_not_resolve:
  # uid: [預期的 verdict, 為什麼收這課]
  # 這些課出貨時**不可以有 passage**。抽取器寧可不給，也不給一段沒人畫過的。
  L0153: ["whole_text_reading", "🔴 邊緣：文言文，指示句是「請用計時器，朗讀原文」—— 根本沒有「指定段落」。沒有錨點就沒有段，不是抽取失敗"]
  L0154: ["no_anchor", "🔴 邊緣：有 key_reading 那一節、卻解不出段號。解不出就不給 —— 猜一段出來才是 #2712"]
  L0021: ["no_key_reading", "整課沒有念順順這一節（閱讀策略課）。API 要回 None 讓前端 fallback 唸全文"]

# 舊 must_not_resolve 移除了 6 課（L0141 L0091 L0083 L0090 L0125 L0092），理由記在這裡
# 而不是默默刪掉 —— 縮小覆蓋範圍是 gate 最常見的死法：
#
#   L0141 L0091 L0083 L0090 L0125 —— 它們當初擋下來的原因全是**計數欄認錯東西**
#     （誤收參考書目網址 DxTaipeiChange、表格數字 90200020102020、圖說「90歲阿嬤的
#     衛生紙全國電子」、「參與奧運會的比率，圓形圖則是」、「難救助獎學金。」）。
#     新規則不讀計數欄，這一整類失敗就不存在了，五課現在都從錨點乾淨解出。
#     **L0125 解出來的還與一版人工掃描逐字吻合**，證明「解得出」是對的，不是放水。
#
#   L0092 —— 舊註記說「XML 算出的值與現存資料一致（都是 252 字）但 vision 看到 ☞ 在
#     第二頁的另一段，待人看圖」。新規則下它從指示句解出錨點並取單段，與那筆 252 字
#     的範圍值無關，舊的疑慮不再適用。⚠️ 但「☞ 到底在哪一段」這個問題本身沒被回答，
#     只是不再由這條測試把關 —— 若要續查，看 issue #2805。
