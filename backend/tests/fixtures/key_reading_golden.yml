# 念順順起訖抽取的 golden set
#
# ⚠️ **2026-08-30 整組再次改寫 —— 規則又換了，而且是換回來。**
#
# 起因：明珠老師 2026-08-29 透過 Hans 回報，測段落閱讀流暢度需要**至少 300 字**，
# 學習單上「☞ 是開始，但學生要讀的是講義右方有標字數的**全部段落**」。
# 當時服務端 passage 中位數只有 144 字、只有 4/160 達 300 字 —— 老師測不了。
#
# ## 2026-08-24 那次改寫的兩條依據，現在都站不住
#
# ① 「規則是 2026-07-20 專家審查定的只取指定的那一段」——
#    那次審查（曾世傑教授）自己定的是「重點段落，**約 300–400 字**」
#    （docs/PRD.md:1602、docs/reading-key-passage-TODO.md:3）。
#    「只取一段」中位數 144 字，**跟它自己引用的專家決策互相矛盾**。
#
# ② 靖杭比對紙本後說「v3 會直接提取到**結束**…將該段落**以下的內容全部**提取了」。
#    那個觀察是對的，但描述的是**另一種**抽法（☞ → 文末）。
#    實測這份資料：**115 課提早停、只有 23 課抽到文末**（L0005 是 1→7 而課文有 14 段）。
#    他否決的是「抽到文末」，這裡要的是「抽到**累計字數欄末筆落在的那一段**」。
#
# ## 這一版的期望值怎麼來的
#
# 不是抄舊值，是**拿二修學習單自己印的累計字數欄當裁判**（每一課列在下面）。
# 決定性證據是 Owner 拍的 L0003 實體學習單：☞ 在第七段，而第七段**第一行**的
# 數字就是 28 —— 若從文章開頭算不可能是 28，所以那欄是**從 ☞ 開始累計**，
# 末筆直接就是該唸的字數。
#
# ⚠️ 舊註解說 L0122「32 字，一版人工掃描逐字吻合」、L0010「一版真值逐字吻合」——
#    **那是真的，但那是一版**。一版的念順順就是一段，二修改成跨段了：
#      L0122  一版 32 字 → 二修學習單末筆 351（這裡 355）
#      L0010  一版 66 字 → 二修學習單末筆 330（這裡 326）
#    golden set 拿一版當正解，就是在測錯的版本。
#
# ## 收錄原則（不變）：兩邊都要有邊緣值
#
# 新規則真正會踩的雷：段號重編（同一課兩個「二」）、累計欄提早停 vs 抽到文末、
# 兩位數段號、注音「ㄧ」(U+3127)。only 典型樣本 = 這份 golden set 跟沒有一樣。

must_resolve:
  # uid: [start_idx, end_idx, 字數]  ← 後面註解記「二修學習單末筆」與收錄理由
  L0140: [13, 19, 410, "🔴 邊緣：段號重編 —— 第 13 段自己 11 字，14/15/16 是各自編號的「第一次/第二次/第三次轉折」。舊規則鎖 11 字（只有第 13 段），新規則到 19 段共 410 字（學習單末筆 408）。擋的是挑錯段號起點"]
  L0122: [6, 9, 355, "🔴 邊緣：版本切換的硬證據 —— 一版人工掃描逐字吻合 32 字（**一版真的只有一段**），二修學習單末筆 351、跨到第 9 段。拿一版當正解就會把二修判成錯"]
  L0010: [6, 12, 326, "🔴 邊緣：段號重編 —— 書信體，1..4 之後再 1..8，全課有兩個「二」。一版真值 66 字（一版是一段）；二修末筆 330。擋的是挑錯那一個「二」"]
  L0039: [5, 5, 339, "🔴 邊緣：**單段就是對的** —— 學習單末筆 339 == 該段自己 339 字。跨段規則不可以把它硬拉長，這是反向邊緣（防「用長度回推一定跨段了」）"]
  L0034: [6, 7, 466, "學習單末筆 462｜長段邊緣"]
  L0011: [3, 4, 379, "學習單末筆 376｜最基本的形狀：☞ 段 + 下一段"]
  L0013: [7, 11, 341, "學習單末筆 336｜跨 5 段，範圍較長的邊緣"]
  L0143: [3, 5, 308, "學習單末筆 350｜🔴 **本課仍存疑**：char_marks_cover_paragraphs 說 3–5，照它組出 308 字，但學習單末筆是 350（差 42）——段界或算法還有一處對不上，已標 needs_human_review。收進 golden set 是為了讓它被看見，不是背書"]
  L0173: [6, 8, 453, "學習單末筆 453｜學習單末筆 453 == 資料 453，一字不差"]
  L0054: [5, 8, 468, "學習單末筆 478｜學習單末筆 478 vs 資料 468（差 10，段界算法差異）"]
  L0047: [7, 9, 393, "學習單末筆 410｜學習單末筆 410 vs 資料 393（差 17）"]
  L0001: [4, 6, 405, "學習單末筆 400｜學習單末筆 400 vs 資料 405（差 5，標點/空白算法差異）"]

must_not_resolve:
  # uid: [預期的 verdict, 為什麼收這課]
  # 這些課出貨時**不可以有 passage**。抽取器寧可不給，也不給一段沒人畫過的。
  L0153: ["whole_text_reading", "🔴 邊緣：文言文，指示句是「請用計時器，朗讀原文」—— 根本沒有「指定段落」。沒有錨點就沒有段，不是抽取失敗"]
  L0154: ["no_anchor", "🔴 邊緣：有 key_reading 那一節、卻解不出段號。解不出就不給 —— 猜一段出來才是 #2712"]
  L0021: ["no_key_reading", "整課沒有念順順這一節（閱讀策略課）。API 要回 None 讓前端 fallback 唸全文"]

# 舊 must_not_resolve 移除了 6 課（L0141 L0091 L0083 L0090 L0125 L0092），理由記在這裡
# 而不是默默刪掉 —— 縮小覆蓋範圍是 gate 最常見的死法：
#
#   L0141 L0091 L0083 L0090 L0125 —— 它們當初擋下來的原因全是**計數欄認錯東西**
#     （誤收參考書目網址 DxTaipeiChange、表格數字 90200020102020、圖說「90歲阿嬤的
#     衛生紙全國電子」、「參與奧運會的比率，圓形圖則是」、「難救助獎學金。」）。
#     新規則不讀計數欄，這一整類失敗就不存在了，五課現在都從錨點乾淨解出。
#     **L0125 解出來的還與一版人工掃描逐字吻合**，證明「解得出」是對的，不是放水。
#
#   L0092 —— 舊註記說「XML 算出的值與現存資料一致（都是 252 字）但 vision 看到 ☞ 在
#     第二頁的另一段，待人看圖」。新規則下它從指示句解出錨點並取單段，與那筆 252 字
#     的範圍值無關，舊的疑慮不再適用。⚠️ 但「☞ 到底在哪一段」這個問題本身沒被回答，
#     只是不再由這條測試把關 —— 若要續查，看 issue #2805。
