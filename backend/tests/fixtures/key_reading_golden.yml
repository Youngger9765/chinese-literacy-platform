# 念順順起訖抽取的 golden set（#2912，2026-08-24）
#
# ⚠️ 為什麼要有這份：2026-08-24 我加了一道「相鄰兩格的差 ≈ 行長」的比率門檻擋雜訊，
#    造成 20 課 regression。當時我也有回測組 —— 但那組**只挑了本來就會過的課**，
#    全都在門檻之上，所以什麼都抓不到。
#
# 🔴 收錄原則：**兩邊都要有邊緣值**
#    must_resolve 要包含「勉強會過」的（L0054 吻合率 63%、L0173 69%）
#    must_not_resolve 要包含「差點會過」的（L0091 吻合率 87%，比某些真的還高）
#    只收典型樣本 = 這份 golden set 跟沒有一樣

must_resolve:
  # uid: [start_idx, end_idx, 字數, 為什麼收這課]
  L0011: [3, 4, 379, "數字跨到下一段 —— 最基本的形狀，Young 逐行看過原稿確認"]
  L0013: [7, 11, 341, "跨 5 段 —— 證明跨段是常態不是缺陷"]
  L0039: [5, 5, 339, "單段 —— 數字沒跨段時 start==end"]
  L0010: [6, 12, 326, "書信體：段落 idx 會重編（1..4 再 1..8），不能用 idx 定址"]
  L0143: [3, 4, 170, "多錨點 [3,5,6,7,8] → 計數欄段界投票解出 3"]
  L0122: [6, 9, 355, "多錨點 [6,11] → 11 在最後一個數字之後所以排除"]
  L0173: [6, 8, 453, "🔴 邊緣：計數欄吻合率 69%，被我的 70% 門檻誤擋過"]
  L0054: [5, 8, 468, "🔴 邊緣：吻合率 63%，更低，同樣被誤擋過"]
  L0047: [7, 9, 393, "🔴 邊緣：吻合率 67%"]
  L0034: [6, 7, 466, "🔴 邊緣：計數欄數字**單獨成行**（文字在上一行），只接『同行』版面會誤報找不到計數欄"]
  L0001: [4, 6, 405, "🔴 邊緣：多錨點 [3,4] 段界投票 0:0 平手 → 用指示句印的「四」打破"]
  L0140: [13, 19, 410, "🔴 邊緣：☞ 錨點抓不到 → 用指示句「十三」+ 計數欄段界背書"]

must_not_resolve:
  # uid: [預期的擋下原因關鍵字, 為什麼收這課]
  L0141: ["定位不到", "計數欄誤收參考書目網址 DxTaipeiChange"]
  L0091: ["定位不到", "🔴 邊緣：誤收表格數字 90200020102020，但吻合率 87% 比某些真的還高"]
  L0083: ["定位不到", "誤收圖說「90歲阿嬤的衛生紙全國電子」"]
  L0092: ["錨點", "🔴 XML 算出的值與現存資料一致（都是 252 字），但 **vision 看到 ☞ 在第二頁的另一段** —— 兩個一致的訊號可以同時錯，因為現存值本來就來自類似抽法。待人看圖"]
  L0090: ["定位不到", "誤收「參與奧運會的比率，圓形圖則是」"]
  L0125: ["定位不到", "誤收「難救助獎學金。」"]
  L0001: ["錨點", "多錨點 [3,4] 投票 0:0 平手 —— 平手就不准挑"]
