  question:
    kind: graphic_text_integration
    strategy_name: 圖文整合閱讀策略（初階）
    instruction: 說明：圖文題在近年會考國文科的比重大幅增加——114年會考圖文題有9題，但十年前（105年）的會考卻只有1題。圖文題就是「文字帶著插圖」的題目，你不能只看文字，也不能只看插圖，眼睛必須在文字和插圖中來回移動，把文圖之間的關係弄清楚，才能又快又正確地答題。這一課我們就用一個科學史上有名的實驗，來學習如何閱讀、解答圖文題。
    steps:
    - prompt: 1.圖一的標題是：   巴斯德的鵝頸瓶實驗的設計與程序
      type: free_text
      answer: null
      reference_answer: null
    - prompt: 2.實驗共有幾個情境？    三    個。
      type: free_text
      answer: null
      reference_answer: null
    - prompt: 3.圖一用什麼方式呈現實驗？（單選）
      type: select
      options:
      - 用箭頭呈現三個實驗情境的進行方式與結果
      - 用顏色呈現三種肉湯的不同味道
      answer: 0
    - prompt: 4.圖一整體來看，這張圖最像在比較什麼？（單選）
      type: select
      options:
      - 肉湯在什麼情境下會產生改變？
      - 肉湯加熱後，會產生什麼改變？
      answer: 0
    - prompt: 5.根據圖一，你猜這篇文章最可能想回答哪一個問題？（單選）
      type: select
      options:
      - 肉湯顏色和加熱的時間長短有沒有關係
      - 肉湯腐敗和瓶子的處理方式有沒有關係
      answer: 1
    - prompt: 1.這是一篇科學性文章，段1～2，主要在描述研究的什麼？（4選2）
      type: free_text
      answer: null
      reference_answer: null
    - prompt: 2.段3主要描述這個研究的什麼？（單選）
      type: free_text
      answer: null
      reference_answer: null
    - prompt: (1)「鵝頸瓶保持開口，外界空氣仍可進入，但空氣中的微生物會被彎曲的瓶頸攔住，沉積在頸部，因此無法進入瓶中的肉湯」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
      type: free_text
      answer: null
      reference_answer: null
    - prompt: (2)「將瓶頸折斷，空氣中若有微生物，就會掉進湯裡」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
      type: free_text
      answer: null
      reference_answer: null
    - prompt: (3)「把瓶身傾斜，讓肉湯流到瓶口」這句，圖一的哪一部分在描述這段文字？結果如何？（單選）
      type: select
      options:
      - ⒈情境①-瓶頸彎曲，瓶口保持開放肉湯沒有腐敗
      - ⒉情境②-瓶頸被打斷，瓶口直接外露肉湯臭了
      answer: 0
    - prompt: 3.段4主要描述這個研究的什麼？
      type: free_text
      answer: null
      reference_answer: null
    - prompt: 下面哪一句，最能把文字和插圖的意思一起說清楚？（單選）
      type: select
      options:
      - 巴斯德比較三種情況後發現，肉湯腐敗和微生物污染有關
      - 巴斯德比較三種情況後發現，只要肉湯接觸空氣就會腐敗
      answer: 0
