  text: 白尾八哥  較不怕人  ，又   較會利用人造設施築巢  ，適應都市環境較強，所以在都市化的環境中比較容易生存，族群逐漸增加；
- id: p3
  type: paragraph
  text: 臺灣冠八哥  較怕人，又  較少利用人造設施築巢   ，適應都市環境較弱，因此族群逐漸減少。
- id: ex-spotlight
  type: exercise
  question:
    kind: graphic_text_integration
    strategy_name: 圖文表整合閱讀策略
    instruction: 說明：閱讀有圖或有表的文章時，不能只看文字，而要來回比對圖、表與文章內容，理解彼此之間的關係。這樣不但能更快掌握重點，也能更正確地回答問題。這一課，我們將以〈都是八哥，為什麼命運不一樣？〉為例，學習有表格文章的閱讀方法。
    steps:
    - prompt: 1.圖一最主要提供哪一類訊息？（單選）
      type: select
      options:
      - 兩種八哥外形相近的整體印象
      - 兩種八哥近年的族群變化情形
      answer: 0
    - prompt: 2.讀完第一段後，請你找出和圖一最相關的文字。（單選）
      type: select
      options:
      - 白尾八哥的數量已經遠遠超過臺灣原生種的臺灣冠八哥。
      - 這兩種八哥外形十分相似，不容易單靠外表一眼分辨。
      answer: 1
    - prompt: 1.請把第二段文字中，要你看表的地方畫線或圈起來
      type: free_text
      answer: null
      reference_answer: null
    - prompt: 2.這段要你看表的什麼？（單選）
      type: select
      options:
      - 八哥的外形與習性
      - 八哥的數量變化
      answer: 0
    - prompt: 1.表一主要提供的是哪一類訊息？（單選）
      type: select
      options:
      - 白尾八哥和臺灣冠八哥近年的族群變化
      - 白尾八哥和臺灣冠八哥的異同
      answer: 1
    - prompt: 1.第二段說兩種八哥「外表相似」，表一中哪些資料可支持這句話？（複選）
      type: multi_select
      options:
      - 全身大致為黑色
      - 身形大小接近
      - 常在地面走動覓食，吃昆蟲、果實
      - 都屬八哥屬、留鳥
      answer: &id001
      - 0
      - 1
    - prompt: 2.第二段說「只要觀察嘴喙和尾羽的顏色，就能分辨牠們」，表一中的哪些資料正好對應這句話？（複選）
      type: multi_select
      options:
      - 嘴喙顏色
      - 尾羽顏色
      - 築巢地點
      - 適應都市環境
      answer: &id002
      - 0
      - 1
    - prompt: 3.第二段提到臺灣冠八哥又稱「臺灣八哥」，表一中的哪一項資料和這句話最有關？（單選）
      type: select
      options:
      - 冠羽是否明顯
      - 外來種／原生種
      - 族群數量      □
      - 保育身分
      answer: 1
    - prompt: 4.讀表一，對理解第二段有什麼幫助？（單選）
      type: select
      options:
      - 表一只是把第二段重新整理一次，並沒有幫助我們更清楚理解這段意思。
      - 表一幫助我們更清楚看出，兩種八哥雖然外形相近，但仍可從特徵和習性加以分辨。
      answer: 1
    - prompt: 1.下面哪一句最能把第二段和表一的意思一起說清楚？（單選）
      type: select
      options:
      - 兩種八哥雖然外形相近，但只要知道牠們同屬八哥屬，就能解釋後來族群數量不同的原因
      - 兩種八哥雖然外形相近，但仍可從嘴喙、尾羽等特徵區分，表一也進一步比較了牠們的習性差異
      answer: 1
    - prompt: 2.讀完第二段和表一後，你認為哪些差異最值得留意，因為它們可能和課文標題的「命運不一樣」有關？（單選）
      type: select
      options:
      - 是否怕人、是否利用人造設施築巢、適應都市環境強弱
      - 嘴喙顏色、尾羽顏色、冠羽是否明顯
      answer: 0
    - prompt: 1.請把第三段文字中，要你看表的地方畫線
      type: free_text
      answer: null
