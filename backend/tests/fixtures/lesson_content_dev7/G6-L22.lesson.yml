id: G6-L22
lesson_code: G6-L22
title: 小兵立大功：雞鳴狗盜的故事
blocks:
- id: p1
  type: paragraph
  text: 天氣炎熱，烏鴉又渴又累。牠找到一個有水的瓶子，但瓶子太深，水太少，烏鴉喝不到。烏鴉叼來小石頭丟進瓶子，讓水面升高，最後順利喝到水。
- id: p2
  type: paragraph
  text: 孟嘗君連夜逃到函谷關，但天沒亮，城門不能開。當時規定要聽到雞鳴，士兵才會開門。
- id: p3
  type: paragraph
  text: 這時，一位食客雞鳴先生站出來說他會學雞叫。他學得唯妙唯肖，引來附近公雞一起叫，士兵以為天亮了，就開了城門。
- id: p4
  type: paragraph
  text: 孟嘗君一行人順利出關，逃出秦國。
- id: p5
  type: paragraph
  text: 孟嘗君被秦昭王軟禁，情勢危急。他請幸姬幫忙，幸姬願意救他，但提出條件，要一件白狐裘。可是那件大衣已經送給秦王，孟嘗君無法再拿出一件。
- id: p6
  type: paragraph
  text: 這時，一位會狗盜的食客站出來。他潛入寶庫，把白狐裘偷了回來。幸姬收到大衣後很開心，幫孟嘗君在秦王面前說好話。秦王聽信她的話，便放了孟嘗君。
- id: p7
  type: paragraph
  text: 有一天，吳國送了一頭大象給曹操。大家都很好奇這頭大象到底有多重，可是大象那麼大，放不上秤，沒辦法知道大象的重量。
- id: p8
  type: paragraph
  text: 這時，年紀還小的曹沖說：「我有辦法！」他請人把大象牽到一艘大船上，等船下沉穩定後，在船身畫一條水位線。然後把大象牽下來，再往船上裝石頭，一邊裝一邊觀察水位，直到水位線回到原來的位置。
- id: p9
  type: paragraph
  text: 最後，把船上的石頭搬下來一個一個秤重量，就知道大象的重量了。
