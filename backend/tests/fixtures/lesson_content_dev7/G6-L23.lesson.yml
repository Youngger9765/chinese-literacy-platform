id: G6-L23
lesson_code: G6-L23
title: 老鷹紅豆的故事
blocks:
- id: p1
  type: paragraph
  text: 本文第一段有三句，請你先判斷哪一個句子是描述「不好的事」，而且是「最嚴重」的。(請在□打勾，三選一。)
- id: p2
  type: paragraph
  text: □句1：2012年10月，屏東科技大學的研究人員收到兩隻死亡的老鷹，檢驗後，確認老鷹體內含有劇毒農藥。
- id: p3
  type: paragraph
  text: 句2：2013年，他們在屏東縣一塊紅豆田中，發現了超過3000隻野鳥屍體。
- id: p4
  type: paragraph
  text: 第一段有三個句子，第一句和第二句都是描述「不好的事」，我覺得第二句「發現超過3000隻野鳥屍體」更嚴重，所以我留下第二句，並把第二句畫線。
- id: p5
  type: paragraph
  text: 請你先判斷哪些句子是描述「有人想出辦法或行動的句子」。（在□打勾，三選二）
- id: p6
  type: paragraph
  text: 解決1：屏東科技大學在縣政府的協助下，找上當初發現超過3000隻鳥屍的紅豆田，向地主林清源先生說明這個生態的悲劇。
- id: p7
  type: paragraph
  text: 解決2：林先生坦承錯誤，自2014年起，開始使用機械播種將紅豆埋入土中，有效減少了播種期的鳥害；收成時也放棄使用落葉劑與除草劑。
- id: p8
  type: paragraph
  text: 祕訣：「結果」通常出現在文章的後段，常接在「解決」之後，說明行動後，造成了什麼改變。「結果」常有明顯的關鍵詞，例如「結果」、「最後」等。
- id: p9
  type: paragraph
  text: 請你先判斷哪些句子是描述「行動後帶來的改變」。（在□打勾，三選一）
- id: p10
  type: paragraph
  text: 這是一篇問題解決結構的文章，閱讀聚光燈你已經學會怎麼用線索來找重點，接著，我們就來整理本課的重點嘍！
