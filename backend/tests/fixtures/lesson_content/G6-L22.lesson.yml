# Fixture 1/4 — GENERAL NARRATIVE (記敘文)
# Hand-transcribed from backend/data/lessons/_parsed_2026-05-01/G6-L22.yml
# 小兵立大功：雞鳴狗盜的故事 — 摘要策略-問題.解決.結果結構
#
# Demonstrates the block-based contract can express the DOMINANT real shape:
# ordered paragraphs + a `guided_steps` spotlight (select / free_text steps, anchored
# to passage paragraphs) + reading-comprehension multiple_choice, all with the
# answer-verifiability invariant (answer_space / answer / grader) satisfied.
#
# NOTE snake_case keys — this fixture is shared by BOTH the pydantic (backend) and
# zod (frontend) contracts; the frontend test snake→camel-cases before parsing.
id: G6-L22
lesson_code: G6-L22
title: 小兵立大功：雞鳴狗盜的故事
blocks:
  # ── passage (abridged to the paragraphs the spotlight anchors) ──────────────
  - id: p1
    type: paragraph
    text: >-
      中國的戰國時期，有七個國家總是爭強鬥勝、互比苗頭，其中最有名的人才，就是齊國的孟嘗君。孟嘗君養了三千名食客，這些食客具備各式各樣的才能，可以隨時幫他解決各種問題。
  - id: p7
    type: paragraph
    text: >-
      孟嘗君率著眾食客連夜逃離咸陽城，一行人馬來到函谷關下，要出了城門，才算真正離開秦國國土，但新的問題來了，他們出不了關。
  - id: p8
    type: paragraph
    text: >-
      依照當時的法令，守城的士兵天亮才能開城門。人們聽著公雞的叫聲來判定天亮了。這時，一位食客雞鳴先生站出來，發出唯妙唯肖的公雞鳴叫聲，立刻誘發附近公雞們的鬥志，雄雞報曉的聲音此起彼落。

  # ── 閱讀聚光燈 (guided_steps): 問題.解決.結果 結構 ──────────────────────────
  # Per-step answers live inside each step; the block-level `answer` is the assembled
  # list of per-step answers (index for select, null for free_text). Because two
  # free_text steps have null step-answers, the block carries reference answers and
  # grader=rubric_ai — the invariant is met (answer is present + machine-readable list).
  - id: ex-spotlight
    type: exercise
    question:
      kind: guided_steps
      strategy_name: 摘要策略-問題.解決.結果結構
      instruction: 學習使用「問題、解決、結果」策略整理故事內容，幫助你輕鬆抓到重點。
      steps:
        - prompt: "例一：烏鴉喝水\n❶主角是誰？"
          type: select
          options: [烏鴉, 麻雀]
          answer: 0
        - prompt: "例一：烏鴉喝水\n❷主角遇到了什麼「問題」？"
          type: select
          options: [喝不到水, 天氣炎熱]
          answer: 0
        - prompt: "例一：烏鴉喝水\n❸問題如何「解決」？"
          type: free_text
          reference_answer: 叼來小石頭丟進瓶子，讓水面升高
        - prompt: "例一：烏鴉喝水\n❹最後得到什麼「結果」？"
          type: select
          options: [主角順利喝到水, 主角沒有喝到水]
          answer: 0
        - prompt: "接下來，我們來看課文的故事\n❶主角是誰？"
          type: select
          options: [孟嘗君, 秦昭王, 雞鳴先生]
          answer: 0
        - prompt: "接下來，我們來看課文的故事\n❷主角遇到了什麼「問題」？"
          type: select
          options: [被追兵追到, 天沒亮，城門不能開]
          answer: 1
        - prompt: "接下來，我們來看課文的故事\n❸問題如何「解決」？孟嘗君的食客【 】，引來附近公雞也一起叫。"
          type: free_text
          reference_answer: 模仿雞叫
        - prompt: "接下來，我們來看課文的故事\n❹最後得到什麼「結果」？"
          type: select
          options: [成功出關, 沒有出關]
          answer: 0
    answer_space: free_text
    # assembled per-step answers (null = rubric-graded free_text step)
    answer: [0, 0, null, 0, 0, 1, null, 0]
    grader: rubric_ai
    anchors:
      - { block_id: p7 }
      - { block_id: p8 }

  # ── 閱讀理解選擇題 (multiple_choice) ────────────────────────────────────────
  - id: ex-mcq-3
    type: exercise
    question:
      kind: multiple_choice
      question: 3. 哪一個選項正確描述了孟嘗君從赴秦到成功逃離秦國的順序？
      options:
        - 獲邀赴秦→被誣陷軟禁→食客協助脫困→成功逃離秦國
        - 獲邀赴秦→被誣陷軟禁→幸姬主動求情→食客回贈白狐裘
        - 獲邀赴秦→食客盜取白狐裘→秦王震怒→追殺孟嘗君
        - 因白狐裘被奪失信秦王→求助食客→食客讓幸姬求情→逃離秦國
    answer_space: choice
    answer: 0 # option A
    grader: exact
    anchors:
      - { block_id: p1 }
  - id: ex-mcq-5
    type: exercise
    question:
      kind: multiple_choice
      question: 5. 孟嘗君最後能夠逃出秦國的關鍵因素是什麼？
      options:
        - 他自己機智過人，靠自己想出所有辦法逃脫
        - 秦昭王心軟，主動赦免孟嘗君讓他自由離開
        - 食客們發揮各自的專長，幫助孟嘗君化解危機
        - 齊國軍隊立刻出兵支援，幫助孟嘗君逃出秦國
    answer_space: choice
    answer: 2 # option C
    grader: exact
    anchors:
      - { block_id: p8 }
