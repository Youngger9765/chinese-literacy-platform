# 欄位別名正名表（#2843）
#
# 抽取器每課自己想欄位名，於是同一件事長出好幾個名字。消費端只讀其中一個，
# 讀不到就回 None —— **不報錯、其他門全綠、學生看不到**。
#
# 這份表把別名收斂到消費端真正在讀的那個名字。
#
# ## 加一條之前必須確認三件事
#
# 1. **型別一致** —— 別名與正名的值型別相同。純量變 list 之類的合併會改變
#    消費端讀到的型別，那不是改名，是改結構，不可以放進這份表。
# 2. **正名是消費端真正在讀的那個** —— 用 grep 確認，不要憑感覺挑好聽的。
# 3. **值不會被覆蓋** —— 若一課同時有正名與別名，保留正名、別名收進 notes，
#    絕不覆蓋（覆蓋等於弄丟一個值）。
#
# ⛔ 不收 spotlight / keypoints / key_reading —— 有人在改（@stgst / @if-else-master）

goal_box:
  # 消費端：Intro.tsx:293 render 這句裝飾性標語，**沒有 fallback**。
  # 17 課只有別名，所以那句話現在不會顯示。
  title:
    - title_line        # 8 課
    - lesson_heading    # 9 課

  # 消費端：Intro.tsx:47-53 的四層 fallback 之一（goalBox.strategy_line）。
  # 7 課只有別名，但多半被其他層蓋住，所以使用者多半看不出差異。
  strategy_line:
    - target_strategy   # 7 課

  # 目前**沒有任何地方 render 它**（Intro.tsx:289 明寫不畫）。
  # 收斂純粹是為了形狀一致，不修任何看得見的東西。
  level_badge:
    - level_genre       # 7 課
    - 文言文類型          # 3 課（文言文課型用中文欄位名）
