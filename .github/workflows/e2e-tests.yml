name: E2E Tests (Playwright)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'

# Only run one E2E job per branch — cancel in-progress runs on new push
concurrency:
  group: e2e-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Determine target URL.
      # On push to staging → always use the persistent staging URL.
      # On PR → derive PR preview URL from branch name (issue-N pattern).
      - name: Resolve base URL
        id: resolve-url
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
            echo "base_url=${STAGING_URL}" >> $GITHUB_OUTPUT
            echo "trigger=staging" >> $GITHUB_OUTPUT
            echo "Using staging URL (push trigger): ${STAGING_URL}"
          else
            ISSUE_NUM=$(echo "$PR_BRANCH" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || echo "")
            if [ -n "$ISSUE_NUM" ]; then
              PREVIEW_URL="https://lingoleap-frontend-issue-${ISSUE_NUM}-958347263320.asia-east1.run.app"
              echo "base_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
              echo "trigger=pr" >> $GITHUB_OUTPUT
              echo "Using PR Preview URL: ${PREVIEW_URL}"
            else
              STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
              echo "base_url=${STAGING_URL}" >> $GITHUB_OUTPUT
              echo "trigger=pr-fallback" >> $GITHUB_OUTPUT
              echo "Branch has no issue number — falling back to staging: ${STAGING_URL}"
            fi
          fi

      # Wait for the target deployment to become healthy before running tests.
      # On staging push, staging-deploy.yml runs in parallel — poll until ready.
      - name: Wait for deployment (max 10 min)
        run: |
          BASE_URL="${{ steps.resolve-url.outputs.base_url }}"
          echo "Waiting for $BASE_URL to respond with HTTP 200..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deployment is up (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/60 — got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Deployment URL did not become healthy within 10 minutes."
          exit 1

      - name: Run E2E tests (core flows only)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve-url.outputs.base_url }}
          CI: 'true'
        run: |
          npx playwright test \
            e2e/auth-flow.spec.ts \
            e2e/story-selection.spec.ts \
            e2e/learning-flow.spec.ts \
            e2e/student-flow.spec.ts \
            e2e/teacher-flow.spec.ts \
            e2e/teacher-dashboard.spec.ts \
            --reporter=github \
            --timeout=60000

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.pull_request.number || github.sha }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.event.pull_request.number || github.sha }}
          path: frontend/test-results/
          retention-days: 3
