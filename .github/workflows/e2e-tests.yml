# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: E2E Tests (Playwright)

# ⚠️ 觸發不用 `on.pull_request.paths`（#2916 收尾查到）。
#
# GitHub 的 `paths:` 過濾只看**前 300 個變更檔**。PR #2920 改了 3691 個檔，
# 前 300 個全是 `backend/data/lessons/**`（批次改名 1611 個 yml），
# `frontend/**` 一個都排不進去 —— 於是這支**整個 PR 一次都沒跑**，
# 而檢查清單上不會出現這一列，看起來就是全綠。
#
# 改用 repo 既有的 `dorny/paths-filter` 判斷（staging-deploy.yml 一直是這樣做的）：
# 它算的是完整 diff，沒有 300 的上限。意圖不變 —— 純後端的 PR 仍然跳過。
#
# ⛔ 不要為了「保險」把過濾整個拿掉：那會讓每個 PR 都跑一次 e2e，
#    而這支存在的理由是**該跑的時候真的跑**，不是每次都跑。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: e2e-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'frontend/**'
              - '.github/workflows/e2e-tests.yml'

  e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # ⚠️ 這裡原本寫著「這幾支 spec 只能打 staging」，理由有兩條，**兩條都已經不成立**
      #    （#3242 逐條查證，別再照舊結論走）：
      #
      #    ① 「full-qa / demo-path 把 STAGING_BACKEND 寫死」→ 已經沒有了。
      #       兩支都改讀 `E2E_BACKEND_URL`（預設仍是 staging，行為不變），
      #       跟 `multiTextJourney.spec.ts` 用的是同一個變數。
      #       `e2eBackendEnv3242.test.ts` 盯著不要退回去。
      #
      #    ② 「per-PR preview 的 DB 是空的、demo 帳號不存在」→ 不是這樣。
      #       preview 後端吃的是**共用**的 `secrets.PREVIEW_DATABASE_URL`
      #       （沒有為每個 PR 另建 DB），而 `preview-deploy.yml` 只設
      #       `ENVIRONMENT=preview`、**沒有**設 `ENABLE_TEST_SEED=false`
      #       （`seed.py` 預設 true，只有 production 會跳過 seeding）。
      #       對 PR #3223 的 preview 後端實測（帶負向對照）：
      #           POST /api/auth/login  seed 的學生帳號  → HTTP 200 + access_token
      #           POST /api/auth/login  不存在的帳號     → HTTP 401
      #       `preview-deploy.yml` 那側 2026-08-28 就寫過同一件事了，是這裡沒跟上。
      #
      # ⛔ 但**光是把網址換成 preview 並不會解掉這張票的競態**：這支 workflow 跟
      #    `preview-deploy.yml` 是兩個獨立 workflow，由同一個 PR 事件觸發 ——
      #    改打 preview 只是換一個環境賽跑。race-free 的作法是讓 e2e 跑在
      #    **部署步驟之後的同一個 job 裡**（就是 preview-deploy.yml 裡
      #    multiTextJourney 現在的位置）。那個搬遷還沒做，剩下的討論在 #3242：
      #    要權衡的是 PR 的等待時間（那邊刻意只跑一課，理由寫在該檔）。
      #
      # 在搬遷之前，擋競態的是 `globalSetup.ts` 的環境穩定檢查（#3244）。
      - name: Wait for staging to be healthy
        id: wait
        run: |
          STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
          echo "Waiting for staging frontend $STAGING_URL to respond with HTTP 200..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging is up (attempt $i) — running E2E against staging"
              echo "effective_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/30 — got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "::error::Staging frontend not healthy in 5 min — cannot run E2E (#2062)."
          echo "effective_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Run E2E tests (core flows only)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait.outputs.effective_url }}
          # 這支打的是 staging，而 PR 的 code 還沒部署上去。
          # journey 那條驗的是「已部署的行為」，PR 階段落後一輪是正常的 ——
          # 讓它回報而不是把整個 gate 弄紅（merge 後的 staging 跑才是判準）。
          E2E_EXPECT_DEPLOYED: ${{ github.ref == 'refs/heads/staging' && '1' || '0' }}
          CI: 'true'
        run: |
          # Run all specs in testDir (tests/e2e). The old hardcoded list named 6
          # spec files that were consolidated into demo-path + full-qa (#2062 — that
          # stale list is why the workflow was disabled). Bare invocation auto-discovers.
          npx playwright test --reporter=github --timeout=60000

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-pr-${{ github.event.pull_request.number }}
          path: frontend/test-results/
          retention-days: 3
