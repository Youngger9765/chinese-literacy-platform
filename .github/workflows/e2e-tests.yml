# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: E2E Tests (Playwright)

# ⚠️ 觸發不用 `on.pull_request.paths`（#2916 收尾查到）。
#
# GitHub 的 `paths:` 過濾只看**前 300 個變更檔**。PR #2920 改了 3691 個檔，
# 前 300 個全是 `backend/data/lessons/**`（批次改名 1611 個 yml），
# `frontend/**` 一個都排不進去 —— 於是這支**整個 PR 一次都沒跑**，
# 而檢查清單上不會出現這一列，看起來就是全綠。
#
# 改用 repo 既有的 `dorny/paths-filter` 判斷（staging-deploy.yml 一直是這樣做的）：
# 它算的是完整 diff，沒有 300 的上限。意圖不變 —— 純後端的 PR 仍然跳過。
#
# ⛔ 不要為了「保險」把過濾整個拿掉：那會讓每個 PR 都跑一次 e2e，
#    而這支存在的理由是**該跑的時候真的跑**，不是每次都跑。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # #4097: re-check staging by hand after a merge (the PR-time run tests the
  # still-undeployed PR against staging; this one tests what staging serves).
  workflow_dispatch:

# Only the e2e job holds id-token: write (declared on the job itself).
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # #3966: only checks out code + diffs paths — doesn't need the
    # id-token:write the e2e job below needs for GCP auth, so this job
    # explicitly scopes down to just contents:read.
    permissions:
      contents: read
    outputs:
      # workflow_dispatch has no PR diff for paths-filter -> always relevant
      relevant: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - 'frontend/**'
              - '.github/workflows/e2e-tests.yml'

  e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04  # Playwright 不支援 ubuntu-latest 現在指向的 26.04
    # #3966: explicit per-job permissions — id-token:write is for the
    # google-github-actions/auth WIF step below (signing the IAP JWT),
    # contents:read for checkout.
    #
    # #4097 — this job holds a GCP credential (WIF), so NO third-party code
    # runs on this host: `npm ci` + Playwright run inside the official
    # Playwright container (last step), which gets only the variables it
    # needs -- never the GitHub OIDC request variables (ACTIONS_ID_TOKEN_*,
    # with which any npm install script could mint its own GCP token) and
    # never the workspace root, where auth@v2 writes gha-creds-*.json.
    # Same rule as backend/specs/test_workflow_gcp_cred_exposure_spec.py;
    # locked by backend/tests/test_e2e_iap_wiring_4097.py.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # #3733/#4097 — staging frontend is behind IAP. IAP only accepts a
      # service-account SELF-SIGNED JWT whose aud is the frontend's exact
      # URL (#3730); the github-actions SA signs it via IAM Credentials
      # (same SA + permissions staging-deploy.yml's health check uses).
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # ⚠️ 這裡原本寫著「這幾支 spec 只能打 staging」，理由有兩條，**兩條都已經不成立**
      #    （#3242 逐條查證，別再照舊結論走）：
      #
      #    ① 「full-qa / demo-path 把 STAGING_BACKEND 寫死」→ 已經沒有了。
      #       兩支都改讀 `E2E_BACKEND_URL`（預設仍是 staging，行為不變），
      #       跟 `multiTextJourney.spec.ts` 用的是同一個變數。
      #       `e2eBackendEnv3242.test.ts` 盯著不要退回去。
      #
      #    ② 「per-PR preview 的 DB 是空的、demo 帳號不存在」→ 不是這樣。
      #       preview 後端吃的是**共用**的 preview DB（#3999 起 DATABASE_URL
      #       從 Secret Manager 的 `lingoleap-database-url-preview` 取值，
      #       不再是 GitHub Actions secret；沒有為每個 PR 另建 DB），而
      #       `preview-deploy.yml` 只設
      #       `ENVIRONMENT=preview`、**沒有**設 `ENABLE_TEST_SEED=false`
      #       （`seed.py` 預設 true，只有 production 會跳過 seeding）。
      #       對 PR #3223 的 preview 後端實測（帶負向對照）：
      #           POST /api/auth/login  seed 的學生帳號  → HTTP 200 + access_token
      #           POST /api/auth/login  不存在的帳號     → HTTP 401
      #       `preview-deploy.yml` 那側 2026-08-28 就寫過同一件事了，是這裡沒跟上。
      #
      # ⛔ 但**光是把網址換成 preview 並不會解掉這張票的競態**：這支 workflow 跟
      #    `preview-deploy.yml` 是兩個獨立 workflow，由同一個 PR 事件觸發 ——
      #    改打 preview 只是換一個環境賽跑。race-free 的作法是讓 e2e 跑在
      #    **部署步驟之後的同一個 job 裡**（就是 preview-deploy.yml 裡
      #    multiTextJourney 現在的位置）。那個搬遷還沒做，剩下的討論在 #3242：
      #    要權衡的是 PR 的等待時間（那邊刻意只跑一課，理由寫在該檔）。
      #
      # 在搬遷之前，擋競態的是 `globalSetup.ts` 的環境穩定檢查（#3244）。
      - name: Wait for staging to be healthy
        id: wait
        env:
          IAP_AUDIENCE: https://lingoleap-frontend-staging-958347263320.asia-east1.run.app
          IAP_SIGNING_SA_EMAIL: github-actions@lingoleap-dev.iam.gserviceaccount.com
        run: |
          source "${GITHUB_WORKSPACE}/scripts/lib/iap-token.sh"
          IAP_TOKEN="$(iap_token "${IAP_AUDIENCE}")"
          if [ -z "${IAP_TOKEN}" ]; then
            echo "::error::staging is behind IAP but no IAP JWT could be signed (needs serviceAccountTokenCreator on the CI SA itself)"
            exit 1
          fi
          echo "::add-mask::${IAP_TOKEN}"
          # IAP checks aud against the exact hostname -> curl the URL we signed for.
          STAGING_URL="${IAP_AUDIENCE}"
          echo "Waiting for staging frontend $STAGING_URL to respond with HTTP 200..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Proxy-Authorization: Bearer ${IAP_TOKEN}" "$STAGING_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging is up (attempt $i) — running E2E against staging"
              echo "effective_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/30 — got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "::error::Staging frontend not healthy in 5 min — cannot run E2E (#2062)."
          echo "effective_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"
          exit 1

      # #4097 — Playwright needs the IAP JWT on every request incl. page
      # navigation: playwright.config.ts puts getIapProxyAuthHeader() into
      # extraHTTPHeaders, and that helper uses IAP_PROXY_TOKEN as-is. The
      # token is signed HERE, on the host, right before the container starts
      # (fresh, ~50 min lifetime; a typical run is ~32 min), and reaches the
      # container only through `-e IAP_PROXY_TOKEN` (value from this shell,
      # never on the command line).
      #
      # API calls go through the frontend's same-origin proxy (/api/* ->
      # invoker sidecar -> backend): E2E_BACKEND_URL = the frontend URL. The
      # backend itself is run.invoker-locked, and the container carries only
      # the IAP JWT -- exactly what a signed-in browser has.
      #
      # Image = the official Playwright image, browsers baked in; its version
      # must equal frontend/package-lock.json's @playwright/test (locked by
      # test_e2e_iap_wiring_4097.py). Only frontend/ is mounted.
      - name: Run E2E tests (core flows only)
        env:
          IAP_AUDIENCE: https://lingoleap-frontend-staging-958347263320.asia-east1.run.app
          IAP_SIGNING_SA_EMAIL: github-actions@lingoleap-dev.iam.gserviceaccount.com
          PLAYWRIGHT_BASE_URL: ${{ steps.wait.outputs.effective_url }}
          E2E_BACKEND_URL: ${{ steps.wait.outputs.effective_url }}
          # PR 階段打的是 staging，而 PR 的 code 還沒部署上去 ——
          # journey 那條驗的是「已部署的行為」，PR 階段落後一輪是正常的，
          # 讓它回報而不是把整個 gate 弄紅。merge 後手動跑（workflow_dispatch）
          # 驗的是 staging 正在服務的版本，那才是判準 → 設 1。
          E2E_EXPECT_DEPLOYED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          CI: 'true'
        run: |
          source "${GITHUB_WORKSPACE}/scripts/lib/iap-token.sh"
          IAP_PROXY_TOKEN="$(iap_token "${IAP_AUDIENCE}")"
          if [ -z "${IAP_PROXY_TOKEN}" ]; then
            echo "::error::could not sign an IAP JWT for the staging frontend"
            exit 1
          fi
          echo "::add-mask::${IAP_PROXY_TOKEN}"
          export IAP_PROXY_TOKEN
          # Run all specs in testDir (tests/e2e). Bare invocation auto-discovers (#2062).
          docker run --rm --init --ipc=host \
            -v "${GITHUB_WORKSPACE}/frontend:/work" -w /work \
            -e IAP_PROXY_TOKEN \
            -e PLAYWRIGHT_BASE_URL \
            -e E2E_BACKEND_URL \
            -e E2E_EXPECT_DEPLOYED \
            -e CI \
            mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53 \
            bash -c 'npm ci && npx playwright test --reporter=github --timeout=60000'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.event.pull_request.number || github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ github.event.pull_request.number || github.run_id }}
          path: frontend/test-results/
          retention-days: 3
