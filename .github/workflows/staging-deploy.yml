name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Serialize concurrent deploys. Back-to-back merges to staging would
# race each other on Cloud Run revision/traffic. With this group,
# new runs queue behind the in-flight one.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  BACKEND_SERVICE: lingoleap-backend-staging
  FRONTEND_SERVICE: lingoleap-frontend-staging
  # #3719 — IAP 準備：同 preview-deploy.yml 的同名開關，預設 false。
  # 唯一的 on/off 開關只有這一行；真的要在 staging 上測 IAP 前，先讀
  # docs/iap-runbook.md。
  IAP_ENABLED: 'false'
  # #3728/#3740 — 同源代理（frontend nginx 轉送 /api、/assets、/q 去
  # backend）的 build-time 開關，預設 false：關掉時這個 job 建出來的
  # image 跟 #3741 revert 之後的 staging 完全一樣（VITE_API_URL 指到
  # backend 絕對網址，沒有 BACKEND_INTERNAL_URL / 沒有
  # BACKEND_INVOKER_SIDECAR_PORT，nginx 不會轉送任何東西）——這是刻意
  # 的，不是疏漏：#3728 曾經在沒有這個開關的情況下對每個 staging/preview
  # build 無條件打開代理，讓 backend 的限流器把代理那一跳的 IP 當成每個
  # 使用者的 IP，所有人共用同一個 300 次配額（#3740 postmortem）。
  #
  # ⚠️ 只打開這一行還不夠：render-nginx-conf.sh 在只有代理、沒有 sidecar
  # 的狀態下**會讓這個 build 直接失敗**（#3740 新增的 fail-closed 檢查，
  # 刻意設計成「半套設定」連 image 都建不出來，而不是建出一個會重現同一
  # 個 bug 的 image）。要真的打開代理，backend 還必須：
  #   (1) 已設定 FRONTEND_PROXY_SA + BACKEND_AUDIENCE（見
  #       backend/app/config.py）
  #   (2) 這個 job 的 frontend deploy 步驟已經改成多容器部署，把
  #       scripts/run_invoker_token.py --serve 的 sidecar 跟 frontend
  #       一起上（目前這個 workflow **還沒有**這一步 —— 只在拋棄式 canary
  #       上手動驗證過，見 docs/iap-runbook.md）
  # 這三件事沒有一起做，打開這個開關不會讓代理可用，只會讓 build 直接
  # 壞掉（安全失敗，不是悄悄重現 regression）。
  SAME_ORIGIN_PROXY_ENABLED: 'false'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      firebase: ${{ steps.filter.outputs.firebase }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            firebase:
              - 'firebase.json'
              - '.firebaserc'
              - 'frontend/**'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/backend:staging-latest" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/backend:staging-latest"

      # ⚠️ 下面那個 deploy 的 --memory 是 1Gi 不是 512Mi（#3266）。
      #    512Mi 下近 30 天 OOM 三次（2026-08-29 / 09-02 / 09-16，三個不同 revision），
      #    每次都伴隨「The request was aborted because there was no available instance」
      #    —— 使用者真的看到失敗：
      #      2026-09-16T12:18  Memory limit of 512 MiB exceeded with 514 MiB used
      #      2026-09-16T12:19  9x no available instance
      #    這個後端常駐要放注音表（8.3 MB）＋ jieba 字典＋字型讀音表＋課文 YAML 的
      #    lru_cache，514/512 的餘裕本來就是負的。
      #    不要為了省錢調回 512Mi —— 差額量級是每月美分，代價是拒絕服務。
      #    鎖：backend/specs/test_workflow_path_filters_spec.py（test_backend_memory_is_at_least_1gi）
      # Classroom capacity (2026-10-16, measured): 2 vCPU and 8 concurrent
      # requests per instance so reading-recording transcodes spread across
      # instances (see deploy.yml). Staging keeps min 0 (idle = 0 cost) and the
      # db-f1-micro DB (25 connections): pool 2+0 per instance, 8 x 2 = 16.
      - name: Deploy backend to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=8 \
            --concurrency=8 \
            --timeout=300s \
            --add-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-staging-db \
            --service-account=lingoleap-junyi-bq@lingoleap-dev.iam.gserviceaccount.com \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://lingoleap-frontend-staging-958347263320.asia-east1.run.app,https://lingoleap-frontend-958347263320.asia-east1.run.app,https://lingoleap-staging.web.app,https://lingoleap-dev.web.app::DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}::RUN_MIGRATIONS=true::AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}::AZURE_SPEECH_REGION=eastus::TTS_PROVIDER=azure::ENVIRONMENT=staging::JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET_KEY }}::GCS_OMO_BUCKET=lingoleap-omo-uploads-staging::READING_AUDIO_GCS_BUCKET=lingoleap-reading-audio-staging::BUILD_SHA=${{ github.sha }}::JUNYI_CLASS_IMPORT_ENABLED=true::JUNYI_BQ_MODE=real::PARENT_PORTAL_ENABLED=true::DB_POOL_SIZE=2::DB_MAX_OVERFLOW=0::ASYNC_THREAD_WORKERS=32"

      - name: Promote backend traffic to latest revision (Fixes #1449)
        run: |
          gcloud run services update-traffic ${{ env.BACKEND_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # #3719 — IAP 準備：預設關，改上面 env.IAP_ENABLED 才會跑。
      - name: （IAP_ENABLED 時）替 staging backend 開 IAP
        if: env.IAP_ENABLED == 'true'
        run: |
          gcloud beta run services update ${{ env.BACKEND_SERVICE }} \
            --iap \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Verify backend health
        env:
          IAP_AUDIENCE: ${{ secrets.IAP_AUDIENCE }}
        run: |
          source scripts/lib/iap-token.sh
          IAP_AUTH_ARGS=()
          IAP_TOKEN="$(iap_token "${IAP_AUDIENCE:-}")"
          [ -n "${IAP_TOKEN}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$URL/")
            echo "Attempt $i: Backend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

  deploy-frontend:
    needs: [detect-changes, deploy-backend]
    if: |
      always() &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Resolve staging backend URL
        id: backend-url
        run: |
          # Use stable Cloud Run service URL (not gcloud describe which returns
          # new-format URLs like oja2sffiya-de.a.run.app that break CORS)
          URL="https://lingoleap-backend-staging-958347263320.asia-east1.run.app"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Staging frontend will use backend: ${URL}"

      - name: Build & push frontend image
        env:
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PW: ${{ secrets.DEMO_ADMIN_PW }}
          DEMO_TEACHER_EMAIL: ${{ secrets.DEMO_TEACHER_EMAIL }}
          DEMO_TEACHER_PW: ${{ secrets.DEMO_TEACHER_PW }}
          DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: |
          # #3719/#3728/#3740 — SAME_ORIGIN_PROXY_ENABLED=false (default,
          # see the env: block above for the full why): build EXACTLY like
          # today/post-#3741-revert — VITE_API_URL points straight at
          # backend's absolute URL, no BACKEND_INTERNAL_URL,
          # no BACKEND_INVOKER_SIDECAR_PORT, nginx never proxies anything.
          # =true: VITE_API_URL stays empty (relative /api/* -- apiConfig.ts
          # uses `??`, empty string isn't treated as undefined, same trick
          # the Firebase Hosting job below already relies on).
          # BACKEND_INTERNAL_URL tells this frontend's own nginx where to
          # forward same-origin /api, /assets, /q (see
          # frontend/docker/render-nginx-conf.sh). BACKEND_INVOKER_SIDECAR_PORT
          # must travel with it or the build fails outright (fail-closed
          # guard, see the env: block comment for why that's intentional).
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            PROXY_BUILD_ARGS=(--build-arg VITE_API_URL= --build-arg "BACKEND_INTERNAL_URL=${{ steps.backend-url.outputs.url }}" --build-arg BACKEND_INVOKER_SIDECAR_PORT=8081)
          else
            PROXY_BUILD_ARGS=(--build-arg "VITE_API_URL=${{ steps.backend-url.outputs.url }}")
          fi
          docker build \
            "${PROXY_BUILD_ARGS[@]}" \
            --build-arg VITE_SHOW_DEMO_LOGIN=true \
            --build-arg VITE_PARENT_PORTAL_ENABLED=true \
            --build-arg "VITE_DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL}" \
            --build-arg "VITE_DEMO_ADMIN_PW=${DEMO_ADMIN_PW}" \
            --build-arg "VITE_DEMO_TEACHER_EMAIL=${DEMO_TEACHER_EMAIL}" \
            --build-arg "VITE_DEMO_TEACHER_PW=${DEMO_TEACHER_PW}" \
            --build-arg "VITE_DEMO_STUDENT_EMAIL=${DEMO_STUDENT_EMAIL}" \
            --build-arg "VITE_DEMO_STUDENT_PW=${DEMO_STUDENT_PW}" \
            -t "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/frontend:staging-latest" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/frontend:staging-latest"

      - name: Deploy frontend to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300s

      - name: Promote frontend traffic to latest revision (Fixes #1449)
        run: |
          gcloud run services update-traffic ${{ env.FRONTEND_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # #3719 — IAP 準備：同上，預設關。
      - name: （IAP_ENABLED 時）替 staging frontend 開 IAP
        if: env.IAP_ENABLED == 'true'
        run: |
          gcloud beta run services update ${{ env.FRONTEND_SERVICE }} \
            --iap \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Verify frontend health
        env:
          IAP_AUDIENCE: ${{ secrets.IAP_AUDIENCE }}
        run: |
          source scripts/lib/iap-token.sh
          IAP_AUTH_ARGS=()
          IAP_TOKEN="$(iap_token "${IAP_AUDIENCE:-}")"
          [ -n "${IAP_TOKEN}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$URL/")
            echo "Attempt $i: Frontend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Show staging deployment summary
        if: always()
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          {
            echo "## Staging Deployment Complete"
            echo ""
            echo "**Frontend (Cloud Run):** ${FRONTEND_URL}"
            echo "**Frontend (Firebase staging):** https://lingoleap-staging.web.app"
            echo "**Frontend (Firebase dev):** https://lingoleap-dev.web.app"
            echo "**Backend:** ${BACKEND_URL}"
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend-firebase:
    name: Deploy frontend to Firebase Hosting (staging + dev)
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.firebase == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Firebase (relative API paths + demo creds)
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_SHOW_DEMO_LOGIN: "true"
          VITE_PARENT_PORTAL_ENABLED: "true"
          VITE_DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          VITE_DEMO_ADMIN_PW: ${{ secrets.DEMO_ADMIN_PW }}
          VITE_DEMO_TEACHER_EMAIL: ${{ secrets.DEMO_TEACHER_EMAIL }}
          VITE_DEMO_TEACHER_PW: ${{ secrets.DEMO_TEACHER_PW }}
          VITE_DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          VITE_DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy to Firebase Hosting (staging + dev)
        run: |
          firebase deploy \
            --only hosting:staging,hosting:dev \
            --project lingoleap-dev \
            --non-interactive \
            --message "Deploy ${COMMIT_SHA}"

      - name: Verify Firebase sites
        run: |
          for site in lingoleap-staging lingoleap-dev; do
            FE=$(curl -s -o /dev/null -w '%{http_code}' "https://${site}.web.app/")
            API=$(curl -s -o /dev/null -w '%{http_code}' "https://${site}.web.app/api/health")
            echo "${site}.web.app: FE=${FE} /api/health=${API}"
            if [ "$FE" != "200" ] || [ "$API" != "200" ]; then
              echo "::error::${site}.web.app verification failed"
              exit 1
            fi
          done

  smoke-test:
    name: Smoke test staging API
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    env:
      STAGING_BACKEND: https://lingoleap-backend-staging-958347263320.asia-east1.run.app
    steps:
      - uses: actions/checkout@v6

      # #3719 — IAP 準備：staging 未來可能在前面加一層 IAP。IAP_AUDIENCE 沒有
      # 任何 secret 可讀（還沒打開 IAP），所以下面每一步都跟今天完全一樣——
      # 這一步只是把「打開時只要設一個 secret」這件事準備好。
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Mint IAP token once for this job (masked)
        id: iap
        env:
          IAP_AUDIENCE: ${{ secrets.IAP_AUDIENCE }}
        run: |
          source scripts/lib/iap-token.sh
          TOKEN="$(iap_token "${IAP_AUDIENCE:-}")"
          if [ -n "${TOKEN}" ]; then
            echo "::add-mask::${TOKEN}"
          fi
          echo "IAP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Wait for Cloud Run to be ready
        run: sleep 15

      - name: Smoke test /api/health (expect 200)
        run: |
          IAP_AUTH_ARGS=(); [ -n "${IAP_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/health")
          echo "/api/health -> $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/health returned $STATUS, expected 200"
            exit 1
          fi

      - name: Smoke test /api/teacher/story-tags (expect 200 or 401, not 500)
        run: |
          IAP_AUTH_ARGS=(); [ -n "${IAP_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/teacher/story-tags")
          echo "/api/teacher/story-tags -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/teacher/story-tags returned 500"
            exit 1
          fi

      - name: Smoke test /api/schools (expect 200 or 401, not 500)
        run: |
          IAP_AUTH_ARGS=(); [ -n "${IAP_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/schools")
          echo "/api/schools -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/schools returned 500"
            exit 1
          fi

      - name: Smoke test /api/organizations (expect 200 or 401, not 500)
        run: |
          IAP_AUTH_ARGS=(); [ -n "${IAP_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/organizations")
          echo "/api/organizations -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/organizations returned 500"
            exit 1
          fi

      - name: Smoke test summary
        if: always()
        run: |
          {
            echo "## Smoke Test Results"
            echo ""
            echo "**Target**: ${STAGING_BACKEND}"
            echo ""
            echo "| Endpoint | Acceptable Status |"
            echo "|----------|------------------|"
            echo "| GET /health | 200 only |"
            echo "| GET /api/teacher/story-tags | 200 or 401 (not 500) |"
            echo "| GET /api/schools | 200 or 401 (not 500) |"
            echo "| GET /api/organizations | 200 or 401 (not 500) |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-images:
    name: Cleanup old AR images
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Delete old staging images (keep latest 5)
        run: |
          # Cleanup is best-effort. Historical registry has 1000+ images;
          # serial deletes at ~4s each would run ~1.7h. Cap via an internal
          # deadline that exits 0 so the job reports success. GCP's
          # keep-recent-tagged=3 async policy handles the rest.
          KEEP=5
          DEADLINE=$(( $(date +%s) + 540 ))  # 9 min hard stop
          for PACKAGE in backend frontend; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Deadline reached before ${PACKAGE}; leaving rest to GCP async policy"
              break
            fi
            echo "=== Cleaning ${PACKAGE} staging images ==="
            DIGESTS=$(gcloud artifacts docker images list \
              "$REGISTRY/${PACKAGE}" \
              --include-tags \
              --filter="tags:staging-" \
              --sort-by="~CREATE_TIME" \
              --format="value(version)" 2>/dev/null || true)

            if [ -z "$DIGESTS" ]; then
              echo "No images found, skipping"
              continue
            fi

            TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
            echo "Found $TOTAL images, keeping latest $KEEP"

            echo "$DIGESTS" | tail -n +$((KEEP + 1)) | while read -r DIGEST; do
              [ -z "$DIGEST" ] && continue
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "Deadline reached; $(date +%s) >= $DEADLINE. Stopping."
                break
              fi
              echo "DELETE: ${DIGEST:0:20}..."
              gcloud artifacts docker images delete \
                "$REGISTRY/${PACKAGE}@${DIGEST}" \
                --delete-tags --quiet 2>/dev/null || true
            done
          done
          echo "Cleanup step finished (may be partial; GCP async policy handles remainder)"

  notify-staging:
    name: Notify referenced issues
    needs: smoke-test
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Comment on referenced issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Parse Fixes/Closes/Refs #N from commit message (passed via env var — safe)
          ISSUES=$(echo "$COMMIT_MSG" | grep -oiE '(fixes|closes|refs) #[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUES" ]; then
            echo "No referenced issues found in commit message — skipping notify"
            exit 0
          fi
          REPO="${{ github.repository }}"
          STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
          for ISSUE_NUM in $ISSUES; do
            echo "Commenting on issue #${ISSUE_NUM}"
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "$(printf '## Deployed to Staging\n\nSmoke tests passed.\n\n**Staging URL**: %s\n\nNext step: request case owner testing.' "${STAGING_URL}")"
          done

  cleanup-branch:
    name: Delete merged feature branch
    needs: notify-staging
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Delete remote feature branch if applicable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Squash merges: commit message format "fix: description (#N)"
          # Merge commits: "Merge pull request #N from owner/branch-name"
          # Extract branch name from merge commit format only
          BRANCH=$(echo "$COMMIT_MSG" | grep -oP '(?<=from )[^/]+/\K\S+' || true)

          if [ -z "$BRANCH" ]; then
            echo "Could not extract branch name from commit message — skipping cleanup"
            exit 0
          fi

          # Only delete feature/fix/feat branches (never staging, main, etc.)
          if echo "$BRANCH" | grep -qE '^(fix/issue-|feat/issue-|feature/issue-)'; then
            REPO="${{ github.repository }}"
            echo "Deleting remote branch: $BRANCH"
            gh api "repos/${REPO}/git/refs/heads/${BRANCH}" -X DELETE && \
              echo "Deleted $BRANCH" || \
              echo "Branch $BRANCH not found or already deleted — OK"
          else
            echo "Branch '$BRANCH' is not a feature branch — skipping cleanup"
          fi
