name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  BACKEND_SERVICE: lingoleap-backend-staging
  FRONTEND_SERVICE: lingoleap-frontend-staging

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/backend:staging-latest" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/backend:staging-latest"

      - name: Deploy backend to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300s \
            --add-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-db \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://lingoleap-frontend-staging-958347263320.asia-east1.run.app,https://lingoleap-frontend-958347263320.asia-east1.run.app,https://lingoleap-dev.web.app::DATABASE_URL=${{ secrets.DATABASE_URL }}::RUN_MIGRATIONS=true"

      - name: Verify backend health
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: Backend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

  deploy-frontend:
    needs: [detect-changes, deploy-backend]
    if: |
      always() &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Resolve staging backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            # Fallback to production backend if staging backend doesn't exist yet
            URL="https://lingoleap-backend-958347263320.asia-east1.run.app"
          fi
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Staging frontend will use backend: ${URL}"

      - name: Build & push frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ steps.backend-url.outputs.url }} \
            -t "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/frontend:staging-latest" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/frontend:staging-latest"

      - name: Deploy frontend to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300s

      - name: Verify frontend health
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: Frontend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Show staging deployment summary
        if: always()
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** ${FRONTEND_URL}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${BACKEND_URL}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Smoke test staging API
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    env:
      STAGING_BACKEND: https://lingoleap-backend-staging-958347263320.asia-east1.run.app
    steps:
      - name: Wait for Cloud Run to be ready
        run: sleep 15

      - name: Smoke test /api/health (expect 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_BACKEND}/api/health")
          echo "/api/health -> $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/health returned $STATUS, expected 200"
            exit 1
          fi

      - name: Smoke test /api/teacher/story-tags (expect 200 or 401, not 500)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_BACKEND}/api/teacher/story-tags")
          echo "/api/teacher/story-tags -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/teacher/story-tags returned 500"
            exit 1
          fi

      - name: Smoke test /api/schools (expect 200 or 401, not 500)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_BACKEND}/api/schools")
          echo "/api/schools -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/schools returned 500"
            exit 1
          fi

      - name: Smoke test /api/organizations (expect 200 or 401, not 500)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_BACKEND}/api/organizations")
          echo "/api/organizations -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/organizations returned 500"
            exit 1
          fi

      - name: Smoke test summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${STAGING_BACKEND}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Acceptable Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| GET /health | 200 only |" >> $GITHUB_STEP_SUMMARY
          echo "| GET /api/teacher/story-tags | 200 or 401 (not 500) |" >> $GITHUB_STEP_SUMMARY
          echo "| GET /api/schools | 200 or 401 (not 500) |" >> $GITHUB_STEP_SUMMARY
          echo "| GET /api/organizations | 200 or 401 (not 500) |" >> $GITHUB_STEP_SUMMARY

  cleanup-images:
    name: Cleanup old AR images
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Delete old staging images (keep latest 3)
        run: |
          KEEP=3
          for PACKAGE in backend frontend; do
            echo "=== Cleaning ${PACKAGE} staging images ==="
            DIGESTS=$(gcloud artifacts docker images list \
              "${{ env.REGISTRY }}/${PACKAGE}" \
              --include-tags \
              --filter="tags:staging-" \
              --sort-by="~CREATE_TIME" \
              --format="value(version)" 2>/dev/null || true)

            if [ -z "$DIGESTS" ]; then
              echo "No images found, skipping"
              continue
            fi

            TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
            echo "Found $TOTAL images, keeping latest $KEEP"

            echo "$DIGESTS" | tail -n +$((KEEP + 1)) | while read -r DIGEST; do
              [ -z "$DIGEST" ] && continue
              echo "DELETE: ${DIGEST:0:20}..."
              gcloud artifacts docker images delete \
                "${{ env.REGISTRY }}/${PACKAGE}@${DIGEST}" \
                --delete-tags --quiet 2>/dev/null || true
            done
          done

  notify-staging:
    name: Notify referenced issues
    needs: smoke-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Comment on referenced issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Parse Fixes/Closes/Refs #N from commit message (passed via env var — safe)
          ISSUES=$(echo "$COMMIT_MSG" | grep -oiE '(fixes|closes|refs) #[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUES" ]; then
            echo "No referenced issues found in commit message — skipping notify"
            exit 0
          fi
          REPO="${{ github.repository }}"
          STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
          for ISSUE_NUM in $ISSUES; do
            echo "Commenting on issue #${ISSUE_NUM}"
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "$(printf '## Deployed to Staging\n\nSmoke tests passed.\n\n**Staging URL**: %s\n\nNext step: request case owner testing.' "${STAGING_URL}")"
          done

  cleanup-branch:
    name: Delete merged feature branch
    needs: notify-staging
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Delete remote feature branch if applicable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Squash merges: commit message format "fix: description (#N)"
          # Merge commits: "Merge pull request #N from owner/branch-name"
          # Extract branch name from merge commit format only
          BRANCH=$(echo "$COMMIT_MSG" | grep -oP '(?<=from )[^/]+/\K\S+' || true)

          if [ -z "$BRANCH" ]; then
            echo "Could not extract branch name from commit message — skipping cleanup"
            exit 0
          fi

          # Only delete feature/fix/feat branches (never staging, main, etc.)
          if echo "$BRANCH" | grep -qE '^(fix/issue-|feat/issue-|feature/issue-)'; then
            REPO="${{ github.repository }}"
            echo "Deleting remote branch: $BRANCH"
            gh api "repos/${REPO}/git/refs/heads/${BRANCH}" -X DELETE && \
              echo "Deleted $BRANCH" || \
              echo "Branch $BRANCH not found or already deleted — OK"
          else
            echo "Branch '$BRANCH' is not a feature branch — skipping cleanup"
          fi
