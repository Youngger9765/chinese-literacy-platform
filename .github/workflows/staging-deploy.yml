name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# find_01YP72Td7XmwD2J4TU5nTMgd / find_01GSz5fbgsPuuK3ieTGopD8B: `id-token:
# write` used to sit here, so EVERY job inherited it, including jobs that
# run `npm ci` / `vite build` / third-party installs. That is an ambient
# permission the moment the job starts (ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN
# are already in the environment), not something that only exists once
# google-github-actions/auth runs -- so moving an install step before auth
# never removed the exposure. `id-token: write` now lives ONLY as a
# per-job override on the jobs that actually call
# google-github-actions/auth@v2 (deploy-backend, deploy-frontend,
# deploy-frontend-firebase, smoke-test, cleanup-images). GitHub Actions
# does not merge a job-level permissions block with this one; it replaces
# it for that job, and a job with no block of its own still inherits this
# one unchanged.
permissions:
  contents: read

# Serialize concurrent deploys. Back-to-back merges to staging would
# race each other on Cloud Run revision/traffic. With this group,
# new runs queue behind the in-flight one.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  BACKEND_SERVICE: lingoleap-backend-staging
  FRONTEND_SERVICE: lingoleap-frontend-staging
  # #3719/#3733 — IAP 開關（與 SAME_ORIGIN_PROXY_ENABLED 一起動）。白名單是
  # IAP IAM（服務層＋asia-east1 Cloud Run 區域層），不在這個 workflow 裡。
  # 2026-11-16 第二次打開（#3733）：第一次（#4083）因既有 frontend 是「一個沒命名
  # 的容器」雙容器 deploy 失敗而回滾；現在部署前會先把它改名成 frontend（#4086，
  # 已在既有 preview 上實測 #4085）。回滾＝這行與 SAME_ORIGIN_PROXY_ENABLED 一起改回 'false'。
  # 唯一的 on/off 開關只有這一行；真的要在 staging 上測 IAP 前，先讀
  # docs/iap-runbook.md。
  IAP_ENABLED: 'true'
  # #3728/#3740 — 同源代理（frontend nginx 轉送 /api、/assets、/q 去
  # backend）的 build-time 開關，預設 false：關掉時這個 job 建出來的
  # image 跟 #3741 revert 之後的 staging 完全一樣（VITE_API_URL 指到
  # backend 絕對網址，沒有 BACKEND_INTERNAL_URL / 沒有
  # BACKEND_INVOKER_SIDECAR_PORT，nginx 不會轉送任何東西）——這是刻意
  # 的，不是疏漏：#3728 曾經在沒有這個開關的情況下對每個 staging/preview
  # build 無條件打開代理，讓 backend 的限流器把代理那一跳的 IP 當成每個
  # 使用者的 IP，所有人共用同一個 300 次配額（#3740 postmortem）。
  #
  # ⚠️ 只打開這一行還不夠：render-nginx-conf.sh 在只有代理、沒有 sidecar
  # 的狀態下**會讓這個 build 直接失敗**（#3740 新增的 fail-closed 檢查，
  # 刻意設計成「半套設定」連 image 都建不出來，而不是建出一個會重現同一
  # 個 bug 的 image）。要真的打開代理，backend 還必須：
  #   (1) 已設定 FRONTEND_PROXY_SA + BACKEND_AUDIENCE（見
  #       backend/app/config.py）
  #   (2) 這個 job 的 frontend deploy 步驟改成多容器部署，把
  #       scripts/run_invoker_token.py --serve 的 sidecar 跟 frontend
  #       一起上（#3733 第二輪已接好：這個開關為 'true' 時下面的
  #       sidecar build 與雙容器 deploy 會自動走那條路，backend 也會自動
  #       帶 FRONTEND_PROXY_SA + BACKEND_AUDIENCE）
  # 這三件事沒有一起做，打開這個開關不會讓代理可用，只會讓 build 直接
  # 壞掉（安全失敗，不是悄悄重現 regression）。
  SAME_ORIGIN_PROXY_ENABLED: 'true'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      firebase: ${{ steps.filter.outputs.firebase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # a switch flip here (IAP_ENABLED etc.) must redeploy both halves
              - '.github/workflows/staging-deploy.yml'
            frontend:
              - 'frontend/**'
              # a switch flip here (IAP_ENABLED etc.) must redeploy both halves
              - '.github/workflows/staging-deploy.yml'
            firebase:
              - 'firebase.json'
              - '.firebaserc'
              - 'frontend/**'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/backend:staging-latest" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/backend:staging-latest"

      # ⚠️ 下面那個 deploy 的 --memory 是 1Gi 不是 512Mi（#3266）。
      #    512Mi 下近 30 天 OOM 三次（2026-08-29 / 09-02 / 09-16，三個不同 revision），
      #    每次都伴隨「The request was aborted because there was no available instance」
      #    —— 使用者真的看到失敗：
      #      2026-09-16T12:18  Memory limit of 512 MiB exceeded with 514 MiB used
      #      2026-09-16T12:19  9x no available instance
      #    這個後端常駐要放注音表（8.3 MB）＋ jieba 字典＋字型讀音表＋課文 YAML 的
      #    lru_cache，514/512 的餘裕本來就是負的。
      #    不要為了省錢調回 512Mi —— 差額量級是每月美分，代價是拒絕服務。
      #    鎖：backend/specs/test_workflow_path_filters_spec.py（test_backend_memory_is_at_least_1gi）
      # Classroom capacity (2026-10-16, measured): 2 vCPU and 8 concurrent
      # requests per instance so reading-recording transcodes spread across
      # instances (see deploy.yml). Staging keeps min 0 (idle = 0 cost) and the
      # db-f1-micro DB (25 connections): pool 2+0 per instance, 8 x 2 = 16.
      #
      # #3999 (Junyi security baseline rule 7): DATABASE_URL moved off the
      # bulk env-vars string (where it was a literal value from the
      # `secrets.STAGING_DATABASE_URL` GitHub Actions secret) onto a
      # dedicated secrets flag pointed at a Secret Manager secret
      # (`lingoleap-database-url-staging:latest`, project `lingoleap-dev`) --
      # the runtime service account used just above already has
      # `secretAccessor` on it. Same gcloud CLI reference as deploy.yml: the
      # bulk env-vars flag and the dedicated secrets flag are independent
      # "at most one of" groups, so combining them in one deploy invocation
      # is supported, and since DATABASE_URL now appears in only one of
      # them there is no same-key conflict.
      #
      # #4038: staging runs as its own identity, lingoleap-backend-staging-rt.
      # It only has staging resources (staging DB secret, *-staging buckets,
      # tts-cache, assets read). It is NOT the prod identity any more, so a
      # staging bug cannot read the prod DATABASE_URL secret or prod buckets.
      # Junyi BigQuery still works: the app impersonates lingoleap-junyi-bq
      # (config.junyi_bigquery_service_account), and staging-rt holds
      # serviceAccountTokenCreator on that one account only.
      # Cloud SQL uses --set (not --add): --add is cumulative across revisions
      # and had left the prod instance lingoleap-db attached to staging.
      # Lock: backend/specs/test_workflow_runtime_sa_spec.py
      #
      # #3733 — IAP_ENABLED=true deploys already locked
      # (--no-allow-unauthenticated), so a redeploy never re-opens the
      # backend for the seconds before the invoker step below runs.
      # SAME_ORIGIN_PROXY_ENABLED=true sets FRONTEND_PROXY_SA +
      # BACKEND_AUDIENCE (#3740; must equal the sidecar's
      # BACKEND_INVOKER_AUDIENCE). Both default off = today's deploy.
      # #3733 security review — ordering: the deploy below with
      # --no-allow-unauthenticated removes allUsers the moment it runs, so
      # the frontend runtime SA (the sidecar's identity) and the CI SA must
      # already hold run.invoker by then; otherwise there is a window where
      # nobody can call the backend. Only when the service already exists
      # (a first deploy has nothing to bind to). The post-deploy step below
      # repeats the grants idempotently. Proxy off + IAP on fails HERE,
      # before any deploy locks a backend the browser calls directly.
      - name: （IAP_ENABLED 時）deploy 前先授權 run.invoker（服務已存在時）
        if: env.IAP_ENABLED == 'true'
        run: |
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" != "true" ]; then
            echo "::error::IAP_ENABLED=true requires SAME_ORIGIN_PROXY_ENABLED=true (browser would call the locked backend directly). Nothing deployed, no IAM change made."
            exit 1
          fi
          if ! gcloud run services describe ${{ env.BACKEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "backend service does not exist yet: nothing to grant before the first deploy"
            exit 0
          fi
          for MEMBER in \
            "serviceAccount:lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com" \
            "serviceAccount:github-actions@lingoleap-dev.iam.gserviceaccount.com"; do
            gcloud run services add-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member="$MEMBER" \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          done

      - name: Deploy backend to Cloud Run (Staging)
        run: |
          AUTH_FLAG=--allow-unauthenticated
          [ "${{ env.IAP_ENABLED }}" = "true" ] && AUTH_FLAG=--no-allow-unauthenticated
          PROXY_ENV=""
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            PROXY_ENV="::FRONTEND_PROXY_SA=lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com::BACKEND_AUDIENCE=https://lingoleap-backend-staging-958347263320.asia-east1.run.app"
          fi
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:staging-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            "$AUTH_FLAG" \
            --memory=1Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=8 \
            --concurrency=8 \
            --timeout=300s \
            --set-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-staging-db \
            --service-account=lingoleap-backend-staging-rt@lingoleap-dev.iam.gserviceaccount.com \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://lingoleap-frontend-staging-958347263320.asia-east1.run.app,https://lingoleap-frontend-958347263320.asia-east1.run.app,https://lingoleap-staging.web.app,https://lingoleap-dev.web.app::RUN_MIGRATIONS=true::AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}::AZURE_SPEECH_REGION=eastus::TTS_PROVIDER=azure::ENVIRONMENT=staging::JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET_KEY }}::GCS_OMO_BUCKET=lingoleap-omo-uploads-staging::READING_AUDIO_GCS_BUCKET=lingoleap-reading-audio-staging::BUILD_SHA=${{ github.sha }}::JUNYI_CLASS_IMPORT_ENABLED=true::JUNYI_BQ_MODE=real::PARENT_PORTAL_ENABLED=true::DB_POOL_SIZE=2::DB_MAX_OVERFLOW=0::ASYNC_THREAD_WORKERS=32::AI_FEATURES_ENABLED=true${PROXY_ENV}" \
            --update-secrets="DATABASE_URL=lingoleap-database-url-staging:latest"

      - name: Promote backend traffic to latest revision (Fixes #1449)
        run: |
          gcloud run services update-traffic ${{ env.BACKEND_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # #3719/#3733 — IAP 準備：預設關，改上面 env.IAP_ENABLED 才會跑。
      # backend **不上原生 IAP**（frontend 的 sidecar 只拿得到一般 ID token，
      # 原生 IAP 會回 401 Invalid JWT audience），改用 Cloud Run 本身的
      # 「需要驗證」：先授權 run.invoker 給 frontend 執行身分＋CI，再拿掉
      # allUsers（先給再收，不會有誰都進不去的空窗）。同源代理沒開時瀏覽器
      # 會直接打 backend，鎖了就全站 403，所以那種情況直接失敗不動 IAM。
      # 見 docs/iap-runbook.md「backend 認證方式」。
      - name: （IAP_ENABLED 時）staging backend 改成只給 frontend 與 CI 呼叫（run.invoker）
        if: env.IAP_ENABLED == 'true'
        run: |
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" != "true" ]; then
            echo "::error::IAP_ENABLED=true requires SAME_ORIGIN_PROXY_ENABLED=true (browser would call the locked backend directly). No IAM change made."
            exit 1
          fi
          for MEMBER in \
            "serviceAccount:lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com" \
            "serviceAccount:github-actions@lingoleap-dev.iam.gserviceaccount.com"; do
            gcloud run services add-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member="$MEMBER" \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          done
          POLICY=$(gcloud run services get-iam-policy ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format=json)
          if printf '%s' "$POLICY" | grep -q '"allUsers"'; then
            gcloud run services remove-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member=allUsers \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          fi

      # #3733 — CI's own calls to the invoker-locked backend: a plain Google
      # ID token for the CI SA (run.invoker granted by the IAP step), sent
      # as X-Serverless-Authorization. WIF's workloadIdentityUser already
      # includes getOpenIdToken -> no new IAM. Keeps the job's credentials.
      - name: （IAP_ENABLED 時）取 backend invoker ID token
        id: invoker
        if: env.IAP_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://lingoleap-backend-staging-958347263320.asia-east1.run.app
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify backend health
        env:
          # empty unless IAP_ENABLED -> no header, today's behavior. Backend
          # is never behind IAP, so no IAP JWT is sent to it.
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          IAP_AUTH_ARGS=()
          [ -n "${INVOKER_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}")
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$URL/")
            echo "Attempt $i: Backend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

  deploy-frontend:
    needs: [detect-changes, deploy-backend]
    if: |
      always() &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # #3733: runner gcloud has no `beta` component; `gcloud beta run deploy`
          # (IAP / two-container frontend) would die on a non-interactive install prompt.
          install_components: 'beta'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Resolve staging backend URL
        id: backend-url
        run: |
          # Use stable Cloud Run service URL (not gcloud describe which returns
          # new-format URLs like oja2sffiya-de.a.run.app that break CORS)
          URL="https://lingoleap-backend-staging-958347263320.asia-east1.run.app"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Staging frontend will use backend: ${URL}"

      - name: Build & push frontend image
        env:
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PW: ${{ secrets.DEMO_ADMIN_PW }}
          DEMO_TEACHER_EMAIL: ${{ secrets.DEMO_TEACHER_EMAIL }}
          DEMO_TEACHER_PW: ${{ secrets.DEMO_TEACHER_PW }}
          DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: |
          # #3719/#3728/#3740 — SAME_ORIGIN_PROXY_ENABLED=false (default,
          # see the env: block above for the full why): build EXACTLY like
          # today/post-#3741-revert — VITE_API_URL points straight at
          # backend's absolute URL, no BACKEND_INTERNAL_URL,
          # no BACKEND_INVOKER_SIDECAR_PORT, nginx never proxies anything.
          # =true: VITE_API_URL stays empty (relative /api/* -- apiConfig.ts
          # uses `??`, empty string isn't treated as undefined, same trick
          # the Firebase Hosting job below already relies on).
          # BACKEND_INTERNAL_URL tells this frontend's own nginx where to
          # forward same-origin /api, /assets, /q (see
          # frontend/docker/render-nginx-conf.sh). BACKEND_INVOKER_SIDECAR_PORT
          # must travel with it or the build fails outright (fail-closed
          # guard, see the env: block comment for why that's intentional).
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            PROXY_BUILD_ARGS=(--build-arg VITE_API_URL= --build-arg "BACKEND_INTERNAL_URL=${{ steps.backend-url.outputs.url }}" --build-arg BACKEND_INVOKER_SIDECAR_PORT=8081)
          else
            PROXY_BUILD_ARGS=(--build-arg "VITE_API_URL=${{ steps.backend-url.outputs.url }}")
          fi
          docker build \
            "${PROXY_BUILD_ARGS[@]}" \
            --build-arg VITE_SHOW_DEMO_LOGIN=true \
            --build-arg VITE_PARENT_PORTAL_ENABLED=true \
            --build-arg "VITE_DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL}" \
            --build-arg "VITE_DEMO_ADMIN_PW=${DEMO_ADMIN_PW}" \
            --build-arg "VITE_DEMO_TEACHER_EMAIL=${DEMO_TEACHER_EMAIL}" \
            --build-arg "VITE_DEMO_TEACHER_PW=${DEMO_TEACHER_PW}" \
            --build-arg "VITE_DEMO_STUDENT_EMAIL=${DEMO_STUDENT_EMAIL}" \
            --build-arg "VITE_DEMO_STUDENT_PW=${DEMO_STUDENT_PW}" \
            -t "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/frontend:staging-latest" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/frontend:staging-latest"

      # #3733 — invoker sidecar (scripts/run_invoker_token.py --serve) the
      # nginx same-origin proxy uses to reach the invoker-locked backend.
      # Only when the proxy is on; native amd64 runner, no QEMU.
      - name: Build & push invoker sidecar image (SAME_ORIGIN_PROXY_ENABLED)
        run: |
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" != "true" ]; then
            echo "same-origin proxy off: no sidecar image needed"
            exit 0
          fi
          docker build \
            -f scripts/invoker-sidecar/Dockerfile \
            -t "${{ env.REGISTRY }}/invoker-sidecar:staging-${{ github.sha }}" \
            .
          docker push "${{ env.REGISTRY }}/invoker-sidecar:staging-${{ github.sha }}"

      # #3733 security review — rollback: flipping IAP_ENABLED back to
      # 'false' with a frontend-only change skips deploy-backend, so the
      # backend would stay invoker-locked while the non-proxy frontend below
      # calls it straight from the browser -> whole site 403. Reopen it
      # (allUsers run.invoker, i.e. today's --allow-unauthenticated) BEFORE
      # deploying that frontend. Already public (today's normal state) -> no
      # IAM write at all.
      - name: （IAP 開關為 false 時）backend 若被鎖著就先補回 allUsers
        if: env.IAP_ENABLED != 'true'
        run: |
          if ! gcloud run services describe ${{ env.BACKEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "backend service not found: nothing to reopen"
            exit 0
          fi
          POLICY=$(gcloud run services get-iam-policy ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format=json)
          if printf '%s' "$POLICY" | grep -q '"allUsers"'; then
            echo "backend already public: nothing to reopen"
          else
            gcloud run services add-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member=allUsers \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          fi

      # #3733 — proxy on: nginx + invoker sidecar in one revision (service-
      # level flags before the first --container; sidecar env via
      # --update-env-vars; probe /healthz). Verified command in
      # docs/iap-runbook.md. Proxy off: today's single-image deploy.
      # Security review: with IAP_ENABLED the deploy itself carries --iap
      # (`gcloud beta run deploy` has --[no-]iap), so no revision ever serves
      # without IAP -- turning it on only in a later step left an anonymous
      # window in which nginx + sidecar reached the locked backend.
      - name: Deploy frontend to Cloud Run (Staging)
        run: |
          FRONTEND_IMAGE="${{ env.REGISTRY }}/frontend:staging-${{ github.sha }}"
          IAP_FLAGS=()
          GCLOUD_RUN=(gcloud run)
          if [ "${{ env.IAP_ENABLED }}" = "true" ]; then
            IAP_FLAGS=(--iap)
            GCLOUD_RUN=(gcloud beta run)
          fi
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            # #3733 (2nd attempt): an EXISTING frontend service is one UNNAMED
            # container; --container=frontend can't address it and Cloud Run
            # rejects the result ("exactly one container with an exposed
            # port"). Rename it to `frontend` first with a same-image
            # `services replace` (no other change, so that revision serves
            # exactly what the last one did), then the deploy below updates
            # it in place and adds the sidecar + --iap in ONE revision.
            # Brand-new service or already named -> nothing to do (idempotent).
            SVC_JSON=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format=json 2>/dev/null || true)
            if [ -n "$SVC_JSON" ]; then
              RENAME_SPEC="$(mktemp)"
              RENAME_RC=0
              printf '%s' "$SVC_JSON" \
                | python3 scripts/cloudrun_name_legacy_container.py frontend > "$RENAME_SPEC" \
                || RENAME_RC=$?
              if [ "$RENAME_RC" = "0" ]; then
                gcloud run services replace "$RENAME_SPEC" \
                  --region ${{ env.REGION }} \
                  --project ${{ env.PROJECT_ID }}
              elif [ "$RENAME_RC" != "10" ]; then
                echo "::error::frontend service has an unexpected container layout; not deploying"
                exit 1
              fi
            fi
            gcloud beta run deploy ${{ env.FRONTEND_SERVICE }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --service-account lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com \
              --allow-unauthenticated \
              ${IAP_FLAGS[@]+"${IAP_FLAGS[@]}"} \
              --min-instances=0 \
              --max-instances=1 \
              --timeout=300s \
              --container=frontend \
                --image="$FRONTEND_IMAGE" \
                --port=8080 \
                --memory=512Mi \
                --cpu=1 \
                --depends-on=sidecar \
              --container=sidecar \
                --image="${{ env.REGISTRY }}/invoker-sidecar:staging-${{ github.sha }}" \
                --memory=256Mi \
                --update-env-vars="BACKEND_INVOKER_AUDIENCE=https://lingoleap-backend-staging-958347263320.asia-east1.run.app" \
                --startup-probe=httpGet.port=8081,httpGet.path=/healthz,periodSeconds=2,failureThreshold=3
          else
            "${GCLOUD_RUN[@]}" deploy ${{ env.FRONTEND_SERVICE }} \
              --image "$FRONTEND_IMAGE" \
              --platform managed \
              --region ${{ env.REGION }} \
              --service-account lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com \
              --project ${{ env.PROJECT_ID }} \
              --allow-unauthenticated \
              ${IAP_FLAGS[@]+"${IAP_FLAGS[@]}"} \
              --port 8080 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=1 \
              --timeout=300s
          fi

      - name: Promote frontend traffic to latest revision (Fixes #1449)
        run: |
          gcloud run services update-traffic ${{ env.FRONTEND_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # #3719 — IAP 準備：同上，預設關。The deploy above already carries
      # --iap; this stays as an idempotent re-assert.
      - name: （IAP_ENABLED 時）替 staging frontend 開 IAP
        if: env.IAP_ENABLED == 'true'
        run: |
          gcloud beta run services update ${{ env.FRONTEND_SERVICE }} \
            --iap \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # #3733 — rollback half: `gcloud run deploy` never touches the IAP
      # setting, so flipping IAP_ENABLED back to 'false' alone would leave
      # a once-locked frontend locked. Only acts if IAP is actually on.
      - name: （IAP_ENABLED 關時）staging frontend 若還開著 IAP 就關掉
        if: env.IAP_ENABLED != 'true'
        run: |
          IAP_ON=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(metadata.annotations."run.googleapis.com/iap-enabled")' 2>/dev/null || true)
          if [ "$IAP_ON" = "true" ]; then
            gcloud beta run services update ${{ env.FRONTEND_SERVICE }} \
              --no-iap \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }}
          else
            echo "frontend has no IAP on: nothing to undo"
          fi

      # #3733 — with IAP on, sign the IAP JWT for THIS frontend's URL (no
      # longer only from an unset secret); CI signs via IAM Credentials as
      # itself (needs serviceAccountTokenCreator on itself + IAP access).
      - name: Verify frontend health
        env:
          IAP_AUDIENCE: ${{ env.IAP_ENABLED == 'true' && 'https://lingoleap-frontend-staging-958347263320.asia-east1.run.app' || secrets.IAP_AUDIENCE }}
          IAP_SIGNING_SA_EMAIL: github-actions@lingoleap-dev.iam.gserviceaccount.com
        run: |
          source scripts/lib/iap-token.sh
          IAP_AUTH_ARGS=()
          IAP_TOKEN="$(iap_token "${IAP_AUDIENCE:-}")"
          if [ -n "${IAP_TOKEN}" ]; then
            echo "::add-mask::${IAP_TOKEN}"
            IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          fi
          # IAP checks the JWT aud against the exact hostname requested, and
          # status.url is the hash (oja2sffiya-de) host while the aud above is
          # the -958347263320 one -> with IAP on, curl the URL we signed for.
          if [ -n "${IAP_AUDIENCE:-}" ]; then
            URL="${IAP_AUDIENCE}"
          else
            URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format='value(status.url)')
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$URL/")
            echo "Attempt $i: Frontend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Show staging deployment summary
        if: always()
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          {
            echo "## Staging Deployment Complete"
            echo ""
            echo "**Frontend (Cloud Run):** ${FRONTEND_URL}"
            echo "**Frontend (Firebase staging):** https://lingoleap-staging.web.app"
            echo "**Frontend (Firebase dev):** https://lingoleap-dev.web.app"
            echo "**Backend:** ${BACKEND_URL}"
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # find_01GSz5fbgsPuuK3ieTGopD8B (HIGH): same split as deploy.yml's prod
  # Firebase job (find_01YP72Td7XmwD2J4TU5nTMgd) -- the install/build code
  # and the live GCP credential must not share a job. Staging had already
  # moved to WIF (#3840); what remained was the unpinned
  # `npm install -g firebase-tools@13` running inside the credentialed job.
  build-frontend-firebase:
    name: Build frontend for Firebase Hosting (staging + dev)
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.firebase == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Firebase (relative API paths + demo creds)
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_SHOW_DEMO_LOGIN: "true"
          VITE_PARENT_PORTAL_ENABLED: "true"
          VITE_DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          VITE_DEMO_ADMIN_PW: ${{ secrets.DEMO_ADMIN_PW }}
          VITE_DEMO_TEACHER_EMAIL: ${{ secrets.DEMO_TEACHER_EMAIL }}
          VITE_DEMO_TEACHER_PW: ${{ secrets.DEMO_TEACHER_PW }}
          VITE_DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          VITE_DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: npm run build

      - name: Upload frontend/dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebase-staging-dist
          path: frontend/dist
          retention-days: 1

  deploy-frontend-firebase:
    name: Deploy frontend to Firebase Hosting (staging + dev)
    needs: [detect-changes, build-frontend-firebase]
    if: |
      needs.detect-changes.outputs.firebase == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend/dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firebase-staging-dist
          path: frontend/dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # Pinned exact version + full-tree integrity hashes (committed
      # .github/firebase-cli/package-lock.json) -- see deploy.yml for the
      # full rationale (find_01YP72Td7XmwD2J4TU5nTMgd /
      # find_01GSz5fbgsPuuK3ieTGopD8B).
      - name: Install pinned Firebase CLI
        working-directory: .github/firebase-cli
        run: npm ci --ignore-scripts

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting (staging + dev)
        run: |
          "$GITHUB_WORKSPACE/.github/firebase-cli/node_modules/.bin/firebase" deploy \
            --only hosting:staging,hosting:dev \
            --project lingoleap-dev \
            --non-interactive \
            --message "Deploy ${COMMIT_SHA}"

      - name: Verify Firebase sites
        run: |
          for site in lingoleap-staging lingoleap-dev; do
            # #3733: these sites only forward (302) to the staging Cloud Run
            # frontend; a rewrite to the locked staging backend would 403.
            # The root needs its own check: "/:path*" never matched it and `/`
            # kept serving index.html (200) while deeper paths were 302.
            OUT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://${site}.web.app/")
            echo "${site}.web.app/: ${OUT}"
            if [ "$OUT" != "302 https://lingoleap-frontend-staging-958347263320.asia-east1.run.app/" ]; then
              echo "::error::${site}.web.app/ does not forward to the staging frontend (got: ${OUT})"
              exit 1
            fi
            OUT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://${site}.web.app/learn/x?a=1")
            echo "${site}.web.app: ${OUT}"
            if [ "$OUT" != "302 https://lingoleap-frontend-staging-958347263320.asia-east1.run.app/learn/x?a=1" ]; then
              echo "::error::${site}.web.app does not forward to the staging frontend (got: ${OUT})"
              exit 1
            fi
          done

  smoke-test:
    name: Smoke test staging API
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_BACKEND: https://lingoleap-backend-staging-958347263320.asia-east1.run.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #3719 — IAP 準備：staging 未來可能在前面加一層 IAP。IAP_AUDIENCE 沒有
      # 任何 secret 可讀（還沒打開 IAP），所以下面每一步都跟今天完全一樣——
      # 這一步只是把「打開時只要設一個 secret」這件事準備好。
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # #3733 — Smoke tests' calls to the invoker-locked backend: a plain Google
      # ID token for the CI SA (run.invoker granted by the IAP step), sent
      # as X-Serverless-Authorization. WIF's workloadIdentityUser already
      # includes getOpenIdToken -> no new IAM. Keeps the job's credentials.
      - name: （IAP_ENABLED 時）取 backend invoker ID token
        id: invoker
        if: env.IAP_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://lingoleap-backend-staging-958347263320.asia-east1.run.app
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false


      - name: Wait for Cloud Run to be ready
        run: sleep 15

      # #3733 security review — negative check. The checks below prove CI's
      # own token works; this proves an anonymous caller does NOT get in.
      # No credentials at all: backend must answer 403 (Cloud Run invoker
      # check), frontend must answer 302 (IAP -> Google login) / 401 / 403,
      # never 200. Anything else fails the job.
      - name: （IAP_ENABLED 時）未帶憑證必須被擋（backend 403、frontend 非 200）
        if: env.IAP_ENABLED == 'true'
        env:
          STAGING_FRONTEND: https://lingoleap-frontend-staging-958347263320.asia-east1.run.app
        run: |
          BE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${STAGING_BACKEND}/api/health")
          FE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${STAGING_FRONTEND}/")
          echo "anonymous: backend /api/health -> $BE, frontend / -> $FE"
          FAIL=0
          if [ "$BE" != "403" ]; then
            echo "::error::anonymous backend /api/health returned $BE, expected 403 (backend not locked)"
            FAIL=1
          fi
          case "$FE" in
            302|401|403) ;;
            *) echo "::error::anonymous frontend / returned $FE, expected 302/401/403 (frontend not behind IAP)"; FAIL=1 ;;
          esac
          exit "$FAIL"

      - name: Smoke test /api/health (expect 200)
        env:
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          IAP_AUTH_ARGS=(); [ -n "${INVOKER_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/health")
          echo "/api/health -> $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/health returned $STATUS, expected 200"
            exit 1
          fi

      # #3740 — live lock on the real topology: a request that goes through
      # the frontend's same-origin proxy must be counted in the SAME per-IP
      # bucket as this runner's direct request. Direct d1 -> proxied p ->
      # direct d2: shared bucket means p == d1-1 and d2 == d1-2. If backend
      # stops trusting the proxy's X-Client-IP (e.g. the sidecar token lost
      # its email claim), the proxied request lands in the frontend egress
      # IP's bucket and d2 == d1-1 instead. Buckets are per instance, so a
      # round can be inconclusive; any of 5 rounds passing is enough.
      - name: （IAP_ENABLED 時）經前端轉送的請求與直連同一個限流額度（#3740）
        if: env.IAP_ENABLED == 'true'
        env:
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
          STAGING_FRONTEND: https://lingoleap-frontend-staging-958347263320.asia-east1.run.app
          IAP_SIGNING_SA_EMAIL: github-actions@lingoleap-dev.iam.gserviceaccount.com
        run: |
          source scripts/lib/iap-token.sh
          # aud must cover the PATH requested: a bare-URL aud only passes for
          # "/" (run 43933120659: /api/health got IAP 401 with a valid JWT,
          # while the "/" health check with the same signing passed). "/*"
          # is one of the aud forms the iap-runbook lists as accepted.
          IAP_TOKEN="$(iap_token "${STAGING_FRONTEND}/*")"
          if [ -z "${IAP_TOKEN}" ]; then
            echo "::error::could not sign an IAP token for the frontend"
            exit 1
          fi
          echo "::add-mask::${IAP_TOKEN}"
          # Shape only, never the value: a JWT has 3 dot-separated parts.
          echo "IAP token: ${#IAP_TOKEN} chars, $(printf '%s' "$IAP_TOKEN" | awk -F. '{print NF}') parts"
          HDRS="$(mktemp)"
          remaining() {
            curl -s -D "$HDRS" -o /dev/null --max-time 30 "$@" || true
            tr -d '\r' < "$HDRS" | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}'
          }
          # When the proxied call carries no rate-limit header, say why:
          # status line plus IAP's own rejection headers (no token values).
          explain() {
            tr -d '\r' < "$HDRS" | grep -iE '^HTTP/|^www-authenticate:|^x-goog-iap-generated-response:|^location:' \
              | sed -E 's/(location: [^?]*)\?.*/\1?.../I' | head -5
          }
          direct() { remaining -H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}" "${STAGING_BACKEND}/api/health"; }
          proxied() { remaining -H "Proxy-Authorization: Bearer ${IAP_TOKEN}" "${STAGING_FRONTEND}/api/health"; }
          for round in 1 2 3 4 5; do
            D1=$(direct); P=$(proxied); [ -z "$P" ] && WHY="$(explain)"; D2=$(direct)
            echo "round $round: direct=$D1 proxied=$P direct=$D2"
            if [ -z "$D1" ] || [ -z "$P" ] || [ -z "$D2" ]; then
              [ -z "$P" ] && printf 'proxied response:\n%s\n' "$WHY"
              echo "::warning::round $round missing X-RateLimit-Remaining; retrying"
            elif [ "$P" = "$((D1 - 1))" ] && [ "$D2" = "$((D1 - 2))" ]; then
              echo "proxied request counted in the runner's own bucket"
              exit 0
            fi
            sleep 2
          done
          echo "::error::proxied requests are not keyed on the real client IP (#3740)"
          exit 1

      - name: Smoke test /api/teacher/story-tags (expect 200 or 401, not 500)
        env:
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          IAP_AUTH_ARGS=(); [ -n "${INVOKER_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/teacher/story-tags")
          echo "/api/teacher/story-tags -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/teacher/story-tags returned 500"
            exit 1
          fi

      - name: Smoke test /api/schools (expect 200 or 401, not 500)
        env:
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          IAP_AUTH_ARGS=(); [ -n "${INVOKER_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/schools")
          echo "/api/schools -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/schools returned 500"
            exit 1
          fi

      - name: Smoke test /api/organizations (expect 200 or 401, not 500)
        env:
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          IAP_AUTH_ARGS=(); [ -n "${INVOKER_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "${STAGING_BACKEND}/api/organizations")
          echo "/api/organizations -> $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "FAIL: /api/organizations returned 500"
            exit 1
          fi

      - name: Smoke test summary
        if: always()
        run: |
          {
            echo "## Smoke Test Results"
            echo ""
            echo "**Target**: ${STAGING_BACKEND}"
            echo ""
            echo "| Endpoint | Acceptable Status |"
            echo "|----------|------------------|"
            echo "| GET /health | 200 only |"
            echo "| GET /api/teacher/story-tags | 200 or 401 (not 500) |"
            echo "| GET /api/schools | 200 or 401 (not 500) |"
            echo "| GET /api/organizations | 200 or 401 (not 500) |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-images:
    name: Cleanup old AR images
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Delete old staging images (keep latest 5)
        run: |
          # Cleanup is best-effort. Historical registry has 1000+ images;
          # serial deletes at ~4s each would run ~1.7h. Cap via an internal
          # deadline that exits 0 so the job reports success. GCP's
          # keep-recent-tagged=3 async policy handles the rest.
          KEEP=5
          DEADLINE=$(( $(date +%s) + 540 ))  # 9 min hard stop
          for PACKAGE in backend frontend invoker-sidecar; do  # #3733: sidecar image (proxy on)
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Deadline reached before ${PACKAGE}; leaving rest to GCP async policy"
              break
            fi
            echo "=== Cleaning ${PACKAGE} staging images ==="
            DIGESTS=$(gcloud artifacts docker images list \
              "$REGISTRY/${PACKAGE}" \
              --include-tags \
              --filter="tags:staging-" \
              --sort-by="~CREATE_TIME" \
              --format="value(version)" 2>/dev/null || true)

            if [ -z "$DIGESTS" ]; then
              echo "No images found, skipping"
              continue
            fi

            TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
            echo "Found $TOTAL images, keeping latest $KEEP"

            echo "$DIGESTS" | tail -n +$((KEEP + 1)) | while read -r DIGEST; do
              [ -z "$DIGEST" ] && continue
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "Deadline reached; $(date +%s) >= $DEADLINE. Stopping."
                break
              fi
              echo "DELETE: ${DIGEST:0:20}..."
              gcloud artifacts docker images delete \
                "$REGISTRY/${PACKAGE}@${DIGEST}" \
                --delete-tags --quiet 2>/dev/null || true
            done
          done
          echo "Cleanup step finished (may be partial; GCP async policy handles remainder)"

  notify-staging:
    name: Notify referenced issues
    needs: smoke-test
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comment on referenced issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Parse Fixes/Closes/Refs #N from commit message (passed via env var — safe)
          ISSUES=$(echo "$COMMIT_MSG" | grep -oiE '(fixes|closes|refs) #[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUES" ]; then
            echo "No referenced issues found in commit message — skipping notify"
            exit 0
          fi
          REPO="${{ github.repository }}"
          STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
          for ISSUE_NUM in $ISSUES; do
            echo "Commenting on issue #${ISSUE_NUM}"
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "$(printf '## Deployed to Staging\n\nSmoke tests passed.\n\n**Staging URL**: %s\n\nNext step: request case owner testing.' "${STAGING_URL}")"
          done

  cleanup-branch:
    name: Delete merged feature branch
    needs: notify-staging
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Delete remote feature branch if applicable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Squash merges: commit message format "fix: description (#N)"
          # Merge commits: "Merge pull request #N from owner/branch-name"
          # Extract branch name from merge commit format only
          BRANCH=$(echo "$COMMIT_MSG" | grep -oP '(?<=from )[^/]+/\K\S+' || true)

          if [ -z "$BRANCH" ]; then
            echo "Could not extract branch name from commit message — skipping cleanup"
            exit 0
          fi

          # Only delete feature/fix/feat branches (never staging, main, etc.)
          if echo "$BRANCH" | grep -qE '^(fix/issue-|feat/issue-|feature/issue-)'; then
            REPO="${{ github.repository }}"
            echo "Deleting remote branch: $BRANCH"
            gh api "repos/${REPO}/git/refs/heads/${BRANCH}" -X DELETE && \
              echo "Deleted $BRANCH" || \
              echo "Branch $BRANCH not found or already deleted — OK"
          else
            echo "Branch '$BRANCH' is not a feature branch — skipping cleanup"
          fi
