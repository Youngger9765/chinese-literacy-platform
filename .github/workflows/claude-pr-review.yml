name: Claude PR Review

# ⛔ DISABLED 2026-11-06: prompt-injection to secret exfiltration; re-enable
# only after a sandboxed redesign. See docs/security/L1-CHECKLIST.md.
# (Workflow disabled via GitHub's own "disable workflow" switch --
# `gh workflow list --all` shows `disabled_manually` -- not by the `on:`
# trigger below. Do not re-enable as a side effect of editing this file.)

on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Only trigger when someone comments @claude on a PR
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      (
        github.event.comment.user.login == 'Youngger9765' ||
        github.event.comment.user.login == 'if-else-master' ||
        github.event.comment.user.login == 'stgst' ||
        github.event.comment.user.login == 'Shinjou'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Claude Security finding "PR-review agent can be prompt-injected by
      # fork PR diff to leak runner secrets publicly" (high), recommendation
      # part 2: this job carried id-token: write with nothing in the
      # workflow that calls Google Cloud -- a successful prompt injection
      # from a fork PR's diff (untrusted, attacker-controlled text this job
      # reads via `gh pr diff`) could exchange that OIDC token for the
      # prod-deploy identity, since the WIF provider accepted any token
      # from this repository. Dropped entirely.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false  # don't leave a token'd git config lying around for the agent's own shell to find

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            你是 LingoLeap 專案的 code reviewer。用中文留言。
            讀 REVIEW.md 了解專案 review 規則。

            流程：
            1. 用 gh pr diff 讀完整 diff
            2. 讀改動的檔案原始碼理解 context
            3. 用 inline comment 標註具體行數的問題
            4. 最後用 gh pr comment 給總結

            嚴重問題標 🔴，建議標 🟡，讚賞標 🟢
            總結：可以 merge / 需要修改
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
