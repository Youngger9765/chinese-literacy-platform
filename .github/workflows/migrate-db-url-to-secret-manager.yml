# One-shot (#3999, Junyi security baseline rule 7): copy the three DB URLs
# that today live as GitHub secrets into Secret Manager, so deploy workflows
# can bind DATABASE_URL from Secret Manager and the GitHub secrets can then
# be deleted. workflow_dispatch only; values are never printed.
# Delete this file (and its WIF allow-list entry) once the copy is verified.
name: Migrate DB URL to Secret Manager (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Add secret versions (values never echoed)
        env:
          PROD_URL: ${{ secrets.DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PREVIEW_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          add() {
            if [ -z "$2" ]; then echo "::error::$1 source is empty"; exit 1; fi
            printf '%s' "$2" | gcloud secrets versions add "$1" --data-file=- --project=lingoleap-dev --format='value(name)'
          }
          add lingoleap-database-url-prod "$PROD_URL"
          add lingoleap-database-url-staging "$STAGING_URL"
          add lingoleap-database-url-preview "$PREVIEW_URL"
          for n in prod staging preview; do
            echo "lingoleap-database-url-$n versions: $(gcloud secrets versions list lingoleap-database-url-$n --project=lingoleap-dev --format='value(name)' | wc -l)"
          done
