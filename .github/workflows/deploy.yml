name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# find_01YP72Td7XmwD2J4TU5nTMgd (CRITICAL): `id-token: write` used to sit
# here, so EVERY job below inherited it -- including jobs that run `npm ci`
# / `vite build` / third-party installs, which could mint an OIDC token
# directly (ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN are ambient env vars once a
# job has the permission, with or without ever calling
# google-github-actions/auth) and exchange it at Google STS for the prod
# deploy service account. `id-token: write` now lives ONLY as a per-job
# override, on the exact jobs that call `google-github-actions/auth@v2`
# (deploy-backend, deploy-frontend, deploy-frontend-firebase,
# cleanup-images) -- any job without its own `permissions:` block gets
# none, because GitHub Actions does not merge a job-level block with the
# workflow-level one; it replaces it, and a job with NO block of its own
# inherits this one unchanged.
permissions:
  contents: read

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  BACKEND_SERVICE: lingoleap-backend
  FRONTEND_SERVICE: lingoleap-frontend

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      firebase: ${{ steps.filter.outputs.firebase }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            firebase:
              - 'firebase.json'
              - '.firebaserc'
              - 'frontend/**'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:prod-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/backend:prod-latest" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:prod-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/backend:prod-latest"

      # ⚠️ 下面那個 deploy 的 --memory 是 1Gi 不是 512Mi（#3266）。
      #    512Mi 下近 30 天 OOM 三次（2026-08-29 / 09-02 / 09-16，三個不同 revision），
      #    每次都伴隨「The request was aborted because there was no available instance」
      #    —— 使用者真的看到失敗：
      #      2026-09-16T12:18  Memory limit of 512 MiB exceeded with 514 MiB used
      #      2026-09-16T12:19  9x no available instance
      #    這個後端常駐要放注音表（8.3 MB）＋ jieba 字典＋字型讀音表＋課文 YAML 的
      #    lru_cache，514/512 的餘裕本來就是負的。
      #    不要為了省錢調回 512Mi —— 差額量級是每月美分，代價是拒絕服務。
      #    鎖：backend/specs/test_workflow_path_filters_spec.py（test_backend_memory_is_at_least_1gi）
      # Classroom capacity (2026-10-16, measured on staging): reading recordings are
      # transcoded with ffmpeg (CPU-bound), so 30 students reading at once must be
      # spread over several instances and each instance needs 2 vCPU. Concurrency
      # 8 forces the spread; with concurrency 40 all 30 landed on one 1-vCPU
      # instance (median 31 s). 2 vCPU + 8 per instance, warm: median 6.9 s.
      # min 3 warm instances so a class never waits for cold starts (~15-25 s
      # each); max 12. DB pool 6+2 per instance = 96 < 100 (db-custom-1-3840).
      #
      # #3999 (Junyi security baseline rule 7): DATABASE_URL used to ride in
      # the bulk env-vars string above as a literal value from the
      # `secrets.DATABASE_URL` GitHub Actions secret. It's bound below
      # instead via a dedicated secrets flag pointed at a Secret Manager
      # secret (`lingoleap-database-url-prod:latest`, project
      # `lingoleap-dev`) -- the runtime service account
      # (`lingoleap-junyi-bq@lingoleap-dev.iam.gserviceaccount.com`, used
      # just above) already has `secretAccessor` on it. gcloud CLI reference
      # (https://docs.cloud.google.com/sdk/gcloud/reference/run/deploy):
      # the bulk env-vars flag and the dedicated secrets flag are two
      # independent "at most one of" groups, so both can be given to the
      # same deploy invocation below -- since DATABASE_URL now appears in
      # only one of them, the resulting revision never tries to bind the
      # same key as both a literal value and a secret reference.
      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:prod-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --memory=1Gi \
            --cpu=2 \
            --min-instances=3 \
            --max-instances=12 \
            --concurrency=8 \
            --timeout=300s \
            --add-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-db \
            --service-account=lingoleap-junyi-bq@lingoleap-dev.iam.gserviceaccount.com \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://lingoleap-frontend-958347263320.asia-east1.run.app,https://lingoleap-prod.web.app::RUN_MIGRATIONS=true::AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}::AZURE_SPEECH_REGION=eastus::TTS_PROVIDER=azure::ENVIRONMENT=production::ENABLE_TEST_SEED=false::JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET_KEY }}::GCS_OMO_BUCKET=lingoleap-omo-uploads-prod::READING_AUDIO_GCS_BUCKET=lingoleap-reading-audio-prod::BUILD_SHA=${{ github.sha }}::JUNYI_CLASS_IMPORT_ENABLED=true::JUNYI_BQ_MODE=real::DB_POOL_SIZE=6::DB_MAX_OVERFLOW=2::ASYNC_THREAD_WORKERS=32::AI_FEATURES_ENABLED=true" \
            --update-secrets="DATABASE_URL=lingoleap-database-url-prod:latest"

      # #3162: staging has had this since #1449; production never got it.
      #
      # Why it matters: once anyone runs `update-traffic --to-revisions` against a
      # service (a canary, an A/B, a rollback), that service switches permanently
      # from automatic to pinned mode. Every later `gcloud run deploy` then builds a
      # revision and does NOT move traffic -- with no warning of any kind. The old
      # revision still answers 200 and still reports Ready=True, so the health check
      # below stays green while nothing ships. This repo lost five days and five
      # all-green deploys to exactly that.
      - name: "Promote backend traffic to latest revision (#3162, mirrors #1449 on staging)"
        run: |
          gcloud run services update-traffic ${{ env.BACKEND_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # The only claim that means "deployed": the revision serving 100% of traffic
      # runs the image built by THIS run. `services describe` returns the spec
      # template (which image the NEXT revision would use), not what is live --
      # reading that field is how the five-day gap went unnoticed.
      - name: "Assert serving backend revision runs this build (#3162)"
        run: |
          set -euo pipefail
          # Traffic must be on the revision this run created. The failure this
          # guards is pinned mode: after anyone runs `update-traffic --to-revisions`
          # once, every later deploy builds a revision and does not move traffic,
          # with no warning, while the old revision keeps answering 200.
          #
          # Three earlier attempts here, and the first two were written without
          # ever being run (#3166):
          #   value(status.traffic.filter("percent=100").revisionName)
          #        gcloud rejects it outright ("Transform function expected"), so
          #        REV came back empty and this step failed a correct deploy.
          #   --flatten plus --filter
          #        `run services describe` does not accept --filter at all.
          #   gcloud artifacts docker images describe, for a digest compare
          #        needs artifactregistry.repositories.get, and the original
          #        swallowed failure with `|| echo ""` -- so the comparison would
          #        have silently vanished wherever that permission is missing.
          # Comparing with latestReadyRevisionName needs no extra permission and
          # targets the actual failure. Every command below was run against the
          # live services before landing.
          SERVING=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format='value(status.traffic)' \
            | python3 -c 'import sys,ast; rows=[ast.literal_eval(l) for l in sys.stdin if l.strip()]; hit=[r for r in rows if r.get("percent")==100]; print(hit[0]["revisionName"] if hit else "")')
          LATEST=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format='value(status.latestReadyRevisionName)')
          echo "serving revision     : ${SERVING:-<none>}"
          echo "latest ready revision: ${LATEST:-<none>}"
          if [ -z "$SERVING" ]; then
            echo "FAIL: no single revision serves 100% of traffic - split or pinned."
            exit 1
          fi
          if [ "$SERVING" != "$LATEST" ]; then
            echo "FAIL: traffic is on $SERVING but newest ready is $LATEST."
            echo "Service is probably pinned. Fix: update-traffic --to-latest"
            exit 1
          fi
          echo "OK - traffic is on this build."
      - name: Verify backend health
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: Backend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push frontend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/frontend:prod-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/frontend:prod-latest" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:prod-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/frontend:prod-latest"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/frontend:prod-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com \
            --project ${{ env.PROJECT_ID }} \
            --port 8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300s

      # #3162: staging has had this since #1449; production never got it.
      #
      # Why it matters: once anyone runs `update-traffic --to-revisions` against a
      # service (a canary, an A/B, a rollback), that service switches permanently
      # from automatic to pinned mode. Every later `gcloud run deploy` then builds a
      # revision and does NOT move traffic -- with no warning of any kind. The old
      # revision still answers 200 and still reports Ready=True, so the health check
      # below stays green while nothing ships. This repo lost five days and five
      # all-green deploys to exactly that.
      - name: "Promote frontend traffic to latest revision (#3162, mirrors #1449 on staging)"
        run: |
          gcloud run services update-traffic ${{ env.FRONTEND_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # The only claim that means "deployed": the revision serving 100% of traffic
      # runs the image built by THIS run. `services describe` returns the spec
      # template (which image the NEXT revision would use), not what is live --
      # reading that field is how the five-day gap went unnoticed.
      - name: "Assert serving frontend revision runs this build (#3162)"
        run: |
          set -euo pipefail
          # Traffic must be on the revision this run created. The failure this
          # guards is pinned mode: after anyone runs `update-traffic --to-revisions`
          # once, every later deploy builds a revision and does not move traffic,
          # with no warning, while the old revision keeps answering 200.
          #
          # Three earlier attempts here, and the first two were written without
          # ever being run (#3166):
          #   value(status.traffic.filter("percent=100").revisionName)
          #        gcloud rejects it outright ("Transform function expected"), so
          #        REV came back empty and this step failed a correct deploy.
          #   --flatten plus --filter
          #        `run services describe` does not accept --filter at all.
          #   gcloud artifacts docker images describe, for a digest compare
          #        needs artifactregistry.repositories.get, and the original
          #        swallowed failure with `|| echo ""` -- so the comparison would
          #        have silently vanished wherever that permission is missing.
          # Comparing with latestReadyRevisionName needs no extra permission and
          # targets the actual failure. Every command below was run against the
          # live services before landing.
          SERVING=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format='value(status.traffic)' \
            | python3 -c 'import sys,ast; rows=[ast.literal_eval(l) for l in sys.stdin if l.strip()]; hit=[r for r in rows if r.get("percent")==100]; print(hit[0]["revisionName"] if hit else "")')
          LATEST=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format='value(status.latestReadyRevisionName)')
          echo "serving revision     : ${SERVING:-<none>}"
          echo "latest ready revision: ${LATEST:-<none>}"
          if [ -z "$SERVING" ]; then
            echo "FAIL: no single revision serves 100% of traffic - split or pinned."
            exit 1
          fi
          if [ "$SERVING" != "$LATEST" ]; then
            echo "FAIL: traffic is on $SERVING but newest ready is $LATEST."
            echo "Service is probably pinned. Fix: update-traffic --to-latest"
            exit 1
          fi
          echo "OK - traffic is on this build."
      - name: Verify frontend health
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: Frontend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Show deployment summary
        if: always()
        run: |
          {
            echo "## Production Deployment Complete"
            echo ""
            echo "**Frontend (Cloud Run):** https://lingoleap-frontend-958347263320.asia-east1.run.app"
            echo "**Frontend (Firebase):** https://lingoleap-prod.web.app"
            echo "**Backend:** https://lingoleap-backend-958347263320.asia-east1.run.app"
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # find_01YP72Td7XmwD2J4TU5nTMgd (CRITICAL): this used to be ONE job that
  # ran `npm ci` + `npm install -g firebase-tools@13` + `vite build` AND
  # `google-github-actions/auth@v2` AND `firebase deploy`. Moving the
  # installs before the auth step (find_01WStrhArZsNRHeb92RWHZRE) did not
  # close the hole: the job still had `id-token: write` in scope for its
  # entire runtime (an ambient permission, not something that starts
  # existing only once `auth@v2` runs), so malicious code in `npm ci` /
  # `vite build` could mint its own OIDC token via
  # ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN and exchange it at Google STS
  # directly -- bypassing `auth@v2` entirely, regardless of step order.
  #
  # Split into two jobs so the two capabilities (run third-party install/
  # build code; hold a live GCP credential) never coexist in the same job:
  #   - build-frontend-firebase: no GCP credential, no id-token. Builds
  #     frontend/dist and hands it off as a plain workflow artifact.
  #   - deploy-frontend-firebase: downloads that artifact (already-built
  #     static files, nothing left to "install" or "build"), authenticates,
  #     and deploys. The only non-Google-Action code it runs is the
  #     Firebase CLI, now pinned by .github/firebase-cli's committed
  #     package-lock.json (find_01GSz5fbgsPuuK3ieTGopD8B) instead of a
  #     floating `npm install -g firebase-tools@13`.
  build-frontend-firebase:
    name: Build frontend for Firebase Hosting (prod)
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.firebase == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Firebase (relative API paths, no demo login)
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_SHOW_DEMO_LOGIN: "false"
        run: npm run build

      - name: Upload frontend/dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firebase-prod-dist
          path: frontend/dist
          retention-days: 1

  deploy-frontend-firebase:
    name: Deploy frontend to Firebase Hosting (prod)
    needs: [detect-changes, build-frontend-firebase]
    if: |
      needs.detect-changes.outputs.firebase == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download frontend/dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firebase-prod-dist
          path: frontend/dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Pinned exact version + full-tree integrity hashes (committed
      # .github/firebase-cli/package-lock.json) -- a newly published
      # firebase-tools release can't change what this credentialed step
      # runs without a reviewed change to that lockfile. --ignore-scripts:
      # verified locally the CLI needs no install-time lifecycle scripts
      # to run `firebase deploy --only hosting:*`.
      - name: Install pinned Firebase CLI
        working-directory: .github/firebase-cli
        run: npm ci --ignore-scripts

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting (prod)
        run: |
          "$GITHUB_WORKSPACE/.github/firebase-cli/node_modules/.bin/firebase" deploy \
            --only hosting:prod \
            --project lingoleap-dev \
            --non-interactive \
            --message "Deploy ${COMMIT_SHA}"

      - name: Verify Firebase site
        run: |
          for i in 1 2 3 4 5; do
            FE=$(curl -s -o /dev/null -w '%{http_code}' https://lingoleap-prod.web.app/)
            API=$(curl -s -o /dev/null -w '%{http_code}' https://lingoleap-prod.web.app/api/health)
            echo "Attempt $i: FE=$FE /api/health=$API"
            if [ "$FE" = "200" ] && [ "$API" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Firebase prod site verification failed"
          exit 1

  post-deploy-healthcheck:
    name: Post-deploy health check
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloud Run rollout
        run: sleep 15
      - name: Check backend health
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://lingoleap-backend-958347263320.asia-east1.run.app/api/health || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Backend: HTTP $STATUS ✅"
      - name: Check frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://lingoleap-frontend-958347263320.asia-east1.run.app/ || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Frontend: HTTP $STATUS ✅"

  cleanup-images:
    name: Cleanup old AR images
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Delete old production images (keep latest 5)
        run: |
          KEEP=5
          for PACKAGE in backend frontend; do
            echo "=== Cleaning ${PACKAGE} prod images ==="
            DIGESTS=$(gcloud artifacts docker images list \
              "$REGISTRY/${PACKAGE}" \
              --include-tags \
              --filter="tags:prod-" \
              --sort-by="~CREATE_TIME" \
              --format="value(version)" 2>/dev/null || true)

            if [ -z "$DIGESTS" ]; then
              echo "No images found, skipping"
              continue
            fi

            TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
            echo "Found $TOTAL images, keeping latest $KEEP"

            echo "$DIGESTS" | tail -n +$((KEEP + 1)) | while read -r DIGEST; do
              [ -z "$DIGEST" ] && continue
              echo "DELETE: ${DIGEST:0:20}..."
              gcloud artifacts docker images delete \
                "$REGISTRY/${PACKAGE}@${DIGEST}" \
                --delete-tags --quiet 2>/dev/null || true
            done
          done

  notify-issues:
    name: Notify resolved issues (label + comment, no close)
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Add deployed-to-prod label + comment (NEVER auto-close)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Per LingoLeap policy: only Young closes issues. CI may comment + label
            // ("ai-qa-passed", "deployed-to-prod") but must leave issues OPEN so Young
            // can verify with human eyes before closing.

            // ⚠️ `payload.before/after` 只有 push 事件才有。
            // 手動觸發（workflow_dispatch）時它們是 undefined，
            // compareCommits 會回 404 —— 整個 job 紅掉，而部署其實是成功的。
            // 2026-08-27 連兩次都掛在這裡。手動觸發時改看最近一次 push 的範圍。
            const before = context.payload.before;
            const after = context.payload.after || context.sha;
            if (!before || !after || /^0+$/.test(before)) {
              console.log(`No push range (event=${context.eventName}) — skipping issue notification`);
              return;
            }

            let compare;
            try {
              compare = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: before,
                head: after,
              });
            } catch (e) {
              // 找不到範圍不該讓部署 job 變紅 —— 它只是「沒能貼標籤」。
              console.log(`compareCommits failed (${e.status}): ${e.message} — skipping`);
              return;
            }

            const issueNumbers = new Set();
            const patterns = [
              /(?:fixes|closes|resolves|related to)\s+#(\d+)/gi,
              /\(#(\d+)\)/g,
              /#(\d+)/g,
            ];

            for (const commit of compare.data.commits) {
              for (const pattern of patterns) {
                let match;
                while ((match = pattern.exec(commit.message)) !== null) {
                  issueNumbers.add(parseInt(match[1]));
                }
              }
            }

            if (issueNumbers.size === 0) {
              console.log('No issue references found in commits');
              return;
            }

            console.log(`Found issue references: ${[...issueNumbers].join(', ')}`);

            for (const num of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });

                if (issue.data.state === 'closed' || issue.data.pull_request) {
                  console.log(`#${num}: already closed or is a PR, skipping`);
                  continue;
                }

                const hasExplicitClose = compare.data.commits.some(c =>
                  /(?:fixes|closes|resolves)\s+#/i.test(c.message) &&
                  new RegExp(`(?:fixes|closes|resolves)\\s+#${num}`, 'i').test(c.message)
                );

                if (!hasExplicitClose) {
                  console.log(`#${num}: referenced but no explicit Fixes/Closes, skipping`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: `Deployed to production via ${context.sha.substring(0, 7)}. Awaiting Young's manual close (per LingoLeap policy: only Young closes issues).`,
                });

                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    labels: ['deployed-to-prod'],
                  });
                } catch (labelErr) {
                  console.log(`#${num}: could not add deployed-to-prod label (${labelErr.message}); continuing`);
                }

                console.log(`#${num}: commented + labeled (NOT closed — Young's verification queue)`);
              } catch (e) {
                console.log(`#${num}: error - ${e.message}`);
              }
            }
