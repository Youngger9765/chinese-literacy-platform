name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  BACKEND_SERVICE: lingoleap-backend
  FRONTEND_SERVICE: lingoleap-frontend

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:prod-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/backend:prod-latest" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:prod-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/backend:prod-latest"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:prod-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300s \
            --add-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-db \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://lingoleap-frontend-958347263320.asia-east1.run.app,https://lingoleap-dev.web.app::DATABASE_URL=${{ secrets.DATABASE_URL }}::RUN_MIGRATIONS=true::AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}::AZURE_SPEECH_REGION=eastus"

      - name: Verify backend health
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: Backend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build & push frontend image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/frontend:prod-${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/frontend:prod-latest" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:prod-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/frontend:prod-latest"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/frontend:prod-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --port 8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300s

      - name: Verify frontend health
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: Frontend health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Show deployment summary
        if: always()
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** https://lingoleap-frontend-958347263320.asia-east1.run.app" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** https://lingoleap-backend-958347263320.asia-east1.run.app" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  cleanup-images:
    name: Cleanup old AR images
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Delete old production images (keep latest 5)
        run: |
          KEEP=5
          for PACKAGE in backend frontend; do
            echo "=== Cleaning ${PACKAGE} prod images ==="
            DIGESTS=$(gcloud artifacts docker images list \
              "$REGISTRY/${PACKAGE}" \
              --include-tags \
              --filter="tags:prod-" \
              --sort-by="~CREATE_TIME" \
              --format="value(version)" 2>/dev/null || true)

            if [ -z "$DIGESTS" ]; then
              echo "No images found, skipping"
              continue
            fi

            TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
            echo "Found $TOTAL images, keeping latest $KEEP"

            echo "$DIGESTS" | tail -n +$((KEEP + 1)) | while read -r DIGEST; do
              [ -z "$DIGEST" ] && continue
              echo "DELETE: ${DIGEST:0:20}..."
              gcloud artifacts docker images delete \
                "$REGISTRY/${PACKAGE}@${DIGEST}" \
                --delete-tags --quiet 2>/dev/null || true
            done
          done

  close-issues:
    name: Auto-close resolved issues
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and close issues from merge commit
        uses: actions/github-script@v7
        with:
          script: |
            // Get commits in this push (staging→main merge)
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.payload.before,
              head: context.payload.after,
            });

            // Extract issue numbers from commit messages and PR titles
            const issueNumbers = new Set();
            const patterns = [
              /(?:fixes|closes|resolves|related to)\s+#(\d+)/gi,
              /\(#(\d+)\)/g,
              /#(\d+)/g,
            ];

            for (const commit of compare.data.commits) {
              for (const pattern of patterns) {
                let match;
                while ((match = pattern.exec(commit.message)) !== null) {
                  issueNumbers.add(parseInt(match[1]));
                }
              }
            }

            if (issueNumbers.size === 0) {
              console.log('No issue references found in commits');
              return;
            }

            console.log(`Found issue references: ${[...issueNumbers].join(', ')}`);

            // Close open issues that have "Fixes/Closes" in their PR
            for (const num of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });

                // Skip if already closed, or if it's a PR
                if (issue.data.state === 'closed' || issue.data.pull_request) {
                  console.log(`#${num}: already closed or is a PR, skipping`);
                  continue;
                }

                // Only auto-close if commit message has explicit "Fixes/Closes #N"
                const hasExplicitClose = compare.data.commits.some(c =>
                  new RegExp(`(?:fixes|closes|resolves)\\s+#${num}`, 'i').test(c.message)
                );

                if (!hasExplicitClose) {
                  console.log(`#${num}: referenced but no explicit Fixes/Closes, skipping`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: `Deployed to production via ${context.sha.substring(0, 7)}. Auto-closing.`,
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                });

                console.log(`#${num}: closed`);
              } catch (e) {
                console.log(`#${num}: error - ${e.message}`);
              }
            }
