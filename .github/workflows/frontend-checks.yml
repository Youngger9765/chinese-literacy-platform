# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: Frontend Checks (lint + vitest)

# ⚠️ 觸發不用 `on.pull_request.paths`（#2916 收尾查到）。
#
# GitHub 的 `paths:` 過濾只看**前 300 個變更檔**。PR #2920 改了 3691 個檔，
# 前 300 個全是 `backend/data/lessons/**`（批次改名 1611 個 yml），
# `frontend/**` 一個都排不進去 —— 於是這支**整個 PR 一次都沒跑**，
# 而檢查清單上不會出現這一列，看起來就是全綠。
#
# 改用 repo 既有的 `dorny/paths-filter` 判斷（staging-deploy.yml 一直是這樣做的）：
# 它算的是完整 diff，沒有 300 的上限。意圖不變 —— 純後端的 PR 仍然跳過。
#
# ⛔ 不要為了「保險」把過濾整個拿掉：那會讓每個 PR 都跑一次 e2e，
#    而這支存在的理由是**該跑的時候真的跑**，不是每次都跑。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: frontend-checks-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'frontend/src/**'
              - 'frontend/eslint.config.js'
              - 'frontend/package.json'
              - 'frontend/vite.config.ts'
              - '.github/workflows/frontend-checks.yml'

  frontend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Frontend Lint + Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint — errors block PR, warnings pass)
        working-directory: frontend
        run: npm run lint

      # Render-smoke gate (#2289) + explicitly-pinned regression locks. Scoped to
      # named files on purpose: the wider vitest suite has ~38 pre-existing
      # functional-test failures (UI text drift, tests missing AuthProvider wrappers)
      # that predate this safety net, so gating on the whole suite would make this
      # workflow red on day one. Pin a file here whenever a fix ships a regression
      # test that must stay enforced — an un-run lock is theatre (testing-strategy 鐵律).
      #   - render-smoke: mount-crash guard (#2279/#2289)
      #   - resetTutorStep / ParagraphReading.readAgain: 「再讀一次」reset must clear every
      #     completion/成績 source + the single-paragraph residual diff (#2532)
      #   - useTtsPlayback: Web Speech API fallback must set isTtsDegraded (visible
      #     banner) instead of silently playing a machine voice with no signal (#2609)
      #   - stepNaming / componentNaming: every step id and every component name
      #     must say what its Chinese label says. Two were inverted before #2641 —
      #     `full-reading` read one passage, `reading-annotation` read the whole
      #     text — which is how a feature got wired to a step disabled since
      #     2026-07-20 (#2641, #2643)
      #   - qrcode-bundling: the QR library must be imported with a literal
      #     specifier so Vite bundles it. A dynamic import with the name in a
      #     variable passed build, lint and vitest while the feature was broken
      #     in every browser (#2622)
      #   - BlockSequenceRenderer.newblocks: every spotlight block type must have a
      #     case in the renderer. `multi` sat in types.ts with no branch, so 68
      #     blocks across 37 lessons fell through to default — the question printed,
      #     the options never did, and nothing errored. Assertions check that the
      #     options/sub-items/right-column entries actually reach the DOM, because
      #     "renders without throwing" cannot tell those two states apart.
      #   - LessonAudioTable: admin audio panel must (a) stop the previous
      #     clip before starting a new one — the hook's single-shot playback
      #     path does not auto-cancel a prior <audio> on its own — and (b)
      #     return a row to idle the instant it (or the header button) is
      #     stopped. Regression of either reintroduces #2622's "不能停止 /
      #     同時播其他的就會一堆聲音" follow-up bug.
      #   - VocabDefinitionMatch/ComprehensionMcqPage progressPersistence: 作答「中」
      #     的答案必須進得了進度 payload。詞語理解的答案只活在子元件的 `answersRef`
      #     裡、閱讀理解的 onExerciseChange 只接到計分 —— 兩邊 payload 在作答中都
      #     從沒變過，dedup 正確地判定「沒變化」→ 一次 PUT 都沒發出去，學生換裝置
      #     或清快取就整步重來。斷言用「答 N 題要存回 N 筆」的數量形式，因為
      #     「有一筆就算過」連「只回報第一題」都能矇混過去（#2839）。
      #   - VocabApplication/VocabWordSearch progressPersistence + DragDrop restore +
      #     retryWrong: #2839 盤點剩下的關卡（#2848/#2849/#2850）。語詞應用的逐題作答
      #     只寫 localStorage、語詞複習整個 hook 沒有任何 API import —— 兩關作答中對 DB
      #     完全不存在，換裝置就整關重來。拖拉配對是「存得進去、讀不回來」（存了讀不回來
      #     等於沒存）。詞語理解的「重做錯題」則因為 render gate 用 `mcAnswers.length > 0`
      #     判完成，按下去只會停在「選擇題 已完成」的 placeholder。斷言一律用
      #     「做了 N 個就要讀回 N 個」的數量形式 ——「有一筆就算過」連「只回報第一題」
      #     都能矇混過去。
      #   - stepSharedShell / rendererHeader: 自學模式每一步的外框只能有一份實作。
      #     底部固定動作列曾有 12 份逐字相同的 copy（連 `#FBF6EE` 都硬寫 12 次），
      #     「怎麼玩？」教學卡有 6 份而且已經漂成兩種底色兩種字級。抽成
      #     `StepActionBar` / `StepCoachCard` 之後，掃描鎖擋的是「再複製一份」；
      #     每條掃描都配正向對照，因為 class 字串一改名，掃描器就會什麼都找不到
      #     而恆綠。`rendererHeader` 另外鎖住「閱讀學習 ＋ 課名」頁首預設關閉 ——
      #     那條頁首在學習流程裡是第三次出現的課名（#2897）。
      #   - nextStepFooter: no `.tsx` may draw its own "下一關" / "繼續下一步"
      #     button — every step's forward CTA must be the shared
      #     `NextStepFooter`. This test file existed before #2771 but was
      #     never pinned here, so its scan lock never actually ran in CI —
      #     which is exactly how 23 custom buttons across 14 files shipped
      #     past a lock whose test file was green (#2771).
      #   - difficultSpanRenderer / processLinesSelectiveDifficultMarkers /
      #     FullTextAnnotate.zhuyinDifficultFontScope: 'difficult' zhuyin mode
      #     must annotate ONLY the vocab-word character runs, never a whole
      #     container. fontForZhuyin() used to be applied at the container
      #     level gated on isZhuyinAny (true for 'difficult' too) —
      #     BpmfZihiSerif/BpmfIansui renders bopomofo for every character it
      #     draws, so the font (not processLinesSelective's text output)
      #     annotated the whole page the instant 'difficult' mode turned it
      #     on: interface text (❓ 不懂 / 💛 重要 / 還沒有標記 / instruction
      #     banners) included, staging-measured at 24/78 leaf nodes, 11 of
      #     them interface text (#3022). Locks: the marker-wrapping pure
      #     function, ZhuyinContext emitting the markers, and the rendered
      #     DOM never carrying the zhuyin font on interface text while still
      #     carrying it on the actual vocab run.
      #     ⚠️ The first pass at #3022 converted only ONE of ParagraphCard's
      #     three text branches, and had NO lock on ParagraphCard,
      #     KeyPassageReading or zhuyinUtils at all -- reverting each of those
      #     files wholesale left the suite fully green. Adversarial review
      #     caught it. The four locks below each fail on a wholesale revert of
      #     the file they guard, verified one at a time:
      #       paragraphCardDifficultFont3022  -- all three render branches
      #         (plain / karaoke / blurred), plus a negative control that the
      #         font never lands on an element holding the whole paragraph
      #       keyPassageDifficultFont3022     -- on revert the font lands on a
      #         406-character element of interface text + passage
      #       splitZhuyinCharsMarkers3022     -- an opening marker on the first
      #         character used to become its own phantom group, drifting the
      #         karaoke cursor by one for the rest of the line
      #       difficultFlags3022              -- carries run membership across
      #         the PUA strip so annotated paragraphs keep their ruby
      #   - ttsRate / ttsSpeedControl3023: the demo reading voice must honour
      #     the student's speed choice, and an out-of-range stored value must
      #     never reach an <audio> element (0 silences it). Teachers running
      #     課後學習扶助 reported the demo reads too fast; measured on prod it
      #     is 273 字/分 while the same worksheet's reading_benchmark puts the
      #     top student band at ＞231 (#3023). The rate cannot be fixed in
      #     SSML without a full re-synthesis -- the TTS cache key is
      #     sha256(raw_text) with no rate in it.
      #     ⚠️ The first pass put the control only in KeyPassageReadingControls,
      #     which only the SIGNED-IN shell mounts. key-passage-reading is a
      #     PUBLIC_LEARNING_STEP: an unauthenticated visitor is routed to
      #     GuestReadingPage, which renders FullTextAnnotate for both 讀全文
      #     and 重點朗讀 and plays through ReadingPlayer -- so the student
      #     scanning the printed worksheet QR, i.e. the exact audience that
      #     reported this, had no control at all. readingPlayerSpeed3023 locks
      #     the control onto that shared player.
      #     ttsRateWiring3023 locks the three production wiring points
      #     themselves: reverting each one left the whole suite green before,
      #     because nothing asserted the call sites actually call the helper.
      #   - authNetworkFailureKeepsToken: AuthContext used to delete the token
      #     on ANY getMe() rejection. The comment said "invalid or expired",
      #     but that catch also fires when the request never reached the server
      #     -- so one bad request (classroom Wi-Fi, a phone changing towers, a
      #     Cloud Run cold start) signed the student out and made them log in
      #     again (#3037). Found via a Playwright trace of a randomly-failing
      #     e2e run: 200 /api/auth/login then -1 /api/users/me, where -1 is a
      #     request-level failure rather than an HTTP status.
      #     Locks BOTH directions: a network failure keeps the token, a 401/403
      #     clears it. Only locking the first would let "never clear anything"
      #     pass and keep a revoked session alive.
      #   - ttsDefaultRateBand: the SHIPPED default demo-reading speed must land
      #     inside the worksheet's own reading_benchmark band. At 1.0 the demo
      #     read 273 字/分 while that worksheet prints ＜200 / 201~230 / ＞231 --
      #     i.e. the model was 42 字/分 faster than the best score it says exists
      #     (#3023). Binds the REASON, not the literal: it stays green for any
      #     default that is still a speed a student could be asked to match, and
      #     goes red if the default drifts back above the ceiling OR below the
      #     middle band (too slow is not a model worth imitating either).
      #   - editorPreMarks / FullTextAnnotate.editorPreMarks: 編者標 (#3026) --
      #     a term from `story.vocabulary` gets pre-marked at EVERY occurrence
      #     it matches verbatim in the article (not just the first), a lesson
      #     with no vocab_definitions data (25/179) renders unmarked with no
      #     error, and a non-matching term is skipped silently. Pre-marks are
      #     computed fresh from story data on every render and are NEVER
      #     dispatched through the annotation reducer's ADD/REMOVE/UNDO/CLEAR/
      #     INIT actions, never written to localStorage, never sent to
      #     saveAnnotations() -- locked explicitly because that separation is
      #     what stops 清除全部 and DB persistence from touching content the
      #     student never made. Two locks exercise the real async DB-restore
      #     path (not just the source): a DB-restored student annotation and
      #     the computed pre-marks render together after hydration's INIT
      #     (proving INIT cannot wipe or duplicate a pre-mark), and remounting
      #     the step recomputes the same pre-marks from story data while a
      #     dismissal does NOT survive the remount (session-local by design,
      #     not persisted anywhere).
      #   - CorrectAnswerBurst / MultipleChoiceExercise 大題進度條 (#3024): teachers
      #     asked for "即時增強" on a correct answer and questioned whether badges
      #     unlock live. CorrectAnswerBurst locks the burst firing on a correct
      #     pick and NEVER on a wrong one (that's #3028's territory, deliberately
      #     out of scope here) and that it stays pointer-events-none so it can
      #     never block "下一題". The MultipleChoiceExercise additions lock the
      #     pre-existing K/N progress bar width formula (BDD Scenario 3) which had
      #     no regression test before #3024.
      #   - BadgeUnlockToast / useProgressSync.xpAwarded / useStepProgressPersistence
      #     .badgeUnlock (#3024): the mid-session badge-unlock plumbing. The chain
      #     is PUT .../progress response -> useProgressSync's onXpAwarded ->
      #     useStepProgressPersistence's midSessionBadgeUnlocks -> BadgeUnlockToast,
      #     rendered at the LearningLayout level. Each link is locked where it
      #     lives (BadgeUnlockToast's own render/dismiss behavior; useProgressSync
      #     actually calling the callback from a mocked save response; useStep-
      #     ProgressPersistence forwarding it into its own exposed state) rather
      #     than one giant end-to-end test, because useProgressSync is normally
      #     mocked out in useStepProgressPersistence's other tests (module-level
      #     vi.mock) -- an end-to-end version would either have to fight that mock
      #     or silently stop exercising the real network layer.
      #   - XPAwardToast (#3024): BADGE_ICONS/BADGE_NAMES were extracted into a new
      #     shared badgeMeta.ts (so BadgeUnlockToast doesn't duplicate them) --
      #     locks that refactor didn't change rendered output. Also locks the new
      #     honest disclosure caption that answers the teacher's literal question
      #     ("是達成目標的當下就跑出來嗎？"): some badges can only ever be judged at
      #     full-session completion, so the report page says so instead of leaving
      #     it to guesswork.
      #   - ExerciseBlockView.correctAnswerBurst (#3024): CorrectAnswerBurst was
      #     first wired into MultipleChoiceExercise.tsx (the legacy
      #     ComprehensionMcqPage fallback), but LESSON_RENDERER_V1 defaults ON in
      #     production and ComprehensionMcqPage prefers the block-based
      #     LessonRenderer -> ExerciseBlockView path whenever a story has real v3
      #     lesson_content with a multiple_choice block -- the common case. Caught
      #     live on this PR's own preview: answering a real story's 閱讀理解 MCQ
      #     correctly never showed the burst, because the page was rendering
      #     ExerciseBlockView, not MultipleChoiceExercise. This locks the SAME
      #     burst wired into ExerciseBlockView's single-choice handlePick, so the
      #     path most students actually take gets the feedback too.
      #   - LiveMonitorTab / ClassroomTabs.liveMonitor (#3025): teacher live
      #     classroom monitor. Locks (a) a student with zero trackable
      #     mcq_attempt rows renders an EXPLICIT 尚無資料 state -- the whole
      #     point of this feature is that "no data" must never look the same
      #     as "doing fine" (b) the stuck signal is always labelled 「卡在這題」
      #     and the word "亂猜" never appears anywhere in the rendered output
      #     (issue #3025 comment: that word assigns a motive) (c) polling
      #     fetches again after the interval while mounted and STOPS the
      #     instant the tab unmounts -- a leaked interval after navigating
      #     away would keep hitting the backend forever (d) the 預覽 button
      #     reuses the #3027 preview-token mint + navigate flow (e) the tab
      #     is reachable from the real classroom navigation (日常管理 group,
      #     not 進階分析 -- this is a during-class tool) and renders the
      #     right classroomId, because an endpoint nobody can reach is a FAIL
      #     even if the component itself renders correctly.
      # ⚠️ `run: |` (block literal) is load-bearing — do NOT collapse it back to a
      # plain `run:` scalar. YAML folds a plain scalar's newlines into spaces, which
      # leaves the `\` as LITERAL characters; the shell then reads `\ ` as an escaped
      # space, so every file after the first line arrives as an argument with a leading
      # space, matches nothing, and vitest silently drops it. That is not an error —
      # vitest just reports the files it did match and exits 0. This step ran
      # "8 passed (8)" while listing 37 files, i.e. 29 pinned locks (including the two
      # #2839 ones added in the same commit) had never executed in CI while the step
      # showed green. Verify after editing this list with:
      #   files=$(python3 -c "import yaml;d=yaml.safe_load(open('.github/workflows/frontend-checks.yml'));\
      #     print([s['run'] for s in d['jobs']['frontend-checks']['steps'] if 'vitest' in str(s.get('run',''))][0])")
      # then confirm the run's "Test Files N passed (N)" equals the number of files listed.
      # Production build. vitest and eslint both passed while `vite build` was
      # broken — a rename left two files under their old names while every
      # import already used the new ones, and nothing in this workflow resolved
      # the module graph the way rollup does. Staging deployed red as a result
      # (#2643). Build is the only gate that catches a filename/import mismatch.
      - name: Build (production)
        working-directory: frontend
        run: npx vite build

      #   - StudentPreviewPage / StudentProgressCard.preview (#3027): the
      #     teacher "preview as student" entry point. Locks (a) no crash and
      #     no network call when the page is reached with no router state
      #     (b) the read-only banner names the student and states the
      #     expiry (c) the recommendation fetch uses the PREVIEW token
      #     handed to the page, never any global/teacher token (d) fetch
      #     failure (expired token) shows an error instead of crashing (e)
      #     結束預覽 navigates back (f) the card's 預覽 button calls
      #     onPreview — not onExpand, which the card's whole surface is
      #     also a click target for — and is disabled while a mint call is
      #     in flight.
      - name: Render-smoke + pinned regression tests (vitest)
        working-directory: frontend
        run: |
          npx vitest run src/__smoke__/render-smoke.test.tsx src/hooks/useStepProgressPersistence.resetTutorStep.test.ts src/components/reading-steps/paragraph-reading/ParagraphReading.readAgain.test.tsx src/hooks/useTtsPlayback.test.ts src/pages/admin/lesson-audio/qrcode-bundling.test.ts src/pages/admin/lesson-audio/LessonAudioTable.test.tsx src/config/stepNaming.test.ts src/routes/componentNaming.test.ts \
          src/components/auth/LearningRouteGate.test.tsx \
          src/components/reading-steps/FullTextAnnotate.hideAnnotation.test.tsx \
          src/hooks/useFullTextTtsQueue.test.ts \
          src/services/ttsApi.prefetch.test.ts \
          src/pages/admin/lesson-audio/paragraphGap.test.ts \
          src/pages/GuestReadingPage.passage.test.tsx \
          src/components/auth/publicSteps.test.ts \
          src/config/__tests__/repeatedModulesSplit.test.ts \
          src/pages/admin/lesson-audio/multiPartRows.test.tsx \
          src/components/reading-steps/__tests__/splitPartsNotDuplicated.test.tsx \
          src/services/ttsApi.paragraph.test.ts \
          src/components/reading-spotlight/__tests__/BlockSequenceRenderer.newblocks.test.tsx \
          src/components/learning/__tests__/nextStepFooter.test.tsx \
          src/components/layout/__tests__/studentSidebar.noToolbox.test.tsx \
          src/components/layout/__tests__/Sidebar.role-split.test.tsx \
          src/components/qr/lessonQr.test.tsx \
          src/components/qr/qrOnReadingPages.test.tsx \
          src/pages/admin/lesson-audio/qrManifestParts.test.ts \
          src/pages/admin/lesson-audio/qrGateOnData3011.test.ts \
          src/pages/app/__tests__/homeRedirectNoRole.test.tsx \
          src/components/layout/__tests__/toolboxUnreachable.test.tsx \
          src/components/reading-steps/__tests__/introStepCount.test.ts \
          src/context/__tests__/zhuyinSpaceShortcut.test.tsx \
          src/config/__tests__/roundAwareStepNeighbours.test.ts \
          src/config/__tests__/activeStepHighlight.test.ts \
          src/config/__tests__/stepPartLabels.test.ts \
          src/components/layout/__tests__/stepperPartsAreWired.test.ts \
          src/pages/learning/__tests__/reportSendsRealScore.test.ts \
          src/config/__tests__/realPayloadRoundScope.test.ts \
          src/config/__tests__/stepPath.test.ts \
          src/config/__tests__/stepPathIsTheOnlyBuilder.test.ts \
          src/services/__tests__/ttsRoundScoped.test.ts \
          src/services/__tests__/everyLessonAddressedCallCarriesRound.test.ts \
          src/components/reading-steps/__tests__/degradedNoticeEverywhere.test.ts \
          src/pages/__tests__/guestKeyPassageAudio.test.tsx \
          src/hooks/__tests__/finishAdvancesWithinRound.test.ts \
          src/components/reading-steps/__tests__/FillInBlankExercise.test.tsx \
          src/components/reading-steps/__tests__/MultipleChoiceExercise.test.tsx \
          src/components/reading-steps/__tests__/ReadingTrendChart.test.tsx \
          src/components/reading-steps/__tests__/VocabApplication.test.tsx \
          src/components/reading-steps/__tests__/VocabDefinitionMatchMCQ.test.tsx \
          src/components/reading-steps/__tests__/VocabWordSearch.test.tsx \
          src/components/reading-steps/__tests__/roundAudioAndLog.test.tsx \
          src/components/learning/__tests__/QuizCompletionScreen.test.tsx \
          src/components/learning/__tests__/quizCompletionScreenUsage.test.ts \
          src/pages/learning/__tests__/comprehensionReview.test.ts \
          src/pages/learning/__tests__/ComprehensionMcqPage.test.tsx \
          src/components/reading-steps/__tests__/StoryStructureTable.radioFill.test.tsx \
          src/components/lesson-content/__tests__/LessonRenderer.comprehensionWidth.test.tsx \
          src/components/reading-steps/__tests__/StoryStructureTable.progressPersistence.test.tsx \
          src/components/reading-steps/__tests__/assessmentReportMetrics.test.ts \
          src/components/reading-steps/__tests__/practiceStepsSummary.test.ts \
          src/components/reading-steps/__tests__/PracticeStepsSummarySection.test.tsx \
          src/components/reading-steps/__tests__/AssessmentComprehensionSectionMcqFallback.test.tsx \
          src/components/reading-steps/__tests__/AssessmentReportIntegration.test.tsx \
          src/components/reading-steps/__tests__/VocabDefinitionMatch.progressPersistence.test.tsx \
          src/pages/learning/__tests__/ComprehensionMcqPage.progressPersistence.test.tsx \
          src/components/reading-steps/__tests__/VocabApplication.progressPersistence.test.tsx \
          src/components/reading-steps/__tests__/VocabWordSearch.progressPersistence.test.tsx \
          src/components/reading-steps/__tests__/VocabDefinitionMatch.retryWrong.test.tsx \
          src/components/reading-steps/__tests__/VocabDefinitionMatchDragDrop.restore.test.tsx \
          src/components/reading-steps/__tests__/teacherWordSearch2860.test.ts \
          src/components/reading-steps/__tests__/teacherGridStability2860.test.tsx \
          src/components/reading-steps/__tests__/wordSearchGrid.test.ts \
          src/components/learning/__tests__/stepSharedShell.test.tsx \
