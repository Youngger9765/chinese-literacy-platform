# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: Pytest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # 路徑判斷改在 job 裡做 —— `on.paths` 只看前 300 個變更檔，批次改名的 PR
  # 會讓整支被靜靜跳過，而且檢查清單上不會出現那一列（#2925）。
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              # 產生器也要觸發 —— 只改它的 PR 若不跑鎖，「下次會再錯一次」的鎖就沒插電
              # 抽取器與普查也要觸發 —— 改它們的 PR 若不跑 gate，等於鎖建了沒插電
              - 'scripts/split_lesson_modules.py'
              - 'scripts/key_reading_xml_rule.py'
              - 'scripts/corpus_profile.py'
              # 念順順的抽取器 —— 規則就寫在裡面（2026-08-30 那次 regression 的來源）
              - 'scripts/extract_key_reading_v3.py'
              # ⭐ skill 是「下一個人拿來當規格讀」的東西。2026-08-30 就是 code 改了、
              #    skill 沒改 —— 分家的後果不是報錯，是下一個人照文件把 code 改回去。
              #    不盯這個路徑，「只改 skill」的 PR 不會跑那道鎖 ＝ 鎖建了沒插電。
              - '.claude/skills/**'
              # ⭐ #3055 issue-agent 的安全結構鎖住在 backend/tests，但被鎖的
              #    對象是這個 workflow 檔本身 —— 只改 yml 的 PR 不跑 pytest
              #    ＝ 有人拆掉 gate/放回 curl 時鎖是睡著的。
              - '.github/workflows/claude-issue-agent.yml'

  pytest:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ffmpeg + poppler (transcode / silence gate / PDF fingerprint gate)
        # poppler-utils 給 ⑤ 的每頁文字指紋用（pdftotext / pdfinfo）。
        # 沒裝的話那道門一律回 2「算不出來」—— 那是正確的 fail-closed，
        # 但等於 CI 對它零覆蓋，而它是擋「版面重排」的唯一一道門。
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils

      # scripts/build_lesson_schema.py (a DOCX->YAML build tool, not a served
      # endpoint) needs python-docx + lxml. Kept out of requirements.txt on
      # purpose so the deployed Cloud Run image does not carry a dependency it
      # never uses at runtime.
      #
      # This used to be a `pip install` line buried inside the last of the
      # fourteen pytest steps. Collapsing those into one run lost it, and the
      # whole suite died on "No module named 'docx'" — the install was a side
      # effect of a step whose name said nothing about installing anything.
      - name: Install DOCX build-tool deps (not in requirements.txt on purpose)
        run: pip install python-docx==1.2.0 lxml==6.1.0

      # ⬇︎ 這裡原本是十四個手工維護的具名清單。#3093/#2804：302 支測試檔裡有
      #    122 支沒被任何 workflow 點名，所以從來不會跑 —— L0041 的答案洩漏
      #    就是這樣回來的（八月修好、也寫了鎖，鎖沒進 CI，重抽時洩漏復活）。
      #    清單會無聲腐爛，目錄不會。
      #
      #    十四個 step 宣告的 env 完全相同，合併不會少掉任何條件（查證過）。
      #    真正的內容缺口用 xfail(strict) 對著 content_known_gaps.yaml 標著，
      #    看得見，而且補好的那一刻會 XPASS 變紅逼人回來拿掉。
      #
      #    下面保留原本每一道鎖的說明 —— 它們記著那些鎖為什麼存在，比清單本身
      #    值錢。鎖仍然會跑，只是不再靠人維護名字。
      # ⚠️ 這份清單**不是**用來決定「什麼會跑」—— 上面的整包已經全部跑過了。
      #    它是問責登記簿：specs/test_locks_have_red_evidence_spec.py 用
      #
      #        具名清單 − 已驗過 − grandfathered  必須是空集合
      #
      #    要求「加進這裡的鎖，必須在 docs/qa/lock-red-evidence.md 寫明它是怎麼
      #    被證明會咬的」。沒看過紅的 gate 是劇場，跟什麼都沒測長得一樣（都綠）。
      #
      #    我一度把整個清單刪掉改跑整包，理由是「122 支從沒被點名所以清單有害」。
      #    那個理由對了一半：清單確實會腐爛，但它同時扛著這個問責機制，而我沒查
      #    就先動手。刪掉的效果是 3900+ 支測試從此免交代 —— 那不是清債，是把債
      #    藏起來。兩件事分開做：整包負責「不會有測試悄悄不跑」，這份清單負責
      #    「新加的鎖要拿得出紅過的證據」。
      #
      #    重跑這 121 支的成本是幾十秒，換一個擋得住的機制，划算。
      - name: Run regression locks (issue-numbered)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_ai_analysis_deprecation_1648.py \
            tests/test_ai_base_split_1953.py \
