name: Pytest

on:
  pull_request:
    paths:
      - 'backend/**'
      # 重點朗讀的抽取器住在 scripts/，而擋它的 gate 住在 backend/tests/。只監看
      # backend/** 的話，單獨改抽取器不會觸發任何檢查 —— 而 #2720 正是抽取器選錯
      # 段落造成的。列檔案而不是 'scripts/**'：那底下有 78 支橫跨聚光燈／重點表／
      # 部首／縮圖的無關腳本，全掛上去會讓它們每次改動都跑整個 job。
      - 'scripts/extract_key_reading.py'
      - 'scripts/build_key_reading.py'
      - 'scripts/fetch_lesson_docx.py'
      - 'scripts/stage_lesson_docx.py'
      - '.github/workflows/pytest.yml'

jobs:
  pytest:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ffmpeg (testset transcode + silence-gate tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run characterization tests (refactor safety gate)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_characterization_auth_policies.py \
            tests/test_characterization_socratic_state_machine.py \
            tests/test_characterization_tts_normalization.py \
            tests/test_characterization_tts_cache.py \
            tests/test_rate_limiting.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: Run testset tests (upload security + auth + eval)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_testset_*.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: Run security regression tests (blackbox audit gate — WSTG-mapped)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/security/test_dynamic_security.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # 重點朗讀的守門 (#2720)。這三支只讀 committed 的 YAML，不需要教材原始檔，
      # 所以在 CI 裡是真的會跑、真的會紅：
      #   test_key_reading_extractor_2720 — 抽取器的邏輯本身（純函式，不碰資料）
      #                                     資料測試只驗昨天的產出，改了抽取器卻沒重跑
      #                                     時它一樣綠；這支才會紅
      #   test_key_reading_numbering_2720 — 服務的段落不是教授畫的那一段 → 紅
      #                                     （對修正前的資料實測 14/38 紅）
      #   test_key_reading_extent_2683    — 段落長度被推論撐大 (#2712) → 紅
      #   test_every_lesson_detail_validates_2725 — 課程詳情不符 response schema → 紅
      #
      # 在此之前這幾支沒有被任何 workflow 引用（pytest.yml 用的是白名單），
      # 只有人手動下指令才會跑 —— 也就是這個檔案 L70-74 自己講的
      # 「An un-run lock is theatre」。2026-08-20 review 抓到。
      #
      # ⚠️ test_reading_benchmark_2722.py 不在這裡：它整支 module 級 skipif 依賴
      # /tmp/docx-src（刻意的 —— 用 committed 資料驗會變成抽取器自己跟自己比），
      # 而 CI 沒有二修 DOCX。放進來只會永遠 skip，那還是 theatre。缺口見 #2803。
      - name: Run key-reading gates (#2720 / #2712 / #2725)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_key_reading_extractor_2720.py \
            tests/test_key_reading_numbering_2720.py \
            tests/test_key_reading_extent_2683.py \
            tests/test_every_lesson_detail_validates_2725.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # TTS coverage lock (#2619): mocked logic only (existing_keys/missing_keys/
      # expected_keys against FakeBucket doubles + the real manifest file) — no
      # GCS credentials touched here. The real-bucket class
      # (TestRealGCSCoverage) is opt-in via RUN_REAL_GCS_TESTS and self-skips
      # without it, so it never runs in CI. An un-run lock is theatre — pin it.
      - name: Run TTS coverage lock (mocked — real-GCS class self-skips)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_audit_tts_coverage.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
