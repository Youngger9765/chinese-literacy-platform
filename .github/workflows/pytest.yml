name: Pytest

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 路徑判斷改在 job 裡做 —— `on.paths` 只看前 300 個變更檔，批次改名的 PR
  # 會讓整支被靜靜跳過，而且檢查清單上不會出現那一列（#2925）。
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              # 產生器也要觸發 —— 只改它的 PR 若不跑鎖，「下次會再錯一次」的鎖就沒插電
              # 抽取器與普查也要觸發 —— 改它們的 PR 若不跑 gate，等於鎖建了沒插電
              - 'scripts/split_lesson_modules.py'
              - 'scripts/key_reading_xml_rule.py'
              - 'scripts/corpus_profile.py'

  pytest:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ffmpeg + poppler (transcode / silence gate / PDF fingerprint gate)
        # poppler-utils 給 ⑤ 的每頁文字指紋用（pdftotext / pdfinfo）。
        # 沒裝的話那道門一律回 2「算不出來」—— 那是正確的 fail-closed，
        # 但等於 CI 對它零覆蓋，而它是擋「版面重排」的唯一一道門。
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils

      - name: Run characterization tests (refactor safety gate)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_characterization_auth_policies.py \
            tests/test_characterization_socratic_state_machine.py \
            tests/test_characterization_tts_normalization.py \
            tests/test_characterization_tts_cache.py \
            tests/test_rate_limiting.py \
            tests/test_session_scoring_write_1063.py \
            tests/test_session_scoring_below_threshold_2904.py \
            tests/test_gamification.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: Run testset tests (upload security + auth + eval)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_testset_*.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: Run security regression tests (blackbox audit gate — WSTG-mapped)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/security/test_dynamic_security.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # Pronunciation fingerprint gate (#2742). Already run by spec-check.yml,
      # repeated here on purpose: spec-check is path-filtered, this workflow
      # triggers on all of backend/**, and the failure being guarded against is
      # precisely "the gate existed and nothing ran it". Cheap enough (three
      # assertions, no I/O) that redundancy costs less than another silent
      # orphaning of the whole audio cache.
      - name: Run pronunciation fingerprint gate (#2742)
        run: |
          cd backend
          python -m pytest --tb=short -q specs/test_tts_cache_fingerprint_spec.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # Wiring lock for the gate above (#2742): asserts every input the
      # fingerprint is computed from is watched by a workflow that runs it.
      - name: Run fingerprint-gate wiring lock (#2742)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_tts_fingerprint_gate_is_wired.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # TTS coverage lock (#2619): mocked logic only (existing_keys/missing_keys/
      # expected_keys against FakeBucket doubles + the real manifest file) — no
      # GCS credentials touched here. The real-bucket class
      # (TestRealGCSCoverage) is opt-in via RUN_REAL_GCS_TESTS and self-skips
      # without it, so it never runs in CI. An un-run lock is theatre — pin it.
      - name: Run TTS coverage lock (mocked — real-GCS class self-skips)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_audit_tts_coverage.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # 重點表 bridge lock (#2736): `app/services/keypoints_to_structure.py` 供給 150 課的
      # 重點表（`lesson_indexes.py` → `story_structure_table` → `/stories/{id}/structure`），
      # 但**沒有任何 spec module 認領它**，而這個 workflow 是點名清單不是掃目錄 ——
      # 於是它的測試檔一直存在、卻從來沒有任何門會執行（GHA 0 / run-ci 0 / registry 0，
      # 2026-08-18 實測，以 test_rate_limiting 與 test_verify_qr_manifest 當正向對照）。
      # 兩個靜默流失的 bug（子項標題 63 課、題幹 3 課）就是在這個空隙裡活下來的。
      # An un-run lock is theatre — pin it.
      - name: Run keypoints bridge locks (sub-labels + prompt stems)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_keypoints_to_structure.py \
            tests/test_keypoints_subitem_label_2736.py \
            tests/test_keypoints_prompt_stem_2736.py \
            tests/test_structure_answer_key_not_served_2736.py \
            tests/test_structure_option_display_2736.py \
            tests/test_asset_url_rewrite.py \
            tests/test_section_label_dash_normalisation.py \
            tests/test_table_cells_carry_the_tick_2735.py \
            tests/test_tts_audit_empty_not_404.py \
            tests/test_lab_keypoints_source_2751.py \
            tests/test_tts_mapping_covers_classical_2792.py \
            tests/test_classical_tts_normalization_2792.py \
            tests/test_inactive_threshold_matches_prd_2787.py \
            tests/test_yml_shape_ratchet_2843.py \
            tests/test_module_gaps_are_declared_2836.py \
            tests/test_module_schemas_2843.py \
            tests/test_module_reconcile_2843.py \
            tests/test_corpus_gates_are_wired_2843.py \
            tests/test_section_no_is_hanzi_2843.py \
            tests/test_comprehension_carrier_shape_2843.py \
            tests/test_vocab_definitions_shape_2843.py \
            tests/test_module_reaches_the_student_2843.py \
            tests/test_part_ids_2916.py \
            tests/test_repeat_rounds_2916.py \
            tests/test_section_pages_2857.py \
            tests/test_section_locator_2857.py \
            tests/test_pdf_manifest_gate_2857.py \
            tests/test_gates_catch_degraded_extraction_2865.py \
            tests/test_vocab_review_reaches_student_2860.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: "Run 念順順 key-reading locks (#2912 / #2712 / #2683 / #2562)"
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_key_reading_passages_2562.py \
            tests/test_key_reading_golden_2912.py \
            tests/test_source_profile_gate.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # Ticked-answer ground-truth lock (#2735): #2555 closed the "no box = answer"
      # leak, which was the extractor's only signal — closing it silently changed
      # 312 spotlight answers. `checked_box_positions()` reads the teacher's tick
      # directly instead of inferring it from an absent box; this file is the only
      # thing proving that read actually reaches the seven call sites that used to
      # trust the leak (three review rounds found six of them one at a time, plus a
      # box-glyph-counting bug in the primitive itself — each round's finding has its
      # own test class here). Not caught by `backend/specs` (this repo isn't on that
      # path) — pin it here or it goes unrun like the bridge lock above did.
      - name: Run ticked-answer ground-truth lock (#2735)
        run: |
          cd backend
          # scripts/build_lesson_schema.py (a DOCX->YAML build tool, not a served
          # endpoint) needs python-docx + lxml. Installed here, not in
          # requirements.txt, so the deployed Cloud Run image doesn't carry a
          # dependency it never uses at runtime.
          pip install python-docx==1.2.0 lxml==6.1.0
          python -m pytest --tb=short -q tests/test_checked_option_is_the_answer_2735.py
