name: Pytest

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  pytest:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd backend
          python -m pytest --tb=short -q
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
