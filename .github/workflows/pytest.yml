name: Pytest

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  pytest:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ffmpeg (testset transcode + silence-gate tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run characterization tests (refactor safety gate)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_characterization_auth_policies.py \
            tests/test_characterization_socratic_state_machine.py \
            tests/test_characterization_tts_normalization.py \
            tests/test_characterization_tts_cache.py \
            tests/test_rate_limiting.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: Run testset tests (upload security + auth + eval)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_testset_*.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      - name: Run security regression tests (blackbox audit gate — WSTG-mapped)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/security/test_dynamic_security.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # Pronunciation fingerprint gate (#2742). Already run by spec-check.yml,
      # repeated here on purpose: spec-check is path-filtered, this workflow
      # triggers on all of backend/**, and the failure being guarded against is
      # precisely "the gate existed and nothing ran it". Cheap enough (three
      # assertions, no I/O) that redundancy costs less than another silent
      # orphaning of the whole audio cache.
      - name: Run pronunciation fingerprint gate (#2742)
        run: |
          cd backend
          python -m pytest --tb=short -q specs/test_tts_cache_fingerprint_spec.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # Wiring lock for the gate above (#2742): asserts every input the
      # fingerprint is computed from is watched by a workflow that runs it.
      - name: Run fingerprint-gate wiring lock (#2742)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_tts_fingerprint_gate_is_wired.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # TTS coverage lock (#2619): mocked logic only (existing_keys/missing_keys/
      # expected_keys against FakeBucket doubles + the real manifest file) — no
      # GCS credentials touched here. The real-bucket class
      # (TestRealGCSCoverage) is opt-in via RUN_REAL_GCS_TESTS and self-skips
      # without it, so it never runs in CI. An un-run lock is theatre — pin it.
      - name: Run TTS coverage lock (mocked — real-GCS class self-skips)
        run: |
          cd backend
          python -m pytest --tb=short -q tests/test_audit_tts_coverage.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # 重點表 bridge lock (#2736): `app/services/keypoints_to_structure.py` 供給 150 課的
      # 重點表（`lesson_indexes.py` → `story_structure_table` → `/stories/{id}/structure`），
      # 但**沒有任何 spec module 認領它**，而這個 workflow 是點名清單不是掃目錄 ——
      # 於是它的測試檔一直存在、卻從來沒有任何門會執行（GHA 0 / run-ci 0 / registry 0，
      # 2026-08-18 實測，以 test_rate_limiting 與 test_verify_qr_manifest 當正向對照）。
      # 兩個靜默流失的 bug（子項標題 63 課、題幹 3 課）就是在這個空隙裡活下來的。
      # An un-run lock is theatre — pin it.
      - name: Run keypoints bridge locks (sub-labels + prompt stems)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_keypoints_to_structure.py \
            tests/test_keypoints_subitem_label_2736.py \
            tests/test_keypoints_prompt_stem_2736.py \
            tests/test_structure_answer_key_not_served_2736.py \
            tests/test_structure_option_display_2736.py \
            tests/test_asset_url_rewrite.py \
            tests/test_tts_audit_empty_not_404.py \
            tests/test_lab_keypoints_source_2751.py \
            tests/test_tts_mapping_covers_classical_2792.py \
            tests/test_classical_tts_normalization_2792.py \
            tests/test_inactive_threshold_matches_prd_2787.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # Module-entry locks (#2752): these four files pin "every module the
      # extraction produces has a real path to the student" at the layer(s)
      # module_entry_gate.py cannot see on its own — payload actually reaches
      # get_lesson_by_id() / StoryDetail / the route response, additive-only
      # for the 165 non-文言文 lessons, and no module gets faked in for a
      # lesson whose worksheet never had it. Same gap as the keypoints locks
      # above: `backend/app/schemas/story.py` and `backend/app/routes/stories.py`
      # are outside spec-check.yml's path filter, so a PR touching only those
      # would otherwise ship with this whole suite unrun. An un-run lock is
      # theatre — pin it.
      - name: Run module-entry locks (#2752)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_classical_modules_entry_2752.py \
            tests/test_goal_box_self_check_entry_2752.py \
            tests/test_module_entry_gate_parser_2752.py \
            tests/test_multi_text_and_followups_entry_2752.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
