# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: Pytest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # 路徑判斷改在 job 裡做 —— `on.paths` 只看前 300 個變更檔，批次改名的 PR
  # 會讓整支被靜靜跳過，而且檢查清單上不會出現那一列（#2925）。
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              # 產生器也要觸發 —— 只改它的 PR 若不跑鎖，「下次會再錯一次」的鎖就沒插電
              # 抽取器與普查也要觸發 —— 改它們的 PR 若不跑 gate，等於鎖建了沒插電
              - 'scripts/split_lesson_modules.py'
              - 'scripts/key_reading_xml_rule.py'
              - 'scripts/corpus_profile.py'
              # 念順順的抽取器 —— 規則就寫在裡面（2026-08-30 那次 regression 的來源）
              - 'scripts/extract_key_reading_v3.py'
              # ⭐ skill 是「下一個人拿來當規格讀」的東西。2026-08-30 就是 code 改了、
              #    skill 沒改 —— 分家的後果不是報錯，是下一個人照文件把 code 改回去。
              #    不盯這個路徑，「只改 skill」的 PR 不會跑那道鎖 ＝ 鎖建了沒插電。
              - '.claude/skills/**'
              # ⭐ #3055 issue-agent 的安全結構鎖住在 backend/tests，但被鎖的
              #    對象是這個 workflow 檔本身 —— 只改 yml 的 PR 不跑 pytest
              #    ＝ 有人拆掉 gate/放回 curl 時鎖是睡著的。
              - '.github/workflows/claude-issue-agent.yml'

  pytest:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ffmpeg + poppler (transcode / silence gate / PDF fingerprint gate)
        # poppler-utils 給 ⑤ 的每頁文字指紋用（pdftotext / pdfinfo）。
        # 沒裝的話那道門一律回 2「算不出來」—— 那是正確的 fail-closed，
        # 但等於 CI 對它零覆蓋，而它是擋「版面重排」的唯一一道門。
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils

      # ⬇︎ 這裡原本是十四個手工維護的具名清單。#3093/#2804：302 支測試檔裡有
      #    122 支沒被任何 workflow 點名，所以從來不會跑 —— L0041 的答案洩漏
      #    就是這樣回來的（八月修好、也寫了鎖，鎖沒進 CI，重抽時洩漏復活）。
      #    清單會無聲腐爛，目錄不會。
      #
      #    十四個 step 宣告的 env 完全相同，合併不會少掉任何條件（查證過）。
      #    真正的內容缺口用 xfail(strict) 對著 content_known_gaps.yaml 標著，
      #    看得見，而且補好的那一刻會 XPASS 變紅逼人回來拿掉。
      #
      #    下面保留原本每一道鎖的說明 —— 它們記著那些鎖為什麼存在，比清單本身
      #    值錢。鎖仍然會跑，只是不再靠人維護名字。
      - name: Run the whole backend suite
        run: |
          cd backend
          python -m pytest tests --tb=short -q
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # ── 以下是原本十四個 step 的說明，保留備查 ─────────────────────────
      # ── 回歸鎖（檔名帶 issue 號的那些）────────────────────────────────
      # 2026-08-28 量到：backend/tests 279 支裡有 229 支從來不會被 CI 跑到，
      # 其中 93 支是為特定 bug 寫的回歸鎖。鎖建了沒插電 = 劇場 ——
      # 2962 就是這樣（test_gamification 四條紅了很久，沒有人會看到）。
      # 這一步把當時全綠的 73 支插上（575 條，本機 2m06s）。
      # 另外 20 支當時是紅的，逐支判「真 regression / 期望過時 / 沒價值」，
      # 見 docs/qa/guardrail-plan.md §2 P0-b。
      # 2026-08-28：上面那三支（omo_grader_split_1879 / characterization_omo_1949 /
      # characterization_learning_sessions_1955）原本因「本機綠、CI 紅」被排除在外。
      # 修的是**測試自己的環境假設**，不是把斷言放寬 —— 已插電，見 tests/_route_walk.py。
      # 復現方式：另建 python3.11 + 未釘版 fastapi 的 venv（實測 0.141.1）跑一次；
      # 用本機的 3.10 + 0.115.6 永遠重現不到。
      # 教師「以學生身分預覽」(#3027)：preview JWT 只允許唯讀。這三支涵蓋
      # (1) token 本身帶對 claim (2) 核發端點只給該學生的授課老師 (3) 核心
      # 安全邊界 — PreviewModeWriteGuardMiddleware 擋掉所有 /api/* 寫入，
      # 用最低權限身分(被預覽的學生本人)測、每個 fail-closed 都配正向對照。
      # Eighteen files that failed when run on their own — module splits left
      # their patches aimed at re-export shims, fixtures carried placeholder
      # slugs a later gate started refusing, and assertions still described a
      # response shape that had moved. None of it was caught, because none of
      # these files was named anywhere in this workflow. That is also how the
      # L0041 answer leak came back: 777a4a938 fixed it and shipped a lock, the
      # lock was never wired in, and the v3 re-extraction reintroduced the leak
      # in silence. Pinning them here is the part that makes the repair last.
      # 
      # test_reading_transcription used to need its own step with a file-backed
      # SQLite. It does not any more: app/database.py now sets
      # check_same_thread=False (and StaticPool for in-memory), which is what a
      # threaded app on SQLite needs. Fixing the engine beat working around it
      # in CI config.
      # 
      # test_lesson_uid_loader.py is deliberately absent — it still has 17 real
      # content failures, tracked in #3100. Adding it would only turn CI red.
      # Teacher live classroom monitor (#3025): per-student "which 大題 /
      # 卡在這題" snapshot polled during 課後學習扶助. Covers (1) the same
      # least-privilege + positive-control access pattern as #3027 (2) the
      # explicit has_data=False state for students with zero trackable
      # mcq_attempt rows — this endpoint exists specifically so "no data"
      # never silently renders as "doing fine" (3) the >=3-same-question-
      # wrong stuck signal clearing once the student answers that exact
      # question correctly, even though the historical wrong count stays
      # >= 3 (4) the question_id -> teacher-readable label mapping never
      # leaking a raw internal id.
      # The 課文管理 list promises teachers that "我來試做" answers stay out of
      # student records and class stats. The frontend test only checks the
      # sentence is displayed; this checks it is true. Both assertions carry a
      # positive control, and both were verified to redden under mutation
      # (heatmap: session query scoped by classroom instead of roster;
      # alerts: the same, plus emitting non-roster session authors).
      # Pronunciation fingerprint gate (#2742). Already run by spec-check.yml,
      # repeated here on purpose: spec-check is path-filtered, this workflow
      # triggers on all of backend/**, and the failure being guarded against is
      # precisely "the gate existed and nothing ran it". Cheap enough (three
      # assertions, no I/O) that redundancy costs less than another silent
      # orphaning of the whole audio cache.
      # Wiring lock for the gate above (#2742): asserts every input the
      # fingerprint is computed from is watched by a workflow that runs it.
      # TTS coverage lock (#2619): mocked logic only (existing_keys/missing_keys/
      # expected_keys against FakeBucket doubles + the real manifest file) — no
      # GCS credentials touched here. The real-bucket class
      # (TestRealGCSCoverage) is opt-in via RUN_REAL_GCS_TESTS and self-skips
      # without it, so it never runs in CI. An un-run lock is theatre — pin it.
      # 重點表 bridge lock (#2736): `app/services/keypoints_to_structure.py` 供給 150 課的
      # 重點表（`lesson_indexes.py` → `story_structure_table` → `/stories/{id}/structure`），
      # 但**沒有任何 spec module 認領它**，而這個 workflow 是點名清單不是掃目錄 ——
      # 於是它的測試檔一直存在、卻從來沒有任何門會執行（GHA 0 / run-ci 0 / registry 0，
      # 2026-08-18 實測，以 test_rate_limiting 與 test_verify_qr_manifest 當正向對照）。
      # 兩個靜默流失的 bug（子項標題 63 課、題幹 3 課）就是在這個空隙裡活下來的。
      # An un-run lock is theatre — pin it.
      # Ticked-answer ground-truth lock (#2735): #2555 closed the "no box = answer"
      # leak, which was the extractor's only signal — closing it silently changed
      # 312 spotlight answers. `checked_box_positions()` reads the teacher's tick
      # directly instead of inferring it from an absent box; this file is the only
      # thing proving that read actually reaches the seven call sites that used to
      # trust the leak (three review rounds found six of them one at a time, plus a
      # box-glyph-counting bug in the primitive itself — each round's finding has its
      # own test class here). Not caught by `backend/specs` (this repo isn't on that
      # path) — pin it here or it goes unrun like the bridge lock above did.
