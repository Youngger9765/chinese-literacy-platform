name: Pytest

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 路徑判斷改在 job 裡做 —— `on.paths` 只看前 300 個變更檔，批次改名的 PR
  # 會讓整支被靜靜跳過，而且檢查清單上不會出現那一列（#2925）。
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              # 產生器也要觸發 —— 只改它的 PR 若不跑鎖，「下次會再錯一次」的鎖就沒插電
              # 抽取器與普查也要觸發 —— 改它們的 PR 若不跑 gate，等於鎖建了沒插電
              - 'scripts/split_lesson_modules.py'
              - 'scripts/key_reading_xml_rule.py'
              - 'scripts/corpus_profile.py'

  pytest:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ffmpeg + poppler (transcode / silence gate / PDF fingerprint gate)
        # poppler-utils 給 ⑤ 的每頁文字指紋用（pdftotext / pdfinfo）。
        # 沒裝的話那道門一律回 2「算不出來」—— 那是正確的 fail-closed，
        # 但等於 CI 對它零覆蓋，而它是擋「版面重排」的唯一一道門。
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils

      - name: Run characterization tests (refactor safety gate)
        run: |
          cd backend
          python -m pytest --tb=short -q \
            tests/test_characterization_auth_policies.py \
            tests/test_characterization_socratic_state_machine.py \
            tests/test_characterization_tts_normalization.py \
            tests/test_characterization_tts_cache.py \
            tests/test_rate_limiting.py \
            tests/test_session_scoring_write_1063.py \
            tests/test_session_scoring_below_threshold_2904.py \
            tests/test_gamification.py
        env:
          DATABASE_URL: sqlite://
          TTS_PROVIDER: google
          AZURE_SPEECH_KEY: ""
          AZURE_SPEECH_REGION: eastus
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"

      # ── 回歸鎖（檔名帶 issue 號的那些）────────────────────────────────
      # 2026-08-28 量到：backend/tests 279 支裡有 229 支從來不會被 CI 跑到，
      # 其中 93 支是為特定 bug 寫的回歸鎖。鎖建了沒插電 = 劇場 ——
      # #2962 就是這樣（test_gamification 四條紅了很久，沒有人會看到）。
      # 這一步把當時全綠的 73 支插上（575 條，本機 2m06s）。
      # 另外 20 支當時是紅的，逐支判「真 regression / 期望過時 / 沒價值」，
      # 見 docs/qa/guardrail-plan.md §2 P0-b。
      # 2026-08-28：上面那三支（omo_grader_split_1879 / characterization_omo_1949 /
      # characterization_learning_sessions_1955）原本因「本機綠、CI 紅」被排除在外。
      # 修的是**測試自己的環境假設**，不是把斷言放寬 —— 已插電，見 tests/_route_walk.py。
