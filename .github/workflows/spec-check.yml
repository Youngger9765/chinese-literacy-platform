# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: Spec Check

# Modular spec system (issues #2029 + #2058 + #2041): verify the registry is
# fresh (+ legacy_tests pointer-rot), run the executable spec contracts, and run
# the legacy_tests union. Path-filtered so unrelated PRs (frontend/docs) skip it.
#
# This delegates to `bash specs/run-ci.sh` — the SAME runner used locally — so
# the CI gates and the local gates can never drift. run-ci.sh computes the
# legacy_tests union dynamically from specs/registry.yaml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # 路徑判斷改在 job 裡做 —— `on.paths` 只看前 300 個變更檔，批次改名的 PR
  # 會讓整支被靜靜跳過，而且檢查清單上不會出現那一列（#2925）。
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              # 這支 spec 裡有 test_workflow_path_filters_spec.py，它守的就是 workflow 本身。
              # 不盯 .github/workflows/** 的話，「把 paths 改回頂層」那種 PR 不會觸發這支，
              # 鎖照樣存在但那條路沒插電（#2925 收尾時發現）。
              - '.github/workflows/**'
              - 'specs/**'
              - 'backend/specs/**'
              # 回歸鎖的「紅過」帳本是 test_locks_have_red_evidence_spec.py 的輸入。
              # 不盯它的話，只把帳本裡的條目刪掉不會觸發這支 —— 門還在，但那條路沒插電。
              - 'docs/qa/lock-red-evidence.md'
              - 'backend/app/services/**'
              - 'backend/app/routes/auth.py'
              - 'backend/app/routes/semesters.py'
              - 'backend/data/lessons/**'
              - 'backend/data/curriculum_qa/**'
              # The pronunciation table is half-generated: _load_taiwan_corrections()
              # merges this file into PHONEME_CORRECTIONS before CORRECTIONS_FINGERPRINT
              # is computed, and normalization.py says regenerating it — not appending a
              # tuple — is how coverage is meant to grow. So the likeliest edit that
              # orphans the entire TTS cache used to be the one edit this filter did not
              # watch, leaving test_tts_cache_fingerprint_spec.py unrun (#2742).
              - 'backend/data/tts/**'
              # 注音的漂移門（run-ci.sh 的 Gate 11/12）在這支裡面跑，但它的**輸入**
              # 原本有四個不在這張 filter 上：改 `poyin_db.json`、改出貨的 processor、
              # 改 `backend/data/zhuyin/**`、或改產生器本身的 PR，整支 spec-check
              # 根本不會觸發 —— 門在，而最可能弄壞它的那幾種編輯剛好那條路沒插電。
              # 這個 repo 同一個病的第五次（#2925 / #3251 / #3253）。
              - 'backend/data/zhuyin/**'
              - 'backend/scripts/generate_lesson_zhuyin.py'
              - 'backend/scripts/generate_char_difficulty.py'
              - 'frontend/public/data/poyin_db.json'
              - 'frontend/src/components/zhuyin/**'
              - 'backend/specs/**'
              - 'scripts/story_structure_qa.py'
              - 'scripts/build_keypoints_qa_manifest.py'
              - 'scripts/keypoints_manifest_verify.py'
              - 'backend/tests/test_semesters.py'
              - 'backend/tests/test_points_system.py'
              - 'backend/tests/test_full_reading_attempts.py'
              - 'backend/tests/test_auth_api.py'
              - 'backend/tests/test_auth_route_split_1844.py'
              # ─── 2026-09-18 系統性掃描：這支跑 `pytest specs/`（backend/specs
              # 全套）＋ run-ci.sh 的十二道門，而那些 spec 讀的東西有七類不在
              # 這張 filter 上。 ───
              #
              # `backend/app/**`：`test_dead_source_paths_only_shrink_spec` 走
              # 整個 `backend/app` 找指向已刪目錄的引用；
              # `test_recorded_history_reaches_the_teacher_spec` 讀
              # `routes/teacher/teacher_schemas.py`。原本只盯 services/** 與兩支 route。
              - 'backend/app/**'
              # `backend/tests/**`：`test_dead_source_paths_only_shrink_spec` 與
              # `test_gate_scripts_are_classified_spec` 都走這個目錄。
              # ⭐ 也是 `test_every_gate_input_is_in_its_filter` 的輸入 ——
              # 少了這條，新增一支讀新檔的後端測試不會跑到那道防漂移的門。
              - 'backend/tests/**'
              # `.claude/skills/**`：`test_skill_docs_do_not_contradict_themselves_spec`
              # 與 `test_gate_scripts_are_classified_spec` 讀 skill 文件。
              # pytest.yml 盯了它，但 pytest.yml 跑的是 `tests` 不是 `specs`。
              - '.claude/skills/**'
              # `scripts/**`：`test_progress_table_is_fresh_spec` 用
              # `scripts/build_progress_table.py` 重算進度表比對。
              - 'scripts/**'
              # 進度表與 provenance 負債帳本 —— 兩支 spec 的直接輸入
              - 'docs/evidence/2026-08-17-multimodal-extraction/PROGRESS.md'
              - 'docs/qa/golden-provenance-debt.txt'

  spec-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Spec registry + contracts + legacy_tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
      TTS_PROVIDER: google
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Spec CI (registry + pointer-rot + contracts + legacy_tests union)
        run: bash specs/run-ci.sh
