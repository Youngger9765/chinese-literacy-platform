name: Scheduled Cleanup (AR Images + Cloud Run Revisions)

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday midnight UTC
  workflow_dispatch:  # Manual trigger

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap

jobs:
  cleanup-ar-images:
    name: Delete old AR images (keep latest 3)
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete old images per tag prefix
        run: |
          KEEP=3

          for PACKAGE in backend frontend; do
            for PREFIX in prod staging; do
              echo "=== Cleaning ${PACKAGE} ${PREFIX}-* images (keep ${KEEP}) ==="

              DIGESTS=$(gcloud artifacts docker images list \
                "${{ env.REGISTRY }}/${PACKAGE}" \
                --include-tags \
                --filter="tags:${PREFIX}-" \
                --sort-by="~CREATE_TIME" \
                --format="value(version)" 2>/dev/null || true)

              if [ -z "$DIGESTS" ]; then
                echo "No ${PREFIX} images found for ${PACKAGE}, skipping"
                continue
              fi

              TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
              echo "Found $TOTAL images, keeping latest $KEEP"

              # Real counting (no 2>/dev/null swallow, no subshell via <<<) so the
              # report is the actual delete count, not TOTAL-KEEP arithmetic (#2064).
              DELETED=0; FAILED=0
              while read -r DIGEST; do
                [ -z "$DIGEST" ] && continue
                echo "DELETE: ${PACKAGE}@${DIGEST:0:20}..."
                if gcloud artifacts docker images delete \
                    "${{ env.REGISTRY }}/${PACKAGE}@${DIGEST}" \
                    --delete-tags --quiet; then
                  DELETED=$((DELETED + 1))
                else
                  FAILED=$((FAILED + 1))
                  echo "::warning::failed to delete ${PACKAGE}@${DIGEST:0:25} (#2064)"
                fi
              done <<< "$(echo "$DIGESTS" | tail -n +$((KEEP + 1)))"

              echo "Done: ${PACKAGE}/${PREFIX} — deleted ${DELETED}, failed ${FAILED} (of $TOTAL total)"
              echo ""
            done
          done

      - name: Delete untagged images
        run: |
          for PACKAGE in backend frontend; do
            echo "=== Cleaning ${PACKAGE} untagged images ==="

            DIGESTS=$(gcloud artifacts docker images list \
              "${{ env.REGISTRY }}/${PACKAGE}" \
              --include-tags \
              --filter="NOT tags:*" \
              --format="value(version)" 2>/dev/null || true)

            if [ -z "$DIGESTS" ]; then
              echo "No untagged images found for ${PACKAGE}"
              continue
            fi

            TOTAL=$(echo "$DIGESTS" | wc -l | tr -d ' ')
            echo "Found $TOTAL untagged images"

            DELETED=0; FAILED=0
            while read -r DIGEST; do
              [ -z "$DIGEST" ] && continue
              echo "DELETE: ${PACKAGE}@${DIGEST:0:20}..."
              if gcloud artifacts docker images delete \
                  "${{ env.REGISTRY }}/${PACKAGE}@${DIGEST}" \
                  --delete-tags --quiet; then
                DELETED=$((DELETED + 1))
              else
                FAILED=$((FAILED + 1))
                echo "::warning::failed to delete untagged ${PACKAGE}@${DIGEST:0:25} (#2064)"
              fi
            done <<< "$DIGESTS"
            echo "Done: ${PACKAGE} untagged — deleted ${DELETED}, failed ${FAILED} (of $TOTAL)"
          done

  cleanup-revisions:
    name: Delete old Cloud Run revisions (keep latest 5)
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete old revisions
        run: |
          KEEP=5
          SERVICES=(
            lingoleap-backend
            lingoleap-frontend
            lingoleap-backend-staging
            lingoleap-frontend-staging
          )

          for SERVICE in "${SERVICES[@]}"; do
            echo "=== Cleaning revisions for ${SERVICE} (keep ${KEEP}) ==="

            REVISIONS=$(gcloud run revisions list \
              --service="${SERVICE}" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --sort-by="~creationTimestamp" \
              --format="value(metadata.name)" 2>/dev/null || true)

            if [ -z "$REVISIONS" ]; then
              echo "No revisions found for ${SERVICE}, skipping"
              continue
            fi

            TOTAL=$(echo "$REVISIONS" | wc -l | tr -d ' ')
            echo "Found $TOTAL revisions, keeping latest $KEEP"

            DELETED=0; FAILED=0
            while read -r REV; do
              [ -z "$REV" ] && continue
              echo "DELETE: ${REV}"
              if gcloud run revisions delete "${REV}" \
                  --region="${{ env.REGION }}" \
                  --project="${{ env.PROJECT_ID }}" \
                  --quiet; then
                DELETED=$((DELETED + 1))
              else
                # An active/serving revision can't be deleted — expected, not alarming.
                FAILED=$((FAILED + 1))
                echo "  (skip: ${REV} not deletable — likely still serving traffic)"
              fi
            done <<< "$(echo "$REVISIONS" | tail -n +$((KEEP + 1)))"

            echo "Done: ${SERVICE} — deleted ${DELETED}, skipped ${FAILED} (of $TOTAL revisions)"
            echo ""
          done

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **AR Images**: kept latest 3 per package per environment, deleted untagged" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Run Revisions**: kept latest 5 per service" >> $GITHUB_STEP_SUMMARY
          echo "- **Services**: lingoleap-backend, lingoleap-frontend, lingoleap-backend-staging, lingoleap-frontend-staging" >> $GITHUB_STEP_SUMMARY
