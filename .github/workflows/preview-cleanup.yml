name: L3 Cleanup Orphan Previews (Cloud Run + AR)

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday midnight UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  AR_REPO: lingoleap

jobs:
  cleanup:
    name: Delete orphan preview services & images
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Find and delete orphan previews
        uses: actions/github-script@v8
        with:
          script: |
            const { execSync } = require('child_process');
            const region = process.env.REGION;
            const projectId = process.env.PROJECT_ID;
            const registry = `${region}-docker.pkg.dev/${projectId}/${process.env.AR_REPO}`;

            // Get ALL open issues (paginate to handle >100)
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              }
            );
            const activeNums = new Set(openIssues.map(i => String(i.number)));
            console.log(`Active issues (${activeNums.size}): ${[...activeNums].slice(0, 20).join(', ')}${activeNums.size > 20 ? '...' : ''}`);

            // === Part 1: Cloud Run Preview Services ===
            console.log('\n=== Cloud Run Preview Services ===');
            let svcOutput;
            try {
              svcOutput = execSync(
                `gcloud run services list --region=${region} --project=${projectId} --format='value(name)'`
              ).toString().trim();
            } catch(e) { svcOutput = ''; }

            const services = svcOutput.split('\n').filter(s =>
              s.includes('-issue-') || s.includes('-pr-')
            );

            let svcDeleted = 0;
            for (const svc of services) {
              const match = svc.match(/(?:issue|pr)-(\d+)/);
              if (!match) continue;
              if (activeNums.has(match[1])) {
                console.log(`KEEP: ${svc} (issue #${match[1]} open)`);
                continue;
              }
              console.log(`DELETE: ${svc} (issue #${match[1]} closed)`);
              try {
                execSync(
                  `gcloud run services delete ${svc} --region=${region} --project=${projectId} --quiet`,
                  { timeout: 120000 }
                );
                svcDeleted++;
              } catch(e) {
                console.log(`  Failed: ${e.message}`);
              }
            }
            console.log(`Cloud Run services: ${svcDeleted} deleted, ${services.length - svcDeleted} kept`);

            // === Part 2: AR Preview Tags + Images ===
            console.log('\n=== AR Preview Tags ===');
            let tagDeleted = 0;
            let tagFailed = 0;

            for (const sub of ['backend', 'frontend']) {
              let tags;
              try {
                tags = execSync(
                  `gcloud artifacts docker tags list "${registry}/${sub}" --format="value(tag)" 2>/dev/null`
                ).toString().trim().split('\n').filter(t => /^(issue|pr)-/.test(t));
              } catch(e) { continue; }

              for (const tag of tags) {
                const match = tag.match(/(?:issue|pr)-(\d+)/);
                if (!match) continue;
                if (activeNums.has(match[1])) {
                  console.log(`KEEP: ${sub}:${tag} (issue #${match[1]} open)`);
                  continue;
                }
                console.log(`UNTAG: ${sub}:${tag} (issue #${match[1]} closed)`);
                try {
                  // Removing a tagged preview image ALWAYS needs
                  // artifactregistry.tags.delete — whether via `tags delete` or
                  // `images delete --delete-tags` (verified both fail identically).
                  // The CI SA currently LACKS that perm (#2064: PERMISSION_DENIED).
                  // There is no code workaround; the fix is the IAM grant in #2064.
                  // No 2>/dev/null here (unlike cleanup.yml) so it fails LOUD, not
                  // silent — and tagFailed + the ::warning:: below make it visible.
                  execSync(
                    `gcloud artifacts docker tags delete "${registry}/${sub}:${tag}" --quiet`,
                    { stdio: 'pipe' }
                  );
                  tagDeleted++;
                } catch(e) {
                  const detail = ((e.stderr || e.message || '') + '').trim().slice(0, 200);
                  console.log(`  Failed: ${detail}`);
                  tagFailed++;
                }
              }
            }

            console.log(`\n=== Summary ===`);
            console.log(`Services: ${svcDeleted} deleted`);
            console.log(`AR Tags: ${tagDeleted} untagged, ${tagFailed} failed`);
            console.log('L1 AR Policy will auto-clean untagged images within 7 days');
            if (tagFailed > 0) {
              console.log(`::warning::${tagFailed} AR tag deletes failed — see 'Failed:' lines above for the real gcloud error (#2064)`);
            }
