name: L3 Cleanup Orphan Previews (Cloud Run + AR + Revisions)

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday midnight UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  AR_REPO: lingoleap

jobs:
  cleanup:
    name: Delete orphan preview services, images & revisions
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Find and delete orphan previews
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const region = process.env.REGION;
            const projectId = process.env.PROJECT_ID;
            const registry = `${region}-docker.pkg.dev/${projectId}/${process.env.AR_REPO}`;

            // Get ALL open issues (paginate to handle >100)
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              }
            );
            const activeNums = new Set(openIssues.map(i => String(i.number)));
            console.log(`Active issues (${activeNums.size}): ${[...activeNums].slice(0, 20).join(', ')}${activeNums.size > 20 ? '...' : ''}`);

            // === Part 1: Cloud Run Preview Services ===
            console.log('\n=== Cloud Run Preview Services ===');
            let svcOutput;
            try {
              svcOutput = execSync(
                `gcloud run services list --region=${region} --project=${projectId} --format='value(name)'`
              ).toString().trim();
            } catch(e) { svcOutput = ''; }

            const services = svcOutput.split('\n').filter(s =>
              s.includes('-issue-') || s.includes('-pr-')
            );

            let svcDeleted = 0;
            for (const svc of services) {
              const match = svc.match(/(?:issue|pr)-(\d+)/);
              if (!match) continue;
              if (activeNums.has(match[1])) {
                console.log(`KEEP: ${svc} (issue #${match[1]} open)`);
                continue;
              }
              console.log(`DELETE: ${svc} (issue #${match[1]} closed)`);
              try {
                execSync(
                  `gcloud run services delete ${svc} --region=${region} --project=${projectId} --quiet`,
                  { timeout: 120000 }
                );
                svcDeleted++;
              } catch(e) {
                console.log(`  Failed: ${e.message}`);
              }
            }
            console.log(`Cloud Run services: ${svcDeleted} deleted, ${services.length - svcDeleted} kept`);

            // === Part 2: Cloud Run Revisions (all environments) ===
            console.log('\n=== Cloud Run Revisions ===');
            const KEEP_REVISIONS = 5;
            let revDeleted = 0;

            // Main services to clean revisions for
            const mainServices = [
              'lingoleap-backend', 'lingoleap-frontend',
              'lingoleap-backend-staging', 'lingoleap-frontend-staging',
            ];

            for (const svc of mainServices) {
              let revisions;
              try {
                revisions = execSync(
                  `gcloud run revisions list --service=${svc} --region=${region} --project=${projectId} --format="value(name)" --sort-by="~createTime"`
                ).toString().trim().split('\n').filter(Boolean);
              } catch(e) {
                console.log(`${svc}: could not list revisions`);
                continue;
              }

              const toDelete = revisions.slice(KEEP_REVISIONS);
              console.log(`${svc}: ${revisions.length} total, deleting ${toDelete.length} (keeping ${KEEP_REVISIONS})`);

              for (const rev of toDelete) {
                try {
                  execSync(
                    `gcloud run revisions delete ${rev} --region=${region} --project=${projectId} --quiet`,
                    { timeout: 60000 }
                  );
                  revDeleted++;
                } catch(e) {
                  // Skip errors (active revision can't be deleted)
                }
              }
            }
            console.log(`Revisions: ${revDeleted} deleted`);

            // === Part 3: AR Preview Tags + Images ===
            console.log('\n=== AR Preview Tags ===');
            let tagDeleted = 0;

            for (const sub of ['backend', 'frontend']) {
              let tags;
              try {
                tags = execSync(
                  `gcloud artifacts docker tags list "${registry}/${sub}" --format="value(tag)" 2>/dev/null`
                ).toString().trim().split('\n').filter(t => /^(issue|pr)-/.test(t));
              } catch(e) { continue; }

              for (const tag of tags) {
                const match = tag.match(/(?:issue|pr)-(\d+)/);
                if (!match) continue;
                if (activeNums.has(match[1])) {
                  console.log(`KEEP: ${sub}:${tag} (issue #${match[1]} open)`);
                  continue;
                }
                console.log(`UNTAG: ${sub}:${tag} (issue #${match[1]} closed)`);
                try {
                  execSync(
                    `gcloud artifacts docker tags delete "${registry}/${sub}:${tag}" --quiet 2>/dev/null`
                  );
                  tagDeleted++;
                } catch(e) {
                  console.log(`  Failed: ${e.message}`);
                }
              }
            }

            console.log(`\n=== Summary ===`);
            console.log(`Services: ${svcDeleted} deleted`);
            console.log(`Revisions: ${revDeleted} deleted`);
            console.log(`AR Tags: ${tagDeleted} untagged`);
            console.log('L1 AR Policy will auto-clean untagged images within 7 days');
