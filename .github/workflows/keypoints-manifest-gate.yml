# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: Keypoints Manifest Gate

# Enforces I-6: committed manifest + snapshots must match live loader/parser output.
# CI-safe — no private/curriculum-source required.
#
# See docs/qa/story-structure-verification-standard.md §0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # 路徑判斷改在 job 裡做 —— `on.paths` 只看前 300 個變更檔，批次改名的 PR
  # 會讓整支被靜靜跳過，而且檢查清單上不會出現那一列（#2925）。
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # paths-filter 要完整歷史才能算 diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/app/routes/stories.py'
              - 'backend/app/services/story_structure*.py'
              - 'backend/app/services/keypoints_preview.py'
              # The 重點表 source bridge and the row builder that calls it. Both change the
              # served interaction_profile and neither was listed — so the 2026-08-17
              # regression this gate exists for lived in a file that could not trigger it.
              - 'backend/app/services/keypoints_to_structure.py'
              - 'backend/app/services/lesson_indexes.py'
              - 'backend/data/lessons/**'
              - 'backend/data/curriculum_qa/**'
              - 'backend/specs/test_keypoints_manifest_spec.py'
              - 'backend/specs/test_story_structure_spec.py'
              - 'backend/tests/test_story_structure_qa_contract.py'
              - 'scripts/story_structure_qa*.py'
              - 'backend/tests/test_manifest_builder_does_not_destroy_2795.py'
              - 'scripts/build_keypoints_qa_manifest.py'
              - 'scripts/keypoints_table_sync.py'
              - 'scripts/keypoints_manifest_verify.py'
              - 'scripts/story_structure_ship_gate.sh'
              - 'specs/modules/story-structure/**'

  manifest-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: Manifest freshness + story-structure contracts
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      TTS_PROVIDER: google
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Manifest matches runtime (no private schema)
        run: python scripts/keypoints_manifest_verify.py

      - name: Story-structure + manifest spec contracts
        run: |
          cd backend
          python -m pytest \
            specs/test_keypoints_manifest_spec.py \
            specs/test_story_structure_spec.py \
            tests/test_story_structure_qa_contract.py \
            tests/test_manifest_builder_does_not_destroy_2795.py \
            tests/test_qa_lib_copies_stay_in_sync.py \
            -q
