# 草稿 PR 只跑 preview，不跑完整測試（Young 2026-09-03）
# 理由：非技術的發文者要的是「快點看到結果」，不是等 8 個 workflow。
# agent 一律開 draft PR → 只有 preview 部署會跑；工程師 review 完按
# 「Ready for review」→ ready_for_review 事件觸發完整 CI → 綠了才 merge。
# merge 本身受 branch protection（需 1 個 review）保護，仍然只有工程師能做。
name: Schema Drift Check

# ⚠️ 觸發不用 `paths:`（#2916 收尾查到）。
#
# GitHub 的 `paths:` 過濾只看**前 300 個變更檔**。PR #2920 改了 3691 個檔，
# 前 300 個全被批次改名的 yml 佔滿 —— 這支整個 PR 一次都沒跑，
# 而檢查清單上不會出現這一列，看起來就是全綠。
#
# 改用 repo 既有的 `dorny/paths-filter`（staging-deploy.yml 一直這樣做），
# 它算完整 diff，沒有 300 上限。意圖不變：沒動到 model / migration 就跳過。
#
# ⚠️ push 到 staging/main 時**一律跑**，不再過濾 ——
# merge commit 的 diff 同樣可能超過 300 檔，而那一刻正是最不該漏掉它的時候。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - staging
      - main

jobs:
  detect-changes:
    # 草稿 PR 不跑（見檔頭）
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/app/models/**'
              - 'backend/alembic/versions/**'
              - 'backend/scripts/check_model_coverage.py'
              - '.github/workflows/schema-check.yml'

  schema-drift:
    name: Detect Model / Migration Drift
    needs: detect-changes
    # push 到 staging/main 時 detect-changes 被跳過 → needs 的結果是 skipped，
    # 所以要明寫「push 一律跑」，否則整支會跟著被跳掉。
    # 草稿 PR 不跑（見檔頭）—— always() 會繞過 needs 的 skipped，
    # 不明寫排除的話草稿 PR 照樣會跑這支。
    if: |
      always() && github.event.pull_request.draft != true
        && (github.event_name == 'push'
        || needs.detect-changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run schema drift check
        run: python backend/scripts/check_model_coverage.py
