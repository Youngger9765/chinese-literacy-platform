name: PR Preview Deploy

# Claude Security CodeQL critical alert, 2026-11-05: `cleanup-preview`
# (the only job here that ran on `pull_request_target: closed`) moved to
# its own file, preview-cleanup-on-close.yml -- see that file's header
# comment for why. This file now ONLY has the `pull_request` trigger, so
# it never gets secrets for a fork PR and CodeQL's "checkout of untrusted
# code in a privileged context" pattern (a pull_request_target trigger
# co-located with a PR-head-sha checkout, which deploy-preview and
# e2e-preview-check both do, for understandable reasons -- they need the
# PR's own code to build and test) no longer applies to this file at all.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# find_015p35fzCRJqG7UACGpxSxQp (HIGH): `pull-requests: write` and
# `id-token: write` used to sit here, so `e2e-preview-check` and
# `detect-changes` inherited both even though neither needs either --
# `e2e-preview-check` runs `npm ci` + `playwright install` + a lockfile-
# resolved dependency's install script could mint an OIDC token for the
# prod deploy service account directly, with no `auth@v2` step required in
# that job at all. Both scopes now live ONLY as per-job overrides on
# `deploy-preview`, the one job that actually authenticates to GCP and
# posts the preview-URL PR comment. GitHub Actions does not merge a
# job-level permissions block with this one; it replaces it for that job,
# and a job with no block of its own still inherits this one unchanged --
# so `detect-changes` / `e2e-preview-check` get `contents: read` and
# nothing else, with no edit needed to them for that alone (they still get
# an explicit block below, naming the restriction instead of leaving it
# implicit).
permissions:
  contents: read

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  # 2026-11-16 第二次打開（#3733）：第一次（#4083）因既有 frontend 是「一個沒命名
  # 的容器」雙容器 deploy 失敗而回滾；現在部署前會先把它改名成 frontend（#4086，
  # 已在既有 preview 上實測 #4085）。回滾＝這行與 SAME_ORIGIN_PROXY_ENABLED 一起改回 'false'。
  # #3719/#3733 — 打開時每個 PR preview 的 frontend 過 IAP、
  # backend 只給 frontend 與 CI 呼叫。真正的 on/off 開關只有這一行（與
  # SAME_ORIGIN_PROXY_ENABLED 一起動）。新 preview 不需要逐一授權：白名單
  # 設在 asia-east1 的 Cloud Run IAP 區域層，新服務自動繼承。見
  # docs/iap-runbook.md。
  IAP_ENABLED: 'true'
  # #3728/#3740 — 同源代理 build-time 開關，預設 false：關掉時這個 job
  # 建出來的 preview image 跟 #3741 revert 之後完全一樣（VITE_API_URL
  # 指到 backend 絕對網址，無 BACKEND_INTERNAL_URL、無
  # BACKEND_INVOKER_SIDECAR_PORT）。同一個理由、同一段完整說明見
  # staging-deploy.yml 這個開關旁的註解——這裡不重複貼一次，兩邊要改
  # 一起改。
  SAME_ORIGIN_PROXY_ENABLED: 'true'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # a switch flip here (IAP_ENABLED etc.) must redeploy both halves
              - '.github/workflows/preview-deploy.yml'
            frontend:
              - 'frontend/**'
              # a switch flip here (IAP_ENABLED etc.) must redeploy both halves
              - '.github/workflows/preview-deploy.yml'

  deploy-preview:
    name: Deploy PR Preview
    needs: detect-changes
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.head.ref != 'staging'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      frontend_url: ${{ steps.preview-urls.outputs.frontend_url }}
      backend_url: ${{ steps.preview-urls.outputs.backend_url }}
      # #3733 — job-level `if:` can't read `env`, so e2e-preview-check
      # learns the switch from here.
      iap_enabled: ${{ env.IAP_ENABLED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # Claude Security find_01WStrhArZsNRHeb92RWHZRE (high, CWE-250):
          # this job authenticates as github-actions@lingoleap-dev -- the
          # SAME identity deploy.yml uses for PRODUCTION. A least-privilege
          # lingoleap-preview-deploy@ SA was tried here and reverted: a
          # project-level conditional run.admin binding scoped by
          # resource.name does not reliably gate Cloud Run's admin-plane
          # calls (confirmed failing identically across two condition
          # formats and after IAM propagation), and the only workable
          # per-resource-binding alternative needs run.services.setIamPolicy,
          # which cannot be scoped to a not-yet-created service -- granting
          # it project-wide would let this SA grant itself run.admin on
          # prod, which is worse than the status quo. A proposal using
          # resource tags + an IAM deny policy against prod's two services
          # is under review separately; until it lands, this job keeps the
          # broader identity and the mitigations below (same-repo-only
          # cleanup, hardened agent workflows) are the active defenses.
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # #3733: the runner's gcloud has no `beta` component; `gcloud beta
          # run deploy` (IAP / two-container frontend) would stop on an
          # install prompt in a non-interactive shell and fail the deploy.
          install_components: 'beta'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Extract issue number from branch
        id: issue
        # branch 名走 env 不直接內插 —— 它是 PR 作者可控的字串，
        # 直接塞進 shell 等於讓外人往這支 workflow 注入指令
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="$HEAD_REF"
          # Extract issue number from branch name: feature/issue-{N}-* or fix/issue-{N}-*
          ISSUE_NUM=$(echo "$BRANCH" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || echo "")
          if [ -z "$ISSUE_NUM" ]; then
            # Fallback to PR number if branch doesn't follow convention
            ISSUE_NUM="$PR_NUMBER"
            echo "⚠️ Could not extract issue number from branch '$BRANCH', using PR number: $ISSUE_NUM"
          else
            echo "✅ Extracted issue number: $ISSUE_NUM from branch: $BRANCH"
          fi
          echo "num=${ISSUE_NUM}" >> "$GITHUB_OUTPUT"

      - name: Set service names
        env:
          ISSUE_NUM_IN: ${{ steps.issue.outputs.num }}
        run: |
          ISSUE_NUM="$ISSUE_NUM_IN"
          {
            echo "BACKEND_SERVICE=lingoleap-backend-issue-${ISSUE_NUM}"
            echo "FRONTEND_SERVICE=lingoleap-frontend-issue-${ISSUE_NUM}"
            echo "ISSUE_NUM=${ISSUE_NUM}"
          } >> "$GITHUB_ENV"

      # --- Backend ---
      - name: Build & push backend preview image
        if: needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened'
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}"

      # #3999 (Junyi security baseline rule 7): DATABASE_URL moved off the
      # bulk env-vars string (where it was a literal value from the
      # `secrets.PREVIEW_DATABASE_URL` GitHub Actions secret) onto a
      # dedicated secrets flag pointed at a Secret Manager secret
      # (`lingoleap-database-url-preview:latest`, project `lingoleap-dev`) --
      # the runtime service account used just above already has
      # `secretAccessor` on it. Same gcloud CLI reference as deploy.yml: the
      # bulk env-vars flag and the dedicated secrets flag are independent
      # "at most one of" groups, so combining them in one deploy invocation
      # is supported, and since DATABASE_URL now appears in only one of
      # them there is no same-key conflict.
      #
      # #3733 — IAP_ENABLED=true deploys the backend already locked
      # (--no-allow-unauthenticated) instead of "deploy public, lock a step
      # later": otherwise every redeploy re-adds allUsers for a few seconds.
      # SAME_ORIGIN_PROXY_ENABLED=true also tells the backend which frontend
      # identity may vouch for X-Client-IP (#3740, backend/app/config.py);
      # BACKEND_AUDIENCE must equal the sidecar's BACKEND_INVOKER_AUDIENCE
      # (the stable -958347263320 URL), both switches default off.
      # #3733 security review — ordering: the deploy below with
      # --no-allow-unauthenticated removes allUsers immediately, so the
      # frontend runtime SA and the CI SA must already hold run.invoker.
      # Grant first when the preview backend already exists (on the first
      # deploy of a preview there is nothing to bind to yet; the
      # post-deploy step below grants then, idempotently). Proxy off + IAP
      # on fails here, before anything is deployed or locked.
      - name: （IAP_ENABLED 時）deploy 前先授權 run.invoker（服務已存在時）
        if: env.IAP_ENABLED == 'true' && (needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened')
        run: |
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" != "true" ]; then
            echo "::error::IAP_ENABLED=true requires SAME_ORIGIN_PROXY_ENABLED=true (browser would call the locked backend directly). Nothing deployed, no IAM change made."
            exit 1
          fi
          if ! gcloud run services describe ${{ env.BACKEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "backend preview does not exist yet: nothing to grant before the first deploy"
            exit 0
          fi
          for MEMBER in \
            "serviceAccount:lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com" \
            "serviceAccount:github-actions@lingoleap-dev.iam.gserviceaccount.com"; do
            gcloud run services add-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member="$MEMBER" \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          done

      - name: Deploy backend preview
        if: needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened'
        run: |
          AUTH_FLAG=--allow-unauthenticated
          [ "${{ env.IAP_ENABLED }}" = "true" ] && AUTH_FLAG=--no-allow-unauthenticated
          PROXY_ENV=""
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            PROXY_ENV="::FRONTEND_PROXY_SA=lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com::BACKEND_AUDIENCE=https://${{ env.BACKEND_SERVICE }}-958347263320.asia-east1.run.app"
          fi
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account lingoleap-preview-run@lingoleap-dev.iam.gserviceaccount.com \
            --project ${{ env.PROJECT_ID }} \
            "$AUTH_FLAG" \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300s \
            --add-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-preview-db \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://placeholder.run.app::RUN_MIGRATIONS=true::ENVIRONMENT=preview::JWT_SECRET_KEY=${{ secrets.PREVIEW_JWT_SECRET_KEY }}::GCS_OMO_BUCKET=lingoleap-omo-uploads-preview::AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}::AZURE_SPEECH_REGION=eastus::TTS_PROVIDER=azure::BUILD_SHA=${{ github.event.pull_request.head.sha }}${PROXY_ENV}" \
            --update-secrets="DATABASE_URL=lingoleap-database-url-preview:latest"

      # #3719/#3733 — IAP 準備：預設關（IAP_ENABLED=false），這一步整個
      # skip，跟今天行為一致。backend **不上原生 IAP**，改用 Cloud Run 本身的
      # 「需要驗證」（run.invoker）：frontend 的 sidecar 只拿得到一般 ID
      # token，原生 IAP 會回 401 Invalid JWT audience。先授權再拿掉
      # allUsers；同源代理沒開時直接失敗、不動 IAM（瀏覽器會直接打 backend）。
      # 見 docs/iap-runbook.md「backend 認證方式」。
      - name: （IAP_ENABLED 時）backend preview 改成只給 frontend 與 CI 呼叫（run.invoker）
        if: env.IAP_ENABLED == 'true' && (needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened')
        run: |
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" != "true" ]; then
            echo "::error::IAP_ENABLED=true requires SAME_ORIGIN_PROXY_ENABLED=true (browser would call the locked backend directly). No IAM change made."
            exit 1
          fi
          for MEMBER in \
            "serviceAccount:lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com" \
            "serviceAccount:github-actions@lingoleap-dev.iam.gserviceaccount.com"; do
            gcloud run services add-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member="$MEMBER" \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          done
          POLICY=$(gcloud run services get-iam-policy ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format=json)
          if printf '%s' "$POLICY" | grep -q '"allUsers"'; then
            gcloud run services remove-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member=allUsers \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          fi

      - name: Get backend preview URL
        id: backend-url
        run: |
          # Try to get the PR-specific backend, fall back to staging (hardcoded stable URL), then production
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            URL="https://lingoleap-backend-staging-958347263320.asia-east1.run.app"
          fi
          if [ -z "$URL" ]; then
            URL="https://lingoleap-backend-958347263320.asia-east1.run.app"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          # #3733 — the invoker sidecar's token audience. Must equal the
          # backend's own BACKEND_AUDIENCE (set in the deploy step, stable
          # -958347263320 form) so #3740's X-Client-IP trust check matches;
          # `describe` above returns the hash-form URL, which Cloud Run also
          # accepts for invocation but isn't byte-equal to BACKEND_AUDIENCE.
          case "$URL" in
            *"/${{ env.BACKEND_SERVICE }}-"*) AUD="https://${{ env.BACKEND_SERVICE }}-958347263320.asia-east1.run.app" ;;
            *) AUD="$URL" ;;
          esac
          echo "audience=${AUD}" >> "$GITHUB_OUTPUT"
          echo "Preview frontend will use backend: ${URL}"

      # --- Frontend ---
      - name: Build & push frontend preview image
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened'
        env:
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PW: ${{ secrets.DEMO_ADMIN_PW }}
          DEMO_TEACHER_EMAIL: ${{ secrets.DEMO_TEACHER_EMAIL }}
          DEMO_TEACHER_PW: ${{ secrets.DEMO_TEACHER_PW }}
          DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: |
          # #3719/#3728/#3740 — SAME_ORIGIN_PROXY_ENABLED=false (default,
          # full why in staging-deploy.yml's copy of this switch): build
          # EXACTLY like today/post-#3741-revert — VITE_API_URL points
          # straight at the resolved backend URL, no BACKEND_INTERNAL_URL,
          # no BACKEND_INVOKER_SIDECAR_PORT, nginx never proxies anything.
          # =true: VITE_API_URL stays empty (relative /api/*, apiConfig.ts's
          # `??` doesn't treat empty string as undefined). BACKEND_INTERNAL_URL
          # tells this preview frontend's own nginx where to forward
          # same-origin /api, /assets, /q (see
          # frontend/docker/render-nginx-conf.sh) -- same URL as resolved
          # above, so a preview with no backend of its own falls back to
          # shared staging either way, matching today's behavior.
          # BACKEND_INVOKER_SIDECAR_PORT must travel with it or the build
          # fails outright (fail-closed guard, intentional).
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            PROXY_BUILD_ARGS=(--build-arg VITE_API_URL= --build-arg "BACKEND_INTERNAL_URL=${{ steps.backend-url.outputs.url }}" --build-arg BACKEND_INVOKER_SIDECAR_PORT=8081)
          else
            PROXY_BUILD_ARGS=(--build-arg "VITE_API_URL=${{ steps.backend-url.outputs.url }}")
          fi
          docker build \
            "${PROXY_BUILD_ARGS[@]}" \
            --build-arg VITE_SHOW_DEMO_LOGIN=true \
            --build-arg "VITE_DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL}" \
            --build-arg "VITE_DEMO_ADMIN_PW=${DEMO_ADMIN_PW}" \
            --build-arg "VITE_DEMO_TEACHER_EMAIL=${DEMO_TEACHER_EMAIL}" \
            --build-arg "VITE_DEMO_TEACHER_PW=${DEMO_TEACHER_PW}" \
            --build-arg "VITE_DEMO_STUDENT_EMAIL=${DEMO_STUDENT_EMAIL}" \
            --build-arg "VITE_DEMO_STUDENT_PW=${DEMO_STUDENT_PW}" \
            -t "${{ env.REGISTRY }}/frontend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}"

      # #3733 — the nginx same-origin proxy reaches the (invoker-locked)
      # backend through scripts/run_invoker_token.py --serve running as a
      # sidecar container. Only built when the proxy is on; stdlib-only
      # image, built on the runner's native amd64 (no QEMU, see runbook).
      - name: Build & push invoker sidecar image (SAME_ORIGIN_PROXY_ENABLED)
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened'
        run: |
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" != "true" ]; then
            echo "same-origin proxy off: no sidecar image needed"
            exit 0
          fi
          docker build \
            -f scripts/invoker-sidecar/Dockerfile \
            -t "${{ env.REGISTRY }}/invoker-sidecar:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            .
          docker push "${{ env.REGISTRY }}/invoker-sidecar:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}"

      # #3733 — proxy on: nginx (ingress, :8080) + invoker sidecar (:8081,
      # probe /healthz so the probe never touches token issuance) in one
      # revision; every service-level flag must come before the first
      # --container (gcloud requirement), and the sidecar's env goes in with
      # --update-env-vars (never the replace-all form). Verified command:
      # docs/iap-runbook.md. Proxy off: exactly today's single-image deploy.
      # Security review: with IAP_ENABLED the deploy itself carries --iap
      # (`gcloud beta run deploy` has --[no-]iap) so no revision ever serves
      # without IAP; enabling it only in a later step left an anonymous
      # window where nginx + sidecar reached the locked backend.
      #
      # #3733 security review — rollback: IAP_ENABLED back to 'false' with a
      # frontend-only change skips the backend deploy, so a once-locked
      # preview backend would stay locked while this non-proxy frontend
      # calls it from the browser. Reopen it first (allUsers run.invoker =
      # today's --allow-unauthenticated); already public -> no IAM write.
      # Only this preview's own backend: a preview without one falls back
      # to shared staging, which staging-deploy.yml owns.
      - name: （IAP 開關為 false 時）backend 若被鎖著就先補回 allUsers
        if: env.IAP_ENABLED != 'true' && (needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened')
        run: |
          if ! gcloud run services describe ${{ env.BACKEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "no backend preview service: nothing to reopen"
            exit 0
          fi
          POLICY=$(gcloud run services get-iam-policy ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format=json)
          if printf '%s' "$POLICY" | grep -q '"allUsers"'; then
            echo "backend preview already public: nothing to reopen"
          else
            gcloud run services add-iam-policy-binding ${{ env.BACKEND_SERVICE }} \
              --member=allUsers \
              --role=roles/run.invoker \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} >/dev/null
          fi

      - name: Deploy frontend preview
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened'
        run: |
          FRONTEND_IMAGE="${{ env.REGISTRY }}/frontend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}"
          IAP_FLAGS=()
          GCLOUD_RUN=(gcloud run)
          if [ "${{ env.IAP_ENABLED }}" = "true" ]; then
            IAP_FLAGS=(--iap)
            GCLOUD_RUN=(gcloud beta run)
          fi
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            # #3733 (2nd attempt): an EXISTING frontend service is one UNNAMED
            # container; --container=frontend can't address it and Cloud Run
            # rejects the result ("exactly one container with an exposed
            # port"). Rename it to `frontend` first with a same-image
            # `services replace` (no other change, so that revision serves
            # exactly what the last one did), then the deploy below updates
            # it in place and adds the sidecar + --iap in ONE revision.
            # Brand-new service or already named -> nothing to do (idempotent).
            SVC_JSON=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format=json 2>/dev/null || true)
            if [ -n "$SVC_JSON" ]; then
              RENAME_SPEC="$(mktemp)"
              RENAME_RC=0
              printf '%s' "$SVC_JSON" \
                | python3 scripts/cloudrun_name_legacy_container.py frontend > "$RENAME_SPEC" \
                || RENAME_RC=$?
              if [ "$RENAME_RC" = "0" ]; then
                gcloud run services replace "$RENAME_SPEC" \
                  --region ${{ env.REGION }} \
                  --project ${{ env.PROJECT_ID }}
              elif [ "$RENAME_RC" != "10" ]; then
                echo "::error::frontend service has an unexpected container layout; not deploying"
                exit 1
              fi
            fi
            gcloud beta run deploy ${{ env.FRONTEND_SERVICE }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --service-account lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com \
              --allow-unauthenticated \
              ${IAP_FLAGS[@]+"${IAP_FLAGS[@]}"} \
              --min-instances=0 \
              --max-instances=1 \
              --timeout=300s \
              --container=frontend \
                --image="$FRONTEND_IMAGE" \
                --port=8080 \
                --memory=512Mi \
                --cpu=1 \
                --depends-on=sidecar \
              --container=sidecar \
                --image="${{ env.REGISTRY }}/invoker-sidecar:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
                --memory=256Mi \
                --update-env-vars="BACKEND_INVOKER_AUDIENCE=${{ steps.backend-url.outputs.audience }}" \
                --startup-probe=httpGet.port=8081,httpGet.path=/healthz,periodSeconds=2,failureThreshold=3
          else
            "${GCLOUD_RUN[@]}" deploy ${{ env.FRONTEND_SERVICE }} \
              --image "$FRONTEND_IMAGE" \
              --platform managed \
              --region ${{ env.REGION }} \
              --service-account lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com \
              --project ${{ env.PROJECT_ID }} \
              --allow-unauthenticated \
              ${IAP_FLAGS[@]+"${IAP_FLAGS[@]}"} \
              --port 8080 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=1 \
              --timeout=300s
          fi

      # #3719 — IAP 準備：同上，預設關、改 env.IAP_ENABLED 才會跑。The
      # deploy above already carries --iap; this is an idempotent re-assert.
      - name: （IAP_ENABLED 時）替 frontend preview 開 IAP
        if: env.IAP_ENABLED == 'true' && (needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened')
        run: |
          gcloud beta run services update ${{ env.FRONTEND_SERVICE }} \
            --iap \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # #3733 — rollback half: plain `gcloud run deploy` never touches the
      # IAP setting, so flipping IAP_ENABLED back to 'false' alone would
      # leave a once-locked frontend locked forever. Turn it off only if it
      # is actually on (today's never-locked previews: no-op, no revision).
      - name: （IAP_ENABLED 關時）frontend preview 若還開著 IAP 就關掉
        if: env.IAP_ENABLED != 'true' && (needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened')
        run: |
          IAP_ON=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(metadata.annotations."run.googleapis.com/iap-enabled")' 2>/dev/null || true)
          if [ "$IAP_ON" = "true" ]; then
            gcloud beta run services update ${{ env.FRONTEND_SERVICE }} \
              --no-iap \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }}
          else
            echo "frontend has no IAP on: nothing to undo"
          fi

      # 部署失敗時 gcloud 只說「container failed to start and listen on PORT」——
      # 真正的原因在容器自己的 log 裡，而那要有 gcloud 憑證才讀得到。
      # 2026-09-25 為了查出 `ModuleNotFoundError: No module named 'psycopg'`
      # 花了三十分鐘加一次重新登入，而那行字一直就在 Cloud Run 的 log 裡。
      # 把它印進 CI 輸出，下次看 workflow 就知道。
      - name: 部署失敗時把容器 log 倒出來
        if: failure()
        continue-on-error: true
        run: |
          echo "## ⛔ preview 後端起不來 —— 容器 log" >> "$GITHUB_STEP_SUMMARY"
          LOGS=$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.BACKEND_SERVICE }}\"" \
            --project "${{ env.PROJECT_ID }}" --freshness=15m --limit=30 \
            --format='value(severity,textPayload)' 2>&1 || echo "（讀不到 log）")
          echo "$LOGS"
          {
            echo '```'
            echo "$LOGS" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get preview URLs
        id: preview-urls
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          # ⚠️ 空字串要正規化成 N/A，否則下游守衛白寫。
          # `$(gcloud ... || echo "N/A")` 只在 gcloud **非零退出**時才回 N/A；
          # 服務存在但 status.url 還沒填時 gcloud 是 exit 0 + 印空字串，
          # 於是 `!= 'N/A'` 為真、E2E 照跑，拿到空 URL 後 JS 的 || 會靜默
          # 回退去打 staging —— 那是「preview 綠了但驗的是別的環境」。
          # 2026-09-25 PR #3316 真的撞到：backend 部署成功、URL 卻是空的。
          [ -z "$FRONTEND_URL" ] && FRONTEND_URL="N/A"
          [ -z "$BACKEND_URL" ] && BACKEND_URL="N/A"
          echo "frontend_url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "preview URLs → frontend=${FRONTEND_URL} backend=${BACKEND_URL}"

      # #3999 (Junyi security baseline rule 7): the refresh used to re-pass
      # `secrets.PREVIEW_DATABASE_URL` (a GitHub Actions secret, literal
      # value) via --update-env-vars on every run, so a rotated GH secret
      # would propagate to this long-lived preview service without a
      # manual rebuild. That job is now done by --update-secrets instead,
      # pointed at Secret Manager's `:latest` -- every run re-resolves
      # "latest" and creates a new revision if the resolved secret version
      # changed, which is the same "refresh on every run" behavior, just
      # sourced from Secret Manager instead of a GitHub Actions secret.
      - name: Update backend CORS + refresh DATABASE_URL from Secret Manager
        # Skip when backend preview service doesn't exist (frontend-only PR after
        # prior backend cleanup) — otherwise `gcloud run services update` fails.
        # ALLOWED_ORIGINS is re-injected on every run because the preview
        # frontend's URL/issue number can change between runs; DATABASE_URL is
        # re-pointed at :latest on every run for the reason above (Fixes #1396).
        if: always() && steps.preview-urls.outputs.frontend_url != 'N/A' && steps.preview-urls.outputs.frontend_url != '' && steps.preview-urls.outputs.backend_url != 'N/A' && steps.preview-urls.outputs.backend_url != ''
        env:
          FRONTEND_URL: ${{ steps.preview-urls.outputs.frontend_url }}
        run: |
          STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
          FIREBASE_URL="https://lingoleap-dev.web.app"
          # Cloud Run has two URL formats per service - add both to CORS
          ALT_URL="https://${{ env.FRONTEND_SERVICE }}-958347263320.asia-east1.run.app"
          # ⚠️ service 還在、但它指向的映像已被刪掉，是很常見的一種狀態：
          #    PR 關閉時 Layer 4 會刪 `issue-N-*` 映像，service 本身留著。
          #    之後任何 env 更新都會強制建新 revision，於是 `Image ... not found`。
          #    這種情況這一步什麼也做不了 —— 記一行然後放行，讓下游的
          #    preflight 去把環境標成 INVALID（而不是把整個 PR 判成 FAIL）。
          #    ⛔ 只對這一種錯誤放行；其他錯誤照舊讓它炸。
          #    2026-08-29 PR #2554（只改前端）就是被這個擋住的。
          set +e
          OUT=$(gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --update-env-vars "^::^ALLOWED_ORIGINS=${FRONTEND_URL},${ALT_URL},${STAGING_URL},${FIREBASE_URL}" \
            --update-secrets="DATABASE_URL=lingoleap-database-url-preview:latest" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            if printf '%s' "$OUT" | grep -q "Image '.*' not found"; then
              echo "::warning::preview 後端 service 指向的映像已被清掉（PR 關閉時的映像清理），"\
                   "這一步無事可做。下游的 preflight 會把環境標成 INVALID。"
              exit 0
            fi
            exit "$RC"
          fi

      # #3733 — frontend health with IAP on: IAP only accepts a service-
      # account SELF-SIGNED JWT whose aud is this frontend's URL (#3730),
      # signed through IAM Credentials (no key file in CI): the github-
      # actions SA needs roles/iam.serviceAccountTokenCreator on itself and
      # roles/iap.httpsResourceAccessor on this service. Failing to sign
      # while IAP is on is a hard error, not a silent anonymous retry.
      - name: Verify frontend preview health
        if: always() && steps.preview-urls.outputs.frontend_url != 'N/A' && steps.preview-urls.outputs.frontend_url != ''
        env:
          FRONTEND_URL: ${{ steps.preview-urls.outputs.frontend_url }}
          IAP_AUDIENCE: ${{ env.IAP_ENABLED == 'true' && steps.preview-urls.outputs.frontend_url || '' }}
          IAP_SIGNING_SA_EMAIL: github-actions@lingoleap-dev.iam.gserviceaccount.com
        run: |
          source scripts/lib/iap-token.sh
          IAP_AUTH_ARGS=()
          IAP_TOKEN="$(iap_token "${IAP_AUDIENCE:-}")"
          if [ -n "${IAP_AUDIENCE:-}" ] && [ -z "${IAP_TOKEN}" ]; then
            echo "::error::IAP is on but no IAP JWT could be signed (needs serviceAccountTokenCreator on the CI SA itself)"
            exit 1
          fi
          if [ -n "${IAP_TOKEN}" ]; then
            echo "::add-mask::${IAP_TOKEN}"
            IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$FRONTEND_URL/")
            echo "Attempt $i: frontend preview health = $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::frontend preview health check failed"
          exit 1

      # #3733 security review — negative check: the health checks prove
      # CI's own credentials work; this proves an anonymous caller does NOT
      # get in. No credentials: backend /api/health must be 403 (Cloud Run
      # invoker check) and the frontend root must be 302 (IAP -> Google
      # login) / 401 / 403, never 200. Anything else fails the job.
      - name: （IAP_ENABLED 時）未帶憑證必須被擋（backend 403、frontend 非 200）
        if: env.IAP_ENABLED == 'true' && steps.preview-urls.outputs.frontend_url != 'N/A' && steps.preview-urls.outputs.frontend_url != '' && steps.preview-urls.outputs.backend_url != 'N/A' && steps.preview-urls.outputs.backend_url != ''
        env:
          BACKEND_URL: ${{ steps.preview-urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.preview-urls.outputs.frontend_url }}
        run: |
          BE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BACKEND_URL}/api/health")
          FE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${FRONTEND_URL}/")
          echo "anonymous: backend /api/health -> $BE, frontend / -> $FE"
          FAIL=0
          if [ "$BE" != "403" ]; then
            echo "::error::anonymous backend /api/health returned $BE, expected 403 (backend not locked)"
            FAIL=1
          fi
          case "$FE" in
            302|401|403) ;;
            *) echo "::error::anonymous frontend / returned $FE, expected 302/401/403 (frontend not behind IAP)"; FAIL=1 ;;
          esac
          exit "$FAIL"

      # #3733 — backend locked with Cloud Run invoker auth (not IAP) when
      # IAP_ENABLED: CI's own calls to it need a plain Google ID token for
      # the github-actions SA (roles/run.invoker granted above), carried in
      # X-Serverless-Authorization. The WIF principal already holds
      # roles/iam.workloadIdentityUser (includes getOpenIdToken), so no new
      # IAM is needed for this. Doesn't overwrite the job's credentials.
      - name: （IAP_ENABLED 時）取 backend invoker ID token
        id: invoker
        if: env.IAP_ENABLED == 'true' && steps.preview-urls.outputs.backend_url != 'N/A' && steps.preview-urls.outputs.backend_url != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.preview-urls.outputs.backend_url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Warm backend to avoid cold-start CORS errors
        if: always() && steps.preview-urls.outputs.backend_url != 'N/A' && steps.preview-urls.outputs.backend_url != ''
        env:
          BACKEND_URL: ${{ steps.preview-urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.preview-urls.outputs.frontend_url }}
          # #3733 — empty unless IAP_ENABLED (step above skipped) -> no
          # header, exactly today's behavior. Backend is never behind IAP,
          # so no IAP JWT (Proxy-Authorization) is sent here.
          INVOKER_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          IAP_AUTH_ARGS=()
          [ -n "${INVOKER_TOKEN:-}" ] && IAP_AUTH_ARGS=(-H "X-Serverless-Authorization: Bearer ${INVOKER_TOKEN}")
          # CORS env update creates a new Cloud Run revision which is cold.
          # Browsers hitting a cold revision see 5xx without CORS headers,
          # surfacing as spurious "blocked by CORS policy" console errors.
          #
          # Two warmups:
          # 1. Root GET — warms one instance through Cloud Run routing.
          # 2. OPTIONS preflight with Origin — mimics what the browser will do
          #    for the first fetch(), ensuring the API route + CORS middleware
          #    are both JIT-loaded before the real user request arrives.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$BACKEND_URL/" || echo timeout)
            echo "Warmup root attempt $i: HTTP $code"
            case "$code" in timeout|000) sleep 2 ;; *) break ;; esac
          done
          for path in /api/assignments/my /api/gamification/streak /api/stories; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              -X OPTIONS \
              -H "Origin: $FRONTEND_URL" \
              -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: authorization,content-type" \
              "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" \
              "${BACKEND_URL}${path}" || echo timeout)
            echo "Preflight $path: HTTP $code"
          done

      # ── PR 階段的「學生走得完」門（#2964 L3）────────────────────────────
      #
      # 在這之前，PR 階段**沒有任何一道門問「學生走得完嗎」**：
      # 十道 content gate 有九道在問「抽對了沒」，而 e2e 只打 staging。
      # Hans 回報的那幾類 bug（按完成標記跳到最後一步、三篇共用進度）
      # 只有真的一步一步走完才會遇到。
      #
      # ⚠️ e2e-tests.yml 裡寫著「per-PR preview 的 DB 是空的、demo 帳號不存在」——
      #    那句已經過時。preview 後端吃的是共用的 preview DB（#3999 起 DATABASE_URL
      #    從 Secret Manager 的 lingoleap-database-url-preview 取值，不再是
      #    GitHub Actions secret），而 preview 前端 build 時帶了
      #    VITE_SHOW_DEMO_LOGIN=true 與三個帳號。
      #    2026-08-28 在 PR #2965 的 preview 上實測：一鍵登入 → /library，pageerror 0。
      #
      # PR 只跑一課（五課走完整條路太慢，慢到會讓人想關掉這道門），
      # staging 維持五課全跑 —— 兩個環境跑不同的量，不是抽樣代替全檢。
      - name: Comment PR with preview URLs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const frontendUrl = '${{ steps.preview-urls.outputs.frontend_url }}';
            const backendUrl = '${{ steps.preview-urls.outputs.backend_url }}';

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment')
            );

            const body = `## Preview Deployment

            | Service | URL |
            |---------|-----|
            | Frontend | ${frontendUrl} |
            | Backend API | ${backendUrl} |
            | Commit | \`${context.sha.substring(0, 7)}\` |
            | Updated | ${new Date().toISOString()} |

            > PR preview environments are automatically deleted when the PR is closed.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

  e2e-preview-check:
    name: 學生走得完嗎（multi-text journey on preview）
    needs: deploy-preview
    runs-on: ubuntu-24.04  # Playwright 不支援 ubuntu-latest 現在指向的 26.04
    # 2026-11-17 — this job used to also require
    # `needs.deploy-preview.outputs.iap_enabled != 'true'`. IAP has been on
    # for every preview since #3733 (2026-11-16), so it was SKIPPED on every
    # PR: the only PR-time "can a student walk the lesson" gate was gone.
    # It now goes through IAP the same way e2e-tests.yml does (#4097).
    if: >-
      always() &&
      needs.deploy-preview.outputs.frontend_url != 'N/A' &&
      needs.deploy-preview.outputs.frontend_url != '' &&
      needs.deploy-preview.outputs.backend_url != 'N/A' &&
      needs.deploy-preview.outputs.backend_url != ''
    # Credentials (find_015p35fzCRJqG7UACGpxSxQp / #4097): this job holds a
    # WIF credential + id-token: write ONLY to sign the IAP JWT on the host.
    # No third-party code runs on this host: npm ci + Playwright run inside
    # the digest-pinned official Playwright image, which receives only the
    # variables listed with -e (never ACTIONS_ID_TOKEN_*, never the
    # workspace root where auth@v2 writes gha-creds-*.json). Locked by
    # backend/tests/test_preview_journey_iap.py and
    # backend/specs/test_workflow_gcp_cred_exposure_spec.py.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Every red this check showed before IAP was a Dependabot PR (15/15,
      # 2026-11-12..14; human PRs 0 failures). Dependabot runs get no Actions
      # secrets ("Secret source: Dependabot", Dependabot secret store empty),
      # so deploy-preview builds the frontend with empty VITE_DEMO_STUDENT_*
      # and the one-click login never leaves /login (run 43243744665,
      # multiTextJourney.spec.ts:129). A preview nobody can log into is an
      # INVALID environment, not "this PR broke the student journey".
      # Only emptiness is checked; values are never printed.
      - name: 環境合格檢查（preview 有沒有一鍵登入帳號）
        id: env-check
        env:
          DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: |
          if [ -n "${DEMO_STUDENT_EMAIL:-}" ] && [ -n "${DEMO_STUDENT_PW:-}" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="INVALID（不是 FAIL）：這個 run 拿不到 Actions secrets（Dependabot 或 fork PR），preview 前端沒有一鍵登入帳號，學生登不進去，這道門無從判斷。不代表這個 PR 弄壞了學習流程。"
          echo "::warning::${MSG}"
          echo "${MSG}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "valid=false" >> "$GITHUB_OUTPUT"

      - id: auth
        if: steps.env-check.outputs.valid == 'true' && needs.deploy-preview.outputs.iap_enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - if: steps.env-check.outputs.valid == 'true' && needs.deploy-preview.outputs.iap_enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Security review (MEDIUM): install runs in its OWN container that never
      # receives IAP_PROXY_TOKEN, with --ignore-scripts, so no dependency
      # install script can read the token. Only the `playwright test` container
      # below gets it (browsers are baked into the image; nothing to install).
      - name: Install E2E deps (no IAP token, no install scripts)
        if: steps.env-check.outputs.valid == 'true'
        run: |
          docker run --rm --init \
            -v "${GITHUB_WORKSPACE}/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe \
            npm ci --ignore-scripts

      # IAP matches a self-signed JWT's aud against the REQUEST URL: the bare
      # service URL only authorises "/" (run 43935544444), so sign
      # "<frontend>/*". API calls go through the frontend's same-origin /api
      # proxy (E2E_BACKEND_URL = frontend URL): the backend is
      # run.invoker-locked and the container carries only the IAP JWT. Image
      # = the same pinned Playwright image as e2e-tests.yml (version ==
      # frontend/package-lock.json).
      - name: 學生走得完嗎（multi-text journey on preview）
        if: steps.env-check.outputs.valid == 'true'
        env:
          IAP_ENABLED: ${{ needs.deploy-preview.outputs.iap_enabled }}
          IAP_SIGNING_SA_EMAIL: github-actions@lingoleap-dev.iam.gserviceaccount.com
          PREVIEW_FRONTEND_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          PREVIEW_BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          E2E_ONLY_LESSONS: "20063"      # G6-L22，三篇，Hans 回報的那一課
          E2E_EXPECT_DEPLOYED: "1"
          CI: 'true'
        run: |
          PLAYWRIGHT_BASE_URL="${PREVIEW_FRONTEND_URL}"
          E2E_BACKEND_URL="${PREVIEW_BACKEND_URL}"
          IAP_PROXY_TOKEN=""
          if [ "${IAP_ENABLED}" = "true" ]; then
            source "${GITHUB_WORKSPACE}/scripts/lib/iap-token.sh"
            IAP_PROXY_TOKEN="$(iap_token "${PREVIEW_FRONTEND_URL}/*")"
            if [ -z "${IAP_PROXY_TOKEN}" ]; then
              echo "::error::preview is behind IAP but no IAP JWT could be signed (needs serviceAccountTokenCreator on the CI SA itself)"
              exit 1
            fi
            echo "::add-mask::${IAP_PROXY_TOKEN}"
            E2E_BACKEND_URL="${PREVIEW_FRONTEND_URL}"
            # Prove the token opens a sub-path before spending minutes in Playwright.
            DEEP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "Proxy-Authorization: Bearer ${IAP_PROXY_TOKEN}" "${PREVIEW_FRONTEND_URL}/login" || echo "000")
            if [ "$DEEP" != "200" ]; then
              echo "::error::IAP token did not open ${PREVIEW_FRONTEND_URL}/login (HTTP $DEEP)"
              exit 1
            fi
          fi
          export IAP_PROXY_TOKEN PLAYWRIGHT_BASE_URL E2E_BACKEND_URL
          docker run --rm --init --ipc=host \
            -v "${GITHUB_WORKSPACE}/frontend:/work" -w /work \
            -e IAP_PROXY_TOKEN \
            -e PLAYWRIGHT_BASE_URL \
            -e E2E_BACKEND_URL \
            -e E2E_ONLY_LESSONS \
            -e E2E_EXPECT_DEPLOYED \
            -e CI \
            mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe \
            npx playwright test tests/e2e/multiTextJourney.spec.ts --reporter=github --timeout=300000
