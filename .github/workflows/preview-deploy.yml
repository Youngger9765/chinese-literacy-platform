name: PR Preview Deploy

# Claude Security CodeQL critical alert, 2026-11-05: `cleanup-preview`
# (the only job here that ran on `pull_request_target: closed`) moved to
# its own file, preview-cleanup-on-close.yml -- see that file's header
# comment for why. This file now ONLY has the `pull_request` trigger, so
# it never gets secrets for a fork PR and CodeQL's "checkout of untrusted
# code in a privileged context" pattern (a pull_request_target trigger
# co-located with a PR-head-sha checkout, which deploy-preview and
# e2e-preview-check both do, for understandable reasons -- they need the
# PR's own code to build and test) no longer applies to this file at all.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# find_015p35fzCRJqG7UACGpxSxQp (HIGH): `pull-requests: write` and
# `id-token: write` used to sit here, so `e2e-preview-check` and
# `detect-changes` inherited both even though neither needs either --
# `e2e-preview-check` runs `npm ci` + `playwright install` + a lockfile-
# resolved dependency's install script could mint an OIDC token for the
# prod deploy service account directly, with no `auth@v2` step required in
# that job at all. Both scopes now live ONLY as per-job overrides on
# `deploy-preview`, the one job that actually authenticates to GCP and
# posts the preview-URL PR comment. GitHub Actions does not merge a
# job-level permissions block with this one; it replaces it for that job,
# and a job with no block of its own still inherits this one unchanged --
# so `detect-changes` / `e2e-preview-check` get `contents: read` and
# nothing else, with no edit needed to them for that alone (they still get
# an explicit block below, naming the restriction instead of leaving it
# implicit).
permissions:
  contents: read

env:
  PROJECT_ID: lingoleap-dev
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/lingoleap-dev/lingoleap
  # #3719 — IAP 準備：預設 false，等於今天的行為（兩個 preview 服務都還是
  # --allow-unauthenticated）。要真的在 preview 上測 IAP 時，改這一行
  # 成 'true' 開一個 PR 就會套用，不必再去改 gcloud 指令本身——
  # 真正的 on/off 開關只有這一行。驗證方法與限制見
  # docs/iap-runbook.md。目前仍然是 false，staging 與日常 preview
  # 完全不受影響。
  IAP_ENABLED: 'false'
  # #3728/#3740 — 同源代理 build-time 開關，預設 false：關掉時這個 job
  # 建出來的 preview image 跟 #3741 revert 之後完全一樣（VITE_API_URL
  # 指到 backend 絕對網址，無 BACKEND_INTERNAL_URL、無
  # BACKEND_INVOKER_SIDECAR_PORT）。同一個理由、同一段完整說明見
  # staging-deploy.yml 這個開關旁的註解——這裡不重複貼一次，兩邊要改
  # 一起改。
  SAME_ORIGIN_PROXY_ENABLED: 'false'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-preview:
    name: Deploy PR Preview
    needs: detect-changes
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.head.ref != 'staging'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      frontend_url: ${{ steps.preview-urls.outputs.frontend_url }}
      backend_url: ${{ steps.preview-urls.outputs.backend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # Claude Security find_01WStrhArZsNRHeb92RWHZRE (high, CWE-250):
          # this job authenticates as github-actions@lingoleap-dev -- the
          # SAME identity deploy.yml uses for PRODUCTION. A least-privilege
          # lingoleap-preview-deploy@ SA was tried here and reverted: a
          # project-level conditional run.admin binding scoped by
          # resource.name does not reliably gate Cloud Run's admin-plane
          # calls (confirmed failing identically across two condition
          # formats and after IAM propagation), and the only workable
          # per-resource-binding alternative needs run.services.setIamPolicy,
          # which cannot be scoped to a not-yet-created service -- granting
          # it project-wide would let this SA grant itself run.admin on
          # prod, which is worse than the status quo. A proposal using
          # resource tags + an IAM deny policy against prod's two services
          # is under review separately; until it lands, this job keeps the
          # broader identity and the mitigations below (same-repo-only
          # cleanup, hardened agent workflows) are the active defenses.
          workload_identity_provider: projects/958347263320/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lingoleap-dev.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Extract issue number from branch
        id: issue
        # branch 名走 env 不直接內插 —— 它是 PR 作者可控的字串，
        # 直接塞進 shell 等於讓外人往這支 workflow 注入指令
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="$HEAD_REF"
          # Extract issue number from branch name: feature/issue-{N}-* or fix/issue-{N}-*
          ISSUE_NUM=$(echo "$BRANCH" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || echo "")
          if [ -z "$ISSUE_NUM" ]; then
            # Fallback to PR number if branch doesn't follow convention
            ISSUE_NUM="$PR_NUMBER"
            echo "⚠️ Could not extract issue number from branch '$BRANCH', using PR number: $ISSUE_NUM"
          else
            echo "✅ Extracted issue number: $ISSUE_NUM from branch: $BRANCH"
          fi
          echo "num=${ISSUE_NUM}" >> "$GITHUB_OUTPUT"

      - name: Set service names
        env:
          ISSUE_NUM_IN: ${{ steps.issue.outputs.num }}
        run: |
          ISSUE_NUM="$ISSUE_NUM_IN"
          {
            echo "BACKEND_SERVICE=lingoleap-backend-issue-${ISSUE_NUM}"
            echo "FRONTEND_SERVICE=lingoleap-frontend-issue-${ISSUE_NUM}"
            echo "ISSUE_NUM=${ISSUE_NUM}"
          } >> "$GITHUB_ENV"

      # --- Backend ---
      - name: Build & push backend preview image
        if: needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened'
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/backend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            ./backend
          docker push "${{ env.REGISTRY }}/backend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}"

      # #3999 (Junyi security baseline rule 7): DATABASE_URL moved off the
      # bulk env-vars string (where it was a literal value from the
      # `secrets.PREVIEW_DATABASE_URL` GitHub Actions secret) onto a
      # dedicated secrets flag pointed at a Secret Manager secret
      # (`lingoleap-database-url-preview:latest`, project `lingoleap-dev`) --
      # the runtime service account used just above already has
      # `secretAccessor` on it. Same gcloud CLI reference as deploy.yml: the
      # bulk env-vars flag and the dedicated secrets flag are independent
      # "at most one of" groups, so combining them in one deploy invocation
      # is supported, and since DATABASE_URL now appears in only one of
      # them there is no same-key conflict.
      - name: Deploy backend preview
        if: needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened'
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/backend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account lingoleap-preview-run@lingoleap-dev.iam.gserviceaccount.com \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300s \
            --add-cloudsql-instances=lingoleap-dev:asia-east1:lingoleap-preview-db \
            --set-env-vars="^::^ALLOWED_ORIGINS=https://placeholder.run.app::RUN_MIGRATIONS=true::ENVIRONMENT=preview::JWT_SECRET_KEY=${{ secrets.PREVIEW_JWT_SECRET_KEY }}::GCS_OMO_BUCKET=lingoleap-omo-uploads-preview::AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}::AZURE_SPEECH_REGION=eastus::TTS_PROVIDER=azure::BUILD_SHA=${{ github.event.pull_request.head.sha }}" \
            --update-secrets="DATABASE_URL=lingoleap-database-url-preview:latest"

      # #3719 — IAP 準備：預設關（IAP_ENABLED=false），這一步整個 skip，
      # 跟今天行為一致。只有刻意把上面 env.IAP_ENABLED 改成 'true' 開 PR
      # 才會執行。用 `gcloud beta run services update --iap`——Cloud Run
      # 原生 IAP 整合，不是 HTTPS LB 那一套，不需要額外的 LB/NEG 資源。
      - name: （IAP_ENABLED 時）替 backend preview 開 IAP
        if: env.IAP_ENABLED == 'true' && (needs.detect-changes.outputs.backend == 'true' || github.event.action == 'opened')
        run: |
          gcloud beta run services update ${{ env.BACKEND_SERVICE }} \
            --iap \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Get backend preview URL
        id: backend-url
        run: |
          # Try to get the PR-specific backend, fall back to staging (hardcoded stable URL), then production
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            URL="https://lingoleap-backend-staging-958347263320.asia-east1.run.app"
          fi
          if [ -z "$URL" ]; then
            URL="https://lingoleap-backend-958347263320.asia-east1.run.app"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Preview frontend will use backend: ${URL}"

      # --- Frontend ---
      - name: Build & push frontend preview image
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened'
        env:
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PW: ${{ secrets.DEMO_ADMIN_PW }}
          DEMO_TEACHER_EMAIL: ${{ secrets.DEMO_TEACHER_EMAIL }}
          DEMO_TEACHER_PW: ${{ secrets.DEMO_TEACHER_PW }}
          DEMO_STUDENT_EMAIL: ${{ secrets.DEMO_STUDENT_EMAIL }}
          DEMO_STUDENT_PW: ${{ secrets.DEMO_STUDENT_PW }}
        run: |
          # #3719/#3728/#3740 — SAME_ORIGIN_PROXY_ENABLED=false (default,
          # full why in staging-deploy.yml's copy of this switch): build
          # EXACTLY like today/post-#3741-revert — VITE_API_URL points
          # straight at the resolved backend URL, no BACKEND_INTERNAL_URL,
          # no BACKEND_INVOKER_SIDECAR_PORT, nginx never proxies anything.
          # =true: VITE_API_URL stays empty (relative /api/*, apiConfig.ts's
          # `??` doesn't treat empty string as undefined). BACKEND_INTERNAL_URL
          # tells this preview frontend's own nginx where to forward
          # same-origin /api, /assets, /q (see
          # frontend/docker/render-nginx-conf.sh) -- same URL as resolved
          # above, so a preview with no backend of its own falls back to
          # shared staging either way, matching today's behavior.
          # BACKEND_INVOKER_SIDECAR_PORT must travel with it or the build
          # fails outright (fail-closed guard, intentional).
          if [ "${{ env.SAME_ORIGIN_PROXY_ENABLED }}" = "true" ]; then
            PROXY_BUILD_ARGS=(--build-arg VITE_API_URL= --build-arg "BACKEND_INTERNAL_URL=${{ steps.backend-url.outputs.url }}" --build-arg BACKEND_INVOKER_SIDECAR_PORT=8081)
          else
            PROXY_BUILD_ARGS=(--build-arg "VITE_API_URL=${{ steps.backend-url.outputs.url }}")
          fi
          docker build \
            "${PROXY_BUILD_ARGS[@]}" \
            --build-arg VITE_SHOW_DEMO_LOGIN=true \
            --build-arg "VITE_DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL}" \
            --build-arg "VITE_DEMO_ADMIN_PW=${DEMO_ADMIN_PW}" \
            --build-arg "VITE_DEMO_TEACHER_EMAIL=${DEMO_TEACHER_EMAIL}" \
            --build-arg "VITE_DEMO_TEACHER_PW=${DEMO_TEACHER_PW}" \
            --build-arg "VITE_DEMO_STUDENT_EMAIL=${DEMO_STUDENT_EMAIL}" \
            --build-arg "VITE_DEMO_STUDENT_PW=${DEMO_STUDENT_PW}" \
            -t "${{ env.REGISTRY }}/frontend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            ./frontend
          docker push "${{ env.REGISTRY }}/frontend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}"

      - name: Deploy frontend preview
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened'
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image "${{ env.REGISTRY }}/frontend:issue-${{ env.ISSUE_NUM }}-${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account lingoleap-frontend-run@lingoleap-dev.iam.gserviceaccount.com \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300s

      # #3719 — IAP 準備：同上，預設關、改 env.IAP_ENABLED 才會跑。
      - name: （IAP_ENABLED 時）替 frontend preview 開 IAP
        if: env.IAP_ENABLED == 'true' && (needs.detect-changes.outputs.frontend == 'true' || github.event.action == 'opened')
        run: |
          gcloud beta run services update ${{ env.FRONTEND_SERVICE }} \
            --iap \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # 部署失敗時 gcloud 只說「container failed to start and listen on PORT」——
      # 真正的原因在容器自己的 log 裡，而那要有 gcloud 憑證才讀得到。
      # 2026-09-25 為了查出 `ModuleNotFoundError: No module named 'psycopg'`
      # 花了三十分鐘加一次重新登入，而那行字一直就在 Cloud Run 的 log 裡。
      # 把它印進 CI 輸出，下次看 workflow 就知道。
      - name: 部署失敗時把容器 log 倒出來
        if: failure()
        continue-on-error: true
        run: |
          echo "## ⛔ preview 後端起不來 —— 容器 log" >> "$GITHUB_STEP_SUMMARY"
          LOGS=$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.BACKEND_SERVICE }}\"" \
            --project "${{ env.PROJECT_ID }}" --freshness=15m --limit=30 \
            --format='value(severity,textPayload)' 2>&1 || echo "（讀不到 log）")
          echo "$LOGS"
          {
            echo '```'
            echo "$LOGS" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get preview URLs
        id: preview-urls
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          # ⚠️ 空字串要正規化成 N/A，否則下游守衛白寫。
          # `$(gcloud ... || echo "N/A")` 只在 gcloud **非零退出**時才回 N/A；
          # 服務存在但 status.url 還沒填時 gcloud 是 exit 0 + 印空字串，
          # 於是 `!= 'N/A'` 為真、E2E 照跑，拿到空 URL 後 JS 的 || 會靜默
          # 回退去打 staging —— 那是「preview 綠了但驗的是別的環境」。
          # 2026-09-25 PR #3316 真的撞到：backend 部署成功、URL 卻是空的。
          [ -z "$FRONTEND_URL" ] && FRONTEND_URL="N/A"
          [ -z "$BACKEND_URL" ] && BACKEND_URL="N/A"
          echo "frontend_url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "preview URLs → frontend=${FRONTEND_URL} backend=${BACKEND_URL}"

      # #3999 (Junyi security baseline rule 7): the refresh used to re-pass
      # `secrets.PREVIEW_DATABASE_URL` (a GitHub Actions secret, literal
      # value) via --update-env-vars on every run, so a rotated GH secret
      # would propagate to this long-lived preview service without a
      # manual rebuild. That job is now done by --update-secrets instead,
      # pointed at Secret Manager's `:latest` -- every run re-resolves
      # "latest" and creates a new revision if the resolved secret version
      # changed, which is the same "refresh on every run" behavior, just
      # sourced from Secret Manager instead of a GitHub Actions secret.
      - name: Update backend CORS + refresh DATABASE_URL from Secret Manager
        # Skip when backend preview service doesn't exist (frontend-only PR after
        # prior backend cleanup) — otherwise `gcloud run services update` fails.
        # ALLOWED_ORIGINS is re-injected on every run because the preview
        # frontend's URL/issue number can change between runs; DATABASE_URL is
        # re-pointed at :latest on every run for the reason above (Fixes #1396).
        if: always() && steps.preview-urls.outputs.frontend_url != 'N/A' && steps.preview-urls.outputs.frontend_url != '' && steps.preview-urls.outputs.backend_url != 'N/A' && steps.preview-urls.outputs.backend_url != ''
        env:
          FRONTEND_URL: ${{ steps.preview-urls.outputs.frontend_url }}
        run: |
          STAGING_URL="https://lingoleap-frontend-staging-958347263320.asia-east1.run.app"
          FIREBASE_URL="https://lingoleap-dev.web.app"
          # Cloud Run has two URL formats per service - add both to CORS
          ALT_URL="https://${{ env.FRONTEND_SERVICE }}-958347263320.asia-east1.run.app"
          # ⚠️ service 還在、但它指向的映像已被刪掉，是很常見的一種狀態：
          #    PR 關閉時 Layer 4 會刪 `issue-N-*` 映像，service 本身留著。
          #    之後任何 env 更新都會強制建新 revision，於是 `Image ... not found`。
          #    這種情況這一步什麼也做不了 —— 記一行然後放行，讓下游的
          #    preflight 去把環境標成 INVALID（而不是把整個 PR 判成 FAIL）。
          #    ⛔ 只對這一種錯誤放行；其他錯誤照舊讓它炸。
          #    2026-08-29 PR #2554（只改前端）就是被這個擋住的。
          set +e
          OUT=$(gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --update-env-vars "^::^ALLOWED_ORIGINS=${FRONTEND_URL},${ALT_URL},${STAGING_URL},${FIREBASE_URL}" \
            --update-secrets="DATABASE_URL=lingoleap-database-url-preview:latest" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            if printf '%s' "$OUT" | grep -q "Image '.*' not found"; then
              echo "::warning::preview 後端 service 指向的映像已被清掉（PR 關閉時的映像清理），"\
                   "這一步無事可做。下游的 preflight 會把環境標成 INVALID。"
              exit 0
            fi
            exit "$RC"
          fi

      - name: Warm backend to avoid cold-start CORS errors
        if: always() && steps.preview-urls.outputs.backend_url != 'N/A' && steps.preview-urls.outputs.backend_url != ''
        env:
          BACKEND_URL: ${{ steps.preview-urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.preview-urls.outputs.frontend_url }}
          # #3719 — IAP 準備：preview 未來可能在前面加一層 IAP。沒有任何
          # secret 可讀時（還沒打開 IAP）下面是空陣列，跟今天完全一樣。
          IAP_AUDIENCE: ${{ secrets.IAP_AUDIENCE }}
        run: |
          source scripts/lib/iap-token.sh
          IAP_AUTH_ARGS=()
          IAP_TOKEN="$(iap_token "${IAP_AUDIENCE:-}")"
          [ -n "${IAP_TOKEN}" ] && IAP_AUTH_ARGS=(-H "Proxy-Authorization: Bearer ${IAP_TOKEN}")
          # CORS env update creates a new Cloud Run revision which is cold.
          # Browsers hitting a cold revision see 5xx without CORS headers,
          # surfacing as spurious "blocked by CORS policy" console errors.
          #
          # Two warmups:
          # 1. Root GET — warms one instance through Cloud Run routing.
          # 2. OPTIONS preflight with Origin — mimics what the browser will do
          #    for the first fetch(), ensuring the API route + CORS middleware
          #    are both JIT-loaded before the real user request arrives.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" "$BACKEND_URL/" || echo timeout)
            echo "Warmup root attempt $i: HTTP $code"
            case "$code" in timeout|000) sleep 2 ;; *) break ;; esac
          done
          for path in /api/assignments/my /api/gamification/streak /api/stories; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              -X OPTIONS \
              -H "Origin: $FRONTEND_URL" \
              -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: authorization,content-type" \
              "${IAP_AUTH_ARGS[@]+${IAP_AUTH_ARGS[@]}}" \
              "${BACKEND_URL}${path}" || echo timeout)
            echo "Preflight $path: HTTP $code"
          done

      # ── PR 階段的「學生走得完」門（#2964 L3）────────────────────────────
      #
      # 在這之前，PR 階段**沒有任何一道門問「學生走得完嗎」**：
      # 十道 content gate 有九道在問「抽對了沒」，而 e2e 只打 staging。
      # Hans 回報的那幾類 bug（按完成標記跳到最後一步、三篇共用進度）
      # 只有真的一步一步走完才會遇到。
      #
      # ⚠️ e2e-tests.yml 裡寫著「per-PR preview 的 DB 是空的、demo 帳號不存在」——
      #    那句已經過時。preview 後端吃的是共用的 preview DB（#3999 起 DATABASE_URL
      #    從 Secret Manager 的 lingoleap-database-url-preview 取值，不再是
      #    GitHub Actions secret），而 preview 前端 build 時帶了
      #    VITE_SHOW_DEMO_LOGIN=true 與三個帳號。
      #    2026-08-28 在 PR #2965 的 preview 上實測：一鍵登入 → /library，pageerror 0。
      #
      # PR 只跑一課（五課走完整條路太慢，慢到會讓人想關掉這道門），
      # staging 維持五課全跑 —— 兩個環境跑不同的量，不是抽樣代替全檢。
      - name: Comment PR with preview URLs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const frontendUrl = '${{ steps.preview-urls.outputs.frontend_url }}';
            const backendUrl = '${{ steps.preview-urls.outputs.backend_url }}';

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment')
            );

            const body = `## Preview Deployment

            | Service | URL |
            |---------|-----|
            | Frontend | ${frontendUrl} |
            | Backend API | ${backendUrl} |
            | Commit | \`${context.sha.substring(0, 7)}\` |
            | Updated | ${new Date().toISOString()} |

            > PR preview environments are automatically deleted when the PR is closed.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

  e2e-preview-check:
    name: 學生走得完嗎（multi-text journey on preview）
    needs: deploy-preview
    runs-on: ubuntu-24.04  # 這個 job 會裝 Playwright，26.04 不支援
    if: >-
      always() &&
      needs.deploy-preview.outputs.frontend_url != 'N/A' &&
      needs.deploy-preview.outputs.frontend_url != '' &&
      needs.deploy-preview.outputs.backend_url != 'N/A' &&
      needs.deploy-preview.outputs.backend_url != ''
    # Reorder (coordinator decision, 2026-11-05): this job runs npm ci +
    # `npx playwright install --with-deps` -- untrusted, lockfile-resolved
    # third-party code -- directly on the bare runner. It used to be the
    # LAST step of `deploy-preview`, which ran `google-github-actions/
    # auth@v2` as one of its FIRST steps: every PR's dependency install ran
    # on a runner that had already held live GCP credentials for the
    # entire job. This job needs only the already-deployed preview's plain
    # HTTP URLs (from deploy-preview's job outputs).
    #
    # find_015p35fzCRJqG7UACGpxSxQp (HIGH): reordering + having no
    # `google-github-actions/auth` step in THIS job was not actually
    # enough on its own -- `id-token: write` is an ambient permission a
    # job either has or doesn't for its whole runtime, regardless of
    # whether anything in it calls `auth@v2`. This job declares its own
    # `permissions:` below (contents: read only) so it can never inherit
    # `id-token: write` from the workflow level. backend/specs/
    # test_workflow_gcp_cred_exposure_spec.py asserts this structurally
    # (effective permissions, not step order) for every job in this file
    # and deploy.yml/staging-deploy.yml.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 學生走得完嗎（multi-text journey on preview）
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          E2E_BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          E2E_ONLY_LESSONS: "20063"      # G6-L22，三篇，Hans 回報的那一課
          E2E_EXPECT_DEPLOYED: "1"
          # #3719 — IAP 準備：見「Warm backend」步驟的同一段說明。
          IAP_AUDIENCE: ${{ secrets.IAP_AUDIENCE }}
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npx playwright test tests/e2e/multiTextJourney.spec.ts \
            --reporter=github --timeout=300000

