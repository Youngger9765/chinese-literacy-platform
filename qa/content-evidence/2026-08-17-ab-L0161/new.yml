keypoints:
  label: 三、文章重點表
  intro: 〈江乙媽媽告御狀〉是發生在古代的司法案件，它剛好也可以用現代的法律用語（案由、告訴人主張、聲請）來整理文章重點。
  instruction: ※請配合課文內容完成下表。注意左欄有一個小空格也要填寫哦！
  columns: [故事結構, 內容摘要]
  column_note: 【】處填入原文，找不到原文時，再用自己的話寫。
  footnotes:
    - {no: 1, term: 案由, text: 案件的原由、案件發生的原因。}
    - {no: 2, term: 告訴人, text: 案件中提出控告的人。}
    - {no: 3, term: 聲請, text: 在法律程序中，以口頭或書面聲明事實及理由，向司法機關提出的請求。容易與「聲請」混淆的是「申請」。申請是對行政機關提出的請求，例如。向招生委員會提出入學申請。}
  rows:
    - 故事結構: 【　】/案由
      故事結構_blank: {answer: 起因}
      內容摘要: 【　】媽媽的布被偷了，於是她到王宮向王上告發【　】盜竊。
      blanks: [{answer: 江乙}, {answer: 令尹}]
    - 故事結構: 經過/告訴人主張
      內容摘要: |-
        主張一 令尹指使人偷她的布。
        1. 說明：從前令尹治理時，路【　】，門不關閉，而盜賊自息；現在的令尹治理後，盜賊【　】。
        2. 結論：盜賊猖狂，皆因令尹治理【　】，所以盜賊偷就等於是令尹偷。
        主張二 依判決先例，令尹應負本案連帶責任。
        1. 說明：從前江乙作為郢都的官員，因為王宮的失竊案，而受到【　】被免職；現在【　】擔任最高行政官員，人民(江母)的布被偷，令尹也應該連坐受罰。
        2. 結論：如果江乙有罪，那麼令尹也有罪。
        主張三 補充說明，強化觀點。
        1. 上面的官員不賢明，下面的【　】就不能治理好；宰相不賢能，那麼【　】就不安寧。
      blanks:
        - {answer: 不拾遺}
        - {answer: 公行/橫行}
        - {answer: 不善/不好}
        - {answer: 坐/連坐}
        - {answer: 令尹}
        - {answer: 人民}
        - {answer: 國家}
    - 故事結構: 結果/聲請
      內容摘要: 請王上明察這件事。

spotlight:
  label: 四、文言文聚光燈
  strategy_name: 指示代詞、疑問代詞
  strategy_type: classical_grammar
  blocks:
    - type: concept_box
      text: |-
        還記得代詞的意義嗎？
        代詞：具有代替或指示作用的語詞。
        它包括人稱代詞、指示代詞及疑問代詞。今天我們要繼續來認識文言文中的指示代詞及疑問代詞。
    - type: guide
      text: 一、文言文指示代詞
    - type: concept_box
      label: （一）作用
      text: |-
        用來「指特定的人、事、物」的詞。
        這些字就像「雷射筆」，你指哪裡，它們就幫你標記哪裡！
        例如：老師指著黑板說：「此題很重要！」──「此」就是標記「這一題」。
    - type: table
      label: （二）常見用字與現代的意思
      columns: [指示代詞, 作用, 現代意義, 例句]
      rows:
        - {指示代詞: 之、此、是、斯, 作用: 指「近的」, 現代意義: 這、這個、這裡、這樣, 例句: [學而時習之, 此物最相思]}
        - {指示代詞: 彼、其, 作用: 指「遠的」, 現代意義: 那、那個；那裏、那樣, 例句: [顧此失彼, 不厭其煩]}
        - {指示代詞: 或、某, 作用: 指「不特定」, 現代意義: 有人、有的、有時, 例句: [或曰, 某天]}
        - {指示代詞: 它、他, 作用: 指「其他的」, 現代意義: 別的、其他的, 例句: 假手他人}
    - type: exercise
      instruction: 判斷各題框框中語詞的意思，將適當的語詞代號填入空格中。
      option_bank: {A: 這/這樣, B: 那/那裡, C: 有人, D: 別的}
      example: {stem: 是與使人盜何以異也？, answer: A}
      items:
        - {index: 1, stem: 或以錢幣乞之。, answer: C, teacher_note: 有人就拿錢求他(作詩)。}
        - {index: 2, stem: 斯是陋室，惟吾德馨。, answer: A, teacher_note: 這是一間簡陋的房子，因為我的品德美好，使陋室的名聲像香氣一樣遠播。}
        - {index: 3, stem: 顧左右而言他。, answer: D, teacher_note: 看東看西，然後說些別的。比喻閃避主題而談論別的事。}
        - {index: 4, stem: 此起彼落。, answer: B, teacher_note: 這裡起來，那裡落下。形容連續不斷。}
    - type: guide
      text: 二、文言文疑問代詞
    - type: concept_box
      label: （一）作用
      text: |-
        用來「提問」的詞，就像我們現在用的「誰、什麼」。
        這些字就像「問題小幫手」，當你想問事情時，它們會跳出來幫忙！
        例如：你找不到鉛筆時會問：「誰看到我的鉛筆？」──「誰」就是疑問代詞。
    - type: table
      label: （二）常見的疑問代詞
      columns: [疑問代詞, 作用, 現代意義, 例句]
      rows:
        - {疑問代詞: 何=盍、曷, 作用: 問事物、原因, 現代意義: 什麼、為什麼, 例句: 何不讀書？}
        - {疑問代詞: 誰, 作用: 問人, 現代意義: 誰（和現在一樣）, 例句: 誰在笑？}
        - {疑問代詞: 孰, 作用: 問選擇, 現代意義: 誰、哪一個, 例句: 蘋果與橘，孰甜？}
    - type: exercise
      label: 輕練習
      instruction: 判斷各題框框中語詞的意思，將適當的語詞代號填入空格中。
      option_bank: {A: 什麼, B: 為什麼, C: 誰, D: 哪一個}
      example: {stem: 是與使人盜何以異也？, answer: A}
      items:
        - {index: 1, stem: 本是同根生，相煎何太急？, answer: B, teacher_note: 同根而生的豆莖與豆子(比喻兄弟)，逼迫為什麼這樣急切？}
        - {index: 2, stem: 不知何故？, answer: A, teacher_note: 不知道是什麼原因？}
        - {index: 3, stem: 責任與享受，孰輕孰重？, answer: D, teacher_note: 兩件事物相比，哪個不重要？哪個重要？}
        - {index: 4, stem: 卿面何以汗？, answer: B, teacher_note: 你的臉為什麼流汗(不止)？}
        - {index: 5, stem: 盍各言爾志？, answer: B, teacher_note: 為什麼不各自說說你們的志向？}
        - {index: 6, stem: 人非聖賢，孰能無過？, answer: C, teacher_note: 人不是聖人、賢人，誰能不犯錯？}
        - {index: 7, stem: 天地賦命，有生必終。自古聖賢，誰能獨免？, answer: C, teacher_note: 上天給生命，有出生就有死亡。自古以來的聖人、賢人，誰能獨自避免(死亡)？}
    - type: passage
      label: 故事導讀的答案
      classical: |-
        「王曰：『善。非徒譏令尹，又譏寡人。』命吏償母之布，因賜金十鎰。」
        「王曰：『母智若此，其子必不愚。』乃復召江乙而用之。」
      modern: 楚王聽完江乙媽媽的辯證後說：「你說得好！這不只批評了令尹，也批評了我。」然後命人補償江母損失的布，又賞她200兩黃金，並說：「媽媽這麼聰明，她的兒子必不笨。」於是就讓江乙重新回來做官了。

comprehension:
  label: 五、閱讀理解
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 下列選項「」文字中讀音與字義，何者錯誤？
      options:
        A: 若不盜而「誣」之──ㄨ，誣賴
        B: 請於王而「黜」之──ㄔㄨˋ，免職
        C: 「寇」盜在下──ㄎㄡˋ，土匪
        D: 百姓有過，在「予」一人──ㄩˊ，給。
      teacher_note: D字音正確，但字義是「我」。
    - index: 2
      answer: D
      stem: 下列哪一個成語的解釋錯誤？
      options:
        A: 顧此失彼──注意這個卻忽略了那個
        B: 若無其事──好像沒有那麼一回事
        C: 心不在焉──心思不在這裡
        D: 愛莫能助──最無私的愛就是能助人
      teacher_note: A指不能全面兼顧。B形容神態鎮定、自然。C形容不專心。D正確的解釋是「想幫忙卻沒有什麼能幫的」，意思是「無法幫忙」。
    - index: 3
      answer: B
      stem: 下列哪一選項中的「之」，代指的是江乙媽媽被偷的布？
      options:
        A: 令尹以罪乙，請於王而黜「之」
        B: 妾夜亡布八匹，令尹盜「之」
        C: 有盜王宮中「之」物者，妾子坐而黜
        D: 盜賊公行，是故使盜得盜妾「之」布。
      teacher_note: A代指江乙；C、D意思都是「的」。
    - index: 4
      answer: C
      tag: 歷
      stem: 根據本文，下列文句「」中的字義，何者說明最恰當？
      options:
        A: 妾夜「亡」布八匹：損壞
        B: 令尹「信」盜之：隨意
        C: 妾子「坐」而黜：受罰
        D: 王「其」察之：難道
      teacher_note: A「亡」，丟失；B「信」，確實；D「其」，表示期望的祈使語氣。
    - index: 5
      answer: D
      tag: 歷
      stem: 根據本文，下列關於令尹與楚王的敘述何者最恰當？
      options:
        A: 令尹打算偷盜布匹再將罪責嫁禍給他人
        B: 令尹主張楚國盜賊橫行是須正視的問題
        C: 楚王覺得宮中之物被盜應是令尹的責任
        D: 楚王認為不論身分地位都應該遵守法律
      teacher_note: 由「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法」可知。
    - index: 6
      answer: B
      tag: 歷
      stem: 根據本文，江母見楚王的目的最可能是下列何者？
      options:
        A: 想要替兒子江乙頂罪
        B: 想表達江乙被懲處的不公
        C: 向楚王告發郢大夫的罪行
        D: 要求楚王懲處失職的令尹

self_challenge:
  label: 六、自我挑戰
  teacher_note: （老師可視同學情況決定是否做此大題）
  instruction: 請閱讀以下文章，完成問題。提醒：記得運用文言文的閱讀策略哦！
  strategy_flow: [❶斷句, ❷找動詞/形容詞, ❸找/補主語, ❹用自己的話說一說]
  passage:
    classical: 子胥出逃，邊候¹得之。子胥曰：「上索我者，以我有美珠也。今我已亡之矣，我將謂子取而吞之。」候因釋之。
    source: (107 會考)
    annotations:
      - {no: 1, term: 邊候, text: 邊吏。}
    modern: 伍子胥要逃離國境，駐守邊境的官吏抓到他。伍子胥說：「國君派人抓我，是因為我有國君想要的美珠。但現在我已經丟失了美珠，(如果您把我送到國君那)，我會說是您把它搶走並私吞了。」駐守邊境的官吏因此釋放了伍子胥。
  items:
    label: （一）請依照故事脈絡，回答下列問題。
    questions:
      - {index: 1, stem: 根據斷句後的第一個分句，主語是誰？, answer: 子胥}
      - {index: 2, stem: 承上題，這個主語怎麼樣或做什麼？, answer: 他逃跑/他逃亡了}
      - {index: 3, stem: 這個分句還有另一個人物，他是誰？, answer: 邊候}
      - {index: 4, stem: 承上題，這個人怎麼樣或做什麼？(判斷代詞), answer: 他得到/抓到子胥}
      - {index: 5, stem: 根據第二個分句，子胥說：「上面的人要抓我」，理由是什麼？, answer: 因為他(子胥)有美珠}
      - {index: 6, stem: 子胥說：「今我已亡之矣」，意思是「我現在已經把美珠搞丟了」。根據子胥的說法，他把美珠搞丟的原因是什麼？, answer: 子(邊候)取而吞之/被邊候拿走私吞了}
  quiz:
    label: （二）閱讀理解測驗
    questions:
      - index: 1
        answer: A
        stem: 根據這段文字，下列敘述何者正確？
        options:
          A: 子胥用言語威脅邊候以求自保
          B: 子胥以美珠賄賂邊候換取自由
          C: 邊候侵吞子胥的美珠又誣陷他
          D: 邊候相信子胥的清白而釋放他
        teacher_note: 子胥說上面的人要抓他是因為他有美珠，但假如美珠不在自己身上而在邊候身上，那上面的人就該改抓邊候了。邊候擔心引火自焚，只好放了子胥。
