keypoints:
  title: 文章重點表
  intro: 本篇文章透過不同的事件來強調「面對失敗的不同可能」，請根據架構整理文章的重點。
  structure: nested
  columns: [主角, 事件, 面對失敗的想法]
  rows:
    - 主角: 小齊（1～3段）
      事件: |-
        1.九局下，兩出局，落後一分，輪到小齊站上【　】。
        2.小齊（①被投手三振 □②擊出安打），比賽結束。
        3.球隊（□①贏球 ②輸球）
      事件_blanks: [{answer: 打擊區}]
      事件_choices:
        - {options: [被投手三振, 擊出安打], answer: 1}
        - {options: [贏球, 輸球], answer: 2}
      面對失敗的想法: |-
        作者認為有的人──(複選)
        ①自責沒好好把握機會
        ②認為努力都白費了
        ③覺得自己不適合打棒球
      想法_multi_answer: [1, 2, 3]
    - 主角: 楊勇緯（第4段）
      事件: |-
        1.在雅加達亞運的【　】賽落敗，要面對曾經兩度【　】的勁敵。
        2.將過去比賽的【　】化為教訓，反覆演練，最後拿下勝利。
      事件_blanks: [{answer: 八強}, {answer: 敗北}, {answer: 挫折}]
      面對失敗的想法: |-
        1.失敗讓他【　】，也讓他發現自己的【　】
        2.從失敗中看見【　】的機會與【　】的可能。
      想法_blanks: [{answer: 不甘心}, {answer: 不足}, {answer: 成長}, {answer: 變強}]
    - 主角: 郭婞淳（第5段）
      事件: |-
        1.在仁川亞運比賽前被140多公斤的【　】壓傷
        2.仁川亞運時抓舉95公斤、挺舉124公斤，拿下第【　】名，沒有奪牌。
      事件_blanks: [{answer: 槓鈴}, {answer: 四}]
      面對失敗的想法: |-
        雖然成績不亮眼，但對她來說這是她走過【　】和【　】的（①勝利 □②失敗）
      想法_blanks: [{answer: 受傷}, {answer: 低潮}]
      想法_choices:
        - {options: [勝利, 失敗], answer: 1}
    - 主角: 總結
      事件: |-
        1.失敗可以讓人看見該【　】的地方──對應的是（①楊勇緯 □②郭婞淳）的故事
        2.有時候看似是失敗，但其實已經是重要的突破──對應的是（□①楊勇緯 ②郭婞淳）的故事
        3.我們（□①只有一種 ②有不只一種）的角度來面對失敗。
      事件_blanks: [{answer: 補強}]
      事件_choices:
        - {options: [楊勇緯, 郭婞淳], answer: 1}
        - {options: [楊勇緯, 郭婞淳], answer: 2}
        - {options: [只有一種, 有不只一種], answer: 2}

spotlight:
  strategy_name: 面對失敗，你的想法是……
  strategy_type: sel_character
  blocks:
    - type: concept_box
      text: 每一個人都會經歷挫折和失敗，而面對失敗時的「想法」，往往會決定我們能否找到下一步。面對失敗時，會有情緒很正常，但更重要的是，誘發我們情緒的「想法」是什麼？分辨哪些是已經「發生的事」，哪些是心裡的「想法」，並判斷：哪一種想法會讓自己停在原地，哪一種想法能幫助自己找到下一步。失敗不一定代表結束。當我們學會換一種方式理解失敗，就有機會把失落變成提醒，把挫折變成繼續前進的力量。
    - type: guide
      text: ◎從小齊的故事出發：先從小齊的故事來看看他可能的感受與想法，並進一步幫助他找出適合的下一步。
    - type: sub_block
      label: 1.覺察感受
      stem: 小齊被三振後，球隊輸了，你覺得此時他可能有哪些感受？請勾選。（可複選）
      options: {1: 難過, 2: 自責, 3: 不甘心, 4: 害怕被責怪, 5: 想逃避}
      student_filled: true          # 教師版未預填，由學生自選
      reflection: →失敗後有情緒是正常的。真正重要的不是「不能難過」，而是察覺自己難過之後，怎麼理解這件事，而且，想法會影響情緒。
    - type: sub_block
      label: 2.感受背後的事實與想法
      stem: 根據小齊的故事，哪些是事實？哪些是想法？
      items:
        - {index: 1, stem: 小齊在最後一球揮空，被三振, options: {1: 事實, 2: 想法}, answer: 1}
        - {index: 2, stem: 球隊最後輸掉比賽, options: {1: 事實, 2: 想法}, answer: 1}
        - {index: 3, stem: 小齊一定不適合打棒球, options: {1: 事實, 2: 想法}, answer: 2}
        - {index: 4, stem: 小齊這段時間的努力都白費了, options: {1: 事實, 2: 想法}, answer: 2}
        - {index: 5, stem: 小齊應該要加強判斷球路, options: {1: 事實, 2: 想法}, answer: 2}
        - index: 6
          stem: 同樣是「被三振」，下面哪一句比較像事實？
          options: {A: 小齊很沒用，害大家輸球, B: 小齊在關鍵時刻被三振, C: 小齊以後都不該再上場, D: 小齊的努力全部都白費了}
          answer: B
      reflection: →事實是已經發生的事；想法是我們對事情的解釋。失敗讓人痛苦，常常是因為我們腦中出現的想法。
    - type: sub_block
      label: 3.看見想法的影響
      items:
        - index: 1
          stem: 請閱讀小齊可能出現的四種想法，選出「最能幫助他繼續前進」的一句。
          options:
            A: 都是我害大家輸球，我真的很沒用。
            B: 我不適合打棒球，以後不要再上場。
            C: 我很難過，但這次提醒我要多練判斷球路。
            D: 反正只是運氣不好，不用再想這件事。
          answer: C
        - index: 2
          stem: 為什麼上題的答案比較有幫助？請勾選兩個原因。
          options:
            1: 它承認小齊會難過。
            2: 它把責任全部推給別人。
            3: 它指出可以練習的方向。
            4: 它假裝失敗完全不重要。
            5: 它沒有否定小齊整個人。
            6: 它認為小齊無法控制成敗。
          answer: [3, 5]
      reflection: →有些想法會讓我們卡住；有些想法會讓我們看見下一步。成長是從失敗中找出可以調整的地方。
    - type: sub_block
      label: 4.提出行動方案
      instruction: 請練習將下面的想法改寫成比較有行動力的說法。
      example:
        原本想法: 我數學就是不好，再讀也沒有用。
        改寫: 我不是數學不好，而是需要更多有效的練習方法。
      items:
        - index: 1
          stem: 小齊可能的想法──「我不適合打棒球。」
          value: 改寫──「我不是【　】，而是【　】還需要練習。」
          blanks: [{answer: 不適合打棒球}, {answer: 判斷球路}]
    - type: free_text
      label: ◎回到你的生活中，找一個你曾經覺得失敗或表現不好的事情，完成練習。
      items:
        - {index: 1, stem: 發生的事：}
        - {index: 2, stem: 當時的感受：, options: {1: 難過, 2: 生氣, 3: 自責, 4: 丟臉, 5: 其他}}
        - {index: 3, stem: 當時的想法讓我：, options: {1: 想逃避, 2: 更否定自己, 3: 想再試一次, 4: 找到可以調整的地方, 5: 其他}}
        - {index: 4, stem: 我可以用比較有力量的解釋：這次失敗提醒我【　】，所以我下一步可以【　】。}
      student_filled: true
      reflection: →有幫助的想法，是承認自己會難過，並從中找出一個可以前進的方向。

comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: A
      stem: 下列選項中「」的語詞，何者使用正確？
      options:
        A: 看到電影中令人心痛不捨的情節，他不禁「頻頻」拭淚
        B: 他們倆不愧是十年好友，搭檔做起事來十分有「契機」
        C: 垃圾車總是準時出現，讓我們可以「傾盡」一整天的垃圾
        D: 城市的霓虹燈十分「亮眼」，許多動物都無法好好休息
      teacher_note: (B)「契機」應換成「默契」(C)「傾盡」應換成「傾倒」(D)「亮眼」應換成「刺眼」
    - index: 2
      answer: D
      stem: 根據第二段，小齊在打擊時心裡想著「比賽千萬不能結束在我手上」，推論他當時的心情最接近下列何者？
      options:
        A: 他對投手感到憤怒，想立刻反擊
        B: 他覺得比賽無望，已經準備放棄
        C: 他充滿自信，認為一定可以安打
        D: 他承受壓力，害怕自己拖累球隊
      teacher_note: 從前後文可看出小齊很希望幫隊伍奪下勝利。
    - index: 3
      answer: B
      stem: 根據文章，作者先寫小齊三振失敗，再寫楊勇緯和郭婞淳的例子，主要是為了說明什麼？
      options:
        A: 運動員承受失敗的經驗比一般學生多
        B: 失敗不只代表結束，也可能帶來成長
        C: 比賽勝負通常取決於運動員的心理素質
        D: 只要練習夠久夠認真，一定能獲得勝利
      teacher_note: 楊勇緯和郭婞淳面對失敗都能找到不同的意義。
    - index: 4
      answer: C
      stem: 根據本文，下列何者最符合文章主旨？
      options:
        A: 運動比賽中，臨場發揮比平時努力重要
        B: 面對強大的對手時，應該避免正面競爭
        C: 失敗可以有不同意義，換個角度能繼續前進
        D: 沒有得到獎牌的選手，也應該受到大家肯定
      teacher_note: (C)呼應文章標題面對失敗不只有一種可能
    - index: 5
      answer: C
      stem: 如果你和家人吵架、溝通失敗，根據本課主旨，你可以怎麼做？
      options:
        A: 這次談話失敗，代表家人永遠不會理解我
        B: 只要假裝沒事，就不需要再面對這個問題
        C: 可以回想卡住原因，調整說法，再找機會溝通
        D: 應該堅持自己沒錯，等家人消氣後來找我道歉
      teacher_note: 本文強調「失敗」可以作為調整的提醒，(C)選項符合。

