spotlight:
  strategy_name: 寫作手法──用故事帶出觀點
  strategy_type: writing_technique
  blocks:
    - type: concept_box
      text: |-
        這篇文章先寫張曼娟和父親的故事，後面才說出作者對「認命」的看法。這種寫作方式，故事本身還不是作者觀點，讀者要繼續看作者怎麼解釋這個故事，才能知道作者真正想說的道理。讀這種文章，不能只看到故事情節，還要讀懂：
          ①作者先說了什麼故事？
          ②作者怎麼解釋這個故事？
          ③作者最後想讓我懂什麼？
        最後，還要看出：故事、作者的解釋和作者的觀點，是怎麼一步一步接起來的。這樣，才算真正讀懂故事和觀點之間的關係。
    - type: fill_table
      label: 任務一、找出文章結構，整理重點
      instruction: 請根據課文，填入文章結構對應的段落數，並完成重點整理。
