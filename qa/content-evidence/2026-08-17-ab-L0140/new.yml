body:
  paragraph_count: 22
  paragraphs:
    - {idx: 1, text: 作家張曼娟在一個短講中，提到她高齡、已經失能的父親(影片連結見QR code)。}
    - {idx: 2, text: 「不管我為他做了多少，他永遠也不會對我說謝謝。」她說：「他會對外籍看護說謝謝，他會對醫護人員說謝謝，他就是不對我說謝謝。所以全世界令他覺得最不滿意的人，就是這個對他付出最多的我嗎？原來是我啊。那個感覺是非常非常孤獨和痛苦的。」}
    - {idx: 3, text: 「所以我一直在奢求，在父親離開前我可以跟他達到一個和解。有一天，這個契機發生了。」}
    - {idx: 4, text: 張曼娟這一天買了飯，站在病床旁，給爸爸餵飯、喝湯、喝水，因為爸爸口腔及喉部的肌肉退化，醫生不讓用吸管，怕會嗆咳，所以她站了一個多小時，用湯匙一匙一匙餵。她自己也六十幾歲了，站到小腿腫脹，隱隱作痛。餵飯告一段落後，她問還要不要吃，老父搖搖頭，然後看著她，嘴裡說出：「ㄒㄧ…」。}
    - {idx: 5, text: 「我就很感動，我爸那時候中風，口齒不清…。」張曼娟覺得爸爸終於想要表達她從來沒聽過的謝謝。「爸爸終於感受到我對他的付出了！」她有些激動，又不自在。}
    - {idx: 6, text: 「爸，你不用說了，沒關係我都知道。」}
    - {idx: 7, text: 「ㄒㄧ…ㄒㄧ…。」}
    - {idx: 8, text: 「爸，真的真的，我是你女兒，為你做什麼都是應該的。」}
    - {idx: 9, text: 最後張爸爸用盡了全力把話說出來了：「吸管！」}
    - {idx: 10, text: 張曼娟呆了一下，那個盼了一輩子的「大和解」期待落空了，老爸只是想用吸管喝水，根本沒有說謝謝的意思。}
    - {idx: 11, text: 最有趣的是，張曼娟說，她知道是自己想太多，大笑起來，笑到全身發抖。}
    - {idx: 12, text: 故事結束。}
    - {idx: 13, text: 這個故事有三個大轉折。}
    - {idx: 14, text: 第一次轉折是，聽眾被引導去猜想那個感人的一幕──硬脾氣的老人終於要向付出最多的女兒說謝謝了。}
    - {idx: 15, text: 第二次轉折是，原來老人根本沒要說謝謝，只是要一根吸管。}
    - {idx: 16, text: 第三次轉折是，女兒在期待的大和解落空後，居然大笑起來。}
    - {idx: 17, text: 第三次轉折是最值得探究的。張曼娟對老爸抱著這麼高的期待，而幾乎不可能的父女和解似乎出現，這時她應該會感動到泫然欲泣吧。但幾秒之內，她的感動變成幻影，現實中的老爸才不來這一套。}
    - {idx: 18, text: 最耐人玩味的是，女兒從天堂跌落谷底了，她此時如果淚眼模糊、捏緊拳頭、心存怨懟，長年身心的辛苦折磨和委屈一一從心底浮現，是完全可以理解的。但她沒有，她哈哈大笑，笑到站不穩。}
    - {idx: 19, text: 作為聽故事的人，我一邊聽，一邊為父女間的愛怨糾葛感到提心吊膽，聽到張曼娟大笑後，我提的心吊的膽一下全放鬆下來，為她歡喜寬心。我覺得，對她來說，這可能是當下最好的選擇：不必在這無解的議題上再多耗心力了。但，到底張曼娟是怎麼做到的呢？我想到「認命」這個概念。}
    - {idx: 20, text: 認命不是把委屈吞下去，更不是咬牙摀著傷口說不痛；認命，是看清楚事情原本的樣子後，做出一個強者的決定。張曼娟看清楚了，老去的父親就是這樣，他不會忽然變得溫柔，他不會忽然開口道謝，有些門不會打開，有些和解永遠不會發生，她終於認命。}
    - {idx: 21, text: 可是，看清楚這一點以後，人仍然可以自由的選擇要怎麼活。弱者可能繼續怨、繼續含淚等待。張曼娟不然，她作了一個強者的決定，她大笑起來。她笑的不是父親，也不是自己的傻，而是那個苦苦等待奇蹟的自己，承認「太好笑，原來我又想多了」。那個笑，證明她已經強大到不想再讓這份痛繼續折磨自己。老天丟來一個刁鑽的壞球，既然無法打擊，就閃開吧，別傷了自己就好。這時，她不再是一個被動的受難者，她主動地選擇了自己的命運。}
    - {idx: 22, text: 結論是，「認命」不是弱者的吞忍，而是強者的轉身。強者不是從來不受傷，而是受傷之後，做出一個強者的決定，離開傷痛，轉向那條光明、更有希望的路。}
  inline_marked_terms: [奢求, 契機, 泫然欲泣, 耐人玩味, 心存怨懟, 愛怨糾葛, 提心吊膽, 刁鑽, 吞忍]

