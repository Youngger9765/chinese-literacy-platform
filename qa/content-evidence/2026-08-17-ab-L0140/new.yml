            2.有一天，父親說出「ㄒㄧ……」時，張曼娟以為父親終於要說【　】；沒想到父親最後說的是【　】。
            3.張曼娟期待的大和解【　】，但她最後竟然【　】。
          blanks: [{answer: 謝謝}, {answer: 和解}, {answer: 謝謝}, {answer: 吸管}, {answer: 落空}, {answer: 大笑}]
        - 文章結構: 作者詮釋故事
          起訖段落: 【　】～【　】
          起訖_blanks: [{answer: 13}, {answer: 19}]
          重點_title: 詮釋：作者開始解釋這個故事
          重點: |-
            1.作者說這個故事有三個大【　】。其中，最值得探究的是第【　】次轉折。
            2.第三次轉折特別重要，因為張曼娟期待落空後，沒有心存【　】，反而大笑。
            3.作者認為，張曼娟做了最好的決定，不必在這【　】的議題上再多耗心力了。
          blanks: [{answer: 轉折}, {answer: 三}, {answer: 怨懟}, {answer: 無解}]
        - 文章結構: 說出作者觀點
