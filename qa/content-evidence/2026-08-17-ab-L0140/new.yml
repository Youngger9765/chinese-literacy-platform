comprehension:
  instruction: 請根據文章內容，選出最適合的答案，要讀完每一個選項再作答。
  questions:
    - index: 1
      answer: D
      stem: 文中說張曼娟「盼了一輩子的『大和解』期待落空了」，這裡的「大和解」最接近什麼意思？
      options:
        A: 父親終於願意讓她用吸管餵水
        B: 父親終於同意由看護照顧自己
        C: 父親終於恢復健康並能清楚說話
        D: 父親終於理解她的付出並表達感謝
      teacher_note: 這裡的「大和解」不是普通的事情解決，而是張曼娟期待父親在生命最後階段能看見她的付出、給她情感上的回應。
    - index: 2
      answer: B
      stem: 張曼娟聽到「吸管」後大笑，最合理的理解是什麼？
      options:
        A: 她覺得父親說話太荒唐，所以忍不住笑他
        B: 她看清自己想太多，對父親的期待高到有點好笑了
        C: 她已經完全不在意父親，所以不再感到痛苦
        D: 她認為失能的父親很幽默，所以心情突然變好
      teacher_note: 張曼娟的大笑不是嘲笑父親也不是完全不在意父親，而是發現自己又把父親的話想成期待中的「謝謝」。這個笑先來自期待落空的落差也銜接後文作者對「認命」的解釋。
    - index: 3
      answer: C
      stem: 文中「ㄒㄧ……」到「吸管！」這個情節，主要有什麼作用？
      options:
        A: 說明中風病人說話困難，需要家人耐心傾聽
        B: 呈現照顧失能長者時，醫療規定造成的不方便
        C: 製造期待與落差，讓聽眾感受到她心底的失落
        D: 表現父親其實很幽默，能讓女兒在辛苦中發笑
      teacher_note: 前文鋪陳張曼娟期待父親說「謝謝」，所以當父親說出「ㄒㄧ……」時，張曼娟和讀者都會以為那是「謝謝」。最後是「吸管」，形成強烈落差，也讓讀者更能理解她期
    - index: 4
      answer: A
      stem: 下列哪一項最能概括本文主旨？
      options:
        A: 認命不是消極吞忍，而是看清現實後的轉身
        B: 照顧父母一定要忍耐，不能期待任何情感回報
        C: 子女應該努力讓父母改變，才算完成真正和解
        D: 面對家人不說謝謝時，最好的方法就是大笑帶過
      teacher_note: 作者藉張曼娟的故事說明：認命不是把委屈吞下去，而是看清現實後，不再讓自己被痛苦困住。
    - index: 5
      answer: B
      stem: 「認命」是強者的選項，作者為什麼把張曼娟稱為強者呢？
      options:
        A: 因為她能用笑聲掩飾自己的失望，不讓父親看見她的委屈
        B: 因為她在認清現實後，有強大的智慧作出不必為此受困的選擇
        C: 因為她終於明白父親只是口齒不清，所以不再誤會父親的意思
        D: 因為她長期照顧失能父親，即使得不到感謝，也繼續忍耐付
      teacher_note: 她期待落空，但沒有被動地當一個受難者，而是主動選擇不再讓痛苦折磨自己。她有主動權，自己決定自己的命運，所以作者把她稱為「強者」。

