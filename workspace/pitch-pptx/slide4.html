<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FDF8F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  background: #FDF8F0;
}
h2 {
  color: #5B4FC4;
  font-size: 22pt;
  font-weight: bold;
  text-align: center;
  margin: 28pt 0 16pt 0;
}
.row {
  display: flex;
  justify-content: center;
  width: 690pt;
  margin: 0 auto;
}
.card {
  width: 128pt;
  margin: 0 4pt;
  background: #ffffff;
  border-radius: 8pt;
  padding: 12pt 8pt;
  text-align: center;
  box-shadow: 0 1px 4px rgba(91,79,196,0.06);
}
.avatar {
  width: 44pt; height: 44pt;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 6pt auto;
}
.avatar img {
  width: 44pt; height: 44pt;
}
.name {
  font-size: 11pt;
  font-weight: bold;
  color: #1a1a2e;
  margin: 0 0 2pt 0;
}
.role {
  font-size: 8pt;
  color: #5B4FC4;
  font-weight: bold;
  margin: 0 0 4pt 0;
}
.bio {
  font-size: 7.5pt;
  color: #4a4a6a;
  margin: 0;
  line-height: 1.4;
}
</style>
</head>
<body>
<h2>我們的團隊</h2>
<div class="row">
  <div class="card">
    <div class="avatar"><img src="fang.jpg"></div>
    <p class="name">方新舟</p>
    <p class="role">產品負責人</p>
    <p class="bio">誠致教育基金會創辦人</p>
    <p class="bio">「學國語」原始開發者</p>
  </div>
  <div class="card">
    <div class="avatar"><img src="kw.jpg"></div>
    <p class="name">呂冠緯</p>
    <p class="role">顧問</p>
    <p class="bio">均一平台教育基金會</p>
    <p class="bio">董事長暨執行長</p>
  </div>
  <div class="card">
    <div class="avatar"><img src="young.jpg"></div>
    <p class="name">Young</p>
    <p class="role">技術負責人</p>
    <p class="bio">均一教育平台工程師</p>
    <p class="bio">技術架構與 AI 整合</p>
  </div>
  <div class="card">
    <div class="avatar"><img src="raymond.jpg"></div>
    <p class="name">靖杭</p>
    <p class="role">開發實習生</p>
    <p class="bio">高中生</p>
  </div>
  <div class="card">
    <div class="avatar"><img src="xiung.jpg"></div>
    <p class="name">啟翔</p>
    <p class="role">開發實習生</p>
    <p class="bio">高中生</p>
  </div>
</div>
</body>
</html>
