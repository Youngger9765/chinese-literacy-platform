<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FDF8F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #FDF8F0;
}
.left {
  width: 220pt;
  margin: 16pt 0 16pt 20pt;
  display: flex; flex-direction: column;
}
h2 {
  color: #5B4FC4;
  font-size: 18pt;
  font-weight: bold;
  margin: 0 0 10pt 0;
  line-height: 1.4;
}
.lib-img {
  width: 196pt; height: 110pt;
  border-radius: 6pt;
  border: 1px solid #ece5d8;
}
.lib-img img { width: 196pt; height: 110pt; border-radius: 6pt; }
.lib-caption {
  font-size: 9pt; color: #8888a8; margin: 4pt 0 0 0;
}
.stats {
  margin: 12pt 0 0 0;
  display: flex; flex-direction: column;
}
.stat-item {
  font-size: 10pt; color: #1a1a2e; margin: 3pt 0;
}
.stat-num { color: #5B4FC4; font-size: 14pt; font-weight: bold; }
.right {
  margin: 16pt 20pt 16pt 12pt;
  display: flex; flex-wrap: wrap;
  width: 436pt;
}
.card {
  width: 206pt;
  margin: 0 4pt 5pt 4pt;
  background: #ffffff;
  border-radius: 6pt;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(91,79,196,0.08);
}
.card img { width: 206pt; height: 75pt; }
.card-label {
  margin: 4pt 8pt 6pt 8pt;
}
.card-title {
  font-size: 10pt; font-weight: bold; color: #5B4FC4;
  margin: 0;
}
.card-tag {
  margin: 3pt 0 0 0;
  display: flex;
}
.tag {
  background: #F0EEFA;
  border-radius: 8pt;
  padding: 1pt 8pt;
}
.tag p {
  font-size: 7.5pt; color: #5B4FC4; font-weight: bold; margin: 0;
}
</style>
</head>
<body>
<div class="left">
  <h2>閱讀科學 + AI<br>= 數位中文閱讀家教</h2>
  <div class="lib-img"><img src="ss-library.png"></div>
  <p class="lib-caption">57 篇課文，依年級與難度分類</p>
  <div class="stats">
    <p class="stat-item"><span class="stat-num">10</span> 步學習流程</p>
    <p class="stat-item"><span class="stat-num">6</span> 大教學理論整合</p>
  </div>
</div>
<div class="right">
  <div class="card">
    <img src="ss-annotation.png">
    <div class="card-label">
      <p class="card-title">閱讀標記與筆記</p>
      <div class="card-tag"><div class="tag"><p>先行組織者</p></div></div>
    </div>
  </div>
  <div class="card">
    <img src="ss-tutor.png">
    <div class="card-label">
      <p class="card-title">AI 即時朗讀指導</p>
      <div class="card-tag"><div class="tag"><p>流暢朗讀 · 識字自動化</p></div></div>
    </div>
  </div>
  <div class="card">
    <img src="ss-comprehension.png">
    <div class="card-label">
      <p class="card-title">蘇格拉底式 AI 對話</p>
      <div class="card-tag"><div class="tag"><p>鷹架理論 · 背景知識</p></div></div>
    </div>
  </div>
  <div class="card">
    <img src="ss-wordsearch.png">
    <div class="card-label">
      <p class="card-title">語詞搜尋遊戲</p>
      <div class="card-tag"><div class="tag"><p>針對性練習</p></div></div>
    </div>
  </div>
  <div class="card">
    <img src="ss-stroke.png">
    <div class="card-label">
      <p class="card-title">筆順手寫練習</p>
      <div class="card-tag"><div class="tag"><p>部件教學法</p></div></div>
    </div>
  </div>
  <div class="card">
    <img src="ss-knowledge.png">
    <div class="card-label">
      <p class="card-title">知識補給站</p>
      <div class="card-tag"><div class="tag"><p>背景知識建構</p></div></div>
    </div>
  </div>
</div>
</body>
</html>
