<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  background: #ffffff;
}
h2 {
  color: #5B4FC4;
  font-size: 26pt;
  font-weight: bold;
  text-align: center;
  margin: 36pt 0 24pt 0;
}
.columns {
  display: flex;
  width: 620pt;
  margin: 0 auto;
}
.col {
  width: 290pt;
  margin: 0 10pt;
}
.col-title-wrap {
  margin: 0 0 10pt 0;
  border-bottom: 3px solid #F0EEFA;
  padding: 0 0 8pt 0;
}
.col-title {
  font-size: 14pt;
  font-weight: bold;
  color: #1a1a2e;
  margin: 0;
}
.item {
  display: flex;
  margin: 0 0 6pt 0;
  align-items: flex-start;
}
.icon-done {
  width: 20pt; height: 20pt;
  background: #d1fae5;
  border-radius: 50%;
  margin: 2pt 8pt 0 0;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-done img { width: 10pt; height: 10pt; }
.icon-need {
  width: 20pt; height: 20pt;
  background: #F0EEFA;
  border-radius: 50%;
  margin: 2pt 8pt 0 0;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-need img { width: 10pt; height: 10pt; }
.item-text {
  font-size: 11pt;
  color: #4a4a6a;
  margin: 2pt 0 0 0;
  line-height: 1.5;
}
.cta {
  margin: 20pt 50pt 0 50pt;
  background: #EDEAF8;
  border-radius: 12pt;
  padding: 20pt 36pt;
}
.cta-text {
  font-size: 16pt;
  font-weight: bold;
  color: #4A3FA6;
  text-align: center;
  margin: 0;
  line-height: 1.7;
}
</style>
</head>
<body>
<h2>我們需要您的指導</h2>
<div class="columns">
  <div class="col">
    <div class="col-title-wrap"><p class="col-title">我們走到了這裡</p></div>
    <div class="item">
      <div class="icon-done"><img src="icon-check.png"></div>
      <p class="item-text">平台已開發完成並上線運作</p>
    </div>
    <div class="item">
      <div class="icon-done"><img src="icon-check.png"></div>
      <p class="item-text">融合閱讀科學理論與 AI 技術</p>
    </div>
    <div class="item">
      <div class="icon-done"><img src="icon-check.png"></div>
      <p class="item-text">涵蓋朗讀、識字、理解完整流程</p>
    </div>
    <div class="item">
      <div class="icon-done"><img src="icon-check.png"></div>
      <p class="item-text">教師端班級管理與學習追蹤</p>
    </div>
  </div>
  <div class="col">
    <div class="col-title-wrap"><p class="col-title">希望得到的指導</p></div>
    <div class="item">
      <div class="icon-need"><img src="icon-question.png"></div>
      <p class="item-text">教學設計是否貼近現場需求？</p>
    </div>
    <div class="item">
      <div class="icon-need"><img src="icon-question.png"></div>
      <p class="item-text">如何在真實教室中試用驗證？</p>
    </div>
    <div class="item">
      <div class="icon-need"><img src="icon-question.png"></div>
      <p class="item-text">閱讀科學的應用方向是否正確？</p>
    </div>
    <div class="item">
      <div class="icon-need"><img src="icon-question.png"></div>
      <p class="item-text">哪些功能最能幫到老師和學生？</p>
    </div>
  </div>
</div>
<div class="cta">
  <p class="cta-text">懇請各位老師給予指導<br>讓這個工具真正幫到孩子</p>
</div>
</body>
</html>
