<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1a1a2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  background-image: url('hero-bg.png');
  background-size: cover;
  position: relative;
}
.glow {
  position: absolute; top: 0pt; right: 0pt;
  width: 180pt; height: 180pt;
}
.glow img { width: 180pt; height: 180pt; }
.content {
  margin: 0 auto;
  width: 580pt;
  display: flex; flex-direction: column; align-items: center;
}
h1 {
  color: #ffffff;
  font-size: 30pt;
  font-weight: bold;
  text-align: center;
  line-height: 1.4;
  margin: 0 0 6pt 0;
}
.gold { color: #FFB74D; }
.foundation {
  color: rgba(255,255,255,0.55);
  font-size: 11pt;
  text-align: center;
  margin: 14pt 0 0 0;
}
.equation {
  color: #FFB74D;
  font-size: 17pt;
  font-weight: bold;
  text-align: center;
  margin: 14pt 0 0 0;
}
.vision-box {
  margin: 20pt 40pt 0 40pt;
  background: rgba(91,79,196,0.25);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10pt;
  border-left: 4px solid #FFB74D;
  padding: 16pt 24pt;
}
.vision-main {
  color: #ffffff;
  font-size: 15pt;
  font-weight: bold;
  text-align: center;
  margin: 0;
  line-height: 1.5;
}
.vision-sub {
  color: rgba(255,255,255,0.6);
  font-size: 10pt;
  text-align: center;
  margin: 6pt 0 0 0;
}
</style>
</head>
<body>
<div class="glow"><img src="glow-purple.png"></div>
<div class="content">
  <h1>每個孩子都值得一位<br><span class="gold">有耐心的閱讀老師</span></h1>
  <p class="foundation">站在柯華葳教授 PIRLS、曾世杰教授《有效讀寫》的基礎上</p>
  <p class="equation">閱讀能力 = 識字解碼 × 背景知識</p>
  <div class="vision-box">
    <p class="vision-main">我們用 AI 做每個孩子身邊「溫暖而堅定」的閱讀家教</p>
    <p class="vision-sub">不管在台東、花蓮還是台北，每個孩子都有一位不會離開的閱讀家教</p>
  </div>
</div>
</body>
</html>
