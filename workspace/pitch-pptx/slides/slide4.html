<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FDF8F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  background: #FDF8F0; color: #1a1a2e;
}
.wrap {
  margin: 20pt 40pt;
  width: 640pt;
  text-align: center;
}
h2 {
  font-size: 22pt; font-weight: 700; color: #5B4FC4;
  text-align: center; margin: 0 0 24pt 0;
}
.row1 {
  display: flex; justify-content: center; gap: 16pt;
  margin: 0 0 16pt 0;
}
.row2 {
  display: flex; justify-content: center; gap: 16pt;
}
.team-card {
  width: 180pt; background: white; border-radius: 10pt;
  padding: 16pt 12pt 14pt;
  box-shadow: 0 2px 6px rgba(91,79,196,0.06);
  text-align: center;
}
.avatar-wrap {
  margin: 0 auto 10pt;
}
.name {
  font-size: 12pt; font-weight: 700; color: #1a1a2e;
  margin: 0 0 2pt 0;
}
.role {
  font-size: 8.5pt; font-weight: 600; color: #5B4FC4;
  margin: 0 0 6pt 0;
}
.bio {
  font-size: 8pt; color: #4a4a6a; line-height: 1.5;
  margin: 0;
}
</style>
</head>
<body>
<div class="wrap">
  <h2>我們的團隊</h2>
  <div class="row1">
    <div class="team-card">
      <div class="avatar-wrap">
        <img src="fang-circle.png" style="width: 64pt; height: 64pt; border-radius: 50%;">
      </div>
      <p class="name">方新舟</p>
      <p class="role">產品負責人</p>
      <p class="bio">誠致教育基金會創辦人<br>「學國語」原始開發者</p>
    </div>
    <div class="team-card">
      <div class="avatar-wrap">
        <img src="kw-circle.png" style="width: 64pt; height: 64pt; border-radius: 50%;">
      </div>
      <p class="name">呂冠緯</p>
      <p class="role">顧問</p>
      <p class="bio">均一平台教育基金會<br>董事長暨執行長</p>
    </div>
    <div class="team-card">
      <div class="avatar-wrap">
        <img src="young-circle.png" style="width: 64pt; height: 64pt; border-radius: 50%;">
      </div>
      <p class="name">Young</p>
      <p class="role">技術負責人</p>
      <p class="bio">均一教育平台工程師<br>負責技術架構與 AI 整合</p>
    </div>
  </div>
  <div class="row2">
    <div class="team-card">
      <div class="avatar-wrap">
        <img src="raymond-circle.png" style="width: 64pt; height: 64pt; border-radius: 50%;">
      </div>
      <p class="name">靖杭</p>
      <p class="role">開發實習生</p>
      <p class="bio">高中生</p>
    </div>
    <div class="team-card">
      <div class="avatar-wrap">
        <img src="xiung-circle.png" style="width: 64pt; height: 64pt; border-radius: 50%;">
      </div>
      <p class="name">啟翔</p>
      <p class="role">開發實習生</p>
      <p class="bio">高中生</p>
    </div>
  </div>
</div>
</body>
</html>
