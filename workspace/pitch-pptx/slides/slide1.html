<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1a1a2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  color: white;
  background-image: url('bg-hero.png');
  background-size: cover;
}
.wrap {
  margin: 30pt 60pt;
  text-align: center;
}
h1 {
  font-size: 28pt; font-weight: 800; color: white;
  line-height: 1.4; letter-spacing: 0.5pt;
  margin: 0 0 6pt 0;
}
.gold-img {
  margin: 0 auto 4pt;
}
.foundation {
  font-size: 11pt; color: rgba(255,255,255,0.6);
  margin: 16pt 0 0 0; line-height: 1.6;
}
.equation {
  font-size: 16pt; font-weight: 700; color: #FFB74D;
  margin: 14pt 0 20pt 0; letter-spacing: 0.5pt;
}
.vision-box {
  background: #36305e;
  border-radius: 10pt;
  border: 1px solid #4a4470;
  padding: 16pt 24pt;
}
.vision-main {
  font-size: 14pt; font-weight: 700; color: white;
  line-height: 1.6; margin: 0;
}
.vision-sub {
  font-size: 10pt; font-weight: 400; color: rgba(255,255,255,0.65);
  margin: 6pt 0 0 0;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>每個孩子都值得一位</h1>
  <img class="gold-img" src="gold-text.png" style="width: 420pt; height: 38pt;">
  <p class="foundation">站在柯華葳教授 PIRLS、曾世杰教授《有效讀寫》的基礎上</p>
  <p class="equation">閱讀能力 = 識字解碼 × 背景知識</p>
  <div class="vision-box">
    <p class="vision-main">我們用 AI 做每個孩子身邊「溫暖而堅定」的閱讀家教</p>
    <p class="vision-sub">不管在台東、花蓮還是台北，每個孩子都有一位不會離開的閱讀家教</p>
  </div>
</div>
</body>
</html>
