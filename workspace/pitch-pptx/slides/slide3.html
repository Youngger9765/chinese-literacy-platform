<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  background: #ffffff; color: #1a1a2e;
}
.wrap {
  margin: 20pt 40pt;
  width: 640pt;
}
h2 {
  font-size: 26pt; font-weight: 800; color: #5B4FC4;
  text-align: center; margin: 0 0 28pt 0;
}
.columns {
  display: flex; gap: 36pt; margin: 0 0 24pt 0;
}
.col {
  flex: 1;
}
.col-header {
  border-bottom: 3pt solid #F0EEFA;
  padding-bottom: 8pt;
  margin: 0 0 12pt 0;
}
.col-header h3 {
  font-size: 13pt; font-weight: 700; color: #1a1a2e;
  margin: 0;
}
.item {
  display: flex; align-items: flex-start; gap: 10pt;
  margin: 0 0 8pt 0;
}
.icon-done {
  width: 22pt; height: 22pt; border-radius: 50%;
  background: #d1fae5;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-done p {
  font-size: 10pt; font-weight: 700; color: #065f46; margin: 0;
}
.icon-need {
  width: 22pt; height: 22pt; border-radius: 50%;
  background: #F0EEFA;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-need p {
  font-size: 10pt; font-weight: 700; color: #5B4FC4; margin: 0;
}
.item-text {
  font-size: 10pt; color: #4a4a6a; line-height: 1.5;
  margin: 2pt 0 0 0;
}
.cta-box {
  background: #EDE9F8;
  border-radius: 12pt;
  padding: 22pt 32pt;
  text-align: center;
}
.cta-text {
  font-size: 14pt; font-weight: 700; color: #4A3FA6;
  line-height: 1.7; margin: 0;
}
</style>
</head>
<body>
<div class="wrap">
  <h2>我們需要您的指導</h2>
  <div class="columns">

    <div class="col">
      <div class="col-header"><h3>我們走到了這裡</h3></div>
      <div class="item">
        <div class="icon-done"><p>✓</p></div>
        <p class="item-text">平台已開發完成並上線運作</p>
      </div>
      <div class="item">
        <div class="icon-done"><p>✓</p></div>
        <p class="item-text">融合閱讀科學理論與 AI 技術</p>
      </div>
      <div class="item">
        <div class="icon-done"><p>✓</p></div>
        <p class="item-text">涵蓋朗讀、識字、理解完整流程</p>
      </div>
      <div class="item">
        <div class="icon-done"><p>✓</p></div>
        <p class="item-text">教師端班級管理與學習追蹤</p>
      </div>
    </div>

    <div class="col">
      <div class="col-header"><h3>希望得到的指導</h3></div>
      <div class="item">
        <div class="icon-need"><p>?</p></div>
        <p class="item-text">教學設計是否貼近現場需求？</p>
      </div>
      <div class="item">
        <div class="icon-need"><p>?</p></div>
        <p class="item-text">如何在真實教室中試用驗證？</p>
      </div>
      <div class="item">
        <div class="icon-need"><p>?</p></div>
        <p class="item-text">閱讀科學的應用方向是否正確？</p>
      </div>
      <div class="item">
        <div class="icon-need"><p>?</p></div>
        <p class="item-text">哪些功能最能幫到老師和學生？</p>
      </div>
    </div>

  </div>
  <div class="cta-box">
    <p class="cta-text">懇請各位老師給予指導<br>讓這個工具真正幫到孩子</p>
  </div>
</div>
</body>
</html>
